name: Codex FA primary4016 prefix reproducer and direct funnel

on:
  push:
    branches:
      - codex/fa-primary4016-reproducer-20260816
    paths:
      - .github/workflows/codex-fa-primary4016-reproducer.yml
      - scripts/fa_primary4016_reproducer.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: codex-fa-primary4016-reproducer
  cancel-in-progress: true

jobs:
  prefix-reproducer-funnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT: build-logs/fa-primary4016-reproducer
      SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      EXPECTED_BASE_SHA256: 1c3d12594a3e8b14f9cf7b7294da7c29221758c72d00a596215198f7623fad8c
      EXPECTED_BRANCH: codex/fa-primary4016-reproducer-20260816
      ARTIFACT_DIR: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact exploration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-primary4016-reproducer-20260816
          fetch-depth: 1
          persist-credentials: true

      - name: Lock exact global-best source and generate reproducer
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          mkdir -p "$OUT"
          actual="$(sha256sum "$SOURCE" | awk '{print $1}')"
          printf '%s\n' "$actual" | tee "$OUT/base-source.sha256"
          test "$actual" = "$EXPECTED_BASE_SHA256"
          python3 scripts/fa_primary4016_reproducer.py > "$OUT/REPRODUCER_MANIFEST.json"
          python3 -m json.tool "$OUT/REPRODUCER_MANIFEST.json" >/dev/null
          cp scripts/fa_primary4016_reproducer.py "$OUT/"

      - name: Install pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.0-rc1"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Direct-compile Mock2 and Mock2_Advanced prerequisites
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          compile_one() {
            local module="$1"
            local src="PrimalitySheafVerification/${module}.lean"
            local log="$OUT/${module}.log"
            local cmd="lake env lean -DmaxErrors=1 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${module}.command"
            set +e
            /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
              bash -lc "$cmd" > "$log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/${module}.exit"
            return "$rc"
          }
          compile_one Mock2
          compile_one Mock2_Advanced

      - name: Compile smallest valid prefix through the disputed predecessor
        id: prefix
        run: |
          set -euo pipefail
          module=FA_Blocker_Prefix
          src="PrimalitySheafVerification/${module}.lean"
          cmd="lake env lean -DmaxErrors=200 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
          printf '%s\n' "$cmd" > "$OUT/${module}.command"
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
            bash -lc "$cmd" > "$OUT/${module}.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" | tee "$OUT/${module}.exit"
          grep -n ': error:' "$OUT/${module}.log" > "$OUT/${module}.error-headers.txt" || true
          printf 'prefix_exit=%s\n' "$rc" >> "$GITHUB_OUTPUT"

      - name: Compile twelve structurally distinct suffix candidates
        if: steps.prefix.outputs.prefix_exit == '0'
        id: candidates
        run: |
          set -euo pipefail
          printf 'candidate_id,exit_code,error_headers,elapsed_seconds,source_sha256\n' > "$OUT/candidate-summary.csv"
          for src in PrimalitySheafVerification/FA_Blocker_Candidates/Candidate*.lean; do
            base="$(basename "$src" .lean)"
            cid="${base#Candidate}"
            outdir="${ARTIFACT_DIR}/FA_Blocker_Candidates"
            mkdir -p "$outdir"
            cmd="lake env lean -DmaxErrors=50 -DwarningAsError=false -o ${outdir}/${base}.olean -i ${outdir}/${base}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${base}.command"
            start="$(date +%s)"
            set +e
            timeout 420 bash -lc "$cmd" > "$OUT/${base}.log" 2>&1
            rc=$?
            set -e
            end="$(date +%s)"
            errors="$(grep -c ': error:' "$OUT/${base}.log" || true)"
            digest="$(sha256sum "$src" | awk '{print $1}')"
            printf '%s\n' "$rc" > "$OUT/${base}.exit"
            grep -n ': error:' "$OUT/${base}.log" > "$OUT/${base}.error-headers.txt" || true
            printf '%s,%s,%s,%s,%s\n' "$cid" "$rc" "$errors" "$((end-start))" "$digest" \
              >> "$OUT/candidate-summary.csv"
          done
          pass_ids="$(awk -F, 'NR>1 && $2==0 {print $1}' "$OUT/candidate-summary.csv" | paste -sd, -)"
          printf '%s\n' "$pass_ids" | tee "$OUT/local-pass-ids.txt"
          first_pass="${pass_ids%%,*}"
          if [[ -n "$first_pass" ]]; then
            printf 'first_pass=%s\n' "$first_pass" >> "$GITHUB_OUTPUT"
            printf 'any_pass=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'first_pass=\n' >> "$GITHUB_OUTPUT"
            printf 'any_pass=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Materialize strongest local winner into the full exact source
        if: steps.candidates.outputs.any_pass == 'true'
        run: |
          set -euo pipefail
          cid="${{ steps.candidates.outputs.first_pass }}"
          candidate="$OUT/Mock2_FunctionalAnalysis-candidate-${cid}.lean"
          python3 scripts/fa_primary4016_reproducer.py \
            --materialize "$cid" --output "$candidate" \
            | tee "$OUT/FULL_MATERIALIZATION.json"
          cp "$candidate" "$SOURCE"
          sha256sum "$SOURCE" | tee "$OUT/full-candidate.sha256"
          printf '%s\n' "$cid" > "$OUT/selected-candidate-id.txt"

      - name: Authoritative full direct FA compile for the local winner
        if: steps.candidates.outputs.any_pass == 'true'
        id: full
        run: |
          set -euo pipefail
          rm -f "${ARTIFACT_DIR}/Mock2_FunctionalAnalysis.olean" \
            "${ARTIFACT_DIR}/Mock2_FunctionalAnalysis.ilean" \
            "${ARTIFACT_DIR}/Mock2_FunctionalAnalysis.olean.private"
          cmd="lake env lean -DmaxErrors=2000 -DwarningAsError=false -o ${ARTIFACT_DIR}/Mock2_FunctionalAnalysis.olean -i ${ARTIFACT_DIR}/Mock2_FunctionalAnalysis.ilean ${SOURCE}"
          printf '%s\n' "$cmd" > "$OUT/Mock2_FunctionalAnalysis.command"
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/Mock2_FunctionalAnalysis.time" \
            bash -lc "$cmd" > "$OUT/Mock2_FunctionalAnalysis.log" 2>&1
          rc=$?
          set -e
          errors="$(grep -c ': error:' "$OUT/Mock2_FunctionalAnalysis.log" || true)"
          printf '%s\n' "$rc" | tee "$OUT/Mock2_FunctionalAnalysis.exit"
          printf '%s\n' "$errors" | tee "$OUT/Mock2_FunctionalAnalysis.error-count"
          grep -n ': error:' "$OUT/Mock2_FunctionalAnalysis.log" \
            > "$OUT/Mock2_FunctionalAnalysis.error-headers.txt" || true
          cp "$SOURCE" "$OUT/Mock2_FunctionalAnalysis-full-tested.lean"
          printf 'fa_exit=%s\n' "$rc" >> "$GITHUB_OUTPUT"
          printf 'error_count=%s\n' "$errors" >> "$GITHUB_OUTPUT"
          if [[ "$rc" == 0 || "$errors" -lt 4 ]]; then
            printf 'strict_improvement=true\n' >> "$GITHUB_OUTPUT"
          else
            printf 'strict_improvement=false\n' >> "$GITHUB_OUTPUT"
          fi

      - name: Preserve any strict verified improvement on the exploration branch
        if: steps.full.outputs.strict_improvement == 'true'
        run: |
          set -euo pipefail
          cid="$(cat "$OUT/selected-candidate-id.txt")"
          errors="$(cat "$OUT/Mock2_FunctionalAnalysis.error-count")"
          fa_exit="$(cat "$OUT/Mock2_FunctionalAnalysis.exit")"
          source_sha="$(sha256sum "$SOURCE" | awk '{print $1}')"
          source_blob="$(git hash-object "$SOURCE")"
          mkdir -p evidence/fa-global-best
          manifest="evidence/fa-global-best/FA_VERIFIED_IMPROVEMENT_${source_sha:0:12}.json"
          cat > "$manifest" <<EOF
          {
            "schema": "fa-verified-improvement-v1",
            "parent_global_best_sha256": "${EXPECTED_BASE_SHA256}",
            "candidate_id": "${cid}",
            "source_sha256": "${source_sha}",
            "git_blob_sha": "${source_blob}",
            "Mock2_exit": $(cat "$OUT/Mock2.exit"),
            "Mock2_Advanced_exit": $(cat "$OUT/Mock2_Advanced.exit"),
            "Mock2_FunctionalAnalysis_exit": ${fa_exit},
            "error_headers": ${errors},
            "workflow_run_id": ${GITHUB_RUN_ID},
            "canonical": false
          }
          EOF
          python3 -m json.tool "$manifest" >/dev/null
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$SOURCE" "$manifest"
          git commit -m "Codex: preserve VERIFIED FA candidate ${cid} with ${errors} errors"
          git push origin HEAD:codex/fa-primary4016-reproducer-20260816

      - name: Upload complete reproducer and direct-Lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-primary4016-reproducer-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build-logs/fa-primary4016-reproducer/**
            PrimalitySheafVerification/FA_Blocker_Prefix.lean
            PrimalitySheafVerification/FA_Blocker_Candidates/*.lean
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless the funnel produced a strict direct improvement
        if: always()
        run: |
          set -euo pipefail
          test -f "$OUT/Mock2.exit"
          test "$(cat "$OUT/Mock2.exit")" = 0
          test "$(cat "$OUT/Mock2_Advanced.exit")" = 0
          test -f "$OUT/FA_Blocker_Prefix.exit"
          test "$(cat "$OUT/FA_Blocker_Prefix.exit")" = 0
          test -s "$OUT/local-pass-ids.txt"
          test -f "$OUT/Mock2_FunctionalAnalysis.exit"
          errors="$(cat "$OUT/Mock2_FunctionalAnalysis.error-count")"
          fa="$(cat "$OUT/Mock2_FunctionalAnalysis.exit")"
          if [[ "$fa" == 0 || "$errors" -lt 4 ]]; then
            exit 0
          fi
          exit 1
