name: PrimalitySheafVerification CI

on:
  push:
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/primality_sheaf_ci.sh'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/primality-sheaf-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/primality_sheaf_ci.sh'
      - 'lean-toolchain'
      - 'lake-manifest.json'
      - 'lakefile.lean'
      - '.github/workflows/primality-sheaf-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primality-sheaf-ci-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  clean-build-audit:
    name: 13 modules, BuildAll, clean rebuild, and trust audit
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      PRIMALITY_SHEAF_LOGDIR: /tmp/primality-sheaf-ci

    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Lint workflows and enforce SHA-pinned actions
        shell: bash
        run: |
          set -euo pipefail
          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          mapfile -d '' workflow_files < <(
            find .github/workflows -maxdepth 1 -type f \
              \( -name '*.yml' -o -name '*.yaml' \) -print0 | sort -z
          )
          test "${#workflow_files[@]}" -gt 0
          "$(go env GOPATH)/bin/actionlint" "${workflow_files[@]}"
          python3 - <<'PY'
          from pathlib import Path
          import re

          bad=[]
          for path in sorted(Path('.github/workflows').glob('*')):
              if path.suffix not in {'.yml','.yaml'}:
                  continue
              text=path.read_text(encoding='utf-8')
              for line_no,line in enumerate(text.splitlines(),1):
                  match=re.match(r'^\s*uses:\s*([^\s#]+)',line)
                  if not match:
                      continue
                  value=match.group(1).strip()
                  value=value.strip('"')
                  value=value.strip("'")
                  if value.startswith('./') or value.startswith('docker://'):
                      continue
                  if '@' not in value:
                      bad.append((path,line_no,value,'missing @ref'))
                      continue
                  ref=value.rsplit('@',1)[1]
                  if not re.fullmatch(r'[0-9a-fA-F]{40}',ref):
                      bad.append((path,line_no,value,'ref is not a 40-character SHA'))
          for path,line_no,value,reason in bad:
              print(f'{path}:{line_no}: {reason}: {value}')
          if bad:
              raise SystemExit(1)
          PY

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${PRIMALITY_SHEAF_LOGDIR}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${PRIMALITY_SHEAF_LOGDIR}/lean-version.txt"
          lake --version | tee "${PRIMALITY_SHEAF_LOGDIR}/lake-version.txt"
          lake exe cache get 2>&1 | tee "${PRIMALITY_SHEAF_LOGDIR}/cache-get.log"

      - name: Run non-mutating clean-build and trust audit twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/primality_sheaf_ci.sh

      - name: Upload module logs, artifacts, and audits
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primality-sheaf-clean-audit-${{ env.SOURCE_SHA }}
          path: /tmp/primality-sheaf-ci
          if-no-files-found: warn
          retention-days: 30
