name: FA425 verified instance-transport and cross-donor controller

on:
  push:
    branches:
      - fix/fa425-instance-transport-controller-20260810
    paths:
      - '.github/workflows/fa425-instance-transport-controller.yml'
      - 'scripts/fa424_cross_donor_hunk_tournament.py'
      - 'scripts/fa425_instance_transport_tournament.py'
      - 'build-logs/fa425-instance-transport/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: fa425-instance-transport-controller
  cancel-in-progress: false

jobs:
  diagnose-repair-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa425-instance-transport-controller-20260810
      VERIFIED_START_SHA: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      VERIFIED_START_FIRST: '31726'
      VERIFIED_LINE_COUNT: '60453'
      FA422_MAX_FRONTIERS: '6'
      FA422_MAX_CANDIDATES: '140'
      FA422_DIRECT_FALLBACK: '24'
      MAX_ROUNDS: '6'

    steps:
      - name: Checkout latest verified-controller head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa425-instance-transport-controller-20260810
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa425-lean-version.txt
          lake --version | tee /tmp/fa425-lake-version.txt
          lake exe cache get | tee /tmp/fa425-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Assert checked-in 31726 verified baseline
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum "$src" | awk '{print $1}')
          lines=$(wc -l < "$src" | tr -d ' ')
          test "$actual" = "$VERIFIED_START_SHA"
          test "$lines" = "$VERIFIED_LINE_COUNT"
          test -s build-logs/fa423-proof-hunk/CURRENT.json
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          s=json.loads(Path('build-logs/fa423-proof-hunk/CURRENT.json').read_text())
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          m=s['final_fa_metric']
          assert actual == '71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0'
          assert m['source_sha256'] == actual
          assert m['exit_code'] == 1
          assert m['first_line'] == 31726 and m['first_col'] == 2
          assert s['prerequisites']['Mock2']['exit_code'] == 0
          assert s['prerequisites']['Mock2']['errors'] == 0
          assert s['prerequisites']['Mock2_Advanced']['exit_code'] == 0
          assert s['prerequisites']['Mock2_Advanced']['errors'] == 0
          assert not any(s['forbidden_token_audit'].values())
          PY
          echo "source_sha=$actual" >> "$GITHUB_OUTPUT"
          echo "line_count=$lines" >> "$GITHUB_OUTPUT"

      - name: Determine solver round
        id: round
        shell: bash
        run: |
          f=build-logs/fa425-instance-transport/ROUND.txt
          test -s "$f" && current=$(cat "$f") || current=0
          next=$((current+1))
          echo "round=$next" >> "$GITHUB_OUTPUT"

      - name: Diagnose Complex additive structure equality candidates
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa425-instance-transport/diagnostics
          rm -rf "$d"
          mkdir -p "$d"

          cat > /tmp/fa425-checks.lean <<'EOF'
          import Mathlib.Analysis.Complex.Basic
          #check @HasDerivAt
          #check AddCommGroup.ext
          #check Complex.addCommGroup
          #check Complex.instNormedAddCommGroup
          EOF
          lake env lean -DwarningAsError=false /tmp/fa425-checks.lean > "$d/checks.log" 2>&1
          printf '%s' "$?" > "$d/checks.exit"

          write_probe() {
            local name=$1
            local proof=$2
            cat > "/tmp/fa425-${name}.lean" <<EOF
          import Mathlib.Analysis.Complex.Basic
          example : Complex.instNormedAddCommGroup.toAddCommGroup =
              Complex.addCommGroup := by
            ${proof}
          EOF
            lake env lean -DmaxErrors=20 -DwarningAsError=false \
              "/tmp/fa425-${name}.lean" > "$d/${name}.log" 2>&1
            printf '%s' "$?" > "$d/${name}.exit"
          }

          write_probe rfl 'rfl'
          write_probe ext 'ext <;> rfl'
          write_probe structure_ext 'apply AddCommGroup.ext <;> rfl'
          write_probe cases_normed 'cases Complex.instNormedAddCommGroup <;> rfl'
          exit 0

      - name: Run instance-transport and FA424 cross-donor tournament
        id: repair
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          before_lines=$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | tr -d ' ')
          python3 scripts/fa425_instance_transport_tournament.py > /tmp/fa425-repair.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          after_lines=$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | tr -d ' ')
          cat /tmp/fa425-repair.log
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          echo "before_sha=$before" >> "$GITHUB_OUTPUT"
          echo "after_sha=$after" >> "$GITHUB_OUTPUT"
          echo "before_lines=$before_lines" >> "$GITHUB_OUTPUT"
          echo "after_lines=$after_lines" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=$changed" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and archive authoritative direct-CLI evidence
        if: always()
        id: status
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
          BEFORE_SHA: ${{ steps.repair.outputs.before_sha }}
          AFTER_SHA: ${{ steps.repair.outputs.after_sha }}
        run: |
          set -euo pipefail
          src=build-logs/fa422-canonical-decl
          dst=build-logs/fa425-instance-transport
          test -s "$src/CURRENT.json"
          test -s "$src/CURRENT.txt"
          mkdir -p "$dst/round-${ROUND}"
          cp "$src/CURRENT.json" "$dst/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/round-${ROUND}/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/round-${ROUND}/CURRENT.txt"
          cp /tmp/fa425-repair.log "$dst/round-${ROUND}/repair.log"
          cp /tmp/fa425-lean-version.txt "$dst/lean-version.txt"
          cp /tmp/fa425-lake-version.txt "$dst/lake-version.txt"
          cp /tmp/fa425-cache-get.log "$dst/cache-get.log"
          test ! -f "$src/FIRST_ERROR_CONTEXT.txt" || cp "$src/FIRST_ERROR_CONTEXT.txt" "$dst/FIRST_ERROR_CONTEXT.txt"
          find "$src" -maxdepth 1 -type f -name 'frontier-*-PROMOTED.txt' -exec cp {} "$dst/" \;
          test ! -f "$src/ALL_REQUIRED_TARGETS_2X_PASS" || cp "$src/ALL_REQUIRED_TARGETS_2X_PASS" "$dst/ALL_REQUIRED_TARGETS_2X_PASS"
          printf '%s' "$ROUND" > "$dst/ROUND.txt"

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os

          d=Path('build-logs/fa425-instance-transport')
          s=json.loads((d/'CURRENT.json').read_text())
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          actual=hashlib.sha256(src.read_bytes()).hexdigest()
          line_count=len(src.read_text(encoding='utf-8').splitlines())
          m=s['final_fa_metric']
          complete=bool(s['complete'])
          changed=actual != os.environ['VERIFIED_START_SHA']
          if m.get('source_sha256') != actual:
              raise SystemExit('source/evidence SHA mismatch')
          if s.get('starting_sha256') != os.environ['VERIFIED_START_SHA']:
              raise SystemExit(f"unexpected tournament start: {s.get('starting_sha256')}")
          if changed and not s.get('any_promotion'):
              raise SystemExit('source changed without direct-CLI promotion')
          if not complete:
              first=m.get('first_line')
              if not isinstance(first,int) or first < int(os.environ['VERIFIED_START_FIRST']):
                  raise SystemExit(f'direct CLI regression: {first}')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit('forbidden-token audit failed')
          if s['statement_policy'] != 'declaration header manifest unchanged; only proof bodies may vary':
              raise SystemExit('statement/header policy missing')
          prereq=s['prerequisites']
          for name in ('Mock2','Mock2_Advanced'):
              if prereq[name]['exit_code'] != 0 or prereq[name]['errors'] != 0:
                  raise SystemExit(f'{name} prerequisite regression')
          summary={
              'classification': 'VERIFIED',
              'branch': os.environ['ACTIVE_BRANCH'],
              'round': int(os.environ['ROUND']),
              'starting_source_sha256': s['starting_sha256'],
              'final_source_sha256': actual,
              'line_count': line_count,
              'source_changed': changed,
              'any_promotion': bool(s.get('any_promotion')),
              'complete': complete,
              'Mock2': prereq['Mock2'],
              'Mock2_Advanced': prereq['Mock2_Advanced'],
              'FA_exit': m['exit_code'],
              'FA_error_headers_captured': m['errors'],
              'FA_first_actual_error_line': m.get('first_line'),
              'FA_first_actual_error_col': m.get('first_col'),
              'FA_first_message': m.get('first_message'),
              'FA_error_declaration_index': s.get('final_error_decl_index'),
              'maxErrors_cap_for_authoritative_replay': 500,
              'forbidden_token_audit': s['forbidden_token_audit'],
              'statement_policy': s['statement_policy'],
              'promotion_policy': s['promotion_policy'],
              'downstream_failure': s.get('downstream_failure'),
          }
          (d/'VERIFIED_SUMMARY.json').write_text(json.dumps(summary,indent=2)+'\n',encoding='utf-8')
          (d/'VERIFIED_SUMMARY.txt').write_text(
              '\n'.join(f'{k}={v}' for k,v in summary.items())+'\n',encoding='utf-8')
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as out:
              out.write(f"complete={'true' if complete else 'false'}\n")
              out.write(f"source_changed={'true' if changed else 'false'}\n")
              out.write(f"source_sha={actual}\n")
              out.write(f"line_count={line_count}\n")
              out.write(f"fa_exit={m['exit_code']}\n")
              out.write(f"first_error={m.get('first_line')}\n")
              out.write(f"first_col={m.get('first_col')}\n")
              out.write(f"decl_index={s.get('final_error_decl_index')}\n")
          print(json.dumps(summary,indent=2))
          PY

      - name: Commit only directly verified source and evidence
        if: always()
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          CHANGED: ${{ steps.status.outputs.source_changed }}
          FIRST: ${{ steps.status.outputs.first_error }}
          SOURCE_SHA: ${{ steps.status.outputs.source_sha }}
        run: |
          set -euo pipefail
          d=build-logs/fa425-instance-transport
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/CURRENT.json" "$d/CURRENT.txt" "$d/VERIFIED_SUMMARY.json" \
            "$d/VERIFIED_SUMMARY.txt" "$d/ROUND.txt" "$d/diagnostics"
          test ! -f "$d/FIRST_ERROR_CONTEXT.txt" || git add "$d/FIRST_ERROR_CONTEXT.txt"
          test ! -f "$d/ALL_REQUIRED_TARGETS_2X_PASS" || git add "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          find "$d" -maxdepth 1 -type f -name 'frontier-*-PROMOTED.txt' -print0 | xargs -0 -r git add
          git add "$d/round-${ROUND}/CURRENT.json" "$d/round-${ROUND}/CURRENT.txt"
          if git diff --cached --quiet; then exit 0; fi
          if test "${COMPLETE:-false}" = true; then
            msg="fix: obtain FA Integrated Mock3 QYM authoritative 2x PASS in FA425 round ${ROUND} [skip ci]"
          elif test "${CHANGED:-false}" = true; then
            msg="fix: promote direct-CLI FA frontier to ${FIRST} sha ${SOURCE_SHA:0:12} [skip ci]"
          else
            msg="ci: record FA425 round ${ROUND} no-improvement evidence [skip ci]"
          fi
          git commit -m "$msg"
          git push origin "HEAD:${ACTIVE_BRANCH}"

      - name: Dispatch next round only after strict checked-in advancement
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ steps.round.outputs.round }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          CHANGED: ${{ steps.status.outputs.source_changed }}
        run: |
          set -euo pipefail
          test "${COMPLETE:-false}" != true || exit 0
          test "${CHANGED:-false}" = true || exit 0
          test "${ROUND}" -lt "${MAX_ROUNDS}" || exit 0
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/fa425-instance-transport-controller.yml/dispatches" \
            -f ref="$ACTIVE_BRANCH"

      - name: Upload complete direct-CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa425-instance-transport-round-${{ steps.round.outputs.round }}-${{ github.run_id }}
          path: |
            build-logs/fa425-instance-transport
            build-logs/fa422-canonical-decl
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final module chain result
        if: always()
        env:
          COMPLETE: ${{ steps.status.outputs.complete }}
        shell: bash
        run: |
          test "${COMPLETE:-false}" = true
