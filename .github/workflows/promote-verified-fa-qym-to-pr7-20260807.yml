name: Promote verified FA QYM to PR7

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'build-logs/current-advanced-fa-qym-v2-success.txt'

permissions:
  contents: write
  actions: read

concurrency:
  group: promote-verified-fa-qym-to-pr7
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      TARGET_BRANCH: fix/primality-sheaf-clean-build
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/promote-fa-qym-pr7

    steps:
      - name: Checkout verified PR 9 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 1
          persist-credentials: false

      - name: Clone latest PR 7 branch and copy only verified focused sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test -s build-logs/current-advanced-fa-qym-v2-success.txt
          rm -rf /tmp/pr7-work /tmp/verified-focused
          mkdir -p /tmp/verified-focused "${EVIDENCE}/logs" "${EVIDENCE}/source"
          for file in \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean; do
            cp "${file}" "/tmp/verified-focused/$(basename "${file}")"
            cp "${file}" "${EVIDENCE}/source/"
          done
          if [[ -f PrimalitySheafVerification/Mock3.lean ]]; then
            cp PrimalitySheafVerification/Mock3.lean /tmp/verified-focused/Mock3.lean
            cp PrimalitySheafVerification/Mock3.lean "${EVIDENCE}/source/"
          fi
          git clone --depth=1 --branch "${TARGET_BRANCH}" \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/pr7-work
          cd /tmp/pr7-work
          git rev-parse HEAD | tee "${EVIDENCE}/target-start-head.txt"
          for src in /tmp/verified-focused/*.lean; do
            cp "${src}" "PrimalitySheafVerification/$(basename "${src}")"
          done
          git diff --check

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          cd /tmp/pr7-work
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Audit and compile focused dependency chain twice on latest PR 7
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          cd /tmp/pr7-work
          mkdir -p "${OUTDIR}"
          printf '%s\n' 'module,pass,exit_code,error_count,warning_count' \
            > "${EVIDENCE}/compile-summary.csv"

          python3 - <<'PY' | tee "${EVIDENCE}/forbidden-token-audit.txt"
          from pathlib import Path
          import re
          paths = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          if Path('PrimalitySheafVerification/Mock3.lean').exists():
              paths.append(Path('PrimalitySheafVerification/Mock3.lean'))
          def strip(src: str) -> str:
              out=[]; i=0; depth=0; string=False; esc=False
              while i < len(src):
                  if depth:
                      if src.startswith('/-', i): depth += 1; out += [' ',' ']; i += 2
                      elif src.startswith('-/', i): depth -= 1; out += [' ',' ']; i += 2
                      else: out.append('\n' if src[i] == '\n' else ' '); i += 1
                  elif string:
                      c=src[i]; out.append('\n' if c == '\n' else ' ')
                      if esc: esc=False
                      elif c == '\\': esc=True
                      elif c == '"': string=False
                      i += 1
                  elif src.startswith('/-', i): depth=1; out += [' ',' ']; i += 2
                  elif src.startswith('--', i):
                      while i < len(src) and src[i] != '\n': out.append(' '); i += 1
                  elif src[i] == '"': string=True; out.append(' '); i += 1
                  else: out.append(src[i]); i += 1
              if depth or string: raise SystemExit('unterminated comment or string')
              return ''.join(out)
          checks={
              'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for path in paths:
              code=strip(path.read_text(encoding='utf-8'))
              print(f'[{path}]')
              for name, pat in checks.items():
                  n=len(re.findall(pat, code)); print(f'{name}={n}'); bad |= n != 0
          if bad: raise SystemExit(1)
          PY

          compile_one() {
            local module="$1" pass="$2" log code errors warnings
            log="${EVIDENCE}/logs/${module}-${pass}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean -DmaxErrors=1000 "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              | tee -a "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              grep -n 'error:' "${log}" | head -100 > "${log}.errors" || true
              tail -600 "${log}" > "${log}.tail" || true
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'" "${log}"
          }

          compile_one Mock2 dependency
          compile_one Mock2_Advanced dependency
          for pass in 1 2; do
            compile_one Mock2_FunctionalAnalysis "${pass}"
            compile_one Mock2_FunctionalAnalysis_Integrated "${pass}"
            if [[ -f PrimalitySheafVerification/Mock3.lean ]]; then
              compile_one Mock3 "${pass}"
            fi
            compile_one QYM "${pass}"
          done

      - name: Commit focused verified files to PR 7 without merging
        shell: bash
        run: |
          set -euo pipefail
          cd /tmp/pr7-work
          remote_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          start_head="$(cat "${EVIDENCE}/target-start-head.txt")"
          test "${remote_head}" = "${start_head}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean
          if [[ -f PrimalitySheafVerification/Mock3.lean ]]; then
            git add PrimalitySheafVerification/Mock3.lean
          fi
          if git diff --cached --quiet; then
            echo 'PR 7 already contains the byte-identical verified focused sources' \
              | tee "${EVIDENCE}/status.txt"
            exit 0
          fi
          git commit -m 'fix: promote verified FunctionalAnalysis Integrated and QYM sources'
          git push origin "HEAD:${TARGET_BRANCH}"
          echo 'verified focused sources promoted to PR 7; no merge performed' \
            | tee "${EVIDENCE}/status.txt"

      - name: Upload promotion evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promote-verified-fa-qym-pr7-${{ github.sha }}
          path: /tmp/promote-fa-qym-pr7
          if-no-files-found: warn
          retention-days: 30
