name: PASS 408 authoritative FunctionalAnalysis diagnostic

on:
  push:
    branches: [fix/fa408-authoritative-diagnostic-20260809]
    paths:
      - '.github/workflows/fa408-authoritative-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa408-authoritative-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - name: Checkout exact PASS 408 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa408-authoritative-diagnostic-20260809
          fetch-depth: 1200
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Compile verified prerequisites and FunctionalAnalysis directly
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa408-authoritative
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean \
              -DmaxErrors="$max_errors" \
              -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" \
              > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            test "$rc" -eq 0 || return "$rc"
            test -s "$olean" && test -s "$ilean"
          }
          compile_one Mock2 300
          rc_m2=$?
          compile_one Mock2_Advanced 300
          rc_m2a=$?
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 400
            rc_fa=$?
          else
            rc_fa=125
            echo 'prerequisite failure' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root=Path('.')
          d=root/'build-logs/fa408-authoritative'
          results={}
          pat=re.compile(r'\.lean:(\d+):(\d+):\s+error:')
          for stem in ['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis']:
              src=root/f'PrimalitySheafVerification/{stem}.lean'
              log=(d/f'{stem}.log').read_text(encoding='utf-8',errors='replace') if (d/f'{stem}.log').exists() else ''
              matches=list(pat.finditer(log))
              olean=root/f'.lake/build/lib/lean/PrimalitySheafVerification/{stem}.olean'
              ilean=root/f'.lake/build/lib/lean/PrimalitySheafVerification/{stem}.ilean'
              results[stem]={
                  'exit_code':int((d/f'{stem}.exit').read_text()) if (d/f'{stem}.exit').exists() else 999,
                  'errors':len(matches),
                  'first_line':int(matches[0].group(1)) if matches else 0,
                  'first_col':int(matches[0].group(2)) if matches else 0,
                  'olean':olean.exists() and olean.stat().st_size>0,
                  'ilean':ilean.exists() and ilean.stat().st_size>0,
                  'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              }
          status={
              'complete':results['Mock2_FunctionalAnalysis']['exit_code']==0 and results['Mock2_FunctionalAnalysis']['errors']==0 and results['Mock2_FunctionalAnalysis']['olean'] and results['Mock2_FunctionalAnalysis']['ilean'],
              'stage':'Mock2_FunctionalAnalysis',
              'results':results,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          (d/'CURRENT.txt').write_text('\n'.join(
              f"{name}: exit={row['exit_code']} errors={row['errors']} first={row['first_line']}:{row['first_col']} olean={row['olean']} ilean={row['ilean']} sha256={row['source_sha256']}"
              for name,row in results.items()
          )+'\n',encoding='utf-8')
          print((d/'CURRENT.txt').read_text())
          PY
          echo "fa_exit_code=$rc_fa" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit authoritative diagnostic
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa408-authoritative
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record PASS 408 authoritative FA diagnostic [skip ci]'
            git push origin HEAD:fix/fa408-authoritative-diagnostic-20260809
          fi

      - name: Upload PASS 408 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa408-authoritative-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa408-authoritative
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce FunctionalAnalysis result
        if: always()
        shell: bash
        env:
          FA_EXIT_CODE: ${{ steps.compile.outputs.fa_exit_code }}
        run: |
          test -n "${FA_EXIT_CODE:-}"
          exit "$FA_EXIT_CODE"
