name: Codex FA API probe WithLp prod v2

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-withlp-prod-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Verify explicit product Tendsto composition
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeWithLpProdV2.lean <<'LEAN'
          import Mathlib
          open Topology Filter
          #check WithLp.prod_continuous_toLp
          example {ι α β : Type} [TopologicalSpace α] [TopologicalSpace β]
              (l : Filter ι) (f : ι → α) (g : ι → β) (x : α) (y : β)
              (hf : Tendsto f l (nhds x)) (hg : Tendsto g l (nhds y)) :
              Tendsto (fun j ↦ WithLp.toLp 2 (f j, g j)) l
                (nhds (WithLp.toLp 2 (x, y))) := by
            have hPair : Tendsto (fun j ↦ (f j, g j)) l (nhds (x, y)) :=
              hf.prodMk_nhds hg
            exact ((WithLp.prod_continuous_toLp (p := 2) α β).tendsto (x, y)).comp hPair
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeWithLpProdV2.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-withlp-prod-v2-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
