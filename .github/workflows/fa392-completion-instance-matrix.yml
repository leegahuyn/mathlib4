name: PASS 392 completion instance coherence matrix

on:
  push:
    branches:
      - probe/fa392-completion-instance-matrix-20260809
    paths:
      - '.github/workflows/fa392-completion-instance-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa392-completion-instance-matrix
  cancel-in-progress: true

jobs:
  probe:
    name: completion-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - full-parent-package
          - inner-product-only
          - direct-parent-package
          - norm-inner-ip-package
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout materialized PASS 391 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3000
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Insert coherent completion instance candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/fa392/${VARIANT}/logs" "/tmp/fa392/${VARIANT}/source"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          p = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before = sha256(p.read_bytes()).hexdigest()
          expected = 'fd3ef32488c4d7de11f7adac75dd9a04ec48734277fc071e6e99662bc48790d9'
          if before != expected:
              raise SystemExit(f'unexpected PASS391 source: {before}; expected {expected}')
          marker = '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          '''
          if p.read_text().count(marker) != 1:
              raise SystemExit('SobolevCompletion insertion marker not unique')

          variant = os.environ['VARIANT']
          blocks = {
              'full-parent-package': '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          noncomputable def sobolevCompletionInnerProductSpace :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace

          noncomputable local instance sobolevCompletionModule :
              Module ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace.toModule

          noncomputable local instance sobolevCompletionNormedSpace :
              NormedSpace ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace.toNormedSpace

          noncomputable local instance sobolevCompletionInner :
              Inner ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace.toInner

          noncomputable local instance sobolevCompletionInnerProductSpaceInstance :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace

          ''',
              'inner-product-only': '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          noncomputable local instance sobolevCompletionInnerProductSpaceInstance :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace

          ''',
              'direct-parent-package': '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          noncomputable local instance sobolevCompletionModule :
              Module ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace.toModule

          noncomputable local instance sobolevCompletionNormedSpace :
              NormedSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace.toNormedSpace

          noncomputable local instance sobolevCompletionInner :
              Inner ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace.toInner

          noncomputable local instance sobolevCompletionInnerProductSpaceInstance :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace

          ''',
              'norm-inner-ip-package': '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          noncomputable def sobolevCompletionInnerProductSpace :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace

          noncomputable local instance sobolevCompletionNormedSpace :
              NormedSpace ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace.toNormedSpace

          noncomputable local instance sobolevCompletionInner :
              Inner ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace.toInner

          noncomputable local instance sobolevCompletionInnerProductSpaceInstance :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            Q.sobolevCompletionInnerProductSpace

          ''',
          }
          text = p.read_text()
          text = text.replace(marker, blocks[variant])
          p.write_text(text)
          after = sha256(p.read_bytes()).hexdigest()
          print(f'variant={variant}')
          print(f'input_sha256={before}')
          print(f'output_sha256={after}')
          Path(f'/tmp/fa392/{variant}/source/source-sha256.txt').write_text(after + '\n')
          Path(f'/tmp/fa392/{variant}/source/Mock2_FunctionalAnalysis-{variant}.lean').write_bytes(p.read_bytes())
          PY

      - name: Compile full FunctionalAnalysis candidate
        id: compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.{olean,ilean}
          lake env lean -DmaxErrors=250 \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "/tmp/fa392/${VARIANT}/logs/compile.log" 2>&1
          rc=$?
          set -e
          grep -n 'error:' "/tmp/fa392/${VARIANT}/logs/compile.log" \
            > "/tmp/fa392/${VARIANT}/logs/errors.txt" || true
          grep -n 'warning:' "/tmp/fa392/${VARIANT}/logs/compile.log" \
            > "/tmp/fa392/${VARIANT}/logs/warnings.txt" || true
          first=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' \
            "/tmp/fa392/${VARIANT}/logs/compile.log" | head -1)
          last=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' \
            "/tmp/fa392/${VARIANT}/logs/compile.log" | tail -1)
          errors=$(wc -l < "/tmp/fa392/${VARIANT}/logs/errors.txt")
          warnings=$(wc -l < "/tmp/fa392/${VARIANT}/logs/warnings.txt")
          {
            echo "variant=${VARIANT}"
            echo "exit_code=${rc}"
            echo "error_header_count=${errors}"
            echo "warning_count=${warnings}"
            echo "first_error_line=${first:-none}"
            echo "last_error_line=${last:-none}"
            echo "olean_exists=$(test -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean && echo true || echo false)"
            echo "ilean_exists=$(test -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean && echo true || echo false)"
          } | tee "/tmp/fa392/${VARIANT}/summary.txt"
          tail -1500 "/tmp/fa392/${VARIANT}/logs/compile.log" > "/tmp/fa392/${VARIANT}/logs/tail.txt" || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 392 matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa392-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/fa392/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce candidate result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${EXIT_CODE:-}"
          exit "${EXIT_CODE}"
