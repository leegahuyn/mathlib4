name: Codex FA after3272 through3315 fast2 v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-after3272-through3315-fast2-v1.yml]
  workflow_dispatch:
permissions: {actions: read, contents: read}
env:
  BASE_RUN_ID: "31561568521"
  BASE_JOB_ID: "94004812845"
  BASE_HEAD_SHA: "bad72b3af4605867cfc88cb7896b19ba5ad2bc8b"
  BASE_ARTIFACT_ID: "9128095564"
  BASE_ARTIFACT_DIGEST: "sha256:540666ba6630ecef0b324f78048ebaf07e2924d16f95b675aeb6a313fdb5d8e4"
  BASE_SOURCE_SHA256: "8709441789c6b021a9ef6b6495be722723a9cac66747432ece58d60461041e7e"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact idx3268 direct source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail;OUT=build-logs/codex-fa-after3272-through3315-fast2-v1;mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json";gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/job.json";gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/artifact.json";gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip;test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST";unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-after3272-through3315-fast2-v1');r=json.loads((out/'run.json').read_text());j=json.loads((out/'job.json').read_text());m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text());assert r['head_sha']==os.environ['BASE_HEAD_SHA'] and j['conclusion']=='failure' and m['FA_error_declaration_index']==3268 and m['source_sha256']==os.environ['BASE_SOURCE_SHA256'] and m['all_required_lean_executed'] is True and m['public_proposition_changes_explicitly_audited'] is True;hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            b=p.read_bytes()
            if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256']:hits.append(p)
          assert len(hits)==1;(out/'BASE_SOURCE.txt').write_text(str(hits[0].resolve())+'\n')
          PY
      - name: Compose through idx3315
        shell: bash
        run: |
          set -euo pipefail;OUT=build-logs/codex-fa-after3272-through3315-fast2-v1;base="$(cat "$OUT/BASE_SOURCE.txt")"
          ae(){ t=$1;l=$2;e=$3;n=/tmp/$t.lean;python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library "$l" --target "$n" --audit-out "$OUT/$t.json" --environment-id "$e";base=$n; }
          al(){ t=$1;l=$2;n=/tmp/$t.lean;python3 scripts/fa_dynamic_apply_staged_library_decl_local_strict_v1.py --base-source "$base" --library "$l" --target "$n" --audit-out "$OUT/$t.json";base=$n; }
          fl(){ t=$1;l=$2;is=$3;o=/tmp/$t.json;python3 scripts/fa_dynamic_filter_staged_local_v1.py --base-source "$base" --library "$l" --indices "$is" --out-library "$o" --report "$OUT/${t}_FILTER.json";al "$t" "$o"; }
          ae INF scripts/fa_dynamic_env_fullplane_local_infinity_v2.json fullplane-local-nat-infinity
          al FP3290 scripts/fa_dynamic_cluster_3272_3290_fullplane_friedrichs_v1.json
          al LP3291 scripts/fa_dynamic_cluster_3291_lp_translation_integrable_v1.json
          al C3292 scripts/fa_dynamic_cluster_3292_semantic_v1.json
          al C3305 scripts/fa_dynamic_cluster_3305_withlp_tendsto_v1.json
          fl R004 scripts/fa_d0a3_r004_high_confidence_overrides.json 3293,3308,3309
          fl C3315 scripts/fa_dynamic_cluster_3308_3315_fullplane_mollified_v1.json 3310,3311,3313,3314,3315
          ae E3332 scripts/fa_dynamic_env_actual_scalar_core_instances_v1.json reactivate-fixed-phase-core-instances-actual-scalar
          ae E3389 scripts/fa_dynamic_env_independent_weak_core_instances_v1.json reactivate-fixed-phase-core-instances-independent-weak
          ae E3407 scripts/fa_dynamic_env_joint_localization_support_namespace_v1.json open-essential-core-route-for-joint-compact-support
          fl R005 scripts/fa_d0a3_r005_high_confidence_overrides.json 3324,3326,3327,3328,3408
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');h=hashlib.sha256(p.read_bytes()).hexdigest();
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f'CANDIDATE_SHA={h}\n')
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Direct full-source first frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH";OUT=build-logs/codex-fa-after3272-through3315-fast2-v1;mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2;one Mock2_Advanced;test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA";one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,re
          out=Path('build-logs/codex-fa-after3272-through3315-fast2-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));st=[s.count('\n',0,m.start())+1 for m in ds];rx=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');first={}
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=rx.match(raw)
            if m:
              ln=int(m.group(1));i=bisect_right(st,ln)-1;first={'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[i].group('name') if i>=0 else None,'declaration_index':i if i>=0 else None};break
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};b=p.read_bytes();metric={'schema':'fa-after3272-through3315-fast2-v1','source_sha256':hashlib.sha256(b).hexdigest(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message')};(out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT";exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3272-through3315-fast2-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3272-through3315-fast2-v1
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86;exit "$FA_EXIT"
