name: Focus three-module direct-source state machine

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/focus-three-module-state-machine.yml'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-three-module-state-machine
  cancel-in-progress: false

jobs:
  advance-one-verified-phase:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADV: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      QYM: PrimalitySheafVerification/QYM.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: build-logs/focus-three-module-state-machine
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone exact triggering HEAD
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p "${LOGDIR}" "${OUTDIR}"
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_blob=$(git hash-object "${ADV}")" \
            "fa_blob=$(git hash-object "${FA}")" \
            "integrated_blob=$(test -f "${INTEGRATED}" && git hash-object "${INTEGRATED}" || echo MISSING)" \
            "qym_blob=$(git hash-object "${QYM}")" \
            > "${LOGDIR}/snapshot.txt"

      - name: Install exact Lean toolchain and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Advance the first incomplete phase only
        shell: bash
        run: |
          cat > /tmp/focus-state-machine.sh <<'BASH'
          #!/usr/bin/env bash
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"

          module_name() {
            basename "$1" .lean
          }

          delete_artifacts() {
            local path="$1"
            local name
            name="$(module_name "$path")"
            rm -f \
              "${OUTDIR}/${name}.olean" \
              "${OUTDIR}/${name}.ilean" \
              "${OUTDIR}/${name}.olean.private"
          }

          compile_once() {
            local path="$1"
            local tag="$2"
            local name code
            name="$(module_name "$path")"
            delete_artifacts "$path"
            set +e
            lake env lean "$path" \
              -o "${OUTDIR}/${name}.olean" \
              -i "${OUTDIR}/${name}.ilean" \
              > "${LOGDIR}/${tag}.log" 2>&1
            code=$?
            set -e
            echo "$code" > "${LOGDIR}/${tag}.exit"
            grep -n 'error:' "${LOGDIR}/${tag}.log" | head -n 10 \
              > "${LOGDIR}/${tag}.first-errors.txt" || true
            grep -n 'error:' "${LOGDIR}/${tag}.log" | tail -n 1 \
              > "${LOGDIR}/${tag}.last-error.txt" || true
            printf '%s\n' \
              "exit_code=${code}" \
              "error_count=$(grep -c 'error:' "${LOGDIR}/${tag}.log" || true)" \
              "warning_count=$(grep -c 'warning:' "${LOGDIR}/${tag}.log" || true)" \
              "maximum_error=$(grep -Eci 'maximum number of errors' "${LOGDIR}/${tag}.log" || true)" \
              > "${LOGDIR}/${tag}.summary"
            if [[ "$code" -ne 0 ]]; then
              return "$code"
            fi
            test -s "${OUTDIR}/${name}.olean"
            test -s "${OUTDIR}/${name}.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/${tag}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" \
              "${LOGDIR}/${tag}.log"
          }

          compile_twice() {
            local path="$1"
            local tag="$2"
            compile_once "$path" "${tag}-pass1"
            compile_once "$path" "${tag}-pass2"
          }

          probe_twice() {
            local path="$1"
            local tag="$2"
            if compile_once "$path" "${tag}-probe1" && compile_once "$path" "${tag}-probe2"; then
              return 0
            fi
            return 1
          }

          static_audit() {
            local path="$1"
            local tag="$2"
            python3 - "$path" <<'PY' | tee "${LOGDIR}/${tag}-trust-audit.txt"
          from pathlib import Path
          import re, sys
          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                  elif src.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                  else: out.append('\n' if src[i]=='\n' else ' '); i+=1
              elif string:
                  ch=src[i]; out.append('\n' if ch=='\n' else ' ')
                  if esc: esc=False
                  elif ch=='\\': esc=True
                  elif ch=='"': string=False
                  i+=1
              elif src.startswith('/-',i): depth=1; out.extend('  '); i+=2
              elif src.startswith('--',i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i+=1
              elif src[i]=='"': string=True; out.append(' '); i+=1
              else: out.append(src[i]); i+=1
          if depth or string: raise SystemExit('unterminated comment/string')
          code=''.join(out)
          patterns={
            'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b',
            'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
            'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b','by_contra!':r'\bby_contra!\b'}
          bad=False
          for key, pat in patterns.items():
              count=len(re.findall(pat,code)); print(f'{key}={count}'); bad |= count != 0
          if bad: raise SystemExit(1)
          PY
          }

          compare_theorem_headers() {
            local before="$1"
            local after="$2"
            local tag="$3"
            python3 - "$before" "$after" <<'PY' | tee "${LOGDIR}/${tag}-statement-integrity.txt"
          from pathlib import Path
          import re, sys
          def strip(src):
              out=[]; i=0; depth=0; string=False; esc=False
              while i<len(src):
                  if depth:
                      if src.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                      elif src.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                      else: out.append('\n' if src[i]=='\n' else ' '); i+=1
                  elif string:
                      ch=src[i]; out.append('\n' if ch=='\n' else ' ')
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': string=False
                      i+=1
                  elif src.startswith('/-',i): depth=1; out.extend('  '); i+=2
                  elif src.startswith('--',i):
                      while i<len(src) and src[i]!='\n': out.append(' '); i+=1
                  elif src[i]=='"': string=True; out.append(' '); i+=1
                  else: out.append(src[i]); i+=1
              return ''.join(out)
          def headers(path):
              src=strip(Path(path).read_text(encoding='utf-8'))
              pat=re.compile(r'(?m)^\s*(?:(?:private|protected|noncomputable)\s+)*(theorem|lemma)\s+([^\s(:]+)')
              ms=list(pat.finditer(src)); ans=[]
              for m in ms:
                  i=m.start(); j=m.end(); par=br=cur=0
                  while j<len(src):
                      c=src[j]
                      if c=='(': par+=1
                      elif c==')': par-=1
                      elif c=='[': br+=1
                      elif c==']': br-=1
                      elif c=='{': cur+=1
                      elif c=='}': cur-=1
                      if par==br==cur==0:
                          if src.startswith(':=',j): break
                          if re.match(r'\bby\b',src[j:]): break
                          if re.match(r'\bwhere\b',src[j:]): break
                      j+=1
                  ans.append(re.sub(r'\s+',' ',src[i:j]).strip())
              return ans
          a=headers(sys.argv[1]); b=headers(sys.argv[2])
          print(f'before_count={len(a)}'); print(f'after_count={len(b)}')
          if a != b:
              for n,(x,y) in enumerate(zip(a,b)):
                  if x!=y:
                      print(f'first_changed_index={n}'); print(f'before={x}'); print(f'after={y}'); break
              raise SystemExit(1)
          print('statement_changed=0'); print('assumptions_changed=0')
          PY
          }

          race_guard_and_push() {
            local message="$1"
            shift
            local remote_head
            remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
            printf '%s\n' "trigger_head=${GITHUB_SHA}" "remote_head=${remote_head}" \
              | tee "${LOGDIR}/race-guard.txt"
            test "${remote_head}" = "${GITHUB_SHA}"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add "$@"
            git diff --cached --check
            git commit -m "$message"
            git push origin "HEAD:${BRANCH}"
          }

          # Mandatory Mock2 regression before every phase.
          static_audit "${MOCK2}" Mock2
          compile_once "${MOCK2}" Mock2-regression

          # Phase A: checked-in direct-source Mock2_Advanced or v61-v68 materialization.
          if probe_twice "${ADV}" Mock2_Advanced-direct; then
            static_audit "${ADV}" Mock2_Advanced
            echo 'PHASE_A=checked-in direct-source PASS' | tee -a "${LOGDIR}/phase-status.txt"
          else
            git reset --hard HEAD
            cp "${ADV}" /tmp/Mock2_Advanced.before.lean
            : > "${LOGDIR}/Mock2_Advanced-repair-chain.txt"
            for n in 61 62 63 64 65 66 67 68; do
              script="scripts/repair_mock2_advanced_v${n}.py"
              test -f "$script"
              echo "RUN $script" | tee -a "${LOGDIR}/Mock2_Advanced-repair-chain.txt"
              python3 "$script" 2>&1 | tee -a "${LOGDIR}/Mock2_Advanced-repair-application.log"
              echo "OK $script sha256=$(sha256sum "${ADV}" | awk '{print $1}')" \
                | tee -a "${LOGDIR}/Mock2_Advanced-repair-chain.txt"
            done
            test "$(git diff --name-only)" = "${ADV}"
            git diff --check
            compare_theorem_headers /tmp/Mock2_Advanced.before.lean "${ADV}" Mock2_Advanced
            static_audit "${ADV}" Mock2_Advanced-candidate
            compile_once "${MOCK2}" Mock2-regression-after-advanced-repair
            compile_twice "${ADV}" Mock2_Advanced-candidate
            sha="$(sha256sum "${ADV}" | awk '{print $1}')"
            sha256sum "${ADV}" "${OUTDIR}/Mock2_Advanced.olean" "${OUTDIR}/Mock2_Advanced.ilean" \
              > "${LOGDIR}/Mock2_Advanced-candidate-hashes.txt"
            race_guard_and_push "fix: materialize Mock2 Advanced v68 verified source (${sha})" "${ADV}"
            echo 'PHASE_A=materialized; next push must verify direct source' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Phase B: checked-in FunctionalAnalysis or deterministic passes 313-315.
          if probe_twice "${FA}" Mock2_FunctionalAnalysis-direct; then
            static_audit "${FA}" Mock2_FunctionalAnalysis
            echo 'PHASE_B=checked-in direct-source PASS' | tee -a "${LOGDIR}/phase-status.txt"
          else
            git reset --hard HEAD
            # Recreate dependency objects after reset.
            compile_once "${MOCK2}" Mock2-regression-before-fa-repair
            compile_twice "${ADV}" Mock2_Advanced-before-fa-repair
            cp "${FA}" /tmp/Mock2_FunctionalAnalysis.before.lean
            scripts=(
              scripts/apply_three_hundred_thirteenth_pass_repairs.py
              scripts/apply_three_hundred_fourteenth_pass_repairs.py
              scripts/apply_three_hundred_fifteenth_pass_repairs.py
            )
            : > "${LOGDIR}/FunctionalAnalysis-repair-chain.txt"
            for script in "${scripts[@]}"; do
              test -f "$script"
              echo "RUN $script" | tee -a "${LOGDIR}/FunctionalAnalysis-repair-chain.txt"
              python3 "$script" 2>&1 | tee -a "${LOGDIR}/FunctionalAnalysis-repair-application.log"
              echo "OK $script sha256=$(sha256sum "${FA}" | awk '{print $1}')" \
                | tee -a "${LOGDIR}/FunctionalAnalysis-repair-chain.txt"
            done
            mapfile -t changed < <(git diff --name-only)
            printf '%s\n' "${changed[@]}" > "${LOGDIR}/FunctionalAnalysis-changed-files.txt"
            test "${#changed[@]}" -eq 1
            test "${changed[0]}" = "${FA}"
            git diff --check
            compare_theorem_headers /tmp/Mock2_FunctionalAnalysis.before.lean "${FA}" Mock2_FunctionalAnalysis
            static_audit "${FA}" Mock2_FunctionalAnalysis-candidate
            compile_twice "${FA}" Mock2_FunctionalAnalysis-candidate-unsplit

            # Store the complete implementation in Integrated and retain the historical import path.
            cp "${FA}" "${INTEGRATED}"
            cat > "${FA}" <<'LEAN'
          /-!
          # Mock2 FunctionalAnalysis compatibility entry point

          The complete implementation is checked in at
          `PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated`.
          This historical module path re-exports that implementation.
          -/
          import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated
          LEAN
            static_audit "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-candidate
            static_audit "${FA}" Mock2_FunctionalAnalysis-compatibility-candidate
            compile_twice "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-candidate
            compile_twice "${FA}" Mock2_FunctionalAnalysis-compatibility-candidate
            test "$(wc -l < "${INTEGRATED}")" -gt 1000
            sha="$(sha256sum "${INTEGRATED}" | awk '{print $1}')"
            sha256sum "${INTEGRATED}" "${FA}" \
              "${OUTDIR}/Mock2_FunctionalAnalysis_Integrated.olean" \
              "${OUTDIR}/Mock2_FunctionalAnalysis_Integrated.ilean" \
              "${OUTDIR}/Mock2_FunctionalAnalysis.olean" \
              "${OUTDIR}/Mock2_FunctionalAnalysis.ilean" \
              > "${LOGDIR}/FunctionalAnalysis-candidate-hashes.txt"
            race_guard_and_push "fix: materialize FunctionalAnalysis and substantive Integrated implementation (${sha})" \
              "${FA}" "${INTEGRATED}"
            echo 'PHASE_B=materialized; next push must verify direct sources' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi

          # Phase C: enforce a substantive checked-in Integrated implementation.
          integrated_ok=0
          if [[ -f "${INTEGRATED}" ]] && [[ "$(wc -l < "${INTEGRATED}")" -gt 1000 ]]; then
            if probe_twice "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-direct; then
              integrated_ok=1
            fi
          fi
          if [[ "$integrated_ok" -eq 0 ]]; then
            # A full FA source can be split; a tiny compatibility source cannot.
            test "$(wc -l < "${FA}")" -gt 1000
            git reset --hard HEAD
            compile_once "${MOCK2}" Mock2-regression-before-integrated-split
            compile_twice "${ADV}" Mock2_Advanced-before-integrated-split
            cp "${FA}" "${INTEGRATED}"
            cat > "${FA}" <<'LEAN'
          /-!
          # Mock2 FunctionalAnalysis compatibility entry point

          The complete implementation is checked in at
          `PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated`.
          This historical module path re-exports that implementation.
          -/
          import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated
          LEAN
            static_audit "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-split
            static_audit "${FA}" Mock2_FunctionalAnalysis-compatibility-split
            compile_twice "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-split
            compile_twice "${FA}" Mock2_FunctionalAnalysis-compatibility-split
            race_guard_and_push "fix: restore substantive FunctionalAnalysis Integrated boundary" \
              "${FA}" "${INTEGRATED}"
            echo 'PHASE_C=materialized; next push must verify direct sources' >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          fi
          static_audit "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated
          echo 'PHASE_C=checked-in direct-source PASS' | tee -a "${LOGDIR}/phase-status.txt"

          # Reconfirm all dependency objects immediately before QYM.
          compile_once "${MOCK2}" Mock2-final-regression
          compile_twice "${ADV}" Mock2_Advanced-final-regression
          compile_twice "${INTEGRATED}" Mock2_FunctionalAnalysis_Integrated-final-regression
          compile_twice "${FA}" Mock2_FunctionalAnalysis-final-regression

          # Phase D: QYM must compile unchanged unless an explicit later repair is added.
          static_audit "${QYM}" QYM
          compile_twice "${QYM}" QYM-direct

          # One final source-only sequence after deleting each project artifact.
          compile_once "${MOCK2}" final-Mock2
          compile_twice "${ADV}" final-Mock2_Advanced
          compile_twice "${INTEGRATED}" final-Mock2_FunctionalAnalysis_Integrated
          compile_twice "${FA}" final-Mock2_FunctionalAnalysis
          compile_twice "${QYM}" final-QYM

          # Builds must not mutate any checked-in Lean source.
          test -z "$(git status --porcelain --untracked-files=no)"

          mkdir -p build-logs
          python3 - <<'PY' > build-logs/focused-three-module-pass.json
          import hashlib, json
          from pathlib import Path
          files = {
            'Mock2': Path('PrimalitySheafVerification/Mock2.lean'),
            'Mock2_Advanced': Path('PrimalitySheafVerification/Mock2_Advanced.lean'),
            'Mock2_FunctionalAnalysis': Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
            'Mock2_FunctionalAnalysis_Integrated': Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
            'QYM': Path('PrimalitySheafVerification/QYM.lean'),
          }
          out = {
            'overall_focused_status': 'PASS',
            'runtime_source_repair_in_final_sequence': False,
            'errors': 0,
            'missing_project_object_files': 0,
            'forbidden_tokens': 0,
            'sorryAx': 0,
            'new_user_axioms': 0,
            'theorem_statement_or_assumption_weakening': 0,
            'sources': {k: hashlib.sha256(p.read_bytes()).hexdigest() for k,p in files.items()},
          }
          print(json.dumps(out, indent=2, sort_keys=True))
          PY
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/focused-three-module-pass.json
          git commit -m 'ci: record focused three-module direct-source PASS'
          git push origin "HEAD:${BRANCH}"
          {
            echo '## Overall focused status: PASS'
            echo '- Mock2 regression: PASS'
            echo '- Mock2_Advanced checked-in direct source, two clean passes: PASS'
            echo '- Mock2_FunctionalAnalysis checked-in direct source, two clean passes: PASS'
            echo '- substantive Integrated implementation, two clean passes: PASS'
            echo '- QYM checked-in direct source, two clean passes: PASS'
            echo '- errors and missing project objects: 0'
            echo '- forbidden tokens, sorryAx, and new user axioms: 0'
          } >> "${GITHUB_STEP_SUMMARY}"
          BASH
          chmod +x /tmp/focus-state-machine.sh
          /tmp/focus-state-machine.sh
