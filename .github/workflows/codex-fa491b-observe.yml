name: Codex FA491B direct setIntegral_prod strict Lean

on:
  push:
    branches:
      - fix/fa491b-strip-setintegral-prod-20260811
    paths:
      - .github/workflows/codex-fa491b-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish FA491B start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA491B sibling observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- stage: \`FA491 sibling, not FA492\`\n- upstream_FA490_run: \`31457497428\`\n- upstream_FA490_job: \`93674247669\`\n- upstream_FA490_source: \`e1fd4d4370c14185f81faea26e09b8611bf78e19e583026e55d8ee7adbccd40d\`\n- frontier: \`35483:2 integral_selectedLogHeightEnergyDensity_stripTail_eq_iterated / index 2811\`\n- patch: \`direct mathlib setIntegral_prod with existing IntegrableOn proof\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Run FA491B exact direct Lean loop
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa491b_strip_setintegral_prod_candidate_ci.sh 2>&1 | tee /tmp/fa491b.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report FA491B evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa491b.md
          from pathlib import Path
          import json, os
          out=Path('build-logs/codex-fa491b-strip-setintegral-prod/candidates/norms'); p=out/'METRIC.json'; s=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); log=Path('/tmp/fa491b.log')
          xs=['## FA491B sibling observer — actual direct Lean','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`"]
          m=None
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                  xs.append(f'- {k}: `{m.get(k)}`')
              xs += ['', '### first error','```text',str(m.get('FA_first_error_message',''))[:6000],'```']
          else: xs.append('- METRIC.json: `MISSING`')
          if s.exists() and isinstance(m,dict) and m.get('FA_first_actual_error_line',0):
              a=s.read_text(encoding='utf-8',errors='replace').splitlines(); c=m['FA_first_actual_error_line']; lo,hi=max(1,c-14),min(len(a),c+28); xs += ['',f'### candidate source around line {c}','```lean','\n'.join(f'{i}: {a[i-1]}' for i in range(lo,hi+1)),'```']
          if log.exists(): xs += ['', '### tail','```text','\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-100:])[-12000:],'```']
          print('\n'.join(xs)[:32000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa491b.md)"
      - name: Preserve result
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
