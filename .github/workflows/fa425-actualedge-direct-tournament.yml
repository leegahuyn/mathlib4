name: FA425 actualEdge proof-body direct Lean tournament

on:
  push:
    branches:
      - fix/fa425-actualedge-proof-tournament-20260810
    paths:
      - scripts/fa425_actualedge_direct_tournament.py
      - .github/workflows/fa425-actualedge-direct-tournament.yml
      - build-logs/fa425-actualedge-direct-tournament/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa425-actualedge-direct-tournament
  cancel-in-progress: false

jobs:
  direct-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ACTIVE_BRANCH: fix/fa425-actualedge-proof-tournament-20260810

    steps:
      - name: Checkout exact FA425 controller branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa425-actualedge-proof-tournament-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run same-height theorem tournament and authoritative compile
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa425_actualedge_direct_tournament.py \
            > /tmp/fa425-console.log 2>&1
          rc=$?
          cat /tmp/fa425-console.log
          d=build-logs/fa425-actualedge-direct-tournament
          if test -f "$d/CURRENT.json"; then
            promoted=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('promoted', False)).lower())")
            fa_true=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('gates', {}).get('fa_true_pass', False)).lower())")
            all_downstream=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('gates', {}).get('all_downstream_2x', False)).lower())")
            selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('source_sha256', ''))")
            first_line=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('first_error_line', 0))")
            first_col=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('first_error_col', 0))")
          else
            promoted=false
            fa_true=false
            all_downstream=false
            selected_sha=''
            first_line=0
            first_col=0
          fi
          {
            echo "script_exit=$rc"
            echo "promoted=$promoted"
            echo "fa_true_pass=$fa_true"
            echo "all_downstream_2x=$all_downstream"
            echo "selected_sha=$selected_sha"
            echo "first_line=$first_line"
            echo "first_col=$first_col"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist only verified source improvement; retain baseline on regression
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa425-actualedge-direct-tournament
          test -f "$d/CURRENT.json" || {
            git add "$d" || true
            if ! git diff --cached --quiet; then
              git commit -m 'ci: retain FA425 infrastructure failure evidence [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
            exit 0
          }

          promoted=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('promoted', False)).lower())")
          if test "$promoted" = true; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
            sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
            if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
            msg="fix: promote FA425 ${metric} direct-verified source ${sha:0:12} [skip ci]"
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d"
            msg='evidence: retain current FA champion after FA425 tournament [skip ci]'
          fi

          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

          if test "$promoted" = true; then
            sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
            if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
            immutable="champion/fa425-${metric}-${sha:0:12}-${GITHUB_RUN_ID}"
            git push origin "HEAD:refs/heads/${immutable}"
            printf '%s\n' "$immutable" > "$d/IMMUTABLE_CHAMPION_BRANCH.txt"
          fi

      - name: Upload full FA425 direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa425-actualedge-direct-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa425-actualedge-direct-tournament
            /tmp/fa425-console.log
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce module completion separately from frontier promotion
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.tournament.outputs.fa_true_pass }}
          ALL_DOWNSTREAM_2X: ${{ steps.tournament.outputs.all_downstream_2x }}
        shell: bash
        run: |
          echo "FA_TRUE_PASS=${FA_TRUE_PASS:-false}"
          echo "ALL_DOWNSTREAM_2X=${ALL_DOWNSTREAM_2X:-false}"
          test "${FA_TRUE_PASS:-false}" = true
