name: FA442 sequential direct tournament recovery

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fa442-sequential-direct-tournament-20260810
    paths:
      - build-logs/fa442-sequential/REQUESTED.txt

permissions:
  contents: write
  actions: read

concurrency:
  group: fa442-sequential-direct-tournament
  cancel-in-progress: false

env:
  REPAIR_BRANCH: fix/fa442-sequential-direct-tournament-20260810
  BASELINE_SHA256: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
  BASELINE_LINE_COUNT: '60453'
  FA_MAX_ERRORS: '2000'

jobs:
  direct-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout sequential repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa442-sequential-direct-tournament-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fa442-lean-install-ok
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa442-lean-version.txt
          cp /tmp/fa442-lean-version.txt /tmp/fa442-verify-lean-version.txt
          lake --version | tee /tmp/fa442-lake-version.txt
          cp /tmp/fa442-lake-version.txt /tmp/fa442-verify-lake-version.txt
          lake exe cache get | tee /tmp/fa442-cache-get.log
          touch /tmp/fa442-lean-install-ok

      - name: Diagnose FA442 and recover exact baseline/candidates
        id: prepare
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fa442_pipeline_prepare.py

      - name: Directly compile every recovered baseline/candidate variant
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa442-pipeline-repair/matrix-results
          mkdir -p build-logs/fa442-pipeline-repair/matrix-results
          python3 - <<'PY' > /tmp/fa442-matrix.tsv
          import json
          row=json.load(open('build-logs/fa442-pipeline-repair/prep/matrix.json', encoding='utf-8'))
          for x in row['include']:
              print('\t'.join([
                  x['variant'].replace('\t',' '), x['slug'], x['sha256'],
                  'true' if x['is_baseline'] else 'false'
              ]))
          PY
          infra=0
          while IFS=$'\t' read -r variant slug sha is_baseline; do
            echo "=== DIRECT LEAN VARIANT: $variant / $sha ==="
            VARIANT="$variant" \
            VARIANT_SLUG="$slug" \
            EXPECTED_SHA256="$sha" \
            IS_BASELINE="$is_baseline" \
            CANDIDATE_BUNDLE_ROOT="build-logs/fa442-pipeline-repair/prep/candidate-bundle" \
            BASELINE_META_PATH="build-logs/fa442-pipeline-repair/prep/baseline-meta.json" \
            LEAN_INSTALL_MARKER="/tmp/fa442-lean-install-ok" \
              python3 scripts/fa442_pipeline_metric.py
            rc=$?
            if test "$rc" -ne 0; then infra=1; fi
          done < /tmp/fa442-matrix.tsv
          echo "infra_failure=$infra" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Strict selector over current-run direct metrics
        id: select
        shell: bash
        env:
          METRICS_ROOT: build-logs/fa442-pipeline-repair/matrix-results
          PREP_ROOT: build-logs/fa442-pipeline-repair/prep
        run: |
          set -euo pipefail
          python3 scripts/fa442_pipeline_select.py

      - name: Persist selected source with selected/worktree/HEAD identity
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          selected_sha=$(python3 -c "import json; print(json.load(open('build-logs/fa442-pipeline-repair/selection/selection.json'))['selected']['source_sha256'])")
          classification=$(python3 -c "import json; print(json.load(open('build-logs/fa442-pipeline-repair/selection/selection.json'))['classification'])")
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean /tmp/fa442-selected.lean
          rm -rf /tmp/fa442-selection
          cp -a build-logs/fa442-pipeline-repair/selection /tmp/fa442-selection
          git fetch origin "${REPAIR_BRANCH}"
          git reset --hard "origin/${REPAIR_BRANCH}"
          cp /tmp/fa442-selected.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          rm -rf build-logs/fa442-pipeline-repair/selection
          cp -a /tmp/fa442-selection build-logs/fa442-pipeline-repair/selection
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$selected_sha"
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa442-pipeline-repair/selection
          if ! git diff --cached --quiet; then
            git commit -m "fix: sequential FA442 ${classification} [skip ci]"
          fi
          worktree_sha=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          head_source_sha=$(git show HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | sha256sum | awk '{print $1}')
          test "$selected_sha" = "$worktree_sha"
          test "$selected_sha" = "$head_source_sha"
          export SELECTED_SHA="$selected_sha" WORKTREE_SHA="$worktree_sha" HEAD_SOURCE_SHA="$head_source_sha"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          Path('build-logs/fa442-pipeline-repair/selection/CHECKED_IN_IDENTITY.json').write_text(
            json.dumps({
              'selected_sha': os.environ['SELECTED_SHA'],
              'worktree_sha': os.environ['WORKTREE_SHA'],
              'HEAD_source_sha': os.environ['HEAD_SOURCE_SHA'],
              'identity_ok': os.environ['SELECTED_SHA'] == os.environ['WORKTREE_SHA'] == os.environ['HEAD_SOURCE_SHA'],
            }, indent=2)+'\n', encoding='utf-8')
          PY
          git add build-logs/fa442-pipeline-repair/selection/CHECKED_IN_IDENTITY.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record sequential selected source identity [skip ci]'
          fi
          git push origin "HEAD:refs/heads/${REPAIR_BRANCH}"
          echo "selected_sha=$selected_sha" >> "$GITHUB_OUTPUT"

      - name: Checked-in FA direct compile run1/run2 and trust audit
        id: verify
        shell: bash
        env:
          EXPECTED_SELECTED_SHA: ${{ steps.persist.outputs.selected_sha }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa442_pipeline_verify_checked_in.py

      - name: Ordered downstream gate only after FA TRUE PASS
        id: downstream
        if: steps.verify.outputs.fa_true_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa442_pipeline_downstream.py

      - name: Generate preliminary report
        if: always()
        shell: bash
        env:
          REPORT_INPUT_ROOT: build-logs/fa442-pipeline-repair
        run: |
          set -euo pipefail
          python3 scripts/fa442_pipeline_report.py
          python3 scripts/fa442_pipeline_report_strict.py

      - name: Upload full sequential evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa442-sequential-direct-evidence-${{ github.run_id }}
          path: build-logs/fa442-pipeline-repair
          if-no-files-found: error
          retention-days: 90

      - name: Finalize and commit report with artifact ID
        if: always()
        shell: bash
        env:
          REPORT_INPUT_ROOT: build-logs/fa442-pipeline-repair
          FINAL_ARTIFACT_ID: ${{ steps.evidence.outputs.artifact-id }}
        run: |
          set -euo pipefail
          python3 scripts/fa442_pipeline_report.py
          python3 scripts/fa442_pipeline_report_strict.py
          rm -rf /tmp/fa442-final-report
          cp -a build-logs/fa442-pipeline-repair/final-report /tmp/fa442-final-report
          git fetch origin "${REPAIR_BRANCH}"
          git reset --hard "origin/${REPAIR_BRANCH}"
          rm -rf build-logs/fa442-pipeline-repair/final-report
          cp -a /tmp/fa442-final-report build-logs/fa442-pipeline-repair/final-report
          git add build-logs/fa442-pipeline-repair/final-report
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record sequential FA442 repair report [skip ci]'
            git push origin "HEAD:refs/heads/${REPAIR_BRANCH}"
          fi

      - name: Enforce every variant direct-executed and no current infrastructure failure
        if: always()
        shell: bash
        env:
          TOURNAMENT_INFRA: ${{ steps.tournament.outputs.infra_failure }}
        run: |
          set -euo pipefail
          test "${TOURNAMENT_INFRA:-1}" = 0
          python3 - <<'PY'
          import json
          p='build-logs/fa442-pipeline-repair/final-report/FA_MATRIX_PIPELINE_REPAIR_REPORT.json'
          row=json.load(open(p, encoding='utf-8'))
          if row.get('final_classification') == 'INFRA FAILURE':
              raise SystemExit(1)
          PY
