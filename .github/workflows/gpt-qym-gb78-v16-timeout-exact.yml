name: GPT QYM GB78 V16 timeout exact

on:
  push:
    branches:
      - gpt/qym-gb78-v16-timeout-exact-20260820
    paths:
      - .github/workflows/gpt-qym-gb78-v16-timeout-exact.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gpt-qym-gb78-v16-timeout-exact
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: gpt/qym-gb78-v16-timeout-exact-20260820
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-gb78-v16-timeout
      BASE_SHA256: c1498d669d3f43cda50edf7b61b33c865b00f6fe65ea95d9f1ab3c07794d1235
      BASE_BLOB: 75c2eab05b4298d94246a6b0757f98a6ff5c02fe
      BASE_ERRORS: '78'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Gate exact GB78 source and programs
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          python3 -m py_compile .github/qym_patch_gb78_v16_timeout.py .github/qym_gb78_v16_timeout_driver.py
          mkdir -p "$OUT" "$OLEAN"
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for a in 1 2 3 4 5; do elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break || sleep $((a*5)); done
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          for a in 1 2 3 4 5; do lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break || sleep $((a*5)); done
      - name: Restore QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-
      - name: Ensure completed dependencies only
        shell: bash
        run: |
          set -euo pipefail
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$s.olean" || ! -s "$OLEAN/$s.ilean" ]]; then
              cap=1
              if [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]]; then cap=2000; fi
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            fi
            test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"
          done
      - name: Run V16 timeout full-QYM tournament
        shell: bash
        run: python3 -B .github/qym_gb78_v16_timeout_driver.py
      - name: Promote verified strict V16 frontier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/QYM.best.lean" && test -s "$OUT/BEST_RESULT.json"
          errors="$(jq -r '.error_headers' "$OUT/BEST_RESULT.json")"
          panic="$(jq -r '.panic_lines' "$OUT/BEST_RESULT.json")"
          strict="$(jq -r '.strict_improvement' "$OUT/BEST_RESULT.json")"
          test "$errors" -lt "$BASE_ERRORS" && test "$panic" -eq 0 && test "$strict" = true
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$OUT/BEST_RESULT.json")"
          candidate_blob="$(jq -r '.candidate_qym_blob' "$OUT/BEST_RESULT.json")"
          test "$(sha256sum "$OUT/QYM.best.lean" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$OUT/QYM.best.lean")" = "$candidate_blob"
          cp "$OUT/QYM.best.lean" "$QYM"
          mkdir -p .github/qym-frontier
          cp "$OUT/BEST_RESULT.json" .github/qym-frontier/GB78_V16_RESULT.json
          cp "$OUT/SELECTION.json" .github/qym-frontier/GB78_V16_SELECTION.json
          jq -n --arg branch "$BRANCH" --arg qym_sha "$candidate_sha" --arg qym_blob "$candidate_blob" --argjson errors "$errors" --argjson run_id "$GITHUB_RUN_ID" --arg trigger_sha "$GITHUB_SHA" '{schema:"qym-v16-promotion-v1",branch:$branch,run_id:$run_id,trigger_sha:$trigger_sha,error_headers:$errors,panic_lines:0,qym_sha256:$qym_sha,qym_blob:$qym_blob,status:"PROMOTED_FROM_GB78"}' > .github/qym-frontier/GB78_V16_PROMOTION_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" .github/qym-frontier/GB78_V16_RESULT.json .github/qym-frontier/GB78_V16_SELECTION.json .github/qym-frontier/GB78_V16_PROMOTION_STATUS.json
          git commit -m "QYM V16: promote verified ${errors}-error timeout frontier"
          git push origin "HEAD:$BRANCH"
      - name: Restore source after non-promotion
        if: always()
        shell: bash
        run: git checkout -- "$QYM" || true
      - name: Upload immutable V16 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb78-v16-timeout-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb78-v16-timeout
          if-no-files-found: error
          retention-days: 30
