name: GPT QYM checked-in TRUE PASS verifier

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - PrimalitySheafVerification/QYM.lean
      - .github/qym-final/QYM_PASS_DECISION.json
      - .github/workflows/gpt-qym-checked-in-true-pass.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gpt-qym-checked-in-true-pass-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      BRANCH: gpt/fa-qym-clean-final-20260816
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-checked-in-pass

    steps:
      - name: Checkout exact checked-in candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Gate clean checked-in source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$OLEAN"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum "$QYM" > "$OUT/QYM.source.sha256"
          git hash-object --no-filters "$QYM" > "$OUT/QYM.source.blob"
          wc -c "$QYM" > "$OUT/QYM.source.bytes"
          awk 'END {print NR}' "$QYM" > "$OUT/QYM.source.lines"

      - name: Audit forbidden executable tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$QYM" "$OUT" <<'PY'
          from pathlib import Path
          import json, re, sys
          source = Path(sys.argv[1]).read_text(encoding='utf-8')
          # Strip nested block comments, line comments and strings conservatively before the executable audit.
          out=[]; i=0; depth=0; in_string=False; escape=False
          while i < len(source):
              if depth:
                  if source.startswith('/-', i): depth += 1; i += 2; continue
                  if source.startswith('-/', i): depth -= 1; i += 2; continue
                  i += 1; continue
              if in_string:
                  if escape: escape=False
                  elif source[i] == '\\': escape=True
                  elif source[i] == '"': in_string=False
                  i += 1; continue
              if source.startswith('/-', i): depth=1; i += 2; continue
              if source.startswith('--', i):
                  j=source.find('\n', i)
                  i=len(source) if j < 0 else j
                  continue
              if source[i] == '"': in_string=True; i += 1; continue
              out.append(source[i]); i += 1
          executable=''.join(out)
          audit={
              'sorry': len(re.findall(r'\bsorry\b', executable)),
              'admit': len(re.findall(r'\badmit\b', executable)),
              'native_decide': len(re.findall(r'\bnative_decide\b', executable)),
              'Lean.ofReduceBool': executable.count('Lean.ofReduceBool'),
              'global_axiom': len(re.findall(r'(?m)^\s*axiom\s+', executable)),
              'unsafe': len(re.findall(r'(?m)^\s*unsafe\s+', executable)),
              'maxHeartbeats_zero': len(re.findall(r'set_option\s+maxHeartbeats\s+0\b', executable)),
          }
          Path(sys.argv[2], 'forbidden-audit.json').write_text(
              json.dumps(audit, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          if any(audit.values()): raise SystemExit(audit)
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure exact dependency objects
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean"
            test -s "$OLEAN/$s.ilean"
          done

      - name: Remove every prior QYM object
        shell: bash
        run: |
          set -euo pipefail
          rm -f \
            "$OLEAN/QYM.olean" \
            "$OLEAN/QYM.ilean" \
            "$OLEAN/QYM.olean.private"
          test ! -e "$OLEAN/QYM.olean"
          test ! -e "$OLEAN/QYM.ilean"

      - name: Direct compile checked-in QYM without runtime patch
        shell: bash
        run: |
          set -euo pipefail
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$OLEAN/QYM.olean" -i "$OLEAN/QYM.ilean" "$QYM" > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OLEAN/QYM.olean" -i "$OLEAN/QYM.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$OLEAN/QYM.olean"
            test -s "$OLEAN/QYM.ilean"
            sha256sum "$OLEAN/QYM.olean" "$OLEAN/QYM.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Produce authoritative checked-in result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$QYM" "$OLEAN" "$OUT" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, os, re, subprocess, sys
          source, olean_root, out = map(Path, sys.argv[1:])
          raw = (out / 'QYM.log').read_bytes() if (out / 'QYM.log').exists() else b''
          text = raw.decode(errors='replace')
          p = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
                         r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*'
                         r'(?P<message>.*)$', re.M)
          rows=[]
          for m in p.finditer(text):
              x=m.groupdict(); x['line']=int(x['line']); x['column']=int(x['column']); rows.append(x)
          errors=[x for x in rows if x['severity']=='error']
          warnings=[x for x in rows if x['severity']=='warning']
          panics=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          rc=int((out/'QYM.exit').read_text().strip()) if (out/'QYM.exit').exists() else None
          source_raw=source.read_bytes()
          blob=subprocess.check_output(['git','hash-object','--no-filters',str(source)], text=True).strip()
          status=subprocess.check_output(['git','status','--porcelain=v1','--untracked-files=all'], text=True)
          olean=olean_root/'QYM.olean'; ilean=olean_root/'QYM.ilean'
          result={
              'schema':'qym-checked-in-true-pass-v1',
              'github_sha':os.environ['GITHUB_SHA'],
              'source_sha256':hashlib.sha256(source_raw).hexdigest(),
              'source_blob':blob,
              'source_bytes':len(source_raw),
              'source_lf':source_raw.count(b'\n'),
              'exit':rc,
              'error_headers':len(errors),
              'warning_headers':len(warnings),
              'error_codes':dict(sorted(collections.Counter(x['code'] or 'uncoded' for x in errors).items())),
              'first_error':errors[0] if errors else None,
              'last_error':errors[-1] if errors else None,
              'panic_lines':len(panics),
              'olean_exists':olean.is_file() and olean.stat().st_size>0,
              'ilean_exists':ilean.is_file() and ilean.stat().st_size>0,
              'olean_sha256':hashlib.sha256(olean.read_bytes()).hexdigest() if olean.is_file() else None,
              'ilean_sha256':hashlib.sha256(ilean.read_bytes()).hexdigest() if ilean.is_file() else None,
              'log_sha256':hashlib.sha256(raw).hexdigest(),
              'git_status_clean':status == '',
              'runtime_patch_required':False,
          }
          result['semantic_pass']=(
              result['exit']==0 and result['error_headers']==0 and result['panic_lines']==0 and
              result['olean_exists'] and result['ilean_exists'] and result['git_status_clean'])
          (out/'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in rows))
          (out/'QYM.error-headers.txt').write_text(''.join(
              f"{x['file']}:{x['line']}:{x['column']}: error{('('+x['code']+')') if x['code'] else ''}: {x['message']}\n"
              for x in errors))
          (out/'QYM.panic-lines.txt').write_text(''.join(x+'\n' for x in panics))
          (out/'QYM_TRUE_PASS.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Upload checked-in TRUE PASS evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-checked-in-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-checked-in-pass/**
          if-no-files-found: error
          retention-days: 30

      - name: Commit verified QYM TRUE PASS marker
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/QYM_TRUE_PASS.json" <<'PY'
          import json, sys
          result=json.load(open(sys.argv[1],encoding='utf-8'))
          if not result['semantic_pass']:
              raise SystemExit(result['exit'] or 1)
          PY
          mkdir -p .github/qym-final
          cp "$OUT/QYM_TRUE_PASS.json" .github/qym-final/QYM_TRUE_PASS.json
          cp "$OUT/QYM.outputs.sha256" .github/qym-final/QYM.outputs.sha256
          cp "$OUT/QYM.command" .github/qym-final/QYM.command
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/qym-final
          git commit -m "QYM: record checked-in direct Lean TRUE PASS"
          git push origin "HEAD:$BRANCH"
