name: Focused Mock2 Advanced v61-v68 candidate materialization

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-m2a-v68-materialize-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-m2a-v68-materialize
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      CANDIDATE_MARKER: .ci/focused/mock2_advanced_candidate.json
      LOGDIR: focused-proof/Mock2_Advanced-candidate

    steps:
      - name: Clone exact triggering HEAD and record snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p "${LOGDIR}"
          git status --porcelain=v1 > "${LOGDIR}/initial-status.txt"
          test ! -s "${LOGDIR}/initial-status.txt"
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "base_master_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "m2a_start_blob=$(git hash-object "${TARGET}")" \
            "m2a_start_sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
            "qym_blob=$(git hash-object PrimalitySheafVerification/QYM.lean)" \
            > "${LOGDIR}/snapshot.txt"
          for v in $(seq 61 68); do
            test -f "scripts/repair_mock2_advanced_v${v}.py"
            sha256sum "scripts/repair_mock2_advanced_v${v}.py"
          done | tee "${LOGDIR}/repair-script-sha256.txt"

      - name: Install exact Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get | tee "${LOGDIR}/cache-get.log"

      - name: Compile checked-in Mock2 and inspect current Mock2 Advanced
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          rm -f "$out/Mock2.olean" "$out/Mock2.ilean" "$out/Mock2.olean.private"
          set +e
          lake env lean "${MOCK2}" -o "$out/Mock2.olean" -i "$out/Mock2.ilean" \
            > "${LOGDIR}/Mock2-regression-prerequisite.log" 2>&1
          mock2_code=$?
          set -e
          test "$mock2_code" -eq 0
          test -s "$out/Mock2.olean"; test -s "$out/Mock2.ilean"
          test "$(grep -c 'error:' "${LOGDIR}/Mock2-regression-prerequisite.log" || true)" -eq 0
          rm -f "$out/Mock2_Advanced.olean" "$out/Mock2_Advanced.ilean" "$out/Mock2_Advanced.olean.private"
          set +e
          lake env lean "${TARGET}" -o "$out/Mock2_Advanced.olean" -i "$out/Mock2_Advanced.ilean" \
            > "${LOGDIR}/Mock2_Advanced-checked-in-smoke.log" 2>&1
          code=$?
          set -e
          echo "$code" > "${LOGDIR}/Mock2_Advanced-checked-in-smoke-exit.txt"
          if [[ "$code" -eq 0 ]]; then
            echo 'mode=checked-in' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=repair' >> "$GITHUB_OUTPUT"
            {
              echo "first_error=$(grep -n 'error:' "${LOGDIR}/Mock2_Advanced-checked-in-smoke.log" | head -1 || true)"
              echo "total_errors=$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-checked-in-smoke.log" || true)"
              echo "last_error=$(grep -n 'error:' "${LOGDIR}/Mock2_Advanced-checked-in-smoke.log" | tail -1 || true)"
              echo "maximum_error_limit=$(grep -Eci 'maximum number of errors' "${LOGDIR}/Mock2_Advanced-checked-in-smoke.log" || true)"
            } | tee -a "${LOGDIR}/snapshot.txt"
          fi

      - name: Reproduce v61-v68 candidate independently twice
        if: steps.inspect.outputs.mode == 'repair'
        shell: bash
        run: |
          set -euo pipefail
          make_candidate() {
            local dir="$1"
            git clone --no-hardlinks . "$dir" >/dev/null
            cd "$dir"
            for v in $(seq 61 68); do
              python3 "scripts/repair_mock2_advanced_v${v}.py" \
                >> "${GITHUB_WORKSPACE}/${LOGDIR}/$(basename "$dir")-repair.log" 2>&1
            done
            while IFS= read -r changed; do
              [[ -z "$changed" || "$changed" == "${TARGET}" ]] || \
                git restore --source=HEAD --worktree -- "$changed"
            done < <(git diff --name-only)
            test "$(git diff --name-only)" = "${TARGET}"
            git diff --check
            sha256sum "${TARGET}" | awk '{print $1}' > /tmp/"$(basename "$dir")".sha
            git hash-object "${TARGET}" > /tmp/"$(basename "$dir")".blob
          }
          make_candidate /tmp/m2a-repro-a
          make_candidate /tmp/m2a-repro-b
          cmp -s /tmp/m2a-repro-a.sha /tmp/m2a-repro-b.sha
          cmp -s /tmp/m2a-repro-a.blob /tmp/m2a-repro-b.blob
          cmp -s /tmp/m2a-repro-a/"${TARGET}" /tmp/m2a-repro-b/"${TARGET}"
          cp /tmp/m2a-repro-a/"${TARGET}" "${TARGET}"
          test "$(git diff --name-only)" = "${TARGET}"
          git diff --check
          printf '%s\n' \
            "repair_scripts=v61-v68" \
            "candidate_sha256=$(cat /tmp/m2a-repro-a.sha)" \
            "candidate_blob=$(cat /tmp/m2a-repro-a.blob)" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Select already-compiling checked-in source
        if: steps.inspect.outputs.mode == 'checked-in'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' \
            "repair_scripts=none" \
            "candidate_sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
            "candidate_blob=$(git hash-object "${TARGET}")" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Prove theorem interface unchanged and audit forbidden tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/interface-and-trust-audit.txt"
          from pathlib import Path
          import hashlib,re,subprocess
          path='PrimalitySheafVerification/Mock2_Advanced.lean'
          src=Path(path).read_text(encoding='utf-8')
          baseline=subprocess.check_output(['git','show',f'HEAD:{path}'],text=True)
          def clean(src):
            out=[]; i=0; d=0; s=False; e=False
            while i<len(src):
              if d:
                if src.startswith('/-',i): d+=1; out+=[' ',' ']; i+=2
                elif src.startswith('-/',i): d-=1; out+=[' ',' ']; i+=2
                else: out.append('\n' if src[i]=='\n' else ' '); i+=1
              elif s:
                c=src[i]; out.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1
              elif src.startswith('/-',i): d=1; out+=[' ',' ']; i+=2
              elif src.startswith('--',i):
                while i<len(src) and src[i]!='\n': out.append(' '); i+=1
              elif src[i]=='"': s=True; out.append(' '); i+=1
              else: out.append(src[i]); i+=1
            if d or s: raise SystemExit('unterminated comment/string')
            return ''.join(out)
          def theorem_digest(code):
            sigs=[]
            for m in re.finditer(r'(?m)^\s*(?:theorem|lemma)\s+([^\s:(]+)',code):
              start=m.start(); end=len(code)
              nxt=re.search(r'(?m)^\s*(?:theorem|lemma|def|structure|class|instance|abbrev|inductive)\s+',code[m.end():])
              if nxt: end=m.end()+nxt.start()
              block=code[start:end]
              cut=re.search(r'(?m)\s+:=\s*by\b|(?m)\s+:=|(?m)^\s*where\s*$',block)
              if cut: block=block[:cut.start()]
              sigs.append(' '.join(block.split()))
            return hashlib.sha256('\n'.join(sigs).encode()).hexdigest(),len(sigs)
          code=clean(src); base=clean(baseline)
          pats={
            'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b',
            'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
            'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b','by_contra!':r'\bby_contra!\b'}
          counts={k:len(re.findall(v,code)) for k,v in pats.items()}
          for k,v in counts.items(): print(f'{k}: {v}')
          if any(counts.values()): raise SystemExit(1)
          before,n0=theorem_digest(base); after,n1=theorem_digest(code)
          print('baseline_theorem_count:',n0); print('candidate_theorem_count:',n1)
          print('baseline_theorem_signature_sha256:',before)
          print('candidate_theorem_signature_sha256:',after)
          if before != after: raise SystemExit('theorem or lemma interface changed')
          Path('/tmp/m2a-theorem-signature.sha').write_text(after+'\n')
          PY

      - name: Compile exact candidate twice after deleting project artifacts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          for pass in 1 2; do
            rm -f "$out/Mock2_Advanced.olean" "$out/Mock2_Advanced.ilean" "$out/Mock2_Advanced.olean.private"
            set +e
            lake env lean "${TARGET}" -o "$out/Mock2_Advanced.olean" -i "$out/Mock2_Advanced.ilean" \
              > "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" 2>&1
            code=$?
            set -e
            echo "$code" > "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}-exit.txt"
            {
              echo "pass${pass}_exit=${code}"
              echo "pass${pass}_errors=$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" || true)"
              echo "pass${pass}_warnings=$(grep -c 'warning:' "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" || true)"
            } >> "${LOGDIR}/snapshot.txt"
            if [[ "$code" -ne 0 ]]; then
              grep -n 'error:' "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" | head -10 \
                > "${LOGDIR}/pass${pass}-first-independent-errors.txt" || true
              grep -n 'error:' "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" | tail -1 \
                > "${LOGDIR}/pass${pass}-last-error.txt" || true
              exit "$code"
            fi
            test -s "$out/Mock2_Advanced.olean"
            test -s "$out/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "${LOGDIR}/Mock2_Advanced-candidate-pass${pass}.log"
            ! grep -a -q 'sorryAx' "$out/Mock2_Advanced.olean"
          done
          sha256sum "${MOCK2}" "${TARGET}" \
            "$out/Mock2.olean" "$out/Mock2.ilean" \
            "$out/Mock2_Advanced.olean" "$out/Mock2_Advanced.ilean" \
            | tee "${LOGDIR}/candidate-source-and-artifact-sha256.txt"

      - name: Build candidate marker and proof bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          p=Path('PrimalitySheafVerification/Mock2_Advanced.lean')
          marker={
            'constructed_from_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'starting_source_blob':subprocess.check_output(['git','rev-parse','HEAD:PrimalitySheafVerification/Mock2_Advanced.lean'],text=True).strip(),
            'source_blob':subprocess.check_output(['git','hash-object',str(p)],text=True).strip(),
            'source_sha256':hashlib.sha256(p.read_bytes()).hexdigest(),
            'theorem_signature_sha256':Path('/tmp/m2a-theorem-signature.sha').read_text().strip(),
            'repair_chain':'v61-v68 when checked-in source did not compile',
            'candidate_clean_pass_1':0,'candidate_clean_pass_2':0,'error_count':0,
            'maximum_error_limit':False,'forbidden_tokens':0,'sorryAx':0,
            'new_global_axioms':0,'theorem_statements_changed':False,'assumptions_changed':False
          }
          Path('/tmp/mock2_advanced_candidate.json').write_text(json.dumps(marker,indent=2)+'\n')
          PY
          tar -czf /tmp/mock2-advanced-candidate-proof.tar.gz "${LOGDIR}"

      - name: Upload candidate proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: focused-mock2-advanced-candidate-${{ github.sha }}
          path: /tmp/mock2-advanced-candidate-proof.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Materialize only the twice-verified source and marker
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          mkdir -p "$(dirname "${CANDIDATE_MARKER}")"
          cp /tmp/mock2_advanced_candidate.json "${CANDIDATE_MARKER}"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}" "${CANDIDATE_MARKER}"
          changed="$(git diff --cached --name-only | sort)"
          if git diff --cached --quiet -- "${TARGET}"; then
            test "$changed" = "${CANDIDATE_MARKER}"
          else
            expected="$(printf '%s\n' "${CANDIDATE_MARKER}" "${TARGET}" | sort)"
            test "$changed" = "$expected"
          fi
          git commit -m 'fix: materialize verified Mock2 Advanced v68 source'
          git push origin "HEAD:${BRANCH}"
