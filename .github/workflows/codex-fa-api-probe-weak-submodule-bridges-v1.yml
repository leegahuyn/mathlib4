name: Codex FA API probe weak submodule bridges v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-weak-submodule-bridges-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Prove generic bridge shapes
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeWeakBridges.lean <<'LEAN'
          import Mathlib
          #check Submodule.mem_inf
          #check isClosed_iInter
          example {E : Type*} [AddCommMonoid E] [Module ℂ E]
              (A B : Submodule ℂ E) (x : E) :
              x ∈ A ⊓ B ↔ x ∈ A ∧ x ∈ B := by
            exact Submodule.mem_inf
          example {E F : Type*} (y : F) (z : E) (y' : F)
              (hy : y' = (y,z).1) : y' = y := by
            simpa only [Prod.fst] using hy
          example {E F : Type*} (y : F) (z : E) (z' : E)
              (hz : z' = (y,z).2) : z' = z := by
            simpa only [Prod.snd] using hz
          example {E : Type*} [NormedAddCommGroup E] (x : E)
              (hx : x = 0) : ‖x‖ = 0 := by
            simp [hx]
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeWeakBridges.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-weak-submodule-bridges-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
