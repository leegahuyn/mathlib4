name: Watch FunctionalAnalysis PASS then verify QYM

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-qym-watch-after-fa.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: priority-qym-watch-after-fa
  cancel-in-progress: false

jobs:
  wait-and-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      FA_RESULT: build-logs/priority-stage2-fa-result.txt
      QYM_RESULT: build-logs/priority-stage3-qym-result.txt

    steps:
      - name: Clone repository shell
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Wait for isolated FunctionalAnalysis direct PASS
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 180); do
            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            if git cat-file -e "FETCH_HEAD:${FA_RESULT}" 2>/dev/null; then
              git show "FETCH_HEAD:${FA_RESULT}" > /tmp/fa-result.txt
              if grep -Fxq 'stage=Mock2_FunctionalAnalysis' /tmp/fa-result.txt && \
                 grep -Fxq 'status=PASS' /tmp/fa-result.txt && \
                 grep -Fxq 'runtime_repair_during_final_direct=0' /tmp/fa-result.txt && \
                 grep -Eq '^Mock2_Advanced,pass[12],0,0,' /tmp/fa-result.txt && \
                 grep -Eq '^Mock2_FunctionalAnalysis,pass[12],0,0,' /tmp/fa-result.txt; then
                ready=1
                break
              fi
            fi
            echo "FunctionalAnalysis PASS not available yet; attempt ${attempt}/180"
            sleep 60
          done
          test "${ready}" -eq 1
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Directly verify QYM and all dependencies twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage3_qym.sh

      - name: Post direct PASS evidence to PR 7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git show "FETCH_HEAD:${QYM_RESULT}" > /tmp/qym-result.txt
          grep -Fxq 'status=PASS' /tmp/qym-result.txt
          grep -Fxq 'runtime_repair_scripts=0' /tmp/qym-result.txt
          grep -Fxq 'Mock2_Advanced=PASS' /tmp/qym-result.txt
          grep -Fxq 'Mock2_FunctionalAnalysis=PASS' /tmp/qym-result.txt
          grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' /tmp/qym-result.txt
          grep -Fxq 'QYM=PASS' /tmp/qym-result.txt
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," /tmp/qym-result.txt
            grep -Eq "^${module},pass2,0,0," /tmp/qym-result.txt
          done
          python3 - <<'PY' > /tmp/comment.json
          import json
          from pathlib import Path
          result = Path('/tmp/qym-result.txt').read_text(encoding='utf-8')
          head = next(line.split('=',1)[1] for line in result.splitlines() if line.startswith('verified_source_head='))
          rows = '\n'.join(line for line in result.splitlines()
                           if line.startswith(('Mock2,pass','Mock2_Advanced,pass',
                                               'Mock2_FunctionalAnalysis,pass',
                                               'Mock2_FunctionalAnalysis_Integrated,pass',
                                               'QYM,pass')))
          body = f'''## Mock2 Advanced / FunctionalAnalysis / QYM direct-source PASS

Verified source head: `{head}`

The checked-in sources were compiled twice in dependency order with no runtime repair scripts:

- `Mock2_Advanced`: PASS
- `Mock2_FunctionalAnalysis`: PASS
- `Mock2_FunctionalAnalysis_Integrated`: PASS
- `QYM` / Mock3: PASS

```text
{rows}
```
'''
          print(json.dumps({'body': body}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --data-binary @/tmp/comment.json
