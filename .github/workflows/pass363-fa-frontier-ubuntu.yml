name: PASS 363 FunctionalAnalysis frontier Ubuntu
on:
  push:
    branches: [fix/fa363-final-isolated-20260808]
    paths:
      - '.github/workflows/pass363-fa-frontier-ubuntu.yml'
      - 'scripts/diagnose_pass363_fa.sh'
      - 'scripts/apply_three_hundred_sixty_third_pass_functional_analysis_repairs.py'
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: fa363-frontier-ubuntu
  cancel-in-progress: true
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PASS 363 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 860
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass363-fa/logs
          lean --version | tee /tmp/diagnose-pass363-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass363-fa/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass363-fa/logs/cache-get.log
      - name: Limit diagnostics to first 100 errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/diagnose_pass341_fa.sh')
          text=path.read_text(encoding='utf-8')
          old='-DmaxErrors=2000'
          if text.count(old)!=1: raise SystemExit('expected exactly one maxErrors setting')
          path.write_text(text.replace(old,'-DmaxErrors=100'),encoding='utf-8')
          PY
      - name: Compile PASS 363 frontier
        id: diagnostic
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass363_fa.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0
      - name: Upload PASS 363 frontier diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass363-fa-frontier-${{ github.sha }}
          path: /tmp/diagnose-pass363-fa
          if-no-files-found: error
          retention-days: 90
      - name: Enforce PASS 363 frontier result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          test -n "${DIAGNOSTIC_EXIT_CODE:-}"
          exit "${DIAGNOSTIC_EXIT_CODE}"
