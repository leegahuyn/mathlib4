name: Corrected FA tournament then Mock3 QYM 2x

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fa-live-v6-tournament-20260808
    paths:
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - '.fa-v6-seeded'
      - '.fa-v6-kick'
      - '.github/workflows/fa-live-v6-tournament.yml'
      - 'scripts/github_models_fa_tournament_agent.py'
      - 'scripts/github_models_fa_tournament_agent_v2.py'
      - 'scripts/fa_full_signature_fingerprint.py'

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: persistent-fa-v6-tournament
  cancel-in-progress: false

jobs:
  tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact corrected tournament branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa-live-v6-tournament-20260808
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa-v6-lean-version.txt
          lake --version | tee /tmp/fa-v6-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/fa-v6-cache.log

      - name: Freeze public signatures once
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .fa-v6-seeded && -s .fa-v6-signatures.json ]]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          python3 scripts/fa_full_signature_fingerprint.py \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --write .fa-v6-signatures.json > /tmp/fa-v6-signatures.log
          printf 'corrected tournament signature baseline frozen\n' > .fa-v6-seeded
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .fa-v6-signatures.json .fa-v6-seeded
          git commit -m 'test(fa): freeze signatures for corrected tournament'
          git push origin HEAD:fix/fa-live-v6-tournament-20260808
          echo 'ready=false' >> "${GITHUB_OUTPUT}"

      - name: Run corrected multi-model kernel tournament
        if: steps.seed.outputs.ready == 'true'
        id: agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa-tournament-agent
          python3 scripts/github_models_fa_tournament_agent_v2.py \
            --seed PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --baseline .fa-v6-signatures.json \
            --rounds 10 --models 4 --max-errors 60 --compile-timeout 1500 \
            --materialize-progress \
            > /tmp/fa-v6-tournament.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat build-logs/fa-tournament-agent/state.json || true
          tail -800 /tmp/fa-v6-tournament.log || true
          exit 0

      - name: Enforce signatures and reject proof escapes
        if: steps.seed.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa_full_signature_fingerprint.py \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --compare .fa-v6-signatures.json
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock2_FunctionalAnalysis_Integrated*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('QYM*.lean'))
          forbidden = re.compile(
              r'(?m)^\s*(?:sorry|admit)\b|(?m)^\s*axiom\b|(?m)^\s*unsafe\b|'
              r'\bnative_decide\b|\bLean\.ofReduceBool\b'
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              match = forbidden.search(text)
              if match:
                  raise SystemExit(f'{path}: forbidden token {match.group(0)!r}')
          PY

      - name: Compile and persist only true kernel progress
        if: steps.seed.outputs.ready == 'true'
        id: persist
        shell: bash
        env:
          AGENT_RC: ${{ steps.agent.outputs.exit_code }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          evidence='/tmp/fa-v6-evidence'
          mkdir -p "${evidence}"
          cp -r build-logs/fa-tournament-agent "${evidence}/" 2>/dev/null || true
          cp /tmp/fa-v6-tournament.log "${evidence}/" 2>/dev/null || true
          set +e
          lake env lean -DmaxErrors=1 \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "${evidence}/first.log" 2>&1
          first_rc=$?
          set -e
          second_rc=99
          if [[ ${first_rc} -eq 0 ]]; then
            set +e
            lake env lean -DmaxErrors=2000 \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              > "${evidence}/second.log" 2>&1
            second_rc=$?
            set -e
          fi
          echo "first_rc=${first_rc}" >> "${GITHUB_OUTPUT}"
          echo "second_rc=${second_rc}" >> "${GITHUB_OUTPUT}"
          first_error="$(grep -m1 -E '\.lean:[0-9]+:[0-9]+:.*error' "${evidence}/first.log" || true)"
          error_count="$(grep -c -E '\.lean:[0-9]+:[0-9]+:.*error' "${evidence}/first.log" || true)"
          python3 - <<PY
          import hashlib, json, os
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          payload = {
              'agent_exit': int('${AGENT_RC:-99}'),
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'first_exit': int('${first_rc}'),
              'second_exit': int('${second_rc}'),
              'first_error_count': int('${error_count:-0}'),
              'first_error': '''${first_error}''',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': os.environ['GITHUB_SHA'],
          }
          Path('.fa-v6-frontier.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
          if [[ ${first_rc} -eq 0 && ${second_rc} -eq 0 ]]; then
            echo 'fa_pass=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'fa_pass=false' >> "${GITHUB_OUTPUT}"
          if git diff --quiet -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean; then
            echo 'No true kernel improvement was produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean .fa-v6-frontier.json
          git commit -m 'fix(fa): accept corrected tournament winner'
          git push origin HEAD:fix/fa-live-v6-tournament-20260808

      - name: Verify FA Integrated Mock3 and QYM twice in strict order
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v6-final'
          mkdir -p "${root}" "${logs}"
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          compile_twice PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          echo FA_2X_DIRECT_SOURCE_PASS > "${logs}/FA_2X_PASS.txt"
          mapfile -t middle < <({
            find PrimalitySheafVerification -maxdepth 1 -type f \
              -name 'Mock2_FunctionalAnalysis_Integrated*.lean'
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean'
          } | sort -u)
          test ${#middle[@]} -gt 0
          printf '%s\n' "${middle[@]}" > "${logs}/Integrated-Mock3-targets.txt"
          for src in "${middle[@]}"; do compile_twice "${src}"; done
          echo INTEGRATED_MOCK3_2X_DIRECT_SOURCE_PASS > "${logs}/INTEGRATED_MOCK3_2X_PASS.txt"
          mapfile -t qym < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'QYM*.lean' | sort
          )
          test ${#qym[@]} -gt 0
          printf '%s\n' "${qym[@]}" > "${logs}/QYM-targets.txt"
          for src in "${qym[@]}"; do compile_twice "${src}"; done
          echo QYM_2X_DIRECT_SOURCE_PASS > "${logs}/QYM_2X_PASS.txt"

      - name: Commit final strict-order PASS marker
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fa-v6-final/FA_2X_PASS.txt
          test -s /tmp/fa-v6-final/INTEGRATED_MOCK3_2X_PASS.txt
          test -s /tmp/fa-v6-final/QYM_2X_PASS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          payload = {
              'status': 'PASS',
              'strict_order': [
                  'Mock2_FunctionalAnalysis twice',
                  'Integrated and every actual Mock3 twice',
                  'every QYM twice',
              ],
              'fa_source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': os.environ['GITHUB_SHA'],
          }
          path = Path('build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            .fa-v6-frontier.json build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record corrected-tournament FA Mock3 QYM two-run PASS'
            git push origin HEAD:fix/fa-live-v6-tournament-20260808
          fi

      - name: Upload corrected tournament evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-v6-tournament-${{ github.sha }}
          path: |
            /tmp/fa-v6-evidence
            /tmp/fa-v6-final
            /tmp/fa-v6-lean-version.txt
            /tmp/fa-v6-lake-version.txt
            /tmp/fa-v6-cache.log
            /tmp/fa-v6-signatures.log
            .fa-v6-frontier.json
            build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90
