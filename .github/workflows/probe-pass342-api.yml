name: Probe PASS 342 Lean APIs

on:
  pull_request:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/probe-pass342-api.yml'
      - 'scripts/probe_pass342_api.sh'
      - 'scripts/probe_pass342_addgroup.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: probe-pass342-api-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 8
          persist-credentials: false

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Compile PASS 342 API and AddCommGroup probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/probe_pass342_addgroup.sh

      - name: Upload API probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass342-api-probe-${{ env.SOURCE_SHA }}
          path: /tmp/pass342-api-probe
          if-no-files-found: error
          retention-days: 90
