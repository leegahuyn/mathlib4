name: GPT-5.6 focused PASS 337 FunctionalAnalysis

on:
  pull_request:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/gpt56-focused-pass337-fa.yml'
      - 'scripts/gpt56_diagnose_pass337_fa.sh'
      - 'scripts/apply_three_hundred_thirty_seventh_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: gpt56-focused-pass337-fa-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout exact isolated head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 160
          persist-credentials: false

      - name: Install coreutils, pinned Lean, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "${GITHUB_PATH}"
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${PATH}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          sha256sum --version | head -1
          lake exe cache get

      - name: Reconstruct and compile focused PASS 337 FA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${HOME}/.elan/bin:${PATH}"
          bash scripts/gpt56_diagnose_pass337_fa.sh

      - name: Upload focused PASS 337 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt56-focused-pass337-fa-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/gpt56-focused-pass337-fa
          if-no-files-found: error
          retention-days: 90
