name: GPT-5.6 focused PASS 337 FunctionalAnalysis

on:
  push:
    branches: [fix/pr9-fa-gpt56-isolated-20260808]
    paths:
      - '.github/workflows/gpt56-focused-pass337-fa.yml'
      - 'scripts/gpt56_diagnose_pass337_fa.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gpt56-focused-pass337-fa
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: macos-15
    timeout-minutes: 240
    steps:
      - name: Checkout exact isolated head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 160
          persist-credentials: true

      - name: Install coreutils, pinned Lean, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "${GITHUB_PATH}"
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${PATH}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          sha256sum --version | head -1
          lake exe cache get

      - name: Reconstruct and compile focused PASS 337 FA
        id: diagnostic
        shell: bash
        run: |
          set +e
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${HOME}/.elan/bin:${PATH}"
          bash scripts/gpt56_diagnose_pass337_fa.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload focused PASS 337 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt56-focused-pass337-fa-${{ github.sha }}
          path: /tmp/gpt56-focused-pass337-fa
          if-no-files-found: error
          retention-days: 90

      - name: Publish focused result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          set -euo pipefail
          evidence='/tmp/gpt56-focused-pass337-fa'
          mkdir -p build-logs
          report='build-logs/gpt56-focused-pass337-latest.txt'
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tested_sha=${GITHUB_SHA}"
            echo "diagnostic_exit_code=${DIAGNOSTIC_EXIT_CODE:-missing}"
            echo "utc=$(date -u +%FT%TZ)"
            echo
            echo '--- summary ---'
            if [[ -f "${evidence}/summary.txt" ]]; then
              cat "${evidence}/summary.txt"
            else
              echo 'summary missing'
            fi
            echo
            echo '--- repair hashes (tail) ---'
            if [[ -f "${evidence}/repair-source-sha256.csv" ]]; then
              tail -14 "${evidence}/repair-source-sha256.csv"
            fi
            echo
            echo '--- first and last error context ---'
            if [[ -f "${evidence}/logs/failure-summary.txt" ]]; then
              head -360 "${evidence}/logs/failure-summary.txt"
            else
              echo 'failure summary missing'
            fi
          } > "${report}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${report}"
          git diff --cached --quiet || git commit -m 'ci: record focused PASS 337 FA result'
          git push origin "HEAD:fix/pr9-fa-gpt56-isolated-20260808"

      - name: Enforce focused diagnostic result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          test -n "${DIAGNOSTIC_EXIT_CODE:-}"
          exit "${DIAGNOSTIC_EXIT_CODE}"
