name: GPT QYM GB57 global batch round2

on:
  push:
    branches:
      - gpt/qym-gb57-global-batch-round2-20260820
    paths:
      - .github/workflows/gpt-qym-gb57-global-batch-round2.yml
      - .github/qym_patch_gb57_round2.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb57-global-batch-round2
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb57-global-batch-round2-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  BASE_ERRORS: 57
  BASE_SHA256: 883b61e474cd607b71c27e21fc6c3ebd3995bb8b604282a685e8516316edc82a
  BASE_BLOB: af307b88af5ed96cc4479d1208cfdf598cdc21fe
  PATCH_SHA256: 26480d07939895a86cb5f43dec01d9d68c3451336885d8094e2a0193e4a2ecd8

jobs:
  candidate:
    name: round2-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant: [change, norm_num, simp]
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact GB57 and patch generator
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/qym-gb57-round2/${{ matrix.variant }}"
          mkdir -p "$OLEAN" "$OUT"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          test "$(sha256sum .github/qym_patch_gb57_round2.py | awk '{print $1}')" = "$PATCH_SHA256"
          python3 -m py_compile .github/qym_patch_gb57_round2.py
          git rev-parse HEAD | tee "$OUT/trigger-commit.txt"
          sha256sum "$QYM" | tee "$OUT/base.sha256"
          git hash-object "$QYM" | tee "$OUT/base.blob"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/qym-gb57-round2/${{ matrix.variant }}"
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          ok=0
          for attempt in 1 2 3 4 5; do
            if lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1

      - name: Restore completed dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure dependency objects by actual Lean
        shell: bash
        run: |
          set -euo pipefail
          OUT="/tmp/qym-gb57-round2/${{ matrix.variant }}"
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                max_errors=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Build cumulative candidate and audit forbidden escapes
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          OUT="/tmp/qym-gb57-round2/$VARIANT"
          cp "$QYM" "$OUT/QYM.GB57.lean"
          python3 -B .github/qym_patch_gb57_round2.py \
            "$OUT/QYM.GB57.lean" "$OUT/QYM.candidate.lean" "$VARIANT"
          test -s "$OUT/QYM.candidate.lean"
          export OUT
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          def code_only(text: str) -> str:
              out=[]; i=0; n=len(text); block=0; string=False; line=False
              while i<n:
                  if line:
                      if text[i]=='\n': line=False; out.append('\n')
                      else: out.append(' ')
                      i+=1; continue
                  if block:
                      if text.startswith('/-', i): block+=1; out.extend('  '); i+=2
                      elif text.startswith('-/', i): block-=1; out.extend('  '); i+=2
                      else:
                          out.append('\n' if text[i]=='\n' else ' '); i+=1
                      continue
                  if string:
                      if text[i]=='\\' and i+1<n: out.extend('  '); i+=2
                      elif text[i]=='"': string=False; out.append(' '); i+=1
                      else: out.append('\n' if text[i]=='\n' else ' '); i+=1
                      continue
                  if text.startswith('--', i): line=True; out.extend('  '); i+=2
                  elif text.startswith('/-', i): block=1; out.extend('  '); i+=2
                  elif text[i]=='"': string=True; out.append(' '); i+=1
                  else: out.append(text[i]); i+=1
              return ''.join(out)

          patterns={
            'sorry': r'\bsorry\b',
            'admit': r'\badmit\b',
            'unsafe': r'\bunsafe\b',
            'native_decide': r'\bnative_decide\b',
            'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
            'axiom_declaration': r'(?m)^\s*(?:public\s+|private\s+)?axiom\b',
            'maxHeartbeats_zero': r'\bmaxHeartbeats\s*(?::=|=)\s*0\b',
          }
          out=Path(os.environ['OUT'])
          base=code_only((out/'QYM.GB57.lean').read_text())
          cand=code_only((out/'QYM.candidate.lean').read_text())
          counts={}
          for name,pat in patterns.items():
              counts[name]={'base':len(re.findall(pat,base)), 'candidate':len(re.findall(pat,cand))}
          forbidden_zero=all(v['base']==0 and v['candidate']==0 for v in counts.values())
          (out/'FORBIDDEN_AUDIT.json').write_text(json.dumps({'forbidden_zero':forbidden_zero,'counts':counts},indent=2)+'\n')
          if not forbidden_zero:
              raise SystemExit(json.dumps(counts,indent=2))
          PY
          sha256sum "$OUT/QYM.candidate.lean" | tee "$OUT/candidate.sha256"
          git hash-object "$OUT/QYM.candidate.lean" | tee "$OUT/candidate.blob"

      - name: Run authoritative full-QYM direct Lean
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          OUT="/tmp/qym-gb57-round2/$VARIANT"
          cp "$OUT/QYM.candidate.lean" "$QYM"
          rm -f "$OUT/QYM.olean" "$OUT/QYM.ilean"
          set +e
          started="$(date +%s)"
          lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$OUT/QYM.olean" -i "$OUT/QYM.ilean" "$QYM" > "$OUT/full.log" 2>&1
          rc=$?
          ended="$(date +%s)"
          set -e
          errors="$(grep -cE '^.*\.lean:[0-9]+:[0-9]+: error' "$OUT/full.log" || true)"
          warnings="$(grep -cE '^.*\.lean:[0-9]+:[0-9]+: warning' "$OUT/full.log" || true)"
          panic="$(grep -ciE 'internal error|uncaught exception|panic(!|:| )' "$OUT/full.log" || true)"
          first="$(grep -m1 -E '^.*\.lean:[0-9]+:[0-9]+: error' "$OUT/full.log" || true)"
          export OUT VARIANT rc errors warnings panic first started ended
          python3 - <<'PY'
          import bisect, collections, hashlib, json, os, pathlib, re, subprocess
          out=pathlib.Path(os.environ['OUT']); src=out/'QYM.candidate.lean'; log=out/'full.log'
          audit=json.loads((out/'FORBIDDEN_AUDIT.json').read_text())
          text=src.read_text(); lines=text.splitlines()
          decl_re=re.compile(r'^\s*(?:(?:noncomputable|private|protected|public)\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class|inductive|opaque)\s+([^\s({:\[]+)')
          decl_lines=[]; decl_names=[]
          for no,line in enumerate(lines,1):
              m=decl_re.match(line)
              if m: decl_lines.append(no); decl_names.append(m.group(1))
          header=re.compile(r'^(.*\.lean):(\d+):(\d+): error(?:\(([^)]+)\))?:\s*(.*)$')
          errors_full=[]
          for line in log.read_text(errors='replace').splitlines():
              m=header.match(line)
              if not m: continue
              ln=int(m.group(2)); k=bisect.bisect_right(decl_lines,ln)-1
              errors_full.append({'file':m.group(1),'line':ln,'column':int(m.group(3)),'code':m.group(4),'message':m.group(5),'enclosing_declaration':decl_names[k] if k>=0 else None})
          codes=collections.Counter((e['code'] or 'uncoded') for e in errors_full)
          decls=collections.Counter((e['enclosing_declaration'] or '<none>') for e in errors_full)
          olean=(out/'QYM.olean').is_file() and (out/'QYM.olean').stat().st_size>0
          ilean=(out/'QYM.ilean').is_file() and (out/'QYM.ilean').stat().st_size>0
          d={
            'schema':'qym-gb57-global-batch-round2-v1',
            'authority':'actual full-QYM direct Lean',
            'run_id':int(os.environ['GITHUB_RUN_ID']),
            'trigger_sha':os.environ['GITHUB_SHA'],
            'branch':os.environ['BRANCH'],
            'variant':os.environ['VARIANT'],
            'previous_error_headers':int(os.environ['BASE_ERRORS']),
            'exit':int(os.environ['rc']),
            'error_headers':int(os.environ['errors']),
            'warning_headers':int(os.environ['warnings']),
            'panic_lines':int(os.environ['panic']),
            'elapsed_seconds':int(os.environ['ended'])-int(os.environ['started']),
            'first_error':os.environ['first'] or None,
            'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
            'source_blob':subprocess.check_output(['git','hash-object',str(src)],text=True).strip(),
            'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),
            'forbidden_zero':bool(audit['forbidden_zero']),
            'forbidden_counts':audit['counts'],
            'olean_exists':olean,
            'ilean_exists':ilean,
            'error_codes':dict(codes),
            'error_declarations':dict(decls),
            'errors':errors_full,
          }
          d['strict_improvement']=d['error_headers']<d['previous_error_headers'] and d['panic_lines']==0 and d['forbidden_zero']
          d['pass']=d['exit']==0 and d['error_headers']==0 and d['panic_lines']==0 and d['forbidden_zero'] and olean and ilean
          (out/'RESULT.json').write_text(json.dumps({k:v for k,v in d.items() if k!='errors'},indent=2)+'\n')
          (out/'FULL_RESULT.json').write_text(json.dumps(d,indent=2)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k not in {'errors','forbidden_counts','error_declarations'}},indent=2))
          PY

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb57-round2-${{ matrix.variant }}-${{ github.run_id }}
          path: /tmp/qym-gb57-round2/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

  selector:
    name: select-freeze-and-promote-strict-improvement
    if: always()
    needs: candidate
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          pattern: qym-gb57-round2-*-${{ github.run_id }}
          path: /tmp/downloaded
          merge-multiple: false

      - name: Select verified best and persist exact source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, shutil
          rows=[]
          for p in pathlib.Path('/tmp/downloaded').rglob('RESULT.json'):
              d=json.loads(p.read_text())
              valid=bool(d.get('forbidden_zero')) and int(d.get('panic_lines',1))==0
              rows.append((0 if valid else 1,int(d.get('error_headers',10**9)),int(d.get('warning_headers',10**9)),int(d.get('elapsed_seconds',10**9)),d.get('variant',''),p,d))
          if not rows: raise SystemExit('no candidate results')
          rows.sort(key=lambda x:x[:5])
          *_,p,best=rows[0]
          dest=pathlib.Path('.github/qym-frontier/GB57_ROUND2')
          if dest.exists(): shutil.rmtree(dest)
          dest.mkdir(parents=True)
          shutil.copy2(p,dest/'RESULT.json')
          shutil.copy2(p.parent/'FULL_RESULT.json',dest/'FULL_RESULT.json')
          shutil.copy2(p.parent/'full.log',dest/'full.log')
          shutil.copy2(p.parent/'QYM.candidate.lean',dest/'QYM_GB57_ROUND2_BEST.lean')
          all_results=[r[-1] for r in rows]
          (dest/'ALL_RESULTS.json').write_text(json.dumps(all_results,indent=2)+'\n')
          promotion={
            'schema':'qym-gb57-global-batch-round2-promotion-v1',
            'authority':'actual full-QYM direct Lean',
            'run_id':best['run_id'],
            'branch':best['branch'],
            'trigger_sha':best['trigger_sha'],
            'variant':best['variant'],
            'previous_error_headers':57,
            'error_headers':best['error_headers'],
            'warning_headers':best['warning_headers'],
            'panic_lines':best['panic_lines'],
            'source_sha256':best['source_sha256'],
            'source_blob':best['source_blob'],
            'forbidden_zero':best['forbidden_zero'],
            'strict_improvement':best['strict_improvement'],
            'pass':best['pass'],
            'branch_check_in':bool(best['strict_improvement']),
            'status':'PROMOTED_STRICT_IMPROVEMENT' if best['strict_improvement'] else 'EVIDENCE_ONLY_NO_STRICT_IMPROVEMENT',
          }
          (dest/'PROMOTION_STATUS.json').write_text(json.dumps(promotion,indent=2)+'\n')
          if best['strict_improvement']:
              shutil.copy2(p.parent/'QYM.candidate.lean','PrimalitySheafVerification/QYM.lean')
          print(json.dumps(promotion,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qym-frontier/GB57_ROUND2 PrimalitySheafVerification/QYM.lean
          git commit -m "QYM GB57: freeze global batch round2 ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
