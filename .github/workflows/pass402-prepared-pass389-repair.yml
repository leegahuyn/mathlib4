name: PASS 402 prepared PASS 389 priority repair

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pass402-prepared-pass389-repair.yml'
      - 'scripts/pass389_prepare_dependencies.sh'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: pass402-prepared-pass389-repair
  cancel-in-progress: false

jobs:
  prepared-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Build checked-in Mock2 dependencies
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/pass389_prepare_dependencies.sh | tee /tmp/pass402-dependencies.log

      - name: Run prepared PASS 389 repair and two-pass gate
        id: repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASS389_EVIDENCE: /tmp/pass402-priority
          PASS389_CHAIN_BRANCH: fix/fa402-pass389-prepared-20260809
          PASS389_PR9_BRANCH: ci/fa319-isolated-20260807
          PASS389_MODELS: openai/gpt-5-mini,openai/gpt-4.1,openai/o4-mini,deepseek/DeepSeek-V3-0324,xai/grok-3-mini
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass389_priority_repair_agent_v3.py \
            --fa-cycles 52 \
            --downstream-cycles 30 \
            2>&1 | tee /tmp/pass402-priority-driver.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          mkdir -p /tmp/pass402-priority
          cp /tmp/pass402-priority-driver.log /tmp/pass402-priority/driver.log
          cp /tmp/pass402-dependencies.log /tmp/pass402-priority/dependencies.log
          cp build-logs/pass389-priority-state.json /tmp/pass402-priority/state.json 2>/dev/null || true
          cp build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json \
            /tmp/pass402-priority/final-marker.json 2>/dev/null || true
          exit 0

      - name: Upload PASS 402 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass402-prepared-pass389-${{ github.sha }}
          path: /tmp/pass402-priority
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce result
        if: always()
        shell: bash
        env:
          REPAIR_EXIT: ${{ steps.repair.outputs.exit_code }}
        run: |
          test -n "${REPAIR_EXIT:-}"
          exit "${REPAIR_EXIT}"
