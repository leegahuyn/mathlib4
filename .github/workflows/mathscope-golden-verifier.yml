name: MathScope Golden verifier
on:
  pull_request:
    branches: [mathscope-cloud-lean]
    paths: ['MathScopeCloudLean/**', '.github/workflows/mathscope-golden-verifier.yml']
  push:
    branches: [mathscope-cloud-lean]
    paths: ['MathScopeCloudLean/**', '.github/workflows/mathscope-golden-verifier.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restricted-verifier:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: MathScopeCloudLean
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install pinned Lean core runtime
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install leanprover/lean4:v4.34.0-rc2
      - run: npm install --omit=dev --no-package-lock
      - run: npm run check
      - run: npm run test:golden
