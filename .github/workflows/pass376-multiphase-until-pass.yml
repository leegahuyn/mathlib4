name: PASS 376 multiphase until FA Mock3 QYM pass

on:
  push:
    branches: [fix/pass376-self-driving-20260809]
    paths:
      - '.github/workflows/pass376-multiphase-until-pass.yml'
      - 'scripts/pass376_run_phase.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write

concurrency:
  group: pass376-multiphase-until-pass
  cancel-in-progress: false

env:
  PASS376_BRANCH: fix/pass376-self-driving-20260809
  GITHUB_TOKEN: ${{ github.token }}
  GH_TOKEN: ${{ github.token }}
  OPENAI_API_KEY: ${{ github.token }}
  OPENAI_API_BASE: https://models.github.ai/inference

jobs:
  phase-1-core:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Checkout latest self-driving checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pass376-self-driving-20260809
          fetch-depth: 5000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Materialize exact PASS 375c baseline when no checkpoint exists
        shell: bash
        run: |
          set -euo pipefail
          if test -s build-logs/pass376-v2-state.json || \
             test -s build-logs/pass376-v2-baseline.json; then
            echo 'Continuing from an existing checked-in repair checkpoint.'
            sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            exit 0
          fi
          current="$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)"
          if test "${current}" = 'd2e1b383b9e60fd18607094ce104679cd604e8c90ffc0261d8a877e700b99b8e'; then
            echo 'PASS 375c is already materialized.'
            exit 0
          fi
          test -f scripts/diagnose_pass358_fa.sh
          test -f scripts/apply_pass375c_candidate.py
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the PASS 341 compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          bash scripts/diagnose_pass358_fa.sh
          source_file='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${source_file}"
          cp "${source_file}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '8fd20f88c43060d392bab969c91a84b7c0bb08657af7728752a77c5f3c57c6c6'
          python3 scripts/apply_pass375c_candidate.py
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            'd2e1b383b9e60fd18607094ce104679cd604e8c90ffc0261d8a877e700b99b8e'
          git checkout -- scripts/diagnose_pass341_fa.sh

      - name: Run long strict-core repair phase
        shell: bash
        run: |
          chmod +x scripts/pass376_run_phase.sh
          scripts/pass376_run_phase.sh core 19000

      - name: Detect ordered completion
        id: status
        if: always()
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload phase 1 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-multiphase-core-${{ github.sha }}
          path: |
            /tmp/pass376-multiphase
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-multiphase-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

  phase-2-tool:
    needs: phase-1-core
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Checkout latest phase 1 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pass376-self-driving-20260809
          fetch-depth: 6000
          persist-credentials: true

      - name: Detect prior success
        id: prior
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install pinned Lean and cache
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Run function-calling tool repair phase
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          chmod +x scripts/pass376_run_phase.sh
          scripts/pass376_run_phase.sh tool 19000

      - name: Detect ordered completion
        id: status
        if: always()
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload phase 2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-multiphase-tool-${{ github.sha }}
          path: |
            /tmp/pass376-multiphase
            build-logs/pass376-tool-agent
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-multiphase-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

  phase-3-aider:
    needs: phase-2-tool
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Checkout latest phase 2 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pass376-self-driving-20260809
          fetch-depth: 7000
          persist-credentials: true

      - name: Detect prior success
        id: prior
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Lean, cache, Aider, and model CLI
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          python3 -m pip install --upgrade pip
          python3 -m pip install 'aider-chat>=0.86,<1.0'
          aider --version
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Run architect-editor repair phase
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          chmod +x scripts/pass376_run_phase.sh
          scripts/pass376_run_phase.sh aider 19000

      - name: Detect ordered completion
        id: status
        if: always()
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload phase 3 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-multiphase-aider-${{ github.sha }}
          path: |
            /tmp/pass376-multiphase
            build-logs/pass376-aider
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-multiphase-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

  phase-4-mixed:
    needs: phase-3-aider
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    outputs:
      complete: ${{ steps.status.outputs.complete }}
    steps:
      - name: Checkout latest phase 3 checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pass376-self-driving-20260809
          fetch-depth: 8000
          persist-credentials: true

      - name: Detect prior success
        id: prior
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Lean, cache, Aider, and model CLI
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          python3 -m pip install --upgrade pip
          python3 -m pip install 'aider-chat>=0.86,<1.0'
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Run mixed final repair phase
        if: steps.prior.outputs.complete != 'true'
        shell: bash
        run: |
          chmod +x scripts/pass376_run_phase.sh
          scripts/pass376_run_phase.sh mixed 19000

      - name: Detect ordered completion
        id: status
        if: always()
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Upload phase 4 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-multiphase-mixed-${{ github.sha }}
          path: |
            /tmp/pass376-multiphase
            build-logs/pass376-tool-agent
            build-logs/pass376-aider
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-multiphase-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

  authoritative-pr9-audit:
    needs: phase-4-mixed
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout final self-driving checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/pass376-self-driving-20260809
          fetch-depth: 9000
          persist-credentials: true

      - name: Detect ordered repair success
        id: gate
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'success=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'success=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Lean and cache for final audit or failure frontier
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/pass376-lean-version.txt
          lake --version | tee /tmp/pass376-lake-version.txt
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Record exact final failure frontier
        if: steps.gate.outputs.success != 'true'
        shell: bash
        run: |
          set +e
          mkdir -p build-logs/pass376-multiphase-final
          active="$(python3 - <<'PY'
          import json
          from pathlib import Path
          path=Path('build-logs/pass376-v2-state.json')
          state=json.loads(path.read_text()) if path.exists() else {}
          print(state.get('active_target') or 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          PY
          )"
          lake env lean -DmaxErrors=80 "${active}" \
            > build-logs/pass376-multiphase-final/frontier.log 2>&1
          rc=$?
          set -e
          python3 - <<'PY'
          import hashlib,json,re
          from pathlib import Path
          state_path=Path('build-logs/pass376-v2-state.json')
          state=json.loads(state_path.read_text()) if state_path.exists() else {}
          active=state.get('active_target') or 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          source=Path(active)
          log=Path('build-logs/pass376-multiphase-final/frontier.log').read_text(errors='replace')
          errors=[]
          for m in re.finditer(r'([^\n]*\.lean):(\d+):(\d+): error:([^\n]*)',log):
              errors.append({'file':m.group(1),'line':int(m.group(2)),'column':int(m.group(3)),
                             'message':m.group(4).strip()})
              if len(errors)>=40: break
          payload={'status':'INCOMPLETE','active_target':active,
                   'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest() if source.exists() else None,
                   'cycle':Path('build-logs/pass376-multiphase-cycle.txt').read_text().strip()
                           if Path('build-logs/pass376-multiphase-cycle.txt').exists() else None,
                   'state':state,'errors':errors}
          Path('build-logs/pass376-multiphase-final/status.json').write_text(
              json.dumps(payload,ensure_ascii=False,indent=2))
          lines=['# PASS 376 multiphase status: INCOMPLETE','',f"Active target: `{active}`",
                 f"Source SHA-256: `{payload['source_sha256']}`",'', '## First compiler errors','']
          lines += [f"- `{e['line']}:{e['column']}` — {e['message']}" for e in errors]
          Path('build-logs/pass376-multiphase-final/status.md').write_text('\n'.join(lines)+'\n')
          PY
          printf 'compiler_exit_code=%s\n' "${rc}" > build-logs/pass376-multiphase-final/status.env
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/pass376-multiphase-final
          if ! git diff --cached --quiet; then
            git commit -m 'chore: record PASS376 multiphase failure frontier'
            git push origin HEAD:fix/pass376-self-driving-20260809
          fi

      - name: Save verified target bytes and hashes
        if: steps.gate.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,shutil
          from pathlib import Path
          state=json.loads(Path('build-logs/pass376-v2-state.json').read_text())
          assert state['success'] is True
          assert state['targets'][0].endswith('Mock2_FunctionalAnalysis.lean')
          assert state['targets'][-1].endswith('QYM.lean')
          dest=Path('/tmp/pass376-verified/PrimalitySheafVerification'); dest.mkdir(parents=True)
          hashes=[]
          for target in state['targets']:
              src=Path(target); item=state['final_validations'][target]
              assert item['trust'] is True and item['verified_sha_matches'] is True
              actual=hashlib.sha256(src.read_bytes()).hexdigest(); assert actual==item['sha256']
              shutil.copy2(src,dest/src.name); hashes.append(f'{target} sha256={actual}')
          Path('/tmp/pass376-verified/target-sha256.txt').write_text('\n'.join(hashes)+'\n')
          PY
          mkdir -p /tmp/pass376-verified/build-logs
          cp build-logs/pass376-v2-state.json build-logs/pass376-v2-baseline.json \
             build-logs/pass376-fa-mock3-qym-2x-pass.txt \
             /tmp/pass376-verified/build-logs/

      - name: Install verified target bytes on current PR9 head
        if: steps.gate.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/fa319-isolated-20260807
          git checkout -B ci/fa319-isolated-20260807 origin/ci/fa319-isolated-20260807
          cp /tmp/pass376-verified/PrimalitySheafVerification/* PrimalitySheafVerification/
          mkdir -p build-logs
          cp /tmp/pass376-verified/build-logs/* build-logs/
          cp /tmp/pass376-verified/target-sha256.txt build-logs/pass376-target-sha256.txt

      - name: Compile every checked-in target twice in required order on PR9
        if: steps.gate.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(python3 - <<'PY'
          import json
          from pathlib import Path
          print('\n'.join(json.loads(Path('build-logs/pass376-v2-state.json').read_text())['targets']))
          PY
          )
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p /tmp/pass376-pr9-authoritative
          : > /tmp/pass376-pr9-authoritative/results.tsv
          for target in "${targets[@]}"; do
            stem="$(basename "${target}" .lean)"
            for run in 1 2; do
              rm -f "${out}/${stem}.olean" "${out}/${stem}.ilean" \
                    "${out}/${stem}.olean.hash" "${out}/${stem}.ilean.hash"
              start="$(date +%s)"; set +e
              lake env lean -DmaxErrors=2000 "${target}" \
                > "/tmp/pass376-pr9-authoritative/${stem}-run${run}.log" 2>&1
              rc=$?; set -e
              elapsed=$(( $(date +%s) - start ))
              errors="$(grep -c 'error:' "/tmp/pass376-pr9-authoritative/${stem}-run${run}.log" || true)"
              printf '%s\t%s\t%s\t%s\t%s\n' "${target}" "${run}" "${rc}" "${errors}" "${elapsed}" \
                | tee -a /tmp/pass376-pr9-authoritative/results.tsv
              test "${rc}" -eq 0
              test "${errors}" -eq 0
              test -s "${out}/${stem}.olean"
              test -s "${out}/${stem}.ilean"
            done
          done

      - name: Commit authoritative verified source and evidence to PR9
        if: steps.gate.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/pass376-pr9-authoritative/results.tsv build-logs/pass376-pr9-final-results.tsv
          cp /tmp/pass376-lean-version.txt build-logs/pass376-lean-version.txt
          cp /tmp/pass376-lake-version.txt build-logs/pass376-lake-version.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean \
                  build-logs/pass376-v2-state.json build-logs/pass376-v2-baseline.json \
                  build-logs/pass376-fa-mock3-qym-2x-pass.txt build-logs/pass376-target-sha256.txt \
                  build-logs/pass376-pr9-final-results.tsv build-logs/pass376-lean-version.txt \
                  build-logs/pass376-lake-version.txt
          while IFS= read -r -d '' file; do git add "${file}"; done < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0
          )
          test ! -f PrimalitySheafVerification/QYM.lean || git add PrimalitySheafVerification/QYM.lean
          if ! git diff --cached --quiet; then
            git commit -m 'fix: pass FA Integrated Mock3 QYM twice on PR9'
            git push origin HEAD:ci/fa319-isolated-20260807
          fi

      - name: Comment authoritative result on PR9
        if: steps.gate.outputs.success == 'true'
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git rev-parse HEAD)"
          {
            echo '## PASS 376 authoritative FA / Integrated / Mock3 / QYM result'
            echo; echo "Verified PR #9 head: \`${head_sha}\`"; echo
            echo 'Every required target compiled twice from checked-in source with exit code 0, zero Lean errors, and regenerated `.olean` / `.ilean`, in the requested order.'
            echo; echo '```text'; cat build-logs/pass376-pr9-final-results.tsv; echo '```'
            echo; echo 'PR remains draft and unmerged. No automatic merge was performed.'
          } > /tmp/pass376-pr-comment.md
          gh pr comment 9 --repo leegahuyn/mathlib4 --body-file /tmp/pass376-pr-comment.md

      - name: Comment exact failure frontier on PR9
        if: steps.gate.outputs.success != 'true'
        shell: bash
        run: |
          set -euo pipefail
          {
            cat build-logs/pass376-multiphase-final/status.md
            echo
            echo 'All compiler-advancing edits remain isolated on `fix/pass376-self-driving-20260809`.'
            echo 'No unverified source was promoted to PR #9. PR remains draft and unmerged.'
          } > /tmp/pass376-pr-comment.md
          gh pr comment 9 --repo leegahuyn/mathlib4 --body-file /tmp/pass376-pr-comment.md

      - name: Upload final authoritative evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-multiphase-final-${{ github.sha }}
          path: |
            /tmp/pass376-pr9-authoritative
            /tmp/pass376-pr-comment.md
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            build-logs/pass376-multiphase-final
            build-logs/pass376-pr9-final-results.tsv
            build-logs/pass376-target-sha256.txt
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce final success
        if: always()
        shell: bash
        env:
          REPAIR_SUCCESS: ${{ steps.gate.outputs.success }}
        run: |
          set -euo pipefail
          test "${REPAIR_SUCCESS:-false}" = 'true'
          test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
          test -s build-logs/pass376-pr9-final-results.tsv
