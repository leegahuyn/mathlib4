name: PASS 396 proof-body persistent FA Mock3 QYM solver

on:
  push:
    branches: [fix/fa396-proof-body-persistent-20260809]
    paths:
      - '.github/workflows/fa396-proof-body-persistent.yml'
      - 'scripts/fa392_iterative_solver.py'
      - 'scripts/fa394_tournament_solver.py'
      - 'scripts/fa395_persistent_tournament.py'
      - 'scripts/fa396_proof_body_persistent.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: write
  models: read
  pull-requests: write

concurrency:
  group: fa396-proof-body-persistent
  cancel-in-progress: false

jobs:
  persistent-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 396 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa396-proof-body-persistent-20260809
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean, ripgrep, GitHub CLI, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ripgrep gh
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run one proof-body repair cycle
        id: cycle
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p build-logs/fa396-proof-body
          python3 scripts/fa396_proof_body_persistent.py \
            --max-cycles 16 --max-errors 220 \
            2>&1 | tee build-logs/fa396-proof-body.console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "cycle_exit_code=${rc}" > build-logs/fa396-proof-body.exit.txt

      - name: Commit source progress and persistent state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            build-logs/fa396-proof-body/STATE.json \
            build-logs/fa396-proof-body/NEXT_ACTION.json \
            build-logs/fa396-proof-body/FINAL_STATUS.json
          find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0 | xargs -0 -r git add
          test ! -f build-logs/fa396-proof-body/ALL_REQUIRED_TARGETS_2X_PASS || \
            git add build-logs/fa396-proof-body/ALL_REQUIRED_TARGETS_2X_PASS
          find build-logs/fa396-proof-body -type f \
            \( -name history.json -o -name baseline-selection.json \
            -o -name FINAL_FORBIDDEN_AUDIT.json \) -print0 2>/dev/null | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            cycle=$(python3 -c "import json; print(json.load(open('build-logs/fa396-proof-body/STATE.json'))['cycle'])")
            git commit -m "fix: advance PASS 396 proof-body cycle ${cycle}"
            git push origin HEAD:fix/fa396-proof-body-persistent-20260809
          fi

      - name: Promote only fully verified sources to PR 9
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker='build-logs/fa396-proof-body/ALL_REQUIRED_TARGETS_2X_PASS'
          test -f "$marker" || exit 0
          grep -qx 'SUCCESS_ALL_REQUIRED_TARGETS_2X_PASS' "$marker"
          git fetch origin ci/fa319-isolated-20260807
          remote_sha=$(git rev-parse FETCH_HEAD)
          tmp=$(mktemp -d)
          git worktree add --detach "$tmp" "$remote_sha"
          for f in \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean; do cp "$f" "$tmp/$f"; done
          while IFS= read -r f; do cp "$f" "$tmp/$f"; done < \
            <(find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' | sort)
          mkdir -p "$tmp/build-logs"
          cp build-logs/fa396-proof-body/FINAL_STATUS.json \
            "$tmp/build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json"
          cd "$tmp"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json
          find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0 | xargs -0 -r git add
          if ! git diff --cached --quiet; then
            git commit -m 'fix: promote verified PASS 396 FA Mock3 QYM sources'
            git push origin HEAD:ci/fa319-isolated-20260807
          fi
          cd -
          git worktree remove "$tmp" --force

      - name: Dispatch next proof-body cycle when required
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          next='build-logs/fa396-proof-body/NEXT_ACTION.json'
          test -f "$next" || exit 0
          dispatch=$(python3 -c "import json; print(str(json.load(open('$next')).get('dispatch',False)).lower())")
          if test "$dispatch" = true; then
            sleep 20
            gh api --method POST \
              repos/${{ github.repository }}/actions/workflows/fa396-proof-body-persistent.yml/dispatches \
              -f ref=fix/fa396-proof-body-persistent-20260809
          fi

      - name: Upload complete PASS 396 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa396-proof-body-cycle-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa396-proof-body
            build-logs/fa396-proof-body.console.log
            build-logs/fa396-proof-body.exit.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final result only when no next cycle remains
        if: always()
        shell: bash
        env:
          CYCLE_EXIT_CODE: ${{ steps.cycle.outputs.exit_code }}
        run: |
          set -euo pipefail
          next='build-logs/fa396-proof-body/NEXT_ACTION.json'
          if test -f "$next"; then
            dispatch=$(python3 -c "import json; print(str(json.load(open('$next')).get('dispatch',False)).lower())")
            if test "$dispatch" = true; then
              echo 'Next proof-body cycle dispatched.'
              exit 0
            fi
          fi
          test -n "${CYCLE_EXIT_CODE:-}"
          exit "${CYCLE_EXIT_CODE}"
