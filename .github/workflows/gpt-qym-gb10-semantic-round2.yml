name: GPT QYM GB10 semantic round 2 direct Lean

on:
  push:
    branches:
      - gpt/qym-gb57-global-batch-round2-20260820
    paths:
      - .github/qym_patch_gb10_semantic_round2.py
      - .github/workflows/gpt-qym-gb10-semantic-round2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb10-semantic-round2
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb57-global-batch-round2-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  BASE: .github/qym-frontier/GB27_SEMANTIC_R1/QYM_GB27_SEMANTIC_R1.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  BASE_ERRORS: 10
  BASE_SHA256: 61b88982fa79f67da2c01aae2f01a24fab5347be17d3e85e45902d50ef83ae4f
  CANDIDATE_SHA256: 231efe9a0b8f9d05aae5e65ff3904b3636182ef6f1c93c11eac0c05313730998
  OUT: /tmp/qym-gb10-semantic-r2

jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact semantic GB10 base and patch
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OLEAN"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$BASE" | awk '{print $1}')" = "$BASE_SHA256"
          python3 -m py_compile .github/qym_patch_gb10_semantic_round2.py
          git rev-parse HEAD | tee "$OUT/trigger-commit.txt"

      - name: Publish run locator
        shell: bash
        run: |
          set -euo pipefail
          dest=.github/qym-frontier/GB10_SEMANTIC_R2
          mkdir -p "$dest"
          cat > "$dest/RUN_LOCATOR.json" <<JSON
          {
            "run_id": ${GITHUB_RUN_ID},
            "trigger_sha": "${GITHUB_SHA}",
            "branch": "${BRANCH}",
            "status": "RUNNING"
          }
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest/RUN_LOCATOR.json"
          git commit -m "QYM GB10 R2: publish run locator ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          ok=0
          for attempt in 1 2 3 4 5; do
            if lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1

      - name: Restore verified QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v5-${{ runner.os }}-
            qym-deps-v4-${{ runner.os }}-

      - name: Ensure dependency objects by actual Lean
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              [[ "$source" = Mock2_FunctionalAnalysis* ]] && max_errors=2000
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Build cumulative candidate and audit forbidden escapes
        shell: bash
        run: |
          set -euo pipefail
          cp "$BASE" "$OUT/QYM.GB10.lean"
          python3 -B .github/qym_patch_gb10_semantic_round2.py \
            "$OUT/QYM.GB10.lean" "$OUT/QYM.candidate.lean" > "$OUT/patch.log"
          test "$(sha256sum "$OUT/QYM.candidate.lean" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          export CAND="$OUT/QYM.candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          text=Path(os.environ['CAND']).read_text()
          out=[]; i=0; depth=0; string=False; line=False
          while i < len(text):
              if line:
                  if text[i]=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if text.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                  elif text.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                  else: out.append('\n' if text[i]=='\n' else ' '); i+=1
                  continue
              if string:
                  if text[i]=='\\' and i+1<len(text): out.extend('  '); i+=2
                  elif text[i]=='"': string=False; out.append(' '); i+=1
                  else: out.append('\n' if text[i]=='\n' else ' '); i+=1
                  continue
              if text.startswith('--',i): line=True; out.extend('  '); i+=2
              elif text.startswith('/-',i): depth=1; out.extend('  '); i+=2
              elif text[i]=='"': string=True; out.append(' '); i+=1
              else: out.append(text[i]); i+=1
          code=''.join(out)
          patterns={'sorry':r'\bsorry\b','admit':r'\badmit\b','unsafe':r'\bunsafe\b',
            'native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b',
            'axiom':r'(?m)^\s*(?:public\s+|private\s+)?axiom\b',
            'maxHeartbeats_zero':r'\bmaxHeartbeats\s*(?::=|=)\s*0\b'}
          counts={k:len(re.findall(v,code)) for k,v in patterns.items()}
          ok=depth==0 and all(v==0 for v in counts.values())
          Path(os.environ['OUT'],'FORBIDDEN_AUDIT.json').write_text(
            json.dumps({'forbidden_zero':ok,'counts':counts,'comment_depth':depth},indent=2)+'\n')
          if not ok: raise SystemExit(json.dumps(counts))
          PY

      - name: Run authoritative full-QYM direct Lean
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/QYM.candidate.lean" "$QYM"
          rm -f "$OUT/QYM.olean" "$OUT/QYM.ilean"
          set +e
          started="$(date +%s)"
          lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$OUT/QYM.olean" -i "$OUT/QYM.ilean" "$QYM" > "$OUT/full.log" 2>&1
          rc=$?
          ended="$(date +%s)"
          set -e
          export rc started ended
          python3 - <<'PY'
          import bisect, collections, hashlib, json, os, pathlib, re, subprocess
          out=pathlib.Path(os.environ['OUT']); src=out/'QYM.candidate.lean'; log=out/'full.log'
          lines=src.read_text().splitlines()
          decl_re=re.compile(r'^\s*(?:(?:noncomputable|private|protected|public)\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class|inductive|opaque)\s+([^\s({:\[]+)')
          dl=[]; dn=[]
          for no,line in enumerate(lines,1):
              m=decl_re.match(line)
              if m: dl.append(no); dn.append(m.group(1))
          hdr=re.compile(r'^(.*\.lean):(\d+):(\d+): error(?:\(([^)]+)\))?:\s*(.*)$')
          errors=[]; log_text=log.read_text(errors='replace')
          for line in log_text.splitlines():
              m=hdr.match(line)
              if m:
                  ln=int(m.group(2)); k=bisect.bisect_right(dl,ln)-1
                  errors.append({'file':m.group(1),'line':ln,'column':int(m.group(3)),
                    'code':m.group(4),'message':m.group(5),
                    'enclosing_declaration':dn[k] if k>=0 else None})
          warnings=sum(bool(re.match(r'^.*\.lean:\d+:\d+: warning',line)) for line in log_text.splitlines())
          panic=sum(bool(re.search(r'internal error|uncaught exception|panic(!|:| )',line,re.I)) for line in log_text.splitlines())
          audit=json.loads((out/'FORBIDDEN_AUDIT.json').read_text())
          codes=collections.Counter((e['code'] or 'uncoded') for e in errors)
          decls=collections.Counter((e['enclosing_declaration'] or '<none>') for e in errors)
          d={'schema':'qym-gb10-semantic-round2-v1','authority':'actual full-QYM direct Lean',
             'run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],
             'base_error_headers':10,'exit':int(os.environ['rc']),'error_headers':len(errors),
             'warning_headers':warnings,'panic_lines':panic,
             'elapsed_seconds':int(os.environ['ended'])-int(os.environ['started']),
             'first_error':errors[0] if errors else None,
             'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
             'source_blob':subprocess.check_output(['git','hash-object',str(src)],text=True).strip(),
             'log_sha256':hashlib.sha256(log.read_bytes()).hexdigest(),
             'forbidden_zero':audit['forbidden_zero'],
             'olean_exists':(out/'QYM.olean').is_file() and (out/'QYM.olean').stat().st_size>0,
             'ilean_exists':(out/'QYM.ilean').is_file() and (out/'QYM.ilean').stat().st_size>0,
             'error_codes':dict(codes),'error_declarations':dict(decls),'errors':errors}
          d['semantic_improvement']=len(errors)<10 and panic==0 and audit['forbidden_zero']
          d['numeric_global_improvement']=len(errors)<8 and panic==0 and audit['forbidden_zero']
          d['pass']=int(os.environ['rc'])==0 and not errors and panic==0 and audit['forbidden_zero'] and d['olean_exists'] and d['ilean_exists']
          (out/'FULL_RESULT.json').write_text(json.dumps(d,indent=2)+'\n')
          (out/'RESULT.json').write_text(json.dumps({k:v for k,v in d.items() if k!='errors'},indent=2)+'\n')
          print(json.dumps({k:v for k,v in d.items() if k not in {'errors','error_declarations'}},indent=2))
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb10-semantic-r2-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Persist semantic round 2 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/RESULT.json"
          dest=.github/qym-frontier/GB10_SEMANTIC_R2
          rm -rf "$dest"
          mkdir -p "$dest"
          cp "$OUT/RESULT.json" "$dest/"
          cp "$OUT/FULL_RESULT.json" "$dest/"
          cp "$OUT/FORBIDDEN_AUDIT.json" "$dest/"
          cp "$OUT/full.log" "$dest/"
          cp "$OUT/QYM.candidate.lean" "$dest/QYM_GB10_SEMANTIC_R2.lean"
          promote="$(python3 -c 'import json; d=json.load(open("'"$OUT"'/RESULT.json")); print(str(d["pass"] or d["numeric_global_improvement"]).lower())')"
          if [[ "$promote" != true ]]; then git checkout "$GITHUB_SHA" -- "$QYM"; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest" "$QYM"
          git commit -m "QYM GB10: persist semantic round 2 ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
