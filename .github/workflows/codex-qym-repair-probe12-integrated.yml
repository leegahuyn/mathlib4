name: Codex QYM deterministic integrated repair probe 12

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/codex-qym-repair-probe12-integrated.yml
      - scripts/qym_probe12_integrated.py
      - scripts/qym-probe12-early-frontier-p11-conditional/qym_probe12_early_frontier_p11_conditional.py
      - scripts/qym-probe12-36k42k-p11-reanchored/qym_probe12_36k42k_p11_reanchored.py
      - scripts/qym-probe12-43k49k-p11-conditional/qym_probe12_43k49k_p11_conditional.py
      - scripts/qym-probe12-43k49k-p10-conditional/qym_probe12_43k49k_p10_conditional.py
      - scripts/qym-probe12-50k53k-p11-conditional/qym_probe12_50k53k_p11_conditional.py
      - scripts/qym-probe12-52k61k-p11-conditional/qym_probe12_52k61k_p11_conditional.py
      - scripts/qym-probe12-52k61k-p10-conditional/qym_probe12_52k61k_p10_conditional.py
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: codex-qym-repair-probe12-integrated-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qym-repair-probe12-integrated:
    name: exact terminal Probe11 gate then integrated Probe12 QYM
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      EXPECTED_INSTALL_PARENT: f87e010fbcbf20fd5622c481fc4ca5ecb051b851
      EXPECTED_QYM_SHA256: 698c7625628ccc654ca7be713944930fdccf12dd78a26937d3f45c9b6982a9f0
      EXPECTED_QYM_BLOB: 4b394b2709af88b8cd8eac8b432e535aaf19b64c
      EXPECTED_M2_SHA256: 36a034721c389888b2c235d856753e5f2e38f9f6a258fddabbb70fe751ae3594
      EXPECTED_M2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_M2A_SHA256: cf44063abca1d5b47331a9001a3cff45a86b5e889865812fe4e7826c6af41526
      EXPECTED_M2A_BLOB: a60fa47ebcd8c1fb6037d705e81b54c80910657a
      EXPECTED_FA_SHA256: c680a35b9f12ea3223d8328ed0f5f0674b3439e650bb62cb900b54917f9653bd
      EXPECTED_FA_BLOB: 28f614d48e02a0f28d3f5a758e813350b3ea89cf
      EXPECTED_INTEGRATED_SHA256: a77f9e67980ec35b0d7b4d1624c10ec68051f575468d3b74859e6cf30e3e0439
      EXPECTED_INTEGRATED_BLOB: 464f5dd095876b20165d12690c8127ef9d909e6a
      EXPECTED_TOOLCHAIN_SHA256: 62c2d9c0fc1ec4c67e151c11eff41ca004ef38e179cf9476c230406e6defedef
      EXPECTED_TOOLCHAIN_BLOB: fd85b262bf1c734663aa8292b0101f672168788f
      EXPECTED_LAKE_MANIFEST_BLOB: 71d2d1d50d8f0ca3d99347e6f2f00c54038b0e25
      EXPECTED_LAKEFILE_BLOB: 2afc2a7a30308ade4ea00e21966faa37232dd4dc
      EXPECTED_PROJECT_CACHE_KEY: qym-probe4-deps-v1-Linux-ecb9f60364b1d72200c847f9ae46918f12c8b6d05363c23cca5d361c92ea45d4
      REQUIRED_PROBE11_RUN: '31977171554'
      REQUIRED_PROBE11_JOB: '95238294576'
      REQUIRED_PROBE11_TRIGGER_SHA: f87e010fbcbf20fd5622c481fc4ca5ecb051b851
      REQUIRED_PROBE11_ARTIFACT_NAME: qym-repair-probe11-integrated-f87e010fbcbf20fd5622c481fc4ca5ecb051b851-attempt1
      REQUIRED_PROBE11_ARTIFACT_API_SIZE: '11576726'
      REQUIRED_PROBE11_ARTIFACT_DIGEST_SHA256: 036527ff0eaaf565261966a7f081805eba9ed256b3268564903febb4ece4c395
      REQUIRED_PROBE11_RESULT_SHA256: 09cafec26ff466a5fb148956cd5793e22021ffbefe43cfd4f012da25d268ddcb
      REQUIRED_PROBE11_LOG_SHA256: 474f153278507d0ead7fe21675f326def15556281bd7b5cf67392836ea5ea97e
      REQUIRED_PROBE11_HEADERS_SHA256: b0fe7508ba87fc324236cce71b74c59d042a0833ec1c101a1ae625a1f24dd4e6
      REQUIRED_PROBE11_DIAGNOSTICS_SHA256: d9259b316d1c1317ea7e11f8f0370feaabacb3a2ae6066c3133ab748a2dee504
      REQUIRED_PROBE11_ERROR_HEADERS: '217'
      REQUIRED_PROBE11_WARNING_HEADERS: '350'
      EXPECTED_PROBE11_SHA256: d8290febb2b1c69cc8b911bcb672303beede1b87db290bd37c6608e39356cf25
      EXPECTED_PROBE11_BLOB: 9b5ba50acc8e2f3d6f55cf8cef6fc505926410cd
      EXPECTED_PROBE12_SHA256: 4a123f69912bd7ce2ab070433f8cad0ecc284652a9cbab634def1936e9037212
      EXPECTED_PROBE12_BLOB: 76dd931638b9a6ad50ee764c65cd14489e8be310
      EXPECTED_P12_INTEGRATOR_SHA256: e71aebd77f879780ca57bc83e5704ef0857face73df59a3f0adb1ed6b509af2d
      EXPECTED_P12_EARLY_SHA256: 35b5ccf5f04899c810ca798cbcf700230fdfc4b930d16ab5d9cf646584954215
      EXPECTED_P12_36K42K_SHA256: 5bd02f57232ac30c336b3e13574b7cba4dc4b0998f159e3fdebd41ed6354a365
      EXPECTED_P12_43K49K_SHA256: 5070ada686ac425b76403ae53210e586bda305a8a70606d6d3bc6529ff2b2523
      EXPECTED_P12_43K49K_BASE_SHA256: 5cea81a9deb981609655d767487a3cbb5fda032849869902ba074d8729fa976d
      EXPECTED_P12_50K53K_SHA256: 5352b37ec754a5131164e91649b54a277b5d257258bc316f653b6d218bfb63c8
      EXPECTED_P12_52K61K_SHA256: 7066e3297bd171ec58a4547ed426a8d9a6228abf4de78bf3ad203d880ef7f795
      EXPECTED_P12_52K61K_BASE_SHA256: dde4c4df0473bbbd1da69bce9968f00b0859d045d254740b5852f72e5b489545
      QYM_SOURCE: PrimalitySheafVerification/QYM.lean
      M2_SOURCE: PrimalitySheafVerification/Mock2.lean
      M2A_SOURCE: PrimalitySheafVerification/Mock2_Advanced.lean
      FA_SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED_SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      P12_INTEGRATOR: scripts/qym_probe12_integrated.py
      P12_EARLY: scripts/qym-probe12-early-frontier-p11-conditional/qym_probe12_early_frontier_p11_conditional.py
      P12_36K42K: scripts/qym-probe12-36k42k-p11-reanchored/qym_probe12_36k42k_p11_reanchored.py
      P12_43K49K: scripts/qym-probe12-43k49k-p11-conditional/qym_probe12_43k49k_p11_conditional.py
      P12_43K49K_BASE: scripts/qym-probe12-43k49k-p10-conditional/qym_probe12_43k49k_p10_conditional.py
      P12_50K53K: scripts/qym-probe12-50k53k-p11-conditional/qym_probe12_50k53k_p11_conditional.py
      P12_52K61K: scripts/qym-probe12-52k61k-p11-conditional/qym_probe12_52k61k_p11_conditional.py
      P12_52K61K_BASE: scripts/qym-probe12-52k61k-p10-conditional/qym_probe12_52k61k_p10_conditional.py
      OLEAN_ROOT: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Lock add-only installation delta and every exact input
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          mapfile -t parents < <(git rev-list --parents -n 1 HEAD)
          read -r -a parent_fields <<< "${parents[0]}"
          test "${#parent_fields[@]}" -eq 2
          test "${parent_fields[1]}" = "$EXPECTED_INSTALL_PARENT"
          git diff-tree --no-commit-id --name-status -r HEAD^ HEAD | sort > "$OUT/install-delta.actual.txt"
          cat > "$OUT/install-delta.expected.txt" <<'EOF'
          A	.github/workflows/codex-qym-repair-probe12-integrated.yml
          A	scripts/qym-probe12-36k42k-p11-reanchored/qym_probe12_36k42k_p11_reanchored.py
          A	scripts/qym-probe12-43k49k-p10-conditional/qym_probe12_43k49k_p10_conditional.py
          A	scripts/qym-probe12-43k49k-p11-conditional/qym_probe12_43k49k_p11_conditional.py
          A	scripts/qym-probe12-50k53k-p11-conditional/qym_probe12_50k53k_p11_conditional.py
          A	scripts/qym-probe12-52k61k-p10-conditional/qym_probe12_52k61k_p10_conditional.py
          A	scripts/qym-probe12-52k61k-p11-conditional/qym_probe12_52k61k_p11_conditional.py
          A	scripts/qym-probe12-early-frontier-p11-conditional/qym_probe12_early_frontier_p11_conditional.py
          A	scripts/qym_probe12_integrated.py
          EOF
          sed -i 's/^          //' "$OUT/install-delta.expected.txt"
          cmp "$OUT/install-delta.expected.txt" "$OUT/install-delta.actual.txt"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_QYM_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$EXPECTED_QYM_BLOB"
          test "$(sha256sum "$M2_SOURCE" | awk '{print $1}')" = "$EXPECTED_M2_SHA256"
          test "$(git hash-object --no-filters "$M2_SOURCE")" = "$EXPECTED_M2_BLOB"
          test "$(sha256sum "$M2A_SOURCE" | awk '{print $1}')" = "$EXPECTED_M2A_SHA256"
          test "$(git hash-object --no-filters "$M2A_SOURCE")" = "$EXPECTED_M2A_BLOB"
          test "$(sha256sum "$FA_SOURCE" | awk '{print $1}')" = "$EXPECTED_FA_SHA256"
          test "$(git hash-object --no-filters "$FA_SOURCE")" = "$EXPECTED_FA_BLOB"
          test "$(sha256sum "$INTEGRATED_SOURCE" | awk '{print $1}')" = "$EXPECTED_INTEGRATED_SHA256"
          test "$(git hash-object --no-filters "$INTEGRATED_SOURCE")" = "$EXPECTED_INTEGRATED_BLOB"
          test "$(sha256sum lean-toolchain | awk '{print $1}')" = "$EXPECTED_TOOLCHAIN_SHA256"
          test "$(git hash-object --no-filters lean-toolchain)" = "$EXPECTED_TOOLCHAIN_BLOB"
          test "$(git hash-object --no-filters lake-manifest.json)" = "$EXPECTED_LAKE_MANIFEST_BLOB"
          test "$(git hash-object --no-filters lakefile.lean)" = "$EXPECTED_LAKEFILE_BLOB"
          test "$(sha256sum "$P12_INTEGRATOR" | awk '{print $1}')" = "$EXPECTED_P12_INTEGRATOR_SHA256"
          test "$(sha256sum "$P12_EARLY" | awk '{print $1}')" = "$EXPECTED_P12_EARLY_SHA256"
          test "$(sha256sum "$P12_36K42K" | awk '{print $1}')" = "$EXPECTED_P12_36K42K_SHA256"
          test "$(sha256sum "$P12_43K49K" | awk '{print $1}')" = "$EXPECTED_P12_43K49K_SHA256"
          test "$(sha256sum "$P12_43K49K_BASE" | awk '{print $1}')" = "$EXPECTED_P12_43K49K_BASE_SHA256"
          test "$(sha256sum "$P12_50K53K" | awk '{print $1}')" = "$EXPECTED_P12_50K53K_SHA256"
          test "$(sha256sum "$P12_52K61K" | awk '{print $1}')" = "$EXPECTED_P12_52K61K_SHA256"
          test "$(sha256sum "$P12_52K61K_BASE" | awk '{print $1}')" = "$EXPECTED_P12_52K61K_BASE_SHA256"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.before.txt"
          test ! -s "$OUT/git-status.before.txt"
          sha256sum "$P12_INTEGRATOR" "$P12_EARLY" "$P12_36K42K" \
            "$P12_43K49K" "$P12_43K49K_BASE" "$P12_50K53K" "$P12_52K61K" \
            "$P12_52K61K_BASE" > "$OUT/input-files.sha256"

      - name: Verify immutable terminal Probe11 artifact metadata
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          gh api "repos/leegahuyn/mathlib4/actions/runs/$REQUIRED_PROBE11_RUN/artifacts?per_page=100" \
            > "$OUT/PROBE11_ARTIFACTS.json"
          gh api "repos/leegahuyn/mathlib4/actions/jobs/$REQUIRED_PROBE11_JOB" \
            > "$OUT/PROBE11_JOB_METADATA.json"
          python3 - "$OUT/PROBE11_ARTIFACTS.json" "$OUT/PROBE11_JOB_METADATA.json" \
            "$OUT/PROBE11_ARTIFACT_ID.txt" <<'PY'
          import json, os, sys
          payload = json.load(open(sys.argv[1], encoding='utf-8'))
          job = json.load(open(sys.argv[2], encoding='utf-8'))
          matches = [a for a in payload.get('artifacts', [])
                     if a.get('name') == os.environ['REQUIRED_PROBE11_ARTIFACT_NAME']]
          assert len(matches) == 1
          artifact = matches[0]
          assert artifact['size_in_bytes'] == int(os.environ['REQUIRED_PROBE11_ARTIFACT_API_SIZE'])
          assert artifact['digest'] == 'sha256:' + os.environ['REQUIRED_PROBE11_ARTIFACT_DIGEST_SHA256']
          assert artifact['expired'] is False
          workflow_run = artifact.get('workflow_run') or {}
          assert workflow_run.get('id') == int(os.environ['REQUIRED_PROBE11_RUN'])
          assert workflow_run.get('head_sha') == os.environ['REQUIRED_PROBE11_TRIGGER_SHA']
          assert job['id'] == int(os.environ['REQUIRED_PROBE11_JOB'])
          assert job['run_id'] == int(os.environ['REQUIRED_PROBE11_RUN'])
          open(sys.argv[3], 'w', encoding='utf-8').write(str(artifact['id']) + '\n')
          PY

      - name: Download immutable terminal Probe11 authority artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.REQUIRED_PROBE11_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/probe11-authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 31977171554

      - name: Hard gate Probe12 on exact terminal Probe11 bytes
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          authority="$RUNNER_TEMP/probe11-authority"
          for file in PROBE_RESULT.json QYM.candidate-probe11.lean QYM.log \
            QYM.error-headers.txt QYM.diagnostics.jsonl QYM.exit QYM.panic-lines.txt; do
            test -f "$authority/$file"
          done
          test "$(sha256sum "$authority/PROBE_RESULT.json" | awk '{print $1}')" = "$REQUIRED_PROBE11_RESULT_SHA256"
          test "$(sha256sum "$authority/QYM.candidate-probe11.lean" | awk '{print $1}')" = "$EXPECTED_PROBE11_SHA256"
          test "$(git hash-object --no-filters "$authority/QYM.candidate-probe11.lean")" = "$EXPECTED_PROBE11_BLOB"
          test "$(sha256sum "$authority/QYM.log" | awk '{print $1}')" = "$REQUIRED_PROBE11_LOG_SHA256"
          test "$(sha256sum "$authority/QYM.error-headers.txt" | awk '{print $1}')" = "$REQUIRED_PROBE11_HEADERS_SHA256"
          test "$(sha256sum "$authority/QYM.diagnostics.jsonl" | awk '{print $1}')" = "$REQUIRED_PROBE11_DIAGNOSTICS_SHA256"
          test "$(cat "$authority/QYM.exit")" = 1
          test ! -s "$authority/QYM.panic-lines.txt"
          python3 - "$authority/PROBE_RESULT.json" "$authority/QYM.candidate-probe11.lean" \
            "$authority/QYM.error-headers.txt" "$authority/QYM.diagnostics.jsonl" \
            "$OUT/PROBE12_ACTIVATION_EVIDENCE.json" <<'PY'
          import hashlib, json, os, re, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          candidate = open(sys.argv[2], 'rb').read()
          headers = open(sys.argv[3], encoding='utf-8').read().splitlines()
          diagnostics = [json.loads(line) for line in open(sys.argv[4], encoding='utf-8')]
          assert result['schema'] == 'qym-deterministic-repair-probe11-integrated-v1'
          assert result['github_sha'] == os.environ['REQUIRED_PROBE11_TRIGGER_SHA']
          assert result['candidate_qym_sha256'] == os.environ['EXPECTED_PROBE11_SHA256']
          assert result['candidate_qym_blob'] == os.environ['EXPECTED_PROBE11_BLOB']
          assert result['log_sha256'] == os.environ['REQUIRED_PROBE11_LOG_SHA256']
          assert result['exit'] == 1 and result['semantic_pass'] is False
          assert result['error_headers'] == int(os.environ['REQUIRED_PROBE11_ERROR_HEADERS'])
          assert result['warning_headers'] == int(os.environ['REQUIRED_PROBE11_WARNING_HEADERS'])
          assert result['panic_lines'] == 0
          assert len(headers) == int(os.environ['REQUIRED_PROBE11_ERROR_HEADERS'])
          assert sum(row.get('severity') == 'error' for row in diagnostics) == 217
          assert sum(row.get('severity') == 'warning' for row in diagnostics) == 350
          assert hashlib.sha256(candidate).hexdigest() == os.environ['EXPECTED_PROBE11_SHA256']
          assert len(candidate) == 2928376 and candidate.count(b'\n') == 61891
          assert b'\r' not in candidate and b'\0' not in candidate and candidate.endswith(b'\n')
          text = candidate.decode('utf-8')
          forbidden = {
              'sorry': len(re.findall(r'\bsorry\b', text)),
              'admit': len(re.findall(r'\badmit\b', text)),
              'native_decide': len(re.findall(r'\bnative_decide\b', text)),
              'Lean.ofReduceBool': text.count('Lean.ofReduceBool'),
              'axiom': len(re.findall(r'(?m)^\s*axiom\s+', text)),
              'unsafe': len(re.findall(r'(?m)^\s*unsafe\s+', text)),
              'maxHeartbeats_zero': len(re.findall(r'set_option\s+maxHeartbeats\s+0\b', text)),
          }
          assert not any(forbidden.values()), forbidden
          evidence = {
              'schema': 'qym-probe12-activation-evidence-v1',
              'status': 'PASS_EXACT_TERMINAL_PROBE11_AUTHORITY',
              'probe11_run': int(os.environ['REQUIRED_PROBE11_RUN']),
              'probe11_job': int(os.environ['REQUIRED_PROBE11_JOB']),
              'probe11_trigger_sha': result['github_sha'],
              'probe11_candidate_sha256': result['candidate_qym_sha256'],
              'probe11_log_sha256': result['log_sha256'],
              'probe11_headers_sha256': os.environ['REQUIRED_PROBE11_HEADERS_SHA256'],
              'probe11_diagnostics_sha256': os.environ['REQUIRED_PROBE11_DIAGNOSTICS_SHA256'],
              'errors': result['error_headers'],
              'warnings': result['warning_headers'],
              'trust': forbidden,
              'promotion_authorized': False,
          }
          open(sys.argv[5], 'w', encoding='utf-8').write(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          sha256sum "$authority/"* > "$OUT/PROBE11-authority-files.sha256"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          elan --version | tee "$OUT/elan-version.txt"
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore immutable dependency-output cache
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Validate cache state or build exact dependency chain
        id: dependencies
        shell: bash
        env:
          CACHE_HIT: ${{ steps.project-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.project-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.project-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          mkdir -p "$OLEAN_ROOT"
          test -n "$CACHE_PRIMARY_KEY"
          test "$CACHE_PRIMARY_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          case "$CACHE_HIT" in
            true) test "$CACHE_MATCHED_KEY" = "$CACHE_PRIMARY_KEY"; mode=hit-restored; built=false ;;
            '') test -z "$CACHE_MATCHED_KEY"; mode=miss-built; built=true ;;
            *) printf 'unexpected cache-hit state: <%s>\n' "$CACHE_HIT" >&2; exit 91 ;;
          esac
          if [[ "$built" = true ]]; then
            stems=(Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated)
            for stem in "${stems[@]}"; do
              source="PrimalitySheafVerification/$stem.lean"
              olean="$OLEAN_ROOT/$stem.olean"
              ilean="$OLEAN_ROOT/$stem.ilean"
              cap=1
              [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f -- "$olean" "$ilean"
              set +e
              /usr/bin/time -v -o "$OUT/$stem.time" \
                lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                  -o "$olean" -i "$ilean" "$source" > "$OUT/$stem.log" 2>&1
              rc=$?
              set -e
              printf '%s\n' "$rc" > "$OUT/$stem.exit"
              test "$rc" -eq 0
              test -s "$olean" && test -s "$ilean"
            done
          fi
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN_ROOT/$stem.olean"
            test -s "$OLEAN_ROOT/$stem.ilean"
            sha256sum "$OLEAN_ROOT/$stem.olean" "$OLEAN_ROOT/$stem.ilean"
          done > "$OUT/dependency-outputs.sha256"
          printf '%s\n' "$mode" > "$OUT/project-cache-status.txt"
          printf '%s\n' "$CACHE_PRIMARY_KEY" > "$OUT/project-cache-primary-key.txt"
          printf 'built=%s\n' "$built" >> "$GITHUB_OUTPUT"
          printf 'cache_key=%s\n' "$CACHE_PRIMARY_KEY" >> "$GITHUB_OUTPUT"

      - name: Save immutable dependency outputs after an exact miss
        if: steps.project-cache.outputs.cache-hit == '' && steps.dependencies.outputs.built == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: ${{ steps.dependencies.outputs.cache_key }}

      - name: Apply exact integrated Probe12 and prove inverse before compile
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          authority="$RUNNER_TEMP/probe11-authority"
          cp "$QYM_SOURCE" "$OUT/QYM.authority.lean"
          cp "$authority/QYM.candidate-probe11.lean" "$OUT/QYM.candidate-probe11.lean"
          python3 -B "$P12_INTEGRATOR" "$OUT/QYM.candidate-probe11.lean" \
            "$OUT/QYM.candidate-probe12.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE12.json"
          test "$(sha256sum "$OUT/QYM.candidate-probe12.lean" | awk '{print $1}')" = "$EXPECTED_PROBE12_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe12.lean")" = "$EXPECTED_PROBE12_BLOB"
          python3 -B "$P12_INTEGRATOR" "$OUT/QYM.candidate-probe12.lean" \
            "$OUT/QYM.restored-probe11.lean" --inverse --audit "$OUT/TRANSFORM_AUDIT_PROBE12_INVERSE.json"
          cmp "$OUT/QYM.restored-probe11.lean" "$OUT/QYM.candidate-probe11.lean"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          cp "$OUT/QYM.candidate-probe12.lean" "$QYM_SOURCE"

      - name: Compile exact integrated Probe12 QYM candidate
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.probe12.olean" -i "$RUNNER_TEMP/QYM.probe12.ilean" \
            "$QYM_SOURCE" > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe12.olean" -i "$RUNNER_TEMP/QYM.probe12.ilean" \
              "$QYM_SOURCE" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe12.olean"
            test -s "$RUNNER_TEMP/QYM.probe12.ilean"
            sha256sum "$RUNNER_TEMP/QYM.probe12.olean" "$RUNNER_TEMP/QYM.probe12.ilean" \
              > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical QYM and collect coded diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          mkdir -p "$OUT"
          if [[ -f "$OUT/QYM.authority.lean" ]]; then
            cp "$OUT/QYM.authority.lean" "$QYM_SOURCE"
          fi
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_QYM_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$EXPECTED_QYM_BLOB"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.after.txt"
          test ! -s "$OUT/git-status.after.txt"
          python3 - "$OUT" <<'PY'
          import collections, hashlib, json, os, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          raw = (root / 'QYM.log').read_bytes() if (root / 'QYM.log').exists() else b''
          text = raw.decode('utf-8', errors='replace')
          header_re = re.compile(
              r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*'
              r'(?P<message>.*)$', re.M)
          rows = []
          for match in header_re.finditer(text):
              row = match.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [row for row in rows if row['severity'] == 'error']
          warnings = [row for row in rows if row['severity'] == 'warning']
          panic_re = re.compile(
              r'(?im)^(?P<line>.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*)$')
          panics = [m.group('line') for m in panic_re.finditer(text)]
          (root / 'QYM.diagnostics.jsonl').write_text(
              ''.join(json.dumps(row, sort_keys=True) + '\n' for row in rows), encoding='utf-8')
          (root / 'QYM.error-headers.txt').write_text(
              ''.join("{}:{}:{}: error{}: {}\n".format(
                  r['file'], r['line'], r['column'],
                  f"({r['code']})" if r['code'] else '', r['message']) for r in errors),
              encoding='utf-8')
          (root / 'QYM.panic-lines.txt').write_text(
              ''.join(line + '\n' for line in panics), encoding='utf-8')
          exit_code = int((root / 'QYM.exit').read_text().strip()) if (root / 'QYM.exit').exists() else None
          result = {
              'schema': 'qym-deterministic-repair-probe12-integrated-v1',
              'github_sha': os.environ['GITHUB_SHA'],
              'install_parent_sha': os.environ['EXPECTED_INSTALL_PARENT'],
              'authority_qym_sha256': os.environ['EXPECTED_QYM_SHA256'],
              'probe11_qym_sha256': os.environ['EXPECTED_PROBE11_SHA256'],
              'candidate_qym_sha256': os.environ['EXPECTED_PROBE12_SHA256'],
              'candidate_qym_blob': os.environ['EXPECTED_PROBE12_BLOB'],
              'exit': exit_code,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(
                  row['code'] or 'uncoded' for row in errors).items())),
              'warning_codes': dict(sorted(collections.Counter(
                  row['code'] or 'uncoded' for row in warnings).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_bytes': len(raw),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': exit_code == 0 and not errors and not panics,
          }
          (root / 'PROBE_RESULT.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload immutable integrated Probe12 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-repair-probe12-integrated-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qym-repair-probe12-integrated/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on exact integrated Probe12 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe12-integrated"
          python3 - "$OUT/PROBE_RESULT.json" "$OUT/TRANSFORM_AUDIT_PROBE12.json" \
            "$OUT/TRANSFORM_AUDIT_PROBE12_INVERSE.json" "$OUT/PROBE12_ACTIVATION_EVIDENCE.json" <<'PY'
          import json, os, sys
          result, forward, inverse, activation = (
              json.load(open(path, encoding='utf-8')) for path in sys.argv[1:])
          assert activation['status'] == 'PASS_EXACT_TERMINAL_PROBE11_AUTHORITY'
          assert activation['probe11_run'] == 31977171554
          assert activation['probe11_job'] == 95238294576
          assert activation['promotion_authorized'] is False
          assert result['schema'] == 'qym-deterministic-repair-probe12-integrated-v1'
          assert result['candidate_qym_sha256'] == os.environ['EXPECTED_PROBE12_SHA256']
          assert result['candidate_qym_blob'] == os.environ['EXPECTED_PROBE12_BLOB']
          assert result['panic_lines'] == 0
          assert forward['source']['sha256'] == os.environ['EXPECTED_PROBE11_SHA256']
          assert forward['result']['sha256'] == os.environ['EXPECTED_PROBE12_SHA256']
          assert forward['repair_families'] == 66 and forward['repair_occurrences'] == 66
          assert forward['inverse_byte_equal'] is True and not any(forward['trust'].values())
          assert inverse['source']['sha256'] == os.environ['EXPECTED_PROBE12_SHA256']
          assert inverse['result']['sha256'] == os.environ['EXPECTED_PROBE11_SHA256']
          assert inverse['inverse_byte_equal'] is True and not any(inverse['trust'].values())
          if not result['semantic_pass']:
              raise SystemExit(result['exit'] or 1)
          PY
