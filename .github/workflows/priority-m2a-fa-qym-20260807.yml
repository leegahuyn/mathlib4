name: Priority Mock2 Advanced FunctionalAnalysis QYM repair

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-m2a-fa-qym-20260807.yml'
      - 'PrimalitySheafVerification/Mock2.lean'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'scripts/apply_two_hundred_eighty_ninth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninetieth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_first_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_second_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_third_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fourth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fifth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_seventh_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_eighth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundredth_pass_repairs.py'
      - 'scripts/apply_three_hundred_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundred_tenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_eleventh_pass_repairs.py'
      - 'scripts/apply_three_hundred_twelfth_pass_repairs.py'
      - 'scripts/apply_three_hundred_thirteenth_pass_mock2_advanced_repairs.py'
      - 'scripts/apply_three_hundred_fourteenth_pass_mock2_advanced_repairs.py'
      - 'scripts/apply_three_hundred_thirteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fourteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fifteenth_pass_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: priority-m2a-fa-qym-repair
  cancel-in-progress: false

jobs:
  repair-in-dependency-order:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      QYM: PrimalitySheafVerification/QYM.lean
      ADVANCED_BASELINE_COMMIT: 623dfac27a24c170330d6218005e67b06490b814
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: /tmp/priority-m2a-fa-qym

    steps:
      - name: Clone exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          test "$(git rev-parse HEAD)" = "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          mkdir -p "${OUTDIR}" "${LOGDIR}/logs" "${LOGDIR}/source"
          printf '%s\n' \
            "start_head=$(git rev-parse HEAD)" \
            "utc_started=$(date -u +%FT%TZ)" \
            > "${LOGDIR}/snapshot.txt"

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version | tee "${LOGDIR}/lean-version.txt"
          "${HOME}/.elan/bin/lake" --version | tee "${LOGDIR}/lake-version.txt"
          "${HOME}/.elan/bin/lake" exe cache get 2>&1 | tee "${LOGDIR}/logs/cache-get.log"

      - name: Repair and directly verify Advanced then FunctionalAnalysis then QYM
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo 'module,stage,exit_code,error_count,warning_count' > "${LOGDIR}/compile-summary.csv"

          compile_one() {
            local module="$1" stage="$2" log code errors warnings
            log="${LOGDIR}/logs/${stage}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' \
              "${module}" "${stage}" "${code}" "${errors}" "${warnings}" \
              >> "${LOGDIR}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              {
                echo "module=${module}"
                echo "stage=${stage}"
                echo "exit_code=${code}"
                echo "error_count=${errors}"
                echo 'first_errors:'
                grep -n 'error:' "${log}" | head -20 || true
                echo 'last_error:'
                grep -n 'error:' "${log}" | tail -1 || true
                echo 'tail:'
                tail -220 "${log}" || true
              } | tee "${LOGDIR}/${stage}-failure.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi \
              "maximum number of errors|missing object file|declaration uses 'sorry'|sorryAx|PANIC|segmentation fault|stack overflow" \
              "${log}"; then
              grep -nEi \
                "maximum number of errors|missing object file|declaration uses 'sorry'|sorryAx|PANIC|segmentation fault|stack overflow" \
                "${log}" || true
              return 1
            fi
          }

          compile_twice() {
            local module="$1" prefix="$2"
            compile_one "${module}" "${prefix}-pass1"
            compile_one "${module}" "${prefix}-pass2"
          }

          audit_source() {
            TARGET_SCAN="$1" python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path(os.environ['TARGET_SCAN'])
          src = path.read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-', i): depth += 1; out.extend('  '); i += 2
                  elif src.startswith('-/', i): depth -= 1; out.extend('  '); i += 2
                  else: out.append('\n' if src[i] == '\n' else ' '); i += 1
              elif string:
                  c=src[i]; out.append('\n' if c == '\n' else ' ')
                  if esc: esc=False
                  elif c == '\\': esc=True
                  elif c == '"': string=False
                  i += 1
              elif src.startswith('/-', i): depth=1; out.extend('  '); i += 2
              elif src.startswith('--', i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i += 1
              elif src[i] == '"': string=True; out.append(' '); i += 1
              else: out.append(src[i]); i += 1
          if depth or string: raise SystemExit('unterminated comment or string')
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b', 'admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*axiom\b', 'unsafe':r'\bunsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          print(f'[{path}]')
          for name, pat in patterns.items():
              count=len(re.findall(pat, code)); print(f'{name}={count}'); bad |= count != 0
          if bad: raise SystemExit(1)
          PY
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # Dependency 0: the already-materialized elementary Mock2 source.
          audit_source "${MOCK2}" | tee "${LOGDIR}/Mock2-audit.txt"
          compile_twice Mock2 Mock2-direct

          # Dependency 1: Mock2_Advanced. Prefer checked-in direct source; otherwise
          # generate the candidate, verify it twice, commit it, and only then continue.
          if compile_twice Mock2_Advanced Advanced-checked-in; then
            echo 'advanced_source=already_direct' | tee -a "${LOGDIR}/snapshot.txt"
          else
            git restore --source=HEAD --worktree -- "${ADVANCED}"
            advanced_scripts=(
              apply_two_hundred_eighty_ninth_pass_repairs.py
              apply_two_hundred_ninetieth_pass_repairs.py
              apply_two_hundred_ninety_first_pass_repairs.py
              apply_two_hundred_ninety_second_pass_repairs.py
              apply_two_hundred_ninety_third_pass_repairs.py
              apply_two_hundred_ninety_fourth_pass_repairs.py
              apply_two_hundred_ninety_fifth_pass_repairs.py
              apply_two_hundred_ninety_seventh_pass_repairs.py
              apply_two_hundred_ninety_eighth_pass_repairs.py
              apply_two_hundred_ninety_ninth_pass_repairs.py
              apply_three_hundredth_pass_repairs.py
              apply_three_hundred_ninth_pass_repairs.py
              apply_three_hundred_tenth_pass_repairs.py
              apply_three_hundred_eleventh_pass_repairs.py
              apply_three_hundred_twelfth_pass_repairs.py
              apply_three_hundred_thirteenth_pass_mock2_advanced_repairs.py
              apply_three_hundred_fourteenth_pass_mock2_advanced_repairs.py
            )
            for script in "${advanced_scripts[@]}"; do
              echo "===== scripts/${script} ====="
              python3 "scripts/${script}"
            done 2>&1 | tee "${LOGDIR}/logs/advanced-repair-application.log"
            while IFS= read -r changed; do
              if [[ -n "${changed}" && "${changed}" != "${ADVANCED}" ]]; then
                git restore --source=HEAD --worktree -- "${changed}"
              fi
            done < <(git diff --name-only)
            test "$(git diff --name-only)" = "${ADVANCED}"
            git diff --check
            audit_source "${ADVANCED}" | tee "${LOGDIR}/Advanced-candidate-audit.txt"
            compile_twice Mock2 Mock2-before-advanced-candidate
            compile_twice Mock2_Advanced Advanced-candidate
            cp "${ADVANCED}" "${LOGDIR}/source/Mock2_Advanced.lean"
            git add "${ADVANCED}"
            test "$(git diff --cached --name-only)" = "${ADVANCED}"
            git commit -m 'fix: materialize verified Mock2 Advanced source'
            git push origin "HEAD:${BRANCH}"
            echo "advanced_materialized_commit=$(git rev-parse HEAD)" | tee -a "${LOGDIR}/snapshot.txt"
            compile_twice Mock2_Advanced Advanced-materialized-direct
          fi

          # Dependency 2: FunctionalAnalysis. Reproduce its accumulated candidate
          # in isolation using the historical Advanced baseline, then restore the
          # now-materialized Advanced source before compiling FA.
          if compile_twice Mock2_FunctionalAnalysis FA-checked-in; then
            echo 'fa_source=already_direct' | tee -a "${LOGDIR}/snapshot.txt"
          else
            git restore --source=HEAD --worktree -- .
            cp "${ADVANCED}" /tmp/Mock2_Advanced-final.lean
            git fetch --depth=1 origin "${ADVANCED_BASELINE_COMMIT}"
            git show "${ADVANCED_BASELINE_COMMIT}:${ADVANCED}" > "${ADVANCED}"
            shared_scripts=(
              apply_two_hundred_eighty_ninth_pass_repairs.py
              apply_two_hundred_ninetieth_pass_repairs.py
              apply_two_hundred_ninety_first_pass_repairs.py
              apply_two_hundred_ninety_second_pass_repairs.py
              apply_two_hundred_ninety_third_pass_repairs.py
              apply_two_hundred_ninety_fourth_pass_repairs.py
              apply_two_hundred_ninety_fifth_pass_repairs.py
              apply_two_hundred_ninety_seventh_pass_repairs.py
              apply_two_hundred_ninety_eighth_pass_repairs.py
              apply_two_hundred_ninety_ninth_pass_repairs.py
              apply_three_hundredth_pass_repairs.py
            )
            for script in "${shared_scripts[@]}"; do
              echo "===== scripts/${script} ====="
              python3 "scripts/${script}"
            done 2>&1 | tee "${LOGDIR}/logs/fa-shared-repair-application.log"
            for script in \
              apply_three_hundred_thirteenth_pass_repairs.py \
              apply_three_hundred_fourteenth_pass_repairs.py \
              apply_three_hundred_fifteenth_pass_repairs.py; do
              echo "===== scripts/${script} ====="
              python3 "scripts/${script}"
            done 2>&1 | tee "${LOGDIR}/logs/fa-final-repair-application.log"
            cp "${FA}" /tmp/Mock2_FunctionalAnalysis-candidate.lean
            git restore --source=HEAD --worktree -- .
            cp /tmp/Mock2_FunctionalAnalysis-candidate.lean "${FA}"
            test "$(git diff --name-only)" = "${FA}"
            git diff --check
            audit_source "${FA}" | tee "${LOGDIR}/FA-candidate-audit.txt"
            compile_twice Mock2 Mock2-before-fa-candidate
            compile_twice Mock2_Advanced Advanced-before-fa-candidate
            compile_twice Mock2_FunctionalAnalysis FA-candidate
            cp "${FA}" "${LOGDIR}/source/Mock2_FunctionalAnalysis.lean"
            git add "${FA}"
            test "$(git diff --cached --name-only)" = "${FA}"
            git commit -m 'fix: materialize verified Mock2 FunctionalAnalysis source'
            git push origin "HEAD:${BRANCH}"
            echo "fa_materialized_commit=$(git rev-parse HEAD)" | tee -a "${LOGDIR}/snapshot.txt"
            compile_twice Mock2_FunctionalAnalysis FA-materialized-direct
          fi

          # The integrated boundary imports FA, so it must be compiled after FA.
          audit_source "${INTEGRATED}" | tee "${LOGDIR}/Integrated-audit.txt"
          compile_twice Mock2_FunctionalAnalysis_Integrated Integrated-direct

          # Mock3/QYM is last and receives real .olean dependencies from all prior stages.
          audit_source "${QYM}" | tee "${LOGDIR}/QYM-audit.txt"
          compile_twice QYM QYM-direct

          sha256sum \
            "${MOCK2}" "${ADVANCED}" "${FA}" "${INTEGRATED}" "${QYM}" \
            "${OUTDIR}/Mock2.olean" "${OUTDIR}/Mock2_Advanced.olean" \
            "${OUTDIR}/Mock2_FunctionalAnalysis.olean" \
            "${OUTDIR}/Mock2_FunctionalAnalysis_Integrated.olean" \
            "${OUTDIR}/QYM.olean" \
            | tee "${LOGDIR}/provenance-sha256.txt"
          printf '%s\n' \
            "final_head=$(git rev-parse HEAD)" \
            "utc_completed=$(date -u +%FT%TZ)" \
            "Mock2_Advanced=PASS" \
            "Mock2_FunctionalAnalysis=PASS" \
            "Mock2_FunctionalAnalysis_Integrated=PASS" \
            "QYM=PASS" \
            | tee -a "${LOGDIR}/snapshot.txt"
