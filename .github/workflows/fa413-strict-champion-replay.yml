name: FA413 corrected strict champion replay and final two-pass gate

on:
  push:
    branches:
      - fix/fa413-strict-replay-from-champion31725-20260809
  workflow_dispatch:

permissions:
  contents: write

env:
  BASELINE_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  BASE_CHAMPION_BRANCH: 'champion/fa-pass376-31725-07f6efd-20260809'
  ACTIVE_BRANCH: 'fix/fa413-strict-replay-from-champion31725-20260809'

jobs:
  replay-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact FA413 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa413-strict-replay-from-champion31725-20260809
          fetch-depth: 2000
          persist-credentials: true

      - name: Verify restored champion baseline
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$BASELINE_SHA256"
          test -f build-logs/fa-pass376-champion-reproduction/REPRODUCED_31725_OR_BETTER
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Replay only PASS377-411 scripts with matching champion input SHA
        id: replay
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa413_strict_champion_replay.py
          rc=$?
          export REPLAY_RC="$rc"
          if test -f build-logs/fa412-strict-champion-replay/RESULT.json; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          r=json.loads(Path('build-logs/fa412-strict-champion-replay/RESULT.json').read_text())
          m=r.get('final_metric', {})
          print('strictly_improved=' + ('1' if r.get('strictly_improved') else '0'))
          print('final_passed=' + ('1' if r.get('final_passed') else '0'))
          print('final_sha256=' + str(r.get('final_sha256','')))
          print('final_first_error=' + str(m.get('first_error_line',0)))
          print('replay_rc=' + os.environ['REPLAY_RC'])
          PY
          else
            echo 'strictly_improved=0' >> "$GITHUB_OUTPUT"
            echo 'final_passed=0' >> "$GITHUB_OUTPUT"
            echo 'final_sha256=' >> "$GITHUB_OUTPUT"
            echo 'final_first_error=0' >> "$GITHUB_OUTPUT"
            echo "replay_rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run fresh ordered 2x gate only when replay reaches FA exit 0
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa413-ordered-final-gate
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          if test "${{ steps.replay.outputs.final_passed }}" != '1'; then
            printf 'FA did not reach exit 0 during strict replay; final gate not entered\n' > "$d/NOT_ENTERED.txt"
            echo 'final_exit=125' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp build-logs/fa412-strict-champion-replay/PROMOTED_SOURCE.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          if test "$actual" != "${{ steps.replay.outputs.final_sha256 }}"; then
            printf 'promoted source SHA mismatch\n' > "$d/HASH_FAILURE.txt"
            echo 'final_exit=124' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | \
             grep '^+' | grep -Ev '^\+\+\+' | \
             grep -E '\b(sorry|admit|native_decide|unsafe|axiom)\b' >/dev/null; then
            printf 'prohibited proof-bypass addition detected\n' > "$d/AUDIT_FAILURE.txt"
            echo 'final_exit=123' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compile_one() {
            local stem=$1
            local run=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=1400 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}-run${run}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          final=1
          compile_one Mock2 1; rc_m2=$?
          compile_one Mock2_Advanced 1; rc_m2a=$?
          rc_fa1=125; rc_fa2=125
          rc_int1=125; rc_int2=125
          rc_mock3=125; rc_qym1=125; rc_qym2=125

          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1; rc_fa1=$?
            if test "$rc_fa1" -eq 0; then
              compile_one Mock2_FunctionalAnalysis 2; rc_fa2=$?
            fi
          fi

          if test "$rc_fa2" -eq 0; then
            if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
              compile_one Mock2_FunctionalAnalysis_Integrated 1; rc_int1=$?
              if test "$rc_int1" -eq 0; then
                compile_one Mock2_FunctionalAnalysis_Integrated 2; rc_int2=$?
              fi
            else
              rc_int1=126; rc_int2=126
              printf 'required Integrated source missing\n' > "$d/Integrated_MISSING.txt"
            fi
          fi

          if test "$rc_int2" -eq 0; then
            shopt -s nullglob
            mock3_sources=(PrimalitySheafVerification/Mock3*.lean)
            if test "${#mock3_sources[@]}" -eq 0; then
              rc_mock3=126
              printf 'required Mock3 source missing\n' > "$d/Mock3_MISSING.txt"
            else
              rc_mock3=0
              for src in "${mock3_sources[@]}"; do
                stem=$(basename "$src" .lean)
                compile_one "$stem" 1; r1=$?
                r2=125
                if test "$r1" -eq 0; then
                  compile_one "$stem" 2; r2=$?
                fi
                if test "$r1" -ne 0 || test "$r2" -ne 0; then
                  rc_mock3=1
                fi
              done
            fi
          fi

          if test "$rc_int2" -eq 0 && test "$rc_mock3" -eq 0; then
            if test -f PrimalitySheafVerification/QYM.lean; then
              compile_one QYM 1; rc_qym1=$?
              if test "$rc_qym1" -eq 0; then
                compile_one QYM 2; rc_qym2=$?
              fi
            else
              rc_qym1=126; rc_qym2=126
              printf 'required QYM source missing\n' > "$d/QYM_MISSING.txt"
            fi
          fi

          if test "$rc_fa1" -eq 0 && test "$rc_fa2" -eq 0 && \
             test "$rc_int1" -eq 0 && test "$rc_int2" -eq 0 && \
             test "$rc_mock3" -eq 0 && test "$rc_qym1" -eq 0 && test "$rc_qym2" -eq 0; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA1="$rc_fa1" RC_FA2="$rc_fa2"
          export RC_INT1="$rc_int1" RC_INT2="$rc_int2" RC_MOCK3="$rc_mock3"
          export RC_QYM1="$rc_qym1" RC_QYM2="$rc_qym2" FINAL="$final"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          d=Path('build-logs/fa413-ordered-final-gate')
          pat=re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          rows={}
          for p in sorted(d.glob('*-run*.log')):
              text=p.read_text(encoding='utf-8',errors='replace')
              ms=list(pat.finditer(text))
              ep=p.with_suffix('.exit')
              rows[p.stem]={
                  'exit_code':int(ep.read_text()) if ep.exists() else 999,
                  'errors':len(ms),
                  'first_line':int(ms[0].group(1)) if ms else 0,
                  'first_col':int(ms[0].group(2)) if ms else 0,
              }
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          status={
              'complete':os.environ['FINAL']=='0' and (d/'ALL_REQUIRED_TARGETS_2X_PASS').exists(),
              'fa_source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'summary_exit':{
                  'Mock2':int(os.environ['RC_M2']),
                  'Mock2_Advanced':int(os.environ['RC_M2A']),
                  'FA_run1':int(os.environ['RC_FA1']),
                  'FA_run2':int(os.environ['RC_FA2']),
                  'Integrated_run1':int(os.environ['RC_INT1']),
                  'Integrated_run2':int(os.environ['RC_INT2']),
                  'Mock3_all_2x':int(os.environ['RC_MOCK3']),
                  'QYM_run1':int(os.environ['RC_QYM1']),
                  'QYM_run2':int(os.environ['RC_QYM2']),
              },
              'runs':rows,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze promotion payload outside the worktree
        if: steps.replay.outputs.strictly_improved == '1'
        shell: bash
        run: |
          set -euo pipefail
          cp build-logs/fa412-strict-champion-replay/PROMOTED_SOURCE.lean /tmp/fa413-promoted.lean
          cp build-logs/fa412-strict-champion-replay/RESULT.json /tmp/fa413-result.json
          if test -f build-logs/fa413-ordered-final-gate/CURRENT.json; then
            cp build-logs/fa413-ordered-final-gate/CURRENT.json /tmp/fa413-gate.json
          fi
          if test -f build-logs/fa413-ordered-final-gate/ALL_REQUIRED_TARGETS_2X_PASS; then
            touch /tmp/fa413-all-2x-pass
          fi

      - name: Preserve evidence without changing the champion source baseline
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || true
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$BASELINE_SHA256"
          git add build-logs/fa412-strict-champion-replay \
            build-logs/fa413-ordered-final-gate
          if ! git diff --cached --quiet; then
            git commit -m 'ci: preserve FA413 strict replay evidence [skip ci]'
            git push origin "HEAD:refs/heads/${ACTIVE_BRANCH}"
          fi

      - name: Create a new immutable checked-in champion for strict improvement
        if: steps.replay.outputs.strictly_improved == '1'
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum /tmp/fa413-promoted.lean | awk '{print $1}')
          test "$actual" = "${{ steps.replay.outputs.final_sha256 }}"
          short=${actual:0:12}
          if test -f /tmp/fa413-all-2x-pass; then
            label=final-2x
          else
            label="frontier-${{ steps.replay.outputs.final_first_error }}"
          fi
          champion="champion/fa-${label}-${short}-20260809"
          if git ls-remote --exit-code --heads origin "$champion" >/dev/null 2>&1; then
            echo "refusing to overwrite immutable branch $champion" >&2
            exit 41
          fi
          git fetch origin "$BASE_CHAMPION_BRANCH"
          git switch --detach "origin/$BASE_CHAMPION_BRANCH"
          git switch -c "$champion"
          cp /tmp/fa413-promoted.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p champion-records/fa-promotions
          cp /tmp/fa413-result.json "champion-records/fa-promotions/${label}-${short}.json"
          if test -f /tmp/fa413-gate.json; then
            cp /tmp/fa413-gate.json "champion-records/fa-promotions/${label}-${short}-gate.json"
          fi
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            champion-records/fa-promotions
          git commit -m "chore: check in strict FA ${label} champion [skip ci]"
          git push origin "HEAD:refs/heads/${champion}"
          echo "champion_branch=$champion" >> "$GITHUB_OUTPUT"
          echo "champion_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Create next isolated repair branch when the full gate remains incomplete
        if: steps.replay.outputs.strictly_improved == '1' && steps.gate.outputs.final_exit != '0'
        shell: bash
        run: |
          set -euo pipefail
          actual="${{ steps.replay.outputs.final_sha256 }}"
          short=${actual:0:12}
          line="${{ steps.replay.outputs.final_first_error }}"
          work="fix/fa-next-from-${line}-${short}-20260809"
          if git ls-remote --exit-code --heads origin "$work" >/dev/null 2>&1; then
            echo "refusing to overwrite work branch $work" >&2
            exit 42
          fi
          git switch -c "$work"
          mkdir -p build-logs/fa413-promotion
          cp /tmp/fa413-result.json build-logs/fa413-promotion/BASELINE.json
          if test -f /tmp/fa413-gate.json; then
            cp /tmp/fa413-gate.json build-logs/fa413-promotion/LAST_GATE.json
          fi
          git add build-logs/fa413-promotion
          git commit -m 'ci: initialize next strict FA repair frontier [skip ci]'
          git push origin "HEAD:refs/heads/${work}"

      - name: Upload FA413 replay and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa413-strict-replay-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa412-strict-champion-replay
            build-logs/fa413-ordered-final-gate
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce authoritative outcomes
        if: always()
        env:
          REPLAY_RC: ${{ steps.replay.outputs.replay_rc }}
          FINAL_PASSED: ${{ steps.replay.outputs.final_passed }}
          GATE_EXIT: ${{ steps.gate.outputs.final_exit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${REPLAY_RC:-1}" = '0'
          if test "${FINAL_PASSED:-0}" = '1'; then
            test "${GATE_EXIT:-1}" = '0'
          fi
