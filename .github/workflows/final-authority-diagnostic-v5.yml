name: Final Authority Diagnostic v5 — Non-Stopping Broad Sweep

on:
  push:
    branches:
      - gpt/final13-m1a-native-clean-six-candidate-20260820
    paths:
      - .github/workflows/final-authority-diagnostic-v5.yml
      - scripts/final_authority_gate_v5.py
  workflow_dispatch:

concurrency:
  group: final-authority-diagnostic-v5-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  broad-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact diagnostic tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify protected identities and apply verified M1A batch locally
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .diagnostic_v5
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          test "$(sha256sum PrimalitySheafVerification/Mock1_Advanced.lean | awk '{print $1}')" = "d2cf9f101e04d58e0fd87e62d1f102b8eb910d4cc5e3e9d2b903e5c7df0f98f2"
          python3 scripts/final13_r5_patch_mock1_advanced_six.py \
            hrange-rfl-norm \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            .diagnostic_v5/Mock1_Advanced.patched.lean \
            | tee .diagnostic_v5/M1A_PATCH_RESULT.txt
          mv .diagnostic_v5/Mock1_Advanced.patched.lean PrimalitySheafVerification/Mock1_Advanced.lean
          test "$(sha256sum PrimalitySheafVerification/Mock1_Advanced.lean | awk '{print $1}')" = "b14bcea1991b4f9b6fcde207b9d25b31cceb54f7601715fd6b6e2d988ecbfe53"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = "3b6596bbc0790c7d6e427c44e2b0b18b8af3efa6"
          ! grep -nE '\b(sorry|admit|native_decide)\b|set_option[[:space:]]+maxHeartbeats[[:space:]]+0' PrimalitySheafVerification/Mock1_Advanced.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .diagnostic_v5/LEAN_VERSION.txt
          lake --version | tee .diagnostic_v5/LAKE_VERSION.txt

      - name: Run QYM replay, Mock3, all Final13 roots and downstream gates without early stop
        id: gate
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final13-m1a-native-clean-six-candidate-20260820
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          python3 scripts/final_authority_gate_v5.py 2>&1 | tee .diagnostic_v5/FINAL_AUTHORITY_DIAGNOSTIC_V5.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" | tee .diagnostic_v5/FINAL_AUTHORITY_DIAGNOSTIC_V5_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Surface complete diagnostic frontier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          for f in PREFLIGHT.json QYM_CANONICAL_REPLAY_RESULT.json MOCK3_CANONICAL_RESULT.json FINAL13_DIAGNOSTIC_SWEEP.json FINAL_13_BUILD_RESULTS.json BUILDALL_RESULT.json CLEAN_BUILD_1_RESULT.json CLEAN_BUILD_2_RESULT.json FINAL_SOURCE_IDENTITY.json FORBIDDEN_AUDIT.json FINAL_15_CHECKLIST_RESULT.json; do
            echo "=== $f ==="
            cat ".final_authority/$f" 2>/dev/null || true
          done
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.final_authority/FINAL_13_BUILD_RESULTS.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('FINAL13_COUNTS', d.get('counts'))
              for row in d.get('results', []):
                  if row.get('pass') is not True:
                      print('FINAL13_FAILURE', {k: row.get(k) for k in (
                          'path','status','exit','error_headers','warning_headers',
                          'panic_lines','first_error','blocker_declaration','log_path')})
          p = Path('.final_authority/FORBIDDEN_AUDIT.json')
          if p.exists():
              d = json.loads(p.read_text())
              print('FORBIDDEN_COUNT', d.get('forbidden_count'))
              for row in d.get('files', []):
                  total = sum(row.get('forbidden', {}).values())
                  if total:
                      print('FORBIDDEN_FILE', row.get('path'), total, row.get('forbidden'))
          PY

      - name: Upload full non-stopping diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-diagnostic-v5-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .diagnostic_v5
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Record diagnostic completion without masking authority exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .diagnostic_v5/FINAL_AUTHORITY_DIAGNOSTIC_V5_EXIT.txt
          echo "Authority exit: $(cat .diagnostic_v5/FINAL_AUTHORITY_DIAGNOSTIC_V5_EXIT.txt)"
