name: Freeze and publish Formalization FINAL AUTHORITY 20260821

on:
  push:
    branches: [gpt/final-authority-release-20260821]
    paths: [.github/workflows/final-authority-freeze-release-20260821.yml]
  pull_request:
    branches: [gpt/final-authority-pass-20260821]
    paths: [.github/workflows/final-authority-freeze-release-20260821.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: formalization-final-authority-freeze-release-20260821
  cancel-in-progress: false

jobs:
  freeze-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REPO: leegahuyn/mathlib4
      SOURCE: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
      FINAL_BRANCH: gpt/final-authority-pass-20260821
      ARCHIVE_BRANCH: archive/formalization-final-2026-08-21
      TAG: formalization-final-2026-08-21
      FULL_ID: "9435161106"
      FULL_SHA: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
      QYM_ID: "9398192196"
      QYM_SHA: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
      TERM_ID: "9436985567"
      TERM_SHA: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee
    steps:
      - name: Checkout full repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: true

      - name: Verify and detach to exact immutable source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${FINAL_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${ARCHIVE_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          git checkout --detach "${SOURCE}"
          test "$(git rev-parse HEAD)" = "${SOURCE}"
          test -z "$(git status --short --untracked-files=no)"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = 28f614d48e02a0f28d3f5a758e813350b3ea89cf
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = 464f5dd095876b20165d12690c8127ef9d909e6a
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = 7afb309d7c4da97da7bc6b922931734d72830d41
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = 3b6596bbc0790c7d6e427c44e2b0b18b8af3efa6
          test "$(git hash-object --no-filters PrimalitySheafVerification/Spt3.lean)" = a73d346d060a9a2b8b3dca636e0e611eb394f69c
          test "$(git hash-object --no-filters PrimalitySheafVerification/BuildAll.lean)" = fc6fb147b8505b434104cf1ef50dd9243baa79f9

      - name: Download and verify original evidence artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets terminal
          get_artifact() {
            curl --fail --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/$1/zip" -o "assets/$2"
            echo "$3  assets/$2" | sha256sum --check -
          }
          get_artifact "${FULL_ID}" final-authority-pr-gate-v8-32443566530-attempt1.zip "${FULL_SHA}"
          get_artifact "${QYM_ID}" qym-gb0-independent-replay-32344604895-attempt1.zip "${QYM_SHA}"
          get_artifact "${TERM_ID}" final-authority-terminal-v12-32455051059-attempt1.zip "${TERM_SHA}"
          unzip -q assets/final-authority-terminal-v12-32455051059-attempt1.zip -d terminal

      - name: Validate and expose exact terminal reports
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          root, out = Path('terminal'), Path('assets')
          def one(name):
              rows=list(root.rglob(name)); assert len(rows)==1, (name,len(rows)); return rows[0]
          def load(name): return json.loads(one(name).read_text())
          f=load('FINAL_13_BUILD_RESULTS.json'); b=load('BUILDALL_RESULT.json')
          c1=load('CLEAN_BUILD_1_RESULT.json'); c2=load('CLEAN_BUILD_2_RESULT.json')
          ck=load('FINAL_15_CHECKLIST_RESULT.json'); x=load('FORBIDDEN_AUDIT.json')
          ax=load('AXIOM_AUDIT.json'); ident=load('FINAL_SOURCE_IDENTITY.json')
          q=load('QYM_CANONICAL_REPLAY_RESULT.json'); m=load('MOCK3_CANONICAL_RESULT.json')
          assert f['pass'] and f['counts']=={'PASS':13,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert f['bridge_counts']=={'PASS':2,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert b['pass'] and b['aggregate_result']['exit']==0 and b['aggregate_result']['error_headers']==0
          assert b['required_skipped_targets']==[] and c1['pass'] and c2['pass']
          assert ck['pass'] and ck['counts']=={'PASS':15,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert x['pass'] and x['forbidden_count']==0 and ax['pass'] and ident['pass']
          assert ident['tested_source_commit']=='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          assert ident['all_pass_evidence_source_identical'] and q['pass'] and m['pass']
          for name in ['FINAL_TRUE_PASS_REPORT.md','FINAL_STATUS_CARD.md','FINAL_SOURCE_IDENTITY.json',
                       'FINAL_15_CHECKLIST_RESULT.json','CLEAN_BUILD_1_RESULT.json','CLEAN_BUILD_2_RESULT.json',
                       'BUILDALL_RESULT.json','FINAL_13_BUILD_RESULTS.json','FINAL_13_ROOTS.txt',
                       'FORBIDDEN_AUDIT.json','AXIOM_AUDIT.json','QYM_CANONICAL_REPLAY_RESULT.json',
                       'MOCK3_CANONICAL_RESULT.json','TERMINAL_EVIDENCE_INDEX.json']:
              shutil.copy2(one(name), out/name)
          PY

      - name: Create exact git archive, manifest and verification helpers
        shell: bash
        run: |
          set -euo pipefail
          paths=(PrimalitySheafVerification lean-toolchain lake-manifest.json)
          for p in lakefile.toml lakefile.lean CITATION.md scripts .github/workflows/final-authority-pr-gate-v7.yml; do
            git cat-file -e "${SOURCE}:${p}" 2>/dev/null && paths+=("${p}") || true
          done
          git archive --format=tar.gz --prefix=mathlib4-formalization-final-8f7e861f/ \
            -o assets/formalization-final-source-8f7e861f.tar.gz "${SOURCE}" "${paths[@]}"
          cat > assets/FINAL_AUTHORITY_RECORD.json <<'JSON'
          {
            "repository": "leegahuyn/mathlib4",
            "canonical_tag": "formalization-final-2026-08-21",
            "exact_source_commit": "8f7e861f5f76c0aa5d347e0de865516a1ba23922",
            "authority_branch": "gpt/final-authority-pass-20260821",
            "archive_branch": "archive/formalization-final-2026-08-21",
            "toolchain": "leanprover/lean4:v4.33.0-rc1",
            "full_actual_lean_run": 32443566530,
            "full_actual_lean_job": 96658923339,
            "qym_replay_run": 32344604895,
            "terminal_evidence_run": 32455051059,
            "terminal_evidence_job": 96690759499,
            "Final13": "13/13 PASS",
            "bridges": "2/2 PASS",
            "BuildAll": "PASS",
            "clean_builds": "2/2 PASS",
            "checklist": "15/15 PASS",
            "forbidden": 0,
            "panic": 0,
            "axiom_audit": "PASS",
            "source_identity": "PASS",
            "final_first_error": null,
            "final_blocker": null,
            "FINAL_AUTHORITY": "PASS",
            "future_source_changes_covered": false
          }
          JSON
          cat > assets/VERIFY_FINAL_AUTHORITY.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json
          r=json.load(open('FINAL_AUTHORITY_RECORD.json'))
          assert r['exact_source_commit']=='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          assert r['FINAL_AUTHORITY']=='PASS' and r['forbidden']==0
          print('FINAL_AUTHORITY=PASS')
          PY
          if git rev-parse --git-dir >/dev/null 2>&1; then
            git fetch --tags origin >/dev/null 2>&1 || true
            test "$(git rev-parse formalization-final-2026-08-21^{})" = 8f7e861f5f76c0aa5d347e0de865516a1ba23922
            test "$(git cat-file -t formalization-final-2026-08-21)" = tag
          fi
          SH
          chmod +x assets/VERIFY_FINAL_AUTHORITY.sh
          cat > assets/VERIFY_FINAL_AUTHORITY.ps1 <<'PS1'
          $ErrorActionPreference="Stop"
          foreach($line in Get-Content SHA256SUMS.txt){if($line -match '^([0-9a-f]{64})  (.+)$'){$h=(Get-FileHash $Matches[2] -Algorithm SHA256).Hash.ToLower();if($h -ne $Matches[1]){throw "Hash mismatch: $($Matches[2])"}}}
          $r=Get-Content FINAL_AUTHORITY_RECORD.json -Raw|ConvertFrom-Json
          if($r.exact_source_commit -ne '8f7e861f5f76c0aa5d347e0de865516a1ba23922' -or $r.FINAL_AUTHORITY -ne 'PASS'){throw 'Authority mismatch'}
          'FINAL_AUTHORITY=PASS'
          PS1
          cat > assets/RELEASE_NOTES.md <<'MD'
          # Formalization FINAL AUTHORITY — 2026-08-21

          This release permanently freezes the exact-source Lean authority at commit
          `8f7e861f5f76c0aa5d347e0de865516a1ba23922`.

          - Annotated tag: `formalization-final-2026-08-21`
          - Authority branch: `gpt/final-authority-pass-20260821`
          - Archive branch: `archive/formalization-final-2026-08-21`
          - Toolchain: `leanprover/lean4:v4.33.0-rc1`
          - Full actual-Lean run/job: `32443566530` / `96658923339`
          - Independent QYM replay: `32344604895`
          - Terminal evidence run/job: `32455051059` / `96690759499`

          Final13 **13/13 PASS**; bridges **2/2 PASS**; BuildAll **PASS**;
          clean builds **2/2 PASS**; checklist **15/15 PASS**; forbidden **0**;
          panic **0**; axiom/trust and source-identity audits **PASS**.

          The three original evidence ZIPs, selected JSON/Markdown reports, exact
          `git archive` source snapshot, checksum manifest, and verification scripts
          are attached. Future source changes are not covered by this certification.
          MD

      - name: Create or verify annotated tag and publish Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "leegahuyn FINAL AUTHORITY archive"
          git config user.email "102484661+leegahuyn@users.noreply.github.com"
          if git ls-remote --exit-code --tags origin "refs/tags/${TAG}" >/dev/null 2>&1; then
            git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
            test "$(git cat-file -t "${TAG}")" = tag
            test "$(git rev-parse "${TAG}^{}")" = "${SOURCE}"
          else
            git tag -a "${TAG}" "${SOURCE}" -m "Formalization FINAL AUTHORITY; exact source ${SOURCE}; Final13 13/13; BuildAll PASS; clean×2; checklist 15/15; forbidden 0."
            git push origin "refs/tags/${TAG}"
          fi
          cd assets
          : > SHA256SUMS.txt
          while IFS= read -r -d '' f; do sha256sum "${f#./}" >> SHA256SUMS.txt; done < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0|sort -z)
          sha256sum --check SHA256SUMS.txt
          cd ..
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${REPO}" --title "Formalization FINAL AUTHORITY — 2026-08-21" --notes-file assets/RELEASE_NOTES.md
          else
            gh release create "${TAG}" --repo "${REPO}" --verify-tag --title "Formalization FINAL AUTHORITY — 2026-08-21" --notes-file assets/RELEASE_NOTES.md
          fi
          existing="$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name')"
          for f in assets/*; do n="$(basename "$f")"; grep -Fxq "$n" <<<"$existing" || gh release upload "${TAG}" "$f" --repo "${REPO}"; done
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease=false

      - name: Verify immutable remote publication
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git cat-file -t "${TAG}")" = tag
          test "$(git rev-parse "${TAG}^{}")" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${FINAL_BRANCH}"|awk '{print $1}')" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${ARCHIVE_BRANCH}"|awk '{print $1}')" = "${SOURCE}"
          j="$(gh release view "${TAG}" --repo "${REPO}" --json url,tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r .tagName <<<"$j")" = "${TAG}"
          test "$(jq -r .isDraft <<<"$j")" = false
          for f in assets/*; do n="$(basename "$f")"; jq -e --arg n "$n" '.assets[]|select(.name==$n)' <<<"$j" >/dev/null; done
          jq -r .url <<<"$j" | tee RELEASE_URL.txt
          printf '# FINAL AUTHORITY FREEZE\n\nFINAL_AUTHORITY=PASS\nSOURCE_COMMIT=%s\nANNOTATED_TAG=%s\nRELEASE_URL=%s\nSOURCE_CHANGED=NO\n' "${SOURCE}" "${TAG}" "$(cat RELEASE_URL.txt)" | tee FINAL_FREEZE_RESULT.md

      - name: Upload redundant archive package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formalization-final-authority-release-package-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            assets
            RELEASE_URL.txt
            FINAL_FREEZE_RESULT.md
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final archival PASS
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq FINAL_AUTHORITY=PASS FINAL_FREEZE_RESULT.md
          cat FINAL_FREEZE_RESULT.md
          cat FINAL_FREEZE_RESULT.md >> "${GITHUB_STEP_SUMMARY}"
