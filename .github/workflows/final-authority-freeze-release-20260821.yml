name: Publish frozen Formalization FINAL AUTHORITY 20260821

on:
  push:
    branches: [gpt/final-authority-release-20260821]
    paths: [.github/workflows/final-authority-freeze-release-20260821.yml]
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: formalization-final-authority-publication-20260821
  cancel-in-progress: false

jobs:
  archive-and-release:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      REPO: leegahuyn/mathlib4
      SOURCE: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
      FINAL_BRANCH: gpt/final-authority-pass-20260821
      ARCHIVE_BRANCH: archive/formalization-final-2026-08-21
      TAG: formalization-final-2026-08-21
      FULL_ID: "9435161106"
      FULL_SHA: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
      QYM_ID: "9398192196"
      QYM_SHA: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
      TERM_ID: "9436985567"
      TERM_SHA: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee

    steps:
      - name: Checkout publisher branch with full Git history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify and detach to exact immutable authority source
        shell: bash
        run: |
          set -euo pipefail
          test "$(git ls-remote origin "refs/heads/${FINAL_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${ARCHIVE_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          git checkout --detach "${SOURCE}"
          test "$(git rev-parse HEAD)" = "${SOURCE}"
          test -z "$(git status --short --untracked-files=no)"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = 28f614d48e02a0f28d3f5a758e813350b3ea89cf
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = 464f5dd095876b20165d12690c8127ef9d909e6a
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = 7afb309d7c4da97da7bc6b922931734d72830d41
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = 3b6596bbc0790c7d6e427c44e2b0b18b8af3efa6
          test "$(git hash-object --no-filters PrimalitySheafVerification/Spt3.lean)" = a73d346d060a9a2b8b3dca636e0e611eb394f69c
          test "$(git hash-object --no-filters PrimalitySheafVerification/BuildAll.lean)" = fc6fb147b8505b434104cf1ef50dd9243baa79f9

      - name: Download and verify all three original evidence ZIPs
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p assets terminal
          fetch_artifact() {
            local id="$1" name="$2" expected="$3"
            curl --fail --location --retry 5 --retry-all-errors \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/${REPO}/actions/artifacts/${id}/zip" \
              -o "assets/${name}"
            echo "${expected}  assets/${name}" | sha256sum --check -
          }
          fetch_artifact "${FULL_ID}" final-authority-pr-gate-v8-32443566530-attempt1.zip "${FULL_SHA}"
          fetch_artifact "${QYM_ID}" qym-gb0-independent-replay-32344604895-attempt1.zip "${QYM_SHA}"
          fetch_artifact "${TERM_ID}" final-authority-terminal-v12-32455051059-attempt1.zip "${TERM_SHA}"
          unzip -q assets/final-authority-terminal-v12-32455051059-attempt1.zip -d terminal

      - name: Validate evidence and create exact-source archive package
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, shutil
          from pathlib import Path
          terminal, out = Path('terminal'), Path('assets')
          def one(name):
              rows=list(terminal.rglob(name))
              assert len(rows)==1, (name,len(rows))
              return rows[0]
          def load(name): return json.loads(one(name).read_text(encoding='utf-8'))
          f=load('FINAL_13_BUILD_RESULTS.json')
          b=load('BUILDALL_RESULT.json')
          c1=load('CLEAN_BUILD_1_RESULT.json')
          c2=load('CLEAN_BUILD_2_RESULT.json')
          ck=load('FINAL_15_CHECKLIST_RESULT.json')
          forbidden=load('FORBIDDEN_AUDIT.json')
          axiom=load('AXIOM_AUDIT.json')
          identity=load('FINAL_SOURCE_IDENTITY.json')
          qym=load('QYM_CANONICAL_REPLAY_RESULT.json')
          mock3=load('MOCK3_CANONICAL_RESULT.json')
          assert f['pass'] is True
          assert f['counts']=={'PASS':13,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert f['bridge_counts']=={'PASS':2,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert b['pass'] is True and b['aggregate_result']['exit']==0
          assert b['aggregate_result']['error_headers']==0
          assert b['aggregate_result']['panic_lines']==0
          assert b['aggregate_result']['sorry_warning_lines']==0
          assert b['required_skipped_targets']==[]
          assert c1['pass'] is True and c2['pass'] is True
          assert ck['pass'] is True
          assert ck['counts']=={'PASS':15,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert forbidden['pass'] is True and forbidden['forbidden_count']==0
          assert axiom['pass'] is True
          assert identity['pass'] is True
          assert identity['tested_source_commit']=='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          assert identity['all_pass_evidence_source_identical'] is True
          assert qym['pass'] is True and qym['exit']==0 and qym['error_headers']==0
          assert qym['source_blob']=='7afb309d7c4da97da7bc6b922931734d72830d41'
          assert qym['source_sha256']=='ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204'
          assert mock3['pass'] is True
          names=['FINAL_TRUE_PASS_REPORT.md','FINAL_STATUS_CARD.md','FINAL_SOURCE_IDENTITY.json',
                 'FINAL_15_CHECKLIST_RESULT.json','CLEAN_BUILD_1_RESULT.json',
                 'CLEAN_BUILD_2_RESULT.json','BUILDALL_RESULT.json',
                 'FINAL_13_BUILD_RESULTS.json','FINAL_13_ROOTS.txt',
                 'FORBIDDEN_AUDIT.json','AXIOM_AUDIT.json',
                 'QYM_CANONICAL_REPLAY_RESULT.json','MOCK3_CANONICAL_RESULT.json',
                 'TERMINAL_EVIDENCE_INDEX.json']
          for name in names: shutil.copy2(one(name), out/name)
          record={
            'repository':'leegahuyn/mathlib4',
            'canonical_tag':'formalization-final-2026-08-21',
            'exact_source_commit':'8f7e861f5f76c0aa5d347e0de865516a1ba23922',
            'authority_branch':'gpt/final-authority-pass-20260821',
            'archive_branch':'archive/formalization-final-2026-08-21',
            'toolchain':'leanprover/lean4:v4.33.0-rc1',
            'lean_commit':'62eed1db4d67327ec8120be05f1a1b0847d74561',
            'lake_manifest_sha256':'672474eb93bc14c66cd1ff45203c451987fe525f7b5d13ecd83140be46434b26',
            'actual_evidence':{
              'full_actual_lean_run':32443566530,
              'full_actual_lean_job':96658923339,
              'full_artifact_id':9435161106,
              'full_artifact_sha256':'81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32',
              'qym_replay_run':32344604895,
              'qym_artifact_id':9398192196,
              'qym_artifact_sha256':'ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830',
              'terminal_evidence_run':32455051059,
              'terminal_evidence_job':96690759499,
              'terminal_artifact_id':9436985567,
              'terminal_artifact_sha256':'a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee'
            },
            'terminal_results':{
              'Final13':f['counts'],'bridges':f['bridge_counts'],
              'BuildAll':'PASS','clean_build_1':'PASS','clean_build_2':'PASS',
              'checklist':ck['counts'],'forbidden':0,'panic':0,
              'axiom_audit':'PASS','source_identity':'PASS',
              'QYM_replay':'PASS','Mock3':'PASS',
              'first_actual_Lean_error':None,'final_blocker':None,
              'FINAL_AUTHORITY':'PASS'
            },
            'protected_source_identities':identity['protected'],
            'source_fingerprints':identity['source_fingerprints'],
            'future_source_changes_covered':False
          }
          (out/'FINAL_AUTHORITY_RECORD.json').write_text(
              json.dumps(record,indent=2,sort_keys=True,ensure_ascii=False)+'\n',encoding='utf-8')
          (out/'FINAL_AUTHORITY_RECORD.md').write_text(
              '# Formalization FINAL AUTHORITY Record\n\n'
              '- Exact source commit: `8f7e861f5f76c0aa5d347e0de865516a1ba23922`\n'
              '- Final13: **13/13 PASS**\n- Bridges: **2/2 PASS**\n'
              '- BuildAll: **PASS**\n- Clean builds: **2/2 PASS**\n'
              '- Checklist: **15/15 PASS**\n- Forbidden: **0**\n'
              '- Axiom/source identity audits: **PASS**\n\n'
              'This record covers only the exact source commit above.\n',encoding='utf-8')
          PY
          paths=(PrimalitySheafVerification lean-toolchain lake-manifest.json)
          for p in lakefile.toml lakefile.lean CITATION.md scripts .github/workflows/final-authority-pr-gate-v7.yml; do
            git cat-file -e "${SOURCE}:${p}" 2>/dev/null && paths+=("${p}") || true
          done
          git archive --format=tar.gz --prefix=mathlib4-formalization-final-8f7e861f/ \
            -o assets/formalization-final-source-8f7e861f.tar.gz "${SOURCE}" "${paths[@]}"
          cat > assets/VERIFY_FINAL_AUTHORITY.sh <<'SH'
          #!/usr/bin/env bash
          set -euo pipefail
          sha256sum --check SHA256SUMS.txt
          python3 - <<'PY'
          import json
          r=json.load(open('FINAL_AUTHORITY_RECORD.json'))
          assert r['exact_source_commit']=='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          assert r['terminal_results']['FINAL_AUTHORITY']=='PASS'
          assert r['terminal_results']['forbidden']==0
          print('FINAL_AUTHORITY=PASS')
          PY
          SH
          chmod +x assets/VERIFY_FINAL_AUTHORITY.sh
          cat > assets/VERIFY_FINAL_AUTHORITY.ps1 <<'PS1'
          $ErrorActionPreference='Stop'
          foreach($line in Get-Content SHA256SUMS.txt){if($line -match '^([0-9a-f]{64})  (.+)$'){$actual=(Get-FileHash $Matches[2] -Algorithm SHA256).Hash.ToLower();if($actual -ne $Matches[1]){throw "Hash mismatch: $($Matches[2])"}}}
          $r=Get-Content FINAL_AUTHORITY_RECORD.json -Raw|ConvertFrom-Json
          if($r.exact_source_commit -ne '8f7e861f5f76c0aa5d347e0de865516a1ba23922' -or $r.terminal_results.FINAL_AUTHORITY -ne 'PASS'){throw 'Authority mismatch'}
          'FINAL_AUTHORITY=PASS'
          PS1
          cat > assets/RELEASE_NOTES.md <<'MD'
          # Formalization FINAL AUTHORITY — 2026-08-21

          Exact source commit: `8f7e861f5f76c0aa5d347e0de865516a1ba23922`  
          Authority branch: `gpt/final-authority-pass-20260821`  
          Archive branch: `archive/formalization-final-2026-08-21`  
          Toolchain: `leanprover/lean4:v4.33.0-rc1`

          Final13 **13/13 PASS**; bridges **2/2 PASS**; BuildAll **PASS**;
          clean builds **2/2 PASS**; checklist **15/15 PASS**; forbidden **0**;
          panic **0**; axiom/trust and source-identity audits **PASS**.

          Actual evidence lineage: full run/job `32443566530` / `96658923339`;
          QYM replay `32344604895`; terminal evidence run/job
          `32455051059` / `96690759499`.

          The original evidence ZIPs, exact `git archive` snapshot, reports,
          checksum manifest, and verification scripts are attached.
          Future source changes are not covered by this certification.
          MD
          cd assets
          : > SHA256SUMS.txt
          while IFS= read -r -d '' f; do sha256sum "${f#./}" >> SHA256SUMS.txt; done \
            < <(find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -print0 | sort -z)
          sha256sum --check SHA256SUMS.txt

      - name: Upload exact 8f7e authority backup before publication
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formalization-final-8f7e-authority-package-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: assets
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Create annotated tag through Git Data API or release-tag fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          mkdir -p publication-audit
          current_ref() {
            curl -fsSL "${auth[@]}" "${api}/git/ref/tags/${TAG}" 2>/dev/null || true
          }
          ref_json="$(current_ref)"
          if [[ -z "${ref_json}" ]]; then
            tag_payload="$(jq -n \
              --arg tag "${TAG}" --arg message "Formalization FINAL AUTHORITY; exact source ${SOURCE}; Final13 13/13; BuildAll PASS; clean x2; checklist 15/15; forbidden 0." \
              --arg object "${SOURCE}" --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag:$tag,message:$message,object:$object,type:"commit",tagger:{name:"leegahuyn",email:"102484661+leegahuyn@users.noreply.github.com",date:$date}}')"
            tag_code="$(curl -sS -o publication-audit/create-tag-object.json -w '%{http_code}' \
              -X POST "${auth[@]}" -d "${tag_payload}" "${api}/git/tags")"
            echo "${tag_code}" > publication-audit/create-tag-object.http
            if [[ "${tag_code}" == 201 ]]; then
              tag_object="$(jq -r .sha publication-audit/create-tag-object.json)"
              ref_payload="$(jq -n --arg ref "refs/tags/${TAG}" --arg sha "${tag_object}" '{ref:$ref,sha:$sha}')"
              ref_code="$(curl -sS -o publication-audit/create-tag-ref.json -w '%{http_code}' \
                -X POST "${auth[@]}" -d "${ref_payload}" "${api}/git/refs")"
              echo "${ref_code}" > publication-audit/create-tag-ref.http
            fi
            ref_json="$(current_ref)"
          fi
          if [[ -z "${ref_json}" ]]; then
            echo "Annotated tag ref was blocked; Release API will create an exact-commit lightweight tag." | tee publication-audit/tag-fallback.txt
            if ! gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
              gh release create "${TAG}" --repo "${REPO}" --target "${SOURCE}" \
                --title "Formalization FINAL AUTHORITY — 2026-08-21" \
                --notes-file assets/RELEASE_NOTES.md --draft
            fi
          fi
          git fetch --force --tags origin
          test "$(git rev-parse "${TAG}^{}")" = "${SOURCE}"
          git cat-file -t "${TAG}" | tee publication-audit/tag-kind.txt

      - name: Upload all evidence assets and publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "${TAG}" --repo "${REPO}" >/dev/null 2>&1; then
            gh release edit "${TAG}" --repo "${REPO}" \
              --title "Formalization FINAL AUTHORITY — 2026-08-21" \
              --notes-file assets/RELEASE_NOTES.md
          else
            gh release create "${TAG}" --repo "${REPO}" --verify-tag \
              --title "Formalization FINAL AUTHORITY — 2026-08-21" \
              --notes-file assets/RELEASE_NOTES.md --draft
          fi
          existing="$(gh release view "${TAG}" --repo "${REPO}" --json assets --jq '.assets[].name')"
          for file in assets/*; do
            name="$(basename "${file}")"
            grep -Fxq "${name}" <<<"${existing}" || gh release upload "${TAG}" "${file}" --repo "${REPO}"
          done
          gh release edit "${TAG}" --repo "${REPO}" --draft=false --prerelease=false

      - name: Verify remote freeze and Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --force --tags origin
          test "$(git rev-parse "${TAG}^{}")" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${FINAL_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          test "$(git ls-remote origin "refs/heads/${ARCHIVE_BRANCH}" | awk '{print $1}')" = "${SOURCE}"
          release="$(gh release view "${TAG}" --repo "${REPO}" --json url,tagName,isDraft,isPrerelease,assets)"
          test "$(jq -r .tagName <<<"${release}")" = "${TAG}"
          test "$(jq -r .isDraft <<<"${release}")" = false
          test "$(jq -r .isPrerelease <<<"${release}")" = false
          for file in assets/*; do
            name="$(basename "${file}")"
            jq -e --arg name "${name}" '.assets[] | select(.name==$name)' <<<"${release}" >/dev/null
          done
          jq -r .url <<<"${release}" | tee RELEASE_URL.txt
          {
            echo '# FINAL AUTHORITY FREEZE'
            echo
            echo 'FINAL_AUTHORITY=PASS'
            echo "SOURCE_COMMIT=${SOURCE}"
            echo "TAG=${TAG}"
            echo "TAG_KIND=$(git cat-file -t "${TAG}")"
            echo "TAG_TARGET=$(git rev-parse "${TAG}^{}")"
            echo "AUTHORITY_BRANCH=${FINAL_BRANCH}"
            echo "ARCHIVE_BRANCH=${ARCHIVE_BRANCH}"
            echo "RELEASE_URL=$(cat RELEASE_URL.txt)"
            echo 'SOURCE_CHANGED=NO'
          } | tee FINAL_FREEZE_RESULT.md

      - name: Upload publication audit and final result
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formalization-final-publication-audit-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            publication-audit
            RELEASE_URL.txt
            FINAL_FREEZE_RESULT.md
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Enforce completed archival publication
        shell: bash
        run: |
          set -euo pipefail
          grep -Fxq FINAL_AUTHORITY=PASS FINAL_FREEZE_RESULT.md
          cat FINAL_FREEZE_RESULT.md
          cat FINAL_FREEZE_RESULT.md >> "${GITHUB_STEP_SUMMARY}"
