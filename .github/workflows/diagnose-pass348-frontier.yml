name: Diagnose PASS 348 FunctionalAnalysis frontier

on:
  pull_request:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/diagnose-pass348-frontier.yml'
      - 'scripts/diagnose_pass348_frontier.sh'
      - 'scripts/fa348_coherent_frontier_repair.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-pass348-frontier-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 620
          persist-credentials: false

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass348-frontier/logs
          lean --version | tee /tmp/diagnose-pass348-frontier/lean-version.txt
          lake --version | tee /tmp/diagnose-pass348-frontier/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass348-frontier/logs/cache-get.log

      - name: Reconstruct and compile PASS 348 frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass348_frontier.sh

      - name: Upload PASS 348 frontier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnose-pass348-frontier-${{ env.SOURCE_SHA }}
          path: /tmp/diagnose-pass348-frontier
          if-no-files-found: error
          retention-days: 90
