name: Agent bounded multi-agent repair — Advanced FunctionalAnalysis QYM

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/agent-20260807-bounded-three-module-repair.yml'
  workflow_dispatch:

permissions:
  contents: write
  models: read

concurrency:
  group: agent-bounded-three-module-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Fetch exact triggering commit without checkout action
        shell: bash
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install exact Lean toolchain without setup action
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version
          command -v rg

      - name: Restore Mathlib cache
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Run bounded planner-critic repair loop
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/agent_bounded_three_module_repair.py
