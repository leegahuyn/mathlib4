name: Resilient completion loop Mock2 Advanced FunctionalAnalysis QYM

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-resilient-loop-m2a-fa-qym.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: priority-resilient-loop-m2a-fa-qym
  cancel-in-progress: false

jobs:
  complete:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      FINAL_RESULT: build-logs/priority-stage3-qym-result.txt

    steps:
      - name: Initialize repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Retry the isolated dependency chain
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          success=0
          for attempt in 1 2 3; do
            echo "===== priority chain attempt ${attempt}/3 ====="
            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            git reset --hard FETCH_HEAD
            git clean -fd
            rm -rf "${OUTDIR}"; mkdir -p "${OUTDIR}"

            if ! bash scripts/priority_stage1_advanced.sh \
                >"/tmp/stage1-attempt${attempt}.log" 2>&1; then
              echo 'Stage 1 Advanced failed:'
              tail -500 "/tmp/stage1-attempt${attempt}.log" || true
              sleep 30
              continue
            fi

            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            git reset --hard FETCH_HEAD
            git clean -fd
            rm -rf "${OUTDIR}"; mkdir -p "${OUTDIR}"
            if ! bash scripts/priority_stage2_fa.sh \
                >"/tmp/stage2-attempt${attempt}.log" 2>&1; then
              echo 'Stage 2 FunctionalAnalysis failed:'
              tail -500 "/tmp/stage2-attempt${attempt}.log" || true
              sleep 30
              continue
            fi

            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            git reset --hard FETCH_HEAD
            git clean -fd
            rm -rf "${OUTDIR}"; mkdir -p "${OUTDIR}"
            if ! bash scripts/priority_stage3_qym.sh \
                >"/tmp/stage3-attempt${attempt}.log" 2>&1; then
              echo 'Stage 3 QYM failed:'
              tail -600 "/tmp/stage3-attempt${attempt}.log" || true
              sleep 30
              continue
            fi

            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            git reset --hard FETCH_HEAD
            if [[ -s "${FINAL_RESULT}" ]] && \
               grep -Fxq 'status=PASS' "${FINAL_RESULT}" && \
               grep -Fxq 'runtime_repair_scripts=0' "${FINAL_RESULT}" && \
               grep -Fxq 'Mock2_Advanced=PASS' "${FINAL_RESULT}" && \
               grep -Fxq 'Mock2_FunctionalAnalysis=PASS' "${FINAL_RESULT}" && \
               grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' "${FINAL_RESULT}" && \
               grep -Fxq 'QYM=PASS' "${FINAL_RESULT}"; then
              success=1
              break
            fi
            sleep 30
          done
          test "${success}" -eq 1

      - name: Post completion record to PR 7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result="${FINAL_RESULT}"
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," "${result}"
            grep -Eq "^${module},pass2,0,0," "${result}"
          done
          python3 - <<'PY' > /tmp/comment.json
          import json
          from pathlib import Path
          t=Path('build-logs/priority-stage3-qym-result.txt').read_text(encoding='utf-8')
          head=next(x.split('=',1)[1] for x in t.splitlines() if x.startswith('verified_source_head='))
          rows='\n'.join(x for x in t.splitlines() if x.startswith(('Mock2,pass','Mock2_Advanced,pass','Mock2_FunctionalAnalysis,pass','Mock2_FunctionalAnalysis_Integrated,pass','QYM,pass')))
          print(json.dumps({'body': f'''## Priority module chain completed

Verified source head: `{head}`

`Mock2_Advanced`, `Mock2_FunctionalAnalysis`, `Mock2_FunctionalAnalysis_Integrated`, and `QYM` were compiled twice from checked-in source in dependency order. Runtime repair scripts during the final verification: `0`.

```text
{rows}
```
'''}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --data-binary @/tmp/comment.json
