name: Promote verified PASS 398 priority sources to PR9

on:
  push:
    branches:
      - fix/fa398-self-dispatch-priority-loop-20260809
    paths:
      - 'build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS'
      - 'build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa398-promote-pr9
  cancel-in-progress: false

jobs:
  independent-pr9-verification-and-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout verified PASS 398 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa398-self-dispatch-priority-loop-20260809
          fetch-depth: 4200
          persist-credentials: true

      - name: Require isolated success marker and clean trust status
        shell: bash
        run: |
          set -euo pipefail
          test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json').read_text())
          assert data.get('complete') is True, data
          assert data.get('stage') == 'complete', data
          modules = data.get('modules', [])
          assert modules, data
          assert all(m.get('status') == 'PASS_2X' for m in modules), modules
          audits = data.get('forbidden_token_audit', {})
          assert audits and all(not any(v.values()) for v in audits.values()), audits
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Create isolated PR9 worktree and copy only verified Lean sources
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/fa319-isolated-20260807
          rm -rf /tmp/pr9-pass398
          git worktree add --detach /tmp/pr9-pass398 origin/ci/fa319-isolated-20260807
          targets=(
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          )
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "${p}" && targets+=("${p}") || true; done
          targets+=(PrimalitySheafVerification/QYM.lean)
          for p in "${targets[@]}"; do install -D -m 0644 "${p}" "/tmp/pr9-pass398/${p}"; done
          mkdir -p /tmp/pr9-pass398/build-logs
          cp build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json \
            /tmp/pr9-pass398/build-logs/PASS398_SOURCE_STATUS.json

      - name: Audit executable source in isolated PR9 worktree
        shell: bash
        working-directory: /tmp/pr9-pass398
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          import re
          targets = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          forbidden = {
              'sorry': re.compile(r'\bsorry\b'),
              'admit': re.compile(r'\badmit\b'),
              'global_axiom': re.compile(r'(?m)^\s*(?:public\s+)?axiom\b'),
              'unsafe': re.compile(r'(?m)^\s*unsafe\b'),
              'native_decide': re.compile(r'\bnative_decide\b'),
              'Lean.ofReduceBool': re.compile(r'\bLean\.ofReduceBool\b'),
          }
          def strip(text: str) -> str:
              out=[]; i=0; depth=0; string=False; escape=False
              while i < len(text):
                  if depth:
                      if text.startswith('/-', i): depth += 1; out.extend('  '); i += 2; continue
                      if text.startswith('-/', i): depth -= 1; out.extend('  '); i += 2; continue
                      out.append('\n' if text[i]=='\n' else ' '); i += 1; continue
                  if string:
                      c=text[i]; out.append('\n' if c=='\n' else ' ')
                      if escape: escape=False
                      elif c=='\\': escape=True
                      elif c=='"': string=False
                      i += 1; continue
                  if text.startswith('/-', i): depth=1; out.extend('  '); i += 2; continue
                  if text.startswith('--', i):
                      while i < len(text) and text[i] != '\n': out.append(' '); i += 1
                      continue
                  if text[i]=='"': string=True; out.append(' '); i += 1; continue
                  out.append(text[i]); i += 1
              return ''.join(out)
          report={}
          for path in targets:
              assert path.exists(), path
              clean=strip(path.read_text(encoding='utf-8'))
              counts={name: len(rx.findall(clean)) for name,rx in forbidden.items()}
              assert not any(counts.values()), (path,counts)
              report[str(path)]=counts
          Path('build-logs/PR9_PRIORITY_TRUST_AUDIT.json').write_text(json.dumps(report,indent=2)+'\n')
          PY

      - name: Compile FA then Integrated Mock3 and QYM twice from direct source
        shell: bash
        working-directory: /tmp/pr9-pass398
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake exe cache get
          mapfile -t mock3 < <(find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' | sort)
          targets=(
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            "${mock3[@]}"
            PrimalitySheafVerification/QYM.lean
          )
          rm -rf .lake/build/lib/lean/PrimalitySheafVerification
          mkdir -p build-logs/pr9-priority-2x
          : > build-logs/pr9-priority-2x/status.tsv
          for p in "${targets[@]}"; do
            module="${p%.lean}"
            olean=".lake/build/lib/lean/${module}.olean"
            ilean=".lake/build/lib/lean/${module}.ilean"
            mkdir -p "$(dirname "${olean}")"
            for run in 1 2; do
              rm -f "${olean}" "${ilean}"
              log="build-logs/pr9-priority-2x/$(basename "${module}")-run${run}.log"
              set +e
              lake env lean -DmaxErrors=2000 -o "${olean}" -i "${ilean}" "${p}" > "${log}" 2>&1
              rc=$?
              set -e
              errors=$(grep -c 'error:' "${log}" || true)
              printf '%s\t%s\t%s\t%s\n' "${p}" "${run}" "${rc}" "${errors}" | tee -a build-logs/pr9-priority-2x/status.tsv
              test "${rc}" -eq 0
              test "${errors}" -eq 0
              test -s "${olean}"
              test -s "${ilean}"
            done
          done

      - name: Write final PR9 priority marker
        shell: bash
        working-directory: /tmp/pr9-pass398
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          VERIFIED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          targets=[
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          marker={
              'status':'SUCCESS_ALL_REQUIRED_TARGETS_2X_PASS',
              'workflow_run_id':os.environ['WORKFLOW_RUN_ID'],
              'verified_source_branch':'fix/fa398-self-dispatch-priority-loop-20260809',
              'verified_source_commit':os.environ['VERIFIED_SOURCE_SHA'],
              'target_branch':'ci/fa319-isolated-20260807',
              'targets':[str(p) for p in targets],
              'source_sha256':{str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in targets},
              'compiler_status':Path('build-logs/pr9-priority-2x/status.tsv').read_text().splitlines(),
              'trust_audit':json.loads(Path('build-logs/PR9_PRIORITY_TRUST_AUDIT.json').read_text()),
              'automatic_merge':False,
              'pr_remains_draft':True,
          }
          Path('build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json').write_text(json.dumps(marker,indent=2)+'\n')
          PY

      - name: Push independently verified sources and marker to PR9
        shell: bash
        working-directory: /tmp/pr9-pass398
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          git add PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "${p}" && git add "${p}" || true; done
          git add build-logs/PASS398_SOURCE_STATUS.json
          git add build-logs/PR9_PRIORITY_TRUST_AUDIT.json
          git add build-logs/pr9-priority-2x/status.tsv
          git add build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json
          git commit -m 'fix: promote verified PASS 398 FA Integrated Mock3 QYM 2x PASS'
          remote_head=$(git ls-remote origin refs/heads/ci/fa319-isolated-20260807 | cut -f1)
          base_head=$(git rev-parse HEAD^)
          test "${remote_head}" = "${base_head}"
          git push origin HEAD:ci/fa319-isolated-20260807

      - name: Upload independent PR9 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-pass398-final-2x-${{ github.sha }}
          path: |
            /tmp/pr9-pass398/build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json
            /tmp/pr9-pass398/build-logs/PR9_PRIORITY_TRUST_AUDIT.json
            /tmp/pr9-pass398/build-logs/pr9-priority-2x
            /tmp/pr9-pass398/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            /tmp/pr9-pass398/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            /tmp/pr9-pass398/PrimalitySheafVerification/Mock3*.lean
            /tmp/pr9-pass398/PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
