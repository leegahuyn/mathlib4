name: Final Authority BuildAll One-Blocker V9

"on":
  pull_request:
    branches:
      - gpt/final-authority-gb0-canonical-20260820
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: final-authority-buildall-v9-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  full-build-batch-repair-full-rebuild:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'gpt/final-authority-batch-v7-20260820' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact repair-branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Record immutable protected identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final_authority_v9
          {
            echo "INITIAL_HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${{ github.head_ref }}"
            echo "FA_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)"
            echo "INTEGRATED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)"
            echo "QYM_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)"
            echo "QYM_SHA256=$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          } | tee .final_authority_v9/INITIAL_SOURCE_IDENTITY.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .final_authority_v9/LEAN_VERSION.txt
          lake --version | tee .final_authority_v9/LAKE_VERSION.txt

      - name: First complete authority build without editing
        id: initial
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: ${{ github.head_ref || 'gpt/final-authority-batch-v7-20260820' }}
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          python3 scripts/final_authority_gate_v5.py \
            2>&1 | tee .final_authority_v9/INITIAL_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v9/INITIAL_AUTHORITY_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          rm -rf .final_authority_v9/initial_evidence
          cp -a .final_authority .final_authority_v9/initial_evidence

      - name: Batch-repair the complete BuildAll error surface
        if: steps.initial.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          git fetch --no-tags origin \
            gpt/final-authority-gb0-canonical-20260820:refs/remotes/origin/final-authority-base-v9
          git show \
            refs/remotes/origin/final-authority-base-v9:scripts/final_authority_buildall_v9.py \
            > /tmp/final_authority_buildall_v9.py
          python3 -m py_compile /tmp/final_authority_buildall_v9.py
          python3 /tmp/final_authority_buildall_v9.py \
            2>&1 | tee .final_authority_v9/BUILDALL_BATCH_REPAIR.log
          selected="$(cat .final_authority_v9/SELECTED_PATH.txt)"
          test -n "$selected"
          git diff --check
          git config user.name "final-authority-bot"
          git config user.email "final-authority-bot@users.noreply.github.com"
          git add -- "$selected"
          git diff --cached --check
          git commit -m "Final authority: resolve sole BuildAll declaration collision"
          git rev-parse HEAD | tee .final_authority_v9/CANDIDATE_COMMIT.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"

      - name: Remove all project compiler outputs before post-repair full rebuild
        if: steps.initial.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          find PrimalitySheafVerification -type f \
            \( -name '*.olean' -o -name '*.ilean' \) -delete
          rm -rf .lake/build/lib/lean/PrimalitySheafVerification
          rm -rf .lake/build/ir/PrimalitySheafVerification
          rm -rf .final_authority
          mkdir -p .final_authority

      - name: Full authority rebuild, BuildAll, clean twice, and checklist
        id: final
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: ${{ github.head_ref || 'gpt/final-authority-batch-v7-20260820' }}
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          if [ "${{ steps.initial.outputs.exit_code }}" = "0" ]; then
            cp .final_authority_v9/INITIAL_AUTHORITY_EXIT.txt \
              .final_authority_v9/FINAL_AUTHORITY_EXIT.txt
            echo "0" > .final_authority_v9/FINAL_AUTHORITY_EXIT.txt
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          runtime="scripts/.final_authority_gate_v9_runtime.py"
          test -f "$runtime"
          set +e
          python3 "$runtime" \
            2>&1 | tee .final_authority_v9/FINAL_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v9/FINAL_AUTHORITY_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Surface exact final gate state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== INITIAL AUTHORITY EXIT ==="
          cat .final_authority_v9/INITIAL_AUTHORITY_EXIT.txt 2>/dev/null || true
          echo "=== BUILDALL REPAIR ==="
          cat .final_authority_v9/BUILDALL_REPAIR_RESULT.json 2>/dev/null || true
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || \
            cat .final_authority_v9/initial_evidence/FINAL_STATUS_CARD.md 2>/dev/null || true
          for file in \
            FINAL_13_BUILD_RESULTS.json \
            BUILDALL_RESULT.json \
            CLEAN_BUILD_1_RESULT.json \
            CLEAN_BUILD_2_RESULT.json \
            FORBIDDEN_AUDIT.json \
            FINAL_SOURCE_IDENTITY.json \
            FINAL_15_CHECKLIST_RESULT.json
          do
            echo "=== $file ==="
            cat ".final_authority/$file" 2>/dev/null || \
              cat ".final_authority_v9/initial_evidence/$file" 2>/dev/null || true
          done
          echo "=== FINAL AUTHORITY EXIT ==="
          cat .final_authority_v9/FINAL_AUTHORITY_EXIT.txt 2>/dev/null || true

      - name: Upload initial and final evidence before promotion
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-buildall-v9-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .final_authority_v9
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Promote only a complete FINAL AUTHORITY source
        if: steps.initial.outputs.exit_code != '0' && steps.final.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .final_authority_v9/FINAL_AUTHORITY_EXIT.txt)" = "0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('.final_authority')
          required = {
              'BUILDALL_RESULT.json': lambda x: x.get('pass') is True,
              'CLEAN_BUILD_1_RESULT.json': lambda x: x.get('pass') is True,
              'CLEAN_BUILD_2_RESULT.json': lambda x: x.get('pass') is True,
              'FINAL_SOURCE_IDENTITY.json': lambda x: x.get('pass') is True,
              'FINAL_15_CHECKLIST_RESULT.json': lambda x: x.get('counts') == {
                  'PASS': 15, 'FAIL': 0, 'NOT_RUN': 0, 'SKIPPED': 0
              } and x.get('pass') is True,
          }
          for name, predicate in required.items():
              path = root / name
              if not path.exists():
                  raise SystemExit(f'missing final evidence: {name}')
              data = json.loads(path.read_text())
              if not predicate(data):
                  raise SystemExit(f'final gate failed: {name}')
          PY
          git push origin \
            HEAD:refs/heads/${{ github.head_ref || 'gpt/final-authority-batch-v7-20260820' }}

      - name: Enforce FINAL AUTHORITY
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .final_authority_v9/FINAL_AUTHORITY_EXIT.txt
          test "$(cat .final_authority_v9/FINAL_AUTHORITY_EXIT.txt)" = "0"
