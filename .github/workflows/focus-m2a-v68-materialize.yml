name: Focus Mock2 Advanced v68 candidate materialization

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/focus-m2a-v68-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focus-m2a-v68-materialize
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      BRANCH: fix/primality-sheaf-clean-build
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      MOCK2: PrimalitySheafVerification/Mock2.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: build-logs/focus-m2a-v68-candidate
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone the exact triggering HEAD without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "start_blob=$(git hash-object "${TARGET}")" \
            "start_sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
            > "${LOGDIR}/snapshot.txt"
          cp "${TARGET}" /tmp/Mock2_Advanced.before.lean

      - name: Apply the deterministic v61 through v68 chain
        shell: bash
        run: |
          set -euo pipefail
          : > "${LOGDIR}/repair-chain.txt"
          for n in 61 62 63 64 65 66 67 68; do
            script="scripts/repair_mock2_advanced_v${n}.py"
            test -f "${script}"
            echo "RUN ${script}" | tee -a "${LOGDIR}/repair-chain.txt"
            python3 "${script}" 2>&1 | tee -a "${LOGDIR}/repair-application.log"
            echo "OK ${script} sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
              | tee -a "${LOGDIR}/repair-chain.txt"
          done
          mapfile -t changed < <(git diff --name-only)
          printf '%s\n' "${changed[@]}" | tee "${LOGDIR}/changed-files.txt"
          test "${#changed[@]}" -eq 1
          test "${changed[0]}" = "${TARGET}"
          git diff --check
          candidate_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          candidate_blob="$(git hash-object "${TARGET}")"
          printf '%s\n' \
            "candidate_sha256=${candidate_sha}" \
            "candidate_blob=${candidate_blob}" \
            "candidate_lines=$(wc -l < "${TARGET}")" \
            | tee "${LOGDIR}/candidate-identity.txt"

      - name: Prove theorem and lemma headers are unchanged
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/statement-integrity.txt"
          from pathlib import Path
          import re

          def strip_comments_and_strings(src: str) -> str:
              out = []
              i = 0
              depth = 0
              string = False
              esc = False
              while i < len(src):
                  if depth:
                      if src.startswith('/-', i):
                          depth += 1; out.extend('  '); i += 2
                      elif src.startswith('-/', i):
                          depth -= 1; out.extend('  '); i += 2
                      else:
                          out.append('\n' if src[i] == '\n' else ' '); i += 1
                  elif string:
                      ch = src[i]
                      out.append('\n' if ch == '\n' else ' ')
                      if esc: esc = False
                      elif ch == '\\': esc = True
                      elif ch == '"': string = False
                      i += 1
                  elif src.startswith('/-', i):
                      depth = 1; out.extend('  '); i += 2
                  elif src.startswith('--', i):
                      while i < len(src) and src[i] != '\n':
                          out.append(' '); i += 1
                  elif src[i] == '"':
                      string = True; out.append(' '); i += 1
                  else:
                      out.append(src[i]); i += 1
              if depth or string:
                  raise RuntimeError('unterminated comment or string')
              return ''.join(out)

          def headers(path: str):
              src = strip_comments_and_strings(Path(path).read_text(encoding='utf-8'))
              pat = re.compile(r'(?m)^\s*(?:(?:private|protected|noncomputable)\s+)*(theorem|lemma)\s+([^\s(:]+)')
              starts = list(pat.finditer(src))
              result = []
              for m in starts:
                  i = m.start()
                  j = m.end()
                  par = br = cur = 0
                  while j < len(src):
                      ch = src[j]
                      if ch == '(': par += 1
                      elif ch == ')': par -= 1
                      elif ch == '[': br += 1
                      elif ch == ']': br -= 1
                      elif ch == '{': cur += 1
                      elif ch == '}': cur -= 1
                      if par == br == cur == 0:
                          if src.startswith(':=', j): break
                          if re.match(r'\bby\b', src[j:]): break
                          if re.match(r'\bwhere\b', src[j:]): break
                      j += 1
                  header = re.sub(r'\s+', ' ', src[i:j]).strip()
                  result.append(header)
              return result

          before = headers('/tmp/Mock2_Advanced.before.lean')
          after = headers('PrimalitySheafVerification/Mock2_Advanced.lean')
          print(f'before_count={len(before)}')
          print(f'after_count={len(after)}')
          if before != after:
              for idx, (a, b) in enumerate(zip(before, after)):
                  if a != b:
                      print(f'first_changed_index={idx}')
                      print(f'before={a}')
                      print(f'after={b}')
                      break
              if len(before) != len(after):
                  print('declaration count changed')
              raise SystemExit(1)
          print('statement_changed=0')
          print('assumptions_changed=0')
          PY

      - name: Static forbidden-token and global-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re
          src = Path('PrimalitySheafVerification/Mock2_Advanced.lean').read_text(encoding='utf-8')
          out = []
          i = 0
          depth = 0
          string = False
          esc = False
          while i < len(src):
              if depth:
                  if src.startswith('/-', i): depth += 1; out.extend('  '); i += 2
                  elif src.startswith('-/', i): depth -= 1; out.extend('  '); i += 2
                  else: out.append('\n' if src[i] == '\n' else ' '); i += 1
              elif string:
                  ch = src[i]; out.append('\n' if ch == '\n' else ' ')
                  if esc: esc = False
                  elif ch == '\\': esc = True
                  elif ch == '"': string = False
                  i += 1
              elif src.startswith('/-', i): depth = 1; out.extend('  '); i += 2
              elif src.startswith('--', i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i += 1
              elif src[i] == '"': string = True; out.append(' '); i += 1
              else: out.append(src[i]); i += 1
          if depth or string: raise SystemExit('unterminated comment or string')
          code = ''.join(out)
          patterns = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'global_axiom': r'(?m)^\s*axiom\b',
              'unsafe': r'\bunsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
              'by_contra!': r'\bby_contra!\b',
          }
          bad = False
          for name, pat in patterns.items():
              count = len(re.findall(pat, code))
              print(f'{name}={count}')
              bad |= count != 0
          if bad: raise SystemExit(1)
          PY

      - name: Install the exact Lean toolchain and restore the Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Regression-compile checked-in Mock2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p "${OUTDIR}"
          rm -f "${OUTDIR}/Mock2.olean" "${OUTDIR}/Mock2.ilean" "${OUTDIR}/Mock2.olean.private"
          set +e
          lake env lean "${MOCK2}" -o "${OUTDIR}/Mock2.olean" -i "${OUTDIR}/Mock2.ilean" \
            > "${LOGDIR}/Mock2-regression.log" 2>&1
          code=$?
          set -e
          echo "${code}" > "${LOGDIR}/Mock2-regression.exit"
          test "${code}" -eq 0
          test -s "${OUTDIR}/Mock2.olean"
          test -s "${OUTDIR}/Mock2.ilean"
          test "$(grep -c 'error:' "${LOGDIR}/Mock2-regression.log" || true)" -eq 0
          ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" \
            "${LOGDIR}/Mock2-regression.log"

      - name: Clean-compile the complete candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p "${OUTDIR}"
          for pass in 1 2; do
            rm -f \
              "${OUTDIR}/Mock2_Advanced.olean" \
              "${OUTDIR}/Mock2_Advanced.ilean" \
              "${OUTDIR}/Mock2_Advanced.olean.private"
            set +e
            lake env lean "${TARGET}" \
              -o "${OUTDIR}/Mock2_Advanced.olean" \
              -i "${OUTDIR}/Mock2_Advanced.ilean" \
              > "${LOGDIR}/Mock2_Advanced-pass${pass}.log" 2>&1
            code=$?
            set -e
            echo "${code}" > "${LOGDIR}/Mock2_Advanced-pass${pass}.exit"
            grep -n 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" | head -n 10 \
              > "${LOGDIR}/Mock2_Advanced-pass${pass}.first-errors.txt" || true
            grep -n 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" | tail -n 1 \
              > "${LOGDIR}/Mock2_Advanced-pass${pass}.last-error.txt" || true
            echo "error_count=$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" \
              >> "${LOGDIR}/summary.txt"
            test "${code}" -eq 0
            test -s "${OUTDIR}/Mock2_Advanced.olean"
            test -s "${OUTDIR}/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" \
              "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
          done
          sha256sum "${TARGET}" "${OUTDIR}/Mock2_Advanced.olean" "${OUTDIR}/Mock2_Advanced.ilean" \
            | tee "${LOGDIR}/proof-hashes.txt"

      - name: Materialize only the twice-verified source with a race guard
        shell: bash
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "${TARGET}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          printf '%s\n' "trigger_head=${GITHUB_SHA}" "remote_head=${remote_head}" \
            | tee "${LOGDIR}/race-guard.txt"
          test "${remote_head}" = "${GITHUB_SHA}"
          candidate_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m "fix: materialize Mock2 Advanced v68 verified source (${candidate_sha})"
          git push origin "HEAD:${BRANCH}"
          {
            echo '## Mock2 Advanced v68 candidate verified and materialized'
            echo "- source SHA-256: ${candidate_sha}"
            echo '- Mock2 regression: exit 0'
            echo '- candidate clean pass 1: exit 0'
            echo '- candidate clean pass 2: exit 0'
            echo '- theorem/lemma statement changes: 0'
            echo '- forbidden tokens and global axioms: 0'
          } >> "${GITHUB_STEP_SUMMARY}"
