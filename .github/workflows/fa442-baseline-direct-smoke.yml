name: FA442 baseline direct metric smoke gate

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fa442-baseline-direct-smoke-20260810
    paths:
      - build-logs/fa442-baseline-direct-smoke/REQUESTED.txt

permissions:
  contents: write
  actions: read

env:
  WORK_BRANCH: fix/fa442-baseline-direct-smoke-20260810
  BASELINE_SHA256: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
  BASELINE_LINE_COUNT: '60453'
  FA_MAX_ERRORS: '120'

jobs:
  baseline-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      - name: Checkout smoke branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa442-baseline-direct-smoke-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          rm -f /tmp/fa442-lean-install-ok
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa442-lean-version.txt
          lake --version | tee /tmp/fa442-lake-version.txt
          lake exe cache get | tee /tmp/fa442-cache-get.log
          touch /tmp/fa442-lean-install-ok

      - name: Recover authoritative baseline and inspect original FA442 skip conditions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/fa442_pipeline_prepare.py

      - name: Resolve exactly one baseline bundle entry
        id: baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          row=json.load(open('build-logs/fa442-pipeline-repair/prep/matrix.json', encoding='utf-8'))
          base=[x for x in row['include'] if x['is_baseline']]
          if len(base) != 1:
              raise SystemExit(f'expected one baseline bundle entry, found {len(base)}')
          x=base[0]
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as f:
              for k in ('variant','slug','sha256'):
                  f.write(f'{k}={x[k]}\n')
          PY

      - name: Directly compile Mock2, Mock2 Advanced, and baseline FA
        id: metric
        shell: bash
        env:
          VARIANT: ${{ steps.baseline.outputs.variant }}
          VARIANT_SLUG: ${{ steps.baseline.outputs.slug }}
          EXPECTED_SHA256: ${{ steps.baseline.outputs.sha256 }}
          IS_BASELINE: 'true'
          CANDIDATE_BUNDLE_ROOT: build-logs/fa442-pipeline-repair/prep/candidate-bundle
          BASELINE_META_PATH: build-logs/fa442-pipeline-repair/prep/baseline-meta.json
          LEAN_INSTALL_MARKER: /tmp/fa442-lean-install-ok
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa442_pipeline_metric.py

      - name: Enforce exact baseline direct metric
        shell: bash
        env:
          SLUG: ${{ steps.baseline.outputs.slug }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          slug=os.environ['SLUG']
          p=Path('build-logs/fa442-pipeline-repair/matrix-results')/slug/'metric.json'
          row=json.load(open(p,encoding='utf-8'))
          assert row['classification'] != 'INFRA_FAILURE', row
          assert row['direct_lean_executed'] is True, row
          assert row['source']['sha256'] == os.environ['BASELINE_SHA256'], row
          assert row['source']['line_count'] == int(os.environ['BASELINE_LINE_COUNT']), row
          assert row['prerequisites']['Mock2']['exit_code'] == 0, row
          assert row['prerequisites']['Mock2_Advanced']['exit_code'] == 0, row
          assert row['fa']['exit_code'] == 1, row
          first=row['fa']['first_error']
          assert (first['line'],first['column']) >= (31726,2), first
          assert first['declaration'] == 'actualEdgeAmbientParam_hasDerivAt', first
          assert row['fa']['max_errors'] == 120, row['fa']
          Path('build-logs/fa442-baseline-direct-smoke').mkdir(parents=True,exist_ok=True)
          Path('build-logs/fa442-baseline-direct-smoke/METRIC.json').write_text(
              json.dumps(row,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          Path('build-logs/fa442-baseline-direct-smoke/VERIFIED').touch()
          PY

      - name: Materialize and commit exact baseline checked-in source plus metric
        shell: bash
        env:
          SLUG: ${{ steps.baseline.outputs.slug }}
        run: |
          set -euo pipefail
          source="build-logs/fa442-pipeline-repair/matrix-results/${SLUG}/source.lean"
          cp "$source" /tmp/fa442-baseline.lean
          cp build-logs/fa442-baseline-direct-smoke/METRIC.json /tmp/fa442-baseline-metric.json
          git fetch origin "${WORK_BRANCH}"
          git reset --hard "origin/${WORK_BRANCH}"
          cp /tmp/fa442-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p build-logs/fa442-baseline-direct-smoke
          cp /tmp/fa442-baseline-metric.json build-logs/fa442-baseline-direct-smoke/METRIC.json
          touch build-logs/fa442-baseline-direct-smoke/VERIFIED
          selected_sha=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$selected_sha" = "$BASELINE_SHA256"
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa442-baseline-direct-smoke
          if ! git diff --cached --quiet; then
            git commit -m 'ci: check in and verify exact FA 31726 baseline [skip ci]'
          fi
          head_sha=$(git show HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | sha256sum | awk '{print $1}')
          test "$head_sha" = "$BASELINE_SHA256"
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"

      - name: Upload baseline smoke evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa442-baseline-direct-smoke-${{ github.run_id }}
          path: |
            build-logs/fa442-pipeline-repair/prep/ROOT_CAUSE.json
            build-logs/fa442-pipeline-repair/prep/ROOT_CAUSE.md
            build-logs/fa442-pipeline-repair/matrix-results
            build-logs/fa442-baseline-direct-smoke
          if-no-files-found: error
          retention-days: 90
