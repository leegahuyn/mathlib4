name: GPT QYM one-shot authority bootstrap retrigger

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-bootstrap-retrigger-once.yml
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  retrigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Dispatch authority bootstrap after current campaign results
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/leegahuyn/mathlib4/actions/workflows/gpt-qym-authority-bootstrap.yml/dispatches \
            -d '{"ref":"gpt/fa-qym-clean-final-20260816"}'
