name: Codex FA501 height density dependent hlevel strict direct Lean

on:
  push:
    branches:
      - fix/fa501-height-density-dependent-hlevel-20260811
    paths:
      - .github/workflows/codex-fa501-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-fa501-observe
  cancel-in-progress: true

env:
  FA_COMPILE_MAX_ERRORS: "1"

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish FA501 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA501 authoritative fast observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA500 -> FA501\`\n- upstream_FA500_run: \`31470489635\`\n- upstream_FA500_job: \`93712581127\`\n- upstream_FA500_source: \`1227fa2790152efa58c5f4e4acc14bde93a29259c5951c890eab80db6eedcc95\`\n- frontier: \`35735:8 selectedHeightGraphDensity_uniform_eventually_zero / index 2825\`\n- patch: \`rw [hlevel] -> simp only [hlevel]\`\n- maxErrors: \`1\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Run exact FA501 candidate/direct Lean and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa501_height_density_dependent_hlevel_candidate_ci.sh 2>&1 | tee /tmp/fa501.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report FA501 evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/fa501.md
          from pathlib import Path
          import json, os
          p=Path('build-logs/codex-fa501-height-density-dependent-hlevel/candidates/norms/METRIC.json')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          log=Path('/tmp/fa501.log')
          xs=['## FA501 authoritative observer — actual direct Lean','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`"]
          m=None
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                  xs.append(f'- {k}: `{m.get(k)}`')
              xs += ['', '### first error','```text',str(m.get('FA_first_error_message',''))[:5000],'```']
          else: xs.append('- METRIC.json: `MISSING`')
          if src.exists() and isinstance(m,dict) and m.get('FA_first_actual_error_line',0):
              a=src.read_text(encoding='utf-8',errors='replace').splitlines(); c=m['FA_first_actual_error_line']; lo,hi=max(1,c-12),min(len(a),c+30); xs += ['',f'### candidate source around line {c}','```lean','\n'.join(f'{i}: {a[i-1]}' for i in range(lo,hi+1)),'```']
          if log.exists(): xs += ['', '### tail','```text','\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-80:])[-10000:],'```']
          print('\n'.join(xs)[:32000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa501.md)"
      - name: Preserve result
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
