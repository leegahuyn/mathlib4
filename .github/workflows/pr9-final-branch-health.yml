name: PR9 final branch health gate

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pr9-final-branch-health.yml'
      - 'scripts/pr9_final_branch_health.sh'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/QYM.lean'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: pr9-final-branch-health
  cancel-in-progress: true

jobs:
  direct-source-health:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PR9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize latest base before final gate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pr9_sync_base_pass320_v2.sh

      - name: Install exact Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Verify checked-in source twice in dependency order
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/pr9_final_branch_health.sh

      - name: Record failed final gate without modifying Lean source
        if: failure()
        shell: bash
        run: |
          set -uo pipefail
          evidence='/tmp/pr9-final-branch-health'
          status='build-logs/pr9-final-branch-health.txt'
          fail_marker='build-logs/PR9_BRANCH_NOT_FIXED_PASS320_FA_QYM'
          mkdir -p build-logs "${evidence}"
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo 'result=FAIL'
            echo 'authority_run=31159696948'
            echo 'authority_job=92827136991'
            echo
            cat "${evidence}/compile-summary.csv" 2>/dev/null || true
            echo
            find "${evidence}/logs" -type f -name '*.errors.txt' -print0 2>/dev/null \
              | sort -z | while IFS= read -r -d '' f; do
                  echo "===== ${f} ====="
                  sed -n '1,180p' "${f}"
                done
          } > /tmp/pr9-final-health-failure.txt
          git fetch --no-tags origin '+refs/heads/ci/fa319-isolated-20260807:refs/remotes/origin/ci/fa319-isolated-20260807' || true
          git reset --hard origin/ci/fa319-isolated-20260807
          cp /tmp/pr9-final-health-failure.txt "${status}"
          touch "${fail_marker}"
          rm -f build-logs/PR9_BRANCH_FIXED_PASS320_FA_QYM
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A build-logs
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record PR9 final branch health failure'
            git push origin HEAD:ci/fa319-isolated-20260807 || true
          fi
          comment='/tmp/pr9-final-health-failure-comment.md'
          {
            echo '<!-- pr9-final-branch-health -->'
            echo '## PR #9 branch repair: not yet PASS'
            echo
            echo '- The final gate used checked-in source only.'
            echo '- Authority: `31159696948 / 92827136991`.'
            echo '- Lean source was not changed by this failed gate.'
            echo
            echo '```text'
            sed -n '1,260p' /tmp/pr9-final-health-failure.txt
            echo '```'
          } > "${comment}"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/9/comments?per_page=100" --jq '.[] | select(.body | contains("<!-- pr9-final-branch-health -->")) | .id' | tail -1)"
          if [[ -n "${existing}" ]]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${comment}" >/dev/null || true
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/9/comments" -F body=@"${comment}" >/dev/null || true
          fi

      - name: Upload final branch health evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-final-branch-health-${{ github.run_id }}
          path: |
            /tmp/pr9-final-branch-health
            /tmp/pr9-final-health-failure.txt
            build-logs/pr9-final-branch-health.txt
            build-logs/PR9_BRANCH_FIXED_PASS320_FA_QYM
            build-logs/PR9_BRANCH_NOT_FIXED_PASS320_FA_QYM
          if-no-files-found: warn
          retention-days: 30
