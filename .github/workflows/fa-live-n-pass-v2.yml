name: Persistent FA v2 N-pass then Mock3 QYM 2x

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fa-live-v2-n-pass-20260808
    paths:
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - '.fa-live-v2-seeded'
      - '.fa-live-v2-kick'
      - '.github/workflows/fa-live-n-pass-v2.yml'
      - 'scripts/fa_live_step_v2.py'
      - 'scripts/github_models_fa_agent.py'
      - 'scripts/fa_live_statement_fingerprint.py'

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: persistent-fa-v2-n-pass
  cancel-in-progress: false

jobs:
  advance:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact v2 live branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa-live-v2-n-pass-20260808
          fetch-depth: 900
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa-v2-lean-version.txt
          lake --version | tee /tmp/fa-v2-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/fa-v2-cache.log

      - name: Seed immutable statement baseline once
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f .fa-live-v2-seeded && -s .fa-live-statements.json ]]; then
            echo 'ready=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          if [[ ! -s .fa-live-statements.json ]]; then
            export PATH="${HOME}/.elan/bin:${PATH}"
            rm -rf /tmp/diagnose-pass359-fa
            set +e
            bash scripts/diagnose_pass359_fa.sh > /tmp/fa-v2-seed.log 2>&1
            set -e
            seed='/tmp/diagnose-pass359-fa/source/Mock2_FunctionalAnalysis-pass359.lean'
            test -s "${seed}"
            cp "${seed}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            python3 scripts/fa_live_statement_fingerprint.py \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              --write .fa-live-statements.json > /tmp/fa-v2-fingerprint.log
          fi

          printf 'seeded from the current verified cumulative frontier\n' > .fa-live-v2-seeded
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            .fa-live-statements.json .fa-live-v2-seeded
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): seed persistent v2 N-pass chain'
            git push origin HEAD:fix/fa-live-v2-n-pass-20260808
          fi
          echo 'ready=false' >> "${GITHUB_OUTPUT}"

      - name: End the seeding run after the next run was triggered
        if: steps.seed.outputs.ready == 'false'
        shell: bash
        run: echo 'Seed committed; the pushed commit starts the first repair iteration.'

      - name: Run one deterministic kernel-gated frontier step
        if: steps.seed.outputs.ready == 'true'
        id: deterministic
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa-live-step-v2
          python3 scripts/fa_live_step_v2.py \
            --attempt-limit 45 \
            --materialize-progress \
            > /tmp/fa-v2-deterministic.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat build-logs/fa-live-step-v2/state.json || true
          tail -400 /tmp/fa-v2-deterministic.log || true
          exit 0

      - name: Use a statement-locked model repair when deterministic search is stuck
        if: steps.seed.outputs.ready == 'true' && steps.deterministic.outputs.exit_code == '5'
        id: model
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa-model-agent
          python3 scripts/github_models_fa_agent.py \
            --seed PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --rounds 1 \
            --attempts 3 \
            --materialize-on-pass \
            > /tmp/fa-v2-model.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          python3 - <<'PY'
          import json
          from pathlib import Path

          state_path = Path('build-logs/fa-model-agent/state.json')
          working = Path('build-logs/fa-model-agent/working.lean')
          target = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          if state_path.exists() and working.exists():
              state = json.loads(state_path.read_text(encoding='utf-8'))
              history = state.get('history', [])
              if state.get('status') == 'pass' or (
                  history and history[-1].get('accepted_attempt')
              ):
                  target.write_text(working.read_text(encoding='utf-8'), encoding='utf-8')
          PY
          cat build-logs/fa-model-agent/state.json || true
          tail -400 /tmp/fa-v2-model.log || true
          exit 0

      - name: Guard public statements and reject proof escapes
        if: steps.seed.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa_live_statement_fingerprint.py \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --compare .fa-live-statements.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock2_FunctionalAnalysis_Integrated*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('QYM*.lean'))
          forbidden = re.compile(
              r'(?m)^\s*(?:sorry|admit)\b|(?m)^\s*axiom\b|(?m)^\s*unsafe\b|'
              r'\bnative_decide\b|\bLean\.ofReduceBool\b'
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              match = forbidden.search(text)
              if match:
                  raise SystemExit(f'{path}: forbidden token {match.group(0)!r}')
          print(f'forbidden-token audit passed for {len(targets)} targets')
          PY

      - name: Compile current FA source and persist only real forward progress
        if: steps.seed.outputs.ready == 'true'
        id: persist
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          evidence='/tmp/fa-v2-evidence'
          mkdir -p "${evidence}"
          cp -r build-logs/fa-live-step-v2 "${evidence}/" 2>/dev/null || true
          cp -r build-logs/fa-model-agent "${evidence}/" 2>/dev/null || true
          cp /tmp/fa-v2-deterministic.log "${evidence}/" 2>/dev/null || true
          cp /tmp/fa-v2-model.log "${evidence}/" 2>/dev/null || true

          set +e
          lake env lean -DmaxErrors=1 \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "${evidence}/current-first.log" 2>&1
          first_rc=$?
          set -e
          echo "first_rc=${first_rc}" >> "${GITHUB_OUTPUT}"

          second_rc=99
          if [[ ${first_rc} -eq 0 ]]; then
            set +e
            lake env lean -DmaxErrors=2000 \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              > "${evidence}/current-second.log" 2>&1
            second_rc=$?
            set -e
          fi
          echo "second_rc=${second_rc}" >> "${GITHUB_OUTPUT}"

          first_error="$(grep -m1 -E '\.lean:[0-9]+:[0-9]+:.*error' "${evidence}/current-first.log" || true)"
          python3 - <<PY
          import hashlib, json
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          payload = {
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'first_exit': int('${first_rc}'),
              'second_exit': int('${second_rc}'),
              'first_error': '''${first_error}''',
              'github_run_id': '${GITHUB_RUN_ID}',
              'github_sha': '${GITHUB_SHA}',
          }
          Path('.fa-live-v2-frontier.json').write_text(
              json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          PY

          if [[ ${first_rc} -eq 0 && ${second_rc} -eq 0 ]]; then
            echo 'fa_pass=true' >> "${GITHUB_OUTPUT}"
            exit 0
          fi
          echo 'fa_pass=false' >> "${GITHUB_OUTPUT}"

          if git diff --quiet -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean; then
            echo 'No kernel-verified forward source change was produced.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            .fa-live-v2-frontier.json
          git commit -m 'fix(fa): advance persistent v2 frontier'
          git push origin HEAD:fix/fa-live-v2-n-pass-20260808

      - name: Verify FA direct source twice with fresh artifacts
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v2-final'
          mkdir -p "${root}" "${logs}"
          src='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          out="${root}/Mock2_FunctionalAnalysis"
          for n in 1 2; do
            rm -f "${out}.olean" "${out}.ilean"
            lake env lean -DmaxErrors=2000 \
              -o "${out}.olean" -i "${out}.ilean" "${src}" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.log" 2>&1
            test -s "${out}.olean" && test -s "${out}.ilean"
            ! grep -n 'error:' "${logs}/Mock2_FunctionalAnalysis-${n}.log"
            sha256sum "${src}" "${out}.olean" "${out}.ilean" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.sha256"
          done
          echo FA_2X_DIRECT_SOURCE_PASS > "${logs}/FA_2X_PASS.txt"

      - name: Verify Integrated and every actual Mock3 bridge twice
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v2-final'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <(
            {
              find PrimalitySheafVerification -maxdepth 1 -type f \
                -name 'Mock2_FunctionalAnalysis_Integrated*.lean'
              find PrimalitySheafVerification -maxdepth 1 -type f \
                -name 'Mock3*.lean'
            } | sort -u
          )
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/Integrated-Mock3-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo INTEGRATED_MOCK3_2X_DIRECT_SOURCE_PASS \
            > "${logs}/INTEGRATED_MOCK3_2X_PASS.txt"

      - name: Verify every QYM target twice
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v2-final'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'QYM*.lean' | sort
          )
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/QYM-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo QYM_2X_DIRECT_SOURCE_PASS > "${logs}/QYM_2X_PASS.txt"

      - name: Record final three-stage PASS on the branch
        if: steps.persist.outputs.fa_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fa-v2-final/FA_2X_PASS.txt
          test -s /tmp/fa-v2-final/INTEGRATED_MOCK3_2X_PASS.txt
          test -s /tmp/fa-v2-final/QYM_2X_PASS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          payload = {
              'status': 'PASS',
              'order': [
                  'Mock2_FunctionalAnalysis 2x',
                  'Integrated and every actual Mock3 2x',
                  'every QYM target 2x',
              ],
              'fa_source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': os.environ['GITHUB_SHA'],
          }
          path = Path('build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(payload, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            .fa-live-v2-frontier.json build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if ! git diff --cached --quiet; then
            git commit -m 'test: record FA Integrated Mock3 QYM two-run PASS'
            git push origin HEAD:fix/fa-live-v2-n-pass-20260808
          fi

      - name: Upload v2 chain evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-live-v2-${{ github.sha }}
          path: |
            /tmp/fa-v2-evidence
            /tmp/fa-v2-final
            /tmp/fa-v2-lean-version.txt
            /tmp/fa-v2-lake-version.txt
            /tmp/fa-v2-cache.log
            /tmp/fa-v2-seed.log
            /tmp/fa-v2-fingerprint.log
            .fa-live-v2-frontier.json
            build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90
