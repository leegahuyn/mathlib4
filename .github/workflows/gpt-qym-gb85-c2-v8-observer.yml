name: GPT QYM GB85 C2 v8 observer
# trigger: locate-all-v8-runs-2

on:
  push:
    branches:
      - gpt/qym-gb85-c2-v8-observer-20260819
    paths:
      - .github/workflows/gpt-qym-gb85-c2-v8-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      OBSERVER_BRANCH: gpt/qym-gb85-c2-v8-observer-20260819
      TARGET_BRANCH: gpt/qym-gb85-c2-v8-convert-20260819
      TARGET_WORKFLOW: gpt-qym-gb85-c2-v8.yml
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Locate all exact v8 runs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-v8-observer
          payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=$TARGET_BRANCH&event=push&per_page=20")"
          jq --arg observed_at "$(date -u +%FT%TZ)" '{observed_at:$observed_at,runs:[.workflow_runs[] | {id,name,path,head_sha,run_number,status,conclusion,html_url,created_at,updated_at,run_attempt}] | sort_by(.run_number)}' <<<"$payload" > .github/qym-v8-observer/RUNS.json
          test "$(jq '.runs | length' .github/qym-v8-observer/RUNS.json)" -ge 1
          cat .github/qym-v8-observer/RUNS.json

      - name: Persist read-only run list
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qym-v8-observer/RUNS.json
          git commit -m 'QYM C2 v8 observer: record all run identities [skip ci]'
          git push origin "HEAD:$OBSERVER_BRANCH"
