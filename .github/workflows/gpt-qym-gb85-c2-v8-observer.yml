name: GPT QYM GB85 C2 v8 observer
# trigger: locate-v8-run-1

on:
  push:
    branches:
      - gpt/qym-gb85-c2-v8-observer-20260819
    paths:
      - .github/workflows/gpt-qym-gb85-c2-v8-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      OBSERVER_BRANCH: gpt/qym-gb85-c2-v8-observer-20260819
      TARGET_BRANCH: gpt/qym-gb85-c2-v8-convert-20260819
      TARGET_WORKFLOW: gpt-qym-gb85-c2-v8.yml
      TARGET_SHA: e39be10b4065b383b2ee2b0c053f73cd040c3729
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Locate exact v8 push run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-v8-observer
          payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/workflows/$TARGET_WORKFLOW/runs?branch=$TARGET_BRANCH&event=push&per_page=50")"
          row="$(jq -c --arg sha "$TARGET_SHA" '[.workflow_runs[] | select(.head_sha == $sha)] | sort_by(.created_at) | last' <<<"$payload")"
          test "$row" != null
          jq -n --arg observed_at "$(date -u +%FT%TZ)" --arg target_sha "$TARGET_SHA" --argjson run "$row" '{observed_at:$observed_at,target_sha:$target_sha,run:{id:$run.id,name:$run.name,path:$run.path,status:$run.status,conclusion:$run.conclusion,html_url:$run.html_url,created_at:$run.created_at,updated_at:$run.updated_at,run_attempt:$run.run_attempt}}' > .github/qym-v8-observer/RUN_IDENTITY.json
          cat .github/qym-v8-observer/RUN_IDENTITY.json

      - name: Persist read-only run identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qym-v8-observer/RUN_IDENTITY.json
          git commit -m 'QYM C2 v8 observer: record exact run identity [skip ci]'
          git push origin "HEAD:$OBSERVER_BRANCH"
