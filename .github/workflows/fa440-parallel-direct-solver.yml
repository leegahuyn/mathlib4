name: FA440 single-runner parallel direct Lean solver and ordered gate

on:
  push:
    branches:
      - fix/fa440-parallel-direct-solver-20260810
    paths:
      - scripts/fa440_parallel_direct_solver.py
      - .github/workflows/fa440-parallel-direct-solver.yml
      - build-logs/fa440-parallel-direct-solver/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa440-parallel-direct-solver
  cancel-in-progress: false

jobs:
  solve-persist-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa440-parallel-direct-solver-20260810
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FA440_MAX_WORKERS: '4'
      FA440_MAX_ROUNDS: '6'
      FA440_MAX_CANDIDATES: '96'
      FA440_TIME_BUDGET_SECONDS: '18800'

    steps:
      - name: Checkout exact FA440 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa440-parallel-direct-solver-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa440-lean-version.txt
          lake --version | tee /tmp/fa440-lake-version.txt
          lake exe cache get | tee /tmp/fa440-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run parallel same-height direct Lean solver
        id: solver
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa440_parallel_direct_solver.py \
            > /tmp/fa440-console.log 2>&1
          script_rc=$?
          cat /tmp/fa440-console.log
          d=build-logs/fa440-parallel-direct-solver
          mkdir -p "$d"
          cp /tmp/fa440-lean-version.txt "$d/lean-version.txt" 2>/dev/null || true
          cp /tmp/fa440-lake-version.txt "$d/lake-version.txt" 2>/dev/null || true
          cp /tmp/fa440-cache-get.log "$d/cache-get.log" 2>/dev/null || true
          cp /tmp/fa440-console.log "$d/console.log" 2>/dev/null || true
          if test -f "$d/CURRENT.json"; then
            persist=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('persist_source',False)).lower())")
            strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
            selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('source_sha256',''))")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('exit_code',999))")
            first_line=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_line',0))")
            first_col=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_col',0))")
            declaration=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_declaration',''))")
          else
            persist=false; strict=false; selected_sha=''; fa_exit=999
            first_line=0; first_col=0; declaration=''
          fi
          {
            echo "script_rc=$script_rc"
            echo "persist_source=$persist"
            echo "strict_promotion=$strict"
            echo "selected_sha=$selected_sha"
            echo "fa_exit=$fa_exit"
            echo "first_line=$first_line"
            echo "first_col=$first_col"
            echo "declaration=$declaration"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only direct-verified selected source and evidence
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa440-parallel-direct-solver
          if ! test -f "$d/CURRENT.json"; then
            git add "$d" 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'evidence: preserve FA440 infrastructure failure [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
            echo "source_committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          persist=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('persist_source',False)).lower())")
          strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          selected=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
          first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
          if test "$persist" = true; then
            actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
            test "$actual" = "$selected"
            selected_artifact=$(sha256sum "$d/Mock2_FunctionalAnalysis-selected.lean" | awk '{print $1}')
            test "$selected_artifact" = "$selected"
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
            if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
            if test "$strict" = true; then
              msg="fix: persist FA440 ${metric} direct-verified source ${selected:0:12}"
            else
              msg="fix: materialize PASS423 direct-verified source in FA440 ${selected:0:12}"
            fi
            source_committed=true
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d"
            msg='evidence: retain FA champion after FA440 no-source result [skip ci]'
            source_committed=false
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          echo "source_committed=$source_committed" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "selected_sha=$selected" >> "$GITHUB_OUTPUT"
          echo "fa_exit=$fa_exit" >> "$GITHUB_OUTPUT"
          echo "first_line=$first" >> "$GITHUB_OUTPUT"
          if test "$source_committed" = true; then
            head=$(git rev-parse HEAD)
            if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
            immutable="champion/fa440-${metric}-${selected:0:12}-${GITHUB_RUN_ID}"
            python3 - <<PY > /tmp/fa440-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
            if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
                 --input /tmp/fa440-ref.json > "$d/immutable-response.json" \
                 2> "$d/immutable-error.txt"; then
              printf '%s\n' "$immutable" > "$d/IMMUTABLE_CHAMPION_BRANCH.txt"
            fi
          fi

      - name: Verify checked-in source identity
        id: identity
        if: always()
        env:
          SELECTED_SHA: ${{ steps.persist.outputs.selected_sha }}
          SOURCE_COMMITTED: ${{ steps.persist.outputs.source_committed }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa440-parallel-direct-solver/final-gates
          mkdir -p "$d"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test "${SOURCE_COMMITTED:-false}" = true && test -n "$SELECTED_SHA" && \
             test "$SELECTED_SHA" = "$checked" && test "$SELECTED_SHA" = "$worktree"; then
            identity=true
          fi
          printf 'selected_sha256=%s\nchecked_in_sha256=%s\nworktree_sha256=%s\nidentity_ok=%s\nsource_commit=%s\n' \
            "$SELECTED_SHA" "$checked" "$worktree" "$identity" "$(git rev-parse HEAD)" \
            > "$d/CHECKED_IN_IDENTITY.txt"
          echo "identity_ok=$identity" >> "$GITHUB_OUTPUT"

      - name: Compile identical checked-in FA source twice and audit forbidden escapes
        id: fa_gate
        if: always()
        env:
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa440-parallel-direct-solver/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          compile_fa() {
            run_number=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/FA-run${run_number}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${run_number}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          first=125; second=125
          if test "${IDENTITY_OK:-false}" = true; then
            compile_fa 1; first=$?
            if test "$first" -eq 0; then compile_fa 2; second=$?; fi
          fi
          export FIRST="$first" SECOND="$second"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text(encoding='utf-8')
          out=[]; i=0; line=False; string=False; escaped=False; depth=0
          while i<len(text):
              c=text[i]; n=text[i+1] if i+1<len(text) else ''
              if line:
                  if c=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if c=='/' and n=='-': depth+=1; out+=[' ',' ']; i+=2; continue
                  if c=='-' and n=='/': depth-=1; out+=[' ',' ']; i+=2; continue
                  out.append('\n' if c=='\n' else ' '); i+=1; continue
              if string:
                  out.append('\n' if c=='\n' else ' ')
                  if escaped: escaped=False
                  elif c=='\\': escaped=True
                  elif c=='"': string=False
                  i+=1; continue
              if c=='-' and n=='-': line=True; out+=[' ',' ']; i+=2; continue
              if c=='/' and n=='-': depth=1; out+=[' ',' ']; i+=2; continue
              if c=='"': string=True; out.append(' '); i+=1; continue
              out.append(c); i+=1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'new_global_axiom':r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b',
          }
          audit={name:len(re.findall(pattern,code)) for name,pattern in patterns.items()}
          first=int(os.environ['FIRST']); second=int(os.environ['SECOND'])
          clean=all(value==0 for value in audit.values())
          result={
              'checked_in_source':True,'FA_run1_exit':first,'FA_run2_exit':second,
              'forbidden_audit':audit,'forbidden_clean':clean,
              'FA_TRUE_PASS':first==0 and second==0 and clean,'maxErrors_cap':1,
          }
          path=Path('build-logs/fa440-parallel-direct-solver/final-gates/FA_FINAL.json')
          path.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa440-parallel-direct-solver/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            targets+=(Mock2_FunctionalAnalysis_Integrated)
          else
            complete=false; echo missing > "$d/Integrated-missing.txt"
          fi
          shopt -s nullglob
          for source in PrimalitySheafVerification/Mock3*.lean; do
            targets+=("$(basename "$source" .lean)")
          done
          if test -f PrimalitySheafVerification/QYM.lean; then
            targets+=(QYM)
          else
            complete=false; echo missing > "$d/QYM-missing.txt"
          fi
          compile_one() {
            stem=$1; run_number=$2
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}-run${run_number}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run_number}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; first=$?; second=125
              if test "$first" -eq 0; then compile_one "$stem" 2; second=$?; fi
              if test "$first" -ne 0 || test "$second" -ne 0; then
                complete=false
                break
              fi
            done
          fi
          if test "$complete" = true; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          d=Path('build-logs/fa440-parallel-direct-solver/final-gates')
          runs={}
          for exit_path in sorted(d.glob('*-run*.exit')):
              log_path=exit_path.with_suffix('.log')
              log=log_path.read_text(errors='replace') if log_path.exists() else ''
              runs[exit_path.stem]={
                  'exit_code':int(exit_path.read_text()),
                  'error_headers_under_cap':len(re.findall(r'\.lean:\d+:\d+:\s+(?:error(?:\([^)]*\))?:',log)),
                  'maxErrors_cap':1,
              }
          result={'complete':(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists(),'runs':runs}
          (d/'DOWNSTREAM_FINAL.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa440-parallel-direct-solver
          if ! git diff --cached --quiet; then
            if test -f build-logs/fa440-parallel-direct-solver/final-gates/ALL_REQUIRED_TARGETS_2X_PASS; then
              msg='ci: record FA440 FA Integrated Mock3 QYM checked-in 2x PASS evidence [skip ci]'
            else
              msg='ci: record FA440 checked-in direct frontier evidence [skip ci]'
            fi
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA440 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa440-parallel-direct-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa440-parallel-direct-solver
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce full ordered completion
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
