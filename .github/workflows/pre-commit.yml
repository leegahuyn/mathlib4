name: FA452 compact support energy direct Lean matrix

on:
  push:
    branches:
      - fix/fa452-compact-support-energy-matrix-20260810
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa452-compact-support-energy-direct-matrix
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa452-compact-support-energy-matrix-20260810
  MAX_ERRORS: '180'

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        variant:
          - root_baseline
          - simpa_norm
          - change_norm
          - rw_simpa_norm
          - simpa_norm_compact_pow
          - change_norm_compact_pow
          - simpa_norm_compact_mulleft
          - simpa_norm_compact_convert
          - rw_simpa_norm_compact_pow
          - simpa_norm_compact_mono
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout current FA452 repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa452-compact-support-energy-matrix-20260810
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate candidate and execute actual direct Lean CLI
        shell: bash
        run: bash scripts/fa452_candidate_ci.sh

      - name: Upload complete candidate source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa452-candidate-${{ matrix.variant }}
          path: build-logs/fa452-compact-energy/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject skipped Lean execution and prerequisite regressions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          variant = os.environ['VARIANT']
          path = Path(f'build-logs/fa452-compact-energy/candidates/{variant}/METRIC.json')
          if not path.exists():
              raise SystemExit('INFRA_FAILURE: METRIC.json missing')
          metric = json.loads(path.read_text(encoding='utf-8'))
          ok = (
              metric.get('classification') != 'INFRA_FAILURE'
              and metric.get('all_required_lean_executed') is True
              and metric.get('source_metadata_identity') is True
              and metric.get('Mock2_exit') == 0
              and metric.get('Mock2_errors_under_cap') == 0
              and metric.get('Mock2_Advanced_exit') == 0
              and metric.get('Mock2_Advanced_errors_under_cap') == 0
              and metric.get('FA_executed') is True
              and metric.get('forbidden_clean') is True
          )
          print(json.dumps(metric, indent=2, ensure_ascii=False))
          if not ok:
              raise SystemExit('INFRA_FAILURE or prerequisite regression')
          PY

  select-confirm-persist:
    name: independent baseline, selector, checked-in x2, downstream gate
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '260'
    steps:
      - name: Checkout current FA452 repair branch with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa452-compact-support-energy-matrix-20260810
          fetch-depth: 2500
          persist-credentials: true

      - name: Configure Git identity before any possible commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git config user.name)" = 'github-actions[bot]'
          test "$(git config user.email)" = '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run strict direct selector and checked-in verification
        id: selector
        shell: bash
        run: bash scripts/fa452_selector_ci.sh

      - name: Upload complete FA452 evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa452-complete-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa452-compact-energy
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce infrastructure separately from Lean proof status
        if: always()
        shell: bash
        run: |
          test "${{ steps.selector.outcome }}" = success
          test -s build-logs/fa452-compact-energy/selected/SELECTION.json
          test -s build-logs/fa452-compact-energy/selected/CANDIDATE_RESULTS.json
          test -s build-logs/fa452-compact-energy/selected-confirm/CONFIRMATION.json
          test -s build-logs/fa452-compact-energy/final/CHECKED_IN_IDENTITY.json
          test -s build-logs/fa452-compact-energy/final/FA_FINAL.json
          test -s build-logs/fa452-compact-energy/final/FINAL.json
          test -s build-logs/fa452-compact-energy/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
