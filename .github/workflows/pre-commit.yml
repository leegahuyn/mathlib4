name: Cancel superseded FA exploration runs

on:
  push:
    branches:
      - ci/fa444-recognized-run-probe-20260810
  pull_request:
    branches:
      - ci/fa444-recognized-run-probe-20260810
    types: [opened, synchronize, reopened]

permissions:
  actions: write
  contents: write

concurrency:
  group: superseded-fa-run-canceller-20260810
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa444-recognized-run-probe-20260810
          persist-credentials: true
      - name: Force-cancel only superseded exploration runs
        shell: bash
        run: |
          set +e
          mkdir -p build-logs/fa-run-cancel
          : > build-logs/fa-run-cancel/CANCEL_RESULTS.txt
          for run_id in \
            31370630147 31371627211 31372073619 31372769897 31373126614 \
            31374330498 31374877843 31375909117 31376122619 31376472425 \
            31376638208 31376821540 31377200700; do
            before=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.status + ":" + (.conclusion // "")' 2>&1)
            printf 'run=%s before=%s\n' "$run_id" "$before" \
              | tee -a build-logs/fa-run-cancel/CANCEL_RESULTS.txt
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
              >> build-logs/fa-run-cancel/CANCEL_RESULTS.txt 2>&1
            printf 'force_cancel_exit=%s\n' "$?" \
              | tee -a build-logs/fa-run-cancel/CANCEL_RESULTS.txt
          done
          printf 'preserved_selector_run=31373682702\n' \
            | tee -a build-logs/fa-run-cancel/CANCEL_RESULTS.txt
          printf 'preserved_latest_focused_run=31377365024\n' \
            | tee -a build-logs/fa-run-cancel/CANCEL_RESULTS.txt
          exit 0
      - name: Persist cancellation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-logs/fa-run-cancel/CANCEL_RESULTS.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record superseded FA run cancellation [skip ci]'
            git push origin HEAD:ci/fa444-recognized-run-probe-20260810
          fi
