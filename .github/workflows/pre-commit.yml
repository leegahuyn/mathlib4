name: Locate FA452 push workflow run

on:
  push:
    branches:
      - ci/fa452-run-locator-20260810

permissions:
  actions: read
  contents: write

concurrency:
  group: fa452-run-locator
  cancel-in-progress: true

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_BRANCH: fix/fa452-compact-support-energy-matrix-20260810
      TARGET_SHA: dda9ea4c916735e3ed8814a077a395a19c24df78
    steps:
      - name: Checkout locator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa452-run-locator-20260810
          persist-credentials: true

      - name: Poll exact target push run
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa452-run-locator
          found=false
          for attempt in $(seq 1 180); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${TARGET_BRANCH}&event=push&per_page=100" > /tmp/fa452-runs.json
            if python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/fa452-runs.json').read_text(encoding='utf-8'))
          runs=data.get('workflow_runs',[])
          exact=[r for r in runs if r.get('head_sha')==os.environ['TARGET_SHA']]
          result={
            'found':bool(exact),
            'target_branch':os.environ['TARGET_BRANCH'],
            'target_sha':os.environ['TARGET_SHA'],
            'exact_matches':[
              {k:r.get(k) for k in (
                'id','name','path','run_number','run_attempt','event','status',
                'conclusion','head_branch','head_sha','html_url','created_at','updated_at'
              )} for r in exact
            ],
            'recent_branch_runs':[
              {k:r.get(k) for k in (
                'id','name','path','run_number','run_attempt','event','status',
                'conclusion','head_branch','head_sha','html_url','created_at','updated_at'
              )} for r in runs[:30]
            ],
          }
          Path('build-logs/fa452-run-locator/RUN_LOCATOR.json').write_text(
            json.dumps(result,indent=2)+'\n',encoding='utf-8')
          if not exact:
            raise SystemExit(1)
          print(json.dumps(result,indent=2))
          PY
            then
              found=true
              break
            fi
            sleep 5
          done
          cp /tmp/fa452-runs.json build-logs/fa452-run-locator/RUNS_RAW.json
          printf '%s\n' "$found" > build-logs/fa452-run-locator/found.txt

      - name: Persist locator evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-logs/fa452-run-locator
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA452 push run locator [skip ci]'
            git push origin HEAD:ci/fa452-run-locator-20260810
          fi
