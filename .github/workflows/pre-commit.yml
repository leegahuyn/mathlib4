name: FA453 compact energy from FA451 direct Lean matrix

on:
  push:
    branches:
      - fix/fa453-compact-energy-from-fa451-20260810
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa453-compact-energy-from-fa451-direct-matrix
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa453-compact-energy-from-fa451-20260810
  MAX_ERRORS: '160'

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
          - baseline
          - direct_union
          - direct_union_explicit
          - direct_union_abs
    env:
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout current FA453 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa453-compact-energy-from-fa451-20260810
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate candidate and execute actual direct Lean CLI
        shell: bash
        run: bash scripts/fa453_candidate_ci.sh

      - name: Upload candidate source and complete direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa453-candidate-${{ matrix.variant }}
          path: build-logs/fa453-compact-energy/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject skipped Lean execution and prerequisite regressions
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          variant=os.environ['VARIANT']
          path=Path(f'build-logs/fa453-compact-energy/candidates/{variant}/METRIC.json')
          if not path.exists():
              raise SystemExit('INFRA_FAILURE: METRIC.json missing')
          metric=json.loads(path.read_text(encoding='utf-8'))
          ok=(
              metric.get('classification')!='INFRA_FAILURE'
              and metric.get('all_required_lean_executed') is True
              and metric.get('source_metadata_identity') is True
              and metric.get('Mock2_exit')==0
              and metric.get('Mock2_errors_under_cap')==0
              and metric.get('Mock2_Advanced_exit')==0
              and metric.get('Mock2_Advanced_errors_under_cap')==0
              and metric.get('FA_executed') is True
              and metric.get('forbidden_clean') is True
          )
          print(json.dumps(metric,indent=2,ensure_ascii=False))
          if not ok:
              raise SystemExit('INFRA_FAILURE or prerequisite regression')
          PY

  select-confirm-persist:
    name: independent FA451 baseline, selector, checked-in x2, downstream gate
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      ACTIVE_BRANCH: fix/fa453-compact-energy-from-fa451-20260810
      MAX_ERRORS: '260'
    steps:
      - name: Checkout current FA453 branch with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa453-compact-energy-from-fa451-20260810
          fetch-depth: 2500
          persist-credentials: true

      - name: Configure GitHub Actions identity
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git config user.name)" = 'github-actions[bot]'
          test "$(git config user.email)" = '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run independent baseline, strict selector, confirmation, and checked-in verification
        id: selector
        shell: bash
        run: bash scripts/fa453_selector_ci.sh

      - name: Upload complete FA453 direct evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa453-complete-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa453-compact-energy
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Patch report with artifact identity
        if: always() && steps.upload.outputs.artifact-id != ''
        env:
          ARTIFACT_ID: ${{ steps.upload.outputs.artifact-id }}
          ARTIFACT_URL: ${{ steps.upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('build-logs/fa453-compact-energy/final')
          report=root/'FA_MATRIX_PIPELINE_REPAIR_REPORT.txt'
          summary=root/'FINAL.json'
          if report.exists():
              text=report.read_text(encoding='utf-8')
              text=text.replace('Artifact ID: PENDING_UPLOAD',f"Artifact ID: {os.environ['ARTIFACT_ID']}")
              report.write_text(text,encoding='utf-8')
          if summary.exists():
              data=json.loads(summary.read_text(encoding='utf-8'))
              data['artifact_id']=int(os.environ['ARTIFACT_ID'])
              data['artifact_url']=os.environ.get('ARTIFACT_URL','')
              summary.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
          git add -f \
            build-logs/fa453-compact-energy/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt \
            build-logs/fa453-compact-energy/final/FINAL.json
          if ! git diff --cached --quiet; then
            git commit -m 'ci: attach FA453 evidence artifact identity [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Enforce infrastructure separately from Lean proof status
        if: always()
        shell: bash
        run: |
          test "${{ steps.selector.outcome }}" = success
          test -s build-logs/fa453-compact-energy/selected/SELECTION.json
          test -s build-logs/fa453-compact-energy/selected/CANDIDATE_RESULTS.json
          test -s build-logs/fa453-compact-energy/selected/INDEPENDENT_BASELINE.json
          test -s build-logs/fa453-compact-energy/selected-confirm/CONFIRMATION.json
          test -s build-logs/fa453-compact-energy/final/CHECKED_IN_IDENTITY.json
          test -s build-logs/fa453-compact-energy/final/FA_FINAL.json
          test -s build-logs/fa453-compact-energy/final/FINAL.json
          test -s build-logs/fa453-compact-energy/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
