name: FA444 repaired FA442 direct Lean matrix via recognized workflow

on:
  push:
    branches:
      - fix/fa444-fa442-matrix-pipeline-repair-20260810
  pull_request:
    branches:
      - fix/fa444-fa442-matrix-pipeline-repair-20260810

permissions:
  actions: read
  contents: write

concurrency:
  group: fa444-recognized-matrix-pipeline
  cancel-in-progress: true

env:
  ACTIVE_BRANCH: fix/fa444-fa442-matrix-pipeline-repair-20260810
  MAX_ERRORS: '100'

jobs:
  candidate:
    name: direct candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant:
          - baseline
          - slope_only
          - slope_structures
          - slope_change_convert
          - slope_paired_parenthesized
          - slope_paired_dot
          - slope_paired_parenthesized_ring
          - slope_paired_parenthesized_ring_height
          - slope_paired_parenthesized_ring_height_upper
          - slope_paired_parenthesized_ring_height_upper_tail
          - slope_paired_parenthesized_ring_height_upper_tail_zero
          - slope_paired_parenthesized_all_known
          - slope_paired_dot_all_known
          - slope_structures_paired_all_known
          - slope_change_convert_paired_all_known
          - slope_paired_parenthesized_deep_simp
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '50'
    steps:
      - name: Checkout exact repair base commit for this event
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 2500
          persist-credentials: false

      - name: Recover baseline, generate candidate, install Lean, and directly compile
        shell: bash
        run: bash scripts/fa444_candidate_ci.sh

      - name: Upload complete candidate source and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa442-repair-candidate-${{ matrix.variant }}
          path: build-logs/fa442-pipeline-repair/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual direct Lean execution without requiring FA proof success
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa442-pipeline-repair/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json,sys
          path=sys.argv[1]
          try:
              metric=json.load(open(path,encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f"INFRA_FAILURE: metric missing or invalid: {exc}")
          required=(
              metric.get('classification') != 'INFRA_FAILURE'
              and metric.get('all_required_lean_executed') is True
              and metric.get('source_metadata_identity') is True
              and metric.get('line_count') == 60453
              and metric.get('Mock2_exit') == 0
              and metric.get('Mock2_Advanced_exit') == 0
              and metric.get('forbidden_clean') is True
          )
          if not required:
              raise SystemExit(
                  'INFRA_FAILURE or prerequisite regression: '
                  + json.dumps(metric,ensure_ascii=False)
              )
          print(
              f"DIRECT_METRIC_OK variant={metric['variant']} "
              f"FA_exit={metric['FA_exit']} "
              f"first={metric['FA_first_actual_error_line']}:"
              f"{metric['FA_first_actual_error_col']} "
              f"declaration={metric['FA_first_error_declaration']}"
          )
          PY

  select-confirm-persist:
    name: independent baseline, selector, checked-in x2, downstream gate
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '100'
    steps:
      - name: Checkout exact repair base commit with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          fetch-depth: 2500
          persist-credentials: true

      - name: Run independent baseline, strict selector, materialization, and checked-in gates
        id: selector
        shell: bash
        run: bash scripts/fa444_selector_ci.sh

      - name: Upload full direct Lean evidence before report ID patch
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa444-direct-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa442-pipeline-repair
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Patch report with evidence artifact ID and persist it
        if: always() && steps.evidence_upload.outcome == 'success'
        env:
          EVIDENCE_ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
          EVIDENCE_ARTIFACT_URL: ${{ steps.evidence_upload.outputs.artifact-url }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          report=build-logs/fa442-pipeline-repair/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
          summary=build-logs/fa442-pipeline-repair/final/FINAL.json
          if test -f "$report"; then
            python3 - "$report" "$summary" <<'PY'
          import json,os,sys
          from pathlib import Path
          report=Path(sys.argv[1]); summary=Path(sys.argv[2])
          artifact_id=os.environ.get('EVIDENCE_ARTIFACT_ID','')
          artifact_url=os.environ.get('EVIDENCE_ARTIFACT_URL','')
          text=report.read_text(encoding='utf-8')
          text=text.replace('Artifact ID: PENDING_UPLOAD',f'Artifact ID: {artifact_id}')
          report.write_text(text,encoding='utf-8')
          if summary.exists():
              data=json.loads(summary.read_text(encoding='utf-8'))
              data['artifact_id']=artifact_id
              data['artifact_url']=artifact_url
              summary.write_text(json.dumps(data,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          PY
            git add -f "$report" "$summary"
            if ! git diff --cached --quiet; then
              git commit -m 'ci: attach FA444 evidence artifact identity [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
          fi

      - name: Upload final report with populated evidence artifact ID
        id: report_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa444-final-report-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa442-pipeline-repair/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
            build-logs/fa442-pipeline-repair/final/FINAL.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce infrastructure integrity separately from Lean proof status
        if: always()
        shell: bash
        run: |
          test "${{ steps.selector.outcome }}" = success
          test -s build-logs/fa442-pipeline-repair/selected/CANDIDATE_RESULTS.json
          test -s build-logs/fa442-pipeline-repair/selected-confirm/CONFIRMATION.json
          test -s build-logs/fa442-pipeline-repair/final/CHECKED_IN_IDENTITY.json
          test -s build-logs/fa442-pipeline-repair/final/FA_FINAL.json
          test -s build-logs/fa442-pipeline-repair/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
