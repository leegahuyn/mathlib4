name: Locate active FA444 complete matrix runs

on:
  push:
    branches:
      - ci/fa444-complete-run-locator-20260810

permissions:
  actions: read
  contents: write

concurrency:
  group: fa444-complete-run-locator
  cancel-in-progress: true

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout locator branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa444-complete-run-locator-20260810
          fetch-depth: 50
          persist-credentials: true

      - name: Query target branch workflow runs and persist locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa444-complete-locator
          rm -rf "$d"
          mkdir -p "$d"
          gh api --paginate \
            "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=fix%2Ffa444-complete-direct-matrix-20260810&per_page=100" \
            > "$d/RUNS_RAW.json"
          python3 - <<'PY'
          from pathlib import Path
          import json
          raw=Path('build-logs/fa444-complete-locator/RUNS_RAW.json').read_text(encoding='utf-8')
          decoder=json.JSONDecoder(); pages=[]; i=0
          while i < len(raw):
              while i < len(raw) and raw[i].isspace(): i += 1
              if i >= len(raw): break
              value,i=decoder.raw_decode(raw,i); pages.append(value)
          runs=[]
          for page in pages:
              if isinstance(page,dict): runs.extend(page.get('workflow_runs',[]))
          keep=[]
          for r in runs:
              if r.get('head_branch')!='fix/fa444-complete-direct-matrix-20260810': continue
              keep.append({k:r.get(k) for k in (
                  'id','name','path','run_number','run_attempt','event','status','conclusion',
                  'head_branch','head_sha','html_url','created_at','updated_at')})
          target=[r for r in keep if r.get('name')=='FA444 complete direct Lean candidate matrix']
          result={'found':bool(target),'target_runs':target,'recent_branch_runs':keep[:40]}
          Path('build-logs/fa444-complete-locator/RUN_LOCATOR.json').write_text(
              json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'ci: record active FA444 complete matrix runs [skip ci]'
          git push origin HEAD:ci/fa444-complete-run-locator-20260810
