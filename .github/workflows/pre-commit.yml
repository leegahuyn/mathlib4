name: FA451 trace derivative direct Lean matrix

on:
  push:
    branches:
      - fix/fa451-trace-deriv-compact-matrix-20260810
  pull_request:
    branches:
      - fix/fa451-trace-deriv-compact-matrix-20260810
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa451-trace-deriv-direct-matrix
  cancel-in-progress: true

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 7
      matrix:
        variant:
          - known_before_trace
          - trace_lpz
          - trace_lpz_rw
          - trace_deriv_change
          - trace_deriv_simpa
          - trace_deriv_change_norm
          - trace_deriv_simpa_norm
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '100'
    steps:
      - name: Checkout current FA451 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa451-trace-deriv-compact-matrix-20260810
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate candidate and execute all direct Lean commands
        shell: bash
        run: bash scripts/fa451_candidate_ci.sh

      - name: Upload candidate and complete direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa451-candidate-${{ matrix.variant }}
          path: build-logs/fa451-trace-deriv/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce direct Lean execution and prerequisite passes
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa451-trace-deriv/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json,sys
          try: m=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as exc: raise SystemExit(f'INFRA_FAILURE: {exc}')
          ok=(m.get('classification')!='INFRA_FAILURE'
              and m.get('all_required_lean_executed') is True
              and m.get('source_metadata_identity') is True
              and m.get('Mock2_exit')==0
              and m.get('Mock2_Advanced_exit')==0
              and m.get('forbidden_clean') is True)
          print(json.dumps(m,indent=2,ensure_ascii=False))
          if not ok: raise SystemExit('INFRA_FAILURE or prerequisite regression')
          PY
