name: FA450 portable pinned Lean environment

on:
  push:
    branches:
      - fix/fa450-portable-lean-env-20260810
  pull_request:
    branches:
      - fix/fa450-portable-lean-env-20260810
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa450-portable-pinned-lean-environment
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact FA450 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa450-portable-lean-env-20260810
          fetch-depth: 1

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Directly compile clean prerequisites before packaging
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          lake env lean -DwarningAsError=false \
            -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean \
            -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean \
            PrimalitySheafVerification/Mock2.lean
          lake env lean -DwarningAsError=false \
            -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean \
            -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean \
            PrimalitySheafVerification/Mock2_Advanced.lean

      - name: Package relocatable toolchain, repository cache, and project sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          toolchain_root=$(dirname "$(dirname "$(elan which lean)")")
          toolchain_name=$(basename "$toolchain_root")
          mkdir -p build-logs/fa450-portable-env
          du -sh "$toolchain_root" .lake PrimalitySheafVerification \
            | tee build-logs/fa450-portable-env/SIZES.txt
          printf 'toolchain_name=%s\nlean=%s\nlake=%s\nhead=%s\n' \
            "$toolchain_name" "$(lean --version | head -1)" \
            "$(lake --version | head -1)" "$(git rev-parse HEAD)" \
            > build-logs/fa450-portable-env/MANIFEST.txt
          tar --zstd -cf /tmp/fa450-toolchain.tar.zst \
            -C "${HOME}/.elan/toolchains" "$toolchain_name"
          tar --zstd -cf /tmp/fa450-repository-env.tar.zst \
            --exclude='.git' --exclude='.lake/packages/*/.git' \
            .lake PrimalitySheafVerification lakefile.lean lake-manifest.json \
            lean-toolchain scripts
          sha256sum /tmp/fa450-toolchain.tar.zst \
            /tmp/fa450-repository-env.tar.zst \
            | tee build-logs/fa450-portable-env/SHA256SUMS.txt
          ls -lh /tmp/fa450-*.tar.zst \
            | tee build-logs/fa450-portable-env/ARCHIVE_SIZES.txt

      - name: Upload portable pinned Lean environment
        id: upload
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-lean-env-${{ github.run_id }}-${{ github.sha }}
          path: |
            /tmp/fa450-toolchain.tar.zst
            /tmp/fa450-repository-env.tar.zst
            build-logs/fa450-portable-env
          compression-level: 0
          if-no-files-found: error
          retention-days: 7
