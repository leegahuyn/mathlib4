name: Cancel invalid FA452 regression-selector run

on:
  push:
    branches:
      - ci/fa452-run-locator-20260810

permissions:
  actions: write
  contents: write

concurrency:
  group: fa452-invalid-run-canceller
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
      TARGET_RUN: '31362532810'
    steps:
      - name: Checkout helper branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa452-run-locator-20260810
          persist-credentials: true

      - name: Force-cancel invalid selector run only
        shell: bash
        run: |
          set +e
          mkdir -p build-logs/fa452-run-cancel
          before=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}" --jq '.status + ":" + (.conclusion // "")' 2>&1)
          printf 'target_run=%s\nbefore=%s\n' "$TARGET_RUN" "$before" > build-logs/fa452-run-cancel/CANCEL_RESULT.txt
          gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}/force-cancel" >> build-logs/fa452-run-cancel/CANCEL_RESULT.txt 2>&1
          printf 'force_cancel_exit=%s\n' "$?" >> build-logs/fa452-run-cancel/CANCEL_RESULT.txt
          sleep 3
          after=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN}" --jq '.status + ":" + (.conclusion // "")' 2>&1)
          printf 'after=%s\n' "$after" >> build-logs/fa452-run-cancel/CANCEL_RESULT.txt
          cat build-logs/fa452-run-cancel/CANCEL_RESULT.txt
          exit 0

      - name: Persist cancellation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-logs/fa452-run-cancel/CANCEL_RESULT.txt
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record cancellation of invalid FA452 selector run [skip ci]'
            git push origin HEAD:ci/fa452-run-locator-20260810
          fi
