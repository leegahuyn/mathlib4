name: Run pre-commit and in-place update PR on push

on:
  push:
    branches-ignore:
      - 'staging.tmp*'
      - 'trying.tmp*'
      - 'staging*.tmp'
      - 'nolints'
      - 'staging'
      - 'trying'
      - 'ci-dev/**'
      - 'master'
  pull_request:

permissions:
  actions: read
  contents: read

jobs:
  main:
    if: >-
      github.head_ref != 'fix/primality-sheaf-clean-build' &&
      github.ref_name != 'fix/primality-sheaf-clean-build' &&
      github.head_ref != 'candidate/fa426-instance-transport-matrix-20260810' &&
      github.ref_name != 'candidate/fa426-instance-transport-matrix-20260810'
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
      with:
        python-version: 3.x
    - uses: pre-commit/action@2c7b3805fd2a0fd8c1884dcaebf91fc102a13ecd
    - uses: pre-commit-ci/lite-action@5d6cc0eb514c891a40562a58a8e71576c5c7fb43
      if: always()

  fa426-direct:
    if: github.ref_name == 'candidate/fa426-instance-transport-matrix-20260810'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant:
          - reducible_simpa
          - reducible_convert
          - group_eq_reducible
          - group_eq_symm_reducible
          - unfold_instances
          - canonical_only_reducible_simpa
    steps:
      - name: Checkout immutable 31726 baseline and matrix scripts
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/fa426-instance-transport-matrix-20260810
          fetch-depth: 0
          persist-credentials: false

      - name: Apply candidate and compile Mock2 Mock2_Advanced FA directly
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: bash scripts/fa426_matrix_ci.sh "$VARIANT"

      - name: Upload candidate source and complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa426-${{ matrix.variant }}-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa426-instance-matrix/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce strict direct-CLI improvement
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          test -f "build-logs/fa426-instance-matrix/${VARIANT}/FINAL_EXIT"
          exit "$(cat "build-logs/fa426-instance-matrix/${VARIANT}/FINAL_EXIT")"
