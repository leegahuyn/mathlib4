name: Locate active FA445 complete matrix run

on:
  push:
    branches:
      - ci/fa445-run-locator-20260810-v2
    paths:
      - build-logs/fa445-run-locator/REQUESTED*.txt

permissions:
  actions: read
  contents: write

jobs:
  locate:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout locator trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 50
          persist-credentials: true
      - name: Query exact FA445 branch runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa445-run-locator
          rm -rf "$d"; mkdir -p "$d"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=fix%2Ffa445-complete-direct-matrix-recognized-20260810&per_page=100" > "$d/RAW.json"
          python3 - <<'PY'
          from pathlib import Path
          import json
          raw=Path('build-logs/fa445-run-locator/RAW.json').read_text()
          dec=json.JSONDecoder(); pages=[]; i=0
          while i < len(raw):
              while i < len(raw) and raw[i].isspace(): i+=1
              if i>=len(raw): break
              v,i=dec.raw_decode(raw,i); pages.append(v)
          runs=[]
          for p in pages:
              if isinstance(p,dict): runs.extend(p.get('workflow_runs',[]))
          keep=[]
          for r in runs:
              if r.get('head_branch')!='fix/fa445-complete-direct-matrix-recognized-20260810': continue
              keep.append({k:r.get(k) for k in ('id','name','path','status','conclusion','head_sha','html_url','created_at','updated_at')})
          target=[r for r in keep if r.get('name')=='FA445 complete direct Lean matrix on recognized workflow path']
          result={'target_runs':target,'recent_branch_runs':keep[:50]}
          Path('build-logs/fa445-run-locator/RUN_LOCATOR.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$d"
          git commit -m 'ci: record FA445 active run locator [skip ci]'
          git push origin HEAD:ci/fa445-run-locator-20260810-v2
