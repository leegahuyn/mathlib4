name: Force-cancel superseded FA444 workflow runs

on:
  push:
    branches:
      - ci/fa444-recognized-run-probe-20260810

permissions:
  actions: write
  contents: write

concurrency:
  group: fa444-superseded-run-force-canceller
  cancel-in-progress: true

jobs:
  cancel:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa444-recognized-run-probe-20260810
          persist-credentials: true
      - name: Force-cancel only superseded FA444 runs
        shell: bash
        run: |
          set +e
          mkdir -p build-logs/fa444-force-cancel
          : > build-logs/fa444-force-cancel/FORCE_CANCEL_RESULTS.txt
          for run_id in 31349476861 31349476866; do
            status=$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" \
              --jq '.status + ":" + (.conclusion // "")' 2>&1)
            printf 'before run=%s status=%s\n' "$run_id" "$status" \
              | tee -a build-logs/fa444-force-cancel/FORCE_CANCEL_RESULTS.txt
            gh api -X POST "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/force-cancel" \
              >> build-logs/fa444-force-cancel/FORCE_CANCEL_RESULTS.txt 2>&1
            printf 'force_cancel_exit=%s\n' "$?" \
              | tee -a build-logs/fa444-force-cancel/FORCE_CANCEL_RESULTS.txt
          done
          exit 0
      - name: Persist force-cancellation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f build-logs/fa444-force-cancel/FORCE_CANCEL_RESULTS.txt
          git commit -m 'ci: record superseded FA444 force-cancellation [skip ci]'
          git push origin HEAD:ci/fa444-recognized-run-probe-20260810
