name: FA450 split portable pinned Lean environment

on:
  push:
    branches:
      - fix/fa450-portable-lean-env-20260810
  pull_request:
    branches:
      - fix/fa450-portable-lean-env-20260810
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa450-split-portable-pinned-lean-environment
  cancel-in-progress: false

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact FA450 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa450-portable-lean-env-20260810
          fetch-depth: 1

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo "${HOME}/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Directly compile clean prerequisites
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          lake env lean -DwarningAsError=false \
            -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean \
            -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean \
            PrimalitySheafVerification/Mock2.lean
          lake env lean -DwarningAsError=false \
            -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean \
            -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean \
            PrimalitySheafVerification/Mock2_Advanced.lean

      - name: Package and split below connector download limit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          toolchain_root=$(dirname "$(dirname "$(elan which lean)")")
          toolchain_name=$(basename "$toolchain_root")
          mkdir -p /tmp/fa450-bundle /tmp/fa450-parts build-logs/fa450-portable-env
          tar --zstd -cf /tmp/fa450-bundle/toolchain.tar.zst \
            -C "${HOME}/.elan/toolchains" "$toolchain_name"
          tar --zstd -cf /tmp/fa450-bundle/repository-env.tar.zst \
            --exclude='.git' --exclude='.lake/packages/*/.git' \
            .lake PrimalitySheafVerification lakefile.lean lake-manifest.json \
            lean-toolchain scripts
          tar -cf /tmp/fa450-portable-combined.tar -C /tmp/fa450-bundle .
          split --numeric-suffixes=1 --suffix-length=2 -b 450M \
            /tmp/fa450-portable-combined.tar /tmp/fa450-parts/part-
          sha256sum /tmp/fa450-parts/part-* \
            | tee build-logs/fa450-portable-env/PART_SHA256SUMS.txt
          ls -lh /tmp/fa450-parts/part-* \
            | tee build-logs/fa450-portable-env/PART_SIZES.txt
          printf 'toolchain=%s\nhead=%s\nparts=%s\n' \
            "$toolchain_name" "$(git rev-parse HEAD)" \
            "$(find /tmp/fa450-parts -type f | wc -l)" \
            > build-logs/fa450-portable-env/MANIFEST.txt

      - name: Upload metadata
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-metadata-${{ github.run_id }}
          path: build-logs/fa450-portable-env
          compression-level: 0
          retention-days: 7

      - name: Upload part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-01-${{ github.run_id }}
          path: /tmp/fa450-parts/part-01
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-02-${{ github.run_id }}
          path: /tmp/fa450-parts/part-02
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-03-${{ github.run_id }}
          path: /tmp/fa450-parts/part-03
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-04-${{ github.run_id }}
          path: /tmp/fa450-parts/part-04
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-05-${{ github.run_id }}
          path: /tmp/fa450-parts/part-05
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-06-${{ github.run_id }}
          path: /tmp/fa450-parts/part-06
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
      - name: Upload part 07
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa450-portable-part-07-${{ github.run_id }}
          path: /tmp/fa450-parts/part-07
          compression-level: 0
          if-no-files-found: ignore
          retention-days: 7
