name: PASS 388 diverse-model self-chaining FA Integrated Mock3 QYM repair

on:
  push:
    branches: [fix/fa388-diverse-model-chain-20260809]
    paths:
      - '.github/workflows/pass388-diverse-self-chain.yml'
      - 'scripts/run_declaration_repair_v388.py'
      - 'scripts/promote_current_priority_v388.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'build-logs/PASS388_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write
  issues: write

concurrency:
  group: pass388-diverse-self-chain
  cancel-in-progress: false

jobs:
  repair-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CHAIN_BRANCH: fix/fa388-diverse-model-chain-20260809
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      DIVERSE_MODELS: openai/gpt-5,openai/gpt-4.1,anthropic/claude-sonnet-4.5,xai/grok-code-fast-1,mistral-ai/codestral-2501,deepseek/DeepSeek-V3-0324,openai/gpt-4o
    steps:
      - name: Checkout exact diverse-chain head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2500
          persist-credentials: true

      - name: Stop after a previously verified final promotion
        id: done
        shell: bash
        run: |
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]] && \
             [[ -s build-logs/PASS388_PROMOTION.json ]] && \
             grep -q '"pass": true' build-logs/PASS388_PROMOTION.json; then
            echo 'value=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'value=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install pinned Lean, cache, and official Models CLI
        if: steps.done.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/pass388-lean-version.txt
          lake --version | tee /tmp/pass388-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/pass388-cache.log
          gh extension install github/gh-models --force || true
          gh models --help > /tmp/pass388-gh-models-help.txt 2>&1 || true

      - name: Materialize exact PASS 376 only when FA is still a stub
        if: steps.done.outputs.value != 'true'
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          if [[ $(wc -c < "${fa}") -gt 500000 ]]; then exit 0; fi
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/diagnose_pass341_fa.sh')
          text=path.read_text(encoding='utf-8')
          begin='''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end='''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(begin)!=1 or text.count(end)!=1:
              raise SystemExit('PASS341 direct compile markers unavailable')
          text=text.replace(begin,'''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text=text.replace(end,'''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text,encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          cp /tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Determine persistent diverse-chain cycle
        if: steps.done.outputs.value != 'true'
        id: cycle
        shell: bash
        run: |
          cycle=$(python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('build-logs/PASS388_CHAIN_STATE.json')
          if not p.exists(): print(1)
          else:
              try: print(int(json.loads(p.read_text()).get('cycle',0))+1)
              except Exception: print(1)
          PY
          )
          echo "value=${cycle}" >> "${GITHUB_OUTPUT}"
          echo "cycle=${cycle}"

      - name: Select the first target that has not passed twice
        if: steps.done.outputs.value != 'true'
        id: before
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass378
          python3 scripts/priority_chain_v378.py --mode select \
            > /tmp/pass388-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass388-before.log
          test -s /tmp/pass378/selection.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/pass378/selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as o:
              o.write(f"all_pass={'true' if d.get('all_pass') else 'false'}\n")
              o.write(f"target={d.get('selected_target') or ''}\n")
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Compile all prerequisites for the active target
        if: steps.done.outputs.value != 'true' && steps.before.outputs.all_pass != 'true' && steps.before.outputs.target != ''
        shell: bash
        env:
          TARGET: ${{ steps.before.outputs.target }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/priority_chain_v378.py --mode prepare --target "${TARGET}"

      - name: Run diverse-model declaration repair
        if: steps.done.outputs.value != 'true' && steps.before.outputs.all_pass != 'true' && steps.before.outputs.target != ''
        id: declaration
        shell: bash
        env:
          TARGET: ${{ steps.before.outputs.target }}
          CHAIN_CYCLE: ${{ steps.cycle.outputs.value }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass384-declaration-agent
          python3 scripts/run_declaration_repair_v388.py \
            --target "${TARGET}" --iterations 18 --deadline-seconds 13200 \
            > /tmp/pass388-declaration.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass388-declaration.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run diverse full-source fallback when no declaration candidate improves
        if: steps.done.outputs.value != 'true' && steps.before.outputs.all_pass != 'true' && steps.before.outputs.target != '' && steps.declaration.outputs.exit_code == '3'
        id: fallback
        shell: bash
        env:
          TARGET: ${{ steps.before.outputs.target }}
          MODEL_CANDIDATES: ${{ env.DIVERSE_MODELS }}
          REPAIR_STYLE: >-
            Persistent diverse-chain cycle ${{ steps.cycle.outputs.value }}. The declaration-level
            candidates did not improve. Fix the shared root of the first independent error cluster,
            preserve every existing public declaration header, and change no unrelated code.
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/lean-repair-v377
          python3 scripts/run_lean_repair_v380_styled.py \
            --target "${TARGET}" --iterations 5 --attempts-per-iteration 3 \
            > /tmp/pass388-fallback.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass388-fallback.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Re-select the first failing target after repair
        if: steps.done.outputs.value != 'true'
        id: after
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass378
          python3 scripts/priority_chain_v378.py --mode select \
            > /tmp/pass388-after.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass388-after.log
          test -s /tmp/pass378/selection.json
          cp /tmp/pass378/selection.json /tmp/pass388-after.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          d=json.loads(Path('/tmp/pass388-after.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as o:
              o.write(f"all_pass={'true' if d.get('all_pass') else 'false'}\n")
              o.write(f"target={d.get('selected_target') or ''}\n")
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Independently reverify and promote a complete chain to PR9
        if: steps.done.outputs.value != 'true' && steps.after.outputs.all_pass == 'true'
        id: promote
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/promote_current_priority_v388.py \
            > /tmp/pass388-promotion.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass388-promotion.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Write cycle state and a final marker only after verified promotion
        if: steps.done.outputs.value != 'true' && always()
        shell: bash
        env:
          CYCLE: ${{ steps.cycle.outputs.value }}
          BEFORE_TARGET: ${{ steps.before.outputs.target }}
          AFTER_TARGET: ${{ steps.after.outputs.target }}
          ALL_PASS: ${{ steps.after.outputs.all_pass }}
          DECL_EXIT: ${{ steps.declaration.outputs.exit_code }}
          FALLBACK_EXIT: ${{ steps.fallback.outputs.exit_code }}
          PROMOTE_EXIT: ${{ steps.promote.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          files=[
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
          ]
          files += sorted(p for p in Path('PrimalitySheafVerification').glob('Mock3*.lean')
                          if not any(x in p.name.lower() for x in ('backup','candidate','probe','tmp')))
          files += [Path('PrimalitySheafVerification/QYM.lean')]
          promotion={}
          pp=Path('build-logs/PASS388_PROMOTION.json')
          if pp.exists():
              try: promotion=json.loads(pp.read_text())
              except Exception: promotion={'parse_error':True}
          selection={}
          sp=Path('/tmp/pass388-after.json')
          if sp.exists(): selection=json.loads(sp.read_text())
          state={
              'cycle':int(os.environ.get('CYCLE') or 0),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'workflow_head':os.environ.get('GITHUB_SHA'),
              'before_target':os.environ.get('BEFORE_TARGET',''),
              'after_target':os.environ.get('AFTER_TARGET',''),
              'selection':selection,
              'declaration_exit':os.environ.get('DECL_EXIT',''),
              'fallback_exit':os.environ.get('FALLBACK_EXIT',''),
              'promotion_exit':os.environ.get('PROMOTE_EXIT',''),
              'promotion':promotion,
              'source_hashes':{str(f):hashlib.sha256(f.read_bytes()).hexdigest()
                               for f in files if f.exists()},
          }
          state['all_required_2x_pass']=(
              os.environ.get('ALL_PASS')=='true'
              and os.environ.get('PROMOTE_EXIT')=='0'
              and promotion.get('pass') is True
          )
          Path('build-logs/PASS388_CHAIN_STATE.json').write_text(json.dumps(state,indent=2),encoding='utf-8')
          if state['all_required_2x_pass']:
              final=dict(state); final['status']='SUCCESS_ALL_REQUIRED_TARGETS_2X_PASS'
              Path('build-logs/FA_MOCK3_QYM_2X_PASS.json').write_text(json.dumps(final,indent=2),encoding='utf-8')
          print(json.dumps(state,indent=2))
          PY

      - name: Upload diverse-chain cycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass388-diverse-chain-${{ github.sha }}-cycle-${{ steps.cycle.outputs.value }}
          path: |
            /tmp/pass388-*.log
            /tmp/pass388-*.json
            /tmp/pass384-declaration-agent
            /tmp/lean-repair-v377
            /tmp/pass378
            build-logs/PASS388_*.json
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit accepted source, state, and the next trigger
        if: steps.done.outputs.value != 'true' && always()
        shell: bash
        env:
          CYCLE: ${{ steps.cycle.outputs.value }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]]; then
            rm -f build-logs/PASS388_TRIGGER.txt
          else
            printf 'cycle=%s\nprevious_run=%s\nreason=continue_diverse_priority_chain\n' \
              "${CYCLE}" "${GITHUB_RUN_ID}" > build-logs/PASS388_TRIGGER.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            build-logs/PASS388_CHAIN_STATE.json
          while IFS= read -r f; do git add "${f}"; done < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' \
              ! -iname '*backup*' ! -iname '*candidate*' ! -iname '*probe*' ! -iname '*tmp*' | sort
          )
          [[ -f build-logs/PASS388_PROMOTION.json ]] && git add build-logs/PASS388_PROMOTION.json
          [[ -f build-logs/FA_MOCK3_QYM_2X_PASS.json ]] && git add build-logs/FA_MOCK3_QYM_2X_PASS.json
          [[ -f build-logs/PASS388_TRIGGER.txt ]] && git add build-logs/PASS388_TRIGGER.txt
          if git ls-files --error-unmatch build-logs/PASS388_TRIGGER.txt >/dev/null 2>&1 && \
             [[ ! -f build-logs/PASS388_TRIGGER.txt ]]; then
            git rm build-logs/PASS388_TRIGGER.txt
          fi
          if git diff --cached --quiet; then exit 0; fi
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]]; then
            message='fix: record PASS 388 final priority-chain PASS'
          else
            message="fix: continue PASS 388 diverse cycle ${CYCLE}"
          fi
          git commit -m "${message}"
          git push origin HEAD:"${CHAIN_BRANCH}"

      - name: Enforce final success only from the verified marker
        if: steps.done.outputs.value != 'true' && always()
        shell: bash
        run: |
          test -s build-logs/FA_MOCK3_QYM_2X_PASS.json
          test -s build-logs/PASS388_PROMOTION.json
          grep -q '"pass": true' build-logs/PASS388_PROMOTION.json
