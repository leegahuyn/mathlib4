name: Codex FA489-B typed constants strict direct Lean

on:
  push:
    branches:
      - fix/fa489b-hderiv-typed-constants-20260811
    paths:
      - .github/workflows/codex-fa489b-hderiv-typed-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa489b-hderiv-typed-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish FA489-B start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA489 matrix candidate B started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- upstream_FA488_run: \`31456106488\`\n- upstream_FA488_source: \`efabb4d229666d7a6e292e853aa583833ae6c99d0bb6d65689168015eccb93ca\`\n- frontier: \`35337:4 selectedLogHeightEnergyDensity_continuous / index 2806\`\n- patch: \`explicit continuity with typed (1/2 : ℂ) constant\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Run FA489-B direct Lean
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa489b_hderiv_typed_constants_candidate_ci.sh 2>&1 | tee /tmp/fa489b.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report FA489-B evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa489b.md
          from pathlib import Path
          import json, os
          p=Path('build-logs/codex-fa489b-hderiv-typed-constants/candidates/norms/METRIC.json')
          lines=['## FA489 matrix candidate B — actual remote execution','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`"]
          if p.exists():
              m=json.loads(p.read_text());
              for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                  lines.append(f'- {k}: `{m.get(k)}`')
              lines += ['', '```text', str(m.get('FA_first_error_message',''))[:5000], '```']
          else: lines.append('- METRIC.json: `MISSING`')
          print('\n'.join(lines)[:16000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa489b.md)"
      - name: Preserve result
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
