name: Sustained FA repair then Mock3 QYM 2x

on:
  workflow_dispatch:
  push:
    branches:
      - fix/fa-live-v7-sustained-20260808
    paths:
      - '.github/workflows/fa-live-v7-sustained.yml'
      - 'scripts/github_models_fa_tournament_agent.py'
      - 'scripts/github_models_fa_tournament_agent_v2.py'
      - 'scripts/github_models_fa_full_decl_agent.py'
      - 'scripts/fa_full_signature_fingerprint.py'
      - '.fa-v7-kick-*'

permissions:
  contents: write
  actions: read
  models: read
  issues: write
  pull-requests: write

concurrency:
  group: sustained-fa-v7
  cancel-in-progress: false

jobs:
  repair-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact sustained branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa-live-v7-sustained-20260808
          fetch-depth: 1100
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa-v7-lean-version.txt
          lake --version | tee /tmp/fa-v7-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/fa-v7-cache.log

      - name: Freeze signatures from the PR 9 authority source
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            +refs/heads/ci/fa319-isolated-20260807:refs/remotes/origin/ci/fa319-isolated-20260807
          git show \
            origin/ci/fa319-isolated-20260807:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > /tmp/fa-v7-authority-source.lean
          python3 scripts/fa_full_signature_fingerprint.py \
            /tmp/fa-v7-authority-source.lean \
            --write /tmp/fa-v7-signatures.json \
            > /tmp/fa-v7-signature-create.log
          python3 scripts/fa_full_signature_fingerprint.py \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --compare /tmp/fa-v7-signatures.json

      - name: Run sustained multi-model kernel tournament
        id: tournament
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa-tournament-agent
          python3 scripts/github_models_fa_tournament_agent_v2.py \
            --seed PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --baseline /tmp/fa-v7-signatures.json \
            --rounds 16 \
            --models 4 \
            --max-errors 60 \
            --compile-timeout 1200 \
            --materialize-progress \
            > /tmp/fa-v7-tournament.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat build-logs/fa-tournament-agent/state.json || true
          tail -1000 /tmp/fa-v7-tournament.log || true
          exit 0

      - name: Run full-declaration fallback when tournament cannot advance
        if: steps.tournament.outputs.exit_code == '5'
        id: declaration
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa-full-decl-agent
          python3 scripts/github_models_fa_full_decl_agent.py \
            --seed PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --baseline /tmp/fa-v7-signatures.json \
            --rounds 10 \
            --attempts 4 \
            --max-errors 60 \
            --materialize-progress \
            > /tmp/fa-v7-declaration.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat build-logs/fa-full-decl-agent/state.json || true
          tail -1000 /tmp/fa-v7-declaration.log || true
          exit 0

      - name: Enforce immutable public signatures and proof policy
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa_full_signature_fingerprint.py \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --compare /tmp/fa-v7-signatures.json
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock2_FunctionalAnalysis_Integrated*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('QYM*.lean'))
          forbidden = re.compile(
              r'(?m)^\s*(?:sorry|admit)\b|(?m)^\s*axiom\b|(?m)^\s*unsafe\b|'
              r'\bnative_decide\b|\bLean\.ofReduceBool\b'
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              match = forbidden.search(text)
              if match:
                  raise SystemExit(f'{path}: forbidden token {match.group(0)!r}')
          print('priority proof-policy audit passed for', len(targets), 'files')
          PY

      - name: Compile current FA source twice and record exact frontier
        id: fa
        shell: bash
        env:
          TOURNAMENT_RC: ${{ steps.tournament.outputs.exit_code }}
          DECLARATION_RC: ${{ steps.declaration.outputs.exit_code }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          evidence='/tmp/fa-v7-evidence'
          mkdir -p "${evidence}"
          cp -r build-logs/fa-tournament-agent "${evidence}/" 2>/dev/null || true
          cp -r build-logs/fa-full-decl-agent "${evidence}/" 2>/dev/null || true
          cp /tmp/fa-v7-tournament.log "${evidence}/" 2>/dev/null || true
          cp /tmp/fa-v7-declaration.log "${evidence}/" 2>/dev/null || true

          src='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          set +e
          lake env lean -DmaxErrors=2000 "${src}" > "${evidence}/fa-first.log" 2>&1
          first_rc=$?
          set -e
          second_rc=99
          if [[ ${first_rc} -eq 0 ]]; then
            set +e
            lake env lean -DmaxErrors=2000 "${src}" > "${evidence}/fa-second.log" 2>&1
            second_rc=$?
            set -e
          fi
          first_error="$(grep -m1 -E '\.lean:[0-9]+:[0-9]+:.*error' "${evidence}/fa-first.log" || true)"
          error_count="$(grep -c -E '\.lean:[0-9]+:[0-9]+:.*error' "${evidence}/fa-first.log" || true)"
          echo "first_rc=${first_rc}" >> "${GITHUB_OUTPUT}"
          echo "second_rc=${second_rc}" >> "${GITHUB_OUTPUT}"
          echo "error_count=${error_count}" >> "${GITHUB_OUTPUT}"
          python3 - <<PY
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          src = Path('${src}')
          payload = {
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'branch': 'fix/fa-live-v7-sustained-20260808',
              'head_before_commit': os.popen('git rev-parse HEAD').read().strip(),
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'tournament_exit': int('${TOURNAMENT_RC:-99}'),
              'declaration_exit': int('${DECLARATION_RC:-99}'),
              'fa_first_exit': int('${first_rc}'),
              'fa_second_exit': int('${second_rc}'),
              'fa_error_count': int('${error_count:-0}'),
              'first_error': '''${first_error}''',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
          }
          out = Path('build-logs/FA_V7_STATUS.json')
          out.parent.mkdir(parents=True, exist_ok=True)
          out.write_text(json.dumps(payload, indent=2, ensure_ascii=False), encoding='utf-8')
          PY
          cat build-logs/FA_V7_STATUS.json

      - name: Commit all kernel-verified FA progress from this sustained run
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/FA_V7_STATUS.json
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): persist sustained kernel-verified progress'
            git push origin HEAD:fix/fa-live-v7-sustained-20260808
          fi

      - name: Stop before Mock3 and QYM unless FA passed twice
        if: steps.fa.outputs.first_rc != '0' || steps.fa.outputs.second_rc != '0'
        shell: bash
        run: |
          echo 'Mock2_FunctionalAnalysis has not passed twice; Integrated/Mock3 and QYM remain gated.' >&2
          exit 1

      - name: Verify FA twice with fresh olean and ilean artifacts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v7-final'
          mkdir -p "${root}" "${logs}"
          src='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          out="${root}/Mock2_FunctionalAnalysis"
          for n in 1 2; do
            rm -f "${out}.olean" "${out}.ilean"
            lake env lean -DmaxErrors=2000 \
              -o "${out}.olean" -i "${out}.ilean" "${src}" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.log" 2>&1
            test -s "${out}.olean" && test -s "${out}.ilean"
            ! grep -n 'error:' "${logs}/Mock2_FunctionalAnalysis-${n}.log"
            sha256sum "${src}" "${out}.olean" "${out}.ilean" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.sha256"
          done
          echo FA_2X_DIRECT_SOURCE_PASS > "${logs}/FA_2X_PASS.txt"

      - name: Verify Integrated and every actual Mock3 source twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v7-final'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <({
            find PrimalitySheafVerification -maxdepth 1 -type f \
              -name 'Mock2_FunctionalAnalysis_Integrated*.lean'
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean'
          } | sort -u)
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/Integrated-Mock3-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo INTEGRATED_MOCK3_2X_DIRECT_SOURCE_PASS > "${logs}/INTEGRATED_MOCK3_2X_PASS.txt"

      - name: Verify every QYM source twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/fa-v7-final'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'QYM*.lean' | sort
          )
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/QYM-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo QYM_2X_DIRECT_SOURCE_PASS > "${logs}/QYM_2X_PASS.txt"

      - name: Commit final strict-order three-stage PASS marker
        shell: bash
        run: |
          set -euo pipefail
          test -s /tmp/fa-v7-final/FA_2X_PASS.txt
          test -s /tmp/fa-v7-final/INTEGRATED_MOCK3_2X_PASS.txt
          test -s /tmp/fa-v7-final/QYM_2X_PASS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          marker = {
              'status': 'PASS',
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'strict_order': [
                  'Mock2_FunctionalAnalysis twice',
                  'Integrated and every actual Mock3 twice',
                  'every QYM twice',
              ],
              'fa_source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha_before_marker': os.environ['GITHUB_SHA'],
          }
          path = Path('build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(marker, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/FA_V7_STATUS.json build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          git commit -m 'test: record FA Integrated Mock3 QYM strict two-run PASS'
          git push origin HEAD:fix/fa-live-v7-sustained-20260808

      - name: Comment PR 9 only after final strict marker exists
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 9 --repo leegahuyn/mathlib4 \
            --body-file build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json

      - name: Upload sustained evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-v7-sustained-${{ github.sha }}
          path: |
            /tmp/fa-v7-evidence
            /tmp/fa-v7-final
            /tmp/fa-v7-lean-version.txt
            /tmp/fa-v7-lake-version.txt
            /tmp/fa-v7-cache.log
            /tmp/fa-v7-signature-create.log
            /tmp/fa-v7-tournament.log
            /tmp/fa-v7-declaration.log
            build-logs/FA_V7_STATUS.json
            build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90
