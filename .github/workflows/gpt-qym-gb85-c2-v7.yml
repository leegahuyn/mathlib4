name: GPT QYM GB85 C2 robust v7

on:
  push:
    branches:
      - gpt/qym-gb85-c2-v7-20260819
    paths:
      - .github/workflows/gpt-qym-gb85-c2-v7.yml
      - .github/qym_gb85_c2_v7_analyze.py
      - .github/qym_patch_gb85_c2_mulinv_v6.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb85-c2-v7
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      BRANCH: gpt/qym-gb85-c2-v7-20260819
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-gb85-c2-v7
      BASE: /tmp/qym-gb85-c2-v7-base
      ARTIFACT_ID: "9354072137"
      BASE_SHA256: f4c9b27a297be772cde7183526378ad42ae826053f69cf3ce521670da4f06210
      BASE_BLOB: bd28d0436230a8f0bcb01806dac01787542256b8
      BASE_ERRORS: "85"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Gate exact branch and pinned environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -s .github/qym_gb85_c2_v7_analyze.py
          test -s .github/qym_patch_gb85_c2_mulinv_v6.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$OUT" "$BASE" "$OLEAN"

      - name: Recover immutable verified 85-error source
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$OUT/gb85.zip"
          unzip -q -o "$OUT/gb85.zip" -d "$BASE"
          python3 -B .github/qym_gb85_c2_v7_analyze.py recover \
            "$BASE" "$OUT/QYM.GB85.lean" \
            "$BASE_SHA256" "$BASE_BLOB" "$BASE_ERRORS"
          test "$(sha256sum "$OUT/QYM.GB85.lean" | awk '{print $1}')" = "$BASE_SHA256"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for attempt in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break
            sleep $((attempt * 5))
          done
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          for attempt in 1 2 3 4 5; do
            lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break
            sleep $((attempt * 5))
          done

      - name: Restore dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure completed dependency objects
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              cap=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                cap=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" \
                -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" \
                > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Save completed dependency objects
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Run C2 local and full direct Lean tournament
        shell: bash
        run: |
          set -euo pipefail
          variants=(
            ofreal_apply_mulinv_simpa
            ofreal_apply_mulinv_rw
            ofreal_apply_mulinv_change
          )
          cp "$QYM" "$OUT/QYM.checked-in.lean"

          for variant in "${variants[@]}"; do
            dir="$OUT/$variant"
            mkdir -p "$dir"
            cp "$OUT/QYM.GB85.lean" "$QYM"
            python3 -B .github/qym_patch_gb85_c2_mulinv_v6.py \
              "$variant" "$QYM" | tee "$dir/PATCH_RESULT.json"
            cp "$QYM" "$dir/QYM.candidate.lean"
            test "$(jq -r '.input_sha256' "$dir/PATCH_RESULT.json")" = "$BASE_SHA256"
            test "$(jq -r '.input_blob' "$dir/PATCH_RESULT.json")" = "$BASE_BLOB"
            test "$(jq '[.forbidden[]] | add' "$dir/PATCH_RESULT.json")" -eq 0

            set +e
            /usr/bin/time -v -o "$dir/local.time" \
              lake env lean -DmaxErrors=1 -DwarningAsError=false \
                -o "$RUNNER_TEMP/$variant.local.olean" \
                -i "$RUNNER_TEMP/$variant.local.ilean" \
                "$QYM" > "$dir/local.log" 2>&1
            local_rc=$?
            set -e
            echo "$local_rc" > "$dir/local.exit"
            python3 -B .github/qym_gb85_c2_v7_analyze.py local "$dir"

            if [[ "$(jq -r '.c2_fixed' "$dir/LOCAL_RESULT.json")" = true ]]; then
              rm -f "$RUNNER_TEMP/$variant.QYM.olean" "$RUNNER_TEMP/$variant.QYM.ilean"
              set +e
              /usr/bin/time -v -o "$dir/full.time" \
                lake env lean -DmaxErrors=10000 -DwarningAsError=false \
                  -o "$RUNNER_TEMP/$variant.QYM.olean" \
                  -i "$RUNNER_TEMP/$variant.QYM.ilean" \
                  "$QYM" > "$dir/full.log" 2>&1
              full_rc=$?
              set -e
              echo "$full_rc" > "$dir/full.exit"
              if [[ "$full_rc" -eq 0 ]]; then
                test -s "$RUNNER_TEMP/$variant.QYM.olean"
                test -s "$RUNNER_TEMP/$variant.QYM.ilean"
                cp "$RUNNER_TEMP/$variant.QYM.olean" "$dir/QYM.olean"
                cp "$RUNNER_TEMP/$variant.QYM.ilean" "$dir/QYM.ilean"
              fi
            fi

            python3 -B .github/qym_gb85_c2_v7_analyze.py full \
              "$dir" "$BASE_ERRORS"
          done

          cp "$OUT/QYM.checked-in.lean" "$QYM"
          python3 -B .github/qym_gb85_c2_v7_analyze.py select \
            "$OUT" "$BASE_ERRORS" "${variants[@]}"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Promote only a verified strict improvement
        shell: bash
        run: |
          set -euo pipefail
          selected="$(jq -r '.selected // empty' "$OUT/SELECTION.json")"
          if [[ -z "$selected" ]]; then
            echo "No verified strict improvement; preserving GB85."
            exit 0
          fi
          test -s "$OUT/QYM.SELECTED.lean"
          test "$(jq -r '.strict_improvement' "$OUT/SELECTED_RESULT.json")" = true
          test "$(jq -r '.panic_lines' "$OUT/SELECTED_RESULT.json")" -eq 0
          errors="$(jq -r '.error_headers' "$OUT/SELECTED_RESULT.json")"
          test "$errors" -lt "$BASE_ERRORS" || test "$(jq -r '.semantic_pass' "$OUT/SELECTED_RESULT.json")" = true
          cp "$OUT/QYM.SELECTED.lean" "$QYM"
          cp "$OUT/SELECTED_RESULT.json" PrimalitySheafVerification/QYM_GB85_C2_V7_RESULT.json
          cp "$OUT/SELECTION.json" PrimalitySheafVerification/QYM_GB85_C2_V7_SELECTION.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$QYM" \
            PrimalitySheafVerification/QYM_GB85_C2_V7_RESULT.json \
            PrimalitySheafVerification/QYM_GB85_C2_V7_SELECTION.json
          git commit -m "QYM: promote verified C2 improvement ${BASE_ERRORS}->${errors}"
          git push origin "HEAD:$BRANCH"

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb85-c2-v7-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb85-c2-v7
          if-no-files-found: error
          retention-days: 30

      - name: Enforce verified progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/SELECTION.json"
          selected="$(jq -r '.selected // empty' "$OUT/SELECTION.json")"
          if [[ -z "$selected" ]]; then
            echo "C2 tournament produced no full-QYM strict improvement."
            exit 1
          fi
          test "$(jq -r '.selected_result.strict_improvement' "$OUT/SELECTION.json")" = true
          test "$(jq -r '.selected_result.panic_lines' "$OUT/SELECTION.json")" -eq 0
