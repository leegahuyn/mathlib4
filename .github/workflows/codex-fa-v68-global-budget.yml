name: Codex FA v68 global-budget direct fallback

on:
  push:
    branches: [codex/fa-v66-decl4017-pass]
    paths:
      - scripts/fa_v68_apply_global_budget.py
      - .github/workflows/codex-fa-v68-global-budget.yml
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read

concurrency:
  group: codex-fa-v68-${{ github.ref }}
  cancel-in-progress: false

env:
  AUTHORITY_ARTIFACT_ID: '9246997507'
  AUTHORITY_SHA256: 71d8eeca6cce4e520754a3e45b43bf3d61a94f4f1bac6f452d0c8ae2c1ee853b
  LEAN_VERSION_EXACT: Lean (version 4.33.0-rc1, x86_64-unknown-linux-gnu, commit 62eed1db4d67327ec8120be05f1a1b0847d74561, Release)

jobs:
  guard:
    runs-on: ubuntu-24.04
    outputs:
      needed: ${{ steps.guard.outputs.needed }}
    steps:
      - id: guard
        name: Skip only when v67 already produced a checked-in pass branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if gh api "repos/${GITHUB_REPOSITORY}/branches/codex/fa-v67-heartbeat-pass" >/dev/null 2>&1; then
            echo 'needed=false' >> "$GITHUB_OUTPUT"
          else
            echo 'needed=true' >> "$GITHUB_OUTPUT"
          fi

  direct:
    needs: guard
    if: needs.guard.outputs.needed == 'true'
    name: direct-${{ matrix.name }}
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        include:
          - { name: global-hb2m-r10k, heartbeat: 2000000, rec_depth: 10000, rank: 1 }
          - { name: global-hb10m-r100k, heartbeat: 10000000, rec_depth: 100000, rank: 2 }
          - { name: global-hb0-r100k, heartbeat: 0, rec_depth: 100000, rank: 3 }
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      LANE: ${{ matrix.name }}
      HEARTBEAT: ${{ matrix.heartbeat }}
      REC_DEPTH: ${{ matrix.rec_depth }}
      RANK: ${{ matrix.rank }}
      OUT: build-logs/codex-fa-v68/${{ matrix.name }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout v68 scaffold
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recover exact sealed v65 winner
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" /tmp/fa-v68-authority
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITY_ARTIFACT_ID}/zip" > /tmp/fa-v68-authority.zip
          unzip -q /tmp/fa-v68-authority.zip -d /tmp/fa-v68-authority
          python3 - <<'PY'
          import hashlib, os
          from pathlib import Path
          expected = os.environ['AUTHORITY_SHA256']
          matches = [p for p in Path('/tmp/fa-v68-authority').rglob('*.lean')
                     if hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          if not matches:
              raise SystemExit('sealed v65 authority source not found')
          target = Path(os.environ['OUT'], 'Mock2_FunctionalAnalysis-authority.lean')
          target.write_bytes(sorted(matches, key=lambda p: (len(str(p)), str(p)))[0].read_bytes())
          PY
          test "$(sha256sum "$OUT/Mock2_FunctionalAnalysis-authority.lean" | awk '{print $1}')" = "$AUTHORITY_SHA256"

      - name: Generate one global-budget candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa_v68_apply_global_budget.py \
            --source "$OUT/Mock2_FunctionalAnalysis-authority.lean" \
            --output "$OUT/Mock2_FunctionalAnalysis-candidate.lean" \
            --heartbeat "$HEARTBEAT" \
            --rec-depth "$REC_DEPTH" \
            --evidence "$OUT/GENERATION.json" \
            > "$OUT/GENERATION.stdout.json"
          cp "$OUT/Mock2_FunctionalAnalysis-candidate.lean" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          e = json.loads(Path(os.environ['OUT'], 'GENERATION.json').read_text())
          with open(os.environ['GITHUB_ENV'], 'a') as f:
              f.write('CANDIDATE_SHA256=' + e['candidate_sha256'] + '\n')
              f.write('CANDIDATE_BYTES=' + str(e['candidate_bytes']) + '\n')
              f.write('CANDIDATE_LINES=' + str(e['candidate_lines']) + '\n')
          PY

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          test "$(tr -d '\r\n' < "$OUT/lean-version.txt")" = "$LEAN_VERSION_EXACT"

      - name: Directly compile complete dependency chain
        shell: bash
        run: |
          set -euo pipefail
          export FA_V65_OUT="$OUT"
          export FA_V65_VARIANT="$LANE"
          export FA_V65_EXPECTED_CANDIDATE_SHA256="$CANDIDATE_SHA256"
          export FA_V65_EXPECTED_CANDIDATE_BYTES="$CANDIDATE_BYTES"
          export FA_V65_EXPECTED_CANDIDATE_LINES="$CANDIDATE_LINES"
          set +e
          bash scripts/fa_v65_direct_compile_ci.sh
          wrapper_rc=$?
          set -e
          printf '%s\n' "$wrapper_rc" > "$OUT/wrapper.exit"
          for f in Mock2.exit Mock2_Advanced.exit Mock2_FunctionalAnalysis.exit; do
            test -f "$OUT/$f"
            grep -Eq '^[01]$' "$OUT/$f"
          done

      - name: Collect exact v68 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - <<'PY'
          import hashlib, json, os, re
          from pathlib import Path
          out = Path(os.environ['OUT'])
          source = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          raw = source.read_bytes() if source.exists() else b''
          text = raw.decode('utf-8', errors='replace')
          def ev(name):
              p = out / name
              if not p.exists(): return 99
              x = p.read_text().strip()
              return int(x) if x in {'0','1'} else 98
          log = out / 'Mock2_FunctionalAnalysis.log'
          diagnostics = log.read_text(errors='replace') if log.exists() else ''
          errors = len(re.findall(r'^.*?\.lean:\d+:\d+: error:', diagnostics, flags=re.M))
          forbidden = {
              'sorry': len(re.findall(r'(?<![A-Za-z0-9_])sorry(?![A-Za-z0-9_])', text)),
              'admit': len(re.findall(r'(?<![A-Za-z0-9_])admit(?![A-Za-z0-9_])', text)),
              'axiom_declaration': len(re.findall(r'^\s*axiom\s+', text, flags=re.M)),
              'unsafe_declaration': len(re.findall(r'^\s*unsafe\s+', text, flags=re.M)),
              'native_decide': text.count('native_decide'),
              'Lean.ofReduceBool': text.count('Lean.ofReduceBool'),
          }
          r = {
              'schema': 'fa-v68-direct-lane-result-v1',
              'lane': os.environ['LANE'], 'rank': int(os.environ['RANK']),
              'heartbeat': int(os.environ['HEARTBEAT']), 'rec_depth': int(os.environ['REC_DEPTH']),
              'candidate_sha256': hashlib.sha256(raw).hexdigest(),
              'candidate_bytes': len(raw), 'candidate_lines': len(text.splitlines()),
              'Mock2_exit': ev('Mock2.exit'), 'Mock2_Advanced_exit': ev('Mock2_Advanced.exit'),
              'FA_exit': ev('Mock2_FunctionalAnalysis.exit'), 'error_headers': errors,
              'forbidden': forbidden, 'audit_clean': all(v == 0 for v in forbidden.values()),
          }
          r['true_pass'] = r['Mock2_exit'] == r['Mock2_Advanced_exit'] == r['FA_exit'] == 0 and errors == 0 and r['audit_clean']
          (out / 'RESULT.json').write_text(json.dumps(r, indent=2, sort_keys=True) + '\n')
          print(json.dumps(r, sort_keys=True))
          PY

      - name: Upload v68 lane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v68-${{ matrix.name }}-${{ github.sha }}
          path: build-logs/codex-fa-v68/${{ matrix.name }}/*
          if-no-files-found: error
          retention-days: 30

      - name: Preserve actual v68 direct gate
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          r = json.loads(Path(os.environ['OUT'], 'RESULT.json').read_text())
          raise SystemExit(0 if r['true_pass'] else 1)
          PY

  select:
    name: check-in-first-v68-true-pass
    needs: [guard, direct]
    if: always() && needs.guard.outputs.needed == 'true'
    runs-on: ubuntu-24.04
    outputs:
      commit_sha: ${{ steps.commit.outputs.commit_sha }}
      candidate_sha256: ${{ steps.commit.outputs.candidate_sha256 }}
      candidate_bytes: ${{ steps.commit.outputs.candidate_bytes }}
      candidate_lines: ${{ steps.commit.outputs.candidate_lines }}
      selected_lane: ${{ steps.commit.outputs.selected_lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: codex-fa-v68-*-${{ github.sha }}
          path: /tmp/fa-v68-results
          merge-multiple: false
      - id: commit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, shutil
          from pathlib import Path
          rows = []
          observed = []
          for root in sorted(Path('/tmp/fa-v68-results').glob('*')):
              rp = list(root.rglob('RESULT.json'))
              if len(rp) != 1: continue
              r = json.loads(rp[0].read_text()); observed.append(r)
              if r.get('true_pass'):
                  cp = list(root.rglob('Mock2_FunctionalAnalysis-candidate.lean'))
                  if len(cp) != 1: raise SystemExit('passing lane candidate inventory mismatch')
                  if hashlib.sha256(cp[0].read_bytes()).hexdigest() != r['candidate_sha256']:
                      raise SystemExit('passing candidate SHA mismatch')
                  rows.append((int(r['rank']), r, cp[0]))
          Path('build-logs').mkdir(exist_ok=True)
          Path('build-logs/fa-v68-selection-observed.json').write_text(json.dumps(observed, indent=2, sort_keys=True) + '\n')
          if not rows: raise SystemExit('no v68 direct true pass')
          _, selected, candidate = sorted(rows, key=lambda x: x[0])[0]
          shutil.copyfile(candidate, 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          Path('build-logs/fa-v68-selected.json').write_text(json.dumps(selected, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as f:
              f.write('candidate_sha256=' + selected['candidate_sha256'] + '\n')
              f.write('candidate_bytes=' + str(selected['candidate_bytes']) + '\n')
              f.write('candidate_lines=' + str(selected['candidate_lines']) + '\n')
              f.write('selected_lane=' + selected['lane'] + '\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout -B codex/fa-v68-global-budget-pass
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean build-logs/fa-v68-*.json
          git commit -m 'Codex: check in v68 zero-error FA candidate'
          git push --force origin HEAD:refs/heads/codex/fa-v68-global-budget-pass
          echo "commit_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

  verify-checked-in:
    name: direct-verify-checked-in-v68-source
    needs: select
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      OUT: build-logs/codex-fa-v68-checked-in
      EXPECTED_SHA256: ${{ needs.select.outputs.candidate_sha256 }}
      EXPECTED_BYTES: ${{ needs.select.outputs.candidate_bytes }}
      EXPECTED_LINES: ${{ needs.select.outputs.candidate_lines }}
      SELECTED_LANE: ${{ needs.select.outputs.selected_lane }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.select.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Re-prove checked-in source identity
        shell: bash
        run: |
          set -euo pipefail
          s=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum "$s" | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -c < "$s" | tr -d '[:space:]')" = "$EXPECTED_BYTES"
      - name: Install exact Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          test "$(tr -d '\r\n' < "$OUT/lean-version.txt")" = "$LEAN_VERSION_EXACT"
      - name: Direct compile checked-in dependency chain
        shell: bash
        run: |
          set -euo pipefail
          export FA_V65_OUT="$OUT"
          export FA_V65_VARIANT="checked-in-${SELECTED_LANE}"
          export FA_V65_EXPECTED_CANDIDATE_SHA256="$EXPECTED_SHA256"
          export FA_V65_EXPECTED_CANDIDATE_BYTES="$EXPECTED_BYTES"
          export FA_V65_EXPECTED_CANDIDATE_LINES="$EXPECTED_LINES"
          bash scripts/fa_v65_direct_compile_ci.sh
          test "$(cat "$OUT/Mock2.exit")" = 0
          test "$(cat "$OUT/Mock2_Advanced.exit")" = 0
          test "$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" = 0
          ! grep -Eq '^.*?\.lean:[0-9]+:[0-9]+: error:' "$OUT/Mock2_FunctionalAnalysis.log"
      - name: Upload checked-in v68 direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v68-checked-in-${{ needs.select.outputs.selected_lane }}-${{ needs.select.outputs.commit_sha }}
          path: build-logs/codex-fa-v68-checked-in/*
          if-no-files-found: error
          retention-days: 30
