name: Focused self-normalizing candidate materialization v4

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-candidate-v4-20260807.yml'
      - '.ci/focused/focused_candidate_v4_retry.txt'
      - 'scripts/prepare_focused_v4_runtime_20260807.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-self-normalizing-candidate-v4
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      FOCUSED_LOGDIR: /tmp/focused-proof/candidate-v4
      FOCUSED_MARKER_OUT: /tmp/focused_candidate_v4.json
      FOCUSED_BUNDLE_OUT: /tmp/focused-candidate-v4-proof.tar.gz
      CANDIDATE_MARKER: .ci/focused/focused_candidate_v4.json

    steps:
      - name: Clone exact triggering snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1 | tee /tmp/v4-initial-status.txt
          test ! -s /tmp/v4-initial-status.txt

      - name: Normalize and syntax-check the focused runtime locally
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_focused_v4_runtime_20260807.py
          python3 -m py_compile \
            scripts/focused_source_audit_20260807.py \
            scripts/generate_focused_axiom_audit_20260807.py \
            scripts/prepare_focused_v4_runtime_20260807.py
          bash -n scripts/focused_materialize_pipeline_20260807.sh
          bash -n scripts/focused_direct_verify_20260807.sh
          bash -n scripts/focused_axiom_audit_dispatch_20260807.sh
          bash -n scripts/focused_environment_axiom_audit_20260807.sh
          bash -n scripts/run_focused_candidate_v3_20260807.sh
          bash -n scripts/run_focused_direct_v3_20260807.sh
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add \
              scripts/focused_materialize_pipeline_20260807.sh \
              scripts/focused_direct_verify_20260807.sh
            git commit -m 'ci: normalize focused v4 verification runtime'
          fi
          git status --porcelain=v1 | tee /tmp/v4-post-normalize-status.txt
          test ! -s /tmp/v4-post-normalize-status.txt

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Run ordered focused candidate verification
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/run_focused_candidate_v3_20260807.sh

      - name: Upload candidate proof artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: focused-candidate-v4-${{ github.sha }}
          path: /tmp/focused-candidate-v4-proof.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Materialize only verified focused sources and provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CANDIDATE_MARKER}")"
          cp /tmp/focused_candidate_v4.json "${CANDIDATE_MARKER}"
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'PrimalitySheafVerification/Mock2_Advanced.lean',
              'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean',
              'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean',
              '.ci/focused/focused_candidate_v4.json',
          }
          raw = subprocess.check_output(['git','status','--porcelain=v1'], text=True)
          seen = set()
          for line in raw.splitlines():
              path = line[3:].split(' -> ')[-1]
              seen.add(path)
          bad = sorted(seen - allowed)
          if bad:
              raise SystemExit('unexpected verified-source changes: ' + ', '.join(bad))
          PY
          git add \
            PrimalitySheafVerification/Mock2_Advanced.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            "${CANDIDATE_MARKER}"
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: materialize focused verified candidate v4'

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            git fetch origin "${BRANCH}"
            critical="$(git diff --name-only "${GITHUB_SHA}" "${remote_head}" | grep -E \
              '^(PrimalitySheafVerification/(Mock2|Mock2_Advanced|Mock2_FunctionalAnalysis|Mock2_FunctionalAnalysis_Integrated|QYM)\.lean|lean-toolchain|lakefile\.lean|lake-manifest\.json|scripts/(repair_mock2_advanced_v6[1-8]|apply_.*_pass_repairs|focused_materialize_pipeline_20260807|focused_source_audit_20260807|focused_axiom_audit_dispatch_20260807|focused_environment_axiom_audit_20260807|generate_focused_axiom_audit_20260807|prepare_focused_v4_runtime_20260807)\.(py|sh))$' \
              || true)"
            if [[ -n "${critical}" ]]; then
              printf '%s\n' "${critical}" >&2
              echo 'Verified inputs changed concurrently; refusing stale materialization.' >&2
              exit 1
            fi
            git rebase "${remote_head}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Publish compact candidate failure evidence
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          logdir=Path('/tmp/focused-proof/candidate-v4')
          def read(name, limit=16000):
              p=logdir/name
              return p.read_text(errors='replace')[:limit] if p.exists() else None
          report={
            'status':'FAIL','pipeline':'focused-candidate-v4',
            'trigger_sha':os.environ.get('GITHUB_SHA'),
            'workflow_run':f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
            'pipeline_exit_code':read('pipeline-exit-code.txt'),
            'snapshot':read('snapshot.txt'),
            'first_failure':read('first-failure.env'),
            'first_errors':{p.name:p.read_text(errors='replace')[:16000] for p in logdir.glob('*.first-ten-errors.txt')},
            'tails':{p.name:p.read_text(errors='replace')[-16000:] for p in logdir.glob('*.tail.txt')},
          }
          Path('/tmp/focused_candidate_v4_failure.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          rm -rf /tmp/v4-failure-repo
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/v4-failure-repo
          cd /tmp/v4-failure-repo
          marker=.ci/focused/focused_candidate_v4_failure.json
          mkdir -p "$(dirname "${marker}")"
          cp /tmp/focused_candidate_v4_failure.json "${marker}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${marker}"
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record focused candidate v4 failure evidence'
          git push origin "HEAD:${BRANCH}" || true

      - name: Queue bounded candidate retry
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/v4-retry-repo
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/v4-retry-repo
          cd /tmp/v4-retry-repo
          counter=.ci/focused/focused_candidate_v4_retry.txt
          mkdir -p "$(dirname "${counter}")"
          count=0; [[ -f "${counter}" ]] && count="$(cat "${counter}")"
          [[ "${count}" =~ ^[0-9]+$ ]] || count=0
          [[ "${count}" -ge 2 ]] && exit 0
          count=$((count+1)); echo "${count}" > "${counter}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${counter}"
          git commit -m "ci: retry focused candidate v4 (${count}/2)"
          git push origin "HEAD:${BRANCH}" || true
