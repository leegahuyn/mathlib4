name: PASS 376 function tool agent continuation

on:
  push:
    branches: [fix/fa376-autorepair-v2-20260809]
    paths:
      - '.github/workflows/pass376-tool-agent-continuation.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass376-v2-fa-mock3-qym-long-repair
  cancel-in-progress: false

jobs:
  continue-tool-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout latest checkpoint
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa376-autorepair-v2-20260809
          fetch-depth: 4500
          persist-credentials: true

      - name: Detect completed gate
        id: gate
        shell: bash
        run: |
          if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
            echo 'complete=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'complete=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install Lean and cache
        if: steps.gate.outputs.complete != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Continue function-tool cycles
        if: steps.gate.outputs.complete != 'true'
        id: repair
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pass376-tool-cont build-logs
          previous=26
          if test -f build-logs/pass376-v2-cycle.txt; then
            previous="$(cat build-logs/pass376-v2-cycle.txt)"
            case "${previous}" in
              ''|*[!0-9]*) previous=26 ;;
            esac
          fi
          start=$((previous + 1))
          stop=$((start + 2))
          final_rc=2
          cycle="${start}"

          checkpoint() {
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add build-logs/pass376-v2-state.json build-logs/pass376-v2-baseline.json \
                    build-logs/pass376-v2-cycle.txt build-logs/pass376-fa-mock3-qym-2x-pass.txt \
                    PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean 2>/dev/null || true
            test ! -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean || \
              git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            while IFS= read -r -d '' file; do git add "${file}"; done < <(
              find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0
            )
            test ! -f PrimalitySheafVerification/QYM.lean || git add PrimalitySheafVerification/QYM.lean
            if ! git diff --cached --quiet; then
              if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
                git commit -m "fix: verify ordered gate in tool continuation ${cycle}"
              else
                git commit -m "wip: continue function-tool PASS376 cycle ${cycle}"
              fi
              git push origin HEAD:fix/fa376-autorepair-v2-20260809
            fi
          }

          while test "${cycle}" -le "${stop}"; do
            echo "${cycle}" > build-logs/pass376-v2-cycle.txt
            python3 scripts/pass376_multitarget_agent_v3.py --cycle "${cycle}" --budget-seconds 700 \
              > "/tmp/pass376-tool-cont/core-before-${cycle}.log" 2>&1
            before_rc=$?; cat "/tmp/pass376-tool-cont/core-before-${cycle}.log"; checkpoint
            if test "${before_rc}" = '0' && test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
              final_rc=0; break
            fi
            python3 scripts/pass376_tool_agent.py --cycle "${cycle}" --budget-seconds 5000 --max-turns 56 \
              > "/tmp/pass376-tool-cont/tool-${cycle}.log" 2>&1
            tool_rc=$?; cat "/tmp/pass376-tool-cont/tool-${cycle}.log"; checkpoint
            python3 scripts/pass376_multitarget_agent_v3.py --cycle "${cycle}" --budget-seconds 700 \
              > "/tmp/pass376-tool-cont/core-after-${cycle}.log" 2>&1
            after_rc=$?; cat "/tmp/pass376-tool-cont/core-after-${cycle}.log"; checkpoint
            if test "${after_rc}" = '0' && test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
              final_rc=0; break
            fi
            final_rc="${after_rc}"
            cycle=$((cycle + 1))
          done
          set -e
          echo "exit_code=${final_rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload continuation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-function-tool-continuation-${{ github.sha }}
          path: |
            /tmp/pass376-tool-cont
            build-logs/pass376-tool-agent
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-v2-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis*.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce result
        if: always()
        shell: bash
        env:
          ALREADY_COMPLETE: ${{ steps.gate.outputs.complete }}
          FINAL_EXIT_CODE: ${{ steps.repair.outputs.exit_code }}
        run: |
          set -euo pipefail
          if test "${ALREADY_COMPLETE:-false}" = 'true'; then
            test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
            exit 0
          fi
          test -n "${FINAL_EXIT_CODE:-}"
          test "${FINAL_EXIT_CODE}" = '0'
          test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
