name: Codex FA API probe additive instance bridge v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-additive-instance-bridge-v1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe map_sub across reconstructed AddCommGroup
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeInstanceBridge.lean <<'LEAN'
          import Mathlib

          noncomputable section
          def ProbeS : Submodule ℂ (ℂ × ℂ) := ⊤
          noncomputable def probeF : ProbeS →ₗ[ℂ] (ℂ × ℂ) := ProbeS.subtype

          set_option pp.universes true in
          #synth AddCommGroup ProbeS
          set_option pp.universes true in
          #synth Module ℂ ProbeS

          namespace Probe
          noncomputable local instance rebuiltModule : Module ℂ ProbeS := by
            change Module ℂ ↥(ProbeS)
            exact Submodule.module ProbeS
          noncomputable local instance rebuiltGroup : AddCommGroup ProbeS := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (x y : ProbeS) : probeF (x - y) = probeF x - probeF y := by
            change ((x - y : ProbeS) : ℂ × ℂ) = (x : ℂ × ℂ) - (y : ℂ × ℂ)
            rfl

          example (x y : ProbeS) : probeF (x - y) = probeF x - probeF y := by
            apply Subtype.ext
            rfl

          example (x y : ProbeS) : (x - y : ProbeS) = ⟨(x : ℂ × ℂ) - (y : ℂ × ℂ), by simp⟩ := by
            apply Subtype.ext
            rfl
          end Probe
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeInstanceBridge.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-additive-instance-bridge-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
