name: Codex FA probe 3452 Fourier unfold v1
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-probe-3452-fourier-unfold-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Compile isolated Fourier repr proof
        shell: bash
        run: |
          cat >/tmp/Probe3452.lean <<'LEAN'
          import Mathlib.Analysis.Fourier.AddCircleMulti

          noncomputable section
          open MeasureTheory

          abbrev ProbeTwoTorus := UnitAddTorus (Fin 2)
          noncomputable abbrev ProbeTwoTorusL2 :=
            MeasureTheory.Lp ℂ 2 (volume : Measure ProbeTwoTorus)

          noncomputable def probeTwoTorusFourierBasis :
              HilbertBasis (Fin 2 → ℤ) ℂ ProbeTwoTorusL2 :=
            UnitAddTorus.mFourierBasis

          example (f : ProbeTwoTorusL2) (k : Fin 2 → ℤ) :
              ↑(probeTwoTorusFourierBasis.repr f) k • probeTwoTorusFourierBasis k =
                UnitAddTorus.mFourierCoeff f k • UnitAddTorus.mFourierLp 2 k := by
            simp only [probeTwoTorusFourierBasis]
            rw [UnitAddTorus.mFourierBasis_repr]
            simp only [UnitAddTorus.coe_mFourierBasis]
          LEAN
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3; do
            if lake exe cache get; then ok=1; break; fi
            sleep 5
          done
          test "$ok" = 1
          lake env lean /tmp/Probe3452.lean
