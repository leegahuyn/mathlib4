name: PASS 376 v2 FA Integrated Mock3 QYM long repair

on:
  push:
    branches: [fix/fa376-autorepair-v2-20260809]
    paths:
      - '.github/workflows/pass376-v2-fa-mock3-qym-long-repair.yml'
      - 'scripts/pass376_multitarget_agent.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass376-v2-fa-mock3-qym-long-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa376-autorepair-v2-20260809
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean and full mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Install GitHub Models CLI fallback
        shell: bash
        run: |
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Reconstruct PASS 375c when no preserved repair state exists
        shell: bash
        run: |
          set -euo pipefail
          if test -s build-logs/pass376-v2-state.json || \
             test -s build-logs/pass376-autorepair-summary.json; then
            echo 'Continuing from the best checked-in PASS 376 candidate.'
            sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the PASS 341 compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          bash scripts/diagnose_pass358_fa.sh
          source_file='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${source_file}"
          cp "${source_file}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '8fd20f88c43060d392bab969c91a84b7c0bb08657af7728752a77c5f3c57c6c6'
          python3 scripts/apply_pass375c_candidate.py
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            'd2e1b383b9e60fd18607094ce104679cd604e8c90ffc0261d8a877e700b99b8e'

      - name: Run bounded repair cycles and checkpoint every cycle
        id: cycles
        shell: bash
        run: |
          set +e
          mkdir -p /tmp/pass376-v2-console build-logs
          final_rc=2
          for cycle in 1 2 3 4 5 6 7; do
            echo "${cycle}" > build-logs/pass376-v2-cycle.txt
            python3 scripts/pass376_multitarget_agent.py \
              --cycle "${cycle}" --budget-seconds 2300 \
              > "/tmp/pass376-v2-console/cycle-${cycle}.log" 2>&1
            rc=$?
            cat "/tmp/pass376-v2-console/cycle-${cycle}.log"

            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add scripts/pass376_multitarget_agent.py \
                    build-logs/pass376-v2-state.json \
                    build-logs/pass376-v2-baseline.json \
                    build-logs/pass376-v2-cycle.txt \
                    build-logs/pass376-fa-mock3-qym-2x-pass.txt \
                    PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                    2>/dev/null || true
            if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
              git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            fi
            while IFS= read -r -d '' file; do git add "${file}"; done < <(
              find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0
            )
            if test -f PrimalitySheafVerification/QYM.lean; then
              git add PrimalitySheafVerification/QYM.lean
            fi
            if ! git diff --cached --quiet; then
              if test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
                git commit -m "fix: verify FA Integrated Mock3 QYM twice in PASS376 cycle ${cycle}"
              else
                git commit -m "wip: advance PASS376 multi-target repair cycle ${cycle}"
              fi
              git push origin HEAD:fix/fa376-autorepair-v2-20260809
            fi

            if test "${rc}" = '0' && \
               test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
              final_rc=0
              break
            fi
            final_rc="${rc}"
          done
          set -e
          echo "exit_code=${final_rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload all PASS 376 v2 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-v2-fa-mock3-qym-${{ github.sha }}
          path: |
            /tmp/pass376-v2-console
            build-logs/pass376-v2
            build-logs/pass376-v2-state.json
            build-logs/pass376-v2-baseline.json
            build-logs/pass376-v2-cycle.txt
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce ordered two-pass success
        if: always()
        shell: bash
        env:
          FINAL_EXIT_CODE: ${{ steps.cycles.outputs.exit_code }}
        run: |
          set -euo pipefail
          test -n "${FINAL_EXIT_CODE:-}"
          test "${FINAL_EXIT_CODE}" = '0'
          test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build-logs/pass376-v2-state.json').read_text())
          assert state['success'] is True
          assert state['active_target'] is None
          for target in state['targets']:
              assert state['final_validations'][target]['trust'] is True
              assert state['final_validations'][target]['verified_sha_matches'] is True
          PY

  promote-to-pr9:
    needs: repair
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout latest verified repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa376-autorepair-v2-20260809
          fetch-depth: 1200
          persist-credentials: true

      - name: Require the exact ordered success evidence
        shell: bash
        run: |
          set -euo pipefail
          test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
          python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build-logs/pass376-v2-state.json').read_text())
          assert state['success'] is True
          for target in state['targets']:
              item=state['final_validations'][target]
              assert item['trust'] is True
              assert item['verified_sha_matches'] is True
          PY

      - name: Save verified target files
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass376-verified/PrimalitySheafVerification /tmp/pass376-verified/build-logs
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
             /tmp/pass376-verified/PrimalitySheafVerification/
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            cp PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
               /tmp/pass376-verified/PrimalitySheafVerification/
          fi
          cp PrimalitySheafVerification/Mock3*.lean \
             /tmp/pass376-verified/PrimalitySheafVerification/ 2>/dev/null || true
          if test -f PrimalitySheafVerification/QYM.lean; then
            cp PrimalitySheafVerification/QYM.lean \
               /tmp/pass376-verified/PrimalitySheafVerification/
          fi
          cp build-logs/pass376-v2-state.json \
             build-logs/pass376-v2-baseline.json \
             build-logs/pass376-fa-mock3-qym-2x-pass.txt \
             /tmp/pass376-verified/build-logs/

      - name: Switch to current PR9 head and install verified files
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/fa319-isolated-20260807
          git checkout -B ci/fa319-isolated-20260807 origin/ci/fa319-isolated-20260807
          cp /tmp/pass376-verified/PrimalitySheafVerification/* \
             PrimalitySheafVerification/
          mkdir -p build-logs
          cp /tmp/pass376-verified/build-logs/* build-logs/

      - name: Install pinned Lean and cache on PR9 head
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Revalidate all promoted targets twice in required order
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t targets < <(python3 - <<'PY'
          import json
          from pathlib import Path
          state=json.loads(Path('build-logs/pass376-v2-state.json').read_text())
          print('\n'.join(state['targets']))
          PY
          )
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p /tmp/pass376-pr9-recheck
          for target in "${targets[@]}"; do
            stem="$(basename "${target}" .lean)"
            for run in 1 2; do
              rm -f "${out}/${stem}.olean" "${out}/${stem}.ilean" \
                    "${out}/${stem}.olean.hash" "${out}/${stem}.ilean.hash"
              lake env lean -DmaxErrors=2000 "${target}" \
                > "/tmp/pass376-pr9-recheck/${stem}-run${run}.log" 2>&1
              test -s "${out}/${stem}.olean"
              test -s "${out}/${stem}.ilean"
            done
          done

      - name: Commit verified source to PR9 without merging
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                  build-logs/pass376-v2-state.json \
                  build-logs/pass376-v2-baseline.json \
                  build-logs/pass376-fa-mock3-qym-2x-pass.txt
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          fi
          while IFS= read -r -d '' file; do git add "${file}"; done < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0
          )
          if test -f PrimalitySheafVerification/QYM.lean; then
            git add PrimalitySheafVerification/QYM.lean
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'fix: materialize verified FA Integrated Mock3 QYM two-pass source'
            git push origin HEAD:ci/fa319-isolated-20260807
          fi

      - name: Upload PR9 revalidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-v2-pr9-revalidation-${{ github.sha }}
          path: |
            /tmp/pass376-pr9-recheck
            build-logs/pass376-v2-state.json
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
          if-no-files-found: error
          retention-days: 90
