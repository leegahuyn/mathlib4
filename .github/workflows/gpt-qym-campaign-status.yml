name: GPT QYM campaign authoritative status collector

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-campaign-status.yml
      - .github/qym-frontier/**
      - .github/qym-final/**
      - .github/final-evidence/**
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-campaign-status-${{ github.ref }}
  cancel-in-progress: true

jobs:
  collect:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: gpt/fa-qym-clean-final-20260816
      OUT: /tmp/qym-campaign-status

    steps:
      - name: Checkout latest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/fa-qym-clean-final-20260816
          fetch-depth: 0
          persist-credentials: true

      - name: Collect recent runs and direct Lean evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - "$OUT" <<'PY'
          from __future__ import annotations
          from pathlib import Path
          import io, json, os, re, urllib.parse, urllib.request, zipfile

          out=Path(__import__('sys').argv[1])
          repo='leegahuyn/mathlib4'
          branch=os.environ['BRANCH']
          token=os.environ['GH_TOKEN']
          api='https://api.github.com'

          def get_json(url: str):
              req=urllib.request.Request(url,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'qym-campaign-status',
              })
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)

          def get_bytes(url: str):
              req=urllib.request.Request(url,headers={
                  'Authorization':f'Bearer {token}',
                  'Accept':'application/vnd.github+json',
                  'X-GitHub-Api-Version':'2022-11-28',
                  'User-Agent':'qym-campaign-status',
              })
              with urllib.request.urlopen(req,timeout=120) as r:
                  return r.read()

          query=urllib.parse.urlencode({'branch':branch,'per_page':100})
          runs=get_json(f'{api}/repos/{repo}/actions/runs?{query}').get('workflow_runs',[])
          wanted=('Probe39i','Probe40','checked-in TRUE PASS','final 13 roots',
                  'next-blocker analyzer','persist verified next-blocker')
          selected=[r for r in runs if any(x.lower() in (r.get('name') or '').lower() for x in wanted)]
          selected=selected[:40]
          records=[]
          extracted=[]
          for run in selected:
              rec={k:run.get(k) for k in ('id','name','event','status','conclusion','head_branch','head_sha',
                                           'run_number','run_attempt','created_at','updated_at','html_url')}
              try:
                  artifacts=get_json(f"{api}/repos/{repo}/actions/runs/{run['id']}/artifacts").get('artifacts',[])
              except Exception as e:
                  rec['artifact_error']=repr(e); artifacts=[]
              rec['artifacts']=[{k:a.get(k) for k in ('id','name','size_in_bytes','expired','digest','created_at')}
                                for a in artifacts]
              evidence=[]
              for artifact in artifacts:
                  name=artifact.get('name') or ''
                  if not any(tag in name.lower() for tag in
                             ('probe39i','probe40','qym-checked-in','final-13roots','next-blocker')):
                      continue
                  try:
                      raw=get_bytes(artifact['archive_download_url'])
                      z=zipfile.ZipFile(io.BytesIO(raw))
                      for member in z.namelist():
                          base=Path(member).name
                          if base not in {
                              'RESULT.json','PROBE_RESULT.json','QYM_TRUE_PASS.json',
                              'PROMOTION_DECISION.json','NEXT_BLOCKER.json','REPRODUCIBILITY.json',
                              'SUMMARY.json','AUTHORITY_RESULT.json','PATCH_RESULT.json'}:
                              continue
                          try:
                              data=json.loads(z.read(member).decode('utf-8'))
                          except Exception:
                              continue
                          item={'artifact_id':artifact['id'],'artifact_name':name,
                                'member':member,'data':data}
                          evidence.append(item); extracted.append(item)
                  except Exception as e:
                      evidence.append({'artifact_id':artifact.get('id'),'artifact_name':name,
                                       'download_error':repr(e)})
              rec['evidence']=evidence
              records.append(rec)

          def metric_candidates():
              for item in extracted:
                  d=item.get('data') or {}
                  errors=d.get('error_headers')
                  exit_code=d.get('exit')
                  panic=d.get('panic_lines')
                  sha=(d.get('candidate_qym_sha256') or d.get('source_sha256') or
                       d.get('candidate_sha256'))
                  if isinstance(errors,int) and exit_code is not None and panic is not None and sha:
                      yield item,d

          metric=list(metric_candidates())
          best=None
          if metric:
              def key(pair):
                  d=pair[1]
                  semantic=bool(d.get('semantic_pass'))
                  first=d.get('first_error') or {}
                  line=first.get('line') if isinstance(first,dict) else 0
                  return (0 if semantic else 1, d.get('error_headers',10**9),
                          -int(line or 0), d.get('warning_headers',10**9))
              best=min(metric,key=key)

          canonical_sha=None
          qym=Path('PrimalitySheafVerification/QYM.lean')
          if qym.is_file():
              import hashlib
              canonical_sha=hashlib.sha256(qym.read_bytes()).hexdigest()

          status={
              'schema':'qym-campaign-authoritative-status-v1',
              'branch':branch,
              'branch_head':os.popen('git rev-parse HEAD').read().strip(),
              'canonical_qym_sha256':canonical_sha,
              'qym_true_pass':False,
              'verified_global_best':None,
              'runs':records,
          }
          if best:
              item,d=best
              status['verified_global_best']={
                  'artifact_id':item['artifact_id'],'artifact_name':item['artifact_name'],
                  'member':item['member'],'schema':d.get('schema'),
                  'candidate_qym_sha256':d.get('candidate_qym_sha256') or d.get('source_sha256'),
                  'candidate_qym_blob':d.get('candidate_qym_blob') or d.get('source_blob'),
                  'exit':d.get('exit'),'error_headers':d.get('error_headers'),
                  'warning_headers':d.get('warning_headers'),'panic_lines':d.get('panic_lines'),
                  'first_error':d.get('first_error'),'last_error':d.get('last_error'),
                  'semantic_pass':bool(d.get('semantic_pass')),
              }
              status['qym_true_pass']=bool(d.get('semantic_pass')) and \
                  (d.get('candidate_qym_sha256') or d.get('source_sha256'))==canonical_sha

          # A checked-in TRUE PASS record is stronger than a runtime candidate.
          for item in extracted:
              d=item.get('data') or {}
              if d.get('schema')=='qym-checked-in-true-pass-v1' and d.get('semantic_pass') is True:
                  status['qym_true_pass']=(d.get('source_sha256')==canonical_sha)
                  status['checked_in_true_pass']=d

          (out/'LATEST_STATUS.json').write_text(json.dumps(status,indent=2,sort_keys=True)+'\n')
          md=['# QYM Campaign Status','',f"- branch: `{branch}`",
              f"- branch HEAD: `{status['branch_head']}`",
              f"- canonical QYM SHA256: `{canonical_sha}`",
              f"- checked-in QYM TRUE PASS: `{status['qym_true_pass']}`",'']
          gb=status.get('verified_global_best')
          if gb:
              md += ['## Verified global best','',
                     f"- errors: `{gb['error_headers']}`",
                     f"- warnings: `{gb['warning_headers']}`",
                     f"- panic: `{gb['panic_lines']}`",
                     f"- exit: `{gb['exit']}`",
                     f"- SHA256: `{gb['candidate_qym_sha256']}`",
                     f"- first error: `{gb['first_error']}`",'']
          md += ['## Recent campaign runs','']
          for r in records:
              md.append(f"- `{r['id']}` — {r['name']} — `{r['status']}/{r['conclusion']}` — `{r['head_sha']}`")
          (out/'LATEST_STATUS.md').write_text('\n'.join(md)+'\n')
          print(json.dumps(status,indent=2,sort_keys=True))
          PY

      - name: Upload status snapshot
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-campaign-status-${{ github.sha }}
          path: /tmp/qym-campaign-status/**
          if-no-files-found: error
          retention-days: 30

      - name: Persist latest authoritative status
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-campaign
          cp "$OUT/LATEST_STATUS.json" .github/qym-campaign/LATEST_STATUS.json
          cp "$OUT/LATEST_STATUS.md" .github/qym-campaign/LATEST_STATUS.md
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/qym-campaign/LATEST_STATUS.json .github/qym-campaign/LATEST_STATUS.md
          if git diff --cached --quiet; then
            echo 'Status unchanged.'
            exit 0
          fi
          git commit -m "QYM: refresh authoritative campaign status"
          git pull --rebase origin "$BRANCH"
          git push origin "HEAD:$BRANCH"
