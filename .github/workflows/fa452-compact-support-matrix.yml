name: FA452 compact-support direct Lean matrix

on:
  push:
    branches:
      - fix/fa452-compact-support-matrix-20260810
    paths:
      - .github/workflows/fa452-compact-support-matrix.yml
      - scripts/fa452_*.py
      - scripts/fa452_*.sh
      - build-logs/fa452-compact-support/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa452-compact-support-direct-matrix
  cancel-in-progress: false

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - baseline
          - compact_comp_left
          - compact_comp_left_mono
          - compact_comp_left_mono_abs
          - compact_comp_left_mono_defeq
          - compact_comp_left_mono_abs_tendsto
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '160'
    steps:
      - name: Checkout immutable FA452 trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate candidate and execute all required direct Lean commands
        shell: bash
        run: bash scripts/fa452_candidate_ci.sh

      - name: Upload candidate source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa452-candidate-${{ matrix.variant }}
          path: build-logs/fa452-compact-support/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce direct execution, prerequisite passes, identity, and trust
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa452-compact-support/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json
          import sys

          try:
              metric=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f'INFRA_FAILURE: metric missing or invalid: {exc}')
          ok=(
              metric.get('classification')!='INFRA_FAILURE'
              and metric.get('all_required_lean_executed') is True
              and metric.get('source_metadata_identity') is True
              and metric.get('Mock2_executed') is True
              and metric.get('Mock2_exit')==0
              and metric.get('Mock2_errors_under_cap')==0
              and metric.get('Mock2_Advanced_executed') is True
              and metric.get('Mock2_Advanced_exit')==0
              and metric.get('Mock2_Advanced_errors_under_cap')==0
              and metric.get('FA_executed') is True
              and metric.get('forbidden_clean') is True
          )
          print(json.dumps(metric,indent=2,ensure_ascii=False))
          if not ok:
              raise SystemExit('INFRA_FAILURE or prerequisite regression')
          PY
