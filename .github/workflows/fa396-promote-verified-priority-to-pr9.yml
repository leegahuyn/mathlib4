name: Promote verified PASS 396 FA Mock3 QYM sources to PR9

on:
  push:
    branches:
      - fix/fa396-clean-targeted-agent-20260809
    paths:
      - 'build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS'
      - 'build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa396-promote-pr9
  cancel-in-progress: false

jobs:
  independent-pr9-verification-and-promotion:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout verified PASS 396 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa396-clean-targeted-agent-20260809
          fetch-depth: 3800
          persist-credentials: true

      - name: Require isolated success marker
        shell: bash
        run: |
          set -euo pipefail
          test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS
          python3 - <<'PY'
          import json
          from pathlib import Path
          data = json.loads(Path('build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json').read_text())
          assert data.get('complete') is True, data
          assert data.get('stage') == 'complete', data
          for module in data.get('modules', []):
              assert module.get('status') == 'PASS_2X', module
          for counts in data.get('forbidden_token_audit', {}).values():
              assert not any(counts.values()), counts
          PY

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Materialize verified sources on PR9 worktree
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin ci/fa319-isolated-20260807
          rm -rf /tmp/pr9-verified
          git worktree add --detach /tmp/pr9-verified origin/ci/fa319-isolated-20260807
          targets=(
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          )
          for p in PrimalitySheafVerification/Mock3*.lean; do
            test -e "${p}" && targets+=("${p}") || true
          done
          targets+=(PrimalitySheafVerification/QYM.lean)
          for p in "${targets[@]}"; do
            install -D -m 0644 "${p}" "/tmp/pr9-verified/${p}"
          done
          mkdir -p /tmp/pr9-verified/build-logs
          cp build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json \
            /tmp/pr9-verified/build-logs/PASS396_SOURCE_STATUS.json

      - name: Independent trust audit on PR9 worktree
        shell: bash
        working-directory: /tmp/pr9-verified
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          forbidden = {
              'sorry': re.compile(r'\bsorry\b'),
              'admit': re.compile(r'\badmit\b'),
              'global_axiom': re.compile(r'(?m)^\s*(?:public\s+)?axiom\b'),
              'unsafe': re.compile(r'(?m)^\s*unsafe\b'),
              'native_decide': re.compile(r'\bnative_decide\b'),
              'Lean.ofReduceBool': re.compile(r'\bLean\.ofReduceBool\b'),
          }
          def strip(text: str) -> str:
              text = re.sub(r'/-(?:.|\n)*?-/', ' ', text)
              text = re.sub(r'--[^\n]*', ' ', text)
              text = re.sub(r'"(?:\\.|[^"\\])*"', ' ', text)
              return text
          report = {}
          for path in targets:
              assert path.exists(), path
              clean = strip(path.read_text(encoding='utf-8'))
              counts = {name: len(rx.findall(clean)) for name, rx in forbidden.items()}
              assert not any(counts.values()), (path, counts)
              report[str(path)] = counts
          import json
          Path('build-logs/PR9_PRIORITY_TRUST_AUDIT.json').write_text(json.dumps(report, indent=2))
          PY

      - name: Independent PR9 direct-source two-pass compilation
        shell: bash
        working-directory: /tmp/pr9-verified
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake exe cache get
          mapfile -t mock3 < <(find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' | sort)
          targets=(
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            "${mock3[@]}"
            PrimalitySheafVerification/QYM.lean
          )
          mkdir -p build-logs/pr9-priority-2x .lake/build/lib/lean/PrimalitySheafVerification
          : > build-logs/pr9-priority-2x/status.tsv
          for p in "${targets[@]}"; do
            module="${p%.lean}"
            olean=".lake/build/lib/lean/${module}.olean"
            ilean=".lake/build/lib/lean/${module}.ilean"
            mkdir -p "$(dirname "${olean}")"
            for run in 1 2; do
              rm -f "${olean}" "${ilean}"
              log="build-logs/pr9-priority-2x/$(basename "${module}")-run${run}.log"
              set +e
              lake env lean -DmaxErrors=2000 -o "${olean}" -i "${ilean}" "${p}" > "${log}" 2>&1
              rc=$?
              set -e
              errors=$(grep -c 'error:' "${log}" || true)
              printf '%s\t%s\t%s\t%s\n' "${p}" "${run}" "${rc}" "${errors}" | tee -a build-logs/pr9-priority-2x/status.tsv
              test "${rc}" -eq 0
              test "${errors}" -eq 0
              test -s "${olean}"
              test -s "${ilean}"
            done
          done

      - name: Write authoritative PR9 completion marker
        shell: bash
        working-directory: /tmp/pr9-verified
        env:
          WORKFLOW_RUN_ID: ${{ github.run_id }}
          VERIFIED_SOURCE_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path
          targets = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          marker = {
              'status': 'SUCCESS_ALL_REQUIRED_TARGETS_2X_PASS',
              'workflow_run_id': os.environ['WORKFLOW_RUN_ID'],
              'verified_source_branch': 'fix/fa396-clean-targeted-agent-20260809',
              'verified_source_commit': os.environ['VERIFIED_SOURCE_SHA'],
              'target_branch': 'ci/fa319-isolated-20260807',
              'targets': [str(p) for p in targets],
              'source_sha256': {
                  str(p): hashlib.sha256(p.read_bytes()).hexdigest() for p in targets
              },
              'compiler_status': Path('build-logs/pr9-priority-2x/status.tsv').read_text().splitlines(),
              'trust_audit': json.loads(Path('build-logs/PR9_PRIORITY_TRUST_AUDIT.json').read_text()),
              'automatic_merge': False,
              'pr_remains_draft': True,
          }
          out = Path('build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json')
          out.write_text(json.dumps(marker, indent=2) + '\n')
          PY

      - name: Push independently verified sources to PR9 branch
        shell: bash
        working-directory: /tmp/pr9-verified
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          git add PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "${p}" && git add "${p}" || true; done
          git add build-logs/PASS396_SOURCE_STATUS.json
          git add build-logs/PR9_PRIORITY_TRUST_AUDIT.json
          git add build-logs/pr9-priority-2x/status.tsv
          git add build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json
          git commit -m 'fix: promote verified FA Integrated Mock3 QYM 2x PASS'
          remote_head=$(git ls-remote origin refs/heads/ci/fa319-isolated-20260807 | cut -f1)
          base_head=$(git rev-parse HEAD^)
          test "${remote_head}" = "${base_head}"
          git push origin HEAD:ci/fa319-isolated-20260807

      - name: Upload independent PR9 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-priority-final-2x-${{ github.sha }}
          path: |
            /tmp/pr9-verified/build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json
            /tmp/pr9-verified/build-logs/PR9_PRIORITY_TRUST_AUDIT.json
            /tmp/pr9-verified/build-logs/pr9-priority-2x
            /tmp/pr9-verified/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            /tmp/pr9-verified/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            /tmp/pr9-verified/PrimalitySheafVerification/Mock3*.lean
            /tmp/pr9-verified/PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
