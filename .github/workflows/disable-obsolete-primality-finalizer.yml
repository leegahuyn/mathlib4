name: Retire obsolete PrimalitySheaf finalizer

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - '.github/workflows/disable-obsolete-primality-finalizer.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: retire-obsolete-primality-finalizer
  cancel-in-progress: true

jobs:
  retire-and-retrigger:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: fix/primality-sheaf-clean-build
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Remove obsolete finalizer and retrigger latest Advanced verification
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          obsolete='.github/workflows/finalize-primality-sheaf-on-green.yml'
          self='.github/workflows/disable-obsolete-primality-finalizer.yml'
          [[ ! -e "${obsolete}" ]] || git rm "${obsolete}"
          git rm "${self}"
          cat > scripts/apply_three_hundred_nineteenth_pass_mock2_advanced_repairs.py <<'PY'
          """Trigger-only marker after retiring the obsolete finalizer.

          This module is never executed and is removed by the final cleanup.
          """
          PY
          git add scripts/apply_three_hundred_nineteenth_pass_mock2_advanced_repairs.py
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: retire obsolete finalizer and retrigger latest verification'
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${SOURCE_SHA}"
          git push origin "HEAD:${BRANCH}"
