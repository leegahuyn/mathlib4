name: Pass326 official CI consolidation

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass326-official-ci-consolidation
  cancel-in-progress: false

jobs:
  consolidate-and-validate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      EVIDENCE: /tmp/pass326-official-ci

    steps:
      - name: Clone latest branch and base master
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git fetch --depth=1 origin "refs/heads/master:refs/remotes/origin/master"
          git checkout --detach "refs/remotes/origin/${BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          echo "HEAD_SHA=${head_sha}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/audit" "${EVIDENCE}/artifacts"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "head_sha=${head_sha}" \
            "base_sha=$(git rev-parse refs/remotes/origin/master)" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Restore upstream workflows and remove temporary project workflows
        shell: bash
        run: |
          set -euo pipefail
          official='.github/workflows/primality-sheaf-ci.yml'
          while IFS= read -r path; do
            [[ -z "${path}" || "${path}" = "${official}" ]] && continue
            if git cat-file -e "refs/remotes/origin/master:${path}" 2>/dev/null; then
              mkdir -p "$(dirname "${path}")"
              git show "refs/remotes/origin/master:${path}" > "${path}"
              git add "${path}"
            elif [[ -e "${path}" ]]; then
              git rm -f -- "${path}"
            fi
          done < <(git diff --name-only refs/remotes/origin/master HEAD -- .github/workflows)
          rm -f DO_NOT_CREATE_TEST .github/workflows/DO_NOT_CREATE.yml
          git add -A DO_NOT_CREATE_TEST .github/workflows/DO_NOT_CREATE.yml 2>/dev/null || true

      - name: Remove temporary repair infrastructure and restore upstream scripts
        shell: bash
        run: |
          set -euo pipefail
          final_script='scripts/primality_sheaf_ci.sh'
          while IFS= read -r path; do
            [[ -z "${path}" || "${path}" = "${final_script}" ]] && continue
            name="$(basename "${path}")"
            if [[ "${name}" =~ ^apply_.*pass.*\.py$ ]] || \
               [[ "${name}" =~ ^repair_.*\.py$ ]] || \
               [[ "${name}" =~ ^ci_mock2_.*\.sh$ ]] || \
               [[ "${name}" =~ ^materialize_.* ]] || \
               [[ "${name}" =~ ^focused_.* ]] || \
               [[ "${name}" =~ primality.*repair ]]; then
              if git cat-file -e "refs/remotes/origin/master:${path}" 2>/dev/null; then
                mkdir -p "$(dirname "${path}")"
                git show "refs/remotes/origin/master:${path}" > "${path}"
                git add "${path}"
              elif [[ -e "${path}" ]]; then
                git rm -f -- "${path}"
              fi
            fi
          done < <(git diff --name-only refs/remotes/origin/master HEAD -- scripts)

      - name: Write final non-mutating verification script
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p scripts
          cat > scripts/primality_sheaf_ci.sh <<'SCRIPT'
          #!/usr/bin/env bash
          set -euo pipefail

          EVIDENCE_DIR="${EVIDENCE_DIR:-/tmp/primality-sheaf-ci}"
          OUTDIR='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${EVIDENCE_DIR}/logs" "${EVIDENCE_DIR}/audit" \
            "${EVIDENCE_DIR}/artifacts" "${OUTDIR}"

          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY:-local}" \
            "commit=$(git rev-parse HEAD)" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE_DIR}/snapshot.txt"
          lean --version | tee "${EVIDENCE_DIR}/lean-version.txt"
          lake --version | tee "${EVIDENCE_DIR}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE_DIR}/"

          python3 - <<'PY' | tee "${EVIDENCE_DIR}/audit/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          root=Path('PrimalitySheafVerification')
          files=[
              *(root/f'Spt{i}.lean' for i in range(1,8)),
              root/'Mock1.lean',root/'Mock1_Advanced.lean',
              root/'Mock2.lean',root/'Mock2_Advanced.lean',
              root/'Mock2_FunctionalAnalysis_Integrated.lean',
              root/'Mock2_FunctionalAnalysis.lean',root/'QYM.lean',
              root/'BuildAll.lean']

          def strip(src:str)->str:
              out=[];i=0;depth=0;string=False;escaped=False
              while i<len(src):
                  if depth:
                      if src.startswith('/-',i):depth+=1;out.extend('  ');i+=2
                      elif src.startswith('-/',i):depth-=1;out.extend('  ');i+=2
                      else:out.append('\n' if src[i]=='\n' else ' ');i+=1
                  elif string:
                      ch=src[i];out.append('\n' if ch=='\n' else ' ')
                      if escaped:escaped=False
                      elif ch=='\\':escaped=True
                      elif ch=='"':string=False
                      i+=1
                  elif src.startswith('/-',i):depth=1;out.extend('  ');i+=2
                  elif src.startswith('--',i):
                      while i<len(src) and src[i]!='\n':out.append(' ');i+=1
                  elif src[i]=='"':string=True;out.append(' ');i+=1
                  else:out.append(src[i]);i+=1
              if depth or string:raise SystemExit('unterminated comment or string')
              return ''.join(out)

          checks={'sorry':r'\bsorry\b','admit':r'\badmit\b',
                  'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
                  'native_decide':r'\bnative_decide\b',
                  'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for path in files:
              if not path.is_file():print(f'MISSING {path}');bad=True;continue
              code=strip(path.read_text(encoding='utf-8'))
              print(f'[{path}]')
              for name,pat in checks.items():
                  count=len(re.findall(pat,code));print(f'{name}={count}');bad|=count!=0
          if bad:raise SystemExit('final source trust audit failed')
          PY

          echo 'phase,pass,module,exit_code,error_count,warning_count' \
            > "${EVIDENCE_DIR}/compile-summary.csv"

          compile_one() {
            local phase="$1" pass="$2" module="$3"
            local source="PrimalitySheafVerification/${module}.lean"
            local log="${EVIDENCE_DIR}/logs/${phase}-${module}-pass${pass}.log"
            set +e
            lake env lean "${source}" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s,%s\n' \
              "${phase}" "${pass}" "${module}" "${code}" "${errors}" "${warnings}" \
              >> "${EVIDENCE_DIR}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              {
                grep -n 'error:' "${log}" | head -60 || true
                grep -n 'error:' "${log}" | tail -1 || true
                tail -480 "${log}" || true
              } > "${EVIDENCE_DIR}/logs/${phase}-${module}-pass${pass}-failure-summary.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi \
              "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" \
              "${log}"; then
              echo "forbidden compiler diagnostic in ${log}" >&2
              return 1
            fi
          }

          modules=(
            Spt1 Spt2 Spt3 Spt4 Spt5 Spt6 Spt7
            Mock1 Mock1_Advanced Mock2 Mock2_Advanced
            Mock2_FunctionalAnalysis_Integrated
            Mock2_FunctionalAnalysis QYM BuildAll
          )
          for pass in 1 2; do
            rm -rf "${OUTDIR}"
            mkdir -p "${OUTDIR}"
            for module in "${modules[@]}"; do
              compile_one clean "${pass}" "${module}"
            done
            find "${OUTDIR}" -maxdepth 1 -type f \( -name '*.olean' -o -name '*.ilean' \) \
              -printf '%f\n' | sort > "${EVIDENCE_DIR}/artifacts-pass${pass}.txt"
          done

          python3 - <<'PY'
          from pathlib import Path
          import re
          src=Path('PrimalitySheafVerification/Spt5.lean').read_text(encoding='utf-8')
          out=[];i=0;depth=0;string=False;escaped=False
          while i<len(src):
              if depth:
                  if src.startswith('/-',i):depth+=1;out.extend('  ');i+=2
                  elif src.startswith('-/',i):depth-=1;out.extend('  ');i+=2
                  else:out.append('\n' if src[i]=='\n' else ' ');i+=1
              elif string:
                  ch=src[i];out.append('\n' if ch=='\n' else ' ')
                  if escaped:escaped=False
                  elif ch=='\\':escaped=True
                  elif ch=='"':string=False
                  i+=1
              elif src.startswith('/-',i):depth=1;out.extend('  ');i+=2
              elif src.startswith('--',i):
                  while i<len(src) and src[i]!='\n':out.append(' ');i+=1
              elif src[i]=='"':string=True;out.append(' ');i+=1
              else:out.append(src[i]);i+=1
          if depth or string:raise SystemExit('unterminated Spt5 comment or string')
          code=''.join(out)
          stack=[];namespaces=[];names=[]
          for line in code.splitlines():
              s=line.strip()
              m=re.match(r'^namespace\s+([A-Za-z_][A-Za-z0-9_\'.]*)\b',s)
              if m:
                  parts=m.group(1).split('.');stack.append(('namespace',len(parts)));namespaces.extend(parts);continue
              if re.match(r'^section(?:\s+[A-Za-z_][A-Za-z0-9_\']*)?\s*$',s):
                  stack.append(('section',0));continue
              if re.match(r'^end(?:\s+[A-Za-z_][A-Za-z0-9_\'.]*)?\s*$',s):
                  if stack:
                      kind,count=stack.pop()
                      if kind=='namespace' and count:del namespaces[-count:]
                  continue
              if re.search(r'\bprivate\s+(?:theorem|lemma)\b',s):continue
              d=re.search(r'(?:^|\s)(?:theorem|lemma)\s+([A-Za-z_][A-Za-z0-9_\'.]*)\b',s)
              if d:
                  raw=d.group(1);full='.'.join([*namespaces,raw]) if namespaces else raw
                  if full not in names:names.append(full)
          if not names:raise SystemExit('no public Spt5 theorem declarations discovered')
          audit=Path('/tmp/Spt5WholeFileAxiomAudit.lean')
          audit.write_text(
              'import PrimalitySheafVerification.Spt5\n\n' +
              '\n'.join(f'#print axioms {name}' for name in names) + '\n',
              encoding='utf-8')
          Path('/tmp/primality-sheaf-ci/audit/Spt5-declarations.txt').write_text(
              '\n'.join(names)+'\n',encoding='utf-8')
          print(f'generated {len(names)} Spt5 theorem audits')
          PY

          audit_log="${EVIDENCE_DIR}/audit/Spt5-whole-file-axioms.log"
          set +e
          lake env lean /tmp/Spt5WholeFileAxiomAudit.lean >"${audit_log}" 2>&1
          audit_code=$?
          set -e
          echo "${audit_code}" > "${EVIDENCE_DIR}/audit/Spt5-audit-exit-code.txt"
          if [[ "${audit_code}" -ne 0 ]]; then
            grep -n 'error:' "${audit_log}" | head -60 || true
            tail -480 "${audit_log}" || true
            exit "${audit_code}"
          fi
          if grep -Eqi "sorryAx|declaration uses 'sorry'|Lean\.ofReduceBool" "${audit_log}"; then
            grep -Ein "sorryAx|declaration uses 'sorry'|Lean\.ofReduceBool" "${audit_log}" || true
            exit 1
          fi
          python3 - "${audit_log}" <<'PY' \
            | tee "${EVIDENCE_DIR}/audit/Spt5-axiom-summary.txt"
          from pathlib import Path
          import re
          import sys
          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          allowed={'propext','Classical.choice','Quot.sound'}
          observed=set()
          for bracket in re.findall(r'depends on axioms:\s*\[([^\]]*)\]',text):
              for item in bracket.split(','):
                  name=item.strip().strip("'\"")
                  if name:observed.add(name)
          forbidden=sorted(observed-allowed)
          print('observed='+','.join(sorted(observed)))
          print('forbidden='+','.join(forbidden))
          if forbidden:raise SystemExit(1)
          PY

          cp "${OUTDIR}/BuildAll.olean" "${OUTDIR}/BuildAll.ilean" \
            "${OUTDIR}/QYM.olean" "${OUTDIR}/QYM.ilean" \
            "${EVIDENCE_DIR}/artifacts/"
          sha256sum "${OUTDIR}/BuildAll.olean" "${OUTDIR}/BuildAll.ilean" \
            "${OUTDIR}/QYM.olean" "${OUTDIR}/QYM.ilean" \
            | tee "${EVIDENCE_DIR}/provenance-sha256.txt"
          printf '%s\n' "utc_completed=$(date -u +%FT%TZ)" >> "${EVIDENCE_DIR}/snapshot.txt"
          git diff --exit-code
          SCRIPT
          chmod +x scripts/primality_sheaf_ci.sh
          bash -n scripts/primality_sheaf_ci.sh
          git add scripts/primality_sheaf_ci.sh

      - name: Write sole official project workflow
        shell: bash
        run: |
          set -euo pipefail
          cat > .github/workflows/primality-sheaf-ci.yml <<'YAML'
          name: PrimalitySheafVerification CI

          on:
            push:
              branches: [master]
              paths:
                - 'PrimalitySheafVerification/**'
                - 'scripts/primality_sheaf_ci.sh'
                - 'lakefile.lean'
                - 'lake-manifest.json'
                - 'lean-toolchain'
                - '.github/workflows/primality-sheaf-ci.yml'
            pull_request:
              branches: [master]
              paths:
                - 'PrimalitySheafVerification/**'
                - 'scripts/primality_sheaf_ci.sh'
                - 'lakefile.lean'
                - 'lake-manifest.json'
                - 'lean-toolchain'
                - '.github/workflows/primality-sheaf-ci.yml'
            workflow_dispatch:

          concurrency:
            group: primality-sheaf-ci-${{ github.event.pull_request.number || github.ref }}
            cancel-in-progress: true

          permissions:
            contents: read
            actions: read
            checks: read
            pull-requests: write

          jobs:
            verify:
              name: Verify 13 modules, BuildAll, clean rebuilds, and axioms
              runs-on: ubuntu-24.04-arm
              timeout-minutes: 360
              env:
                EVIDENCE_DIR: /tmp/primality-sheaf-ci

              steps:
                - name: Checkout actual event commit
                  uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

                - name: Install pinned Lean and restore Mathlib cache
                  uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
                  with:
                    auto-config: false
                    use-github-cache: false
                    use-mathlib-cache: true

                - name: Run source-only final verification
                  shell: bash
                  run: bash scripts/primality_sheaf_ci.sh

                - name: Upload final verification evidence
                  if: always()
                  uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
                  with:
                    name: primality-sheaf-final-${{ github.sha }}
                    path: /tmp/primality-sheaf-ci
                    if-no-files-found: error
                    retention-days: 90

            ready:
              name: Mark PR ready only after all checks are green
              if: >-
                github.event_name == 'pull_request' &&
                github.event.pull_request.draft == true
              needs: verify
              runs-on: ubuntu-24.04
              timeout-minutes: 180
              env:
                GH_TOKEN: ${{ github.token }}
                HEAD_SHA: ${{ github.event.pull_request.head.sha }}
                PR_NODE_ID: ${{ github.event.pull_request.node_id }}

              steps:
                - name: Require every other check on the head commit to be green
                  shell: bash
                  run: |
                    set -euo pipefail
                    for attempt in $(seq 1 300); do
                      gh api \
                        -H 'Accept: application/vnd.github+json' \
                        "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/check-runs?per_page=100" \
                        > /tmp/check-runs.json
                      status="$(python3 - /tmp/check-runs.json "${GITHUB_RUN_ID}" <<'PY'
                    import json
                    import sys

                    data=json.load(open(sys.argv[1],encoding='utf-8'))
                    current_run=f"/actions/runs/{sys.argv[2]}"
                    pending=[]
                    failed=[]
                    for check in data.get('check_runs',[]):
                        if current_run in (check.get('details_url') or ''):
                            continue
                        if check.get('status') != 'completed':
                            pending.append(check.get('name','unknown'))
                            continue
                        conclusion=check.get('conclusion')
                        if conclusion not in {'success','skipped','neutral'}:
                            failed.append(f"{check.get('name','unknown')}={conclusion}")
                    if failed:
                        print('FAILED:'+';'.join(failed))
                    elif pending:
                        print('PENDING:'+';'.join(pending))
                    else:
                        print('GREEN')
                    PY
                      )"
                      echo "check_state=${status}"
                      case "${status}" in
                        GREEN) break ;;
                        FAILED:*) exit 1 ;;
                        PENDING:*) sleep 30 ;;
                        *) exit 1 ;;
                      esac
                      if [[ "${attempt}" -eq 300 ]]; then
                        echo 'other checks did not settle to green' >&2
                        exit 1
                      fi
                    done

                - name: Mark pull request ready for review
                  shell: bash
                  run: |
                    set -euo pipefail
                    gh api graphql \
                      -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft url}}}' \
                      -F id="${PR_NODE_ID}"
          YAML
          git add .github/workflows/primality-sheaf-ci.yml

      - name: Validate final workflow and script statically
        shell: bash
        run: |
          set -euo pipefail
          ruby -e "require 'yaml'; YAML.load_file('.github/workflows/primality-sheaf-ci.yml'); puts 'yaml-ok'"
          python3 - <<'PY'
          from pathlib import Path
          import re
          text=Path('.github/workflows/primality-sheaf-ci.yml').read_text(encoding='utf-8')
          bad=[]
          for line in text.splitlines():
              m=re.match(r'\s*uses:\s*([^\s]+)',line)
              if not m:continue
              ref=m.group(1)
              if '@' not in ref or not re.search(r'@[0-9a-fA-F]{40}$',ref):bad.append(ref)
          if bad:raise SystemExit('unpinned actions: '+', '.join(bad))
          print('all actions SHA-pinned')
          PY
          bash -n scripts/primality_sheaf_ci.sh
          git diff --check
          git status --short | tee "${EVIDENCE}/planned-changes.txt"

      - name: Install pinned Lean and restore cache for pre-commit reproduction
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Reproduce final official verification before commit
        shell: bash
        env:
          EVIDENCE_DIR: /tmp/pass326-official-ci/reproduction
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/primality_sheaf_ci.sh

      - name: Commit consolidated official CI
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: consolidate final PrimalitySheafVerification verification'
          commit_sha="$(git rev-parse HEAD)"
          remote_sha="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_sha}" = "${HEAD_SHA}"
          git push origin "HEAD:${BRANCH}"
          printf '%s\n' \
            "consolidation_commit=${commit_sha}" \
            "utc_completed=$(date -u +%FT%TZ)" \
            | tee -a "${EVIDENCE}/snapshot.txt"

      - name: Upload consolidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass326-official-ci-${{ env.HEAD_SHA }}
          path: /tmp/pass326-official-ci
          if-no-files-found: warn
          retention-days: 90
