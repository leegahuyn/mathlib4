name: Codex FA parser followup 3236-3237 v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-parser-followup-3236-3237-v2.yml]
  workflow_dispatch:
permissions: {actions: read, contents: read}

env:
  BASE_RUN_ID: "31560687838"
  BASE_ARTIFACT_ID: "9127801259"
  BASE_ARTIFACT_DIGEST: "sha256:effbae0f44576ceb6966b46ffd1202c13e58b12e4c0fa09f8a151ebd2e243f04"
  BASE_SOURCE_SHA256: "16add9ea94f460e989771f325793ca99684adc3a615413b1a4154360fb245c35"
  BASE_SOURCE_BYTES: "2722942"
  BASE_SOURCE_LINES: "60998"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact parser-corrected direct source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-parser-followup-3236-3237-v2; mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"; unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-parser-followup-3236-3237-v2');r=json.loads((out/'run.json').read_text());a=json.loads((out/'artifact.json').read_text());m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['status']=='completed' and r['conclusion']=='failure'
          assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and not a['expired']
          assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1 and m['all_required_lean_executed'] is True and m['FA_error_declaration_index']==3237 and m['parser_correction_count']==18
          assert m['source_sha256']==os.environ['BASE_SOURCE_SHA256'] and m['source_bytes']==int(os.environ['BASE_SOURCE_BYTES']) and m['source_lines']==int(os.environ['BASE_SOURCE_LINES']) and m['source_identity_locked_after_materialization'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            b=p.read_bytes()
            if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']): hits.append(p)
          assert len(hits)==1;(out/'BASE_SOURCE.txt').write_text(str(hits[0].resolve())+'\n')
          PY
      - name: Apply proof-only fixes
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-parser-followup-3236-3237-v2
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-parser-followup-3236-3237-v2');src=Path((out/'BASE_SOURCE.txt').read_text().strip());s=src.read_text();rx=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)');ms=list(rx.finditer(s));ds=[(m.group('name'),m.start(),ms[i+1].start() if i+1<len(ms) else len(s)) for i,m in enumerate(ms)]
          fixes={3236:[('    funext t\n    exact smul_sub (K t) (DomAddAct.mk (-t) +ᵥ f) f','    funext t\n    rw [smul_sub]','cheap-smul-sub')],3237:[('    have hNeg : Filter.Tendsto (fun t : ℂ ↦ -t) (nhds 0) (nhds 0) := by\n      change ContinuousAt (fun t : ℂ ↦ -t) 0\n      exact continuousAt_id.neg',"    have hNeg : Filter.Tendsto (fun t : ℂ ↦ -t) (nhds 0) (nhds 0) := by\n      have hNeg' : Filter.Tendsto (fun t : ℂ ↦ -t)\n          (nhds 0) (nhds (-(0 : ℂ))) := continuousAt_id.neg\n      simpa only [neg_zero] using hNeg'",'neg-endpoint')]};pieces=[];cur=0;rec=[]
          for idx,(name,a,b) in enumerate(ds):
            pieces.append(s[cur:a]);blk=s[a:b]
            for old,new,rid in fixes.get(idx,[]):
              assert blk.count(old)==1,(idx,rid,blk.count(old));blk=blk.replace(old,new);rec.append({'idx':idx,'name':name,'id':rid})
            pieces.append(blk);cur=b
          pieces.append(s[cur:]);t=''.join(pieces);assert [x[0] for x in ds]==[m.group('name') for m in rx.finditer(t)]
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');p.write_text(t);b=p.read_bytes();ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(t.splitlines())};(out/'PREP.json').write_text(json.dumps({'repairs':rec,'public_headers_changed':False,'declaration_sequence_preserved':True},indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f"CANDIDATE_SHA={ident['sha256']}\n")
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-parser-followup-3236-3237-v2; curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh; sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1; export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1; lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct full-source compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-parser-followup-3236-3237-v2; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}; one Mock2 1; one Mock2_Advanced 1; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis 32
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-parser-followup-3236-3237-v2');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();b=p.read_bytes();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:
              ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};first=es[0] if es else {};metric={'schema':'fa-parser-followup-3236-3237-v2','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message')};(out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-parser-followup-3236-3237-v2-${{ github.sha }}", path: "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\nbuild-logs/codex-fa-parser-followup-3236-3237-v2", retention-days: 30}
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
