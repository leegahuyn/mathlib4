name: Codex FA frontier e7d 3105-3141 v2

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-e7d-3105-3141-v2.yml
      - scripts/fa_dynamic_cluster_3105_3114_strict_v2.json
      - scripts/fa_dynamic_idx3105_chart_action_v1.json
      - scripts/fa_dynamic_idx3106_ofreal_contdiff_followup_v1.json
      - scripts/fa_dynamic_cluster_3118_3141_v1.json
      - scripts/fa_d0a3_r002_high_confidence_overrides.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-frontier-e7d-3105-3141-v2
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31525695224"
  BASE_JOB_ID: "93893336738"
  BASE_HEAD_SHA: "b196ec48ce9c864a653420e6b65b29331becb5da"
  BASE_ARTIFACT_ID: "9115520782"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-after-cumulative3095-v1-b196ec48ce9c864a653420e6b65b29331becb5da"
  BASE_ARTIFACT_DIGEST: "sha256:a91a876a6f42ae997a595ad12d1ac9869a5ba1e2992b3c2a355f30f7e062cef8"
  BASE_SOURCE_SHA256: "e7d8ab6e4b01717bcefa85bcc1e6ffaa857b11517404d0e46274026755c22c20"
  BASE_SOURCE_BYTES: "2709034"
  BASE_SOURCE_LINES: "60732"
  BASE_FIRST_INDEX: "3105"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact authoritative e7d idx3105 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-e7d-3105-3141-v2
          mkdir -p "$OUT" /tmp/fa-e7d-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/base-e7d.zip
          test "sha256:$(sha256sum /tmp/base-e7d.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base-e7d.zip -d /tmp/fa-e7d-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-e7d-3105-3141-v2')
          r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); a=json.loads((out/'artifact.json').read_text())
          if not (r.get('id')==int(os.environ['BASE_RUN_ID']) and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and r.get('status')=='completed' and r.get('conclusion')=='failure'): raise SystemExit('base run gate failed')
          if not (j.get('id')==int(os.environ['BASE_JOB_ID']) and j.get('run_id')==int(os.environ['BASE_RUN_ID']) and j.get('status')=='completed' and j.get('conclusion')=='failure'): raise SystemExit('base job gate failed')
          if not (a.get('id')==int(os.environ['BASE_ARTIFACT_ID']) and a.get('name')==os.environ['BASE_ARTIFACT_NAME'] and a.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'] and a.get('expired') is False): raise SystemExit('base artifact gate failed')
          ms=list(Path('/tmp/fa-e7d-base').rglob('METRIC.json'))
          if len(ms)!=1: raise SystemExit('expected one METRIC.json')
          m=json.loads(ms[0].read_text())
          checks=[m.get('Mock2_exit')==0,m.get('Mock2_Advanced_exit')==0,m.get('FA_exit')==1,m.get('all_required_lean_executed') is True,m.get('FA_error_declaration_index')==int(os.environ['BASE_FIRST_INDEX']),m.get('source_sha256')==os.environ['BASE_SOURCE_SHA256'],m.get('source_identity_locked_after_materialization') is True,m.get('public_declaration_headers_preserved') is True,m.get('declaration_sequence_preserved') is True]
          if not all(checks): raise SystemExit('base direct metric gate failed: '+repr(m))
          hits=[]
          for p in Path('/tmp/fa-e7d-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode('utf-8').splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: hits.append(p)
          if not hits: raise SystemExit('exact e7d source missing')
          p=min(hits,key=lambda q:(len(q.parts),q.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY

      - name: Materialize non-overlapping late libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('scripts/fa_dynamic_cluster_3118_3141_v1.json').read_text())
          keep=[r for r in c.get('repairs',[]) if int(r['declaration_index']) != 3135]
          Path('/tmp/fa_3118_3141_no3135.json').write_text(json.dumps({'schema':'fa-3118-3141-no3135-e7d-v2','repairs':keep},ensure_ascii=False,indent=2)+'\n')
          r2=json.loads(Path('scripts/fa_d0a3_r002_high_confidence_overrides.json').read_text())
          keep2=[r for r in r2.get('repairs',[]) if int(r['declaration_index'])==3135]
          if len(keep2)!=1: raise SystemExit('R002 idx3135 identity drift')
          Path('/tmp/fa_r002_3135_only.json').write_text(json.dumps({'schema':'fa-r002-3135-only-e7d-v2','repairs':keep2},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Apply header-safe intrinsic batches through idx3141
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-e7d-3105-3141-v2
          base="$(cat "$OUT/BASE_SOURCE.txt")"
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_cluster_3105_3114_strict_v2.json --target /tmp/fa-e7d-3114.lean --audit-out "$OUT/AUDIT_3114.json"
          base=/tmp/fa-e7d-3114.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_idx3105_chart_action_v1.json --no-environment --target /tmp/fa-e7d-3105a.lean --audit-out "$OUT/AUDIT_3105A.json"
          base=/tmp/fa-e7d-3105a.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_idx3106_ofreal_contdiff_followup_v1.json --no-environment --target /tmp/fa-e7d-3106a.lean --audit-out "$OUT/AUDIT_3106A.json"
          base=/tmp/fa-e7d-3106a.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library /tmp/fa_3118_3141_no3135.json --no-environment --target /tmp/fa-e7d-3141a.lean --audit-out "$OUT/AUDIT_3141.json"
          base=/tmp/fa-e7d-3141a.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library /tmp/fa_r002_3135_only.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/AUDIT_3135.json"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-e7d-3105-3141-v2'); names=('AUDIT_3114.json','AUDIT_3105A.json','AUDIT_3106A.json','AUDIT_3141.json','AUDIT_3135.json'); audits=[json.loads((out/n).read_text()) for n in names]
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed'] for a in audits): raise SystemExit('semantic/header audit failed')
          base=Path((out/'BASE_SOURCE.txt').read_text().strip()).read_text(); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); forbidden=('sorry','admit','axiom','unsafe','native_decide','Lean.ofReduceBool','sorryAx'); counts={t:(base.count(t),s.count(t)) for t in forbidden}
          if any(a!=b for a,b in counts.values()): raise SystemExit('forbidden token drift: '+repr(counts))
          b=p.read_bytes(); ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines()),'repair_indices':[x['declaration_index'] for a in audits for x in a.get('proof_replacements_applied',[])],'environment_replacements':[x for a in audits for x in a.get('environment_replacements_applied',[])],'forbidden_token_counts':counts}; (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write(f"CANDIDATE_SHA={ident['sha256']}\nCANDIDATE_BYTES={ident['bytes']}\nCANDIDATE_LINES={ident['lines']}\n")
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-e7d-3105-3141-v2
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          lake exe cache get > "$OUT/cache.log" 2>&1

      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-frontier-e7d-3105-3141-v2
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$c" "$o" "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.command";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3
          one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"
          one Mock2_FunctionalAnalysis 384
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-e7d-3105-3141-v2'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); metric={'schema':'fa-frontier-e7d-3105-3141-v2','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':384}; (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-e7d-3105-3141-v2-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-e7d-3105-3141-v2
          if-no-files-found: warn
          retention-days: 30

      - name: Publish locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          state=failure; [[ "${FA_EXIT:-}" == 0 ]] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='codex/fa-frontier-e7d-3105-3141-v2' -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
