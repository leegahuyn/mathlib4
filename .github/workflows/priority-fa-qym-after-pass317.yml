name: Continue FunctionalAnalysis and QYM after Advanced pass 317

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-fa-qym-after-pass317.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: priority-fa-qym-after-pass317
  cancel-in-progress: true

jobs:
  wait-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      ADV_RESULT: build-logs/mock2-advanced-pass317-result.txt
      FA_RESULT: build-logs/priority-stage2-fa-result.txt
      QYM_RESULT: build-logs/priority-stage3-qym-result.txt
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Initialize repository
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

      - name: Wait for Advanced pass 317 PASS record
        shell: bash
        run: |
          set -euo pipefail
          ready=0
          for attempt in $(seq 1 180); do
            git fetch --depth=50 origin "refs/heads/${BRANCH}"
            if git cat-file -e "FETCH_HEAD:${ADV_RESULT}" 2>/dev/null; then
              git show "FETCH_HEAD:${ADV_RESULT}" > /tmp/advanced-result.txt
              if grep -Fxq 'status=PASS' /tmp/advanced-result.txt && \
                 grep -Fxq 'runtime_repair_during_final_direct=0' /tmp/advanced-result.txt && \
                 grep -Eq '^advanced-pass1,0,0$' /tmp/advanced-result.txt && \
                 grep -Eq '^advanced-pass2,0,0$' /tmp/advanced-result.txt; then
                ready=1
                break
              fi
            fi
            echo "Advanced pass 317 PASS is not ready; attempt ${attempt}/180"
            sleep 60
          done
          test "${ready}" -eq 1
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Materialize and directly verify FunctionalAnalysis
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf "${OUTDIR}";mkdir -p "${OUTDIR}"
          bash scripts/priority_stage2_fa.sh

      - name: Refresh and verify FunctionalAnalysis PASS record
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          test -s "${FA_RESULT}"
          grep -Fxq 'stage=Mock2_FunctionalAnalysis' "${FA_RESULT}"
          grep -Fxq 'status=PASS' "${FA_RESULT}"
          grep -Fxq 'runtime_repair_during_final_direct=0' "${FA_RESULT}"
          rm -rf "${OUTDIR}";mkdir -p "${OUTDIR}"

      - name: Directly verify Integrated and QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage3_qym.sh

      - name: Verify final QYM PASS and report PR 7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          test -s "${QYM_RESULT}"
          grep -Fxq 'status=PASS' "${QYM_RESULT}"
          grep -Fxq 'runtime_repair_scripts=0' "${QYM_RESULT}"
          grep -Fxq 'Mock2_Advanced=PASS' "${QYM_RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis=PASS' "${QYM_RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' "${QYM_RESULT}"
          grep -Fxq 'QYM=PASS' "${QYM_RESULT}"
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," "${QYM_RESULT}"
            grep -Eq "^${module},pass2,0,0," "${QYM_RESULT}"
          done
          python3 - <<'PY' > /tmp/comment.json
          import json
          from pathlib import Path
          t=Path('build-logs/priority-stage3-qym-result.txt').read_text(encoding='utf-8')
          head=next(x.split('=',1)[1] for x in t.splitlines() if x.startswith('verified_source_head='))
          rows='\n'.join(x for x in t.splitlines() if x.startswith(('Mock2,pass','Mock2_Advanced,pass','Mock2_FunctionalAnalysis,pass','Mock2_FunctionalAnalysis_Integrated,pass','QYM,pass')))
          print(json.dumps({'body': f'''## Advanced pass 317 → FunctionalAnalysis → QYM PASS

Verified source head: `{head}`

The checked-in sources passed two direct compiles in dependency order, with no runtime repair during final verification.

```text
{rows}
```
'''}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --data-binary @/tmp/comment.json
