name: FA431 verified continuation after FA427 matrix

on:
  push:
    branches:
      - fix/fa431-continuation-after-fa427-20260810
    paths:
      - .github/workflows/fa431-continuation-after-fa427.yml
      - build-logs/fa431-continuation/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa431-continuation-after-fa427
  cancel-in-progress: false

jobs:
  wait-for-fa427:
    runs-on: ubuntu-24.04
    timeout-minutes: 325
    outputs:
      source_commit: ${{ steps.wait.outputs.source_commit }}
      source_sha: ${{ steps.wait.outputs.source_sha }}
      first_line: ${{ steps.wait.outputs.first_line }}
      first_col: ${{ steps.wait.outputs.first_col }}
      fa_exit: ${{ steps.wait.outputs.fa_exit }}
    env:
      UPSTREAM_BRANCH: fix/fa427-actualedge-parallel-matrix-20260810
    steps:
      - name: Checkout continuation controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa431-continuation-after-fa427-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Wait for source and direct evidence identity on FA427 branch
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa431-wait
          ready=false
          for attempt in $(seq 1 300); do
            git fetch --force origin \
              "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}" \
              --depth=30 > /tmp/fa431-wait/fetch.log 2>&1 || true
            ref="refs/remotes/origin/${UPSTREAM_BRANCH}"
            if git rev-parse --verify "$ref" >/dev/null 2>&1 && \
               git show "$ref:build-logs/fa427-actualedge-matrix/selected/CONFIRMATION.json" \
                 > /tmp/fa431-wait/CONFIRMATION.json 2>/dev/null && \
               git show "$ref:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
                 > /tmp/fa431-wait/Mock2_FunctionalAnalysis.lean 2>/dev/null; then
              python3 - <<'PY' > /tmp/fa431-wait/validated.env || true
          from pathlib import Path
          import hashlib, json
          e=json.loads(Path('/tmp/fa431-wait/CONFIRMATION.json').read_text())
          data=Path('/tmp/fa431-wait/Mock2_FunctionalAnalysis.lean').read_bytes()
          sha=hashlib.sha256(data).hexdigest()
          lines=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          exit_code=int(e.get('FA_exit',999)); first=int(e.get('FA_first_error_line',0)); col=int(e.get('FA_first_error_col',0))
          valid=(e.get('classification')=='VERIFIED' and e.get('authority')=='direct Lean CLI'
                 and e.get('verified') is True and e.get('source_sha256')==sha and lines==60453
                 and (exit_code==0 or first>=31726))
          print(f'VALID={str(valid).lower()}')
          print(f'SOURCE_SHA={sha}')
          print(f'FA_EXIT={exit_code}')
          print(f'FIRST_LINE={first}')
          print(f'FIRST_COL={col}')
          PY
              # shellcheck disable=SC1091
              source /tmp/fa431-wait/validated.env || true
              if test "${VALID:-false}" = true; then
                commit=$(git rev-parse "$ref")
                {
                  echo "source_commit=$commit"
                  echo "source_sha=$SOURCE_SHA"
                  echo "fa_exit=$FA_EXIT"
                  echo "first_line=$FIRST_LINE"
                  echo "first_col=$FIRST_COL"
                } >> "$GITHUB_OUTPUT"
                ready=true
                break
              fi
            fi
            printf 'attempt=%s FA427 not ready\n' "$attempt" | tee /tmp/fa431-wait/last-status.txt
            sleep 60
          done
          test "$ready" = true

      - name: Upload wait provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa431-wait-${{ github.run_id }}
          path: /tmp/fa431-wait
          if-no-files-found: warn
          retention-days: 30

  continue-and-gate:
    needs: wait-for-fa427
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa431-continuation-after-fa427-20260810
      UPSTREAM_BRANCH: fix/fa427-actualedge-parallel-matrix-20260810
      UPSTREAM_COMMIT: ${{ needs.wait-for-fa427.outputs.source_commit }}
      UPSTREAM_SHA: ${{ needs.wait-for-fa427.outputs.source_sha }}
      UPSTREAM_FA_EXIT: ${{ needs.wait-for-fa427.outputs.fa_exit }}
      UPSTREAM_FIRST_LINE: ${{ needs.wait-for-fa427.outputs.first_line }}
      UPSTREAM_FIRST_COL: ${{ needs.wait-for-fa427.outputs.first_col }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FA426_MAX_CANDIDATES: '40'
      FA426_MAX_PROMOTIONS: '8'
      FA426_TIME_BUDGET_SECONDS: '18800'
    steps:
      - name: Checkout exact FA431 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa431-continuation-after-fa427-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Materialize exact FA427 source and compatibility evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --force origin \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}" \
            --depth=30
          ref="refs/remotes/origin/${UPSTREAM_BRANCH}"
          test "$(git rev-parse "$ref")" = "$UPSTREAM_COMMIT"
          mkdir -p build-logs/fa431-continuation/input-fa427 \
                   build-logs/fa426-monotone-donor-proof-miner
          git show "$ref:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            > PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$UPSTREAM_SHA"
          git show "$ref:build-logs/fa427-actualedge-matrix/selected/CONFIRMATION.json" \
            > build-logs/fa431-continuation/input-fa427/CONFIRMATION.json
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa431-continuation/input-fa427/Mock2_FunctionalAnalysis.lean
          printf '%s\n' "$UPSTREAM_COMMIT" > build-logs/fa431-continuation/input-fa427/commit.txt
          printf '%s\n' "$UPSTREAM_SHA" > build-logs/fa431-continuation/input-fa427/source-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          status={
              'classification':'VERIFIED',
              'authority':'direct Lean CLI',
              'promoted':True,
              'selected':{
                  'source_sha256':os.environ['UPSTREAM_SHA'],
                  'exit_code':int(os.environ['UPSTREAM_FA_EXIT']),
                  'first_error_line':int(os.environ['UPSTREAM_FIRST_LINE']),
                  'first_error_col':int(os.environ['UPSTREAM_FIRST_COL']),
              },
              'source':'FA427 checked-in source/evidence identity',
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],
          }
          Path('build-logs/fa426-monotone-donor-proof-miner/CURRENT.json').write_text(
              json.dumps(status,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa431-lean-version.txt
          lake --version | tee /tmp/fa431-lake-version.txt
          lake exe cache get | tee /tmp/fa431-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Continue monotone donor mining from exact FA427 source
        id: mine
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa426_monotone_donor_proof_miner.py > /tmp/fa431-console.log 2>&1
          rc=$?
          cat /tmp/fa431-console.log
          d=build-logs/fa426-monotone-donor-proof-miner
          cp /tmp/fa431-lean-version.txt "$d/fa431-lean-version.txt" 2>/dev/null || true
          cp /tmp/fa431-lake-version.txt "$d/fa431-lake-version.txt" 2>/dev/null || true
          cp /tmp/fa431-cache-get.log "$d/fa431-cache-get.log" 2>/dev/null || true
          cp /tmp/fa431-console.log "$d/fa431-console.log" 2>/dev/null || true
          if test -f "$d/CURRENT.json"; then
            sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('source_sha256',''))")
            exit_code=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('exit_code',999))")
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_line',0))")
            strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          else
            sha=''; exit_code=999; first=0; strict=false
          fi
          {
            echo "script_rc=$rc"
            echo "selected_sha=$sha"
            echo "fa_exit=$exit_code"
            echo "first_line=$first"
            echo "strict_promotion=$strict"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist selected source and verify checked-in identity
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          test -f "$d/CURRENT.json"
          selected=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
          first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
          strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$selected"
          mkdir -p build-logs/fa431-continuation/output
          cp "$d/CURRENT.json" build-logs/fa431-continuation/output/CURRENT.json
          cp "$d/CURRENT.txt" build-logs/fa431-continuation/output/CURRENT.txt
          cp "$d/FIRST_ERROR_CONTEXT.txt" build-logs/fa431-continuation/output/FIRST_ERROR_CONTEXT.txt 2>/dev/null || true
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                  build-logs/fa426-monotone-donor-proof-miner \
                  build-logs/fa431-continuation
          if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
          if test "$strict" = true; then
            msg="fix: persist FA431 ${metric} direct-verified continuation ${selected:0:12}"
          else
            msg="fix: materialize FA427 direct-verified source for continuation ${selected:0:12}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$selected"
          head=$(git rev-parse HEAD)
          echo "source_commit=$head" >> "$GITHUB_OUTPUT"
          echo "selected_sha=$selected" >> "$GITHUB_OUTPUT"
          echo "fa_exit=$fa_exit" >> "$GITHUB_OUTPUT"
          echo "first_line=$first" >> "$GITHUB_OUTPUT"
          immutable="champion/fa431-${metric}-${selected:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa431-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" --input /tmp/fa431-ref.json \
               > build-logs/fa431-continuation/output/immutable-response.json \
               2> build-logs/fa431-continuation/output/immutable-error.txt; then
            printf '%s\n' "$immutable" > build-logs/fa431-continuation/output/IMMUTABLE_CHAMPION_BRANCH.txt
          fi

      - name: Directly compile identical checked-in FA source twice and audit
        id: fa_gate
        if: always()
        env:
          SELECTED_SHA: ${{ steps.persist.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa431-continuation/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test -n "$SELECTED_SHA" && test "$SELECTED_SHA" = "$checked" && test "$SELECTED_SHA" = "$worktree"; then identity=true; fi
          printf 'selected=%s\nchecked=%s\nworktree=%s\nidentity=%s\n' "$SELECTED_SHA" "$checked" "$worktree" "$identity" > "$d/source-identity.txt"
          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "$identity" = true; then compile_fa 1; r1=$?; if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi; fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text()
          out=[]; i=0; line=False; string=False; escaped=False; depth=0
          while i<len(text):
              c=text[i]; n=text[i+1] if i+1<len(text) else ''
              if line:
                  if c=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if c=='/' and n=='-': depth+=1; out+=[' ',' ']; i+=2; continue
                  if c=='-' and n=='/': depth-=1; out+=[' ',' ']; i+=2; continue
                  out.append('\n' if c=='\n' else ' '); i+=1; continue
              if string:
                  out.append('\n' if c=='\n' else ' ')
                  if escaped: escaped=False
                  elif c=='\\': escaped=True
                  elif c=='"': string=False
                  i+=1; continue
              if c=='-' and n=='-': line=True; out+=[' ',' ']; i+=2; continue
              if c=='/' and n=='-': depth=1; out+=[' ',' ']; i+=2; continue
              if c=='"': string=True; out.append(' '); i+=1; continue
              out.append(c); i+=1
          code=''.join(out)
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','new_global_axiom':r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
                'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          audit={k:len(re.findall(v,code)) for k,v in pats.items()}
          r1=int(os.environ['R1']); r2=int(os.environ['R2']); clean=all(v==0 for v in audit.values())
          result={'FA_run1_exit':r1,'FA_run2_exit':r2,'forbidden_audit':audit,'forbidden_clean':clean,
                  'FA_TRUE_PASS':r1==0 and r2==0 and clean,'maxErrors_cap':1}
          p=Path('build-logs/fa431-continuation/final-gates/FA_FINAL.json'); p.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h: h.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa431-continuation/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then targets+=(Mock2_FunctionalAnalysis_Integrated); else complete=false; echo missing > "$d/Integrated-missing.txt"; fi
          shopt -s nullglob
          for f in PrimalitySheafVerification/Mock3*.lean; do targets+=("$(basename "$f" .lean)"); done
          if test -f PrimalitySheafVerification/QYM.lean; then targets+=(QYM); else complete=false; echo missing > "$d/QYM-missing.txt"; fi
          compile_one() {
            stem=$1; n=$2; src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/${stem}-run${n}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/${stem}-run${n}.exit"; test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do compile_one "$stem" 1; a=$?; b=125; if test "$a" -eq 0; then compile_one "$stem" 2; b=$?; fi; if test "$a" -ne 0 || test "$b" -ne 0; then complete=false; break; fi; done
          fi
          if test "$complete" = true; then final=0; touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"; fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa431-continuation build-logs/fa426-monotone-donor-proof-miner
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA431 checked-in continuation and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA431 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa431-continuation-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa431-continuation
            build-logs/fa426-monotone-donor-proof-miner
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce full ordered completion
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
