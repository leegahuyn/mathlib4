name: PASS 376 FunctionalAnalysis frontier Ubuntu

on:
  push:
    branches: [fix/fa376-final-isolated-20260809]
    paths:
      - '.github/workflows/pass376-fa-frontier-ubuntu.yml'
      - 'scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa376-frontier-ubuntu
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PASS 376 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 760
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/pass376/logs /tmp/pass376/source
          lean --version | tee /tmp/pass376/lean-version.txt
          lake --version | tee /tmp/pass376/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/pass376/logs/cache-get.log

      - name: Reconstruct PASS 358 without compiling it
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the PASS 341 direct compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          source_file='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${source_file}"
          cp "${source_file}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '8fd20f88c43060d392bab969c91a84b7c0bb08657af7728752a77c5f3c57c6c6'

      - name: Apply cumulative PASS 375c candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_pass375c_candidate.py | tee /tmp/pass376/logs/apply-pass375c.log
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            'd2e1b383b9e60fd18607094ce104679cd604e8c90ffc0261d8a877e700b99b8e'

      - name: Apply PASS 376 repairs
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py | \
            tee /tmp/pass376/logs/apply-pass376.log
          sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | \
            tee /tmp/pass376/source-sha256.txt
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            /tmp/pass376/source/Mock2_FunctionalAnalysis-pass376.lean

      - name: Compile PASS 376 frontier
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake env lean -DmaxErrors=250 \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > /tmp/pass376/logs/Mock2_FunctionalAnalysis-pass376.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          grep -n 'error:' /tmp/pass376/logs/Mock2_FunctionalAnalysis-pass376.log \
            > /tmp/pass376/logs/errors.txt || true
          grep -n 'warning:' /tmp/pass376/logs/Mock2_FunctionalAnalysis-pass376.log \
            > /tmp/pass376/logs/warnings.txt || true
          tail -1600 /tmp/pass376/logs/Mock2_FunctionalAnalysis-pass376.log \
            > /tmp/pass376/logs/tail.txt || true
          {
            echo "source_sha256=$(cut -d' ' -f1 /tmp/pass376/source-sha256.txt)"
            echo "exit_code=${rc}"
            echo "error_header_count=$(wc -l < /tmp/pass376/logs/errors.txt)"
            echo "warning_count=$(wc -l < /tmp/pass376/logs/warnings.txt)"
          } | tee /tmp/pass376/summary.txt
          exit 0

      - name: Upload PASS 376 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-fa-frontier-${{ github.sha }}
          path: /tmp/pass376
          if-no-files-found: error
          retention-days: 90

      - name: Enforce PASS 376 result
        if: always()
        shell: bash
        env:
          COMPILE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${COMPILE_EXIT_CODE:-}"
          exit "${COMPILE_EXIT_CODE}"
