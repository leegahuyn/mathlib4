name: One-time cleanup for PASS 327 repair agent

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pass327-agent-one-time-cleanup.yml'

permissions:
  contents: write

concurrency:
  group: pass327-agent-one-time-cleanup
  cancel-in-progress: false

jobs:
  cleanup-and-relaunch-v2:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact cleanup head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: true

      - name: Remove obsolete duplicate workflows and relaunch v2
        shell: bash
        env:
          BRANCH: ci/fa319-isolated-20260807
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${trigger_head}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f \
            .github/workflows/pass327-fa-mock3-qym-agent.yml \
            .github/workflows/pass327-fa-qym-recovery.yml \
            .github/workflows/pass327-agent-one-time-cleanup.yml
          printf '\n# Relaunched after one-time duplicate-workflow cleanup at %s.\n' \
            "$(date -u +%FT%TZ)" \
            >> .github/workflows/pass327-fa-mock3-qym-agent-v2.yml
          git add -A
          git commit -m 'ci: keep only restart-safe PASS 327 repair agent v2'
          git push origin "HEAD:${BRANCH}"
