name: Codex FA next source context

on:
  push:
    branches:
      - fix/fa499-eta-authority-stable-20260811
    paths:
      - .github/workflows/codex-fa-next-source-context.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  source:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Post source context
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          {
            echo '## FA source-only context 35690-35980'
            echo
            echo "- run_id: \`${GITHUB_RUN_ID}\`"
            echo "- head_sha: \`${GITHUB_SHA}\`"
            echo '- purpose: read-only preparation for next post-FA499 frontier; no Lean compile'
            echo
            echo '```lean'
            sed -n '35690,35980p' PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | nl -ba -v35690
            echo '```'
          } > /tmp/context.md
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/context.md)"
