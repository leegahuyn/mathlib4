name: Codex FA v81 exhaustive resource normalization pass

on:
  push:
    branches: [codex/fa-v66-decl4017-pass]
    paths:
      - scripts/fa_v81_normalize_all_resource_options.py
      - .github/workflows/codex-fa-v81-exhaustive-resource-pass.yml
  workflow_dispatch: {}

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: codex-fa-v81-exhaustive
  cancel-in-progress: false

env:
  AUTHORITY_ARTIFACT_ID: '9246997507'
  AUTHORITY_SHA256: 71d8eeca6cce4e520754a3e45b43bf3d61a94f4f1bac6f452d0c8ae2c1ee853b
  LEAN_VERSION_EXACT: Lean (version 4.33.0-rc1, x86_64-unknown-linux-gnu, commit 62eed1db4d67327ec8120be05f1a1b0847d74561, Release)
  OUT: build-logs/codex-fa-v81

jobs:
  twice-direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
    outputs:
      pass: ${{ steps.second.outputs.pass }}
      source_commit: ${{ steps.commit.outputs.sha }}
      candidate_sha256: ${{ steps.generate.outputs.sha256 }}
      certified_commit: ${{ steps.seal.outputs.sha }}
    steps:
      - name: Stop if an authoritative certified branch already exists
        id: guard
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code https://github.com/${GITHUB_REPOSITORY}.git refs/heads/codex/fa-true-pass-certified >/dev/null 2>&1;then echo needed=false>>"$GITHUB_OUTPUT";else echo needed=true>>"$GITHUB_OUTPUT";fi
      - if: steps.guard.outputs.needed == 'true'
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: { ref: '${{ github.sha }}', fetch-depth: 1, persist-credentials: true }
      - id: generate
        name: Recover exact authority and exhaustively normalize all resource options
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail;mkdir -p "$OUT" /tmp/fa-v81;gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AUTHORITY_ARTIFACT_ID}/zip">/tmp/fa-v81.zip;unzip -q /tmp/fa-v81.zip -d /tmp/fa-v81
          python3 - <<'PY'
          import hashlib,os
          from pathlib import Path
          e=os.environ['AUTHORITY_SHA256'];ms=[p for p in Path('/tmp/fa-v81').rglob('*.lean') if hashlib.sha256(p.read_bytes()).hexdigest()==e]
          if not ms:raise SystemExit('authority missing')
          Path(os.environ['OUT'],'authority.lean').write_bytes(sorted(ms,key=lambda p:(len(str(p)),str(p)))[0].read_bytes())
          PY
          python3 scripts/fa_v81_normalize_all_resource_options.py --source "$OUT/authority.lean" --output "$OUT/candidate.lean" --evidence "$OUT/GENERATION.json" --rec-depth 1000000>"$OUT/GENERATION.stdout.json";cp "$OUT/candidate.lean" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          e=json.loads(Path(os.environ['OUT'],'GENERATION.json').read_text());f=open(os.environ['GITHUB_OUTPUT'],'a');f.write('sha256='+e['candidate_sha256']+'\n');f.write('bytes='+str(e['candidate_bytes'])+'\n');f.write('lines='+str(e['candidate_lines'])+'\n');f.close()
          PY
          test "$(sha256sum "$OUT/authority.lean"|awk '{print $1}')"="$AUTHORITY_SHA256";test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')"="${{ steps.generate.outputs.sha256 }}"
      - name: Audit source
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail;python3 - <<'PY'
          import json,re,os
          from pathlib import Path
          t=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text();f={'sorry':len(re.findall(r'(?<![A-Za-z0-9_])sorry(?![A-Za-z0-9_])',t)),'admit':len(re.findall(r'(?<![A-Za-z0-9_])admit(?![A-Za-z0-9_])',t)),'axiom':len(re.findall(r'^\s*axiom\s+',t,flags=re.M)),'unsafe':len(re.findall(r'^\s*unsafe\s+',t,flags=re.M)),'native_decide':t.count('native_decide'),'Lean.ofReduceBool':t.count('Lean.ofReduceBool')};Path(os.environ['OUT'],'AUDIT.json').write_text(json.dumps(f,indent=2,sort_keys=True)+'\n');assert not any(f.values()),f
          PY
      - name: Install exact Lean and Mathlib cache
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none>"$OUT/elan.log" 2>&1;export PATH="$HOME/.elan/bin:$PATH";echo "$HOME/.elan/bin">>"$GITHUB_PATH";elan toolchain install "$(tr -d '\r\n'<lean-toolchain)">"$OUT/toolchain.log" 2>&1;lake exe cache get>"$OUT/cache.log" 2>&1;lean --version|tee "$OUT/lean-version.txt";test "$(tr -d '\r\n'<"$OUT/lean-version.txt")"="$LEAN_VERSION_EXACT"
      - name: First direct chain
        id: first
        if: steps.guard.outputs.needed == 'true'
        shell: bash
        run: |
          set -euo pipefail;mkdir -p .lake/build/lib/lean/PrimalitySheafVerification "$OUT/first";run_one(){ n="$1";shift;set +e;timeout --signal=TERM --kill-after=30s 18000 lake env lean -DmaxHeartbeats=0 -DmaxRecDepth=1000000 "$@">"$OUT/first/$n.log" 2>&1;rc=$?;set -e;echo "$rc">"$OUT/first/$n.exit";};rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean;run_one Mock2 -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean PrimalitySheafVerification/Mock2.lean;if [ "$(cat "$OUT/first/Mock2.exit")" = 0 ];then run_one Mock2_Advanced -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean PrimalitySheafVerification/Mock2_Advanced.lean;else echo 99>"$OUT/first/Mock2_Advanced.exit";fi;if [ "$(cat "$OUT/first/Mock2_Advanced.exit")" = 0 ];then run_one Mock2_FunctionalAnalysis -o /tmp/fa-v81-first.olean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;else echo 99>"$OUT/first/Mock2_FunctionalAnalysis.exit";:>"$OUT/first/Mock2_FunctionalAnalysis.log";fi;python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          o=Path(os.environ['OUT'])/'first';ev=lambda n:int((o/(n+'.exit')).read_text().strip());log=(o/'Mock2_FunctionalAnalysis.log').read_text(errors='replace');e=len(re.findall(r'^.*?\.lean:\d+:\d+: error:',log,flags=re.M));r={'schema':'fa-v81-first-v1','Mock2_exit':ev('Mock2'),'Mock2_Advanced_exit':ev('Mock2_Advanced'),'FA_exit':ev('Mock2_FunctionalAnalysis'),'error_headers':e};r['true_pass']=r['Mock2_exit']==r['Mock2_Advanced_exit']==r['FA_exit']==0 and e==0;(o/'RESULT.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n');open(os.environ['GITHUB_OUTPUT'],'a').write('pass='+str(r['true_pass']).lower()+'\n');print(json.dumps(r,sort_keys=True))
          PY
      - id: commit
        name: Check in source-only candidate after first pass
        if: steps.first.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git checkout -B codex/fa-v81-exhaustive-pass;git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;git commit -m 'Codex: check in v81 exhaustive-resource FA pass source';git push --force origin HEAD:refs/heads/codex/fa-v81-exhaustive-pass;echo "sha=$(git rev-parse HEAD)">>"$GITHUB_OUTPUT"
      - name: Second direct chain from exact checked-in source
        id: second
        if: steps.first.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail;test "$(git rev-parse HEAD)"="${{ steps.commit.outputs.sha }}";test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')"="${{ steps.generate.outputs.sha256 }}";mkdir -p "$OUT/second";run_one(){ n="$1";shift;set +e;timeout --signal=TERM --kill-after=30s 18000 lake env lean -DmaxHeartbeats=0 -DmaxRecDepth=1000000 "$@">"$OUT/second/$n.log" 2>&1;rc=$?;set -e;echo "$rc">"$OUT/second/$n.exit";};rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean;run_one Mock2 -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean PrimalitySheafVerification/Mock2.lean;if [ "$(cat "$OUT/second/Mock2.exit")" = 0 ];then run_one Mock2_Advanced -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean PrimalitySheafVerification/Mock2_Advanced.lean;else echo 99>"$OUT/second/Mock2_Advanced.exit";fi;if [ "$(cat "$OUT/second/Mock2_Advanced.exit")" = 0 ];then run_one Mock2_FunctionalAnalysis -o /tmp/fa-v81-second.olean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;else echo 99>"$OUT/second/Mock2_FunctionalAnalysis.exit";:>"$OUT/second/Mock2_FunctionalAnalysis.log";fi;python3 - <<'PY'
          import json,os,re
          from pathlib import Path
          o=Path(os.environ['OUT'])/'second';ev=lambda n:int((o/(n+'.exit')).read_text().strip());log=(o/'Mock2_FunctionalAnalysis.log').read_text(errors='replace');e=len(re.findall(r'^.*?\.lean:\d+:\d+: error:',log,flags=re.M));r={'schema':'fa-v81-second-v1','Mock2_exit':ev('Mock2'),'Mock2_Advanced_exit':ev('Mock2_Advanced'),'FA_exit':ev('Mock2_FunctionalAnalysis'),'error_headers':e};r['true_pass']=r['Mock2_exit']==r['Mock2_Advanced_exit']==r['FA_exit']==0 and e==0;(o/'RESULT.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n');open(os.environ['GITHUB_OUTPUT'],'a').write('pass='+str(r['true_pass']).lower()+'\n');print(json.dumps(r,sort_keys=True))
          PY
      - id: seal
        name: Seal certified branch and promotion PR
        if: steps.second.outputs.pass == 'true'
        shell: bash
        env: { SOURCE_COMMIT: '${{ steps.commit.outputs.sha }}' }
        run: |
          set -euo pipefail;python3 - <<'PY'
          import hashlib,json,os
          from pathlib import Path
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');b=p.read_bytes();r={'schema':'fa-v81-certificate-v1','status':'FA_TRUE_PASS','source_commit':os.environ['SOURCE_COMMIT'],'candidate_sha256':hashlib.sha256(b).hexdigest(),'candidate_bytes':len(b),'candidate_lines':len(b.decode().splitlines()),'Mock2_exit':0,'Mock2_Advanced_exit':0,'FA_exit':0,'error_headers':0,'direct_lean_runs':2,'direct_lean_verified':True,'checked_in_source_verified':True,'toolchain':Path(os.environ['OUT'],'lean-version.txt').read_text().strip()};Path('build-logs/FA_TRUE_PASS.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n');Path(os.environ['OUT'],'FA_TRUE_PASS.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
          git add build-logs/FA_TRUE_PASS.json;git commit -m 'Codex: certify v81 twice-direct checked-in FA TRUE PASS';git push --force origin HEAD:refs/heads/codex/fa-v81-exhaustive-pass;git push --force origin HEAD:refs/heads/codex/fa-true-pass-certified;echo "sha=$(git rev-parse HEAD)">>"$GITHUB_OUTPUT";existing=$(gh pr list --head codex/fa-true-pass-certified --base codex/fa-exclusive-focus-20260814 --state open --json number --jq '.[0].number // empty');if [ -z "$existing" ];then gh pr create --head codex/fa-true-pass-certified --base codex/fa-exclusive-focus-20260814 --title 'Codex: promote v81 certified FA TRUE PASS' --body 'Twice-direct checked-in verification under Lean 4.33.0-rc1: Mock2=0, Mock2_Advanced=0, FA=0, zero errors, clean audit. See build-logs/FA_TRUE_PASS.json and v81 artifact.';fi
      - name: Publish v81 failure diagnostics
        if: always() && steps.guard.outputs.needed == 'true' && steps.second.outputs.pass != 'true'
        shell: bash
        run: |
          set -euo pipefail;python3 - <<'PY'
          import json,os
          from pathlib import Path
          o=Path(os.environ['OUT']);first=json.loads((o/'first/RESULT.json').read_text()) if (o/'first/RESULT.json').exists() else None;second=json.loads((o/'second/RESULT.json').read_text()) if (o/'second/RESULT.json').exists() else None;(o/'STATUS.json').write_text(json.dumps({'schema':'fa-v81-status-v1','status':'NOT_PASS','first':first,'second':second},indent=2,sort_keys=True)+'\n')
          PY
      - if: always() && steps.guard.outputs.needed == 'true'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: { name: 'codex-fa-v81-${{ steps.seal.outputs.sha || github.sha }}', path: 'build-logs/codex-fa-v81/*', if-no-files-found: error, retention-days: 90 }
      - name: Preserve actual v81 certification gate
        if: always() && steps.guard.outputs.needed == 'true'
        shell: bash
        run: "test '${{ steps.second.outputs.pass }}' = true"
