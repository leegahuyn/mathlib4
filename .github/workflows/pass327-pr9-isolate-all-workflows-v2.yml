name: Isolate PR9 to PASS 327 repair only v2

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pass327-pr9-isolate-all-workflows-v2.yml'

permissions:
  actions: write
  contents: write

concurrency:
  group: pass327-pr9-isolation-v2
  cancel-in-progress: false

jobs:
  isolate-and-relaunch:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout exact isolation head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 8
          persist-credentials: true

      - name: Cancel obsolete branch runs and preserve one exact v2 workflow
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci/fa319-isolated-20260807
        run: |
          set -euo pipefail
          trigger_head="$(git rev-parse HEAD)"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${trigger_head}"

          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending") | .id' \
            | sort -u \
            | while IFS= read -r run_id; do
                [[ -n "${run_id}" ]] || continue
                [[ "${run_id}" = "${GITHUB_RUN_ID}" ]] && continue
                gh api -X POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null 2>&1 || true
              done

          keep='.github/workflows/pass327-fa-mock3-qym-agent-v2.yml'
          test -s "${keep}"
          cp "${keep}" /tmp/pass327-fa-mock3-qym-agent-v2.yml
          find .github/workflows -maxdepth 1 -type f -delete
          cp /tmp/pass327-fa-mock3-qym-agent-v2.yml "${keep}"
          printf '\n# PR9 isolated relaunch v2 at %s.\n' "$(date -u +%FT%TZ)" >> "${keep}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'ci: isolate PR9 to one exact PASS 327 repair workflow'
          git push origin "HEAD:${BRANCH}"
