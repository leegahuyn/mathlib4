name: Codex FA API probe nested anti-dual topology v4
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-compact-normtop-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile nested anti-dual topology probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/NestedAntiDualProbe.lean <<'LEAN'
          import Mathlib
          noncomputable section
          open Filter Topology
          abbrev SAD (E : Type*) [NormedAddCommGroup E] [NormedSpace ℂ E] := E →L⋆[ℂ] ℂ
          variable {E : Type*} [NormedAddCommGroup E] [NormedSpace ℂ E]

          example (Tn : ℕ → E →L[ℂ] SAD E) (T : E →L[ℂ] SAD E) (eps : ℕ → ℝ)
              (hTail : ∀ N, ‖Tn N - T‖ ≤ eps N)
              (heps : Tendsto eps atTop (nhds 0)) :
              Tendsto Tn atTop (nhds T) := by
            change Tendsto Tn atTop
              (@nhds (E →L[ℂ] SAD E)
                (@UniformSpace.toTopologicalSpace (E →L[ℂ] SAD E)
                  (@PseudoMetricSpace.toUniformSpace (E →L[ℂ] SAD E)
                    SeminormedAddCommGroup.toPseudoMetricSpace)) T)
            rw [tendsto_iff_norm_sub_tendsto_zero]
            exact squeeze_zero (fun N => norm_nonneg (Tn N - T)) hTail heps

          example :
              (@UniformSpace.toTopologicalSpace (E →L[ℂ] SAD E)
                (@PseudoMetricSpace.toUniformSpace (E →L[ℂ] SAD E)
                  ContinuousLinearMap.toPseudoMetricSpace)) =
              (@UniformSpace.toTopologicalSpace (E →L[ℂ] SAD E)
                (@PseudoMetricSpace.toUniformSpace (E →L[ℂ] SAD E)
                  SeminormedAddCommGroup.toPseudoMetricSpace)) := by
            rfl
          LEAN
          lake env lean /tmp/NestedAntiDualProbe.lean
