name: GPT final13 R5 closed-goal proof probe v3

on:
  push:
    branches:
      - gpt/final13-gb0-r5-six-clean-20260820
    paths:
      - .github/final13-native-cleanup-r3-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-final13-r5-closed-goal-proof-probe-v3
  cancel-in-progress: true

env:
  BRANCH: gpt/final13-gb0-r5-six-clean-20260820
  GENERATOR: scripts/final13_r5_closed_goal_probe.py
  AUTHORITY: .github/final13-native-cleanup/R3_PROOFS_LATEST/Mock1_Advanced.best.lean

jobs:
  candidates:
    name: closed-goal-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - hrange-decide-norm
          - hrange-rfl-norm
          - hrange-decide-simp
          - hrange-decide-fold
          - hrange-rfl-simp
          - hrange-decide-simp-only
    env:
      VARIANT: ${{ matrix.variant }}
      OUT: /tmp/final13-r5-closed-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact six-error authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -s "$AUTHORITY"
          test "$(git hash-object --no-filters "$AUTHORITY")" = da99c78fdc2f6f894b55dd79af1438fa2d51a1b6
          python3 -m py_compile "$GENERATOR"
          git rev-parse HEAD | tee "$OUT/trigger-sha.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          elan toolchain install "$tc" > "$OUT/toolchain.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1

      - name: Generate and compile exact residual-goal reproducer
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 -B "$GENERATOR" "$VARIANT" "$OUT/Probe.lean"
          set +e
          start="$(date +%s)"
          lake env lean -DmaxErrors=100 -DwarningAsError=false \
            "$OUT/Probe.lean" > "$OUT/full.log" 2>&1
          rc=$?
          end="$(date +%s)"
          set -e
          errors="$(grep -Ec '^/tmp/[^:]+/Probe\.lean:[0-9]+:[0-9]+: error' "$OUT/full.log" || true)"
          warnings="$(grep -Ec '^/tmp/[^:]+/Probe\.lean:[0-9]+:[0-9]+: warning' "$OUT/full.log" || true)"
          panic="$(grep -Eic 'internal error|uncaught exception|panic(!|:|[[:space:]])' "$OUT/full.log" || true)"
          pass=false
          if [[ "$rc" -eq 0 && "$errors" -eq 0 && "$panic" -eq 0 ]]; then pass=true; fi
          printf '%s\n' "$rc" > "$OUT/exit.txt"
          printf '%s\n' "$errors" > "$OUT/errors.txt"
          printf '%s\n' "$warnings" > "$OUT/warnings.txt"
          printf '%s\n' "$panic" > "$OUT/panic.txt"
          printf '%s\n' "$((end-start))" > "$OUT/elapsed-seconds.txt"
          printf '{"variant":"%s","exit":%s,"errors":%s,"warnings":%s,"panic":%s,"elapsed_seconds":%s,"pass":%s}\n' \
            "$VARIANT" "$rc" "$errors" "$warnings" "$panic" "$((end-start))" "$pass" \
            | tee "$OUT/RESULT.json"
          cat "$OUT/full.log"
          test "$pass" = true

      - name: Upload immutable local-probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final13-r5-v3-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
