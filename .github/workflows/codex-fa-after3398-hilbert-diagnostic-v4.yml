name: Codex FA after3398 Hilbert diagnostic v4
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3398-hilbert-diagnostic-v4.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build diagnostic runner
        shell: bash
        run: |
          sed \
            -e 's/codex-fa-after3398-hilbert-exact-v3/codex-fa-after3398-hilbert-diagnostic-v4/g' \
            -e 's/one Mock2_FunctionalAnalysis 1/one Mock2_FunctionalAnalysis 20/' \
            scripts/codex_fa_after3398_hilbert_exact_v3.sh \
            > /tmp/codex_fa_after3398_hilbert_diagnostic_v4.sh
      - name: Attest patch and direct compile exact cumulative full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3398_hilbert_diagnostic_v4.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3398-hilbert-diagnostic-v4-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3398-hilbert-diagnostic-v4
          retention-days: 30
