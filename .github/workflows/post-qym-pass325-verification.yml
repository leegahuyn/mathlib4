name: Post-QYM pass325 verification

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: post-qym-pass325-verification
  cancel-in-progress: false

jobs:
  mock1-buildall-clean-audit:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/post-qym-pass325

    steps:
      - name: Clone latest verified branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout --detach "refs/remotes/origin/${BRANCH}"
          head_sha="$(git rev-parse HEAD)"
          echo "HEAD_SHA=${head_sha}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/artifacts" "${EVIDENCE}/audit" "${OUTDIR}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "head_sha=${head_sha}" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Static trust audit for final source set
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${EVIDENCE}/audit/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          root = Path("PrimalitySheafVerification")
          files = [
              *(root / f"Spt{i}.lean" for i in range(1, 8)),
              root / "Mock1.lean",
              root / "Mock1_Advanced.lean",
              root / "Mock2.lean",
              root / "Mock2_Advanced.lean",
              root / "Mock2_FunctionalAnalysis_Integrated.lean",
              root / "Mock2_FunctionalAnalysis.lean",
              root / "QYM.lean",
              root / "BuildAll.lean",
          ]

          def strip(src: str) -> str:
              out=[]; i=0; depth=0; string=False; escaped=False
              while i < len(src):
                  if depth:
                      if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                      elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                      else: out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif string:
                      ch=src[i]; out.append("\n" if ch == "\n" else " ")
                      if escaped: escaped=False
                      elif ch == "\\": escaped=True
                      elif ch == '"': string=False
                      i += 1
                  elif src.startswith("/-", i): depth=1; out.extend("  "); i += 2
                  elif src.startswith("--", i):
                      while i < len(src) and src[i] != "\n": out.append(" "); i += 1
                  elif src[i] == '"': string=True; out.append(" "); i += 1
                  else: out.append(src[i]); i += 1
              if depth or string: raise SystemExit("unterminated comment or string")
              return ''.join(out)

          checks={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for path in files:
              if not path.is_file():
                  print(f"MISSING {path}"); bad=True; continue
              code=strip(path.read_text(encoding='utf-8'))
              print(f"[{path}]")
              for name,pat in checks.items():
                  count=len(re.findall(pat,code)); print(f"{name}={count}"); bad |= count != 0
          if bad: raise SystemExit("final source trust audit failed")
          PY

      - name: Revalidate Mock1 family directly twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo 'phase,pass,module,exit_code,error_count,warning_count' > "${EVIDENCE}/compile-summary.csv"
          compile_one() {
            local phase="$1" pass="$2" module="$3"
            local path="PrimalitySheafVerification/${module}.lean"
            local log="${EVIDENCE}/logs/${phase}-${module}-pass${pass}.log"
            mkdir -p "${OUTDIR}"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "${path}" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s,%s\n' \
              "${phase}" "${pass}" "${module}" "${code}" "${errors}" "${warnings}" \
              >> "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              {
                grep -n 'error:' "${log}" | head -40 || true
                grep -n 'error:' "${log}" | tail -1 || true
                tail -360 "${log}" || true
              } > "${EVIDENCE}/logs/${phase}-${module}-pass${pass}-failure-summary.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"; then
              return 1
            fi
          }
          for pass in 1 2; do
            compile_one Mock1-family "${pass}" Mock1
            compile_one Mock1-family "${pass}" Mock1_Advanced
          done

      - name: Compile all modules and BuildAll in two clean passes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          modules=(
            Spt1 Spt2 Spt3 Spt4 Spt5 Spt6 Spt7
            Mock1 Mock1_Advanced Mock2 Mock2_Advanced
            Mock2_FunctionalAnalysis_Integrated
            Mock2_FunctionalAnalysis QYM BuildAll
          )
          compile_clean() {
            local pass="$1" module="$2"
            local log="${EVIDENCE}/logs/clean-${module}-pass${pass}.log"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s,%s\n' \
              clean "${pass}" "${module}" "${code}" "${errors}" "${warnings}" \
              >> "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              {
                grep -n 'error:' "${log}" | head -50 || true
                grep -n 'error:' "${log}" | tail -1 || true
                tail -420 "${log}" || true
              } > "${EVIDENCE}/logs/clean-${module}-pass${pass}-failure-summary.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"; then
              return 1
            fi
          }
          for pass in 1 2; do
            rm -rf "${OUTDIR}"
            mkdir -p "${OUTDIR}"
            for module in "${modules[@]}"; do
              compile_clean "${pass}" "${module}"
            done
            find "${OUTDIR}" -maxdepth 1 -type f \( -name '*.olean' -o -name '*.ilean' \) \
              -printf '%f\n' | sort > "${EVIDENCE}/artifacts-pass${pass}.txt"
          done
          cp "${OUTDIR}/BuildAll.olean" "${OUTDIR}/BuildAll.ilean" \
            "${OUTDIR}/QYM.olean" "${OUTDIR}/QYM.ilean" \
            "${EVIDENCE}/artifacts/"
          sha256sum "${OUTDIR}/BuildAll.olean" "${OUTDIR}/BuildAll.ilean" \
            "${OUTDIR}/QYM.olean" "${OUTDIR}/QYM.ilean" \
            | tee "${EVIDENCE}/build-provenance-sha256.txt"

      - name: Generate whole-file Spt5 axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src_path = Path("PrimalitySheafVerification/Spt5.lean")
          src = src_path.read_text(encoding="utf-8")

          # Remove strings and comments while preserving line boundaries.
          out=[]; i=0; depth=0; string=False; escaped=False
          while i < len(src):
              if depth:
                  if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                  elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                  else: out.append("\n" if src[i] == "\n" else " "); i += 1
              elif string:
                  ch=src[i]; out.append("\n" if ch == "\n" else " ")
                  if escaped: escaped=False
                  elif ch == "\\": escaped=True
                  elif ch == '"': string=False
                  i += 1
              elif src.startswith("/-", i): depth=1; out.extend("  "); i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n": out.append(" "); i += 1
              elif src[i] == '"': string=True; out.append(" "); i += 1
              else: out.append(src[i]); i += 1
          if depth or string: raise SystemExit("unterminated Spt5 comment or string")
          code=''.join(out)

          block_stack=[]
          namespaces=[]
          names=[]
          for line in code.splitlines():
              stripped=line.strip()
              ns=re.match(r"^namespace\s+([A-Za-z_][A-Za-z0-9_'.]*)\b", stripped)
              if ns:
                  parts=ns.group(1).split('.')
                  block_stack.append(("namespace", len(parts)))
                  namespaces.extend(parts)
                  continue
              if re.match(r"^section(?:\s+[A-Za-z_][A-Za-z0-9_']*)?\s*$", stripped):
                  block_stack.append(("section", 0)); continue
              if re.match(r"^end(?:\s+[A-Za-z_][A-Za-z0-9_'.]*)?\s*$", stripped):
                  if block_stack:
                      kind,count=block_stack.pop()
                      if kind == "namespace" and count:
                          del namespaces[-count:]
                  continue
              if re.search(r"\bprivate\s+(?:theorem|lemma)\b", stripped):
                  continue
              decl=re.search(
                  r"(?:^|\s)(?:theorem|lemma)\s+"
                  r"([A-Za-z_][A-Za-z0-9_'.]*)\b",
                  stripped,
              )
              if decl:
                  raw=decl.group(1)
                  full='.'.join([*namespaces, raw]) if namespaces else raw
                  if full not in names:
                      names.append(full)

          if not names:
              raise SystemExit("no public Spt5 theorem declarations discovered")
          audit=Path("PrimalitySheafVerification/Spt5WholeFileAxiomAudit.lean")
          lines=["import PrimalitySheafVerification.Spt5", ""]
          lines.extend(f"#print axioms {name}" for name in names)
          audit.write_text('\n'.join(lines)+'\n',encoding='utf-8')
          Path("/tmp/post-qym-pass325/audit/Spt5-declarations.txt").write_text(
              '\n'.join(names)+'\n',encoding='utf-8')
          print(f"generated {len(names)} Spt5 theorem audits")
          PY

      - name: Run and validate whole-file Spt5 axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          audit='PrimalitySheafVerification/Spt5WholeFileAxiomAudit.lean'
          log="${EVIDENCE}/audit/Spt5-whole-file-axioms.log"
          set +e
          lake env lean "${audit}" >"${log}" 2>&1
          code=$?
          set -e
          echo "${code}" > "${EVIDENCE}/audit/Spt5-audit-exit-code.txt"
          rm -f "${audit}"
          if [[ "${code}" -ne 0 ]]; then
            grep -n 'error:' "${log}" | head -50 || true
            tail -420 "${log}" || true
            exit "${code}"
          fi
          if grep -Eqi "sorryAx|declaration uses 'sorry'|Lean\.ofReduceBool" "${log}"; then
            echo 'forbidden axiom detected in Spt5 audit' >&2
            grep -Ein "sorryAx|declaration uses 'sorry'|Lean\.ofReduceBool" "${log}" || true
            exit 1
          fi
          python3 - "${log}" <<'PY' | tee "${EVIDENCE}/audit/Spt5-axiom-summary.txt"
          from pathlib import Path
          import re
          import sys

          text=Path(sys.argv[1]).read_text(encoding='utf-8',errors='replace')
          allowed={'propext','Classical.choice','Quot.sound'}
          observed=set()
          for bracket in re.findall(r"depends on axioms:\s*\[([^\]]*)\]", text):
              for item in bracket.split(','):
                  name=item.strip().strip("'\"")
                  if name: observed.add(name)
          forbidden=sorted(observed-allowed)
          print('observed=' + ','.join(sorted(observed)))
          print('forbidden=' + ','.join(forbidden))
          if forbidden: raise SystemExit(1)
          PY
          git diff --exit-code

      - name: Dispatch official CI consolidation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          printf '%s\n' "utc_completed=$(date -u +%FT%TZ)" \
            "head_sha=${HEAD_SHA}" >> "${EVIDENCE}/snapshot.txt"
          curl --fail --silent --show-error \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/pass326-official-ci-consolidation.yml/dispatches" \
            -d "{\"ref\":\"${BRANCH}\"}"

      - name: Upload pass325 verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: post-qym-pass325-${{ env.HEAD_SHA }}
          path: /tmp/post-qym-pass325
          if-no-files-found: warn
          retention-days: 30
