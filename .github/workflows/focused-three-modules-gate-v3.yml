name: Focus Mock2 Advanced FunctionalAnalysis QYM gate v3

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/focused-three-modules-gate-v3.yml'
      - 'scripts/focused_three_modules_gate_v3.sh'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-three-modules-gate-v3
  cancel-in-progress: false

jobs:
  advance-and-verify:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Clone exact triggering commit without source mutation
        shell: bash
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          lean --version
          lake --version
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Run the sequential focused verification engine
        shell: bash
        run: |
          set -euo pipefail
          chmod +x scripts/focused_three_modules_gate_v3.sh
          scripts/focused_three_modules_gate_v3.sh

      - name: Upload focused proof logs
        if: ${{ always() }}
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: focused-three-modules-v3-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            build-logs/focused-three-modules-v3
            build-logs/focused-three-modules-v3-pass.json
          if-no-files-found: warn
          retention-days: 30
