name: Promote first reverified FA Mock3 QYM winner

on:
  workflow_dispatch:
  push:
    branches:
      - ci/fa319-isolated-20260807
    paths:
      - '.github/workflows/promote-first-fa-mock3-qym-winner.yml'
      - '.promote-fa-winner-kick'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: promote-first-fa-mock3-qym-winner
  cancel-in-progress: true

jobs:
  poll-reverify-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR 9 head branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 1000
          persist-credentials: true

      - name: Poll isolated repair branches for a strict final marker
        id: winner
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            fix/fa-live-v6-tournament-20260808
            fix/fa-live-v5-tournament-20260808
            fix/fa-live-v4-declaration-20260808
            fix/fa-live-v3-batch-20260808
            fix/fa-live-v2-n-pass-20260808
            fix/fa-live-n-pass-20260808
            fix/fa359-final-isolated-20260808
          )
          selected=''
          for round in $(seq 1 150); do
            git fetch --no-tags origin \
              $(printf '+refs/heads/%s:refs/remotes/origin/%s ' "${branches[@]}") \
              >/tmp/promote-fetch.log 2>&1 || true
            for branch in "${branches[@]}"; do
              ref="refs/remotes/origin/${branch}"
              if git rev-parse --verify -q "${ref}" >/dev/null && \
                 git cat-file -e "${ref}:build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json" 2>/dev/null; then
                marker="$(git show "${ref}:build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json")"
                status="$(python3 -c 'import json,sys; print(json.load(sys.stdin).get("status", ""))' <<<"${marker}")"
                if [[ "${status}" == PASS ]]; then
                  selected="${branch}"
                  git show "${ref}:build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json" \
                    > /tmp/winner-marker.json
                  git show "${ref}:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
                    > /tmp/winner-Mock2_FunctionalAnalysis.lean
                  git rev-parse "${ref}" > /tmp/winner-head.txt
                  break 2
                fi
              fi
            done
            echo "No strict winner yet; poll ${round}/150"
            sleep 120
          done
          test -n "${selected}"
          echo "branch=${selected}" >> "${GITHUB_OUTPUT}"
          echo "winner_branch=${selected}"
          cat /tmp/winner-marker.json
          sha256sum /tmp/winner-Mock2_FunctionalAnalysis.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/promote-lean-version.txt
          lake --version | tee /tmp/promote-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/promote-cache.log

      - name: Apply only the verified FA source to the current PR 9 head
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/winner-Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > /tmp/promoted-fa-source.sha256

      - name: Reject forbidden proof escapes in all priority targets
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          targets = [Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock2_FunctionalAnalysis_Integrated*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('QYM*.lean'))
          forbidden = re.compile(
              r'(?m)^\s*(?:sorry|admit)\b|(?m)^\s*axiom\b|(?m)^\s*unsafe\b|'
              r'\bnative_decide\b|\bLean\.ofReduceBool\b'
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              match = forbidden.search(text)
              if match:
                  raise SystemExit(f'{path}: forbidden token {match.group(0)!r}')
          print('priority forbidden-token audit passed for', len(targets), 'files')
          PY

      - name: Reverify FA twice from current PR 9 tree
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/promote-evidence'
          mkdir -p "${root}" "${logs}"
          src='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          out="${root}/Mock2_FunctionalAnalysis"
          for n in 1 2; do
            rm -f "${out}.olean" "${out}.ilean"
            lake env lean -DmaxErrors=2000 \
              -o "${out}.olean" -i "${out}.ilean" "${src}" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.log" 2>&1
            test -s "${out}.olean" && test -s "${out}.ilean"
            ! grep -n 'error:' "${logs}/Mock2_FunctionalAnalysis-${n}.log"
            sha256sum "${src}" "${out}.olean" "${out}.ilean" \
              > "${logs}/Mock2_FunctionalAnalysis-${n}.sha256"
          done
          echo FA_2X_REVERIFIED_ON_PR9 > "${logs}/FA_2X_PASS.txt"

      - name: Reverify Integrated and every actual Mock3 twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/promote-evidence'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <({
            find PrimalitySheafVerification -maxdepth 1 -type f \
              -name 'Mock2_FunctionalAnalysis_Integrated*.lean'
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean'
          } | sort -u)
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/Integrated-Mock3-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo INTEGRATED_MOCK3_2X_REVERIFIED_ON_PR9 \
            > "${logs}/INTEGRATED_MOCK3_2X_PASS.txt"

      - name: Reverify every QYM target twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          root='.lake/build/lib/lean/PrimalitySheafVerification'
          logs='/tmp/promote-evidence'
          compile_twice() {
            local src="$1" base out
            base="$(basename "${src}" .lean)"
            out="${root}/${base}"
            for n in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "${logs}/${base}-${n}.log" 2>&1
              test -s "${out}.olean" && test -s "${out}.ilean"
              ! grep -n 'error:' "${logs}/${base}-${n}.log"
              sha256sum "${src}" "${out}.olean" "${out}.ilean" \
                > "${logs}/${base}-${n}.sha256"
            done
          }
          mapfile -t targets < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'QYM*.lean' | sort
          )
          test ${#targets[@]} -gt 0
          printf '%s\n' "${targets[@]}" > "${logs}/QYM-targets.txt"
          for src in "${targets[@]}"; do compile_twice "${src}"; done
          echo QYM_2X_REVERIFIED_ON_PR9 > "${logs}/QYM_2X_PASS.txt"

      - name: Commit only after all three stages reverify twice
        shell: bash
        env:
          WINNER_BRANCH: ${{ steps.winner.outputs.branch }}
        run: |
          set -euo pipefail
          test -s /tmp/promote-evidence/FA_2X_PASS.txt
          test -s /tmp/promote-evidence/INTEGRATED_MOCK3_2X_PASS.txt
          test -s /tmp/promote-evidence/QYM_2X_PASS.txt
          python3 - <<'PY'
          import hashlib, json, os
          from datetime import datetime, timezone
          from pathlib import Path
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          marker = {
              'status': 'PASS',
              'checked_at_utc': datetime.now(timezone.utc).isoformat(),
              'winner_branch': os.environ['WINNER_BRANCH'],
              'winner_head': Path('/tmp/winner-head.txt').read_text().strip(),
              'pr9_base_head_before_commit': os.popen('git rev-parse HEAD').read().strip(),
              'fa_source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'stages': {
                  'Mock2_FunctionalAnalysis': {'runs': 2, 'exit_code': 0},
                  'Integrated_and_all_actual_Mock3': {'runs': 2, 'exit_code': 0},
                  'all_QYM': {'runs': 2, 'exit_code': 0},
              },
          }
          path = Path('build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json')
          path.parent.mkdir(parents=True, exist_ok=True)
          path.write_text(json.dumps(marker, indent=2), encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          git commit -m 'fix: promote reverified FA Integrated Mock3 QYM two-run PASS'
          git push origin HEAD:ci/fa319-isolated-20260807

      - name: Comment PR 9 with reverified marker
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh pr comment 9 --repo leegahuyn/mathlib4 \
            --body-file build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json

      - name: Upload promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: promoted-fa-mock3-qym-${{ github.sha }}
          path: |
            /tmp/winner-marker.json
            /tmp/winner-head.txt
            /tmp/promoted-fa-source.sha256
            /tmp/promote-lean-version.txt
            /tmp/promote-lake-version.txt
            /tmp/promote-cache.log
            /tmp/promote-evidence
            build-logs/FINAL_FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90
