name: Codex FA API probe extendOfNorm signatures v2

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-extendofnorm-signatures-v2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Print exact signatures
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeExtendOfNormSignatures.lean <<'LEAN'
          import Mathlib
          #check LinearMap.extendOfNorm
          #check LinearMap.extendOfNorm_eq
          #check LinearMap.norm_extendOfNorm_apply_le
          #check LinearMap.extendOfNorm_apply
          #check LinearMap.extendOfNorm_unique
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeExtendOfNormSignatures.lean | tee /tmp/extendofnorm-signatures.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-extendofnorm-signatures-v2-${{ github.sha }}
          path: /tmp/extendofnorm-signatures.log
          if-no-files-found: warn
          retention-days: 7
