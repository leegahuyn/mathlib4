name: Codex FA dynamic extended clusters through 3002

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-dynamic-extended-3002.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-dynamic-extended-3002
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31495034235"
  BASE_JOB_ID: "93790488049"
  BASE_HEAD_SHA: "989132c0ac49fdfd7ff637a5b77c45b73e02f32f"
  BASE_ARTIFACT_ID: "9103368138"
  BASE_ARTIFACT_NAME: "codex-fa506r2-full-diagnostic-d0a3-989132c0ac49fdfd7ff637a5b77c45b73e02f32f"
  BASE_ARTIFACT_SIZE: "1446570"
  BASE_ARTIFACT_DIGEST: "sha256:eb21e1d4fe0c0652e6d8463592fd4c550005f29bcb9611f18c8533ba888bd6f4"
  BASE_SOURCE_SHA256: "d0a3decee1c0a7a781d14fdf122e235d71d8f210bb65a894dc4e518821bf03ec"
  BASE_SOURCE_BYTES: "2702252"
  BASE_SOURCE_LINES: "60573"
  FA_MAX_ERRORS: "2000"

jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Live-attest exact d0a3 base
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-dynamic-extended-3002
          mkdir -p "$OUT" /tmp/fa-3002-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-3002-base.zip
          unzip -q /tmp/fa-3002-base.zip -d /tmp/fa-3002-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-dynamic-extended-3002')
          run=json.loads((out/'base-run.json').read_text())
          job=json.loads((out/'base-job.json').read_text())
          artifact=json.loads((out/'base-artifact.json').read_text())
          archive=Path('/tmp/fa-3002-base.zip').read_bytes()
          checks={
            'run_id':run.get('id')==int(os.environ['BASE_RUN_ID']),
            'run_head':run.get('head_sha')==os.environ['BASE_HEAD_SHA'],
            'job_id':job.get('id')==int(os.environ['BASE_JOB_ID']),
            'job_run':job.get('run_id')==int(os.environ['BASE_RUN_ID']),
            'artifact_id':artifact.get('id')==int(os.environ['BASE_ARTIFACT_ID']),
            'artifact_name':artifact.get('name')==os.environ['BASE_ARTIFACT_NAME'],
            'artifact_size':artifact.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']),
            'artifact_digest':artifact.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'],
            'artifact_live':artifact.get('expired') is False,
            'archive_digest':'sha256:'+hashlib.sha256(archive).hexdigest()==os.environ['BASE_ARTIFACT_DIGEST'],
          }
          if not all(checks.values()): raise SystemExit('base attestation failed: '+repr([k for k,v in checks.items() if not v]))
          hits=sorted(p for p in Path('/tmp/fa-3002-base').rglob('Mock2_FunctionalAnalysis.lean') if 'PrimalitySheafVerification' in p.as_posix())
          if not hits: raise SystemExit('base source missing')
          for p in hits:
            data=p.read_bytes()
            if hashlib.sha256(data).hexdigest()!=os.environ['BASE_SOURCE_SHA256']: raise SystemExit('base SHA drift')
            if len(data)!=int(os.environ['BASE_SOURCE_BYTES']) or len(data.decode('utf-8').splitlines())!=int(os.environ['BASE_SOURCE_LINES']): raise SystemExit('base size/line drift')
            if b'\r' in data: raise SystemExit('base CR drift')
          selected=min(hits,key=lambda p:(len(p.parts),p.as_posix()))
          (out/'ATTESTED_BASE_SOURCE.txt').write_text(str(selected.resolve())+'\n')
          (out/'BASE_ATTESTATION.json').write_text(json.dumps({'checks':checks,'selected':str(selected.resolve())},indent=2,sort_keys=True)+'\n')
          PY

      - name: Apply cumulative clusters through 2967
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-dynamic-extended-3002
          BASE_SOURCE="$(cat "$OUT/ATTESTED_BASE_SOURCE.txt")"
          python3 scripts/fa_dynamic_apply_repairs.py \
            --base-source "$BASE_SOURCE" \
            --manifest scripts/fa_dynamic_active_repairs.json \
            --target /tmp/fa-3002-early.lean \
            --audit-out "$OUT/PREPARATION_EARLY.json"
          python3 scripts/fa_dynamic_apply_repairs.py \
            --base-source /tmp/fa-3002-early.lean \
            --manifest scripts/fa_dynamic_supplemental_2939_2967.json \
            --target /tmp/fa-3002-through2967.lean \
            --audit-out "$OUT/PREPARATION_2967.json"

      - name: Apply namespace-local environment root and selected 2974-3002 repairs
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-dynamic-extended-3002
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          src=Path('/tmp/fa-3002-through2967.lean')
          text=src.read_text(encoding='utf-8')
          lib=json.loads(Path('scripts/fa_d0a3_idx2974_3002_full_inventory_gated_overrides.json').read_text(encoding='utf-8'))
          selected=[x for x in lib['environment_replacements'] if x['id']=='fixed_phase_adjoint_cutoff_namespace_environment']
          if len(selected)!=1: raise SystemExit('expected one selected namespace environment replacement')
          rep=selected[0]['replacement']
          old,new=rep['old_fragment'],rep['new_fragment']
          if text.count(old)!=1 or text.count(new)!=0: raise SystemExit('namespace environment fragment identity failed')
          text=text.replace(old,new,1)
          env_path=Path('/tmp/fa-3002-environment.lean')
          env_path.write_text(text,encoding='utf-8',newline='\n')
          decl_re=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          names=[m.group('name') for m in decl_re.finditer(text)]
          repairs=[]
          for root in lib['repairs']:
            for r in root['replacements']:
              repairs.append({
                'declaration_index':root['declaration_index'],
                'declaration_name':root['declaration_name'],
                'header_sha256':root['header_sha256'],
                'old_fragment':r['old_fragment'],
                'new_fragment':r['new_fragment'],
              })
          manifest={
            'schema':'fa-dynamic-generated-idx2974-3002-v1',
            'base_source_sha256':hashlib.sha256(env_path.read_bytes()).hexdigest(),
            'base_declaration_sequence_sha256':hashlib.sha256(('\n'.join(names)).encode()).hexdigest(),
            'repairs':repairs,
          }
          Path('/tmp/fa-3002-proof-manifest.json').write_text(json.dumps(manifest,indent=2,sort_keys=True)+'\n')
          audit={
            'environment_replacement_id':selected[0]['id'],
            'environment_old_sha256':rep['old_sha256'],
            'environment_new_sha256':rep['new_sha256'],
            'environment_scope':'FixedPhaseAdjointCutoffCore namespace only',
            'new_declarations':0,
            'proof_repair_indices':[r['declaration_index'] for r in repairs],
          }
          Path('build-logs/codex-fa-dynamic-extended-3002/ENVIRONMENT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          PY
          python3 scripts/fa_dynamic_apply_repairs.py \
            --base-source /tmp/fa-3002-environment.lean \
            --manifest /tmp/fa-3002-proof-manifest.json \
            --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --audit-out "$OUT/PREPARATION_3002.json"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          a=json.loads(Path('build-logs/codex-fa-dynamic-extended-3002/PREPARATION_3002.json').read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
            f.write('CANDIDATE_SHA256='+a['candidate_source_sha256']+'\n')
            f.write('CANDIDATE_BYTES='+str(a['candidate_bytes'])+'\n')
            f.write('CANDIDATE_LINES='+str(a['candidate_lines'])+'\n')
          PY

      - name: Install repository-pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-dynamic-extended-3002
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/fa-3002-elan-init.sh
          sh /tmp/fa-3002-elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="${HOME}/.elan/bin:${PATH}"
          toolchain="$(tr -d '\r\n' < lean-toolchain)"
          elan toolchain install "$toolchain" > "$OUT/toolchain-install.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          lake exe cache get > "$OUT/cache-get.log" 2>&1

      - name: Direct full-source compile in dependency order
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          OUT=build-logs/codex-fa-dynamic-extended-3002
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          attest() {
            test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA256"
            test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"
            test "$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_LINES"
          }
          compile_one() {
            local stem="$1" cap="$2"
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f -- "$olean" "$ilean"
            printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$cap" "$olean" "$ilean" "$src" > "$OUT/${stem}.command"
            : > "$OUT/${stem}.executed"
            set +e
            lake env lean "-DmaxErrors=${cap}" -DwarningAsError=false -o "$olean" -i "$ilean" "$src" > "$OUT/${stem}.log" 2>&1
            local code=$?
            set -e
            printf '%s\n' "$code" > "$OUT/${stem}.exit"
          }
          compile_one Mock2 3
          compile_one Mock2_Advanced 3
          attest
          compile_one Mock2_FunctionalAnalysis "$FA_MAX_ERRORS"
          attest
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-dynamic-extended-3002')
          srcp=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          source=srcp.read_text(encoding='utf-8')
          dr=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          er=re.compile(r'^.+?\.lean:(?P<line>[0-9]+):(?P<col>[0-9]+): error(?:\((?P<code>[^)\r\n]+)\))?:(?P<message>.*)$')
          ds=list(dr.finditer(source)); starts=[source.count('\n',0,m.start())+1 for m in ds]
          errors=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace').splitlines():
            m=er.match(raw)
            if not m: continue
            line=int(m.group('line')); pos=bisect_right(starts,line)-1
            errors.append({'line':line,'col':int(m.group('col')),'diagnostic_code':m.group('code'),'message':m.group('message').lstrip(),'declaration':ds[pos].group('name') if pos>=0 else None,'declaration_index':pos if pos>=0 else None,'declaration_start_line':starts[pos] if pos>=0 else None})
          exits={s:int((out/f'{s}.exit').read_text()) for s in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}
          a1=json.loads((out/'PREPARATION_EARLY.json').read_text()); a2=json.loads((out/'PREPARATION_2967.json').read_text()); a3=json.loads((out/'PREPARATION_3002.json').read_text())
          first=errors[0] if errors else {}; data=srcp.read_bytes()
          metric={'schema':'fa-dynamic-extended-3002-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(data).hexdigest(),'source_bytes':len(data),'source_lines':len(source.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(data).hexdigest()==os.environ['CANDIDATE_SHA256'],'Mock2_executed':(out/'Mock2.executed').is_file(),'Mock2_exit':exits['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').is_file(),'Mock2_Advanced_exit':exits['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').is_file(),'FA_exit':exits['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{s}.executed').is_file() for s in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_error_headers_captured':len(errors),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_message':first.get('message'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_error_declaration_start_line':first.get('declaration_start_line'),'maxErrors_cap':int(os.environ['FA_MAX_ERRORS']),'public_declaration_headers_preserved':a1['public_declaration_headers_preserved'] and a2['public_declaration_headers_preserved'] and a3['public_declaration_headers_preserved'],'declaration_sequence_preserved':a1['declaration_sequence_preserved'] and a2['declaration_sequence_preserved'] and a3['declaration_sequence_preserved'],'repair_declaration_indices':[x['declaration_index'] for x in a1['repairs_applied']]+[x['declaration_index'] for x in a2['repairs_applied']]+[x['declaration_index'] for x in a3['repairs_applied']]}
          (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          (out/'ERROR_HEADERS.json').write_text(json.dumps(errors,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact candidate and complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-dynamic-extended-3002-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-dynamic-extended-3002
          if-no-files-found: warn
          retention-days: 30

      - name: Publish run locator status
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FA_EXIT: ${{ steps.compile.outputs.fa_exit }}
        shell: bash
        run: |
          state=failure
          if [[ "${FA_EXIT:-}" == "0" ]]; then state=success; fi
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" \
            -f state="$state" \
            -f context='codex/fa-dynamic-extended-3002' \
            -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Preserve authoritative FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.compile.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86
          exit "$FA_EXIT"
