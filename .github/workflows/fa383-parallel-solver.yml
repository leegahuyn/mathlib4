name: PASS 383 parallel FA solver and ordered downstream verifier

on:
  push:
    branches:
      - fix/fa383-parallel-solver-20260809
    paths:
      - '.github/workflows/fa383-parallel-solver.yml'
      - 'scripts/fa383_parallel_solver.py'
      - 'scripts/fa383_select_and_verify.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

jobs:
  solve-fa:
    name: solve-${{ matrix.strategy }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - strategy: dialogue
            primary_model: openai/gpt-5
          - strategy: api
            primary_model: openai/gpt-4.1
          - strategy: calc
            primary_model: openai/gpt-4o
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout latest PASS 383 branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa383-parallel-solver-20260809
          fetch-depth: 1500
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run ${{ matrix.strategy }} FA solver
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          out="/tmp/fa383-${{ matrix.strategy }}"
          python3 scripts/fa383_parallel_solver.py \
            --strategy '${{ matrix.strategy }}' \
            --primary-model '${{ matrix.primary_model }}' \
            --output-dir "${out}" \
            --max-frontiers 12 \
            --max-revisions 4 \
            > "${out}-console.log" 2>&1
          rc=$?
          set -e
          mkdir -p "${out}"
          cp "${out}-console.log" "${out}/console.log"
          cat "${out}/console.log"
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Ensure solver artifact is complete
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/fa383-${{ matrix.strategy }}"
          test -s "${out}/best-source.lean"
          test -s "${out}/best-metric.json"
          test -s "${out}/state.json"
          sha256sum "${out}/best-source.lean" > "${out}/best-source.sha256"
          {
            echo "strategy=${{ matrix.strategy }}"
            echo "primary_model=${{ matrix.primary_model }}"
            echo "solver_exit_code=${{ steps.solver.outputs.exit_code }}"
            cat "${out}/best-metric.json"
            cat "${out}/state.json"
          } > "${out}/solver-summary.txt"

      - name: Upload ${{ matrix.strategy }} candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa383-candidate-${{ matrix.strategy }}-${{ github.sha }}
          path: /tmp/fa383-${{ matrix.strategy }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  select-and-verify:
    name: select-best-and-verify-order
    needs: solve-fa
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 383 branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa383-parallel-solver-20260809
          fetch-depth: 1600
          persist-credentials: true

      - name: Download all FA solver candidates
        uses: actions/download-artifact@v4
        with:
          pattern: fa383-candidate-*
          path: /tmp/fa383-candidates
          merge-multiple: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Select best FA source and verify required order
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA383_VERIFY_MODELS: 'openai/gpt-5,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa383-aggregate
          mkdir -p build-logs/fa383-aggregate
          python3 scripts/fa383_select_and_verify.py \
            --candidates-root /tmp/fa383-candidates \
            --evidence-dir build-logs/fa383-aggregate \
            > build-logs/fa383-aggregate/console.log 2>&1
          rc=$?
          set -e
          cat build-logs/fa383-aggregate/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Create concise authoritative status
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          dir=build-logs/fa383-aggregate
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          root = Path('build-logs/fa383-aggregate')
          status_path = root / 'FINAL_STATUS.json'
          status = json.loads(status_path.read_text()) if status_path.exists() else {
              'complete': False,
              'stage': 'verifier-did-not-create-status',
          }
          targets = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          status['verify_exit_code'] = '${{ steps.verify.outputs.exit_code }}'
          status['head_sha'] = '${{ github.sha }}'
          status['sources'] = {
              str(path): hashlib.sha256(path.read_bytes()).hexdigest()
              for path in targets if path.exists()
          }
          status['marker_exists'] = (root / 'ALL_REQUIRED_TARGETS_2X_PASS').exists()
          complete = bool(status.get('complete') and status['marker_exists'] and status['verify_exit_code'] == '0')
          status['authoritative_complete'] = complete
          (root / 'AUTHORITATIVE_STATUS.json').write_text(json.dumps(status, indent=2))
          lines = [
              f"authoritative_complete={str(complete).lower()}",
              f"verify_exit_code={status['verify_exit_code']}",
              f"stage={status.get('stage')}",
              f"marker_exists={str(status['marker_exists']).lower()}",
          ]
          if 'metric' in status:
              lines.append(f"metric={json.dumps(status['metric'], sort_keys=True)}")
          for module in status.get('modules', []):
              lines.append(f"{module.get('module')}={module.get('status')} sha256={module.get('source_sha256')}")
          (root / 'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines) + '\n')
          PY
          cat "${dir}/AUTHORITATIVE_STATUS.txt"

      - name: Audit forbidden executable tokens in all required targets
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          targets = [
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
              *sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          patterns = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'global_axiom': r'(?m)^\s*(?:public\s+)?axiom\b',
              'unsafe': r'(?m)^\s*unsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
          }
          def code_only(text: str) -> str:
              out=[]; i=0; depth=0; string=False; esc=False
              while i < len(text):
                  if depth:
                      if text.startswith('/-', i): depth += 1; out.extend('  '); i += 2; continue
                      if text.startswith('-/', i): depth -= 1; out.extend('  '); i += 2; continue
                      out.append('\n' if text[i] == '\n' else ' '); i += 1; continue
                  if string:
                      ch=text[i]; out.append('\n' if ch == '\n' else ' ')
                      if esc: esc=False
                      elif ch == '\\': esc=True
                      elif ch == '"': string=False
                      i += 1; continue
                  if text.startswith('/-', i): depth=1; out.extend('  '); i += 2; continue
                  if text.startswith('--', i):
                      while i < len(text) and text[i] != '\n': out.append(' '); i += 1
                      continue
                  if text[i] == '"': string=True; out.append(' '); i += 1; continue
                  out.append(text[i]); i += 1
              return ''.join(out)
          report = {}
          for path in targets:
              if not path.exists():
                  continue
              code = code_only(path.read_text())
              report[str(path)] = {name: len(re.findall(pattern, code)) for name, pattern in patterns.items()}
          out = Path('build-logs/fa383-aggregate/FORBIDDEN_TOKEN_AUDIT.json')
          out.write_text(json.dumps(report, indent=2))
          bad = {path: counts for path, counts in report.items() if any(counts.values())}
          if bad:
              raise SystemExit(f'forbidden executable tokens: {bad}')
          PY

      - name: Commit best verified or improved sources to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          for path in PrimalitySheafVerification/Mock3*.lean; do
            test -e "${path}" && git add "${path}"
          done
          git add PrimalitySheafVerification/QYM.lean
          git add build-logs/fa383-aggregate/AUTHORITATIVE_STATUS.json \
                  build-logs/fa383-aggregate/AUTHORITATIVE_STATUS.txt \
                  build-logs/fa383-aggregate/FORBIDDEN_TOKEN_AUDIT.json
          for path in build-logs/fa383-aggregate/ALL_REQUIRED_TARGETS_2X_PASS \
                      build-logs/fa383-aggregate/FINAL_STATUS.json \
                      build-logs/fa383-aggregate/fa-selection.json; do
            test -f "${path}" && git add "${path}"
          done
          git diff --cached --quiet && exit 0
          if test -f build-logs/fa383-aggregate/ALL_REQUIRED_TARGETS_2X_PASS; then
            message='fix: obtain FA Integrated Mock3 and QYM 2x PASS'
          else
            message='fix: preserve best PASS 383 FA frontier'
          fi
          git commit -m "${message}"
          git push origin HEAD:fix/fa383-parallel-solver-20260809

      - name: Upload authoritative PASS 383 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa383-authoritative-${{ github.sha }}
          path: |
            build-logs/fa383-aggregate
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce the actual final result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${VERIFY_EXIT_CODE:-}"
          test -f build-logs/fa383-aggregate/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${VERIFY_EXIT_CODE}"
