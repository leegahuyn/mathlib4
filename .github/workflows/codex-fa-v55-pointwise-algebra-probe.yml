name: Codex FA v55 pointwise algebra API probe
run-name: "Codex: probe exact FA scaled-coordinate identities"

on:
  push:
    branches: [codex/fa-exclusive-focus-20260814]
    paths:
      - .github/workflows/codex-fa-v55-pointwise-algebra-probe.yml
  workflow_dispatch:

permissions:
  contents: read

# This is a narrow pinned-Mathlib API/algebra probe, not a module PASS gate.
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
      - name: Compile exact coordinate and algebra alternatives
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/FAV55PointwiseAlgebra.lean <<'LEAN'
          import Mathlib

          open scoped ComplexConjugate

          example (L : ℝ) (hL : L ≠ 0) (x : Fin 2 → ℝ) :
              (L • Complex.measurableEquivPi.symm x).re * L⁻¹ = x 0 := by
            rw [Complex.measurableEquivPi_symm_apply]
            simp [hL, mul_assoc]

          example (L : ℝ) (hL : L ≠ 0) (x : Fin 2 → ℝ) :
              L⁻¹ * (L • Complex.measurableEquivPi.symm x).im = x 1 := by
            rw [Complex.measurableEquivPi_symm_apply]
            simp [hL, mul_assoc]

          example (L : ℝ) (hL : L ≠ 0) (x : Fin 2 → ℝ)
              (f₀ f₁ : UnitAddCircle → ℂ) (z : ℂ) :
              f₀ (((L • Complex.measurableEquivPi.symm x).re * L⁻¹ : ℝ) : UnitAddCircle) *
                  f₁ ((L⁻¹ * (L • Complex.measurableEquivPi.symm x).im : ℝ) : UnitAddCircle) * z =
                z * f₀ ((x 0 : ℝ) : UnitAddCircle) *
                  f₁ ((x 1 : ℝ) : UnitAddCircle) := by
            have hre :
                (L • Complex.measurableEquivPi.symm x).re * L⁻¹ = x 0 := by
              rw [Complex.measurableEquivPi_symm_apply]
              simp [hL, mul_assoc]
            have him :
                L⁻¹ * (L • Complex.measurableEquivPi.symm x).im = x 1 := by
              rw [Complex.measurableEquivPi_symm_apply]
              simp [hL, mul_assoc]
            rw [hre, him]
            ring

          example (L : ℝ) (hL : L ≠ 0) (z u : ℂ) :
              (L : ℂ) ^ 2 * (star (((L : ℂ)⁻¹) * z) * u) =
                (L : ℂ) * (star z * u) := by
            simp only [map_mul, starRingEnd_apply, Complex.star_def,
              map_inv₀, Complex.conj_ofReal]
            field_simp [hL]

          example (L : ℝ) (hL : L ≠ 0) (z u : ℂ) :
              (L : ℂ) ^ 2 * ((((L : ℂ)⁻¹) * z) * u) =
                (L : ℂ) * (z * u) := by
            field_simp [hL]
          LEAN
          lake env lean -DwarningAsError=false /tmp/FAV55PointwiseAlgebra.lean \
            2>&1 | tee /tmp/FAV55PointwiseAlgebra.log
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v55-pointwise-algebra-${{ github.sha }}
          path: |
            /tmp/FAV55PointwiseAlgebra.lean
            /tmp/FAV55PointwiseAlgebra.log
          retention-days: 30
