name: Pass327 ordered completion controller

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/pass327-ordered-controller.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: write
  checks: read
  pull-requests: write

concurrency:
  group: pass327-ordered-completion-controller
  cancel-in-progress: true

jobs:
  ordered-controller:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GH_TOKEN: ${{ github.token }}
      EVIDENCE: /tmp/pass327-controller

    steps:
      - name: Initialize controller evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "controller_run=${GITHUB_RUN_ID}" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Run ordered verification and consolidation workflows
        shell: bash
        run: |
          set -euo pipefail

          remote_head() {
            gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" \
              --jq '.object.sha'
          }

          latest_matching_run() {
            local workflow="$1" head_sha="$2"
            gh api \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/runs?branch=${BRANCH//\//%2F}&per_page=50" \
              --jq ".workflow_runs | map(select(.head_sha == \"${head_sha}\")) | sort_by(.created_at) | reverse | .[0] // {}"
          }

          wait_run() {
            local run_id="$1" label="$2"
            for attempt in $(seq 1 720); do
              data="$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}")"
              status="$(jq -r '.status' <<<"${data}")"
              conclusion="$(jq -r '.conclusion // ""' <<<"${data}")"
              printf '%s,%s,%s,%s,%s\n' \
                "$(date -u +%FT%TZ)" "${label}" "${run_id}" "${status}" "${conclusion}" \
                | tee -a "${EVIDENCE}/run-monitor.csv"
              if [[ "${status}" = completed ]]; then
                if [[ "${conclusion}" != success ]]; then
                  echo "${label} failed: run=${run_id} conclusion=${conclusion}" >&2
                  gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/jobs?per_page=100" \
                    > "${EVIDENCE}/${label}-jobs.json"
                  return 1
                fi
                return 0
              fi
              sleep 30
            done
            echo "${label} did not complete within controller polling bound" >&2
            return 1
          }

          ensure_success() {
            local workflow="$1" label="$2" expected_head="$3"
            local data run_id status conclusion dispatch_epoch
            data="$(latest_matching_run "${workflow}" "${expected_head}")"
            run_id="$(jq -r '.id // empty' <<<"${data}")"
            status="$(jq -r '.status // empty' <<<"${data}")"
            conclusion="$(jq -r '.conclusion // empty' <<<"${data}")"

            if [[ -n "${run_id}" && "${status}" = completed && "${conclusion}" = success ]]; then
              echo "${label}: reusing successful run ${run_id} on ${expected_head}" \
                | tee -a "${EVIDENCE}/decisions.txt"
              return 0
            fi
            if [[ -n "${run_id}" && "${status}" != completed ]]; then
              echo "${label}: waiting existing run ${run_id} on ${expected_head}" \
                | tee -a "${EVIDENCE}/decisions.txt"
              wait_run "${run_id}" "${label}"
              return
            fi

            dispatch_epoch="$(date +%s)"
            echo "${label}: dispatching ${workflow} on ${expected_head}" \
              | tee -a "${EVIDENCE}/decisions.txt"
            gh api -X POST \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/dispatches" \
              -f ref="${BRANCH}"

            run_id=''
            for attempt in $(seq 1 60); do
              data="$(latest_matching_run "${workflow}" "${expected_head}")"
              candidate="$(jq -r '.id // empty' <<<"${data}")"
              created="$(jq -r '.created_at // empty' <<<"${data}")"
              if [[ -n "${candidate}" && -n "${created}" ]]; then
                created_epoch="$(date -d "${created}" +%s)"
                if [[ "${created_epoch}" -ge "${dispatch_epoch}" ]]; then
                  run_id="${candidate}"
                  break
                fi
              fi
              sleep 5
            done
            if [[ -z "${run_id}" ]]; then
              echo "could not discover dispatched ${label} run" >&2
              return 1
            fi
            wait_run "${run_id}" "${label}"
          }

          echo 'timestamp,label,run_id,status,conclusion' > "${EVIDENCE}/run-monitor.csv"

          head_before="$(remote_head)"
          ensure_success ordered-first-three-pass324.yml pass324 "${head_before}"

          head_after_first_three="$(remote_head)"
          printf '%s\n' "first_three_head=${head_after_first_three}" \
            | tee -a "${EVIDENCE}/snapshot.txt"
          ensure_success post-qym-pass325-verification.yml pass325 "${head_after_first_three}"

          ensure_success pass326-official-ci-consolidation.yml pass326 "${head_after_first_three}"

          final_head="$(remote_head)"
          printf '%s\n' "final_consolidated_head=${final_head}" \
            | tee -a "${EVIDENCE}/snapshot.txt"
          ensure_success primality-sheaf-ci.yml official-ci "${final_head}"

      - name: Require all checks on final head to be green
        shell: bash
        run: |
          set -euo pipefail
          final_head="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/heads/${BRANCH}" --jq '.object.sha')"
          for attempt in $(seq 1 360); do
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "repos/${GITHUB_REPOSITORY}/commits/${final_head}/check-runs?per_page=100" \
              > "${EVIDENCE}/final-check-runs.json"
            state="$(python3 - "${EVIDENCE}/final-check-runs.json" <<'PY'
          import json
          import sys
          data=json.load(open(sys.argv[1],encoding='utf-8'))
          pending=[];failed=[]
          for check in data.get('check_runs',[]):
              if check.get('status') != 'completed':
                  pending.append(check.get('name','unknown'));continue
              conclusion=check.get('conclusion')
              if conclusion not in {'success','skipped','neutral'}:
                  failed.append(f"{check.get('name','unknown')}={conclusion}")
          if failed:print('FAILED:'+';'.join(failed))
          elif pending:print('PENDING:'+';'.join(pending))
          else:print('GREEN')
          PY
            )"
            echo "final_check_state=${state}" | tee -a "${EVIDENCE}/check-monitor.txt"
            case "${state}" in
              GREEN) break ;;
              FAILED:*) exit 1 ;;
              PENDING:*) sleep 30 ;;
              *) exit 1 ;;
            esac
            if [[ "${attempt}" -eq 360 ]]; then
              echo 'final checks did not settle to green' >&2
              exit 1
            fi
          done

      - name: Mark PR ready for review, never merge
        shell: bash
        run: |
          set -euo pipefail
          pr="$(gh api "repos/${GITHUB_REPOSITORY}/pulls/7")"
          draft="$(jq -r '.draft' <<<"${pr}")"
          node_id="$(jq -r '.node_id' <<<"${pr}")"
          if [[ "${draft}" = true ]]; then
            gh api graphql \
              -f query='mutation($id:ID!){markPullRequestReadyForReview(input:{pullRequestId:$id}){pullRequest{isDraft url}}}' \
              -F id="${node_id}" \
              | tee "${EVIDENCE}/ready-for-review.json"
          else
            echo 'PR already ready for review' | tee "${EVIDENCE}/ready-for-review.txt"
          fi
          printf '%s\n' "utc_completed=$(date -u +%FT%TZ)" \
            | tee -a "${EVIDENCE}/snapshot.txt"

      - name: Upload controller evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass327-controller-${{ github.sha }}
          path: /tmp/pass327-controller
          if-no-files-found: warn
          retention-days: 90
