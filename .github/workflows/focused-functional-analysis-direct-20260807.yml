name: Focused FunctionalAnalysis direct-source clean verification

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - '.ci/focused/functional_analysis_candidate.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-functional-analysis-direct-source
  cancel-in-progress: false

jobs:
  direct-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      M2A_PASS: .ci/focused/mock2_advanced_direct_pass.json
      CANDIDATE_MARKER: .ci/focused/functional_analysis_candidate.json
      PASS_MARKER: .ci/focused/functional_analysis_direct_pass.json
      LOGDIR: focused-proof/FunctionalAnalysis-direct

    steps:
      - name: Clone exact triggering checked-in sources
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "${M2A_PASS}"
          test -f "${CANDIDATE_MARKER}"
          mkdir -p "${LOGDIR}"
          git status --porcelain=v1 > "${LOGDIR}/initial-status.txt"
          test ! -s "${LOGDIR}/initial-status.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          m2a=json.loads(Path('.ci/focused/mock2_advanced_direct_pass.json').read_text())
          adv=Path('PrimalitySheafVerification/Mock2_Advanced.lean').read_bytes()
          assert hashlib.sha256(adv).hexdigest()==m2a['source_sha256']
          marker=json.loads(Path('.ci/focused/functional_analysis_candidate.json').read_text())
          integ=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean').read_bytes()
          compat=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()
          assert hashlib.sha256(integ).hexdigest()==marker['integrated_source_sha256']
          assert hashlib.sha256(compat).hexdigest()==marker['compatibility_source_sha256']
          assert hashlib.sha256(adv).hexdigest()==marker['mock2_advanced_source_sha256']
          PY
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "base_master_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_blob=$(git hash-object "${ADVANCED}")" \
            "integrated_blob=$(git hash-object "${INTEGRATED}")" \
            "fa_blob=$(git hash-object "${FA}")" \
            > "${LOGDIR}/snapshot.txt"

      - name: Audit source trust and substantive theorem interface
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/static-trust-audit.txt"
          from pathlib import Path
          import hashlib, json, re
          files=[
            Path('PrimalitySheafVerification/Mock2_Advanced.lean'),
            Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
            Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          cleaned={}
          for p in files:
            src=p.read_text(encoding='utf-8'); out=[]; i=0; depth=0; string=False; esc=False
            while i<len(src):
              if depth:
                if src.startswith('/-',i): depth+=1; out+=[' ',' ']; i+=2
                elif src.startswith('-/',i): depth-=1; out+=[' ',' ']; i+=2
                else: out.append('\n' if src[i]=='\n' else ' '); i+=1
              elif string:
                ch=src[i]; out.append('\n' if ch=='\n' else ' ')
                if esc: esc=False
                elif ch=='\\': esc=True
                elif ch=='"': string=False
                i+=1
              elif src.startswith('/-',i): depth=1; out+=[' ',' ']; i+=2
              elif src.startswith('--',i):
                while i<len(src) and src[i]!='\n': out.append(' '); i+=1
              elif src[i]=='"': string=True; out.append(' '); i+=1
              else: out.append(src[i]); i+=1
            if depth or string: raise SystemExit(f'unterminated comment/string: {p}')
            code=''.join(out); cleaned[p]=code
            pats={
              'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b','by_contra!':r'\bby_contra!\b'}
            counts={k:len(re.findall(v,code)) for k,v in pats.items()}
            print(p)
            for k,v in counts.items(): print(f'  {k}: {v}')
            if any(counts.values()): raise SystemExit(1)
          code=cleaned[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean')]
          sigs=[]
          for m in re.finditer(r'(?m)^\s*(?:theorem|lemma)\s+([^\s:(]+)',code):
            start=m.start(); end=len(code)
            nxt=re.search(r'(?m)^\s*(?:theorem|lemma|def|structure|class|instance|abbrev|inductive)\s+',code[m.end():])
            if nxt: end=m.end()+nxt.start()
            block=code[start:end]
            cut=re.search(r'(?m)\s+:=\s*by\b|(?m)\s+:=|(?m)^\s*where\s*$',block)
            if cut: block=block[:cut.start()]
            sigs.append(' '.join(block.split()))
          digest=hashlib.sha256('\n'.join(sigs).encode()).hexdigest()
          marker=json.loads(Path('.ci/focused/functional_analysis_candidate.json').read_text())
          print('theorem_signature_sha256:',digest)
          assert digest==marker['theorem_signature_sha256']
          compat=cleaned[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          assert 'import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated' in compat
          PY
          git diff --exit-code

      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get | tee "${LOGDIR}/cache-get.log"

      - name: Compile dependency chain twice from deleted project artifacts
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          modules=(Mock2 Mock2_Advanced Mock2_FunctionalAnalysis_Integrated Mock2_FunctionalAnalysis)
          for pass in 1 2; do
            for mod in "${modules[@]}"; do
              rm -f "$out/${mod}.olean" "$out/${mod}.ilean" "$out/${mod}.olean.private"
              src="PrimalitySheafVerification/${mod}.lean"
              set +e
              lake env lean "$src" -o "$out/${mod}.olean" -i "$out/${mod}.ilean" \
                > "${LOGDIR}/${mod}-pass${pass}.log" 2>&1
              code=$?
              set -e
              echo "$code" > "${LOGDIR}/${mod}-pass${pass}-exit.txt"
              test "$code" -eq 0
              test -s "$out/${mod}.olean"
              test -s "$out/${mod}.ilean"
              test "$(grep -c 'error:' "${LOGDIR}/${mod}-pass${pass}.log" || true)" -eq 0
              ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
                "${LOGDIR}/${mod}-pass${pass}.log"
              ! grep -a -q 'sorryAx' "$out/${mod}.olean"
            done
          done
          sha256sum \
            "${MOCK2}" "${ADVANCED}" "${INTEGRATED}" "${FA}" \
            "$out/Mock2.olean" "$out/Mock2.ilean" \
            "$out/Mock2_Advanced.olean" "$out/Mock2_Advanced.ilean" \
            "$out/Mock2_FunctionalAnalysis_Integrated.olean" "$out/Mock2_FunctionalAnalysis_Integrated.ilean" \
            "$out/Mock2_FunctionalAnalysis.olean" "$out/Mock2_FunctionalAnalysis.ilean" \
            | tee "${LOGDIR}/source-and-artifact-sha256.txt"
          git diff --exit-code
          git status --porcelain=v1 > "${LOGDIR}/post-build-status.txt"
          test ! -s "${LOGDIR}/post-build-status.txt"

      - name: Build proof report
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          integ=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean')
          fa=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          adv=Path('PrimalitySheafVerification/Mock2_Advanced.lean')
          marker=json.loads(Path('.ci/focused/functional_analysis_candidate.json').read_text())
          report={
            'module':'Mock2_FunctionalAnalysis',
            'verified_source_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'integrated_source_blob':subprocess.check_output(['git','hash-object',str(integ)],text=True).strip(),
            'integrated_source_sha256':hashlib.sha256(integ.read_bytes()).hexdigest(),
            'compatibility_source_blob':subprocess.check_output(['git','hash-object',str(fa)],text=True).strip(),
            'compatibility_source_sha256':hashlib.sha256(fa.read_bytes()).hexdigest(),
            'mock2_advanced_source_sha256':hashlib.sha256(adv.read_bytes()).hexdigest(),
            'theorem_signature_sha256':marker['theorem_signature_sha256'],
            'clean_pass_1':0,'clean_pass_2':0,'error_count':0,'forbidden_tokens':0,
            'sorryAx':0,'new_global_axioms':0,'dependency_regression':'PASS',
            'runtime_repair_used':False,'integrated_boundary':'substantive implementation preserved'
          }
          Path('focused-proof/FunctionalAnalysis-direct/direct-pass.json').write_text(json.dumps(report,indent=2)+'\n')
          Path('/tmp/functional_analysis_direct_pass.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          tar -czf /tmp/functional-analysis-direct-proof.tar.gz "${LOGDIR}"

      - name: Upload direct-source proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: focused-functional-analysis-direct-${{ github.sha }}
          path: /tmp/functional-analysis-direct-proof.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish FunctionalAnalysis direct PASS marker
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          mkdir -p "$(dirname "${PASS_MARKER}")"
          cp /tmp/functional_analysis_direct_pass.json "${PASS_MARKER}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${PASS_MARKER}"
          test "$(git diff --cached --name-only)" = "${PASS_MARKER}"
          git commit -m 'ci: record FunctionalAnalysis direct-source PASS'
          git push origin "HEAD:${BRANCH}"
