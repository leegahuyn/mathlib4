name: Codex FA probe Friedrichs explicit v3
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-probe-friedrichs-explicit-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile real-scalar instantiation probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/FriedrichsExplicitProbe3.lean <<'LEAN'
          import Mathlib
          open MeasureTheory
          #check ContinuousLinearMap.lsmul ℝ ℝ
          example (f : ℂ → ℝ) (g : ℂ → ℂ)
              (hcf : HasCompactSupport f) (hf : ContDiff ℝ 1 f)
              (hg : LocallyIntegrable g (volume : Measure ℂ)) (w : ℂ) : True := by
            have h := HasCompactSupport.hasFDerivAt_convolution_left
              (𝕜 := ℝ) (G := ℂ) (E := ℝ) (E' := ℂ) (F := ℂ)
              (f := f) (g := g) (μ := (volume : Measure ℂ))
              (ContinuousLinearMap.lsmul ℝ ℝ) hcf hf hg w
            exact True.intro
          LEAN
          lake env lean /tmp/FriedrichsExplicitProbe3.lean | tee /tmp/friedrichs-explicit-probe3.log
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-friedrichs-explicit-v3-${{ github.sha }}
          path: /tmp/friedrichs-explicit-probe3.log
          retention-days: 14
