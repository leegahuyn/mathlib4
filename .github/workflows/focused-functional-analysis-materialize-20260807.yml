name: Focused FunctionalAnalysis candidate and integrated materialization

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.ci/focused/mock2_advanced_direct_pass.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-functional-analysis-materialize
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      M2A_PASS: .ci/focused/mock2_advanced_direct_pass.json
      CANDIDATE_MARKER: .ci/focused/functional_analysis_candidate.json
      LOGDIR: focused-proof/FunctionalAnalysis-candidate
      ADVANCED_BASELINE_COMMIT: 623dfac27a24c170330d6218005e67b06490b814

    steps:
      - name: Clone exact M2A-direct-PASS head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "${M2A_PASS}"
          mkdir -p "${LOGDIR}"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          marker=json.loads(Path('.ci/focused/mock2_advanced_direct_pass.json').read_text())
          src=Path('PrimalitySheafVerification/Mock2_Advanced.lean').read_bytes()
          assert hashlib.sha256(src).hexdigest()==marker['source_sha256']
          assert marker['runtime_repair_used'] is False
          PY
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "base_master_sha=$(git ls-remote origin refs/heads/master | awk '{print $1}')" \
            "advanced_blob=$(git hash-object "${ADVANCED}")" \
            "advanced_sha256=$(sha256sum "${ADVANCED}" | awk '{print $1}')" \
            "fa_start_blob=$(git hash-object "${FA}")" \
            "fa_start_sha256=$(sha256sum "${FA}" | awk '{print $1}')" \
            > "${LOGDIR}/snapshot.txt"

      - name: Install Lean and restore cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get | tee "${LOGDIR}/cache-get.log"

      - name: Compile prerequisite sources and inspect checked-in FA
        id: inspect
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          compile() {
            local mod="$1" log="$2"
            rm -f "$out/${mod}.olean" "$out/${mod}.ilean" "$out/${mod}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${mod}.lean" \
              -o "$out/${mod}.olean" -i "$out/${mod}.ilean" > "$log" 2>&1
            local code=$?
            set -e
            echo "$code"
          }
          code=$(compile Mock2 "${LOGDIR}/Mock2-prerequisite.log")
          test "$code" -eq 0
          code=$(compile Mock2_Advanced "${LOGDIR}/Mock2_Advanced-prerequisite.log")
          test "$code" -eq 0
          if [[ -f "${INTEGRATED}" ]] && grep -Fq 'import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated' "${FA}"; then
            code=$(compile Mock2_FunctionalAnalysis_Integrated "${LOGDIR}/Integrated-checked-in.log")
            if [[ "$code" -eq 0 ]]; then
              code=$(compile Mock2_FunctionalAnalysis "${LOGDIR}/FA-checked-in-wrapper.log")
            fi
            if [[ "$code" -eq 0 ]]; then
              echo 'mode=checked-in-split' >> "$GITHUB_OUTPUT"
              exit 0
            fi
          fi
          code=$(compile Mock2_FunctionalAnalysis "${LOGDIR}/FA-checked-in-unsplit.log")
          if [[ "$code" -eq 0 ]]; then
            echo 'mode=checked-in-unsplit' >> "$GITHUB_OUTPUT"
          else
            echo 'mode=repair' >> "$GITHUB_OUTPUT"
          fi

      - name: Reproduce deterministic FA candidate twice when repair is required
        if: steps.inspect.outputs.mode == 'repair'
        shell: bash
        run: |
          set -euo pipefail
          origin_url="https://x-access-token:${{ github.token }}@github.com/${GITHUB_REPOSITORY}.git"
          make_candidate() {
            local dir="$1"
            git clone --no-hardlinks . "$dir" >/dev/null
            cd "$dir"
            cp "${ADVANCED}" /tmp/"$(basename "$dir")"-verified-advanced.lean
            git remote set-url origin "$origin_url"
            git fetch --depth=1 origin "${ADVANCED_BASELINE_COMMIT}"
            git show "${ADVANCED_BASELINE_COMMIT}:${ADVANCED}" > "${ADVANCED}"
            scripts=(
              apply_two_hundred_eighty_ninth_pass_repairs.py
              apply_two_hundred_ninetieth_pass_repairs.py
              apply_two_hundred_ninety_first_pass_repairs.py
              apply_two_hundred_ninety_second_pass_repairs.py
              apply_two_hundred_ninety_third_pass_repairs.py
              apply_two_hundred_ninety_fourth_pass_repairs.py
              apply_two_hundred_ninety_fifth_pass_repairs.py
              apply_two_hundred_ninety_seventh_pass_repairs.py
              apply_two_hundred_ninety_eighth_pass_repairs.py
              apply_two_hundred_ninety_ninth_pass_repairs.py
              apply_three_hundredth_pass_repairs.py
              apply_three_hundred_ninth_pass_repairs.py
              apply_three_hundred_tenth_pass_repairs.py
              apply_three_hundred_eleventh_pass_repairs.py
              apply_three_hundred_twelfth_pass_repairs.py
              apply_three_hundred_thirteenth_pass_repairs.py
              apply_three_hundred_fourteenth_pass_repairs.py
              apply_three_hundred_fifteenth_pass_repairs.py
            )
            for script in "${scripts[@]}"; do
              test -f "scripts/${script}"
              python3 "scripts/${script}" >> "${GITHUB_WORKSPACE}/${LOGDIR}/$(basename "$dir")-repair.log" 2>&1
            done
            cp /tmp/"$(basename "$dir")"-verified-advanced.lean "${ADVANCED}"
            while IFS= read -r changed; do
              [[ -z "$changed" || "$changed" == "${FA}" || "$changed" == "${ADVANCED}" ]] || \
                git restore --source=HEAD --worktree -- "$changed"
            done < <(git diff --name-only)
            cmp -s "${ADVANCED}" /tmp/"$(basename "$dir")"-verified-advanced.lean
            git diff --check
            sha256sum "${FA}" | awk '{print $1}' > /tmp/"$(basename "$dir")"-fa.sha
          }
          make_candidate /tmp/fa-repro-a
          make_candidate /tmp/fa-repro-b
          cmp -s /tmp/fa-repro-a-fa.sha /tmp/fa-repro-b-fa.sha
          cmp -s /tmp/fa-repro-a/"${FA}" /tmp/fa-repro-b/"${FA}"
          cp /tmp/fa-repro-a/"${FA}" "${FA}"
          git diff --check
          printf '%s\n' \
            "repair_scripts=289,290,291,292,293,294,295,297,298,299,300,309,310,311,312,313,314,315" \
            "reproduced_sha256=$(cat /tmp/fa-repro-a-fa.sha)" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Select checked-in substantive source when already compiling
        if: steps.inspect.outputs.mode == 'checked-in-split' || steps.inspect.outputs.mode == 'checked-in-unsplit'
        shell: bash
        run: |
          set -euo pipefail
          printf '%s\n' "repair_scripts=none" "selection_mode=${{ steps.inspect.outputs.mode }}" >> "${LOGDIR}/snapshot.txt"

      - name: Verify theorem statements, trust policy, and unsplit candidate twice
        if: steps.inspect.outputs.mode != 'checked-in-split'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY' | tee "${LOGDIR}/candidate-interface-and-trust.txt"
          from pathlib import Path
          import hashlib,re,subprocess
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          src=p.read_text(encoding='utf-8')
          base=subprocess.check_output(['git','show','HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'],text=True)
          def clean(src):
            out=[]; i=0; d=0; s=False; e=False
            while i<len(src):
              if d:
                if src.startswith('/-',i): d+=1; out+=[' ',' ']; i+=2
                elif src.startswith('-/',i): d-=1; out+=[' ',' ']; i+=2
                else: out.append('\n' if src[i]=='\n' else ' '); i+=1
              elif s:
                c=src[i]; out.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1
              elif src.startswith('/-',i): d=1; out+=[' ',' ']; i+=2
              elif src.startswith('--',i):
                while i<len(src) and src[i]!='\n': out.append(' '); i+=1
              elif src[i]=='"': s=True; out.append(' '); i+=1
              else: out.append(src[i]); i+=1
            if d or s: raise SystemExit('unterminated comment/string')
            return ''.join(out)
          def digest(code):
            sigs=[]
            for m in re.finditer(r'(?m)^\s*(?:theorem|lemma)\s+([^\s:(]+)',code):
              start=m.start(); end=len(code)
              nxt=re.search(r'(?m)^\s*(?:theorem|lemma|def|structure|class|instance|abbrev|inductive)\s+',code[m.end():])
              if nxt: end=m.end()+nxt.start()
              block=code[start:end]
              cut=re.search(r'(?m)\s+:=\s*by\b|(?m)\s+:=|(?m)^\s*where\s*$',block)
              if cut: block=block[:cut.start()]
              sigs.append(' '.join(block.split()))
            return hashlib.sha256('\n'.join(sigs).encode()).hexdigest(),len(sigs)
          code=clean(src); basecode=clean(base)
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b','by_contra!':r'\bby_contra!\b'}
          counts={k:len(re.findall(v,code)) for k,v in pats.items()}
          for k,v in counts.items(): print(f'{k}: {v}')
          if any(counts.values()): raise SystemExit(1)
          before,n0=digest(basecode); after,n1=digest(code)
          print('baseline_theorem_count:',n0); print('candidate_theorem_count:',n1)
          print('baseline_theorem_signature_sha256:',before); print('candidate_theorem_signature_sha256:',after)
          if before != after: raise SystemExit('theorem or lemma statement changed')
          Path('/tmp/fa-theorem-signature.sha').write_text(after+'\n')
          PY
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          for pass in 1 2; do
            rm -f "$out/Mock2_FunctionalAnalysis.olean" "$out/Mock2_FunctionalAnalysis.ilean" "$out/Mock2_FunctionalAnalysis.olean.private"
            set +e
            lake env lean "${FA}" -o "$out/Mock2_FunctionalAnalysis.olean" -i "$out/Mock2_FunctionalAnalysis.ilean" \
              > "${LOGDIR}/FA-unsplit-candidate-pass${pass}.log" 2>&1
            code=$?
            set -e
            echo "$code" > "${LOGDIR}/FA-unsplit-candidate-pass${pass}-exit.txt"
            test "$code" -eq 0
            test -s "$out/Mock2_FunctionalAnalysis.olean"
            test -s "$out/Mock2_FunctionalAnalysis.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/FA-unsplit-candidate-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "${LOGDIR}/FA-unsplit-candidate-pass${pass}.log"
          done

      - name: Materialize substantive Integrated source and compatibility entry locally
        if: steps.inspect.outputs.mode != 'checked-in-split'
        shell: bash
        run: |
          set -euo pipefail
          cp "${FA}" "${INTEGRATED}"
          cat > "${FA}" <<'LEAN'
          /-!
          # Mock2 FunctionalAnalysis compatibility entry point

          The complete source-level implementation is stored in
          `PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated`.
          This historical module path re-exports the same public declarations.
          -/
          import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated
          LEAN
          git diff --check

      - name: Verify the real Integrated boundary twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$out"
          if [[ ! -f /tmp/fa-theorem-signature.sha ]]; then
            python3 - <<'PY'
            from pathlib import Path
            import hashlib,re
            src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean').read_text()
            sigs=[]
            for m in re.finditer(r'(?m)^\s*(?:theorem|lemma)\s+([^\s:(]+)',src):
              start=m.start(); end=len(src)
              nxt=re.search(r'(?m)^\s*(?:theorem|lemma|def|structure|class|instance|abbrev|inductive)\s+',src[m.end():])
              if nxt:end=m.end()+nxt.start()
              block=src[start:end]
              cut=re.search(r'(?m)\s+:=\s*by\b|(?m)\s+:=|(?m)^\s*where\s*$',block)
              if cut:block=block[:cut.start()]
              sigs.append(' '.join(block.split()))
            Path('/tmp/fa-theorem-signature.sha').write_text(hashlib.sha256('\n'.join(sigs).encode()).hexdigest()+'\n')
            PY
          fi
          for pass in 1 2; do
            for mod in Mock2_FunctionalAnalysis_Integrated Mock2_FunctionalAnalysis; do
              rm -f "$out/${mod}.olean" "$out/${mod}.ilean" "$out/${mod}.olean.private"
              set +e
              lake env lean "PrimalitySheafVerification/${mod}.lean" \
                -o "$out/${mod}.olean" -i "$out/${mod}.ilean" > "${LOGDIR}/${mod}-candidate-pass${pass}.log" 2>&1
              code=$?
              set -e
              echo "$code" > "${LOGDIR}/${mod}-candidate-pass${pass}-exit.txt"
              test "$code" -eq 0
              test -s "$out/${mod}.olean"
              test -s "$out/${mod}.ilean"
              test "$(grep -c 'error:' "${LOGDIR}/${mod}-candidate-pass${pass}.log" || true)" -eq 0
              ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
                "${LOGDIR}/${mod}-candidate-pass${pass}.log"
            done
          done
          sha256sum "${ADVANCED}" "${INTEGRATED}" "${FA}" \
            "$out/Mock2_FunctionalAnalysis_Integrated.olean" "$out/Mock2_FunctionalAnalysis_Integrated.ilean" \
            "$out/Mock2_FunctionalAnalysis.olean" "$out/Mock2_FunctionalAnalysis.ilean" \
            | tee "${LOGDIR}/candidate-source-and-artifact-sha256.txt"

      - name: Build and upload candidate proof bundle
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,subprocess
          adv=Path('PrimalitySheafVerification/Mock2_Advanced.lean')
          integ=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean')
          fa=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          marker={
            'constructed_from_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),
            'mock2_advanced_source_sha256':hashlib.sha256(adv.read_bytes()).hexdigest(),
            'integrated_source_sha256':hashlib.sha256(integ.read_bytes()).hexdigest(),
            'compatibility_source_sha256':hashlib.sha256(fa.read_bytes()).hexdigest(),
            'theorem_signature_sha256':Path('/tmp/fa-theorem-signature.sha').read_text().strip(),
            'candidate_clean_pass_1':0,'candidate_clean_pass_2':0,'error_count':0,
            'forbidden_tokens':0,'sorryAx':0,'new_global_axioms':0,
            'theorem_statements_changed':False,'assumptions_changed':False,
            'integrated_boundary':'substantive implementation, not an empty import placeholder'
          }
          Path('/tmp/functional_analysis_candidate.json').write_text(json.dumps(marker,indent=2)+'\n')
          PY
          tar -czf /tmp/functional-analysis-candidate-proof.tar.gz "${LOGDIR}"

      - name: Upload candidate proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: focused-functional-analysis-candidate-${{ github.sha }}
          path: /tmp/functional-analysis-candidate-proof.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Commit only verified FunctionalAnalysis sources and marker
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          mkdir -p "$(dirname "${CANDIDATE_MARKER}")"
          cp /tmp/functional_analysis_candidate.json "${CANDIDATE_MARKER}"
          git diff --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FA}" "${INTEGRATED}" "${CANDIDATE_MARKER}"
          changed="$(git diff --cached --name-only | sort)"
          expected="$(printf '%s\n' "${CANDIDATE_MARKER}" "${FA}" "${INTEGRATED}" | sort)"
          test "$changed" = "$expected"
          git commit -m 'fix: materialize verified FunctionalAnalysis integrated source'
          git push origin "HEAD:${BRANCH}"
