name: Codex FA v52 inventory local search highcap2000

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/codex/FA_V51_REMAINING_ERRORS.json
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

env:
  TARGET_BRANCH: codex/fa-qym-cleanbuild-final-20260811-fast
  LOCKED_RUNNER_SHA256: 2459f0a2cd44f6a3716de1ed2934c7588ba1a1e27ef443947d9e6089af196514
  LOCKED_COLLECTOR_SHA256: 7de7bc92e4e2735c0d25706d70777ea67340d8afcf67434e43b051d5cb8c90c6

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      has_errors: ${{ steps.state.outputs.has_errors }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1
          persist-credentials: false
      - id: state
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/codex/FA_V51_REMAINING_ERRORS.json
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          r=json.load(open('.github/codex/FA_V51_REMAINING_ERRORS.json'))
          assert r['schema']=='fa-v51-complete-remaining-error-inventory-v1'
          print('has_errors=' + ('true' if int(r['raw_error_count'])>0 else 'false'))
          PY

  direct:
    needs: [prepare]
    if: needs.prepare.outputs.has_errors == 'true'
    strategy:
      fail-fast: false
      matrix:
        variant:
          - selected_base
          - exact_to_simpa
          - simpa_enriched
          - simp_all_local
          - aesop_local
          - linarith_local
          - nlinarith_local
          - combined_conservative
    name: direct-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      VARIANT: ${{ matrix.variant }}
      OUT: build-logs/codex-fa-v52-inventory-local-search-highcap2000/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize exact v51 selected artifact
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          root="/tmp/fa-v52-source-${GITHUB_RUN_ID}-${VARIANT}"
          zip="/tmp/fa-v52-source-${GITHUB_RUN_ID}-${VARIANT}.zip"
          rm -rf "$root" "$zip";mkdir -p "$root"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          r=json.load(open('.github/codex/FA_V51_REMAINING_ERRORS.json'))
          assert r['schema']=='fa-v51-complete-remaining-error-inventory-v1'
          assert int(r['raw_error_count'])>0
          assert r['selected_artifact_expired'] is False
          out=Path(os.environ['OUT'])
          (out/'artifact-id.txt').write_text(str(r['selected_artifact_id'])+'\n')
          (out/'artifact-name.txt').write_text(r['selected_artifact_name']+'\n')
          (out/'artifact-digest.txt').write_text(r['selected_artifact_digest']+'\n')
          (out/'source-sha.txt').write_text(r['selected_source_sha256']+'\n')
          PY
          aid="$(tr -d '\r\n'<"$OUT/artifact-id.txt")";digest="$(tr -d '\r\n'<"$OUT/artifact-digest.txt")"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}" >"$OUT/SOURCE_ARTIFACT.json"
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          out=Path(os.environ['OUT']);a=json.loads((out/'SOURCE_ARTIFACT.json').read_text())
          assert int(a['id'])==int((out/'artifact-id.txt').read_text())
          assert a['name']==(out/'artifact-name.txt').read_text().strip()
          assert a['digest']==(out/'artifact-digest.txt').read_text().strip()
          assert a['expired'] is False
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" >"$zip"
          test "sha256:$(sha256sum "$zip"|awk '{print $1}')" = "$digest"
          unzip -q "$zip" -d "$root"
          ROOT="$root" python3 - <<'PY'
          import hashlib,json,os,shutil
          from pathlib import Path
          root=Path(os.environ['ROOT']);out=Path(os.environ['OUT']);ss=list(root.rglob('Mock2_FunctionalAnalysis-candidate.lean'));ms=list(root.rglob('METRIC.json'));assert len(ss)==1,ss;assert len(ms)==1,ms;s=ss[0];m=json.loads(ms[0].read_text());sha=hashlib.sha256(s.read_bytes()).hexdigest();assert sha==(out/'source-sha.txt').read_text().strip();assert int(m['Mock2_exit'])==0;assert int(m['Mock2_Advanced_exit'])==0;assert m['FA_error_cap_sentinel_present'] is False;assert m['FA_inventory_complete_by_header_evidence'] is True;assert m['source_executable_trust_six_zero'] is True;shutil.copyfile(s,'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');shutil.copyfile(s,out/'SOURCE_BASELINE.lean');shutil.copyfile(ms[0],out/'SOURCE_METRIC.json')
          PY

      - name: Apply declaration-local candidate recipe
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          sp=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');out=Path(os.environ['OUT']);variant=os.environ['VARIANT'];before=sp.read_text();lines=before.splitlines(keepends=True);inv=json.load(open('.github/codex/FA_V51_REMAINING_ERRORS.json'))
          decl_re=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+')
          report={'schema':'fa-v52-inventory-local-body-only-search-v1','variant':variant,'parent_source_sha256':hashlib.sha256(before.encode()).hexdigest(),'parent_inventory_sha256':hashlib.sha256(Path('.github/codex/FA_V51_REMAINING_ERRORS.json').read_bytes()).hexdigest(),'theorem_statements_changed':False,'declaration_order_changed':False,'source_moves':[],'edits':[]}
          def owner_ok(j):
            starts=[i for i in range(j+1) if decl_re.match(lines[i])]
            return bool(starts) and ':= by' in ''.join(lines[starts[-1]:j+1])
          def owner_header(j):
            starts=[i for i in range(j+1) if decl_re.match(lines[i])];return lines[starts[-1]].strip() if starts else None
          def body(line):
            y=line.lstrip();return y[2:].lstrip() if y.startswith('· ') else y
          def near(line_no,pred,radius=5):
            i=max(0,min(len(lines)-1,int(line_no)-1))
            order=[0]
            for k in range(1,radius+1):order += [-k,k]
            for o in order:
              j=i+o
              if 0<=j<len(lines) and owner_ok(j) and pred(lines[j]):return j
            return None
          def prefix(line):
            m=re.match(r'^(\s*(?:·\s*)?)',line);return m.group(1)
          def nl(line):return '\n' if line.endswith('\n') else ''
          def enrich_simpa(line):
            if 'Function.comp_def' in line and 'Pi.smul_apply' in line:return line
            lemmas='Function.comp_def, Pi.smul_apply'
            if 'simpa only [' in line:return line.replace('simpa only [',f'simpa only [{lemmas}, ',1)
            m=re.search(r'\bsimpa\s*\[',line)
            if m:
              p=line.find('[',m.start())+1;return line[:p]+lemmas+', '+line[p:]
            if 'simpa using' in line:return line.replace('simpa using',f'simpa [{lemmas}] using',1)
            return line
          repl={}
          def stage(j,new,kind,error):
            old=repl.get(j,lines[j])
            if new!=old:
              repl[j]=new;report['edits'].append({'classification':kind,'line':j+1,'owner_header':owner_header(j),'old':old.rstrip('\n'),'new':new.rstrip('\n'),'error_index':error['index'],'error_classes':error['classes']})
          for e in inv['errors']:
            classes=set(e['classes']);line_no=e['line']
            if variant in {'exact_to_simpa','combined_conservative'}:
              j=near(line_no,lambda x:body(x).startswith('exact '))
              if j is not None:
                old=repl.get(j,lines[j]);b=body(old).rstrip('\r\n');term=b[len('exact '):]
                if term and not term.startswith('by'):
                  stage(j,prefix(old)+f'simpa [Function.comp_def, Pi.smul_apply] using {term}'+nl(old),'EXACT_TO_SIMPA_USING',e)
            if variant in {'simpa_enriched','combined_conservative'}:
              j=near(line_no,lambda x:'simpa' in body(x))
              if j is not None:
                old=repl.get(j,lines[j]);stage(j,enrich_simpa(old),'ENRICH_SIMPA_NORMALIZATION',e)
            if variant=='simp_all_local' or (variant=='combined_conservative' and 'unsolved_goals' in classes):
              j=near(line_no,lambda x:body(x).startswith(('exact ','simpa','simp','aesop','linarith','nlinarith','norm_num','ring','ring_nf','omega')))
              if j is not None:
                old=repl.get(j,lines[j]);stage(j,prefix(old)+'simp_all [Function.comp_def, Pi.smul_apply]'+nl(old),'LOCAL_SIMP_ALL',e)
            if variant=='aesop_local':
              j=near(line_no,lambda x:body(x).startswith(('exact ','simpa','simp','aesop','linarith','nlinarith','norm_num','ring','ring_nf','omega')))
              if j is not None:
                old=repl.get(j,lines[j]);stage(j,prefix(old)+'aesop'+nl(old),'LOCAL_AESOP',e)
            if variant in {'linarith_local','nlinarith_local'} or (variant=='combined_conservative' and 'arithmetic' in classes):
              tactic='linarith' if variant=='linarith_local' else 'nlinarith'
              if variant=='combined_conservative':tactic='nlinarith'
              if 'arithmetic' in classes or any(t in e['message'] for t in ('≤','<','>','=')):
                j=near(line_no,lambda x:body(x).startswith(('exact ','simpa','linarith','nlinarith','norm_num','omega','positivity','ring','ring_nf')))
                if j is not None:
                  old=repl.get(j,lines[j]);stage(j,prefix(old)+tactic+nl(old),'LOCAL_ARITHMETIC_REPLACEMENT',e)
          for j,new in repl.items():lines[j]=new
          after=''.join(lines);sp.write_text(after);report['candidate_sha256']=hashlib.sha256(after.encode()).hexdigest();report['source_bytes']=len(after.encode());report['source_lines']=len(after.splitlines());report['edit_count']=len(report['edits']);(out/'PATCH_REPORT.json').write_text(json.dumps(report,indent=2,sort_keys=True)+'\n');(out/'candidate.sha256').write_text(report['candidate_sha256']+'\n');(out/'Mock2_FunctionalAnalysis-candidate.lean').write_text(after)
          PY

      - name: Fail-closed trust and locked runner preflight
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum scripts/fa_v42_direct_compile_ci.sh|awk '{print $1}')" = "$LOCKED_RUNNER_SHA256";test "$(sha256sum scripts/fa_v42_collect_full_diagnostics.py|awk '{print $1}')" = "$LOCKED_COLLECTOR_SHA256"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          p=Path(os.environ['OUT'])/'PATCH_REPORT.json';r=json.loads(p.read_text());s=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text()
          def clean(x):
            c=list(x);i=0;d=0;q=False;e=False
            while i<len(c):
              if d:
                if x.startswith('/-',i):c[i]=c[i+1]=' ';d+=1;i+=2;continue
                if x.startswith('-/',i):c[i]=c[i+1]=' ';d-=1;i+=2;continue
                if c[i]!='\n':c[i]=' '
                i+=1;continue
              if q:
                o=c[i]
                if o!='\n':c[i]=' '
                if e:e=False
                elif o=='\\':e=True
                elif o=='"':q=False
                i+=1;continue
              if x.startswith('/-',i):c[i]=c[i+1]=' ';d=1;i+=2;continue
              if x.startswith('--',i):
                while i<len(c) and c[i]!='\n':c[i]=' ';i+=1
                continue
              if c[i]=='"':c[i]=' ';q=True
              i+=1
            return ''.join(c)
          code=clean(s);ts=('sorry','admit','axiom','unsafe','native_decide','Lean.ofReduceBool');cs={t:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(t)+r'(?![A-Za-z0-9_])',code)) for t in ts};assert all(v==0 for v in cs.values()),cs;r['trust_counts_after']=cs;r['trust_six_zero']=True;p.write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n'<lean-toolchain)" >"$OUT/toolchain.log" 2>&1;lake exe cache get >"$OUT/cache.log" 2>&1;lean --version >"$OUT/lean-version.txt";lake --version >"$OUT/lake-version.txt"
      - name: Direct compile chain
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH";export FA_V42_OUT="$OUT";export FA_V42_EXPECTED_CANDIDATE_SHA256="$(tr -d '\r\n'<"$OUT/candidate.sha256")";export FA_V42_VARIANT="$VARIANT";bash scripts/fa_v42_direct_compile_ci.sh
      - name: Collect metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT";cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-observed.lean" 2>/dev/null||true;export FA_V42_EXPECTED_CANDIDATE_SHA256="$(cat "$OUT/candidate.sha256" 2>/dev/null||true)";export FA_V42_VARIANT="$VARIANT";python3 scripts/fa_v42_collect_full_diagnostics.py --source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --out "$OUT" --max-errors 2000 >"$OUT/metric-console.log"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v52-${{ matrix.variant }}-highcap2000-${{ github.sha }}
          path: build-logs/codex-fa-v52-inventory-local-search-highcap2000/${{ matrix.variant }}
          retention-days: 30
      - name: Mirror direct exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/Mock2.exit"||exit 86;test -f "$OUT/Mock2_Advanced.exit"||exit 86;test -f "$OUT/Mock2_FunctionalAnalysis.exit"||exit 86;test "$(tr -d '\r\n'<"$OUT/Mock2.exit")" = 0||exit 86;test "$(tr -d '\r\n'<"$OUT/Mock2_Advanced.exit")" = 0||exit 86;exit "$(tr -d '\r\n'<"$OUT/Mock2_FunctionalAnalysis.exit")"

  select:
    needs: [prepare,direct]
    if: always() && needs.prepare.outputs.has_errors == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 0
          persist-credentials: true
      - shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v52-artifacts;mkdir -p /tmp/v52-artifacts;gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --dir /tmp/v52-artifacts
      - shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/codex
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re,shutil
          root=Path('/tmp/v52-artifacts');vs=['selected_base','exact_to_simpa','simpa_enriched','simp_all_local','aesop_local','linarith_local','nlinarith_local','combined_conservative'];dr=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+')
          def one(x,b):z=list(b.rglob(x));assert len(z)==1,(x,z);return z[0]
          def ai(x,d=10**9):
            try:return int(x)
            except:return d
          def mi(m,ex,tok):
            for k in ex:
              if k in m and ai(m[k])!=10**9:return ai(m[k])
            z=[]
            for k,v in m.items():
              lk=k.lower();iv=ai(v)
              if iv!=10**9 and all(t in lk for t in tok):z.append((0 if lk.startswith('fa_') else 1,len(lk),k,iv))
            return sorted(z)[0][3] if z else 10**9
          def le(b):
            z=[]
            for p in b.rglob('*'):
              if p.is_file() and 'Mock2_FunctionalAnalysis' in p.name and p.suffix in {'.log','.txt'}:z.append(len(re.findall(r'(?m)^.*error:',p.read_text(errors='replace'))))
            q=[x for x in z if x>0];return min(q) if q else(0 if z else 10**9)
          rec=[];h0=None
          for v in vs:
            ds=[p for p in root.iterdir() if p.is_dir() and f'-{v}-highcap2000-' in p.name];assert len(ds)==1,(v,ds);d=ds[0];m=json.loads(one('METRIC.json',d).read_text());p=json.loads(one('PATCH_REPORT.json',d).read_text());sp=one('Mock2_FunctionalAnalysis-candidate.lean',d);s=sp.read_text();sha=hashlib.sha256(s.encode()).hexdigest();assert sha==p['candidate_sha256'];assert p['variant']==v and p['theorem_statements_changed'] is False and p['declaration_order_changed'] is False and p['source_moves']==[] and p['trust_six_zero'] is True and all(int(x)==0 for x in p['trust_counts_after'].values());h=[x.rstrip('\n') for x in s.splitlines(keepends=True) if dr.match(x)];h0=h if v=='selected_base' else h0;assert h==h0,v;me=ai(m.get('Mock2_exit'));ae=ai(m.get('Mock2_Advanced_exit'));fe=ai(m.get('FA_exit'));assert me==0 and ae==0;assert m.get('FA_error_cap_sentinel_present') is False and m.get('FA_inventory_complete_by_header_evidence') is True;ec=mi(m,['FA_error_count','FA_compile_error_count','FA_total_error_count'],['fa','error','count']);ec=le(d) if ec==10**9 else ec;fd=mi(m,['FA_failing_declaration_count','FA_error_declaration_count'],['fa','declaration','count']);us=mi(m,['FA_unique_error_signature_count','FA_error_signature_count'],['fa','signature','count']);wc=mi(m,['FA_warning_count','warning_count'],['warning','count']);rank=[0 if fe==0 else 1,ec,fd,us,wc];rec.append({'variant':v,'source_sha256':sha,'Mock2_exit':me,'Mock2_Advanced_exit':ae,'FA_exit':fe,'error_count':ec,'failing_declaration_count':fd,'unique_error_signature_count':us,'warning_count':wc,'rank':rank,'artifact_directory':d.name,'candidate_path':str(sp)})
          base=next(r for r in rec if r['variant']=='selected_base');best=min(rec,key=lambda r:(r['rank'],vs.index(r['variant'])));better=best['rank']<base['rank'];sel=best if better else base;r={'schema':'fa-v52-strict-selector-v1','github_run_id':os.environ['GITHUB_RUN_ID'],'github_sha':os.environ['GITHUB_SHA'],'target_branch':os.environ['TARGET_BRANCH'],'parent_inventory':json.loads(Path('.github/codex/FA_V51_REMAINING_ERRORS.json').read_text()),'baseline':base,'best_observed':best,'strictly_better':better,'selected_variant':sel['variant'],'selected_source_sha256':sel['source_sha256'],'source_update_authorized':better and sel['variant']!='selected_base','clean_build_claimed':sel['FA_exit']==0,'direct_lean_verified':sel['FA_exit']==0,'theorem_statements_changed':False,'declaration_order_changed':False,'source_moves':[],'records':rec};Path('.github/codex/FA_V52_SELECTION.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n');Path('/tmp/v52-auth.txt').write_text(('1' if r['source_update_authorized'] else '0')+'\n');
          if r['source_update_authorized']:shutil.copyfile(sel['candidate_path'],'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]";git config user.email "41898282+github-actions[bot]@users.noreply.github.com";git add .github/codex/FA_V52_SELECTION.json;if test "$(cat /tmp/v52-auth.txt)" = 1;then git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;fi;if git diff --cached --quiet;then exit 0;fi;git commit -m "Codex: record FA v52 local-search selector result";git pull --rebase origin "$TARGET_BRANCH";git push origin "HEAD:$TARGET_BRANCH"
