name: Codex FA API probe TwoTorus measure attribute v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-two-torus-measure-attribute-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe local instance attribute alignment
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeTwoTorusMeasureAttribute.lean <<'LEAN'
          import Mathlib
          open MeasureTheory
          open scoped BigOperators ENNReal NNReal
          namespace ProbePinnedAttribute
          attribute [local instance] instMeasureSpaceUnitAddCircle
          abbrev TwoTorus := UnitAddTorus (Fin 2)
          noncomputable abbrev TwoTorusL2 := MeasureTheory.Lp ℂ 2 (volume : Measure TwoTorus)
          noncomputable def basis : HilbertBasis (Fin 2 → ℤ) ℂ TwoTorusL2 :=
            UnitAddTorus.mFourierBasis
          example : ⇑basis = UnitAddTorus.mFourierLp 2 := by
            exact UnitAddTorus.coe_mFourierBasis
          noncomputable def mode (m : Fin 2 → ℤ) : TwoTorusL2 :=
            UnitAddTorus.mFourierLp 2 m
          #synth MeasureSpace UnitAddCircle
          #synth MeasureSpace (UnitAddTorus (Fin 2))
          end ProbePinnedAttribute
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeTwoTorusMeasureAttribute.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-two-torus-measure-attribute-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
