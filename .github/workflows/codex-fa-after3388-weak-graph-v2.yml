name: Codex FA after3388 weak graph v2
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3388-weak-graph-v2.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build cumulative v2 runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('scripts/codex_fa_after3388_weak_graph_v1.sh')
          src = p.read_text()
          src = src.replace('codex-fa-after3388-weak-graph-v1', 'codex-fa-after3388-weak-graph-v2')
          marker = '''curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh'''
          assert src.count(marker) == 1
          extra = r'''python3 - <<'PY2'
          from pathlib import Path
          import hashlib,json,re
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before=p.read_text()
          decl_rx=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          seq0=[m.group('name') for m in decl_rx.finditer(before)]
          forbidden=['sorry','admit','axiom','set_option']
          fc0={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',before)) for x in forbidden}
          old_raise='''  exact isClosed_iInter fun v ↦
            ContinuousLinearMap.isClosed_ker (raisingDefect n v)'''
          new_raise='''  exact isClosed_iInter fun
              (v : Mock2FA.PaperCorrections.AutomorphicSobolev.HalfWeightDifferentialOperators.InverseEtaFixedPhaseCore ((n + 1) + 1)) ↦
            ContinuousLinearMap.isClosed_ker (raisingDefect n v)'''
          old_lower='''  exact isClosed_iInter fun v ↦
            ContinuousLinearMap.isClosed_ker (loweringDefect n v)'''
          new_lower='''  exact isClosed_iInter fun
              (v : Mock2FA.PaperCorrections.AutomorphicSobolev.HalfWeightDifferentialOperators.InverseEtaFixedPhaseCore n) ↦
            ContinuousLinearMap.isClosed_ker (loweringDefect n v)'''
          old_norm='''    have hx0 : x = 0 := norm_eq_zero.mp hx
              simp only [hx0, map_zero]'''
          new_norm='''    have hx0 : x = 0 := norm_eq_zero.mp hx
              simpa [hx0]'''
          assert before.count(old_raise)==1, ('raise',before.count(old_raise))
          after=before.replace(old_raise,new_raise,1)
          assert after.count(old_lower)==1, ('lower',after.count(old_lower))
          after=after.replace(old_lower,new_lower,1)
          assert after.count(old_norm)==1, ('norm',after.count(old_norm))
          after=after.replace(old_norm,new_norm,1)
          p.write_text(after)
          seq1=[m.group('name') for m in decl_rx.finditer(after)]
          fc1={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',after)) for x in forbidden}
          assert seq0==seq1 and fc0==fc1
          for theorem in ['weakRaisingSubmodule_isClosed','weakLoweringSubmodule_isClosed','norm_eq_zero_iff_coordinates']:
              marker2='theorem '+theorem
              a0=before.index(marker2); a1=after.index(marker2)
              assert before[a0:before.index(':= by',a0)+5] == after[a1:after.index(':= by',a1)+5]
          b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          out=Path('build-logs/codex-fa-after3388-weak-graph-v2')
          audit=json.loads((out/'PATCH_AUDIT.json').read_text())
          audit['candidate_sha256']=sha
          audit['downstream_probe_verified_targets']=['weakRaisingSubmodule_isClosed','weakLoweringSubmodule_isClosed','norm_eq_zero_iff_coordinates']
          audit['downstream_target_public_headers_byte_identical']=True
          audit['semantic_public_proposition_change']=False
          audit['existing_declaration_relative_order_preserved']=True
          audit['forbidden_lexical_counts_preserved']=True
          (out/'PATCH_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps({'sha256':sha,'bytes':len(b),'lines':len(after.splitlines())},indent=2)+'\n')
          (out/'candidate.sha256').write_text(sha+'\n')
          PY2

          ''' + marker
          src = src.replace(marker, extra, 1)
          Path('/tmp/codex_fa_after3388_weak_graph_v2.sh').write_text(src)
          PY
      - name: Attest, patch, and direct-compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3388_weak_graph_v2.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3388-weak-graph-v2-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3388-weak-graph-v2
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3388-weak-graph-v2/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3388-weak-graph-v2/Mock2_FunctionalAnalysis.exit)"
