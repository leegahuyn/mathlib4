name: GPT QYM Probe20 exact direct Lean v2

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe20-direct-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-probe20-direct-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe20:
    name: Probe17 authority through Probe19 and Probe20 direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      CANONICAL_QYM_SHA256: 698c7625628ccc654ca7be713944930fdccf12dd78a26937d3f45c9b6982a9f0
      PROBE17_SHA256: 971d9fd6c1cba701f6404b6303668b61d3de9f4b5d71281ab7b88f1530009bf7
      PROBE17_BLOB: 061345d55ea0ce66c01911454df3c6f2c509fa91
      PROBE19_SHA256: 069c1476163e3b87670e8eae0960f7975691f83a2ac1440863387eb2036cced5
      PROBE19_BLOB: cb104f9129f53d4db10364611bcf95911fd3ab5c
      PROBE20_SHA256: 94fceba9313ded915c6e50a17e156699eb48170595b062b1138d04b6abe31534
      PROBE17_RUN: '32002705164'
      PROBE17_ARTIFACT: qym-repair-probe17-integrated-befb4ddaf7be84949c35bb66792f8c74c8e58699-attempt1
      QYM_SOURCE: PrimalitySheafVerification/QYM.lean
      OLEAN_ROOT: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-probe20-v2

    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate branch canonical source patch programs and toolchain
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$CANONICAL_QYM_SHA256"
          test -f .github/qym_probe19_patch.py
          test -f .github/qym_probe20_patch.py
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.before.txt"
          test ! -s "$OUT/git-status.before.txt"

      - name: Download immutable Probe17 authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PROBE17_ARTIFACT }}
          path: ${{ runner.temp }}/probe17-authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32002705164

      - name: Gate exact Probe17 direct authority
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/probe17-authority"
          for f in QYM.candidate-probe17.lean QYM.exit QYM.error-headers.txt QYM.panic-lines.txt PROBE_RESULT.json; do
            test -f "$A/$f"
          done
          test "$(sha256sum "$A/QYM.candidate-probe17.lean" | awk '{print $1}')" = "$PROBE17_SHA256"
          test "$(git hash-object --no-filters "$A/QYM.candidate-probe17.lean")" = "$PROBE17_BLOB"
          test "$(cat "$A/QYM.exit")" = 1
          test "$(wc -l < "$A/QYM.error-headers.txt")" -eq 95
          test ! -s "$A/QYM.panic-lines.txt"
          cp "$A/QYM.candidate-probe17.lean" "$OUT/QYM.candidate-probe17.lean"
          cp "$A/PROBE_RESULT.json" "$OUT/PROBE17_RESULT.json"
          cp "$A/QYM.error-headers.txt" "$OUT/QYM.probe17.error-headers.txt"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore exact dependency objects
        id: deps-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure verified dependency objects
        shell: bash
        env:
          CACHE_HIT: ${{ steps.deps-cache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN_ROOT"
          if [[ "$CACHE_HIT" != true ]]; then
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              if [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]]; then
                cap=2000
              fi
              rm -f "$OLEAN_ROOT/$stem.olean" "$OLEAN_ROOT/$stem.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN_ROOT/$stem.olean" -i "$OLEAN_ROOT/$stem.ilean" \
                "PrimalitySheafVerification/$stem.lean" > "$OUT/$stem.log" 2>&1
            done
          fi
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN_ROOT/$stem.olean"
            test -s "$OLEAN_ROOT/$stem.ilean"
          done

      - name: Materialize exact Probe20 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM_SOURCE" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.candidate-probe17.lean" "$QYM_SOURCE"
          python3 -B .github/qym_probe19_patch.py "$QYM_SOURCE" | tee "$OUT/probe19-patch.txt"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$PROBE19_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$PROBE19_BLOB"
          cp "$QYM_SOURCE" "$OUT/QYM.candidate-probe19.lean"
          python3 -B .github/qym_probe20_patch.py "$QYM_SOURCE" | tee "$OUT/probe20-patch.txt"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$PROBE20_SHA256"
          git hash-object --no-filters "$QYM_SOURCE" | tee "$OUT/QYM.probe20.blob"
          cp "$QYM_SOURCE" "$OUT/QYM.candidate-probe20.lean"
          sha256sum "$OUT/QYM.candidate-probe17.lean" "$OUT/QYM.candidate-probe19.lean" \
            "$OUT/QYM.candidate-probe20.lean" > "$OUT/candidate-chain.sha256"

      - name: Direct Lean compile exact Probe20
        shell: bash
        run: |
          set -euo pipefail
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.probe20.olean" -i "$RUNNER_TEMP/QYM.probe20.ilean" "$QYM_SOURCE" \
            > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe20.olean" -i "$RUNNER_TEMP/QYM.probe20.ilean" \
              "$QYM_SOURCE" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe20.olean"
            test -s "$RUNNER_TEMP/QYM.probe20.ilean"
            cp "$RUNNER_TEMP/QYM.probe20.olean" "$OUT/QYM.probe20.olean"
            cp "$RUNNER_TEMP/QYM.probe20.ilean" "$OUT/QYM.probe20.ilean"
            sha256sum "$OUT/QYM.probe20.olean" "$OUT/QYM.probe20.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical source and collect coded diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$OUT/QYM.canonical.lean" ]]; then
            cp "$OUT/QYM.canonical.lean" "$QYM_SOURCE"
          fi
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$CANONICAL_QYM_SHA256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.after.txt"
          test ! -s "$OUT/git-status.after.txt"
          python3 - "$OUT" <<'PY'
          import collections, hashlib, json, os, re, sys
          from pathlib import Path
          root = Path(sys.argv[1])
          raw = (root / 'QYM.log').read_bytes() if (root / 'QYM.log').exists() else b''
          text = raw.decode('utf-8', errors='replace')
          pat = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
                           r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*'
                           r'(?P<message>.*)$', re.M)
          rows = []
          for m in pat.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [r for r in rows if r['severity'] == 'error']
          warnings = [r for r in rows if r['severity'] == 'warning']
          panics = re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          (root / 'QYM.diagnostics.jsonl').write_text(
              ''.join(json.dumps(r, sort_keys=True) + '\n' for r in rows), encoding='utf-8')
          (root / 'QYM.error-headers.txt').write_text(
              ''.join('{}:{}:{}: error{}: {}\n'.format(
                  r['file'], r['line'], r['column'], f"({r['code']})" if r['code'] else '', r['message'])
                  for r in errors), encoding='utf-8')
          (root / 'QYM.panic-lines.txt').write_text(
              ''.join(x + '\n' for x in panics), encoding='utf-8')
          rc = int((root / 'QYM.exit').read_text().strip()) if (root / 'QYM.exit').exists() else None
          candidate = root / 'QYM.candidate-probe20.lean'
          blob = (root / 'QYM.probe20.blob').read_text().strip() if (root / 'QYM.probe20.blob').exists() else None
          result = {
              'schema': 'qym-probe20-exact-direct-v2',
              'github_sha': os.environ['GITHUB_SHA'],
              'baseline_qym_sha256': os.environ['PROBE17_SHA256'],
              'candidate_qym_sha256': hashlib.sha256(candidate.read_bytes()).hexdigest() if candidate.exists() else None,
              'candidate_qym_blob': blob,
              'exit': rc,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in errors).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': rc == 0 and not errors and not panics,
          }
          (root / 'PROBE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload immutable Probe20 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe20-v2-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-probe20-v2/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless exact direct Lean TRUE PASS
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['candidate_qym_sha256'] == os.environ['PROBE20_SHA256']
          assert r['panic_lines'] == 0
          if not r['semantic_pass']:
              raise SystemExit(r['exit'] or 1)
          PY
