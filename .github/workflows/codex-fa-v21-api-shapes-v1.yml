name: Codex FA v22 cumulative root batch highcap2000

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-v21-api-shapes-v1.yml
      - scripts/fa_v22_cumulative_batch.py
      - scripts/fa_v22_trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Materialize exact v21 and apply audited v22 batch
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_SOURCE_SHA256: 8f6cc2461efb07d09c07ecea6c6651f23ab3ccc2fa2989d6224afc7afe5167d0
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v22-cumulative-highcap2000
          mkdir -p "$OUT" /tmp/v21
          ART=9158161807
          DIGEST=sha256:c956ad54be3a280df71857d6c72295004605638f6a5583b44cb2d5e49d85f0bb
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" >/tmp/v21.zip
          test "sha256:$(sha256sum /tmp/v21.zip | awk '{print $1}')" = "$DIGEST"
          unzip -q /tmp/v21.zip -d /tmp/v21
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, os, shutil
          root=Path('/tmp/v21'); sha=os.environ['BASE_SOURCE_SHA256']
          hits=[p for p in root.rglob('Mock2_FunctionalAnalysis.lean')
                if 'PrimalitySheafVerification' in p.as_posix()
                and hashlib.sha256(p.read_bytes()).hexdigest()==sha]
          assert len(hits)==1, hits
          shutil.copy2(hits[0], Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'))
          PY
          python3 scripts/fa_v22_cumulative_batch.py PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT"
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$(cat "$OUT/candidate.sha256")"

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v22-cumulative-highcap2000
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1

      - name: Direct full dependency compile highcap2000
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-v22-cumulative-highcap2000
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){
            local s="$1" cap="$2"
            local o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean
            local i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean
            rm -f "$o" "$i"
            :>"$OUT/$s.executed"
            set +e
            lake env lean "-DmaxErrors=$cap" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1
            x=$?
            set -e
            echo "$x" >"$OUT/$s.exit"
          }
          one Mock2 1
          one Mock2_Advanced 1
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$(cat "$OUT/candidate.sha256")"
          one Mock2_FunctionalAnalysis 2000

      - name: Build normalized metrics and inventory
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v22-cumulative-highcap2000
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import collections, hashlib, json, os, re
          out=Path('build-logs/codex-fa-v22-cumulative-highcap2000')
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          s=p.read_text(errors='replace'); b=p.read_bytes()
          dr=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          ds=list(dr.finditer(s)); starts=[s.count('\n',0,m.start())+1 for m in ds]
          er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$')
          di=[]; log=out/'Mock2_FunctionalAnalysis.log'
          for raw in log.read_text(errors='replace').splitlines() if log.exists() else []:
            m=er.match(raw)
            if not m: continue
            ln=int(m.group(1)); col=int(m.group(2)); idx=bisect_right(starts,ln)-1
            msg=m.group(3).strip(); sig=re.sub(r'\s+',' ',msg)
            di.append({'ordinal':len(di)+1,'line':ln,'column':col,
              'declaration':ds[idx].group('name') if idx>=0 else None,
              'declaration_index':idx if idx>=0 else None,
              'message':msg,'normalized_message_signature':sig})
          first=di[0] if di else {}
          stems=['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis']
          ex={x:int((out/f'{x}.exit').read_text()) if (out/f'{x}.exit').exists() else None for x in stems}
          metric={'schema':'fa-v22-cumulative-highcap2000','run_id':os.environ.get('GITHUB_RUN_ID'),
            'head_sha':os.environ.get('GITHUB_SHA'),'source_sha256':hashlib.sha256(b).hexdigest(),
            'source_bytes':len(b),'source_lines':len(s.splitlines()),
            'source_identity_locked_after_materialization':(out/'candidate.sha256').exists() and hashlib.sha256(b).hexdigest()==(out/'candidate.sha256').read_text().strip(),
            'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],
            'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),
            'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),
            'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in stems),
            'FA_compile_max_errors':2000,'FA_error_headers_captured':len(di),
            'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('column'),
            'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),
            'FA_first_error_message':first.get('message'),
            'unique_declarations_with_errors':len(set((d['declaration_index'],d['declaration']) for d in di)),
            'unique_normalized_message_signatures':len(set(d['normalized_message_signature'] for d in di))}
          (out/'FULL_DIAGNOSTICS.json').write_text(json.dumps(di,indent=2,sort_keys=True)+'\n')
          dc=collections.Counter((d['declaration_index'],d['declaration']) for d in di)
          (out/'DIAGNOSTIC_DECLARATION_COUNTS.json').write_text(json.dumps([
            {'declaration_index':k[0],'declaration':k[1],'count':v}
            for k,v in sorted(dc.items(),key=lambda kv:(kv[0][0] if kv[0][0] is not None else -1,kv[0][1] or ''))],indent=2,sort_keys=True)+'\n')
          (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          print(json.dumps(metric,indent=2,sort_keys=True))
          PY

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v22-cumulative-highcap2000-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-v22-cumulative-highcap2000
          retention-days: 30

      - name: Preserve actual FA exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-v22-cumulative-highcap2000/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-v22-cumulative-highcap2000/Mock2_FunctionalAnalysis.exit)"
