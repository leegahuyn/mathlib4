name: Codex FA v21 API shapes v1

# trigger: dense-inner-right-6
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-v21-api-shapes-v1.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile dense inner-right API probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/V21ApiShapes.lean <<'LEAN'
          import Mathlib

          open Set Function

          #check DenseRange.eq_zero_of_inner_right
          #check DenseRange.eq_zero_of_inner_right (𝕜 := ℂ)

          section
          variable {E : Type*}
          variable [NormedAddCommGroup E] [InnerProductSpace ℂ E]
          variable (f : E → E) (hf : DenseRange f) (y : E)

          example (h : ∀ x, inner ℂ (f x) y = 0) : y = 0 := by
            exact hf.eq_zero_of_inner_right (𝕜 := ℂ) h
          end
          LEAN
          set +e
          lake env lean -DmaxErrors=20 -DwarningAsError=false /tmp/V21ApiShapes.lean 2>&1 | tee /tmp/v21-api-shapes.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/v21-api-shapes.exit
          exit "$x"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v21-api-shapes-v1-${{ github.sha }}
          path: |
            /tmp/V21ApiShapes.lean
            /tmp/v21-api-shapes.log
            /tmp/v21-api-shapes.exit
          retention-days: 30
