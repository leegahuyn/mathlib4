name: GPT QYM GB79 V11 cluster tournament

on:
  push:
    branches:
      - gpt/qym-gb79-v11-cluster-tournament-20260820
    paths:
      - .github/qym_gb79_v11_candidate.py
      - .github/qym_gb79_v11_select.py
      - .github/workflows/gpt-qym-gb79-v11-cluster-tournament.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb79-v11-cluster-tournament
  cancel-in-progress: false

env:
  BRANCH: gpt/qym-gb79-v11-cluster-tournament-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  OUT_ROOT: /tmp/qym-gb79-v11

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify pinned environment and exact 79-error authority
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          frontier = Path('.github/qym-frontier')
          rows = []
          for p in frontier.glob('*.json'):
              n = p.name.upper()
              if 'RESULT' not in n or ('V10' not in n and '79' not in n):
                  continue
              try:
                  r = json.loads(p.read_text())
              except Exception:
                  continue
              if isinstance(r, dict) and int(r.get('error_headers', -1)) == 79 and int(r.get('panic_lines', -1)) == 0:
                  s = r.get('candidate_qym_sha256')
                  if isinstance(s, str) and len(s) == 64:
                      rows.append((int(r.get('run_id') or 0), p, r))
          if not rows:
              raise SystemExit('no verified checked-in 79-error V10/V10.1 result')
          rows.sort(reverse=True, key=lambda x: (x[0], x[1].name))
          _, result_path, result = rows[0]
          expected = result['candidate_qym_sha256']
          sources = [Path('PrimalitySheafVerification/QYM.lean'), *frontier.glob('QYM*.lean')]
          exact = [p for p in sources if p.is_file() and hashlib.sha256(p.read_bytes()).hexdigest() == expected]
          if not exact:
              raise SystemExit(f'exact authority source absent: {expected}')
          Path('/tmp/qym-gb79-authority.json').write_text(json.dumps({
              'result_file': str(result_path),
              'result': result,
              'source_file': str(exact[0]),
              'source_sha256': expected,
          }, indent=2, sort_keys=True) + '\n')
          print(Path('/tmp/qym-gb79-authority.json').read_text())
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT" "$OLEAN"
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT_ROOT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for a in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT_ROOT/toolchain.log" 2>&1 && break
            sleep $((a * 5))
          done
          lean --version | tee "$OUT_ROOT/lean-version.txt"
          lake --version | tee "$OUT_ROOT/lake-version.txt"
          for a in 1 2 3 4 5; do
            lake exe cache get >> "$OUT_ROOT/mathlib-cache.log" 2>&1 && break
            sleep $((a * 5))
          done

      - name: Restore completed QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v4-${{ runner.os }}-
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure completed dependencies only
        shell: bash
        run: |
          set -euo pipefail
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$s.olean" || ! -s "$OLEAN/$s.ilean" ]]; then
              cap=1
              if [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]]; then
                cap=2000
              fi
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT_ROOT/$s.log" 2>&1
            fi
            test -s "$OLEAN/$s.olean"
            test -s "$OLEAN/$s.ilean"
          done

      - name: Upload dependency objects and authority evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb79-v11-prepared-${{ github.sha }}
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
            /tmp/qym-gb79-authority.json
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 7

  repair:
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant:
          - direct
          - structural
          - direct_atlas
          - structural_atlas
          - direct_atlas_tail_normnum
          - structural_atlas_tail_simppow
          - direct_remove_tail_normcast
          - structural_remove_tail_normnum
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT_ROOT" "$OLEAN"
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT_ROOT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for a in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT_ROOT/toolchain.log" 2>&1 && break
            sleep $((a * 5))
          done
          for a in 1 2 3 4 5; do
            lake exe cache get >> "$OUT_ROOT/mathlib-cache.log" 2>&1 && break
            sleep $((a * 5))
          done

      - name: Download prepared dependencies
        uses: actions/download-artifact@v4
        with:
          name: qym-gb79-v11-prepared-${{ github.sha }}
          path: .

      - name: Verify dependency objects
        shell: bash
        run: |
          set -euo pipefail
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean"
            test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize and fully compile ${{ matrix.variant }}
        shell: bash
        run: python3 -B .github/qym_gb79_v11_candidate.py '${{ matrix.variant }}'

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb79-v11-candidate-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb79-v11/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30

  select:
    needs: repair
    if: always() && needs.repair.result != 'cancelled'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Download all V11 candidate evidence
        uses: actions/download-artifact@v4
        with:
          pattern: qym-gb79-v11-candidate-*-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb79-v11-downloads
          merge-multiple: false

      - name: Select the lowest verified direct-Lean frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/qym_gb79_v11_select.py \
            /tmp/qym-gb79-v11-downloads /tmp/qym-gb79-v11-selection
          cat /tmp/qym-gb79-v11-selection/SELECTION.json

      - name: Prepare V12 handoff from V11 result
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qym-gb79-v11-selection
          if [[ -s /tmp/qym-gb79-v11-selection/BEST_RESULT.json ]]; then
            jq '{
              schema: "qym-v12-prep-v1",
              base_variant: .variant,
              base_error_headers: .error_headers,
              base_qym_sha256: .candidate_qym_sha256,
              first_error: .first_error,
              last_error: .last_error,
              error_codes: .error_codes,
              source_run_id: .run_id
            }' /tmp/qym-gb79-v11-selection/BEST_RESULT.json \
              > /tmp/qym-gb79-v11-selection/V12_PREP.json
          else
            printf '%s\n' '{"schema":"qym-v12-prep-v1","status":"no-strict-v11-improvement"}' \
              > /tmp/qym-gb79-v11-selection/V12_PREP.json
          fi

      - name: Promote one verified strict improvement
        shell: bash
        run: |
          set -euo pipefail
          strict="$(jq -r '.strict_improvement_found' /tmp/qym-gb79-v11-selection/SELECTION.json)"
          if [[ "$strict" != true ]]; then
            echo 'No candidate beat the verified 79-error authority; source remains unchanged.'
            exit 0
          fi
          test -s /tmp/qym-gb79-v11-selection/QYM.best.lean
          test -s /tmp/qym-gb79-v11-selection/BEST_RESULT.json
          errors="$(jq -r '.error_headers' /tmp/qym-gb79-v11-selection/BEST_RESULT.json)"
          panic="$(jq -r '.panic_lines' /tmp/qym-gb79-v11-selection/BEST_RESULT.json)"
          expected="$(jq -r '.candidate_qym_sha256' /tmp/qym-gb79-v11-selection/BEST_RESULT.json)"
          actual="$(sha256sum /tmp/qym-gb79-v11-selection/QYM.best.lean | awk '{print $1}')"
          test "$errors" -lt 79
          test "$panic" -eq 0
          test "$actual" = "$expected"

          cp /tmp/qym-gb79-v11-selection/QYM.best.lean "$QYM"
          mkdir -p .github/qym-frontier
          cp /tmp/qym-gb79-v11-selection/QYM.best.lean \
            .github/qym-frontier/QYM_GB79_V11_BEST.lean
          cp /tmp/qym-gb79-v11-selection/BEST_RESULT.json \
            .github/qym-frontier/GB79_V11_RESULT.json
          cp /tmp/qym-gb79-v11-selection/SELECTION.json \
            .github/qym-frontier/GB79_V11_SELECTION.json
          cp /tmp/qym-gb79-v11-selection/V12_PREP.json \
            .github/qym-frontier/GB79_V12_PREP.json

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" \
            .github/qym-frontier/QYM_GB79_V11_BEST.lean \
            .github/qym-frontier/GB79_V11_RESULT.json \
            .github/qym-frontier/GB79_V11_SELECTION.json \
            .github/qym-frontier/GB79_V12_PREP.json
          git commit -m "QYM V11: promote verified ${errors}-error frontier"
          git push origin "HEAD:$BRANCH"

      - name: Upload selector and V12-preparation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb79-v11-selection-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb79-v11-selection
          if-no-files-found: error
          retention-days: 30
