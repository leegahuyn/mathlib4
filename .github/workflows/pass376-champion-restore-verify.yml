name: PASS376 immutable champion restore and verify

on:
  push:
    branches:
      - champion/fa-pass376-31725-07f6efd-immutable
    paths:
      - build-logs/pass376-champion-restore/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  restore-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact immutable champion branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: champion/fa-pass376-31725-07f6efd-immutable
          fetch-depth: 1600
          persist-credentials: true

      - name: Restore exact PASS376 source from artifact and verify SHA256
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          EXPECTED_SHA256: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
          ARTIFACT_ID: '9024606745'
        run: |
          set -euo pipefail
          rm -rf /tmp/pass376-artifact /tmp/pass376-artifact.zip
          mkdir -p /tmp/pass376-artifact
          curl --retry 5 --retry-all-errors --fail --location \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            -o /tmp/pass376-artifact.zip
          python3 - <<'PY'
          from pathlib import Path
          from zipfile import ZipFile
          import hashlib, os, shutil

          archive = Path('/tmp/pass376-artifact.zip')
          root = Path('/tmp/pass376-artifact')
          with ZipFile(archive) as zf:
              zf.extractall(root)

          src = root / 'source' / 'Mock2_FunctionalAnalysis-pass376.lean'
          if not src.is_file():
              raise SystemExit(f'missing restored source: {src}')
          actual = hashlib.sha256(src.read_bytes()).hexdigest()
          expected = os.environ['EXPECTED_SHA256']
          if actual != expected:
              raise SystemExit(f'SHA256 mismatch: expected {expected}, got {actual}')

          declared = (root / 'source-sha256.txt').read_text(encoding='utf-8').strip()
          if not declared.startswith(expected + '  '):
              raise SystemExit(f'artifact declaration mismatch: {declared!r}')

          dst = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          shutil.copyfile(src, dst)
          print(f'restored={dst}')
          print(f'sha256={actual}')
          print(f'lines={sum(1 for _ in src.open(encoding="utf-8"))}')
          PY
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Commit checked-in immutable champion source before compilation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if git diff --cached --quiet; then
            echo 'Champion source already checked in with exact artifact bytes.'
          else
            git commit -m 'chore: check in immutable PASS376 FA champion [skip ci]'
            git push origin HEAD:champion/fa-pass376-31725-07f6efd-immutable
          fi

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          lake exe cache get | tee /tmp/cache-get.log

      - name: Directly compile prerequisites then reproduce FA frontier
        id: verify
        shell: bash
        env:
          EXPECTED_SHA256: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
          REQUIRED_FIRST_ERROR: '31725'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/pass376-champion-restore
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          rm -f "$d"/*.log "$d"/*.exit "$d"/CURRENT.json "$d"/CURRENT.txt "$d"/REPRODUCED_31725_OR_BETTER
          cp /tmp/lean-version.txt "$d/lean-version.txt"
          cp /tmp/lake-version.txt "$d/lake-version.txt"
          cp /tmp/cache-get.log "$d/cache-get.log"

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          compile_one Mock2 400
          rc_m2=$?
          compile_one Mock2_Advanced 400
          rc_m2a=$?

          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 500
            rc_fa=$?
          else
            echo 'FA compile blocked by prerequisite failure' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          d = Path('build-logs/pass376-champion-restore')
          expected = os.environ['EXPECTED_SHA256']
          required = int(os.environ['REQUIRED_FIRST_ERROR'])
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          source_sha = hashlib.sha256(src.read_bytes()).hexdigest()
          if source_sha != expected:
              raise SystemExit(f'checked-in source SHA changed: {source_sha}')

          pat = re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          rows = {}
          for stem in ['Mock2', 'Mock2_Advanced', 'Mock2_FunctionalAnalysis']:
              log_path = d / f'{stem}.log'
              text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
              matches = list(pat.finditer(text))
              exit_path = d / f'{stem}.exit'
              rows[stem] = {
                  'exit_code': int(exit_path.read_text()) if exit_path.exists() else 999,
                  'error_headers': len(matches),
                  'first_error_line': int(matches[0].group(1)) if matches else 0,
                  'first_error_col': int(matches[0].group(2)) if matches else 0,
              }

          m2_ok = rows['Mock2']['exit_code'] == 0 and rows['Mock2']['error_headers'] == 0
          m2a_ok = rows['Mock2_Advanced']['exit_code'] == 0 and rows['Mock2_Advanced']['error_headers'] == 0
          fa = rows['Mock2_FunctionalAnalysis']
          fa_metric_ok = fa['exit_code'] == 0 or fa['first_error_line'] >= required
          reproduced = m2_ok and m2a_ok and fa_metric_ok
          status = {
              'complete': reproduced,
              'purpose': 'restore immutable PASS376 champion and reproduce first error 31725 or better',
              'artifact_run_id': 31267332510,
              'artifact_id': 9024606745,
              'expected_source_sha256': expected,
              'actual_source_sha256': source_sha,
              'required_first_error': required,
              'results': rows,
              'champion_rule': 'exit 0, otherwise first_error_line strictly greater than current champion for later promotion',
          }
          (d / 'CURRENT.json').write_text(json.dumps(status, indent=2), encoding='utf-8')
          (d / 'CURRENT.txt').write_text(
              '\n'.join(
                  f"{name}: exit={row['exit_code']} errors={row['error_headers']} first={row['first_error_line']}:{row['first_error_col']}"
                  for name, row in rows.items()
              ) + f"\nsource_sha256={source_sha}\nreproduced={str(reproduced).lower()}\n",
              encoding='utf-8')
          (d / 'source-sha256.txt').write_text(f'{source_sha}  PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\n', encoding='utf-8')
          if reproduced:
              (d / 'REPRODUCED_31725_OR_BETTER').touch()
          print(json.dumps(status, indent=2))
          PY

          if test -f "$d/REPRODUCED_31725_OR_BETTER"; then
            final=0
          else
            final=1
          fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit authoritative champion reproduction evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/pass376-champion-restore
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record authoritative PASS376 champion reproduction [skip ci]'
            git push origin HEAD:champion/fa-pass376-31725-07f6efd-immutable
          fi

      - name: Upload immutable champion verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-immutable-champion-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/pass376-champion-restore
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce exact source and 31,725-or-better reproduction
        if: always()
        env:
          FINAL_EXIT: ${{ steps.verify.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
