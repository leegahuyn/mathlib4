name: Final Authority V6 Actual Lean Sweep

on:
  push:
    branches:
      - gpt/final-authority-mass-repair-v5-20260820
    paths:
      - .github/workflows/final-authority-mass-repair-v6.yml
      - scripts/final_authority_source_patch_v6.py
      - scripts/final_authority_gate_v5.py
  workflow_dispatch:

concurrency:
  group: final-authority-v6-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actual-lean-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Apply and commit deterministic source batch
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/final_authority_source_patch_v6.py
          python3 -m py_compile scripts/final_authority_gate_v5.py
          python3 scripts/final_authority_source_patch_v6.py | tee V6_SOURCE_PATCH.txt
          git diff --check
          git config user.name final-authority-bot
          git config user.email final-authority-bot@users.noreply.github.com
          git add -- PrimalitySheafVerification/Spt1.lean PrimalitySheafVerification/Mock3.lean
          if ! git diff --cached --quiet; then
            git commit -m "Final authority: commit Spt1 and Mock3 source batch"
            git push origin HEAD:refs/heads/gpt/final-authority-mass-repair-v5-20260820
          fi
          test -z "$(git status --short --untracked-files=no)"
          git rev-parse HEAD | tee V6_SOURCE_COMMIT.txt

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee V6_LEAN_VERSION.txt
          lake --version | tee V6_LAKE_VERSION.txt

      - name: Verify M1A full-file actual Lean
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          timeout --signal=TERM --kill-after=60s 10800s \
            lake env lean -DmaxErrors=2000 -DwarningAsError=false \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            2>&1 | tee V6_M1A.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > V6_M1A_EXIT.txt
          test "$rc" = 0
          ! grep -Eq ':[0-9]+:[0-9]+: error' V6_M1A.log
          ! grep -Eqi 'internal error|uncaught exception|panic!' V6_M1A.log

      - name: Run Mock3 Final13 BuildAll clean clean checklist chain
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-mass-repair-v5-20260820
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          python3 scripts/final_authority_gate_v5.py 2>&1 | tee V6_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > V6_AUTHORITY_EXIT.txt

      - name: Print complete failure frontier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          for file in \
            PREFLIGHT.json \
            MOCK3_CANONICAL_RESULT.json \
            FINAL13_DIAGNOSTIC_SWEEP.json \
            FINAL_13_BUILD_RESULTS.json \
            BUILDALL_RESULT.json \
            CLEAN_BUILD_1_RESULT.json \
            CLEAN_BUILD_2_RESULT.json \
            FORBIDDEN_AUDIT.json \
            FINAL_SOURCE_IDENTITY.json \
            FINAL_15_CHECKLIST_RESULT.json
          do
            echo "=== $file ==="
            cat ".final_authority/$file" 2>/dev/null || true
          done

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-v6-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            V6_SOURCE_PATCH.txt
            V6_SOURCE_COMMIT.txt
            V6_LEAN_VERSION.txt
            V6_LAKE_VERSION.txt
            V6_M1A.log
            V6_M1A_EXIT.txt
            V6_AUTHORITY.log
            V6_AUTHORITY_EXIT.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Enforce complete authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat V6_M1A_EXIT.txt)" = 0
          test "$(cat V6_AUTHORITY_EXIT.txt)" = 0
