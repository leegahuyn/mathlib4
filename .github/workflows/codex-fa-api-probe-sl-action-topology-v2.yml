name: Codex FA API probe SL action topology v2

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-sl-action-topology-v2.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: codex-fa-api-probe-sl-action-topology-v2
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan-init.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact cast-action and continuity bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSLActionTopologyV2.lean <<'LEAN'
          import Mathlib.Analysis.Complex.UpperHalfPlane.Metric
          import Mathlib.Tactic
          open Matrix Matrix.SpecialLinearGroup UpperHalfPlane Complex
          open scoped MatrixGroups UpperHalfPlane

          example (g : SL(2, ℤ)) (x : ℍ) :
              g • x = (Matrix.SpecialLinearGroup.map (Int.castRingHom ℝ) g) • x := by
            apply UpperHalfPlane.ext
            rw [UpperHalfPlane.coe_specialLinearGroup_apply,
              UpperHalfPlane.coe_specialLinearGroup_apply]
            simp

          example (g : SL(2, ℤ)) : Continuous (fun w : ℍ => (g • w).im) := by
            let gReal : SL(2, ℝ) :=
              Matrix.SpecialLinearGroup.map (Int.castRingHom ℝ) g
            have hAction : ∀ x : ℍ, g • x = gReal • x := by
              intro x
              apply UpperHalfPlane.ext
              rw [UpperHalfPlane.coe_specialLinearGroup_apply,
                UpperHalfPlane.coe_specialLinearGroup_apply]
              simp [gReal]
            have hActionFn :
                (fun w : ℍ => (g • w).im) = (fun w : ℍ => (gReal • w).im) := by
              funext w
              rw [hAction w]
            rw [hActionFn]
            exact continuous_im.comp (continuous_const_smul gReal)
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeSLActionTopologyV2.lean | tee /tmp/sl-action-topology-v2.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-sl-action-topology-v2-${{ github.sha }}
          path: /tmp/sl-action-topology-v2.log
          if-no-files-found: warn
          retention-days: 7
