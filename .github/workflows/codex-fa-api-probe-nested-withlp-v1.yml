name: Codex FA API probe nested WithLp v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-nested-withlp-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Prove nested WithLp Tendsto shape
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeNestedWithLp.lean <<'LEAN'
          import Mathlib
          open Filter Topology
          variable {A B C : Type*}
          variable [TopologicalSpace A] [TopologicalSpace B] [TopologicalSpace C]
          variable {α : Type*} [TopologicalSpace α]
          example (x : WithLp 2 (A × WithLp 2 (B × C))) :
              WithLp.toLp 2 (x.fst, x.snd) = x := by rfl
          example (y : WithLp 2 (B × C)) :
              WithLp.toLp 2 (y.fst, y.snd) = y := by rfl
          example (l : Filter α) (a : A) (b : B) (c : C)
              (fa : α → A) (fb : α → B) (fc : α → C)
              (ha : Tendsto fa l (𝓝 a))
              (hb : Tendsto fb l (𝓝 b))
              (hc : Tendsto fc l (𝓝 c)) :
              Tendsto (fun j => WithLp.toLp 2 (fa j, WithLp.toLp 2 (fb j, fc j)))
                l (𝓝 (WithLp.toLp 2 (a, WithLp.toLp 2 (b,c)))) := by
            have hInner := ((WithLp.prod_continuous_toLp (p := 2) B C).tendsto (b,c)).comp
              (hb.prodMk_nhds hc)
            exact ((WithLp.prod_continuous_toLp (p := 2) A (WithLp 2 (B × C))).tendsto
              (a, WithLp.toLp 2 (b,c))).comp (ha.prodMk_nhds hInner)
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeNestedWithLp.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-nested-withlp-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
