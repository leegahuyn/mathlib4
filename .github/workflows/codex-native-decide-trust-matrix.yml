name: Codex native_decide kernel-trust matrix

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260810
    paths:
      - .github/workflows/codex-native-decide-trust-matrix.yml
      - .github/scripts/native_decide_prepare_trust_repair.py
      - .github/scripts/native_decide_trust_matrix_runner.py
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-native-decide-trust-${{ github.ref }}
  cancel-in-progress: false

jobs:
  isolated-trust-repair:
    name: native_decide trust (${{ matrix.trust_variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 2
      matrix:
        trust_variant:
          - kernel
          - elab
    env:
      TRUST_VARIANT: ${{ matrix.trust_variant }}
      MAX_ERRORS: "160"
      EVIDENCE_ROOT: /tmp/codex-native-decide-trust/${{ matrix.trust_variant }}
      SETUP_ROOT: /tmp/codex-native-decide-setup/${{ matrix.trust_variant }}

    steps:
      - name: Checkout exact triggering commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository-pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${SETUP_ROOT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          printf '%s\n' "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)" \
            2>&1 | tee "${SETUP_ROOT}/toolchain-install.log"
          lake env lean --version | tee "${SETUP_ROOT}/lean-version.txt"
          lake --version | tee "${SETUP_ROOT}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${SETUP_ROOT}/"
          lake exe cache get 2>&1 | tee "${SETUP_ROOT}/cache-get.log"

      - name: Materialize one guarded candidate and run the strict direct matrix
        id: runner
        shell: bash
        run: |
          set -uo pipefail
          if test -e "${EVIDENCE_ROOT}"; then
            echo "refusing to reuse non-fresh evidence root: ${EVIDENCE_ROOT}" >&2
            exit 2
          fi
          mkdir -p "$(dirname "${EVIDENCE_ROOT}")"
          set +e
          python3 .github/scripts/native_decide_trust_matrix_runner.py \
            --repo-root "${GITHUB_WORKSPACE}" \
            --out "${EVIDENCE_ROOT}" \
            --preparer .github/scripts/native_decide_prepare_trust_repair.py \
            --variant "${TRUST_VARIANT}" \
            --max-errors "${MAX_ERRORS}"
          code=$?
          set -e
          if test -d "${EVIDENCE_ROOT}"; then
            printf '%s\n' "${code}" > "${EVIDENCE_ROOT}/runner.exit"
            mkdir -p "${EVIDENCE_ROOT}/provenance"
            sha256sum \
              .github/scripts/native_decide_prepare_trust_repair.py \
              .github/scripts/native_decide_trust_matrix_runner.py \
              .github/workflows/codex-native-decide-trust-matrix.yml \
              > "${EVIDENCE_ROOT}/provenance/draft-input-sha256.txt"
            cp lean-toolchain lake-manifest.json "${EVIDENCE_ROOT}/provenance/"
          fi
          # Artifact upload and the explicit final gate must still run on failure.
          exit 0

      - name: Print warning error PANIC and artifact metrics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${EVIDENCE_ROOT}/METRIC.json" <<'PY'
          import json
          import sys

          path = sys.argv[1]
          metric = json.load(open(path, encoding="utf-8"))

          def compact(result):
              artifacts = result.get("artifacts", {})
              return {
                  "module": result.get("module", result.get("label")),
                  "exit": result.get("exit"),
                  "warnings": result.get("warning_header_count"),
                  "errors": result.get("error_header_count"),
                  "panics": result.get("panic_count"),
                  "max_errors_cap": result.get("max_errors_cap_reached_count"),
                  "elapsed_seconds": result.get("elapsed_seconds"),
                  "clean": result.get("clean"),
                  "artifacts": {
                      name: {
                          "exists": row.get("exists"),
                          "bytes": row.get("bytes"),
                          "sha256": row.get("sha256"),
                          "forbidden_absolute_zero": row.get("forbidden_absolute_zero"),
                      }
                      for name, row in artifacts.items()
                  },
              }

          summary = {
              "variant": metric.get("matrix_variant"),
              "classification": metric.get("classification"),
              "candidate_forbidden_absolute_zero": metric.get(
                  "candidate_forbidden_absolute_zero"
              ),
              "both_roots_pass": metric.get("both_roots_pass"),
              "root_direct": [compact(row) for row in metric.get("root_direct", [])],
              "post_type_audit": compact(metric["post_type_audit"])
                  if metric.get("post_type_audit") else None,
              "post_axiom_audit": compact(metric["post_axiom_audit"])
                  if metric.get("post_axiom_audit") else None,
              "downstream_gate_open": metric.get("downstream_gate_open"),
              "downstream_direct": [
                  compact(row) for row in metric.get("downstream_direct", [])
              ],
              "gates": metric.get("gates"),
          }
          print(json.dumps(summary, ensure_ascii=False, indent=2))
          PY

      - name: Upload isolated trust evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-native-decide-trust-${{ matrix.trust_variant }}-${{ github.sha }}
          path: |
            /tmp/codex-native-decide-trust/${{ matrix.trust_variant }}
            /tmp/codex-native-decide-setup/${{ matrix.trust_variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Require root trust post-elaboration and downstream gates
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${EVIDENCE_ROOT}/METRIC.json" <<'PY'
          import json
          import sys

          metric = json.load(open(sys.argv[1], encoding="utf-8"))
          gates = metric.get("gates", {})
          required = (
              metric.get("classification") == "TRUST_REPAIR_PASS"
              and metric.get("all_gates_pass") is True
              and metric.get("candidate_is_compile_evidence") is True
              and metric.get("candidate_forbidden_absolute_zero") is True
              and metric.get("both_roots_pass") is True
              and metric.get("downstream_gate_open") is True
              and metric.get("downstream_started") is True
              and metric.get("downstream_all_pass") is True
              and gates.get("static_policy") is True
              and gates.get("root_Spt1_direct_clean") is True
              and gates.get("root_Mock1_Advanced_direct_clean") is True
              and gates.get("root_artifacts_forbidden_absolute_zero") is True
              and gates.get("affected_58_type_check_exact") is True
              and gates.get("affected_58_axiom_records_exact_and_allowed_only") is True
              and gates.get("post_audit_artifacts_forbidden_absolute_zero") is True
              and gates.get("downstream_started_only_after_both_roots_and_audits") is True
              and gates.get("all_downstream_direct_clean") is True
              and gates.get("downstream_artifacts_forbidden_absolute_zero") is True
              and gates.get("checked_in_root_sources_unchanged") is True
          )
          if not required:
              raise SystemExit(
                  "native_decide candidate did not satisfy every strict trust and downstream gate"
              )
          PY
