name: Fix focused candidate reproduction worktree handoff

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-workflow-cwd-fix-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: fix-focused-candidate-cwd
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Clone exact triggering head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Patch reproduction clones and candidate copy-back
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('.github/workflows/focused-m2a-v68-materialize-20260807.yml'),
            Path('.github/workflows/focused-functional-analysis-materialize-20260807.yml')]
          for p in files:
            s=p.read_text()
            s=s.replace('git clone --no-hardlinks . "$dir" >/dev/null',
                        'git clone --no-hardlinks "${GITHUB_WORKSPACE}" "$dir" >/dev/null')
            if 'focused-m2a-v68' in p.name:
              old='cmp -s /tmp/m2a-repro-a/"${TARGET}" /tmp/m2a-repro-b/"${TARGET}"\n          cp /tmp/m2a-repro-a/"${TARGET}" "${TARGET}"'
              new='cmp -s /tmp/m2a-repro-a/"${TARGET}" /tmp/m2a-repro-b/"${TARGET}"\n          cd "${GITHUB_WORKSPACE}"\n          cp /tmp/m2a-repro-a/"${TARGET}" "${TARGET}"'
              if old not in s: raise SystemExit(f'M2A copy-back anchor missing in {p}')
              s=s.replace(old,new)
            else:
              old='cmp -s /tmp/fa-repro-a/"${FA}" /tmp/fa-repro-b/"${FA}"\n          cp /tmp/fa-repro-a/"${FA}" "${FA}"'
              new='cmp -s /tmp/fa-repro-a/"${FA}" /tmp/fa-repro-b/"${FA}"\n          cd "${GITHUB_WORKSPACE}"\n          cp /tmp/fa-repro-a/"${FA}" "${FA}"'
              if old not in s: raise SystemExit(f'FA copy-back anchor missing in {p}')
              s=s.replace(old,new)
            p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 2
          grep -F 'git clone --no-hardlinks "${GITHUB_WORKSPACE}" "$dir"' \
            .github/workflows/focused-m2a-v68-materialize-20260807.yml \
            .github/workflows/focused-functional-analysis-materialize-20260807.yml
          grep -F 'cd "${GITHUB_WORKSPACE}"' \
            .github/workflows/focused-m2a-v68-materialize-20260807.yml \
            .github/workflows/focused-functional-analysis-materialize-20260807.yml

      - name: Commit patched workflows with race guard
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/focused-m2a-v68-materialize-20260807.yml \
            .github/workflows/focused-functional-analysis-materialize-20260807.yml
          git commit -m 'ci: fix focused candidate reproduction copy-back'
          git push origin "HEAD:${BRANCH}"
