name: PASS 396 inner-product-derived local Completion instances

on:
  push:
    branches:
      - probe/fa396-ip-derived-local-instances-20260809
    paths:
      - '.github/workflows/fa396-ip-derived-local-instances.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa396-ip-derived-local-instances
  cancel-in-progress: true

jobs:
  probe:
    name: ip-local-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - opnorm-ip-parent
          - all-ip-parent
          - opnorm-ip-object
          - all-ip-object
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PASS 389 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3000
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Apply inner-product-parent candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/fa396/${VARIANT}/logs" "/tmp/fa396/${VARIANT}/source"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          p = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before = sha256(p.read_bytes()).hexdigest()
          expected = '5f2d7615aaad7bb3a232d19829f0f801278e7ab2fa2f66ccb68408b87647e620'
          if before != expected:
              raise SystemExit(f'unexpected PASS389 baseline: {before}; expected {expected}')
          text = p.read_text()
          variant = os.environ['VARIANT']

          direct = '''  letI : NormedSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
          '''
          ip_parent = '''  letI : NormedSpace ℂ Q.SobolevCompletion :=
            (UniformSpace.Completion.innerProductSpace :
              InnerProductSpace ℂ Q.SobolevCompletion).toNormedSpace
          '''
          ip_object = '''  let completionIP : InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              completionIP.toNormedSpace
          '''

          count = text.count(direct)
          print(f'direct local NormedSpace blocks={count}')
          if count != 4:
              raise SystemExit(f'expected four direct local blocks, found {count}')

          replacement = ip_parent if variant.endswith('ip-parent') else ip_object
          replace_count = 3 if variant.startswith('opnorm-') else 4
          text = text.replace(direct, replacement, replace_count)

          # For the object variants, fix indentation after the inserted `let` block.
          if variant.endswith('ip-object'):
              text = text.replace(
                  '''  let completionIP : InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              completionIP.toNormedSpace
          ''',
                  '''  let completionIP : InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              completionIP.toNormedSpace
          ''')

          p.write_text(text)
          after = sha256(p.read_bytes()).hexdigest()
          print(f'variant={variant}')
          print(f'input_sha256={before}')
          print(f'output_sha256={after}')
          out = Path(f'/tmp/fa396/{variant}/source')
          (out / 'source-sha256.txt').write_text(after + '\n')
          (out / f'Mock2_FunctionalAnalysis-{variant}.lean').write_bytes(p.read_bytes())
          PY

      - name: Compile full candidate
        id: compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.{olean,ilean}
          lake env lean -DmaxErrors=250 PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "/tmp/fa396/${VARIANT}/logs/compile.log" 2>&1
          rc=$?
          set -e
          grep -n 'error:' "/tmp/fa396/${VARIANT}/logs/compile.log" > "/tmp/fa396/${VARIANT}/logs/errors.txt" || true
          grep -n 'warning:' "/tmp/fa396/${VARIANT}/logs/compile.log" > "/tmp/fa396/${VARIANT}/logs/warnings.txt" || true
          first=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' "/tmp/fa396/${VARIANT}/logs/compile.log" | head -1)
          last=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' "/tmp/fa396/${VARIANT}/logs/compile.log" | tail -1)
          errors=$(wc -l < "/tmp/fa396/${VARIANT}/logs/errors.txt")
          warnings=$(wc -l < "/tmp/fa396/${VARIANT}/logs/warnings.txt")
          {
            echo "variant=${VARIANT}"
            echo "exit_code=${rc}"
            echo "error_header_count=${errors}"
            echo "warning_count=${warnings}"
            echo "first_error_line=${first:-none}"
            echo "last_error_line=${last:-none}"
          } | tee "/tmp/fa396/${VARIANT}/summary.txt"
          tail -1600 "/tmp/fa396/${VARIANT}/logs/compile.log" > "/tmp/fa396/${VARIANT}/logs/tail.txt" || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 396 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa396-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/fa396/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${EXIT_CODE:-}"
          exit "${EXIT_CODE}"
