              assert toolchain["bytes"] == 29
              assert toolchain["terminal_lf"] is True
              assert toolchain["sha256"] == os.environ["FA_V61_TOOLCHAIN_SHA256"]
              assert toolchain["lean_version"].startswith("Lean (version 4.33.0-rc1,")
