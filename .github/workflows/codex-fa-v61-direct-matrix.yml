              exit_code = fa_exit
          except BaseException as exc:
              final["failure"] = f"{type(exc).__name__}: {exc}"
          (out / "FINAL_GATE.json").write_text(
              json.dumps(final, indent=2, sort_keys=True) + "\n"
          )
          print(exit_code)
          PY
          })"
          [[ "$final_exit" =~ ^[0-9]+$ ]]
          exit "$final_exit"

