              )
              expected_candidate = os.environ["FA_V61_EXPECTED_CANDIDATE_SHA256"]
              assert authority["status"] == "EXACT"
              base_authority = authority["base_authority"]
              assert material["authority"] == base_authority
              assert patch["authority"] == base_authority
              assert metric["authority"] == base_authority
              assert attestation["base_authority"] == base_authority
