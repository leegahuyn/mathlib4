name: GPT QYM fastlane persistent repair v2

on:
  push:
    branches:
      - gpt/qym-fastlane-probe35-20260818
    paths:
      - .github/qym_fastlane_patch.py
      - .github/qym_fastlane_batch2.py
      - .github/workflows/gpt-qym-fastlane-v2.yml
      - PrimalitySheafVerification/QYM.lean
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-fastlane-probe35-v2
  cancel-in-progress: false

jobs:
  repair:
    name: Probe35 integrated batch2 prefix then full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BRANCH: gpt/qym-fastlane-probe35-20260818
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-fastlane-v2
      PREFIX: QYM_FastlanePrefix.lean
      P35_ARTIFACT: qym-probe35-flat_named-da2958a421605d9b267afdce59990ec19c1be10f-attempt1
      P35_SHA: 00f2c8ba7fc0329b04ae67c5a67b5814f8118b14222a7831a0401c9d3d374e53
      P35_BLOB: ee2faeaf281215b0e9b304a96ccdce3e8cdc0ffb
      BATCH1_SHA: 55ae6e4e42654ff1140da04785758724c34e473113b621ec267ecf1d791ac75c
      BATCH1_BLOB: a23c17e4ee6852b23b2e1e1a5ffe8b4b19e12dff
      CANDIDATE_SHA: eff40c6634713f17cc4005a93040eeb92322f32c68b20c158d88adf19cdc99a8
      CANDIDATE_BLOB: d10513bb489b8326d516c953a105dd9da05820f1

    steps:
      - name: Checkout exact fastlane revision
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: true
          fetch-depth: 0

      - name: Gate branch and pinned source mode
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f .github/qym_fastlane_patch.py
          test -f .github/qym_fastlane_batch2.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          current=$(sha256sum "$QYM" | awk '{print $1}')
          if [[ "$current" = "$CANDIDATE_SHA" ]]; then
            echo "MODE=checked-in" >> "$GITHUB_ENV"
          else
            echo "MODE=runtime" >> "$GITHUB_ENV"
          fi
          printf '%s\n' "$current" > "$OUT/checked-out-QYM.sha256"

      - name: Download immutable Probe35 authority
        if: env.MODE == 'runtime'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.P35_ARTIFACT }}
          path: ${{ runner.temp }}/p35
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32095253829

      - name: Materialize deterministic integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          if [[ "$MODE" = runtime ]]; then
            A="$RUNNER_TEMP/p35"
            for f in QYM.candidate-probe35-flat_named.lean QYM.exit QYM.error-headers.txt QYM.panic-lines.txt PROBE_RESULT.json; do
              test -f "$A/$f"
            done
            test "$(sha256sum "$A/QYM.candidate-probe35-flat_named.lean" | awk '{print $1}')" = "$P35_SHA"
            test "$(git hash-object --no-filters "$A/QYM.candidate-probe35-flat_named.lean")" = "$P35_BLOB"
            test "$(cat "$A/QYM.exit")" = 1
            test "$(wc -l < "$A/QYM.error-headers.txt")" -eq 89
            test ! -s "$A/QYM.panic-lines.txt"
            python3 - "$A/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['candidate_qym_sha256']==os.environ['P35_SHA']
          assert r['candidate_qym_blob']==os.environ['P35_BLOB']
          assert r['exit']==1 and r['error_headers']==89
          assert r['warning_headers']==356 and r['panic_lines']==0
          PY
            cp "$A/QYM.candidate-probe35-flat_named.lean" "$OUT/QYM.candidate.lean"
            python3 -B .github/qym_fastlane_patch.py "$OUT/QYM.candidate.lean" | tee "$OUT/PATCH_BATCH1.json"
            test "$(sha256sum "$OUT/QYM.candidate.lean" | awk '{print $1}')" = "$BATCH1_SHA"
            test "$(git hash-object --no-filters "$OUT/QYM.candidate.lean")" = "$BATCH1_BLOB"
            python3 -B .github/qym_fastlane_batch2.py "$OUT/QYM.candidate.lean" | tee "$OUT/PATCH_BATCH2.json"
          else
            cp "$QYM" "$OUT/QYM.candidate.lean"
          fi
          test "$(sha256sum "$OUT/QYM.candidate.lean" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate.lean")" = "$CANDIDATE_BLOB"
          cp "$OUT/QYM.candidate.lean" "$OUT/QYM.candidate.snapshot.lean"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure exact dependency chain
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean" "$OLEAN/$s.olean.private"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean"
            test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize exact producer prefix under project root
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/QYM.candidate.lean" "$PREFIX" <<'PY'
          from pathlib import Path
          import hashlib, re, sys
          source, target = Path(sys.argv[1]), Path(sys.argv[2])
          text=source.read_text(encoding='utf-8')
          marker='/-- Every actual smooth trace is Lipschitz on the compact doubled interval'
          if text.count(marker) != 1:
              raise SystemExit('prefix marker mismatch')
          prefix=text[:text.index(marker)].rstrip() + \
              '\n\nend QYM.FullCertification.P2ClassicalHhalfTraceExtension\n'
          forbidden={
              'sorry':len(re.findall(r'\bsorry\b',prefix)),
              'admit':len(re.findall(r'\badmit\b',prefix)),
              'native_decide':len(re.findall(r'\bnative_decide\b',prefix)),
              'ofReduceBool':prefix.count('Lean.ofReduceBool'),
              'axiom':len(re.findall(r'(?m)^\s*axiom\s+',prefix)),
              'unsafe':len(re.findall(r'(?m)^\s*unsafe\s+',prefix)),
              'hb0':len(re.findall(r'set_option\s+maxHeartbeats\s+0\b',prefix)),
          }
          if any(forbidden.values()):
              raise SystemExit(forbidden)
          target.write_text(prefix,encoding='utf-8')
          print(hashlib.sha256(prefix.encode()).hexdigest(), prefix.count('\n'))
          PY
          cp "$PREFIX" "$OUT/QYM.prefix.lean"

      - name: Direct Lean compile producer prefix
        id: prefix
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/PREFIX.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/PREFIX.olean" -i "$OUT/PREFIX.ilean" \
              "$PREFIX" > "$OUT/PREFIX.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/PREFIX.exit"
          rm -f "$PREFIX"
          if [[ "$rc" -eq 0 ]] && [[ -s "$OUT/PREFIX.olean" ]] && [[ -s "$OUT/PREFIX.ilean" ]]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            sha256sum "$OUT/PREFIX.olean" "$OUT/PREFIX.ilean" > "$OUT/PREFIX.outputs.sha256"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Full direct Lean compile integrated candidate
        id: full
        if: steps.prefix.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.checked-out.lean"
          cp "$OUT/QYM.candidate.lean" "$QYM"
          rm -f "$RUNNER_TEMP/QYM.fastlane.olean" "$RUNNER_TEMP/QYM.fastlane.ilean"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.fastlane.olean" \
              -i "$RUNNER_TEMP/QYM.fastlane.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]] && [[ -s "$RUNNER_TEMP/QYM.fastlane.olean" ]] && [[ -s "$RUNNER_TEMP/QYM.fastlane.ilean" ]]; then
            echo "pass=true" >> "$GITHUB_OUTPUT"
            cp "$RUNNER_TEMP/QYM.fastlane.olean" "$OUT/QYM.olean"
            cp "$RUNNER_TEMP/QYM.fastlane.ilean" "$OUT/QYM.ilean"
            sha256sum "$OUT/QYM.olean" "$OUT/QYM.ilean" > "$OUT/QYM.outputs.sha256"
          else
            echo "pass=false" >> "$GITHUB_OUTPUT"
          fi
          cp "$OUT/QYM.checked-out.lean" "$QYM"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          exit 0

      - name: Summarize exact evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT" "$MODE" "$CANDIDATE_SHA" "$CANDIDATE_BLOB" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, re, sys
          root=Path(sys.argv[1]); mode, sha256, blob=sys.argv[2:5]
          raw=(root/'QYM.log').read_bytes() if (root/'QYM.log').exists() else b''
          text=raw.decode(errors='replace')
          pat=re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$',re.M)
          rows=[]
          for m in pat.finditer(text):
              row=m.groupdict(); row['line']=int(row['line']); row['column']=int(row['column']); rows.append(row)
          errors=[r for r in rows if r['severity']=='error']
          warnings=[r for r in rows if r['severity']=='warning']
          panics=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$',text)
          rc=int((root/'QYM.exit').read_text().strip()) if (root/'QYM.exit').exists() else None
          prefix_rc=int((root/'PREFIX.exit').read_text().strip()) if (root/'PREFIX.exit').exists() else None
          semantic=rc==0 and not errors and not panics and (root/'QYM.olean').is_file() and (root/'QYM.ilean').is_file()
          result={
              'schema':'qym-fastlane-direct-v2',
              'mode':mode,
              'candidate_qym_sha256':sha256,
              'candidate_qym_blob':blob,
              'prefix_exit':prefix_rc,
              'exit':rc,
              'error_headers':len(errors),
              'warning_headers':len(warnings),
              'panic_lines':len(panics),
              'first_error':errors[0] if errors else None,
              'last_error':errors[-1] if errors else None,
              'error_codes':dict(sorted(collections.Counter((r.get('code') or 'uncoded') for r in errors).items())),
              'semantic_pass':semantic,
              'log_sha256':hashlib.sha256(raw).hexdigest(),
          }
          (root/'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows),encoding='utf-8')
          (root/'QYM.error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r.get('code') else ''}: {r['message']}\n" for r in errors),encoding='utf-8')
          (root/'QYM.panic-lines.txt').write_text(''.join(p+'\n' for p in panics),encoding='utf-8')
          (root/'PROBE_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY

      - name: Promote exact runtime TRUE PASS to repair branch
        if: env.MODE == 'runtime' && steps.full.outputs.pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['semantic_pass'] is True
          assert r['exit']==0 and r['error_headers']==0 and r['panic_lines']==0
          PY
          cp "$OUT/QYM.candidate.lean" "$QYM"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$QYM"
          git commit -m "QYM fastlane: check in direct-Lean passing candidate"
          git push origin "HEAD:$BRANCH"

      - name: Upload immutable fastlane evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-fastlane-v2-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-fastlane-v2/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless direct Lean TRUE PASS
        if: always()
        shell: bash
        run: |
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['panic_lines']==0
          if not r['semantic_pass']:
              raise SystemExit(r['exit'] or 1)
          PY
