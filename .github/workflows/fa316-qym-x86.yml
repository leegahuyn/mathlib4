name: FA316 materialize and QYM x86

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'scripts/fa316_driver.py'
      - 'scripts/fa316_payload/**'
      - 'scripts/ci_fa316_qym.sh'
      - '.github/workflows/fa316-qym-x86.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'scripts/fa316_driver.py'
      - 'scripts/fa316_payload/**'
      - 'scripts/ci_fa316_qym.sh'
      - '.github/workflows/fa316-qym-x86.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa316-qym-x86-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  verify-materialize-qym:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      CHECKOUT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.CHECKOUT_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Lean and restore Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Verify FA316 materialize then compile QYM
        shell: bash
        run: bash scripts/ci_fa316_qym.sh

      - name: Upload FA316 and QYM evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa316-qym-x86-${{ env.CHECKOUT_SHA }}
          path: /tmp/fa316-qym-x86
          if-no-files-found: warn
          retention-days: 30
