name: Codex FA frontier 3029-3047 v3

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-3029-3047-v3.yml
      - scripts/fa_dynamic_cluster_3029_3047_v3.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-frontier-3029-3047-v3
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31523628986"
  BASE_EXPECTED_HEAD: "c3fb0231f32e7b3472be1c8d4a14dfbad162b852"
  BASE_EXPECTED_WORKFLOW: ".github/workflows/codex-fa-frontier-2982-ring-v1.yml"
  BASE_EXPECTED_FIRST_INDEX: "3029"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Await and attest exact direct-tested idx3029 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v3; mkdir -p "$OUT" /tmp/fa-3029-base
          for _ in $(seq 1 150); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
            status="$(python3 - <<'PY'
          import json
          print(json.load(open('build-logs/codex-fa-frontier-3029-3047-v3/base-run.json')).get('status',''))
          PY
          )"
            [[ "$status" == completed ]] && break
            sleep 10
          done
          python3 - <<'PY'
          import json,os
          run=json.load(open('build-logs/codex-fa-frontier-3029-3047-v3/base-run.json'))
          if run.get('status')!='completed': raise SystemExit('base run did not complete inside gate window')
          if run.get('head_sha')!=os.environ['BASE_EXPECTED_HEAD'] or run.get('path')!=os.environ['BASE_EXPECTED_WORKFLOW'] or run.get('conclusion')!='failure': raise SystemExit('base run identity/result gate failed')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100" > "$OUT/base-jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" > "$OUT/base-artifacts.json"
          python3 - <<'PY' > /tmp/fa3029.env
          import json
          jobs=json.load(open('build-logs/codex-fa-frontier-3029-3047-v3/base-jobs.json')).get('jobs',[]); js=[j for j in jobs if j.get('name')=='frontier']
          if len(js)!=1: raise SystemExit('expected one frontier job')
          j=js[0]; steps={s.get('name'):s for s in j.get('steps',[])}
          if steps.get('Direct full-source diagnostic compile',{}).get('conclusion')!='success': raise SystemExit('base direct compile did not execute successfully')
          arts=json.load(open('build-logs/codex-fa-frontier-3029-3047-v3/base-artifacts.json')).get('artifacts',[]); xs=[a for a in arts if a.get('name','').startswith('codex-fa-frontier-2982-ring-v1-') and a.get('expired') is False]
          if len(xs)!=1: raise SystemExit('expected one live base artifact')
          a=xs[0]; print('BASE_ARTIFACT_ID='+str(a['id'])); print('BASE_ARTIFACT_DIGEST='+a['digest'])
          PY
          source /tmp/fa3029.env
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-3029-base.zip
          test "sha256:$(sha256sum /tmp/fa-3029-base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/fa-3029-base.zip -d /tmp/fa-3029-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          metrics=list(Path('/tmp/fa-3029-base').rglob('METRIC.json'))
          if not metrics: raise SystemExit('base metric missing')
          m=json.loads(metrics[0].read_text()); checks={'run':str(m.get('run_id'))==os.environ['BASE_RUN_ID'],'head':m.get('head_sha')==os.environ['BASE_EXPECTED_HEAD'],'M2':m.get('Mock2_exit')==0 and m.get('Mock2_executed') is True,'M2A':m.get('Mock2_Advanced_exit')==0 and m.get('Mock2_Advanced_executed') is True,'FA':m.get('FA_exit')==1 and m.get('FA_executed') is True,'all':m.get('all_required_lean_executed') is True,'first':str(m.get('FA_error_declaration_index'))==os.environ['BASE_EXPECTED_FIRST_INDEX'],'identity':m.get('source_identity_locked_after_materialization') is True,'headers':m.get('public_declaration_headers_preserved') is True,'sequence':m.get('declaration_sequence_preserved') is True}
          if not all(checks.values()): raise SystemExit('base metric gate failed: '+repr([k for k,v in checks.items() if not v]))
          sha=m['source_sha256']; size=int(m['source_bytes']); lines=int(m['source_lines']); valid=[]
          for p in Path('/tmp/fa-3029-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==sha and len(b)==size and len(b.decode('utf-8').splitlines())==lines and b'\r' not in b: valid.append(p)
          if not valid: raise SystemExit('exact base source missing')
          p=min(valid,key=lambda x:(len(x.parts),x.as_posix())); (Path('build-logs/codex-fa-frontier-3029-3047-v3')/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY
      - name: Apply strict graph and closure repairs
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v3
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$(cat "$OUT/BASE_SOURCE.txt")" --library scripts/fa_dynamic_cluster_3029_3047_v3.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/PREPARATION.json"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          a=json.loads(Path('build-logs/codex-fa-frontier-3029-3047-v3/PREPARATION.json').read_text())
          if not (a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed']): raise SystemExit('strict semantic audit failed')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write('CANDIDATE_SHA='+a['candidate_source_sha256']+'\nCANDIDATE_BYTES='+str(a['candidate_bytes'])+'\nCANDIDATE_LINES='+str(a['candidate_lines'])+'\n')
          PY
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v3
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain-install.log" 2>&1; lean --version | tee "$OUT/lean-version.txt"; lake --version | tee "$OUT/lake-version.txt"; lake exe cache get > "$OUT/cache-get.log" 2>&1
      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-3029-3047-v3; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() { stem="$1"; cap="$2"; src="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; : > "$OUT/${stem}.executed"; printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$cap" "$o" "$i" "$src" > "$OUT/${stem}.command"; set +e; lake env lean "-DmaxErrors=${cap}" -DwarningAsError=false -o "$o" -i "$i" "$src" > "$OUT/${stem}.log" 2>&1; c=$?; set -e; echo "$c" > "$OUT/${stem}.exit"; }
          compile_one Mock2 3; compile_one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"; test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"
          compile_one Mock2_FunctionalAnalysis 128
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-3029-3047-v3'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); prep=json.loads((out/'PREPARATION.json').read_text()); metric={'schema':'fa-frontier-3029-3047-v3','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':prep['public_declaration_headers_preserved'],'declaration_sequence_preserved':prep['declaration_sequence_preserved'],'maxErrors_cap':128}; (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-3029-3047-v3-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-3029-3047-v3
          if-no-files-found: warn
          retention-days: 30
      - name: Publish locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          state=failure; [[ "${FA_EXIT:-}" == 0 ]] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='codex/fa-frontier-3029-3047-v3' -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86
          exit "$FA_EXIT"
