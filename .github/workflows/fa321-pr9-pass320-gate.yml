name: Historical PASS 320 derived FA and QYM gate

# PASS 327 is the current repair authority. This workflow is retained only for
# manual historical reproduction and must not compete with the PASS 327 gate.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: historical-fa324-pr9-pass320
  cancel-in-progress: true

jobs:
  verify-historical-pass320-derived-fa-and-qym:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout exact selected head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Reproduce historical PASS 320-derived candidate without pushing
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_fa319_qym.sh

      - name: Upload historical evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: historical-fa324-pr9-pass320-${{ env.SOURCE_SHA }}
          path: /tmp/fa324-qym
          if-no-files-found: warn
          retention-days: 30
