name: Mock2 Advanced pass 316 direct-source clean CI

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock2-advanced-pass316-direct-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-checked-in-source:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_TARGET_BLOB: b71f0800da56dd6fa6b4f1c26396d97a48d64027
      EXPECTED_TARGET_SHA256: e594962bf74db44403372f93c99edaeb7ba8af9b584dc196fbb86a51f73b28ff
      EVIDENCE: /tmp/mock2-advanced-pass316-direct-source

    steps:
      - name: Clone the exact checked-in source without checkout actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          test "$(git hash-object "${TARGET}")" = "${EXPECTED_TARGET_BLOB}"
          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          test "${actual_sha}" = "${EXPECTED_TARGET_SHA256}"
          mkdir -p "${EVIDENCE}/source" "${EVIDENCE}/logs" "${EVIDENCE}/artifacts"
          cp "${MOCK2}" "${TARGET}" "${EVIDENCE}/source/"
          {
            echo "repository=${GITHUB_REPOSITORY}"
            echo "branch=fix/primality-sheaf-clean-build"
            echo "commit=${GITHUB_SHA}"
            echo "mock2_blob=$(git hash-object "${MOCK2}")"
            echo "advanced_blob=$(git hash-object "${TARGET}")"
            echo "mock2_sha256=$(sha256sum "${MOCK2}" | awk '{print $1}')"
            echo "advanced_sha256=${actual_sha}"
            echo "utc_started=$(date -u +%FT%TZ)"
          } | tee "${EVIDENCE}/snapshot.txt"

      - name: Static forbidden-token and user-axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${EVIDENCE}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          files = [
              Path("PrimalitySheafVerification/Mock2.lean"),
              Path("PrimalitySheafVerification/Mock2_Advanced.lean"),
          ]

          def strip_comments_and_strings(src: str) -> str:
              out = []
              i = 0
              depth = 0
              in_string = False
              escaped = False
              while i < len(src):
                  if depth:
                      if src.startswith("/-", i):
                          depth += 1; out.extend("  "); i += 2
                      elif src.startswith("-/", i):
                          depth -= 1; out.extend("  "); i += 2
                      else:
                          out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif in_string:
                      ch = src[i]
                      out.append("\n" if ch == "\n" else " ")
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == '"': in_string = False
                      i += 1
                  elif src.startswith("/-", i):
                      depth = 1; out.extend("  "); i += 2
                  elif src.startswith("--", i):
                      while i < len(src) and src[i] != "\n":
                          out.append(" "); i += 1
                  elif src[i] == '"':
                      in_string = True; out.append(" "); i += 1
                  else:
                      out.append(src[i]); i += 1
              if depth or in_string:
                  raise SystemExit("unterminated comment or string")
              return "".join(out)

          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_axiom": r"(?m)^\s*axiom\b",
              "line_start_constant": r"(?m)^\s*constant\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
              "placeholder": r"\bplaceholder\b",
              "unfinished_TODO_FIXME": r"\b(?:TODO|FIXME)\b",
          }
          bad = False
          for path in files:
              code = strip_comments_and_strings(path.read_text(encoding="utf-8"))
              print(f"[{path}]")
              for name, pattern in checks.items():
                  matches = list(re.finditer(pattern, code))
                  print(f"{name}: {len(matches)}")
                  if matches:
                      bad = True
                      for match in matches[:20]:
                          line = code.count("\n", 0, match.start()) + 1
                          print(f"  line {line}: {match.group(0)!r}")
          if bad:
              raise SystemExit("forbidden executable token or user axiom detected")
          PY

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Compile Mock2 regression and Mock2 Advanced twice from checked-in sources
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}"

          compile_module() {
            local module="$1"
            local pass="$2"
            local src="PrimalitySheafVerification/${module}.lean"
            local log="${EVIDENCE}/logs/${module}-pass${pass}.log"
            rm -f "${outdir}/${module}.olean" "${outdir}/${module}.ilean" \
              "${outdir}/${module}.olean.private"
            set +e
            lake env lean "${src}" -o "${outdir}/${module}.olean" \
              -i "${outdir}/${module}.ilean" >"${log}" 2>&1
            local code=$?
            set -e
            printf '%s\n' "${code}" > "${EVIDENCE}/${module}-exit-pass${pass}.txt"
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s\n' "${module}" "${pass}" "${errors}" "${warnings}" \
              >> "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              echo "${module} pass ${pass} failed with exit ${code}"
              grep -n 'error:' "${log}" | head -10 || true
              grep -n 'error:' "${log}" | tail -1 || true
              tail -200 "${log}" || true
              exit "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${outdir}/${module}.olean"
            test -s "${outdir}/${module}.ilean"
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" "${log}"
          }

          echo 'module,pass,error_count,warning_count' > "${EVIDENCE}/compile-summary.csv"
          for pass in 1 2; do
            compile_module Mock2 "${pass}"
            compile_module Mock2_Advanced "${pass}"
          done

          cp "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
            "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean" \
            "${EVIDENCE}/artifacts/"
          git diff --exit-code
          test -z "$(git status --porcelain --untracked-files=no)"
          {
            echo "utc_finished=$(date -u +%FT%TZ)"
            sha256sum "${MOCK2}" "${TARGET}" \
              "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
              "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean"
          } | tee "${EVIDENCE}/provenance-sha256.txt"
          find "${EVIDENCE}" -type f -print0 | sort -z | xargs -0 sha256sum \
            > "${EVIDENCE}/evidence-sha256.txt"

      - name: Upload direct-source proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: mock2-advanced-pass316-direct-source-proof-${{ github.sha }}
          path: /tmp/mock2-advanced-pass316-direct-source
          if-no-files-found: error
          retention-days: 30
