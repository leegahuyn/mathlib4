name: Patch focused v3 runtime without weakening clean passes

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-v3-runtime-patch-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: patch-focused-v3-runtime
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Apply runtime patch on latest branch with retry
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            python3 scripts/patch_focused_v3_runtime_20260807.py
            git diff --check
            bash -n scripts/focused_materialize_pipeline_20260807.sh
            if git diff --quiet; then
              exit 0
            fi
            git add \
              scripts/focused_materialize_pipeline_20260807.sh \
              .github/workflows/focused-candidate-pipeline-v3-20260807.yml \
              .github/workflows/focused-direct-source-v3-20260807.yml
            git commit -m 'ci: remove duplicate focused dependency compiles'
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
