          qym_path="$(cat "$qym_path_file")"
          cp "$base_source" "$qym_path"
          cp "$inventory" "$OUT/PARENT_QYM_INVENTORY.json"
          printf '%s\n' "$qym_path" >"$OUT/qym-path.txt"
          python3 scripts/codex_pipeline_v54.py patch-qym-local \
            --source "$qym_path" --inventory "$OUT/PARENT_QYM_INVENTORY.json" \
            --variant "$VARIANT" --out "$OUT"

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1
          lean --version >"$OUT/lean-version.txt" 2>&1
          lake --version >"$OUT/lake-version.txt" 2>&1

      - name: Directly compile QYM candidate and inventory it
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          qym_path="$(cat "$OUT/qym-path.txt")"
          set +e
          lake env lean -DmaxErrors=2000 "$qym_path" >"$OUT/QYM.direct.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >"$OUT/QYM.exit"
          sha256sum "$OUT/QYM.direct.log" >"$OUT/QYM.direct.log.sha256"
          python3 scripts/codex_pipeline_v54.py inventory-qym \
            --source "$qym_path" --log "$OUT/QYM.direct.log" \
            --exit-file "$OUT/QYM.exit" --variant "$VARIANT" \
            --out "$OUT/METRIC.json"

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: v54-qym-local-${{ matrix.variant }}-${{ github.run_id }}
          path: build-logs/codex-v54/qym-local/${{ matrix.variant }}
          retention-days: 30

  select_qym_local:
    name: select-local-QYM-candidate
    needs: [direct13_base, qym_local]
    if: always() && needs.direct13_base.outputs.prerequisites_zero == 'true' && needs.direct13_base.outputs.qym_clean != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: v54-qym-local-*-${{ github.run_id }}
          path: /tmp/v54-qym-local
          merge-multiple: false

      - name: Select measured QYM result and normalize final payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v54-qym-final-payload
          mkdir -p /tmp/v54-qym-final-payload
          python3 scripts/codex_pipeline_v54.py select-qym \
            --root /tmp/v54-qym-local --baseline selected_base \
            --report /tmp/v54-qym-final-payload/QYM_FINAL_SELECTION.json \
            --selected-dir /tmp/v54-qym-final-payload/selected
          metric="$(find /tmp/v54-qym-final-payload/selected -type f -name METRIC.json -print -quit)"
          source_file="$(find /tmp/v54-qym-final-payload/selected -type f -name QYM-candidate.lean -print -quit)"
          test -n "$metric" && test -n "$source_file"
          cp "$metric" /tmp/v54-qym-final-payload/QYM_FINAL_INVENTORY.json
          cp "$source_file" /tmp/v54-qym-final-payload/QYM_SELECTED_SOURCE.lean

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v54-qym-final-${{ github.run_id }}
          path: /tmp/v54-qym-final-payload
          retention-days: 30

  promote_qym_base:
    name: promote-base-QYM-result
    needs: [direct13_base]
    if: needs.direct13_base.outputs.qym_clean == 'true' || needs.direct13_base.outputs.prerequisites_zero != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v54-direct13-base-${{ github.run_id }}
          path: /tmp/v54-direct13-base

      - name: Normalize base QYM result as final payload
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v54-qym-final-payload
          mkdir -p /tmp/v54-qym-final-payload
          cp "$(find /tmp/v54-direct13-base -type f -name QYM-base.lean -print -quit)" /tmp/v54-qym-final-payload/QYM_SELECTED_SOURCE.lean
          cp "$(find /tmp/v54-direct13-base -type f -name QYM_BASE_INVENTORY.json -print -quit)" /tmp/v54-qym-final-payload/QYM_FINAL_INVENTORY.json
          cp "$(find /tmp/v54-direct13-base -type f -name QYM_BASE_SELECTION.json -print -quit)" /tmp/v54-qym-final-payload/QYM_FINAL_SELECTION.json
          cp "$(find /tmp/v54-direct13-base -type f -name qym-path.txt -print -quit)" /tmp/v54-qym-final-payload/qym-path.txt

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: v54-qym-final-${{ github.run_id }}
          path: /tmp/v54-qym-final-payload
          retention-days: 30

  qym_gate:
    name: final-QYM-gate
    needs: [direct13_base, select_qym_local, promote_qym_base]
    if: always() && needs.direct13_base.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    outputs:
      qym_clean: ${{ steps.state.outputs.qym_clean }}
      selected_source_sha256: ${{ steps.state.outputs.selected_source_sha256 }}
      selected_variant: ${{ steps.state.outputs.selected_variant }}
      error_count: ${{ steps.state.outputs.error_count }}
      prerequisites_zero: ${{ steps.state.outputs.prerequisites_zero }}
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v54-qym-final-${{ github.run_id }}
          path: /tmp/v54-qym-final

      - id: state
        name: Verify QYM payload and prerequisite chain
        shell: bash
        run: |
          set -euo pipefail
          inventory="$(find /tmp/v54-qym-final -type f -name QYM_FINAL_INVENTORY.json -print -quit)"
          selection="$(find /tmp/v54-qym-final -type f -name QYM_FINAL_SELECTION.json -print -quit)"
          source_file="$(find /tmp/v54-qym-final -type f -name QYM_SELECTED_SOURCE.lean -print -quit)"
          test -n "$inventory" && test -n "$selection" && test -n "$source_file"
          INVENTORY="$inventory" SELECTION="$selection" SOURCE_FILE="$source_file" python3 - <<'PY' >>"$GITHUB_OUTPUT"
          import hashlib,json,os
          inv=json.load(open(os.environ['INVENTORY']));sel=json.load(open(os.environ['SELECTION']))
          sha=hashlib.sha256(open(os.environ['SOURCE_FILE'],'rb').read()).hexdigest()
          expected=inv.get('source_sha256') or inv.get('selected_source_sha256')
          assert sha==expected,(sha,expected)
          assert inv['QYM_error_cap_sentinel_present'] is False
          assert inv['QYM_inventory_complete_by_header_evidence'] is True
          assert inv['trust_six_zero'] is True
          clean=bool(inv['qym_clean_build_claimed'] and inv['qym_direct_lean_verified'] and int(inv['QYM_exit'])==0 and int(inv['QYM_error_count'])==0)
          prerequisites=sel.get('all_prerequisites_zero', True)
          print('qym_clean='+('true' if clean else 'false'))
          print('selected_source_sha256='+sha)
          print('selected_variant='+str(sel.get('selected_variant') or inv.get('variant') or 'unknown'))
          print('error_count='+str(inv['QYM_error_count']))
          print('prerequisites_zero='+('true' if prerequisites else 'false'))
          PY

  publish_qym:
    name: publish-QYM-source-and-exact-status
    needs: [qym_gate]
    if: always() && needs.qym_gate.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 0
          persist-credentials: true

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v54-qym-final-${{ github.run_id }}
          path: /tmp/v54-qym-final

      - name: Stage selected QYM source and exact status reports
        shell: bash
        run: |
          set -euo pipefail
          source_file="$(find /tmp/v54-qym-final -type f -name QYM_SELECTED_SOURCE.lean -print -quit)"
          selection="$(find /tmp/v54-qym-final -type f -name QYM_FINAL_SELECTION.json -print -quit)"
          inventory="$(find /tmp/v54-qym-final -type f -name QYM_FINAL_INVENTORY.json -print -quit)"
          qym_paths=( $(find . -path './.git' -prune -o -path './.lake' -prune -o -path './build-logs' -prune -o -name QYM.lean -print) )
          test "${#qym_paths[@]}" = 1
          cp "$source_file" "${qym_paths[0]}"
          mkdir -p .github/codex
          cp "$selection" .github/codex/QYM_V54_SELECTION.json
          cp "$inventory" .github/codex/QYM_V54_INVENTORY.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          state={'schema':'codex-v54-qym-publish-v1','github_run_id':os.environ['GITHUB_RUN_ID'],'workflow_head_sha':os.environ['GITHUB_SHA'],'target_branch':os.environ['TARGET_BRANCH']}
          Path('.github/codex/QYM_V54_PROVENANCE.json').write_text(json.dumps(state,indent=2,sort_keys=True)+'\n')
          PY

      - name: Commit QYM status without overstating result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "${qym_paths[0]:-$(find . -name QYM.lean -print -quit)}" \
            .github/codex/QYM_V54_SELECTION.json \
            .github/codex/QYM_V54_INVENTORY.json \
            .github/codex/QYM_V54_PROVENANCE.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Codex: publish exact QYM v54 direct-selection evidence"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

  final_audit:
    name: final-13-file-15-of-15-audit
    needs: [fa_gate, direct13_base, qym_gate, publish_qym]
    if: needs.fa_gate.outputs.fa_clean == 'true' && needs.direct13_base.outputs.prerequisites_zero == 'true' && needs.qym_gate.outputs.qym_clean == 'true' && needs.publish_qym.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      OUT: build-logs/codex-v54/final-13file-15check
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 0
          persist-credentials: true

      - name: Verify published source SHAs and prepare checks 01-08 plus axiom plan
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT/axioms" "$OUT/direct-pass1" "$OUT/direct-pass2" "$OUT/builds" .github/codex
          git cat-file -e "${BASELINE_HEAD_SHA}^{commit}"
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "${{ needs.fa_gate.outputs.selected_source_sha256 }}"
          qym_path="$(find . -path './.git' -prune -o -path './.lake' -prune -o -path './build-logs' -prune -o -name QYM.lean -print -quit)"
          test -n "$qym_path"
          test "$(sha256sum "$qym_path" | awk '{print $1}')" = "${{ needs.qym_gate.outputs.selected_source_sha256 }}"
          python3 scripts/codex_final_15check_v54.py prepare --out "$OUT" --baseline "$BASELINE_HEAD_SHA"
          python3 - <<'PY'
          from pathlib import Path
          import re,os
          out=Path(os.environ['OUT'])/'axiom-audit-src'
          for p in out.glob('*.lean'):
            kept=[]
            for line in p.read_text().splitlines():
              if line.startswith('#print axioms '):
                name=line[len('#print axioms '):].strip()
                if not name or name in {':','where'} or name.endswith('.:') or name.endswith('.where'):
                  continue
              kept.append(line)
            p.write_text('\n'.join(kept)+'\n')
          PY
          git rev-parse HEAD >"$OUT/audited-source-commit.txt"
          sha256sum lean-toolchain >"$OUT/lean-toolchain.sha256"
          sha256sum lake-manifest.json >"$OUT/lake-manifest.sha256"
          test ! -f lakefile.lean || sha256sum lakefile.lean >"$OUT/lakefile.sha256"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Check 09 exported declaration axiom audit
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 - <<'PY' >/tmp/v54-axiom-plan.tsv
          import json,os
          for row in json.load(open(os.environ['OUT']+'/AXIOM_AUDIT_PLAN.json')):
            print(row['file']+'\t'+row['audit_path'])
          PY
          : >"$OUT/AXIOM_AUDIT_EXIT.tsv"
          while IFS=$'\t' read -r name audit; do
            stem="${name%.lean}"
            set +e
            lake env lean "$audit" >"$OUT/axioms/${stem}.axioms.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\n' "$name" "$code" | tee -a "$OUT/AXIOM_AUDIT_EXIT.tsv"
            sha256sum "$OUT/axioms/${stem}.axioms.log" >"$OUT/axioms/${stem}.axioms.log.sha256"
          done </tmp/v54-axiom-plan.tsv
          python3 scripts/codex_final_15check_v54.py axioms --out "$OUT" --allowed "$ALLOWED_AXIOMS"

      - name: Checks 10-11 first direct Lean pass for all 13
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          : >"$OUT/DIRECT_PASS1_EXIT.tsv"
          while IFS= read -r file; do
            name="$(basename "$file" .lean)"
            set +e
            lake env lean -DmaxErrors=2000 "$file" >"$OUT/direct-pass1/${name}.log" 2>&1
            code=$?
            set -e
            printf '%s\t%s\t%s\n' "$name" "$code" "$file" | tee -a "$OUT/DIRECT_PASS1_EXIT.tsv"
            sha256sum "$OUT/direct-pass1/${name}.log" >"$OUT/direct-pass1/${name}.log.sha256"
          done <"$OUT/file-order.txt"
          python3 - <<'PY'
          import os
          rows={}
          for line in open(os.environ['OUT']+'/DIRECT_PASS1_EXIT.tsv'):
            name,code,path=line.rstrip('\n').split('\t',2);rows[name]=int(code)
          assert len(rows)==13 and all(v==0 for v in rows.values()),rows
          PY
          ! grep -R -E '(^|[[:space:]])error:' "$OUT/direct-pass1"
          ! grep -R -E 'declaration uses.*sorry' "$OUT/direct-pass1"

      - name: Check 12 cold full lake build
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake clean >"$OUT/builds/lake-clean.log" 2>&1
          set +e
          lake build >"$OUT/builds/lake-build-cold.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >"$OUT/builds/lake-build-cold.exit"
          test "$code" = 0
          ! grep -E '(^|[[:space:]])error:' "$OUT/builds/lake-build-cold.log"
          sha256sum "$OUT/builds/lake-build-cold.log" >"$OUT/builds/lake-build-cold.log.sha256"

      - name: Check 13 repeat build and second direct pass
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake build >"$OUT/builds/lake-build-repeat.log" 2>&1
          code=$?
          set -e
          printf '%s\n' "$code" >"$OUT/builds/lake-build-repeat.exit"
          test "$code" = 0
          ! grep -E '(^|[[:space:]])error:' "$OUT/builds/lake-build-repeat.log"
          sha256sum "$OUT/builds/lake-build-repeat.log" >"$OUT/builds/lake-build-repeat.log.sha256"
          : >"$OUT/DIRECT_PASS2_EXIT.tsv"
          while IFS= read -r file; do
            name="$(basename "$file" .lean)"
            set +e
            lake env lean -DmaxErrors=2000 "$file" >"$OUT/direct-pass2/${name}.log" 2>&1
            ec=$?
            set -e
            printf '%s\t%s\t%s\n' "$name" "$ec" "$file" | tee -a "$OUT/DIRECT_PASS2_EXIT.tsv"
            sha256sum "$OUT/direct-pass2/${name}.log" >"$OUT/direct-pass2/${name}.log.sha256"
          done <"$OUT/file-order.txt"
          python3 - <<'PY'
          import os
          rows={}
          for line in open(os.environ['OUT']+'/DIRECT_PASS2_EXIT.tsv'):
            name,code,path=line.rstrip('\n').split('\t',2);rows[name]=int(code)
          assert len(rows)==13 and all(v==0 for v in rows.values()),rows
          PY
          ! grep -R -E '(^|[[:space:]])error:' "$OUT/direct-pass2"
          ! grep -R -E 'declaration uses.*sorry' "$OUT/direct-pass2"

      - name: Check 14 source immutability and evidence hashes
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/codex_final_15check_v54.py immutability --out "$OUT"

      - name: Check 15 create final 15-of-15 reports
        shell: bash
        run: |
          set -euo pipefail
          source_commit="$(cat "$OUT/audited-source-commit.txt")"
          tag="codex-v54-13file-clean-${source_commit:0:12}-${GITHUB_RUN_ID}"
          printf '%s\n' "$tag" >/tmp/v54-final-tag.txt
          python3 scripts/codex_final_15check_v54.py report \
            --out "$OUT" --repository "$GITHUB_REPOSITORY" --branch "$TARGET_BRANCH" \
            --baseline "$BASELINE_HEAD_SHA" --source-commit "$source_commit" \
            --run-id "$GITHUB_RUN_ID" --tag "$tag" \
            --fa-inventory .github/codex/FA_V54_REMAINING_ERRORS.json \
            --qym-inventory .github/codex/QYM_V54_INVENTORY.json \
            --machine-report .github/codex/FINAL_13FILE_15_CHECKLIST_V54.json \
            --human-report .github/codex/FINAL_13FILE_15_CHECKLIST_V54.md

      - name: Commit reports create immutable tag and lock it
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          source_commit="$(cat "$OUT/audited-source-commit.txt")"
          tag="$(cat /tmp/v54-final-tag.txt)"
          git add .github/codex/FINAL_13FILE_15_CHECKLIST_V54.json .github/codex/FINAL_13FILE_15_CHECKLIST_V54.md
          git commit -m "Codex: record final v54 13-file clean build 15-of-15 PASS"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
          report_commit="$(git rev-parse HEAD)"
          git tag -a "$tag" -m "Verified v54 13-file Lean clean build and 15-of-15 audit; source $source_commit; report $report_commit"
          git push origin "$tag"
          SOURCE_COMMIT="$source_commit" REPORT_COMMIT="$report_commit" TAG="$tag" python3 - <<'PY'
          import json,os
          from pathlib import Path
          lock={'schema':'final-13file-clean-lock-v54','repository':os.environ['GITHUB_REPOSITORY'],'branch':os.environ['TARGET_BRANCH'],'audited_source_commit':os.environ['SOURCE_COMMIT'],'evidence_report_commit':os.environ['REPORT_COMMIT'],'immutable_tag':os.environ['TAG'],'tag_target_commit':os.environ['REPORT_COMMIT'],'github_run_id':os.environ['GITHUB_RUN_ID'],'all_15_checks_pass':True,'all_13_clean_build':True,'theorem_statements_changed':False,'declaration_order_changed':False,'source_moves':[]}
          Path('.github/codex/FINAL_13FILE_CLEAN_LOCK_V54.json').write_text(json.dumps(lock,indent=2,sort_keys=True)+'\n')
          PY
          git add .github/codex/FINAL_13FILE_CLEAN_LOCK_V54.json
          git commit -m "Codex: lock final v54 audit tag and evidence commit"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"

      - name: Upload final complete evidence bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-v54-final-13file-15check-${{ github.sha }}
          path: |
            build-logs/codex-v54/final-13file-15check
            .github/codex/FINAL_13FILE_15_CHECKLIST_V54.json
            .github/codex/FINAL_13FILE_15_CHECKLIST_V54.md
            .github/codex/FINAL_13FILE_CLEAN_LOCK_V54.json
          retention-days: 30
