    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1
          persist-credentials: false

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: v54-direct13-base-${{ github.run_id }}
          path: /tmp/v54-direct13-base

      - name: Apply one QYM inventory-local proof-body candidate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          base_source="$(find /tmp/v54-direct13-base -type f -name QYM-base.lean -print -quit)"
          inventory="$(find /tmp/v54-direct13-base -type f -name QYM_BASE_INVENTORY.json -print -quit)"
          qym_path_file="$(find /tmp/v54-direct13-base -type f -name qym-path.txt -print -quit)"
