name: Codex FA after3361 Fredholm dot v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-after3361-fredholm-dot-v1.yml
  workflow_dispatch:
permissions: {actions: read, contents: read}
env:
  BASE_RUN_ID: "31577163526"
  BASE_JOB_ID: "94051772710"
  BASE_HEAD_SHA: "215b363f16ef763c98395d9cc607bcfa45ba55fc"
  BASE_ARTIFACT_ID: "9133895479"
  BASE_ARTIFACT_NAME: "codex-fa-after3341-antidual-hilbert-v2-215b363f16ef763c98395d9cc607bcfa45ba55fc"
  BASE_ARTIFACT_DIGEST: "sha256:a98de850124e5ae6cc53366325ce29147d5664eb1c02cf34701761ca0346c647"
  BASE_SOURCE_SHA256: "f75158ccbd9b724edce85f01ceff53c23903fff5a755993b089b50b04c1dfd15"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact idx3361 full-source evidence
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-after3361-fredholm-dot-v1
          mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          out=Path('build-logs/codex-fa-after3361-fredholm-dot-v1')
          r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); a=json.loads((out/'artifact.json').read_text())
          m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['head_sha']==os.environ['BASE_HEAD_SHA'] and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==int(os.environ['BASE_JOB_ID']) and j['run_id']==int(os.environ['BASE_RUN_ID']) and j['conclusion']=='failure'
          assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['name']==os.environ['BASE_ARTIFACT_NAME'] and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and not a['expired']
          assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1 and m['all_required_lean_executed'] is True
          assert m['FA_error_declaration_index']==3361 and m['FA_first_error_declaration']=='weakSchrodinger_solvable_iff_adjointKernel_orthogonal'
          assert m['source_sha256']==os.environ['BASE_SOURCE_SHA256'] and m['source_identity_locked_after_materialization'] is True
          assert m['public_proposition_changes_explicitly_audited'] is True and m['existing_declaration_relative_order_preserved'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
              b=p.read_bytes()
              if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256']: hits.append(p)
          assert len(hits)==1
          shutil.copy2(hits[0],'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          (out/'ALLOWED.json').write_text(json.dumps(m['allowed_public_proposition_changes'],indent=2)+'\n')
          PY
      - name: Normalize audited Fredholm dot chains
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-after3361-fredholm-dot-v1
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re,os
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before=p.read_text(); b0=p.read_bytes()
          decl_rx=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          seq0=[m.group('name') for m in decl_rx.finditer(before)]
          forbidden=['sorry','admit','axiom','set_option']
          fc0={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',before)) for x in forbidden}
          methods=[
            'solvable_iff_mem_orthogonal_adjointKernel',
            'canonicalSolution_mem_kernelOrthogonal',
            'solves_iff_canonical_add_kernel',
            'canonicalSolution_norm_le',
            'adjointKernel_finiteDimensional',
          ]
          changed=[]
          after=before
          for meth in methods:
              old='(fredholmData_of_compactPotential n t hcompact)\n    .'+meth
              new='(fredholmData_of_compactPotential n t hcompact).'+meth
              c=after.count(old)
              assert c==1, (meth,c)
              after=after.replace(old,new,1); changed.append(meth)
          p.write_text(after)
          seq1=[m.group('name') for m in decl_rx.finditer(after)]
          fc1={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',after)) for x in forbidden}
          assert seq0==seq1 and fc0==fc1
          # Every normalized chain is in a theorem proof body; declaration names/order and public headers stay byte-identical.
          def headers(s):
              lines=s.splitlines(); out=[]
              for i,line in enumerate(lines):
                  if re.match(r'^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+',line):
                      j=i; acc=[]
                      while j<len(lines):
                          acc.append(lines[j])
                          if ':=' in lines[j] or lines[j].rstrip().endswith(' where') or lines[j].rstrip().endswith(':= by') or lines[j].rstrip().endswith(':='):
                              break
                          if j-i>40: break
                          j+=1
                      out.append('\n'.join(acc))
              return out
          assert headers(before)==headers(after)
          b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          audit={'base_sha256':hashlib.sha256(b0).hexdigest(),'candidate_sha256':sha,'normalized_methods':changed,'existing_declaration_relative_order_preserved':True,'public_theorem_source_headers_changed':False,'semantic_public_proposition_change':False,'forbidden_lexical_counts_preserved':True}
          out=Path('build-logs/codex-fa-after3361-fredholm-dot-v1'); (out/'DOT_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps({'sha256':sha,'bytes':len(b),'lines':len(after.splitlines())},indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f'CANDIDATE_SHA={sha}\n')
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-after3361-fredholm-dot-v1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct full-source frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-after3361-fredholm-dot-v1
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 1
          one Mock2_Advanced 1
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"
          one Mock2_FunctionalAnalysis 1
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-after3361-fredholm-dot-v1'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); b=p.read_bytes()
          ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]
          rx=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
              m=rx.match(raw)
              if m:
                  ln=int(m.group(1)); i=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[i].group('name') if i>=0 else None,'declaration_index':i if i>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; au=json.loads((out/'DOT_AUDIT.json').read_text())
          metric={'schema':'fa-after3361-fredholm-dot-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'existing_declaration_relative_order_preserved':au['existing_declaration_relative_order_preserved'],'public_proposition_changes_explicitly_audited':True,'semantic_public_proposition_change':False,'allowed_public_proposition_changes':json.loads((out/'ALLOWED.json').read_text())}
          (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3361-fredholm-dot-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3361-fredholm-dot-v1
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
