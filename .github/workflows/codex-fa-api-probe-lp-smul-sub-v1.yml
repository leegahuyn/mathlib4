name: Codex FA API probe P5 manifold scoped partition type
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile P5 scoped notation probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP5Scope.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff

          #check SmoothPartitionOfUnity
          variable (s : Set ℂ)
          variable (P : SmoothPartitionOfUnity ℍ 𝓘(ℝ, ℂ) ℂ s)

          example : SmoothPartitionOfUnity ℍ 𝓘(ℝ, ℂ) ℂ s := P
          LEAN
          lake env lean -DmaxErrors=20 -DwarningAsError=false /tmp/ProbeP5Scope.lean 2>&1 | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-p5-manifold-scope-probe-${{ github.sha }}
          path: |
            /tmp/ProbeP5Scope.lean
            /tmp/probe.log
          retention-days: 30
