name: Codex FA canonical Submodule AddCommGroup coherence probe
# trigger: canonical-submodule-addgroup-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile canonical instance coherence probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeCanonicalGroup.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {V W : Type*} [AddCommGroup V] [Module ℂ V]
            [AddCommGroup W] [Module ℂ W]
          variable (S : Submodule ℂ V)

          noncomputable local instance coreModule : Module ℂ S := by
            exact Submodule.module S
          noncomputable local instance coreAddCommGroup : AddCommGroup S := by
            exact Submodule.addCommGroup S

          example (u v : S) : ((u - v : S) : V) = (u : V) - (v : V) := by
            rfl

          example (L : S →ₗ[ℂ] W) (u v : S) : L (u - v) = L u - L v := by
            exact map_sub L u v

          abbrev F := ℂ → ℂ
          def SmoothSub : Submodule ℂ F := ⊤
          abbrev Smooth := SmoothSub
          instance : CoeFun Smooth (fun _ => ℂ → ℂ) where coe f := f.1
          def CoreSub : Submodule ℂ Smooth := ⊤
          abbrev Core := CoreSub

          noncomputable local instance core2Module : Module ℂ Core := by
            exact Submodule.module CoreSub
          noncomputable local instance core2AddCommGroup : AddCommGroup Core := by
            exact Submodule.addCommGroup CoreSub

          example (u a b : Core) (z : ℂ) :
              ((((u - a - b : Core) : Smooth) : F) z) =
                (((u : Smooth) : F) z - (((a : Smooth) : F) z) -
                  (((b : Smooth) : F) z)) := by
            rfl
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeCanonicalGroup.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-canonical-submodule-addgroup-${{ github.sha }}
          path: |
            /tmp/ProbeCanonicalGroup.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
