name: Codex FA explicit two-submodule AddCommGroup coherence probe
# trigger: explicit-two-submodule-addgroup-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile explicit two-submodule coherence probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeTwoLevelGroup.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {X W : Type*} [AddCommMonoid X] [Module ℂ X]
            [AddCommGroup W] [Module ℂ W]
          variable (S : Submodule ℂ X)

          noncomputable local instance ambientAddCommGroup : AddCommGroup S := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          variable (T : Submodule ℂ S)

          noncomputable local instance coreAddCommGroup : AddCommGroup T := by
            exact Submodule.addCommGroup T

          example (u v : T) :
              (((u - v : T) : S)) = (u : S) - (v : S) := by
            rfl

          example (L : T →ₗ[ℂ] W) (u v : T) :
              L (u - v) = L u - L v := by
            exact map_sub L u v

          example (E : S →ₗ[ℂ] W) (u v : T) :
              E ((u - v : T) : S) = E (u : S) - E (v : S) := by
            rw [show ((u - v : T) : S) = (u : S) - (v : S) by rfl]
            exact map_sub E (u : S) (v : S)
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeTwoLevelGroup.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-explicit-two-submodule-addgroup-${{ github.sha }}
          path: |
            /tmp/ProbeTwoLevelGroup.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
