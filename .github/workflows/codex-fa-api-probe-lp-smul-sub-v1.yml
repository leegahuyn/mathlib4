name: Codex FA two-level ambient/core AddCommGroup coherence probe
# trigger: two-level-ambient-core-addgroup-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile two-level instance coherence probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeTwoLevelGroup.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {X W : Type*}
          variable [AddCommMonoid X] [Module ℂ X]
          variable [AddCommGroup W] [Module ℂ W]

          def AmbientSub : Submodule ℂ X := ⊤
          abbrev Ambient := AmbientSub (X := X)

          noncomputable local instance ambientAddCommGroup : AddCommGroup Ambient := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          def CoreSub : Submodule ℂ Ambient := ⊤
          abbrev Core := CoreSub (X := X)

          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Submodule.addCommGroup (CoreSub (X := X))

          example (u v : Core) :
              (((u - v : Core) : Ambient)) = (u : Ambient) - (v : Ambient) := by
            rfl

          example (L : Core →ₗ[ℂ] W) (u v : Core) :
              L (u - v) = L u - L v := by
            exact map_sub L u v

          example (E : Ambient →ₗ[ℂ] W) (u v : Core) :
              E ((u - v : Core) : Ambient) = E (u : Ambient) - E (v : Ambient) := by
            rw [show ((u - v : Core) : Ambient) = (u : Ambient) - (v : Ambient) by rfl]
            exact map_sub E (u : Ambient) (v : Ambient)
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeTwoLevelGroup.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-two-level-ambient-core-addgroup-${{ github.sha }}
          path: |
            /tmp/ProbeTwoLevelGroup.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
