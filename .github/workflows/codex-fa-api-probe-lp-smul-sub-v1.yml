name: Codex FA API probe partial eigenspace subtype ext constructors
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile subtype ext constructor probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePartialEig.lean <<'LEAN'
          import Mathlib
          open scoped LinearPMap

          variable {H : Type*} [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          def partialEigenspaceProbe (A : H →ₗ.[ℂ] H) (μ : ℂ) : Submodule ℂ H where
            carrier := {x | ∃ hx : x ∈ A.domain, A ⟨x, hx⟩ = μ • x}
            zero_mem' := by
              refine ⟨A.domain.zero_mem, ?_⟩
              rw [smul_zero]
              have h0 : (⟨(0 : H), A.domain.zero_mem⟩ : A.domain) = 0 := by
                apply Subtype.ext
                rfl
              rw [h0]
              exact LinearPMap.map_zero A
            add_mem' := by
              rintro x y ⟨hx, hAx⟩ ⟨hy, hAy⟩
              refine ⟨A.domain.add_mem hx hy, ?_⟩
              have hadd :
                  (⟨x + y, A.domain.add_mem hx hy⟩ : A.domain) =
                    (⟨x, hx⟩ : A.domain) + (⟨y, hy⟩ : A.domain) := by
                apply Subtype.ext
                rfl
              rw [hadd, LinearPMap.map_add, hAx, hAy, smul_add]
            smul_mem' := by
              rintro c x ⟨hx, hAx⟩
              refine ⟨A.domain.smul_mem c hx, ?_⟩
              have hsmul :
                  (⟨c • x, A.domain.smul_mem c hx⟩ : A.domain) =
                    c • (⟨x, hx⟩ : A.domain) := by
                apply Subtype.ext
                rfl
              rw [hsmul, LinearPMap.map_smul, hAx, smul_smul, mul_comm]

          example (A : H →ₗ.[ℂ] H) (μ : ℂ) :
              partialEigenspaceProbe A μ = partialEigenspaceProbe A μ := by rfl
          LEAN
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePartialEig.lean 2>&1 | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-partial-eigenspace-subtype-ext-${{ github.sha }}
          path: |
            /tmp/ProbePartialEig.lean
            /tmp/probe.log
          retention-days: 30
