name: Codex FA residual roots probe v2
# trigger: fa-residual-roots-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-smul-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile corrected residual root proof shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeResidualRoots.lean <<'LEAN'
          import Mathlib

          open Set Function Topology
          open scoped ContDiff

          variable {S H : Type*}
          variable [NormedAddCommGroup S] [InnerProductSpace ℂ S]
          variable [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          example (L R B : S →ₗ[ℂ] H) (m : ℝ)
              (hid : ∀ q : S, ‖L q‖ ^ 2 = ‖R q‖ ^ 2 - m * ‖B q‖ ^ 2)
              (u v : S) :
              ‖L u - L v‖ ^ 2 = ‖R u - R v‖ ^ 2 - m * ‖B u - B v‖ ^ 2 := by
            let q : S := u + (-1 : ℂ) • v
            have h := hid q
            simpa only [q, map_add, map_smul, neg_smul, one_smul, map_neg,
              sub_eq_add_neg] using h

          noncomputable def probeAffineKernel
              (c : ℂ) (a : ℝ) (f : ℂ → ℂ) (t : ℂ) : ℂ :=
            c * f (a • t)

          example (c : ℂ) (a : ℝ) (f : ℂ → ℂ) (hf : ContDiff ℝ ∞ f) :
              ContDiff ℝ ∞ (probeAffineKernel c a f) := by
            unfold probeAffineKernel
            fun_prop

          example (f : ℂ → ℝ) :
              tsupport ((fun r : ℝ => (r : ℂ)) ∘ f) ⊆ tsupport f := by
            exact tsupport_comp_subset
              (g := fun r : ℝ => (r : ℂ)) (by norm_num) f

          variable (F : ℍ → ℂ → ℝ) (s : Finset ℍ) (z : ℂ)
          example (h : ∀ x : ℍ, F x z ≠ (0 : ℝ) → x ∈ s) :
              Function.support (fun x : ℍ => (F x z : ℝ)) ⊆ (s : Set ℍ) := by
            intro x hx
            exact h x hx
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeResidualRoots.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-residual-roots-v2-${{ github.sha }}
          path: |
            /tmp/ProbeResidualRoots.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
