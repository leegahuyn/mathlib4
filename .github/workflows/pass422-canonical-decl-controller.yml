name: PASS 422 canonical-declaration FA controller

on:
  push:
    branches:
      - fix/fa422-canonical-decl-controller-20260809
    paths:
      - '.github/workflows/pass422-canonical-decl-controller.yml'
      - 'scripts/fa422_canonical_decl_tournament.py'
      - 'scripts/fa422_select_verified_champion.py'
      - 'build-logs/fa422-canonical-decl/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pass422-canonical-decl-controller
  cancel-in-progress: false

jobs:
  select-repair-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      FA422_MAX_FRONTIERS: '80'
      FA422_MAX_CANDIDATES: '500'
      FA422_DIRECT_FALLBACK: '20'
      MAX_ROUNDS: '8'
    steps:
      - name: Checkout latest head with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa422-canonical-decl-controller-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Determine round
        id: round
        shell: bash
        run: |
          f=build-logs/fa422-canonical-decl/ROUND.txt
          test -s "$f" && current=$(cat "$f") || current=0
          next=$((current+1))
          echo "round=${next}" >> "$GITHUB_OUTPUT"

      - name: Select highest checked-in directly reproducible champion
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa422_select_verified_champion.py > /tmp/fa422-select.log 2>&1
          cat /tmp/fa422-select.log

      - name: Mine variable-height proof bodies with canonical declaration checks
        id: repair
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa422_canonical_decl_tournament.py > /tmp/fa422-repair.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa422-repair.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before}" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate and archive authoritative evidence
        if: always()
        id: status
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          d=build-logs/fa422-canonical-decl
          sel=build-logs/fa420-evidence-controller
          test -s "$d/CURRENT.json"
          test -s "$d/CURRENT.txt"
          test -s "$sel/SELECTED.json"
          cp "$sel/SELECTED.json" "$d/SELECTED.json"
          cp "$sel/SELECTED.txt" "$d/SELECTED.txt"
          mkdir -p "$d/round-${ROUND}"
          cp "$d/CURRENT.json" "$d/round-${ROUND}/CURRENT.json"
          cp "$d/CURRENT.txt" "$d/round-${ROUND}/CURRENT.txt"
          cp "$d/SELECTED.json" "$d/round-${ROUND}/SELECTED.json"
          cp /tmp/fa422-select.log "$d/round-${ROUND}/selection.log"
          cp /tmp/fa422-repair.log "$d/round-${ROUND}/repair.log"
          printf '%s' "$ROUND" > "$d/ROUND.txt"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          d=Path('build-logs/fa422-canonical-decl')
          s=json.loads((d/'CURRENT.json').read_text())
          m=s['final_fa_metric']; complete=bool(s['complete'])
          actual=hashlib.sha256(Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()).hexdigest()
          if m.get('source_sha256') != actual: raise SystemExit('source/evidence SHA mismatch')
          if not complete and (not isinstance(m.get('first_line'),int) or m['first_line'] < 31725):
              raise SystemExit(f"direct CLI regression: {m.get('first_line')}")
          if any(s['forbidden_token_audit'].values()): raise SystemExit('forbidden-token audit failed')
          if s['statement_policy'] != 'declaration header manifest unchanged; only proof bodies may vary':
              raise SystemExit('declaration statement policy missing')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
              f.write(f"source_sha={actual}\n")
              f.write(f"first_error={m.get('first_line')}\n")
          PY

      - name: Commit only verified source and concise evidence
        if: always()
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          CHANGED: ${{ steps.repair.outputs.source_changed }}
        run: |
          set -euo pipefail
          d=build-logs/fa422-canonical-decl
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/CURRENT.json" "$d/CURRENT.txt" "$d/SELECTED.json" "$d/SELECTED.txt" "$d/ROUND.txt"
          test ! -f "$d/FIRST_ERROR_CONTEXT.txt" || git add "$d/FIRST_ERROR_CONTEXT.txt"
          test ! -f "$d/ALL_REQUIRED_TARGETS_2X_PASS" || git add "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          find "$d" -maxdepth 1 -type f -name 'frontier-*-PROMOTED.txt' -print0 | xargs -0 -r git add
          git add "$d/round-${ROUND}/CURRENT.json" "$d/round-${ROUND}/CURRENT.txt" "$d/round-${ROUND}/SELECTED.json"
          if git diff --cached --quiet; then exit 0; fi
          if test "${COMPLETE:-false}" = true; then
            msg="fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS in FA422 round ${ROUND} [skip ci]"
          elif test "${CHANGED:-false}" = true; then
            msg="fix: promote canonical-declaration FA champion round ${ROUND} [skip ci]"
          else
            msg="ci: record FA422 round ${ROUND} no-improvement evidence [skip ci]"
          fi
          git commit -m "$msg"
          git push origin HEAD:fix/fa422-canonical-decl-controller-20260809

      - name: Dispatch next round only after checked-in source advancement
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          ROUND: ${{ steps.round.outputs.round }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          CHANGED: ${{ steps.repair.outputs.source_changed }}
          BEFORE: ${{ steps.repair.outputs.before_sha }}
          AFTER: ${{ steps.repair.outputs.after_sha }}
        run: |
          set -euo pipefail
          test "${COMPLETE:-false}" != true || exit 0
          advanced=false
          test "${CHANGED:-false}" = true && advanced=true
          test "${BEFORE:-}" = "${AFTER:-}" || advanced=true
          test "$advanced" = true || exit 0
          test "${ROUND}" -lt "${MAX_ROUNDS}" || exit 0
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pass422-canonical-decl-controller.yml/dispatches" \
            -f ref=fix/fa422-canonical-decl-controller-20260809

      - name: Upload complete evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass422-canonical-decl-round-${{ steps.round.outputs.round }}-${{ github.run_id }}
          path: |
            build-logs/fa422-canonical-decl
            build-logs/fa420-evidence-controller
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final result
        if: always()
        env:
          COMPLETE: ${{ steps.status.outputs.complete }}
        shell: bash
        run: |
          test "${COMPLETE:-false}" = true
