name: FA429 autonomous continuation after FA426 verified source

on:
  push:
    branches:
      - fix/fa429-continuation-after-fa426-20260810
    paths:
      - .github/workflows/fa429-continuation-after-fa426.yml
      - build-logs/fa429-continuation/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa429-continuation-after-fa426
  cancel-in-progress: false

jobs:
  wait-for-fa426:
    runs-on: ubuntu-24.04
    timeout-minutes: 325
    outputs:
      source_commit: ${{ steps.wait.outputs.source_commit }}
      source_sha: ${{ steps.wait.outputs.source_sha }}
      first_line: ${{ steps.wait.outputs.first_line }}
      fa_exit: ${{ steps.wait.outputs.fa_exit }}
    env:
      UPSTREAM_BRANCH: fix/fa426-monotone-donor-proof-miner-20260810
    steps:
      - name: Checkout continuation controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa429-continuation-after-fa426-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Wait for a source/evidence-identical direct-verified FA426 result
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa429-wait
          found=false
          for attempt in $(seq 1 300); do
            git fetch --force origin \
              "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}" \
              --depth=20 >/tmp/fa429-wait/fetch.log 2>&1 || true
            upstream="refs/remotes/origin/${UPSTREAM_BRANCH}"
            if git rev-parse --verify "$upstream" >/dev/null 2>&1 && \
               git show "$upstream:build-logs/fa426-monotone-donor-proof-miner/CURRENT.json" \
                 > /tmp/fa429-wait/CURRENT.json 2>/dev/null && \
               git show "$upstream:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
                 > /tmp/fa429-wait/Mock2_FunctionalAnalysis.lean 2>/dev/null; then
              python3 - <<'PY' > /tmp/fa429-wait/validated.env || true
          import hashlib, json
          from pathlib import Path
          e = json.loads(Path('/tmp/fa429-wait/CURRENT.json').read_text())
          src = Path('/tmp/fa429-wait/Mock2_FunctionalAnalysis.lean').read_bytes()
          sha = hashlib.sha256(src).hexdigest()
          selected = e.get('selected', {})
          authority = e.get('authority')
          exit_code = int(selected.get('exit_code', 999))
          first = int(selected.get('first_error_line', 0))
          line_count = src.count(b'\n') + (0 if src.endswith(b'\n') else 1)
          valid = (
              e.get('classification') == 'VERIFIED'
              and authority == 'direct Lean CLI'
              and selected.get('source_sha256') == sha
              and line_count == 60453
              and (exit_code == 0 or first >= 31726)
          )
          print(f'VALID={str(valid).lower()}')
          print(f'SOURCE_SHA={sha}')
          print(f'FA_EXIT={exit_code}')
          print(f'FIRST_LINE={first}')
          PY
              # shellcheck disable=SC1091
              source /tmp/fa429-wait/validated.env || true
              if test "${VALID:-false}" = true; then
                source_commit=$(git rev-parse "$upstream")
                {
                  echo "source_commit=$source_commit"
                  echo "source_sha=$SOURCE_SHA"
                  echo "fa_exit=$FA_EXIT"
                  echo "first_line=$FIRST_LINE"
                } >> "$GITHUB_OUTPUT"
                found=true
                break
              fi
            fi
            printf 'attempt=%s upstream not ready\n' "$attempt"
            sleep 60
          done
          test "$found" = true

      - name: Preserve upstream wait provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa429-wait-${{ github.run_id }}
          path: /tmp/fa429-wait
          if-no-files-found: warn
          retention-days: 30

  continue-mining:
    needs: wait-for-fa426
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa429-continuation-after-fa426-20260810
      UPSTREAM_BRANCH: fix/fa426-monotone-donor-proof-miner-20260810
      UPSTREAM_COMMIT: ${{ needs.wait-for-fa426.outputs.source_commit }}
      UPSTREAM_SHA: ${{ needs.wait-for-fa426.outputs.source_sha }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FA426_MAX_CANDIDATES: '36'
      FA426_MAX_PROMOTIONS: '8'
      FA426_TIME_BUDGET_SECONDS: '18800'
    steps:
      - name: Checkout exact FA429 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa429-continuation-after-fa426-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Materialize exact direct-verified FA426 source and evidence
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_COMMIT"
          git fetch --force origin "$UPSTREAM_COMMIT" --depth=20
          mkdir -p build-logs/fa426-monotone-donor-proof-miner \
                   build-logs/fa429-continuation/input-fa426
          git show "$UPSTREAM_COMMIT:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            > PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git show "$UPSTREAM_COMMIT:build-logs/fa426-monotone-donor-proof-miner/CURRENT.json" \
            > build-logs/fa426-monotone-donor-proof-miner/CURRENT.json
          cp build-logs/fa426-monotone-donor-proof-miner/CURRENT.json \
            build-logs/fa429-continuation/input-fa426/CURRENT.json
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa429-continuation/input-fa426/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$UPSTREAM_SHA"
          printf '%s\n' "$UPSTREAM_COMMIT" > build-logs/fa429-continuation/input-fa426/commit.txt
          printf '%s\n' "$UPSTREAM_SHA" > build-logs/fa429-continuation/input-fa426/source-sha256.txt

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa429-lean-version.txt
          lake --version | tee /tmp/fa429-lake-version.txt
          lake exe cache get | tee /tmp/fa429-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Continue monotone direct Lean mining from FA426 champion
        id: miner
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa426_monotone_donor_proof_miner.py \
            > /tmp/fa429-console.log 2>&1
          rc=$?
          cat /tmp/fa429-console.log
          d=build-logs/fa426-monotone-donor-proof-miner
          cp /tmp/fa429-lean-version.txt "$d/fa429-lean-version.txt" 2>/dev/null || true
          cp /tmp/fa429-lake-version.txt "$d/fa429-lake-version.txt" 2>/dev/null || true
          cp /tmp/fa429-cache-get.log "$d/fa429-cache-get.log" 2>/dev/null || true
          cp /tmp/fa429-console.log "$d/fa429-console.log" 2>/dev/null || true
          if test -f "$d/CURRENT.json"; then
            selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('source_sha256',''))")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('exit_code',999))")
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_line',0))")
            strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          else
            selected_sha=''; fa_exit=999; first=0; strict=false
          fi
          {
            echo "script_rc=$rc"
            echo "selected_sha=$selected_sha"
            echo "fa_exit=$fa_exit"
            echo "first_line=$first"
            echo "strict_promotion=$strict"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit exact selected source before final verification
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          test -f "$d/CURRENT.json"
          selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$selected_sha"
          selected_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
          first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
          strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          mkdir -p build-logs/fa429-continuation/output
          cp "$d/CURRENT.json" build-logs/fa429-continuation/output/CURRENT.json
          cp "$d/CURRENT.txt" build-logs/fa429-continuation/output/CURRENT.txt
          cp "$d/FIRST_ERROR_CONTEXT.txt" build-logs/fa429-continuation/output/FIRST_ERROR_CONTEXT.txt 2>/dev/null || true
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                  build-logs/fa426-monotone-donor-proof-miner \
                  build-logs/fa429-continuation
          if test "$selected_exit" = 0; then metric=pass; else metric="first-${first}"; fi
          if test "$strict" = true; then
            msg="fix: persist FA429 ${metric} direct-verified continuation ${selected_sha:0:12}"
          else
            msg="fix: materialize FA426 verified source for FA429 continuation ${selected_sha:0:12}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$selected_sha"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "selected_sha=$selected_sha" >> "$GITHUB_OUTPUT"

          head_sha=$(git rev-parse HEAD)
          if test "$selected_exit" = 0; then metric=pass; else metric="first-${first}"; fi
          immutable="champion/fa429-${metric}-${selected_sha:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa429-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head_sha}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
              --input /tmp/fa429-ref.json > build-logs/fa429-continuation/output/immutable-response.json \
              2> build-logs/fa429-continuation/output/immutable-error.txt; then
            printf '%s\n' "$immutable" > build-logs/fa429-continuation/output/IMMUTABLE_CHAMPION_BRANCH.txt
          fi

      - name: Directly compile checked-in FA twice and audit forbidden escapes
        id: fa_gate
        if: always()
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa429-continuation/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          selected="${{ steps.persist.outputs.selected_sha }}"
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test -n "$selected" && test "$selected" = "$checked" && test "$selected" = "$worktree"; then identity=true; fi
          printf 'selected=%s\nchecked=%s\nworktree=%s\nidentity=%s\n' \
            "$selected" "$checked" "$worktree" "$identity" > "$d/source-identity.txt"

          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "$identity" = true; then
            compile_fa 1; r1=$?
            if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi
          fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util, json, os
          spec = importlib.util.spec_from_file_location('fa426', 'scripts/fa426_monotone_donor_proof_miner.py')
          mod = importlib.util.module_from_spec(spec); spec.loader.exec_module(mod)
          text = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text(encoding='utf-8')
          audit = mod.forbidden_counts(text)
          r1=int(os.environ['R1']); r2=int(os.environ['R2'])
          result={'FA_run1_exit':r1,'FA_run2_exit':r2,'forbidden_audit':audit,
                  'forbidden_clean':all(v==0 for v in audit.values()),
                  'FA_TRUE_PASS':r1==0 and r2==0 and all(v==0 for v in audit.values()),
                  'maxErrors_cap':1}
          p=Path('build-logs/fa429-continuation/final-gates/FA_FINAL.json')
          p.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa429-continuation/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          final=1
          complete=true
          targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            targets+=(Mock2_FunctionalAnalysis_Integrated)
          else
            complete=false; echo missing > "$d/Integrated-missing.txt"
          fi
          shopt -s nullglob
          for f in PrimalitySheafVerification/Mock3*.lean; do targets+=("$(basename "$f" .lean)"); done
          if test -f PrimalitySheafVerification/QYM.lean; then
            targets+=(QYM)
          else
            complete=false; echo missing > "$d/QYM-missing.txt"
          fi
          compile_one() {
            stem=$1; n=$2
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" \
              > "$d/${stem}-run${n}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; a=$?
              b=125
              if test "$a" -eq 0; then compile_one "$stem" 2; b=$?; fi
              if test "$a" -ne 0 || test "$b" -ne 0; then complete=false; break; fi
            done
          fi
          if test "$complete" = true; then final=0; touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"; fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and upload final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa429-continuation build-logs/fa426-monotone-donor-proof-miner
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA429 checked-in continuation and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload FA429 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa429-continuation-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa429-continuation
            build-logs/fa426-monotone-donor-proof-miner
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete ordered result
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
