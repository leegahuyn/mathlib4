name: GPT QYM verified-frontier producer selector v3

on:
  workflow_run:
    workflows:
      - GPT QYM verified-frontier producer repair matrix v2
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-auto-producer-selector-v3-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  select:
    if: github.event.workflow_run.head_branch == 'gpt/fa-qym-clean-final-20260816'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      BRANCH: gpt/fa-qym-clean-final-20260816
      OUT: /tmp/qym-auto-selector-v3

    steps:
      - name: Checkout latest branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/fa-qym-clean-final-20260816
          fetch-depth: 0
          persist-credentials: true

      - name: Download candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qym-auto-producer-v2-*
          path: /tmp/qym-auto-artifacts-v3
          merge-multiple: false
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: ${{ github.event.workflow_run.id }}

      - name: Verify and select direct Lean best
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          python3 - /tmp/qym-auto-artifacts-v3 "$OUT" <<'PY'
          from pathlib import Path
          import hashlib,json,os,sys
          root=Path(sys.argv[1]);out=Path(sys.argv[2]);records=[];missing=[]
          for artifact_dir in root.iterdir() if root.exists() else []:
              if not artifact_dir.is_dir():continue
              rp=artifact_dir/'PROBE_RESULT.json';cand=artifact_dir/'QYM.candidate.lean'
              if not rp.is_file() or not cand.is_file():
                  missing.append(artifact_dir.name);continue
              try:r=json.loads(rp.read_text(encoding='utf-8'))
              except Exception:continue
              raw=cand.read_bytes();sha=hashlib.sha256(raw).hexdigest()
              blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
              if sha!=r.get('candidate_qym_sha256') or blob!=r.get('candidate_qym_blob'):continue
              if r.get('panic_lines')!=0:continue
              records.append((r,rp,cand))
          if not records:
              (out/'NO_RESULTS.json').write_text(json.dumps({'missing':missing},indent=2)+'\n')
              raise SystemExit('no hash-verified direct Lean candidates')
          baseline_errors={r.get('baseline_error_headers') for r,_,_ in records}
          baseline_shas={r.get('baseline_qym_sha256') for r,_,_ in records}
          if len(baseline_errors)!=1 or len(baseline_shas)!=1:raise SystemExit('mixed baselines')
          baseline_errors=next(iter(baseline_errors));baseline_sha=next(iter(baseline_shas))
          def line(r):
              x=r.get('first_error') or {};return int(x.get('line') or 0) if isinstance(x,dict) else 0
          records.sort(key=lambda x:(0 if x[0].get('semantic_pass') else 1,
                                     x[0].get('error_headers',10**9),-line(x[0]),
                                     x[0].get('warning_headers',10**9),x[0].get('variant','')))
          best,best_rp,best_cand=records[0]
          strict=bool(best.get('semantic_pass')) or (
              isinstance(baseline_errors,int) and isinstance(best.get('error_headers'),int) and
              best['error_headers']<baseline_errors)
          selection={'schema':'qym-auto-producer-selection-v3',
                     'workflow_run_id':int(os.environ['MATRIX_RUN_ID']),
                     'workflow_head_sha':os.environ['MATRIX_HEAD_SHA'],
                     'baseline_qym_sha256':baseline_sha,
                     'baseline_error_headers':baseline_errors,
                     'strict_improvement':strict,'semantic_pass':bool(best.get('semantic_pass')),
                     'best_variant':best.get('variant'),'best':best,
                     'candidates':[r for r,_,_ in records],'missing_or_unmaterialized':missing}
          (out/'SELECTION.json').write_text(json.dumps(selection,indent=2,sort_keys=True)+'\n')
          (out/'GLOBAL_BEST.json').write_text(json.dumps(best,indent=2,sort_keys=True)+'\n')
          (out/'QYM.selected.lean').write_bytes(best_cand.read_bytes())
          for name in ('QYM.error-headers.txt','QYM.diagnostics.jsonl','QYM.panic-lines.txt'):
              p=best_rp.parent/name
              if p.is_file():(out/name).write_bytes(p.read_bytes())
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('STRICT_IMPROVEMENT='+('true' if strict else 'false')+'\n')
              env.write('SEMANTIC_PASS='+('true' if best.get('semantic_pass') else 'false')+'\n')
              env.write('SELECTED_SHA='+best['candidate_qym_sha256']+'\n')
              env.write('SELECTED_VARIANT='+str(best.get('variant'))+'\n')
          print(json.dumps(selection,indent=2,sort_keys=True))
          PY
        env:
          MATRIX_RUN_ID: ${{ github.event.workflow_run.id }}
          MATRIX_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}

      - name: Rebase onto current branch
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"

      - name: Promote semantic PASS to canonical
        if: env.SEMANTIC_PASS == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/QYM.selected.lean" PrimalitySheafVerification/QYM.lean
          mkdir -p .github/qym-final .github/qym-campaign
          cp "$OUT/SELECTION.json" .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          cp "$OUT/GLOBAL_BEST.json" .github/qym-final/AUTO_PRODUCER_PASS_RESULT.json
          printf '%s  %s\n' "$SELECTED_SHA" PrimalitySheafVerification/QYM.lean > .github/qym-final/QYM_PASS.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PrimalitySheafVerification/QYM.lean .github/qym-final .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          git commit -m "QYM: promote producer-matrix direct Lean PASS v3"
          git push origin "HEAD:$BRANCH"

      - name: Promote strict verified frontier
        if: env.STRICT_IMPROVEMENT == 'true' && env.SEMANTIC_PASS != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-frontier .github/qym-campaign
          cp "$OUT/QYM.selected.lean" .github/qym-frontier/QYM_GLOBAL_BEST.lean
          cp "$OUT/GLOBAL_BEST.json" .github/qym-frontier/GLOBAL_BEST.json
          cp "$OUT/QYM.error-headers.txt" .github/qym-frontier/QYM_GLOBAL_BEST.error-headers.txt
          cp "$OUT/QYM.diagnostics.jsonl" .github/qym-frontier/QYM_GLOBAL_BEST.diagnostics.jsonl
          cp "$OUT/SELECTION.json" .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          printf '%s  %s\n' "$SELECTED_SHA" .github/qym-frontier/QYM_GLOBAL_BEST.lean > .github/qym-frontier/QYM_GLOBAL_BEST.sha256
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/qym-frontier .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          git commit -m "QYM: promote verified producer frontier v3 ($SELECTED_VARIANT)"
          git push origin "HEAD:$BRANCH"

      - name: Persist no-improvement result
        if: env.STRICT_IMPROVEMENT != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-campaign
          cp "$OUT/SELECTION.json" .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add .github/qym-campaign/AUTO_PRODUCER_SELECTION.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "QYM: record producer matrix v3 without improvement"
          git push origin "HEAD:$BRANCH"

      - name: Upload selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-auto-producer-selection-v3-${{ github.event.workflow_run.id }}
          path: /tmp/qym-auto-selector-v3/**
          if-no-files-found: warn
          retention-days: 30
