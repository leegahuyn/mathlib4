name: PASS 416 autonomous strict FA continuation chain

on:
  push:
    branches:
      - fix/fa416-autonomous-strict-chain-20260809
    paths:
      - '.github/workflows/pass416-autonomous-strict-chain.yml'
      - 'build-logs/fa416-autonomous/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pass416-autonomous-strict-chain
  cancel-in-progress: false

jobs:
  continue-strictly:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa416-autonomous-strict-chain-20260809
      FA413_MAX_FRONTIERS: '8'
      FA413_MAX_CANDIDATES: '28'
      MAX_ROUNDS: '8'
    steps:
      - name: Checkout latest checked-in champion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa416-autonomous-strict-chain-20260809
          fetch-depth: 2000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Determine strict round
        id: round
        shell: bash
        run: |
          set -euo pipefail
          f=build-logs/fa416-autonomous/ROUND.txt
          if test -s "$f"; then
            round=$(cat "$f")
          else
            round=0
          fi
          next=$((round+1))
          echo "round=${next}" >> "$GITHUB_OUTPUT"
          echo "starting strict round ${next}/${MAX_ROUNDS}"

      - name: Run same-height strict tournament and ordered 2x gate
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa413_strict_transplant_tournament_v4.py > /tmp/fa416.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa416.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before}" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Materialize round evidence and validate strictness
        if: always()
        id: status
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          src=build-logs/fa413-strict-transplant
          dst=build-logs/fa416-autonomous
          mkdir -p "$dst/round-${ROUND}"
          test -s "$src/CURRENT.json"
          test -s "$src/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/round-${ROUND}/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/round-${ROUND}/CURRENT.txt"
          cp /tmp/fa416.log "$dst/round-${ROUND}/console.log"
          find "$src" -maxdepth 1 -type f \
            \( -name 'frontier-*-PROMOTED.txt' -o -name 'frontier-*-context.txt' \
               -o -name 'frontier-*-first-error.txt' -o -name 'ALL_REQUIRED_TARGETS_2X_PASS' \) \
            -exec cp {} "$dst/round-${ROUND}/" \;
          test ! -f "$src/ALL_REQUIRED_TARGETS_2X_PASS" || cp "$src/ALL_REQUIRED_TARGETS_2X_PASS" "$dst/ALL_REQUIRED_TARGETS_2X_PASS"
          printf '%s' "$ROUND" > "$dst/ROUND.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          s=json.loads(Path('build-logs/fa416-autonomous/CURRENT.json').read_text())
          m=s['final_fa_metric']
          complete=bool(s['complete'])
          if not complete:
              line=m.get('first_line')
              if not isinstance(line,int) or line < 31725:
                  raise SystemExit(f'regression below immutable champion: {line}')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit(f"forbidden token audit failed: {s['forbidden_token_audit']}")
          out=Path(os.environ['GITHUB_OUTPUT'])
          with out.open('a',encoding='utf-8') as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
              f.write(f"first_error={m.get('first_line')}\n")
              f.write(f"source_sha={m.get('source_sha256')}\n")
          PY

      - name: Commit checked-in champion and round evidence
        if: always()
        shell: bash
        env:
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          d=build-logs/fa416-autonomous
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
          if git diff --cached --quiet; then exit 0; fi
          if test "${COMPLETE:-false}" = true; then
            msg="fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS in round ${ROUND} [skip ci]"
          elif test "${SOURCE_CHANGED:-false}" = true; then
            msg="fix: promote strict FA champion in autonomous round ${ROUND} [skip ci]"
          else
            msg="ci: record autonomous FA round ${ROUND} no-improvement evidence [skip ci]"
          fi
          git commit -m "$msg"
          git push origin HEAD:fix/fa416-autonomous-strict-chain-20260809

      - name: Dispatch next round only after strict source improvement
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          if test "${COMPLETE:-false}" = true; then
            echo 'final ordered 2x gate complete; no continuation required'
            exit 0
          fi
          if test "${SOURCE_CHANGED:-false}" != true; then
            echo 'no strict source improvement; stop chain'
            exit 0
          fi
          if test "${ROUND}" -ge "${MAX_ROUNDS}"; then
            echo 'strict round cap reached; stop chain'
            exit 0
          fi
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pass416-autonomous-strict-chain.yml/dispatches" \
            -f ref=fix/fa416-autonomous-strict-chain-20260809
          echo 'next strict round dispatched'

      - name: Upload complete autonomous evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass416-autonomous-round-${{ steps.round.outputs.round }}-${{ github.run_id }}
          path: |
            build-logs/fa416-autonomous
            build-logs/fa413-strict-transplant
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final result
        if: always()
        env:
          COMPLETE: ${{ steps.status.outputs.complete }}
        shell: bash
        run: |
          test "${COMPLETE:-false}" = true
