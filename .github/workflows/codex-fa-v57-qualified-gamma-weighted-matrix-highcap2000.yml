name: Codex FA v57 qualified gamma weighted matrix highcap2000
run-name: "Codex: exclusive FA v57 qualified cumulative full compile"

on:
  workflow_dispatch:
  push:
    branches: [codex/fa-exclusive-focus-20260814]
    paths:
      - .github/workflows/codex-fa-v57-qualified-gamma-weighted-matrix-highcap2000.yml

permissions:
  contents: read
  actions: read

jobs:
  direct:
    name: direct-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        variant:
          - coord_gamma_base
          - coord_gamma_hb10m
          - coord_gamma_hb50m
    env:
      VARIANT: ${{ matrix.variant }}
      OUT: build-logs/codex-fa-v57/${{ matrix.variant }}
      BASE_RUN: "31774351117"
      BASE_ARTIFACT: "9209647939"
      BASE_ARTIFACT_NAME: codex-fa-v51-ring_simpa_adj-highcap2000-0c0025aba1e08e59a416cc0d76bb13e4772af6c7
      BASE_ARTIFACT_DIGEST: sha256:1b846f63ee8a8309ab1d72b062c7dc846a880be4db7be898a4ba609f13cdc8e0
      BASE_SOURCE_SHA: 6093e976dd6c4d5217850ab39318eeef50531aef3acd8c6d66dcd0a4426c294d
      BASE_SOURCE_BYTES: "2798992"
      BASE_SOURCE_LINES: "62637"
      V55_MATERIALIZER_B64_SHA: 6dc1dc80904ce6e7a746bc3e69a559308241da64fd3d14c099dce77dd595daf5
      V55_MATERIALIZER_SHA: 6b813d631ef74a34719de39c4696aedf1ea86402bc1ba6cf3b0cf97048a539fd
      V57_MATERIALIZER_SHA: 7862c02f783d405f82684e9fa64f7286291b19c106692bec50dcaafe386ae5f7

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-prove v51 authority and materialize exact v57 candidate
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" /tmp/v57-authority/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT}" >"$OUT/authority.json"
          python3 - <<'PY'
          import json, os
          a=json.load(open(os.path.join(os.environ['OUT'],'authority.json')))
          assert a['id']==int(os.environ['BASE_ARTIFACT'])
          assert a['name']==os.environ['BASE_ARTIFACT_NAME']
          assert a['digest']==os.environ['BASE_ARTIFACT_DIGEST']
          assert a['workflow_run']['id']==int(os.environ['BASE_RUN'])
          assert a['expired'] is False
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT}/zip" >/tmp/v57-authority/base.zip
          test "sha256:$(sha256sum /tmp/v57-authority/base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/v57-authority/base.zip -d /tmp/v57-authority/base
          base="$(find /tmp/v57-authority/base -type f -name 'Mock2_FunctionalAnalysis-candidate.lean' -print -quit)"
          test -n "$base"
          test "$(sha256sum "$base" | awk '{print $1}')" = "$BASE_SOURCE_SHA"
          test "$(wc -c < "$base" | tr -d ' ')" = "$BASE_SOURCE_BYTES"
          test "$(wc -l < "$base" | tr -d ' ')" = "$BASE_SOURCE_LINES"

          cat scripts/fa_v55_materialize.py.gz.b64.0* >/tmp/fa_v55.py.gz.b64
          test "$(sha256sum /tmp/fa_v55.py.gz.b64 | awk '{print $1}')" = "$V55_MATERIALIZER_B64_SHA"
          base64 -d /tmp/fa_v55.py.gz.b64 | gzip -d >/tmp/fa_v57.py
          test "$(sha256sum /tmp/fa_v57.py | awk '{print $1}')" = "$V55_MATERIALIZER_SHA"
          python3 - <<'PY'
          from pathlib import Path
          p=Path('/tmp/fa_v57.py')
          s=p.read_text()
          replacements=[
            ("""VARIANTS = {
              'coord_base': ('ring', False, 0),
              'coord_hb10m': ('ring', False, 10_000_000),
              'coord_hb50m': ('ring', False, 50_000_000),
            }
            """, """VARIANTS = {
              'coord_gamma_base': ('ring', True, 0),
              'coord_gamma_hb10m': ('ring', True, 10_000_000),
              'coord_gamma_hb50m': ('ring', True, 50_000_000),
            }
            """),
            ("'schema':'fa-v55-coordinate-and-weighted-clusters-v1'", "'schema':'fa-v57-qualified-gamma-weighted-clusters-v1'"),
            ('gammaTwoCentralNegOne :=', 'FixedPhaseEssentialCoreRoute.gammaTwoCentralNegOne :='),
            ('[conjugate, gammaTwoCentralNegOne_coe, mul_assoc]', '[conjugate, FixedPhaseEssentialCoreRoute.gammaTwoCentralNegOne_coe, mul_assoc]'),
            ('((gammaTwoCentralNegOne : GammaTwo) : SL(2, ℤ))', '((FixedPhaseEssentialCoreRoute.gammaTwoCentralNegOne : GammaTwo) : SL(2, ℤ))'),
            ('exact gammaTwoCentralNegOne_smul x', 'exact FixedPhaseEssentialCoreRoute.gammaTwoCentralNegOne_smul x'),
          ]
          for old,new in replacements:
              if s.count(old) != 1:
                  raise SystemExit(f'v57 anchor count={s.count(old)} for {old[:80]!r}')
              s=s.replace(old,new,1)
          compile(s,str(p),'exec')
          p.write_text(s)
          PY
          test "$(sha256sum /tmp/fa_v57.py | awk '{print $1}')" = "$V57_MATERIALIZER_SHA"
          python3 -m py_compile /tmp/fa_v57.py
          sha256sum /tmp/fa_v57.py >"$OUT/materializer.sha256"

          python3 /tmp/fa_v57.py \
            --base "$base" --variant "$VARIANT" \
            --out "$OUT/Mock2_FunctionalAnalysis-candidate.lean" \
            --audit "$OUT/PATCH_AUDIT.json" | tee "$OUT/MATERIALIZATION.stdout.json"
          cp "$OUT/Mock2_FunctionalAnalysis-candidate.lean" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          sha="$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')"
          printf '%s\n' "$sha" >"$OUT/candidate.sha256"
          wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | tr -d ' ' >"$OUT/candidate.bytes"
          wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | tr -d ' ' >"$OUT/candidate.lines"
          printf 'FA_V42_EXPECTED_CANDIDATE_SHA256=%s\n' "$sha" >>"$GITHUB_ENV"
          printf 'FA_V42_VARIANT=%s\n' "$VARIANT" >>"$GITHUB_ENV"
          printf 'FA_V42_OUT=%s\n' "$OUT" >>"$GITHUB_ENV"

      - name: Install pinned Lean and Mathlib cache
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"

      - name: Direct Mock2 then Mock2 Advanced then full FA highcap2000
        id: direct_lean
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/fa_v42_direct_compile_ci.sh

      - name: Exact metrics and complete diagnostic inventory
        id: collect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/fa_v42_collect_full_diagnostics.py \
            --source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --out "$OUT" --max-errors 2000 | tee "$OUT/metric-console.log"

      - name: Upload exact candidate and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v57-${{ matrix.variant }}-highcap2000-${{ github.sha }}
          path: build-logs/codex-fa-v57/${{ matrix.variant }}
          retention-days: 30

      - name: Preserve actual FA direct exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$OUT/Mock2_FunctionalAnalysis.exit"
          exit "$(tr -d '\r\n' < "$OUT/Mock2_FunctionalAnalysis.exit")"
