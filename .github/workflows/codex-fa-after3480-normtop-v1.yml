name: Codex FA after3492 mass v15
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3480-normtop-v1.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Attest latest-authoritative cumulative repairs and direct compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/codex_fa_after3492_mass_v15.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3492-mass-v15-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3492-mass-v15
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3492-mass-v15/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3492-mass-v15/Mock2_FunctionalAnalysis.exit)"
