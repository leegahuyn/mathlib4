name: Codex FA after3480 diamond diagnostic v10
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3480-normtop-v1.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build topology-diamond diagnostic runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3480_diamond_v8.sh').read_text()
          src = src.replace('codex-fa-after3480-diamond-v8', 'codex-fa-after3480-diamond-diagnostic-v10')
          needle = 'one Mock2_FunctionalAnalysis 1'
          assert src.count(needle) == 1
          src = src.replace(needle, 'one Mock2_FunctionalAnalysis 100', 1)
          Path('/tmp/codex_fa_after3480_diamond_diagnostic_v10.sh').write_text(src)
          PY
      - name: Attest topology-diamond patch and direct compile diagnostic full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3480_diamond_diagnostic_v10.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3480-diamond-diagnostic-v10-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3480-diamond-diagnostic-v10
          retention-days: 30
