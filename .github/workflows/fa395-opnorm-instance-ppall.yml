name: PASS 395 reveal completion opNorm instance mismatch

on:
  push:
    branches:
      - probe/fa395-opnorm-instance-ppall-20260809
    paths:
      - '.github/workflows/fa395-opnorm-instance-ppall.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  ppall:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3000
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Enable full pretty-printing for first opNorm theorem
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa395
          python3 - <<'PY'
          from pathlib import Path
          from hashlib import sha256
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          expected='5f2d7615aaad7bb3a232d19829f0f801278e7ab2fa2f66ccb68408b87647e620'
          actual=sha256(p.read_bytes()).hexdigest()
          if actual != expected:
              raise SystemExit((actual, expected))
          old='''theorem norm_baseExtension_le_one : ‖Q.baseExtension‖ ≤ 1 := by
          '''
          new='''set_option pp.all true in
          theorem norm_baseExtension_le_one : ‖Q.baseExtension‖ ≤ 1 := by
          '''
          if p.read_text().count(old) != 1:
              raise SystemExit('first theorem marker not unique')
          p.write_text(p.read_text().replace(old,new))
          PY

      - name: Compile only first two errors
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake env lean -DmaxErrors=2 PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > /tmp/fa395/ppall.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" > /tmp/fa395/summary.txt
          tail -800 /tmp/fa395/ppall.log > /tmp/fa395/tail.txt || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload full instance diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa395-opnorm-ppall-${{ github.sha }}
          path: /tmp/fa395
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce diagnostic failure
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${EXIT_CODE:-}"
          exit "${EXIT_CODE}"
