name: PASS 394 historical completion proof matrix

on:
  push:
    branches:
      - probe/fa394-historical-completion-proofs-20260809
    paths:
      - '.github/workflows/fa394-historical-completion-proofs.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa394-historical-completion-proofs
  cancel-in-progress: true

jobs:
  probe:
    name: historical-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - opnorm-only
          - pass286-canonical
          - pass316-typed-local
          - typed-no-local
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PASS 389 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3000
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Apply historical proof candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/fa394/${VARIANT}/logs" "/tmp/fa394/${VARIANT}/source"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          p = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before = sha256(p.read_bytes()).hexdigest()
          expected = '5f2d7615aaad7bb3a232d19829f0f801278e7ab2fa2f66ccb68408b87647e620'
          if before != expected:
              raise SystemExit(f'unexpected PASS389 baseline: {before}; expected {expected}')
          text = p.read_text()
          variant = os.environ['VARIANT']

          def repl(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              print(f'{label}: expected=1 actual={count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new)

          original_norms = [
              (
                  '''theorem norm_baseExtension_le_one : ‖Q.baseExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.baseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_baseExtension_le x
          ''',
                  'base', 'H₀',
              ),
              (
                  '''theorem norm_raiseExtension_le_one : ‖Q.raiseExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.raiseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_raiseExtension_le x
          ''',
                  'raise', 'HR',
              ),
              (
                  '''theorem norm_lowerExtension_le_one : ‖Q.lowerExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.lowerExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_lowerExtension_le x
          ''',
                  'lower', 'HL',
              ),
          ]

          if variant in {'opnorm-only', 'pass286-canonical'}:
              for old, name, cod in original_norms:
                  new = f'''theorem norm_{name}Extension_le_one : ‖Q.{name}Extension‖ ≤ 1 := by
            apply Q.{name}Extension.opNorm_le_bound zero_le_one
            intro x
            simpa only [one_mul] using Q.norm_{name}Extension_le x
          '''
                  repl(old, new, f'{name} canonical opnorm proof')

          if variant == 'pass316-typed-local':
              for old, name, cod in original_norms:
                  new = f'''theorem norm_{name}Extension_le_one : ‖Q.{name}Extension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact (Q.{name}Extension : Q.SobolevCompletion →L[ℂ] {cod}).opNorm_le_bound
              zero_le_one fun x => by
                rw [one_mul]
                exact Q.norm_{name}Extension_le x
          '''
                  repl(old, new, f'{name} typed local opnorm proof')

          if variant == 'typed-no-local':
              for old, name, cod in original_norms:
                  new = f'''theorem norm_{name}Extension_le_one : ‖Q.{name}Extension‖ ≤ 1 := by
            exact (Q.{name}Extension : Q.SobolevCompletion →L[ℂ] {cod}).opNorm_le_bound
              zero_le_one fun x => by
                rw [one_mul]
                exact Q.norm_{name}Extension_le x
          '''
                  repl(old, new, f'{name} typed canonical opnorm proof')

          if variant != 'opnorm-only':
              operator_old = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact innerSLFlip ℂ
          '''
              if variant == 'pass316-typed-local':
                  operator_new = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact (innerSLFlip ℂ :
              Q.SobolevCompletion →L[ℂ] StrongAntiDual Q.SobolevCompletion)
          '''
              else:
                  operator_new = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion :=
            (innerSLFlip ℂ :
              Q.SobolevCompletion →L[ℂ] StrongAntiDual Q.SobolevCompletion)
          '''
              repl(operator_old, operator_new, 'typed completion energy operator')

              repl(
                  '''@[simp]
          theorem completionEnergyOperator_apply (u v : Q.SobolevCompletion) :
              Q.completionEnergyOperator u v = ⟪v, u⟫_ℂ :=
            innerSLFlip_apply_apply ℂ u v
          ''',
                  '''@[simp]
          theorem completionEnergyOperator_apply (u v : Q.SobolevCompletion) :
              Q.completionEnergyOperator u v = ⟪v, u⟫_ℂ := by
            simpa [completionEnergyOperator] using
              (innerSLFlip_apply_apply ℂ u v)
          ''',
                  'unfold typed completion energy operator',
              )
              repl(
                  '''  rw [Q.completionEnergyOperator_apply]
            change ⟪Q.coreEmbedding (Q.toGraphRange v),
                Q.coreEmbedding (Q.toGraphRange u)⟫_ℂ = Q.energyForm v u
            rw [Q.coreEmbedding.inner_map_map, Q.inner_toGraphRange]
          ''',
                  '''  rw [Q.completionEnergyOperator_apply]
            change ⟪Q.coreEmbedding (Q.toGraphRange v),
                Q.coreEmbedding (Q.toGraphRange u)⟫_ℂ = Q.energyForm v u
            calc
              ⟪Q.coreEmbedding (Q.toGraphRange v),
                  Q.coreEmbedding (Q.toGraphRange u)⟫_ℂ =
                  ⟪Q.toGraphRange v, Q.toGraphRange u⟫_ℂ := by
                exact Q.coreEmbedding.inner_map_map _ _
              _ = Q.energyForm v u := Q.inner_toGraphRange v u
          ''',
                  'explicit core pairing transport',
              )
              repl(
                  '''theorem completionEnergyOperator_self_eq_zero_iff (u : Q.SobolevCompletion) :
              Q.completionEnergyOperator u u = 0 ↔ u = 0 := by
            rw [Q.completionEnergyOperator_apply, inner_self_eq_zero]
          ''',
                  '''theorem completionEnergyOperator_self_eq_zero_iff (u : Q.SobolevCompletion) :
              Q.completionEnergyOperator u u = 0 ↔ u = 0 := by
            rw [Q.completionEnergyOperator_apply]
            exact inner_self_eq_zero
          ''',
                  'direct completion self zero criterion',
              )
              repl(
                  '''  refine ⟨zero_lt_one, fun u ↦ ?_⟩
            rw [one_mul, Q.completionEnergyOperator_apply,
              inner_self_eq_norm_sq]
          ''',
                  '''  refine ⟨zero_lt_one, fun u ↦ ?_⟩
            rw [one_mul, Q.completionEnergyOperator_apply]
            exact le_of_eq (norm_sq_eq_re_inner (𝕜 := ℂ) u)
          ''',
                  'direct completion coercivity norm identity',
              )
              repl(
                  '''  FredholmBypass.coerciveForm_injective
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveForm_injective
            (V := Q.SobolevCompletion) 1 Q.completionEnergyOperator
              Q.completionEnergyOperator_coercive
          ''',
                  'explicit injectivity carrier',
              )
              repl(
                  '''  FredholmBypass.coerciveForm_surjective
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveForm_surjective
            (V := Q.SobolevCompletion) 1 Q.completionEnergyOperator
              Q.completionEnergyOperator_coercive
          ''',
                  'explicit surjectivity carrier',
              )
              repl(
                  '''  FredholmBypass.coerciveFormEquiv
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveFormEquiv
            (V := Q.SobolevCompletion) 1 Q.completionEnergyOperator
              Q.completionEnergyOperator_coercive
          ''',
                  'explicit equivalence carrier',
              )
              repl(
                  '''@[simp]
          theorem completionEnergyEquiv_apply (u : Q.SobolevCompletion) :
              Q.completionEnergyEquiv u = Q.completionEnergyOperator u :=
            rfl
          ''',
                  '''@[simp]
          theorem completionEnergyEquiv_apply (u : Q.SobolevCompletion) :
              Q.completionEnergyEquiv u = Q.completionEnergyOperator u := by
            exact FredholmBypass.coerciveFormEquiv_apply
              (V := Q.SobolevCompletion) 1 Q.completionEnergyOperator
                Q.completionEnergyOperator_coercive u
          ''',
                  'explicit equivalence application',
              )
              repl(
                  '''  change Q.completionEnergyEquiv
              (Q.completionEnergyEquiv.symm F) = F
            exact Q.completionEnergyEquiv.apply_symm_apply F
          ''',
                  '''  rw [← Q.completionEnergyEquiv_apply]
            exact Q.completionEnergyEquiv.apply_symm_apply F
          ''',
                  'solve completion equation through apply lemma',
              )
              repl(
                  '''  simpa [solveCompletionEnergy, completionEnergyEquiv] using
            (FredholmBypass.coerciveFormEquiv_symm_norm_le
              1 Q.completionEnergyOperator
              Q.completionEnergyOperator_coercive F)
          ''',
                  '''  change ‖Q.completionEnergyEquiv.symm F‖ ≤ ‖F‖
            simpa [completionEnergyEquiv] using
              (FredholmBypass.coerciveFormEquiv_symm_norm_le
                (V := Q.SobolevCompletion) 1 Q.completionEnergyOperator
                  Q.completionEnergyOperator_coercive F)
          ''',
                  'explicit solution norm estimate',
              )

          p.write_text(text)
          after = sha256(p.read_bytes()).hexdigest()
          print(f'variant={variant}')
          print(f'input_sha256={before}')
          print(f'output_sha256={after}')
          out = Path(f'/tmp/fa394/{variant}/source')
          (out / 'source-sha256.txt').write_text(after + '\n')
          (out / f'Mock2_FunctionalAnalysis-{variant}.lean').write_bytes(p.read_bytes())
          PY

      - name: Compile full candidate
        id: compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.{olean,ilean}
          lake env lean -DmaxErrors=250 PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "/tmp/fa394/${VARIANT}/logs/compile.log" 2>&1
          rc=$?
          set -e
          grep -n 'error:' "/tmp/fa394/${VARIANT}/logs/compile.log" > "/tmp/fa394/${VARIANT}/logs/errors.txt" || true
          grep -n 'warning:' "/tmp/fa394/${VARIANT}/logs/compile.log" > "/tmp/fa394/${VARIANT}/logs/warnings.txt" || true
          first=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' "/tmp/fa394/${VARIANT}/logs/compile.log" | head -1)
          last=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' "/tmp/fa394/${VARIANT}/logs/compile.log" | tail -1)
          errors=$(wc -l < "/tmp/fa394/${VARIANT}/logs/errors.txt")
          warnings=$(wc -l < "/tmp/fa394/${VARIANT}/logs/warnings.txt")
          {
            echo "variant=${VARIANT}"
            echo "exit_code=${rc}"
            echo "error_header_count=${errors}"
            echo "warning_count=${warnings}"
            echo "first_error_line=${first:-none}"
            echo "last_error_line=${last:-none}"
          } | tee "/tmp/fa394/${VARIANT}/summary.txt"
          tail -1600 "/tmp/fa394/${VARIANT}/logs/compile.log" > "/tmp/fa394/${VARIANT}/logs/tail.txt" || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 394 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa394-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/fa394/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${EXIT_CODE:-}"
          exit "${EXIT_CODE}"
