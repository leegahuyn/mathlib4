name: PASS 400 resilient harvest FA Integrated Mock3 QYM loop

on:
  push:
    branches:
      - fix/fa400-resilient-harvest-loop-20260809
    paths:
      - '.start-pass400'
  workflow_dispatch:
    inputs:
      cycle:
        description: autonomous PASS 400 cycle
        required: false
        default: '1'

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: fa400-resilient-harvest-loop
  cancel-in-progress: false

jobs:
  repair-cycle:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 400 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa400-resilient-harvest-loop-20260809
          fetch-depth: 4800
          persist-credentials: true

      - name: Resolve cycle and model set
        id: cycle
        shell: bash
        env:
          DISPATCH_CYCLE: ${{ inputs.cycle }}
        run: |
          set -euo pipefail
          cycle="${DISPATCH_CYCLE:-}"
          if ! [[ "${cycle}" =~ ^[0-9]+$ ]] || test "${cycle}" -lt 1; then cycle=1; fi
          slot=$((cycle % 4))
          case "${slot}" in
            0) models='openai/gpt-5,openai/o4-mini,openai/gpt-4.1' ;;
            1) models='openai/gpt-4.1,openai/gpt-5,openai/gpt-4o' ;;
            2) models='openai/o4-mini,openai/gpt-4.1,openai/gpt-5' ;;
            3) models='openai/gpt-5,openai/gpt-4o,openai/gpt-4.1' ;;
          esac
          echo "cycle=${cycle}" >> "${GITHUB_OUTPUT}"
          echo "next_cycle=$((cycle + 1))" >> "${GITHUB_OUTPUT}"
          echo "models=${models}" >> "${GITHUB_OUTPUT}"

      - name: Install pinned Lean, ripgrep, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Harvest best source and run resilient strict-order repair
        id: agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA400_CYCLE: ${{ steps.cycle.outputs.cycle }}
          FA391_MODELS: ${{ steps.cycle.outputs.models }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/fa397-candidates
          python3 scripts/fa400_resilient_harvest_agent.py \
            --rounds 4 \
            --models-per-round 3 \
            > /tmp/fa400-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa400-console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          if test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS; then echo 'complete=true' >> "${GITHUB_OUTPUT}"; else echo 'complete=false' >> "${GITHUB_OUTPUT}"; fi
          exit 0

      - name: Record and commit source progress
        if: always()
        shell: bash
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
          AGENT_EXIT: ${{ steps.agent.outputs.exit_code }}
          COMPLETE: ${{ steps.agent.outputs.complete }}
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa400-loop
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          def load(p):
            p=Path(p); return json.loads(p.read_text()) if p.exists() else {}
          data={'cycle':int(os.environ['CYCLE']),'agent_exit_code':int(os.environ.get('AGENT_EXIT') or 1),'complete':os.environ.get('COMPLETE')=='true','harvest':load('build-logs/fa399-harvest-combinator/CURRENT.json'),'ordered_status':load('build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json')}
          Path('build-logs/fa400-loop/CURRENT.json').write_text(json.dumps(data,indent=2)+'\n')
          Path('build-logs/fa400-loop/CYCLE').write_text(str(data['cycle'])+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "${p}" && git add "${p}" || true; done
          for p in build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json build-logs/fa391-targeted/AUTHORITATIVE_STATUS.txt build-logs/fa391-targeted/state.json build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS build-logs/fa399-harvest-combinator/CURRENT.json build-logs/fa400-loop/CURRENT.json build-logs/fa400-loop/CYCLE; do test -e "${p}" && git add "${p}" || true; done
          if ! git diff --cached --quiet; then
            if test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS; then msg="fix: obtain PASS 400 cycle ${{ steps.cycle.outputs.cycle }} priority 2x PASS"; else msg="fix: preserve PASS 400 cycle ${{ steps.cycle.outputs.cycle }} frontier"; fi
            git commit -m "${msg}"
            git push origin HEAD:fix/fa400-resilient-harvest-loop-20260809
          fi

      - name: Upload complete cycle diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa400-cycle-${{ steps.cycle.outputs.cycle }}-${{ github.sha }}
          path: |
            /tmp/fa400-console.log
            /tmp/fa397-candidates
            build-logs/fa399-harvest-combinator
            build-logs/fa400-loop
            build-logs/fa391-targeted
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Dispatch next PASS 400 cycle when incomplete
        if: always() && steps.agent.outputs.complete != 'true' && fromJSON(steps.cycle.outputs.cycle) < 50
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NEXT_CYCLE: ${{ steps.cycle.outputs.next_cycle }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,os,urllib.request
          url=f"https://api.github.com/repos/{os.environ['GITHUB_REPOSITORY']}/actions/workflows/fa400-resilient-harvest-loop.yml/dispatches"
          req=urllib.request.Request(url,data=json.dumps({'ref':'fix/fa400-resilient-harvest-loop-20260809','inputs':{'cycle':os.environ['NEXT_CYCLE']}}).encode(),method='POST',headers={'Authorization':f"Bearer {os.environ['GH_TOKEN']}",'Accept':'application/vnd.github+json','X-GitHub-Api-Version':'2022-11-28','Content-Type':'application/json'})
          with urllib.request.urlopen(req,timeout=60) as response: assert response.status==204,response.status
          PY

      - name: Enforce final PASS 400 state
        if: always()
        shell: bash
        env:
          COMPLETE: ${{ steps.agent.outputs.complete }}
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          if test "${COMPLETE:-false}" = true; then test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS; exit 0; fi
          echo "PASS 400 cycle ${CYCLE} incomplete; continuation dispatched" >&2
          exit 1
