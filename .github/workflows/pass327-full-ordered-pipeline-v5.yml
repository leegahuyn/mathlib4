name: PASS 327 complete ordered pipeline v5

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'scripts/ci_pass327_full_order_v3.sh'
      - 'scripts/ci_pass327_full_order_v5.sh'
      - 'scripts/ci_pass327_fa_qym_recovery.sh'
      - 'scripts/pass327_lean_repair_agent.py'
      - 'scripts/post_priority_lean_repair_agent.py'
      - 'scripts/final_dependency_repair_agent.py'
      - 'scripts/primality_final_local_gate.sh'
      - 'scripts/primality_final_local_gate_v2.sh'
      - 'scripts/generate_spt5_whole_file_audit.py'
      - 'scripts/install_primality_official_ci.py'
      - 'build-logs/pass327-agent-state.json'
      - 'build-logs/pass327-targets-pass.json'
      - 'build-logs/post-priority-agent-state.json'
      - 'build-logs/mock1-family-pass.json'
      - 'build-logs/final-dependency-agent-state.json'
      - 'build-logs/final-dependency-repair-pass.json'
      - 'build-logs/final-local-gate-pass.json'
      - '.github/workflows/pass327-full-ordered-pipeline-v5.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: pass327-complete-ordered-pipeline-v5
  cancel-in-progress: false

jobs:
  ordered-repair-and-finalization:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR9 pipeline head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 160
          persist-credentials: true

      - name: Validate the ordered pipeline scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_pass327_full_order_v3.sh
          bash -n scripts/ci_pass327_full_order_v5.sh
          bash -n scripts/ci_pass327_fa_qym_recovery.sh
          bash -n scripts/primality_final_local_gate.sh
          bash -n scripts/primality_final_local_gate_v2.sh
          python3 -m py_compile \
            scripts/pass327_lean_repair_agent.py \
            scripts/post_priority_lean_repair_agent.py \
            scripts/final_dependency_repair_agent.py \
            scripts/generate_spt5_whole_file_audit.py \
            scripts/install_primality_official_ci.py

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Execute the strictly ordered PASS 327 pipeline
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_pass327_full_order_v5.sh

      - name: Upload complete ordered pipeline evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass327-complete-ordered-v5-${{ github.sha }}
          path: |
            /tmp/pass327-full-order-v3
            /tmp/pass327-repair-agent
            /tmp/pass327-fa-qym-recovery
            /tmp/primality-final-local-gate
          if-no-files-found: warn
          retention-days: 30
