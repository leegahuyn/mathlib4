name: GPT QYM GB10 R2 API probe

on:
  push:
    branches:
      - gpt/qym-gb57-global-batch-round2-20260820
    paths:
      - .github/workflows/gpt-qym-gb10-r2-api-probe.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qym-gb10-api
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > /tmp/qym-gb10-api/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >> /tmp/qym-gb10-api/toolchain.log 2>&1
          lake exe cache get >> /tmp/qym-gb10-api/cache.log 2>&1
      - name: Compile exact API examples
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/qym-gb10-api/Probe.lean <<'LEAN'
          import Mathlib

          open Set Topology Manifold
          open scoped ComplexConjugate ENNReal InnerProduct

          #check OpenPartialHomeomorph.extend_target
          #check Complex.ofReal_pow
          #check Complex.ofReal_mul
          #check Complex.ofReal_add
          #check Complex.ofReal_re

          universe u
          variable {E : Type u} [NormedAddCommGroup E] [InnerProductSpace ℂ E]

          example (u : E) : ((↑‖u‖ : ℂ) ^ 2).re = 0 ↔ u = 0 := by
            rw [← Complex.ofReal_pow, Complex.ofReal_re]
            rw [sq_eq_zero_iff, norm_eq_zero]

          example (a b : ℝ) :
              RCLike.re ((a : ℂ) ^ 2 + (((1 : ℝ) / 4 : ℝ) : ℂ) * (b : ℂ) ^ 2) =
                a ^ 2 + (1 / 4 : ℝ) * b ^ 2 := by
            rw [← Complex.ofReal_pow, ← Complex.ofReal_pow,
              ← Complex.ofReal_mul, ← Complex.ofReal_add, Complex.ofReal_re]
          LEAN
          set +e
          lake env lean /tmp/qym-gb10-api/Probe.lean > /tmp/qym-gb10-api/probe.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/qym-gb10-api/exit.txt
          cat /tmp/qym-gb10-api/probe.log
      - name: Persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest=.github/qym-probes/GB10_R2_API
          rm -rf "$dest" && mkdir -p "$dest"
          cp /tmp/qym-gb10-api/Probe.lean "$dest/"
          cp /tmp/qym-gb10-api/probe.log "$dest/"
          cp /tmp/qym-gb10-api/exit.txt "$dest/"
          cat > "$dest/STATUS.json" <<JSON
          {"run_id":${GITHUB_RUN_ID},"trigger_sha":"${GITHUB_SHA}","exit":$(cat /tmp/qym-gb10-api/exit.txt)}
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git commit -m "QYM GB10 R2: persist API probe ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt/qym-gb57-global-batch-round2-20260820
            if git rebase origin/gpt/qym-gb57-global-batch-round2-20260820 && \
               git push origin HEAD:gpt/qym-gb57-global-batch-round2-20260820; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
