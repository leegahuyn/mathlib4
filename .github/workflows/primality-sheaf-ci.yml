name: Mock2 V21 validation

on:
  push:
    branches: [chatgpt/mock2-v20-validation]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  mock2-v21:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Reconstruct exact V20 and build V21
        shell: bash
        run: |
          set -euo pipefail
          target=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          base64 -d ci/mock2-v19/base_00 | gzip -d > /tmp/v18_from_github.patch
          git apply /tmp/v18_from_github.patch
          cp "$target" /tmp/mock2-v18.lean
          git apply ci/mock2-v19/v18_to_v19.patch
          cp "$target" /tmp/mock2-v19.lean
          git apply ci/mock2-v20/v19_to_v20.patch
          cp "$target" /tmp/mock2-v20.lean
          echo "V20 SHA: $(sha256sum /tmp/mock2-v20.lean | cut -d' ' -f1)"
          test "$(sha256sum /tmp/mock2-v20.lean | cut -d' ' -f1)" = "4be644826b8a0e87cb7438b9a8552539e5a02720f1b216d854540b643574dbb0"
          python3 ci/mock2-v21/build_v21.py \
            /tmp/mock2-v18.lean /tmp/mock2-v19.lean /tmp/mock2-v20.lean \
            ci/mock2-v21/swaps.tsv.gz.b64 "$target"
          git apply ci/mock2-v21/manual_root.patch
          echo "V21 SHA: $(sha256sum "$target" | cut -d' ' -f1)"
          test "$(sha256sum "$target" | cut -d' ' -f1)" = "a7d80033f25df5faa76f1ba60d9e49aef517de44e736608f9d160a9c7e15a4be"

      - name: Direct Lean check and retain log
        id: leancheck
        shell: bash
        run: |
          set +e
          target=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          lake env lean -DmaxErrors=1000000 "$target" > /tmp/mock2-v21-direct.log 2>&1
          code=$?
          mkdir -p ci/mock2-v21/results
          cp /tmp/mock2-v21-direct.log ci/mock2-v21/results/direct.log
          errors=$(grep -cE '^PrimalitySheafVerification/Mock2_FunctionalAnalysis\.lean:[0-9]+:[0-9]+: error' /tmp/mock2-v21-direct.log || true)
          warnings=$(grep -cE '^PrimalitySheafVerification/Mock2_FunctionalAnalysis\.lean:[0-9]+:[0-9]+: warning' /tmp/mock2-v21-direct.log || true)
          {
            echo "exit_code=$code"
            echo "errors=$errors"
            echo "warnings=$warnings"
            echo "v21_sha256=$(sha256sum "$target" | cut -d' ' -f1)"
          } > ci/mock2-v21/results/summary.txt
          echo "lean_exit=$code" >> "$GITHUB_OUTPUT"
          cat ci/mock2-v21/results/summary.txt
          exit 0

      - name: Commit validation log
        shell: bash
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add ci/mock2-v21/results/direct.log ci/mock2-v21/results/summary.txt
          git commit -m "Record Mock2 V21 direct Lean log [skip validation]" || true
          git push

      - name: Set validation conclusion
        shell: bash
        run: exit "${{ steps.leancheck.outputs.lean_exit }}"
