name: Mock2 V20 validation

on:
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  mock2-v20:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@v7
      - uses: leanprover/lean-action@v1
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Reconstruct V20 candidate
        shell: bash
        run: |
          set -euo pipefail
          base64 -d ci/mock2-v19/base_00 | gzip -d > /tmp/v18_from_github.patch
          git apply /tmp/v18_from_github.patch
          git apply ci/mock2-v19/v18_to_v19.patch
          git apply ci/mock2-v20/v19_to_v20.patch
          sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      - name: Direct Lean check
        shell: bash
        run: |
          set -o pipefail
          lake env lean -DmaxErrors=1000000 PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean 2>&1 | tee mock2-v20-direct.log
      - name: Upload direct log
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mock2-v20-direct-log
          path: mock2-v20-direct.log
