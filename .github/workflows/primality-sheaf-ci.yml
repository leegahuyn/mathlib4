name: PrimalitySheafVerification CI

on:
  push:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/primality-sheaf-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - '.github/workflows/primality-sheaf-ci.yml'
  workflow_dispatch:

concurrency:
  group: primality-sheaf-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check PrimalitySheafVerification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Lean and fetch Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Check stable Lean files
        shell: bash
        run: |
          set -euo pipefail

          strict_files=(
            "PrimalitySheafVerification/Spt1.lean"
            "PrimalitySheafVerification/Spt2.lean"
            "PrimalitySheafVerification/Spt3.lean"
            "PrimalitySheafVerification/Spt4.lean"
            "PrimalitySheafVerification/Spt5.lean"
          )

          for file in "${strict_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required stable file is missing"
              exit 1
            fi

            echo "::group::lake env lean $file"
            lake env lean "$file"
            echo "::endgroup::"
          done

      - name: Advisory check for in-progress files
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail

          advisory_files=(
            "PrimalitySheafVerification/Spt6.lean"
            "PrimalitySheafVerification/Spt7.lean"
            "PrimalitySheafVerification/Verification.lean"
            "PrimalitySheafVerification/Spt2_AdditionalFormalization.lean"
            "PrimalitySheafVerification/Spt2_BypassCertificate.lean"
            "PrimalitySheafVerification/Spt2_CompletionLayer.lean"
            "PrimalitySheafVerification/Spt2_GeometricWorkarounds.lean"
            "PrimalitySheafVerification/Spt2_Master_Integrated.lean"
          )

          failures=0

          for file in "${advisory_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "::group::lake env lean $file"
              if lake env lean "$file"; then
                echo "OK: $file"
              else
                echo "::warning file=$file::Advisory Lean check failed; this file is treated as in-progress"
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
            else
              echo "::notice file=$file::Advisory file is not present; skipping"
            fi
          done

          if [[ "$failures" -gt 0 ]]; then
            echo "::warning::$failures advisory file(s) failed. Stable CI still passed."
          fi

  focused-advanced-pass316:
    name: Focused Mock2 Advanced pass 316 candidate
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_CANDIDATE_BLOB: b71fddf282b107ce14924609c84a97fb240737eb
      EXPECTED_CANDIDATE_SHA256: e59496026992858e176443990940305db05300e211eb2b09962ec540808af2d4
      LOGDIR: /tmp/focused-advanced-pass316

    steps:
      - name: Clone exact PR head without source mutation
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          test "$(git hash-object "${TARGET}")" = "${EXPECTED_START_BLOB}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' \
            "source_sha=${SOURCE_SHA}" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_start_blob=$(git hash-object "${TARGET}")" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${LOGDIR}/snapshot.txt"

      - name: Reproduce exact v61 through v68 candidate
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
            repair_mock2_advanced_v68.py
          )
          for script in "${scripts[@]}"; do
            echo "===== scripts/${script} ====="
            python3 "scripts/${script}"
          done 2>&1 | tee "${LOGDIR}/repair-application.log"

          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)

          test "$(git diff --name-only)" = "${TARGET}"
          git diff --check
          actual_blob="$(git hash-object "${TARGET}")"
          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          test "${actual_blob}" = "${EXPECTED_CANDIDATE_BLOB}"
          test "${actual_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          printf '%s\n' \
            "advanced_candidate_blob=${actual_blob}" \
            "advanced_candidate_sha256=${actual_sha}" \
            "advanced_candidate_lines=$(wc -l < "${TARGET}")" \
            | tee -a "${LOGDIR}/snapshot.txt"

      - name: Static forbidden-token and global-axiom audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          files = [
              Path("PrimalitySheafVerification/Mock2.lean"),
              Path("PrimalitySheafVerification/Mock2_Advanced.lean"),
          ]

          def strip(src: str) -> str:
              out, i, depth, string, escaped = [], 0, 0, False, False
              while i < len(src):
                  if depth:
                      if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                      elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                      else: out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif string:
                      ch = src[i]; out.append("\n" if ch == "\n" else " ")
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == '"': string = False
                      i += 1
                  elif src.startswith("/-", i): depth = 1; out.extend("  "); i += 2
                  elif src.startswith("--", i):
                      while i < len(src) and src[i] != "\n": out.append(" "); i += 1
                  elif src[i] == '"': string = True; out.append(" "); i += 1
                  else: out.append(src[i]); i += 1
              if depth or string: raise SystemExit("unterminated comment or string")
              return "".join(out)

          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_global_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
              "placeholder": r"\bplaceholder\b",
              "unfinished_TODO_FIXME": r"\b(?:TODO|FIXME)\b",
          }
          bad = False
          for path in files:
              code = strip(path.read_text(encoding="utf-8"))
              print(f"[{path}]")
              for name, pattern in checks.items():
                  matches = list(re.finditer(pattern, code))
                  print(f"{name}: {len(matches)}")
                  if matches:
                      bad = True
                      for match in matches[:20]:
                          line = code.count("\n", 0, match.start()) + 1
                          print(f"  line {line}: {match.group(0)!r}")
          if bad:
              raise SystemExit("forbidden executable token or global axiom detected")
          PY

      - name: Install exact Lean and fetch Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Compile Mock2 regression and Advanced candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}"
          echo 'module,pass,exit_code,error_count,warning_count' > "${LOGDIR}/compile-summary.csv"

          compile_module() {
            local module="$1" pass="$2"
            local log="${LOGDIR}/${module}-pass${pass}.log"
            rm -f "${outdir}/${module}.olean" "${outdir}/${module}.ilean" \
              "${outdir}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${outdir}/${module}.olean" -i "${outdir}/${module}.ilean" \
              >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              >> "${LOGDIR}/compile-summary.csv"
            echo "${code}" > "${LOGDIR}/${module}-exit-pass${pass}.txt"
            if [[ "${code}" -ne 0 ]]; then
              echo "first_errors:"
              grep -n 'error:' "${log}" | head -10 || true
              echo "last_error:"
              grep -n 'error:' "${log}" | tail -1 || true
              echo "total_errors=${errors}"
              grep -in 'maximum number of errors' "${log}" || true
              tail -240 "${log}" || true
              exit "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${outdir}/${module}.olean"
            test -s "${outdir}/${module}.ilean"
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" "${log}"
          }

          for pass in 1 2; do
            compile_module Mock2 "${pass}"
            compile_module Mock2_Advanced "${pass}"
          done

          git diff --check
          test "$(git diff --name-only)" = "${TARGET}"
          sha256sum "${MOCK2}" "${TARGET}" \
            "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
            "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean" \
            | tee "${LOGDIR}/provenance-sha256.txt"
