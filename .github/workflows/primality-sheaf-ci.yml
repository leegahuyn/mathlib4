name: PrimalitySheafVerification CI

on:
  push:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/apply_*_pass_repairs.py'
      - 'scripts/ci_mock2_advanced_pass316_v2.sh'
      - '.github/workflows/primality-sheaf-ci.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'lakefile.lean'
      - 'lake-manifest.json'
      - 'lean-toolchain'
      - 'scripts/apply_*_pass_repairs.py'
      - 'scripts/ci_mock2_advanced_pass316_v2.sh'
      - '.github/workflows/primality-sheaf-ci.yml'
  workflow_dispatch:

concurrency:
  group: primality-sheaf-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    name: Check PrimalitySheafVerification
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262

      - name: Install Lean and fetch Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Check stable Lean files
        shell: bash
        run: |
          set -euo pipefail
          strict_files=(
            "PrimalitySheafVerification/Spt1.lean"
            "PrimalitySheafVerification/Spt2.lean"
            "PrimalitySheafVerification/Spt3.lean"
            "PrimalitySheafVerification/Spt4.lean"
            "PrimalitySheafVerification/Spt5.lean"
          )
          for file in "${strict_files[@]}"; do
            if [[ ! -f "$file" ]]; then
              echo "::error file=$file::Required stable file is missing"
              exit 1
            fi
            echo "::group::lake env lean $file"
            lake env lean "$file"
            echo "::endgroup::"
          done

      - name: Advisory check for in-progress files
        shell: bash
        continue-on-error: true
        run: |
          set -uo pipefail
          advisory_files=(
            "PrimalitySheafVerification/Spt6.lean"
            "PrimalitySheafVerification/Spt7.lean"
            "PrimalitySheafVerification/Verification.lean"
            "PrimalitySheafVerification/Spt2_AdditionalFormalization.lean"
            "PrimalitySheafVerification/Spt2_BypassCertificate.lean"
            "PrimalitySheafVerification/Spt2_CompletionLayer.lean"
            "PrimalitySheafVerification/Spt2_GeometricWorkarounds.lean"
            "PrimalitySheafVerification/Spt2_Master_Integrated.lean"
          )
          failures=0
          for file in "${advisory_files[@]}"; do
            if [[ -f "$file" ]]; then
              echo "::group::lake env lean $file"
              if lake env lean "$file"; then
                echo "OK: $file"
              else
                echo "::warning file=$file::Advisory Lean check failed; this file is treated as in-progress"
                failures=$((failures + 1))
              fi
              echo "::endgroup::"
            else
              echo "::notice file=$file::Advisory file is not present; skipping"
            fi
          done
          if [[ "$failures" -gt 0 ]]; then
            echo "::warning::$failures advisory file(s) failed. Stable CI still passed."
          fi

  focused-advanced-pass316:
    name: Focused Mock2 Advanced pass 316
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    permissions:
      contents: write
      issues: write
      pull-requests: write
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      SOURCE_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      PR_NUMBER: ${{ github.event.pull_request.number || 7 }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1

      - name: Install exact Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Verify, materialize, or certify checked-in Advanced source
        shell: bash
        run: bash scripts/ci_mock2_advanced_pass316_v2.sh

      - name: Upload focused Advanced verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: focused-advanced-pass316-v2-${{ env.SOURCE_SHA }}
          path: /tmp/focused-advanced-pass316-v2
          if-no-files-found: warn
          retention-days: 30
