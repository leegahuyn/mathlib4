name: Restore PASS376 FA champion and verify 31725 frontier

on:
  push:
    branches:
      - ops/restore-pass376-fa-champion-20260809
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ARTIFACT_ID: '9024606745'
  EXPECTED_FA_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  PASS376_HEAD: '71227bd1ba88c99f9a535df044fd37041bcf2304'
  REQUIRED_FIRST_ERROR: '31725'
  CHAMPION_BRANCH: 'champion/fa-pass376-31725-07f6efd-20260809'
  WORK_BRANCH: 'fix/fa411-from-pass376-champion-20260809'

jobs:
  restore-and-reproduce:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout controller branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/restore-pass376-fa-champion-20260809
          fetch-depth: 1600
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download PASS376 artifact and verify exact FA source SHA
        id: restore
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pass376-artifact /tmp/pass376.zip
          mkdir -p /tmp/pass376-artifact
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/pass376.zip
          unzip -q /tmp/pass376.zip -d /tmp/pass376-artifact

          mapfile -d '' candidates < <(
            find /tmp/pass376-artifact -type f \
              -name 'Mock2_FunctionalAnalysis.lean' -print0
          )
          if test "${#candidates[@]}" -ne 1; then
            printf 'expected exactly one FA source; found %s\n' "${#candidates[@]}" >&2
            find /tmp/pass376-artifact -maxdepth 5 -type f -print >&2
            exit 20
          fi

          candidate="${candidates[0]}"
          actual=$(sha256sum "$candidate" | awk '{print $1}')
          printf 'artifact_id=%s\n' "$ARTIFACT_ID"
          printf 'candidate=%s\n' "$candidate"
          printf 'actual_sha256=%s\n' "$actual"
          printf 'expected_sha256=%s\n' "$EXPECTED_FA_SHA256"
          test "$actual" = "$EXPECTED_FA_SHA256"

          cp "$candidate" /tmp/Mock2_FunctionalAnalysis.champion.lean
          test "$(wc -l < /tmp/Mock2_FunctionalAnalysis.champion.lean)" -ge "$REQUIRED_FIRST_ERROR"
          echo "source_path=/tmp/Mock2_FunctionalAnalysis.champion.lean" >> "$GITHUB_OUTPUT"
          echo "source_sha256=$actual" >> "$GITHUB_OUTPUT"

      - name: Create checked-in immutable champion branch
        id: champion
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$CHAMPION_BRANCH" >/dev/null 2>&1; then
            echo "refusing to overwrite existing immutable champion branch: $CHAMPION_BRANCH" >&2
            exit 21
          fi

          git fetch --no-tags origin "$PASS376_HEAD"
          git switch --detach "$PASS376_HEAD"
          git switch -c "$CHAMPION_BRANCH"
          cp /tmp/Mock2_FunctionalAnalysis.champion.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

          mkdir -p champion-records/fa-pass376-31725
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json

          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          record = {
              'status': 'immutable_checked_in_champion',
              'authority': 'direct_Lean_compile_metric_not_PASS_number',
              'source_path': str(src),
              'source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'expected_source_sha256': '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4',
              'origin_run_id': 31267332510,
              'origin_artifact_id': 9024606745,
              'origin_head_sha': '71227bd1ba88c99f9a535df044fd37041bcf2304',
              'claimed_frontier_first_error': 31725,
              'promotion_policy': {
                  'promote_if_exit_zero': True,
                  'otherwise_require_first_error_strictly_greater_than_current_champion': True,
                  'regressions_are_evidence_only': True,
              },
          }
          if record['source_sha256'] != record['expected_source_sha256']:
              raise SystemExit('checked-in source SHA mismatch')
          Path('champion-records/fa-pass376-31725/CHAMPION.json').write_text(
              json.dumps(record, indent=2) + '\n', encoding='utf-8')
          Path('champion-records/fa-pass376-31725/README.md').write_text(
              '# Mock2 FunctionalAnalysis champion\n\n'
              'This branch records the PASS376 artifact source with exact SHA256 '
              '`07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4`.\n\n'
              'It is immutable by workflow policy. Repair candidates must be developed on '
              'separate challenger branches and may be promoted only after direct Lean compilation '\n'
              'returns exit 0, or after the first error line strictly exceeds the current champion.\n',
              encoding='utf-8')
          PY

          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            champion-records/fa-pass376-31725
          git commit -m 'chore: check in PASS376 FA 31725 champion [skip ci]'
          champion_sha=$(git rev-parse HEAD)
          git push origin "HEAD:refs/heads/${CHAMPION_BRANCH}"
          echo "champion_sha=$champion_sha" >> "$GITHUB_OUTPUT"

      - name: Directly compile prerequisites and restored FA without repair
        id: reproduce
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa-pass376-champion-reproduction
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          if test "$actual" != "$EXPECTED_FA_SHA256"; then
            printf 'checked-in FA hash changed before compile: %s\n' "$actual" > "$d/HASH_FAILURE.txt"
            echo 'verified=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" \
              > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return "$rc"
          }

          compile_one Mock2 400
          rc_m2=$?
          compile_one Mock2_Advanced 400
          rc_m2a=$?

          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 800
            rc_fa=$?
          else
            printf 'prerequisite failure; FA not compiled\n' \
              > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          d = Path('build-logs/fa-pass376-champion-reproduction')
          pattern = re.compile(
              r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+'
              r'(?:error(?:\([^)]*\))?:|error:)')
          log = (d / 'Mock2_FunctionalAnalysis.log').read_text(
              encoding='utf-8', errors='replace')
          matches = list(pattern.finditer(log))
          first_line = int(matches[0].group(1)) if matches else 0
          first_col = int(matches[0].group(2)) if matches else 0
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rc_m2 = int(os.environ['RC_M2'])
          rc_m2a = int(os.environ['RC_M2A'])
          rc_fa = int(os.environ['RC_FA'])
          sha = hashlib.sha256(src.read_bytes()).hexdigest()
          frontier_ok = rc_fa == 0 or first_line >= 31725
          verified = (
              sha == '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
              and rc_m2 == 0
              and rc_m2a == 0
              and frontier_ok
          )
          status = {
              'verified': verified,
              'source_sha256': sha,
              'Mock2_exit': rc_m2,
              'Mock2_Advanced_exit': rc_m2a,
              'Mock2_FunctionalAnalysis_exit': rc_fa,
              'FA_error_count_captured': len(matches),
              'FA_first_error_line': first_line,
              'FA_first_error_col': first_col,
              'required_first_error_line': 31725,
              'frontier_reproduced_or_passed': frontier_ok,
              'repairs_applied_before_reproduction': 0,
          }
          (d / 'CURRENT.json').write_text(
              json.dumps(status, indent=2) + '\n', encoding='utf-8')
          (d / 'CURRENT.txt').write_text(
              '\n'.join(f'{k}={v}' for k, v in status.items()) + '\n',
              encoding='utf-8')
          print(json.dumps(status, indent=2))
          Path(d / ('REPRODUCED_31725_OR_BETTER' if verified else 'REPRODUCTION_FAILED')).touch()
          Path('/tmp/reproduction_verified').write_text('0' if verified else '1')
          PY

          verified=$(cat /tmp/reproduction_verified)
          echo "verified=$verified" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create repair working branch only after champion reproduction
        if: steps.reproduce.outputs.verified == '0'
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$WORK_BRANCH" >/dev/null 2>&1; then
            echo "refusing to overwrite existing work branch: $WORK_BRANCH" >&2
            exit 22
          fi
          git switch -c "$WORK_BRANCH"
          mkdir -p champion-records/fa-pass376-31725
          cat > champion-records/fa-pass376-31725/PROMOTION_POLICY.md <<'EOF'
          # Challenger promotion policy

          Current source champion SHA256:
          `07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4`

          Current direct-compile frontier: first error line 31725 or better.

          A challenger may replace this baseline only when direct Lean compilation:

          1. returns exit code 0; or
          2. returns a nonzero exit code but its first error line is strictly greater than 31725.

          Regressions are retained only as evidence. They must never be committed as the source baseline.
          EOF
          git add build-logs/fa-pass376-champion-reproduction \
            champion-records/fa-pass376-31725/PROMOTION_POLICY.md
          git commit -m 'ci: record verified PASS376 FA champion frontier [skip ci]'
          git push origin "HEAD:refs/heads/${WORK_BRANCH}"

      - name: Upload restoration and reproduction evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-fa-champion-reproduction-${{ github.run_id }}-${{ github.sha }}
          path: |
            /tmp/Mock2_FunctionalAnalysis.champion.lean
            build-logs/fa-pass376-champion-reproduction
            champion-records/fa-pass376-31725
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact source and 31725-or-better reproduction
        if: always()
        env:
          VERIFIED: ${{ steps.reproduce.outputs.verified }}
        shell: bash
        run: |
          test "${VERIFIED:-1}" = '0'
