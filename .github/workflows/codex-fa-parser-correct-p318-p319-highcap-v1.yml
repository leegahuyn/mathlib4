name: Codex FA parser-correct P3.18-P3.19 highcap v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-parser-correct-p318-p319-highcap-v1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

env:
  BASE_RUN_ID: "31559280347"
  BASE_JOB_ID: "93998125232"
  BASE_HEAD_SHA: "e306aa371d63546050c7851086311518bd626f0f"
  BASE_ARTIFACT_ID: "9127283858"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-after3226-3237-v1-e306aa371d63546050c7851086311518bd626f0f"
  BASE_ARTIFACT_DIGEST: "sha256:7e507688e5c247317fae9e80fd95e243c89d9de0ff07cf6bccbd0330e402a949"
  BASE_SOURCE_SHA256: "b5e7e4062a681a5683cb706eaa3ae3a0504d1b1a47db56e64bd21fdc95d4a1df"
  BASE_SOURCE_BYTES: "2722906"
  BASE_SOURCE_LINES: "60998"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 400
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested idx3236 candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-parser-correct-p318-p319-highcap-v1
          mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os
          out=Path('build-logs/codex-fa-parser-correct-p318-p319-highcap-v1')
          r=json.loads((out/'base-run.json').read_text())
          j=json.loads((out/'base-job.json').read_text())
          a=json.loads((out/'base-artifact.json').read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['head_sha']==os.environ['BASE_HEAD_SHA'] and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==int(os.environ['BASE_JOB_ID']) and j['run_id']==int(os.environ['BASE_RUN_ID']) and j['status']=='completed' and j['conclusion']=='failure'
          assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['name']==os.environ['BASE_ARTIFACT_NAME'] and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and a['expired'] is False
          metrics=list(Path('/tmp/base').rglob('METRIC.json'))
          assert len(metrics)==1
          m=json.loads(metrics[0].read_text())
          assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1
          assert m['all_required_lean_executed'] is True and m['FA_error_declaration_index']==3236
          assert m['source_sha256']==os.environ['BASE_SOURCE_SHA256']
          assert m['source_identity_locked_after_materialization'] is True
          assert m['public_declaration_headers_preserved'] is True and m['declaration_sequence_preserved'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' in p.as_posix():
              b=p.read_bytes()
              if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b:
                hits.append(p)
          assert len(hits)==1
          (out/'BASE_SOURCE.txt').write_text(str(hits[0].resolve())+'\n')
          PY

      - name: Apply audited parser correction only
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-parser-correct-p318-p319-highcap-v1
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib, json, os, re
          out=Path('build-logs/codex-fa-parser-correct-p318-p319-highcap-v1')
          src=Path((out/'BASE_SOURCE.txt').read_text().strip())
          s=src.read_text()
          old='DomAddAct.mk (-t) +ᵥ f - f'
          new='(DomAddAct.mk (-t) +ᵥ f) - f'
          assert s.count(old)==18, s.count(old)
          decl_re=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          ds=list(decl_re.finditer(s)); starts=[s.count('\n',0,m.start())+1 for m in ds]
          allowed={3236,3237,3292,3293,3296,3297,3299,3300}
          replacements=[]
          pos=0
          while True:
            k=s.find(old,pos)
            if k<0: break
            ln=s.count('\n',0,k)+1; idx=bisect_right(starts,ln)-1
            assert idx in allowed, (ln,idx,ds[idx].group('name'))
            replacements.append({'line':ln,'declaration_index':idx,'declaration_name':ds[idx].group('name')})
            pos=k+len(old)
          assert len(replacements)==18
          t=s.replace(old,new)
          assert old not in t and t.count(new)>=18
          ds2=list(decl_re.finditer(t))
          seq1=[m.group('name') for m in ds]; seq2=[m.group('name') for m in ds2]
          assert seq1==seq2
          target=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          target.write_text(t)
          b=target.read_bytes()
          audit={
            'schema':'fa-parser-correction-p318-p319-v1',
            'reason':'Lean precedence parses `DomAddAct.mk (-t) +ᵥ f - f` as `DomAddAct.mk (-t) +ᵥ (f - f)`; direct parser probes 31560177803 and 31560317338 establish the mismatch and the explicit-left correction.',
            'base_run_id':int(os.environ['BASE_RUN_ID']),
            'base_source_sha256':os.environ['BASE_SOURCE_SHA256'],
            'old_fragment':old,'new_fragment':new,
            'replacement_count':len(replacements),
            'affected_declaration_indices':sorted(set(x['declaration_index'] for x in replacements)),
            'affected_declarations':sorted(set(x['declaration_name'] for x in replacements)),
            'replacement_sites':replacements,
            'declaration_sequence_preserved':seq1==seq2,
            'new_assumptions_added':False,
            'conclusion_weakened':False,
            'parser_probe_failure_run':31560177803,
            'parser_probe_success_run':31560317338,
            'candidate_sha256':hashlib.sha256(b).hexdigest(),
            'candidate_bytes':len(b),
            'candidate_lines':len(t.splitlines()),
          }
          (out/'PARSER_CORRECTION_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps({'sha256':audit['candidate_sha256'],'bytes':audit['candidate_bytes'],'lines':audit['candidate_lines']},indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:
            f.write(f"CANDIDATE_SHA={audit['candidate_sha256']}\nCANDIDATE_BYTES={audit['candidate_bytes']}\nCANDIDATE_LINES={audit['candidate_lines']}\n")
          PY

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-parser-correct-p318-p319-highcap-v1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1

      - name: Direct full-source high-cap compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-parser-correct-p318-p319-highcap-v1
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 1
          one Mock2_Advanced 1
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"
          one Mock2_FunctionalAnalysis 128
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-parser-correct-p318-p319-highcap-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();b=p.read_bytes()
          ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds]
          er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:
              ln=int(m.group(1));j=bisect_right(starts,ln)-1
              es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}
          a=json.loads((out/'PARSER_CORRECTION_AUDIT.json').read_text())
          metric={'schema':'fa-parser-correct-p318-p319-highcap-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'declaration_sequence_preserved':a['declaration_sequence_preserved'],'parser_correction_count':a['replacement_count'],'parser_correction_affected_indices':a['affected_declaration_indices'],'new_assumptions_added':False,'conclusion_weakened':False,'maxErrors_cap':128}
          (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-parser-correct-p318-p319-highcap-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-parser-correct-p318-p319-highcap-v1
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
