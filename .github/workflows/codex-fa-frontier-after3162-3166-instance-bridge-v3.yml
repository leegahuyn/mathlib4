name: Codex FA frontier after3162 3166 instance bridge v3

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-after3162-3166-instance-bridge-v3.yml
      - scripts/fa_dynamic_cluster_3165_3166_instance_bridge_v3.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-fa-frontier-after3162-3166-instance-bridge-v3
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31553234087"
  BASE_JOB_ID: "93980221118"
  BASE_HEAD_SHA: "d5d864790b89dd46dd7a3a62c89ea6339cc93414"
  BASE_ARTIFACT_ID: "9125217456"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-3162-direction-v1-d5d864790b89dd46dd7a3a62c89ea6339cc93414"
  BASE_ARTIFACT_DIGEST: "sha256:8fe3603b34f324c9adc645ddaec7d08065b9b995a2b22cfd969e11c37bc8337c"
  BASE_SOURCE_SHA256: "1487389a6242c200f6b7282db997b0dce3b831cccf08c568c0c2fc2d527aa954"
  BASE_SOURCE_BYTES: "2719871"
  BASE_SOURCE_LINES: "60928"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 460
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested idx3165 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3
          mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3')
          r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); a=json.loads((out/'artifact.json').read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['head_sha']==os.environ['BASE_HEAD_SHA'] and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==int(os.environ['BASE_JOB_ID']) and j['run_id']==int(os.environ['BASE_RUN_ID']) and j['status']=='completed'
          assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['name']==os.environ['BASE_ARTIFACT_NAME'] and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and a['expired'] is False
          m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1 and m['all_required_lean_executed'] is True
          assert m['FA_error_declaration_index']==3165 and m['source_sha256']==os.environ['BASE_SOURCE_SHA256']
          assert m['source_identity_locked_after_materialization'] is True and m['public_declaration_headers_preserved'] is True and m['declaration_sequence_preserved'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: hits.append(p)
          assert len(hits)==1, len(hits)
          (out/'BASE_SOURCE.txt').write_text(str(hits[0].resolve())+'\n')
          PY

      - name: Apply strict idx3165-3166 instance bridge
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3
          python3 scripts/fa_dynamic_apply_staged_library_strict.py \
            --base-source "$(cat "$OUT/BASE_SOURCE.txt")" \
            --library scripts/fa_dynamic_cluster_3165_3166_instance_bridge_v3.json \
            --no-environment \
            --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --audit-out "$OUT/PREP.json"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3'); a=json.loads((out/'PREP.json').read_text())
          assert a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed']
          assert sorted(x['declaration_index'] for x in a.get('proof_replacements_applied',[])) == [3165,3166]
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes(); s=b.decode(); ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines())}
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write(f"CANDIDATE_SHA={ident['sha256']}\nCANDIDATE_BYTES={ident['bytes']}\nCANDIDATE_LINES={ident['lines']}\n")
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake exe cache get > "$OUT/cache.log" 2>&1

      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3
          one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"
          one Mock2_FunctionalAnalysis 64
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:
              ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); prep=json.loads((out/'PREP.json').read_text()); metric={'schema':'fa-frontier-after3162-3166-instance-bridge-v3','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':prep['public_declaration_headers_preserved'],'declaration_sequence_preserved':prep['declaration_sequence_preserved'],'maxErrors_cap':64}; (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-after3162-3166-instance-bridge-v3-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-after3162-3166-instance-bridge-v3
          retention-days: 30
          if-no-files-found: warn

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
