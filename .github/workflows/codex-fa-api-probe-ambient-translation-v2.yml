name: Codex FA v24 layered-coercion first-frontier fast check
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-ambient-translation-v2.yml
      - scripts/fa_v24_frontier_from_filtered.patch
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Materialize exact v22, apply filtered v23, then v24 frontier bridge
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v24-layered-first-frontier
          mkdir -p "$OUT" /tmp/v22
          ART=9165519294
          DIGEST=sha256:3c632d36677759dde1c86fd9cd7efc06a7a4eca981a7c8524b0d788e1f3e1c60
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" >/tmp/v22.zip
          test "sha256:$(sha256sum /tmp/v22.zip | awk '{print $1}')" = "$DIGEST"
          unzip -q /tmp/v22.zip -d /tmp/v22
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          sha='6b73cb7d68157c861830dbefd30ae7bb0ddcc68b911fc89b49802836752bc965'
          hits=[p for p in Path('/tmp/v22').rglob('Mock2_FunctionalAnalysis.lean') if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(p.read_bytes()).hexdigest()==sha]
          assert len(hits)==1,hits
          shutil.copy2(hits[0],Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'))
          PY
          python3 scripts/fa_v23_filtered_batch.py PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT"
          test "$(cat "$OUT/candidate.sha256")" = 931c8656a880307acc6f871f63a4c7751fdf6ccf4c57e02f5363ab7943a61fa4
          test "$(sha256sum scripts/fa_v24_frontier_from_filtered.patch | awk '{print $1}')" = bebc6cc76fcf669f6a10eea5f261ce5999e7090901e79b6435175e21f9c126f2
          patch -p1 --batch --forward < scripts/fa_v24_frontier_from_filtered.patch >"$OUT/v24-patch.stdout" 2>"$OUT/v24-patch.stderr"
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = 24127dcd7b1f0e70e132b195249dbd54dcc5c3750b44f349dbc1130161ca7570
          echo 24127dcd7b1f0e70e132b195249dbd54dcc5c3750b44f349dbc1130161ca7570 >"$OUT/v24-candidate.sha256"
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v24-layered-first-frontier
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct compile dependency chain maxErrors1
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          OUT=build-logs/codex-fa-v24-layered-first-frontier
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){
            local s="$1" o=.lake/build/lib/lean/PrimalitySheafVerification/$1.olean i=.lake/build/lib/lean/PrimalitySheafVerification/$1.ilean
            rm -f "$o" "$i"; :>"$OUT/$s.executed"; set +e
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1
            x=$?; set -e; echo "$x" >"$OUT/$s.exit"
          }
          one Mock2
          one Mock2_Advanced
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = 24127dcd7b1f0e70e132b195249dbd54dcc5c3750b44f349dbc1130161ca7570
          one Mock2_FunctionalAnalysis
      - name: Build first-frontier metric
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v24-layered-first-frontier
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-v24-layered-first-frontier'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          s=p.read_text(errors='replace'); b=p.read_bytes()
          dr=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          ds=list(dr.finditer(s)); starts=[s.count('\n',0,m.start())+1 for m in ds]
          er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); first={}
          log=out/'Mock2_FunctionalAnalysis.log'
          for raw in log.read_text(errors='replace').splitlines() if log.exists() else []:
            m=er.match(raw)
            if m:
              ln=int(m.group(1)); idx=bisect_right(starts,ln)-1
              first={'line':ln,'column':int(m.group(2)),'declaration':ds[idx].group('name') if idx>=0 else None,'declaration_index':idx if idx>=0 else None,'message':m.group(3).strip()}; break
          stems=['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis']; ex={x:int((out/f'{x}.exit').read_text()) if (out/f'{x}.exit').exists() else None for x in stems}
          metric={'schema':'fa-v24-layered-first-frontier','run_id':os.environ.get('GITHUB_RUN_ID'),'head_sha':os.environ.get('GITHUB_SHA'),'source_sha256':hashlib.sha256(b).hexdigest(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in stems),'FA_compile_max_errors':1,'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('column'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message')}
          (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n'); print(json.dumps(metric,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v24-layered-first-frontier-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-v24-layered-first-frontier
          retention-days: 30
      - name: Preserve actual FA exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-v24-layered-first-frontier/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-v24-layered-first-frontier/Mock2_FunctionalAnalysis.exit)"
