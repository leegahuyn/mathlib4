name: Codex FA after3327 3328 highcap v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-after3327-3328-highcap-v1.yml
      - scripts/fa_dynamic_cluster_3327_3328_eval_order_v4.json
  workflow_dispatch:
permissions: {actions: read, contents: read}
env:
  BASE_RUN_ID: "31568376320"
  BASE_JOB_ID: "94024885440"
  BASE_HEAD_SHA: "06058a2be79bc291f4843f8784f8edebe303e8d1"
  BASE_ARTIFACT_ID: "9130543599"
  BASE_ARTIFACT_NAME: "codex-fa-after3324-3328-fast1-v1-06058a2be79bc291f4843f8784f8edebe303e8d1"
  BASE_ARTIFACT_DIGEST: "sha256:aa88f696294726697110503af03b8d1a2ddc16f0d8c322c2a5b81eae891bd89e"
  BASE_SOURCE_SHA256: "16e58495b6dcc663207792c4a3c2820cb35429c913346db61219222ba73ee10d"
  BASE_SOURCE_BYTES: "2730349"
  BASE_SOURCE_LINES: "61174"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 600
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact direct-tested idx3327 source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-after3327-3328-highcap-v1; mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          out=Path('build-logs/codex-fa-after3327-3328-highcap-v1')
          r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); a=json.loads((out/'artifact.json').read_text()); m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['head_sha']==os.environ['BASE_HEAD_SHA'] and r['status']=='completed' and r['conclusion']=='failure'
          assert j['id']==int(os.environ['BASE_JOB_ID']) and j['run_id']==int(os.environ['BASE_RUN_ID']) and j['status']=='completed' and j['conclusion']=='failure'
          assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['name']==os.environ['BASE_ARTIFACT_NAME'] and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and not a['expired']
          assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1 and m['all_required_lean_executed'] is True
          assert m['FA_error_declaration_index']==3327 and m['source_sha256']==os.environ['BASE_SOURCE_SHA256'] and m['source_bytes']==int(os.environ['BASE_SOURCE_BYTES']) and m['source_lines']==int(os.environ['BASE_SOURCE_LINES']) and m['source_identity_locked_after_materialization'] is True and m['public_proposition_changes_explicitly_audited'] is True and m['declaration_sequence_preserved'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            b=p.read_bytes()
            if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']): hits.append(p)
          assert len(hits)==1
          shutil.copy2(hits[0],'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          (out/'INHERITED_ALLOWED_PROP_CHANGES.json').write_text(json.dumps(m['allowed_public_proposition_changes'],indent=2)+'\n')
          PY
      - name: Apply declaration-local eval-order fixes
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-after3327-3328-highcap-v1
          python3 scripts/fa_dynamic_apply_staged_library_decl_local_strict_v1.py \
            --base-source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --library scripts/fa_dynamic_cluster_3327_3328_eval_order_v4.json \
            --target /tmp/candidate.lean --audit-out "$OUT/EVAL_ORDER.json"
          cp /tmp/candidate.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-after3327-3328-highcap-v1'); a=json.loads((out/'EVAL_ORDER.json').read_text())
          assert a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a.get('strict_staged_header_hash_check',{}).get('passed',True)
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes(); ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(b.decode().splitlines())}; (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f"CANDIDATE_SHA={ident['sha256']}\n")
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-after3327-3328-highcap-v1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1
          lean --version >"$OUT/lean-version.txt"
          lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct full-source high-cap compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-after3327-3328-highcap-v1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3; one Mock2_Advanced 3; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis 256
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-after3327-3328-highcap-v1'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); b=p.read_bytes(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; rx=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=rx.match(raw)
            if m:
              ln=int(m.group(1)); i=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[i].group('name') if i>=0 else None,'declaration_index':i if i>=0 else None,'declaration_start_line':starts[i] if i>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; allowed=json.loads((out/'INHERITED_ALLOWED_PROP_CHANGES.json').read_text()); metric={'schema':'fa-after3327-3328-highcap-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'declaration_sequence_preserved':True,'public_proposition_changes_explicitly_audited':True,'allowed_public_proposition_changes':allowed,'inherited_semantic_base_run':int(os.environ['BASE_RUN_ID']),'maxErrors_cap':256}; (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0
      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3327-3328-highcap-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3327-3328-highcap-v1
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
