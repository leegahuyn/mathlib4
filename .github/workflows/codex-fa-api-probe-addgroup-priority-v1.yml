name: Codex FA API probe WithLp reconstruction
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addgroup-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Validate WithLp reconstruction bridges
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeWithLp.lean <<'LEAN'
          import Mathlib

          variable {A B C : Type*}

          example (x : WithLp 2 (A × B)) :
              WithLp.toLp 2 (WithLp.fst x, WithLp.snd x) = x := by
            rfl

          example (x : WithLp 2 (A × WithLp 2 (B × C))) :
              WithLp.toLp 2
                (WithLp.fst x,
                  WithLp.toLp 2 ((WithLp.snd x).fst, (WithLp.snd x).snd)) = x := by
            rfl

          variable {D : Type*} (f : ℕ → WithLp 2 (A × WithLp 2 (B × C)))

          example :
              (WithLp.toLp 2 ∘ fun j =>
                (WithLp.fst (f j),
                  WithLp.toLp 2 ((WithLp.snd (f j)).fst, (WithLp.snd (f j)).snd))) = f := by
            funext j
            rfl
          LEAN
          set +e
          lake env lean -DwarningAsError=false /tmp/ProbeWithLp.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-withlp-reconstruction-${{ github.sha }}
          path: |
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 7
