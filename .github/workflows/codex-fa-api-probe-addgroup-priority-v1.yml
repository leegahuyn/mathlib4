name: Codex FA API probe antiDual Hilbert APIs via registered path
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addgroup-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Inspect anti-dual norm and Hilbert transport APIs
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeAntiDualHilbert.lean <<'LEAN'
          import Mathlib
          open ComplexConjugate
          #check ContinuousLinearMap.opNorm_le_bound
          #check ContinuousLinearMap.le_opNorm
          #check inner_norm_le
          #check norm_inner_le
          #check innerSLFlip
          #check innerSLFlip_apply_apply
          #check innerSL_apply_norm
          #check LinearIsometry.ofNorm
          #check LinearIsometryEquiv.ofSurjective
          #check InnerProductSpace.ofCore
          #check InnerProductSpace.Core
          #check PreInnerProductSpace.Core
          #check StrongDual
          variable {E : Type*} [NormedAddCommGroup E] [InnerProductSpace ℂ E] [CompleteSpace E]
          #synth CompleteSpace (E →L⋆[ℂ] ℂ)
          #synth InnerProductSpace ℂ (StrongDual ℂ E)
          example (x : E) : ‖innerSLFlip ℂ x‖ = ‖x‖ := by
            apply le_antisymm
            · apply ContinuousLinearMap.opNorm_le_bound _ (norm_nonneg x)
              intro y
              rw [innerSLFlip_apply_apply]
              exact inner_norm_le _ _
            · by_cases hx : x = 0
              · simp [hx]
              · have h := (innerSLFlip ℂ x).le_opNorm x
                rw [innerSLFlip_apply_apply, norm_inner_self] at h
                have hxn : 0 < ‖x‖ := norm_pos_iff.mpr hx
                nlinarith [norm_nonneg (innerSLFlip ℂ x)]
          LEAN
          set +e
          lake env lean -DwarningAsError=false /tmp/ProbeAntiDualHilbert.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-antidual-norm-hilbert-${{ github.sha }}
          path: |
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 7
