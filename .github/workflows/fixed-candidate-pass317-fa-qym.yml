name: Fixed candidate pass 317 then FunctionalAnalysis and QYM

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/fixed-candidate-pass317-fa-qym.yml'
      - 'build-candidates/Mock2_Advanced-pass317.lean'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: fixed-candidate-pass317-fa-qym
  cancel-in-progress: true

jobs:
  verify-materialize-complete:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      CANDIDATE: build-candidates/Mock2_Advanced-pass317.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: /tmp/fixed-candidate-pass317
      ADV_RESULT: build-logs/priority-stage1-advanced-result.txt
      FA_RESULT: build-logs/priority-stage2-fa-result.txt
      QYM_RESULT: build-logs/priority-stage3-qym-result.txt

    steps:
      - name: Clone latest branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          mkdir -p "${OUTDIR}" "${LOGDIR}"
          test -s "${CANDIDATE}"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version | tee "${LOGDIR}/lean-version.txt"
          "${HOME}/.elan/bin/lake" exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Audit and compile the exact fixed Advanced candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          cp "${CANDIDATE}" "${ADVANCED}"
          git diff --check
          TARGET_SCAN="${ADVANCED}" python3 - <<'PY'
          from pathlib import Path
          import os,re
          p=Path(os.environ['TARGET_SCAN']);s=p.read_text(encoding='utf-8')
          out=[];i=0;depth=0;string=False;esc=False
          while i<len(s):
            if depth:
              if s.startswith('/-',i):depth+=1;out.extend('  ');i+=2
              elif s.startswith('-/',i):depth-=1;out.extend('  ');i+=2
              else:out.append('\n' if s[i]=='\n' else ' ');i+=1
            elif string:
              c=s[i];out.append('\n' if c=='\n' else ' ')
              if esc:esc=False
              elif c=='\\':esc=True
              elif c=='"':string=False
              i+=1
            elif s.startswith('/-',i):depth=1;out.extend('  ');i+=2
            elif s.startswith('--',i):
              while i<len(s) and s[i]!='\n':out.append(' ');i+=1
            elif s[i]=='"':string=True;out.append(' ');i+=1
            else:out.append(s[i]);i+=1
          if depth or string:raise SystemExit(1)
          code=''.join(out)
          for pat in [r'\bsorry\b',r'\badmit\b',r'(?m)^\s*axiom\b',r'\bunsafe\b',r'\bnative_decide\b',r'\bLean\.ofReduceBool\b']:
            if re.search(pat,code):raise SystemExit(1)
          PY

          echo 'module,pass,exit_code,error_count,warning_count' > "${LOGDIR}/advanced-summary.csv"
          compile() {
            local module="$1" pass="$2" log code errors warnings
            log="${LOGDIR}/${module}-${pass}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              | tee -a "${LOGDIR}/advanced-summary.csv"
            if [[ "${code}" -ne 0 || "${errors}" -ne 0 || ! -s "${OUTDIR}/${module}.olean" || ! -s "${OUTDIR}/${module}.ilean" ]]; then
              grep -n 'error:' "${log}" | head -100 || true
              grep -n 'error:' "${log}" | tail -1 || true
              tail -600 "${log}" || true
              return 1
            fi
            ! grep -Eqi "maximum number of errors|missing object file|declaration uses 'sorry'|sorryAx|PANIC|segmentation fault|stack overflow" "${log}"
          }
          for pass in 1 2; do
            compile Mock2 "pass${pass}"
            compile Mock2_Advanced "pass${pass}"
          done

      - name: Commit exact verified Advanced candidate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet -- "${ADVANCED}"; then
            git add "${ADVANCED}"
            test "$(git diff --cached --name-only)" = "${ADVANCED}"
            git commit -m 'fix: materialize exact Mock2 Advanced pass 317 candidate'
            for attempt in 1 2 3; do
              remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
              parent="$(git rev-parse HEAD^)"
              if [[ "${remote}" = "${parent}" ]]; then
                git push origin "HEAD:${BRANCH}"
                break
              fi
              git fetch --depth=50 origin "refs/heads/${BRANCH}"
              git rebase FETCH_HEAD
              if [[ "${attempt}" -eq 3 ]]; then git push origin "HEAD:${BRANCH}"; fi
            done
          fi

      - name: Fresh direct Advanced verification and PASS record
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          rm -rf "${OUTDIR}";mkdir -p "${OUTDIR}"
          echo 'module,pass,exit_code,error_count,warning_count' > /tmp/fixed-advanced-direct.csv
          for pass in 1 2; do
            for module in Mock2 Mock2_Advanced; do
              log="${LOGDIR}/direct-${module}-pass${pass}.log"
              rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" "${OUTDIR}/${module}.olean.private"
              lake env lean "PrimalitySheafVerification/${module}.lean" \
                -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
              errors="$(grep -c 'error:' "${log}" || true)"
              warnings="$(grep -c 'warning:' "${log}" || true)"
              printf '%s,pass%s,0,%s,%s\n' "${module}" "${pass}" "${errors}" "${warnings}" \
                | tee -a /tmp/fixed-advanced-direct.csv
              test "${errors}" -eq 0
              test -s "${OUTDIR}/${module}.olean"
              test -s "${OUTDIR}/${module}.ilean"
            done
          done
          {
            echo 'stage=Mock2_Advanced'
            echo 'status=PASS'
            echo "verified_source_head=$(git rev-parse HEAD)"
            echo "source_sha256=$(sha256sum "${ADVANCED}" | awk '{print $1}')"
            echo 'repair_frontier=317-fixed-candidate'
            echo 'runtime_repair_during_final_direct=0'
            cat /tmp/fixed-advanced-direct.csv
          } > /tmp/fixed-advanced-result.txt
          mkdir -p "$(dirname "${ADV_RESULT}")"
          cp /tmp/fixed-advanced-result.txt "${ADV_RESULT}"
          git add "${ADV_RESULT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record fixed-candidate Mock2 Advanced PASS'
            for attempt in 1 2 3; do
              remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
              parent="$(git rev-parse HEAD^)"
              if [[ "${remote}" = "${parent}" ]]; then
                git push origin "HEAD:${BRANCH}"
                break
              fi
              git fetch --depth=50 origin "refs/heads/${BRANCH}"
              git rebase FETCH_HEAD
              if [[ "${attempt}" -eq 3 ]]; then git push origin "HEAD:${BRANCH}"; fi
            done
          fi

      - name: Refresh and complete FunctionalAnalysis
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          rm -rf "${OUTDIR}";mkdir -p "${OUTDIR}"
          bash scripts/priority_stage2_fa.sh

      - name: Refresh and complete Integrated plus QYM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          rm -rf "${OUTDIR}";mkdir -p "${OUTDIR}"
          bash scripts/priority_stage3_qym.sh

      - name: Validate final PASS and post PR evidence
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          test -s "${QYM_RESULT}"
          grep -Fxq 'status=PASS' "${QYM_RESULT}"
          grep -Fxq 'runtime_repair_scripts=0' "${QYM_RESULT}"
          grep -Fxq 'Mock2_Advanced=PASS' "${QYM_RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis=PASS' "${QYM_RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' "${QYM_RESULT}"
          grep -Fxq 'QYM=PASS' "${QYM_RESULT}"
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," "${QYM_RESULT}"
            grep -Eq "^${module},pass2,0,0," "${QYM_RESULT}"
          done
          python3 - <<'PY' > /tmp/comment.json
          import json
          from pathlib import Path
          t=Path('build-logs/priority-stage3-qym-result.txt').read_text(encoding='utf-8')
          head=next(x.split('=',1)[1] for x in t.splitlines() if x.startswith('verified_source_head='))
          rows='\n'.join(x for x in t.splitlines() if x.startswith(('Mock2,pass','Mock2_Advanced,pass','Mock2_FunctionalAnalysis,pass','Mock2_FunctionalAnalysis_Integrated,pass','QYM,pass')))
          print(json.dumps({'body': f'''## Fixed Advanced pass 317 candidate → FA → QYM PASS

Verified source head: `{head}`

All priority modules passed two direct source compiles in dependency order. Runtime repair scripts during the final direct verification: `0`.

```text
{rows}
```
'''}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --data-binary @/tmp/comment.json
