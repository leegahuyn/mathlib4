name: FA426 monotone donor proof miner and ordered final gate

on:
  push:
    branches:
      - fix/fa426-monotone-donor-proof-miner-20260810
    paths:
      - scripts/fa426_monotone_donor_proof_miner.py
      - .github/workflows/fa426-monotone-donor-proof-miner.yml
      - build-logs/fa426-monotone-donor-proof-miner/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa426-monotone-donor-proof-miner
  cancel-in-progress: false

jobs:
  mine-verify-persist:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa426-monotone-donor-proof-miner-20260810
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FA426_MAX_CANDIDATES: '24'
      FA426_MAX_PROMOTIONS: '4'
      FA426_TIME_BUDGET_SECONDS: '17200'

    steps:
      - name: Checkout exact FA426 controller branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa426-monotone-donor-proof-miner-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa426-lean-version.txt
          lake --version | tee /tmp/fa426-lake-version.txt
          lake exe cache get | tee /tmp/fa426-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run monotone same-height donor proof mining
        id: miner
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa426_monotone_donor_proof_miner.py \
            > /tmp/fa426-console.log 2>&1
          script_rc=$?
          cat /tmp/fa426-console.log
          d=build-logs/fa426-monotone-donor-proof-miner
          cp /tmp/fa426-lean-version.txt "$d/lean-version.txt" 2>/dev/null || true
          cp /tmp/fa426-lake-version.txt "$d/lake-version.txt" 2>/dev/null || true
          cp /tmp/fa426-cache-get.log "$d/cache-get.log" 2>/dev/null || true
          cp /tmp/fa426-console.log "$d/console.log" 2>/dev/null || true

          if test -f "$d/CURRENT.json"; then
            persist=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('persist_source', False)).lower())")
            promoted=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion', False)).lower())")
            materialized=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('materialized_verified_baseline', False)).lower())")
            selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('source_sha256', ''))")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('exit_code', 999))")
            first_line=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('first_error_line', 0))")
            first_col=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('first_error_col', 0))")
            declaration=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected', {}).get('first_error_declaration', ''))")
          else
            persist=false
            promoted=false
            materialized=false
            selected_sha=''
            fa_exit=999
            first_line=0
            first_col=0
            declaration=''
          fi
          {
            echo "script_rc=$script_rc"
            echo "persist_source=$persist"
            echo "strict_promotion=$promoted"
            echo "materialized=$materialized"
            echo "selected_sha=$selected_sha"
            echo "fa_exit=$fa_exit"
            echo "first_line=$first_line"
            echo "first_col=$first_col"
            echo "declaration=$declaration"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist direct-verified source or evidence only
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          if ! test -f "$d/CURRENT.json"; then
            git add "$d" 2>/dev/null || true
            if ! git diff --cached --quiet; then
              git commit -m 'evidence: preserve FA426 infrastructure failure [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
            echo "source_committed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          persist=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('persist_source', False)).lower())")
          promoted=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion', False)).lower())")
          materialized=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('materialized_verified_baseline', False)).lower())")
          selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
          first_line=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")

          if test "$persist" = true; then
            actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
            test "$actual" = "$selected_sha"
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
            if test "$promoted" = true; then
              if test "$fa_exit" = 0; then metric=pass; else metric="first-${first_line}"; fi
              msg="fix: persist FA426 ${metric} direct-verified source ${selected_sha:0:12}"
            elif test "$materialized" = true; then
              msg="fix: materialize latest direct-verified FA baseline ${selected_sha:0:12}"
            else
              msg="fix: persist FA426 direct-verified source ${selected_sha:0:12}"
            fi
            source_committed=true
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d"
            msg='evidence: retain FA champion after FA426 no-improvement run [skip ci]'
            source_committed=false
          fi

          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          echo "source_committed=$source_committed" >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

          if test "$source_committed" = true; then
            head_sha=$(git rev-parse HEAD)
            if test "$fa_exit" = 0; then metric=pass; else metric="first-${first_line}"; fi
            immutable="champion/fa426-${metric}-${selected_sha:0:12}-${GITHUB_RUN_ID}"
            ref_json=$(python3 - <<PY
          import json
          print(json.dumps({'ref': 'refs/heads/${immutable}', 'sha': '${head_sha}'}))
          PY
          )
            if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
                --input - <<<"$ref_json" > "$d/immutable-branch-response.json" 2> "$d/immutable-branch-error.txt"; then
              printf '%s\n' "$immutable" > "$d/IMMUTABLE_CHAMPION_BRANCH.txt"
            else
              printf '%s\n' "$immutable" > "$d/IMMUTABLE_CHAMPION_BRANCH_REQUESTED.txt"
            fi
          fi

      - name: Verify checked-in source identity before final gates
        id: identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          if ! test -f "$d/CURRENT.json"; then
            echo "identity_ok=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          worktree_sha=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" > /tmp/fa426-checked-in.lean
          commit_sha=$(sha256sum /tmp/fa426-checked-in.lean | awk '{print $1}')
          if test "$selected_sha" = "$worktree_sha" && test "$selected_sha" = "$commit_sha"; then
            identity_ok=true
          else
            identity_ok=false
          fi
          cat > "$d/CHECKED_IN_IDENTITY.txt" <<EOF
          selected_sha256=$selected_sha
          worktree_sha256=$worktree_sha
          checked_in_sha256=$commit_sha
          identity_ok=$identity_ok
          source_commit=$(git rev-parse HEAD)
          EOF
          echo "identity_ok=$identity_ok" >> "$GITHUB_OUTPUT"

      - name: Checked-in FA direct compile twice and trust audit
        id: fa_final
        if: always()
        env:
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa426-monotone-donor-proof-miner/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          olean=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
          ilean=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean

          compile_fa() {
            run_no=$1
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/FA-run${run_no}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${run_no}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          rc1=125
          rc2=125
          if test "${IDENTITY_OK:-false}" = true; then
            compile_fa 1; rc1=$?
            if test "$rc1" -eq 0; then
              compile_fa 2; rc2=$?
            fi
          fi

          export RC1="$rc1" RC2="$rc2"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, re

          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          text = src.read_text(encoding='utf-8')
          out = []
          i = 0
          line = False
          string = False
          escaped = False
          depth = 0
          while i < len(text):
              ch = text[i]
              nxt = text[i + 1] if i + 1 < len(text) else ''
              if line:
                  if ch == '\n':
                      line = False; out.append('\n')
                  else: out.append(' ')
                  i += 1; continue
              if depth:
                  if ch == '/' and nxt == '-': depth += 1; out.extend([' ',' ']); i += 2; continue
                  if ch == '-' and nxt == '/': depth -= 1; out.extend([' ',' ']); i += 2; continue
                  out.append('\n' if ch == '\n' else ' '); i += 1; continue
              if string:
                  out.append('\n' if ch == '\n' else ' ')
                  if escaped: escaped = False
                  elif ch == '\\': escaped = True
                  elif ch == '"': string = False
                  i += 1; continue
              if ch == '-' and nxt == '-': line = True; out.extend([' ',' ']); i += 2; continue
              if ch == '/' and nxt == '-': depth = 1; out.extend([' ',' ']); i += 2; continue
              if ch == '"': string = True; out.append(' '); i += 1; continue
              out.append(ch); i += 1
          code = ''.join(out)
          patterns = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'new_global_axiom': r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
              'unsafe': r'\bunsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
          }
          audit = {name: len(re.findall(pattern, code)) for name, pattern in patterns.items()}
          rc1 = int(os.environ['RC1']); rc2 = int(os.environ['RC2'])
          clean = all(v == 0 for v in audit.values())
          result = {
              'checked_in_source': True,
              'FA_run1_exit': rc1,
              'FA_run2_exit': rc2,
              'forbidden_audit': audit,
              'forbidden_clean': clean,
              'FA_TRUE_PASS': rc1 == 0 and rc2 == 0 and clean,
              'maxErrors_cap': 1,
          }
          Path('build-logs/fa426-monotone-donor-proof-miner/final-gates/FA_FINAL.json').write_text(
              json.dumps(result, indent=2) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as handle:
              handle.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_final.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa426-monotone-donor-proof-miner/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          final=1
          targets=()
          if test "${FA_TRUE_PASS:-false}" = true; then
            if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
              targets+=(Mock2_FunctionalAnalysis_Integrated)
            else
              printf 'required Integrated source missing\n' > "$d/Integrated-missing.txt"
            fi
            shopt -s nullglob
            mock3=(PrimalitySheafVerification/Mock3*.lean)
            for src in "${mock3[@]}"; do targets+=("$(basename "$src" .lean)"); done
            if test -f PrimalitySheafVerification/QYM.lean; then
              targets+=(QYM)
            else
              printf 'required QYM source missing\n' > "$d/QYM-missing.txt"
            fi
          fi

          compile_one() {
            stem=$1
            run_no=$2
            src="PrimalitySheafVerification/${stem}.lean"
            olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}-run${run_no}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run_no}.exit"
            test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"
          }

          downstream_ok=true
          if test "${FA_TRUE_PASS:-false}" != true; then downstream_ok=false; fi
          if test ! -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then downstream_ok=false; fi
          if test ! -f PrimalitySheafVerification/QYM.lean; then downstream_ok=false; fi
          for stem in "${targets[@]}"; do
            compile_one "$stem" 1
            r1=$?
            r2=125
            if test "$r1" -eq 0; then compile_one "$stem" 2; r2=$?; fi
            if test "$r1" -ne 0 || test "$r2" -ne 0; then
              downstream_ok=false
              break
            fi
          done
          if test "$downstream_ok" = true; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json, re
          d = Path('build-logs/fa426-monotone-donor-proof-miner/final-gates')
          rows = {}
          for ep in sorted(d.glob('*-run*.exit')):
              stem = ep.stem
              lp = ep.with_suffix('.log')
              text = lp.read_text(encoding='utf-8', errors='replace') if lp.exists() else ''
              errors = len(re.findall(r'\.lean:\d+:\d+:\s+(?:error(?:\([^)]*\))?:|error:)', text))
              rows[stem] = {'exit_code': int(ep.read_text()), 'error_headers': errors, 'maxErrors_cap': 1}
          result = {'complete': (d/'ALL_REQUIRED_TARGETS_2X_PASS').exists(), 'runs': rows}
          (d/'DOWNSTREAM_FINAL.json').write_text(json.dumps(result, indent=2)+'\n', encoding='utf-8')
          print(json.dumps(result, indent=2))
          PY
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final checked-in verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          git add "$d"
          if ! git diff --cached --quiet; then
            if test -f "$d/final-gates/ALL_REQUIRED_TARGETS_2X_PASS"; then
              msg='ci: record FA Integrated Mock3 QYM checked-in 2x PASS evidence [skip ci]'
            elif test -f "$d/final-gates/FA_FINAL.json"; then
              msg='ci: record FA426 checked-in direct verification frontier [skip ci]'
            else
              msg='ci: record FA426 infrastructure evidence [skip ci]'
            fi
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA426 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa426-monotone-donor-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa426-monotone-donor-proof-miner
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce full ordered result
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
