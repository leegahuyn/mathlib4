name: Codex FA API probe LinearPMap neg subtype v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-linearpmap-neg-subtype-v2.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh; sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1; export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1; lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact subtype bridge
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeLinearPMapNegSubtype.lean <<'LEAN'
          import Mathlib
          open scoped LinearPMap
          variable {E F : Type*} [AddCommGroup E] [Module ℂ E] [AddCommGroup F] [Module ℂ F]
          example (f : E →ₗ.[ℂ] F) (x : f.domain) :
              ∃ xn : (-f).domain, ((xn : E) = (x : E)) ∧ (-f) xn = -(f x) := by
            let xn : (-f).domain := ⟨(x : E), by
              rw [LinearPMap.neg_domain]
              exact x.property⟩
            refine ⟨xn, rfl, ?_⟩
            rw [LinearPMap.neg_apply]
            rfl
          example (f : E →ₗ.[ℂ] F) (x : f.domain) :
              (-f) (⟨(x : E), by rw [LinearPMap.neg_domain]; exact x.property⟩ : (-f).domain) = -(f x) := by
            rw [LinearPMap.neg_apply]
            rfl
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeLinearPMapNegSubtype.lean | tee /tmp/linearpmap-neg-subtype-v2.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-linearpmap-neg-subtype-v2-${{ github.sha }}", path: /tmp/linearpmap-neg-subtype-v2.log, retention-days: 7}
