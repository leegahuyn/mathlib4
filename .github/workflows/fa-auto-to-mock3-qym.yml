name: Ordered FA auto repair then Mock3 QYM 2x

on:
  push:
    branches:
      - fix/fa359-final-isolated-20260808
    paths:
      - '.github/workflows/fa-auto-to-mock3-qym.yml'
      - 'scripts/auto_repair_fa_frontier.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: ordered-fa-auto-mock3-qym
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa359-final-isolated-20260808
          fetch-depth: 700
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/cache-get.log

      - name: Reconstruct PASS 359 seed
        id: seed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/diagnose-pass359-fa
          set +e
          bash scripts/diagnose_pass359_fa.sh > /tmp/pass359-reconstruct.log 2>&1
          diagnostic_rc=$?
          set -e
          seed='/tmp/diagnose-pass359-fa/source/Mock2_FunctionalAnalysis-pass359.lean'
          if [[ ! -s "${seed}" ]]; then
            echo 'PASS 359 diagnostic did not leave the expected source; using checked-in source.'
            seed='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          fi
          cp "${seed}" /tmp/Mock2_FunctionalAnalysis-seed.lean
          sha256sum /tmp/Mock2_FunctionalAnalysis-seed.lean | tee /tmp/pass359-seed.sha256
          echo "diagnostic_rc=${diagnostic_rc}" >> "${GITHUB_OUTPUT}"
          echo "seed=${seed}" >> "${GITHUB_OUTPUT}"

      - name: Kernel-checked frontier repair loop
        id: repair
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/auto_repair_fa_frontier.py \
            --seed /tmp/Mock2_FunctionalAnalysis-seed.lean \
            --max-rounds 80 \
            --compile-timeout 900 \
            --materialize-on-pass \
            > /tmp/fa-auto-agent.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat build-logs/fa-auto-frontier/state.json || true
          tail -300 /tmp/fa-auto-agent.log || true
          exit 0

      - name: Upload frontier repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-auto-frontier-${{ github.sha }}
          path: |
            /tmp/lean-version.txt
            /tmp/lake-version.txt
            /tmp/cache-get.log
            /tmp/pass359-reconstruct.log
            /tmp/pass359-seed.sha256
            /tmp/fa-auto-agent.log
            build-logs/fa-auto-frontier
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce FA repair success
        shell: bash
        env:
          REPAIR_RC: ${{ steps.repair.outputs.exit_code }}
        run: |
          set -euo pipefail
          test "${REPAIR_RC}" = 0
          test -s build-logs/fa-auto-frontier/Mock2_FunctionalAnalysis.PASS.lean
          cmp -s build-logs/fa-auto-frontier/Mock2_FunctionalAnalysis.PASS.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

      - name: Reject forbidden proof escapes
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          targets = [Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')]
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock2_FunctionalAnalysis_Integrated*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          targets += sorted(Path('PrimalitySheafVerification').glob('QYM*.lean'))
          forbidden = re.compile(
              r'(?m)^\s*(?:sorry|admit)\b|(?m)^\s*axiom\b|(?m)^\s*unsafe\b|'
              r'\bnative_decide\b|\bLean\.ofReduceBool\b'
          )
          for path in targets:
              text = path.read_text(encoding='utf-8')
              text = re.sub(r'/-.*?-/', '', text, flags=re.S)
              text = re.sub(r'--.*$', '', text, flags=re.M)
              m = forbidden.search(text)
              if m:
                  raise SystemExit(f'forbidden token {m.group(0)!r} in {path}')
          print('forbidden-token audit passed for', len(targets), 'files')
          PY

      - name: Verify FA direct source twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p /tmp/ordered-pass/logs .lake/build/lib/lean/PrimalitySheafVerification
          src='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          out='.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis'
          for run in 1 2; do
            rm -f "${out}.olean" "${out}.ilean"
            lake env lean -DmaxErrors=2000 \
              -o "${out}.olean" -i "${out}.ilean" "${src}" \
              > "/tmp/ordered-pass/logs/fa-${run}.log" 2>&1
            test -s "${out}.olean"
            test -s "${out}.ilean"
            if grep -n 'error:' "/tmp/ordered-pass/logs/fa-${run}.log"; then
              exit 1
            fi
            sha256sum "${src}" "${out}.olean" "${out}.ilean" \
              > "/tmp/ordered-pass/logs/fa-${run}.sha256"
          done
          echo FA_TWO_DIRECT_RUNS_PASS | tee /tmp/ordered-pass/fa.pass

      - name: Verify Integrated and actual Mock3 bridges twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mapfile -t targets < <(
            {
              find PrimalitySheafVerification -maxdepth 1 -type f \
                -name 'Mock2_FunctionalAnalysis_Integrated*.lean' -print
              find PrimalitySheafVerification -maxdepth 1 -type f \
                -name 'Mock3*.lean' -print
            } | sort -u
          )
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo 'No Integrated or Mock3 source was found.' >&2
            exit 1
          fi
          printf '%s\n' "${targets[@]}" | tee /tmp/ordered-pass/integrated-mock3-targets.txt
          for src in "${targets[@]}"; do
            base="$(basename "${src}" .lean)"
            out=".lake/build/lib/lean/PrimalitySheafVerification/${base}"
            for run in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "/tmp/ordered-pass/logs/${base}-${run}.log" 2>&1
              test -s "${out}.olean"
              test -s "${out}.ilean"
              if grep -n 'error:' "/tmp/ordered-pass/logs/${base}-${run}.log"; then
                exit 1
              fi
            done
          done
          echo INTEGRATED_MOCK3_TWO_DIRECT_RUNS_PASS | tee /tmp/ordered-pass/integrated-mock3.pass

      - name: Verify QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mapfile -t targets < <(find PrimalitySheafVerification -maxdepth 1 -type f -name 'QYM*.lean' -print | sort)
          if [[ ${#targets[@]} -eq 0 ]]; then
            echo 'No QYM source was found.' >&2
            exit 1
          fi
          printf '%s\n' "${targets[@]}" | tee /tmp/ordered-pass/qym-targets.txt
          for src in "${targets[@]}"; do
            base="$(basename "${src}" .lean)"
            out=".lake/build/lib/lean/PrimalitySheafVerification/${base}"
            for run in 1 2; do
              rm -f "${out}.olean" "${out}.ilean"
              lake env lean -DmaxErrors=2000 \
                -o "${out}.olean" -i "${out}.ilean" "${src}" \
                > "/tmp/ordered-pass/logs/${base}-${run}.log" 2>&1
              test -s "${out}.olean"
              test -s "${out}.ilean"
              if grep -n 'error:' "/tmp/ordered-pass/logs/${base}-${run}.log"; then
                exit 1
              fi
            done
          done
          echo QYM_TWO_DIRECT_RUNS_PASS | tee /tmp/ordered-pass/qym.pass

      - name: Upload ordered final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ordered-fa-mock3-qym-${{ github.sha }}
          path: /tmp/ordered-pass
          if-no-files-found: warn
          retention-days: 90

      - name: Materialize verified source on repair branch
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if git diff --cached --quiet; then
            echo 'Verified source already checked in.'
          else
            git commit -m 'fix: materialize two-run PASS FunctionalAnalysis source'
            git push origin HEAD:fix/fa359-final-isolated-20260808
          fi
