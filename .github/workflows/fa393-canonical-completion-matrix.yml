name: PASS 393 canonical Completion instance matrix

on:
  push:
    branches:
      - probe/fa393-canonical-completion-matrix-20260809
    paths:
      - '.github/workflows/fa393-canonical-completion-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa393-canonical-completion-matrix
  cancel-in-progress: true

jobs:
  probe:
    name: canonical-${{ matrix.variant }}
    strategy:
      fail-fast: false
      matrix:
        variant:
          - global-canonical
          - global-canonical-no-local
          - targeted-canonical
          - targeted-explicit
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout PASS 389 baseline
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 3000
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Build canonical instance candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          mkdir -p "/tmp/fa393/${VARIANT}/logs" "/tmp/fa393/${VARIANT}/source"
          python3 - <<'PY'
          from hashlib import sha256
          from pathlib import Path
          import os

          p = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before = sha256(p.read_bytes()).hexdigest()
          expected = '5f2d7615aaad7bb3a232d19829f0f801278e7ab2fa2f66ccb68408b87647e620'
          if before != expected:
              raise SystemExit(f'unexpected PASS389 baseline: {before}; expected {expected}')
          text = p.read_text()
          variant = os.environ['VARIANT']

          marker = '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          '''
          canonical_block = '''abbrev SobolevCompletion :=
            UniformSpace.Completion Q.GraphRange

          noncomputable local instance sobolevCompletionModule :
              Module ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.instModule

          noncomputable local instance sobolevCompletionNormedSpace :
              NormedSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange

          noncomputable local instance sobolevCompletionInner :
              Inner ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.toInner

          noncomputable local instance sobolevCompletionInnerProductSpace :
              InnerProductSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.innerProductSpace

          '''

          def repl(old: str, new: str, label: str) -> None:
              global text
              count = text.count(old)
              print(f'{label}: expected=1 actual={count}')
              if count != 1:
                  raise SystemExit(f'{label}: expected one occurrence, found {count}')
              text = text.replace(old, new)

          norm_blocks = [
              (
                  '''theorem norm_baseExtension_le_one : ‖Q.baseExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.baseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_baseExtension_le x
          ''',
                  '''theorem norm_baseExtension_le_one : ‖Q.baseExtension‖ ≤ 1 := by
            letI : Module ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instModule
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.baseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_baseExtension_le x
          ''',
                  'base opnorm canonical module',
              ),
              (
                  '''theorem norm_raiseExtension_le_one : ‖Q.raiseExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.raiseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_raiseExtension_le x
          ''',
                  '''theorem norm_raiseExtension_le_one : ‖Q.raiseExtension‖ ≤ 1 := by
            letI : Module ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instModule
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.raiseExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_raiseExtension_le x
          ''',
                  'raise opnorm canonical module',
              ),
              (
                  '''theorem norm_lowerExtension_le_one : ‖Q.lowerExtension‖ ≤ 1 := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.lowerExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_lowerExtension_le x
          ''',
                  '''theorem norm_lowerExtension_le_one : ‖Q.lowerExtension‖ ≤ 1 := by
            letI : Module ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instModule
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact Q.lowerExtension.opNorm_le_bound zero_le_one fun x => by
              simpa only [one_mul] using Q.norm_lowerExtension_le x
          ''',
                  'lower opnorm canonical module',
              ),
          ]

          operator_old = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion := by
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            exact innerSLFlip ℂ
          '''
          operator_targeted = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion := by
            letI : Module ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instModule
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            letI : Inner ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.toInner
            letI : InnerProductSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.innerProductSpace
            exact (innerSLFlip ℂ :
              Q.SobolevCompletion →L[ℂ] StrongAntiDual Q.SobolevCompletion)
          '''

          if variant in {'global-canonical', 'global-canonical-no-local'}:
              repl(marker, canonical_block, 'insert exact canonical completion package')

          if variant in {'targeted-canonical', 'targeted-explicit'}:
              for old, new, label in norm_blocks:
                  repl(old, new, label)
              repl(operator_old, operator_targeted, 'typed canonical completion energy operator')

          if variant == 'global-canonical-no-local':
              for old, _, label in norm_blocks:
                  local_removed = old.replace(
                      '''  letI : NormedSpace ℂ Q.SobolevCompletion :=
            UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
          ''',
                      ''
                  )
                  repl(old, local_removed, label + ' remove redundant local')
              operator_removed = '''noncomputable def completionEnergyOperator :
              WeakAntiOperator Q.SobolevCompletion :=
            (innerSLFlip ℂ :
              Q.SobolevCompletion →L[ℂ] StrongAntiDual Q.SobolevCompletion)
          '''
              repl(operator_old, operator_removed, 'global canonical typed energy operator')

          if variant == 'targeted-explicit':
              repl(
                  '''@[simp]
          theorem completionEnergyOperator_apply (u v : Q.SobolevCompletion) :
              Q.completionEnergyOperator u v = ⟪v, u⟫_ℂ :=
            innerSLFlip_apply_apply ℂ u v
          ''',
                  '''@[simp]
          theorem completionEnergyOperator_apply (u v : Q.SobolevCompletion) :
              Q.completionEnergyOperator u v = ⟪v, u⟫_ℂ := by
            letI : Module ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instModule
            letI : NormedSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.instNormedSpace ℂ Q.GraphRange
            letI : Inner ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.toInner
            letI : InnerProductSpace ℂ Q.SobolevCompletion :=
              UniformSpace.Completion.innerProductSpace
            change ((innerSLFlip ℂ :
              Q.SobolevCompletion →L[ℂ] StrongAntiDual Q.SobolevCompletion) u) v =
                ⟪v, u⟫_ℂ
            exact innerSLFlip_apply_apply ℂ u v
          ''',
                  'explicit completion energy apply',
              )
              repl(
                  '''  FredholmBypass.coerciveForm_injective
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveForm_injective
            (V := Q.SobolevCompletion)
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  'explicit injectivity carrier',
              )
              repl(
                  '''  FredholmBypass.coerciveForm_surjective
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveForm_surjective
            (V := Q.SobolevCompletion)
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  'explicit surjectivity carrier',
              )
              repl(
                  '''  FredholmBypass.coerciveFormEquiv
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  '''  FredholmBypass.coerciveFormEquiv
            (V := Q.SobolevCompletion)
            1 Q.completionEnergyOperator Q.completionEnergyOperator_coercive
          ''',
                  'explicit equivalence carrier',
              )

          p.write_text(text)
          after = sha256(p.read_bytes()).hexdigest()
          print(f'variant={variant}')
          print(f'input_sha256={before}')
          print(f'output_sha256={after}')
          out = Path(f'/tmp/fa393/{variant}/source')
          (out / 'source-sha256.txt').write_text(after + '\n')
          (out / f'Mock2_FunctionalAnalysis-{variant}.lean').write_bytes(p.read_bytes())
          PY

      - name: Compile full candidate
        id: compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.{olean,ilean}
          lake env lean -DmaxErrors=250 \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            > "/tmp/fa393/${VARIANT}/logs/compile.log" 2>&1
          rc=$?
          set -e
          grep -n 'error:' "/tmp/fa393/${VARIANT}/logs/compile.log" \
            > "/tmp/fa393/${VARIANT}/logs/errors.txt" || true
          grep -n 'warning:' "/tmp/fa393/${VARIANT}/logs/compile.log" \
            > "/tmp/fa393/${VARIANT}/logs/warnings.txt" || true
          first=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' \
            "/tmp/fa393/${VARIANT}/logs/compile.log" | head -1)
          last=$(sed -nE 's#.*Mock2_FunctionalAnalysis\.lean:([0-9]+):[0-9]+: error:.*#\1#p' \
            "/tmp/fa393/${VARIANT}/logs/compile.log" | tail -1)
          errors=$(wc -l < "/tmp/fa393/${VARIANT}/logs/errors.txt")
          warnings=$(wc -l < "/tmp/fa393/${VARIANT}/logs/warnings.txt")
          {
            echo "variant=${VARIANT}"
            echo "exit_code=${rc}"
            echo "error_header_count=${errors}"
            echo "warning_count=${warnings}"
            echo "first_error_line=${first:-none}"
            echo "last_error_line=${last:-none}"
          } | tee "/tmp/fa393/${VARIANT}/summary.txt"
          tail -1500 "/tmp/fa393/${VARIANT}/logs/compile.log" > "/tmp/fa393/${VARIANT}/logs/tail.txt" || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 393 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa393-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/fa393/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce result
        if: always()
        shell: bash
        env:
          EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${EXIT_CODE:-}"
          exit "${EXIT_CODE}"
