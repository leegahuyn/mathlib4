name: Deterministic focused workflow patch agent v2

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-workflow-patch-agent-v2-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deterministic-focused-workflow-patch-v2
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Patch latest branch without overwriting concurrent commits
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            python3 scripts/patch_focused_workflows_20260807.py
            git diff --check
            if git diff --quiet; then
              echo 'Focused workflows are already normalized.'
              exit 0
            fi
            git add \
              .github/workflows/focused-m2a-v68-materialize-20260807.yml \
              .github/workflows/focused-m2a-direct-source-20260807.yml \
              .github/workflows/focused-functional-analysis-materialize-20260807.yml \
              .github/workflows/focused-functional-analysis-direct-20260807.yml \
              .github/workflows/focused-qym-direct-20260807.yml
            git commit -m 'ci: apply deterministic focused workflow fixes'
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          echo 'Unable to apply workflow-only fixes without a clean fast-forward.' >&2
          exit 1
