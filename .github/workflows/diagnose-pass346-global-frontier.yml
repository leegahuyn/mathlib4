name: Diagnose PASS 346 global-instance FunctionalAnalysis frontier

on:
  pull_request:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/diagnose-pass346-global-frontier.yml'
      - 'scripts/diagnose_pass346_global_frontier.sh'
      - 'scripts/fa346_global_neg_repair.py'
      - 'scripts/fa345_global_instances_repair.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-pass346-global-frontier-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 480
          persist-credentials: false

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass346-global-frontier/logs
          lean --version | tee /tmp/diagnose-pass346-global-frontier/lean-version.txt
          lake --version | tee /tmp/diagnose-pass346-global-frontier/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass346-global-frontier/logs/cache-get.log

      - name: Reconstruct and compile PASS 346 global frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass346_global_frontier.sh

      - name: Upload PASS 346 global frontier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnose-pass346-global-frontier-${{ env.SOURCE_SHA }}
          path: /tmp/diagnose-pass346-global-frontier
          if-no-files-found: error
          retention-days: 90
