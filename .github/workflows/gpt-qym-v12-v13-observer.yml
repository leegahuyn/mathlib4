name: GPT QYM V12 V13 observer

on:
  push:
    branches:
      - gpt/qym-v12-v13-observer-20260819
    paths:
      - .github/workflows/gpt-qym-v12-v13-observer.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  observe:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: true
      - name: Query V12 and V13 runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-frontier
          python3 - <<'PY'
          import json, os, subprocess
          repo = os.environ['GITHUB_REPOSITORY']
          api = os.environ['GITHUB_API_URL']
          targets = [
            ('v12', 'gpt-qym-gb78-v12-normal-repair.yml', 'gpt/qym-gb78-v12-normal-repair-20260819'),
            ('v13', 'gpt-qym-gb78-v13-normal-atlas-combined.yml', 'gpt/qym-gb78-v13-normal-atlas-combined-20260819'),
          ]
          out = {}
          for key, workflow, branch in targets:
            url = f'{api}/repos/{repo}/actions/workflows/{workflow}/runs?branch={branch}&per_page=10'
            raw = subprocess.check_output([
              'curl','-fsSL',
              '-H',f"Authorization: Bearer {os.environ['GH_TOKEN']}",
              '-H','Accept: application/vnd.github+json',
              '-H','X-GitHub-Api-Version: 2022-11-28',
              url,
            ])
            data = json.loads(raw)
            runs = []
            for r in data.get('workflow_runs', []):
              runs.append({k:r.get(k) for k in [
                'id','run_number','run_attempt','status','conclusion','event','head_sha','head_branch',
                'created_at','updated_at','html_url'
              ]})
            out[key] = {'workflow':workflow,'branch':branch,'total_count':data.get('total_count',0),'runs':runs}
          from datetime import datetime, timezone
          out['observed_at'] = datetime.now(timezone.utc).isoformat()
          p = '.github/qym-frontier/V12_V13_LIVE_STATUS.json'
          open(p,'w').write(json.dumps(out,indent=2,sort_keys=True)+'\n')
          print(json.dumps(out,indent=2,sort_keys=True))
          PY
      - name: Commit observation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qym-frontier/V12_V13_LIVE_STATUS.json
          git commit -m 'QYM observer: record V12 V13 live status'
          git push
