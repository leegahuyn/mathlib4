name: Codex FA after3292 bridge fast1 v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-after3292-bridge-fast1-v1.yml
      - scripts/fa_dynamic_cluster_3292_function_sub_bridge_v2.json
  workflow_dispatch:
permissions: {actions: read, contents: read}
env:
  BASE_RUN_ID: "31565393904"
  BASE_JOB_ID: "94016048808"
  BASE_HEAD_SHA: "6a0848ecfdf0be81b4793f8759b66bd139a8ff03"
  BASE_ARTIFACT_ID: "9129445969"
  BASE_ARTIFACT_NAME: "codex-fa-after3286-final-fast1-v1-6a0848ecfdf0be81b4793f8759b66bd139a8ff03"
  BASE_ARTIFACT_DIGEST: "sha256:2980e9247354c229396cc27dd4e3483eef681ba54be8b7e9f47512869689ab1e"
  BASE_SOURCE_SHA256: "d9edddc9fd26eb138b913c9d34300c6fc3de4084a89025aa3c5285988c1b4b8b"
  BASE_SOURCE_BYTES: "2727334"
  BASE_SOURCE_LINES: "61098"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact direct-tested idx3292 source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-after3292-bridge-fast1-v1; mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/job.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" >"$OUT/artifact.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"; unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,shutil
          out=Path('build-logs/codex-fa-after3292-bridge-fast1-v1');r=json.loads((out/'run.json').read_text());j=json.loads((out/'job.json').read_text());a=json.loads((out/'artifact.json').read_text());m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          assert r['id']==int(os.environ['BASE_RUN_ID']) and r['head_sha']==os.environ['BASE_HEAD_SHA'] and r['status']=='completed' and r['conclusion']=='failure'; assert j['id']==int(os.environ['BASE_JOB_ID']) and j['conclusion']=='failure'; assert a['id']==int(os.environ['BASE_ARTIFACT_ID']) and a['name']==os.environ['BASE_ARTIFACT_NAME'] and a['digest']==os.environ['BASE_ARTIFACT_DIGEST'] and not a['expired']; assert m['Mock2_exit']==0 and m['Mock2_Advanced_exit']==0 and m['FA_exit']==1 and m['all_required_lean_executed'] is True and m['FA_error_declaration_index']==3292 and m['source_sha256']==os.environ['BASE_SOURCE_SHA256'] and m['source_identity_locked_after_materialization'] is True and m['public_proposition_changes_explicitly_audited'] is True and m['declaration_sequence_preserved'] is True
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            b=p.read_bytes()
            if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']):hits.append(p)
          assert len(hits)==1;shutil.copy2(hits[0],'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');(out/'ALLOWED.json').write_text(json.dumps(m['allowed_public_proposition_changes'],indent=2)+'\n')
          PY
      - name: Apply idx3292 function-sub bridge
        shell: bash
        run: |
          set -euo pipefail;OUT=build-logs/codex-fa-after3292-bridge-fast1-v1
          python3 scripts/fa_dynamic_apply_staged_library_decl_local_strict_v1.py --base-source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --library scripts/fa_dynamic_cluster_3292_function_sub_bridge_v2.json --target /tmp/candidate.lean --audit-out "$OUT/PATCH.json";cp /tmp/candidate.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-after3292-bridge-fast1-v1');a=json.loads((out/'PATCH.json').read_text());assert a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'];p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');b=p.read_bytes();h=hashlib.sha256(b).hexdigest();
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f'CANDIDATE_SHA={h}\n')
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Direct full-source first-frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH";OUT=build-logs/codex-fa-after3292-bridge-fast1-v1;mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2;one Mock2_Advanced;test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA";one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-after3292-bridge-fast1-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();b=p.read_bytes();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];rx=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');first={}
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=rx.match(raw)
            if m:
              ln=int(m.group(1));i=bisect_right(starts,ln)-1;first={'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[i].group('name') if i>=0 else None,'declaration_index':i if i>=0 else None};break
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};allowed=json.loads((out/'ALLOWED.json').read_text());metric={'schema':'fa-after3292-bridge-fast1-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'declaration_sequence_preserved':True,'public_proposition_changes_explicitly_audited':True,'allowed_public_proposition_changes':allowed};(out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT";exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3292-bridge-fast1-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3292-bridge-fast1-v1
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86;exit "$FA_EXIT"
