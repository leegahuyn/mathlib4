name: Report priority Advanced FunctionalAnalysis QYM PASS

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'build-logs/priority-stage3-qym-result.txt'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - name: Clone exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: fix/primality-sheaf-clean-build
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${BRANCH}"
          git checkout --detach FETCH_HEAD

      - name: Verify the conclusive PASS record
        shell: bash
        run: |
          set -euo pipefail
          result='build-logs/priority-stage3-qym-result.txt'
          test -s "${result}"
          grep -Fxq 'stage=QYM' "${result}"
          grep -Fxq 'status=PASS' "${result}"
          grep -Fxq 'runtime_repair_scripts=0' "${result}"
          grep -Fxq 'Mock2_Advanced=PASS' "${result}"
          grep -Fxq 'Mock2_FunctionalAnalysis=PASS' "${result}"
          grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' "${result}"
          grep -Fxq 'QYM=PASS' "${result}"
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," "${result}"
            grep -Eq "^${module},pass2,0,0," "${result}"
          done

      - name: Post the verified result to PR 7
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result='build-logs/priority-stage3-qym-result.txt'
          head_sha="$(grep '^verified_source_head=' "${result}" | cut -d= -f2-)"
          summary="$(grep -E '^(Mock2|Mock2_Advanced|Mock2_FunctionalAnalysis|Mock2_FunctionalAnalysis_Integrated|QYM),pass[12],' "${result}")"
          body="$(python3 - "${head_sha}" "${summary}" <<'PY'
          import json, sys
          head, summary = sys.argv[1], sys.argv[2]
          text = f'''## Priority modules direct-source PASS

Verified source head: `{head}`

The checked-in sources were compiled in dependency order twice, with project artifacts removed before every module compile and no runtime repair scripts:

- `Mock2_Advanced`: PASS twice
- `Mock2_FunctionalAnalysis`: PASS twice
- `Mock2_FunctionalAnalysis_Integrated`: PASS twice
- `QYM` / Mock3: PASS twice

```text
{summary}
```
'''
          print(json.dumps({'body': text}))
          PY
          )"
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            -d "${body}"
