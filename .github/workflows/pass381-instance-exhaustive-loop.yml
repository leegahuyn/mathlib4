name: PASS 381 exhaustive instance repair and blocking loop

on:
  push:
    branches: [fix/fa381-instance-exhaustive-20260809]
    paths:
      - '.github/workflows/pass381-instance-exhaustive-loop.yml'
      - 'scripts/pass381_instance_exhaustive.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass381-instance-exhaustive-loop
  cancel-in-progress: false

jobs:
  exhaustive-and-blocking:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa381-instance-exhaustive-20260809
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact PASS 381 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1600
          persist-credentials: true

      - name: Install pinned Lean, cache, and official Models CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          gh extension install github/gh-models --force || true
          gh models --help || true

      - name: Materialize exact PASS 376 when FA is still a stub
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          if [[ $(wc -c < "${fa}") -gt 500000 ]]; then
            echo 'Using checked-in full FunctionalAnalysis source.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/diagnose_pass341_fa.sh')
          text=path.read_text(encoding='utf-8')
          begin='''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end='''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(begin)!=1 or text.count(end)!=1:
              raise SystemExit('PASS341 direct-compile markers unavailable')
          text=text.replace(begin,'''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text=text.replace(end,'''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text,encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          cp /tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Exhaustively test the first Complex-instance cluster
        id: exhaustive
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass381_instance_exhaustive.py \
            > /tmp/pass381-instance-exhaustive-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass381-instance-exhaustive-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit a deterministic improvement before the long loop
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -f /tmp/pass381-instance-exhaustive/IMPROVED ]]; then
            echo 'No deterministic instance candidate improved the compiler frontier.'
            exit 0
          fi
          mkdir -p build-logs
          cp /tmp/pass381-instance-exhaustive/summary.json \
            build-logs/PASS381_INSTANCE_EXHAUSTIVE_SUMMARY.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/PASS381_INSTANCE_EXHAUSTIVE_SUMMARY.json
          git commit -m 'fix: apply objectively improved PASS 381 instance normalization'
          git push origin HEAD:"${BRANCH_NAME}"

      - name: Activate CLI fallback and continue the ordered blocking loop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/blocking_priority_loop_v379.py')
          text=path.read_text(encoding='utf-8')
          old="str(ROOT / 'scripts' / 'run_lean_repair_v377_styled.py')"
          new="str(ROOT / 'scripts' / 'run_lean_repair_v380_styled.py')"
          if old in text:
              text=text.replace(old,new)
          elif new not in text:
              raise SystemExit('could not identify repair wrapper path')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Run the remaining ordered repair loop
        id: loop
        shell: bash
        env:
          BLOCKING_MAX_SECONDS: '15000'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/blocking_priority_loop_v379.py \
            > /tmp/pass381-blocking-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass381-blocking-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 381 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass381-instance-exhaustive-${{ github.sha }}
          path: |
            /tmp/pass381-instance-exhaustive
            /tmp/pass381-instance-exhaustive-driver.log
            /tmp/pass381-blocking-driver.log
            /tmp/pass379-blocking
            /tmp/pass378
            /tmp/lean-repair-v377
            build-logs/PASS381_*.json
            build-logs/PASS379_*.json
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce actual final two-round result
        if: always()
        shell: bash
        env:
          LOOP_EXIT: ${{ steps.loop.outputs.exit_code }}
        run: |
          test "${LOOP_EXIT:-1}" = '0'
          test -s build-logs/FA_MOCK3_QYM_2X_PASS.json
