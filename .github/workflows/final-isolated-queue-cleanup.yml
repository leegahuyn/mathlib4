name: Final isolated stale queue cleanup

on:
  push:
    branches: [fix/fa339-final-isolated-20260808]
    paths:
      - '.github/workflows/final-isolated-queue-cleanup.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: final-isolated-stale-queue-cleanup
  cancel-in-progress: true

jobs:
  cleanup:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Cancel stale PR7 and PR9 runs while preserving final isolated work
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          KEEP_BRANCH: fix/fa339-final-isolated-20260808
          KEEP_WORKFLOW: Final isolated PASS 339 FunctionalAnalysis
        run: |
          set -euo pipefail
          cancelled=0
          for branch in \
            fix/primality-sheaf-clean-build \
            ci/fa319-isolated-20260807; do
            gh api --paginate \
              "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100" \
              --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending") | [.id, .name, .head_branch] | @tsv' \
              | sort -u \
              | while IFS=$'\t' read -r run_id run_name run_branch; do
                  [[ -n "${run_id}" ]] || continue
                  [[ "${run_id}" = "${GITHUB_RUN_ID}" ]] && continue
                  if [[ "${run_branch}" = "${KEEP_BRANCH}" && "${run_name}" = "${KEEP_WORKFLOW}" ]]; then
                    continue
                  fi
                  if gh api -X POST \
                      "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                      >/dev/null 2>&1; then
                    echo "cancelled ${run_id} | ${run_name} | ${run_branch}"
                    cancelled=$((cancelled + 1))
                  fi
                done
          done
          echo "stale queue cleanup requested; current isolated PASS 339 branch was not targeted"
