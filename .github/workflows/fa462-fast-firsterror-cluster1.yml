name: FA462 fast strict first-error cluster1 matrix

on:
  pull_request:
    branches: [fix/fa462-fast-firsterror-cluster1-20260810]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa462-fast-${{ github.run_id }}
  cancel-in-progress: false

env:
  SOURCE_REF: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant:
          - baseline
          - gl_cumulative
          - gl_algA
          - gl_cluster_change
          - gl_cluster_have
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '20'
    steps:
      - name: Checkout immutable FA462 source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 2500
          persist-credentials: false
      - name: Generate, install pinned Lean/cache, execute prerequisite and FA direct CLI
        shell: bash
        run: bash scripts/fa462_candidate_ci.sh
      - name: Upload direct metric/source/log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa462-candidate-${{ matrix.variant }}
          path: build-logs/fa462-fast-firsterror/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90
      - name: Enforce actual direct Lean evidence
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa462-fast-firsterror/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json,sys
          try: m=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as exc: raise SystemExit(f'INFRA_FAILURE: metric missing/invalid: {exc}')
          ok=(m.get('classification')!='INFRA_FAILURE'
              and m.get('diagnostic_parser')=='strict_error_and_error_category_v1'
              and m.get('header_authority')=='declaration proposition/type through := only'
              and m.get('all_required_lean_executed') is True
              and m.get('source_metadata_identity') is True
              and m.get('Mock2_exit')==0 and m.get('Mock2_errors_under_cap')==0
              and m.get('Mock2_Advanced_exit')==0 and m.get('Mock2_Advanced_errors_under_cap')==0
              and m.get('FA_executed') is True and m.get('forbidden_clean') is True)
          print(json.dumps(m,indent=2,ensure_ascii=False))
          if not ok: raise SystemExit('INFRA_FAILURE: direct Lean evidence requirement not met')
          PY
