name: Codex FA v19 exact batch fast first frontier v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-v19-fast-first-frontier-v1.yml]
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  direct:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Materialize exact v19 candidate
        env:
          GH_TOKEN: "${{ github.token }}"
          BASE_SOURCE_SHA256: 12208d1092dc018df613f21aa532969fb450598b9c481e734e6692832a1e2b7f
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-v19-fast-first-frontier-v1; mkdir -p "$OUT" /tmp/v18
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9147888303/zip" >/tmp/v18.zip
          test "sha256:$(sha256sum /tmp/v18.zip | awk '{print $1}')" = "sha256:d8271b20a503895e3e11ea8d498d4cd5b3f09e95fdedb30b5145f3e434d2c1fd"
          unzip -q /tmp/v18.zip -d /tmp/v18
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,os,shutil
          sha=os.environ['BASE_SOURCE_SHA256']; root=Path('/tmp/v18')
          hits=[p for p in root.rglob('Mock2_FunctionalAnalysis.lean') if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(p.read_bytes()).hexdigest()==sha]
          assert len(hits)==1,hits
          shutil.copy2(hits[0],Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'))
          PY
          python3 scripts/fa_v19_early_root_batch.py PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT"
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$(cat "$OUT/candidate.sha256")"
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1; lake exe cache get >/tmp/cache.log 2>&1
      - name: Direct full dependency compile maxErrors1
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-v19-fast-first-frontier-v1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s="$1"; o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean; i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean; rm -f "$o" "$i"; :>"$OUT/$s.executed"; set +e; lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1; x=$?; set -e; echo "$x" >"$OUT/$s.exit"; }
          one Mock2; one Mock2_Advanced; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$(cat "$OUT/candidate.sha256")"; one Mock2_FunctionalAnalysis
      - name: Upload exact first-frontier evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v19-fast-first-frontier-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-v19-fast-first-frontier-v1
          retention-days: 30
      - name: Preserve actual FA exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-v19-fast-first-frontier-v1/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-v19-fast-first-frontier-v1/Mock2_FunctionalAnalysis.exit)"
