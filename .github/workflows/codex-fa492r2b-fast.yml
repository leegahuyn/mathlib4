name: Codex FA492-r2B comp_def fast first-error
on:
  push:
    branches:
      - fix/fa492r2-endpoint-comp-def-20260811
    paths:
      - .github/workflows/codex-fa492r2b-fast.yml
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish start
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          body="## FA492-r2B fast diagnostic started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- stage: \`FA492-r2 sibling B; non-authoritative cap=1\`\n- upstream_FA492_run: \`31459011892\`\n- upstream_FA492_job: \`93678608893\`\n- upstream_FA492_source: \`91a277662a1cee06b849445865d8a85331a1cef250c150d5c3f5e4c1b66fe7f7\`\n- frontier: \`35507:44 idx2812\`\n- patch: \`Function.comp_def\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Permit diagnostic cap 1
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='if [[ "$MAX_ERRORS" != "32" ]]; then'; new='if [[ "$MAX_ERRORS" != "1" && "$MAX_ERRORS" != "32" ]]; then'
          for p in Path('scripts').glob('fa*.sh'):
              t=p.read_text(encoding='utf-8')
              if old in t: p.write_text(t.replace(old,new),encoding='utf-8')
          PY
      - name: Run actual direct Lean cap 1
        id: run
        run: |
          set +e
          export MAX_ERRORS=1
          bash scripts/fa492r2_endpoint_comp_def_candidate_ci.sh 2>&1 | tee /tmp/run.log
          code=${PIPESTATUS[0]}; set -e; echo "exit_code=$code" >> "$GITHUB_OUTPUT"; exit 0
      - name: Report diagnostic
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        run: |
          python3 - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json,os
          p=Path('build-logs/codex-fa492r2-endpoint-comp-def/candidates/norms/METRIC.json'); log=Path('/tmp/run.log')
          xs=['## FA492-r2B fast diagnostic — actual direct Lean cap=1','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",'- authority: `diagnostic only; cap=32 required before promotion`']
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']: xs.append(f'- {k}: `{m.get(k)}`')
              xs += ['','```text',str(m.get('FA_first_error_message',''))[:6000],'```']
          else: xs.append('- METRIC.json: `MISSING`')
          if log.exists(): xs += ['','### tail','```text','\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-80:])[-10000:],'```']
          print('\n'.join(xs)[:24000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/report.md)"
