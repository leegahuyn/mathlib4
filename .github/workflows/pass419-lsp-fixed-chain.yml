name: PASS 419 deadlock-safe LSP-screened CLI FA chain

on:
  push:
    branches:
      - fix/fa419-lsp-fixed-chain-20260809
    paths:
      - '.github/workflows/pass419-lsp-fixed-chain.yml'
      - 'scripts/fa419_lsp_fixed_tournament.py'
      - 'build-logs/fa419-lsp-fixed/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: pass419-lsp-fixed-chain
  cancel-in-progress: false

jobs:
  screen-compile-continue:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa419-lsp-fixed-chain-20260809
      FA418_MAX_FRONTIERS: '48'
      FA418_MAX_CANDIDATES: '100'
      MAX_ROUNDS: '6'
    steps:
      - name: Checkout latest checked-in strict head with full history
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa419-lsp-fixed-chain-20260809
          fetch-depth: 0
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Determine deadlock-safe LSP round
        id: round
        shell: bash
        run: |
          set -euo pipefail
          f=build-logs/fa419-lsp-fixed/ROUND.txt
          test -s "$f" && current=$(cat "$f") || current=0
          next=$((current+1))
          echo "round=${next}" >> "$GITHUB_OUTPUT"

      - name: Screen incrementally and authorize only by direct CLI compile
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa419_lsp_fixed_tournament.py > /tmp/fa419.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa419.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate CLI authority and archive round evidence
        if: always()
        id: status
        shell: bash
        env:
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          src=build-logs/fa418-lsp-strict
          dst=build-logs/fa419-lsp-fixed
          mkdir -p "$dst/round-${ROUND}"
          test -s "$src/CURRENT.json"
          test -s "$src/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/round-${ROUND}/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/round-${ROUND}/CURRENT.txt"
          cp /tmp/fa419.log "$dst/round-${ROUND}/console.log"
          test ! -f "$src/FIRST_ERROR_CONTEXT.txt" || cp "$src/FIRST_ERROR_CONTEXT.txt" "$dst/FIRST_ERROR_CONTEXT.txt"
          test ! -f "$src/lean-lsp.stderr.log" || cp "$src/lean-lsp.stderr.log" "$dst/round-${ROUND}/lean-lsp.stderr.log"
          find "$src" -maxdepth 1 -type f -name 'frontier-*-PROMOTED.txt' -exec cp {} "$dst/" \;
          test ! -f "$src/ALL_REQUIRED_TARGETS_2X_PASS" || cp "$src/ALL_REQUIRED_TARGETS_2X_PASS" "$dst/ALL_REQUIRED_TARGETS_2X_PASS"
          printf '%s' "$ROUND" > "$dst/ROUND.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json, os
          s=json.loads(Path('build-logs/fa419-lsp-fixed/CURRENT.json').read_text())
          m=s['final_fa_metric']
          complete=bool(s['complete'])
          if not complete:
              line=m.get('first_line')
              if not isinstance(line,int) or line < 31725:
                  raise SystemExit(f'authoritative CLI regression: {line}')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit(f"forbidden-token audit failed: {s['forbidden_token_audit']}")
          if s['screening_policy'] != 'LSP screens candidates; only direct CLI Lean compile may promote':
              raise SystemExit('LSP-only promotion policy violation')
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as f:
              f.write(f"complete={'true' if complete else 'false'}\n")
              f.write(f"any_promotion={'true' if s['any_promotion'] else 'false'}\n")
              f.write(f"first_error={m.get('first_line')}\n")
              f.write(f"source_sha={m.get('source_sha256')}\n")
          PY

      - name: Commit only direct-CLI-authorized champion and evidence
        if: always()
        shell: bash
        env:
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          d=build-logs/fa419-lsp-fixed
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d/CURRENT.json" "$d/CURRENT.txt" "$d/ROUND.txt"
          test ! -f "$d/FIRST_ERROR_CONTEXT.txt" || git add "$d/FIRST_ERROR_CONTEXT.txt"
          test ! -f "$d/ALL_REQUIRED_TARGETS_2X_PASS" || git add "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          find "$d" -maxdepth 1 -type f -name 'frontier-*-PROMOTED.txt' -print0 | xargs -0 -r git add
          git add "$d/round-${ROUND}/CURRENT.json" "$d/round-${ROUND}/CURRENT.txt"
          if git diff --cached --quiet; then exit 0; fi
          if test "${COMPLETE:-false}" = true; then
            msg="fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS in FA419 round ${ROUND} [skip ci]"
          elif test "${SOURCE_CHANGED:-false}" = true; then
            msg="fix: promote deadlock-safe CLI-authorized FA champion round ${ROUND} [skip ci]"
          else
            msg="ci: record FA419 round ${ROUND} no-improvement evidence [skip ci]"
          fi
          git commit -m "$msg"
          git push origin HEAD:fix/fa419-lsp-fixed-chain-20260809

      - name: Dispatch next round only after a direct-CLI-authorized source improvement
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
          COMPLETE: ${{ steps.status.outputs.complete }}
          ROUND: ${{ steps.round.outputs.round }}
        run: |
          set -euo pipefail
          test "${COMPLETE:-false}" != true || exit 0
          test "${SOURCE_CHANGED:-false}" = true || exit 0
          test "${ROUND}" -lt "${MAX_ROUNDS}" || exit 0
          gh api --method POST \
            "repos/${GITHUB_REPOSITORY}/actions/workflows/pass419-lsp-fixed-chain.yml/dispatches" \
            -f ref=fix/fa419-lsp-fixed-chain-20260809

      - name: Upload complete LSP and CLI evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass419-lsp-fixed-round-${{ steps.round.outputs.round }}-${{ github.run_id }}
          path: |
            build-logs/fa419-lsp-fixed
            build-logs/fa418-lsp-strict
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final two-pass result
        if: always()
        env:
          COMPLETE: ${{ steps.status.outputs.complete }}
        shell: bash
        run: |
          test "${COMPLETE:-false}" = true
