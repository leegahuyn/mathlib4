name: Codex FA probe CLM sum coercion v2
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-probe-clm-sum-coe-v2.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile explicit equality probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/CLMSumProbe2.lean <<'LEAN'
          import Mathlib
          noncomputable section
          open scoped BigOperators
          variable {H E : Type*}
          variable [NormedAddCommGroup H] [NormedSpace ℂ H]
          variable [NormedAddCommGroup E] [NormedSpace ℂ E]
          example {J : Type*} [Fintype J] (f : J → H →L[ℂ] E)
              (h : IsCompactOperator (∑ j, (⇑(f j) : H → E))) :
              IsCompactOperator ⇑(∑ j, f j) := by
            have hfun :
                (⇑(∑ j, f j) : H → E) =
                  ∑ j, (⇑(f j) : H → E) := by
              funext x
              simp
            rw [hfun]
            exact h
          end
          LEAN
          lake env lean /tmp/CLMSumProbe2.lean | tee /tmp/clm-sum-probe2.log
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-clm-sum-coe-v2-${{ github.sha }}
          path: /tmp/clm-sum-probe2.log
          retention-days: 14
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Attest patch and direct compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash scripts/codex_fa_after3455_clm_sum_v1.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3455-clm-sum-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3455-clm-sum-v1
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3455-clm-sum-v1/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3455-clm-sum-v1/Mock2_FunctionalAnalysis.exit)"
