name: Adaptive FA frontier after focused failure

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'build-logs/current-advanced-fa-qym-v2-failure.txt'
      - '.github/workflows/adaptive-fa-frontier-after-v2-failure-20260807.yml'
      - 'scripts/adaptive_fa_frontier_repair_20260807.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: adaptive-fa-frontier-after-v2-failure
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      BRANCH: ci/fa319-isolated-20260807
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/adaptive-fa-frontier

    steps:
      - name: Checkout exact PR 9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 1
          persist-credentials: true

      - name: Recover the failed focused candidate source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          result='build-logs/current-advanced-fa-qym-v2-failure.txt'
          test -s "${result}"
          run_id="$(sed -n 's/^run_id=//p' "${result}" | head -1)"
          test -n "${run_id}"
          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("current-advanced-fa-qym-v2-")) | .id' \
            | head -1)"
          test -n "${artifact_id}"
          rm -rf /tmp/v2-failed.zip /tmp/v2-failed
          mkdir -p /tmp/v2-failed "${EVIDENCE}"
          gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
            > /tmp/v2-failed.zip
          unzip -q /tmp/v2-failed.zip -d /tmp/v2-failed
          candidate="$(find /tmp/v2-failed/source -maxdepth 1 -type f \
            \( -name 'Mock2_FunctionalAnalysis.pass320-candidate.lean' \
               -o -name 'Mock2_FunctionalAnalysis.pass319.lean' \
               -o -name 'Mock2_FunctionalAnalysis.*candidate*.lean' \) \
            | sort | tail -1)"
          test -n "${candidate}"
          cp "${candidate}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "${candidate}" "${EVIDENCE}/input-candidate.lean"
          git diff --check
          printf '%s\n' "source_run_id=${run_id}" "artifact_id=${artifact_id}" \
            "candidate=${candidate}" "start_head=$(git rev-parse HEAD)" \
            > "${EVIDENCE}/provenance.txt"

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Compile verified dependencies and transactionally advance FA frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p "${OUTDIR}"
          compile_dependency() {
            local module="$1" log="${EVIDENCE}/${1}-dependency.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            lake env lean -DmaxErrors=1000 "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            ! grep -Eqi "error:|maximum number of errors|sorryAx|declaration uses 'sorry'" "${log}"
          }
          compile_dependency Mock2
          compile_dependency Mock2_Advanced
          set +e
          python3 scripts/adaptive_fa_frontier_repair_20260807.py --max-iterations 24 \
            > "${EVIDENCE}/adaptive-driver.log" 2>&1
          adaptive_code=$?
          set -e
          echo "adaptive_exit=${adaptive_code}" | tee "${EVIDENCE}/adaptive-exit.txt"
          exit "${adaptive_code}"

      - name: Audit repaired source and compile FA Integrated Mock3 QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 - <<'PY' | tee "${EVIDENCE}/forbidden-token-audit.txt"
          from pathlib import Path
          import re
          paths=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
                 Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
                 Path('PrimalitySheafVerification/QYM.lean')]
          if Path('PrimalitySheafVerification/Mock3.lean').exists():
              paths.append(Path('PrimalitySheafVerification/Mock3.lean'))
          def strip(src):
              out=[]; i=0; depth=0; string=False; esc=False
              while i < len(src):
                  if depth:
                      if src.startswith('/-',i): depth+=1; out+=[' ',' ']; i+=2
                      elif src.startswith('-/',i): depth-=1; out+=[' ',' ']; i+=2
                      else: out.append('\n' if src[i]=='\n' else ' '); i+=1
                  elif string:
                      c=src[i]; out.append('\n' if c=='\n' else ' ')
                      if esc: esc=False
                      elif c=='\\': esc=True
                      elif c=='"': string=False
                      i+=1
                  elif src.startswith('/-',i): depth=1; out+=[' ',' ']; i+=2
                  elif src.startswith('--',i):
                      while i<len(src) and src[i]!='\n': out.append(' '); i+=1
                  elif src[i]=='"': string=True; out.append(' '); i+=1
                  else: out.append(src[i]); i+=1
              if depth or string: raise SystemExit('unterminated comment/string')
              return ''.join(out)
          checks={'sorry':r'\bsorry\b','admit':r'\badmit\b',
                  'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
                  'native_decide':r'\bnative_decide\b',
                  'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for path in paths:
              code=strip(path.read_text(encoding='utf-8')); print(f'[{path}]')
              for name,pat in checks.items():
                  n=len(re.findall(pat,code)); print(f'{name}={n}'); bad |= n != 0
          if bad: raise SystemExit(1)
          PY
          printf '%s\n' 'module,pass,exit_code,error_count,warning_count' \
            > "${EVIDENCE}/compile-summary.csv"
          compile_one() {
            local module="$1" pass="$2" log code errors warnings
            log="${EVIDENCE}/${module}-${pass}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean -DmaxErrors=1000 "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              | tee -a "${EVIDENCE}/compile-summary.csv"
            test "${code}" -eq 0
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'" "${log}"
          }
          for pass in 1 2; do
            compile_one Mock2_FunctionalAnalysis "${pass}"
            compile_one Mock2_FunctionalAnalysis_Integrated "${pass}"
            if [[ -f PrimalitySheafVerification/Mock3.lean ]]; then
              compile_one Mock3 "${pass}"
            fi
            compile_one QYM "${pass}"
          done

      - name: Materialize only a completely verified repaired FA source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          start_head="$(sed -n 's/^start_head=//p' "${EVIDENCE}/provenance.txt")"
          test "${remote_head}" = "${start_head}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(git diff --cached --name-only)" = \
            'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          git commit -m 'fix: advance and verify FunctionalAnalysis compiler frontier'
          git push origin "HEAD:${BRANCH}"

      - name: Record unresolved frontier without committing partial source
        if: failure()
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          git restore --source=HEAD --worktree -- \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || true
          mkdir -p build-logs
          result='build-logs/adaptive-fa-frontier-latest.txt'
          printf '%s\n' "head=$(git rev-parse HEAD)" "recorded_utc=$(date -u +%FT%TZ)" \
            > "${result}"
          for item in adaptive-exit.txt final-frontier.json repair-history.json candidate.patch; do
            if [[ -f "${EVIDENCE}/${item}" ]]; then
              echo "--- ${item} ---" >> "${result}"
              sed -n '1,500p' "${EVIDENCE}/${item}" >> "${result}"
            fi
          done
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${result}"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record unresolved FunctionalAnalysis frontier'
          git pull --rebase origin "${BRANCH}"
          git push origin "HEAD:${BRANCH}"

      - name: Upload adaptive evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-fa-frontier-${{ github.sha }}
          path: /tmp/adaptive-fa-frontier
          if-no-files-found: warn
          retention-days: 30
