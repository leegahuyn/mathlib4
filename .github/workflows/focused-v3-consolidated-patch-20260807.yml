name: Consolidated focused v3 patch agent

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-v3-consolidated-patch-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidated-focused-v3-patch
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Apply all focused v3 patches to latest branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5 6; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            python3 scripts/apply_all_focused_v3_patches_20260807.py
            git diff --check
            bash -n scripts/focused_materialize_pipeline_20260807.sh
            bash -n scripts/focused_direct_verify_20260807.sh
            python3 -m py_compile \
              scripts/focused_source_audit_20260807.py \
              scripts/generate_focused_axiom_audit_20260807.py
            if git diff --quiet; then
              echo 'All focused v3 patches are present.'
              exit 0
            fi
            git add \
              scripts/focused_materialize_pipeline_20260807.sh \
              .github/workflows/focused-candidate-pipeline-v3-20260807.yml \
              .github/workflows/focused-direct-source-v3-20260807.yml \
              .github/workflows/focused-v3-preflight-20260807.yml
            git commit -m 'ci: consolidate focused v3 execution fixes'
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            sleep $((attempt * 3))
          done
          exit 1
