name: Final Authority PR Observable Broad Gate v1

on:
  pull_request:
    branches:
      - gpt/final-authority-gb0-canonical-20260820
    paths:
      - .github/workflows/final-authority-pr-observable-v1.yml
      - .github/workflows/final-authority-mass-repair-v3.yml
      - scripts/final_authority_gate.py
      - scripts/final_authority_gate_v2.py
      - scripts/final_authority_gate_v3.py
      - scripts/final13_r5_patch_mock1_advanced_six.py
      - PrimalitySheafVerification/Mock1_Advanced.lean
      - PrimalitySheafVerification/Mock3.lean
      - PrimalitySheafVerification/BuildAll.lean
  workflow_dispatch:

concurrency:
  group: final-authority-pr-observable-v1-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  actual-lean-broad-gate:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'gpt/final13-m1a-native-clean-six-candidate-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout exact PR head, not synthetic merge
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Establish exact local authority branch and verify frozen identities
        shell: bash
        run: |
          set -euo pipefail
          git switch -C gpt/final-authority-mass-repair-v3-20260820
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = \
            "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = \
            "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = \
            "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = \
            "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = \
            "da99c78fdc2f6f894b55dd79af1438fa2d51a1b6"
          test "$(sha256sum PrimalitySheafVerification/Mock1_Advanced.lean | awk '{print $1}')" = \
            "d2cf9f101e04d58e0fd87e62d1f102b8eb910d4cc5e3e9d2b903e5c7df0f98f2"

      - name: Apply all six M1A residual repairs as one cumulative worktree
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .pr_observable
          python3 scripts/final13_r5_patch_mock1_advanced_six.py \
            hrange-rfl-norm \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            .pr_observable/Mock1_Advanced.patched.lean \
            | tee .pr_observable/M1A_PATCH_RESULT.txt
          mv .pr_observable/Mock1_Advanced.patched.lean \
            PrimalitySheafVerification/Mock1_Advanced.lean
          sha256sum PrimalitySheafVerification/Mock1_Advanced.lean \
            | tee .pr_observable/M1A_PATCHED_SHA256.txt
          git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean \
            | tee .pr_observable/M1A_PATCHED_GIT_BLOB.txt
          ! grep -nE '\b(sorry|admit|native_decide)\b|set_option[[:space:]]+maxHeartbeats[[:space:]]+0' \
            PrimalitySheafVerification/Mock1_Advanced.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .pr_observable/LEAN_VERSION.txt
          lake --version | tee .pr_observable/LAKE_VERSION.txt

      - name: Run Mock3 then non-stopping Final13 broad sweep and downstream gates
        id: authority
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          python3 scripts/final_authority_gate_v3.py \
            2>&1 | tee .pr_observable/final_authority_pr_observable_v1.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" | tee .pr_observable/FINAL_AUTHORITY_GATE_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Surface all collected errors and exact frontier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          echo "=== MOCK3 ==="
          cat .final_authority/MOCK3_CANONICAL_RESULT.json 2>/dev/null || true
          echo "=== FINAL13 DIAGNOSTIC SWEEP ==="
          cat .final_authority/FINAL13_DIAGNOSTIC_SWEEP.json 2>/dev/null || true
          echo "=== FINAL13 BUILD RESULTS ==="
          cat .final_authority/FINAL_13_BUILD_RESULTS.json 2>/dev/null || true
          echo "=== BUILDALL ==="
          cat .final_authority/BUILDALL_RESULT.json 2>/dev/null || true
          echo "=== FORBIDDEN BY FILE ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.final_authority/FORBIDDEN_AUDIT.json')
          if p.exists():
              data = json.loads(p.read_text())
              print('forbidden_count=', data.get('forbidden_count'))
              for row in data.get('files', []):
                  total = sum(row.get('forbidden', {}).values())
                  if total:
                      print(row['path'], total, row['forbidden'])
          PY
          echo "=== EXACT NON-PASS ROOTS ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.final_authority/FINAL_13_BUILD_RESULTS.json')
          if p.exists():
              data = json.loads(p.read_text())
              print('counts=', data.get('counts'))
              for row in data.get('results', []):
                  if row.get('pass') is not True:
                      print(json.dumps({k: row.get(k) for k in (
                          'path', 'status', 'exit', 'error_headers', 'warning_headers',
                          'panic_lines', 'first_error', 'blocker_declaration',
                          'all_error_headers', 'log_path'
                      )}, ensure_ascii=False))
          PY

      - name: Upload all actual-Lean evidence, including hidden directory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-pr-observable-v1-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .pr_observable
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Enforce final authority only after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .pr_observable/FINAL_AUTHORITY_GATE_EXIT.txt
          test "$(cat .pr_observable/FINAL_AUTHORITY_GATE_EXIT.txt)" = "0"
