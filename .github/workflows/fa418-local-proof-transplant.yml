name: FA418 strict local proof transplant from PASS376 champion

on:
  push:
    branches:
      - ops/fa418-local-proof-transplant-20260809
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ACTIVE_BRANCH: 'ops/fa418-local-proof-transplant-20260809'
  ARTIFACT_ID: '9024606745'
  EXPECTED_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  PASS376_HEAD: '71227bd1ba88c99f9a535df044fd37041bcf2304'
  BASE_CHAMPION_BRANCH: 'champion/fa-pass376-31725-07f6efd-20260809'

jobs:
  transplant-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout FA418 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fa418-local-proof-transplant-20260809
          fetch-depth: 2200
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Restore exact PASS376 artifact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fa418-artifact /tmp/fa418.zip
          mkdir -p /tmp/fa418-artifact
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/fa418.zip
          unzip -q /tmp/fa418.zip -d /tmp/fa418-artifact
          mapfile -d '' files < <(find /tmp/fa418-artifact -type f -name 'Mock2_FunctionalAnalysis.lean' -print0)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" /tmp/fa418-baseline.lean
          actual=$(sha256sum /tmp/fa418-baseline.lean | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          cp /tmp/fa418-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

      - name: Ensure immutable checked-in baseline champion exists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BASE_CHAMPION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BASE_CHAMPION_BRANCH"
            git show "FETCH_HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" > /tmp/fa418-existing-champion.lean
            actual=$(sha256sum /tmp/fa418-existing-champion.lean | awk '{print $1}')
            test "$actual" = "$EXPECTED_SHA256"
          else
            git switch --detach "$PASS376_HEAD"
            git switch -c "$BASE_CHAMPION_BRANCH"
            cp /tmp/fa418-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            mkdir -p champion-records/fa-pass376-31725
            cat > champion-records/fa-pass376-31725/FA418-BASELINE.json <<'EOF'
          {
            "source_sha256": "07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4",
            "origin_run_id": 31267332510,
            "origin_artifact_id": 9024606745,
            "first_error_frontier": 31725,
            "authority": "direct Lean compile metric"
          }
          EOF
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              champion-records/fa-pass376-31725/FA418-BASELINE.json
            git commit -m 'chore: check in FA418 PASS376 baseline champion [skip ci]'
            git push origin "HEAD:refs/heads/${BASE_CHAMPION_BRANCH}"
          fi
          git switch -f "$ACTIVE_BRANCH"
          cp /tmp/fa418-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"

      - name: Run same-signature line-stable proof transplant tournament
        id: transplant
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa418_local_proof_transplant.py
          rc=$?
          export TRANSPLANT_RC="$rc"
          if test -f build-logs/fa418-local-proof-transplant/RESULT.json; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          r=json.loads(Path('build-logs/fa418-local-proof-transplant/RESULT.json').read_text())
          m=r.get('final_metric', {})
          print('strictly_improved=' + ('1' if r.get('strictly_improved') else '0'))
          print('final_passed=' + ('1' if r.get('final_passed') else '0'))
          print('final_sha256=' + str(r.get('final_sha256','')))
          print('final_first_error=' + str(m.get('first_error_line',0)))
          print('transplant_rc=' + os.environ['TRANSPLANT_RC'])
          PY
          else
            echo 'strictly_improved=0' >> "$GITHUB_OUTPUT"
            echo 'final_passed=0' >> "$GITHUB_OUTPUT"
            echo 'final_sha256=' >> "$GITHUB_OUTPUT"
            echo 'final_first_error=0' >> "$GITHUB_OUTPUT"
            echo "transplant_rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run fresh authoritative ordered 2x gate if FA reaches exit 0
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa418-ordered-final-gate
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          if test "${{ steps.transplant.outputs.final_passed }}" != '1'; then
            printf 'FA did not reach exit 0; ordered final gate not entered\n' > "$d/NOT_ENTERED.txt"
            echo 'final_exit=125' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          cp build-logs/fa418-local-proof-transplant/PROMOTED_SOURCE.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          if test "$actual" != "${{ steps.transplant.outputs.final_sha256 }}"; then
            printf 'promoted source SHA mismatch\n' > "$d/HASH_FAILURE.txt"
            echo 'final_exit=124' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if git diff -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | \
             grep '^+' | grep -Ev '^\+\+\+' | \
             grep -E '\b(sorry|admit|native_decide|unsafe|axiom)\b' >/dev/null; then
            printf 'prohibited proof-bypass addition detected\n' > "$d/AUDIT_FAILURE.txt"
            echo 'final_exit=123' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compile_one() {
            local stem=$1
            local run=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=1600 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}-run${run}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then return 0; fi
            return 1
          }

          final=1
          compile_one Mock2 1; rc_m2=$?
          compile_one Mock2_Advanced 1; rc_m2a=$?
          rc_fa1=125; rc_fa2=125; rc_int1=125; rc_int2=125
          rc_mock3=125; rc_qym1=125; rc_qym2=125

          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1; rc_fa1=$?
            if test "$rc_fa1" -eq 0; then
              compile_one Mock2_FunctionalAnalysis 2; rc_fa2=$?
            fi
          fi
          if test "$rc_fa2" -eq 0; then
            if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
              compile_one Mock2_FunctionalAnalysis_Integrated 1; rc_int1=$?
              if test "$rc_int1" -eq 0; then
                compile_one Mock2_FunctionalAnalysis_Integrated 2; rc_int2=$?
              fi
            else
              rc_int1=126; rc_int2=126
              printf 'required Integrated source missing\n' > "$d/Integrated_MISSING.txt"
            fi
          fi
          if test "$rc_int2" -eq 0; then
            shopt -s nullglob
            mock3_sources=(PrimalitySheafVerification/Mock3*.lean)
            if test "${#mock3_sources[@]}" -eq 0; then
              rc_mock3=126
              printf 'required Mock3 source missing\n' > "$d/Mock3_MISSING.txt"
            else
              rc_mock3=0
              for src in "${mock3_sources[@]}"; do
                stem=$(basename "$src" .lean)
                compile_one "$stem" 1; r1=$?
                r2=125
                if test "$r1" -eq 0; then compile_one "$stem" 2; r2=$?; fi
                if test "$r1" -ne 0 || test "$r2" -ne 0; then rc_mock3=1; fi
              done
            fi
          fi
          if test "$rc_int2" -eq 0 && test "$rc_mock3" -eq 0; then
            if test -f PrimalitySheafVerification/QYM.lean; then
              compile_one QYM 1; rc_qym1=$?
              if test "$rc_qym1" -eq 0; then compile_one QYM 2; rc_qym2=$?; fi
            else
              rc_qym1=126; rc_qym2=126
              printf 'required QYM source missing\n' > "$d/QYM_MISSING.txt"
            fi
          fi
          if test "$rc_fa1" -eq 0 && test "$rc_fa2" -eq 0 && \
             test "$rc_int1" -eq 0 && test "$rc_int2" -eq 0 && \
             test "$rc_mock3" -eq 0 && test "$rc_qym1" -eq 0 && test "$rc_qym2" -eq 0; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA1="$rc_fa1" RC_FA2="$rc_fa2"
          export RC_INT1="$rc_int1" RC_INT2="$rc_int2" RC_MOCK3="$rc_mock3"
          export RC_QYM1="$rc_qym1" RC_QYM2="$rc_qym2" FINAL="$final"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          d=Path('build-logs/fa418-ordered-final-gate')
          pat=re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          rows={}
          for p in sorted(d.glob('*-run*.log')):
              text=p.read_text(encoding='utf-8',errors='replace')
              ms=list(pat.finditer(text)); ep=p.with_suffix('.exit')
              rows[p.stem]={
                  'exit_code':int(ep.read_text()) if ep.exists() else 999,
                  'errors':len(ms),
                  'first_line':int(ms[0].group(1)) if ms else 0,
                  'first_col':int(ms[0].group(2)) if ms else 0,
              }
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          status={
              'complete':os.environ['FINAL']=='0' and (d/'ALL_REQUIRED_TARGETS_2X_PASS').exists(),
              'fa_source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'summary_exit':{
                  'Mock2':int(os.environ['RC_M2']), 'Mock2_Advanced':int(os.environ['RC_M2A']),
                  'FA_run1':int(os.environ['RC_FA1']), 'FA_run2':int(os.environ['RC_FA2']),
                  'Integrated_run1':int(os.environ['RC_INT1']), 'Integrated_run2':int(os.environ['RC_INT2']),
                  'Mock3_all_2x':int(os.environ['RC_MOCK3']),
                  'QYM_run1':int(os.environ['RC_QYM1']), 'QYM_run2':int(os.environ['RC_QYM2']),
              },
              'runs':rows,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze promotion payload
        if: steps.transplant.outputs.strictly_improved == '1'
        shell: bash
        run: |
          set -euo pipefail
          cp build-logs/fa418-local-proof-transplant/PROMOTED_SOURCE.lean /tmp/fa418-promoted.lean
          cp build-logs/fa418-local-proof-transplant/RESULT.json /tmp/fa418-result.json
          if test -f build-logs/fa418-ordered-final-gate/CURRENT.json; then
            cp build-logs/fa418-ordered-final-gate/CURRENT.json /tmp/fa418-gate.json
          fi
          if test -f build-logs/fa418-ordered-final-gate/ALL_REQUIRED_TARGETS_2X_PASS; then
            touch /tmp/fa418-all-2x-pass
          fi

      - name: Preserve evidence and restore controller source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || true
          git add build-logs/fa418-local-proof-transplant \
            build-logs/fa418-ordered-final-gate
          if ! git diff --cached --quiet; then
            git commit -m 'ci: preserve FA418 proof-transplant evidence [skip ci]'
            git push origin "HEAD:refs/heads/${ACTIVE_BRANCH}"
          fi

      - name: Check in immutable champion only for strict improvement
        if: steps.transplant.outputs.strictly_improved == '1'
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum /tmp/fa418-promoted.lean | awk '{print $1}')
          test "$actual" = "${{ steps.transplant.outputs.final_sha256 }}"
          short=${actual:0:12}
          if test -f /tmp/fa418-all-2x-pass; then label=final-2x; else label="frontier-${{ steps.transplant.outputs.final_first_error }}"; fi
          champion="champion/fa418-${label}-${short}-20260809"
          if git ls-remote --exit-code --heads origin "$champion" >/dev/null 2>&1; then
            echo "refusing to overwrite immutable branch $champion" >&2
            exit 61
          fi
          git fetch origin "$BASE_CHAMPION_BRANCH"
          git switch --detach "origin/$BASE_CHAMPION_BRANCH"
          git switch -c "$champion"
          cp /tmp/fa418-promoted.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p champion-records/fa-promotions
          cp /tmp/fa418-result.json "champion-records/fa-promotions/fa418-${label}-${short}.json"
          if test -f /tmp/fa418-gate.json; then
            cp /tmp/fa418-gate.json "champion-records/fa-promotions/fa418-${label}-${short}-gate.json"
          fi
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean champion-records/fa-promotions
          git commit -m "chore: check in FA418 ${label} champion [skip ci]"
          git push origin "HEAD:refs/heads/${champion}"
          echo "champion_branch=$champion" >> "$GITHUB_OUTPUT"

      - name: Upload FA418 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa418-proof-transplant-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa418-local-proof-transplant
            build-logs/fa418-ordered-final-gate
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce authoritative outcomes
        if: always()
        env:
          TRANSPLANT_RC: ${{ steps.transplant.outputs.transplant_rc }}
          FINAL_PASSED: ${{ steps.transplant.outputs.final_passed }}
          GATE_EXIT: ${{ steps.gate.outputs.final_exit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${TRANSPLANT_RC:-1}" = '0'
          if test "${FINAL_PASSED:-0}" = '1'; then test "${GATE_EXIT:-1}" = '0'; fi
