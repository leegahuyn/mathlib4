name: Codex FA frontier e7d8 3105-3127 fast1 v3
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-frontier-e7d8-3105-3127-fast1-v3.yml]
  workflow_dispatch:
permissions: {actions: read, contents: read, statuses: write}
env:
  BASE_RUN_ID: "31525695224"
  BASE_JOB_ID: "93893336738"
  BASE_HEAD_SHA: "b196ec48ce9c864a653420e6b65b29331becb5da"
  BASE_ARTIFACT_ID: "9115520782"
  BASE_ARTIFACT_DIGEST: "sha256:a91a876a6f42ae997a595ad12d1ac9869a5ba1e2992b3c2a355f30f7e062cef8"
  BASE_SOURCE_SHA256: "e7d8ab6e4b01717bcefa85bcc1e6ffaa857b11517404d0e46274026755c22c20"
  BASE_SOURCE_BYTES: "2709034"
  BASE_SOURCE_LINES: "60732"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact e7d idx3105 source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3; mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" >"$OUT/job.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip; test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"; unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3'); r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          if not(r.get('status')=='completed' and r.get('conclusion')=='failure' and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and j.get('status')=='completed' and j.get('conclusion')=='failure' and m.get('Mock2_exit')==0 and m.get('Mock2_Advanced_exit')==0 and m.get('FA_exit')==1 and m.get('all_required_lean_executed') is True and m.get('FA_error_declaration_index')==3105 and m.get('source_sha256')==os.environ['BASE_SOURCE_SHA256']): raise SystemExit('base gate failed')
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' in p.as_posix():
              b=p.read_bytes()
              if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']):hits.append(p)
          if not hits:raise SystemExit('source missing')
          (out/'BASE_SOURCE.txt').write_text(str(min(hits,key=lambda q:(len(q.parts),q.as_posix())).resolve())+'\n')
          PY
      - name: Apply unique corrected repairs through idx3127
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3; base="$(cat "$OUT/BASE_SOURCE.txt")"
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_env_intrinsic_scopes_v2.json --target /tmp/a.lean --audit-out "$OUT/A0.json"; base=/tmp/a.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_cluster_3105_3114_strict_v2.json --no-environment --target /tmp/b.lean --audit-out "$OUT/A1.json"; base=/tmp/b.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_idx3105_chart_action_v1.json --no-environment --target /tmp/c.lean --audit-out "$OUT/A2.json"; base=/tmp/c.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_idx3106_ofreal_contdiff_followup_v1.json --no-environment --target /tmp/d.lean --audit-out "$OUT/A3.json"; base=/tmp/d.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_cluster_3118_3121_unique_v2.json --no-environment --target /tmp/e.lean --audit-out "$OUT/A4.json"; base=/tmp/e.lean
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library scripts/fa_dynamic_cluster_3125_3127_extendofnorm_v2.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/A5.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,hashlib,os
          out=Path('build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3'); A=[json.loads((out/f'A{i}.json').read_text()) for i in range(6)]
          if not A[0].get('environment_replacements_applied'):raise SystemExit('environment no-op')
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed'] for a in A):raise SystemExit('audit fail')
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');b=p.read_bytes();sha=hashlib.sha256(b).hexdigest();
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f'CANDIDATE_SHA={sha}\nCANDIDATE_BYTES={len(b)}\n')
          (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps({'sha256':sha,'bytes':len(b),'lines':len(b.decode().splitlines())},indent=2)+'\n')
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3; curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh; sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1; export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1; lake exe cache get >"$OUT/cache.log" 2>&1; lean --version >"$OUT/lean-version.txt"
      - name: Direct full-source first-frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean">"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}; one Mock2; one Mock2_Advanced; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import json,hashlib,os,re
          out=Path('build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};first=es[0] if es else {};b=p.read_bytes();metric={'schema':'fa-frontier-e7d8-3105-3127-fast1-v3','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_declaration':first.get('declaration'),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':1};(out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >>"$GITHUB_OUTPUT"; exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-e7d8-3105-3127-fast1-v3-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-e7d8-3105-3127-fast1-v3
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
