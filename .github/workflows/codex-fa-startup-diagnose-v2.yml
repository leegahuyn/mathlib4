name: Codex FA startup diagnostics v2

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-startup-diagnose-v2.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  statuses: write
  contents: read

env:
  TARGET_SHA: "781b5d929cb9ae55280872391cb5315bc47ebe91"
  TARGET_RUN_ID: "31509106497"
  TARGET_CHECK_SUITE_ID: "85469420231"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Extract run logs and check suite
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -u
          OUT=build-logs/codex-fa-startup-diagnose-v2
          mkdir -p "$OUT/logs"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > "$OUT/run.json"
          gh api "repos/${GITHUB_REPOSITORY}/check-suites/${TARGET_CHECK_SUITE_ID}" > "$OUT/check-suite.json"
          gh api "repos/${GITHUB_REPOSITORY}/check-suites/${TARGET_CHECK_SUITE_ID}/check-runs?per_page=100" > "$OUT/check-suite-runs.json"

          set +e
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}/logs" > "$OUT/run-logs.zip" 2> "$OUT/run-logs.stderr"
          code=$?
          set -e
          printf '%s\n' "$code" > "$OUT/run-logs.exit"
          if [[ "$code" -eq 0 ]]; then
            unzip -l "$OUT/run-logs.zip" > "$OUT/run-logs-list.txt" 2>&1 || true
            unzip -q "$OUT/run-logs.zip" -d "$OUT/logs" 2> "$OUT/unzip.stderr" || true
            find "$OUT/logs" -type f -maxdepth 5 -print > "$OUT/log-files.txt" || true
            for f in "$OUT"/logs/*; do
              [[ -f "$f" ]] || continue
              { echo "===== $f ====="; cat "$f"; } >> "$OUT/combined-logs.txt"
            done
          fi

          python3 - <<'PY'
          from pathlib import Path
          import json
          out=Path('build-logs/codex-fa-startup-diagnose-v2')
          run=json.loads((out/'run.json').read_text())
          suite=json.loads((out/'check-suite.json').read_text())
          runs=json.loads((out/'check-suite-runs.json').read_text())
          summary={
            'run': {k:run.get(k) for k in ('id','name','path','event','status','conclusion','head_sha','created_at','updated_at','check_suite_id')},
            'check_suite': {k:suite.get(k) for k in ('id','status','conclusion','latest_check_runs_count','head_sha','before_sha','after_sha')},
            'check_runs': [
              {k:r.get(k) for k in ('id','name','status','conclusion','details_url','started_at','completed_at','output')}
              for r in runs.get('check_runs',[])
            ],
            'run_logs_exit': (out/'run-logs.exit').read_text().strip(),
          }
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload startup diagnostics v2
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-startup-diagnose-v2-${{ github.sha }}
          path: build-logs/codex-fa-startup-diagnose-v2
          if-no-files-found: error
          retention-days: 30

      - name: Publish diagnostic locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='codex/fa-startup-diagnostic-v2' \
            -f description="startup diagnostic v2 run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
