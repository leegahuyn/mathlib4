name: PASS 388 declaration-splice FA solver

on:
  push:
    branches:
      - fix/fa388-declaration-splice-20260809
    paths:
      - '.github/workflows/fa388-declaration-splice.yml'
      - 'scripts/fa388_declaration_splice_solver.py'
      - 'scripts/fa383_parallel_solver.py'
      - 'scripts/fa383_select_and_verify.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

jobs:
  splice-solve:
    name: splice-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: gpt5
            primary_model: openai/gpt-5
          - id: o3
            primary_model: openai/o3
          - id: gpt41
            primary_model: openai/gpt-4.1
          - id: grok3
            primary_model: xai/grok-3
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout latest PASS 388 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa388-declaration-splice-20260809
          fetch-depth: 2500
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run declaration-splice solver ${{ matrix.id }}
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          out="/tmp/fa388-${{ matrix.id }}"
          python3 scripts/fa388_declaration_splice_solver.py \
            --primary-model '${{ matrix.primary_model }}' \
            --output-dir "${out}" \
            --max-frontiers 12 \
            --max-revisions 5 \
            > "${out}-console.log" 2>&1
          rc=$?
          set -e
          mkdir -p "${out}"
          cp "${out}-console.log" "${out}/console.log"
          cat "${out}/console.log"
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Finalize declaration candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/fa388-${{ matrix.id }}"
          test -s "${out}/best-source.lean"
          test -s "${out}/best-metric.json"
          test -s "${out}/state.json"
          sha256sum "${out}/best-source.lean" > "${out}/best-source.sha256"
          {
            echo "id=${{ matrix.id }}"
            echo "primary_model=${{ matrix.primary_model }}"
            echo "solver_exit_code=${{ steps.solver.outputs.exit_code }}"
            cat "${out}/best-metric.json"
            cat "${out}/state.json"
          } > "${out}/solver-summary.txt"

      - name: Upload declaration candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa388-candidate-${{ matrix.id }}-${{ github.sha }}
          path: /tmp/fa388-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  select-and-verify:
    name: select-splice-winner-and-verify-order
    needs: splice-solve
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 388 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa388-declaration-splice-20260809
          fetch-depth: 2600
          persist-credentials: true

      - name: Download all declaration candidates
        uses: actions/download-artifact@v4
        with:
          pattern: fa388-candidate-*
          path: /tmp/fa388-candidates
          merge-multiple: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Select winner and verify all required targets twice
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA383_VERIFY_MODELS: 'openai/gpt-5,openai/o3,openai/o4-mini,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa388-aggregate
          mkdir -p build-logs/fa388-aggregate
          python3 scripts/fa383_select_and_verify.py \
            --candidates-root /tmp/fa388-candidates \
            --evidence-dir build-logs/fa388-aggregate \
            > build-logs/fa388-aggregate/console.log 2>&1
          rc=$?
          set -e
          cat build-logs/fa388-aggregate/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Generate authoritative PASS 388 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa388-aggregate
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('build-logs/fa388-aggregate');p=d/'FINAL_STATUS.json'
          s=json.loads(p.read_text()) if p.exists() else {'complete':False,'stage':'missing-final-status'}
          marker=(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists();s['verify_exit_code']='${{ steps.verify.outputs.exit_code }}';s['marker_exists']=marker;s['authoritative_complete']=bool(s.get('complete') and marker and s['verify_exit_code']=='0')
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          s['sources']={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in targets if x.exists()}
          (d/'AUTHORITATIVE_STATUS.json').write_text(json.dumps(s,indent=2))
          lines=[f"authoritative_complete={str(s['authoritative_complete']).lower()}",f"verify_exit_code={s['verify_exit_code']}",f"stage={s.get('stage')}",f"marker_exists={str(marker).lower()}"]
          if s.get('metric') is not None:lines.append(f"metric={json.dumps(s['metric'],sort_keys=True)}")
          for m in s.get('modules',[]):lines.append(f"{m.get('module')}={m.get('status')} sha256={m.get('source_sha256')}")
          (d/'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat "${d}/AUTHORITATIVE_STATUS.txt"

      - name: Audit all required target files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*(?:public\s+)?axiom\b','unsafe':r'(?m)^\s*unsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          def strip(t):
            o=[];i=0;d=0;s=False;e=False
            while i<len(t):
              if d:
                if t.startswith('/-',i):d+=1;o.extend('  ');i+=2;continue
                if t.startswith('-/',i):d-=1;o.extend('  ');i+=2;continue
                o.append('\n' if t[i]=='\n' else ' ');i+=1;continue
              if s:
                c=t[i];o.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1;continue
              if t.startswith('/-',i):d=1;o.extend('  ');i+=2;continue
              if t.startswith('--',i):
                while i<len(t) and t[i]!='\n':o.append(' ');i+=1
                continue
              if t[i]=='"':s=True;o.append(' ');i+=1;continue
              o.append(t[i]);i+=1
            return ''.join(o)
          report={}
          for p in targets:
            if p.exists():
              c=strip(p.read_text());report[str(p)]={k:len(re.findall(v,c)) for k,v in pats.items()}
          Path('build-logs/fa388-aggregate/FORBIDDEN_TOKEN_AUDIT.json').write_text(json.dumps(report,indent=2));bad={p:c for p,c in report.items() if any(c.values())}
          if bad:raise SystemExit(bad)
          PY

      - name: Commit isolated PASS 388 state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean;do test -e "${p}"&&git add "${p}";done
          git add build-logs/fa388-aggregate/AUTHORITATIVE_STATUS.json build-logs/fa388-aggregate/AUTHORITATIVE_STATUS.txt build-logs/fa388-aggregate/FORBIDDEN_TOKEN_AUDIT.json
          for p in build-logs/fa388-aggregate/ALL_REQUIRED_TARGETS_2X_PASS build-logs/fa388-aggregate/FINAL_STATUS.json build-logs/fa388-aggregate/fa-selection.json;do test -f "${p}"&&git add "${p}";done
          git diff --cached --quiet&&exit 0
          if test -f build-logs/fa388-aggregate/ALL_REQUIRED_TARGETS_2X_PASS;then msg='fix: obtain declaration-splice FA Integrated Mock3 QYM 2x PASS';else msg='fix: preserve best PASS 388 declaration frontier';fi
          git commit -m "${msg}";git push origin HEAD:fix/fa388-declaration-splice-20260809

      - name: Upload authoritative PASS 388 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa388-authoritative-${{ github.sha }}
          path: |
            build-logs/fa388-aggregate
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final PASS 388 result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${VERIFY_EXIT_CODE:-}"
          test -f build-logs/fa388-aggregate/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${VERIFY_EXIT_CODE}"
