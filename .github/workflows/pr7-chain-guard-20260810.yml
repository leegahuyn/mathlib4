name: PR7 guarded verified FA-chain integrator

on:
  push:
    branches:
      - ops/pr7-chain-guard-20260810
    paths:
      - pr7-guard-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  scan-reverify-integrate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      OPS_BRANCH: ops/pr7-chain-guard-20260810
      PR_BRANCH: fix/primality-sheaf-clean-build

    steps:
      - name: Checkout guarded integrator
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/pr7-chain-guard-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Allow direct solver branches to publish complete evidence
        shell: bash
        run: sleep 300

      - name: Fetch all plausible source-matched verified branches
        shell: bash
        run: |
          set -euo pipefail
          : > /tmp/pr7-guard-refs.txt
          : > /tmp/pr7-guard-branches.txt
          git ls-remote --heads origin \
            | awk '{print $2}' \
            | sed 's#refs/heads/##' \
            | grep -E '^(fix/fa42[3-9]|fix/fa4[3-9][0-9]|champion/fa-|ops/fa423-champion)' \
            | sort -u | tail -n 120 > /tmp/pr7-guard-branches.txt || true
          i=0
          while IFS= read -r branch; do
            test -n "$branch" || continue
            i=$((i+1))
            ref="refs/remotes/pr7guard/candidate-${i}"
            if git fetch --no-tags --depth=1 origin "+refs/heads/${branch}:${ref}" >/dev/null 2>&1; then
              echo "$ref" >> /tmp/pr7-guard-refs.txt
            fi
          done < /tmp/pr7-guard-branches.txt

      - name: Select only source-matched complete x2 evidence
        id: select
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pr7-selected
          mkdir -p /tmp/pr7-selected
          python3 scripts/pr7_select_verified_chain.py \
            --refs /tmp/pr7-guard-refs.txt \
            --output-dir /tmp/pr7-selected \
            --metadata /tmp/pr7-selection.json
          found=$(python3 -c "import json; print(str(json.load(open('/tmp/pr7-selection.json'))['found']).lower())")
          echo "found=$found" >> "$GITHUB_OUTPUT"

      - name: Prepare exact PR7 integration worktree
        if: ${{ steps.select.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin "+refs/heads/${PR_BRANCH}:refs/remotes/pr7guard/pr-head"
          rm -rf /tmp/pr7-integration
          git worktree add --detach /tmp/pr7-integration refs/remotes/pr7guard/pr-head
          git -C /tmp/pr7-integration switch -c pr7-guard-candidate
          while IFS= read -r -d '' file; do
            rel=${file#/tmp/pr7-selected/}
            mkdir -p "/tmp/pr7-integration/$(dirname "$rel")"
            cp "$file" "/tmp/pr7-integration/$rel"
          done < <(find /tmp/pr7-selected/PrimalitySheafVerification -type f -name '*.lean' -print0)
          git -C /tmp/pr7-integration diff --check

      - name: Install pinned Lean and Mathlib cache in the integration worktree
        if: ${{ steps.select.outputs.found == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          cd /tmp/pr7-integration
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/pr7-lean-version.txt
          lake --version | tee /tmp/pr7-lake-version.txt
          lake exe cache get | tee /tmp/pr7-cache-get.log

      - name: Reverify Mock2 FA Integrated Mock3 QYM in required order
        id: reverify
        if: ${{ steps.select.outputs.found == 'true' }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pr7-chain-evidence
          mkdir -p /tmp/pr7-chain-evidence
          python3 scripts/pr7_reverify_verified_chain.py \
            --worktree /tmp/pr7-integration \
            --output /tmp/pr7-chain-evidence
          rc=$?
          cp /tmp/pr7-selection.json /tmp/pr7-chain-evidence/SELECTION.json
          cp /tmp/pr7-lean-version.txt /tmp/pr7-chain-evidence/lean-version.txt
          cp /tmp/pr7-lake-version.txt /tmp/pr7-chain-evidence/lake-version.txt
          cp /tmp/pr7-cache-get.log /tmp/pr7-chain-evidence/cache-get.log
          if test "$rc" -eq 0; then complete=true; else complete=false; fi
          echo "complete=$complete" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit and fast-forward PR7 only after fresh complete reverify
        if: ${{ steps.reverify.outputs.complete == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          evidence=/tmp/pr7-integration/build-logs/pr7-verified-chain-integration
          mkdir -p "$evidence"
          cp /tmp/pr7-chain-evidence/CURRENT.json "$evidence/CURRENT.json"
          cp /tmp/pr7-chain-evidence/CURRENT.txt "$evidence/CURRENT.txt"
          cp /tmp/pr7-chain-evidence/SELECTION.json "$evidence/SELECTION.json"
          git -C /tmp/pr7-integration config user.name 'github-actions[bot]'
          git -C /tmp/pr7-integration config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C /tmp/pr7-integration add PrimalitySheafVerification build-logs/pr7-verified-chain-integration
          git -C /tmp/pr7-integration commit -m 'fix: integrate direct-verified FA Integrated Mock3 QYM x2 chain [skip ci]'
          current_remote=$(git ls-remote origin "refs/heads/${PR_BRANCH}" | awk '{print $1}')
          expected=$(git rev-parse refs/remotes/pr7guard/pr-head)
          test "$current_remote" = "$expected"
          git -C /tmp/pr7-integration push origin "HEAD:${PR_BRANCH}"

      - name: Record guard status and schedule bounded rescan when incomplete
        if: always()
        shell: bash
        env:
          FOUND: ${{ steps.select.outputs.found }}
          COMPLETE: ${{ steps.reverify.outputs.complete }}
        run: |
          set -euo pipefail
          cycle=$(python3 - <<'PY'
          import re
          from pathlib import Path
          text=Path('pr7-guard-requests/REQUESTED.txt').read_text() if Path('pr7-guard-requests/REQUESTED.txt').exists() else 'cycle=1'
          m=re.search(r'(?m)^cycle=(\d+)\s*$',text)
          print(int(m.group(1)) if m else 1)
          PY
          )
          mkdir -p guard-records/pr7-chain
          cp /tmp/pr7-selection.json guard-records/pr7-chain/SELECTION.json
          if test -d /tmp/pr7-chain-evidence; then
            cp /tmp/pr7-chain-evidence/CURRENT.json guard-records/pr7-chain/CURRENT.json || true
            cp /tmp/pr7-chain-evidence/CURRENT.txt guard-records/pr7-chain/CURRENT.txt || true
          fi
          if test "${COMPLETE:-false}" = true; then
            status=integrated
            msg='ci: record successful PR7 guarded chain integration [skip ci]'
          elif test "$cycle" -lt 12; then
            next=$((cycle+1))
            cat > pr7-guard-requests/REQUESTED.txt <<EOF
          cycle=${next}
          previous_found=${FOUND:-false}
          previous_complete=${COMPLETE:-false}
          authority=source-matched direct Lean CLI x2 evidence
          max_cycles=12
          EOF
            git add pr7-guard-requests/REQUESTED.txt
            status=rescan-scheduled
            msg="ci: continue PR7 guarded chain scan cycle ${next}"
          else
            status=bounded-scan-exhausted
            msg='ci: record bounded PR7 chain scan exhaustion [skip ci]'
          fi
          printf 'cycle=%s\nfound=%s\ncomplete=%s\nstatus=%s\n' \
            "$cycle" "${FOUND:-false}" "${COMPLETE:-false}" "$status" \
            > guard-records/pr7-chain/STATUS.txt
          git worktree remove --force /tmp/pr7-integration >/dev/null 2>&1 || true
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add guard-records/pr7-chain
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin HEAD:ops/pr7-chain-guard-20260810
          fi

      - name: Upload guarded integration evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr7-chain-guard-${{ github.run_id }}-${{ github.sha }}
          path: |
            guard-records/pr7-chain
            /tmp/pr7-chain-evidence
          if-no-files-found: warn
          retention-days: 90
