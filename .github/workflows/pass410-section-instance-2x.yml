name: PASS 410 section-instance repair and ordered 2x gate

on:
  push:
    branches:
      - fix/fa410-section-instance-20260809

permissions:
  contents: write

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact PASS 410 source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa410-section-instance-20260809
          fetch-depth: 1500
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply PASS 410 section-instance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa410_section_instance_repair.py

      - name: Compile ordered two-pass gate
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa410-section-instance
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          compile_one() {
            local stem=$1
            local run=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=500 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}-run${run}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          final=1

          compile_one Mock2 1
          rc_m2=$?
          compile_one Mock2_Advanced 1
          rc_m2a=$?

          rc_fa1=125
          rc_fa2=125
          rc_int1=125
          rc_int2=125
          rc_mock3=125
          rc_qym1=125
          rc_qym2=125

          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1
            rc_fa1=$?
          fi

          if test "$rc_fa1" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 2
            rc_fa2=$?
          fi

          if test "$rc_fa2" -eq 0; then
            if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
              compile_one Mock2_FunctionalAnalysis_Integrated 1
              rc_int1=$?
              if test "$rc_int1" -eq 0; then
                compile_one Mock2_FunctionalAnalysis_Integrated 2
                rc_int2=$?
              fi
            else
              rc_int1=126
              rc_int2=126
              printf 'required Integrated source missing\n' > "$d/Mock2_FunctionalAnalysis_Integrated-run1.log"
              printf '126' > "$d/Mock2_FunctionalAnalysis_Integrated-run1.exit"
            fi
          fi

          if test "$rc_int2" -eq 0; then
            shopt -s nullglob
            mock3_sources=(PrimalitySheafVerification/Mock3*.lean)
            if test "${#mock3_sources[@]}" -eq 0; then
              rc_mock3=126
              printf 'required Mock3 source missing\n' > "$d/Mock3-required.log"
            else
              rc_mock3=0
              for src in "${mock3_sources[@]}"; do
                stem=$(basename "$src" .lean)
                compile_one "$stem" 1
                r1=$?
                r2=125
                if test "$r1" -eq 0; then
                  compile_one "$stem" 2
                  r2=$?
                fi
                if test "$r1" -ne 0 || test "$r2" -ne 0; then
                  rc_mock3=1
                fi
              done
            fi
          fi

          if test "$rc_int2" -eq 0 && test "$rc_mock3" -eq 0; then
            if test -f PrimalitySheafVerification/QYM.lean; then
              compile_one QYM 1
              rc_qym1=$?
              if test "$rc_qym1" -eq 0; then
                compile_one QYM 2
                rc_qym2=$?
              fi
            else
              rc_qym1=126
              rc_qym2=126
              printf 'required QYM source missing\n' > "$d/QYM-run1.log"
              printf '126' > "$d/QYM-run1.exit"
            fi
          fi

          if test "$rc_fa1" -eq 0 && test "$rc_fa2" -eq 0 && \
             test "$rc_int1" -eq 0 && test "$rc_int2" -eq 0 && \
             test "$rc_mock3" -eq 0 && test "$rc_qym1" -eq 0 && test "$rc_qym2" -eq 0; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA1="$rc_fa1" RC_FA2="$rc_fa2"
          export RC_INT1="$rc_int1" RC_INT2="$rc_int2" RC_MOCK3="$rc_mock3"
          export RC_QYM1="$rc_qym1" RC_QYM2="$rc_qym2" FINAL="$final"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          d = Path('build-logs/fa410-section-instance')
          rows = {}
          pat = re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          for p in sorted(d.glob('*-run*.log')):
              text = p.read_text(encoding='utf-8', errors='replace')
              ms = list(pat.finditer(text))
              ep = p.with_suffix('.exit')
              rows[p.stem] = {
                  'exit_code': int(ep.read_text()) if ep.exists() else 999,
                  'errors': len(ms),
                  'first_line': int(ms[0].group(1)) if ms else 0,
                  'first_col': int(ms[0].group(2)) if ms else 0,
              }

          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          status = {
              'complete': os.environ['FINAL'] == '0' and (d / 'ALL_REQUIRED_TARGETS_2X_PASS').exists(),
              'stage': 'ordered FA Integrated Mock3 QYM 2x gate',
              'summary_exit': {
                  'Mock2': int(os.environ['RC_M2']),
                  'Mock2_Advanced': int(os.environ['RC_M2A']),
                  'FA_run1': int(os.environ['RC_FA1']),
                  'FA_run2': int(os.environ['RC_FA2']),
                  'Integrated_run1': int(os.environ['RC_INT1']),
                  'Integrated_run2': int(os.environ['RC_INT2']),
                  'Mock3_all_2x': int(os.environ['RC_MOCK3']),
                  'QYM_run1': int(os.environ['RC_QYM1']),
                  'QYM_run2': int(os.environ['RC_QYM2']),
              },
              'fa_source_sha256': hashlib.sha256(src.read_bytes()).hexdigest(),
              'runs': rows,
          }
          (d / 'CURRENT.json').write_text(json.dumps(status, indent=2), encoding='utf-8')
          (d / 'CURRENT.txt').write_text(
              '\n'.join(f"{k}: exit={v['exit_code']} errors={v['errors']} first={v['first_line']}:{v['first_col']}" for k, v in rows.items()) + '\n',
              encoding='utf-8')
          print(json.dumps(status, indent=2))
          PY

          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit PASS 410 repaired source and evidence
        shell: bash
        run: |
          set -euo pipefail
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa410-section-instance
          if ! git diff --cached --quiet; then
            if test -f build-logs/fa410-section-instance/ALL_REQUIRED_TARGETS_2X_PASS; then
              msg='fix: obtain PASS 410 FA Integrated Mock3 QYM 2x PASS'
            else
              msg='fix: preserve PASS 410 section-instance repair frontier'
            fi
            git commit -m "$msg [skip ci]"
            git push origin HEAD:fix/fa410-section-instance-20260809
          fi

      - name: Upload PASS 410 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa410-section-instance-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa410-section-instance
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce ordered two-pass result
        if: always()
        env:
          FINAL_EXIT: ${{ steps.gate.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
