name: Codex FA v38 finite-partition API resolution
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-v38-partition-api.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Resolve ContMDiff-to-ContDiff and function-sum shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          grep -R -n "contMDiff_iff_contDiff" Mathlib | head -30 | tee /tmp/grep-api.txt || true
          cat >/tmp/ProbePartPiece.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff
          variable {ι : Type*} {s : Set ℂ}
          example (ρ : SmoothPartitionOfUnity ι 𝓘(ℝ, ℂ) ℂ s) (i : ι) :
              ContDiff ℝ ∞ (ρ i : ℂ → ℝ) := by
            simpa only [contMDiff_iff_contDiff] using (ρ i).property
          LEAN
          cat >/tmp/ProbePartCompact.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          variable {ι : Type*}
          example (f : ι → ℂ → ℝ) (t : Finset ι)
              (hf : ∀ i, HasCompactSupport (f i)) :
              HasCompactSupport (fun w : ℂ => ∑ i ∈ t, f i w) := by
            classical
            induction t using Finset.induction_on with
            | empty => simp [HasCompactSupport]
            | @insert i t hi ih =>
                simp only [Finset.sum_insert hi]
                change HasCompactSupport ((f i) + (fun w => ∑ j ∈ t, f j w))
                exact (hf i).add ih
          LEAN
          cat >/tmp/ProbePartSum.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff
          variable {ι : Type*} {s : Set ℂ}
          example (ρ : SmoothPartitionOfUnity ι 𝓘(ℝ, ℂ) ℂ s) (t : Finset ι) :
              ContDiff ℝ ∞ (fun w : ℂ => ∑ i ∈ t, ρ i w) := by
            classical
            induction t using Finset.induction_on with
            | empty =>
                simp only [Finset.sum_empty]
                exact contDiff_const
            | @insert i t hi ih =>
                simp only [Finset.sum_insert hi]
                change ContDiff ℝ ∞ ((ρ i : ℂ → ℝ) + (fun w => ∑ j ∈ t, ρ j w))
                have hpiece : ContDiff ℝ ∞ (ρ i : ℂ → ℝ) := by
                  simpa only [contMDiff_iff_contDiff] using (ρ i).property
                exact hpiece.add ih
          LEAN
          : >/tmp/results.txt
          for x in Piece Compact Sum; do
            set +e
            lake env lean -DmaxErrors=50 -DwarningAsError=false "/tmp/ProbePart${x}.lean" >"/tmp/ProbePart${x}.log" 2>&1
            rc=$?
            set -e
            echo "$x=$rc" | tee -a /tmp/results.txt
          done
          cat /tmp/results.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v38-partition-api-${{ github.sha }}
          path: |
            /tmp/ProbePart*.lean
            /tmp/ProbePart*.log
            /tmp/grep-api.txt
            /tmp/results.txt
          retention-days: 30
