name: FA pass320 unpinned then Integrated and QYM

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/fa320-unpinned-qym-20260807.yml'
      - 'scripts/ci_fa320_unpinned_qym_20260807.sh'
      - 'scripts/apply_*_pass_repairs.py'
      - 'scripts/fa316_driver.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'PrimalitySheafVerification/Mock3.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa320-unpinned-qym-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}

    steps:
      - name: Checkout exact PR 9 branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Verify FA PASS 320 candidate, Integrated, Mock3 when present, and QYM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_fa320_unpinned_qym_20260807.sh

      - name: Upload complete focused evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa320-unpinned-qym-${{ env.SOURCE_SHA }}
          path: /tmp/fa320-unpinned-qym
          if-no-files-found: warn
          retention-days: 30
