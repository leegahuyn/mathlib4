name: Codex FA actual-core Sub.sub three-ext probe
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Materialize filtered authoritative source prefix
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v22 /tmp/audit
          ART=9165519294
          DIGEST=sha256:3c632d36677759dde1c86fd9cd7efc06a7a4eca981a7c8524b0d788e1f3e1c60
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" >/tmp/v22.zip
          test "sha256:$(sha256sum /tmp/v22.zip | awk '{print $1}')" = "$DIGEST"
          unzip -q /tmp/v22.zip -d /tmp/v22
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          sha='6b73cb7d68157c861830dbefd30ae7bb0ddcc68b911fc89b49802836752bc965'
          hits=[p for p in Path('/tmp/v22').rglob('Mock2_FunctionalAnalysis.lean') if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(p.read_bytes()).hexdigest()==sha]
          assert len(hits)==1,hits
          shutil.copy2(hits[0],Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'))
          PY
          python3 scripts/fa_v23_filtered_batch.py PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean /tmp/audit/filtered
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = 931c8656a880307acc6f871f63a4c7751fdf6ccf4c57e02f5363ab7943a61fa4
          head -n 19664 PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean >/tmp/ProbeThreeExt.lean
          cat >>/tmp/ProbeThreeExt.lean <<'LEAN'

          example (n : ℤ) (x y : InverseEtaFixedPhaseCore n) :
              Sub.sub x y = x + (-1 : ℂ) • y := by
            apply Subtype.ext
            apply Subtype.ext
            apply Subtype.ext
            funext z
            simp [sub_eq_add_neg]

          example (n : ℤ) (x y : InverseEtaFixedPhaseCore n) (z : ℍ) :
              ((Sub.sub x y : InverseEtaFixedPhaseCore n) : SmoothQuotientCompactFunction) z =
                (x : SmoothQuotientCompactFunction) z -
                  (y : SmoothQuotientCompactFunction) z := by
            have hSub : Sub.sub x y = x + (-1 : ℂ) • y := by
              apply Subtype.ext
              apply Subtype.ext
              apply Subtype.ext
              funext w
              simp [sub_eq_add_neg]
            rw [hSub]
            change ((((x.1 : SmoothQuotientCompactFunction) +
              (-1 : ℂ) • (y.1 : SmoothQuotientCompactFunction) : SmoothQuotientCompactFunction)) z) = _
            simp [sub_eq_add_neg]
          LEAN
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile exact prerequisites and three-ext prefix probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          lake env lean -DmaxErrors=1 -DwarningAsError=false -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean PrimalitySheafVerification/Mock2.lean >/tmp/Mock2.log 2>&1
          lake env lean -DmaxErrors=1 -DwarningAsError=false -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean PrimalitySheafVerification/Mock2_Advanced.lean >/tmp/Mock2_Advanced.log 2>&1
          set +e
          lake env lean -DmaxErrors=20 -DwarningAsError=false /tmp/ProbeThreeExt.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-actual-core-three-ext-${{ github.sha }}
          path: |
            /tmp/ProbeThreeExt.lean
            /tmp/probe.log
            /tmp/probe.exit
            /tmp/audit
          retention-days: 30
