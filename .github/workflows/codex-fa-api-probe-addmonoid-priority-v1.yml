name: Codex FA P5 localized product-density algebra probe v2
# trigger: p5-localized-density-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile localized-density algebra v2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP5Density.lean <<'LEAN'
          import Mathlib

          example (r : ℝ) (hr : 0 < r) : ‖r‖ = r := by
            rw [Real.norm_eq_abs, abs_of_pos hr]

          example (A C h G F Fx X Xx : ℝ)
              (hA : 0 ≤ A) (hC : 0 ≤ C) (hh : 0 ≤ h) (hG : 0 ≤ G)
              (hF : 0 ≤ F) (hFx : 0 ≤ Fx) (hX : 0 ≤ X) (hXx : 0 ≤ Xx)
              (hXle : X ≤ C) (hXxle : Xx ≤ C)
              (hFgraph : F ^ 2 ≤ G) (hFxgraph : Fx ^ 2 ≤ h * G)
              (hadd : A ≤ Fx * X + F * Xx) :
              A ^ 2 ≤ 2 * C ^ 2 * (h + 1) * G := by
            have hXsq : X ^ 2 ≤ C ^ 2 := (sq_le_sq₀ hX hC).2 hXle
            have hXxsq : Xx ^ 2 ≤ C ^ 2 := (sq_le_sq₀ hXx hC).2 hXxle
            have h1 : Fx ^ 2 * X ^ 2 ≤ (h * G) * C ^ 2 :=
              mul_le_mul hFxgraph hXsq (sq_nonneg X) (mul_nonneg hh hG)
            have h2 : F ^ 2 * Xx ^ 2 ≤ G * C ^ 2 :=
              mul_le_mul hFgraph hXxsq (sq_nonneg Xx) hG
            have hB : 0 ≤ Fx * X + F * Xx := by positivity
            have haddsq : A ^ 2 ≤ (Fx * X + F * Xx) ^ 2 := by
              nlinarith [sq_nonneg (A - (Fx * X + F * Xx))]
            have hsum : (Fx * X + F * Xx) ^ 2 ≤
                2 * ((Fx * X) ^ 2 + (F * Xx) ^ 2) := by
              nlinarith [sq_nonneg (Fx * X - F * Xx)]
            nlinarith

          example (D G : ℝ) (hD : 0 ≤ D) (hG : 0 ≤ G) :
              0 + 0 ≤ D * G := by
            simpa only [zero_add] using mul_nonneg hD hG
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeP5Density.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-p5-localized-density-v2-${{ github.sha }}
          path: |
            /tmp/ProbeP5Density.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
