name: Codex FA P5 finsum support and localization API probe
# trigger: p5-finsum-support-localize-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile P5 support and unfold probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP5Support.lean <<'LEAN'
          import Mathlib

          open Set Function

          #print finsum_eq_sum_of_support_subset
          #print tsupport_comp_subset

          variable {α : Type*} [DecidableEq α]
          variable (f : α → ℝ) (s : Finset α)

          example (hs : Function.support f ⊆ (s : Set α)) :
              (∑ x ∈ s, f x) = ∑ᶠ x, f x := by
            simpa only using (finsum_eq_sum_of_support_subset (f := f) (s := s) hs).symm

          example (f : ℂ → ℝ) :
              tsupport ((fun r : ℝ => (r : ℂ)) ∘ f) ⊆ tsupport f := by
            exact tsupport_comp_subset
              (g := fun r : ℝ => (r : ℂ)) (by norm_num) f

          def localizeProbe (a b : ℂ → ℂ) : ℂ → ℂ := fun z => a z * b z

          theorem localizeProbe_rule (a b : ℂ → ℂ) (z : ℂ) :
              localizeProbe a b z = a z * b z := by rfl

          def namedLocalized (a b : ℂ → ℂ) : ℂ → ℂ := localizeProbe a b

          example (a b : ℂ → ℂ) (z : ℂ) : namedLocalized a b z = a z * b z := by
            unfold namedLocalized
            exact localizeProbe_rule a b z
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeP5Support.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-p5-finsum-localize-${{ github.sha }}
          path: |
            /tmp/ProbeP5Support.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
