name: Codex FA inspect custom core Sub HSub identity
# trigger: custom-core-sub-instance-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile custom-core Sub/HSub identity probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeEvalCore.lean <<'LEAN'
          import Mathlib

          noncomputable section
          abbrev F := ℂ → ℂ
          def P1 : Submodule ℂ F := ⊤
          abbrev E := P1
          def P2 : Submodule ℂ E := ⊤
          abbrev Core := P2
          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥P2
            exact Submodule.module P2
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          #print Module.addCommMonoidToAddCommGroup
          #synth Sub Core
          #synth HSub Core Core Core
          set_option pp.all true in
          #check (fun u a : Core => u - a)

          noncomputable def evalE (z : ℂ) : E →ₗ[ℂ] ℂ where
            toFun f := f.1 z
            map_add' f g := by rfl
            map_smul' c f := by rfl
          noncomputable def evalCore (z : ℂ) : Core →ₗ[ℂ] ℂ :=
            (evalE z).comp P2.subtype

          example (u a : Core) : u - a = Sub.sub u a := by rfl

          example (u a : Core) : Sub.sub u a = u + (-1 : ℂ) • a := by
            rfl

          example (u a : Core) : Sub.sub u a = u + (-a) := by
            rfl

          example (u a : Core) (z : ℂ) :
              evalCore z (Sub.sub u a) = evalCore z u - evalCore z a := by
            change evalCore z (u + (-1 : ℂ) • a) = _
            rw [map_add, map_smul]
            simp

          example (u a b : Core) (z : ℂ) :
              evalCore z (u - a - b) = evalCore z u - evalCore z a - evalCore z b := by
            change evalCore z ((u + (-1 : ℂ) • a) + (-1 : ℂ) • b) = _
            rw [map_add, map_smul, map_add, map_smul]
            simp

          example (u a : Core) (t : ℂ) (z : ℂ) :
              evalCore z (u - t • a) = evalCore z u - t * evalCore z a := by
            change evalCore z (u + (-1 : ℂ) • (t • a)) = _
            rw [map_add, map_smul, map_smul]
            simp
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeEvalCore.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-custom-core-sub-identity-${{ github.sha }}
          path: |
            /tmp/ProbeEvalCore.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
