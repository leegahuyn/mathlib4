name: Codex FA core-to-smooth subtraction layer probe
# trigger: core-to-smooth-sub-layers-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile subtraction layer probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSubLayers.lean <<'LEAN'
          import Mathlib

          noncomputable section
          abbrev F := ℂ → ℂ
          def SmoothSub : Submodule ℂ F := ⊤
          abbrev Smooth := SmoothSub
          instance : CoeFun Smooth (fun _ => ℂ → ℂ) where coe f := f.1
          def CoreSub : Submodule ℂ Smooth := ⊤
          abbrev Core := CoreSub
          def toSmooth (u : Core) : Smooth := u.1
          noncomputable instance : CoeOut Core Smooth := ⟨toSmooth⟩
          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥CoreSub
            exact Submodule.module CoreSub
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u a : Core) :
              ((Sub.sub u a : Core) : Smooth) =
                (u : Smooth) - (a : Smooth) := by
            rfl

          example (u a : Smooth) (z : ℂ) :
              (u - a) z = u z - a z := by
            rfl

          example (u a : Core) (z : ℂ) :
              ((Sub.sub u a : Core) : Smooth) z =
                ((u : Smooth) - (a : Smooth)) z := by
            congr 1
            rfl

          example (u a : Core) (z : ℂ) :
              ((Sub.sub u a : Core) : Smooth) z =
                (u : Smooth) z - (a : Smooth) z := by
            calc
              ((Sub.sub u a : Core) : Smooth) z =
                  ((u : Smooth) - (a : Smooth)) z := by congr 1 <;> rfl
              _ = (u : Smooth) z - (a : Smooth) z := by rfl

          example (u a b : Core) (z : ℂ) :
              ((Sub.sub (Sub.sub u a) b : Core) : Smooth) z =
                (u : Smooth) z - (a : Smooth) z - (b : Smooth) z := by
            calc
              ((Sub.sub (Sub.sub u a) b : Core) : Smooth) z =
                  (((Sub.sub u a : Core) : Smooth) - (b : Smooth)) z := by
                    congr 1
                    rfl
              _ = ((Sub.sub u a : Core) : Smooth) z - (b : Smooth) z := by rfl
              _ = ((u : Smooth) - (a : Smooth)) z - (b : Smooth) z := by
                    congr 2
                    congr 1
                    rfl
              _ = (u : Smooth) z - (a : Smooth) z - (b : Smooth) z := by rfl
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeSubLayers.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-core-to-smooth-sub-layers-${{ github.sha }}
          path: |
            /tmp/ProbeSubLayers.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
