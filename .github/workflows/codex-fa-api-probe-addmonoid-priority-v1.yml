name: Codex FA canonical-sub bridge probe v5
# trigger: canonical-sub-module-bridge-v5
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile canonical-sub bridge probes v5
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSubBridge.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {V W : Type*} [AddCommGroup V] [Module ℂ V]
            [AddCommGroup W] [Module ℂ W]
          variable (S : Submodule ℂ V)

          noncomputable local instance coreModule : Module ℂ S := by
            exact Submodule.module S
          noncomputable local instance coreAddCommGroup : AddCommGroup S := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          theorem canonicalSub_eq_add_negOne_smul (u v : S) :
              Sub.sub u v = u + (-1 : ℂ) • v := by
            apply Subtype.ext
            change (u : V) - (v : V) = (u : V) + (-1 : ℂ) • (v : V)
            simp [sub_eq_add_neg]

          example (L : S →ₗ[ℂ] W) (u v : S) :
              L (Sub.sub u v) = L u - L v := by
            rw [canonicalSub_eq_add_negOne_smul S u v, map_add, map_smul]
            simp [sub_eq_add_neg]

          abbrev F := ℂ → ℂ
          def SmoothSub : Submodule ℂ F := ⊤
          abbrev Smooth := SmoothSub
          instance : CoeFun Smooth (fun _ => ℂ → ℂ) where coe f := f.1
          def CoreSub : Submodule ℂ Smooth := ⊤
          abbrev Core := CoreSub
          def toSmooth (u : Core) : Smooth := u.1
          noncomputable instance : CoeOut Core Smooth := ⟨toSmooth⟩

          noncomputable local instance nestedCoreModule : Module ℂ Core := by
            exact Submodule.module CoreSub
          noncomputable local instance nestedCoreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          theorem nestedCanonicalSub_eq_add_negOne_smul (u v : Core) :
              Sub.sub u v = u + (-1 : ℂ) • v :=
            canonicalSub_eq_add_negOne_smul CoreSub u v

          example (u v : Core) (z : ℂ) :
              ((Sub.sub u v : Core) : Smooth) z =
                (u : Smooth) z - (v : Smooth) z := by
            rw [nestedCanonicalSub_eq_add_negOne_smul u v]
            change (((u.1 : Smooth) + (-1 : ℂ) • (v.1 : Smooth) : Smooth) : F) z = _
            simp [toSmooth, sub_eq_add_neg]

          example (u a b : Core) (z : ℂ) :
              ((Sub.sub (Sub.sub u a) b : Core) : Smooth) z =
                (u : Smooth) z - (a : Smooth) z - (b : Smooth) z := by
            rw [nestedCanonicalSub_eq_add_negOne_smul (Sub.sub u a) b,
              nestedCanonicalSub_eq_add_negOne_smul u a]
            change (((((u.1 : Smooth) + (-1 : ℂ) • (a.1 : Smooth)) : Smooth) +
              (-1 : ℂ) • (b.1 : Smooth) : Smooth) : F) z = _
            simp [toSmooth, sub_eq_add_neg]
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeSubBridge.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-canonical-sub-module-bridge-v5-${{ github.sha }}
          path: |
            /tmp/ProbeSubBridge.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
