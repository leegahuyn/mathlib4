name: Codex FA canonical-sub to module-sub bridge probe v2
# trigger: canonical-sub-module-bridge-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile canonical-sub bridge probes v2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSubBridge.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {V W : Type*} [AddCommGroup V] [Module ℂ V]
            [AddCommGroup W] [Module ℂ W]
          variable (S : Submodule ℂ V)

          noncomputable local instance coreModule : Module ℂ S := by
            exact Submodule.module S
          noncomputable local instance coreAddCommGroup : AddCommGroup S := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          theorem canonicalSub_eq_add_negOne_smul (u v : S) :
              Sub.sub u v = u + (-1 : ℂ) • v := by
            apply Subtype.ext
            simp only [Submodule.coe_sub, Submodule.coe_add, Submodule.coe_smul_of_tower]
            simp [sub_eq_add_neg]

          example (L : S →ₗ[ℂ] W) (u v : S) :
              L (Sub.sub u v) = L u - L v := by
            rw [canonicalSub_eq_add_negOne_smul S u v, map_add, map_smul]
            simp [sub_eq_add_neg]

          example (L : S →ₗ[ℂ] W) (u v : S) :
              L (Sub.sub u v) = L u + (-1 : ℂ) • L v := by
            rw [canonicalSub_eq_add_negOne_smul S u v, map_add, map_smul]

          def FS : Submodule ℂ (ℂ → ℂ) := ⊤
          abbrev CoreF := FS
          noncomputable local instance coreFModule : Module ℂ CoreF := by
            exact Submodule.module FS
          noncomputable local instance coreFAddCommGroup : AddCommGroup CoreF := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u v : CoreF) (z : ℂ) :
              ((Sub.sub u v : CoreF) : ℂ → ℂ) z =
                (u : ℂ → ℂ) z - (v : ℂ → ℂ) z := by
            have h : Sub.sub u v = u + (-1 : ℂ) • v := by
              apply Subtype.ext
              simp [sub_eq_add_neg]
            rw [h]
            simp [sub_eq_add_neg]
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeSubBridge.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-canonical-sub-module-bridge-v2-${{ github.sha }}
          path: |
            /tmp/ProbeSubBridge.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
