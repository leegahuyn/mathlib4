name: Codex FA zero-map across local core override
# trigger: zero-map-local-core-override-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-addmonoid-priority-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile zero-map override probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeZeroOverride.lean <<'LEAN'
          import Mathlib

          noncomputable section
          abbrev F := ℂ → ℂ
          def P1 : Submodule ℂ F := ⊤
          abbrev E := P1
          def P2 : Submodule ℂ E := ⊤
          abbrev Core := P2

          noncomputable def nativeEval : Core →ₗ[ℂ] ℂ where
            toFun u := ((u : E) : F) 0
            map_add' u v := by rfl
            map_smul' c u := by rfl

          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥P2
            exact Submodule.module P2
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example : nativeEval (0 : Core) = 0 := by
            exact map_zero nativeEval

          example (v : ℂ) : inner ℂ v (nativeEval (0 : Core)) = 0 := by
            have hZero : nativeEval (0 : Core) = 0 := by
              exact map_zero nativeEval
            rw [hZero, inner_zero_right]
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeZeroOverride.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-zero-map-local-override-${{ github.sha }}
          path: |
            /tmp/ProbeZeroOverride.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
