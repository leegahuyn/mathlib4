name: Codex FA cutoff and commutator frontier through 3002

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-cutoff-commutator-3002.yml
      - scripts/fa_dynamic_cutoff_core_cluster_2980_2985.json
      - scripts/fa_dynamic_commutator_cluster_2989_3002.json
      - scripts/fa_dynamic_apply_staged_library.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-frontier-cutoff-commutator-3002
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31518432076"
  BASE_JOB_ID: "93869310449"
  BASE_HEAD_SHA: "b2c55b3209d5deecc9646efd3ccb148c4d6fb828"
  BASE_ARTIFACT_ID: "9112281252"
  BASE_ARTIFACT_NAME: "codex-fa-action-cluster-2953-2967-v3-b2c55b3209d5deecc9646efd3ccb148c4d6fb828"
  BASE_ARTIFACT_SIZE: "1077962"
  BASE_ARTIFACT_DIGEST: "sha256:a9f82e6583374ed4dd59aa6b8254d961f8d69ac7f1cfd3bfd45d6c5e8f3c1ee3"
  BASE_SOURCE_SHA256: "f6da9e61599a2aed63b79e44690834564cfefe781a696817d6989e9b10d40f08"
  BASE_SOURCE_BYTES: "2705064"
  BASE_SOURCE_LINES: "60641"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested idx2980 frontier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-cutoff-commutator-3002
          mkdir -p "$OUT" /tmp/fa-cutoff-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-cutoff-base.zip
          unzip -q /tmp/fa-cutoff-base.zip -d /tmp/fa-cutoff-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-cutoff-commutator-3002')
          run=json.loads((out/'base-run.json').read_text()); job=json.loads((out/'base-job.json').read_text()); art=json.loads((out/'base-artifact.json').read_text()); z=Path('/tmp/fa-cutoff-base.zip').read_bytes()
          checks={'run_id':run.get('id')==int(os.environ['BASE_RUN_ID']),'run_head':run.get('head_sha')==os.environ['BASE_HEAD_SHA'],'run_completed_failure':run.get('status')=='completed' and run.get('conclusion')=='failure','job_id':job.get('id')==int(os.environ['BASE_JOB_ID']),'job_run':job.get('run_id')==int(os.environ['BASE_RUN_ID']),'job_completed_failure':job.get('status')=='completed' and job.get('conclusion')=='failure','artifact_id':art.get('id')==int(os.environ['BASE_ARTIFACT_ID']),'artifact_name':art.get('name')==os.environ['BASE_ARTIFACT_NAME'],'artifact_size':art.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']),'artifact_digest':art.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'],'artifact_live':art.get('expired') is False,'archive_digest':'sha256:'+hashlib.sha256(z).hexdigest()==os.environ['BASE_ARTIFACT_DIGEST']}
          if not all(checks.values()): raise SystemExit('base attestation failed: '+repr([k for k,v in checks.items() if not v]))
          valid=[]
          for p in Path('/tmp/fa-cutoff-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode('utf-8').splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: valid.append(p)
          if not valid: raise SystemExit('exact direct-tested idx2980 source missing')
          p=min(valid,key=lambda x:(len(x.parts),x.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n'); (out/'BASE_ATTESTATION.json').write_text(json.dumps({'checks':checks},indent=2,sort_keys=True)+'\n')
          PY

      - name: Apply audited cutoff and commutator root batches
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-cutoff-commutator-3002
          python3 scripts/fa_dynamic_apply_staged_library.py \
            --base-source "$(cat "$OUT/BASE_SOURCE.txt")" \
            --library scripts/fa_dynamic_cutoff_core_cluster_2980_2985.json \
            --no-environment \
            --target /tmp/fa-cutoff-core.lean \
            --audit-out "$OUT/AUDIT_CUTOFF.json"
          python3 scripts/fa_dynamic_apply_staged_library.py \
            --base-source /tmp/fa-cutoff-core.lean \
            --library scripts/fa_dynamic_commutator_cluster_2989_3002.json \
            --no-environment \
            --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --audit-out "$OUT/AUDIT_COMMUTATOR.json"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-cutoff-commutator-3002'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes(); s=b.decode(); a1=json.loads((out/'AUDIT_CUTOFF.json').read_text()); a2=json.loads((out/'AUDIT_COMMUTATOR.json').read_text())
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] for a in (a1,a2)): raise SystemExit('semantic integrity audit failed')
          ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines()),'libraries':[a1['library_path'],a2['library_path']]}; (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write('CANDIDATE_SHA='+ident['sha256']+'\nCANDIDATE_BYTES='+str(ident['bytes'])+'\nCANDIDATE_LINES='+str(ident['lines'])+'\n')
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-cutoff-commutator-3002
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain-install.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"; lake --version | tee "$OUT/lake-version.txt"; lake exe cache get > "$OUT/cache-get.log" 2>&1

      - name: Direct full-source cumulative diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-cutoff-commutator-3002; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() { stem="$1"; cap="$2"; src="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$cap" "$o" "$i" "$src" > "$OUT/${stem}.command"; : > "$OUT/${stem}.executed"; set +e; lake env lean "-DmaxErrors=${cap}" -DwarningAsError=false -o "$o" -i "$i" "$src" > "$OUT/${stem}.log" 2>&1; code=$?; set -e; echo "$code" > "$OUT/${stem}.exit"; }
          compile_one Mock2 3; compile_one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"; test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"; test "$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_LINES"
          compile_one Mock2_FunctionalAnalysis 128
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-cutoff-commutator-3002'); srcp=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=srcp.read_text(); dr=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)'); ds=list(dr.finditer(s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); errors=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; errors.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=errors[0] if errors else {}; b=srcp.read_bytes(); a1=json.loads((out/'AUDIT_CUTOFF.json').read_text()); a2=json.loads((out/'AUDIT_COMMUTATOR.json').read_text())
          metric={'schema':'fa-frontier-cutoff-commutator-3002-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'base_direct_tested_source_sha256':os.environ['BASE_SOURCE_SHA256'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').is_file(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').is_file(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').is_file(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').is_file() for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_error_headers_captured':len(errors),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':a1['public_declaration_headers_preserved'] and a2['public_declaration_headers_preserved'],'declaration_sequence_preserved':a1['declaration_sequence_preserved'] and a2['declaration_sequence_preserved'],'repair_declaration_indices':[2980,2982,2985,2989,2990,2991,2992,2999,3002],'maxErrors_cap':128}
          (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(errors,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-cutoff-commutator-3002-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-cutoff-commutator-3002
          if-no-files-found: warn
          retention-days: 30

      - name: Publish locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          state=failure; [[ "${FA_EXIT:-}" == 0 ]] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='codex/fa-cutoff-commutator-3002' -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
