name: PASS 354 FunctionalAnalysis prefix and frontier Ubuntu

on:
  push:
    branches: [fix/fa354-final-isolated-20260808]
    paths:
      - '.github/workflows/pass354-fa-prefix-frontier-ubuntu.yml'
      - 'scripts/diagnose_pass354_fa.sh'
      - 'scripts/apply_three_hundred_fifty_fourth_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa354-prefix-frontier-ubuntu
  cancel-in-progress: true

jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PASS 354 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 580
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Reconstruct PASS 354 without full compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the direct compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass354_fa.sh
          source_file='/tmp/diagnose-pass354-fa/source/Mock2_FunctionalAnalysis-pass354.lean'
          test -s "${source_file}"
          cp "${source_file}" /tmp/Mock2_FunctionalAnalysis-pass354.lean
          sha256sum /tmp/Mock2_FunctionalAnalysis-pass354.lean
          head -n 25350 /tmp/Mock2_FunctionalAnalysis-pass354.lean > \
            /tmp/Mock2_FunctionalAnalysis-pass354-prefix.lean

      - name: Compile PASS 354 prefix
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake env lean -DmaxErrors=300 \
            /tmp/Mock2_FunctionalAnalysis-pass354-prefix.lean \
            > /tmp/pass354-prefix.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          grep -n 'error:' /tmp/pass354-prefix.log | head -260 > \
            /tmp/pass354-prefix-errors.txt || true
          tail -800 /tmp/pass354-prefix.log > /tmp/pass354-prefix-tail.txt || true
          exit 0

      - name: Upload PASS 354 prefix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass354-fa-prefix-${{ github.sha }}
          path: |
            /tmp/Mock2_FunctionalAnalysis-pass354.lean
            /tmp/Mock2_FunctionalAnalysis-pass354-prefix.lean
            /tmp/pass354-prefix.log
            /tmp/pass354-prefix-errors.txt
            /tmp/pass354-prefix-tail.txt
          if-no-files-found: error
          retention-days: 90

      - name: Enforce PASS 354 prefix result
        if: always()
        shell: bash
        env:
          PREFIX_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${PREFIX_EXIT_CODE:-}"
          exit "${PREFIX_EXIT_CODE}"

  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PASS 354 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 580
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass354-fa/logs
          lean --version | tee /tmp/diagnose-pass354-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass354-fa/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass354-fa/logs/cache-get.log

      - name: Limit diagnostics to first 50 errors
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          old = '-DmaxErrors=2000'
          if text.count(old) != 1:
              raise SystemExit('expected exactly one maxErrors setting')
          path.write_text(text.replace(old, '-DmaxErrors=50'), encoding='utf-8')
          PY

      - name: Compile PASS 354 frontier
        id: diagnostic
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass354_fa.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 354 frontier diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass354-fa-frontier-${{ github.sha }}
          path: /tmp/diagnose-pass354-fa
          if-no-files-found: error
          retention-days: 90

      - name: Enforce PASS 354 frontier result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          test -n "${DIAGNOSTIC_EXIT_CODE:-}"
          exit "${DIAGNOSTIC_EXIT_CODE}"
