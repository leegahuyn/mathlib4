name: Codex FA frontier 3118-3141 after fixedenv v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-3118-3141-after-fixedenv-v1.yml
      - scripts/fa_dynamic_cluster_3118_3121_unique_v2.json
      - scripts/fa_dynamic_cluster_3125_3127_extendofnorm_v2.json
      - scripts/fa_dynamic_cluster_3118_3141_v1.json
      - scripts/fa_d0a3_r002_high_confidence_overrides.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-fa-frontier-3118-3141-after-fixedenv-v1
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31529281483"
  BASE_HEAD_SHA: "60da5842b8cc491fcc5a8fb3da98bbdf3fbba002"
  BASE_WORKFLOW: ".github/workflows/codex-fa-frontier-e7d8-3105-fixedenv-fast1-v1.yml"
  BASE_FIRST_INDEX: "3118"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Await and attest exact fixedenv idx3118 parent
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1
          mkdir -p "$OUT" /tmp/base
          for _ in $(seq 1 240); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"
            s=$(python3 -c "import json;print(json.load(open('$OUT/run.json')).get('status',''))")
            [[ "$s" == completed ]] && break
            sleep 10
          done
          python3 - <<'PY'
          import json,os
          r=json.load(open('build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1/run.json'))
          if not (r.get('status')=='completed' and r.get('conclusion')=='failure' and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and r.get('path')==os.environ['BASE_WORKFLOW']): raise SystemExit('base run gate failed')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100" > "$OUT/jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" > "$OUT/artifacts.json"
          python3 - <<'PY' > /tmp/base.env
          import json
          out='build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1'
          js=[j for j in json.load(open(out+'/jobs.json')).get('jobs',[]) if j.get('name')=='frontier']
          if len(js)!=1: raise SystemExit('job count drift')
          j=js[0]; steps={s.get('name'):s for s in j.get('steps',[])}
          if steps.get('Direct full-source first-frontier compile',{}).get('conclusion')!='success': raise SystemExit('base direct compile missing')
          xs=[a for a in json.load(open(out+'/artifacts.json')).get('artifacts',[]) if a.get('name','').startswith('codex-fa-frontier-e7d8-3105-fixedenv-fast1-v1-') and not a.get('expired')]
          if len(xs)!=1: raise SystemExit('artifact count drift')
          a=xs[0]; print('BASE_ARTIFACT_ID='+str(a['id'])); print('BASE_ARTIFACT_DIGEST='+a['digest'])
          PY
          source /tmp/base.env
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1')
          m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          if not (str(m.get('run_id'))==os.environ['BASE_RUN_ID'] and m.get('Mock2_exit')==0 and m.get('Mock2_Advanced_exit')==0 and m.get('FA_exit')==1 and m.get('all_required_lean_executed') is True and str(m.get('FA_error_declaration_index'))==os.environ['BASE_FIRST_INDEX'] and m.get('source_identity_locked_after_materialization') is True and m.get('public_declaration_headers_preserved') is True and m.get('declaration_sequence_preserved') is True): raise SystemExit('base metric gate failed: '+repr(m))
          sha,size,lines=m['source_sha256'],m['source_bytes'],m['source_lines']; hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==sha and len(b)==size and len(b.decode().splitlines())==lines: hits.append(p)
          if not hits: raise SystemExit('exact source missing')
          (out/'BASE_SOURCE.txt').write_text(str(min(hits,key=lambda q:(len(q.parts),q.as_posix())).resolve())+'\n')
          PY

      - name: Materialize non-overlapping 3128-3141 libraries
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          c=json.loads(Path('scripts/fa_dynamic_cluster_3118_3141_v1.json').read_text())
          wanted={3128,3129,3130,3136,3137,3140,3141}
          keep=[r for r in c.get('repairs',[]) if int(r['declaration_index']) in wanted]
          if set(int(r['declaration_index']) for r in keep) != wanted: raise SystemExit('late remainder identity drift')
          Path('/tmp/fa_3128_3141_remainder.json').write_text(json.dumps({'schema':'fa-3128-3141-remainder-after-fixedenv-v1','repairs':keep},ensure_ascii=False,indent=2)+'\n')
          r2=json.loads(Path('scripts/fa_d0a3_r002_high_confidence_overrides.json').read_text())
          keep2=[r for r in r2.get('repairs',[]) if int(r['declaration_index'])==3135]
          if len(keep2)!=1: raise SystemExit('R002 idx3135 identity drift')
          Path('/tmp/fa_r002_3135_only.json').write_text(json.dumps({'schema':'fa-r002-3135-after-fixedenv-v1','repairs':keep2},ensure_ascii=False,indent=2)+'\n')
          PY

      - name: Apply strict batches through idx3141
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1
          base="$(cat "$OUT/BASE_SOURCE.txt")"
          apply_one(){ tag="$1"; lib="$2"; next="/tmp/fa-${tag}.lean"; python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library "$lib" --no-environment --target "$next" --audit-out "$OUT/AUDIT_${tag}.json"; base="$next"; }
          apply_one R3121 scripts/fa_dynamic_cluster_3118_3121_unique_v2.json
          apply_one R3127 scripts/fa_dynamic_cluster_3125_3127_extendofnorm_v2.json
          apply_one R3141 /tmp/fa_3128_3141_remainder.json
          apply_one R3135 /tmp/fa_r002_3135_only.json
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "$base" "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1'); names=('R3121','R3127','R3141','R3135'); aud=[json.loads((out/f'AUDIT_{n}.json').read_text()) for n in names]
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed'] for a in aud): raise SystemExit('semantic/header audit failed')
          base=Path((out/'BASE_SOURCE.txt').read_text().strip()).read_text(); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); toks=('sorry','admit','axiom','unsafe','native_decide','Lean.ofReduceBool','sorryAx'); counts={t:(base.count(t),s.count(t)) for t in toks}
          if any(a!=b for a,b in counts.values()): raise SystemExit('forbidden lexical drift '+repr(counts))
          b=p.read_bytes(); ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines()),'repair_indices':[x['declaration_index'] for a in aud for x in a.get('proof_replacements_applied',[])],'forbidden':counts}; (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write(f"CANDIDATE_SHA={ident['sha256']}\nCANDIDATE_BYTES={ident['bytes']}\nCANDIDATE_LINES={ident['lines']}\n")
          PY

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1; lake exe cache get > "$OUT/cache.log" 2>&1; lean --version > "$OUT/lean-version.txt"

      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean">"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3; one Mock2_Advanced 3; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis 256
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); ident=json.loads((out/'CANDIDATE_IDENTITY.json').read_text()); metric={'schema':'fa-frontier-3118-3141-after-fixedenv-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'repair_declaration_indices':ident['repair_indices'],'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':256}; (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-3118-3141-after-fixedenv-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-3118-3141-after-fixedenv-v1
          retention-days: 30

      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
