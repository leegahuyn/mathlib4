name: PASS 384 deep parallel FA and downstream verification

on:
  push:
    branches:
      - fix/fa384-deep-parallel-20260809
    paths:
      - '.github/workflows/fa384-deep-parallel.yml'
      - 'scripts/fa383_parallel_solver.py'
      - 'scripts/fa383_select_and_verify.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

jobs:
  solve-fa:
    name: solve-${{ matrix.id }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - id: dialogue-gpt5
            strategy: dialogue
            primary_model: openai/gpt-5
          - id: dialogue-grok
            strategy: dialogue
            primary_model: xai/grok-3
          - id: api-deepseek
            strategy: api
            primary_model: deepseek/DeepSeek-V3-0324
          - id: calc-mistral
            strategy: calc
            primary_model: mistral-ai/Mistral-Large-2411
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout latest PASS 384 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa384-deep-parallel-20260809
          fetch-depth: 1800
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run deep ${{ matrix.id }} solver
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          out="/tmp/fa384-${{ matrix.id }}"
          python3 scripts/fa383_parallel_solver.py \
            --strategy '${{ matrix.strategy }}' \
            --primary-model '${{ matrix.primary_model }}' \
            --output-dir "${out}" \
            --max-frontiers 16 \
            --max-revisions 5 \
            > "${out}-console.log" 2>&1
          rc=$?
          set -e
          mkdir -p "${out}"
          cp "${out}-console.log" "${out}/console.log"
          cat "${out}/console.log"
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Finalize candidate bundle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="/tmp/fa384-${{ matrix.id }}"
          test -s "${out}/best-source.lean"
          test -s "${out}/best-metric.json"
          test -s "${out}/state.json"
          sha256sum "${out}/best-source.lean" > "${out}/best-source.sha256"
          {
            echo "id=${{ matrix.id }}"
            echo "strategy=${{ matrix.strategy }}"
            echo "primary_model=${{ matrix.primary_model }}"
            echo "solver_exit_code=${{ steps.solver.outputs.exit_code }}"
            cat "${out}/best-metric.json"
            cat "${out}/state.json"
          } > "${out}/solver-summary.txt"

      - name: Upload PASS 384 candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa384-candidate-${{ matrix.id }}-${{ github.sha }}
          path: /tmp/fa384-${{ matrix.id }}
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

  select-and-verify:
    name: select-best-and-verify-required-order
    needs: solve-fa
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 384 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa384-deep-parallel-20260809
          fetch-depth: 1900
          persist-credentials: true

      - name: Download every PASS 384 candidate
        uses: actions/download-artifact@v4
        with:
          pattern: fa384-candidate-*
          path: /tmp/fa384-candidates
          merge-multiple: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Select best source and verify FA Integrated Mock3 QYM twice
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA383_VERIFY_MODELS: 'openai/gpt-5,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411,meta/Llama-4-Scout-17B-16E-Instruct,microsoft/Phi-4'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa384-aggregate
          mkdir -p build-logs/fa384-aggregate
          python3 scripts/fa383_select_and_verify.py \
            --candidates-root /tmp/fa384-candidates \
            --evidence-dir build-logs/fa384-aggregate \
            > build-logs/fa384-aggregate/console.log 2>&1
          rc=$?
          set -e
          cat build-logs/fa384-aggregate/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Generate authoritative PASS 384 status
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          set -euo pipefail
          dir=build-logs/fa384-aggregate
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('build-logs/fa384-aggregate')
          p=d/'FINAL_STATUS.json'
          status=json.loads(p.read_text()) if p.exists() else {'complete':False,'stage':'missing-final-status'}
          marker=(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists()
          status['verify_exit_code']='${{ steps.verify.outputs.exit_code }}'
          status['marker_exists']=marker
          status['authoritative_complete']=bool(status.get('complete') and marker and status['verify_exit_code']=='0')
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          status['sources']={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in targets if x.exists()}
          (d/'AUTHORITATIVE_STATUS.json').write_text(json.dumps(status,indent=2))
          lines=[f"authoritative_complete={str(status['authoritative_complete']).lower()}",f"verify_exit_code={status['verify_exit_code']}",f"stage={status.get('stage')}",f"marker_exists={str(marker).lower()}"]
          if status.get('metric') is not None: lines.append(f"metric={json.dumps(status['metric'],sort_keys=True)}")
          for module in status.get('modules',[]): lines.append(f"{module.get('module')}={module.get('status')} sha256={module.get('source_sha256')}")
          (d/'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat "${dir}/AUTHORITATIVE_STATUS.txt"

      - name: Audit all target source files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*(?:public\s+)?axiom\b','unsafe':r'(?m)^\s*unsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          def strip(t):
            out=[];i=0;depth=0;s=False;e=False
            while i<len(t):
              if depth:
                if t.startswith('/-',i):depth+=1;out.extend('  ');i+=2;continue
                if t.startswith('-/',i):depth-=1;out.extend('  ');i+=2;continue
                out.append('\n' if t[i]=='\n' else ' ');i+=1;continue
              if s:
                c=t[i];out.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1;continue
              if t.startswith('/-',i):depth=1;out.extend('  ');i+=2;continue
              if t.startswith('--',i):
                while i<len(t) and t[i]!='\n':out.append(' ');i+=1
                continue
              if t[i]=='"':s=True;out.append(' ');i+=1;continue
              out.append(t[i]);i+=1
            return ''.join(out)
          report={}
          for p in targets:
            if p.exists():
              code=strip(p.read_text());report[str(p)]={k:len(re.findall(v,code)) for k,v in pats.items()}
          Path('build-logs/fa384-aggregate/FORBIDDEN_TOKEN_AUDIT.json').write_text(json.dumps(report,indent=2))
          bad={p:c for p,c in report.items() if any(c.values())}
          if bad:raise SystemExit(bad)
          PY

      - name: Commit best isolated PASS 384 state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean PrimalitySheafVerification/QYM.lean
          for path in PrimalitySheafVerification/Mock3*.lean; do test -e "${path}" && git add "${path}"; done
          git add build-logs/fa384-aggregate/AUTHORITATIVE_STATUS.json build-logs/fa384-aggregate/AUTHORITATIVE_STATUS.txt build-logs/fa384-aggregate/FORBIDDEN_TOKEN_AUDIT.json
          for path in build-logs/fa384-aggregate/ALL_REQUIRED_TARGETS_2X_PASS build-logs/fa384-aggregate/FINAL_STATUS.json build-logs/fa384-aggregate/fa-selection.json; do test -f "${path}" && git add "${path}"; done
          git diff --cached --quiet && exit 0
          if test -f build-logs/fa384-aggregate/ALL_REQUIRED_TARGETS_2X_PASS; then msg='fix: verify FA Integrated Mock3 and QYM twice'; else msg='fix: preserve best PASS 384 FA frontier'; fi
          git commit -m "${msg}"
          git push origin HEAD:fix/fa384-deep-parallel-20260809

      - name: Upload authoritative PASS 384 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa384-authoritative-${{ github.sha }}
          path: |
            build-logs/fa384-aggregate
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final PASS 384 result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${VERIFY_EXIT_CODE:-}"
          test -f build-logs/fa384-aggregate/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${VERIFY_EXIT_CODE}"
