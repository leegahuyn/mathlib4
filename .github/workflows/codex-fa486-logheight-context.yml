name: Codex FA486 logHeightBasePoint context

on:
  push:
    branches:
      - diag/fa486-logheight-continuity-context-20260811
    paths:
      - .github/workflows/codex-fa486-logheight-context.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  context:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture exact source context
        shell: bash
        run: |
          set -euo pipefail
          f=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          python3 - <<'PY' > /tmp/context.txt
          from pathlib import Path
          p = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          lines = p.read_text(encoding='utf-8', errors='replace').splitlines()
          needles = [
              'logHeightBasePoint',
              'selectedLogHeightEnergyDensity_continuous',
              'continuous_subtype_mk',
              'UpperHalfPlane.ofComplex',
          ]
          hits = []
          for i, line in enumerate(lines, 1):
              if any(n in line for n in needles):
                  hits.append(i)
          # Merge nearby windows and keep only regions relevant to logHeightBasePoint/continuity.
          windows = []
          for i in hits:
              lo, hi = max(1, i-12), min(len(lines), i+18)
              if windows and lo <= windows[-1][1] + 1:
                  windows[-1] = (windows[-1][0], max(windows[-1][1], hi))
              else:
                  windows.append((lo, hi))
          print(f'line_count={len(lines)}')
          print('hit_lines=' + ','.join(map(str, hits)))
          for lo, hi in windows:
              print(f'\n=== lines {lo}-{hi} ===')
              for j in range(lo, hi+1):
                  print(f'{j}: {lines[j-1]}')
          PY

      - name: Post context to issue 14
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/comment.md
          from pathlib import Path
          import os
          text = Path('/tmp/context.txt').read_text(encoding='utf-8', errors='replace')
          body = [
              '## FA486 diagnostic — logHeightBasePoint continuity context',
              '',
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",
              '- purpose: source-only diagnostic; no Lean PASS claim',
              '',
              '```lean',
              text[:55000],
              '```',
          ]
          print('\n'.join(body)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/comment.md)"
