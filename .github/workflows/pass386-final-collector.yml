name: PASS 386 collect verified FA Mock3 QYM winner and promote to PR9

on:
  push:
    branches: [fix/fa386-final-collector-20260809]
    paths:
      - '.github/workflows/pass386-final-collector.yml'
      - 'scripts/run_pass386_marker_collector.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass386-final-collector
  cancel-in-progress: false

jobs:
  collect-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      WATCH_SECONDS: '19000'
      POLL_SECONDS: '60'
    steps:
      - name: Checkout collector branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2100
          persist-credentials: true

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Poll all repair branches and independently promote only a real two-round PASS
        id: collector
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/run_pass386_marker_collector.py \
            > /tmp/pass386-final-collector.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass386-final-collector.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload collector and independent revalidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass386-final-collector-${{ github.sha }}
          path: |
            /tmp/pass383-marker-watcher
            /tmp/pass386-final-collector.log
            build-logs/PASS383_PROMOTED_TO_PR9.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce independently verified PR9 promotion
        if: always()
        shell: bash
        env:
          COLLECTOR_EXIT: ${{ steps.collector.outputs.exit_code }}
        run: |
          test "${COLLECTOR_EXIT:-1}" = '0'
          test -s build-logs/PASS383_PROMOTED_TO_PR9.json
