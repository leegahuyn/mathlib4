name: PR9 exact PASS 320 FA and QYM v2

on:
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: pr9-pass320-fa-qym
  cancel-in-progress: true

jobs:
  exact-pass320:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout stable PR9 branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Require open unmerged draft PR9
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/9" > /tmp/pr9-exact-pass320-state.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pr9-exact-pass320-state.json',encoding='utf-8'))
          assert p['state']=='open', p
          assert p['merged'] is False, p
          assert p['draft'] is True, p
          assert p['head']['ref']=='ci/fa319-isolated-20260807', p
          assert p['base']['ref']=='fix/primality-sheaf-clean-build', p
          PY

      - name: Synchronize latest repair base locally and remotely
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pr9_sync_base_pass320_v2.sh

      - name: Install exact Lean toolchain and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Apply exact PASS 320 and compile FA Integrated QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/pr9_apply_exact_pass320_and_qym.sh

      - name: Upload exact PASS 320 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-exact-pass320-fa-qym-v2-${{ github.run_id }}
          path: |
            /tmp/pr9-exact-pass320-state.json
            /tmp/pr9-exact-pass320
            build-logs/pr9-branch-sync-status.txt
          if-no-files-found: warn
          retention-days: 30
