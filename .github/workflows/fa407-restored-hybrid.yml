name: PASS 407 restored hybrid FA Mock3 QYM solver

on:
  push:
    branches: [fix/fa407-restored-hybrid-20260809]
    paths:
      - '.github/workflows/fa407-restored-hybrid.yml'
      - '.fa407-cycle'
      - 'scripts/fa407_restored_hybrid.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write

concurrency:
  group: fa407-restored-hybrid
  cancel-in-progress: false

jobs:
  solve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout exact PASS 407 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa407-restored-hybrid-20260809
          fetch-depth: 2600
          persist-credentials: true

      - name: Restore original proof-body engine
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin \
            refs/heads/fix/fa396-proof-body-persistent-20260809:refs/remotes/origin/fa396-proof-body-original
          git show refs/remotes/origin/fa396-proof-body-original:scripts/fa396_proof_body_persistent.py \
            > scripts/fa396_proof_body_persistent.py
          test -s scripts/fa396_proof_body_persistent.py

      - name: Install pinned Lean, ripgrep, GitHub CLI, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ripgrep gh
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bound each hybrid cycle
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/rounds=10,/rounds=4,/' scripts/fa407_restored_hybrid.py
          sed -i 's/"--rounds", "24"/"--rounds", "10"/' scripts/fa407_restored_hybrid.py
          sed -i 's/"--candidates", "8"/"--candidates", "6"/' scripts/fa407_restored_hybrid.py

      - name: Run restored proof-body and extended-frontier chain
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p build-logs/fa407-restored-hybrid
          python3 scripts/fa407_restored_hybrid.py \
            2>&1 | tee build-logs/fa407-restored-hybrid.console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "solver_exit_code=${rc}" > build-logs/fa407-restored-hybrid.exit.txt

      - name: Persist state and schedule the next bounded cycle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          current=0
          test -f .fa407-cycle && current=$(cat .fa407-cycle)
          marker=build-logs/fa407-restored-hybrid/ALL_REQUIRED_TARGETS_2X_PASS
          if test -f "$marker"; then
            next="$current"
          elif test "$current" -lt 12; then
            next=$((current + 1))
          else
            next="$current"
          fi
          echo "$next" > .fa407-cycle
          git add .fa407-cycle
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          git add PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "$p" && git add "$p"; done
          for p in \
            build-logs/fa407-restored-hybrid/FINAL_STATUS.json \
            build-logs/fa407-restored-hybrid/ALL_REQUIRED_TARGETS_2X_PASS \
            build-logs/fa407-restored-hybrid/selected-baseline.json \
            build-logs/fa407-restored-hybrid/proof-body-status.json; do
            test -f "$p" && git add "$p" || true
          done
          if ! git diff --cached --quiet; then
            if test -f "$marker"; then
              msg='fix: obtain PASS 407 FA Integrated Mock3 QYM 2x PASS [skip ci]'
            elif test "$next" -gt "$current"; then
              msg="ci: continue PASS 407 hybrid cycle $next"
            else
              msg='ci: record terminal PASS 407 status [skip ci]'
            fi
            git commit -m "$msg"
            git push origin HEAD:fix/fa407-restored-hybrid-20260809
          fi

      - name: Promote only independently verified success to PR9
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker=build-logs/fa407-restored-hybrid/ALL_REQUIRED_TARGETS_2X_PASS
          test -f "$marker" || exit 0
          if test -f scripts/promote_priority_verified_to_pr9.sh; then
            bash scripts/promote_priority_verified_to_pr9.sh \
              build-logs/fa407-restored-hybrid/FINAL_STATUS.json \
              "$marker"
          fi

      - name: Upload complete PASS 407 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa407-restored-hybrid-${{ github.run_id }}-${{ github.sha }}
          path: |
            .fa407-cycle
            build-logs/fa407-restored-hybrid
            build-logs/fa407-restored-hybrid.console.log
            build-logs/fa407-restored-hybrid.exit.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce only success or terminal-cycle result
        if: always()
        shell: bash
        env:
          SOLVER_EXIT_CODE: ${{ steps.solver.outputs.exit_code }}
        run: |
          test -n "${SOLVER_EXIT_CODE:-}"
          if test -f build-logs/fa407-restored-hybrid/ALL_REQUIRED_TARGETS_2X_PASS; then
            exit 0
          fi
          current=0
          test -f .fa407-cycle && current=$(cat .fa407-cycle)
          if test "$current" -ge 12; then
            exit "${SOLVER_EXIT_CODE}"
          fi
          exit 0
