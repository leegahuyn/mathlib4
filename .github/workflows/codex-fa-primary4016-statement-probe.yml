name: Codex FA primary4016 statement elaboration probe

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fa-primary4016-statement-20260816
    paths:
      - .github/workflows/codex-fa-primary4016-statement-probe.yml
      - scripts/fa_primary4016_statement_probe.py

permissions:
  actions: read
  contents: write

concurrency:
  group: codex-fa-primary4016-statement-probe
  cancel-in-progress: true

jobs:
  statement-probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      OUT: build-logs/fa-primary4016-statement
      SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      EXPECTED_BASE_SHA256: 1c3d12594a3e8b14f9cf7b7294da7c29221758c72d00a596215198f7623fad8c
      EXPECTED_BRANCH: codex/fa-primary4016-statement-20260816
      ARTIFACT_DIR: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact statement-probe branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-primary4016-statement-20260816
          fetch-depth: 1
          persist-credentials: true

      - name: Verify hash-locked probe and generate candidates
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          mkdir -p "$OUT"
          chmod +x scripts/fa_primary4016_statement_probe.py
          test "$(sha256sum scripts/fa_primary4016_statement_probe.py | awk '{print $1}')" = "69b2a4fa3190a03768cae5c75dea61d24b9cdb96aac5e45403b86cc995290c4e"
          python3 -m py_compile scripts/fa_primary4016_statement_probe.py
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECTED_BASE_SHA256"
          python3 scripts/fa_primary4016_statement_probe.py > "$OUT/GENERATION.json"
          python3 -m json.tool "$OUT/GENERATION.json" >/dev/null
          cp scripts/fa_primary4016_statement_probe.py "$OUT/"

      - name: Install exact pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.0-rc1"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"

      - name: Direct-compile Mock2 and Mock2_Advanced
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          for module in Mock2 Mock2_Advanced; do
            src="PrimalitySheafVerification/${module}.lean"
            cmd="lake env lean -DmaxErrors=1 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${module}.command"
            set +e
            /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
              bash -lc "$cmd" > "$OUT/${module}.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/${module}.exit"
            test "$rc" = 0
          done

      - name: Direct-compile exact prefix
        run: |
          set -euo pipefail
          module=FA_Blocker_Prefix
          src="PrimalitySheafVerification/${module}.lean"
          cmd="lake env lean -DmaxErrors=200 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
          printf '%s\n' "$cmd" > "$OUT/${module}.command"
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
            bash -lc "$cmd" > "$OUT/${module}.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/${module}.exit"
          grep -n ': error:' "$OUT/${module}.log" > "$OUT/${module}.error-headers.txt" || true
          test "$rc" = 0

      - name: Find first statement candidate with direct local exit 0
        id: candidates
        run: |
          set -euo pipefail
          printf 'candidate_id,exit_code,error_headers,elapsed_seconds,source_sha256\n' > "$OUT/candidate-summary.csv"
          selected=''
          for src in PrimalitySheafVerification/FA_Blocker_StatementCandidates/Candidate*.lean; do
            base="$(basename "$src" .lean)"
            cid="${base#Candidate}"
            outdir="${ARTIFACT_DIR}/FA_Blocker_StatementCandidates"
            mkdir -p "$outdir"
            cmd="lake env lean -DmaxErrors=50 -DwarningAsError=false -o ${outdir}/${base}.olean -i ${outdir}/${base}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${base}.command"
            start="$(date +%s)"
            set +e
            timeout 360 bash -lc "$cmd" > "$OUUЙШ\Щ_K›ЩИ€Џ‰ЊB€ПIВ€Щ]YB€[™H‰
