name: GPT QYM Probe40b control runner

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/gpt-qym-probe40b-control.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: qym-probe40b-control
  cancel-in-progress: false

jobs:
  direct:
    name: exact 89-error authority to integrated full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 240

    steps:
      - name: Checkout exact QYM repair commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: 237952a7d6e2ed1e709f7b0df1c764dacb19e688
          persist-credentials: false

      - name: Download exact immutable 89-error authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qym-probe35-flat_named-da2958a421605d9b267afdce59990ec19c1be10f-attempt1
          path: ${{ runner.temp }}/authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32095253829

      - name: Restore verified dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Run exact patch gates and full QYM direct Lean
        shell: bash
        run: bash .github/qym_probe40b_execute.sh

      - name: Upload immutable full-QYM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe40b-control-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-probe40b/**
          if-no-files-found: error
          retention-days: 30

      - name: Require strict GLOBAL_BEST improvement or TRUE PASS
        if: always()
        shell: bash
        run: |
          python3 - /tmp/qym-probe40b/PROBE_RESULT.json <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['candidate_qym_sha256'] == 'f1f82104eafe6cce42fc6c0db4d16a0f293f70891302a4453ba14aa8453dfcb0'
          assert r['candidate_qym_blob'] == '0b20e890c0a62ae0b7b2d43f841ccfe570758ddb'
          assert r['panic_lines'] == 0
          if r['semantic_pass']:
              raise SystemExit(0)
          if r['error_headers'] >= 89:
              raise SystemExit(1)
          PY
