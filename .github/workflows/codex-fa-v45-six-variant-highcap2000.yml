name: Codex FA v45 six-variant highcap2000

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-v45-six-variant-highcap2000.yml
      - scripts/fa_v45_materialize_candidate.py
      - scripts/fa_v45_direct_compile_ci.sh
      - scripts/fa_v45_collect_full_diagnostics.py
      - scripts/fa_v45_variants.json
      - scripts/fa_v45_common_exact_repairs.json
      - scripts/fa_v45_common_staged_followons.json
      - scripts/fa_v45_q1_high_confidence_repairs.json
      - scripts/fa_v45_q1_staged_probes.json
      - scripts/fa_v45_q2_high_confidence_repairs.json
      - scripts/fa_v45_q2_staged_probes.json
      - scripts/fa_v45_q3_high_confidence_repairs.json
      - scripts/fa_v45_q3_staged_probes.json
      - scripts/fa_v42_validate_local_repairs.py
      - scripts/fa_v42_direct_compile_ci.sh
      - scripts/fa_v42_collect_full_diagnostics.py
  workflow_dispatch: {}

permissions: {actions: read, contents: read}

# This package uses the fully hydrated READY index produced after the final Q2
# independent audit. M13 is excluded from all six regular variants.
env:
  FA_V45_AUTHORITY_RUN_ID: "31719983304"
  FA_V45_AUTHORITY_JOB_ID: "94514229853"
  FA_V45_AUTHORITY_HEAD_SHA: dda6274627f628eca6cbfcef48f0c6e572881f0c
  FA_V45_AUTHORITY_ARTIFACT_ID: "9189354873"
  FA_V45_AUTHORITY_ARTIFACT_DIGEST: sha256:78416b511693fe68bd556674246cc0815015f8fddb46afcdc1e34673eefe87e5
  FA_V45_AUTHORITY_SOURCE_SHA256: f8d1b152e1c12639e4fc4f126e501a2a309333c5b8a6f3c8645df3e433572109
  FA_V45_AUTHORITY_DIAGNOSTICS_SHA256: baab8be659f062f26d4b7563073c18480263747bfa45de88c642aeb13e1f4d07
  FA_V45_AUTHORITY_FA_LOG_SHA256: 4edd03f6c327dda4fa5a49cc3fac56e85004199d3a5dfa7aca0c726ab533a73c
  FA_V45_AUTHORITY_METRIC_SHA256: 65ccfd8035d1c3044de2385fe132fe36fdb08cbd4b67a1742313b18f4c20ea8e
  FA_V45_INDEX_SHA256: e96fe0bafb8e145148170b9cf46ac223c97887354de68491018d1baa53b3dfdc
  FA_V45_MATERIALIZER_SHA256: 3df9511cc594b8c6f735aeebb8a805ec4283b23ad7ecd479e31dbb5a68393721
  FA_V45_RUNNER_WRAPPER_SHA256: aa1288ccf39531d5c27215289dbbbe303f2a3782ff8fec21383f10c37522fb87
  FA_V45_COLLECTOR_WRAPPER_SHA256: 10a397ead47b2e8aeefb85f9daea1371f30da416d784e6c28931f2be2c2fe8e6
  FA_V45_V42_COMPOSER_SHA256: 3f4dc4a83a994cd3d014ef7d458fce515bbb59ca0ec80965cdb176a27f266ef7
  FA_V45_V42_RUNNER_SHA256: 2459f0a2cd44f6a3716de1ed2934c7588ba1a1e27ef443947d9e6089af196514
  FA_V45_V42_COLLECTOR_SHA256: 7de7bc92e4e2735c0d25706d70777ea67340d8afcf67434e43b051d5cb8c90c6

jobs:
  direct:
    if: github.ref == 'refs/heads/codex/fa-qym-cleanbuild-final-20260811-fast'
    strategy:
      fail-fast: false
      matrix:
        variant: [core, common_probe, q1_probe, q2_probe, q3_probe, all_probes]
    name: direct-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      FA_V45_VARIANT: "${{ matrix.variant }}"
      FA_V45_OUT: build-logs/codex-fa-v45-six-variant-highcap2000/${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}

      - name: Fail-closed six-variant package and index preflight
        id: preflight
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FA_V45_OUT"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          out = Path(os.environ["FA_V45_OUT"])
          variant = os.environ["FA_V45_VARIANT"]
          expected_variants = {
              "core", "common_probe", "q1_probe", "q2_probe",
              "q3_probe", "all_probes",
          }
          locked = {
              "materializer": (
                  Path("scripts/fa_v45_materialize_candidate.py"),
                  os.environ["FA_V45_MATERIALIZER_SHA256"],
              ),
              "runner_wrapper": (
                  Path("scripts/fa_v45_direct_compile_ci.sh"),
                  os.environ["FA_V45_RUNNER_WRAPPER_SHA256"],
              ),
              "collector_wrapper": (
                  Path("scripts/fa_v45_collect_full_diagnostics.py"),
                  os.environ["FA_V45_COLLECTOR_WRAPPER_SHA256"],
              ),
              "base_composer": (
                  Path("scripts/fa_v42_validate_local_repairs.py"),
                  os.environ["FA_V45_V42_COMPOSER_SHA256"],
              ),
              "base_runner": (
                  Path("scripts/fa_v42_direct_compile_ci.sh"),
                  os.environ["FA_V45_V42_RUNNER_SHA256"],
              ),
              "base_collector": (
                  Path("scripts/fa_v42_collect_full_diagnostics.py"),
                  os.environ["FA_V45_V42_COLLECTOR_SHA256"],
              ),
              "index": (
                  Path("scripts/fa_v45_variants.json"),
                  os.environ["FA_V45_INDEX_SHA256"],
              ),
          }
          evidence = {
              "schema": "fa-v45-six-variant-package-preflight-v1",
              "status": "CHECKING",
              "variant": variant,
              "files": {},
              "exit_code_if_stopped": 86,
          }
          try:
              for label, (path, expected) in locked.items():
                  assert re.fullmatch(r"[0-9a-f]{64}", expected), (
                      label, "pending/invalid hash"
                  )
                  payload = path.read_bytes()
                  actual = hashlib.sha256(payload).hexdigest()
                  assert actual == expected, (label, actual, expected)
                  evidence["files"][label] = {
                      "path": path.as_posix(),
                      "sha256": actual,
                      "bytes": len(payload),
                  }

              index = json.loads(locked["index"][0].read_text())
              assert index["schema"] == "fa-v45-six-variant-index-v1"
              assert index["status"] == (
                  "STATIC_INPUTS_LOCKED_DIRECT_LEAN_UNVERIFIED"
              )
              assert index["runnable"] is True
              assert index["direct_lean_verified"] is False
              assert index["clean_build_claimed"] is False
              assert set(index["variants"]) == expected_variants
              assert variant in expected_variants
              assert index["variants"][variant]["status"] == "LOCKED"
              assert index["variants"][variant]["runnable"] is True
              assert index["variants"][variant]["source_moves"] == []
              assert index["variants"][variant]["m13_excluded"] is True
              assert index["excluded_source_moves"]["middle_m13"][
                  "selected_by"
              ] == []
              assert [row["source"] for row in index["direct_compile_chain"]] == [
                  "Mock2", "Mock2_Advanced", "Mock2_FunctionalAnalysis"
              ]
              assert [row["max_errors"] for row in index["direct_compile_chain"]] == [
                  1, 1, 2000
              ]
              authority = index["authority"]
              for key, expected in {
                  "run_id": int(os.environ["FA_V45_AUTHORITY_RUN_ID"]),
                  "job_id": int(os.environ["FA_V45_AUTHORITY_JOB_ID"]),
                  "head_sha": os.environ["FA_V45_AUTHORITY_HEAD_SHA"],
                  "artifact_id": int(os.environ["FA_V45_AUTHORITY_ARTIFACT_ID"]),
                  "artifact_digest": os.environ["FA_V45_AUTHORITY_ARTIFACT_DIGEST"],
                  "source_sha256": os.environ["FA_V45_AUTHORITY_SOURCE_SHA256"],
                  "diagnostics_sha256": os.environ["FA_V45_AUTHORITY_DIAGNOSTICS_SHA256"],
                  "fa_log_sha256": os.environ["FA_V45_AUTHORITY_FA_LOG_SHA256"],
                  "metric_sha256": os.environ["FA_V45_AUTHORITY_METRIC_SHA256"],
              }.items():
                  assert authority[key] == expected, (key, authority[key], expected)
              row = index["variants"][variant]
              evidence["status"] = "READY"
              evidence["index_sha256"] = evidence["files"]["index"]["sha256"]
              evidence["candidate_sha256"] = row["candidate_sha256"]
              evidence["audit_sha256"] = row["audit_sha256"]
              evidence["m13_excluded"] = True
              (out / "PACKAGE_PREFLIGHT.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n"
              )
              with Path(os.environ["GITHUB_ENV"]).open("a") as handle:
                  handle.write(
                      "FA_V45_INDEX_ACTUAL_SHA256="
                      + evidence["index_sha256"] + "\n"
                  )
                  handle.write(
                      "FA_V45_EXPECTED_CANDIDATE_SHA256="
                      + row["candidate_sha256"] + "\n"
                  )
                  handle.write(
                      "FA_V45_EXPECTED_AUDIT_SHA256="
                      + row["audit_sha256"] + "\n"
                  )
          except BaseException:
              evidence["status"] = "INVALID_FAIL_CLOSED"
              (out / "PACKAGE_PREFLIGHT.json").write_text(
                  json.dumps(evidence, indent=2, sort_keys=True) + "\n"
              )
              raise
          PY

      - name: Re-prove exact v43 middle authority and materialize v45 variant
        id: materialize
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          authority_root="/tmp/fa-v45-authority-${GITHUB_RUN_ID}-${FA_V45_VARIANT}"
          authority_zip="/tmp/fa-v45-authority-${GITHUB_RUN_ID}-${FA_V45_VARIANT}.zip"
          mkdir -p "$FA_V45_OUT" "$authority_root"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FA_V45_AUTHORITY_RUN_ID}" >"$FA_V45_OUT/V43_RUN.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FA_V45_AUTHORITY_JOB_ID}" >"$FA_V45_OUT/V43_JOB.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V45_AUTHORITY_ARTIFACT_ID}" >"$FA_V45_OUT/V43_ARTIFACT.json"

          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          out = Path(os.environ["FA_V45_OUT"])
          run = json.loads((out / "V43_RUN.json").read_text())
          job = json.loads((out / "V43_JOB.json").read_text())
          artifact = json.loads((out / "V43_ARTIFACT.json").read_text())
          run_id = int(os.environ["FA_V45_AUTHORITY_RUN_ID"])
          job_id = int(os.environ["FA_V45_AUTHORITY_JOB_ID"])
          artifact_id = int(os.environ["FA_V45_AUTHORITY_ARTIFACT_ID"])
          head = os.environ["FA_V45_AUTHORITY_HEAD_SHA"]
          branch = "codex/fa-qym-cleanbuild-final-20260811-fast"
          artifact_name = "codex-fa-v43-middle_probe-highcap2000-" + head
          assert run["id"] == run_id
          assert run["name"] == "Codex FA v43 five-variant highcap2000"
          assert run["path"] == (
              ".github/workflows/codex-fa-v43-five-variant-highcap2000.yml"
          )
          assert run["head_sha"] == head and run["head_branch"] == branch
          assert run["status"] == "completed" and run["conclusion"] == "failure"
          assert job["id"] == job_id and job["run_id"] == run_id
          assert job["name"] == "direct-middle_probe"
          assert job["head_sha"] == head
          assert job["status"] == "completed" and job["conclusion"] == "failure"
          assert artifact["id"] == artifact_id
          assert artifact["name"] == artifact_name
          assert artifact["size_in_bytes"] == 1_683_548
          assert artifact["expired"] is False
          assert artifact["digest"] == os.environ[
              "FA_V45_AUTHORITY_ARTIFACT_DIGEST"
          ]
          assert artifact["workflow_run"]["id"] == run_id
          assert artifact["workflow_run"]["head_sha"] == head
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V45_AUTHORITY_ARTIFACT_ID}/zip" >"$authority_zip"
          test "sha256:$(sha256sum "$authority_zip" | awk '{print $1}')" = "$FA_V45_AUTHORITY_ARTIFACT_DIGEST"
          unzip -q "$authority_zip" -d "$authority_root"

          AUTHORITY_ROOT="$authority_root" python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil

          root = Path(os.environ["AUTHORITY_ROOT"])
          out = Path(os.environ["FA_V45_OUT"])

          def one(name, expected_sha, expected_bytes, expected_lines):
              hits = [
                  path for path in root.rglob(name)
                  if hashlib.sha256(path.read_bytes()).hexdigest() == expected_sha
              ]
              assert len(hits) == 1, (name, hits)
              payload = hits[0].read_bytes()
              assert len(payload) == expected_bytes, (name, len(payload))
              assert len(payload.decode("utf-8").splitlines()) == expected_lines
              return hits[0]

          source = one(
              "Mock2_FunctionalAnalysis-candidate.lean",
              os.environ["FA_V45_AUTHORITY_SOURCE_SHA256"],
              2_785_412,
              62_304,
          )
          diagnostics = one(
              "FULL_DIAGNOSTICS.json",
              os.environ["FA_V45_AUTHORITY_DIAGNOSTICS_SHA256"],
              38_237,
              842,
          )
          fa_log = one(
              "Mock2_FunctionalAnalysis.log",
              os.environ["FA_V45_AUTHORITY_FA_LOG_SHA256"],
              331_298,
              5_572,
          )
          metric = one(
              "METRIC.json",
              os.environ["FA_V45_AUTHORITY_METRIC_SHA256"],
              2_976,
              72,
          )
          parsed = json.loads(diagnostics.read_text())
          assert isinstance(parsed, list) and len(parsed) == 60
          data = json.loads(metric.read_text())
          assert data["github_run_id"] == "31719983304"
          assert data["github_head_sha"] == (
              "dda6274627f628eca6cbfcef48f0c6e572881f0c"
          )
          assert data["variant"] == "middle_probe"
          assert data["Mock2_exit"] == 0
          assert data["Mock2_Advanced_exit"] == 0
          assert data["FA_exit"] == 1
          assert data["FA_compile_max_errors"] == 2000
          assert data["FA_error_headers_captured"] == 60
          assert data["unique_declarations_with_errors"] == 39
          assert data["unique_normalized_message_signatures"] == 19
          assert data["FA_warning_headers_captured"] == 461
          assert data["synthetic_declaration_uses_sorry_warning_count"] == 1
          assert data["FA_error_cap_sentinel_present"] is False
          assert data["source_executable_trust_six_zero"] is True

          runtime_source = Path(
              "work/v43-run-31719983304/9189354873/"
              "Mock2_FunctionalAnalysis-candidate.lean"
          )
          runtime_source.parent.mkdir(parents=True, exist_ok=True)
          shutil.copyfile(source, runtime_source)
          shutil.copyfile(source, out / "V43_AUTHORITY_SOURCE.lean")
          shutil.copyfile(diagnostics, out / "V43_FULL_DIAGNOSTICS.json")
          shutil.copyfile(fa_log, out / "V43_Mock2_FunctionalAnalysis.log")
          shutil.copyfile(metric, out / "V43_METRIC.json")
          PY

          python3 scripts/fa_v45_materialize_candidate.py \
            --index scripts/fa_v45_variants.json \
            --variant "$FA_V45_VARIANT" \
            --base-composer scripts/fa_v42_validate_local_repairs.py \
            --output /tmp/fa-v45-final.lean \
            --audit "$FA_V45_OUT/PATCH_AUDIT.json" \
            --evidence "$FA_V45_OUT/MATERIALIZATION.json" \
            >"$FA_V45_OUT/MATERIALIZATION.stdout.json"

          test "$(sha256sum /tmp/fa-v45-final.lean | awk '{print $1}')" = "$FA_V45_EXPECTED_CANDIDATE_SHA256"
          test "$(sha256sum "$FA_V45_OUT/PATCH_AUDIT.json" | awk '{print $1}')" = "$FA_V45_EXPECTED_AUDIT_SHA256"
          cp /tmp/fa-v45-final.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp /tmp/fa-v45-final.lean "$FA_V45_OUT/Mock2_FunctionalAnalysis-candidate.lean"
          cp scripts/fa_v45_variants.json "$FA_V45_OUT/VARIANT_INDEX.json"
          sha256sum /tmp/fa-v45-final.lean | awk '{print $1}' >"$FA_V45_OUT/candidate.sha256"
          sha256sum "$FA_V45_OUT/PATCH_AUDIT.json" | awk '{print $1}' >"$FA_V45_OUT/audit.sha256"

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FA_V45_OUT"
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$FA_V45_OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$FA_V45_OUT/toolchain.log" 2>&1
          lake exe cache get >"$FA_V45_OUT/cache.log" 2>&1
          lean --version >"$FA_V45_OUT/lean-version.txt" 2>&1
          lake --version >"$FA_V45_OUT/lake-version.txt" 2>&1

      - name: Direct Mock2 then Mock2 Advanced then full FA highcap2000
        id: compile
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/fa_v45_direct_compile_ci.sh

      - name: Build exact metrics and full diagnostic inventory
        if: always() && steps.materialize.outcome == 'success'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FA_V45_OUT"
          if [[ -f PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean ]]; then
            cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$FA_V45_OUT/Mock2_FunctionalAnalysis-observed.lean"
          fi
          python3 scripts/fa_v45_collect_full_diagnostics.py \
            --base-collector scripts/fa_v42_collect_full_diagnostics.py \
            --base-collector-sha256 "$FA_V45_V42_COLLECTOR_SHA256" \
            --source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --out "$FA_V45_OUT" \
            --max-errors 2000 \
            >"$FA_V45_OUT/metric-console.log"

      - name: Upload exact variant source and all evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v45-${{ matrix.variant }}-highcap2000-${{ github.sha }}
          path: build-logs/codex-fa-v45-six-variant-highcap2000/${{ matrix.variant }}
          retention-days: 30

      - name: Preserve fail-closed state or mirror strict direct-chain exits
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$FA_V45_OUT/PACKAGE_PREFLIGHT.json" || exit 86
          test "$(python3 -c 'import json,os; print(json.load(open(os.path.join(os.environ["FA_V45_OUT"], "PACKAGE_PREFLIGHT.json")))["status"])')" = READY || exit 86
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
            test -f "$FA_V45_OUT/${stem}.exit" || exit 86
            status="$(tr -d '\r\n' < "$FA_V45_OUT/${stem}.exit")"
            [[ "$status" =~ ^[0-9]+$ ]] || exit 86
          done
          test -f "$FA_V45_OUT/METRIC.json" || exit 86
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os

          out = Path(os.environ["FA_V45_OUT"])
          metric = json.loads((out / "METRIC.json").read_text())

          def exit_value(stem):
              text = (out / f"{stem}.exit").read_text().strip()
              assert text.isdigit(), (stem, text)
              return int(text)

          m2 = exit_value("Mock2")
          m2a = exit_value("Mock2_Advanced")
          fa = exit_value("Mock2_FunctionalAnalysis")
          assert m2 == 0 and m2a == 0
          assert metric["Mock2_exit"] == m2
          assert metric["Mock2_Advanced_exit"] == m2a
          assert metric["FA_exit"] == fa
          assert metric["FA_compile_max_errors"] == 2000
          assert metric["FA_error_cap_sentinel_present"] is False
          assert metric["FA_inventory_below_configured_cap"] is True
          assert metric["FA_inventory_complete_by_header_evidence"] is True
          assert metric["source_identity_locked"] is True
          assert metric["source_sha256"] == os.environ[
              "FA_V45_EXPECTED_CANDIDATE_SHA256"
          ]
          assert metric["candidate_expected_sha256"] == os.environ[
              "FA_V45_EXPECTED_CANDIDATE_SHA256"
          ]
          assert metric["candidate_locked_sha256"] == os.environ[
              "FA_V45_EXPECTED_CANDIDATE_SHA256"
          ]
          assert metric["variant_index_expected_sha256"] == os.environ[
              "FA_V45_INDEX_SHA256"
          ]
          assert metric["variant_index_actual_sha256"] == os.environ[
              "FA_V45_INDEX_ACTUAL_SHA256"
          ]
          assert metric["source_executable_trust_six_zero"] is True
          assert all(
              value == 0
              for value in metric["source_executable_trust_counts"].values()
          )
          assert metric["all_required_lean_executed"] is True
          assert metric["all_required_raw_logs_from_execution"] is True
          assert metric["all_required_raw_logs_uploaded"] is True
          assert metric["direct_lean_verified"] is True
          assert metric["raw_log_placeholders"] == []
          assert metric["exit_parse_errors"] == {}
          if fa == 0:
              assert metric["synthetic_declaration_uses_sorry_warning_count"] == 0
              assert metric["synthetic_trust_clean"] is True
              assert metric["compiler_exit_clean"] is True
              assert metric["semantic_clean"] is True
          else:
              assert metric["compiler_exit_clean"] is False
              assert metric["semantic_clean"] is False
          (out / "FINAL_GATE.json").write_text(json.dumps({
              "schema": "fa-v45-six-variant-final-gate-v1",
              "status": "PASS",
              "variant": os.environ["FA_V45_VARIANT"],
              "metric_sha256": hashlib.sha256(
                  (out / "METRIC.json").read_bytes()
              ).hexdigest(),
              "Mock2_exit": m2,
              "Mock2_Advanced_exit": m2a,
              "FA_exit": fa,
              "source_identity_locked": True,
              "source_executable_trust_six_zero": True,
              "all_required_lean_executed": True,
              "direct_lean_verified": True,
              "semantic_clean": metric["semantic_clean"],
              "synthetic_sorry_count": metric[
                  "synthetic_declaration_uses_sorry_warning_count"
              ],
          }, indent=2, sort_keys=True) + "\n")
          PY
          fa_exit="$(tr -d '\r\n' < "$FA_V45_OUT/Mock2_FunctionalAnalysis.exit")"
          exit "$fa_exit"
