name: Discover PASS 341 branch runs

on:
  push:
    branches: [fix/fa341-final-isolated-20260808]
    paths:
      - '.github/workflows/discover-fa341-runs.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: discover-fa341-runs
  cancel-in-progress: true

jobs:
  discover:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa341-final-isolated-20260808
          fetch-depth: 1
          persist-credentials: true

      - name: Record matching workflow runs
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=fix%2Ffa341-final-isolated-20260808&per_page=100" \
            --jq '{total_count, workflow_runs: [.workflow_runs[] | {id,name,status,conclusion,head_sha,event,created_at,updated_at}]}' \
            > build-logs/fa341-run-discovery.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa341-run-discovery.json
          git diff --cached --quiet || git commit -m 'ci: record PASS 341 branch run discovery'
          git push origin HEAD:fix/fa341-final-isolated-20260808
