name: Primality Sheaf Repair Matrix
# Temporary shell-only validator: avoids marketplace action download failures.
# It compiles checked-in Mock2 directly, applies pass 312 only to the Advanced
# candidate, compiles that candidate twice, and commits only after all gates pass.

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2.lean'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'scripts/apply_two_hundred_eighty_ninth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninetieth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_first_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_second_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_third_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fourth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fifth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_seventh_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_eighth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundredth_pass_repairs.py'
      - 'scripts/apply_three_hundred_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundred_tenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_eleventh_pass_repairs.py'
      - 'scripts/apply_three_hundred_twelfth_pass_repairs.py'
      - '.github/workflows/primality-sheaf-repair-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: primality-sheaf-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  advanced-shell-materialize:
    name: Shell verify Mock2 and materialize Mock2 Advanced pass 312
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      MOCK2: PrimalitySheafVerification/Mock2.lean
      EXPECTED_ADVANCED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_ADVANCED_CANDIDATE_SHA256: 5ed076b1eda61c1702243aa5a391e2db76265d1a28b55834527d15e2dd4f788b
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      LOGDIR: build-logs/advanced-shell-pass312

    steps:
      - name: Clone exact pull-request head without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "${HEAD_BRANCH}" = "${BRANCH}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_START_BLOB}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' \
            "head_sha=${HEAD_SHA}" \
            "advanced_start_blob=$(git hash-object "${ADVANCED}")" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            > "${LOGDIR}/snapshot.txt"

      - name: Apply accumulated Advanced repairs and isolate one source file
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
            python3 scripts/apply_three_hundredth_pass_repairs.py
            python3 scripts/apply_three_hundred_ninth_pass_repairs.py
            python3 scripts/apply_three_hundred_tenth_pass_repairs.py
            python3 scripts/apply_three_hundred_eleventh_pass_repairs.py
            python3 scripts/apply_three_hundred_twelfth_pass_repairs.py
          } 2>&1 | tee "${LOGDIR}/repair-application.log"

          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${ADVANCED}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)

          test "$(git diff --name-only)" = "${ADVANCED}"
          git diff --check
          advanced_sha="$(sha256sum "${ADVANCED}" | awk '{print $1}')"
          test "${advanced_sha}" = "${EXPECTED_ADVANCED_CANDIDATE_SHA256}"
          printf '%s\n' \
            "advanced_candidate_sha256=${advanced_sha}" \
            "advanced_candidate_lines=$(wc -l < "${ADVANCED}")" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Static forbidden-token gate on candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          src = Path("PrimalitySheafVerification/Mock2_Advanced.lean").read_text(encoding="utf-8")
          out = []
          i = 0
          depth = 0
          in_string = False
          escaped = False
          while i < len(src):
              if depth:
                  if src.startswith("/-", i):
                      depth += 1; out.extend("  "); i += 2
                  elif src.startswith("-/", i):
                      depth -= 1; out.extend("  "); i += 2
                  else:
                      out.append("\n" if src[i] == "\n" else " "); i += 1
                  continue
              if in_string:
                  ch = src[i]
                  out.append("\n" if ch == "\n" else " ")
                  if escaped: escaped = False
                  elif ch == "\\": escaped = True
                  elif ch == '"': in_string = False
                  i += 1
                  continue
              if src.startswith("/-", i):
                  depth = 1; out.extend("  "); i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n": out.append(" "); i += 1
              elif src[i] == '"':
                  in_string = True; out.append(" "); i += 1
              else:
                  out.append(src[i]); i += 1

          code = "".join(out)
          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
          }
          bad = False
          for name, pattern in checks.items():
              count = len(list(re.finditer(pattern, code)))
              print(f"{name}: {count}")
              bad |= count != 0
          if depth or in_string: raise SystemExit("unterminated comment or string")
          if bad: raise SystemExit("forbidden executable token detected")
          PY

      - name: Install pinned Lean toolchain without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/elan" --version
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" --version

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Regress checked-in Mock2 and compile Advanced candidate twice
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}" "${LOGDIR}"

          rm -f "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" "${outdir}/Mock2.olean.private"
          set +e
          "${HOME}/.elan/bin/lake" env lean "${MOCK2}" \
            -o "${outdir}/Mock2.olean" -i "${outdir}/Mock2.ilean" 2>&1 \
            | tee "${LOGDIR}/Mock2.log"
          mock2_code=${PIPESTATUS[0]}
          set -e
          echo "${mock2_code}" > "${LOGDIR}/Mock2-exit-code.txt"
          test "${mock2_code}" -eq 0
          test -s "${outdir}/Mock2.olean"
          test -s "${outdir}/Mock2.ilean"
          test "$(grep -c 'error:' "${LOGDIR}/Mock2.log" || true)" -eq 0

          for pass in 1 2; do
            rm -f \
              "${outdir}/Mock2_Advanced.olean" \
              "${outdir}/Mock2_Advanced.ilean" \
              "${outdir}/Mock2_Advanced.olean.private"
            set +e
            "${HOME}/.elan/bin/lake" env lean "${ADVANCED}" \
              -o "${outdir}/Mock2_Advanced.olean" \
              -i "${outdir}/Mock2_Advanced.ilean" 2>&1 \
              | tee "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "${code}" > "${LOGDIR}/Mock2_Advanced-exit-code-pass${pass}.txt"
            test "${code}" -eq 0
            test -s "${outdir}/Mock2_Advanced.olean"
            test -s "${outdir}/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
          done

          sha256sum \
            "${MOCK2}" "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
            "${ADVANCED}" "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean" \
            | tee "${LOGDIR}/sha256.txt"

      - name: Commit only the twice-verified Advanced source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger_head=${HEAD_SHA}"
          echo "remote_head=${remote_head}"
          test "${remote_head}" = "${HEAD_SHA}"
          test "$(git diff --name-only)" = "${ADVANCED}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${ADVANCED}"
          test "$(git diff --cached --name-only)" = "${ADVANCED}"
          git commit -m 'fix: materialize Mock2 Advanced pass 312 candidate'
          git push origin "HEAD:${BRANCH}"
