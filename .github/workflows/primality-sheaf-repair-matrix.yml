name: Primality Sheaf Repair Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/apply_two_hundred_eighty_ninth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninetieth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_first_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_second_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_third_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fourth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fifth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_seventh_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_eighth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundredth_pass_repairs.py'
      - 'scripts/apply_three_hundred_first_pass_mock2_repairs.py'
      - '.github/workflows/primality-sheaf-repair-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primality-sheaf-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module:
          - Mock2
          - Mock2_Advanced
          - Mock2_FunctionalAnalysis

    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Apply current candidate repairs
        shell: bash
        run: |
          set -euo pipefail
          module='${{ matrix.module }}'
          logdir="build-logs/${module}"
          mkdir -p "$logdir"
          if [[ "$module" == 'Mock2' ]]; then
            python3 scripts/apply_three_hundred_first_pass_mock2_repairs.py 2>&1 \
              | tee "$logdir/repair-application.log"
          else
            {
              python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
              python3 scripts/apply_three_hundredth_pass_repairs.py
            } 2>&1 | tee "$logdir/repair-application.log"
          fi

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile current candidate from clean project artifacts
        shell: bash
        run: |
          set +e
          module='${{ matrix.module }}'
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          logdir="build-logs/${module}"
          mkdir -p "$logdir" "$outdir"
          rm -f \
            "$outdir/${module}.olean" \
            "$outdir/${module}.ilean" \
            "$outdir/${module}.olean.private"
          cp "PrimalitySheafVerification/${module}.lean" "$logdir/repaired-source.lean"
          lake env lean "PrimalitySheafVerification/${module}.lean" \
            -o "$outdir/${module}.olean" \
            -i "$outdir/${module}.ilean" 2>&1 \
            | tee "$logdir/${module}.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$logdir/exit-code.txt"
          exit "$code"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-${{ matrix.module }}
          path: build-logs/${{ matrix.module }}
          if-no-files-found: error
          retention-days: 30
