name: Primality Sheaf Repair Matrix
# Mock2 is materialized; this run validates the checked-in source without runtime patching.

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/apply_two_hundred_eighty_ninth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninetieth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_first_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_second_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_third_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fourth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fifth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_seventh_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_eighth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundredth_pass_repairs.py'
      - 'scripts/apply_mock2_passes_286_to_288_repairs.py'
      - 'scripts/apply_three_hundred_second_pass_mock2_repairs.py'
      - 'scripts/apply_three_hundred_third_pass_mock2_repairs.py'
      - 'scripts/apply_three_hundred_fourth_pass_mock2_repairs.py'
      - '.github/workflows/primality-sheaf-repair-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primality-sheaf-matrix-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module:
          - Mock2
          - Mock2_Advanced
          - Mock2_FunctionalAnalysis

    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Apply current candidate repairs
        shell: bash
        run: |
          set -euo pipefail
          module='${{ matrix.module }}'
          logdir="build-logs/${module}"
          mkdir -p "$logdir"
          if [[ "$module" == 'Mock2' ]]; then
            if grep -q '^def sourceResInType ' PrimalitySheafVerification/Mock2.lean \
                && grep -q 'StandaloneZeroProfileCertificate' PrimalitySheafVerification/Mock2.lean \
                && grep -q '(M N : ℕ) (hM : M ≠ 0) : Type 1 where' PrimalitySheafVerification/Mock2.lean \
                && grep -q 'StaticAcceptanceCertificate (D : PaperElementaryInputData) : Type 2 where' PrimalitySheafVerification/Mock2.lean; then
              echo '[mock2-repair] checked-in Mock2 source is already materialized; runtime repair skipped' \
                | tee "$logdir/repair-application.log"
            else
              {
                python3 scripts/apply_mock2_passes_286_to_288_repairs.py
                python3 scripts/apply_three_hundred_second_pass_mock2_repairs.py
                python3 scripts/apply_three_hundred_third_pass_mock2_repairs.py
                python3 scripts/apply_three_hundred_fourth_pass_mock2_repairs.py
              } 2>&1 | tee "$logdir/repair-application.log"
            fi
          else
            {
              python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
              python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
              python3 scripts/apply_three_hundredth_pass_repairs.py
            } 2>&1 | tee "$logdir/repair-application.log"
          fi

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile current candidate from clean project artifacts
        shell: bash
        run: |
          set +e
          module='${{ matrix.module }}'
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          logdir="build-logs/${module}"
          mkdir -p "$logdir" "$outdir"
          cp "PrimalitySheafVerification/${module}.lean" "$logdir/repaired-source.lean"
          : > "$logdir/${module}.log"

          passes=1
          if [[ "$module" == 'Mock2' ]]; then
            passes=2
          fi

          for pass in $(seq 1 "$passes"); do
            rm -f \
              "$outdir/${module}.olean" \
              "$outdir/${module}.ilean" \
              "$outdir/${module}.olean.private"
            echo "===== ${module} clean compile pass ${pass}/${passes} =====" \
              | tee -a "$logdir/${module}.log"
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "$outdir/${module}.olean" \
              -i "$outdir/${module}.ilean" 2>&1 \
              | tee "$logdir/${module}-pass${pass}.log" \
              | tee -a "$logdir/${module}.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "$logdir/exit-code-pass${pass}.txt"
            if [[ "$code" -ne 0 ]]; then
              echo "$code" > "$logdir/exit-code.txt"
              exit "$code"
            fi
          done

          test -f "$outdir/${module}.olean"
          test -f "$outdir/${module}.ilean"
          sha256sum \
            "PrimalitySheafVerification/${module}.lean" \
            "$outdir/${module}.olean" \
            "$outdir/${module}.ilean" \
            > "$logdir/sha256.txt"
          find "$outdir" -maxdepth 1 -type f -name "${module}.*lean" -printf '%f\n' \
            | sort > "$logdir/generated-artifacts.txt"
          echo 0 > "$logdir/exit-code.txt"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-${{ matrix.module }}
          path: build-logs/${{ matrix.module }}
          if-no-files-found: error
          retention-days: 30
