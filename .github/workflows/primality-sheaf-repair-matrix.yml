name: Primality Sheaf Repair Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/materialize_primality_repairs.py'
      - '.github/workflows/primality-sheaf-repair-matrix.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primality-sheaf-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  materialize:
    name: Materialize accumulated source repairs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    outputs:
      changed: ${{ steps.materialize.outputs.changed }}
    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Apply and commit accumulated repairs
        id: materialize
        shell: bash
        run: |
          if git log -1 --pretty=%s | grep -q 'materialize current primality repairs'; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          python3 scripts/materialize_primality_repairs.py
          if git diff --quiet -- PrimalitySheafVerification; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PrimalitySheafVerification
          git commit -m 'chore: materialize current primality repairs'
          git push origin HEAD:fix/primality-sheaf-clean-build
          echo 'changed=true' >> "$GITHUB_OUTPUT"

  repair:
    name: Check ${{ matrix.module }}
    needs: materialize
    if: needs.materialize.outputs.changed == 'false'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module: [Mock1_Advanced, Mock2, Mock2_Advanced, Mock2_FunctionalAnalysis]

    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile checked-in source
        shell: bash
        run: |
          set +e
          module='${{ matrix.module }}'
          mkdir -p "build-logs/${module}" '.lake/build/lib/lean/PrimalitySheafVerification'
          cp "PrimalitySheafVerification/${module}.lean" "build-logs/${module}/checked-in-source.lean"
          lake env lean "PrimalitySheafVerification/${module}.lean" \
            -o ".lake/build/lib/lean/PrimalitySheafVerification/${module}.olean" \
            -i ".lake/build/lib/lean/PrimalitySheafVerification/${module}.ilean" 2>&1 \
            | tee "build-logs/${module}/${module}.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "build-logs/${module}/exit-code.txt"
          exit "$code"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: check-${{ matrix.module }}
          path: build-logs/${{ matrix.module }}
          if-no-files-found: error
          retention-days: 30
