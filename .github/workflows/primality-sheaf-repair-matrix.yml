name: Primality Sheaf Repair Matrix

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/apply_*.py'
      - '.github/workflows/primality-sheaf-repair-matrix.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: primality-sheaf-matrix-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repair:
    name: Repair ${{ matrix.module }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        module: [Mock1_Advanced, Mock2, Mock2_Advanced, Mock2_FunctionalAnalysis]

    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Apply current unmaterialized repairs
        run: |
          python3 scripts/apply_current_repairs.py
          python3 scripts/apply_two_hundred_twenty_third_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_fourth_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_fifth_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_sixth_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_seventh_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_eighth_pass_repairs.py
          python3 scripts/apply_two_hundred_twenty_ninth_pass_repairs.py
          python3 scripts/apply_two_hundred_thirtieth_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_first_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_second_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_third_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_fourth_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_fifth_pass_repairs.py
          python3 scripts/apply_two_hundred_thirty_sixth_pass_repairs.py

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile
        shell: bash
        run: |
          set +e
          module='${{ matrix.module }}'
          mkdir -p "build-logs/${module}" '.lake/build/lib/lean/PrimalitySheafVerification'
          cp "PrimalitySheafVerification/${module}.lean" "build-logs/${module}/repaired-source.lean"
          lake env lean "PrimalitySheafVerification/${module}.lean" \
            -o ".lake/build/lib/lean/PrimalitySheafVerification/${module}.olean" \
            -i ".lake/build/lib/lean/PrimalitySheafVerification/${module}.ilean" 2>&1 \
            | tee "build-logs/${module}/${module}.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "build-logs/${module}/exit-code.txt"
          exit "$code"

      - name: Upload log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: repair-${{ matrix.module }}
          path: build-logs/${{ matrix.module }}
          if-no-files-found: error
          retention-days: 30
