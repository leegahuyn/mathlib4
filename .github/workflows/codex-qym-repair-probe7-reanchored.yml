          test "$(sha256sum "$P5_LINE41115" | awk '{print $1}')" = "$EXPECTED_P5_LINE41115_SHA256"
          test "$(sha256sum "$P5_EARLYMID" | awk '{print $1}')" = "$EXPECTED_P5_EARLYMID_SHA256"
          test "$(sha256sum "$P5_REALPARTFORM" | awk '{print $1}')" = "$EXPECTED_P5_REALPARTFORM_SHA256"
          test "$(sha256sum "$P5_SURVIVOR" | awk '{print $1}')" = "$EXPECTED_P5_SURVIVOR_SHA256"
          test "$(sha256sum "$P5_LATE" | awk '{print $1}')" = "$EXPECTED_P5_LATE_SHA256"
          test "$(sha256sum "$P5_INTEGRATOR" | awk '{print $1}')" = "$EXPECTED_P5_INTEGRATOR_SHA256"
          test "$(sha256sum "$P6_FRONTIER" | awk '{print $1}')" = "$EXPECTED_P6_FRONTIER_SHA256"
          test "$(sha256sum "$P6_FRONTIER_ADDON" | awk '{print $1}')" = "$EXPECTED_P6_FRONTIER_ADDON_SHA256"
          test "$(sha256sum "$P6_CONDITIONAL" | awk '{print $1}')" = "$EXPECTED_P6_CONDITIONAL_SHA256"
          test "$(sha256sum "$P6_LATE" | awk '{print $1}')" = "$EXPECTED_P6_LATE_SHA256"
          test "$(sha256sum "$P6_INTEGRATOR" | awk '{print $1}')" = "$EXPECTED_P6_INTEGRATOR_SHA256"
          test "$(sha256sum "$P7_HELPER" | awk '{print $1}')" = "$EXPECTED_P7_HELPER_SHA256"
          cp "$QYM_SOURCE" "$OUT/QYM.authority.lean"
          cp lean-toolchain "$OUT/lean-toolchain.txt"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.before.txt"
          test ! -s "$OUT/git-status.before.txt"


      - name: Download immutable terminal Probe6 authority artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.REQUIRED_PROBE6_ARTIFACT_NAME }}
          path: ${{ runner.temp }}/probe6-authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 31966015791

      - name: Hard gate Probe7 activation on exact Probe6 bytes and survivors
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          authority="$RUNNER_TEMP/probe6-authority"
          test -f "$authority/PROBE_RESULT.json"
          test -f "$authority/QYM.candidate-probe6.lean"
          test -f "$authority/QYM.log"
          test -f "$authority/QYM.error-headers.txt"
          test -f "$authority/QYM.exit"
          test "$(sha256sum "$authority/PROBE_RESULT.json" | awk '{print $1}')" = "$REQUIRED_PROBE6_RESULT_SHA256"
          test "$(sha256sum "$authority/QYM.candidate-probe6.lean" | awk '{print $1}')" = "$EXPECTED_PROBE6_SHA256"
          test "$(git hash-object --no-filters "$authority/QYM.candidate-probe6.lean")" = "$EXPECTED_PROBE6_BLOB"
          test "$(sha256sum "$authority/QYM.log" | awk '{print $1}')" = "$REQUIRED_PROBE6_LOG_SHA256"
          test "$(sha256sum "$authority/QYM.error-headers.txt" | awk '{print $1}')" = "$REQUIRED_PROBE6_HEADERS_SHA256"
          test "$(tr -d '\r\n' < "$authority/QYM.exit")" = 1
          python3 - "$authority/PROBE_RESULT.json" "$authority/QYM.error-headers.txt" <<'PY'
          import json, os, re, sys
          result = json.load(open(sys.argv[1], encoding='utf-8'))
          headers = open(sys.argv[2], encoding='utf-8').read().splitlines()
          assert result['schema'] == 'qym-deterministic-repair-probe6-integrated-v1'
          assert result['github_sha'] == os.environ['REQUIRED_PROBE6_TRIGGER_SHA']
          assert result['candidate_qym_sha256'] == os.environ['EXPECTED_PROBE6_SHA256']
          assert result['candidate_qym_blob'] == os.environ['EXPECTED_PROBE6_BLOB']
          assert result['log_sha256'] == os.environ['REQUIRED_PROBE6_LOG_SHA256']
          assert result['exit'] == 1 and result['semantic_pass'] is False
          assert result['error_headers'] == int(os.environ['REQUIRED_PROBE6_ERROR_HEADERS'])
          assert result['warning_headers'] == int(os.environ['REQUIRED_PROBE6_WARNING_HEADERS'])
          assert result['panic_lines'] == 0
          required_lines = [23245, 23689, 24569, 25144, 25149, 25193, 25230, 25306, 26434, 26642, 26652, 28358, 28365, 28516, 50491, 50508, 50527, 50538, 50624, 50644, 50767, 50788, 50834, 57535, 57536, 57540, 57541, 59757, 59758, 59765, 59775, 60913, 60939, 61004, 61032, 61056, 61066, 61142, 61184, 61221, 61226, 61233]
          observed = {
              int(match.group(1))
              for line in headers
              if (match := re.search(r'QYM\.lean:(\d+):\d+: error', line))
          }
          missing = sorted(set(required_lines) - observed)
          assert not missing, missing
          evidence = {
              'schema': 'qym-probe7-activation-evidence-v1',
              'status': 'PASS_EXACT_PROBE6_TERMINAL_ARTIFACT_AND_SURVIVORS',
              'probe6_run': int(os.environ['REQUIRED_PROBE6_RUN']),
              'probe6_job': int(os.environ['REQUIRED_PROBE6_JOB']),
              'probe6_artifact_id': int(os.environ['REQUIRED_PROBE6_ARTIFACT_ID']),
              'probe6_trigger_sha': result['github_sha'],
              'probe6_candidate_sha256': result['candidate_qym_sha256'],
              'probe6_log_sha256': result['log_sha256'],
              'error_headers': result['error_headers'],
              'warning_headers': result['warning_headers'],
              'selected_survivor_lines': required_lines,
              'promotion_authorized': False,
          }
          open(os.path.join(os.environ['OUT'], 'PROBE7_ACTIVATION_EVIDENCE.json'), 'w', encoding='utf-8').write(
              json.dumps(evidence, indent=2, sort_keys=True) + '\n')
          PY
          cp "$authority/PROBE_RESULT.json" "$OUT/PROBE6_RESULT.json"
          cp "$authority/QYM.error-headers.txt" "$OUT/PROBE6.error-headers.txt"
          sha256sum "$authority/"* > "$OUT/PROBE6-authority-files.sha256"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" \
            > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          elan --version | tee "$OUT/elan-version.txt"
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore immutable dependency-output cache
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Validate cache state or build exact dependency chain
        id: dependencies
        shell: bash
        env:
          CACHE_HIT: ${{ steps.project-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.project-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.project-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          mkdir -p "$OLEAN_ROOT"
          test -n "$CACHE_PRIMARY_KEY"
          test "$CACHE_PRIMARY_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          case "$CACHE_HIT" in
            true)
              test "$CACHE_MATCHED_KEY" = "$CACHE_PRIMARY_KEY"
              mode=hit-restored
              built=false
              ;;
            '')
              test -z "$CACHE_MATCHED_KEY"
              mode=miss-built
              built=true
              ;;
            *)
              printf 'unexpected cache-hit state: <%s>\n' "$CACHE_HIT" >&2
              exit 91
              ;;
          esac
          if [[ "$built" = true ]]; then
            stems=(Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated)
            for stem in "${stems[@]}"; do
              source="PrimalitySheafVerification/$stem.lean"
              olean="$OLEAN_ROOT/$stem.olean"
              ilean="$OLEAN_ROOT/$stem.ilean"
              cap=1
              [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f -- "$olean" "$ilean"
              printf '%q ' lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$olean" -i "$ilean" "$source" > "$OUT/$stem.command"
              printf '\n' >> "$OUT/$stem.command"
              set +e
              /usr/bin/time -v -o "$OUT/$stem.time" \
                lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                  -o "$olean" -i "$ilean" "$source" > "$OUT/$stem.log" 2>&1
              rc=$?
              set -e
              printf '%s\n' "$rc" > "$OUT/$stem.exit"
              test "$rc" -eq 0
              test -s "$olean" && test -s "$ilean"
            done
          fi
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN_ROOT/$stem.olean"
            test -s "$OLEAN_ROOT/$stem.ilean"
            sha256sum "$OLEAN_ROOT/$stem.olean" "$OLEAN_ROOT/$stem.ilean"
          done > "$OUT/dependency-outputs.sha256"
          printf '%s\n' "$mode" > "$OUT/project-cache-status.txt"
          printf '%s\n' "$CACHE_PRIMARY_KEY" > "$OUT/project-cache-primary-key.txt"
          printf 'built=%s\n' "$built" >> "$GITHUB_OUTPUT"
          printf 'cache_key=%s\n' "$CACHE_PRIMARY_KEY" >> "$GITHUB_OUTPUT"

      # Intentional acceleration write: only a clean exact miss may publish
      # these dependency outputs.  The key excludes QYM and is immutable over
      # toolchain, Lake lockfiles, and all four dependency source identities.
      - name: Save immutable dependency outputs after an exact miss
        if: steps.project-cache.outputs.cache-hit == '' && steps.dependencies.outputs.built == 'true'
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: ${{ steps.dependencies.outputs.cache_key }}

      - name: Reconstruct exact Probe3 through Probe6 then apply Probe7 once
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          python3 "$TRANSFORMER" --input "$OUT/QYM.authority.lean" \
            --output "$OUT/QYM.pass1.lean" --audit "$OUT/TRANSFORM_AUDIT_PASS1.json"
          test "$(sha256sum "$OUT/QYM.pass1.lean" | awk '{print $1}')" = "$EXPECTED_PASS1_SHA256"
          python3 "$ALIAS_TRANSFORMER" --input "$OUT/QYM.pass1.lean" \
            --output "$OUT/QYM.alias-safe.lean" --audit "$OUT/TRANSFORM_AUDIT_ALIASES.json"
          test "$(sha256sum "$OUT/QYM.alias-safe.lean" | awk '{print $1}')" = "$EXPECTED_ALIAS_SAFE_SHA256"
          python3 "$FINALIZER" --input "$OUT/QYM.alias-safe.lean" \
            --output "$OUT/QYM.candidate64f.lean" --audit "$OUT/TRANSFORM_AUDIT_FINAL.json"
          test "$(sha256sum "$OUT/QYM.candidate64f.lean" | awk '{print $1}')" = "$EXPECTED_CANDIDATE64_SHA256"
          python3 "$P3_INTEGRATOR" --input "$OUT/QYM.candidate64f.lean" \
            --output "$OUT/QYM.candidate-probe3.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE3.json" \
            --late-transformer "$P3_LATE" --early-transformer "$P3_EARLY" \
            --mid-p0-transformer "$P3_MID_P0" --mid-confirmed-patch "$P3_MID_PATCH" \
            --forwarder-inventory "$P3_FORWARDERS"
          test "$(sha256sum "$OUT/QYM.candidate-probe3.lean" | awk '{print $1}')" = "$EXPECTED_PROBE3_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe3.lean")" = "$EXPECTED_PROBE3_BLOB"
          python3 "$P4_INTEGRATOR" --input "$OUT/QYM.candidate-probe3.lean" \
            --output "$OUT/QYM.candidate-probe4.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE4.json" \
            --patch "$OUT/QYM.probe3-to-probe4.patch" \
            --early-transformer "$P4_EARLY" --mid-transformer "$P4_MID" \
            --late-transformer "$P4_LATE"
          test "$(sha256sum "$OUT/QYM.candidate-probe4.lean" | awk '{print $1}')" = "$EXPECTED_PROBE4_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe4.lean")" = "$EXPECTED_PROBE4_BLOB"
          python3 "$P5_INTEGRATOR" --input "$OUT/QYM.candidate-probe4.lean" \
            --output "$OUT/QYM.candidate-probe5.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE5.json" \
            --patch "$OUT/QYM.probe4-to-probe5.patch" \
            --frontier-transformer "$P5_FRONTIER" \
            --line41115-transformer "$P5_LINE41115" \
            --earlymid-transformer "$P5_EARLYMID" \
            --realpartform-transformer "$P5_REALPARTFORM" \
            --survivor-transformer "$P5_SURVIVOR" \
            --late-transformer "$P5_LATE"
          test "$(sha256sum "$OUT/QYM.candidate-probe5.lean" | awk '{print $1}')" = "$EXPECTED_PROBE5_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe5.lean")" = "$EXPECTED_PROBE5_BLOB"
          python3 "$P6_INTEGRATOR" --input "$OUT/QYM.candidate-probe5.lean" \
            --output "$QYM_SOURCE" --audit "$OUT/TRANSFORM_AUDIT_PROBE6.json" \
            --patch "$OUT/QYM.probe5-to-probe6.patch" \
            --probe4-authority "$OUT/QYM.candidate-probe4.lean" \
            --frontier-transformer "$P6_FRONTIER" \
            --frontier-addon-transformer "$P6_FRONTIER_ADDON" \
            --conditional-transformer "$P6_CONDITIONAL" \
            --late-transformer "$P6_LATE"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_PROBE6_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$EXPECTED_PROBE6_BLOB"
          cp "$QYM_SOURCE" "$OUT/QYM.candidate-probe6.lean"
          cmp "$RUNNER_TEMP/probe6-authority/QYM.candidate-probe6.lean" "$OUT/QYM.candidate-probe6.lean"
          python3 "$P7_HELPER" "$QYM_SOURCE" "$OUT/QYM.candidate-probe7.lean"             --probe6-log "$RUNNER_TEMP/probe6-authority/QYM.log"             --audit "$OUT/TRANSFORM_AUDIT_PROBE7.json"
          test "$(sha256sum "$OUT/QYM.candidate-probe7.lean" | awk '{print $1}')" = "$EXPECTED_PROBE7_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe7.lean")" = "$EXPECTED_PROBE7_BLOB"
          cp "$OUT/QYM.candidate-probe7.lean" "$QYM_SOURCE"
          python3 "$P7_HELPER" "$QYM_SOURCE" "$OUT/QYM.restored-probe6.lean"             --probe6-log "$RUNNER_TEMP/probe6-authority/QYM.log"             --audit "$OUT/TRANSFORM_AUDIT_PROBE7_INVERSE.json" --mode inverse
          test "$(sha256sum "$OUT/QYM.restored-probe6.lean" | awk '{print $1}')" = "$EXPECTED_PROBE6_SHA256"
          cmp "$OUT/QYM.restored-probe6.lean" "$OUT/QYM.candidate-probe6.lean"
          python3 "$P6_INTEGRATOR" --mode inverse --input "$OUT/QYM.restored-probe6.lean" \
            --output "$OUT/QYM.restored-probe5.lean" \
            --audit "$OUT/TRANSFORM_AUDIT_PROBE6_INVERSE.json" \
            --patch "$OUT/QYM.probe6-inverse.patch" \
            --probe4-authority "$OUT/QYM.candidate-probe4.lean" \
            --frontier-transformer "$P6_FRONTIER" \
            --frontier-addon-transformer "$P6_FRONTIER_ADDON" \
            --conditional-transformer "$P6_CONDITIONAL" \
            --late-transformer "$P6_LATE"
          test "$(sha256sum "$OUT/QYM.restored-probe5.lean" | awk '{print $1}')" = "$EXPECTED_PROBE5_SHA256"
          cmp "$OUT/QYM.restored-probe5.lean" "$OUT/QYM.candidate-probe5.lean"
          python3 "$P5_INTEGRATOR" --mode inverse --input "$OUT/QYM.restored-probe5.lean" \
            --output "$OUT/QYM.restored-probe4.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE5_INVERSE.json" \
            --patch "$OUT/QYM.probe5-inverse.patch" \
            --frontier-transformer "$P5_FRONTIER" --line41115-transformer "$P5_LINE41115" \
            --earlymid-transformer "$P5_EARLYMID" --realpartform-transformer "$P5_REALPARTFORM" \
            --survivor-transformer "$P5_SURVIVOR" --late-transformer "$P5_LATE"
          test "$(sha256sum "$OUT/QYM.restored-probe4.lean" | awk '{print $1}')" = "$EXPECTED_PROBE4_SHA256"
          cmp "$OUT/QYM.restored-probe4.lean" "$OUT/QYM.candidate-probe4.lean"
          python3 "$P4_INTEGRATOR" --mode inverse --input "$OUT/QYM.restored-probe4.lean" \
            --output "$OUT/QYM.restored-probe3.lean" --audit "$OUT/TRANSFORM_AUDIT_PROBE4_INVERSE.json" \
            --patch "$OUT/QYM.probe4-inverse.patch" \
            --early-transformer "$P4_EARLY" --mid-transformer "$P4_MID" --late-transformer "$P4_LATE"
          test "$(sha256sum "$OUT/QYM.restored-probe3.lean" | awk '{print $1}')" = "$EXPECTED_PROBE3_SHA256"
          cmp "$OUT/QYM.restored-probe3.lean" "$OUT/QYM.candidate-probe3.lean"
          sha256sum "$QYM_SOURCE" | tee "$OUT/QYM.candidate.sha256"
          git hash-object --no-filters "$QYM_SOURCE" | tee "$OUT/QYM.candidate.git-blob"
          git diff --binary -- "$QYM_SOURCE" > "$OUT/QYM.candidate.patch"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          changed="$(git status --porcelain=v1 --untracked-files=all)"
          test "$changed" = " M $QYM_SOURCE"

      - name: Compile exact reanchored Probe7 QYM candidate
        id: probe
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.probe7.olean" -i "$RUNNER_TEMP/QYM.probe7.ilean" \
            "$QYM_SOURCE" > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe7.olean" -i "$RUNNER_TEMP/QYM.probe7.ilean" \
              "$QYM_SOURCE" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe7.olean"
            test -s "$RUNNER_TEMP/QYM.probe7.ilean"
            sha256sum "$RUNNER_TEMP/QYM.probe7.olean" "$RUNNER_TEMP/QYM.probe7.ilean" \
              > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical QYM and collect coded diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          mkdir -p "$OUT"
          if [[ -f "$OUT/QYM.authority.lean" ]]; then
            cp "$OUT/QYM.authority.lean" "$QYM_SOURCE"
          fi
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_QYM_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$EXPECTED_QYM_BLOB"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.after.txt"
          test ! -s "$OUT/git-status.after.txt"
          python3 - "$OUT" <<'PY'
          import collections, hashlib, json, os, re, sys
          from pathlib import Path

          root = Path(sys.argv[1])
          raw = (root / 'QYM.log').read_bytes() if (root / 'QYM.log').exists() else b''
          text = raw.decode('utf-8', errors='replace')
          header_re = re.compile(
              r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*'
              r'(?P<message>.*)$', re.M)
          rows = []
          for match in header_re.finditer(text):
              row = match.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [row for row in rows if row['severity'] == 'error']
          warnings = [row for row in rows if row['severity'] == 'warning']
          panic_re = re.compile(
              r'(?im)^(?P<line>.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*)$')
          panics = [m.group('line') for m in panic_re.finditer(text)]
          (root / 'QYM.diagnostics.jsonl').write_text(
              ''.join(json.dumps(row, sort_keys=True) + '\n' for row in rows),
              encoding='utf-8')
          (root / 'QYM.error-headers.txt').write_text(
              ''.join(
                  "{}:{}:{}: error{}: {}\n".format(
                      r['file'], r['line'], r['column'],
                      f"({r['code']})" if r['code'] else '', r['message'])
                  for r in errors), encoding='utf-8')
          (root / 'QYM.panic-lines.txt').write_text(
              ''.join(line + '\n' for line in panics), encoding='utf-8')
          exit_code = None
          if (root / 'QYM.exit').exists():
              exit_code = int((root / 'QYM.exit').read_text().strip())
          result = {
              'schema': 'qym-deterministic-repair-probe7-reanchored-v1',
              'github_sha': os.environ['GITHUB_SHA'],
              'install_parent_sha': os.environ['EXPECTED_INSTALL_PARENT'],
              'authority_qym_sha256': os.environ['EXPECTED_QYM_SHA256'],
              'probe3_qym_sha256': os.environ['EXPECTED_PROBE3_SHA256'],
              'probe4_qym_sha256': os.environ['EXPECTED_PROBE4_SHA256'],
              'probe5_qym_sha256': os.environ['EXPECTED_PROBE5_SHA256'],
              'probe6_qym_sha256': os.environ['EXPECTED_PROBE6_SHA256'],
              'candidate_qym_sha256': os.environ['EXPECTED_PROBE7_SHA256'],
              'candidate_qym_blob': os.environ['EXPECTED_PROBE7_BLOB'],
              'exit': exit_code,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(
                  row['code'] or 'uncoded' for row in errors).items())),
              'warning_codes': dict(sorted(collections.Counter(
                  row['code'] or 'uncoded' for row in warnings).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_bytes': len(raw),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': exit_code == 0 and not errors and not panics,
          }
          (root / 'PROBE_RESULT.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload immutable reanchored Probe7 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-repair-probe7-reanchored-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qym-repair-probe7-reanchored/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on exact reanchored Probe7 result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          test -f "$OUT/git-status.before.txt" && test ! -s "$OUT/git-status.before.txt"
          test -f "$OUT/git-status.after.txt" && test ! -s "$OUT/git-status.after.txt"
          test -f "$OUT/PROBE7_ACTIVATION_EVIDENCE.json"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"
          test "$(tr -d '\r\n' < "$OUT/QYM.exit")" = 0
          test "$(sha256sum "$OUT/QYM.candidate-probe7.lean" | awk '{print $1}')" = "$EXPECTED_PROBE7_SHA256"
          test "$(git hash-object --no-filters "$OUT/QYM.candidate-probe7.lean")" = "$EXPECTED_PROBE7_BLOB"
          test "$(sha256sum "$OUT/QYM.restored-probe6.lean" | awk '{print $1}')" = "$EXPECTED_PROBE6_SHA256"
          test "$(sha256sum "$OUT/QYM.restored-probe5.lean" | awk '{print $1}')" = "$EXPECTED_PROBE5_SHA256"
          test "$(sha256sum "$OUT/QYM.restored-probe4.lean" | awk '{print $1}')" = "$EXPECTED_PROBE4_SHA256"
          test "$(sha256sum "$OUT/QYM.restored-probe3.lean" | awk '{print $1}')" = "$EXPECTED_PROBE3_SHA256"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_QYM_SHA256"
          python3 - "$OUT/PROBE_RESULT.json" "$OUT/TRANSFORM_AUDIT_PROBE7.json"             "$OUT/TRANSFORM_AUDIT_PROBE7_INVERSE.json" "$OUT/PROBE7_ACTIVATION_EVIDENCE.json" <<'PY'
          import json, sys
