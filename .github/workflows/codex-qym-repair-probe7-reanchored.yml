        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Lock installation delta, canonical sources, and every helper
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$RUNNER_TEMP/qym-repair-probe7-reanchored"
          mkdir -p "$OUT"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          parents=( $(git rev-list --parents -n 1 HEAD) )
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$EXPECTED_INSTALL_PARENT"
          git diff-tree --no-commit-id --name-status -r HEAD^ HEAD | sort \
            > "$OUT/install-delta.actual.txt"
          cat > "$OUT/install-delta.expected.txt" <<'EOF'
          A	.github/workflows/codex-qym-repair-probe7-reanchored.yml
          A	scripts/qym_probe7_reanchored.py
          EOF
          diff -u "$OUT/install-delta.expected.txt" "$OUT/install-delta.actual.txt"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test -z "$(find scripts -type d -name __pycache__ -print -quit)"

          sha256sum "$QYM_SOURCE" "$M2_SOURCE" "$M2A_SOURCE" "$FA_SOURCE" \
            "$INTEGRATED_SOURCE" lean-toolchain "$TRANSFORMER" \
            "$ALIAS_TRANSFORMER" "$FINALIZER" "$P3_LATE" "$P3_EARLY" \
            "$P3_MID_P0" "$P3_MID_PATCH" "$P3_FORWARDERS" "$P3_INTEGRATOR" \
            "$P4_EARLY" "$P4_MID" "$P4_LATE" "$P4_INTEGRATOR" \
            "$P5_FRONTIER" "$P5_LINE41115" "$P5_EARLYMID" "$P5_REALPARTFORM" "$P5_SURVIVOR" "$P5_LATE" "$P5_INTEGRATOR" \
            "$P6_FRONTIER" "$P6_FRONTIER_ADDON" "$P6_CONDITIONAL" "$P6_LATE" "$P6_INTEGRATOR" \
            "$P7_HELPER" \
            | tee "$OUT/input-files.sha256"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_QYM_SHA256"
          test "$(sha256sum "$M2_SOURCE" | awk '{print $1}')" = "$EXPECTED_M2_SHA256"
          test "$(sha256sum "$M2A_SOURCE" | awk '{print $1}')" = "$EXPECTED_M2A_SHA256"
          test "$(sha256sum "$FA_SOURCE" | awk '{print $1}')" = "$EXPECTED_FA_SHA256"
          test "$(sha256sum "$INTEGRATED_SOURCE" | awk '{print $1}')" = "$EXPECTED_INTEGRATED_SHA256"
          test "$(sha256sum lean-toolchain | awk '{print $1}')" = "$EXPECTED_TOOLCHAIN_SHA256"
          test "$(git hash-object --no-filters "$QYM_SOURCE")" = "$EXPECTED_QYM_BLOB"
          test "$(git hash-object --no-filters "$M2_SOURCE")" = "$EXPECTED_M2_BLOB"
          test "$(git hash-object --no-filters "$M2A_SOURCE")" = "$EXPECTED_M2A_BLOB"
          test "$(git hash-object --no-filters "$FA_SOURCE")" = "$EXPECTED_FA_BLOB"
          test "$(git hash-object --no-filters "$INTEGRATED_SOURCE")" = "$EXPECTED_INTEGRATED_BLOB"
          test "$(git hash-object --no-filters lean-toolchain)" = "$EXPECTED_TOOLCHAIN_BLOB"
          test "$(git hash-object --no-filters lake-manifest.json)" = "$EXPECTED_LAKE_MANIFEST_BLOB"
          test "$(git hash-object --no-filters lakefile.lean)" = "$EXPECTED_LAKEFILE_BLOB"
          test "$(sha256sum "$TRANSFORMER" | awk '{print $1}')" = "$EXPECTED_TRANSFORMER_SHA256"
          test "$(sha256sum "$ALIAS_TRANSFORMER" | awk '{print $1}')" = "$EXPECTED_ALIAS_TRANSFORMER_SHA256"
          test "$(sha256sum "$FINALIZER" | awk '{print $1}')" = "$EXPECTED_FINALIZER_SHA256"
          test "$(sha256sum "$P3_LATE" | awk '{print $1}')" = "$EXPECTED_P3_LATE_SHA256"
          test "$(sha256sum "$P3_EARLY" | awk '{print $1}')" = "$EXPECTED_P3_EARLY_SHA256"
          test "$(sha256sum "$P3_MID_P0" | awk '{print $1}')" = "$EXPECTED_P3_MID_P0_SHA256"
          test "$(sha256sum "$P3_MID_PATCH" | awk '{print $1}')" = "$EXPECTED_P3_MID_PATCH_SHA256"
          test "$(sha256sum "$P3_FORWARDERS" | awk '{print $1}')" = "$EXPECTED_P3_FORWARDERS_SHA256"
          test "$(sha256sum "$P3_INTEGRATOR" | awk '{print $1}')" = "$EXPECTED_P3_INTEGRATOR_SHA256"
          test "$(sha256sum "$P4_EARLY" | awk '{print $1}')" = "$EXPECTED_P4_EARLY_SHA256"
          test "$(sha256sum "$P4_MID" | awk '{print $1}')" = "$EXPECTED_P4_MID_SHA256"
