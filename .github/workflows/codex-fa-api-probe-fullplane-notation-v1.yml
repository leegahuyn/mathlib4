name: Codex FA API probe full-plane and spectral normal forms
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-fullplane-notation-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile full-plane and spectral normal-form probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeFAv23.lean <<'LEAN'
          import Mathlib

          open Set Function Topology
          open TopologicalSpace
          open scoped Distributions LinearPMap
          local notation "∞" => (⊤ : ℕ∞)

          abbrev FullPlaneTestProbe := TestFunction (⊤ : Opens ℂ) ℂ ∞

          noncomputable def realFullPlaneTestProbe
              (g : ℂ → ℝ) (hg : ContDiff ℝ ∞ g)
              (hcompact : HasCompactSupport g) : FullPlaneTestProbe where
            toFun := fun x ↦ (g x : ℂ)
            contDiff' := Complex.ofRealCLM.contDiff.comp hg
            hasCompactSupport' := by
              simpa only [Function.comp_def] using
                hcompact.comp_left (g := fun r : ℝ ↦ (r : ℂ)) (by norm_num)
            tsupport_subset' := by
              intro x hx
              simp

          example {μ : ℂ} (h : star μ = μ) : μ.im = 0 := by
            have hi := congrArg Complex.im h
            change -μ.im = μ.im at hi
            linarith

          section
          variable {H : Type*}
          variable [NormedAddCommGroup H] [InnerProductSpace ℂ H]
          variable (A : H →ₗ.[ℂ] H) (μ : ℂ) (x : H) (hx : x ∈ A.domain)
          variable (hAx : A ⟨x, hx⟩ = μ • x)

          example : (x, μ • x) ∈ A.graph := by
            let xd : A.domain := ⟨x, hx⟩
            have hRaw := A.mem_graph xd
            simpa only [xd, hAx] using hRaw
          end

          example {μ ν z : ℂ} (h : star μ * z = ν * z) :
              (star μ - ν) * z = 0 := by
            rw [sub_mul, h, sub_self]
          LEAN
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeFAv23.lean 2>&1 | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v23-fullplane-spectral-probe-${{ github.sha }}
          path: |
            /tmp/ProbeFAv23.lean
            /tmp/probe.log
          retention-days: 30
