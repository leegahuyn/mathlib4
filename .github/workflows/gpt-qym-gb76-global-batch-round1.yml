name: GPT QYM GB76 global-batch Round 1 direct Lean

on:
  push:
    branches:
      - gpt/qym-gb76-global-batch-repair-20260820
    paths:
      - .github/workflows/gpt-qym-gb76-global-batch-round1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb76-global-batch-round1-direct
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb76-global-batch-repair-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  BASE_ERRORS: '76'
  BASE_WARNINGS: '358'
  BASE_SHA256: fada22264b6618467f89d436ddacff27453db1242769717d5e7a386682d4efb3
  BASE_BLOB: 29d446743036dccd5d9ad8757c351b39d526cfa9
  FA_BLOB: 28f614d48e02a0f28d3f5a758e813350b3ea89cf
  INTEGRATED_BLOB: 464f5dd095876b20165d12690c8127ef9d909e6a
  OUT: /tmp/qym-gb76-global-batch-round1

jobs:
  compile:
    name: Build cumulative candidate and run authoritative full QYM
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact GB76, source-level evidence, and scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OLEAN"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          test "$(sha256sum .github/qym-frontier/QYM_GB76_BEST.lean | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object .github/qym-frontier/QYM_GB76_BEST.lean)" = "$BASE_BLOB"
          cmp -s "$QYM" .github/qym-frontier/QYM_GB76_BEST.lean
          test "$(git hash-object PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "$FA_BLOB"
          test "$(git hash-object PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "$INTEGRATED_BLOB"

          test "$(jq -r '.status' .github/qym-frontier/GB76_GLOBAL_BATCH_ROUND1_PATCH_GATE/STATUS.json)" = PATCH_GATE_PASS
          test "$(jq -r '.baseline_sha256' .github/qym-frontier/GB76_GLOBAL_BATCH_ROUND1_PATCH_GATE/STATUS.json)" = "$BASE_SHA256"
          test "$(jq -r '.baseline_blob' .github/qym-frontier/GB76_GLOBAL_BATCH_ROUND1_PATCH_GATE/STATUS.json)" = "$BASE_BLOB"
          test "$(jq -r '.forbidden_zero' .github/qym-frontier/GB76_GLOBAL_BATCH_ROUND1_PATCH_GATE/STATUS.json)" = true

          python3 -m py_compile \
            .github/qym_patch_gb77_fixedorigin_v16_groupoid.py \
            .github/qym_patch_gb77_fixedorigin_v17_inverse_eta.py \
            .github/qym_patch_gb76_global_batch_round1.py \
            .github/qym_gb76_global_batch_round1_driver.py

          {
            echo "branch=$BRANCH"
            echo "trigger_sha=$GITHUB_SHA"
            echo "run_id=$GITHUB_RUN_ID"
            echo "baseline_sha256=$BASE_SHA256"
            echo "baseline_blob=$BASE_BLOB"
            echo "fa_blob=$FA_BLOB"
            echo "integrated_blob=$INTEGRATED_BLOB"
          } > "$OUT/TRIGGER_IDENTITY.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"

          tc="$(tr -d '\r\n' < lean-toolchain)"
          installed=false
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1; then
              installed=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$installed" = true
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

          cache_ok=false
          for attempt in 1 2 3 4 5; do
            if lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1; then
              cache_ok=true
              break
            fi
            sleep $((attempt * 5))
          done
          test "$cache_ok" = true

      - name: Restore verified QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure all four dependency objects by actual Lean
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                max_errors=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" \
                > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

          {
            for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              printf '%s\t%s\t%s\n' \
                "$source" \
                "$(stat -c '%s' "$OLEAN/$source.olean")" \
                "$(stat -c '%s' "$OLEAN/$source.ilean")"
            done
          } > "$OUT/DEPENDENCY_OBJECTS.tsv"

      - name: Run one authoritative full-QYM direct Lean checkpoint
        shell: bash
        env:
          OUT_ROOT: /tmp/qym-gb76-global-batch-round1
        run: |
          set -euo pipefail
          python3 -B .github/qym_gb76_global_batch_round1_driver.py
          test "$(jq -r '.full_compile_executed' "$OUT/RESULT.json")" = true
          test "$(jq -r '.panic_lines' "$OUT/RESULT.json")" -eq 0
          test "$(jq '[.forbidden[]] | add' "$OUT/RESULT.json")" -eq 0
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$OUT/RESULT.json")"
          candidate_blob="$(jq -r '.candidate_qym_blob' "$OUT/RESULT.json")"
          test "$(sha256sum "$OUT/QYM.GLOBAL_REPAIR_CANDIDATE.lean" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$OUT/QYM.GLOBAL_REPAIR_CANDIDATE.lean")" = "$candidate_blob"

      - name: Publish direct-Lean checkpoint summary
        if: always()
        shell: bash
        run: |
          {
            echo "## QYM GB76 global-batch Round 1"
            if [[ -s "$OUT/RESULT.json" ]]; then
              echo
              echo "- full direct Lean: $(jq -r '.full_compile_executed' "$OUT/RESULT.json")"
              echo "- errors: $(jq -r '.error_headers' "$OUT/RESULT.json")"
              echo "- warnings: $(jq -r '.warning_headers' "$OUT/RESULT.json")"
              echo "- panic: $(jq -r '.panic_lines' "$OUT/RESULT.json")"
              echo "- improvement: $(jq -r '.improvement' "$OUT/RESULT.json")"
              echo "- candidate SHA256: $(jq -r '.candidate_qym_sha256' "$OUT/RESULT.json")"
              echo "- candidate blob: $(jq -r '.candidate_qym_blob' "$OUT/RESULT.json")"
              echo "- first error: $(jq -c '.first_error' "$OUT/RESULT.json")"
            else
              echo
              echo "- RESULT.json was not produced; inspect the artifact logs."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload immutable Round 1 candidate, full log, and inventory
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb76-global-batch-round1-${{ github.run_id }}
          path: /tmp/qym-gb76-global-batch-round1
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  promote:
    name: Promote only a strict verified Round 1 improvement
    needs: compile
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Download immutable Round 1 evidence
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qym-gb76-global-batch-round1-${{ github.run_id }}
          path: /tmp/qym-gb76-global-batch-round1

      - name: Evaluate strict-promotion gate
        id: evaluate
        shell: bash
        run: |
          set -euo pipefail
          result=/tmp/qym-gb76-global-batch-round1/RESULT.json
          candidate=/tmp/qym-gb76-global-batch-round1/QYM.GLOBAL_REPAIR_CANDIDATE.lean
          if [[ ! -s "$result" || ! -s "$candidate" ]]; then
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "reason=missing_result_or_candidate" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          full="$(jq -r '.full_compile_executed' "$result")"
          panic="$(jq -r '.panic_lines' "$result")"
          forbidden="$(jq '[.forbidden[]] | add' "$result")"
          errors="$(jq -r '.error_headers' "$result")"
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$result")"
          candidate_blob="$(jq -r '.candidate_qym_blob' "$result")"
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$candidate")" = "$candidate_blob"

          if [[ "$full" = true && "$panic" -eq 0 && "$forbidden" -eq 0 && "$errors" -lt "$BASE_ERRORS" ]]; then
            echo "promote=true" >> "$GITHUB_OUTPUT"
            echo "reason=strict_verified_improvement" >> "$GITHUB_OUTPUT"
            echo "errors=$errors" >> "$GITHUB_OUTPUT"
            echo "warnings=$(jq -r '.warning_headers' "$result")" >> "$GITHUB_OUTPUT"
          else
            echo "promote=false" >> "$GITHUB_OUTPUT"
            echo "reason=no_strict_verified_improvement" >> "$GITHUB_OUTPUT"
            echo "errors=$errors" >> "$GITHUB_OUTPUT"
          fi

      - name: Canonically promote exact winning Round 1 bytes
        if: steps.evaluate.outputs.promote == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"

          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          test "$(sha256sum .github/qym-frontier/QYM_GB76_BEST.lean | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object .github/qym-frontier/QYM_GB76_BEST.lean)" = "$BASE_BLOB"

          root=/tmp/qym-gb76-global-batch-round1
          result="$root/RESULT.json"
          full="$root/FULL_RESULT.json"
          candidate="$root/QYM.GLOBAL_REPAIR_CANDIDATE.lean"
          errors="$(jq -r '.error_headers' "$result")"
          warnings="$(jq -r '.warning_headers' "$result")"
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$result")"
          candidate_blob="$(jq -r '.candidate_qym_blob' "$result")"
          test "$errors" -lt "$BASE_ERRORS"
          test "$(jq -r '.full_compile_executed' "$result")" = true
          test "$(jq -r '.strict_improvement' "$result")" = true
          test "$(jq -r '.panic_lines' "$result")" -eq 0
          test "$(jq '[.forbidden[]] | add' "$result")" -eq 0
          test "$(sha256sum "$candidate" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$candidate")" = "$candidate_blob"

          mkdir -p .github/qym-frontier
          cp "$candidate" "$QYM"
          cp "$candidate" ".github/qym-frontier/QYM_GB${errors}_BEST.lean"
          cp "$result" ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_RESULT_${GITHUB_RUN_ID}.json"
          cp "$full" ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_FULL_RESULT_${GITHUB_RUN_ID}.json"

          status="PROMOTED_STRICT_IMPROVEMENT"
          if [[ "$errors" -eq 0 ]]; then
            status="QYM_TRUE_PASS"
          fi
          jq -n \
            --arg branch "$BRANCH" \
            --arg trigger_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --argjson previous_errors "$BASE_ERRORS" \
            --argjson errors "$errors" \
            --argjson warnings "$warnings" \
            --arg qym_sha "$candidate_sha" \
            --arg qym_blob "$candidate_blob" \
            --arg status "$status" \
            '{schema:"qym-gb76-global-batch-round1-promotion-v1",authority:"actual full-QYM direct Lean",branch:$branch,trigger_sha:$trigger_sha,run_id:$run_id,round:1,previous_error_headers:$previous_errors,error_headers:$errors,warning_headers:$warnings,panic_lines:0,qym_sha256:$qym_sha,qym_blob:$qym_blob,forbidden_zero:true,canonical_check_in:true,status:$status}' \
            > ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_PROMOTION_STATUS.json"
          cp ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_PROMOTION_STATUS.json" \
            .github/qym-frontier/GLOBAL_BATCH_LIVE_STATUS.json

          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$QYM")" = "$candidate_blob"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" \
            ".github/qym-frontier/QYM_GB${errors}_BEST.lean" \
            ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_RESULT_${GITHUB_RUN_ID}.json" \
            ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_FULL_RESULT_${GITHUB_RUN_ID}.json" \
            ".github/qym-frontier/GB${errors}_GLOBAL_BATCH_ROUND1_PROMOTION_STATUS.json" \
            .github/qym-frontier/GLOBAL_BATCH_LIVE_STATUS.json
          git commit -m "QYM global batch Round 1: promote verified ${errors}-error frontier [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Persist no-improvement or infrastructure evidence
        if: steps.evaluate.outputs.promote != 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin "$BRANCH"
          git reset --hard "origin/$BRANCH"
          mkdir -p .github/qym-frontier

          result=/tmp/qym-gb76-global-batch-round1/RESULT.json
          status=.github/qym-frontier/GB76_GLOBAL_BATCH_ROUND1_NO_IMPROVEMENT_${GITHUB_RUN_ID}.json
          if [[ -s "$result" ]]; then
            cp "$result" "$status"
            errors="$(jq -r '.error_headers // -1' "$result")"
            warnings="$(jq -r '.warning_headers // -1' "$result")"
            panic="$(jq -r '.panic_lines // -1' "$result")"
            full="$(jq -r '.full_compile_executed // false' "$result")"
            candidate_sha="$(jq -r '.candidate_qym_sha256 // ""' "$result")"
            candidate_blob="$(jq -r '.candidate_qym_blob // ""' "$result")"
          else
            errors=-1
            warnings=-1
            panic=-1
            full=false
            candidate_sha=""
            candidate_blob=""
            jq -n \
              --arg branch "$BRANCH" \
              --arg trigger_sha "$GITHUB_SHA" \
              --argjson run_id "$GITHUB_RUN_ID" \
              '{schema:"qym-gb76-global-batch-round1-missing-result-v1",branch:$branch,trigger_sha:$trigger_sha,run_id:$run_id,status:"INFRASTRUCTURE_OR_PATCH_FAILURE"}' \
              > "$status"
          fi

          jq -n \
            --arg branch "$BRANCH" \
            --arg trigger_sha "$GITHUB_SHA" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg reason "${{ steps.evaluate.outputs.reason }}" \
            --argjson errors "$errors" \
            --argjson warnings "$warnings" \
            --argjson panic "$panic" \
            --argjson full "$full" \
            --arg candidate_sha "$candidate_sha" \
            --arg candidate_blob "$candidate_blob" \
            '{schema:"qym-gb76-global-batch-round1-status-v1",authority:"actual full-QYM direct Lean only when full_direct_lean_executed=true",branch:$branch,trigger_sha:$trigger_sha,run_id:$run_id,round:1,baseline_error_headers:76,error_headers:$errors,warning_headers:$warnings,panic_lines:$panic,full_direct_lean_executed:$full,candidate_sha256:$candidate_sha,candidate_blob:$candidate_blob,reason:$reason,canonical_source_unchanged:true,status:"NO_STRICT_PROMOTION"}' \
            > .github/qym-frontier/GLOBAL_BATCH_LIVE_STATUS.json

          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$status" .github/qym-frontier/GLOBAL_BATCH_LIVE_STATUS.json
          git commit -m "QYM global batch Round 1: preserve no-promotion evidence ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:$BRANCH"
