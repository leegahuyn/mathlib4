name: PASS 350 FunctionalAnalysis prefix Ubuntu

on:
  push:
    branches: [fix/fa350-final-isolated-20260808]
    paths:
      - '.github/workflows/pass350-fa-prefix-ubuntu.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa350-prefix-ubuntu
  cancel-in-progress: true

jobs:
  prefix:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact PASS 350 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 460
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Reconstruct PASS 350 without compiling the full file
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          marker = 'rm -f "${OUTDIR}/Mock2_FunctionalAnalysis.olean"'
          pos = text.find(marker)
          print(f'compile marker offset={pos}')
          if pos < 0:
              raise SystemExit('could not locate the direct compile marker')
          text = text[:pos] + '''cp "${FA}" /tmp/Mock2_FunctionalAnalysis-pass350.lean
          exit 0
          '''
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass350_fa.sh
          test -s /tmp/Mock2_FunctionalAnalysis-pass350.lean
          sha256sum /tmp/Mock2_FunctionalAnalysis-pass350.lean
          head -n 24743 /tmp/Mock2_FunctionalAnalysis-pass350.lean > \
            /tmp/Mock2_FunctionalAnalysis-pass350-prefix.lean

      - name: Compile the PASS 350 prefix
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake env lean -DmaxErrors=300 \
            /tmp/Mock2_FunctionalAnalysis-pass350-prefix.lean \
            > /tmp/pass350-prefix.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          grep -n 'error:' /tmp/pass350-prefix.log | head -200 > \
            /tmp/pass350-prefix-errors.txt || true
          tail -500 /tmp/pass350-prefix.log > /tmp/pass350-prefix-tail.txt || true
          exit 0

      - name: Upload PASS 350 prefix diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass350-fa-prefix-${{ github.sha }}
          path: |
            /tmp/Mock2_FunctionalAnalysis-pass350.lean
            /tmp/Mock2_FunctionalAnalysis-pass350-prefix.lean
            /tmp/pass350-prefix.log
            /tmp/pass350-prefix-errors.txt
            /tmp/pass350-prefix-tail.txt
          if-no-files-found: error
          retention-days: 90

      - name: Publish PASS 350 prefix summary
        if: always()
        shell: bash
        env:
          PREFIX_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          {
            echo '## PASS 350 prefix'
            echo
            echo "- exit code: ${PREFIX_EXIT_CODE:-missing}"
            echo
            echo '```text'
            cat /tmp/pass350-prefix-errors.txt 2>/dev/null || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce PASS 350 prefix result
        if: always()
        shell: bash
        env:
          PREFIX_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${PREFIX_EXIT_CODE:-}"
          exit "${PREFIX_EXIT_CODE}"
