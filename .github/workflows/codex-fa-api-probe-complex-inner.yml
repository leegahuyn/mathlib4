name: Codex FA API probe complex inner

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-complex-inner.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe complex inner normalization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeComplexInner.lean <<'LEAN'
          import Mathlib
          #check Complex.instInnerProductSpace
          #check RCLike.inner_apply
          #check Complex.inner_def
          #check inner_mul_left
          #check inner_mul_right
          #check inner_smul_left
          #check inner_smul_right
          example (a b c u v : ℂ) (hc : star c = c) :
              inner ℂ (a * (c * u)) (a * v) =
                inner ℂ (a * u) (a * (c * v)) := by
            simp [inner, hc]
            ring
          example (a b c u v : ℂ) (hc : star c = c) :
              inner ℂ (a * (c * u)) (a * v) =
                inner ℂ (a * u) (a * (c * v)) := by
            simpa [hc, mul_assoc, mul_left_comm, mul_comm] using
              (show star (a * (c * u)) * (a * v) =
                  star (a * u) * (a * (c * v)) by
                simp [map_mul, hc]
                ring)
          LEAN
          set +e
          lake env lean /tmp/ProbeComplexInner.lean >/tmp/complex-inner-api.log 2>&1
          code=$?
          set -e
          cat /tmp/complex-inner-api.log
          echo "$code" >/tmp/probe.exit
          exit 0
      - name: Upload evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-complex-inner-${{ github.sha }}
          path: |
            /tmp/complex-inner-api.log
            /tmp/probe.exit
          retention-days: 7
