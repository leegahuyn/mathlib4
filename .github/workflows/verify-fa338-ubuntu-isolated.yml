name: Isolated PASS 338 FunctionalAnalysis Ubuntu verification

on:
  push:
    branches: [verify/fa338-ubuntu-20260808]
    paths:
      - '.github/workflows/verify-fa338-ubuntu-isolated.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: isolated-fa338-ubuntu-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact verification head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128
          persist-credentials: false

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass338-fa/logs
          lean --version | tee /tmp/diagnose-pass338-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass338-fa/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass338-fa/logs/cache-get.log

      - name: Reconstruct and compile PASS 338 FA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass338_fa.sh

      - name: Upload PASS 338 isolated diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: isolated-fa338-ubuntu-${{ github.sha }}
          path: /tmp/diagnose-pass338-fa
          if-no-files-found: error
          retention-days: 90
