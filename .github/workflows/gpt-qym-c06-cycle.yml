name: GPT QYM C06 covering groupoid repair cycle

on:
  push:
    branches: [gpt/qym-c01-c13-sequential-v2-20260819]
    paths:
      - .github/workflows/gpt-qym-c06-cycle.yml
      - .github/qym-c06-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-c06-${{ github.ref }}
  cancel-in-progress: false

jobs:
  c06:
    name: C06 ${{ matrix.variant }} full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant: [helper_letI, inline_letI]
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-c06-${{ matrix.variant }}
      BASE: /tmp/qym-c06-baseline
      BASELINE_ARTIFACT: '9326706450'
      BASELINE_SHA256: 313c076645a51976237738bd10c7f22b54f2a483499e60b57fa0d69be007cc1e
      BASELINE_ERRORS: '89'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Recover exact authority
        shell: bash
        run: |
          set -euo pipefail; mkdir -p "$OUT" "$BASE"
          test "$GITHUB_REF_NAME" = gpt/qym-c01-c13-sequential-v2-20260819
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/artifacts/$BASELINE_ARTIFACT/zip" > "$RUNNER_TEMP/qym-c06-base.zip"
          unzip -q -o "$RUNNER_TEMP/qym-c06-base.zip" -d "$BASE"
          src="$(find "$BASE" -type f -name QYM.baseline.lean -print -quit)"
          test -n "$src" && test "$(sha256sum "$src"|awk '{print $1}')" = "$BASELINE_SHA256"
          cp "$src" "$OUT/QYM.baseline.lean"
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
      - name: Restore dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
      - name: Ensure dependency objects
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail; mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1; [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"; done
      - name: Materialize C06 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"; cp "$OUT/QYM.baseline.lean" "$QYM"
          python3 -B .github/qym_c06_variants.py "${{ matrix.variant }}" "$QYM" | tee "$OUT/PATCH_RESULT.json"
          cp "$QYM" "$OUT/QYM.candidate-c06-${{ matrix.variant }}.lean"
      - name: Full direct Lean
        shell: bash
        run: |
          set -euo pipefail; set +e
          /usr/bin/time -v -o "$OUT/QYM.time" lake env lean -DmaxErrors=10000 -DwarningAsError=false -o "$RUNNER_TEMP/QYM.c06.olean" -i "$RUNNER_TEMP/QYM.c06.ilean" "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?; set -e; echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then test -s "$RUNNER_TEMP/QYM.c06.olean"; test -s "$RUNNER_TEMP/QYM.c06.ilean"; cp "$RUNNER_TEMP/QYM.c06.olean" "$OUT/"; cp "$RUNNER_TEMP/QYM.c06.ilean" "$OUT/"; fi
          cp "$OUT/QYM.canonical.lean" "$QYM"
      - name: Summarize exact diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail; [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import collections,hashlib,json,os,re,sys
          o=Path(sys.argv[1]); raw=(o/'QYM.log').read_bytes() if (o/'QYM.log').exists() else b''; t=raw.decode(errors='replace')
          p=re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$',re.M); rows=[]
          for m in p.finditer(t): r=m.groupdict(); r['line']=int(r['line']); r['column']=int(r['column']); rows.append(r)
          es=[r for r in rows if r['severity']=='error']; ws=[r for r in rows if r['severity']=='warning']; ps=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$',t); patch=json.loads((o/'PATCH_RESULT.json').read_text()) if (o/'PATCH_RESULT.json').exists() else {}; rc=int((o/'QYM.exit').read_text()) if (o/'QYM.exit').exists() else None
          z={'schema':'qym-c06-cycle-v1','github_sha':os.environ.get('GITHUB_SHA'),'run_id':os.environ.get('GITHUB_RUN_ID'),'variant':patch.get('variant'),'baseline_qym_sha256':os.environ['BASELINE_SHA256'],'baseline_error_headers':int(os.environ['BASELINE_ERRORS']),'candidate_qym_sha256':patch.get('candidate_sha256'),'candidate_qym_blob':patch.get('candidate_blob'),'bytes':patch.get('bytes'),'lf':patch.get('lf'),'forbidden_before':patch.get('forbidden_before'),'forbidden_after':patch.get('forbidden_after'),'exit':rc,'error_headers':len(es),'warning_headers':len(ws),'error_codes':dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in es).items())),'first_error':es[0] if es else None,'last_error':es[-1] if es else None,'panic_lines':len(ps),'log_sha256':hashlib.sha256(raw).hexdigest(),'semantic_pass':rc==0 and not es and not ps}
          (o/'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows)); (o/'QYM.error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r['code'] else ''}: {r['message']}\n" for r in es)); (o/'QYM.panic-lines.txt').write_text(''.join(x+'\n' for x in ps)); (o/'C06_RESULT.json').write_text(json.dumps(z,indent=2,sort_keys=True)+'\n'); print(json.dumps(z,indent=2,sort_keys=True))
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
      - name: Upload C06 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-c06-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-c06-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
