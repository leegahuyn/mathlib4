name: Codex FA Fredholm 3584 NNReal-bound bridge probe v2

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-fredholm-3584-bound-probe-v2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile exact NNReal-bound bridge shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/Fredholm3584BoundProbe.lean <<'LEAN'
          import Mathlib

          noncomputable section
          variable {X Y : Type*}
          variable [NormedAddCommGroup X] [NormedSpace ℂ X]
          variable [NormedAddCommGroup Y] [NormedSpace ℂ Y]

          example (R : Y →L[ℂ] X)
              (hRbound : ∀ u, ‖u‖ ≤ (1 : ℝ) * ‖R u‖) :
              IsUniformEmbedding R := by
            exact R.isUniformEmbedding_of_bound (K := 1) hRbound

          example (R : Y →L[ℂ] X)
              (hbase : ∀ u, ‖u‖ ≤ ‖R u‖) :
              IsUniformEmbedding R := by
            have hRbound : ∀ u, ‖u‖ ≤ (1 : ℝ) * ‖R u‖ := by
              intro u
              simpa only [one_mul] using hbase u
            exact R.isUniformEmbedding_of_bound (K := 1) hRbound

          #check ContinuousLinearMap.isUniformEmbedding_of_bound
          LEAN
          set +e
          lake env lean -DmaxErrors=20 -DwarningAsError=false /tmp/Fredholm3584BoundProbe.lean 2>&1 | tee /tmp/fredholm3584-bound-probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/fredholm3584-bound-probe.exit
          exit "$x"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-fredholm-3584-bound-probe-v2-${{ github.sha }}
          path: |
            /tmp/Fredholm3584BoundProbe.lean
            /tmp/fredholm3584-bound-probe.log
            /tmp/fredholm3584-bound-probe.exit
          retention-days: 30
