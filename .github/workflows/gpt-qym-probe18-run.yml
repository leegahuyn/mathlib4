name: GPT QYM runner registration check

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/qym-probe18-trigger.txt
      - .github/workflows/gpt-qym-probe18-run.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  registration-check:
    name: runner registration check
    runs-on: ubuntu-24.04
    steps:
      - name: Confirm job scheduling
        shell: bash
        run: |
          set -euo pipefail
          echo "workflow registration OK"
          echo "sha=$GITHUB_SHA"
          echo "ref=$GITHUB_REF_NAME"
