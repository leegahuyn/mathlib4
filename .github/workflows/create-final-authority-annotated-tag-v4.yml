name: Diagnose and create FINAL AUTHORITY annotated tag v4

"on":
  push:
    branches:
      - ops/formalization-final-release-8f7-20260821
    paths:
      - .github/workflows/create-final-authority-annotated-tag-v4.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: create-final-authority-annotated-tag-v4
  cancel-in-progress: false

jobs:
  diagnose-create-and-verify-tag:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout exact immutable authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Diagnose tag creation without hiding failure details
        id: tagdiag
        shell: bash
        run: |
          set +e
          mkdir -p tag-freeze
          exec > >(tee tag-freeze/TAG_DIAGNOSTIC.log) 2>&1
          COMMIT='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          TAG='formalization-final-2026-08-21'
          AUTHORITY_BRANCH='gpt/final-authority-pass-20260821'
          ARCHIVE_BRANCH='archive/formalization-final-2026-08-21'

          echo "HEAD=$(git rev-parse HEAD 2>&1)"
          echo "TRACKED_STATUS_BEGIN"
          git status --porcelain --untracked-files=no
          echo "TRACKED_STATUS_END"
          echo "AUTHORITY_BRANCH_REMOTE=$(git ls-remote origin "refs/heads/$AUTHORITY_BRANCH" 2>&1)"
          echo "ARCHIVE_BRANCH_REMOTE=$(git ls-remote origin "refs/heads/$ARCHIVE_BRANCH" 2>&1)"
          echo "TAG_REMOTE_BEFORE=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>&1)"
          echo "GITHUB_EVENT_NAME=$GITHUB_EVENT_NAME"
          echo "GITHUB_REF=$GITHUB_REF"
          echo "GITHUB_SHA=$GITHUB_SHA"

          git config user.name 'Formalization Archive'
          git config user.email '102484661+leegahuyn@users.noreply.github.com'
          cat > /tmp/tag-message.txt <<'EOF'
          Formalization FINAL AUTHORITY
          Exact tested commit: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          Full actual-Lean run/job: 32443566530 / 96658923339
          Independent QYM replay run/job: 32344604895 / 96350568956
          Terminal authority run/job: 32455051059 / 96690759499
          Final13 13/13; bridges 2/2; BuildAll PASS; clean x2 PASS;
          checklist 15/15; forbidden 0; panic 0; axiom/source identity PASS.
          Full evidence SHA256: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
          QYM evidence SHA256: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
          Terminal evidence SHA256: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee
          EOF
          sed -i 's/^          //' /tmp/tag-message.txt

          if git show-ref --verify --quiet "refs/tags/$TAG"; then
            echo "LOCAL_TAG_ALREADY_EXISTS=YES"
            tag_create_rc=0
          else
            git tag --annotate "$TAG" "$COMMIT" --file /tmp/tag-message.txt
            tag_create_rc=$?
          fi
          echo "TAG_CREATE_RC=$tag_create_rc"
          echo "LOCAL_TAG_TYPE=$(git cat-file -t "refs/tags/$TAG" 2>&1)"
          echo "LOCAL_TAG_TARGET=$(git rev-list -n 1 "refs/tags/$TAG" 2>&1)"

          if [[ -z "$(git ls-remote origin "refs/tags/$TAG" 2>/dev/null)" ]]; then
            git push --verbose origin "refs/tags/$TAG:refs/tags/$TAG"
            tag_push_rc=$?
          else
            echo "REMOTE_TAG_ALREADY_EXISTS=YES"
            tag_push_rc=0
          fi
          echo "TAG_PUSH_RC=$tag_push_rc"
          echo "TAG_REMOTE_AFTER=$(git ls-remote origin "refs/tags/$TAG" "refs/tags/$TAG^{}" 2>&1)"

          git fetch --force origin "refs/tags/$TAG:refs/tags/$TAG"
          fetch_rc=$?
          echo "TAG_FETCH_RC=$fetch_rc"
          object_type="$(git cat-file -t "refs/tags/$TAG" 2>&1)"
          target="$(git rev-list -n 1 "refs/tags/$TAG" 2>&1)"
          declared="$(git cat-file tag "refs/tags/$TAG" 2>/dev/null | sed -n 's/^object //p')"
          echo "FINAL_TAG_OBJECT_TYPE=$object_type"
          echo "FINAL_TAG_TARGET=$target"
          echo "FINAL_TAG_DECLARED_OBJECT=$declared"

          pass=false
          if [[ "$tag_create_rc" -eq 0 && "$tag_push_rc" -eq 0 && "$fetch_rc" -eq 0 && "$object_type" == tag && "$target" == "$COMMIT" && "$declared" == "$COMMIT" ]]; then
            pass=true
          fi
          python3 - "$pass" "$tag_create_rc" "$tag_push_rc" "$fetch_rc" "$object_type" "$target" "$declared" <<'PY'
          import json,sys
          passed,create_rc,push_rc,fetch_rc,obj,target,declared=sys.argv[1:]
          data={
            "pass": passed=="true",
            "canonical_annotated_tag":"formalization-final-2026-08-21",
            "canonical_authority_commit":"8f7e861f5f76c0aa5d347e0de865516a1ba23922",
            "tag_create_rc":int(create_rc),
            "tag_push_rc":int(push_rc),
            "tag_fetch_rc":int(fetch_rc),
            "tag_object_type":obj,
            "tag_target":target,
            "tag_declared_object":declared,
            "force_update_used":False
          }
          open("tag-freeze/TAG_DIAGNOSTIC.json","w").write(json.dumps(data,indent=2,sort_keys=True)+"\n")
          PY
          exit 0

      - name: Preserve tag diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-tag-diagnostic-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: tag-freeze
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Enforce only after diagnostics are preserved
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          d=json.load(open('tag-freeze/TAG_DIAGNOSTIC.json'))
          assert d['pass'] is True, d
          print('FINAL_AUTHORITY_TAG_FREEZE=PASS')
          PY
