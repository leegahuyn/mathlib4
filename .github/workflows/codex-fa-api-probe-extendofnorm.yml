name: Codex FA API probe extendOfNorm

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-extendofnorm.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe pinned Mathlib API
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeExtend.lean <<'LEAN'
          import Mathlib
          #check LinearMap.extendOfNorm
          #check LinearMap.extendOfNorm_apply
          #check LinearMap.mkContinuous
          #check LinearMap.mkContinuousNormLe
          #check ContinuousLinearMap.extend
          #check IsDenseInducing.extend
          #check DenseRange.extend
          LEAN
          set +e
          lake env lean /tmp/ProbeExtend.lean >/tmp/extendofnorm-api.log 2>&1
          code=$?
          set -e
          cat /tmp/extendofnorm-api.log
          echo "$code" >/tmp/probe.exit
          exit 0
      - name: Upload probe evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-extendofnorm-${{ github.sha }}
          path: |
            /tmp/extendofnorm-api.log
            /tmp/probe.exit
          retention-days: 7
