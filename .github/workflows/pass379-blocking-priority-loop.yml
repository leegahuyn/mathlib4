name: PASS 379 blocking FA Mock3 QYM loop

on:
  push:
    branches: [fix/fa379-blocking-priority-loop-20260809]
    paths:
      - '.github/workflows/pass379-blocking-priority-loop.yml'
      - 'scripts/blocking_priority_loop_v379.py'
      - 'scripts/priority_chain_v378.py'
      - 'scripts/run_lean_repair_v377_styled.py'
      - 'scripts/lean_repair_loop_v377.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass379-blocking-priority-loop
  cancel-in-progress: false

jobs:
  blocking-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa379-blocking-priority-loop-20260809
      BLOCKING_MAX_SECONDS: '19800'
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact blocking-loop head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1400
          persist-credentials: true

      - name: Install pinned Lean and full cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Materialize exact PASS 376 source when the checked-in FA is still a stub
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          size=$(wc -c < "${fa}")
          echo "checked_in_fa_size=${size}"
          if [[ ${size} -gt 500000 ]]; then
            echo 'Using the checked-in full FunctionalAnalysis source.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          begin = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(begin) != 1 or text.count(end) != 1:
              raise SystemExit('PASS341 direct-compile markers unavailable')
          text = text.replace(begin, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(end, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          candidate='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${candidate}"
          cp "${candidate}" "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Run the blocking ordered repair loop
        id: loop
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/blocking_priority_loop_v379.py \
            > /tmp/pass379-blocking-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass379-blocking-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload all blocking-loop evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass379-blocking-loop-${{ github.sha }}
          path: |
            /tmp/pass379-blocking-driver.log
            /tmp/pass379-blocking
            /tmp/pass378
            /tmp/lean-repair-v377
            build-logs/PASS379_*.json
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce actual final two-round result
        if: always()
        shell: bash
        env:
          LOOP_EXIT: ${{ steps.loop.outputs.exit_code }}
        run: |
          test "${LOOP_EXIT:-1}" = '0'
          test -s build-logs/FA_MOCK3_QYM_2X_PASS.json
