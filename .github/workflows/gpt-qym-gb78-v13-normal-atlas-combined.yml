name: GPT QYM GB78 V13 normal-atlas cumulative repair

on:
  push:
    branches:
      - gpt/qym-gb78-v13-normal-atlas-combined-20260819
    paths:
      - .github/workflows/gpt-qym-gb78-v13-normal-atlas-combined.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb78-v13-normal-atlas-combined
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      ROOT_OUT: /tmp/qym-gb78-v13
      NORMAL_OUT: /tmp/qym-gb78-v13/normal
      ATLAS_OUT: /tmp/qym-gb78-v13/atlas
      BASELINE_ARTIFACT: '9371708709'
      REPO: leegahuyn/mathlib4

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify pinned programs
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -s .github/qym_gb78_v12_normal_driver.py
          test -s .github/qym_gb78_v12_normal_patch.py
          test -s .github/qym_gb78_v13_atlas_driver.py
          test -s .github/qym_gb78_v13_atlas_patch.py
          mkdir -p "$ROOT_OUT" "$NORMAL_OUT" "$ATLAS_OUT" "$OLEAN"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$ROOT_OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for a in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$ROOT_OUT/toolchain.log" 2>&1 && break || sleep $((a * 5))
          done
          lean --version | tee "$ROOT_OUT/lean-version.txt"
          lake --version | tee "$ROOT_OUT/lake-version.txt"
          for a in 1 2 3 4 5; do
            lake exe cache get >> "$ROOT_OUT/mathlib-cache.log" 2>&1 && break || sleep $((a * 5))
          done

      - name: Restore QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure completed dependencies only
        shell: bash
        run: |
          set -euo pipefail
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$s.olean" || ! -s "$OLEAN/$s.ilean" ]]; then
              cap=1
              if [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]]; then cap=2000; fi
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$ROOT_OUT/$s.log" 2>&1
            fi
            test -s "$OLEAN/$s.olean"
            test -s "$OLEAN/$s.ilean"
          done

      - name: Run normal repair then atlas repair
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          export OUT="$NORMAL_OUT"
          python3 -B .github/qym_gb78_v12_normal_driver.py
          export NORMAL_OUT ATLAS_OUT
          python3 -B .github/qym_gb78_v13_atlas_driver.py

      - name: Promote verified cumulative frontier
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          test -s "$ATLAS_OUT/FINAL_QYM.lean"
          test -s "$ATLAS_OUT/FINAL_RESULT.json"
          errors="$(jq -r '.error_headers' "$ATLAS_OUT/FINAL_RESULT.json")"
          panic="$(jq -r '.panic_lines' "$ATLAS_OUT/FINAL_RESULT.json")"
          test "$errors" -lt 78
          test "$panic" -eq 0
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$ATLAS_OUT/FINAL_RESULT.json")"
          candidate_blob="$(jq -r '.candidate_qym_blob' "$ATLAS_OUT/FINAL_RESULT.json")"
          test "$(sha256sum "$ATLAS_OUT/FINAL_QYM.lean" | awk '{print $1}')" = "$candidate_sha"
          test "$(git hash-object "$ATLAS_OUT/FINAL_QYM.lean")" = "$candidate_blob"
          cp "$ATLAS_OUT/FINAL_QYM.lean" "$QYM"
          mkdir -p .github/qym-frontier
          cp "$ATLAS_OUT/FINAL_RESULT.json" .github/qym-frontier/GB78_V13_RESULT.json
          cp "$ATLAS_OUT/ATLAS_SELECTION.json" .github/qym-frontier/GB78_V13_SELECTION.json
          cp "$NORMAL_OUT/SELECTION.json" .github/qym-frontier/GB78_V13_NORMAL_SELECTION.json
          jq -n \
            --arg branch "$GITHUB_REF_NAME" \
            --arg qym_sha "$candidate_sha" \
            --arg qym_blob "$candidate_blob" \
            --argjson errors "$errors" \
            --argjson run_id "$GITHUB_RUN_ID" \
            --arg trigger_sha "$GITHUB_SHA" \
            --argjson atlas_improved "$(jq -r '.atlas_improved // false' "$ATLAS_OUT/FINAL_RESULT.json")" \
            '{schema:"qym-gb78-v13-promotion-v1",branch:$branch,run_id:$run_id,trigger_sha:$trigger_sha,error_headers:$errors,panic_lines:0,qym_sha256:$qym_sha,qym_blob:$qym_blob,atlas_improved:$atlas_improved,status:"PROMOTED"}' \
            > .github/qym-frontier/GB78_V13_PROMOTION_STATUS.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" .github/qym-frontier/GB78_V13_RESULT.json \
            .github/qym-frontier/GB78_V13_SELECTION.json \
            .github/qym-frontier/GB78_V13_NORMAL_SELECTION.json \
            .github/qym-frontier/GB78_V13_PROMOTION_STATUS.json
          git commit -m "QYM V13: promote verified ${errors}-error cumulative frontier"
          git push origin "HEAD:$GITHUB_REF_NAME"

      - name: Restore checked-in source
        if: always()
        shell: bash
        run: git checkout -- "$QYM" || true

      - name: Upload immutable V13 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb78-v13-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb78-v13
          if-no-files-found: error
          retention-days: 30
