name: PASS 411 independent PASS 389 tactic sweep

on:
  push:
    branches: [fix/fa376-final-isolated-20260809]
    paths: ['.github/workflows/pass411-independent-tactic-sweep.yml']
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write

concurrency:
  group: pass411-independent-tactic-sweep
  cancel-in-progress: false

jobs:
  tactic-sweep:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1000
          persist-credentials: true
      - name: Import tactic agent from PR9
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ci/fa319-isolated-20260807
          for file in pass389_priority_repair_agent.py pass389_tactic_sweep_agent.py pass389_prepare_dependencies.sh; do
            git show FETCH_HEAD:scripts/${file} > scripts/${file}
          done
          chmod +x scripts/pass389_prepare_dependencies.sh
          python3 -m py_compile scripts/pass389_priority_repair_agent.py scripts/pass389_tactic_sweep_agent.py
      - name: Install Lean, cache, and dependencies
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          bash scripts/pass389_prepare_dependencies.sh | tee /tmp/pass411-dependencies.log
      - name: Run deterministic tactic sweep
        id: repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASS389_EVIDENCE: /tmp/pass411-tactic
          PASS389_CHAIN_BRANCH: fix/fa411-pass389-tactic-20260809
          PASS389_PR9_BRANCH: ci/fa319-isolated-20260807
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass389_tactic_sweep_agent.py 2>&1 | tee /tmp/pass411-tactic-driver.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          mkdir -p /tmp/pass411-tactic
          cp /tmp/pass411-tactic-driver.log /tmp/pass411-tactic/driver.log
          cp /tmp/pass411-dependencies.log /tmp/pass411-tactic/dependencies.log
          cp build-logs/pass389-priority-state.json /tmp/pass411-tactic/state.json 2>/dev/null || true
          cp build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json /tmp/pass411-tactic/final-marker.json 2>/dev/null || true
          exit 0
      - if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass411-independent-tactic-${{ github.sha }}
          path: /tmp/pass411-tactic
          if-no-files-found: error
          retention-days: 90
      - if: always()
        shell: bash
        env:
          RC: ${{ steps.repair.outputs.exit_code }}
        run: |
          test -n "${RC:-}"
          exit "${RC}"
