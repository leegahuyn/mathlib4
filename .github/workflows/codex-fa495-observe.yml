name: Codex FA495 orbit L2 scalar field strict direct Lean

on:
  push:
    branches:
      - fix/fa495-orbit-l2-inner-field-20260811
    paths:
      - .github/workflows/codex-fa495-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa495-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish FA495 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA495 authoritative observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA494 -> FA495\`\n- upstream_FA494_run: \`31463480421\`\n- upstream_FA494_job: \`93691559188\`\n- upstream_FA494_source: \`0c12385bb59897283b26f5e0065dcee042d784b4e16013f54d34808c7b562328\`\n- frontier: \`35577:8 orbitEuclideanL2_norm_sq_eq_integral / index 2817\`\n- patch: \`inner_self_eq_norm_sq (𝕜 := ℂ)\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Run exact FA495 candidate/direct Lean and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa495_orbit_l2_inner_field_candidate_ci.sh 2>&1 | tee /tmp/fa495.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report FA495 evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa495.md
          from pathlib import Path
          import json, os
          out=Path('build-logs/codex-fa495-orbit-l2-inner-field/candidates/norms'); p=out/'METRIC.json'; src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); log=Path('/tmp/fa495.log')
          xs=['## FA495 authoritative observer — actual direct Lean','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`"]
          m=None
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                  xs.append(f'- {k}: `{m.get(k)}`')
              xs += ['', '### first error','```text',str(m.get('FA_first_error_message',''))[:6000],'```']
          else: xs.append('- METRIC.json: `MISSING`')
          if src.exists() and isinstance(m,dict) and m.get('FA_first_actual_error_line',0):
              a=src.read_text(encoding='utf-8',errors='replace').splitlines(); c=m['FA_first_actual_error_line']; lo,hi=max(1,c-14),min(len(a),c+28); xs += ['',f'### candidate source around line {c}','```lean','\n'.join(f'{i}: {a[i-1]}' for i in range(lo,hi+1)),'```']
          if log.exists(): xs += ['', '### tail','```text','\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-100:])[-12000:],'```']
          print('\n'.join(xs)[:32000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa495.md)"
      - name: Preserve result
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
