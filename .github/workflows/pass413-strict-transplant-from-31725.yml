name: PASS 413 strict transplant tournament from 31725 champion

on:
  push:
    branches:
      - fix/fa413-strict-transplant-from-31725-20260809
    paths:
      - '.github/workflows/pass413-strict-transplant-from-31725.yml'
      - 'scripts/fa413_strict_transplant_tournament.py'
      - 'scripts/fa413_strict_transplant_tournament_v2.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'build-logs/fa413-strict-transplant/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass413-strict-transplant-from-31725
  cancel-in-progress: false

jobs:
  strict-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa413-strict-transplant-from-31725-20260809
      FA413_MAX_FRONTIERS: '8'
      FA413_MAX_CANDIDATES: '28'
    steps:
      - name: Checkout exact strict-tournament head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run strict first-error tournament and ordered two-pass gate
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa413_strict_transplant_tournament_v2.py \
            > /tmp/fa413-console.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa413-console.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before}" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after}" >> "$GITHUB_OUTPUT"
          if test "$before" = "$after"; then
            echo "source_changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "source_changed=true" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Audit strict source and prepare concise evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa413-strict-transplant
          test -s "$d/CURRENT.json"
          test -s "$d/CURRENT.txt"
          cp /tmp/fa413-console.log "$d/console.log"
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          text = src.read_text(encoding='utf-8')
          out=[]; i=0; depth=0; in_string=False; escaped=False
          while i < len(text):
              if depth:
                  if text.startswith('/-', i): depth += 1; out.extend('  '); i += 2; continue
                  if text.startswith('-/', i): depth -= 1; out.extend('  '); i += 2; continue
                  out.append('\n' if text[i]=='\n' else ' '); i += 1; continue
              if in_string:
                  ch=text[i]; out.append('\n' if ch=='\n' else ' ')
                  if escaped: escaped=False
                  elif ch=='\\': escaped=True
                  elif ch=='"': in_string=False
                  i += 1; continue
              if text.startswith('/-', i): depth=1; out.extend('  '); i += 2; continue
              if text.startswith('--', i):
                  while i < len(text) and text[i] != '\n': out.append(' '); i += 1
                  continue
              if text[i]=='"': in_string=True; out.append(' '); i += 1; continue
              out.append(text[i]); i += 1
          code=''.join(out)
          pats={
              'sorry':r'\bsorry\b', 'admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*(?:public\s+)?axiom\b',
              'unsafe':r'(?m)^\s*unsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b',
          }
          audit={k:len(re.findall(v,code)) for k,v in pats.items()}
          Path('build-logs/fa413-strict-transplant/FORBIDDEN_TOKEN_AUDIT.json').write_text(
              json.dumps(audit,indent=2),encoding='utf-8')
          if any(audit.values()): raise SystemExit(f'forbidden executable token(s): {audit}')

          status=json.loads(Path('build-logs/fa413-strict-transplant/CURRENT.json').read_text())
          base=status['immutable_baseline_first_error']
          metric=status['final_fa_metric']
          if not status['complete']:
              line=metric.get('first_line')
              if not isinstance(line,int) or line < base:
                  raise SystemExit(f'strict frontier regression: {line} < {base}')
          PY

      - name: Commit only strict improvement or final evidence
        if: always()
        shell: bash
        env:
          TOURNAMENT_EXIT: ${{ steps.tournament.outputs.exit_code }}
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
        run: |
          set -euo pipefail
          d=build-logs/fa413-strict-transplant
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/CURRENT.json" "$d/CURRENT.txt" \
            "$d/FORBIDDEN_TOKEN_AUDIT.json"
          find "$d" -maxdepth 1 -type f \
            \( -name 'frontier-*-PROMOTED.txt' -o -name 'frontier-*-context.txt' \
               -o -name 'frontier-*-first-error.txt' -o -name 'ALL_REQUIRED_TARGETS_2X_PASS' \) \
            -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            exit 0
          fi
          if test -f "$d/ALL_REQUIRED_TARGETS_2X_PASS"; then
            msg='fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS [skip ci]'
          elif test "${SOURCE_CHANGED:-false}" = 'true'; then
            msg='fix: promote strict FunctionalAnalysis frontier beyond PASS376 champion'
          else
            msg='ci: record PASS413 strict no-improvement evidence [skip ci]'
          fi
          git commit -m "$msg"
          git push origin HEAD:"${BRANCH_NAME}"

      - name: Upload complete PASS413 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass413-strict-transplant-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa413-strict-transplant
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            /tmp/fa413-console.log
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final two-pass result
        if: always()
        env:
          TOURNAMENT_EXIT: ${{ steps.tournament.outputs.exit_code }}
        shell: bash
        run: |
          test -n "${TOURNAMENT_EXIT:-}"
          exit "$TOURNAMENT_EXIT"
