name: PASS 392 iterative FA Mock3 QYM solver

on:
  push:
    branches: [fix/fa392-iterative-solver-20260809]
    paths:
      - '.github/workflows/fa392-iterative-solver.yml'
      - 'scripts/fa392_iterative_solver.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: fa392-iterative-solver
  cancel-in-progress: false

jobs:
  solve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EVIDENCE_DIR: build-logs/fa392-iterative
    steps:
      - name: Checkout exact PASS 392 branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa392-iterative-solver-20260809
          fetch-depth: 900
          persist-credentials: true

      - name: Install pinned Lean, ripgrep, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ripgrep
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run ordered iterative solver
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          FA392_MODELS: >-
            openai/gpt-5,openai/o3,openai/o4-mini,openai/gpt-4.1,
            xai/grok-3-mini,deepseek/DeepSeek-V3-0324,
            mistral-ai/Mistral-Large-2411,qwen/Qwen3-235B-A22B
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa392_iterative_solver.py \
            --evidence-dir "${EVIDENCE_DIR}" \
            --fa-rounds 12 \
            --downstream-rounds 6 \
            --max-candidates 4 \
            --max-errors 180 \
            2>&1 | tee "${EVIDENCE_DIR}.console.log"
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "solver_exit_code=${rc}" | tee "${EVIDENCE_DIR}.exit.txt"

      - name: Record checked-in source hashes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_DIR}"
          sha256sum \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            > "${EVIDENCE_DIR}/source-sha256.txt"
          find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0 | \
            sort -z | xargs -0 -r sha256sum >> "${EVIDENCE_DIR}/source-sha256.txt"

      - name: Commit only verified source progress or final marker
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          source_changed=0
          for f in \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean; do
            if ! git diff --quiet -- "$f"; then source_changed=1; fi
          done
          while IFS= read -r f; do
            if ! git diff --quiet -- "$f"; then source_changed=1; fi
          done < <(find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' | sort)

          final_marker=0
          if test -f "${EVIDENCE_DIR}/ALL_REQUIRED_TARGETS_2X_PASS"; then
            final_marker=1
          fi

          if test "$source_changed" = 1 || test "$final_marker" = 1; then
            git add \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
              PrimalitySheafVerification/QYM.lean
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' -print0 | \
              xargs -0 -r git add
            test ! -f "${EVIDENCE_DIR}/FINAL_STATUS.json" || \
              git add "${EVIDENCE_DIR}/FINAL_STATUS.json"
            test ! -f "${EVIDENCE_DIR}/ALL_REQUIRED_TARGETS_2X_PASS" || \
              git add "${EVIDENCE_DIR}/ALL_REQUIRED_TARGETS_2X_PASS"
            find "${EVIDENCE_DIR}" -name history.json -print0 2>/dev/null | xargs -0 -r git add
            find "${EVIDENCE_DIR}" -name public-headers.sha256 -print0 2>/dev/null | xargs -0 -r git add
            test ! -f "${EVIDENCE_DIR}/source-sha256.txt" || \
              git add "${EVIDENCE_DIR}/source-sha256.txt"
            git commit -m "fix: advance PASS 392 FA Mock3 QYM frontier"
            git push origin HEAD:fix/fa392-iterative-solver-20260809
          else
            echo 'No verified source progress to commit.'
          fi

      - name: Upload complete PASS 392 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa392-iterative-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa392-iterative
            build-logs/fa392-iterative.console.log
            build-logs/fa392-iterative.exit.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce solver result
        if: always()
        shell: bash
        env:
          SOLVER_EXIT_CODE: ${{ steps.solver.outputs.exit_code }}
        run: |
          test -n "${SOLVER_EXIT_CODE:-}"
          exit "${SOLVER_EXIT_CODE}"
