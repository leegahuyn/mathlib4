name: Codex FA API probe Friedrichs integral v2

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-friedrichs-integral-v1.yml]
  workflow_dispatch:

permissions: {contents: read}

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Prove pinned integral repair shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeFriedrichsIntegral.lean <<'LEAN'
          import Mathlib
          open MeasureTheory

          #check integral_ofReal
          #check Measure.integral_comp_smul
          #check integral_const_mul

          example (f : ℂ → ℝ) :
              (∫ x : ℂ, (f x : ℂ)) = ((∫ x : ℂ, f x) : ℂ) := by
            exact integral_ofReal

          example (f : ℂ → ℝ) (h : (∫ x : ℂ, f x) = 1) :
              (∫ x : ℂ, (f x : ℂ)) = 1 := by
            calc
              (∫ x : ℂ, (f x : ℂ)) = ((∫ x : ℂ, f x) : ℂ) := integral_ofReal
              _ = 1 := by rw [h]; norm_num

          example (a : ℝ) (ha : 0 < a) (f : ℂ → ℝ)
              (hchange : (∫ x : ℂ, f (a • x)) = (a ^ 2)⁻¹ * ∫ x : ℂ, f x)
              (hmass : (∫ x : ℂ, f x) = 1) :
              (∫ x : ℂ, a ^ 2 * f (a • x)) = 1 := by
            rw [integral_const_mul, hchange, hmass]
            field_simp [ha.ne']

          example (a L : ℝ) (ha : 0 < a) (g : ℂ → ℝ)
              (hchange : (∫ x : ℂ, g (a • x)) = (a ^ 2)⁻¹ * L) :
              (∫ x : ℂ, a ^ 2 * g (a • x)) = L := by
            rw [integral_const_mul, hchange]
            field_simp [ha.ne']
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeFriedrichsIntegral.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-friedrichs-integral-v2-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
