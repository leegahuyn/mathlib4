name: Codex FA API probe ae restrict v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-ae-restrict-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe ae restriction
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeAeRestrict.lean <<'LEAN'
          import Mathlib
          open MeasureTheory Filter Set
          #check Measure.restrict_le_self
          #check ae_mono
          #check Filter.Eventually.filter_mono
          #check Filter.EventuallyEq.filter_mono
          variable {α : Type*} [MeasurableSpace α] (μ : Measure α) (s : Set α)
          example {p : α → Prop} (h : ∀ᵐ x ∂μ, p x) : ∀ᵐ x ∂(μ.restrict s), p x := by
            exact ae_mono (Measure.restrict_le_self) h
          example {f g : α → ℝ} (h : f =ᵐ[μ] g) : f =ᵐ[μ.restrict s] g := by
            exact ae_mono (Measure.restrict_le_self) h
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeAeRestrict.lean | tee /tmp/ae-restrict.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-ae-restrict-v1-${{ github.sha }}", path: /tmp/ae-restrict.log, retention-days: 7}
