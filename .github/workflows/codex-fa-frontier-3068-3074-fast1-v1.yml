name: Codex FA frontier 3068-3074 fast1 v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-3068-3074-fast1-v1.yml
      - scripts/fa_dynamic_cluster_3068_3074_v1.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:
permissions:
  actions: read
  contents: read
concurrency:
  group: codex-fa-frontier-3068-3074-fast1-v1
  cancel-in-progress: true
env:
  BASE_RUN_ID: "31526614364"
  BASE_HEAD_SHA: "443cd48220889fd4d01b21d9195e917ff33b91ab"
  BASE_WORKFLOW: ".github/workflows/codex-fa-frontier-3029-3047-fast1-v1.yml"
  BASE_FIRST_INDEX: "3068"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Await and attest exact idx3068 frontier
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3068-3074-fast1-v1; mkdir -p "$OUT" /tmp/base3068
          for _ in $(seq 1 240); do gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"; st=$(python3 -c "import json;print(json.load(open('$OUT/run.json')).get('status',''))"); [[ "$st" == completed ]] && break; sleep 10; done
          python3 - <<'PY'
          import json,os
          r=json.load(open('build-logs/codex-fa-frontier-3068-3074-fast1-v1/run.json'))
          if not (r.get('status')=='completed' and r.get('conclusion')=='failure' and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and r.get('path')==os.environ['BASE_WORKFLOW']): raise SystemExit('base run gate failed')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100" > "$OUT/jobs.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" > "$OUT/arts.json"
          python3 - <<'PY' > /tmp/base.env
          import json
          out='build-logs/codex-fa-frontier-3068-3074-fast1-v1'; jobs=json.load(open(out+'/jobs.json')).get('jobs',[]); js=[j for j in jobs if j.get('name')=='frontier'];
          if len(js)!=1: raise SystemExit('job count drift')
          steps={s.get('name'):s for s in js[0].get('steps',[])}
          if steps.get('Direct full-source first-frontier compile',{}).get('conclusion')!='success': raise SystemExit('base direct compile missing')
          arts=json.load(open(out+'/arts.json')).get('artifacts',[]); xs=[a for a in arts if a.get('name','').startswith('codex-fa-frontier-3029-3047-fast1-v1-') and not a.get('expired')]
          if len(xs)!=1: raise SystemExit('artifact count drift')
          print('AID='+str(xs[0]['id'])); print('ADIG='+xs[0]['digest'])
          PY
          source /tmp/base.env; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > /tmp/base.zip; test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$ADIG"; unzip -q /tmp/base.zip -d /tmp/base3068
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          m=json.loads(next(Path('/tmp/base3068').rglob('METRIC.json')).read_text()); checks=[str(m.get('run_id'))==os.environ['BASE_RUN_ID'],m.get('head_sha')==os.environ['BASE_HEAD_SHA'],m.get('Mock2_exit')==0,m.get('Mock2_Advanced_exit')==0,m.get('FA_exit')==1,m.get('all_required_lean_executed') is True,str(m.get('FA_error_declaration_index'))==os.environ['BASE_FIRST_INDEX'],m.get('source_identity_locked_after_materialization') is True]
          if not all(checks): raise SystemExit('base metric gate failed')
          hits=[]
          for p in Path('/tmp/base3068').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' in p.as_posix() and hashlib.sha256(p.read_bytes()).hexdigest()==m['source_sha256']: hits.append(p)
          if not hits: raise SystemExit('base source missing')
          Path('build-logs/codex-fa-frontier-3068-3074-fast1-v1/BASE_SOURCE.txt').write_text(str(min(hits,key=lambda q:(len(q.parts),q.as_posix())).resolve())+'\n')
          PY
      - name: Apply strict SL2 cluster
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-frontier-3068-3074-fast1-v1
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$(cat "$OUT/BASE_SOURCE.txt")" --library scripts/fa_dynamic_cluster_3068_3074_v1.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/PREP.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          a=json.loads(Path('build-logs/codex-fa-frontier-3068-3074-fast1-v1/PREP.json').read_text());
          if not (a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed']): raise SystemExit('semantic audit failed')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f"CANDIDATE_SHA={a['candidate_source_sha256']}\n")
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-frontier-3068-3074-fast1-v1; curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh; sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1; export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n'<lean-toolchain)" >"$OUT/toolchain.log" 2>&1; lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct full-source first-frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-3068-3074-fast1-v1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean">"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}; one Mock2; one Mock2_Advanced; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')"="$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-3068-3074-fast1-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};f=es[0] if es else {};b=p.read_bytes();a=json.loads((out/'PREP.json').read_text());m={'schema':'fa-frontier-3068-3074-fast1-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_first_actual_error_line':f.get('line'),'FA_first_actual_error_col':f.get('col'),'FA_first_error_declaration':f.get('declaration'),'FA_error_declaration_index':f.get('declaration_index'),'FA_first_error_message':f.get('message'),'public_declaration_headers_preserved':a['public_declaration_headers_preserved'],'declaration_sequence_preserved':a['declaration_sequence_preserved'],'maxErrors_cap':1};(out/'METRIC.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")">>"$GITHUB_OUTPUT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-3068-3074-fast1-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-3068-3074-fast1-v1
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}"||exit 86;exit "$FA_EXIT"
