name: Codex FA v51 frontier safe matrix highcap2000
run-name: "Codex: exclusive FA v51 frontier safe full compile"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fa-exclusive-focus-20260814
    paths:
      - .github/workflows/codex-fa-v51-frontier-safe-matrix-highcap2000.yml
      - scripts/fa_v51_materialize.py

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa-v51-exclusive-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct:
    name: direct-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - ring_change_noadj
          - ring_change_adj
          - ring_change_adj_forward
          - ringnf_change_adj
          - ring_simpa_adj
          - ring_simpa_adj_forward
    env:
      FA_V51_VARIANT: ${{ matrix.variant }}
      FA_V51_OUT: build-logs/codex-fa-v51-frontier-safe/${{ matrix.variant }}
      FA_V51_BASE_RUN_ID: "31772148582"
      FA_V51_BASE_JOB_ID: "94680116088"
      FA_V51_BASE_ARTIFACT_ID: "9208884100"
      FA_V51_BASE_ARTIFACT_NAME: codex-fa-v50-congr_change_adj-highcap2000-05cbd665f941a3c2ebff889719833ec145b0bc5c
      FA_V51_BASE_ARTIFACT_DIGEST: sha256:64f388685331a5b17cf04dffb5eeea37c2d1bcb953c17fc73b882366bb9f71bc
      FA_V51_BASE_ARTIFACT_SIZE: "2135653"
      FA_V51_BASE_HEAD_SHA: 05cbd665f941a3c2ebff889719833ec145b0bc5c
      FA_V51_BASE_SOURCE_SHA256: e37ac30b388bee8b46f4316209740c6e86a8a7bb2bc8c2277e08f7f62da3e7dc
      FA_V51_BASE_SOURCE_BYTES: "2798434"
      FA_V51_BASE_SOURCE_LINES: "62621"
      FA_V51_BASE_SOURCE_DECLARATIONS: "4416"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-prove exact v50 authority and materialize v51 candidate
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FA_V51_OUT"
          authority_root="/tmp/fa-v51-authority-${GITHUB_RUN_ID}-${FA_V51_VARIANT}"
          authority_zip="/tmp/fa-v51-authority-${GITHUB_RUN_ID}-${FA_V51_VARIANT}.zip"
          mkdir -p "$authority_root"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FA_V51_BASE_RUN_ID}" >"$FA_V51_OUT/V50_RUN.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${FA_V51_BASE_JOB_ID}" >"$FA_V51_OUT/V50_JOB.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V51_BASE_ARTIFACT_ID}" >"$FA_V51_OUT/V50_ARTIFACT.json"
          python3 - <<'PYI'
          import json, os
          from pathlib import Path
          out=Path(os.environ['FA_V51_OUT'])
          run=json.loads((out/'V50_RUN.json').read_text())
          job=json.loads((out/'V50_JOB.json').read_text())
          art=json.loads((out/'V50_ARTIFACT.json').read_text())
          assert run['id']==int(os.environ['FA_V51_BASE_RUN_ID'])
          assert run['head_sha']==os.environ['FA_V51_BASE_HEAD_SHA']
          assert run['status']=='completed' and run['conclusion']=='failure'
          assert job['id']==int(os.environ['FA_V51_BASE_JOB_ID'])
          assert job['run_id']==int(os.environ['FA_V51_BASE_RUN_ID'])
          assert job['name']=='direct-congr_change_adj'
          assert job['status']=='completed' and job['conclusion']=='failure'
          assert art['id']==int(os.environ['FA_V51_BASE_ARTIFACT_ID'])
          assert art['name']==os.environ['FA_V51_BASE_ARTIFACT_NAME']
          assert art['size_in_bytes']==int(os.environ['FA_V51_BASE_ARTIFACT_SIZE'])
          assert art['digest']==os.environ['FA_V51_BASE_ARTIFACT_DIGEST']
          assert art['expired'] is False
          assert art['workflow_run']['id']==int(os.environ['FA_V51_BASE_RUN_ID'])
          assert art['workflow_run']['head_sha']==os.environ['FA_V51_BASE_HEAD_SHA']
          PYI
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V51_BASE_ARTIFACT_ID}/zip" >"$authority_zip"
          test "sha256:$(sha256sum "$authority_zip" | awk '{print $1}')" = "$FA_V51_BASE_ARTIFACT_DIGEST"
          unzip -q "$authority_zip" -d "$authority_root"
          base_source="$(find "$authority_root" -type f -name 'Mock2_FunctionalAnalysis-candidate.lean' -print -quit)"
          test -n "$base_source"
          test "$(sha256sum "$base_source" | awk '{print $1}')" = "$FA_V51_BASE_SOURCE_SHA256"
          test "$(wc -c < "$base_source" | tr -d ' ')" = "$FA_V51_BASE_SOURCE_BYTES"
          test "$(wc -l < "$base_source" | tr -d ' ')" = "$FA_V51_BASE_SOURCE_LINES"
          cp "$base_source" "$FA_V51_OUT/V50_BASE.lean"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$FA_V51_OUT/Mock2_FunctionalAnalysis-checked-in-before.lean"
          python3 scripts/fa_v51_materialize.py             --base "$base_source"             --variant "$FA_V51_VARIANT"             --out "$FA_V51_OUT/Mock2_FunctionalAnalysis-candidate.lean"             --audit "$FA_V51_OUT/PATCH_AUDIT.json"             | tee "$FA_V51_OUT/MATERIALIZATION.stdout.json"
