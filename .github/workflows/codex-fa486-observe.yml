name: Codex FA486 hpoint fun_prop strict direct Lean
# isolated retrigger after confirming unrelated push workflows were no-op

on:
  push:
    branches:
      - fix/fa486-hpoint-fun-prop-20260811
    paths:
      - .github/workflows/codex-fa486-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa486-observe-812df4c
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA486 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA486 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA485 -> FA486\`\n- upstream_FA485_run: \`31452647851\`\n- upstream_FA485_job: \`93660105937\`\n- upstream_FA485_source: \`8e5732de22dff5e1c293c824d4696df8b6937e9f2625713b7c3a424286fde76e\`\n- frontier: \`35311:10 selectedLogHeightEnergyDensity_continuous / index 2806\`\n- patch: \`remove nonexistent continuous_subtype_mk; direct fun_prop\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA486 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa486_hpoint_fun_prop_candidate_ci.sh 2>&1 | tee /tmp/fa486-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA486 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa486-comment.md
          from pathlib import Path
          import json, os
          out = Path('build-logs/codex-fa486-hpoint-fun-prop/candidates/norms')
          metric, candidate = out / 'METRIC.json', out / 'CANDIDATE.json'
          source = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          log = Path('/tmp/fa486-observe.log')
          parts = ['## FA486 observer — actual remote execution', '',
                   f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",
                   f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",
                   f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`", '']
          md = None
          if metric.exists():
              raw = metric.read_text(encoding='utf-8')
              parts += ['### METRIC.json', '```json', raw[:32000], '```', '']
              try: md = json.loads(raw)
              except Exception: pass
          else:
              parts += ['### METRIC.json', '`MISSING`', '']
          if candidate.exists():
              parts += ['### CANDIDATE.json', '```json', candidate.read_text(encoding='utf-8')[:16000], '```', '']
          if source.exists():
              lines = source.read_text(encoding='utf-8', errors='replace').splitlines()
              center = md.get('FA_first_actual_error_line', 35311) if isinstance(md, dict) else 35311
              lo, hi = max(1, center - 16), min(len(lines), center + 30)
              parts += [f'### Exact FA486 candidate source around line {center}', '```lean',
                        '\n'.join(f'{i}: {lines[i-1]}' for i in range(lo, hi+1)), '```', '']
          if log.exists():
              tail = '\n'.join(log.read_text(encoding='utf-8', errors='replace').splitlines()[-150:])
              parts += ['### Tail', '```text', tail[-18000:], '```']
          print('\n'.join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa486-comment.md)"

      - name: Preserve FA486 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
