name: Codex FA v48 evidence-driven auto repair highcap2000
run-name: "Codex: run FA v48 evidence-driven repair matrix"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-v48-auto-repair-highcap2000.yml
      - scripts/fa_v48_auto_repair.py

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa-v48-auto-repair-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct:
    name: direct-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant:
          - frontier
          - frontier_plane
          - frontier_names
          - frontier_plane_names
          - frontier_enrich
          - frontier_ring
          - frontier_enrich_ring
          - frontier_broad
    env:
      FA_V48_VARIANT: ${{ matrix.variant }}
      FA_V48_OUT: build-logs/codex-fa-v48-auto-repair-highcap2000/${{ matrix.variant }}
      FA_V48_BASE_RUN_ID: "31758486070"
      FA_V48_BASE_ARTIFACT_ID: "9204077135"
      FA_V48_BASE_ARTIFACT_NAME: codex-fa-v47-safe_w06_funprop_w27-highcap2000-d699d23a23d6676d18880710e6c1fa7d443be482
      FA_V48_BASE_ARTIFACT_DIGEST: sha256:dbabd49d16ddcbd8f67a7b623cd0c45785d602c03d66dfb0833016e25ddcc0fa
      FA_V48_BASE_ARTIFACT_SIZE: "2123030"
      FA_V48_BASE_HEAD_SHA: d699d23a23d6676d18880710e6c1fa7d443be482
      FA_V48_BASE_SOURCE_SHA256: c255c100f33c09cafc37276f967b9cd535e0ddd76460df149d71d632d8644a63
      FA_V48_BASE_SOURCE_BYTES: "2795882"
      FA_V48_BASE_SOURCE_LINES: "62555"
      FA_V48_BASE_SOURCE_DECLARATIONS: "4416"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Re-prove exact v47 authority and materialize v48 candidate
        id: materialize
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$FA_V48_OUT"
          authority_root="/tmp/fa-v48-authority-${GITHUB_RUN_ID}-${FA_V48_VARIANT}"
          authority_zip="/tmp/fa-v48-authority-${GITHUB_RUN_ID}-${FA_V48_VARIANT}.zip"
          mkdir -p "$authority_root"

          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${FA_V48_BASE_RUN_ID}" >"$FA_V48_OUT/V47_RUN.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V48_BASE_ARTIFACT_ID}" >"$FA_V48_OUT/V47_ARTIFACT.json"

          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['FA_V48_OUT'])
          run = json.loads((out / 'V47_RUN.json').read_text())
          artifact = json.loads((out / 'V47_ARTIFACT.json').read_text())
          assert run['id'] == int(os.environ['FA_V48_BASE_RUN_ID'])
          assert run['head_sha'] == os.environ['FA_V48_BASE_HEAD_SHA']
          assert run['status'] == 'completed' and run['conclusion'] == 'failure'
          assert artifact['id'] == int(os.environ['FA_V48_BASE_ARTIFACT_ID'])
          assert artifact['name'] == os.environ['FA_V48_BASE_ARTIFACT_NAME']
          assert artifact['size_in_bytes'] == int(os.environ['FA_V48_BASE_ARTIFACT_SIZE'])
          assert artifact['digest'] == os.environ['FA_V48_BASE_ARTIFACT_DIGEST']
          assert artifact['expired'] is False
          assert artifact['workflow_run']['id'] == int(os.environ['FA_V48_BASE_RUN_ID'])
          assert artifact['workflow_run']['head_sha'] == os.environ['FA_V48_BASE_HEAD_SHA']
          PY

          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA_V48_BASE_ARTIFACT_ID}/zip" >"$authority_zip"
          test "sha256:$(sha256sum "$authority_zip" | awk '{print $1}')" = "$FA_V48_BASE_ARTIFACT_DIGEST"
          unzip -q "$authority_zip" -d "$authority_root"

          base_source="$(find "$authority_root" -type f -name 'Mock2_FunctionalAnalysis-candidate.lean' -print -quit)"
          test -n "$base_source"
          test "$(sha256sum "$base_source" | awk '{print $1}')" = "$FA_V48_BASE_SOURCE_SHA256"
          test "$(wc -c < "$base_source" | tr -d ' ')" = "$FA_V48_BASE_SOURCE_BYTES"
          test "$(wc -l < "$base_source" | tr -d ' ')" = "$FA_V48_BASE_SOURCE_LINES"

          diagnostics="$(find "$authority_root" -type f \( -iname '*diagnostic*.jsonl' -o -iname '*diagnostics*.jsonl' \) -print -quit || true)"
          cp "$base_source" "$FA_V48_OUT/V47_BASE_SOURCE.lean"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$FA_V48_OUT/Mock2_FunctionalAnalysis-checked-in-before.lean"

          diag_args=()
          if [[ -n "$diagnostics" ]]; then
            cp "$diagnostics" "$FA_V48_OUT/V47_DIAGNOSTICS.jsonl"
            diag_args=(--diagnostics "$diagnostics")
          fi
          python3 scripts/fa_v48_auto_repair.py \
            --base "$base_source" \
            --variant "$FA_V48_VARIANT" \
            --out "$FA_V48_OUT/Mock2_FunctionalAnalysis-candidate.lean" \
            --audit "$FA_V48_OUT/PATCH_AUDIT.json" \
            "${diag_args[@]}" \
            | tee "$FA_V48_OUT/MATERIALIZATION.stdout.json"

          cp "$FA_V48_OUT/Mock2_FunctionalAnalysis-candidate.lean" \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$FA_V48_OUT/Mock2_FunctionalAnalysis-observed.lean"

          candidate_sha="$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')"
          printf '%s\n' "$candidate_sha" >"$FA_V48_OUT/candidate.sha256"
          printf 'FA_V42_EXPECTED_CANDIDATE_SHA256=%s\n' "$candidate_sha" >>"$GITHUB_ENV"
          printf 'FA_V42_VARIANT=%s\n' "$FA_V48_VARIANT" >>"$GITHUB_ENV"
          printf 'FA_V42_OUT=%s\n' "$FA_V48_OUT" >>"$GITHUB_ENV"
          printf 'FA_V48_CANDIDATE_SHA256=%s\n' "$candidate_sha" >>"$GITHUB_ENV"
          sha256sum scripts/fa_v48_auto_repair.py >"$FA_V48_OUT/materializer.sha256"

      - name: Install pinned Lean and Mathlib cache
        id: install
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$FA_V48_OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$FA_V48_OUT/toolchain.log" 2>&1
          lake exe cache get >"$FA_V48_OUT/cache.log" 2>&1
          lean --version | tee "$FA_V48_OUT/lean-version.txt"
          lake --version | tee "$FA_V48_OUT/lake-version.txt"
          sha256sum lean-toolchain lake-manifest.json >"$FA_V48_OUT/environment.sha256"

      - name: Direct Mock2 then Mock2 Advanced then full FA highcap2000
        id: direct_lean
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/fa_v42_direct_compile_ci.sh

      - name: Exact metrics and complete diagnostic inventory
        id: collect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 scripts/fa_v42_collect_full_diagnostics.py \
            --source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --out "$FA_V48_OUT" \
            --max-errors 2000 \
            | tee "$FA_V48_OUT/metric-console.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['FA_V48_OUT'])
          metric_path = out / 'METRIC.json'
          metric = json.loads(metric_path.read_text())
          metric['schema'] = 'fa-v48-auto-repair-highcap2000-metric-v1'
          metric['variant'] = os.environ['FA_V48_VARIANT']
          metric['authority_v47'] = {
            'run_id': int(os.environ['FA_V48_BASE_RUN_ID']),
            'artifact_id': int(os.environ['FA_V48_BASE_ARTIFACT_ID']),
            'artifact_name': os.environ['FA_V48_BASE_ARTIFACT_NAME'],
            'artifact_digest': os.environ['FA_V48_BASE_ARTIFACT_DIGEST'],
            'head_sha': os.environ['FA_V48_BASE_HEAD_SHA'],
            'source_sha256': os.environ['FA_V48_BASE_SOURCE_SHA256'],
          }
          metric['github_head_sha'] = os.environ['GITHUB_SHA']
          metric['github_run_id'] = os.environ['GITHUB_RUN_ID']
          metric['candidate_expected_sha256'] = os.environ.get('FA_V48_CANDIDATE_SHA256')
          metric_path.write_text(json.dumps(metric, indent=2, sort_keys=True) + '\n')
          fa = metric.get('FA_exit')
          gate = {
            'schema': 'fa-v48-final-gate-v1',
            'variant': os.environ['FA_V48_VARIANT'],
            'source_sha256': metric.get('source_sha256'),
            'Mock2_exit': metric.get('Mock2_exit'),
            'Mock2_Advanced_exit': metric.get('Mock2_Advanced_exit'),
            'FA_exit': fa,
            'direct_lean_verified': metric.get('direct_lean_verified'),
            'all_required_lean_executed': metric.get('all_required_lean_executed'),
            'error_count': metric.get('FA_error_headers_captured'),
            'first_error_line': metric.get('FA_first_actual_error_line'),
            'first_error_col': metric.get('FA_first_actual_error_col'),
            'first_error_declaration': metric.get('FA_first_error_declaration'),
            'first_error_declaration_index': metric.get('FA_first_error_declaration_index'),
            'unique_error_declarations': metric.get('unique_declarations_with_errors'),
            'unique_signatures': metric.get('unique_normalized_message_signatures'),
            'trust_six_zero': metric.get('source_executable_trust_six_zero'),
            'synthetic_sorry_count': metric.get('synthetic_declaration_uses_sorry_warning_count'),
            'status': 'PASS' if fa == 0 and metric.get('Mock2_exit') == 0 and metric.get('Mock2_Advanced_exit') == 0 else 'FAIL',
          }
          (out / 'FINAL_GATE.json').write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')
          print(json.dumps(gate, indent=2, sort_keys=True))
          PY

      - name: Step-outcome snapshot
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['FA_V48_OUT'])
          rows = {
            'materialize': '${{ steps.materialize.outcome }}',
            'install': '${{ steps.install.outcome }}',
            'direct_lean': '${{ steps.direct_lean.outcome }}',
            'collect': '${{ steps.collect.outcome }}',
          }
          (out / 'STEP_OUTCOMES.json').write_text(json.dumps(rows, indent=2, sort_keys=True) + '\n')
          PY

      - name: Preserve actual FA direct exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f "$FA_V48_OUT/Mock2_FunctionalAnalysis.exit"
          fa_exit="$(tr -d '\r\n' < "$FA_V48_OUT/Mock2_FunctionalAnalysis.exit")"
          case "$fa_exit" in
            ''|*[!0-9]*) exit 86 ;;
          esac
          exit "$fa_exit"

      - name: Upload exact variant source and all evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v48-${{ matrix.variant }}-highcap2000-${{ github.sha }}
          path: build-logs/codex-fa-v48-auto-repair-highcap2000/${{ matrix.variant }}
          retention-days: 30

  selector:
    name: evidence selector and guarded branch advance
    if: always()
    needs: direct
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      actions: read
      contents: write
    outputs:
      status: ${{ steps.advance.outputs.status }}
      fa_clean: ${{ steps.advance.outputs.fa_clean }}
      selected_sha256: ${{ steps.advance.outputs.selected_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1

      - name: Download every v48 evidence artifact from this exact run
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/fa-v48-selector-${GITHUB_RUN_ID}"
          mkdir -p "$root/zips" "$root/extracted"
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            >"$root/artifacts.json"
          python3 - "$root/artifacts.json" "$root/ids.tsv" <<'PY'
          import json, sys
          data = json.load(open(sys.argv[1]))
          rows = []
          for artifact in data.get('artifacts', []):
              name = artifact.get('name', '')
              if name.startswith('codex-fa-v48-') and '-highcap2000-' in name:
                  rows.append((artifact['id'], name, artifact.get('digest'), artifact.get('size_in_bytes')))
          if len(rows) != 8:
              raise SystemExit(f'expected 8 v48 artifacts, found {len(rows)}')
          with open(sys.argv[2], 'w') as handle:
              for row in rows:
                  handle.write('\t'.join(map(str, row)) + '\n')
          PY
          while IFS=$'\t' read -r artifact_id artifact_name artifact_digest artifact_size; do
            zip="$root/zips/${artifact_name}.zip"
            dst="$root/extracted/${artifact_name}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$artifact_digest"
            mkdir -p "$dst"
            unzip -q "$zip" -d "$dst"
          done <"$root/ids.tsv"
          printf 'FA_V48_SELECTOR_ROOT=%s\n' "$root" >>"$GITHUB_ENV"

      - name: Select only by direct Lean evidence and immutable score
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path

          root = Path(os.environ['FA_V48_SELECTOR_ROOT'])
          candidates = []
          for metric_path in root.glob('extracted/**/METRIC.json'):
              metric = json.loads(metric_path.read_text())
              variant = metric.get('variant')
              source = next(metric_path.parent.glob('Mock2_FunctionalAnalysis-candidate.lean'), None)
              gate_path = metric_path.parent / 'FINAL_GATE.json'
              audit_path = metric_path.parent / 'PATCH_AUDIT.json'
              if not variant or source is None or not gate_path.exists() or not audit_path.exists():
                  continue
              gate = json.loads(gate_path.read_text())
              audit = json.loads(audit_path.read_text())
              if metric.get('source_sha256') != audit.get('source_sha256'):
                  raise SystemExit(f'{variant}: metric/audit source mismatch')
              if metric.get('source_executable_trust_six_zero') is not True:
                  raise SystemExit(f'{variant}: trust audit is not six-zero')
              if metric.get('synthetic_declaration_uses_sorry_warning_count') != 0:
                  raise SystemExit(f'{variant}: synthetic sorry warning present')
              if metric.get('direct_lean_verified') is not True or metric.get('all_required_lean_executed') is not True:
                  raise SystemExit(f'{variant}: direct Lean evidence incomplete')
              fa_exit = metric.get('FA_exit')
              first_index = metric.get('FA_first_error_declaration_index')
              error_count = metric.get('FA_error_headers_captured')
              unique_decls = metric.get('unique_declarations_with_errors')
              signatures = metric.get('unique_normalized_message_signatures')
              is_pass = fa_exit == 0 and metric.get('Mock2_exit') == 0 and metric.get('Mock2_Advanced_exit') == 0
              score = (
                  1 if is_pass else 0,
                  int(first_index) if isinstance(first_index, int) else 10**9 if is_pass else -1,
                  -int(error_count) if isinstance(error_count, int) else -10**9,
                  -int(unique_decls) if isinstance(unique_decls, int) else -10**9,
                  -int(signatures) if isinstance(signatures, int) else -10**9,
              )
              candidates.append({
                  'variant': variant,
                  'score': score,
                  'pass': is_pass,
                  'metric': metric,
                  'gate': gate,
                  'audit': audit,
                  'source_path': str(source),
                  'metric_path': str(metric_path),
                  'gate_path': str(gate_path),
                  'audit_path': str(audit_path),
              })

          if len(candidates) != 8:
              raise SystemExit(f'expected 8 complete candidates, found {len(candidates)}')
          candidates.sort(key=lambda row: (row['score'], row['variant']), reverse=True)
          best = candidates[0]
          base_score = (0, 3669, -35, -19, -11)
          advance = best['score'] > base_score
          status = 'PASS' if best['pass'] else 'IMPROVED' if advance else 'NO_ADVANCE'
          out = root / 'selection'
          out.mkdir(parents=True, exist_ok=True)
          shutil.copy2(best['source_path'], out / 'Mock2_FunctionalAnalysis-selected.lean')
          shutil.copy2(best['metric_path'], out / 'METRIC-selected.json')
          shutil.copy2(best['gate_path'], out / 'FINAL_GATE-selected.json')
          shutil.copy2(best['audit_path'], out / 'PATCH_AUDIT-selected.json')
          serializable = []
          for row in candidates:
              serializable.append({
                  'variant': row['variant'],
                  'score': list(row['score']),
                  'pass': row['pass'],
                  'source_sha256': row['metric'].get('source_sha256'),
                  'FA_exit': row['metric'].get('FA_exit'),
                  'Mock2_exit': row['metric'].get('Mock2_exit'),
                  'Mock2_Advanced_exit': row['metric'].get('Mock2_Advanced_exit'),
                  'error_count': row['metric'].get('FA_error_headers_captured'),
                  'first_error_declaration': row['metric'].get('FA_first_error_declaration'),
                  'first_error_declaration_index': row['metric'].get('FA_first_error_declaration_index'),
                  'unique_error_declarations': row['metric'].get('unique_declarations_with_errors'),
                  'unique_signatures': row['metric'].get('unique_normalized_message_signatures'),
              })
          selection = {
              'schema': 'fa-v48-evidence-selector-v1',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': os.environ['GITHUB_SHA'],
              'base': {
                  'variant': 'v47-safe_w06_funprop_w27',
                  'source_sha256': 'c255c100f33c09cafc37276f967b9cd535e0ddd76460df149d71d632d8644a63',
                  'score': list(base_score),
                  'FA_exit': 1,
                  'error_count': 35,
                  'first_error_declaration_index': 3669,
                  'unique_error_declarations': 19,
                  'unique_signatures': 11,
              },
              'status': status,
              'advance': advance,
              'selected_variant': best['variant'],
              'selected_score': list(best['score']),
              'selected_source_sha256': best['metric'].get('source_sha256'),
              'candidates': serializable,
          }
          (out / 'SELECTION.json').write_text(json.dumps(selection, indent=2, sort_keys=True) + '\n')
          print(json.dumps(selection, indent=2, sort_keys=True))
          PY

      - name: Guarded check-in of pass or strict metric improvement
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          selection="$FA_V48_SELECTOR_ROOT/selection/SELECTION.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$selection")"
          advance="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["advance"]).lower())' "$selection")"
          selected_sha="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["selected_source_sha256"])' "$selection")"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          printf 'fa_clean=%s\n' "$([[ "$status" == PASS ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          printf 'selected_sha256=%s\n' "$selected_sha" >>"$GITHUB_OUTPUT"

          mkdir -p build-evidence/fa-v48
          cp "$selection" build-evidence/fa-v48/SELECTION.json
          cp "$FA_V48_SELECTOR_ROOT/selection/METRIC-selected.json" build-evidence/fa-v48/METRIC-selected.json
          cp "$FA_V48_SELECTOR_ROOT/selection/FINAL_GATE-selected.json" build-evidence/fa-v48/FINAL_GATE-selected.json
          cp "$FA_V48_SELECTOR_ROOT/selection/PATCH_AUDIT-selected.json" build-evidence/fa-v48/PATCH_AUDIT-selected.json

          if [[ "$advance" == true ]]; then
            cp "$FA_V48_SELECTOR_ROOT/selection/Mock2_FunctionalAnalysis-selected.lean" \
              PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add build-evidence/fa-v48
          if [[ "$advance" == true ]]; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "Codex: record FA v48 selector ${status}"
          git push origin HEAD:codex/fa-qym-cleanbuild-final-20260811-fast

      - name: Upload selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v48-selector-${{ github.sha }}
          path: ${{ env.FA_V48_SELECTOR_ROOT }}/selection
          retention-days: 30

  full13_probe:
    name: FA-pass-triggered QYM and 13-file direct probe
    needs: selector
    if: needs.selector.outputs.fa_clean == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/full13-probe
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >build-logs/full13-probe/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >build-logs/full13-probe/toolchain.log 2>&1
          lake exe cache get >build-logs/full13-probe/cache.log 2>&1
          lean --version | tee build-logs/full13-probe/lean-version.txt
          lake --version | tee build-logs/full13-probe/lake-version.txt
          sha256sum lean-toolchain lake-manifest.json >build-logs/full13-probe/environment.sha256

      - name: Directly compile all 13 required files without short-circuiting
        id: direct13
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out=build-logs/full13-probe
          files=(
            PrimalitySheafVerification/Spt1.lean
            PrimalitySheafVerification/Spt2.lean
            PrimalitySheafVerification/Spt3.lean
            PrimalitySheafVerification/Spt4.lean
            PrimalitySheafVerification/Spt5.lean
            PrimalitySheafVerification/Spt6.lean
            PrimalitySheafVerification/Spt7.lean
            PrimalitySheafVerification/Mock1.lean
            PrimalitySheafVerification/Mock1_Advanced.lean
            PrimalitySheafVerification/Mock2.lean
            PrimalitySheafVerification/Mock2_Advanced.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/QYM.lean
          )
          : >"$out/direct13.tsv"
          overall=0
          for file in "${files[@]}"; do
            key="$(basename "$file" .lean)"
            if [[ ! -f "$file" ]]; then
              printf '%s\tMISSING\t127\n' "$file" | tee -a "$out/direct13.tsv"
              overall=1
              continue
            fi
            set +e
            lake env lean -DmaxErrors=2000 "$file" >"$out/${key}.stdout.log" 2>"$out/${key}.stderr.log"
            code=$?
            set -e
            printf '%s\tEXECUTED\t%s\n' "$file" "$code" | tee -a "$out/direct13.tsv"
            printf '%s\n' "$code" >"$out/${key}.exit"
            if [[ "$code" -ne 0 ]]; then overall=1; fi
          done
          printf '%s\n' "$overall" >"$out/direct13.overall.exit"
          exit 0

      - name: Source identity and six-token trust inventory for all 13 files
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, re
          from pathlib import Path
          root = Path('PrimalitySheafVerification')
          names = [
              'Spt1.lean','Spt2.lean','Spt3.lean','Spt4.lean','Spt5.lean','Spt6.lean','Spt7.lean',
              'Mock1.lean','Mock1_Advanced.lean','Mock2.lean','Mock2_Advanced.lean',
              'Mock2_FunctionalAnalysis.lean','QYM.lean',
          ]
          trust_tokens = ('sorry','admit','axiom','unsafe','native_decide','Lean.ofReduceBool')
          decl_re = re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s(:]+)')
          def strip_noncode(text):
              out=list(text); i=0; depth=0; string=False; esc=False
              while i<len(out):
                  if depth:
                      if text.startswith('/-',i): out[i]=out[i+1]=' '; depth+=1; i+=2; continue
                      if text.startswith('-/',i): out[i]=out[i+1]=' '; depth-=1; i+=2; continue
                      if out[i]!='\n': out[i]=' '
                      i+=1; continue
                  if string:
                      ch=out[i]
                      if ch!='\n': out[i]=' '
                      if esc: esc=False
                      elif ch=='\\': esc=True
                      elif ch=='"': string=False
                      i+=1; continue
                  if text.startswith('/-',i): out[i]=out[i+1]=' '; depth=1; i+=2; continue
                  if text.startswith('--',i):
                      while i<len(out) and out[i]!='\n': out[i]=' '; i+=1
                      continue
                  if out[i]=='"': out[i]=' '; string=True
                  i+=1
              return ''.join(out)
          rows=[]
          for name in names:
              path=root/name
              if not path.exists():
                  rows.append({'file':str(path),'exists':False})
                  continue
              raw=path.read_bytes(); text=raw.decode(); code=strip_noncode(text)
              counts={token:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(token)+r'(?![A-Za-z0-9_])',code)) for token in trust_tokens}
              rows.append({
                  'file':str(path),'exists':True,'sha256':hashlib.sha256(raw).hexdigest(),
                  'bytes':len(raw),'lines':len(text.splitlines()),'declarations':len(decl_re.findall(text)),
                  'trust_counts':counts,'trust_six_zero':all(v==0 for v in counts.values()),
              })
          report={
              'schema':'full13-source-and-trust-inventory-v1','file_count_expected':13,
              'file_count_existing':sum(1 for row in rows if row.get('exists')),
              'all_trust_six_zero':all(row.get('trust_six_zero') is True for row in rows),
              'files':rows,
          }
          out=Path('build-logs/full13-probe/SOURCE_TRUST_INVENTORY.json')
          out.write_text(json.dumps(report,indent=2,sort_keys=True)+'\n')
          print(json.dumps(report,indent=2,sort_keys=True))
          PY

      - name: Preserve actual 13-file direct result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(tr -d '\r\n' < build-logs/full13-probe/direct13.overall.exit)"
          case "$code" in ''|*[!0-9]*) exit 86;; esac
          exit "$code"

      - name: Upload QYM and 13-file direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-full13-probe-${{ needs.selector.outputs.selected_sha256 }}
          path: build-logs/full13-probe
          retention-days: 30
