name: PASS 396 clean targeted FA Integrated Mock3 QYM repair

on:
  push:
    branches:
      - fix/fa396-clean-targeted-agent-20260809
    paths:
      - '.github/workflows/fa396-clean-targeted-agent.yml'
      - 'scripts/fa396_clean_targeted_agent.py'
      - 'scripts/fa394_error_window_agent.py'
      - 'scripts/fa391_targeted_priority_agent_v2.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: fa396-clean-targeted-agent
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout PASS 396 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa396-clean-targeted-agent-20260809
          fetch-depth: 3600
          persist-credentials: true

      - name: Install pinned Lean, ripgrep, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y ripgrep
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run clean error-centered repair in strict order
        id: agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA391_MODELS: 'openai/gpt-5,openai/o4-mini,openai/gpt-4.1,xai/grok-3'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa391-targeted /tmp/fa396-compiled
          python3 scripts/fa396_clean_targeted_agent.py \
            --rounds 16 \
            --models-per-round 4 \
            > /tmp/fa396-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa396-console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit only Lean sources and compact authoritative evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          git add PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "${p}" && git add "${p}" || true; done
          for p in \
            build-logs/fa391-targeted/AUTHORITATIVE_STATUS.json \
            build-logs/fa391-targeted/AUTHORITATIVE_STATUS.txt \
            build-logs/fa391-targeted/state.json \
            build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS; do
            test -e "${p}" && git add "${p}" || true
          done
          git diff --cached --quiet && exit 0
          if test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS; then
            msg='fix: obtain PASS 396 FA Integrated Mock3 QYM 2x PASS'
          else
            msg='fix: preserve best PASS 396 clean frontier'
          fi
          git commit -m "${msg}"
          git push origin HEAD:fix/fa396-clean-targeted-agent-20260809

      - name: Upload complete PASS 396 diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa396-clean-targeted-${{ github.sha }}
          path: |
            /tmp/fa396-console.log
            /tmp/fa396-compiled
            build-logs/fa391-targeted
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce ordered two-pass completion
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          test -n "${AGENT_EXIT_CODE:-}"
          test -f build-logs/fa391-targeted/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${AGENT_EXIT_CODE}"
