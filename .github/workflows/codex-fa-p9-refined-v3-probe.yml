name: Codex FA prebundled linear projection across custom core v3
# trigger: prebundled-linear-projection-custom-core-v3
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-p9-refined-v3-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile prebundled linear projection probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePrebundledLinear.lean <<'LEAN'
          import Mathlib

          noncomputable section
          abbrev F := ℂ → ℂ
          def P0 : Submodule ℂ F := ⊤
          abbrev E := P0
          def P1 : Submodule ℂ E := ⊤
          abbrev Core := P1

          instance : CoeFun E (fun _ => ℂ → ℂ) where
            coe f := (f.1 : F)
          def toE (u : Core) : E := u.1
          noncomputable instance : CoeOut Core E := ⟨toE⟩

          noncomputable def proj : Core →ₗ[ℂ] E where
            toFun u := u.1
            map_add' _ _ := rfl
            map_smul' _ _ := rfl

          theorem proj_apply (u : Core) (z : ℂ) : proj u z = (u : E) z := rfl

          namespace Local
          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥P1
            exact Submodule.module P1
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u a : Core) : proj (u + a) = proj u + proj a := by
            exact LinearMap.map_add proj u a

          example (u a : Core) : proj (u - a) = proj u - proj a := by
            exact LinearMap.map_sub proj u a

          example (u a : Core) (z : ℂ) :
              ((u - a : Core) : E) z = (u : E) z - (a : E) z := by
            rw [← proj_apply, ← proj_apply, ← proj_apply]
            rw [LinearMap.map_sub]
            rfl

          example (u a b : Core) (z : ℂ) :
              ((u - a - b : Core) : E) z =
                (u : E) z - (a : E) z - (b : E) z := by
            rw [← proj_apply, ← proj_apply, ← proj_apply, ← proj_apply]
            rw [LinearMap.map_sub, LinearMap.map_sub]
            rfl

          example (u a : Core) (t z : ℂ) :
              ((u - t • a : Core) : E) z = (u : E) z - t * (a : E) z := by
            rw [← proj_apply, ← proj_apply, ← proj_apply]
            rw [LinearMap.map_sub, LinearMap.map_smul]
            rfl
          end Local
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePrebundledLinear.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-prebundled-linear-custom-core-v3-${{ github.sha }}
          path: |
            /tmp/ProbePrebundledLinear.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
