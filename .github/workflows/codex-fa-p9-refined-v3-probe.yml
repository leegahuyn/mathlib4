name: Codex FA nested core module-native subtraction probe v2
# trigger: nested-core-module-native-sub-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-p9-refined-v3-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile module-native subtraction normalization probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeNestedModuleSub.lean <<'LEAN'
          import Mathlib

          noncomputable section
          abbrev F := ℂ → ℂ
          def P0 : Submodule ℂ F := ⊤
          abbrev SmoothLike := P0
          def P1 : Submodule ℂ SmoothLike := ⊤
          abbrev E := P1
          def P2 : Submodule ℂ E := ⊤
          abbrev Core := P2

          instance : CoeFun E (fun _ => ℂ → ℂ) where
            coe f := ((f.1 : SmoothLike) : F)

          def toE (u : Core) : E := u.1
          noncomputable instance : CoeOut Core E := ⟨toE⟩

          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥P2
            exact Submodule.module P2
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (a : Core) : -a = (-1 : ℂ) • a := by
            rfl

          example (u a : Core) : Sub.sub u a = u + (-1 : ℂ) • a := by
            change u - a = u + (-1 : ℂ) • a
            rw [sub_eq_add_neg]
            rfl

          example (u a : Core) (z : ℂ) :
              (((u + (-1 : ℂ) • a : Core) : E) z) =
                (u : E) z - (a : E) z := by
            rfl

          example (u a b : Core) (z : ℂ) :
              ((((u + (-1 : ℂ) • a) + (-1 : ℂ) • b : Core) : E) z) =
                (u : E) z - (a : E) z - (b : E) z := by
            rfl

          example (u a b : Core) (z : ℂ) :
              ((Sub.sub (Sub.sub u a) b : Core) : E) z =
                (u : E) z - (a : E) z - (b : E) z := by
            have h1 : Sub.sub u a = u + (-1 : ℂ) • a := by
              change u - a = u + (-1 : ℂ) • a
              rw [sub_eq_add_neg]
              rfl
            have h2 : Sub.sub (Sub.sub u a) b = Sub.sub u a + (-1 : ℂ) • b := by
              change Sub.sub u a - b = Sub.sub u a + (-1 : ℂ) • b
              rw [sub_eq_add_neg]
              rfl
            rw [h2, h1]
            rfl

          example (u a : Core) (t z : ℂ) :
              ((Sub.sub u (t • a) : Core) : E) z =
                (u : E) z - t * (a : E) z := by
            have h : Sub.sub u (t • a) = u + (-1 : ℂ) • (t • a) := by
              change u - t • a = u + (-1 : ℂ) • (t • a)
              rw [sub_eq_add_neg]
              rfl
            rw [h]
            rfl
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeNestedModuleSub.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-nested-module-native-sub-v2-${{ github.sha }}
          path: |
            /tmp/ProbeNestedModuleSub.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
