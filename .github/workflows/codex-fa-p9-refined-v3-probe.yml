name: Codex FA pinned P5 torus measure API grep
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-p9-refined-v3-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Grep torus finite-measure and smul APIs
        shell: bash
        run: |
          set -euo pipefail
          : >/tmp/p5-measure-grep.txt
          echo '=== UnitAddCircle/Torus measure instances ===' | tee -a /tmp/p5-measure-grep.txt
          grep -R -n -E 'UnitAddCircle|UnitAddTorus' Mathlib | grep -E 'IsFiniteMeasure|instMeasureSpace|isFiniteMeasure|volume' | head -160 | tee -a /tmp/p5-measure-grep.txt || true
          echo '=== IsFiniteMeasure compact Haar ===' | tee -a /tmp/p5-measure-grep.txt
          grep -R -n -E 'IsFiniteMeasure.*Haar|Haar.*IsFiniteMeasure|isFiniteMeasure.*Haar|CompactSpace.*IsFiniteMeasure' Mathlib/MeasureTheory Mathlib/Topology 2>/dev/null | head -160 | tee -a /tmp/p5-measure-grep.txt || true
          echo '=== Measurable.const_smul ===' | tee -a /tmp/p5-measure-grep.txt
          grep -R -n -E 'theorem.*const_smul|lemma.*const_smul' Mathlib/MeasureTheory Mathlib/Topology Mathlib/Analysis 2>/dev/null | head -120 | tee -a /tmp/p5-measure-grep.txt || true
          test -s /tmp/p5-measure-grep.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-p5-measure-grep-${{ github.sha }}
          path: /tmp/p5-measure-grep.txt
          retention-days: 30
