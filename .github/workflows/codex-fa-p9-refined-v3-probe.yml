name: Codex FA AE filter and product projection API probe
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-p9-refined-v3-probe.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile AE coercion and product projection proof shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeMeasureFilter.lean <<'LEAN'
          import Mathlib
          open MeasureTheory Filter
          local instance {α : Type*} [MeasurableSpace α] : Coe (Measure α) (Filter α) :=
            ⟨Measure.ae⟩
          variable {α β : Type*} [MeasurableSpace α]
          example (μ : Measure α) (f g : α → β) :
              f =ᶠ[μ] g ↔ f =ᵐ[μ] g := by
            rfl
          LEAN
          cat >/tmp/ProbeProdProjection.lean <<'LEAN'
          import Mathlib
          variable {E F ι : Type*} [AddCommMonoid E] [AddCommMonoid F]
          example (s : Finset ι) (x : ι → E) (y : ι → F) (p : E × F)
              (hx : (∑ i ∈ s, x i) = p.1) :
              (∑ i ∈ s, (x i, y i)).1 = p.1 := by
            simpa only [Prod.fst_sum] using hx
          example (s : Finset ι) (x : ι → E) (y : ι → F) (p : E × F)
              (hy : (∑ i ∈ s, y i) = p.2) :
              (∑ i ∈ s, (x i, y i)).2 = p.2 := by
            simpa only [Prod.snd_sum] using hy
          LEAN
          : >/tmp/results.txt
          for x in MeasureFilter ProdProjection; do
            set +e
            lake env lean -DmaxErrors=40 -DwarningAsError=false "/tmp/Probe${x}.lean" >"/tmp/Probe${x}.log" 2>&1
            rc=$?
            set -e
            echo "$x=$rc" | tee -a /tmp/results.txt
          done
          cat /tmp/results.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-ae-filter-prod-projection-${{ github.sha }}
          path: |
            /tmp/Probe*.lean
            /tmp/Probe*.log
            /tmp/results.txt
          retention-days: 30
