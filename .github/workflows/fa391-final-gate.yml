name: PASS 391 independent FA Mock3 QYM final gate

on:
  push:
    branches:
      - fix/fa391-final-gate-20260809
    paths:
      - '.github/workflows/fa391-final-gate.yml'
      - 'scripts/fa391_final_gate.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  independent-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PASS 391 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa391-final-gate-20260809
          fetch-depth: 3200
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run independent two-pass gate
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa391-final-gate
          python3 scripts/fa391_final_gate.py \
            > /tmp/fa391-final-gate-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa391-final-gate-console.log
          cp /tmp/fa391-final-gate-console.log \
            build-logs/fa391-final-gate/console.log 2>/dev/null || true
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Promote only independently verified source files to PR9 branch
        if: steps.gate.outputs.exit_code == '0'
        id: promote
        shell: bash
        env:
          TARGET_BRANCH: ci/fa319-isolated-20260807
        run: |
          set -euo pipefail
          test -f build-logs/fa391-final-gate/ALL_REQUIRED_TARGETS_2X_PASS
          source_head="$(git rev-parse HEAD)"
          target_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test -n "${target_head}"
          echo "source_head=${source_head}" > build-logs/fa391-final-gate/promotion.txt
          echo "target_head_before=${target_head}" >> build-logs/fa391-final-gate/promotion.txt

          git fetch --no-tags --depth=1 origin "${TARGET_BRANCH}"
          rm -rf /tmp/pr9-verified
          git worktree add --detach /tmp/pr9-verified FETCH_HEAD

          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            /tmp/pr9-verified/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            /tmp/pr9-verified/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          for path in PrimalitySheafVerification/Mock3*.lean; do
            test -e "${path}" || continue
            cp "${path}" "/tmp/pr9-verified/${path}"
          done
          cp PrimalitySheafVerification/QYM.lean \
            /tmp/pr9-verified/PrimalitySheafVerification/QYM.lean
          mkdir -p /tmp/pr9-verified/scripts
          cp scripts/fa391_final_gate.py /tmp/pr9-verified/scripts/fa391_final_gate.py

          rm -rf /tmp/pr9-verified/.lake
          ln -s "${GITHUB_WORKSPACE}/.lake" /tmp/pr9-verified/.lake
          export PATH="${HOME}/.elan/bin:${PATH}"
          (
            cd /tmp/pr9-verified
            rm -rf build-logs/fa391-final-gate
            python3 scripts/fa391_final_gate.py \
              > /tmp/pr9-final-gate-console.log 2>&1
          )
          cat /tmp/pr9-final-gate-console.log
          test -f /tmp/pr9-verified/build-logs/fa391-final-gate/ALL_REQUIRED_TARGETS_2X_PASS

          current_target_head="$(git ls-remote origin "refs/heads/${TARGET_BRANCH}" | awk '{print $1}')"
          test "${current_target_head}" = "${target_head}"
          echo "target_head_after_verification=${current_target_head}" \
            >> build-logs/fa391-final-gate/promotion.txt

          cd /tmp/pr9-verified
          git switch -c fa391-promote
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                  PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
                  PrimalitySheafVerification/QYM.lean
          for path in PrimalitySheafVerification/Mock3*.lean; do
            test -e "${path}" && git add "${path}"
          done
          if git diff --cached --quiet; then
            promoted_head="${target_head}"
            echo "No source changes were needed on PR9 branch."
          else
            git commit -m 'fix: verify FA Integrated Mock3 and QYM twice'
            git push origin "HEAD:${TARGET_BRANCH}"
            promoted_head="$(git rev-parse HEAD)"
          fi
          echo "promoted_head=${promoted_head}" \
            >> "${GITHUB_WORKSPACE}/build-logs/fa391-final-gate/promotion.txt"
          echo "promoted_head=${promoted_head}" >> "${GITHUB_OUTPUT}"

      - name: Create authoritative gate status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa391-final-gate
          mkdir -p "${d}"
          python3 - <<'PY'
          from pathlib import Path
          import json
          d=Path('build-logs/fa391-final-gate')
          p=d/'FINAL_STATUS.json'
          status=json.loads(p.read_text()) if p.exists() else {
              'complete':False,
              'stage':'missing-final-status',
          }
          status['gate_exit_code']='${{ steps.gate.outputs.exit_code }}'
          status['marker_exists']=(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists()
          status['promoted_head']='${{ steps.promote.outputs.promoted_head }}'
          status['authoritative_complete']=bool(
              status.get('complete')
              and status['marker_exists']
              and status['gate_exit_code']=='0'
              and status['promoted_head']
          )
          (d/'AUTHORITATIVE_STATUS.json').write_text(json.dumps(status,indent=2))
          lines=[
              f"authoritative_complete={str(status['authoritative_complete']).lower()}",
              f"gate_exit_code={status['gate_exit_code']}",
              f"stage={status.get('stage')}",
              f"marker_exists={str(status['marker_exists']).lower()}",
              f"promoted_head={status['promoted_head']}",
          ]
          result=status.get('result')
          if result:
              lines.append(f"failing_module={result.get('module')}")
              lines.append(f"failing_exit_code={result.get('exit_code')}")
              lines.append(f"failing_error_headers={result.get('error_headers')}")
          (d/'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat "${d}/AUTHORITATIVE_STATUS.txt"

      - name: Commit final-gate evidence to isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa391-final-gate/AUTHORITATIVE_STATUS.json \
                  build-logs/fa391-final-gate/AUTHORITATIVE_STATUS.txt
          for path in build-logs/fa391-final-gate/ALL_REQUIRED_TARGETS_2X_PASS \
                      build-logs/fa391-final-gate/FINAL_STATUS.json \
                      build-logs/fa391-final-gate/FINAL_STATUS.txt \
                      build-logs/fa391-final-gate/forbidden-token-audit.json \
                      build-logs/fa391-final-gate/promotion.txt; do
            test -f "${path}" && git add "${path}"
          done
          git diff --cached --quiet && exit 0
          git commit -m 'ci: record independent FA Mock3 QYM final gate'
          git push origin HEAD:fix/fa391-final-gate-20260809

      - name: Upload independent final-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa391-independent-final-gate-${{ github.sha }}
          path: |
            build-logs/fa391-final-gate
            /tmp/pr9-final-gate-console.log
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Enforce actual independent PASS
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
          PROMOTED_HEAD: ${{ steps.promote.outputs.promoted_head }}
        run: |
          test "${GATE_EXIT_CODE}" = '0'
          test -n "${PROMOTED_HEAD}"
          test -f build-logs/fa391-final-gate/ALL_REQUIRED_TARGETS_2X_PASS
