name: PR9 publish adaptive PASS 320 status

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'build-logs/pr9-adaptive-post320-status.txt'
      - '.github/workflows/pr9-publish-adaptive-status.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR9 status
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 1

      - name: Publish exact status without merging
        shell: bash
        run: |
          set -euo pipefail
          status='build-logs/pr9-adaptive-post320-status.txt'
          test -s "${status}"
          conclusion="$(sed -n 's/^conclusion=//p' "${status}" | head -1)"
          test "${conclusion}" = success -o "${conclusion}" = failure

          current="$(gh api "/repos/${GITHUB_REPOSITORY}/pulls/9")"
          merged="$(jq -r '.merged' <<<"${current}")"
          state="$(jq -r '.state' <<<"${current}")"
          draft="$(jq -r '.draft' <<<"${current}")"
          test "${merged}" = false
          test "${state}" = open
          test "${draft}" = true

          if [[ "${conclusion}" = success ]]; then
            title='PASS: PR9 exact PASS 320 FA → Integrated → QYM verification'
          else
            title='WIP: PR9 PASS 320 FA/QYM repair — remaining compiler errors recorded'
          fi

          body='/tmp/pr9-status-body.md'
          {
            echo '## Purpose'
            echo
            echo 'Temporary verification PR against `fix/primality-sheaf-clean-build`. It remains **draft and unmerged**.'
            echo
            echo '## Authority'
            echo
            echo '- PASS 320 run: `31159696948`'
            echo '- PASS 320 job: `92827136991`'
            echo '- No older run is used as the repair authority.'
            echo
            echo '## Current verified result'
            echo
            echo "- Conclusion: **${conclusion}**"
            echo '- Required order: `Mock2` → `Mock2_Advanced` → `Mock2_FunctionalAnalysis` ×2 → `Mock2_FunctionalAnalysis_Integrated` ×2 → `QYM` ×2.'
            echo '- Forbidden-token audit: `sorry`, `admit`, new global `axiom`, `unsafe`, `native_decide`, and `Lean.ofReduceBool` are rejected.'
            echo
            echo '## Machine record'
            echo
            echo '```text'
            sed -n '1,260p' "${status}"
            echo '```'
            echo
            echo 'This PR must not be merged. A verified source is transferred back to PR #7 only after the complete chain succeeds.'
          } > "${body}"

          gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/pulls/9" \
            -f title="${title}" -F body=@"${body}" >/dev/null
