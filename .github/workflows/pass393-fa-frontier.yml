name: PASS 393 restore global scopes and ordered verification

on:
  push:
    branches: [fix/fa393-restore-global-scopes-20260809]
    paths:
      - '.github/workflows/pass393-fa-frontier.yml'
      - 'scripts/apply_three_hundred_ninety_third_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass393-fa-frontier
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout PASS 393 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1050
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          mkdir -p /tmp/pass393/{logs,source} /tmp/pass392

      - name: Apply PASS 393 global-scope repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/apply_three_hundred_ninety_third_pass_functional_analysis_repairs.py \
            | tee /tmp/pass393/logs/apply-pass393.log
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '75815d2006a9ef958f6833ac47eec907760b0b16ad6f15e03c21fa6b63285904'

      - name: Compile mandatory chain
        id: verify
        shell: bash
        run: |
          set +e
          PASS392_EVIDENCE=/tmp/pass393 bash scripts/ci_pass392_verify.sh
          rc=$?
          set -e
          if [[ -f /tmp/pass392/forbidden-token-audit.json ]]; then
            cp /tmp/pass392/forbidden-token-audit.json /tmp/pass393/
          fi
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Materialize PASS 393 source and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/pass393-aggregate
          cp /tmp/pass393/*.txt /tmp/pass393/*.csv /tmp/pass393/*.json \
            build-logs/pass393-aggregate/ 2>/dev/null || true
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          source=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rows=[]
          p=Path('/tmp/pass393/compile-summary.csv')
          if p.exists(): rows=list(csv.DictReader(p.open()))
          status=Path('/tmp/pass393/final-status.txt').read_text().strip() if Path('/tmp/pass393/final-status.txt').exists() else 'missing'
          complete=bool(rows) and 'exit_code=0' in status and all(
              r['exit_code']=='0' and r['error_count']=='0' for r in rows)
          data={'complete':complete,'status':status,
                'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                'compile_rows':rows}
          Path('build-logs/pass393-aggregate/AUTHORITATIVE_STATUS.json').write_text(
              json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/pass393-aggregate
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): materialize PASS393 global-scope result'
            git push origin HEAD:fix/fa393-restore-global-scopes-20260809
          fi

      - name: Upload PASS 393 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass393-fa-frontier-${{ github.sha }}
          path: /tmp/pass393
          if-no-files-found: error
          retention-days: 90

      - name: Enforce result
        if: always()
        shell: bash
        env:
          FINAL_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "${FINAL_EXIT}"
