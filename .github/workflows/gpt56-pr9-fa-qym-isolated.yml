name: GPT-5.6 isolated PASS 337 FA Integrated QYM gate

on:
  push:
    branches: [fix/pr9-fa-gpt56-isolated-20260808]
    paths:
      - '.github/workflows/gpt56-pr9-fa-qym-isolated.yml'
      - 'scripts/gpt56_isolated_pass336_gate.sh'
      - 'scripts/gpt56_isolated_pass337_gate.sh'
      - 'scripts/apply_three_hundred_thirty_sixth_pass_functional_analysis_repairs.py'
      - 'scripts/apply_three_hundred_thirty_seventh_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: gpt56-pr9-fa-qym-isolated
  cancel-in-progress: true

jobs:
  verify:
    runs-on: macos-15
    timeout-minutes: 360
    steps:
      - name: Checkout exact isolated head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 160
          persist-credentials: true

      - name: Install coreutils, pinned Lean, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          brew list coreutils >/dev/null 2>&1 || brew install coreutils
          echo "$(brew --prefix coreutils)/libexec/gnubin" >> "${GITHUB_PATH}"
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${PATH}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          sha256sum --version | head -1
          lake exe cache get

      - name: Reconstruct PASS 337 and verify FA Integrated QYM
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="$(brew --prefix coreutils)/libexec/gnubin:${HOME}/.elan/bin:${PATH}"
          bash scripts/gpt56_isolated_pass337_gate.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload complete isolated evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt56-pass337-fa-integrated-qym-${{ github.sha }}
          path: /tmp/gpt56-pass337-gate
          if-no-files-found: error
          retention-days: 90

      - name: Publish concise result to isolated branch
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          report='build-logs/gpt56-pass337-latest.txt'
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tested_sha=${GITHUB_SHA}"
            echo "gate_exit_code=${GATE_EXIT_CODE:-missing}"
            echo "utc=$(date -u +%FT%TZ)"
            echo
            if [[ -f /tmp/gpt56-pass337-gate/status.txt ]]; then
              cat /tmp/gpt56-pass337-gate/status.txt
            else
              echo 'status file missing'
            fi
            echo
            echo '--- compile summary ---'
            if [[ -f /tmp/gpt56-pass337-gate/compile-summary.csv ]]; then
              cat /tmp/gpt56-pass337-gate/compile-summary.csv
            fi
            echo
            echo '--- candidate hash ---'
            if [[ -f /tmp/gpt56-pass337-gate/candidate-sha256.txt ]]; then
              cat /tmp/gpt56-pass337-gate/candidate-sha256.txt
            fi
            echo
            echo '--- first failure context ---'
            failure=''
            for candidate in \
              /tmp/gpt56-pass337-gate/FA-failure-context.txt \
              /tmp/gpt56-pass337-gate/Integrated-failure-context.txt \
              /tmp/gpt56-pass337-gate/QYM-failure-context.txt \
              /tmp/gpt56-pass337-gate/Advanced-failure-context.txt \
              /tmp/gpt56-pass337-gate/Mock2-failure-context.txt; do
              if [[ -s "${candidate}" ]]; then
                failure="${candidate}"
                break
              fi
            done
            if [[ -n "${failure}" ]]; then
              head -260 "${failure}"
            else
              echo 'none'
            fi
          } > "${report}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${report}"
          git diff --cached --quiet || git commit -m 'ci: record isolated PASS 337 gate result'
          git push origin "HEAD:fix/pr9-fa-gpt56-isolated-20260808"

      - name: Enforce gate result
        if: always()
        shell: bash
        env:
          GATE_EXIT_CODE: ${{ steps.gate.outputs.exit_code }}
        run: |
          test -n "${GATE_EXIT_CODE:-}"
          exit "${GATE_EXIT_CODE}"
