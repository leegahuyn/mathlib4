name: Materialize Mock2 Advanced pass 311

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/materialize-primality-repairs.yml'

permissions:
  contents: write

concurrency:
  group: materialize-mock2-advanced-pass-311
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: fix/primality-sheaf-clean-build
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_CANDIDATE_SHA256: 14a217148d4bdce5e1a457d610212226ae386d923720dd610da39eabb2eca26a
      LOGDIR: build-logs/Mock2_Advanced-materialization

    steps:
      - name: Checkout exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Verify branch and starting source
        shell: bash
        run: |
          set -euo pipefail
          test "${GITHUB_REF_NAME}" = "${BRANCH}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          actual_blob="$(git hash-object "${TARGET}")"
          echo "starting blob: ${actual_blob}"
          test "${actual_blob}" = "${EXPECTED_START_BLOB}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' \
            "trigger_sha=${GITHUB_SHA}" \
            "starting_blob=${actual_blob}" \
            > "${LOGDIR}/snapshot.txt"

      - name: Apply pass 289 through pass 311 candidate repairs
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
            python3 scripts/apply_three_hundredth_pass_repairs.py
            python3 scripts/apply_three_hundred_ninth_pass_repairs.py
            python3 scripts/apply_three_hundred_tenth_pass_repairs.py
            python3 scripts/apply_three_hundred_eleventh_pass_repairs.py
          } 2>&1 | tee "${LOGDIR}/repair-application.log"

          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)

          changed="$(git diff --name-only)"
          printf 'changed paths after isolation:\n%s\n' "${changed}"
          test "${changed}" = "${TARGET}"
          git diff --check

          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          actual_lines="$(wc -l < "${TARGET}")"
          echo "candidate sha256: ${actual_sha}"
          echo "candidate lines: ${actual_lines}"
          test "${actual_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          printf '%s\n' \
            "candidate_sha256=${actual_sha}" \
            "candidate_lines=${actual_lines}" \
            >> "${LOGDIR}/snapshot.txt"
          cp "${TARGET}" "${LOGDIR}/candidate-source.lean"

      - name: Static forbidden-token gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          path = Path("PrimalitySheafVerification/Mock2_Advanced.lean")
          src = path.read_text(encoding="utf-8")
          out = []
          i = 0
          block_depth = 0
          in_string = False
          escaped = False
          while i < len(src):
              if block_depth:
                  if src.startswith("/-", i):
                      block_depth += 1
                      out.extend("  ")
                      i += 2
                  elif src.startswith("-/", i):
                      block_depth -= 1
                      out.extend("  ")
                      i += 2
                  else:
                      out.append("\n" if src[i] == "\n" else " ")
                      i += 1
                  continue
              if in_string:
                  ch = src[i]
                  out.append("\n" if ch == "\n" else " ")
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  i += 1
                  continue
              if src.startswith("/-", i):
                  block_depth = 1
                  out.extend("  ")
                  i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n":
                      out.append(" ")
                      i += 1
              elif src[i] == '"':
                  in_string = True
                  out.append(" ")
                  i += 1
              else:
                  out.append(src[i])
                  i += 1

          code = "".join(out)
          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
              "placeholder": r"\bplaceholder\b",
              "TODO/FIXME": r"\b(?:TODO|FIXME)\b",
          }
          bad = False
          for name, pattern in checks.items():
              matches = list(re.finditer(pattern, code))
              print(f"{name}: {len(matches)}")
              bad |= bool(matches)
          if block_depth or in_string:
              raise SystemExit("unterminated comment or string in scanner")
          if bad:
              raise SystemExit("forbidden executable token detected")
          PY

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile candidate twice from deleted project artifacts
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}" "${LOGDIR}"
          : > "${LOGDIR}/Mock2_Advanced.log"

          for pass in 1 2; do
            rm -f \
              "${outdir}/Mock2_Advanced.olean" \
              "${outdir}/Mock2_Advanced.ilean" \
              "${outdir}/Mock2_Advanced.olean.private"
            echo "===== candidate clean compile ${pass}/2 =====" \
              | tee -a "${LOGDIR}/Mock2_Advanced.log"
            set +e
            lake env lean "${TARGET}" \
              -o "${outdir}/Mock2_Advanced.olean" \
              -i "${outdir}/Mock2_Advanced.ilean" 2>&1 \
              | tee "${LOGDIR}/Mock2_Advanced-pass${pass}.log" \
              | tee -a "${LOGDIR}/Mock2_Advanced.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "${code}" > "${LOGDIR}/exit-code-pass${pass}.txt"
            test "${code}" -eq 0
            test -s "${outdir}/Mock2_Advanced.olean"
            test -s "${outdir}/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
          done

          sha256sum \
            "${TARGET}" \
            "${outdir}/Mock2_Advanced.olean" \
            "${outdir}/Mock2_Advanced.ilean" \
            > "${LOGDIR}/sha256.txt"
          cp "${outdir}/Mock2_Advanced.olean" "${LOGDIR}/Mock2_Advanced.olean"
          cp "${outdir}/Mock2_Advanced.ilean" "${LOGDIR}/Mock2_Advanced.ilean"
          echo 0 > "${LOGDIR}/exit-code.txt"
          grep -c 'warning:' "${LOGDIR}/Mock2_Advanced-pass2.log" \
            > "${LOGDIR}/warning-count.txt" || true

      - name: Commit only the verified candidate when branch head is unchanged
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger head: ${GITHUB_SHA}"
          echo "remote head:  ${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

          test "$(git diff --name-only)" = "${TARGET}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m 'fix: materialize Mock2 Advanced pass 311 candidate'
          git push origin "HEAD:${BRANCH}"

      - name: Upload verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-advanced-pass311-materialization
          path: build-logs/Mock2_Advanced-materialization
          if-no-files-found: warn
          retention-days: 30
