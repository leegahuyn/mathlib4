name: Codex FA503 joint basepoint Complex.mk direct Lean

on:
  push:
    branches:
      - fix/fa503-joint-basepoint-complex-mk-20260811
    paths:
      - .github/workflows/codex-fa503-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-fa503-observe
  cancel-in-progress: true

env:
  FA_COMPILE_MAX_ERRORS: "32"

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA503 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA503 direct Lean started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA502 -> FA503\`\n- upstream_FA502_run: \`31472717984\`\n- upstream_FA502_job: \`93719392970\`\n- upstream_FA502_source: \`db38b9ffb4820e5f7b91816173d635461cd559ff74a36cc69f4c2e5e3034faf3\`\n- frontier: \`35912:8 selectedHeightBasePoint_joint_continuousOn_positive / index 2831\`\n- patch: \`Complex.mk_eq_add_mul_I + explicit pair-map Continuous proof\`\n- maxErrors: \`32\`\n- theorem statements: \`preserved\`\n- line-count lock: \`disabled for FA503+\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA503 candidate direct Lean
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa503_joint_basepoint_complex_mk_candidate_ci.sh 2>&1 | tee /tmp/fa503.log
          code=${PIPESTATUS[0]}
          set -e
          echo "script_exit=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report FA503 evidence and 32-error lookahead
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.script_exit }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/fa503.md
          from pathlib import Path
          import json, os, re

          root=Path('build-logs/codex-fa503-joint-basepoint-complex-mk')
          p=root/'candidates/norms/METRIC.json'
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          outer=Path('/tmp/fa503.log')
          xs=['## FA503 actual direct Lean','',
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",
              f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`"]
          m=None
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['classification','source_sha256','line_count','maxErrors_cap','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_error_headers_captured','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                  xs.append(f'- {k}: `{m.get(k)}`')
              xs += ['', '### first error','```text',str(m.get('FA_first_error_message',''))[:7000],'```']
          else:
              xs.append('- METRIC.json: `MISSING`')

          # Search both outer stdout and every textual candidate log for all FA locations.
          texts=[]
          if outer.exists():
              texts.append(('outer', outer.read_text(encoding='utf-8',errors='replace')))
          if root.exists():
              for f in root.rglob('*'):
                  try:
                      if f.is_file() and f.stat().st_size <= 50_000_000 and f.suffix.lower() not in {'.olean','.ilean','.zip'}:
                          texts.append((str(f), f.read_text(encoding='utf-8',errors='replace')))
                  except Exception:
                      pass
          pat=re.compile(r'[^\n]*Mock2_FunctionalAnalysis\.lean:(\d+):(\d+)[^\n]*')
          seen=set(); hits=[]
          for name,text in texts:
              for mm in pat.finditer(text):
                  line=mm.group(0).strip()
                  key=(mm.group(1),mm.group(2),line)
                  if key not in seen:
                      seen.add(key); hits.append((int(mm.group(1)),int(mm.group(2)),name,line))
          hits.sort(key=lambda x:(x[0],x[1]))
          if hits:
              xs += ['', '### all captured FA locations','```text']
              xs += [f'{ln}:{col} [{name}] {line}' for ln,col,name,line in hits[:64]]
              xs += ['```']

          if src.exists() and isinstance(m,dict) and m.get('FA_first_actual_error_line',0):
              a=src.read_text(encoding='utf-8',errors='replace').splitlines()
              c=int(m['FA_first_actual_error_line']); lo=max(1,c-16); hi=min(len(a),c+55)
              xs += ['',f'### candidate source around line {c}','```lean',
                     '\n'.join(f'{i}: {a[i-1]}' for i in range(lo,hi+1)),'```']
          print('\n'.join(xs)[:60000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa503.md)"

      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, sys
          p=Path('build-logs/codex-fa503-joint-basepoint-complex-mk/candidates/norms/METRIC.json')
          if not p.exists():
              raise SystemExit(2)
          m=json.loads(p.read_text())
          raise SystemExit(int(m.get('FA_exit', 2)))
          PY
