name: FA425j root-instance plus paired-call direct candidate

on:
  push:
    branches:
      - fix/fa425j-root-instance-paired-20260810
    paths:
      - fa425j-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  resolve-test-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      EXPECTED_SHA_31725: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
      EXPECTED_SHA_31726: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      PASS423_RUN_ID: '31317392557'
      PASS376_ARTIFACT_ID: '9024606745'
      SOURCE_PATH: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      ACTIVE_BRANCH: fix/fa425j-root-instance-paired-20260810

    steps:
      - name: Checkout FA425j controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa425j-root-instance-paired-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Resolve latest direct-verified champion
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fa425b_resolve_verified_champion.sh

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa425-lean-version.txt
          lake --version | tee /tmp/fa425-lake-version.txt
          lake exe cache get | tee /tmp/fa425-cache-get.log

      - name: Run the single fixed-height cumulative candidate
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          cp scripts/fa425j_root_instance_paired_candidate.py scripts/fa425_strict_theorem_tournament.py
          python3 scripts/fa425_run_strict_controller.py
          d=build-logs/fa425-strict-theorem-tournament
          cp /tmp/fa425-resolution.txt "$d/RESOLUTION.txt"
          cp /tmp/fa425-lean-version.txt "$d/lean-version.txt"
          cp /tmp/fa425-lake-version.txt "$d/lake-version.txt"
          cp /tmp/fa425-cache-get.log "$d/cache-get.log"
          mv "$d" build-logs/fa425j-root-instance-paired

      - name: Persist only source-matched direct-verified evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHOULD_COMMIT: ${{ steps.controller.outputs.source_should_commit }}
          STRICT_PROMOTION: ${{ steps.controller.outputs.strict_promotion }}
          FA_TRUE_PASS: ${{ steps.controller.outputs.fa_true_pass }}
          ALL_CHAIN_PASS: ${{ steps.controller.outputs.all_chain_pass }}
        run: |
          set -euo pipefail
          d=build-logs/fa425j-root-instance-paired
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p verified-records/fa425j
          cp "$d/CURRENT.json" verified-records/fa425j/CURRENT.json
          cp "$d/CURRENT.txt" verified-records/fa425j/CURRENT.txt
          cp "$d/BASELINE.json" verified-records/fa425j/BASELINE.json
          cp "$d/BASELINE_FIRST_ERROR_CONTEXT.txt" verified-records/fa425j/BASELINE_FIRST_ERROR_CONTEXT.txt
          test ! -f "$d/PROMOTED_FIRST_ERROR_CONTEXT.txt" || cp "$d/PROMOTED_FIRST_ERROR_CONTEXT.txt" verified-records/fa425j/PROMOTED_FIRST_ERROR_CONTEXT.txt
          test ! -f "$d/TOURNAMENT.json" || cp "$d/TOURNAMENT.json" verified-records/fa425j/TOURNAMENT.json
          test ! -f "$d/PROMOTION_REVERIFY.json" || cp "$d/PROMOTION_REVERIFY.json" verified-records/fa425j/PROMOTION_REVERIFY.json

          if test "${SOURCE_SHOULD_COMMIT:-false}" = true; then
            git add "$SOURCE_PATH" verified-records/fa425j
            if test "${ALL_CHAIN_PASS:-false}" = true; then
              msg='fix: FA425j ordered FA Integrated Mock3 QYM x2 PASS [skip ci]'
            elif test "${FA_TRUE_PASS:-false}" = true; then
              msg='fix: FA425j FunctionalAnalysis TRUE PASS x2 audit clean [skip ci]'
            elif test "${STRICT_PROMOTION:-false}" = true; then
              first=$(python3 -c "import json; d=json.load(open('$d/CURRENT.json')); print(d['promotion']['reverify_run2']['first_error_line'])")
              msg="fix: promote FA425j cumulative frontier to ${first} [skip ci]"
            else
              msg='chore: materialize latest direct-verified FA champion [skip ci]'
            fi
          else
            git restore "$SOURCE_PATH"
            git add verified-records/fa425j
            msg='evidence: retain verified FA champion after FA425j candidate [skip ci]'
          fi

          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload FA425j evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa425j-root-instance-paired-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa425j-root-instance-paired
          if-no-files-found: error
          retention-days: 90

      - name: Classify controller result
        if: always()
        env:
          CONTROLLER_SUCCESS: ${{ steps.controller.outputs.controller_success }}
        shell: bash
        run: test "${CONTROLLER_SUCCESS:-false}" = true
