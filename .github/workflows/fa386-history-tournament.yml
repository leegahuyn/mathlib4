name: PASS 386 historical FA source tournament

on:
  push:
    branches:
      - fix/fa386-history-tournament-20260809
    paths:
      - '.github/workflows/fa386-history-tournament.yml'
      - 'scripts/fa386_history_tournament.py'
      - 'scripts/fa383_select_and_verify.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

jobs:
  tournament-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 386 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa386-history-tournament-20260809
          fetch-depth: 2200
          persist-credentials: true

      - name: Fetch all historical FA repair branches
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --prune origin \
            '+refs/heads/fix/fa*:refs/remotes/origin/fix/fa*'
          git for-each-ref --sort=-committerdate \
            --format='%(refname) %(objectname)' \
            'refs/remotes/origin/fix/fa*' \
            > /tmp/fa386-remote-refs.txt
          head -120 /tmp/fa386-remote-refs.txt

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Compile historical source tournament
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/fa386-tournament
          mkdir -p /tmp/fa386-tournament
          cp /tmp/fa386-remote-refs.txt /tmp/fa386-tournament/remote-refs.txt
          python3 scripts/fa386_history_tournament.py \
            --output-dir /tmp/fa386-tournament \
            --max-refs 100 \
            --max-candidates 100 \
            --workers 2 \
            > /tmp/fa386-tournament/console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa386-tournament/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Select tournament winner and verify required order
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA383_VERIFY_MODELS: 'openai/gpt-5,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411,meta/Llama-4-Scout-17B-16E-Instruct,microsoft/Phi-4'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa386-aggregate
          mkdir -p build-logs/fa386-aggregate
          python3 scripts/fa383_select_and_verify.py \
            --candidates-root /tmp/fa386-tournament \
            --evidence-dir build-logs/fa386-aggregate \
            > build-logs/fa386-aggregate/console.log 2>&1
          rc=$?
          set -e
          cat build-logs/fa386-aggregate/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build authoritative PASS 386 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa386-aggregate
          cp /tmp/fa386-tournament/best-metric.json "${d}/tournament-best-metric.json" 2>/dev/null || true
          cp /tmp/fa386-tournament/state.json "${d}/tournament-state.json" 2>/dev/null || true
          cp /tmp/fa386-tournament/tournament-results.json "${d}/tournament-results.json" 2>/dev/null || true
          cp /tmp/fa386-tournament/candidate-manifest.json "${d}/candidate-manifest.json" 2>/dev/null || true
          cp /tmp/fa386-tournament/remote-refs.txt "${d}/remote-refs.txt" 2>/dev/null || true
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('build-logs/fa386-aggregate');p=d/'FINAL_STATUS.json'
          s=json.loads(p.read_text()) if p.exists() else {'complete':False,'stage':'missing-final-status'}
          marker=(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists();s['tournament_exit_code']='${{ steps.tournament.outputs.exit_code }}';s['verify_exit_code']='${{ steps.verify.outputs.exit_code }}';s['marker_exists']=marker;s['authoritative_complete']=bool(s.get('complete') and marker and s['verify_exit_code']=='0')
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          s['sources']={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in targets if x.exists()}
          (d/'AUTHORITATIVE_STATUS.json').write_text(json.dumps(s,indent=2))
          lines=[f"authoritative_complete={str(s['authoritative_complete']).lower()}",f"tournament_exit_code={s['tournament_exit_code']}",f"verify_exit_code={s['verify_exit_code']}",f"stage={s.get('stage')}",f"marker_exists={str(marker).lower()}"]
          if s.get('metric') is not None:lines.append(f"metric={json.dumps(s['metric'],sort_keys=True)}")
          for m in s.get('modules',[]):lines.append(f"{m.get('module')}={m.get('status')} sha256={m.get('source_sha256')}")
          (d/'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat "${d}/AUTHORITATIVE_STATUS.txt"

      - name: Audit target sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*(?:public\s+)?axiom\b','unsafe':r'(?m)^\s*unsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          def strip(t):
            o=[];i=0;d=0;s=False;e=False
            while i<len(t):
              if d:
                if t.startswith('/-',i):d+=1;o.extend('  ');i+=2;continue
                if t.startswith('-/',i):d-=1;o.extend('  ');i+=2;continue
                o.append('\n' if t[i]=='\n' else ' ');i+=1;continue
              if s:
                c=t[i];o.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1;continue
              if t.startswith('/-',i):d=1;o.extend('  ');i+=2;continue
              if t.startswith('--',i):
                while i<len(t) and t[i]!='\n':o.append(' ');i+=1
                continue
              if t[i]=='"':s=True;o.append(' ');i+=1;continue
              o.append(t[i]);i+=1
            return ''.join(o)
          report={}
          for p in targets:
            if p.exists():
              c=strip(p.read_text());report[str(p)]={k:len(re.findall(v,c)) for k,v in pats.items()}
          Path('build-logs/fa386-aggregate/FORBIDDEN_TOKEN_AUDIT.json').write_text(json.dumps(report,indent=2));bad={p:c for p,c in report.items() if any(c.values())}
          if bad:raise SystemExit(bad)
          PY

      - name: Commit tournament winner or verified sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean;do test -e "${p}"&&git add "${p}";done
          git add build-logs/fa386-aggregate/AUTHORITATIVE_STATUS.json build-logs/fa386-aggregate/AUTHORITATIVE_STATUS.txt build-logs/fa386-aggregate/FORBIDDEN_TOKEN_AUDIT.json
          for p in build-logs/fa386-aggregate/ALL_REQUIRED_TARGETS_2X_PASS build-logs/fa386-aggregate/FINAL_STATUS.json build-logs/fa386-aggregate/fa-selection.json build-logs/fa386-aggregate/tournament-best-metric.json build-logs/fa386-aggregate/tournament-state.json;do test -f "${p}"&&git add "${p}";done
          git diff --cached --quiet&&exit 0
          if test -f build-logs/fa386-aggregate/ALL_REQUIRED_TARGETS_2X_PASS;then msg='fix: verify historical FA winner and downstream twice';else msg='fix: preserve best historical FA candidate';fi
          git commit -m "${msg}";git push origin HEAD:fix/fa386-history-tournament-20260809

      - name: Upload PASS 386 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa386-history-tournament-${{ github.sha }}
          path: |
            /tmp/fa386-tournament
            build-logs/fa386-aggregate
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final PASS 386 result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${VERIFY_EXIT_CODE:-}"
          test -f build-logs/fa386-aggregate/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${VERIFY_EXIT_CODE}"
