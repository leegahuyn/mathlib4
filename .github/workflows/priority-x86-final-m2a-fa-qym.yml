name: Final x86 Mock2 Advanced FunctionalAnalysis QYM chain

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-x86-final-m2a-fa-qym.yml'
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: read

concurrency:
  group: priority-x86-final-m2a-fa-qym
  cancel-in-progress: true

jobs:
  complete-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      RESULT: build-logs/priority-stage3-qym-result.txt

    steps:
      - name: Clone latest branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Complete Advanced stage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage1_advanced.sh

      - name: Refresh after Advanced
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          rm -rf "${OUTDIR}"; mkdir -p "${OUTDIR}"

      - name: Complete FunctionalAnalysis stage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage2_fa.sh

      - name: Refresh after FunctionalAnalysis
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          rm -rf "${OUTDIR}"; mkdir -p "${OUTDIR}"

      - name: Complete final direct QYM stage
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage3_qym.sh

      - name: Validate and report final result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          test -s "${RESULT}"
          grep -Fxq 'status=PASS' "${RESULT}"
          grep -Fxq 'runtime_repair_scripts=0' "${RESULT}"
          grep -Fxq 'Mock2_Advanced=PASS' "${RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis=PASS' "${RESULT}"
          grep -Fxq 'Mock2_FunctionalAnalysis_Integrated=PASS' "${RESULT}"
          grep -Fxq 'QYM=PASS' "${RESULT}"
          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM; do
            grep -Eq "^${module},pass1,0,0," "${RESULT}"
            grep -Eq "^${module},pass2,0,0," "${RESULT}"
          done
          python3 - <<'PY' > /tmp/comment.json
          import json
          from pathlib import Path
          t=Path('build-logs/priority-stage3-qym-result.txt').read_text(encoding='utf-8')
          head=next(x.split('=',1)[1] for x in t.splitlines() if x.startswith('verified_source_head='))
          rows='\n'.join(x for x in t.splitlines() if x.startswith(('Mock2,pass','Mock2_Advanced,pass','Mock2_FunctionalAnalysis,pass','Mock2_FunctionalAnalysis_Integrated,pass','QYM,pass')))
          print(json.dumps({'body': f'''## Final x86 priority verification PASS

Verified source head: `{head}`

- `Mock2_Advanced`: PASS twice
- `Mock2_FunctionalAnalysis`: PASS twice
- `Mock2_FunctionalAnalysis_Integrated`: PASS twice
- `QYM` / Mock3: PASS twice
- Runtime repair during final direct verification: `0`

```text
{rows}
```
'''}))
          PY
          curl --fail --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/issues/7/comments" \
            --data-binary @/tmp/comment.json
