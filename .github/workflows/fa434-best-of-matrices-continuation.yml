name: FA434 best-of verified matrices continuation and ordered gate

on:
  push:
    branches:
      - fix/fa434-best-of-matrices-continuation-20260810
    paths:
      - scripts/fa434_select_best_matrix_source.py
      - .github/workflows/fa434-best-of-matrices-continuation.yml
      - build-logs/fa434-best-of-matrices/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa434-best-of-matrices-continuation
  cancel-in-progress: false

jobs:
  select-upstream:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    outputs:
      branch: ${{ steps.wait.outputs.branch }}
      commit: ${{ steps.wait.outputs.commit }}
      source_sha: ${{ steps.wait.outputs.source_sha }}
      fa_exit: ${{ steps.wait.outputs.fa_exit }}
      first_line: ${{ steps.wait.outputs.first_line }}
      first_col: ${{ steps.wait.outputs.first_col }}
    steps:
      - name: Checkout FA434 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa434-best-of-matrices-continuation-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Poll verified FA427 FA428 FA432 checked-in results and select best
        id: wait
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa434-best-of-matrices
          first_valid_attempt=0
          selected=false
          for attempt in $(seq 1 300); do
            python3 scripts/fa434_select_best_matrix_source.py \
              > /tmp/fa434-best-of-matrices/poll-${attempt}.log 2>&1 || true
            cat /tmp/fa434-best-of-matrices/poll-${attempt}.log
            count=0
            passed=false
            if test -f /tmp/fa434-best-of-matrices/POLL.json; then
              count=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json')).get('valid_candidate_count',0))")
              passed=$(python3 -c "import json; d=json.load(open('/tmp/fa434-best-of-matrices/POLL.json')); print(str(bool(d.get('best',{}).get('fa_exit')==0)).lower())")
            fi
            if test "$count" -gt 0 && test "$first_valid_attempt" -eq 0; then
              first_valid_attempt=$attempt
            fi
            grace_complete=false
            if test "$first_valid_attempt" -gt 0 && test $((attempt-first_valid_attempt)) -ge 20; then
              grace_complete=true
            fi
            if test "$passed" = true || test "$count" -ge 3 || \
               { test "$count" -gt 0 && test "$grace_complete" = true; }; then
              branch=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['branch'])")
              commit=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['commit'])")
              source_sha=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['source_sha256'])")
              fa_exit=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['fa_exit'])")
              first_line=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['first_error_line'])")
              first_col=$(python3 -c "import json; print(json.load(open('/tmp/fa434-best-of-matrices/POLL.json'))['best']['first_error_col'])")
              {
                echo "branch=$branch"
                echo "commit=$commit"
                echo "source_sha=$source_sha"
                echo "fa_exit=$fa_exit"
                echo "first_line=$first_line"
                echo "first_col=$first_col"
              } >> "$GITHUB_OUTPUT"
              selected=true
              break
            fi
            sleep 60
          done
          test "$selected" = true

      - name: Upload upstream selection provenance
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa434-upstream-selection-${{ github.run_id }}
          path: /tmp/fa434-best-of-matrices
          if-no-files-found: warn
          retention-days: 30

  continue-mine-and-gate:
    needs: select-upstream
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      ACTIVE_BRANCH: fix/fa434-best-of-matrices-continuation-20260810
      UPSTREAM_BRANCH: ${{ needs.select-upstream.outputs.branch }}
      UPSTREAM_COMMIT: ${{ needs.select-upstream.outputs.commit }}
      UPSTREAM_SHA: ${{ needs.select-upstream.outputs.source_sha }}
      UPSTREAM_FA_EXIT: ${{ needs.select-upstream.outputs.fa_exit }}
      UPSTREAM_FIRST_LINE: ${{ needs.select-upstream.outputs.first_line }}
      UPSTREAM_FIRST_COL: ${{ needs.select-upstream.outputs.first_col }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      FA426_MAX_CANDIDATES: '52'
      FA426_MAX_PROMOTIONS: '10'
      FA426_TIME_BUDGET_SECONDS: '19000'
    steps:
      - name: Checkout exact FA434 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa434-best-of-matrices-continuation-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Materialize exact selected upstream source and direct-evidence compatibility
        shell: bash
        run: |
          set -euo pipefail
          test -n "$UPSTREAM_BRANCH"
          git fetch --force origin \
            "refs/heads/${UPSTREAM_BRANCH}:refs/remotes/origin/${UPSTREAM_BRANCH}" \
            --depth=40
          ref="refs/remotes/origin/${UPSTREAM_BRANCH}"
          test "$(git rev-parse "$ref")" = "$UPSTREAM_COMMIT"
          mkdir -p build-logs/fa434-best-of-matrices/input \
                   build-logs/fa426-monotone-donor-proof-miner
          git show "$ref:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            > PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$UPSTREAM_SHA"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa434-best-of-matrices/input/Mock2_FunctionalAnalysis.lean
          printf '%s\n' "$UPSTREAM_BRANCH" > build-logs/fa434-best-of-matrices/input/branch.txt
          printf '%s\n' "$UPSTREAM_COMMIT" > build-logs/fa434-best-of-matrices/input/commit.txt
          printf '%s\n' "$UPSTREAM_SHA" > build-logs/fa434-best-of-matrices/input/source-sha256.txt
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          status={
              'classification':'VERIFIED',
              'authority':'direct Lean CLI',
              'promoted':True,
              'selected':{
                  'source_sha256':os.environ['UPSTREAM_SHA'],
                  'exit_code':int(os.environ['UPSTREAM_FA_EXIT']),
                  'first_error_line':int(os.environ['UPSTREAM_FIRST_LINE']),
                  'first_error_col':int(os.environ['UPSTREAM_FIRST_COL']),
              },
              'source':'best checked-in source/evidence identity from FA427/FA428/FA432',
              'upstream_branch':os.environ['UPSTREAM_BRANCH'],
              'upstream_commit':os.environ['UPSTREAM_COMMIT'],
          }
          Path('build-logs/fa426-monotone-donor-proof-miner/CURRENT.json').write_text(
              json.dumps(status,indent=2)+'\n',encoding='utf-8')
          Path('build-logs/fa434-best-of-matrices/input/UPSTREAM.json').write_text(
              json.dumps(status,indent=2)+'\n',encoding='utf-8')
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa434-lean-version.txt
          lake --version | tee /tmp/fa434-lake-version.txt
          lake exe cache get | tee /tmp/fa434-cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Continue monotone direct Lean donor mining from best verified matrix source
        id: miner
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa426_monotone_donor_proof_miner.py \
            > /tmp/fa434-console.log 2>&1
          rc=$?
          cat /tmp/fa434-console.log
          d=build-logs/fa426-monotone-donor-proof-miner
          cp /tmp/fa434-lean-version.txt "$d/fa434-lean-version.txt" 2>/dev/null || true
          cp /tmp/fa434-lake-version.txt "$d/fa434-lake-version.txt" 2>/dev/null || true
          cp /tmp/fa434-cache-get.log "$d/fa434-cache-get.log" 2>/dev/null || true
          cp /tmp/fa434-console.log "$d/fa434-console.log" 2>/dev/null || true
          if test -f "$d/CURRENT.json"; then
            selected_sha=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('source_sha256',''))")
            fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('exit_code',999))")
            first_line=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_line',0))")
            first_col=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json')).get('selected',{}).get('first_error_col',0))")
            strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          else
            selected_sha=''; fa_exit=999; first_line=0; first_col=0; strict=false
          fi
          {
            echo "script_rc=$rc"
            echo "selected_sha=$selected_sha"
            echo "fa_exit=$fa_exit"
            echo "first_line=$first_line"
            echo "first_col=$first_col"
            echo "strict_promotion=$strict"
          } >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist exact selected checked-in source before final verification
        id: persist
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa426-monotone-donor-proof-miner
          test -f "$d/CURRENT.json"
          selected=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['source_sha256'])")
          fa_exit=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['exit_code'])")
          first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['selected']['first_error_line'])")
          strict=$(python3 -c "import json; print(str(json.load(open('$d/CURRENT.json')).get('strict_promotion',False)).lower())")
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$selected"
          mkdir -p build-logs/fa434-best-of-matrices/output
          cp "$d/CURRENT.json" build-logs/fa434-best-of-matrices/output/CURRENT.json
          cp "$d/CURRENT.txt" build-logs/fa434-best-of-matrices/output/CURRENT.txt
          cp "$d/FIRST_ERROR_CONTEXT.txt" build-logs/fa434-best-of-matrices/output/FIRST_ERROR_CONTEXT.txt 2>/dev/null || true
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
                  build-logs/fa426-monotone-donor-proof-miner \
                  build-logs/fa434-best-of-matrices
          if test "$fa_exit" = 0; then metric=pass; else metric="first-${first}"; fi
          if test "$strict" = true; then
            msg="fix: persist FA434 ${metric} direct-verified continuation ${selected:0:12}"
          else
            msg="fix: materialize best verified matrix source in FA434 ${selected:0:12}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$selected"
          head=$(git rev-parse HEAD)
          echo "source_commit=$head" >> "$GITHUB_OUTPUT"
          echo "selected_sha=$selected" >> "$GITHUB_OUTPUT"
          echo "fa_exit=$fa_exit" >> "$GITHUB_OUTPUT"
          echo "first_line=$first" >> "$GITHUB_OUTPUT"
          immutable="champion/fa434-${metric}-${selected:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa434-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
               --input /tmp/fa434-ref.json \
               > build-logs/fa434-best-of-matrices/output/immutable-response.json \
               2> build-logs/fa434-best-of-matrices/output/immutable-error.txt; then
            printf '%s\n' "$immutable" \
              > build-logs/fa434-best-of-matrices/output/IMMUTABLE_CHAMPION_BRANCH.txt
          fi

      - name: Directly compile identical checked-in FA source twice and audit forbidden escapes
        id: fa_gate
        if: always()
        env:
          SELECTED_SHA: ${{ steps.persist.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa434-best-of-matrices/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test -n "$SELECTED_SHA" && test "$SELECTED_SHA" = "$checked" && \
             test "$SELECTED_SHA" = "$worktree"; then identity=true; fi
          printf 'selected=%s\nchecked=%s\nworktree=%s\nidentity=%s\n' \
            "$SELECTED_SHA" "$checked" "$worktree" "$identity" \
            > "$d/source-identity.txt"
          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "$identity" = true; then
            compile_fa 1; r1=$?
            if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi
          fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text()
          out=[]; i=0; line=False; string=False; escaped=False; depth=0
          while i<len(text):
              c=text[i]; n=text[i+1] if i+1<len(text) else ''
              if line:
                  if c=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if c=='/' and n=='-': depth+=1; out+=[' ',' ']; i+=2; continue
                  if c=='-' and n=='/': depth-=1; out+=[' ',' ']; i+=2; continue
                  out.append('\n' if c=='\n' else ' '); i+=1; continue
              if string:
                  out.append('\n' if c=='\n' else ' ')
                  if escaped: escaped=False
                  elif c=='\\': escaped=True
                  elif c=='"': string=False
                  i+=1; continue
              if c=='-' and n=='-': line=True; out+=[' ',' ']; i+=2; continue
              if c=='/' and n=='-': depth=1; out+=[' ',' ']; i+=2; continue
              if c=='"': string=True; out.append(' '); i+=1; continue
              out.append(c); i+=1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'new_global_axiom':r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b',
          }
          audit={name:len(re.findall(pattern,code)) for name,pattern in patterns.items()}
          r1=int(os.environ['R1']); r2=int(os.environ['R2'])
          clean=all(value==0 for value in audit.values())
          result={
              'FA_run1_exit':r1,'FA_run2_exit':r2,
              'forbidden_audit':audit,'forbidden_clean':clean,
              'FA_TRUE_PASS':r1==0 and r2==0 and clean,'maxErrors_cap':1,
          }
          path=Path('build-logs/fa434-best-of-matrices/final-gates/FA_FINAL.json')
          path.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa434-best-of-matrices/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            targets+=(Mock2_FunctionalAnalysis_Integrated)
          else
            complete=false; echo missing > "$d/Integrated-missing.txt"
          fi
          shopt -s nullglob
          for source in PrimalitySheafVerification/Mock3*.lean; do
            targets+=("$(basename "$source" .lean)")
          done
          if test -f PrimalitySheafVerification/QYM.lean; then
            targets+=(QYM)
          else
            complete=false; echo missing > "$d/QYM-missing.txt"
          fi
          compile_one() {
            stem=$1; n=$2
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; first=$?; second=125
              if test "$first" -eq 0; then
                compile_one "$stem" 2; second=$?
              fi
              if test "$first" -ne 0 || test "$second" -ne 0; then
                complete=false
                break
              fi
            done
          fi
          if test "$complete" = true; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final checked-in evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa434-best-of-matrices \
                  build-logs/fa426-monotone-donor-proof-miner
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA434 best-source continuation and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA434 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa434-best-of-matrices-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa434-best-of-matrices
            build-logs/fa426-monotone-donor-proof-miner
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete ordered result
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
