name: PASS 394 independent PASS 389 priority repair

on:
  push:
    branches:
      - fix/fa376-final-isolated-20260809
    paths:
      - '.github/workflows/pass394-independent-pass389-repair.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: pass394-independent-pass389-repair
  cancel-in-progress: false

jobs:
  independent-repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout independent repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1000
          persist-credentials: true

      - name: Import PASS 389 repair agents from PR9
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags origin ci/fa319-isolated-20260807
          mkdir -p scripts
          for file in \
            pass389_priority_repair_agent.py \
            pass389_priority_repair_agent_v3.py; do
            git show FETCH_HEAD:scripts/${file} > scripts/${file}
          done
          python3 -m py_compile \
            scripts/pass389_priority_repair_agent.py \
            scripts/pass389_priority_repair_agent_v3.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run independent PASS 389 repair and two-pass gate
        id: repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASS389_EVIDENCE: /tmp/pass394-priority
          PASS389_CHAIN_BRANCH: fix/fa394-pass389-independent-20260809
          PASS389_PR9_BRANCH: ci/fa319-isolated-20260807
          PASS389_MODELS: openai/gpt-5-mini,openai/gpt-4.1,openai/o4-mini,deepseek/DeepSeek-V3-0324,xai/grok-3-mini
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass389_priority_repair_agent_v3.py \
            --fa-cycles 52 \
            --downstream-cycles 30 \
            2>&1 | tee /tmp/pass394-priority-driver.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          mkdir -p /tmp/pass394-priority
          cp /tmp/pass394-priority-driver.log /tmp/pass394-priority/driver.log
          cp build-logs/pass389-priority-state.json /tmp/pass394-priority/state.json 2>/dev/null || true
          cp build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json \
            /tmp/pass394-priority/final-marker.json 2>/dev/null || true
          exit 0

      - name: Upload PASS 394 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass394-independent-pass389-${{ github.sha }}
          path: /tmp/pass394-priority
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce independent result
        if: always()
        shell: bash
        env:
          REPAIR_EXIT: ${{ steps.repair.outputs.exit_code }}
        run: |
          test -n "${REPAIR_EXIT:-}"
          exit "${REPAIR_EXIT}"
