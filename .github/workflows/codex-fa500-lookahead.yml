name: Codex FA500 lookahead diagnostics

on:
  push:
    branches:
      - fix/fa500-height-basepoint-source-membership-20260811
    paths:
      - .github/workflows/codex-fa500-lookahead.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-fa500-lookahead
  cancel-in-progress: true

env:
  FA_COMPILE_MAX_ERRORS: "32"

jobs:
  lookahead:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Run identical FA500 candidate with diagnostic cap 32
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa500_height_basepoint_source_membership_candidate_ci.sh 2>&1 | tee /tmp/fa500-lookahead.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Post lookahead
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' >/tmp/fa500-lookahead.md
          from pathlib import Path
          import json, os, re
          p=Path('build-logs/codex-fa500-height-basepoint-source-membership/candidates/norms/METRIC.json')
          log=Path('/tmp/fa500-lookahead.log')
          xs=['## FA500 lookahead diagnostics','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",'- authority: diagnostic only; first-error progression still governed by strict observer','- maxErrors: `32`']
          if p.exists():
              m=json.loads(p.read_text())
              for k in ['source_sha256','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_error_declaration','FA_error_headers_captured']:
                  xs.append(f'- {k}: `{m.get(k)}`')
          if log.exists():
              lines=log.read_text(encoding='utf-8',errors='replace').splitlines()
              hits=[]
              for i,s in enumerate(lines):
                  if re.search(r'(^|:)(error:|Error:)',s,re.I):
                      hits.extend(lines[max(0,i-1):min(len(lines),i+4)])
              xs += ['', '### error excerpts','```text','\n'.join(hits[-400:])[-24000:],'```']
          print('\n'.join(xs)[:32000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa500-lookahead.md)"
