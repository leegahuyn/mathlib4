name: Codex FA476-r3 close declaration 2792 only

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260810
    paths:
      - .github/workflows/codex-fa476r3-logheight-norm.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa476r3-logheight-norm
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        repair_variant:
          - minimal_simpa
          - explicit_dsimp
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: ${{ matrix.repair_variant }}
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Generate exact declaration-2792-only candidate and directly compile
        run: bash scripts/fa476r3_logheight_norm_candidate_ci.sh
      - name: Print strict frontier evidence
        if: always()
        run: |
          OUT="build-logs/codex-fa476r3-logheight-norm/candidates/norms"
          if test -f "$OUT/Mock2_FunctionalAnalysis.log"; then
            grep -nE '^PrimalitySheafVerification/Mock2_FunctionalAnalysis\.lean:[0-9]+:[0-9]+: error' "$OUT/Mock2_FunctionalAnalysis.log" || true
          fi
          if test -f "$OUT/METRIC.json"; then
            python3 -m json.tool "$OUT/METRIC.json"
          fi
      - name: Upload exact candidate and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa476r3-${{ env.FA475_WINNER }}-${{ env.FA476_R2_VARIANT }}-${{ matrix.repair_variant }}
          path: build-logs/codex-fa476r3-logheight-norm/candidates/norms
          if-no-files-found: error
          retention-days: 90
      - name: Require exact declaration-2792 closure evidence
        if: always()
        run: |
          python3 - \
            "build-logs/codex-fa476r3-logheight-norm/candidates/norms/METRIC.json" \
            "build-logs/codex-fa476r3-logheight-norm/candidates/norms/CANDIDATE.json" \
            "${FA476_R3_VARIANT}" \
            "${GITHUB_SHA}" <<'PY'
          import json
          import sys

          with open(sys.argv[1], encoding="utf-8") as stream:
              metric = json.load(stream)
          with open(sys.argv[2], encoding="utf-8") as stream:
              candidate = json.load(stream)
          variant = sys.argv[3]
          run_head = sys.argv[4]
          print(json.dumps(metric, indent=2, ensure_ascii=False))
          print(json.dumps(candidate, indent=2, ensure_ascii=False))

          expected_source = (
              "a389e62137cf93e33fd432282f4b3e66762e8a4750e26fccf229a256b88fb469"
          )
          expected_artifact_digest = (
              "df4aa67dbc8af84a59480feca9c2874ec28ec6d958967fe3e7b849537c44b973"
          )
          expected_candidates = {
              "minimal_simpa": (
                  "5d96377b3b4895f7f48a847105ae1f077677c794df6bc6b9fa1cd81a1f6e3ad0"
              ),
              "explicit_dsimp": (
                  "add83f552b03177261ffce5bd84112e99afe025dff2b46a46c98ece7cc9eb174"
              ),
          }
          expected_bytes = {
              "minimal_simpa": 2697512,
              "explicit_dsimp": 2697540,
          }
          expected_lines = {
              "minimal_simpa": 60535,
              "explicit_dsimp": 60536,
          }
          expected_target_regions = {
              "minimal_simpa": (
                  "bf09ebf555b9ae95fe3ed67a0df711b896cafcdefd98d23abc7d7336badfa232"
              ),
              "explicit_dsimp": (
                  "811f6633db19ea8196ee395a4863b4a901ea80d685f1a40e2532462bb6c171a9"
              ),
          }
          expected_new_fragments = {
              "minimal_simpa": (
                  "37b3f453bf6527151bcdc9aa7a5dae910fa0e45791e6d8aa84b8c5976de4b6e2"
              ),
              "explicit_dsimp": (
                  "fbd2c9a4fa9338f928489a5d0819d4540c000a63c385e14537d1baaf96b0bcd6"
              ),
          }
          if variant not in expected_candidates:
              raise SystemExit(f"unsupported FA476-r3 variant: {variant}")

          expected_candidate = expected_candidates[variant]
          forbidden = metric.get("candidate_forbidden_counts", {})
          expected_forbidden = {
              "sorry": 0,
              "admit": 0,
              "new_global_axiom": 0,
              "unsafe": 0,
              "native_decide": 0,
              "Lean.ofReduceBool": 0,
          }
          expected_commands = {
              "Mock2": (
                  "lake env lean -DmaxErrors=3 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean "
                  "PrimalitySheafVerification/Mock2.lean"
              ),
              "Mock2_Advanced": (
                  "lake env lean -DmaxErrors=3 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean "
                  "PrimalitySheafVerification/Mock2_Advanced.lean"
              ),
              "Mock2_FunctionalAnalysis": (
                  "lake env lean -DmaxErrors=32 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/"
                  "Mock2_FunctionalAnalysis.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/"
                  "Mock2_FunctionalAnalysis.ilean "
                  "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean"
              ),
          }
          hashes_match = (
              candidate.get("candidate_sha256") == expected_candidate
              and candidate.get("baseline_sha256")
                  == "b51c2ddcdfec8b98a89734575ef57b681f47eefba8b879028a3233439b70906a"
              and candidate.get("candidate_sha256") == metric.get("source_sha256")
              and candidate.get("candidate_sha256")
                  == metric.get("candidate_metadata_sha256")
              and candidate.get("declaration_sequence_sha256")
                  == metric.get("declaration_sequence_sha256")
              and candidate.get("declaration_count")
                  == metric.get("declaration_count")
              and candidate.get("target_header_sha256")
                  == metric.get("target_header_sha256")
              and candidate.get("line_count") == expected_lines[variant]
              and candidate.get("target_declaration")
                  == "actualEdgeAmbientParam_hasDerivAt"
              and candidate.get("target_header_sha256")
                  == "3bf8171b0e1fd825b1a17a8e52637810c328df76a5bd10475674d2925f35e4c9"
              and candidate.get("declaration_count") == 4397
              and candidate.get("declaration_sequence_sha256")
                  == "a9f15910d7e589feb18eac7d42370c5bfa07233a188d32554f5711a8e3446a5b"
          )

          repairs = candidate.get("repairs", [])
          prior_bridges = [
              row for row in repairs
              if row.get("declaration")
                  == "norm_deriv_selectedLogHeightNaturalGauge_le_graph"
              and row.get("declaration_index") == 2792
              and row.get("matrix_variant") is None
          ]
          prior_bridge_exact = len(prior_bridges) == 1 and (
              prior_bridges[0].get("fa475_winner") == "clean_semicolon"
              and prior_bridges[0].get("strategy")
                  == "bridge the real norm to abs with Real.norm_eq_abs before rewriting positivity"
              and prior_bridges[0].get("frontier_declaration_index") == 2792
              and prior_bridges[0].get("later_repair_count") == 0
              and prior_bridges[0].get("max_errors") == 32
          )

          r2_repairs = [
              row for row in repairs
              if row.get("declaration")
                  == "norm_deriv_selectedLogHeightNaturalGauge_le_graph"
              and row.get("declaration_index") == 2792
              and row.get("matrix_variant") == "explicit_exp_nonneg"
          ]
          r2_exact = len(r2_repairs) == 1 and (
              r2_repairs[0].get("exact_fa476_evidence_artifact_id")
                  == 9069198424
              and r2_repairs[0].get("exact_fa476_evidence_source_sha256")
                  == "9b4c42180dfcbdb3b2c7977c225776902986c310eae9a55b0d92d9985c416efe"
              and r2_repairs[0].get("candidate_source_sha256")
                  == expected_source
              and r2_repairs[0].get("replacement_count") == 1
              and r2_repairs[0].get("target_header_preserved") is True
              and r2_repairs[0].get("source_prefix_preserved") is True
              and r2_repairs[0].get("source_suffix_preserved") is True
              and r2_repairs[0].get("declaration_sequence_preserved") is True
              and r2_repairs[0].get("later_repair_count") == 0
          )

          r3_repairs = [
              row for row in repairs
              if row.get("declaration")
                  == "norm_deriv_selectedLogHeightNaturalGauge_le_graph"
              and row.get("declaration_index") == 2792
              and row.get("matrix_variant") == variant
          ]
          r3_exact = len(r3_repairs) == 1 and (
              r3_repairs[0].get("fa475_winner") == "clean_semicolon"
              and r3_repairs[0].get("fa476_r2_variant")
                  == "explicit_exp_nonneg"
              and r3_repairs[0].get("exact_fa476_r2_evidence_artifact_id")
                  == 9069711014
              and r3_repairs[0].get(
                  "exact_fa476_r2_evidence_artifact_digest_sha256"
              ) == expected_artifact_digest
              and r3_repairs[0].get("exact_fa476_r2_evidence_repository_head")
                  == "a878f45b6e22b63b5426cf7d55c1c13486923ece"
              and r3_repairs[0].get("exact_fa476_r2_evidence_source_sha256")
                  == expected_source
              and r3_repairs[0].get("exact_fa476_r2_evidence_source_bytes")
                  == 2697469
              and r3_repairs[0].get("candidate_source_sha256")
                  == expected_candidate
              and r3_repairs[0].get("candidate_source_bytes")
                  == expected_bytes[variant]
              and r3_repairs[0].get("candidate_line_count")
                  == expected_lines[variant]
              and r3_repairs[0].get("replacement_count") == 1
              and r3_repairs[0].get("old_fragment_count_before") == 1
              and r3_repairs[0].get("old_fragment_count_after") == 0
              and r3_repairs[0].get("new_fragment_count_before") == 0
              and r3_repairs[0].get("new_fragment_count_after") == 1
              and r3_repairs[0].get("new_fragment_sha256")
                  == expected_new_fragments[variant]
              and r3_repairs[0].get("target_region_before_sha256")
                  == "ba2723bc065f721dc4e00bb319df3a887710522c544dd031d1f9b0d32034fd9e"
              and r3_repairs[0].get("target_region_after_sha256")
                  == expected_target_regions[variant]
              and r3_repairs[0].get("target_header_sha256")
                  == "1df5f5385c167d772dd6c874de939e71983d80a58e301c7425887bfa6d02a656"
              and r3_repairs[0].get("target_header_preserved") is True
              and r3_repairs[0].get("source_prefix_sha256")
                  == "c5ead146a8e578dc26ec980fb83f067f7875b629b8ef04199b3d304fd34e30ee"
              and r3_repairs[0].get("source_prefix_bytes") == 1499209
              and r3_repairs[0].get("source_prefix_preserved") is True
              and r3_repairs[0].get("source_suffix_sha256")
                  == "9cc10afb2a5d5e430f7b76193e7d31c1779ea771ee28366c751429649c45e04f"
              and r3_repairs[0].get("source_suffix_bytes") == 1195956
              and r3_repairs[0].get("source_suffix_preserved") is True
              and r3_repairs[0].get("declaration_count") == 4382
              and r3_repairs[0].get("declaration_sequence_sha256")
                  == "c997317cd459891eea590671da4aa9941e5c083cbd5dffe91ee96601b12cc4f2"
              and r3_repairs[0].get("declaration_sequence_preserved") is True
              and r3_repairs[0].get("later_repair_count") == 0
          )

          r3_matrix_rows = [
              row for row in repairs
              if row.get("declaration") == "FA476-r3 strict-frontier matrix"
          ]
          r3_matrix_exact = len(r3_matrix_rows) == 1 and (
              r3_matrix_rows[0].get("strategy") == variant
              and r3_matrix_rows[0].get("target_declaration_index") == 2792
              and r3_matrix_rows[0].get("fa476_r2_variant")
                  == "explicit_exp_nonneg"
              and r3_matrix_rows[0].get("later_repair_count") == 0
          )
          no_later_repairs = all(
              not isinstance(row.get("declaration_index"), int)
              or row.get("declaration_index") <= 2792
              for row in repairs
          )

          fa_exit = metric.get("FA_exit")
          first_index = metric.get("FA_error_declaration_index")
          declaration_2792_closed = (
              (fa_exit == 0 and metric.get("FA_error_headers_captured") == 0)
              or (
                  fa_exit != 0
                  and isinstance(first_index, int)
                  and first_index >= 2793
              )
          )
          ok = (
              metric.get("classification") in {"PASS", "LEAN_FAILURE"}
              and metric.get("authority")
                  == "direct Lean CLI on repository source path"
              and metric.get("source_path")
                  == "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean"
              and metric.get("all_required_lean_executed") is True
              and metric.get("lean_executed") is True
              and metric.get("infra_reasons") == []
              and metric.get("toolchain_install_exit") == 0
              and metric.get("cache_get_exit") == 0
              and metric.get("repository_head") == run_head
              and metric.get("head_source_sha256_before_candidate_materialization")
                  == "b51c2ddcdfec8b98a89734575ef57b681f47eefba8b879028a3233439b70906a"
              and metric.get("source_metadata_identity") is True
              and metric.get("Mock2_executed") is True
              and metric.get("Mock2_exit") == 0
              and metric.get("Mock2_errors_under_cap") == 0
              and metric.get("Mock2_Advanced_executed") is True
              and metric.get("Mock2_Advanced_exit") == 0
              and metric.get("Mock2_Advanced_errors_under_cap") == 0
              and metric.get("FA_executed") is True
              and metric.get("line_count") == expected_lines[variant]
              and metric.get("required_line_count") == expected_lines[variant]
              and metric.get("maxErrors_cap") == 32
              and metric.get("diagnostic_parser")
                  == "strict_error_and_error_category_v1"
              and metric.get("lake_manifest_sha256")
                  == "672474eb93bc14c66cd1ff45203c451987fe525f7b5d13ecd83140be46434b26"
              and metric.get("lean_toolchain")
                  == "leanprover/lean4:v4.33.0-rc1"
              and metric.get("exact_compile_commands") == expected_commands
              and metric.get("forbidden_not_increased") is True
              and metric.get("forbidden_clean") is True
              and forbidden == expected_forbidden
              and hashes_match
              and prior_bridge_exact
              and r2_exact
              and r3_exact
              and r3_matrix_exact
              and no_later_repairs
              and declaration_2792_closed
          )
          print(json.dumps({
              "exact_FA476_r2_artifact_id": 9069711014,
              "exact_FA476_r2_artifact_digest_sha256": expected_artifact_digest,
              "exact_FA476_r2_source": expected_source,
              "expected_FA476_r3_candidate": expected_candidate,
              "variant": variant,
              "run_head": run_head,
              "prior_Real_norm_eq_abs_bridge_exact": prior_bridge_exact,
              "r2_explicit_exp_nonneg_exact": r2_exact,
              "r3_exact": r3_exact,
              "no_declaration_2793_or_later_repair": no_later_repairs,
              "target_declaration_index": 2792,
              "frontier_advanced_to": first_index,
              "fa_exit": fa_exit,
              "declaration_2792_closed": declaration_2792_closed,
              "full_FA_clean_claimed": False,
              "frontier_evidence_accepted": ok,
          }, indent=2, ensure_ascii=False))
          if not ok:
              raise SystemExit(
                  "FA476-r3 did not establish exact declaration-2792-only closure"
              )
          PY
