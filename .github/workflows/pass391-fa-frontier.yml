name: PASS 391 header-preserving donor merge and ordered verification

on:
  push:
    branches: [fix/fa391-header-preserving-donor-merge-20260809]
    paths:
      - '.github/workflows/pass391-fa-frontier.yml'
      - 'scripts/apply_three_hundred_ninety_first_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass391-fa-frontier
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - name: Checkout PASS 391 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 950
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          mkdir -p /tmp/pass391/{logs,source,evidence}

      - name: Download PASS 376 donor and apply PASS 391
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9024606745/zip \
            > /tmp/pass376-donor.zip
          unzip -q /tmp/pass376-donor.zip -d /tmp/pass376-donor
          donor="$(find /tmp/pass376-donor -type f \
            -name 'Mock2_FunctionalAnalysis-pass376.lean' -print -quit)"
          test -n "${donor}"
          PASS376_DONOR="${donor}" \
          PASS391_PATCH_OUT=/tmp/pass391/evidence/pass391.patch \
          PASS391_META_OUT=/tmp/pass391/evidence/pass391-meta.json \
            python3 scripts/apply_three_hundred_ninety_first_pass_functional_analysis_repairs.py \
            | tee /tmp/pass391/logs/apply-pass391.log
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '58e503b0d8bc304fda07fc9b4fe3056bf43cd6df089bc8a27ab34712696e64e0'
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            /tmp/pass391/source/Mock2_FunctionalAnalysis-pass391.lean

      - name: Audit source trust constraints
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SCAN=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            python3 - <<'PY'
          from pathlib import Path
          import json, os, re
          src=Path(os.environ['TARGET_SCAN']).read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                  elif src.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                  else: out.append('\n' if src[i]=='\n' else ' '); i+=1
              elif string:
                  c=src[i]; out.append('\n' if c=='\n' else ' ')
                  if esc: esc=False
                  elif c=='\\': esc=True
                  elif c=='"': string=False
                  i+=1
              elif src.startswith('/-',i): depth=1; out.extend('  '); i+=2
              elif src.startswith('--',i):
                  while i < len(src) and src[i]!='\n': out.append(' '); i+=1
              elif src[i]=='"': string=True; out.append(' '); i+=1
              else: out.append(src[i]); i+=1
          if depth or string: raise SystemExit('unterminated comment/string')
          code=''.join(out)
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b',
                'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
                'native_decide':r'\bnative_decide\b',
                'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          result={k:len(re.findall(v,code)) for k,v in pats.items()}
          Path('/tmp/pass391/evidence/forbidden-token-audit.json').write_text(
              json.dumps(result,indent=2)+'\n')
          print(result)
          if any(result.values()): raise SystemExit(1)
          PY

      - name: Compile in mandatory order
        id: verify
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          OUT='.lake/build/lib/lean/PrimalitySheafVerification'
          LOG='/tmp/pass391/logs'
          mkdir -p "${OUT}" "${LOG}"
          echo 'module,run,exit_code,error_count,warning_count,first_line' \
            > /tmp/pass391/evidence/compile-summary.csv

          compile_one() {
            local module="$1" run="$2" log rc errors warnings first
            log="${LOG}/${module}-${run}.log"
            rm -f "${OUT}/${module}.olean" "${OUT}/${module}.ilean" \
              "${OUT}/${module}.olean.private"
            lake env lean -DmaxErrors=300 \
              "PrimalitySheafVerification/${module}.lean" \
              -o "${OUT}/${module}.olean" -i "${OUT}/${module}.ilean" \
              >"${log}" 2>&1
            rc=$?
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            first="$(grep -m1 -oE '\.lean:[0-9]+' "${log}" | sed 's/.*://' || true)"
            printf '%s,%s,%s,%s,%s,%s\n' \
              "${module}" "${run}" "${rc}" "${errors}" "${warnings}" "${first}" \
              >> /tmp/pass391/evidence/compile-summary.csv
            {
              echo "module=${module}"; echo "run=${run}"; echo "exit_code=${rc}"
              echo "error_count=${errors}"; echo "warning_count=${warnings}"
              echo "first_line=${first}"; echo 'first_errors:'
              grep -n 'error:' "${log}" | head -60 || true
              echo 'last_errors:'; grep -n 'error:' "${log}" | tail -30 || true
              echo 'tail:'; tail -500 "${log}" || true
            } > "/tmp/pass391/evidence/${module}-${run}-result.txt"
            [[ "${rc}" -eq 0 && "${errors}" -eq 0 ]] || return 1
            test -s "${OUT}/${module}.olean" && test -s "${OUT}/${module}.ilean"
          }

          twice() { compile_one "$1" pass1 && compile_one "$1" pass2; }
          final=0; stage='Mock2_FunctionalAnalysis'
          if ! twice Mock2_FunctionalAnalysis; then final=1
          else
            stage='Mock2_FunctionalAnalysis_Integrated'
            if ! twice Mock2_FunctionalAnalysis_Integrated; then final=1
            else
              stage='Mock3'
              mapfile -t mock3 < <(find PrimalitySheafVerification -maxdepth 1 \
                -type f -name 'Mock3*.lean' -printf '%f\n' | sort)
              for file in "${mock3[@]}"; do
                if ! twice "${file%.lean}"; then final=1; break; fi
              done
              if [[ "${final}" -eq 0 ]]; then
                stage='QYM'
                if ! twice QYM; then final=1; fi
              fi
            fi
          fi
          printf 'stage=%s\nexit_code=%s\n' "${stage}" "${final}" \
            | tee /tmp/pass391/evidence/final-status.txt
          echo "exit_code=${final}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Materialize source and status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/pass391-aggregate
          cp /tmp/pass391/evidence/* build-logs/pass391-aggregate/ 2>/dev/null || true
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rows=list(csv.DictReader(Path('/tmp/pass391/evidence/compile-summary.csv').open()))
          status=Path('/tmp/pass391/evidence/final-status.txt').read_text().strip()
          complete=bool(rows) and 'exit_code=0' in status and all(
              r['exit_code']=='0' and r['error_count']=='0' for r in rows)
          data={'complete':complete,'status':status,
                'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
                'compile_rows':rows}
          Path('build-logs/pass391-aggregate/AUTHORITATIVE_STATUS.json').write_text(
              json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/pass391-aggregate
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): materialize PASS391 donor merge result'
            git push origin HEAD:fix/fa391-header-preserving-donor-merge-20260809
          fi

      - name: Upload PASS 391 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass391-fa-frontier-${{ github.sha }}
          path: /tmp/pass391
          if-no-files-found: error
          retention-days: 90

      - name: Enforce result
        if: always()
        shell: bash
        env:
          FINAL_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "${FINAL_EXIT}"
