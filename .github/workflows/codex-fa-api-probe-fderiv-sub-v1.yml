name: Codex FA API probe fderiv sub v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-fderiv-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact L2 domain-action prerequisites and FullPlane type
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeFDerivSub.lean <<'LEAN'
          import Mathlib
          open Topology Filter MeasureTheory
          #synth R1Space ℂ
          #synth OpensMeasurableSpace ℂ
          #synth ContinuousVAdd ℂ ℂ
          #synth IsLocallyFiniteMeasure (volume : Measure ℂ)
          #synth (volume : Measure ℂ).InnerRegularCompactLTTop
          #synth VAddInvariantMeasure ℂ ℂ (volume : Measure ℂ)
          #synth Fact (1 ≤ (2 : ℝ≥0∞))
          #synth Fact ((2 : ℝ≥0∞) ≠ ⊤)
          #synth ContinuousVAdd ℂᵈᵃᵃ (MeasureTheory.Lp ℂ 2 (volume : Measure ℂ))

          noncomputable abbrev AmbientPlaneL2Probe := MeasureTheory.Lp ℂ 2 (volume : Measure ℂ)
          example (f : AmbientPlaneL2Probe) :
              Tendsto (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) (nhds 0) (nhds f) := by
            have h : Continuous (fun p : ℂᵈᵃᵃ × AmbientPlaneL2Probe ↦ p.1 +ᵥ p.2) :=
              continuous_vadd
            have hm : Continuous (fun t : ℂ ↦ (DomAddAct.mk t, f)) :=
              DomAddAct.continuous_mk.prod_mk continuous_const
            simpa using (h.comp hm).continuousAt
          example (f : AmbientPlaneL2Probe) :
              Tendsto (fun t : ℂ ↦ ‖DomAddAct.mk t +ᵥ f - f‖) (nhds 0) (nhds 0) := by
            have ht : Tendsto (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) (nhds 0) (nhds f) := by
              have h : Continuous (fun p : ℂᵈᵃᵃ × AmbientPlaneL2Probe ↦ p.1 +ᵥ p.2) := continuous_vadd
              have hm : Continuous (fun t : ℂ ↦ (DomAddAct.mk t, f)) := DomAddAct.continuous_mk.prod_mk continuous_const
              simpa using (h.comp hm).continuousAt
            exact (tendsto_norm.comp ((ht.sub_const f))).congr' (Filter.Eventually.of_forall (fun _ => rfl))

          open scoped Distributions
          abbrev FullPlaneTestProbe := TestFunction (⊤ : TopologicalSpace.Opens ℂ) ℂ (⊤ : ℕ∞)
          example (v : FullPlaneTestProbe) : Continuous (v : ℂ → ℂ) := v.continuous
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeFDerivSub.lean | tee /tmp/fderiv-sub.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-fderiv-sub-v1-${{ github.sha }}", path: /tmp/fderiv-sub.log, retention-days: 7}
