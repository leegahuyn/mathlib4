name: Codex FA API probe fderiv sub v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-fderiv-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe translation derivative and affine commutator
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeFDerivSub.lean <<'LEAN'
          import Mathlib
          #check fderiv_comp_sub
          example (t : ℂ) (f : ℂ → ℂ) (w : ℂ) :
              fderiv ℝ (fun q : ℂ => f (q - t)) w = fderiv ℝ f (w - t) := by
            simpa using (fderiv_comp_sub (𝕜 := ℝ) (f := f) (x := w) t)

          noncomputable def probeAmbientConstantMaassDerivative
              (sigma : ℂ) (f : ℂ → ℂ) (w : ℂ) : ℂ :=
            sigma * fderiv ℝ f w 1 + fderiv ℝ f w Complex.I
          noncomputable def probeAmbientAffineMaass
              (sigma c : ℂ) (f : ℂ → ℂ) (w : ℂ) : ℂ :=
            (w.im : ℂ) * probeAmbientConstantMaassDerivative sigma f w + c * f w
          def probeAmbientTranslate (t : ℂ) (f : ℂ → ℂ) (w : ℂ) : ℂ := f (w - t)

          theorem probeConstantTranslate (sigma t : ℂ) (f : ℂ → ℂ) (w : ℂ) :
              probeAmbientConstantMaassDerivative sigma (probeAmbientTranslate t f) w =
                probeAmbientConstantMaassDerivative sigma f (w - t) := by
            simp only [probeAmbientConstantMaassDerivative]
            change sigma * (fderiv ℝ (fun q : ℂ => f (q - t)) w) 1 +
                (fderiv ℝ (fun q : ℂ => f (q - t)) w) Complex.I = _
            rw [fderiv_comp_sub]

          theorem probeAffineTranslate (sigma c t : ℂ) (f : ℂ → ℂ) (w : ℂ) :
              probeAmbientAffineMaass sigma c (probeAmbientTranslate t f) w -
                  probeAmbientTranslate t (probeAmbientAffineMaass sigma c f) w =
                (t.im : ℂ) * probeAmbientConstantMaassDerivative sigma f (w - t) := by
            simp only [probeAmbientAffineMaass, probeAmbientTranslate]
            rw [probeConstantTranslate]
            simp only [Complex.sub_im]
            push_cast
            ring
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeFDerivSub.lean | tee /tmp/fderiv-sub.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-fderiv-sub-v1-${{ github.sha }}", path: /tmp/fderiv-sub.log, retention-days: 7}
