name: PR9 PASS324 FunctionalAnalysis Integrated QYM gate

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pr9-exact-pass320-fa-qym-stable-v2.yml'
      - 'scripts/ci_fa319_qym.sh'
      - 'scripts/ci_fa321_qym.sh'
      - 'scripts/apply_three_hundred_twenty_first_pass_functional_analysis_repairs.py'
      - 'scripts/apply_three_hundred_twenty_second_pass_functional_analysis_repairs.py'
      - 'scripts/apply_three_hundred_twenty_third_pass_functional_analysis_repairs.py'
      - 'scripts/apply_three_hundred_twenty_fourth_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pr9-pass324-fa-integrated-qym
  cancel-in-progress: true

jobs:
  verify-pass324:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ci/fa319-isolated-20260807

    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Lean toolchain and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          sha256sum --version | head -1
          lake exe cache get

      - name: Apply PASS320 through PASS324 and compile FA Integrated QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_fa319_qym.sh

      - name: Upload PASS324 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-pass324-fa-integrated-qym-${{ env.SOURCE_SHA }}
          path: /tmp/fa324-qym
          if-no-files-found: warn
          retention-days: 30
