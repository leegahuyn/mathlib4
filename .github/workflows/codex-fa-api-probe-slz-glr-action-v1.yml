name: Codex FA API probe SLZ GLR action v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-slz-glr-action-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact action bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSLZGLRAction.lean <<'LEAN'
          import Mathlib
          open Matrix Matrix.SpecialLinearGroup UpperHalfPlane Complex
          open scoped MatrixGroups UpperHalfPlane
          example (g : SL(2, ℤ)) (z : ℍ) :
              g • z = ((g : GL (Fin 2) ℝ) • z) := by
            apply UpperHalfPlane.ext
            rw [UpperHalfPlane.coe_specialLinearGroup_apply,
              UpperHalfPlane.coe_generalLinearGroup_apply]
            simp
          example (g : SL(2, ℤ)) (z : ℍ) :
              Real.log ((g • z).im) =
                Real.log (((g : GL (Fin 2) ℝ) • z).im) := by
            congr 2
            apply congrArg UpperHalfPlane.im
            apply UpperHalfPlane.ext
            rw [UpperHalfPlane.coe_specialLinearGroup_apply,
              UpperHalfPlane.coe_generalLinearGroup_apply]
            simp
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeSLZGLRAction.lean | tee /tmp/slz-glr-action.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-slz-glr-action-${{ github.sha }}
          path: /tmp/slz-glr-action.log
          if-no-files-found: warn
          retention-days: 7
