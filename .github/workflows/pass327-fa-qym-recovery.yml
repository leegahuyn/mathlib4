name: PASS 327 FunctionalAnalysis and QYM recovery

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'scripts/ci_pass327_fa_qym_recovery.sh'
      - '.github/workflows/pass327-fa-qym-recovery.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: pass327-fa-qym-recovery
  cancel-in-progress: false

jobs:
  recover-verify-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: true

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Recover PASS 327 and verify FA, Integrated Mock3 bridge, and QYM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_pass327_fa_qym_recovery.sh

      - name: Upload PASS 327 recovery evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass327-fa-qym-recovery-${{ github.sha }}
          path: /tmp/pass327-fa-qym-recovery
          if-no-files-found: warn
          retention-days: 30
