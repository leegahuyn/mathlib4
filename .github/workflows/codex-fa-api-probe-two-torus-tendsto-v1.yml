name: Codex FA API probe idx3584 uniform-bound v8
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-two-torus-tendsto-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile explicit NNReal bound
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/UniformBoundProbeV8.lean <<'LEAN'
          import Mathlib
          noncomputable section

          variable {E F : Type*}
          variable [NormedAddCommGroup E] [NormedSpace ℂ E]
          variable [NormedAddCommGroup F] [NormedSpace ℂ F]

          example (R : E →L[ℂ] F)
              (hRbound : ∀ u, ‖u‖ ≤ (↑(1 : NNReal) : ℝ) * ‖R u‖) :
              IsUniformEmbedding R := by
            exact R.isUniformEmbedding_of_bound (K := (1 : NNReal)) hRbound

          example (R : E →L[ℂ] F)
              (hRbound : ∀ u, ‖u‖ ≤ ‖R u‖) :
              IsUniformEmbedding R := by
            apply R.isUniformEmbedding_of_bound (K := (1 : NNReal))
            intro u
            simpa only [NNReal.coe_one, one_mul] using hRbound u
          LEAN
          lake env lean /tmp/UniformBoundProbeV8.lean
