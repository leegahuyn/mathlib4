name: Codex FA API probe downstream exact v4
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-two-torus-tendsto-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile normalized downstream repair probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/DownstreamExactProbeV4.lean <<'LEAN'
          import Mathlib
          noncomputable section
          #check inner_self_eq_norm_sq
          #check norm_sq_eq_re_inner

          variable {V : Type*}
          variable [NormedAddCommGroup V] [InnerProductSpace ℂ V]
          example (u : V) : (inner ℂ u u).re = ‖u‖ ^ 2 := by
            have hinner : inner ℂ u u = (‖u‖ ^ 2 : ℂ) := by
              simpa using (inner_self_eq_norm_sq (𝕜 := ℂ) u)
            rw [hinner]
            simp

          example : Function.Periodic (Function.Periodic.qParam 2) (2 : ℂ) := by
            intro w
            unfold Function.Periodic.qParam
            calc
              Complex.exp
                  ((2 : ℂ) * (Real.pi : ℂ) * Complex.I * (w + 2) /
                    ((2 : ℝ) : ℂ)) =
                Complex.exp
                  ((2 : ℂ) * (Real.pi : ℂ) * Complex.I * w /
                    ((2 : ℝ) : ℂ) +
                    2 * (Real.pi : ℂ) * Complex.I) := by
                      congr 1
                      push_cast
                      ring
              _ = Complex.exp
                  ((2 : ℂ) * (Real.pi : ℂ) * Complex.I * w /
                    ((2 : ℝ) : ℂ)) := by
                    rw [Complex.exp_add, Complex.exp_two_pi_mul_I, mul_one]
          LEAN
          lake env lean /tmp/DownstreamExactProbeV4.lean
