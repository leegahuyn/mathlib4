name: Codex FA API probe downstream exact v5
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-two-torus-tendsto-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile exact RCLike real-part bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/DownstreamExactProbeV5.lean <<'LEAN'
          import Mathlib
          noncomputable section

          variable {V W : Type*}
          variable [NormedAddCommGroup V] [InnerProductSpace ℂ V]
          variable [NormedAddCommGroup W] [InnerProductSpace ℂ W]

          example (u : V) : (inner ℂ u u).re = ‖u‖ ^ 2 := by
            change RCLike.re (inner ℂ u u) = ‖u‖ ^ 2
            exact inner_self_eq_norm_sq (𝕜 := ℂ) u

          example (E : V →L[ℂ] W) (u : V) :
              (inner ℂ (E u) (E u)).re = ‖E u‖ ^ 2 := by
            change RCLike.re (inner ℂ (E u) (E u)) = ‖E u‖ ^ 2
            exact inner_self_eq_norm_sq (𝕜 := ℂ) (E u)
          LEAN
          lake env lean /tmp/DownstreamExactProbeV5.lean
