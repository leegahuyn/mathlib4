name: Codex FA API probe post3519 v1
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-two-torus-tendsto-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile post3519 API probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/Post3519Probe.lean <<'LEAN'
          import Mathlib
          noncomputable section
          open Filter MeasureTheory Module End

          example (C : ℝ) :
              Filter.Tendsto (fun N : ℕ => C / ((N : ℝ) + 1))
                Filter.atTop (nhds 0) := by
            simpa only [div_eq_mul_inv, one_div, mul_zero] using
              tendsto_const_nhds.mul
                (tendsto_one_div_add_atTop_nhds_zero_nat :
                  Filter.Tendsto (fun N : ℕ => (1 : ℝ) / (N + 1))
                    Filter.atTop (nhds 0))

          example {β T : ℝ} (hT : 0 < T) :
              IntegrableOn (fun y : ℝ => y ^ (β - 2)) (Set.Ioo 0 T) ↔
                1 < β := by
            rw [intervalIntegral.integrableOn_Ioo_rpow_iff hT]
            linarith

          example {β : ℝ} (hβ : 1 < β) :
              IntegrableOn
                (fun y : ℝ => Real.exp (-y) * y ^ (β - 2))
                (Set.Ioi 0) := by
            convert Real.GammaIntegral_convergent (s := β - 1) (by linarith) using 1 <;>
              ring

          variable {X : Type*}
          variable [NormedAddCommGroup X] [InnerProductSpace ℂ X] [CompleteSpace X]
          example (K : X →L[ℂ] X) (hK : IsCompactOperator K)
              (μ : ℂ) (hμ : μ ≠ 0) :
              FiniteDimensional ℂ (eigenspace K.toLinearMap μ) := by
            replace hK := hK.restrict'
              ((mem_invtSubmodule_iff_forall_mem_of_mem _).mp
                (eigenspace_mem_invtSubmodule K.toLinearMap μ))
            rw [restrict_eigenspace, LinearMap.coe_smul,
              IsCompactOperator.smul_iff₀ hμ] at hK
            rwa [← isCompactOperator_id_iff_finiteDimensional]
          LEAN
          lake env lean /tmp/Post3519Probe.lean
