name: PASS 376 slope probe v2

on:
  push:
    branches: [probe/fa376-first-cluster-20260809]
    paths:
      - '.github/workflows/pass376-slope-probe-v2.yml'
      - 'PrimalitySheafVerification/Pass376FirstClusterProbe.lean'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa376-slope-probe-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
      - name: Compile slope probe
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          lake env lean -DmaxErrors=100 \
            PrimalitySheafVerification/Pass376FirstClusterProbe.lean \
            > /tmp/pass376-slope-probe-v2.log 2>&1
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          cat /tmp/pass376-slope-probe-v2.log
          exit 0
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-slope-probe-v2-${{ github.sha }}
          path: /tmp/pass376-slope-probe-v2.log
          if-no-files-found: error
          retention-days: 30
      - name: Enforce slope probe
        if: always()
        shell: bash
        env:
          PROBE_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${PROBE_EXIT_CODE:-}"
          exit "${PROBE_EXIT_CODE}"
