name: Codex FA API probe intrinsic bridges v2

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-intrinsic-bridges-v2.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact intrinsic bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeIntrinsicBridgesV2.lean <<'LEAN'
          import Mathlib
          open Matrix Matrix.SpecialLinearGroup UpperHalfPlane Set Filter
          open scoped MatrixGroups UpperHalfPlane

          noncomputable def testIntegralMoebiusChart (g : SL(2, ℤ)) (w : ℂ) : ℂ :=
            (((g : GL (Fin 2) ℝ) • UpperHalfPlane.ofComplex w : ℍ) : ℂ)

          example (g : SL(2, ℤ)) :
              0 < ((g : GL (Fin 2) ℝ)).val.det := by
            change 0 < Matrix.det
              ((Matrix.SpecialLinearGroup.map (Int.castRingHom ℝ) g : SL(2, ℝ)) :
                Matrix (Fin 2) (Fin 2) ℝ)
            rw [Matrix.SpecialLinearGroup.det_coe]
            norm_num

          example (g : SL(2, ℤ)) (z : ℍ) :
              HasStrictDerivAt (testIntegralMoebiusChart g)
                (((g : GL (Fin 2) ℝ)).val.det /
                  UpperHalfPlane.denom (g : GL (Fin 2) ℝ) z ^ 2) (z : ℂ) := by
            have hdet : 0 < ((g : GL (Fin 2) ℝ)).val.det := by
              change 0 < Matrix.det
                ((Matrix.SpecialLinearGroup.map (Int.castRingHom ℝ) g : SL(2, ℝ)) :
                  Matrix (Fin 2) (Fin 2) ℝ)
              rw [Matrix.SpecialLinearGroup.det_coe]
              norm_num
            change HasStrictDerivAt
              (fun w : ℂ => (((g : GL (Fin 2) ℝ) • UpperHalfPlane.ofComplex w : ℍ) : ℂ))
              (((g : GL (Fin 2) ℝ)).val.det /
                UpperHalfPlane.denom (g : GL (Fin 2) ℝ) z ^ 2) (z : ℂ)
            exact UpperHalfPlane.hasStrictDerivAt_smul hdet z

          example (z : ℍ) :
              Filter.Tendsto UpperHalfPlane.ofComplex
                (nhdsWithin (z : ℂ) UpperHalfPlane.upperHalfPlaneSet) (nhds z) := by
            have hzsrc : (z : ℂ) ∈ UpperHalfPlane.ofComplex.source := by
              change (z : ℂ) ∈ Set.range UpperHalfPlane.coe
              exact ⟨z, rfl⟩
            have hc := UpperHalfPlane.ofComplex.continuousOn (x := (z : ℂ)) hzsrc
            have hsource : UpperHalfPlane.ofComplex.source =
                UpperHalfPlane.upperHalfPlaneSet := by
              change Set.range UpperHalfPlane.coe = UpperHalfPlane.upperHalfPlaneSet
              exact UpperHalfPlane.range_coe
            rw [hsource] at hc
            simpa using hc

          example : ∃ K : ℝ≥0, LipschitzWith K Real.smoothTransition := by
            obtain ⟨K, hK⟩ :=
              Real.smoothTransition.contDiff.contDiffOn.exists_lipschitzOnWith
                (by norm_num : (∞ : WithTop ℕ∞) ≠ 0)
                (convex_Icc (0 : ℝ) 1) isCompact_Icc
            refine ⟨K, LipschitzWith.of_dist_le_mul ?_⟩
            intro x y
            let px := projIcc (0 : ℝ) 1 zero_le_one x
            let py := projIcc (0 : ℝ) 1 zero_le_one y
            have hpx : (px : ℝ) ∈ Icc (0 : ℝ) 1 := px.property
            have hpy : (py : ℝ) ∈ Icc (0 : ℝ) 1 := py.property
            have hProj : dist (px : ℝ) (py : ℝ) ≤ (1 : ℝ) * dist x y := by
              simpa only [px, py, Subtype.dist_eq, NNReal.coe_one] using
                (LipschitzWith.projIcc zero_le_one).dist_le_mul x y
            calc
              dist (Real.smoothTransition x) (Real.smoothTransition y) =
                  dist (Real.smoothTransition (px : ℝ))
                    (Real.smoothTransition (py : ℝ)) := by
                rw [Real.smoothTransition.projIcc, Real.smoothTransition.projIcc]
              _ ≤ (K : ℝ) * dist (px : ℝ) (py : ℝ) :=
                hK.dist_le_mul (px : ℝ) hpx (py : ℝ) hpy
              _ ≤ (K : ℝ) * ((1 : ℝ) * dist x y) :=
                mul_le_mul_of_nonneg_left hProj K.coe_nonneg
              _ = (K : ℝ) * dist x y := by ring

          example (z : ℍ) {w : ℂ} (hwpos : 0 < w.im) :
              dist ((UpperHalfPlane.ofComplex w : ℍ) : ℂ) (z : ℂ) /
                  Real.sqrt ((UpperHalfPlane.ofComplex w).im * z.im) =
                dist w (z : ℂ) / Real.sqrt (w.im * z.im) := by
            rw [UpperHalfPlane.ofComplex_apply_of_im_pos hwpos]
            rfl

          example : ‖Complex.I‖ = 1 := by
            exact Complex.norm_I
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeIntrinsicBridgesV2.lean | tee /tmp/intrinsic-bridges-v2.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-intrinsic-bridges-v2-${{ github.sha }}
          path: /tmp/intrinsic-bridges-v2.log
          if-no-files-found: warn
          retention-days: 7
