name: Codex FA API probe integral Moebius v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-integral-moebius-v1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe determinant and derivative
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeIntegralMoebiusV1.lean <<'LEAN'
          import Mathlib.Analysis.Complex.UpperHalfPlane.Metric
          import Mathlib.Tactic
          open Matrix Matrix.SpecialLinearGroup UpperHalfPlane Complex
          open scoped MatrixGroups UpperHalfPlane

          #check Matrix.det_map
          #check Matrix.SpecialLinearGroup.det_coe
          #check UpperHalfPlane.hasStrictDerivAt_smul

          theorem probe_det_pos (g : SL(2, ℤ)) :
              0 < ((g : GL (Fin 2) ℝ)).val.det := by
            change 0 < Matrix.det ((g : Matrix (Fin 2) (Fin 2) ℤ).map (Int.castRingHom ℝ))
            rw [Matrix.det_map]
            norm_num

          noncomputable def probeChart (g : SL(2, ℤ)) (w : ℂ) : ℂ :=
            (((g : GL (Fin 2) ℝ) • UpperHalfPlane.ofComplex w : ℍ) : ℂ)

          theorem probe_deriv (g : SL(2, ℤ)) (z : ℍ) :
              HasStrictDerivAt (probeChart g)
                (((g : GL (Fin 2) ℝ)).val.det /
                  UpperHalfPlane.denom (g : GL (Fin 2) ℝ) z ^ 2) (z : ℂ) := by
            change HasStrictDerivAt
              (fun w : ℂ =>
                (((g : GL (Fin 2) ℝ) • UpperHalfPlane.ofComplex w : ℍ) : ℂ))
              (((g : GL (Fin 2) ℝ)).val.det /
                UpperHalfPlane.denom (g : GL (Fin 2) ℝ) z ^ 2) (z : ℂ)
            exact UpperHalfPlane.hasStrictDerivAt_smul (probe_det_pos g) z
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeIntegralMoebiusV1.lean | tee /tmp/integral-moebius-v1.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-integral-moebius-v1-${{ github.sha }}
          path: /tmp/integral-moebius-v1.log
          if-no-files-found: warn
          retention-days: 7
