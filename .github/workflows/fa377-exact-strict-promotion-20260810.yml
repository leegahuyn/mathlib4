name: FA377 exact repair after verified 31725 frontier

on:
  push:
    branches:
      - candidate/fa377-canonical-instance-paired-20260810

permissions:
  contents: write

jobs:
  repair-verify-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      CANDIDATE_BRANCH: candidate/fa377-canonical-instance-paired-20260810
      BASELINE_SHA256: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
      BASELINE_FIRST_ERROR: '31725'
      EXPECTED_CANDIDATE_SHA256: c500aeef3f920bd8451f0c2926c9cc8e63d87f2b39bb24f982f338b7f33370a8

    steps:
      - name: Checkout exact FA377 candidate branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/fa377-canonical-instance-paired-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Apply only the exact 11 repairs after line 31725
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$BASELINE_SHA256"
          python3 scripts/fa377_exact_after_31725.py
          candidate=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$candidate" = "$EXPECTED_CANDIDATE_SHA256"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          lake exe cache get | tee /tmp/cache-get.log

      - name: Directly compile prerequisites and FA377 candidate
        id: metric
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa377-exact-after-31725
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          cp /tmp/lean-version.txt "$d/lean-version.txt"
          cp /tmp/lake-version.txt "$d/lake-version.txt"
          cp /tmp/cache-get.log "$d/cache-get.log"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/Mock2_FunctionalAnalysis-candidate.lean"

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          compile_one Mock2 400
          rc_m2=$?
          compile_one Mock2_Advanced 400
          rc_m2a=$?
          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 600
            rc_fa=$?
          else
            printf 'FA compile blocked by prerequisite failure\n' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          d = Path('build-logs/fa377-exact-after-31725')
          src = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          candidate_sha = hashlib.sha256(src.read_bytes()).hexdigest()
          baseline_line = int(os.environ['BASELINE_FIRST_ERROR'])
          baseline_sha = os.environ['BASELINE_SHA256']
          expected_candidate = os.environ['EXPECTED_CANDIDATE_SHA256']

          rows = {}
          pat = re.compile(r'\.lean:(\d+):(\d+):\s+error(?:\([^)]*\))?:')
          for stem in ['Mock2', 'Mock2_Advanced', 'Mock2_FunctionalAnalysis']:
              log_path = d / f'{stem}.log'
              text = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
              matches = list(pat.finditer(text))
              exit_path = d / f'{stem}.exit'
              rows[stem] = {
                  'exit_code': int(exit_path.read_text()) if exit_path.exists() else 999,
                  'error_headers': len(matches),
                  'first_error_line': int(matches[0].group(1)) if matches else 0,
                  'first_error_col': int(matches[0].group(2)) if matches else 0,
              }

          prereq_ok = (
              rows['Mock2']['exit_code'] == 0 and rows['Mock2']['error_headers'] == 0 and
              rows['Mock2_Advanced']['exit_code'] == 0 and rows['Mock2_Advanced']['error_headers'] == 0
          )
          fa = rows['Mock2_FunctionalAnalysis']
          metric_improved = fa['exit_code'] == 0 or fa['first_error_line'] > baseline_line
          promoted = (
              candidate_sha == expected_candidate and prereq_ok and metric_improved and
              candidate_sha != baseline_sha
          )
          status = {
              'complete': promoted,
              'baseline': {
                  'source_sha256': baseline_sha,
                  'first_error_line': baseline_line,
                  'direct_reverify_run_id': 31319355275,
                  'direct_reverify_job_id': 93259721048,
              },
              'candidate_source_sha256': candidate_sha,
              'expected_candidate_source_sha256': expected_candidate,
              'repairs_applied': 11,
              'results': rows,
              'metric_improved': metric_improved,
              'promoted': promoted,
              'authority': 'actual direct Lean compile metric',
              'promotion_rule': 'FA exit 0, otherwise first_error_line strictly greater than 31725; prerequisites must exit 0',
          }
          (d / 'CURRENT.json').write_text(json.dumps(status, indent=2) + '\n', encoding='utf-8')
          (d / 'CURRENT.txt').write_text(
              '\n'.join(
                  f"{name}: exit={row['exit_code']} errors={row['error_headers']} first={row['first_error_line']}:{row['first_error_col']}"
                  for name, row in rows.items()
              ) + f"\nbaseline_first={baseline_line}\ncandidate_sha256={candidate_sha}\npromoted={str(promoted).lower()}\n",
              encoding='utf-8')
          (d / 'candidate-sha256.txt').write_text(
              f'{candidate_sha}  PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\n',
              encoding='utf-8')

          log_path = d / 'Mock2_FunctionalAnalysis.log'
          log_lines = log_path.read_text(encoding='utf-8', errors='replace').splitlines()
          first = fa['first_error_line']
          context = []
          if first:
              for i, line in enumerate(log_lines):
                  if f'.lean:{first}:' in line:
                      context = log_lines[max(0, i - 4): min(len(log_lines), i + 45)]
                      break
          (d / 'FIRST_ERROR_CONTEXT.txt').write_text('\n'.join(context) + ('\n' if context else ''), encoding='utf-8')
          (d / ('PROMOTED' if promoted else 'REGRESSION')).touch()
          print(json.dumps(status, indent=2))
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as out:
              out.write(f"promoted={str(promoted).lower()}\n")
              out.write(f"fa_exit={fa['exit_code']}\n")
              out.write(f"first_error_line={fa['first_error_line']}\n")
              out.write(f"candidate_sha256={candidate_sha}\n")
          PY
          exit 0

      - name: Commit source only on strict improvement; otherwise evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa377-exact-after-31725
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          mkdir -p candidate-records/fa377
          cp "$d/CURRENT.json" candidate-records/fa377/CURRENT.json
          cp "$d/CURRENT.txt" candidate-records/fa377/CURRENT.txt
          cp "$d/FIRST_ERROR_CONTEXT.txt" candidate-records/fa377/FIRST_ERROR_CONTEXT.txt
          cp "$d/candidate-sha256.txt" candidate-records/fa377/candidate-sha256.txt

          if test -f "$d/PROMOTED"; then
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['results']['Mock2_FunctionalAnalysis']['first_error_line'])")
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean candidate-records/fa377
            msg="fix: promote FA377 frontier beyond 31725 to ${first} [skip ci]"
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add candidate-records/fa377
            msg='evidence: reject FA377 regression and retain 31725 champion [skip ci]'
          fi

          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${CANDIDATE_BRANCH}"
          fi

      - name: Upload full FA377 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa377-exact-after-31725-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa377-exact-after-31725
          if-no-files-found: error
          retention-days: 90

      - name: Enforce strict champion improvement
        if: always()
        env:
          PROMOTED: ${{ steps.metric.outputs.promoted }}
        shell: bash
        run: |
          test "${PROMOTED:-false}" = true
