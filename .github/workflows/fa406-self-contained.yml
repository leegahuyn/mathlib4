name: PASS 406 self-contained FA Mock3 QYM solver

on:
  push:
    branches: [fix/fa406-self-contained-20260809]
    paths:
      - '.github/workflows/fa406-self-contained.yml'
      - '.fa406-cycle'
      - 'scripts/fa406_self_contained_solver.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write

concurrency:
  group: fa406-self-contained
  cancel-in-progress: false

jobs:
  solve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout exact PASS 406 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa406-self-contained-20260809
          fetch-depth: 2500
          persist-credentials: true

      - name: Install pinned Lean, ripgrep, GitHub CLI, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ripgrep gh
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Bound each cycle while preserving every accepted source improvement
        shell: bash
        run: |
          set -euo pipefail
          sed -i 's/rounds=30, cycle=cycle/rounds=6, cycle=cycle/' scripts/fa406_self_contained_solver.py
          sed -i 's/candidates = candidates\[:8\]/candidates = candidates[:4]/' scripts/fa406_self_contained_solver.py

      - name: Run self-contained ordered solver
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p build-logs/fa406-self-contained
          python3 scripts/fa406_self_contained_solver.py \
            2>&1 | tee build-logs/fa406-self-contained.console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "solver_exit_code=${rc}" > build-logs/fa406-self-contained.exit.txt

      - name: Persist status and schedule the next bounded cycle
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          current=0
          test -f .fa406-cycle && current=$(cat .fa406-cycle)
          marker=build-logs/fa406-self-contained/ALL_REQUIRED_TARGETS_2X_PASS
          if test -f "$marker"; then
            next="$current"
          elif test "$current" -lt 20; then
            next=$((current + 1))
          else
            next="$current"
          fi
          echo "$next" > .fa406-cycle
          git add .fa406-cycle
          for p in \
            build-logs/fa406-self-contained/STATE.json \
            build-logs/fa406-self-contained/FINAL_STATUS.json \
            build-logs/fa406-self-contained/ALL_REQUIRED_TARGETS_2X_PASS; do
            test -f "$p" && git add "$p" || true
          done
          if ! git diff --cached --quiet; then
            if test -f "$marker"; then
              msg='fix: record PASS 406 FA Integrated Mock3 QYM 2x PASS [skip ci]'
            elif test "$next" -gt "$current"; then
              msg="ci: continue PASS 406 ordered cycle $next"
            else
              msg='ci: record terminal PASS 406 status [skip ci]'
            fi
            git commit -m "$msg"
            git push origin HEAD:fix/fa406-self-contained-20260809
          fi

      - name: Promote only independently verified success to PR9
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          marker=build-logs/fa406-self-contained/ALL_REQUIRED_TARGETS_2X_PASS
          test -f "$marker" || exit 0
          if test -f scripts/promote_priority_verified_to_pr9.sh; then
            bash scripts/promote_priority_verified_to_pr9.sh \
              build-logs/fa406-self-contained/FINAL_STATUS.json \
              "$marker"
          fi

      - name: Upload complete PASS 406 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa406-self-contained-${{ github.run_id }}-${{ github.sha }}
          path: |
            .fa406-cycle
            build-logs/fa406-self-contained
            build-logs/fa406-self-contained.console.log
            build-logs/fa406-self-contained.exit.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce only success or terminal-cycle result
        if: always()
        shell: bash
        env:
          SOLVER_EXIT_CODE: ${{ steps.solver.outputs.exit_code }}
        run: |
          test -n "${SOLVER_EXIT_CODE:-}"
          if test -f build-logs/fa406-self-contained/ALL_REQUIRED_TARGETS_2X_PASS; then
            exit 0
          fi
          current=0
          test -f .fa406-cycle && current=$(cat .fa406-cycle)
          if test "$current" -ge 20; then
            exit "${SOLVER_EXIT_CODE}"
          fi
          exit 0
