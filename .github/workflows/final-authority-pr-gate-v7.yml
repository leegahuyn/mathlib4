name: Final Authority PR Gate V8 Batch Repair

"on":
  pull_request:
    branches:
      - gpt/final-authority-gb0-canonical-20260820
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: read

concurrency:
  group: final-authority-pr-gate-v8-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  actual-lean-batch-repair-and-authority:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR head branch
        uses: actions/checkout@v4
        with:
          repository: ${{ github.event.pull_request.head.repo.full_name || github.repository }}
          ref: ${{ github.event.pull_request.head.ref || github.ref_name }}
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Record protected identities before repair
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final_authority_pr_v8
          {
            echo "EVENT_HEAD=${{ github.event.pull_request.head.sha || github.sha }}"
            echo "CHECKED_OUT_HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${{ github.event.pull_request.head.ref || github.ref_name }}"
            echo "FA_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)"
            echo "INTEGRATED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)"
            echo "QYM_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)"
            echo "QYM_SHA256=$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
            echo "M1A_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)"
            echo "SPT1_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Spt1.lean)"
            echo "SPT3_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Spt3.lean)"
            echo "MOCK3_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock3.lean)"
          } | tee .final_authority_pr_v8/SOURCE_IDENTITY_BEFORE.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = "3b6596bbc0790c7d6e427c44e2b0b18b8af3efa6"

      - name: Apply all known independent source repairs as one batch
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/final_authority_apply_batch_v8.py | tee .final_authority_pr_v8/BATCH_PATCH_RESULT.txt
          git diff --check
          {
            echo "SPT1_PATCHED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Spt1.lean)"
            echo "SPT1_PATCHED_SHA256=$(sha256sum PrimalitySheafVerification/Spt1.lean | awk '{print $1}')"
            echo "SPT3_PATCHED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Spt3.lean)"
            echo "SPT3_PATCHED_SHA256=$(sha256sum PrimalitySheafVerification/Spt3.lean | awk '{print $1}')"
          } | tee .final_authority_pr_v8/PATCHED_SOURCE_IDENTITY.txt

      - name: Create exact local candidate commit
        id: candidate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "final-authority-bot"
          git config user.email "final-authority-bot@users.noreply.github.com"
          git add PrimalitySheafVerification/Spt1.lean PrimalitySheafVerification/Spt3.lean
          if git diff --cached --quiet; then
            echo "created=false" | tee -a "$GITHUB_OUTPUT"
          else
            git commit -m "Final authority: batch-fix Spt1 forbidden proof and Spt3 log collision"
            echo "created=true" | tee -a "$GITHUB_OUTPUT"
          fi
          echo "sha=$(git rev-parse HEAD)" | tee -a "$GITHUB_OUTPUT"
          git rev-parse HEAD | tee .final_authority_pr_v8/CANDIDATE_COMMIT.txt

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .final_authority_pr_v8/LEAN_VERSION.txt
          lake --version | tee .final_authority_pr_v8/LAKE_VERSION.txt

      - name: Run complete non-stopping actual Lean authority sweep
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          export FINAL_AUTHORITY_BRANCH="${{ github.event.pull_request.head.ref || github.ref_name }}"
          set +e
          python3 scripts/final_authority_gate_v5.py 2>&1 | tee .final_authority_pr_v8/AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_pr_v8/AUTHORITY_EXIT.txt

      - name: Evaluate source-promotion gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee .final_authority_pr_v8/SOURCE_PROMOTION_GATE.json
          import json
          from pathlib import Path

          root = Path('.final_authority')
          def load(name):
              path = root / name
              return json.loads(path.read_text()) if path.exists() else {"pass": False, "missing": True}

          final13 = load('FINAL_13_BUILD_RESULTS.json')
          buildall = load('BUILDALL_RESULT.json')
          forbidden = load('FORBIDDEN_AUDIT.json')
          result = {
              "candidate_commit": Path('.final_authority_pr_v8/CANDIDATE_COMMIT.txt').read_text().strip(),
              "final13_pass": bool(final13.get('pass')),
              "buildall_pass": bool(buildall.get('pass')),
              "forbidden_pass": bool(forbidden.get('pass')),
          }
          result["pass"] = all((result["final13_pass"], result["buildall_pass"], result["forbidden_pass"]))
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"

      - name: Surface complete actual frontier
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== SOURCE IDENTITY BEFORE ==="
          cat .final_authority_pr_v8/SOURCE_IDENTITY_BEFORE.txt 2>/dev/null || true
          echo "=== BATCH PATCH ==="
          cat .final_authority_pr_v8/BATCH_PATCH_RESULT.txt 2>/dev/null || true
          echo "=== PATCHED IDENTITIES ==="
          cat .final_authority_pr_v8/PATCHED_SOURCE_IDENTITY.txt 2>/dev/null || true
          echo "=== CANDIDATE COMMIT ==="
          cat .final_authority_pr_v8/CANDIDATE_COMMIT.txt 2>/dev/null || true
          echo "=== SOURCE PROMOTION GATE ==="
          cat .final_authority_pr_v8/SOURCE_PROMOTION_GATE.json 2>/dev/null || true
          echo "=== STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          for file in PREFLIGHT.json QYM_CANONICAL_REPLAY_RESULT.json MOCK3_CANONICAL_RESULT.json FINAL13_DIAGNOSTIC_SWEEP.json FINAL_13_BUILD_RESULTS.json BUILDALL_RESULT.json FORBIDDEN_AUDIT.json CLEAN_BUILD_1_RESULT.json CLEAN_BUILD_2_RESULT.json FINAL_15_CHECKLIST_RESULT.json FINAL_SOURCE_IDENTITY.json; do
            echo "=== $file ==="
            cat ".final_authority/$file" 2>/dev/null || true
          done
          echo "=== AUTHORITY EXIT ==="
          cat .final_authority_pr_v8/AUTHORITY_EXIT.txt 2>/dev/null || true

      - name: Upload all actual Lean evidence before promotion
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: final-authority-pr-gate-v8-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .final_authority_pr_v8
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30

      - name: Promote source-clean candidate to PR branch
        if: always() && github.event_name == 'pull_request'
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.final_authority_pr_v8/SOURCE_PROMOTION_GATE.json').read_text())
          if not result.get('pass'):
              raise SystemExit('source promotion blocked: Final13, BuildAll, or forbidden gate failed')
          PY
          branch="${{ github.event.pull_request.head.ref }}"
          remote_sha="$(git ls-remote origin "refs/heads/$branch" | awk '{print $1}')"
          parent_sha="$(git rev-parse HEAD^)"
          if [ "${{ steps.candidate.outputs.created }}" = "true" ]; then
            test "$remote_sha" = "$parent_sha"
            git push origin "HEAD:refs/heads/$branch"
          else
            test "$remote_sha" = "$(git rev-parse HEAD)"
            echo "candidate already persisted"
          fi

      - name: Enforce complete final authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .final_authority_pr_v8/AUTHORITY_EXIT.txt
          test "$(cat .final_authority_pr_v8/AUTHORITY_EXIT.txt)" = "0"
