name: GPT QYM verified frontier direct revalidation

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/qym-frontier/QYM_GLOBAL_BEST.lean
      - .github/qym-frontier/GLOBAL_BEST.json
      - .github/workflows/gpt-qym-frontier-revalidate.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-qym-frontier-revalidate-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: false

jobs:
  revalidate:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BRANCH: gpt/fa-qym-clean-final-20260816
      FRONTIER: .github/qym-frontier/QYM_GLOBAL_BEST.lean
      STORED: .github/qym-frontier/GLOBAL_BEST.json
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-frontier-revalidate

    steps:
      - name: Checkout exact frontier commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Detect and gate frontier inputs
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [[ ! -s "$FRONTIER" || ! -s "$STORED" ]]; then
            echo ready=false >> "$GITHUB_OUTPUT"
            printf 'frontier=%s\nstored=%s\n' \
              "$([[ -s "$FRONTIER" ]] && echo yes || echo no)" \
              "$([[ -s "$STORED" ]] && echo yes || echo no)" \
              > "$OUT/NO_FRONTIER.txt"
            exit 0
          fi
          echo ready=true >> "$GITHUB_OUTPUT"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          python3 - "$FRONTIER" "$STORED" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib,json,sys
          source,stored,out=map(Path,sys.argv[1:])
          raw=source.read_bytes();r=json.loads(stored.read_text(encoding='utf-8'))
          sha=hashlib.sha256(raw).hexdigest()
          blob=hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          if sha!=r.get('candidate_qym_sha256'):
              raise SystemExit((sha,r.get('candidate_qym_sha256')))
          expected_blob=r.get('candidate_qym_blob')
          if expected_blob and blob!=expected_blob:
              raise SystemExit((blob,expected_blob))
          if r.get('panic_lines') not in (None,0):
              raise SystemExit('stored frontier has panic')
          (out/'STORED_RESULT.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          (out/'FRONTIER.sha256').write_text(f'{sha}  {source}\n')
          (out/'FRONTIER.blob').write_text(blob+'\n')
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Lean and Mathlib cache
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        if: steps.gate.outputs.ready == 'true'
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure exact dependency objects
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize exact frontier over canonical slot
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"
          cp "$FRONTIER" "$QYM"
          cp "$FRONTIER" "$OUT/QYM.frontier.lean"
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$(awk '{print $1}' "$OUT/FRONTIER.sha256")"

      - name: Full direct Lean recompile of exact frontier
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.frontier.olean" \
              -i "$RUNNER_TEMP/QYM.frontier.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.frontier.olean"
            test -s "$RUNNER_TEMP/QYM.frontier.ilean"
            sha256sum "$RUNNER_TEMP/QYM.frontier.olean" \
              "$RUNNER_TEMP/QYM.frontier.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical and summarize revalidation
        if: always() && steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import collections,hashlib,json,os,re,sys
          out=Path(sys.argv[1]);raw=(out/'QYM.log').read_bytes();text=raw.decode(errors='replace')
          pat=re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$',re.M)
          rows=[]
          for m in pat.finditer(text):
              x=m.groupdict();x['line']=int(x['line']);x['column']=int(x['column']);rows.append(x)
          errors=[x for x in rows if x['severity']=='error'];warnings=[x for x in rows if x['severity']=='warning']
          panics=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$',text)
          rc=int((out/'QYM.exit').read_text().strip())
          stored=json.loads((out/'STORED_RESULT.json').read_text())
          source=(out/'QYM.frontier.lean').read_bytes()
          sha=hashlib.sha256(source).hexdigest();blob=hashlib.sha1(b'blob '+str(len(source)).encode()+b'\0'+source).hexdigest()
          result={'schema':'qym-frontier-direct-revalidation-v1','github_sha':os.environ['GITHUB_SHA'],
                  'candidate_qym_sha256':sha,'candidate_qym_blob':blob,
                  'bytes':len(source),'lf':source.count(b'\n'),'exit':rc,
                  'error_headers':len(errors),'warning_headers':len(warnings),
                  'error_codes':dict(sorted(collections.Counter(x['code'] or 'uncoded' for x in errors).items())),
                  'first_error':errors[0] if errors else None,'last_error':errors[-1] if errors else None,
                  'panic_lines':len(panics),'log_sha256':hashlib.sha256(raw).hexdigest(),
                  'semantic_pass':rc==0 and not errors and not panics,
                  'stored_error_headers':stored.get('error_headers'),
                  'stored_warning_headers':stored.get('warning_headers'),
                  'stored_exit':stored.get('exit')}
          (out/'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in rows))
          (out/'QYM.error-headers.txt').write_text(''.join(
              f"{x['file']}:{x['line']}:{x['column']}: error{('('+x['code']+')') if x['code'] else ''}: {x['message']}\n" for x in errors))
          (out/'QYM.panic-lines.txt').write_text(''.join(x+'\n' for x in panics))
          (out/'REVALIDATION_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          print(json.dumps(result,indent=2,sort_keys=True))
          if result['panic_lines']!=0:raise SystemExit('panic in revalidation')
          # Same environment should not regress. Fewer errors or PASS is accepted and becomes the
          # new authority; a worse result is kept as evidence but cannot replace the frontier.
          stored_errors=stored.get('error_headers')
          if isinstance(stored_errors,int) and result['error_headers']>stored_errors:
              raise SystemExit({'stored':stored_errors,'actual':result['error_headers']})
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable revalidation evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-frontier-revalidation-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-frontier-revalidate/**
          if-no-files-found: warn
          retention-days: 30

      - name: Rebase and persist actual direct result
        if: steps.gate.outputs.ready == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/REVALIDATION_RESULT.json" <<'PY'
          import json,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          assert r['panic_lines']==0
          PY
          git fetch origin "$BRANCH"
          git rebase "origin/$BRANCH"
          python3 - "$OUT/REVALIDATION_RESULT.json" <<'PY'
          import json,os,sys
          r=json.load(open(sys.argv[1],encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'],'a',encoding='utf-8') as env:
              env.write('REVALIDATED_PASS='+('true' if r['semantic_pass'] else 'false')+'\n')
          PY
          if [[ "$REVALIDATED_PASS" = true ]]; then
            cp "$OUT/QYM.frontier.lean" PrimalitySheafVerification/QYM.lean
            mkdir -p .github/qym-final
            cp "$OUT/REVALIDATION_RESULT.json" .github/qym-final/FRONTIER_PASS_RESULT.json
            git add PrimalitySheafVerification/QYM.lean .github/qym-final/FRONTIER_PASS_RESULT.json
            msg='QYM: promote revalidated semantic PASS frontier'
          else
            mkdir -p .github/qym-frontier
            cp "$OUT/QYM.frontier.lean" .github/qym-frontier/QYM_GLOBAL_BEST.lean
            cp "$OUT/REVALIDATION_RESULT.json" .github/qym-frontier/GLOBAL_BEST.json
            cp "$OUT/QYM.error-headers.txt" .github/qym-frontier/QYM_GLOBAL_BEST.error-headers.txt
            cp "$OUT/QYM.diagnostics.jsonl" .github/qym-frontier/QYM_GLOBAL_BEST.diagnostics.jsonl
            cp "$OUT/QYM.panic-lines.txt" .github/qym-frontier/QYM_GLOBAL_BEST.panic-lines.txt
            sha=$(python3 -c 'import json;print(json.load(open("/tmp/qym-frontier-revalidate/REVALIDATION_RESULT.json"))["candidate_qym_sha256"])')
            printf '%s  %s\n' "$sha" .github/qym-frontier/QYM_GLOBAL_BEST.lean > .github/qym-frontier/QYM_GLOBAL_BEST.sha256
            git add .github/qym-frontier
            msg='QYM: persist direct-revalidated frontier and diagnostics'
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if git diff --cached --quiet; then
            echo 'Revalidation evidence unchanged.'
            exit 0
          fi
          git commit -m "$msg"
          git push origin "HEAD:$BRANCH"
