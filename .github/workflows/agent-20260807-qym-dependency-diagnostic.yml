name: Agent action-free QYM dependency diagnostic

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/agent-20260807-qym-dependency-diagnostic.yml'
      - 'PrimalitySheafVerification/Mock2.lean'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: agent-action-free-qym-dependency-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Fetch exact triggering commit without checkout action
        shell: bash
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Static trust scan of the three requested modules
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('PrimalitySheafVerification/Mock2_Advanced.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/QYM.lean'),
          ]
          checks = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'line_start_axiom': r'(?m)^\s*axiom\b',
              'unsafe': r'\bunsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
              'by_contra!': r'\bby_contra!\b',
          }
          def executable(src: str) -> str:
              out=[]; i=0; depth=0; in_string=False; escaped=False
              while i < len(src):
                  if depth:
                      if src.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                      elif src.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                      else: out.append('\n' if src[i]=='\n' else ' '); i+=1
                      continue
                  if in_string:
                      ch=src[i]; out.append('\n' if ch=='\n' else ' ')
                      if escaped: escaped=False
                      elif ch=='\\': escaped=True
                      elif ch=='"': in_string=False
                      i+=1; continue
                  if src.startswith('/-',i): depth=1; out.extend('  '); i+=2
                  elif src.startswith('--',i):
                      while i<len(src) and src[i]!='\n': out.append(' '); i+=1
                  elif src[i]=='"': in_string=True; out.append(' '); i+=1
                  else: out.append(src[i]); i+=1
              if depth or in_string: raise RuntimeError('unterminated comment/string')
              return ''.join(out)
          bad=False
          for path in paths:
              code=executable(path.read_text(encoding='utf-8'))
              print(f'===== {path} =====')
              for name,pat in checks.items():
                  n=len(re.findall(pat,code)); print(f'{name}: {n}'); bad |= n != 0
          if bad: raise SystemExit('forbidden executable token detected')
          PY

      - name: Install exact Lean toolchain without setup action
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version

      - name: Restore Mathlib cache
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Compile Mock2, Advanced and FunctionalAnalysis in dependency order
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$outdir"
          compile_module() {
            local module="$1"
            rm -f "$outdir/${module}.olean" "$outdir/${module}.ilean" "$outdir/${module}.olean.private"
            echo "===== direct compile ${module} ====="
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "$outdir/${module}.olean" -i "$outdir/${module}.ilean" 2>&1 \
              | tee "/tmp/${module}.log"
            local code=${PIPESTATUS[0]}
            set -e
            echo "${module} exit_code=${code}"
            test "$code" -eq 0
            test -s "$outdir/${module}.olean"
            test -s "$outdir/${module}.ilean"
            test "$(grep -c 'error:' "/tmp/${module}.log" || true)" -eq 0
          }
          compile_module Mock2
          compile_module Mock2_Advanced
          compile_module Mock2_FunctionalAnalysis

      - name: Resolve and compile the Integrated dependency
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          target='PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
          echo '===== QYM imports ====='
          grep -nE '^(public )?import ' PrimalitySheafVerification/QYM.lean || true
          echo '===== Integrated references in repository ====='
          grep -RIn --exclude-dir=.git --exclude='*.olean' --exclude='*.ilean' \
            'Mock2_FunctionalAnalysis_Integrated' . || true
          echo '===== candidate Integrated source files ====='
          find PrimalitySheafVerification -maxdepth 1 -type f \
            \( -iname '*functional*integrat*.lean' -o -iname '*integrat*.lean' \) -print
          if [[ ! -f "$target" ]]; then
            echo "ERROR: required source is absent: $target"
            exit 2
          fi
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          rm -f "$outdir/Mock2_FunctionalAnalysis_Integrated.olean" \
                "$outdir/Mock2_FunctionalAnalysis_Integrated.ilean" \
                "$outdir/Mock2_FunctionalAnalysis_Integrated.olean.private"
          lake env lean "$target" \
            -o "$outdir/Mock2_FunctionalAnalysis_Integrated.olean" \
            -i "$outdir/Mock2_FunctionalAnalysis_Integrated.ilean" 2>&1 \
            | tee /tmp/Mock2_FunctionalAnalysis_Integrated.log
          test "${PIPESTATUS[0]}" -eq 0
          test -s "$outdir/Mock2_FunctionalAnalysis_Integrated.olean"
          test -s "$outdir/Mock2_FunctionalAnalysis_Integrated.ilean"

      - name: Compile QYM from deleted project artifacts
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          for pass in 1 2; do
            rm -f "$outdir/QYM.olean" "$outdir/QYM.ilean" "$outdir/QYM.olean.private"
            echo "===== QYM clean compile ${pass}/2 ====="
            set +e
            lake env lean PrimalitySheafVerification/QYM.lean \
              -o "$outdir/QYM.olean" -i "$outdir/QYM.ilean" 2>&1 \
              | tee "/tmp/QYM-pass${pass}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "QYM pass ${pass} exit_code=${code}"
            test "$code" -eq 0
            test -s "$outdir/QYM.olean"
            test -s "$outdir/QYM.ilean"
            test "$(grep -c 'error:' "/tmp/QYM-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "/tmp/QYM-pass${pass}.log"
          done
          sha256sum PrimalitySheafVerification/QYM.lean "$outdir/QYM.olean" "$outdir/QYM.ilean"
