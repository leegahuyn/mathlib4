name: Codex FA487 hpoint unfold strict direct Lean

on:
  push:
    branches:
      - fix/fa487-hpoint-unfold-20260811
    paths:
      - .github/workflows/codex-fa487-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa487-observe-2106a9a
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Publish FA487 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA487 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA486 -> FA487\`\n- upstream_FA486_run: \`31453440057\`\n- upstream_FA486_job: \`93662334422\`\n- upstream_FA486_source: \`280c760fb5efcd330c6b4ca20fd37ca29875d4bbff6eeaf4a1c01b3b3813805d\`\n- frontier: \`35312:4 selectedLogHeightEnergyDensity_continuous / index 2806\`\n- patch: \`unfold logHeightBasePoint; fun_prop\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"
      - name: Run exact FA487 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa487_hpoint_unfold_candidate_ci.sh 2>&1 | tee /tmp/fa487-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report exact FA487 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa487-comment.md
          from pathlib import Path
          import json, os
          out = Path('build-logs/codex-fa487-hpoint-unfold/candidates/norms')
          metric, candidate = out/'METRIC.json', out/'CANDIDATE.json'
          source = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          log = Path('/tmp/fa487-observe.log')
          parts = ['## FA487 observer — actual remote execution','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`",'']
          md = None
          if metric.exists():
              raw = metric.read_text(encoding='utf-8'); parts += ['### METRIC.json','```json',raw[:32000],'```','']
              try: md=json.loads(raw)
              except Exception: pass
          else: parts += ['### METRIC.json','`MISSING`','']
          if candidate.exists(): parts += ['### CANDIDATE.json','```json',candidate.read_text(encoding='utf-8')[:16000],'```','']
          if source.exists():
              lines=source.read_text(encoding='utf-8',errors='replace').splitlines(); center=md.get('FA_first_actual_error_line',35312) if isinstance(md,dict) else 35312
              lo,hi=max(1,center-16),min(len(lines),center+30); parts += [f'### Exact FA487 candidate source around line {center}','```lean','\n'.join(f'{i}: {lines[i-1]}' for i in range(lo,hi+1)),'```','']
          if log.exists(): parts += ['### Tail','```text','\n'.join(log.read_text(encoding='utf-8',errors='replace').splitlines()[-150:])[-18000:],'```']
          print('\n'.join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa487-comment.md)"
      - name: Preserve FA487 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
