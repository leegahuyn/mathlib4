      FA477_VARIANT: upper_ext_h_simp_only
      FA477_EVIDENCE_RUN_ID: "31409787172"
      FA477_EVIDENCE_JOB_ID: "93524786715"
      FA477_EVIDENCE_HEAD_SHA: faf902ceda7cce10ada4399326330effaa4d669b
      FA477_EVIDENCE_ARTIFACT_ID: "9071387258"
