name: Codex FA485 remove redundant ring strict direct Lean

on:
  push:
    branches:
      - fix/fa485-energy-remove-redundant-ring-20260811
    paths:
      - .github/workflows/codex-fa485-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa485-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA485 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA485 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> ... -> FA484 -> FA485\`\n- upstream_FA484_run: \`31452464855\`\n- upstream_FA484_source: \`c4a4dc3bac0d11381071fd11513b175f8eb5f93037e27ed3622bba1a2df26eb6\`\n- frontier: \`35280:8 selectedLogHeightEnergyDensity_le_exp_mul_heightGraphDensity / index 2805\`\n- patch: \`replace redundant ring with comment; rw remains final tactic\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA485 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa485_energy_remove_redundant_ring_candidate_ci.sh 2>&1 | tee /tmp/fa485-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA485 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa485-comment.md
          from pathlib import Path
          import json, os
          out = Path("build-logs/codex-fa485-energy-remove-redundant-ring/candidates/norms")
          metric, candidate = out / "METRIC.json", out / "CANDIDATE.json"
          source = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")
          log = Path("/tmp/fa485-observe.log")
          parts = ["## FA485 observer — actual remote execution", "",
                   f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",
                   f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",
                   f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`", ""]
          md = None
          if metric.exists():
              raw = metric.read_text(encoding="utf-8")
              parts += ["### METRIC.json", "```json", raw[:32000], "```", ""]
              try: md = json.loads(raw)
              except Exception: pass
          else:
              parts += ["### METRIC.json", "`MISSING`", ""]
          if candidate.exists():
              parts += ["### CANDIDATE.json", "```json", candidate.read_text(encoding="utf-8")[:16000], "```", ""]
          if source.exists():
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              center = md.get("FA_first_actual_error_line", 35280) if isinstance(md, dict) else 35280
              lo, hi = max(1, center - 16), min(len(lines), center + 28)
              parts += [f"### Exact FA485 candidate source around line {center}", "```lean",
                        "\n".join(f"{i}: {lines[i-1]}" for i in range(lo, hi+1)), "```", ""]
          if log.exists():
              tail = "\n".join(log.read_text(encoding="utf-8", errors="replace").splitlines()[-140:])
              parts += ["### Tail", "```text", tail[-18000:], "```"]
          print("\n".join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa485-comment.md)"

      - name: Preserve FA485 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
