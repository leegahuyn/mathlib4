      FA483_EVIDENCE_RUN_ID: "31451101943"
      FA483_EVIDENCE_JOB_ID: "93655461634"
      FA483_EVIDENCE_HEAD_SHA: 9ff7ac197487de1f38f63c28d5e52382718738b3
      FA483_EVIDENCE_SOURCE_SHA256: 34756fc6e6c20dab3d2ff5a125934dde7a065fdee57a9c5b6f2381240ee8481d
      FA483_FIRST_ERROR_LINE: "35255"
      FA483_FIRST_ERROR_COL: "37"
      FA483_FRONTIER_DECLARATION: selectedLogHeightEnergyDensity_le_exp_mul_heightGraphDensity
      FA483_FRONTIER_INDEX: "2805"
      FA484_VARIANT: real_norm_eq_abs_bridge
      FA484_EVIDENCE_RUN_ID: "31451815080"
      FA484_EVIDENCE_JOB_ID: "93657549435"
      FA484_EVIDENCE_HEAD_SHA: 5553ea94b57f065f578569b6a75daf184c18b841
      FA484_EVIDENCE_SOURCE_SHA256: c4a4dc3bac0d11381071fd11513b175f8eb5f93037e27ed3622bba1a2df26eb6
      FA484_FIRST_ERROR_LINE: "35280"
      FA484_FIRST_ERROR_COL: "8"
      FA484_FRONTIER_DECLARATION: selectedLogHeightEnergyDensity_le_exp_mul_heightGraphDensity
      FA484_FRONTIER_INDEX: "2805"
      FA485_VARIANT: drop_redundant_ring
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA485 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA485 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480 -> FA481 -> FA482 -> FA483 -> FA484 -> FA485\`\n- upstream_FA484_run: \`31451815080\`\n- upstream_FA484_source: \`c4a4dc3bac0d11381071fd11513b175f8eb5f93037e27ed3622bba1a2df26eb6\`\n- frontier: \`35280:8 selectedLogHeightEnergyDensity_le_exp_mul_heightGraphDensity\`\n- patch: \`replace redundant ring with non-executing comment after closing rw\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA485 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa485_logheight_energy_remove_ring_candidate_ci.sh 2>&1 | tee /tmp/fa485-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA485 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa485-comment.md
          from pathlib import Path
          import json, os
          out = Path("build-logs/codex-fa485-logheight-energy-remove-ring/candidates/norms")
          metric = out / "METRIC.json"
          candidate = out / "CANDIDATE.json"
          log = Path("/tmp/fa485-observe.log")
          source = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")
          parts = [
              "## FA485 observer — actual remote execution", "",
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID', '')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- script_exit: `{os.environ.get('SCRIPT_EXIT', '')}`",
              "- sequence: `FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480 -> FA481 -> FA482 -> FA483 -> FA484 -> FA485`",
              "- variant: `drop_redundant_ring`", "",
          ]
          metric_data = None
          if metric.exists():
              raw = metric.read_text(encoding="utf-8")
              parts += ["### METRIC.json", "```json", raw[:34000], "```", ""]
              try: metric_data = json.loads(raw)
              except Exception: pass
          else:
              parts += ["### METRIC.json", "`MISSING`", ""]
          if candidate.exists():
              parts += ["### CANDIDATE.json", "```json", candidate.read_text(encoding="utf-8")[:17000], "```", ""]
          if source.exists():
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              center = 35280
              if isinstance(metric_data, dict) and isinstance(metric_data.get("FA_first_actual_error_line"), int):
                  center = metric_data["FA_first_actual_error_line"]
              lo, hi = max(1, center - 16), min(len(lines), center + 24)
              snippet = "\n".join(f"{i}: {lines[i-1]}" for i in range(lo, hi + 1))
              parts += [f"### Exact FA485 candidate source around line {center}", "```lean", snippet, "```", ""]
          if log.exists():
              tail = "\n".join(log.read_text(encoding="utf-8", errors="replace").splitlines()[-130:])
              parts += ["### Tail of actual execution log", "```text", tail[-17000:], "```", ""]
          print("\n".join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa485-comment.md)"

      - name: Preserve FA485 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
