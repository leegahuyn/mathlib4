name: Codex FA485 drop redundant ring strict direct Lean

on:
  push:
    branches:
      - fix/fa485-logheight-energy-remove-ring-20260811
    paths:
      - .github/workflows/codex-fa485-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa485-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: minimal_simpa
      FA476_R3_EVIDENCE_RUN_ID: "31407777360"
      FA476_R3_EVIDENCE_ARTIFACT_ID: "9070636218"
