name: Codex FA API probe extendOfNorm identity v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-extendofnorm-identity-v1.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe explicit identity-semilinear arguments
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeExtendIdentity.lean <<'LEAN'
          import Mathlib
          variable {E E' F : Type*}
          variable [AddCommGroup E] [SeminormedAddCommGroup E'] [NormedAddCommGroup F]
          variable [Module ℂ E] [Module ℂ E'] [Module ℂ F]
          variable [CompleteSpace F]
          example (f : E →ₗ[ℂ] F) (e : E →ₗ[ℂ] E') : E' →L[ℂ] F := by
            exact LinearMap.extendOfNorm (𝕜 := ℂ) (𝕜₂ := ℂ)
              (σ₁₂ := RingHom.id ℂ) f e
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeExtendIdentity.lean | tee /tmp/extendofnorm-identity-v1.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-extendofnorm-identity-v1-${{ github.sha }}
          path: /tmp/extendofnorm-identity-v1.log
          if-no-files-found: warn
          retention-days: 7
