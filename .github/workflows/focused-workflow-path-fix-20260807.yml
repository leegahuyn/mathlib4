name: Normalize focused verification workflow proof paths

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-workflow-path-fix-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: normalize-focused-workflow-proof-paths
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Clone exact triggering head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Move generated proof logs outside the Git worktree
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('.github/workflows/focused-m2a-v68-materialize-20260807.yml'),
            Path('.github/workflows/focused-m2a-direct-source-20260807.yml'),
            Path('.github/workflows/focused-functional-analysis-materialize-20260807.yml'),
            Path('.github/workflows/focused-functional-analysis-direct-20260807.yml'),
            Path('.github/workflows/focused-qym-direct-20260807.yml')]
          for p in files:
            s=p.read_text()
            s=s.replace('LOGDIR: focused-proof/', 'LOGDIR: /tmp/focused-proof/')
            s=s.replace("Path('focused-proof/Mock2_Advanced-direct/direct-pass.json')", "Path('/tmp/focused-proof/Mock2_Advanced-direct/direct-pass.json')")
            s=s.replace("Path('focused-proof/FunctionalAnalysis-direct/direct-pass.json')", "Path('/tmp/focused-proof/FunctionalAnalysis-direct/direct-pass.json')")
            s=s.replace("Path('focused-proof/QYM-direct/direct-pass.json')", "Path('/tmp/focused-proof/QYM-direct/direct-pass.json')")
            p.write_text(s)
          PY
          git diff --check
          test "$(git diff --name-only | wc -l)" -eq 5
          ! grep -R '^      LOGDIR: focused-proof/' .github/workflows/focused-*20260807.yml

      - name: Commit normalized workflows with race guard
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "$remote_head" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/workflows/focused-m2a-v68-materialize-20260807.yml \
            .github/workflows/focused-m2a-direct-source-20260807.yml \
            .github/workflows/focused-functional-analysis-materialize-20260807.yml \
            .github/workflows/focused-functional-analysis-direct-20260807.yml \
            .github/workflows/focused-qym-direct-20260807.yml
          git commit -m 'ci: keep focused proof logs outside source worktree'
          git push origin "HEAD:${BRANCH}"
