name: Codex FA dynamic run locator

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-run-locator.yml
  workflow_dispatch:

permissions:
  actions: read
  statuses: write
  contents: read

env:
  TARGET_SHA: "71992e1974bc3295fbf4e5f686087a87c1bf4c7d"
  TARGET_WORKFLOW: "codex-fa-frontier-extended-2967.yml"
  TARGET_CONTEXT: "codex/fa-frontier-extended-2967-locator"

jobs:
  locate:
    runs-on: ubuntu-24.04
    steps:
      - name: Locate target run and publish commit status
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          gh api "repos/${GITHUB_REPOSITORY}/actions/workflows/${TARGET_WORKFLOW}/runs?head_sha=${TARGET_SHA}&event=push&per_page=20" > /tmp/runs.json
          python3 - <<'PY' > /tmp/status.env
          import json, os
          data = json.load(open('/tmp/runs.json'))
          runs = [r for r in data.get('workflow_runs', []) if r.get('head_sha') == os.environ['TARGET_SHA']]
          if not runs:
              raise SystemExit('no matching target push run found')
          run = max(runs, key=lambda r: int(r['id']))
          status = run.get('status') or 'unknown'
          conclusion = run.get('conclusion') or 'none'
          if status != 'completed':
              state = 'pending'
          elif conclusion == 'success':
              state = 'success'
          elif conclusion in {'failure', 'cancelled', 'timed_out', 'action_required'}:
              state = 'failure'
          else:
              state = 'error'
          print('RUN_ID=' + str(run['id']))
          print('RUN_STATUS=' + status)
          print('RUN_CONCLUSION=' + conclusion)
          print('STATE=' + state)
          PY
          source /tmp/status.env
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state="$STATE" \
            -f context="$TARGET_CONTEXT" \
            -f description="run=${RUN_ID} status=${RUN_STATUS} conclusion=${RUN_CONCLUSION}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}" > /tmp/status.json
          cat /tmp/status.json
