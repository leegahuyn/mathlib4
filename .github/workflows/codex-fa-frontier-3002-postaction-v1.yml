name: Codex FA post-action 2980-3002 v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-3002-postaction-v1.yml
      - scripts/fa_dynamic_cluster_2980_3002_v1.json
      - scripts/fa_dynamic_action_cluster_2953_2967_v3.json
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-postaction-2980-3002-v1
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31517228871"
  BASE_JOB_ID: "93865300918"
  BASE_HEAD_SHA: "07a6e66dbbfac99a4ab58f02084fca8ef6109d59"
  BASE_ARTIFACT_ID: "9111890659"
  BASE_ARTIFACT_NAME: "codex-fa-action-cluster-2953-2967-v2-07a6e66dbbfac99a4ab58f02084fca8ef6109d59"
  BASE_ARTIFACT_SIZE: "1093867"
  BASE_ARTIFACT_DIGEST: "sha256:507836b15d24271461f21fc092253e4d8d40407113d93e8808f771c1eec51620"
  BASE_SOURCE_SHA256: "c6dcb06320c09036b8810944c5f4e0f35e467783427df6fd8d5c29576b18d679"
  BASE_SOURCE_BYTES: "2705090"
  BASE_SOURCE_LINES: "60641"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested v2 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-postaction-2980-3002-v1
          mkdir -p "$OUT" /tmp/fa-postaction-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-postaction-base.zip
          unzip -q /tmp/fa-postaction-base.zip -d /tmp/fa-postaction-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-postaction-2980-3002-v1'); run=json.loads((out/'base-run.json').read_text()); job=json.loads((out/'base-job.json').read_text()); art=json.loads((out/'base-artifact.json').read_text()); z=Path('/tmp/fa-postaction-base.zip').read_bytes()
          checks={'run_id':run.get('id')==int(os.environ['BASE_RUN_ID']),'run_head':run.get('head_sha')==os.environ['BASE_HEAD_SHA'],'run_completed_failure':run.get('status')=='completed' and run.get('conclusion')=='failure','job_id':job.get('id')==int(os.environ['BASE_JOB_ID']),'job_run':job.get('run_id')==int(os.environ['BASE_RUN_ID']),'job_completed_failure':job.get('status')=='completed' and job.get('conclusion')=='failure','artifact_id':art.get('id')==int(os.environ['BASE_ARTIFACT_ID']),'artifact_name':art.get('name')==os.environ['BASE_ARTIFACT_NAME'],'artifact_size':art.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']),'artifact_digest':art.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'],'artifact_live':art.get('expired') is False,'archive_digest':'sha256:'+hashlib.sha256(z).hexdigest()==os.environ['BASE_ARTIFACT_DIGEST']}
          if not all(checks.values()): raise SystemExit('base attestation failed: '+repr([k for k,v in checks.items() if not v]))
          valid=[]
          for p in Path('/tmp/fa-postaction-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: valid.append(p)
          if not valid: raise SystemExit('exact direct-tested v2 source missing')
          p=min(valid,key=lambda x:(len(x.parts),x.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY

      - name: Apply canonical action cancellation and 2980-3002 cluster
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-postaction-2980-3002-v1
          python3 scripts/fa_dynamic_apply_staged_library.py --base-source "$(cat "$OUT/BASE_SOURCE.txt")" --library scripts/fa_dynamic_action_cluster_2953_2967_v3.json --no-environment --target /tmp/fa-postaction-v3.lean --audit-out "$OUT/AUDIT_ACTION_V3.json"
          python3 scripts/fa_dynamic_apply_staged_library.py --base-source /tmp/fa-postaction-v3.lean --library scripts/fa_dynamic_cluster_2980_3002_v1.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/AUDIT_2980_3002.json"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-postaction-2980-3002-v1'); a1=json.loads((out/'AUDIT_ACTION_V3.json').read_text()); a2=json.loads((out/'AUDIT_2980_3002.json').read_text()); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes()
          if not (a1['public_declaration_headers_preserved'] and a1['declaration_sequence_preserved'] and a2['public_declaration_headers_preserved'] and a2['declaration_sequence_preserved']): raise SystemExit('semantic audit failed')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write('CANDIDATE_SHA='+hashlib.sha256(b).hexdigest()+'\nCANDIDATE_BYTES='+str(len(b))+'\nCANDIDATE_LINES='+str(len(b.decode().splitlines()))+'\n')
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-postaction-2980-3002-v1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain-install.log" 2>&1; lean --version | tee "$OUT/lean-version.txt"; lake --version | tee "$OUT/lake-version.txt"; lake exe cache get > "$OUT/cache-get.log" 2>&1

      - name: Direct full-source compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-postaction-2980-3002-v1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() { stem="$1"; cap="$2"; src="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$cap" "$o" "$i" "$src" > "$OUT/${stem}.command"; : > "$OUT/${stem}.executed"; set +e; lake env lean "-DmaxErrors=${cap}" -DwarningAsError=false -o "$o" -i "$i" "$src" > "$OUT/${stem}.log" 2>&1; c=$?; set -e; echo "$c" > "$OUT/${stem}.exit"; }
          compile_one Mock2 3; compile_one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"; test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"; test "$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_LINES"
          compile_one Mock2_FunctionalAnalysis 128
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-postaction-2980-3002-v1'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); metric={'schema':'fa-postaction-2980-3002-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'maxErrors_cap':128}; (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-postaction-2980-3002-v1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-postaction-2980-3002-v1
          if-no-files-found: warn
          retention-days: 30

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86
          exit "$FA_EXIT"
