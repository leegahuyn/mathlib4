name: PASS 398 cancel obsolete repair runs

on:
  push:
    branches:
      - fix/fa398-self-dispatch-priority-loop-20260809
    paths:
      - '.github/workflows/fa398-cancel-obsolete-runs.yml'
  workflow_dispatch:

permissions:
  actions: write
  contents: read

jobs:
  cancel-obsolete:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel queued and running PASS 391-397 experiments
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import urllib.parse
          import urllib.request

          repo = os.environ['GITHUB_REPOSITORY']
          token = os.environ['GH_TOKEN']
          current_run = int(os.environ['GITHUB_RUN_ID'])
          obsolete_prefixes = tuple(
              f'fix/fa{n}' for n in range(391, 398)
          )

          def request(url: str, method: str = 'GET'):
              req = urllib.request.Request(
                  url,
                  method=method,
                  headers={
                      'Authorization': f'Bearer {token}',
                      'Accept': 'application/vnd.github+json',
                      'X-GitHub-Api-Version': '2022-11-28',
                  },
              )
              with urllib.request.urlopen(req, timeout=60) as response:
                  payload = response.read()
                  return response.status, json.loads(payload) if payload else None

          cancelled = []
          for status in ('queued', 'in_progress'):
              url = (
                  f'https://api.github.com/repos/{repo}/actions/runs?'
                  + urllib.parse.urlencode({'status': status, 'per_page': 100})
              )
              _, data = request(url)
              for run in data.get('workflow_runs', []):
                  run_id = int(run['id'])
                  branch = run.get('head_branch') or ''
                  name = run.get('name') or ''
                  if run_id == current_run:
                      continue
                  obsolete = branch.startswith(obsolete_prefixes) or any(
                      f'PASS {n}' in name for n in range(391, 398)
                  )
                  if not obsolete:
                      continue
                  try:
                      code, _ = request(
                          f'https://api.github.com/repos/{repo}/actions/runs/{run_id}/cancel',
                          method='POST',
                      )
                      if code in (202, 204):
                          cancelled.append({'id': run_id, 'branch': branch, 'name': name})
                  except Exception as exc:
                      print(f'cancel failed {run_id}: {exc}')
          print(json.dumps({'cancelled': cancelled}, indent=2))
          PY
