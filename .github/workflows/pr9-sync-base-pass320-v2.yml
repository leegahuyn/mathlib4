name: PR9 synchronize latest PASS 320 base v2

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pr9-sync-base-pass320-v2.yml'
      - 'scripts/pr9_sync_base_pass320_v2.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pr9-sync-base-pass320
  cancel-in-progress: true

jobs:
  synchronize:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact PR9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Synchronize latest repair base without touching master
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pr9_sync_base_pass320_v2.sh

      - name: Upload synchronization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-branch-sync-${{ github.sha }}
          path: build-logs/pr9-branch-sync-status.txt
          if-no-files-found: warn
          retention-days: 30
