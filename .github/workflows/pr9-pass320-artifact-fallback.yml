name: PR9 PASS 320 artifact fallback

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pr9-pass320-artifact-fallback.yml'
      - 'build-logs/PR9_ADAPTIVE_POST320_FA_QYM_FAIL'
      - 'scripts/pr9_pass320_artifact_fallback.sh'

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: pr9-pass320-artifact-fallback
  cancel-in-progress: true

jobs:
  fallback:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GITHUB_TOKEN: ${{ github.token }}
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout PR9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Guard open unmerged draft PR9
        shell: bash
        run: |
          set -euo pipefail
          gh api "/repos/${GITHUB_REPOSITORY}/pulls/9" > /tmp/pr9-fallback-state.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pr9-fallback-state.json',encoding='utf-8'))
          assert p['state']=='open',p
          assert p['merged'] is False,p
          assert p['draft'] is True,p
          assert p['head']['ref']=='ci/fa319-isolated-20260807',p
          assert p['base']['ref']=='fix/primality-sheaf-clean-build',p
          PY

      - name: Synchronize latest repair base
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/pr9_sync_base_pass320_v2.sh

      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Try only exact PASS 320 artifact candidates
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/pr9_pass320_artifact_fallback.sh

      - name: Persist and comment fallback result
        if: always()
        shell: bash
        run: |
          set -uo pipefail
          evidence='/tmp/pr9-pass320-artifact-fallback'
          status='build-logs/pr9-pass320-artifact-fallback-status.txt'
          mkdir -p build-logs "${evidence}"
          if [[ -s "${evidence}/status.txt" ]] && grep -q 'artifact fallback PASS' "${evidence}/status.txt"; then
            result='success'
          elif [[ -e build-logs/PR9_ADAPTIVE_POST320_FA_QYM_PASS ]]; then
            result='skipped-adaptive-already-passed'
          else
            result='failure'
          fi
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "result=${result}"
            echo "authority_run=31159696948"
            echo "authority_job=92827136991"
            echo
            cat "${evidence}/status.txt" 2>/dev/null || true
            echo
            cat "${evidence}/selection.txt" 2>/dev/null || true
            echo
            cat "${evidence}/compile-summary.csv" 2>/dev/null || true
            echo
            find "${evidence}/logs" -type f -name '*.errors.txt' -print0 2>/dev/null \
              | sort -z | while IFS= read -r -d '' f; do
                  echo "===== ${f} ====="
                  sed -n '1,160p' "${f}"
                done
          } > /tmp/pr9-fallback-status.txt
          git fetch --no-tags origin "+refs/heads/ci/fa319-isolated-20260807:refs/remotes/origin/ci/fa319-isolated-20260807" || true
          git reset --hard origin/ci/fa319-isolated-20260807
          cp /tmp/pr9-fallback-status.txt "${status}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${status}"
          if ! git diff --cached --quiet; then
            git commit -m "ci: record PR9 PASS 320 artifact fallback ${result}"
            git push origin HEAD:ci/fa319-isolated-20260807 || true
          fi
          comment='/tmp/pr9-fallback-comment.md'
          {
            echo '<!-- pr9-pass320-artifact-fallback -->'
            echo '## PR #9 PASS 320 artifact fallback'
            echo
            echo "- Result: **${result}**"
            echo '- Authority: `31159696948 / 92827136991`'
            echo
            echo '```text'
            sed -n '1,260p' /tmp/pr9-fallback-status.txt
            echo '```'
          } > "${comment}"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/9/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- pr9-pass320-artifact-fallback -->")) | .id' | tail -1)"
          if [[ -n "${existing}" ]]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" -F body=@"${comment}" >/dev/null || true
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/9/comments" -F body=@"${comment}" >/dev/null || true
          fi

      - name: Upload fallback evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-pass320-artifact-fallback-${{ github.run_id }}
          path: |
            /tmp/pr9-fallback-state.json
            /tmp/pr9-pass320-artifact-fallback
            /tmp/pr9-fallback-status.txt
            /tmp/pr9-fallback-comment.md
            build-logs/pr9-pass320-artifact-fallback-status.txt
          if-no-files-found: warn
          retention-days: 30
