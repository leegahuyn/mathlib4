name: Priority three-stage Mock2 Advanced FunctionalAnalysis QYM

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-three-stage-m2a-fa-qym.yml'
      - 'scripts/priority_stage1_advanced.sh'
      - 'scripts/priority_stage2_fa.sh'
      - 'scripts/priority_stage3_qym.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: priority-three-stage-m2a-fa-qym
  cancel-in-progress: false

env:
  BRANCH: fix/primality-sheaf-clean-build

jobs:
  advanced:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Clone latest branch
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lake" exe cache get
      - name: Materialize and directly verify Mock2 Advanced
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage1_advanced.sh

  functional-analysis:
    needs: advanced
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Clone latest branch after Advanced PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lake" exe cache get
      - name: Materialize and directly verify FunctionalAnalysis
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage2_fa.sh

  qym:
    needs: functional-analysis
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Clone latest branch after FunctionalAnalysis PASS
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lake" exe cache get
      - name: Directly verify Integrated and QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_stage3_qym.sh
