name: GPT QYM GB76 V16 smooth-atlas instance binder

on:
  push:
    branches:
      - gpt/qym-gb76-v16-smooth-atlas-instance-20260820
    paths:
      - .github/workflows/gpt-qym-gb76-v16-instance-binder.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-gb76-v16-instance-binder
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb76-v16-smooth-atlas-instance-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  BASE_ERRORS: '76'
  BASE_WARNINGS: '358'
  BASE_SHA256: fada22264b6618467f89d436ddacff27453db1242769717d5e7a386682d4efb3
  BASE_BLOB: 29d446743036dccd5d9ad8757c351b39d526cfa9
  EXPECTED_CANDIDATE_SHA256: 7ee25cfadbb1e9ca872ae7648830adb1ba67a3e6c4b52e197c561d0d73c8cb49
  EXPECTED_CANDIDATE_BLOB: 1a6a08d254ba2c81ea36c0c7220989facfdad7e8
  SOURCE_RUN_ID: '32281700927'
  SOURCE_ARTIFACT_ID: '9377474435'
  VARIANT: instance_binder
  OUT_ROOT: /tmp/qym-gb76-v16

jobs:
  candidate:
    name: V16-instance-binder
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Recover and gate exact verified GB76 source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          mkdir -p /tmp/qym-gb76-source .github/qym-frontier "$OUT_ROOT/$VARIANT" "$OLEAN"
          curl --retry 8 --retry-all-errors --fail --silent --show-error -L \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/leegahuyn/mathlib4/actions/artifacts/$SOURCE_ARTIFACT_ID/zip" \
            -o /tmp/qym-gb76-source.zip
          unzip -q /tmp/qym-gb76-source.zip -d /tmp/qym-gb76-source
          result=/tmp/qym-gb76-source/RESULT.json
          source=/tmp/qym-gb76-source/QYM.candidate.lean
          test -s "$result"
          test -s "$source"
          test "$(jq -r '.run_id' "$result")" = "$SOURCE_RUN_ID"
          test "$(jq -r '.variant' "$result")" = normsq_simp_then_rw
          test "$(jq -r '.full_compile_executed' "$result")" = true
          test "$(jq -r '.strict_improvement' "$result")" = true
          test "$(jq -r '.error_headers' "$result")" -eq "$BASE_ERRORS"
          test "$(jq -r '.warning_headers' "$result")" -eq "$BASE_WARNINGS"
          test "$(jq -r '.panic_lines' "$result")" -eq 0
          test "$(jq '[.forbidden[]] | add' "$result")" -eq 0
          test "$(sha256sum "$source" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$source")" = "$BASE_BLOB"
          test "$(jq -r '.candidate_qym_sha256' "$result")" = "$BASE_SHA256"
          test "$(jq -r '.candidate_qym_blob' "$result")" = "$BASE_BLOB"
          cp "$source" "$QYM"
          cp "$source" .github/qym-frontier/QYM_GB76_RUNTIME.lean
          cp "$result" "$OUT_ROOT/$VARIANT/GB76_SOURCE_RESULT.json"
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          cmp -s "$QYM" .github/qym-frontier/QYM_GB76_RUNTIME.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="$OUT_ROOT/$VARIANT"
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          test "$tc" = leanprover/lean4:v4.33.0-rc1
          for attempt in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break
            sleep $((attempt * 5))
          done
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          for attempt in 1 2 3 4 5; do
            lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break
            sleep $((attempt * 5))
          done

      - name: Restore completed QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure dependency objects are complete
        shell: bash
        run: |
          set -euo pipefail
          OUT="$OUT_ROOT/$VARIANT"
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                max_errors=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Retarget the proven candidate runner to GB76 and prepare V16 patcher
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('.github/qym_gb77_v14b_candidate.py')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'SIDECAR = Path(".github/qym-frontier/QYM_GB77_BEST.lean")':
                  'SIDECAR = Path(".github/qym-frontier/QYM_GB76_RUNTIME.lean")',
              'NEW_PATCHER = Path(".github/qym_patch_gb77_v15.py")':
                  'NEW_PATCHER = Path(".github/qym_patch_gb76_v16.py")',
              'BASE_SHA = "b6f0126c27dfc08b5f81c306a7140f9531fcc3d6ca6b75dd8abbd71101d458fd"':
                  'BASE_SHA = "fada22264b6618467f89d436ddacff27453db1242769717d5e7a386682d4efb3"',
              'BASE_BLOB = "c6e8883353b350f22b7f48d955fc5cfa4e61f88f"':
                  'BASE_BLOB = "29d446743036dccd5d9ad8757c351b39d526cfa9"',
              'BASE_ERRORS = 77': 'BASE_ERRORS = 76',
              'BASE_WARNINGS = 360': 'BASE_WARNINGS = 358',
              'TARGET = "theorem conj_mul_hyperbolicRightNormal_im"':
                  'TARGET = "section ConditionalSmoothAtlas"',
              'TARGET_END = "/-! ## 2. The actual geometric normal"':
                  'TARGET_END = "/-! ## 6. The remaining cusp-collar datum"',
              'NEXT_DECL = "def actualOutwardHyperbolicUnitNormal"':
                  'NEXT_DECL = "def CuspCollarResidual"',
          }
          for old, new in replacements.items():
              if text.count(old) != 1:
                  raise SystemExit(f'runner retarget mismatch for: {old}')
              text = text.replace(old, new)
          text, count = re.subn(
              r'OLD_VARIANTS = \{.*?\}\nNEW_VARIANTS = \{.*?\}',
              'OLD_VARIANTS = set()\nNEW_VARIANTS = {"instance_binder"}',
              text,
              count=1,
              flags=re.S,
          )
          if count != 1:
              raise SystemExit('runner variant-set retarget failed')
          path.write_text(text, encoding='utf-8')
          PY

          cat > .github/qym_patch_gb76_v16.py <<'PY'
          #!/usr/bin/env python3
          from __future__ import annotations

          from pathlib import Path
          import hashlib
          import json
          import re
          import sys

          BASE_SHA256 = "fada22264b6618467f89d436ddacff27453db1242769717d5e7a386682d4efb3"
          BASE_BLOB = "29d446743036dccd5d9ad8757c351b39d526cfa9"
          EXPECTED_SHA256 = "7ee25cfadbb1e9ca872ae7648830adb1ba67a3e6c4b52e197c561d0d73c8cb49"
          EXPECTED_BLOB = "1a6a08d254ba2c81ea36c0c7220989facfdad7e8"
          VARIANT = "instance_binder"

          def sha256(data: bytes) -> str:
              return hashlib.sha256(data).hexdigest()

          def git_blob(data: bytes) -> str:
              return hashlib.sha1(b"blob " + str(len(data)).encode() + b"\0" + data).hexdigest()

          def audit(text: str) -> dict[str, int]:
              return {
                  "sorry": len(re.findall(r"\bsorry\b", text)),
                  "admit": len(re.findall(r"\badmit\b", text)),
                  "unsafe": len(re.findall(r"(?m)^\s*unsafe\s+", text)),
                  "native_decide": len(re.findall(r"\bnative_decide\b", text)),
                  "Lean.ofReduceBool": text.count("Lean.ofReduceBool"),
                  "global_axiom": len(re.findall(r"(?m)^\s*axiom\s+", text)),
                  "maxHeartbeats_zero": len(re.findall(r"set_option\s+maxHeartbeats\s+0\b", text)),
              }

          def main() -> None:
              if len(sys.argv) != 4 or sys.argv[1] != VARIANT:
                  raise SystemExit(f"usage: {Path(sys.argv[0]).name} {VARIANT} INPUT_QYM OUTPUT_QYM")
              source_path = Path(sys.argv[2])
              output_path = Path(sys.argv[3])
              before = source_path.read_bytes()
              if sha256(before) != BASE_SHA256 or git_blob(before) != BASE_BLOB:
                  raise SystemExit(f"GB76 authority mismatch: sha={sha256(before)} blob={git_blob(before)}")
              text = before.decode("utf-8")
              old = "variable (hSmooth : SmoothTransitionResidual)"
              new = "variable [hSmooth : SmoothTransitionResidual]"
              if text.count(old) != 1:
                  raise SystemExit(f"expected one explicit hSmooth binder, found {text.count(old)}")
              before_audit = audit(text)
              patched = text.replace(old, new)
              after_audit = audit(patched)
              if after_audit != before_audit or any(after_audit.values()):
                  raise SystemExit(f"forbidden-token audit changed {before_audit} -> {after_audit}")
              output_path.parent.mkdir(parents=True, exist_ok=True)
              output_path.write_text(patched, encoding="utf-8")
              after = output_path.read_bytes()
              if sha256(after) != EXPECTED_SHA256 or git_blob(after) != EXPECTED_BLOB:
                  raise SystemExit(f"deterministic candidate mismatch: sha={sha256(after)} blob={git_blob(after)}")
              marker = "section ConditionalSmoothAtlas"
              line = patched.count("\n", 0, patched.index(marker)) + 1
              print(json.dumps({
                  "schema": "qym-gb76-v16-instance-binder-candidate-v1",
                  "status": "PREPARED_UNVERIFIED",
                  "variant": VARIANT,
                  "baseline_error_headers": 76,
                  "input_sha256": BASE_SHA256,
                  "input_blob": BASE_BLOB,
                  "candidate_sha256": sha256(after),
                  "candidate_blob": git_blob(after),
                  "target_cluster": "ConditionalSmoothAtlas instances",
                  "target_start_line": line,
                  "forbidden": after_audit,
                  "bytes": len(after),
                  "lf": after.count(b"\n"),
              }, indent=2, sort_keys=True))

          if __name__ == "__main__":
              main()
          PY

          python3 -m py_compile \
            .github/qym_patch_gb76_v16.py \
            .github/qym_gb77_v14b_candidate.py

      - name: Run target gate and authoritative full-QYM direct Lean when eligible
        shell: bash
        run: python3 -B .github/qym_gb77_v14b_candidate.py "$VARIANT"

      - name: Print compact V16 evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          result="$OUT_ROOT/$VARIANT/RESULT.json"
          if [[ -s "$result" ]]; then
            jq '{schema,run_id,branch,variant,baseline_error_headers,candidate_qym_sha256,candidate_qym_blob,forbidden,local_gate_pass,first_blocker_advanced,full_compile_executed,exit,error_headers,warning_headers,panic_lines,first_error,strict_improvement,semantic_pass,local:{exit:.local.exit,error_headers:.local.error_headers,warning_headers:.local.warning_headers,panic_lines:.local.panic_lines,first_error:.local.first_error}}' "$result"
          else
            echo 'RESULT.json not produced'
          fi

      - name: Upload immutable V16 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb76-v16-${{ env.VARIANT }}-${{ github.run_id }}
          path: ${{ env.OUT_ROOT }}/${{ env.VARIANT }}
          if-no-files-found: error
          retention-days: 30
