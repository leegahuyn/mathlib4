name: Capture PASS 326 FunctionalAnalysis candidate

on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

jobs:
  capture:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout selected ref
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 64
          persist-credentials: false

      - name: Reconstruct exact PASS 326 candidate
        shell: bash
        run: |
          set -euo pipefail
          bash scripts/capture_pass326_fa_candidate.sh

      - name: Upload exact PASS 326 source
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass326-fa-candidate-${{ github.sha }}
          path: /tmp/capture-pass326-fa-candidate
          if-no-files-found: error
          retention-days: 90
