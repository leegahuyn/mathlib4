name: Focused candidate materialization pipeline v3

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-candidate-pipeline-v3-20260807.yml'
      - 'scripts/focused_materialize_pipeline_20260807.sh'
      - 'scripts/focused_source_audit_20260807.py'
      - 'scripts/repair_mock2_advanced_v6*.py'
      - 'scripts/apply_*_pass_repairs.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-candidate-materialization-v3
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 480
    env:
      BRANCH: fix/primality-sheaf-clean-build
      FOCUSED_LOGDIR: /tmp/focused-proof/candidate-v3
      FOCUSED_MARKER_OUT: /tmp/focused_candidate_v3.json
      FOCUSED_BUNDLE_OUT: /tmp/focused-candidate-v3-proof.tar.gz
      CANDIDATE_MARKER: .ci/focused/focused_candidate_v3.json

    steps:
      - name: Clone exact triggering branch head without checkout action
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')" = "${GITHUB_SHA}"
          git status --porcelain=v1 | tee /tmp/focused-initial-status.txt
          test ! -s /tmp/focused-initial-status.txt

      - name: Install exact Lean toolchain without setup action
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Run ordered M2A, FunctionalAnalysis, Integrated, QYM candidate agent
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/focused_materialize_pipeline_20260807.sh

      - name: Upload candidate proof artifact before source materialization
        uses: actions/upload-artifact@v4
        with:
          name: focused-candidate-v3-${{ github.sha }}
          path: /tmp/focused-candidate-v3-proof.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Materialize only twice-verified focused sources and provenance marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${CANDIDATE_MARKER}")"
          cp /tmp/focused_candidate_v3.json "${CANDIDATE_MARKER}"
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed = {
              'PrimalitySheafVerification/Mock2_Advanced.lean',
              'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean',
              'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean',
              '.ci/focused/focused_candidate_v3.json',
          }
          raw = subprocess.check_output(['git','status','--porcelain=v1'], text=True)
          seen = set()
          for line in raw.splitlines():
              path = line[3:]
              if ' -> ' in path:
                  path = path.split(' -> ', 1)[1]
              seen.add(path)
          bad = sorted(seen - allowed)
          if bad:
              raise SystemExit('unexpected candidate changes: ' + ', '.join(bad))
          PY
          verified_head="$(git rev-parse HEAD)"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add \
            PrimalitySheafVerification/Mock2_Advanced.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            "${CANDIDATE_MARKER}"
          test -n "$(git diff --cached --name-only)"
          git commit -m 'fix: materialize focused M2A FunctionalAnalysis QYM candidate'

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${verified_head}" ]]; then
            git fetch origin "${BRANCH}"
            critical="$(git diff --name-only "${verified_head}" "${remote_head}" | grep -E \
              '^(PrimalitySheafVerification/(Mock2|Mock2_Advanced|Mock2_FunctionalAnalysis|Mock2_FunctionalAnalysis_Integrated|QYM)\.lean|lean-toolchain|lakefile\.lean|lake-manifest\.json|scripts/(repair_mock2_advanced_v6[1-8]|apply_.*_pass_repairs|focused_materialize_pipeline_20260807|focused_source_audit_20260807)\.(py|sh))$' \
              || true)"
            if [[ -n "${critical}" ]]; then
              printf '%s\n' "${critical}" >&2
              echo 'A concurrent commit changed a verified source or repair input; refusing stale materialization.' >&2
              exit 1
            fi
            git rebase "${remote_head}"
          fi
          git push origin "HEAD:${BRANCH}"
