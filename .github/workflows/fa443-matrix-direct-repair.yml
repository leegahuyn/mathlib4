name: FA443 repaired direct Lean candidate matrix

on:
  push:
    branches:
      - fix/fa443-matrix-direct-repair-20260810
    paths:
      - .github/workflows/fa443-matrix-direct-repair.yml
      - scripts/fa443_*.py
      - build-logs/fa443-matrix/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa443-repaired-direct-matrix
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa443-matrix-direct-repair-20260810
  BASELINE_COMMIT: b7c8159cc3de07dbe455b9d3979e043e18e20886
  BASELINE_SHA256: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
  EXPECTED_LINES: '60453'

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant:
          - baseline
          - slope_only
          - slope_structures
          - slope_change_convert
          - slope_paired_parenthesized
          - slope_paired_dot
          - slope_paired_parenthesized_ring
          - slope_paired_parenthesized_ring_height
          - slope_paired_parenthesized_ring_height_upper
          - slope_paired_parenthesized_ring_height_upper_tail
          - slope_paired_parenthesized_ring_height_upper_tail_zero
          - slope_paired_parenthesized_all_known
          - slope_paired_dot_all_known
          - slope_structures_paired_all_known
          - slope_change_convert_paired_all_known
          - slope_paired_parenthesized_deep_simp
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '80'
    steps:
      - name: Checkout immutable workflow trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: false

      - name: Restore exact checked-in 31726 baseline source
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          if ! git cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          fi
          git show "${BASELINE_COMMIT}:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            > /tmp/fa443-baseline.lean
          actual=$(sha256sum /tmp/fa443-baseline.lean | awk '{print $1}')
          lines=$(python3 - <<'PY'
          from pathlib import Path
          data=Path('/tmp/fa443-baseline.lean').read_bytes()
          print(data.count(b'\n') + (0 if data.endswith(b'\n') else 1))
          PY
          )
          test "$actual" = "$BASELINE_SHA256"
          test "$lines" = "$EXPECTED_LINES"
          cp /tmp/fa443-baseline.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          printf 'baseline_commit=%s\nbaseline_sha256=%s\nline_count=%s\nworkflow_trigger_sha=%s\n' \
            "$BASELINE_COMMIT" "$actual" "$lines" "$GITHUB_SHA" \
            > "$d/BASELINE_IDENTITY.txt"

      - name: Install pinned Lean and Mathlib cache for every candidate
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Generate same-height candidate and verify immutable header
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          python3 scripts/fa442_prepare_same_height_candidate.py \
            --variant "$VARIANT" --output-dir "$d" \
            > "$d/prepare.log" 2>&1
          rc=$?
          cat "$d/prepare.log"
          printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            touch "$d/PREPARE_FAILED"
          fi
          exit 0

      - name: Execute direct Lean CLI for Mock2 Mock2 Advanced and candidate FA
        if: always()
        env:
          PREPARE_OK: ${{ steps.prepare.outputs.ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          compile_one() {
            local stem=$1
            local src="PrimalitySheafVerification/${stem}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false \
              -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"
            printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" \
              > "$d/${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" \
              > "$d/${stem}.ilean.size"
            return 0
          }

          if test "${PREPARE_OK:-false}" = true; then
            compile_one Mock2
            compile_one Mock2_Advanced
            compile_one Mock2_FunctionalAnalysis
          else
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
              printf 'not executed because candidate preparation failed\n' \
                > "$d/${stem}.log"
              printf '125' > "$d/${stem}.exit"
              printf '0' > "$d/${stem}.olean.size"
              printf '0' > "$d/${stem}.ilean.size"
              printf 'INFRA: direct Lean command unavailable because preparation failed\n' \
                > "$d/${stem}.command.txt"
            done
          fi

          export PREPARE_OK="${PREPARE_OK:-false}"
          python3 scripts/fa443_record_direct_metric.py \
            > "$d/metric-console.log" 2>&1
          metric_rc=$?
          cat "$d/metric-console.log"
          printf '%s' "$metric_rc" > "$d/metric.exit"
          exit 0

      - name: Upload candidate source and complete direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa443-candidate-${{ matrix.variant }}
          path: build-logs/fa443-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '120'
    steps:
      - name: Checkout immutable workflow trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Configure Git identity before any selector or evidence operation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Select only from a complete current-run direct Lean matrix
        id: select
        shell: bash
        run: |
          set +e
          mkdir -p build-logs/fa443-matrix/selected
          python3 scripts/fa443_select_direct_champion.py \
            > build-logs/fa443-matrix/selected/selector-console.log 2>&1
          rc=$?
          cat build-logs/fa443-matrix/selected/selector-console.log
          printf '%s' "$rc" > build-logs/fa443-matrix/selected/selector.exit
          if test "$rc" -ne 0; then
            echo 'selector_ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Install pinned Lean and Mathlib cache for independent confirmation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa443-matrix/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee build-logs/fa443-matrix/selected/lean-version.txt
          lake --version | tee build-logs/fa443-matrix/selected/lake-version.txt
          lake exe cache get | tee build-logs/fa443-matrix/selected/cache-get.log

      - name: Independently direct-compile selected source on repository path
        id: confirm
        if: steps.select.outputs.selector_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa443-matrix/selected
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification

          compile_one() {
            local stem=$1
            local src="PrimalitySheafVerification/${stem}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false \
              -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "$d/confirm-${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/confirm-${stem}.command.txt"
            printf '\n' >> "$d/confirm-${stem}.command.txt"
            "${cmd[@]}" > "$d/confirm-${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/confirm-${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" \
              > "$d/confirm-${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" \
              > "$d/confirm-${stem}.ilean.size"
            return 0
          }

          compile_one Mock2
          compile_one Mock2_Advanced
          compile_one Mock2_FunctionalAnalysis
          python3 scripts/fa443_confirm_selected.py \
            > "$d/confirmation-console.log" 2>&1
          rc=$?
          cat "$d/confirmation-console.log"
          printf '%s' "$rc" > "$d/confirmation-script.exit"
          exit 0

      - name: Record selector infrastructure failure without pretending Lean ran
        if: steps.select.outputs.selector_ok != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa443-matrix/selected
          printf '%s\n' 'Selector did not receive a complete direct Lean metric matrix.' \
            > build-logs/fa443-matrix/selected/CONFIRMATION_NOT_RUN_INFRA_FAILURE.txt

      - name: Materialize independently verified selected source and push checked-in source
        id: persist
        if: steps.select.outputs.selector_ok == 'true' && steps.confirm.outputs.verified == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
          FA_EXIT: ${{ steps.confirm.outputs.fa_exit }}
          FIRST_LINE: ${{ steps.confirm.outputs.first_line }}
          FIRST_COL: ${{ steps.confirm.outputs.first_col }}
          DECLARATION: ${{ steps.confirm.outputs.declaration }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          d=build-logs/fa443-matrix/selected
          worktree=$(sha256sum "$src" | awk '{print $1}')
          selected_copy=$(sha256sum "$d/Mock2_FunctionalAnalysis-selected.lean" | awk '{print $1}')
          test "$worktree" = "$SELECTED_SHA"
          test "$selected_copy" = "$SELECTED_SHA"
          git add "$src" "$d"
          if test "$SELECTION_MODE" = strict_promotion; then
            message="fix: promote FA443 direct ${SELECTED_VARIANT} first-${FIRST_LINE}-${FIRST_COL} ${SELECTED_SHA:0:12}"
          else
            message="fix: restore direct-verified FA423 31726 baseline after FA443 matrix repair"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$message"
          fi
          git push origin "HEAD:${ACTIVE_BRANCH}"
          head_sha=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          test "$head_sha" = "$SELECTED_SHA"
          echo 'source_committed=true' >> "$GITHUB_OUTPUT"
          echo "source_commit=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Verify selected worktree and checked-in HEAD source identity
        id: identity
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          d=build-logs/fa443-matrix/final-gates
          mkdir -p "$d"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          worktree=$(test -f "$src" && sha256sum "$src" | awk '{print $1}' || true)
          head_source=$(git show "HEAD:$src" 2>/dev/null | sha256sum | awk '{print $1}')
          identity=false
          if test -n "${SELECTED_SHA:-}" && test "$SELECTED_SHA" = "$worktree" \
             && test "$SELECTED_SHA" = "$head_source"; then
            identity=true
          fi
          export SELECTED_SHA_VALUE="${SELECTED_SHA:-}" WORKTREE_SHA="$worktree" \
            HEAD_SOURCE_SHA="$head_source" IDENTITY="$identity"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          result={
            'selected_sha256':os.environ.get('SELECTED_SHA_VALUE',''),
            'worktree_sha256':os.environ.get('WORKTREE_SHA',''),
            'head_source_sha256':os.environ.get('HEAD_SOURCE_SHA',''),
            'identity_ok':os.environ.get('IDENTITY')=='true',
            'head_commit':os.popen('git rev-parse HEAD').read().strip(),
          }
          Path('build-logs/fa443-matrix/final-gates/CHECKED_IN_IDENTITY.json').write_text(
            json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
          echo "identity_ok=$identity" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Direct-compile checked-in FA twice and run forbidden-token audit
        id: fa_gate
        if: always()
        env:
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa443-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

          compile_fa() {
            local n=$1
            local o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            local i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            local prefix="$d/FA-run${n}"
            local cmd=(lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "${prefix}.executed"
            printf '%q ' "${cmd[@]}" > "${prefix}.command.txt"
            printf '\n' >> "${prefix}.command.txt"
            "${cmd[@]}" > "${prefix}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "${prefix}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" \
              > "${prefix}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" \
              > "${prefix}.ilean.size"
            return 0
          }

          if test "${IDENTITY_OK:-false}" = true; then
            compile_fa 1
            compile_fa 2
          fi
          python3 scripts/fa443_checked_in_fa_gate.py \
            > "$d/fa-gate-console.log" 2>&1
          rc=$?
          cat "$d/fa-gate-console.log"
          printf '%s' "$rc" > "$d/fa-gate-script.exit"
          exit 0

      - name: Ordered Integrated Mock3 bridge and QYM two-pass direct gate
        if: steps.fa_gate.outputs.fa_true_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa443-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true
          integrated_status=NOT_RUN
          mock3_status=NOT_RUN
          qym_status=NOT_RUN

          compile_target() {
            local stem=$1
            local n=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local prefix="$d/${stem}-run${n}"
            local cmd=(lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "${prefix}.executed"
            printf '%q ' "${cmd[@]}" > "${prefix}.command.txt"
            printf '\n' >> "${prefix}.command.txt"
            "${cmd[@]}" > "${prefix}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "${prefix}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" \
              > "${prefix}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" \
              > "${prefix}.ilean.size"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }

          integrated=Mock2_FunctionalAnalysis_Integrated
          if test -f "PrimalitySheafVerification/${integrated}.lean"; then
            compile_target "$integrated" 1; a=$?
            compile_target "$integrated" 2; b=$?
            if test "$a" -eq 0 && test "$b" -eq 0; then
              integrated_status=PASS_2X
            else
              integrated_status=LEAN_FAILURE
              complete=false
            fi
          else
            integrated_status=MISSING
            complete=false
          fi

          if test "$complete" = true; then
            shopt -s nullglob
            bridges=(PrimalitySheafVerification/Mock3*.lean)
            mock3_status=PASS_2X
            for source in "${bridges[@]}"; do
              stem=$(basename "$source" .lean)
              compile_target "$stem" 1; a=$?
              compile_target "$stem" 2; b=$?
              if test "$a" -ne 0 || test "$b" -ne 0; then
                mock3_status="LEAN_FAILURE:${stem}"
                complete=false
                break
              fi
            done
          else
            mock3_status=BLOCKED_BY_INTEGRATED
          fi

          if test "$complete" = true; then
            if test -f PrimalitySheafVerification/QYM.lean; then
              compile_target QYM 1; a=$?
              compile_target QYM 2; b=$?
              if test "$a" -eq 0 && test "$b" -eq 0; then
                qym_status=PASS_2X
              else
                qym_status=LEAN_FAILURE
                complete=false
              fi
            else
              qym_status=MISSING
              complete=false
            fi
          else
            qym_status=BLOCKED_BY_EARLIER_GATE
          fi

          export INTEGRATED_STATUS="$integrated_status" MOCK3_STATUS="$mock3_status" \
            QYM_STATUS="$qym_status" COMPLETE="$complete"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          result={
            'classification':'TRUE_PASS' if os.environ['COMPLETE']=='true' else 'LEAN_FAILURE',
            'Integrated':os.environ['INTEGRATED_STATUS'],
            'Mock3_bridges':os.environ['MOCK3_STATUS'],
            'QYM':os.environ['QYM_STATUS'],
            'complete':os.environ['COMPLETE']=='true',
            'authority':'checked-in direct Lean CLI two-pass ordered gate',
          }
          Path('build-logs/fa443-matrix/final-gates/DOWNSTREAM.json').write_text(
            json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY
          exit 0

      - name: Record downstream as blocked until FA TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass != 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa443-matrix/final-gates
          python3 - <<'PY'
          from pathlib import Path
          import json
          result={
            'classification':'BLOCKED_BY_FA',
            'Integrated':'BLOCKED_BY_FA_TRUE_PASS_GATE',
            'Mock3_bridges':'BLOCKED_BY_FA_TRUE_PASS_GATE',
            'QYM':'BLOCKED_BY_FA_TRUE_PASS_GATE',
            'complete':False,
          }
          Path('build-logs/fa443-matrix/final-gates/DOWNSTREAM.json').write_text(
            json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          PY

      - name: Build structured FA matrix pipeline repair report
        id: report
        if: always()
        env:
          SELECTOR_OK: ${{ steps.select.outputs.selector_ok }}
        shell: bash
        run: |
          set +e
          python3 scripts/fa443_build_pipeline_report.py \
            > build-logs/fa443-matrix/report-console.log 2>&1
          rc=$?
          cat build-logs/fa443-matrix/report-console.log
          printf '%s' "$rc" > build-logs/fa443-matrix/report-script.exit
          exit 0

      - name: Commit final verification evidence with explicit Git identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A build-logs/fa443-matrix
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA443 repaired direct matrix evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA443 selected and final evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa443-repaired-matrix-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa443-matrix/selected
            build-logs/fa443-matrix/final-gates
            build-logs/fa443-matrix/PIPELINE_REPORT.json
            build-logs/fa443-matrix/PIPELINE_REPORT.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce repaired pipeline integrity without confusing Lean failure with infrastructure
        if: always()
        env:
          PIPELINE_OK: ${{ steps.report.outputs.pipeline_ok }}
        shell: bash
        run: |
          test "${PIPELINE_OK:-false}" = true
