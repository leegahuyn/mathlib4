name: FA432 scoped Complex AddCommGroup parallel direct Lean matrix

on:
  push:
    branches:
      - fix/fa432-scoped-complex-instance-20260810
    paths:
      - scripts/fa432_prepare_scoped_instance_candidate.py
      - scripts/fa432_record_candidate_metric.py
      - scripts/fa432_select_verified_matrix.py
      - .github/workflows/fa432-scoped-complex-instance.yml
      - build-logs/fa432-scoped-instance-matrix/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa432-scoped-complex-instance
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 10
      matrix:
        variant:
          - baseline
          - scoped-normed-remove
          - scoped-normed-normed
          - scoped-normed-alias
          - scoped-normed-remove-exact
          - scoped-normed-remove-simpa
          - scoped-normed-remove-convert
          - scoped-normed-remove-change
          - scoped-complex-remove
          - scoped-complex-complex
    runs-on: ubuntu-24.04
    timeout-minutes: 170
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout exact FA432 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa432-scoped-complex-instance-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Recover exact PASS423 source and prepare same-height scoped candidate
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa432-scoped-instance-matrix/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          python3 scripts/fa432_prepare_scoped_instance_candidate.py \
            --variant "$VARIANT" --output-dir "$d" | tee "$d/prepare.log"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa432-scoped-instance-matrix/candidates/${VARIANT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Directly compile completed prerequisites and candidate FA
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa432-scoped-instance-matrix/candidates/${VARIANT}"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$o" && test -s "$i"; then
              return 0
            fi
            return 1
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis; fa=$?
          else
            printf 'FA blocked by prerequisite regression\n' \
              > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          export M2_EXIT="$m2" M2A_EXIT="$m2a" FA_EXIT="$fa"
          python3 scripts/fa432_record_candidate_metric.py
          exit 0

      - name: Upload complete candidate source and metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa432-candidate-${{ matrix.variant }}
          path: build-logs/fa432-scoped-instance-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      ACTIVE_BRANCH: fix/fa432-scoped-complex-instance-20260810
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact FA432 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa432-scoped-complex-instance-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Select strict same-height candidate
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa432_select_verified_matrix.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa432-scoped-instance-matrix/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Authoritatively recompile selected source and completed prerequisites
        id: confirm
        env:
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa432-scoped-instance-matrix/selected
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$SELECTED_SHA" || exit 9
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/confirm-${stem}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/confirm-${stem}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis; fa=$?
          fi
          export M2="$m2" M2A="$m2a" FA="$fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          d=Path('build-logs/fa432-scoped-instance-matrix/selected')
          data=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()
          source_sha=hashlib.sha256(data).hexdigest()
          line_count=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          log=(d/'confirm-Mock2_FunctionalAnalysis.log').read_text(errors='replace') if (d/'confirm-Mock2_FunctionalAnalysis.log').exists() else ''
          matches=list(re.finditer(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:',log))
          first=int(matches[0].group(1)) if matches else 0
          col=int(matches[0].group(2)) if matches else 0
          m2=int(os.environ['M2']); m2a=int(os.environ['M2A']); fa=int(os.environ['FA'])
          mode=os.environ['SELECTION_MODE']
          required=31726 if mode=='materialize_verified_baseline' else 31727
          verified=(source_sha==os.environ['SELECTED_SHA'] and line_count==60453
                    and m2==0 and m2a==0 and (fa==0 or first>=required))
          result={
              'classification':'VERIFIED' if verified else 'INFRA_FAILURE',
              'authority':'direct Lean CLI','selection_mode':mode,
              'source_sha256':source_sha,'line_count':line_count,
              'Mock2_exit':m2,'Mock2_Advanced_exit':m2a,'FA_exit':fa,
              'FA_first_error_line':first,'FA_first_error_col':col,
              'error_headers_under_cap':len(matches),'maxErrors_cap':1,
              'maxErrors_interpretation':'cap only; not total error count or progress',
              'verified':verified,
          }
          (d/'CONFIRMATION.json').write_text(json.dumps(result,indent=2)+'\n')
          (d/('VERIFIED' if verified else 'FAILED')).touch()
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"verified={str(verified).lower()}\n")
              handle.write(f"fa_exit={fa}\nfirst_line={first}\nfirst_col={col}\n")
          PY
          exit 0

      - name: Commit checked-in source only after direct confirmation
        id: persist
        if: always()
        env:
          VERIFIED: ${{ steps.confirm.outputs.verified }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          FA_EXIT: ${{ steps.confirm.outputs.fa_exit }}
          FIRST_LINE: ${{ steps.confirm.outputs.first_line }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa432-scoped-instance-matrix
          test "${VERIFIED:-false}" = true
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$SELECTED_SHA"
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d/selected"
          if test "$SELECTION_MODE" = strict_promotion; then
            if test "$FA_EXIT" = 0; then metric=pass; else metric="first-${FIRST_LINE}"; fi
            msg="fix: promote FA432 ${metric} scoped-instance source ${SELECTED_SHA:0:12}"
          else
            msg="fix: materialize FA423 first-${FIRST_LINE} source in FA432 ${SELECTED_SHA:0:12}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$SELECTED_SHA"
          head=$(git rev-parse HEAD)
          if test "$FA_EXIT" = 0; then metric=pass; else metric="first-${FIRST_LINE}"; fi
          immutable="champion/fa432-${metric}-${SELECTED_SHA:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa432-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
               --input /tmp/fa432-ref.json > "$d/selected/immutable-response.json" \
               2> "$d/selected/immutable-error.txt"; then
            printf '%s\n' "$immutable" > "$d/selected/IMMUTABLE_CHAMPION_BRANCH.txt"
          fi
          echo "source_commit=$head" >> "$GITHUB_OUTPUT"

      - name: Compile identical checked-in FA source twice and audit forbidden escapes
        id: fa_gate
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa432-scoped-instance-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test -n "$SELECTED_SHA" && test "$SELECTED_SHA" = "$checked" && \
             test "$SELECTED_SHA" = "$worktree"; then identity=true; fi
          printf 'selected=%s\nchecked=%s\nworktree=%s\nidentity=%s\n' \
            "$SELECTED_SHA" "$checked" "$worktree" "$identity" > "$d/source-identity.txt"
          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "$identity" = true; then
            compile_fa 1; r1=$?
            if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi
          fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text()
          out=[]; i=0; line=False; string=False; escaped=False; depth=0
          while i<len(text):
              c=text[i]; n=text[i+1] if i+1<len(text) else ''
              if line:
                  if c=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if c=='/' and n=='-': depth+=1; out+=[' ',' ']; i+=2; continue
                  if c=='-' and n=='/': depth-=1; out+=[' ',' ']; i+=2; continue
                  out.append('\n' if c=='\n' else ' '); i+=1; continue
              if string:
                  out.append('\n' if c=='\n' else ' ')
                  if escaped: escaped=False
                  elif c=='\\': escaped=True
                  elif c=='"': string=False
                  i+=1; continue
              if c=='-' and n=='-': line=True; out+=[' ',' ']; i+=2; continue
              if c=='/' and n=='-': depth=1; out+=[' ',' ']; i+=2; continue
              if c=='"': string=True; out.append(' '); i+=1; continue
              out.append(c); i+=1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'new_global_axiom':r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b',
          }
          audit={name:len(re.findall(pattern,code)) for name,pattern in patterns.items()}
          r1=int(os.environ['R1']); r2=int(os.environ['R2'])
          clean=all(value==0 for value in audit.values())
          result={
              'FA_run1_exit':r1,'FA_run2_exit':r2,'forbidden_audit':audit,
              'forbidden_clean':clean,'FA_TRUE_PASS':r1==0 and r2==0 and clean,
              'maxErrors_cap':1,
          }
          path=Path('build-logs/fa432-scoped-instance-matrix/final-gates/FA_FINAL.json')
          path.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as handle:
              handle.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa432-scoped-instance-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            targets+=(Mock2_FunctionalAnalysis_Integrated)
          else
            complete=false; echo missing > "$d/Integrated-missing.txt"
          fi
          shopt -s nullglob
          for source in PrimalitySheafVerification/Mock3*.lean; do
            targets+=("$(basename "$source" .lean)")
          done
          if test -f PrimalitySheafVerification/QYM.lean; then
            targets+=(QYM)
          else
            complete=false; echo missing > "$d/QYM-missing.txt"
          fi
          compile_one() {
            stem=$1; n=$2
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; first=$?; second=125
              if test "$first" -eq 0; then compile_one "$stem" 2; second=$?; fi
              if test "$first" -ne 0 || test "$second" -ne 0; then
                complete=false
                break
              fi
            done
          fi
          if test "$complete" = true; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final checked-in verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa432-scoped-instance-matrix/selected \
                  build-logs/fa432-scoped-instance-matrix/final-gates
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA432 checked-in direct and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA432 selected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa432-selected-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa432-scoped-instance-matrix/selected
            build-logs/fa432-scoped-instance-matrix/final-gates
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce full ordered completion
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
