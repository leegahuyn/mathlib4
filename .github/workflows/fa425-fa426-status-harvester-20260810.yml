name: FA425-FA426 direct-evidence status harvester

on:
  push:
    branches:
      - ops/fa425-fa426-status-harvester-20260810
    paths:
      - status-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  harvest:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout harvester branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fa425-fa426-status-harvester-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Allow current direct compile jobs to emit evidence
        shell: bash
        run: sleep 360

      - name: Harvest runs jobs artifacts evidence and checked-in source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 scripts/fa425_426_status_harvester.py

      - name: Commit normalized status
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add status-records/fa425-fa426
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA425-FA426 direct-evidence status [skip ci]'
            git push origin HEAD:ops/fa425-fa426-status-harvester-20260810
          fi

      - name: Upload normalized status bundle
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa425-fa426-status-${{ github.run_id }}-${{ github.sha }}
          path: status-records/fa425-fa426
          if-no-files-found: error
          retention-days: 90
