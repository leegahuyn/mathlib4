name: Final Authority Mass Repair v3 — M1A Promote then Full Gate

on:
  push:
    branches:
      - gpt/final13-m1a-native-clean-six-candidate-20260820
      - gpt/final-authority-mass-repair-v3-20260820
    paths:
      - .github/workflows/final-authority-mass-repair-v3.yml
      - scripts/final_authority_gate_v3.py
      - scripts/final13_r5_patch_mock1_advanced_six.py
      - PrimalitySheafVerification/Mock1_Advanced.lean
  workflow_dispatch:

concurrency:
  group: final-authority-mass-repair-v3-${{ github.ref }}
  cancel-in-progress: false

jobs:
  promote-m1a:
    if: github.ref_name == 'gpt/final13-m1a-native-clean-six-candidate-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    permissions:
      contents: write
    steps:
      - name: Checkout exact cumulative candidate
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Verify immutable protected identities and native-clean M1A input
        shell: bash
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = \
            "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = \
            "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = \
            "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = \
            "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = \
            "da99c78fdc2f6f894b55dd79af1438fa2d51a1b6"
          test "$(sha256sum PrimalitySheafVerification/Mock1_Advanced.lean | awk '{print $1}')" = \
            "d2cf9f101e04d58e0fd87e62d1f102b8eb910d4cc5e3e9d2b903e5c7df0f98f2"

      - name: Apply all six verified residual repairs in one batch
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .m1a_mass
          python3 scripts/final13_r5_patch_mock1_advanced_six.py \
            hrange-rfl-norm \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            .m1a_mass/Mock1_Advanced.patched.lean \
            | tee .m1a_mass/PATCH_RESULT.txt
          mv .m1a_mass/Mock1_Advanced.patched.lean \
            PrimalitySheafVerification/Mock1_Advanced.lean
          sha256sum PrimalitySheafVerification/Mock1_Advanced.lean \
            | tee .m1a_mass/PATCHED_SHA256.txt
          git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean \
            | tee .m1a_mass/PATCHED_GIT_BLOB.txt
          ! grep -nE '\b(sorry|admit|native_decide)\b|set_option[[:space:]]+maxHeartbeats[[:space:]]+0' \
            PrimalitySheafVerification/Mock1_Advanced.lean

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .m1a_mass/LEAN_VERSION.txt
          lake --version | tee .m1a_mass/LAKE_VERSION.txt

      - name: Full direct Lean verification of patched Mock1_Advanced
        id: m1a_compile
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          start=$(date +%s)
          set +e
          timeout --signal=TERM --kill-after=60s 10800s \
            lake env lean -DmaxErrors=2000 -DwarningAsError=false \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            2>&1 | tee .m1a_mass/Mock1_Advanced.direct.log
          rc=${PIPESTATUS[0]}
          set -e
          end=$(date +%s)
          printf '%s\n' "$rc" > .m1a_mass/EXIT_CODE.txt
          printf '%s\n' "$((end-start))" > .m1a_mass/ELAPSED_SECONDS.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Build authoritative M1A result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib
          import json
          import re
          import subprocess
          from pathlib import Path

          out = Path('.m1a_mass')
          src = Path('PrimalitySheafVerification/Mock1_Advanced.lean')
          log = (out / 'Mock1_Advanced.direct.log').read_text(encoding='utf-8', errors='replace') \
              if (out / 'Mock1_Advanced.direct.log').exists() else ''
          exit_code = int((out / 'EXIT_CODE.txt').read_text().strip()) \
              if (out / 'EXIT_CODE.txt').exists() else 999
          raw = src.read_bytes() if src.exists() else b''
          text = raw.decode('utf-8', errors='replace')
          errors = [line for line in log.splitlines() if re.search(r':\d+:\d+: error(?:\([^)]*\))?:', line)]
          warnings = [line for line in log.splitlines() if re.search(r':\d+:\d+: warning(?:\([^)]*\))?:', line)]
          panic = [line for line in log.splitlines() if re.search(r'(?i)internal error|uncaught exception|panic!', line)]
          forbidden = {
              'sorry': len(re.findall(r'\bsorry\b', text)),
              'admit': len(re.findall(r'\badmit\b', text)),
              'native_decide': len(re.findall(r'\bnative_decide\b', text)),
              'maxHeartbeats_0': len(re.findall(r'set_option\s+maxHeartbeats\s+0\b', text)),
          }
          result = {
              'source_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'path': str(src),
              'patched_sha256': hashlib.sha256(raw).hexdigest(),
              'patched_git_blob': subprocess.check_output(['git', 'hash-object', '--no-filters', str(src)], text=True).strip(),
              'line_count': len(raw.splitlines()),
              'command': 'lake env lean -DmaxErrors=2000 -DwarningAsError=false PrimalitySheafVerification/Mock1_Advanced.lean',
              'exit': exit_code,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'panic': len(panic),
              'forbidden': forbidden,
              'forbidden_total': sum(forbidden.values()),
              'first_error': errors[0] if errors else None,
              'all_error_headers': errors,
          }
          result['pass'] = (
              result['exit'] == 0
              and result['error_headers'] == 0
              and result['panic'] == 0
              and result['forbidden_total'] == 0
          )
          (out / 'M1A_MASS_PROMOTION_RESULT.json').write_text(
              json.dumps(result, indent=2, ensure_ascii=False) + '\n', encoding='utf-8'
          )
          print(json.dumps(result, indent=2, ensure_ascii=False))
          PY

      - name: Upload complete M1A evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: m1a-mass-promotion-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: .m1a_mass
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce M1A TRUE PASS before promotion
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          result = json.loads(Path('.m1a_mass/M1A_MASS_PROMOTION_RESULT.json').read_text())
          if not result['pass']:
              raise SystemExit(1)
          PY

      - name: Recheck protected identities and push cumulative repair branch
        shell: bash
        env:
          REPAIR_BRANCH: gpt/final-authority-mass-repair-v3-20260820
        run: |
          set -euo pipefail
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = \
            "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = \
            "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = \
            "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = \
            "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          git config user.name "final-authority-bot"
          git config user.email "final-authority-bot@users.noreply.github.com"
          git add -- PrimalitySheafVerification/Mock1_Advanced.lean
          git diff --cached --check
          git commit -m "M1A: promote native-clean cumulative six-proof repair"
          git push origin "HEAD:refs/heads/${REPAIR_BRANCH}"

  full-authority:
    if: github.ref_name == 'gpt/final-authority-mass-repair-v3-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: read
    steps:
      - name: Checkout exact promoted repair tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version
          lake --version

      - name: Run full mass-compile authority gate
        id: authority
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          python3 scripts/final_authority_gate_v3.py \
            2>&1 | tee final_authority_mass_repair_v3.log
          rc=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "$rc" > FINAL_AUTHORITY_GATE_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Surface complete frontier and all failure clusters
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          echo "=== PREFLIGHT ==="
          cat .final_authority/PREFLIGHT.json 2>/dev/null || true
          echo "=== FORBIDDEN BY FILE ==="
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('.final_authority/FORBIDDEN_AUDIT.json')
          if p.exists():
              data = json.loads(p.read_text())
              print('forbidden_count=', data.get('forbidden_count'))
              for row in data.get('files', []):
                  total = sum(row.get('forbidden', {}).values())
                  if total:
                      print(row['path'], total, row['forbidden'])
          p = Path('.final_authority/FINAL_13_BUILD_RESULTS.json')
          if p.exists():
              data = json.loads(p.read_text())
              print('=== FINAL13 ALL RESULTS ===')
              print('counts=', data.get('counts'))
              for row in data.get('results', []):
                  if row.get('pass') is not True:
                      print({k: row.get(k) for k in (
                          'path', 'status', 'exit', 'error_headers', 'warning_headers',
                          'panic_lines', 'first_error', 'blocker_declaration', 'log_path'
                      )})
          PY
          echo "=== GATE EXIT ==="
          cat FINAL_AUTHORITY_GATE_EXIT.txt 2>/dev/null || true

      - name: Upload complete authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-mass-repair-v3-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            final_authority_mass_repair_v3.log
            FINAL_AUTHORITY_GATE_EXIT.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Enforce final authority result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f FINAL_AUTHORITY_GATE_EXIT.txt
          test "$(cat FINAL_AUTHORITY_GATE_EXIT.txt)" = "0"
