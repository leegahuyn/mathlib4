name: Codex FA after3452 Fourier projection v4 latest unfold rw
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3452-fourier-projection-v4-latest-unfold-rw.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build latest-parent unfold rewrite runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3452_fourier_repr_v1.sh').read_text()
          src = src.replace('codex-fa-after3452-fourier-repr-v1', 'codex-fa-after3452-fourier-projection-v4-latest-unfold-rw')
          src = src.replace('fa-after3452-fourier-repr-v1', 'fa-after3452-fourier-projection-v4-latest-unfold-rw')
          old = """new='''  rw [← HilbertBasis.repr_apply_apply]\n  simp only [twoTorusFourierBasis]\n  rw [UnitAddTorus.mFourierBasis_repr]\n  simp only [UnitAddTorus.coe_mFourierBasis]'''"""
          new = """new='''  simp only [twoTorusFourierBasis]\n  rw [UnitAddTorus.mFourierBasis_repr]\n  simp only [UnitAddTorus.coe_mFourierBasis]'''"""
          assert src.count(old) == 1, src.count(old)
          src = src.replace(old, new, 1)
          src = src.replace("'repair':'unfold_twoTorus_basis_before_mFourierBasis_repr'", "'repair':'remove_bad_repr_rewrite_then_unfold_and_mFourierBasis_repr'")
          cache = 'lake exe cache get >"$OUT/cache.log" 2>&1'
          retry = '''ok=0\nfor attempt in 1 2 3; do\n  if lake exe cache get >>"$OUT/cache.log" 2>&1; then ok=1; break; fi\n  sleep 5\ndone\ntest "$ok" = 1'''
          assert src.count(cache) == 1, src.count(cache)
          src = src.replace(cache, retry, 1)
          Path('/tmp/codex_fa_after3452_fourier_projection_v4_latest_unfold_rw.sh').write_text(src)
          PY
      - name: Attest patch and direct compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3452_fourier_projection_v4_latest_unfold_rw.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3452-fourier-projection-v4-latest-unfold-rw-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3452-fourier-projection-v4-latest-unfold-rw
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3452-fourier-projection-v4-latest-unfold-rw/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3452-fourier-projection-v4-latest-unfold-rw/Mock2_FunctionalAnalysis.exit)"
