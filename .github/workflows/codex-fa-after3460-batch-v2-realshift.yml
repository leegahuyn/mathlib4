name: Codex FA after3460 batch v2 realshift
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3460-batch-v2-realshift.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build cumulative runner with real-shift repair
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3460_batch_v1.sh').read_text()
          src = src.replace('codex-fa-after3460-batch-v1', 'codex-fa-after3460-batch-v2-realshift')
          marker = 'curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh'
          assert src.count(marker) == 1
          extra = r'''python3 - <<'PY2'
          from pathlib import Path
          import hashlib,json,re
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          before=p.read_text()
          seq_rx=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          seq0=[m.group('name') for m in seq_rx.finditer(before)]
          forbidden=['sorry','admit','axiom','set_option']
          fc0={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',before)) for x in forbidden}
          old='inner_add_right, inner_smul_right, map_ofReal]'
          assert before.count(old)==2, before.count(old)
          after=before.replace(old,'inner_add_right, inner_smul_right, Complex.conj_ofReal]',2)
          oldd='''          _ = inner ℂ ((c : ℂ) • (z : H) + A z) y -
                inner ℂ ((c : ℂ) • (z : H) + A z) (x : H) := by
              rw [d, inner_sub_right]'''
          newd='''          _ = inner ℂ ((c : ℂ) • (z : H) + A z) y -
                inner ℂ ((c : ℂ) • (z : H) + A z) (x : H) := by
              change inner ℂ ((c : ℂ) • (z : H) + A z) (y - (x : H)) =
                inner ℂ ((c : ℂ) • (z : H) + A z) y -
                  inner ℂ ((c : ℂ) • (z : H) + A z) (x : H)
              rw [inner_sub_right]'''
          assert after.count(oldd)==1, after.count(oldd)
          after=after.replace(oldd,newd,1)
          p.write_text(after)
          seq1=[m.group('name') for m in seq_rx.finditer(after)]
          fc1={x:len(re.findall(r'(?<![A-Za-z0-9_])'+re.escape(x)+r'(?![A-Za-z0-9_])',after)) for x in forbidden}
          assert seq0==seq1 and fc0==fc1
          name='LinearPMap.isSelfAdjoint_of_realShift_surjective'; marker2='theorem '+name
          a0=before.index(marker2); a1=after.index(marker2)
          assert before[a0:before.index(':= by',a0)+5] == after[a1:after.index(':= by',a1)+5]
          out=Path('build-logs/codex-fa-after3460-batch-v2-realshift')
          b=p.read_bytes(); sha=hashlib.sha256(b).hexdigest()
          audit=json.loads((out/'PATCH_AUDIT.json').read_text())
          audit['candidate_sha256']=sha
          audit.setdefault('targets',[]).append(name)
          audit['real_shift_repair']='Complex.conj_ofReal_and_explicit_local_d_change'
          audit['existing_declaration_relative_order_preserved']=True
          audit['semantic_public_proposition_change']=False
          audit['forbidden_lexical_counts_preserved']=True
          (out/'PATCH_AUDIT.json').write_text(json.dumps(audit,indent=2,sort_keys=True)+'\n')
          (out/'candidate.sha256').write_text(sha+'\n')
          PY2

          '''
          src = src.replace(marker, extra + marker, 1)
          Path('/tmp/codex_fa_after3460_batch_v2_realshift.sh').write_text(src)
          PY
      - name: Attest patch batch and direct compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3460_batch_v2_realshift.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3460-batch-v2-realshift-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3460-batch-v2-realshift
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3460-batch-v2-realshift/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3460-batch-v2-realshift/Mock2_FunctionalAnalysis.exit)"
