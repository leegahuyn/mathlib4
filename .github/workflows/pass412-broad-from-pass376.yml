name: PASS412 broad deterministic FA frontier

on:
  push:
    branches:
      - fix/fa412-broad-from-pass376-20260809
    paths:
      - build-logs/fa412-broad/REQUESTED.txt

permissions:
  contents: write

jobs:
  repair-verify-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout exact PASS412 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa412-broad-from-pass376-20260809
          fetch-depth: 1700
          persist-credentials: true

      - name: Apply broad repairs only to exact immutable champion
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
          python3 scripts/fa412_broad_from_pass376.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          lake exe cache get | tee /tmp/cache-get.log

      - name: Direct compile and strict metric comparison
        id: metric
        shell: bash
        env:
          BASELINE_FIRST_ERROR: '31725'
          BASELINE_SHA256: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa412-broad
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          rm -f "$d"/*.log "$d"/*.exit "$d"/CURRENT.json "$d"/CURRENT.txt \
            "$d"/PROMOTED "$d"/REGRESSION "$d"/Mock2_FunctionalAnalysis-candidate.lean
          cp /tmp/lean-version.txt "$d/lean-version.txt"
          cp /tmp/lake-version.txt "$d/lake-version.txt"
          cp /tmp/cache-get.log "$d/cache-get.log"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/Mock2_FunctionalAnalysis-candidate.lean"

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          compile_one Mock2 300; rc_m2=$?
          compile_one Mock2_Advanced 300; rc_m2a=$?
          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 400; rc_fa=$?
          else
            echo 'FA compile blocked by prerequisite failure' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          d=Path('build-logs/fa412-broad')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          baseline_line=int(os.environ['BASELINE_FIRST_ERROR'])
          baseline_sha=os.environ['BASELINE_SHA256']
          pat=re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          rows={}
          for stem in ['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis']:
              log=(d/f'{stem}.log').read_text(encoding='utf-8',errors='replace') if (d/f'{stem}.log').exists() else ''
              ms=list(pat.finditer(log))
              ep=d/f'{stem}.exit'
              rows[stem]={
                  'exit_code':int(ep.read_text()) if ep.exists() else 999,
                  'error_headers':len(ms),
                  'first_error_line':int(ms[0].group(1)) if ms else 0,
                  'first_error_col':int(ms[0].group(2)) if ms else 0,
              }
          candidate_sha=hashlib.sha256(src.read_bytes()).hexdigest()
          prereq_ok=(rows['Mock2']['exit_code']==0 and rows['Mock2']['error_headers']==0 and
                     rows['Mock2_Advanced']['exit_code']==0 and rows['Mock2_Advanced']['error_headers']==0)
          fa=rows['Mock2_FunctionalAnalysis']
          improved=fa['exit_code']==0 or fa['first_error_line']>baseline_line
          promoted=prereq_ok and improved and candidate_sha!=baseline_sha
          status={
              'complete':promoted,
              'baseline':{'source_sha256':baseline_sha,'first_error_line':baseline_line},
              'candidate_source_sha256':candidate_sha,
              'results':rows,
              'metric_improved':improved,
              'promoted':promoted,
              'promotion_rule':'FA exit 0, otherwise first_error_line strictly greater than 31725; prerequisites exit 0',
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          (d/'CURRENT.txt').write_text('\n'.join(
              f"{k}: exit={v['exit_code']} errors={v['error_headers']} first={v['first_error_line']}:{v['first_error_col']}"
              for k,v in rows.items())+f"\ncandidate_sha256={candidate_sha}\npromoted={str(promoted).lower()}\n",encoding='utf-8')
          (d/'candidate-sha256.txt').write_text(f'{candidate_sha}  PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\n',encoding='utf-8')
          (d/('PROMOTED' if promoted else 'REGRESSION')).touch()
          print(json.dumps(status,indent=2))
          PY

          test -f "$d/PROMOTED" && final=0 || final=1
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit only strict improvement; retain regressions as evidence only
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa412-broad
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test -f "$d/PROMOTED"; then
            first=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['results']['Mock2_FunctionalAnalysis']['first_error_line'])")
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
            msg="fix: promote PASS412 broad FA frontier to line ${first} [skip ci]"
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d"
            msg='ci: retain PASS376 champion after PASS412 regression [skip ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin HEAD:fix/fa412-broad-from-pass376-20260809
          fi

      - name: Upload PASS412 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa412-broad-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa412-broad
          if-no-files-found: error
          retention-days: 90

      - name: Enforce strict improvement
        if: always()
        env:
          FINAL_EXIT: ${{ steps.metric.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
