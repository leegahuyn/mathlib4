name: Codex FA cumulative idx3165 through3222 v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-cumulative-3165-through3222-v2.yml
      - scripts/fa_dynamic_cluster_3165_3166_ordered_explicit_v2.json
      - scripts/fa_dynamic_cluster_3177_3178_neg_change_v1.json
      - scripts/fa_dynamic_cluster_3179_3195_followup_v2.json
      - scripts/fa_d0a3_r003_high_confidence_overrides.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:
permissions: {actions: read, contents: read}
concurrency: {group: codex-fa-cumulative-3165-through3222-v2, cancel-in-progress: true}
env:
  BASE_RUN_ID: "31553234087"
  BASE_JOB_ID: "93980221118"
  BASE_HEAD_SHA: "d5d864790b89dd46dd7a3a62c89ea6339cc93414"
  BASE_ARTIFACT_ID: "9125217456"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-3162-direction-v1-d5d864790b89dd46dd7a3a62c89ea6339cc93414"
  BASE_ARTIFACT_DIGEST: "sha256:8fe3603b34f324c9adc645ddaec7d08065b9b995a2b22cfd969e11c37bc8337c"
  BASE_SOURCE_SHA256: "1487389a6242c200f6b7282db997b0dce3b831cccf08c568c0c2fc2d527aa954"
  BASE_SOURCE_BYTES: "2719871"
  BASE_SOURCE_LINES: "60928"
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Attest exact direct-tested idx3165 source
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-cumulative-3165-through3222-v2; mkdir -p "$OUT" /tmp/base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/job.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/artifact.json"; gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" >/tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"; unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-cumulative-3165-through3222-v2'); r=json.loads((out/'run.json').read_text()); j=json.loads((out/'job.json').read_text()); a=json.loads((out/'artifact.json').read_text())
          if not(r.get('id')==int(os.environ['BASE_RUN_ID']) and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and r.get('status')=='completed' and r.get('conclusion')=='failure'): raise SystemExit('run gate')
          if not(j.get('id')==int(os.environ['BASE_JOB_ID']) and j.get('run_id')==int(os.environ['BASE_RUN_ID']) and j.get('status')=='completed' and j.get('conclusion')=='failure'): raise SystemExit('job gate')
          if not(a.get('id')==int(os.environ['BASE_ARTIFACT_ID']) and a.get('name')==os.environ['BASE_ARTIFACT_NAME'] and a.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'] and a.get('expired') is False): raise SystemExit('artifact gate')
          m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          if not(m.get('Mock2_exit')==0 and m.get('Mock2_Advanced_exit')==0 and m.get('FA_exit')==1 and m.get('all_required_lean_executed') is True and m.get('FA_error_declaration_index')==3165 and m.get('source_sha256')==os.environ['BASE_SOURCE_SHA256'] and m.get('source_identity_locked_after_materialization') is True and m.get('public_declaration_headers_preserved') is True and m.get('declaration_sequence_preserved') is True): raise SystemExit('metric gate '+repr(m))
          hits=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']): hits.append(p)
          if len(hits)!=1: raise SystemExit('source count '+str(len(hits)))
          (out/'BASE_SOURCE.txt').write_text(str(hits[0].resolve())+'\n')
          PY
      - name: Strict-compose ordered and independent roots through idx3222
        shell: bash
        run: |
          set -euo pipefail; OUT=build-logs/codex-fa-cumulative-3165-through3222-v2; base="$(cat "$OUT/BASE_SOURCE.txt")"
          apply(){ tag=$1;lib=$2;next=/tmp/$tag.lean;python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library "$lib" --no-environment --target "$next" --audit-out "$OUT/$tag.json";base=$next;}
          apply C3166 scripts/fa_dynamic_cluster_3165_3166_ordered_explicit_v2.json
          apply C3178 scripts/fa_dynamic_cluster_3177_3178_neg_change_v1.json
          apply C3195 scripts/fa_dynamic_cluster_3179_3195_followup_v2.json
          BASE_FOR_FILTER="$base" python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path(os.environ['BASE_FOR_FILTER']).read_text();lib=json.loads(Path('scripts/fa_d0a3_r003_high_confidence_overrides.json').read_text());wanted={3181,3184,3185,3199,3222}
          rx=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)');ms=list(rx.finditer(text));decl=[]
          for i,m in enumerate(ms):decl.append((m.group('name'),m.start(),ms[i+1].start() if i+1<len(ms) else len(text)))
          roots=[];report=[]
          for root in lib.get('repairs',[]):
            idx=int(root['declaration_index'])
            if idx not in wanted:continue
            name,start,end=decl[idx]
            if name!=root['declaration_name']:raise SystemExit(f'identity drift {idx} {name}')
            body=text[start:end];reps=[]
            for rep in root.get('replacements',[]):
              old,new=rep['old_fragment'],rep['new_fragment'];oc=body.count(old);nc=body.count(new);gc=text.count(old)
              if oc==1 and gc==1:reps.append(rep);report.append({'idx':idx,'status':'apply'})
              elif oc==0 and nc==1:report.append({'idx':idx,'status':'already-applied'})
              else:raise SystemExit(f'fragment drift idx={idx} old_body={oc} old_global={gc} new_body={nc}')
            if reps:
              r=dict(root);r['replacements']=reps;roots.append(r)
          Path('/tmp/r003-current.json').write_text(json.dumps({'schema':'r003-current-3165-3222-v2','repairs':roots},ensure_ascii=False,indent=2)+'\n');Path('build-logs/codex-fa-cumulative-3165-through3222-v2/R003_FILTER_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          PY
          apply R003 /tmp/r003-current.json
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;cp "$base" "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-cumulative-3165-through3222-v2');aud=[json.loads((out/f'{x}.json').read_text()) for x in ('C3166','C3178','C3195','R003')]
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed'] for a in aud):raise SystemExit('audit')
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');b=p.read_bytes();i={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(b.decode().splitlines())};(out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(i,indent=2)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f"CANDIDATE_SHA={i['sha256']}\nCANDIDATE_BYTES={i['bytes']}\n")
          PY
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail;OUT=build-logs/codex-fa-cumulative-3165-through3222-v2;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1;lake exe cache get >"$OUT/cache.log" 2>&1
      - name: Direct full-source cumulative diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH";OUT=build-logs/codex-fa-cumulative-3165-through3222-v2;mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3;one Mock2_Advanced 3;test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA";one Mock2_FunctionalAnalysis 256
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-cumulative-3165-through3222-v2');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:
              ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};first=es[0] if es else {};b=p.read_bytes();metric={'schema':'fa-cumulative-3165-through3222-v2','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':256};(out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT";exit 0
      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-cumulative-3165-through3222-v2-${{ github.sha }}", path: "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\nbuild-logs/codex-fa-cumulative-3165-through3222-v2", retention-days: 30}
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86;exit "$FA_EXIT"
