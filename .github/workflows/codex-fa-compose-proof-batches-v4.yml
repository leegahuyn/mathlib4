name: Codex FA compose proof batches v4

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-compose-proof-batches-v4.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-fa-compose-proof-batches-v4
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31518432076"
  BASE_JOB_ID: "93869310449"
  BASE_HEAD_SHA: "b2c55b3209d5deecc9646efd3ccb148c4d6fb828"
  BASE_ARTIFACT_ID: "9112281252"
  BASE_ARTIFACT_NAME: "codex-fa-action-cluster-2953-2967-v3-b2c55b3209d5deecc9646efd3ccb148c4d6fb828"
  BASE_ARTIFACT_SIZE: "1077962"
  BASE_ARTIFACT_DIGEST: "sha256:a9f82e6583374ed4dd59aa6b8254d961f8d69ac7f1cfd3bfd45d6c5e8f3c1ee3"
  BASE_SOURCE_SHA256: "f6da9e61599a2aed63b79e44690834564cfefe781a696817d6989e9b10d40f08"
  BASE_SOURCE_BYTES: "2705064"
  BASE_SOURCE_LINES: "60641"

jobs:
  compose:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested idx2980 source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-compose-proof-batches-v4
          mkdir -p "$OUT" /tmp/fa-compose-v4-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-compose-v4-base.zip
          unzip -q /tmp/fa-compose-v4-base.zip -d /tmp/fa-compose-v4-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-compose-proof-batches-v4')
          run=json.loads((out/'base-run.json').read_text()); job=json.loads((out/'base-job.json').read_text()); art=json.loads((out/'base-artifact.json').read_text()); z=Path('/tmp/fa-compose-v4-base.zip').read_bytes()
          checks={'run_id':run.get('id')==int(os.environ['BASE_RUN_ID']),'run_head':run.get('head_sha')==os.environ['BASE_HEAD_SHA'],'run_completed_failure':run.get('status')=='completed' and run.get('conclusion')=='failure','job_id':job.get('id')==int(os.environ['BASE_JOB_ID']),'job_run':job.get('run_id')==int(os.environ['BASE_RUN_ID']),'job_completed_failure':job.get('status')=='completed' and job.get('conclusion')=='failure','artifact_id':art.get('id')==int(os.environ['BASE_ARTIFACT_ID']),'artifact_name':art.get('name')==os.environ['BASE_ARTIFACT_NAME'],'artifact_size':art.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']),'artifact_digest':art.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'],'artifact_live':art.get('expired') is False,'archive_digest':'sha256:'+hashlib.sha256(z).hexdigest()==os.environ['BASE_ARTIFACT_DIGEST']}
          if not all(checks.values()): raise SystemExit('base attestation failed: '+repr([k for k,v in checks.items() if not v]))
          valid=[]
          for p in Path('/tmp/fa-compose-v4-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode('utf-8').splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: valid.append(p)
          if not valid: raise SystemExit('exact direct-tested idx2980 source missing')
          p=min(valid,key=lambda x:(len(x.parts),x.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY

      - name: Compose intact independent proof libraries only
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-compose-proof-batches-v4
          base="$(cat "$OUT/BASE_SOURCE.txt")"
          apply_one() {
            local tag="$1"
            local lib="$2"
            local next="/tmp/fa-compose-v4-${tag}.lean"
            echo "APPLY $tag $lib" | tee -a "$OUT/COMPOSE_ORDER.txt"
            python3 scripts/fa_dynamic_apply_staged_library_term.py --base-source "$base" --library "$lib" --no-environment --target "$next" --audit-out "$OUT/AUDIT_${tag}.json"
            base="$next"
          }
          apply_one P3002 scripts/fa_dynamic_cluster_2980_3002_v1.json
          apply_one R002 scripts/fa_d0a3_r002_high_confidence_overrides.json
          apply_one R003 scripts/fa_d0a3_r003_high_confidence_overrides.json
          apply_one R004 scripts/fa_d0a3_r004_high_confidence_overrides.json
          apply_one R005 scripts/fa_d0a3_r005_high_confidence_overrides.json
          apply_one R006 scripts/fa_d0a3_r006_high_confidence_overrides.json
          apply_one R007 scripts/fa_d0a3_r007_high_confidence_overrides.json
          # R008 and R009 are intentionally excluded: their checked-in JSON is not valid UTF-8.
          apply_one R010 scripts/fa_d0a3_r010_remaining_high_confidence_overrides.json
          apply_one R011 scripts/fa_d0a3_r011_remaining_root_library.json
          apply_one R012 scripts/fa_d0a3_r012_remaining_root_library.json
          apply_one LATE scripts/fa_d0a3_r013_r014_late_root_library.json
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "$base" "$OUT/Mock2_FunctionalAnalysis-composed.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          out=Path('build-logs/codex-fa-compose-proof-batches-v4'); tags=('P3002','R002','R003','R004','R005','R006','R007','R010','R011','R012','LATE'); audits=[json.loads((out/f'AUDIT_{t}.json').read_text()) for t in tags]
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] for a in audits): raise SystemExit('semantic audit failed')
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes(); payload={'schema':'fa-compose-proof-batches-v4','sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(b.decode().splitlines()),'libraries':[a['library_path'] for a in audits],'repairs_applied':sum(len(a['proof_replacements_applied']) for a in audits),'excluded_corrupt_libraries':['R008','R009']}; (out/'COMPOSED_IDENTITY.json').write_text(json.dumps(payload,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload composition evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-compose-proof-batches-v4-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-compose-proof-batches-v4
          if-no-files-found: warn
          retention-days: 30
