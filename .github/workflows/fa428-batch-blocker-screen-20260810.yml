name: FA428 direct-Lean batch blocker solver

on:
  push:
    branches:
      - fix/fa428-batch-blocker-screen-20260810
    paths:
      - fa428-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  batch-screen-reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXPECTED_SHA_31725: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
      EXPECTED_SHA_31726: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      PASS423_RUN_ID: '31317392557'
      PASS376_ARTIFACT_ID: '9024606745'
      SOURCE_PATH: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      ACTIVE_BRANCH: fix/fa428-batch-blocker-screen-20260810

    steps:
      - name: Checkout FA428 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa428-batch-blocker-screen-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Let earlier source-matched evidence settle
        shell: bash
        run: sleep 120

      - name: Resolve exact SHA fallback and fetch donors
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fa425b_resolve_verified_champion.sh

      - name: Select best available source-matched evidence
        shell: bash
        run: |
          set -euo pipefail
          git fetch --no-tags --depth=1 origin \
            +refs/heads/fix/fa426b-multiround-importsafe-20260810:refs/remotes/fa428/fa426b \
            >/dev/null 2>&1 || true
          if git show refs/remotes/fa428/fa426b:scripts/fa426_resolve_best_verified.py \
              > /tmp/fa428_resolve_best_verified.py 2>/dev/null; then
            python3 /tmp/fa428_resolve_best_verified.py \
              --refs /tmp/fa425-donor-refs.txt \
              --fallback /tmp/fa425-baseline.lean \
              --output /tmp/fa428-baseline.lean \
              --metadata /tmp/fa428-selection.json
          else
            cp /tmp/fa425-baseline.lean /tmp/fa428-baseline.lean
            python3 - <<'PY'
          import hashlib,json
          from pathlib import Path
          p=Path('/tmp/fa428-baseline.lean')
          sha=hashlib.sha256(p.read_bytes()).hexdigest()
          metric={'07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4':[0,31725,2],
                  '71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0':[0,31726,2]}[sha]
          Path('/tmp/fa428-selection.json').write_text(json.dumps({'selected':{'ref':'SHA-fallback','source_sha256':sha,'score':metric}},indent=2)+'\n')
          PY
          fi
          cp /tmp/fa428-baseline.lean "$SOURCE_PATH"
          test "$(python3 -c "print(len(open('$SOURCE_PATH',encoding='utf-8').read().splitlines()))")" = 60453

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa428-lean-version.txt
          lake --version | tee /tmp/fa428-lake-version.txt
          lake exe cache get | tee /tmp/fa428-cache-get.log

      - name: Batch-screen blocker proofs and full-source reverify
        id: solver
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa428_batch_solver.py
          d=build-logs/fa428-batch-blocker-screen
          cp /tmp/fa428-selection.json "$d/BASELINE_SELECTION.json"
          cp /tmp/fa425-resolution.txt "$d/FALLBACK_RESOLUTION.txt"
          cp /tmp/fa428-lean-version.txt "$d/lean-version.txt"
          cp /tmp/fa428-lake-version.txt "$d/lake-version.txt"
          cp /tmp/fa428-cache-get.log "$d/cache-get.log"

      - name: Persist only direct-verified source and concise evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHOULD_COMMIT: ${{ steps.solver.outputs.source_should_commit }}
          STRICT_PROMOTION: ${{ steps.solver.outputs.strict_promotion }}
          FA_TRUE_PASS: ${{ steps.solver.outputs.fa_true_pass }}
          ALL_CHAIN_PASS: ${{ steps.solver.outputs.all_chain_pass }}
        run: |
          set -euo pipefail
          d=build-logs/fa428-batch-blocker-screen
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p verified-records/fa428
          cp "$d/CURRENT.json" verified-records/fa428/CURRENT.json
          cp "$d/CURRENT.txt" verified-records/fa428/CURRENT.txt
          cp "$d/BATCH_STATUS.json" verified-records/fa428/BATCH_STATUS.json
          cp "$d/FULL_SCREENING.json" verified-records/fa428/FULL_SCREENING.json
          cp "$d/PROMOTION.json" verified-records/fa428/PROMOTION.json
          cp "$d/BASELINE_SELECTION.json" verified-records/fa428/BASELINE_SELECTION.json
          cp "$d/BASELINE_FIRST_ERROR_CONTEXT.txt" verified-records/fa428/BASELINE_FIRST_ERROR_CONTEXT.txt
          test ! -f "$d/PROMOTED_FIRST_ERROR_CONTEXT.txt" || cp "$d/PROMOTED_FIRST_ERROR_CONTEXT.txt" verified-records/fa428/PROMOTED_FIRST_ERROR_CONTEXT.txt

          if test "${SOURCE_SHOULD_COMMIT:-false}" = true; then
            git add "$SOURCE_PATH" verified-records/fa428
            if test "${ALL_CHAIN_PASS:-false}" = true; then
              msg='fix: FA428 ordered FA Integrated Mock3 QYM x2 PASS [skip ci]'
            elif test "${FA_TRUE_PASS:-false}" = true; then
              msg='fix: FA428 FunctionalAnalysis TRUE PASS x2 audit clean [skip ci]'
            elif test "${STRICT_PROMOTION:-false}" = true; then
              first=$(python3 -c "import json; d=json.load(open('$d/CURRENT.json')); print(d['selected_metric']['first_error_line'])")
              msg="fix: promote FA428 batch-screened frontier to ${first} [skip ci]"
            else
              msg='chore: materialize best direct-verified FA baseline [skip ci]'
            fi
          else
            git restore "$SOURCE_PATH"
            git add verified-records/fa428
            msg='evidence: FA428 no strict blocker promotion; retain verified champion [skip ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA428 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa428-batch-blocker-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa428-batch-blocker-screen
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Classify solver result
        if: always()
        env:
          CONTROLLER_SUCCESS: ${{ steps.solver.outputs.controller_success }}
        shell: bash
        run: test "${CONTROLLER_SUCCESS:-false}" = true
