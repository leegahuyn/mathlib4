name: Codex FA v66 checked-head authoritative one-lane

on:
  push:
    branches: [codex/fa-exclusive-focus-20260814]
    paths:
      - PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      - .github/workflows/codex-fa-v66-timeout-structure-matrix.yml
      - scripts/fa_v66_checked_head_final_gate.py
  workflow_dispatch: {}

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa-v66-checked-head-one-lane-${{ github.ref }}
  cancel-in-progress: false

env:
  V66_OUT: build-logs/codex-fa-v66-checked-head/one-lane
  V66_LEAN_VERSION: Lean (version 4.33.0-rc1, x86_64-unknown-linux-gnu, commit 62eed1db4d67327ec8120be05f1a1b0847d74561, Release)

jobs:
  checked-head-direct:
    name: checked-head-direct-one-lane
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Capture current checkout and exact checked-in FA source
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/$V66_OUT"
          mkdir -p "$out"
          python3 scripts/fa_v66_checked_head_final_gate.py \
            --mode capture \
            --repo-root "$GITHUB_WORKSPACE" \
            --source "$GITHUB_WORKSPACE/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            --out "$out" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-github-ref "$GITHUB_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"
          source_sha="$(tr -d '\r\n' <"$out/candidate.sha256")"
          printf 'FA_V42_EXPECTED_CANDIDATE_SHA256=%s\n' "$source_sha" >>"$GITHUB_ENV"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/$V66_OUT"
          asset_name="elan-x86_64-unknown-linux-gnu.tar.gz"
          asset_sha="df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2"
          curl --location --retry 5 --retry-all-errors --fail --silent --show-error \
            https://github.com/leanprover/elan/releases/download/v4.2.3/elan-x86_64-unknown-linux-gnu.tar.gz \
            -o "$out/$asset_name" 2>"$out/elan-download.log"
          [[ "$(wc -c <"$out/$asset_name" | tr -d ' ')" == 4984019 ]]
          printf '%s  %s\n' "$asset_sha" "$asset_name" >"$out/elan-installer.sha256"
          (cd "$out" && sha256sum -c elan-installer.sha256)
          installer_tmp="$(mktemp -d)"
          tar -xzf "$out/$asset_name" -C "$installer_tmp"
          "$installer_tmp/elan-init" -y --default-toolchain none >"$out/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$out/toolchain.log" 2>&1
          lake exe cache get >"$out/cache.log" 2>&1
          elan --version >"$out/elan-version.txt"
          lean --version >"$out/lean-version.txt"
          lake --version >"$out/lake-version.txt"
          [[ "$(tr -d '\r\n' <"$out/lean-version.txt")" == "$V66_LEAN_VERSION" ]]
          [[ "$(tr -d '\r\n' <"$out/lake-version.txt")" == 'Lake version 5.0.0-src+62eed1d (Lean version 4.33.0-rc1)' ]]

      - id: direct
        name: Compile checked-in Mock2 then Mock2A then FA2000 exactly once
        shell: bash
        run: |
          set -euo pipefail
          export FA_V42_OUT="$GITHUB_WORKSPACE/$V66_OUT"
          export FA_V42_EXPECTED_CANDIDATE_SHA256
          set +e
          bash scripts/fa_v42_direct_compile_ci.sh
          wrapper_rc=$?
          set -e
          printf '%s\n' "$wrapper_rc" >"$FA_V42_OUT/wrapper.exit"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$FA_V42_OUT/Mock2_FunctionalAnalysis-observed.lean"
          printf 'V66_WRAPPER_RC=%s\n' "$wrapper_rc" >>"$GITHUB_ENV"
          exit 0

      - name: Collect full diagnostics, warnings, declarations, and trust-six
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          export FA_V42_OUT="$GITHUB_WORKSPACE/$V66_OUT"
          export FA_V42_VARIANT=checked_head
          export FA_V42_EXPECTED_CANDIDATE_SHA256="${FA_V42_EXPECTED_CANDIDATE_SHA256:-missing}"
          python3 scripts/fa_v42_collect_full_diagnostics.py \
            --source PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --out "$FA_V42_OUT" \
            --max-errors 2000 \
            >"$FA_V42_OUT/metric-console.log"

      - id: gate
        name: Gate current-head authority and isolate the first actual error
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/$V66_OUT"
          python3 scripts/fa_v66_checked_head_final_gate.py \
            --mode final \
            --repo-root "$GITHUB_WORKSPACE" \
            --source "$GITHUB_WORKSPACE/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" \
            --out "$out" \
            --provenance "$out/CHECKOUT_PROVENANCE.json" \
            --expected-github-sha "$GITHUB_SHA" \
            --expected-github-ref "$GITHUB_REF" \
            --expected-run-id "$GITHUB_RUN_ID" \
            --expected-run-attempt "$GITHUB_RUN_ATTEMPT"

      - name: Upload official exact checked-head evidence artifact
        if: always() && steps.gate.outcome == 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v66-checked-head-official-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ env.V66_OUT }}/*
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Upload unmistakable incomplete debug evidence only when gate fails
        if: always() && steps.gate.outcome != 'success'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v66-checked-head-incomplete-debug-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ env.V66_OUT }}/*
          if-no-files-found: warn
          retention-days: 7
          compression-level: 6

      - name: Fail closed and mirror the captured FA exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          out="$GITHUB_WORKSPACE/$V66_OUT"
          [[ "${{ steps.gate.outcome }}" == success ]]
          [[ -s "$out/FINAL_GATE.json" ]]
          [[ "$(tr -d '\r\n' <"$out/wrapper.exit")" == 0 ]]
          [[ "$(tr -d '\r\n' <"$out/Mock2.exit")" == 0 ]]
          [[ "$(tr -d '\r\n' <"$out/Mock2_Advanced.exit")" == 0 ]]
          exit "$(tr -d '\r\n' <"$out/Mock2_FunctionalAnalysis.exit")"
