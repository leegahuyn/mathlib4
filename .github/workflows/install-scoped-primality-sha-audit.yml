name: Install scoped PrimalitySheaf SHA audit once

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/install-scoped-primality-sha-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: install-scoped-primality-sha-audit-once
  cancel-in-progress: true

jobs:
  install:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: fix/primality-sheaf-clean-build
      SOURCE_SHA: ${{ github.sha }}
      TARGET: scripts/primality_workflow_audit.py
      TEMPLATE: scripts/primality_workflow_audit_v2.template
      SELF: .github/workflows/install-scoped-primality-sha-audit.yml

    steps:
      - name: Replace SHA audit and delete this installer
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

          cp "${TEMPLATE}" "${TARGET}"
          git rm "${TEMPLATE}" "${SELF}"
          git add "${TARGET}"
          git diff --cached --check

          go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
          "$(go env GOPATH)/bin/actionlint" .github/workflows/primality-sheaf-ci.yml
          python3 "${TARGET}"

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          test "${remote_head}" = "${SOURCE_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'ci: scope final SHA audit to official workflow'
          git push origin "HEAD:${BRANCH}"
