name: PASS 414 strict full-script tournament from 31725

on:
  push:
    branches:
      - fix/fa414-full-script-tournament-from-31725-20260809
    paths:
      - '.github/workflows/pass414-full-script-tournament.yml'
      - 'scripts/fa414_full_script_tournament.py'
      - 'build-logs/fa414-full-script-tournament/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass414-full-script-tournament
  cancel-in-progress: false

jobs:
  evaluate-full-repairs:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout immutable-derived working branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa414-full-script-tournament-from-31725-20260809
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Materialize, compile, and strictly rank PASS411/PASS412 full candidates
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa414_full_script_tournament.py > /tmp/fa414.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa414.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate evidence and commit only strict champion
        if: always()
        shell: bash
        env:
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
        run: |
          set -euo pipefail
          d=build-logs/fa414-full-script-tournament
          test -s "$d/CURRENT.json"
          test -s "$d/CURRENT.txt"
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('build-logs/fa414-full-script-tournament/CURRENT.json').read_text())
          m=s['selected_metric']
          if not s['complete']:
              raw=m.get('first_line'); normalized=m.get('normalized_first_line')
              if not isinstance(raw,int) or not isinstance(normalized,int):
                  raise SystemExit('missing authoritative first-error metric')
              if raw < 31725 or normalized < 31725:
                  raise SystemExit(f'regression raw={raw} normalized={normalized}')
          if not s['declaration_manifest_unchanged']:
              raise SystemExit('declaration header manifest changed')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit(f"forbidden tokens: {s['forbidden_token_audit']}")
          PY
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/CURRENT.json" "$d/CURRENT.txt" "$d/FIRST_ERROR_CONTEXT.txt"
          test ! -f "$d/ALL_REQUIRED_TARGETS_2X_PASS" || git add "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          if git diff --cached --quiet; then exit 0; fi
          if test -f "$d/ALL_REQUIRED_TARGETS_2X_PASS"; then
            msg='fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS [skip ci]'
          elif test "${SOURCE_CHANGED:-false}" = true; then
            msg='fix: check in strict full-script FA champion [skip ci]'
          else
            msg='ci: record strict FA414 full-script evidence [skip ci]'
          fi
          git commit -m "$msg"
          git push origin HEAD:fix/fa414-full-script-tournament-from-31725-20260809

      - name: Upload complete full-candidate diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass414-full-script-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa414-full-script-tournament
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final two-pass result
        if: always()
        env:
          EXIT_CODE: ${{ steps.tournament.outputs.exit_code }}
        shell: bash
        run: |
          test -n "${EXIT_CODE:-}"
          exit "$EXIT_CODE"
