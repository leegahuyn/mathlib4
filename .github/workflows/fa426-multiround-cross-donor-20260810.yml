name: FA426 multiround cross-donor strict controller

on:
  push:
    branches:
      - fix/fa426-multiround-cross-donor-20260810
    paths:
      - fa426-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  resolve-test-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      EXPECTED_SHA_31725: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
      EXPECTED_SHA_31726: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      PASS423_RUN_ID: '31317392557'
      PASS376_ARTIFACT_ID: '9024606745'
      SOURCE_PATH: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      ACTIVE_BRANCH: fix/fa426-multiround-cross-donor-20260810

    steps:
      - name: Checkout FA426 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa426-multiround-cross-donor-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Allow predecessor strict tournaments to persist evidence
        shell: bash
        run: sleep 420

      - name: Fetch candidate branches and resolve SHA fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fa425b_resolve_verified_champion.sh

      - name: Select best source-matched VERIFIED evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa426_resolve_best_verified.py \
            --refs /tmp/fa425-donor-refs.txt \
            --fallback /tmp/fa425-baseline.lean \
            --output /tmp/fa426-baseline.lean \
            --metadata /tmp/fa426-selection.json
          cp /tmp/fa426-baseline.lean "$SOURCE_PATH"
          test "$(python3 -c "print(len(open('$SOURCE_PATH',encoding='utf-8').read().splitlines()))")" = 60453

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa426-lean-version.txt
          lake --version | tee /tmp/fa426-lake-version.txt
          lake exe cache get | tee /tmp/fa426-cache-get.log

      - name: Run four-round fixed-height cross-donor controller
        id: controller
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa426_run_multiround.py
          d=build-logs/fa426-multiround-cross-donor
          cp /tmp/fa426-selection.json "$d/SELECTION.json"
          cp /tmp/fa425-resolution.txt "$d/FALLBACK_RESOLUTION.txt"
          cp /tmp/fa426-lean-version.txt "$d/lean-version.txt"
          cp /tmp/fa426-lake-version.txt "$d/lake-version.txt"
          cp /tmp/fa426-cache-get.log "$d/cache-get.log"

      - name: Persist only direct-verified source and concise evidence
        if: always()
        shell: bash
        env:
          SOURCE_SHOULD_COMMIT: ${{ steps.controller.outputs.source_should_commit }}
          STRICT_PROMOTION: ${{ steps.controller.outputs.strict_promotion }}
          FA_TRUE_PASS: ${{ steps.controller.outputs.fa_true_pass }}
          ALL_CHAIN_PASS: ${{ steps.controller.outputs.all_chain_pass }}
        run: |
          set -euo pipefail
          d=build-logs/fa426-multiround-cross-donor
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p verified-records/fa426
          cp "$d/CURRENT.json" verified-records/fa426/CURRENT.json
          cp "$d/CURRENT.txt" verified-records/fa426/CURRENT.txt
          cp "$d/SELECTION.json" verified-records/fa426/SELECTION.json
          test ! -f "$d/BASELINE_FIRST_ERROR_CONTEXT.txt" || cp "$d/BASELINE_FIRST_ERROR_CONTEXT.txt" verified-records/fa426/BASELINE_FIRST_ERROR_CONTEXT.txt
          find "$d/rounds" -name 'ROUND.json' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            r=$(basename "$(dirname "$f")")
            mkdir -p "verified-records/fa426/$r"
            cp "$f" "verified-records/fa426/$r/ROUND.json"
            test ! -f "$(dirname "$f")/PROMOTED_FIRST_ERROR_CONTEXT.txt" || cp "$(dirname "$f")/PROMOTED_FIRST_ERROR_CONTEXT.txt" "verified-records/fa426/$r/PROMOTED_FIRST_ERROR_CONTEXT.txt"
          done

          if test "${SOURCE_SHOULD_COMMIT:-false}" = true; then
            git add "$SOURCE_PATH" verified-records/fa426
            if test "${ALL_CHAIN_PASS:-false}" = true; then
              msg='fix: FA426 ordered FA Integrated Mock3 QYM 2x PASS [skip ci]'
            elif test "${FA_TRUE_PASS:-false}" = true; then
              msg='fix: FA426 FunctionalAnalysis TRUE PASS 2x audit clean [skip ci]'
            elif test "${STRICT_PROMOTION:-false}" = true; then
              first=$(python3 -c "import json; d=json.load(open('$d/CURRENT.json')); print(d['selected_metric']['first_error_line'])")
              msg="fix: promote FA426 multiround frontier to ${first} [skip ci]"
            else
              msg='chore: materialize best source-matched direct-verified FA champion [skip ci]'
            fi
          else
            git restore "$SOURCE_PATH"
            git add verified-records/fa426
            msg='evidence: retain verified FA champion after FA426 multiround tournament [skip ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA426 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa426-multiround-cross-donor-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa426-multiround-cross-donor
          if-no-files-found: error
          retention-days: 90

      - name: Classify controller result
        if: always()
        env:
          CONTROLLER_SUCCESS: ${{ steps.controller.outputs.controller_success }}
        shell: bash
        run: test "${CONTROLLER_SUCCESS:-false}" = true
