name: PASS 390 recover completion bridge and verify FA Mock3 QYM

on:
  push:
    branches: [fix/fa390-recover-pass376-completion-20260809]
    paths:
      - '.github/workflows/pass390-fa-frontier.yml'
      - 'scripts/apply_three_hundred_ninetieth_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass390-fa-frontier
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout PASS 390 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 900
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Recover PASS 376 donor and apply PASS 390
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass376-donor /tmp/pass390/logs /tmp/pass390/source
          gh api \
            /repos/${GITHUB_REPOSITORY}/actions/artifacts/9024606745/zip \
            > /tmp/pass376-donor.zip
          unzip -q /tmp/pass376-donor.zip -d /tmp/pass376-donor
          donor="$(find /tmp/pass376-donor -type f -name 'Mock2_FunctionalAnalysis-pass376.lean' -print -quit)"
          test -n "${donor}"
          PASS376_DONOR="${donor}" \
            python3 scripts/apply_three_hundred_ninetieth_pass_functional_analysis_repairs.py \
            | tee /tmp/pass390/logs/apply-pass390.log
          sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            | tee /tmp/pass390/source-sha256.txt
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            /tmp/pass390/source/Mock2_FunctionalAnalysis-pass390.lean

      - name: Audit PASS 390 source
        shell: bash
        run: |
          set -euo pipefail
          TARGET_SCAN=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean python3 - <<'PY'
          from pathlib import Path
          import os, re
          path = Path(os.environ['TARGET_SCAN'])
          src = path.read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-', i): depth += 1; out.extend('  '); i += 2
                  elif src.startswith('-/', i): depth -= 1; out.extend('  '); i += 2
                  else: out.append('\n' if src[i] == '\n' else ' '); i += 1
              elif string:
                  c=src[i]; out.append('\n' if c == '\n' else ' ')
                  if esc: esc=False
                  elif c == '\\': esc=True
                  elif c == '"': string=False
                  i += 1
              elif src.startswith('/-', i): depth=1; out.extend('  '); i += 2
              elif src.startswith('--', i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i += 1
              elif src[i] == '"': string=True; out.append(' '); i += 1
              else: out.append(src[i]); i += 1
          if depth or string: raise SystemExit('unterminated comment or string')
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b', 'admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*axiom\b', 'unsafe':r'\bunsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          result={name:len(re.findall(pat, code)) for name,pat in patterns.items()}
          print(result)
          Path('/tmp/pass390/forbidden-token-audit.txt').write_text(str(result)+'\n')
          if any(result.values()): raise SystemExit(1)
          PY

      - name: Compile required modules in strict order
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          OUTDIR='.lake/build/lib/lean/PrimalitySheafVerification'
          LOGDIR='/tmp/pass390/logs'
          mkdir -p "${OUTDIR}" "${LOGDIR}"
          echo 'module,stage,exit_code,error_count,warning_count' > /tmp/pass390/compile-summary.csv

          compile_one() {
            local module="$1" stage="$2" log code errors warnings
            log="${LOGDIR}/${stage}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            lake env lean -DmaxErrors=250 \
              "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' \
              "${module}" "${stage}" "${code}" "${errors}" "${warnings}" \
              >> /tmp/pass390/compile-summary.csv
            {
              echo "module=${module}"
              echo "stage=${stage}"
              echo "exit_code=${code}"
              echo "error_count=${errors}"
              echo "warning_count=${warnings}"
              echo 'first_errors:'
              grep -n 'error:' "${log}" | head -40 || true
              echo 'last_errors:'
              grep -n 'error:' "${log}" | tail -20 || true
              echo 'tail:'
              tail -300 "${log}" || true
            } > "/tmp/pass390/${stage}-result.txt"
            if [[ "${code}" -ne 0 || "${errors}" -ne 0 ]]; then return 1; fi
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
          }

          compile_twice() {
            compile_one "$1" "$2-pass1" && compile_one "$1" "$2-pass2"
          }

          final_rc=0
          stage='Mock2_FunctionalAnalysis'
          if ! compile_twice Mock2_FunctionalAnalysis FA; then
            final_rc=1
          else
            stage='Mock2_FunctionalAnalysis_Integrated'
            if ! compile_twice Mock2_FunctionalAnalysis_Integrated Integrated; then
              final_rc=1
            else
              stage='Mock3'
              mapfile -t mock3_files < <(find PrimalitySheafVerification -maxdepth 1 \
                -type f -name 'Mock3*.lean' -printf '%f\n' | sort)
              for file in "${mock3_files[@]}"; do
                module="${file%.lean}"
                if ! compile_twice "${module}" "${module}"; then
                  final_rc=1
                  break
                fi
              done
              if [[ "${final_rc}" -eq 0 ]]; then
                stage='QYM'
                if ! compile_twice QYM QYM; then final_rc=1; fi
              fi
            fi
          fi

          echo "stage=${stage}" > /tmp/pass390/final-status.txt
          echo "exit_code=${final_rc}" >> /tmp/pass390/final-status.txt
          echo "exit_code=${final_rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Generate compact status and materialize candidate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/pass390-aggregate
          cp /tmp/pass390/compile-summary.csv build-logs/pass390-aggregate/ || true
          cp /tmp/pass390/final-status.txt build-logs/pass390-aggregate/ || true
          cp /tmp/pass390/forbidden-token-audit.txt build-logs/pass390-aggregate/ || true
          cp /tmp/pass390/*-result.txt build-logs/pass390-aggregate/ 2>/dev/null || true
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          source=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rows=[]
          p=Path('/tmp/pass390/compile-summary.csv')
          if p.exists():
              rows=list(csv.DictReader(p.open()))
          status=Path('/tmp/pass390/final-status.txt').read_text().strip() if Path('/tmp/pass390/final-status.txt').exists() else 'missing'
          complete=bool(rows) and all(r['exit_code']=='0' and r['error_count']=='0' for r in rows) and 'exit_code=0' in status
          data={
              'complete':complete,
              'status':status,
              'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
              'compile_rows':rows,
          }
          Path('build-logs/pass390-aggregate/AUTHORITATIVE_STATUS.json').write_text(json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/pass390-aggregate
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): materialize PASS390 completion recovery result'
            git push origin HEAD:fix/fa390-recover-pass376-completion-20260809
          fi

      - name: Upload PASS 390 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass390-fa-frontier-${{ github.sha }}
          path: /tmp/pass390
          if-no-files-found: error
          retention-days: 90

      - name: Enforce PASS 390 result
        if: always()
        shell: bash
        env:
          FINAL_EXIT_CODE: ${{ steps.compile.outputs.exit_code }}
        run: |
          test -n "${FINAL_EXIT_CODE:-}"
          exit "${FINAL_EXIT_CODE}"
