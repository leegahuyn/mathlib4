name: GPT QYM Probe40a cusp horocycle ContDiff matrix

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe40a-cusp-contdiff.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contdiff:
    name: cusp ContDiff ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        variant: [explicit-cases, captured-formula, direct-simp]
    env:
      OUT: /tmp/qym-probe40a-${{ matrix.variant }}
      TEST: QYM_Probe40a_${{ matrix.variant }}.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified project dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Require dependency cache hit
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          test "$HIT" = true
          test -s "$OLEAN/Mock2_FunctionalAnalysis.olean"
          test -s "$OLEAN/Mock2_FunctionalAnalysis.ilean"

      - name: Materialize isolated producer theorem
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TEST" "${{ matrix.variant }}" <<'PY'
          from pathlib import Path
          import sys

          path = Path(sys.argv[1]); variant = sys.argv[2]
          prelude = '''import PrimalitySheafVerification.Mock2_FunctionalAnalysis
          import Mathlib.Tactic

          open Function Set
          open scoped ENNReal MatrixGroups UpperHalfPlane

          namespace Probe40a

          open Mock2FA.PaperCorrections.AutomorphicSobolev
          open Mock2FA.PaperCorrections.AutomorphicSobolev.GammaTwoQuotientGeometry

          def testHeight (Y : ℝ) : ℝ := gammaTwoCuspLevel Y

          theorem testHeight_pos (Y : ℝ) : 0 < testHeight Y := by
            exact gammaTwoCuspLevel_pos Y

          def horizontal (Y x : ℝ) : ℍ :=
            ⟨(x : ℂ) + (testHeight Y : ℂ) * Complex.I, by
              simp only [Complex.add_im, Complex.ofReal_im, Complex.mul_im,
                Complex.ofReal_re, Complex.I_im, Complex.I_re, mul_one, mul_zero,
                add_zero]
              exact testHeight_pos Y⟩

          def cuspPoint
              (kappa : GammaTwoCusp) (Y x : ℝ) : ℍ :=
            gammaTwoCuspScaling kappa • horizontal Y x

          theorem horizontal_contDiff (Y : ℝ) :
              ContDiff ℝ ∞ (fun x : ℝ => ((horizontal Y x : ℍ) : ℂ)) := by
            simp only [horizontal, UpperHalfPlane.coe_mk]
            fun_prop

          theorem horizontal_ne_zero (Y : ℝ) :
              ∀ x : ℝ, ((horizontal Y x : ℍ) : ℂ) ≠ 0 := by
            intro x hx
            have him := (horizontal Y x).property
            have hz : (((horizontal Y x : ℍ) : ℂ)).im = 0 := by
              rw [hx]
              simp
            linarith

          __BODY__

          end Probe40a
          '''.replace('          ', '')

          explicit = '''theorem cuspPoint_coe_contDiff
              (kappa : GammaTwoCusp) (Y : ℝ) :
              ContDiff ℝ ∞ (fun x : ℝ => ((cuspPoint kappa Y x : ℍ) : ℂ)) := by
            have hhor := horizontal_contDiff Y
            have hne := horizontal_ne_zero Y
            rcases kappa with _ | _ | _
            · simpa [cuspPoint] using hhor
            · have hinv : ContDiff ℝ ∞
                  (fun x : ℝ => (((horizontal Y x : ℍ) : ℂ))⁻¹) :=
                hhor.inv hne
              have hneg : ContDiff ℝ ∞ (fun _ : ℝ => (-1 : ℂ)) := contDiff_const
              have hsmooth := hneg.mul hinv
              simpa [cuspPoint, gammaTwoCuspScaling_zero,
                UpperHalfPlane.coe_specialLinearGroup_apply,
                ModularGroup.S, div_eq_mul_inv] using hsmooth
            · have hone : ContDiff ℝ ∞ (fun _ : ℝ => (1 : ℂ)) := contDiff_const
              have hnum := hhor.sub hone
              have hsmooth := hnum.div hhor hne
              simpa [cuspPoint, gammaTwoCuspScaling_one,
                UpperHalfPlane.coe_specialLinearGroup_apply,
                ModularGroup.T, ModularGroup.S, Matrix.mul_fin_two] using hsmooth
          '''.replace('          ', '')

          captured = '''theorem cuspPoint_coe_contDiff
              (kappa : GammaTwoCusp) (Y : ℝ) :
              ContDiff ℝ ∞ (fun x : ℝ => ((cuspPoint kappa Y x : ℍ) : ℂ)) := by
            let sigma : SL(2, ℤ) := gammaTwoCuspScaling kappa
            let z : ℝ → ℂ := fun x => ((horizontal Y x : ℍ) : ℂ)
            let a : ℂ := algebraMap ℤ ℂ (sigma 0 0)
            let b : ℂ := algebraMap ℤ ℂ (sigma 0 1)
            let c : ℂ := algebraMap ℤ ℂ (sigma 1 0)
            let d : ℂ := algebraMap ℤ ℂ (sigma 1 1)
            have hz : ContDiff ℝ ∞ z := by
              simpa [z] using horizontal_contDiff Y
            have hden : ∀ x, c * z x + d ≠ 0 := by
              intro x
              simpa [c, d, z, sigma] using
                UpperHalfPlane.denom_ne_zero
                  ((sigma : GL (Fin 2) ℝ)) (horizontal Y x)
            have hnum : ContDiff ℝ ∞ (fun x => a * z x + b) := by fun_prop
            have hdenSmooth : ContDiff ℝ ∞ (fun x => c * z x + d) := by fun_prop
            have hsmooth := hnum.div hdenSmooth hden
            simpa [cuspPoint, z, a, b, c, d, sigma,
              UpperHalfPlane.coe_specialLinearGroup_apply] using hsmooth
          '''.replace('          ', '')

          direct = '''theorem cuspPoint_coe_contDiff
              (kappa : GammaTwoCusp) (Y : ℝ) :
              ContDiff ℝ ∞ (fun x : ℝ => ((cuspPoint kappa Y x : ℍ) : ℂ)) := by
            rcases kappa with _ | _ | _
            all_goals
              simp only [cuspPoint, horizontal,
                UpperHalfPlane.coe_specialLinearGroup_apply,
                gammaTwoCuspScaling_atInfinity,
                gammaTwoCuspScaling_zero,
                gammaTwoCuspScaling_one,
                ModularGroup.T, ModularGroup.S, Matrix.mul_fin_two,
                UpperHalfPlane.coe_mk]
            all_goals fun_prop
          '''.replace('          ', '')

          bodies = {
              'explicit-cases': explicit,
              'captured-formula': captured,
              'direct-simp': direct,
          }
          path.write_text(prelude.replace('__BODY__', bodies[variant]) + '\n',
                          encoding='utf-8')
          PY
          cp "$TEST" "$OUT/$TEST"

      - name: Direct Lean compile isolated producer
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/TEST.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/TEST.olean" -i "$OUT/TEST.ilean" \
              "$TEST" > "$OUT/TEST.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/TEST.exit"
          rm -f "$TEST"
          exit 0

      - name: Upload isolated producer evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe40a-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/qym-probe40a-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless isolated theorem passes
        if: always()
        shell: bash
        run: |
          test -f "$OUT/TEST.exit"
          test "$(cat "$OUT/TEST.exit")" = 0
          test -s "$OUT/TEST.olean"
          test -s "$OUT/TEST.ilean"
