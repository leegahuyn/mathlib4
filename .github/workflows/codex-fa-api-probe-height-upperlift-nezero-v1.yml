name: Codex FA API probe height upperLift nezero v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-height-upperlift-nezero-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1;lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact upperLift bridge
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeHeightUpperLiftNeZero.lean <<'LEAN'
          import Mathlib
          open Set Function UpperHalfPlane
          noncomputable def probeUpperLift (u : ℍ → ℂ) : ℂ → ℂ := u ∘ UpperHalfPlane.ofComplex
          def probeHeightC (z : ℍ) : ℂ := (z.im : ℂ)

          example (z : ℂ) (hz : z ∈ UpperHalfPlane.upperHalfPlaneSet) :
              probeUpperLift probeHeightC z ≠ 0 := by
            have hzpos : 0 < z.im := hz
            simp only [probeUpperLift, Function.comp_apply, probeHeightC]
            rw [UpperHalfPlane.ofComplex_apply_of_im_pos hzpos]
            exact Complex.ofReal_ne_zero.mpr (ne_of_gt hzpos)

          example (z : ℂ) (hz : z ∈ UpperHalfPlane.upperHalfPlaneSet) :
              probeUpperLift probeHeightC z ≠ 0 := by
            have hzpos : 0 < z.im := hz
            simp [probeUpperLift, probeHeightC, Function.comp_def,
              UpperHalfPlane.ofComplex_apply_of_im_pos hzpos,
              Complex.ofReal_ne_zero, ne_of_gt hzpos]
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeHeightUpperLiftNeZero.lean | tee /tmp/height-upperlift-nezero.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-height-upperlift-nezero-v1-${{ github.sha }}", path: /tmp/height-upperlift-nezero.log, if-no-files-found: warn, retention-days: 7}
