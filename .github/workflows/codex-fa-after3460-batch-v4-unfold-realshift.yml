name: Codex FA after3460 batch v4 unfold realshift
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3460-batch-v4-unfold-realshift.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build cumulative runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3460_batch_v1.sh').read_text()
          src = src.replace('codex-fa-after3460-batch-v1', 'codex-fa-after3460-batch-v4-unfold-realshift')
          marker = 'curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh'
          assert src.count(marker) == 1
          extra = 'python3 scripts/codex_fa_apply_friedrichs_unfold_3460.py "$OUT"\npython3 scripts/codex_fa_apply_realshift_3485.py "$OUT"\n\n'
          src = src.replace(marker, extra + marker, 1)
          Path('/tmp/codex_fa_after3460_batch_v4_unfold_realshift.sh').write_text(src)
          PY
      - name: Attest patch batch and direct compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3460_batch_v4_unfold_realshift.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3460-batch-v4-unfold-realshift-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3460-batch-v4-unfold-realshift
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3460-batch-v4-unfold-realshift/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3460-batch-v4-unfold-realshift/Mock2_FunctionalAnalysis.exit)"
