name: Mock2 Proof API Direct CI

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2.lean'
      - '.github/workflows/mock2-proof-api-candidate.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock2-proof-api-direct-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Mock2 proof API direct
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - name: Checkout triggering head commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 1

      - name: Select checked-in proof-level declarations without mutation
        shell: bash
        run: |
          set -euo pipefail
          logdir='build-logs/Mock2-proof-api'
          mkdir -p "$logdir"
          git diff --exit-code -- PrimalitySheafVerification/Mock2.lean
          grep -Fq '(M N : ℕ) (hM : M ≠ 0) : Prop where' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'PaperElementaryModel D) : Prop where' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'StaticAcceptanceCertificate (D : PaperElementaryInputData) : Prop where' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'theorem standaloneZeroProfile_certificate' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'theorem checklist_9_standalone_zeroProfile' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'theorem canonicalZeroBridgeModel_certificate' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'theorem certificate : Certificate where' \
            PrimalitySheafVerification/Mock2.lean
          grep -Fq 'theorem staticAcceptance_certificate' \
            PrimalitySheafVerification/Mock2.lean
          cp PrimalitySheafVerification/Mock2.lean "$logdir/repaired-source.lean"
          cmp -s PrimalitySheafVerification/Mock2.lean "$logdir/repaired-source.lean"
          printf '%s\n' \
            'PASS: proof-level Mock2 declarations selected from checked-in source' \
            'PASS: no repair script or source mutation executed' \
            > "$logdir/source-selection.txt"

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Compile checked-in Mock2 proof API
        shell: bash
        run: |
          set +e
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          logdir='build-logs/Mock2-proof-api'
          mkdir -p "$outdir" "$logdir"
          rm -f \
            "$outdir/Mock2.olean" \
            "$outdir/Mock2.ilean" \
            "$outdir/Mock2.olean.private"
          lake env lean PrimalitySheafVerification/Mock2.lean \
            -o "$outdir/Mock2.olean" \
            -i "$outdir/Mock2.ilean" 2>&1 \
            | tee "$logdir/Mock2.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$logdir/exit-code.txt"
          grep -c 'error:' "$logdir/Mock2.log" > "$logdir/error-count.txt" || true
          grep -c 'warning:' "$logdir/Mock2.log" > "$logdir/warning-count.txt" || true
          if [[ "$code" -eq 0 ]]; then
            test -s "$outdir/Mock2.olean"
            test -s "$outdir/Mock2.ilean"
            sha256sum \
              PrimalitySheafVerification/Mock2.lean \
              "$outdir/Mock2.olean" \
              "$outdir/Mock2.ilean" \
              > "$logdir/sha256.txt"
          fi
          exit "$code"

      - name: Upload direct proof API artifact
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-proof-api-direct
          path: build-logs/Mock2-proof-api
          if-no-files-found: error
          retention-days: 30
