name: GPT QYM fastlane repaired complete GammaTwo theorem

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe39h-mod2.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

jobs:
  theorem:
    name: Repaired complete GammaTwo theorem
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT: /tmp/qym-gamma-repaired
      TEST: QYM_Probe39j_repaired.lean
      SOURCE_SHA: 0dc93f177661dc406c86c1737c8e35b0435a2acf14cbfaf56074677862212da6
      SOURCE_BLOB: e38697cb52d0c79d8f6af25145d1d4ea258d518a

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Probe39j theorem evidence
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: qym-probe39j-c335152aae40cc2c2670eedc84ca976a2ee45197
          path: ${{ runner.temp }}/p39j
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32132783118

      - name: Gate and repair exact theorem source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          A="$RUNNER_TEMP/p39j"
          test "$(cat "$A/TEST.exit")" = 1
          test "$(sha256sum "$A/QYM_Probe39j.lean" | awk '{print $1}')" = "$SOURCE_SHA"
          test "$(git hash-object --no-filters "$A/QYM_Probe39j.lean")" = "$SOURCE_BLOB"
          cp "$A/QYM_Probe39j.lean" "$TEST"
          python3 - "$TEST" <<'PY'
          from pathlib import Path
          import hashlib,re,sys
          p=Path(sys.argv[1]); raw=p.read_bytes()
          assert hashlib.sha256(raw).hexdigest()=="0dc93f177661dc406c86c1737c8e35b0435a2acf14cbfaf56074677862212da6"
          s=raw.decode('utf-8')
          old='''  have hInv01 : (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 1 = (-1 : ℤ) := by
            have h := congrArg (fun g : SL(2, ℤ) => g 0 1)
              (inv_mul_cancel ModularGroup.T)
            norm_num [Matrix.SpecialLinearGroup.coe_mul,
              ModularGroup.T, Matrix.mul_fin_two, hInv00] at h
            exact h
          '''
          new='''  have hInv01 : (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 1 = (-1 : ℤ) := by
            rw [← zpow_neg_one, ModularGroup.coe_T_zpow]
            norm_num
          '''
          assert s.count(old)==1,s.count(old)
          s=s.replace(old,new,1)
          bad={
            'sorry':len(re.findall(r'\bsorry\b',s)),
            'admit':len(re.findall(r'\badmit\b',s)),
            'native_decide':len(re.findall(r'\bnative_decide\b',s)),
            'ofReduceBool':s.count('Lean.ofReduceBool'),
            'axiom':len(re.findall(r'(?m)^\s*axiom\s+',s)),
            'unsafe':len(re.findall(r'(?m)^\s*unsafe\s+',s)),
            'hb0':len(re.findall(r'set_option\s+maxHeartbeats\s+0\b',s)),
          }
          assert not any(bad.values()),bad
          p.write_text(s,encoding='utf-8')
          result=p.read_bytes()
          print(hashlib.sha256(result).hexdigest(),len(result),result.count(b'\n'))
          PY
          cp "$TEST" "$OUT/$TEST"
          sha256sum "$TEST" > "$OUT/TEST.source.sha256"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Direct Lean compile repaired theorem
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/TEST.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/TEST.olean" -i "$OUT/TEST.ilean" \
              "$TEST" > "$OUT/TEST.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/TEST.exit"
          if [[ "$rc" -eq 0 ]]; then sha256sum "$OUT/TEST.olean" "$OUT/TEST.ilean" > "$OUT/TEST.outputs.sha256"; fi
          rm -f "$TEST"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gamma-repaired-${{ github.sha }}
          path: /tmp/qym-gamma-repaired/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless theorem passes
        if: always()
        shell: bash
        run: |
          test "$(cat "$OUT/TEST.exit")" = 0
          test -s "$OUT/TEST.olean"
          test -s "$OUT/TEST.ilean"
