name: GPT QYM Probe39h focused inverse-entry matrix

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe39h-mod2.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro:
    name: GammaTwo-focused ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [tinv-sl2, tinv-zpow, tst-rw]
    env:
      OUT: /tmp/qym-probe39h-${{ matrix.variant }}
      TEST: QYM_Probe39h_${{ matrix.variant }}.lean

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1

      - name: Materialize focused proof
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TEST" "${{ matrix.variant }}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1]); variant = sys.argv[2]
          prelude = '''import Mathlib.Analysis.Complex.UpperHalfPlane.Manifold
          import Mathlib.NumberTheory.Modular
          import Mathlib.NumberTheory.ModularForms.CongruenceSubgroups
          import Mathlib.LinearAlgebra.Matrix.Notation
          import Mathlib.Tactic

          open Matrix Function Set Topology
          open scoped MatrixGroups UpperHalfPlane

          __BODY__
          '''.replace("          ", "")

          tinv_sl2 = '''example :
              (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 1 = (-1 : ℤ) := by
            norm_num [SL2_inv_expl, ModularGroup.T]
          '''.replace("          ", "")

          tinv_zpow = '''example :
              (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 1 = (-1 : ℤ) := by
            rw [← zpow_neg_one, ModularGroup.coe_T_zpow]
            norm_num
          '''.replace("          ", "")

          tst_rw = '''theorem ts_lower_entry :
              (ModularGroup.T * ModularGroup.S : SL(2, ℤ)) 1 0 = (1 : ℤ) := by
            change
              ModularGroup.T.val 1 0 * ModularGroup.S.val 0 0 +
                ModularGroup.T.val 1 1 * ModularGroup.S.val 1 0 = 1
            norm_num [ModularGroup.T, ModularGroup.S]

          theorem ts_11_entry :
              (ModularGroup.T * ModularGroup.S : SL(2, ℤ)) 1 1 = (0 : ℤ) := by
            change
              ModularGroup.T.val 1 0 * ModularGroup.S.val 0 1 +
                ModularGroup.T.val 1 1 * ModularGroup.S.val 1 1 = 0
            norm_num [ModularGroup.T, ModularGroup.S]

          example :
              (ModularGroup.T * ModularGroup.S * ModularGroup.T :
                SL(2, ℤ)) 1 0 = (1 : ℤ) := by
            change
              (ModularGroup.T * ModularGroup.S).val 1 0 *
                  ModularGroup.T.val 0 0 +
                (ModularGroup.T * ModularGroup.S).val 1 1 *
                  ModularGroup.T.val 1 0 = 1
            rw [ts_lower_entry, ts_11_entry]
            norm_num [ModularGroup.T]
          '''.replace("          ", "")

          bodies = {"tinv-sl2": tinv_sl2, "tinv-zpow": tinv_zpow,
                    "tst-rw": tst_rw}
          path.write_text(prelude.replace("__BODY__", bodies[variant]) + "\n",
                          encoding="utf-8")
          PY
          cp "$TEST" "$OUT/$TEST"

      - name: Direct Lean compile proof
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/TEST.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/TEST.olean" -i "$OUT/TEST.ilean" \
              "$TEST" > "$OUT/TEST.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/TEST.exit"
          rm -f "$TEST"
          exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe39h-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/qym-probe39h-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless proof passes
        if: always()
        shell: bash
        run: |
          test -f "$OUT/TEST.exit"
          test "$(cat "$OUT/TEST.exit")" = 0
          test -s "$OUT/TEST.olean"
          test -s "$OUT/TEST.ilean"
