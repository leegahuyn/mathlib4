name: Bootstrap FA local workspace chunks

on:
  push:
    branches: [bootstrap/fa-local-chunks-20260808]
    paths:
      - '.github/workflows/bootstrap-fa-local-chunks.yml'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: bootstrap-fa-local-chunks
  cancel-in-progress: true

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact bootstrap head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 600
          persist-credentials: false

      - name: Install pinned Lean and full mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Reconstruct exact PASS 353 source without full compilation
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the direct compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass353_fa.sh
          test -s /tmp/diagnose-pass353-fa/source/Mock2_FunctionalAnalysis-pass353.lean
          cp /tmp/diagnose-pass353-fa/source/Mock2_FunctionalAnalysis-pass353.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

      - name: Package and split runtime and workspace
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/fa-chunks
          tar --zstd -cf /tmp/fa-chunks/fa-local-elan.tar.zst \
            -C "${HOME}" .elan
          tar --zstd -cf /tmp/fa-chunks/fa-local-workspace.tar.zst \
            --exclude='./.git' \
            --exclude='./build-logs/candidates' \
            .
          sha256sum /tmp/fa-chunks/*.tar.zst > /tmp/fa-chunks/SHA256SUMS.txt
          split -b 350M -d -a 2 \
            /tmp/fa-chunks/fa-local-elan.tar.zst \
            /tmp/fa-chunks/fa-local-elan.part-
          split -b 350M -d -a 2 \
            /tmp/fa-chunks/fa-local-workspace.tar.zst \
            /tmp/fa-chunks/fa-local-workspace.part-
          rm /tmp/fa-chunks/fa-local-elan.tar.zst \
             /tmp/fa-chunks/fa-local-workspace.tar.zst
          ls -lh /tmp/fa-chunks

      - name: Upload checksums
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-local-chunks-checksums-${{ github.sha }}
          path: /tmp/fa-chunks/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 14
          compression-level: 0

      - name: Upload elan part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-elan-part-00-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-elan.part-00, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload elan part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-elan-part-01-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-elan.part-01, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload elan part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-elan-part-02-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-elan.part-02, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload elan part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-elan-part-03-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-elan.part-03, if-no-files-found: ignore, retention-days: 14, compression-level: 0}

      - name: Upload workspace part 00
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-00-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-00, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 01
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-01-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-01, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 02
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-02-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-02, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 03
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-03-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-03, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 04
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-04-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-04, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 05
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-05-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-05, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 06
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-06-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-06, if-no-files-found: ignore, retention-days: 14, compression-level: 0}
      - name: Upload workspace part 07
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: fa-local-workspace-part-07-${{ github.sha }}, path: /tmp/fa-chunks/fa-local-workspace.part-07, if-no-files-found: ignore, retention-days: 14, compression-level: 0}

      - name: Emit run id after preserving chunks
        if: always()
        shell: bash
        run: |
          echo "bootstrap_chunks_run_id=${GITHUB_RUN_ID}"
          exit 1
