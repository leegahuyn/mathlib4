name: Mock2 FunctionalAnalysis pass 315 gated ARM materialization

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/mock2-functional-analysis-pass315-arm-gated-materialize.yml'
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'scripts/apply_three_hundred_thirteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fourteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fifteenth_pass_repairs.py'
      - '.github/workflows/mock2-functional-analysis-pass315-arm-gated-materialize.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mock2-functional-analysis-pass315-gated-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      QYM: PrimalitySheafVerification/QYM.lean
      ADVANCED_BASELINE_COMMIT: 623dfac27a24c170330d6218005e67b06490b814
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_ADVANCED_FINAL_BLOB: b71f0800da56dd6fa6b4f1c26396d97a48d64027
      EXPECTED_ADVANCED_SHA256: e594962bf74db44403372f93c99edaeb7ba8af9b584dc196fbb86a51f73b28ff
      EXPECTED_ADVANCED_BASELINE_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_FA_START_BLOB: 4eedc43d57f96b45897990bbeaada01ee0fd3b84
      EXPECTED_PRE313_SHA256: 7048e0cd364ff150a79b4696b08db0c3a29aa29dc252d623650818f59f6162ca
      EXPECTED_CANDIDATE_SHA256: 36258b062cf8caef1f07cb28111cf0d6293897515b0cc49565f177eb2195de69
      LOGDIR: build-logs/Mock2_FunctionalAnalysis-pass315-gated

    steps:
      - name: Clone exact branch head and enforce the Advanced dependency gate
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "${HEAD_BRANCH}" = "${BRANCH}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          advanced_blob="$(git hash-object "${ADVANCED}")"
          if [[ "${advanced_blob}" != "${EXPECTED_ADVANCED_FINAL_BLOB}" ]]; then
            echo "Mock2_Advanced pass 316 is not materialized yet: ${advanced_blob}" >&2
            exit 1
          fi
          test "$(sha256sum "${ADVANCED}" | awk '{print $1}')" = "${EXPECTED_ADVANCED_SHA256}"
          mkdir -p "${LOGDIR}"
          if [[ -f "${INTEGRATED}" ]]; then
            test "$(sha256sum "${INTEGRATED}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
            grep -Fq 'import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated' "${FA}"
            echo 'SOURCE_STATE=materialized' >> "${GITHUB_ENV}"
          else
            test "$(git hash-object "${FA}")" = "${EXPECTED_FA_START_BLOB}"
            echo 'SOURCE_STATE=baseline' >> "${GITHUB_ENV}"
          fi
          printf '%s\n' \
            "head_sha=${HEAD_SHA}" \
            "source_state=${SOURCE_STATE:-pending}" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_blob=${advanced_blob}" \
            > "${LOGDIR}/snapshot.txt"

      - name: Reproduce the pass 315 candidate
        if: env.SOURCE_STATE == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cp "${ADVANCED}" /tmp/checked-in-Mock2_Advanced.lean
          git fetch --depth=1 origin "${ADVANCED_BASELINE_COMMIT}"
          git show "${ADVANCED_BASELINE_COMMIT}:${ADVANCED}" > "${ADVANCED}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_BASELINE_BLOB}"
          scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
          )
          for script in "${scripts[@]}"; do
            python3 "scripts/${script}"
          done 2>&1 | tee "${LOGDIR}/pre313-repair-application.log"
          pre313_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          test "${pre313_sha}" = "${EXPECTED_PRE313_SHA256}"
          for script in \
            apply_three_hundred_thirteenth_pass_repairs.py \
            apply_three_hundred_fourteenth_pass_repairs.py \
            apply_three_hundred_fifteenth_pass_repairs.py; do
            python3 "scripts/${script}"
          done 2>&1 | tee "${LOGDIR}/pass313-315-application.log"
          cp /tmp/checked-in-Mock2_Advanced.lean "${ADVANCED}"
          while IFS= read -r changed; do
            [[ -z "${changed}" || "${changed}" = "${FA}" ]] || \
              git restore --source=HEAD --worktree -- "${changed}"
          done < <(git diff --name-only)
          test "$(git diff --name-only)" = "${FA}"
          git diff --check
          candidate_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          test "${candidate_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          printf '%s\n' \
            "pre313_sha256=${pre313_sha}" \
            "candidate_sha256=${candidate_sha}" \
            "candidate_lines=$(wc -l < "${FA}")" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Static forbidden-token audit
        shell: bash
        run: |
          set -euo pipefail
          target="${FA}"
          [[ "${SOURCE_STATE}" = materialized ]] && target="${INTEGRATED}"
          TARGET_SCAN="${target}" python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import os, re
          src = Path(os.environ["TARGET_SCAN"]).read_text(encoding="utf-8")
          out = []
          i = 0
          depth = 0
          in_string = False
          escaped = False
          while i < len(src):
              if depth:
                  if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                  elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                  else: out.append("\n" if src[i] == "\n" else " "); i += 1
              elif in_string:
                  ch = src[i]; out.append("\n" if ch == "\n" else " ")
                  if escaped: escaped = False
                  elif ch == "\\": escaped = True
                  elif ch == '"': in_string = False
                  i += 1
              elif src.startswith("/-", i): depth = 1; out.extend("  "); i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n": out.append(" "); i += 1
              elif src[i] == '"': in_string = True; out.append(" "); i += 1
              else: out.append(src[i]); i += 1
          code = "".join(out)
          checks = {
              "sorry": r"\bsorry\b", "admit": r"\badmit\b",
              "line_start_axiom": r"(?m)^\s*axiom\b", "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
          }
          bad = False
          for name, pattern in checks.items():
              count = len(list(re.finditer(pattern, code)))
              print(f"{name}: {count}")
              bad |= count != 0
          if depth or in_string: raise SystemExit("unterminated comment or string")
          if bad: raise SystemExit("forbidden executable token detected")
          PY

      - name: Install Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version | tee "${LOGDIR}/lean-version.txt"
          "${HOME}/.elan/bin/lake" --version | tee "${LOGDIR}/lake-version.txt"
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Compile Mock2 and checked-in Mock2 Advanced dependencies
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}"
          for module in Mock2 Mock2_Advanced; do
            rm -f "${outdir}/${module}.olean" "${outdir}/${module}.ilean" \
              "${outdir}/${module}.olean.private"
            "${HOME}/.elan/bin/lake" env lean \
              "PrimalitySheafVerification/${module}.lean" \
              -o "${outdir}/${module}.olean" -i "${outdir}/${module}.ilean" 2>&1 \
              | tee "${LOGDIR}/${module}.log"
            test -s "${outdir}/${module}.olean"
            test -s "${outdir}/${module}.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/${module}.log" || true)" -eq 0
            ! grep -Eq "declaration uses 'sorry'|sorryAx" "${LOGDIR}/${module}.log"
          done

      - name: Compile the pass 315 full candidate twice
        if: env.SOURCE_STATE == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          for pass in 1 2; do
            rm -f "${outdir}/Mock2_FunctionalAnalysis.olean" \
              "${outdir}/Mock2_FunctionalAnalysis.ilean" \
              "${outdir}/Mock2_FunctionalAnalysis.olean.private"
            set +e
            "${HOME}/.elan/bin/lake" env lean "${FA}" \
              -o "${outdir}/Mock2_FunctionalAnalysis.olean" \
              -i "${outdir}/Mock2_FunctionalAnalysis.ilean" 2>&1 \
              | tee "${LOGDIR}/full-candidate-pass${pass}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "${code}" > "${LOGDIR}/full-candidate-exit-pass${pass}.txt"
            if [[ "${code}" -ne 0 ]]; then
              grep -n 'error:' "${LOGDIR}/full-candidate-pass${pass}.log" | head -20 || true
              grep -n 'error:' "${LOGDIR}/full-candidate-pass${pass}.log" | tail -1 || true
              tail -240 "${LOGDIR}/full-candidate-pass${pass}.log" || true
              exit "${code}"
            fi
            test -s "${outdir}/Mock2_FunctionalAnalysis.olean"
            test -s "${outdir}/Mock2_FunctionalAnalysis.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/full-candidate-pass${pass}.log" || true)" -eq 0
            ! grep -Eq "declaration uses 'sorry'|sorryAx" "${LOGDIR}/full-candidate-pass${pass}.log"
          done

      - name: Materialize the real Integrated split in the worktree
        if: env.SOURCE_STATE == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cp "${FA}" "${INTEGRATED}"
          cat > "${FA}" <<'LEAN'
          /-!
          # Mock2 FunctionalAnalysis compatibility entry point

          The complete source-level implementation is stored in
          `PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated`.
          This module preserves the historical import path and re-exports the
          same public declarations without duplicating their definitions.
          -/
          import PrimalitySheafVerification.Mock2_FunctionalAnalysis_Integrated
          LEAN
          test "$(sha256sum "${INTEGRATED}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          git diff --check

      - name: Compile Integrated and compatibility entry point twice
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          for pass in 1 2; do
            rm -f "${outdir}/Mock2_FunctionalAnalysis_Integrated.olean" \
              "${outdir}/Mock2_FunctionalAnalysis_Integrated.ilean" \
              "${outdir}/Mock2_FunctionalAnalysis_Integrated.olean.private" \
              "${outdir}/Mock2_FunctionalAnalysis.olean" \
              "${outdir}/Mock2_FunctionalAnalysis.ilean" \
              "${outdir}/Mock2_FunctionalAnalysis.olean.private"
            for module in Mock2_FunctionalAnalysis_Integrated Mock2_FunctionalAnalysis; do
              set +e
              "${HOME}/.elan/bin/lake" env lean \
                "PrimalitySheafVerification/${module}.lean" \
                -o "${outdir}/${module}.olean" -i "${outdir}/${module}.ilean" 2>&1 \
                | tee "${LOGDIR}/${module}-pass${pass}.log"
              code=${PIPESTATUS[0]}
              set -e
              if [[ "${code}" -ne 0 ]]; then
                grep -n 'error:' "${LOGDIR}/${module}-pass${pass}.log" | head -20 || true
                tail -240 "${LOGDIR}/${module}-pass${pass}.log" || true
                exit "${code}"
              fi
              test -s "${outdir}/${module}.olean"
              test -s "${outdir}/${module}.ilean"
              test "$(grep -c 'error:' "${LOGDIR}/${module}-pass${pass}.log" || true)" -eq 0
              ! grep -Eq "declaration uses 'sorry'|sorryAx" "${LOGDIR}/${module}-pass${pass}.log"
            done
          done

      - name: Smoke-test QYM past the Integrated object boundary
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          rm -f "${outdir}/QYM.olean" "${outdir}/QYM.ilean" "${outdir}/QYM.olean.private"
          set +e
          "${HOME}/.elan/bin/lake" env lean "${QYM}" \
            -o "${outdir}/QYM.olean" -i "${outdir}/QYM.ilean" 2>&1 \
            | tee "${LOGDIR}/QYM-smoke.log"
          code=${PIPESTATUS[0]}
          set -e
          echo "${code}" > "${LOGDIR}/QYM-smoke-exit-code.txt"
          ! grep -Fq "Mock2_FunctionalAnalysis_Integrated.olean' of module" "${LOGDIR}/QYM-smoke.log"
          ! grep -Fq "Mock2_Advanced.olean' of module" "${LOGDIR}/QYM-smoke.log"
          ! grep -Fq "Mock2.olean' of module" "${LOGDIR}/QYM-smoke.log"
          echo "qym_smoke_exit_code=${code}"
          echo "qym_error_count=$(grep -c 'error:' "${LOGDIR}/QYM-smoke.log" || true)"
          grep -n 'error:' "${LOGDIR}/QYM-smoke.log" | head -20 || true
          grep -n 'error:' "${LOGDIR}/QYM-smoke.log" | tail -1 || true

      - name: Commit the verified Integrated split
        if: env.SOURCE_STATE == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger_head=${HEAD_SHA}"
          echo "remote_head=${remote_head}"
          test "${remote_head}" = "${HEAD_SHA}"
          changed="$(git diff --name-only | sort)"
          expected="$(printf '%s\n%s\n' "${FA}" "${INTEGRATED}" | sort)"
          test "${changed}" = "${expected}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FA}" "${INTEGRATED}"
          test "$(git diff --cached --name-only | sort)" = "${expected}"
          git commit -m 'fix: materialize Mock2 FunctionalAnalysis pass 315 split'
          git push origin "HEAD:${BRANCH}"
