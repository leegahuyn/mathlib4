name: Codex FA483 selectedHeightBasePoint_exp strict direct Lean

on:
  push:
    branches:
      - fix/fa483-selected-height-exp-upper-ext-20260811
    paths:
      - .github/workflows/codex-fa483-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa483-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: minimal_simpa
      FA476_R3_EVIDENCE_RUN_ID: "31407777360"
      FA476_R3_EVIDENCE_ARTIFACT_ID: "9070636218"
      FA476_R3_EVIDENCE_ARTIFACT_DIGEST: "sha256:343607e51bea29fd2878bf6ebfcc0c1c8b1daf9826733b0cd3729e63fbbea3ca"
      FA477_VARIANT: upper_ext_h_simp_only
      FA477_EVIDENCE_RUN_ID: "31409787172"
      FA477_EVIDENCE_JOB_ID: "93524786715"
      FA477_EVIDENCE_HEAD_SHA: faf902ceda7cce10ada4399326330effaa4d669b
      FA477_EVIDENCE_ARTIFACT_ID: "9071387258"
      FA477_EVIDENCE_ARTIFACT_NAME: codex-fa477-minimal_simpa-run31407777360-artifact9070636218-upper_ext_h_simp_only
      FA477_EVIDENCE_ARTIFACT_SIZE: "598253"
      FA477_EVIDENCE_ARTIFACT_DIGEST: "sha256:25928120f3113f98886a469b255eec59754bfd232b4df621f4efa4e1e9940b81"
      FA478_VARIANT: real_norm_eq_abs_only
      FA478_EVIDENCE_RUN_ID: "31416050563"
      FA478_EVIDENCE_JOB_ID: "93545285888"
      FA478_EVIDENCE_HEAD_SHA: 46241996e61a001d498ad3e126dc8b38867bff86
      FA478_EVIDENCE_SOURCE_SHA256: 53a703d3e138ae7a964b7221c52337082cb59820595cfce877a679f024fbcf82
      FA478_FIRST_ERROR_LINE: "35133"
      FA478_FIRST_ERROR_COL: "8"
      FA478_FRONTIER_DECLARATION: selectedLogHeightNaturalGauge_eventuallyEq_zero
      FA478_FRONTIER_INDEX: "2796"
      FA479_VARIANT: simp_only_hlevel
      FA479_EVIDENCE_RUN_ID: "31418190945"
      FA479_EVIDENCE_JOB_ID: "93552181972"
      FA479_EVIDENCE_HEAD_SHA: 23432f72b76df7a708322ad12afa4ac807fce722
      FA479_EVIDENCE_SOURCE_SHA256: 9e88d79d650d9a9a2f334aceb14f0ef14890f62785f045e03ffb073fd007eb3a
      FA479_FIRST_ERROR_LINE: "35118"
      FA479_FIRST_ERROR_COL: "64"
      FA479_FRONTIER_DECLARATION: selectedLogHeightNaturalGauge_eventuallyEq_zero
      FA479_FRONTIER_INDEX: "2796"
      FA480_VARIANT: pi_zero_apply
      FA480_EVIDENCE_RUN_ID: "31419752422"
      FA480_EVIDENCE_JOB_ID: "93557362741"
      FA480_EVIDENCE_HEAD_SHA: a7b882e84aa31a321e0f108b5f56ca477586ddd8
      FA480_EVIDENCE_SOURCE_SHA256: 939a4d0db78c0a7e4fadf5a1db97626aaccbb1d7258f6bf77a0ffbede83f52b9
      FA480_FIRST_ERROR_LINE: "35196"
      FA480_FIRST_ERROR_COL: "2"
      FA480_FRONTIER_DECLARATION: selectedHeightBasePoint_of_pos
      FA480_FRONTIER_INDEX: "2802"
      FA481_VARIANT: upper_half_plane_ext
      FA481_EVIDENCE_RUN_ID: "31420785622"
      FA481_EVIDENCE_JOB_ID: "93560723204"
      FA481_EVIDENCE_HEAD_SHA: 058fe008a54c3fc1b170a27320a41eb942a1d409
      FA481_EVIDENCE_SOURCE_SHA256: bf1f5f64a53662e9c583e8af37aef603d0b96119a6623f029979ceda1a721614
      FA481_FIRST_ERROR_LINE: "35198"
      FA481_FIRST_ERROR_COL: "46"
      FA481_FRONTIER_DECLARATION: selectedHeightBasePoint_of_pos
      FA481_FRONTIER_INDEX: "2802"
      FA482_VARIANT: remove_complex_mk_im
      FA482_EVIDENCE_RUN_ID: "31450425677"
      FA482_EVIDENCE_JOB_ID: "93653492331"
      FA482_EVIDENCE_HEAD_SHA: a0a19ee27ba6c07d30bdd347150bd71550c80f69
      FA482_EVIDENCE_SOURCE_SHA256: daeb276e2c3886ebd9cd93c752e813dc7b288ceb4a872ba734c7634bd0c807ca
      FA482_FIRST_ERROR_LINE: "35203"
      FA482_FIRST_ERROR_COL: "2"
      FA482_FRONTIER_DECLARATION: selectedHeightBasePoint_exp
      FA482_FRONTIER_INDEX: "2803"
      FA483_VARIANT: upper_ext_remove_mk_im
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA483 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA483 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480 -> FA481 -> FA482 -> FA483\`\n- upstream_FA482_run: \`31450425677\`\n- upstream_FA482_source: \`daeb276e2c3886ebd9cd93c752e813dc7b288ceb4a872ba734c7634bd0c807ca\`\n- frontier: \`35203:2 selectedHeightBasePoint_exp\`\n- patch: \`Subtype.ext -> UpperHalfPlane.ext; remove Complex.mk_im in declaration 2803 only\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA483 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa483_selected_height_exp_candidate_ci.sh 2>&1 | tee /tmp/fa483-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA483 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa483-comment.md
          from pathlib import Path
          import json
          import os
          out = Path("build-logs/codex-fa483-selected-height-exp/candidates/norms")
          metric = out / "METRIC.json"
          candidate = out / "CANDIDATE.json"
          log = Path("/tmp/fa483-observe.log")
          source = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")
          parts = [
              "## FA483 observer — actual remote execution", "",
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID', '')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- script_exit: `{os.environ.get('SCRIPT_EXIT', '')}`",
              "- sequence: `FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480 -> FA481 -> FA482 -> FA483`",
              "- variant: `upper_ext_remove_mk_im`", "",
          ]
          metric_data = None
          if metric.exists():
              raw = metric.read_text(encoding="utf-8")
              parts += ["### METRIC.json", "```json", raw[:32000], "```", ""]
              try: metric_data = json.loads(raw)
              except Exception: pass
          else:
              parts += ["### METRIC.json", "`MISSING`", ""]
          if candidate.exists():
              parts += ["### CANDIDATE.json", "```json", candidate.read_text(encoding="utf-8")[:16000], "```", ""]
          if source.exists():
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              center = 35203
              if isinstance(metric_data, dict) and isinstance(metric_data.get("FA_first_actual_error_line"), int):
                  center = metric_data["FA_first_actual_error_line"]
              lo, hi = max(1, center - 16), min(len(lines), center + 24)
              snippet = "\n".join(f"{i}: {lines[i-1]}" for i in range(lo, hi + 1))
              parts += [f"### Exact FA483 candidate source around line {center}", "```lean", snippet, "```", ""]
          if log.exists():
              tail = "\n".join(log.read_text(encoding="utf-8", errors="replace").splitlines()[-120:])
              parts += ["### Tail of actual execution log", "```text", tail[-16000:], "```", ""]
          print("\n".join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa483-comment.md)"

      - name: Preserve FA483 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
