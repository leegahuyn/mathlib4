name: Adaptive Mock2 Advanced Lean-probe materialization v9

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'scripts/adaptive_mock2_advanced_universe_probe_v9.py'
      - 'scripts/ci_adaptive_mock2_advanced_probe_v7.sh'
      - 'scripts/apply_*_pass_mock2_advanced_repairs.py'
      - 'scripts/apply_*_pass_repairs.py'
      - '.github/workflows/adaptive-mock2-advanced-probe-v9.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: adaptive-mock2-advanced-probe-v9
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 720
    env:
      BRANCH: fix/primality-sheaf-clean-build
      SOURCE_SHA: ${{ github.sha }}
      PR_NUMBER: '7'
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Clone exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Probe at file end and materialize verified Advanced source
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          sed \
            -e 's#adaptive_mock2_advanced_universe_probe_v7.py#adaptive_mock2_advanced_universe_probe_v9.py#g' \
            -e 's#/tmp/adaptive-mock2-advanced-probe-v7#/tmp/adaptive-mock2-advanced-probe-v9#g' \
            scripts/ci_adaptive_mock2_advanced_probe_v7.sh \
            > /tmp/ci_adaptive_mock2_advanced_probe_v9.sh
          bash /tmp/ci_adaptive_mock2_advanced_probe_v9.sh

      - name: Continue the completion chain when no source push was needed
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${SOURCE_SHA}" ]]; then
            echo "A verified source commit was pushed: ${remote_head}"
            exit 0
          fi
          bash scripts/orchestrate_primality_completion.sh

      - name: Upload file-end Lean-probe evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: adaptive-mock2-advanced-probe-v9-${{ env.SOURCE_SHA }}
          path: |
            /tmp/adaptive-mock2-advanced-probe-v9
            /tmp/primality-completion-orchestrator
            /tmp/materialize-mock2-functional-analysis
            /tmp/primality-orchestrator-full-gate
            /tmp/primality-finalizer-validation
            /tmp/primality-finalizer
          if-no-files-found: warn
          retention-days: 30
