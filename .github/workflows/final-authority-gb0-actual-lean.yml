name: Final Authority GB0 — Actual Lean Final13 Clean Replay

on:
  push:
    branches:
      - gpt/final-authority-gb0-canonical-20260820
    paths:
      - .github/workflows/final-authority-gb0-actual-lean.yml
      - scripts/**
      - PrimalitySheafVerification/**
      - lean-toolchain
      - lakefile.lean
      - lake-manifest.json
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-authority-gb0-${{ github.ref }}
  cancel-in-progress: false

jobs:
  actual-lean-final-authority:
    if: github.ref_name == 'gpt/final-authority-gb0-canonical-20260820'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout exact triggering source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Assert authoritative branch and clean source tree
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "gpt/final-authority-gb0-canonical-20260820"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.0-rc1"
          test -s scripts/final_authority_gate.py
          test -s scripts/final_authority_gate_v2.py

      - name: Install pinned Lean and Mathlib dependency cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version
          lake --version

      - name: Execute protected-source replay, Mock3, Final13, BuildAll, clean x2, checklist 15
        id: authority
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          python3 scripts/final_authority_gate_v2.py 2>&1 | tee /tmp/final-authority-runner.log
          rc=${PIPESTATUS[0]}
          set -e
          mkdir -p .final_authority
          cp /tmp/final-authority-runner.log .final_authority/WORKFLOW_RUNNER.log
          printf '%s\n' "$rc" > .final_authority/WORKFLOW_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          exit "$rc"

      - name: Print compact authority diagnostics
        if: always()
        shell: bash
        run: |
          set -u
          if [[ ! -d .final_authority ]]; then
            echo "No .final_authority directory was produced."
            exit 0
          fi
          find .final_authority -maxdepth 2 -type f -printf '%p\n' | sort
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.final_authority')
          status = root / 'FINAL_STATUS_CARD.md'
          if status.is_file():
              print('\n===== FINAL_STATUS_CARD.md =====')
              print(status.read_text(encoding='utf-8', errors='replace'))

          preflight_path = root / 'PREFLIGHT.json'
          if preflight_path.is_file():
              p = json.loads(preflight_path.read_text(encoding='utf-8'))
              print('===== PREFLIGHT COMPACT =====')
              print(json.dumps({
                  'pass': p.get('pass'),
                  'branch': p.get('branch'),
                  'tracked_status': p.get('tracked_status'),
                  'toolchain_ok': p.get('toolchain') == p.get('toolchain_expected'),
                  'root_count_ok': p.get('root_count_ok'),
                  'all_paths_exist': p.get('all_paths_exist_and_are_canonical_files'),
                  'graph_pass': p.get('graph', {}).get('pass'),
                  'diff_check_pass': p.get('diff_check', {}).get('pass'),
                  'temporary_audit_pass': p.get('temporary_file_audit', {}).get('pass'),
                  'changed_paths_pass': p.get('changed_paths_audit', {}).get('pass'),
                  'unexpected_paths': p.get('changed_paths_audit', {}).get('unexpected_paths'),
                  'forbidden_count_final_policy': p.get('forbidden_audit', {}).get('forbidden_count'),
              }, indent=2, ensure_ascii=False))

          forbidden_path = root / 'FORBIDDEN_AUDIT.json'
          if forbidden_path.is_file():
              f = json.loads(forbidden_path.read_text(encoding='utf-8'))
              nonzero = []
              for row in f.get('files', []):
                  counts = {k: v for k, v in row.get('forbidden', {}).items() if v}
                  if counts:
                      nonzero.append({'path': row.get('path'), 'counts': counts})
              print('===== FORBIDDEN AUDIT NONZERO FILES =====')
              print(json.dumps({
                  'forbidden_count': f.get('forbidden_count'),
                  'nonzero_files': nonzero,
              }, indent=2, ensure_ascii=False))
          PY

      - name: Upload complete authority evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-gb0-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: .final_authority
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 30
          compression-level: 6
