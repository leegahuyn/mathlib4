name: PR9 queue cleanup v6

# Manual-only, non-destructive cleanup. It must never cancel active repair runs
# merely because the draft PR head changed.
on:
  workflow_dispatch:

permissions:
  actions: write
  contents: read

concurrency:
  group: pass327-pr9-safe-queue-cleanup-v6
  cancel-in-progress: false

jobs:
  cleanup-queued-runs:
    runs-on: ubuntu-24.04
    steps:
      - name: Cancel stale PR9 branch runs without changing repository files
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ci/fa319-isolated-20260807
        run: |
          set -euo pipefail
          gh api --paginate \
            "repos/${GITHUB_REPOSITORY}/actions/runs?branch=${BRANCH}&per_page=100" \
            --jq '.workflow_runs[] | select(.status == "queued" or .status == "in_progress" or .status == "pending") | .id' \
            | sort -u \
            | while IFS= read -r run_id; do
                [[ -n "${run_id}" ]] || continue
                [[ "${run_id}" = "${GITHUB_RUN_ID}" ]] && continue
                gh api -X POST \
                  "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/cancel" \
                  >/dev/null 2>&1 || true
              done
          echo 'Manual queue cleanup complete; no workflow/source files were modified.'
