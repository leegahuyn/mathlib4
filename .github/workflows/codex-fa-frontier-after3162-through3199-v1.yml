name: Codex FA frontier after3162 through3199 v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-after3162-through3199-v1.yml
      - scripts/fa_dynamic_cluster_3165_3166_rewrite_order_v1.json
      - scripts/fa_dynamic_cluster_3177_3178_neg_change_v1.json
      - scripts/fa_dynamic_cluster_3179_restricted_measure_v1.json
      - scripts/fa_dynamic_cluster_3194_3195_ringnf_v1.json
      - scripts/fa_d0a3_r003_high_confidence_overrides.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions: {actions: read, contents: read, statuses: write}
concurrency: {group: codex-fa-frontier-after3162-through3199-v1, cancel-in-progress: true}
env:
  BASE_RUN_ID: "31531830481"
  BASE_HEAD_SHA: "2930011d8f1dabdaba51bd1c97373fcb95b7468f"
  BASE_WORKFLOW: ".github/workflows/codex-fa-frontier-a258-through3162-fast1-v1.yml"
  BASE_ARTIFACT_PREFIX: "codex-fa-frontier-a258-through3162-fast1-v1-"
  BASE_FIRST_INDEX: "3165"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Await and attest exact idx3165 parent
        env: {GH_TOKEN: "${{ github.token }}"}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-after3162-through3199-v1;mkdir -p "$OUT" /tmp/base
          for _ in $(seq 1 300); do gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" >"$OUT/run.json";s=$(python3 -c "import json;print(json.load(open('$OUT/run.json')).get('status',''))");[[ "$s" == completed ]]&&break;sleep 10;done
          python3 - <<'PY'
          import json,os
          r=json.load(open('build-logs/codex-fa-frontier-after3162-through3199-v1/run.json'))
          if not(r.get('status')=='completed' and r.get('conclusion')=='failure' and r.get('head_sha')==os.environ['BASE_HEAD_SHA'] and r.get('path')==os.environ['BASE_WORKFLOW']):raise SystemExit('base run gate failed')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100" >"$OUT/jobs.json";gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" >"$OUT/artifacts.json"
          python3 - <<'PY' >/tmp/base.env
          import json,os
          out='build-logs/codex-fa-frontier-after3162-through3199-v1';js=[j for j in json.load(open(out+'/jobs.json')).get('jobs',[]) if j.get('name')=='frontier'];
          if len(js)!=1:raise SystemExit('job count drift')
          st={s.get('name'):s for s in js[0].get('steps',[])}
          if st.get('Direct full-source first-frontier compile',{}).get('conclusion')!='success':raise SystemExit('base direct compile missing')
          xs=[a for a in json.load(open(out+'/artifacts.json')).get('artifacts',[]) if a.get('name','').startswith(os.environ['BASE_ARTIFACT_PREFIX']) and not a.get('expired')]
          if len(xs)!=1:raise SystemExit('artifact count drift '+str(len(xs)))
          a=xs[0];print('AID='+str(a['id']));print('ADIG='+a['digest'])
          PY
          source /tmp/base.env;gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" >/tmp/base.zip;test "sha256:$(sha256sum /tmp/base.zip|awk '{print $1}')" = "$ADIG";unzip -q /tmp/base.zip -d /tmp/base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-after3162-through3199-v1');m=json.loads(next(Path('/tmp/base').rglob('METRIC.json')).read_text())
          if not(m.get('Mock2_exit')==0 and m.get('Mock2_Advanced_exit')==0 and m.get('FA_exit')==1 and m.get('all_required_lean_executed') is True and str(m.get('FA_error_declaration_index'))==os.environ['BASE_FIRST_INDEX'] and m.get('source_identity_locked_after_materialization') is True and m.get('public_declaration_headers_preserved') is True and m.get('declaration_sequence_preserved') is True):raise SystemExit('base metric gate failed '+repr(m))
          sha,byt,lines=m['source_sha256'],m['source_bytes'],m['source_lines'];hs=[]
          for p in Path('/tmp/base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' in p.as_posix():
              b=p.read_bytes()
              if hashlib.sha256(b).hexdigest()==sha and len(b)==byt and len(b.decode().splitlines())==lines and b'\r' not in b:hs.append(p)
          if not hs:raise SystemExit('exact base source missing')
          (out/'BASE_SOURCE.txt').write_text(str(min(hs,key=lambda q:(len(q.parts),q.as_posix())).resolve())+'\n')
          PY
      - name: Materialize selected R003 roots through idx3199
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json
          src=json.loads(Path('scripts/fa_d0a3_r003_high_confidence_overrides.json').read_text());want=[3180,3184,3185,3192,3193,3199];rep=[r for r in src['repairs'] if int(r['declaration_index']) in want];got=[int(r['declaration_index']) for r in rep]
          if got!=want:raise SystemExit(f'R003 selected identity drift: {got!r}')
          Path('/tmp/r003-selected.json').write_text(json.dumps({'schema':'r003-selected-3180-3199-v1','repairs':rep},ensure_ascii=False,indent=2)+'\n')
          PY
      - name: Strict-compose independent roots through idx3199
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-after3162-through3199-v1;base="$(cat "$OUT/BASE_SOURCE.txt")"
          apply(){ t=$1;l=$2;n=/tmp/$t.lean;python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library "$l" --no-environment --target "$n" --audit-out "$OUT/$t.json";base=$n;}
          apply F3166 scripts/fa_dynamic_cluster_3165_3166_rewrite_order_v1.json
          apply F3178 scripts/fa_dynamic_cluster_3177_3178_neg_change_v1.json
          apply F3179 scripts/fa_dynamic_cluster_3179_restricted_measure_v1.json
          apply F3193 /tmp/r003-selected.json
          apply F3195 scripts/fa_dynamic_cluster_3194_3195_ringnf_v1.json
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean;cp "$base" "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-after3162-through3199-v1');aud=[json.loads((out/f'{x}.json').read_text()) for x in ('F3166','F3178','F3179','F3193','F3195')]
          if not all(a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed'] for a in aud):raise SystemExit('semantic/header audit failed')
          bp=Path((out/'BASE_SOURCE.txt').read_text().strip());p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');bs=bp.read_text();s=p.read_text();toks=('sorry','admit','axiom','unsafe','native_decide','Lean.ofReduceBool','sorryAx');cnt={t:(bs.count(t),s.count(t)) for t in toks}
          if any(a!=b for a,b in cnt.values()):raise SystemExit('forbidden token drift '+repr(cnt))
          b=p.read_bytes();ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines())};(out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f:f.write(f"CANDIDATE_SHA={ident['sha256']}\nCANDIDATE_BYTES={ident['bytes']}\n")
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail;OUT=build-logs/codex-fa-frontier-after3162-through3199-v1;curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh;sh /tmp/elan.sh -y --default-toolchain none >"$OUT/elan.log" 2>&1;export PATH="$HOME/.elan/bin:$PATH";elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$OUT/toolchain.log" 2>&1;lake exe cache get >"$OUT/cache.log" 2>&1;lean --version >"$OUT/lean-version.txt";lake --version >"$OUT/lake-version.txt"
      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail;export PATH="$HOME/.elan/bin:$PATH";OUT=build-logs/codex-fa-frontier-after3162-through3199-v1;mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean">"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3;one Mock2_Advanced 3;test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA";one Mock2_FunctionalAnalysis 384
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-after3162-through3199-v1');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m:ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};first=es[0] if es else {};b=p.read_bytes();m={'schema':'fa-frontier-after3162-through3199-v1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':384};(out/'METRIC.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >>"$GITHUB_OUTPUT";exit 0
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-frontier-after3162-through3199-v1-${{ github.sha }}", path: "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean\nbuild-logs/codex-fa-frontier-after3162-through3199-v1", if-no-files-found: warn, retention-days: 30}
      - name: Publish locator
        if: always()
        env: {GH_TOKEN: "${{ github.token }}",FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: state=failure;[[ "${FA_EXIT:-}" == 0 ]]&&state=success;gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='codex/fa-after3162-through3199' -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86;exit "$FA_EXIT"
