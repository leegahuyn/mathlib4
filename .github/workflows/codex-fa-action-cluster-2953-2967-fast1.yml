name: Codex FA action cluster 2953-2967 fast1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-action-cluster-2953-2967-fast1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-action-cluster-2953-2967-fast1
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31515384898"
  BASE_JOB_ID: "93859119079"
  BASE_HEAD_SHA: "472eba9176c785c63784dc86cfc943a1b192e7a4"
  BASE_ARTIFACT_ID: "9111168001"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-3002-v3-472eba9176c785c63784dc86cfc943a1b192e7a4"
  BASE_ARTIFACT_SIZE: "1071813"
  BASE_ARTIFACT_DIGEST: "sha256:bf72ead13e6d82e3e488566b467d2e4157e5d5c5a188a3e99399767067c816c3"
  BASE_SOURCE_SHA256: "abaced9e5c98fdb4afea72ae24a45a6d3f1cc00b507784f67e0bb5c42db10496"
  BASE_SOURCE_BYTES: "2704601"
  BASE_SOURCE_LINES: "60626"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest and materialize exact action-cluster candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-action-cluster-fast1; mkdir -p "$OUT" /tmp/fa-fast1-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-fast1-base.zip
          unzip -q /tmp/fa-fast1-base.zip -d /tmp/fa-fast1-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-action-cluster-fast1'); run=json.loads((out/'base-run.json').read_text()); job=json.loads((out/'base-job.json').read_text()); art=json.loads((out/'base-artifact.json').read_text()); z=Path('/tmp/fa-fast1-base.zip').read_bytes()
          checks={'run_id':run.get('id')==int(os.environ['BASE_RUN_ID']),'run_head':run.get('head_sha')==os.environ['BASE_HEAD_SHA'],'run_completed_failure':run.get('status')=='completed' and run.get('conclusion')=='failure','job_id':job.get('id')==int(os.environ['BASE_JOB_ID']),'job_run':job.get('run_id')==int(os.environ['BASE_RUN_ID']),'job_completed_failure':job.get('status')=='completed' and job.get('conclusion')=='failure','artifact_id':art.get('id')==int(os.environ['BASE_ARTIFACT_ID']),'artifact_name':art.get('name')==os.environ['BASE_ARTIFACT_NAME'],'artifact_size':art.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']),'artifact_digest':art.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'],'artifact_live':art.get('expired') is False,'archive_digest':'sha256:'+hashlib.sha256(z).hexdigest()==os.environ['BASE_ARTIFACT_DIGEST']}
          if not all(checks.values()): raise SystemExit('base attestation failed')
          hits=[]
          for p in Path('/tmp/fa-fast1-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode().splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: hits.append(p)
          if not hits: raise SystemExit('exact base source missing')
          p=min(hits,key=lambda x:(len(x.parts),x.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY
          python3 scripts/fa_dynamic_apply_staged_library.py --base-source "$(cat "$OUT/BASE_SOURCE.txt")" --library scripts/fa_dynamic_action_cluster_2953_2967_v2.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/PREPARATION.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          a=json.loads(Path('build-logs/codex-fa-action-cluster-fast1/PREPARATION.json').read_text())
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write('CANDIDATE_SHA='+a['candidate_source_sha256']+'\nCANDIDATE_BYTES='+str(a['candidate_bytes'])+'\nCANDIDATE_LINES='+str(a['candidate_lines'])+'\n')
          PY

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-action-cluster-fast1
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain-install.log" 2>&1; lean --version | tee "$OUT/lean-version.txt"; lake exe cache get > "$OUT/cache-get.log" 2>&1

      - name: Direct full-source first-frontier compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-action-cluster-fast1; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() { stem="$1"; src="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; : > "$OUT/${stem}.executed"; set +e; lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$OUT/${stem}.log" 2>&1; c=$?; set -e; echo "$c" > "$OUT/${stem}.exit"; }
          compile_one Mock2; compile_one Mock2_Advanced
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"; test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"; test "$(wc -l < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_LINES"
          compile_one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-action-cluster-fast1'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); metric={'schema':'fa-action-cluster-fast1','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'maxErrors_cap':1}; (out/'METRIC.json').write_text(json.dumps(metric,indent=2,sort_keys=True)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0

      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-action-cluster-fast1-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-action-cluster-fast1
          retention-days: 30

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86
          exit "$FA_EXIT"
