name: Final Authority Checked-In Verifier V11

"on":
  push:
    branches:
      - gpt/final-authority-batch-v7-20260820
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: final-authority-checked-in-verifier-v11-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify-checked-in-final-authority:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[final-authority-v10-promotion]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact checked-in successor source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Verify immutable authority identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final_authority_v11
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${{ github.ref_name }}"
            echo "FA_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)"
            echo "INTEGRATED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)"
            echo "QYM_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)"
            echo "QYM_SHA256=$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          } | tee .final_authority_v11/SOURCE_IDENTITY_INPUT.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          python3 -m py_compile scripts/final_authority_gate_v10.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .final_authority_v11/LEAN_VERSION.txt
          lake --version | tee .final_authority_v11/LAKE_VERSION.txt

      - name: Run checked-in full authority BuildAll clean clean checklist
        id: authority
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-batch-v7-20260820
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_REF_NAME="gpt/final-authority-batch-v7-20260820"
          export GITHUB_SHA="${{ github.sha }}"
          set +e
          python3 scripts/final_authority_gate_v10.py \
            2>&1 | tee .final_authority_v11/FINAL_AUTHORITY_V11.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v11/FINAL_AUTHORITY_V11_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Produce exact checked-in result card
        if: always()
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def load(name):
              p=Path('.final_authority')/name
              return json.loads(p.read_text()) if p.exists() else None
          result={
              'run_url':os.environ['RUN_URL'],
              'checked_in_head':os.environ['HEAD_SHA'],
              'authority_exit':Path('.final_authority_v11/FINAL_AUTHORITY_V11_EXIT.txt').read_text().strip() if Path('.final_authority_v11/FINAL_AUTHORITY_V11_EXIT.txt').exists() else None,
              'final13':load('FINAL_13_BUILD_RESULTS.json'),
              'buildall':load('BUILDALL_RESULT.json'),
              'forbidden':load('FORBIDDEN_AUDIT.json'),
              'clean1':load('CLEAN_BUILD_1_RESULT.json'),
              'clean2':load('CLEAN_BUILD_2_RESULT.json'),
              'identity':load('FINAL_SOURCE_IDENTITY.json'),
              'checklist':load('FINAL_15_CHECKLIST_RESULT.json'),
              'status_card':Path('.final_authority/FINAL_STATUS_CARD.md').read_text(encoding='utf-8',errors='replace') if Path('.final_authority/FINAL_STATUS_CARD.md').exists() else None,
          }
          Path('.final_authority_v11/FINAL_V11_RESULT.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          checklist=result['checklist'] if isinstance(result['checklist'],dict) else {}
          body=['## Checked-in Final Authority V11','',f"- run: {result['run_url']}",f"- checked-in HEAD: `{result['checked_in_head']}`",f"- authority exit: `{result['authority_exit']}`",f"- checklist: `{checklist.get('counts')}`",'',result['status_card'] or '(status card missing)']
          Path('.final_authority_v11/ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          print(json.dumps({'head':result['checked_in_head'],'exit':result['authority_exit'],'checklist':checklist.get('counts')},indent=2,ensure_ascii=False))
          PY

      - name: Publish checked-in authority result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 59 --repo "${{ github.repository }}" \
            --body-file .final_authority_v11/ISSUE_COMMENT.md

      - name: Upload complete checked-in evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-checked-in-v11-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .final_authority_v11
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Enforce checked-in final authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .final_authority_v11/FINAL_AUTHORITY_V11_EXIT.txt)" = "0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          buildall=json.loads(Path('.final_authority/BUILDALL_RESULT.json').read_text())
          clean1=json.loads(Path('.final_authority/CLEAN_BUILD_1_RESULT.json').read_text())
          clean2=json.loads(Path('.final_authority/CLEAN_BUILD_2_RESULT.json').read_text())
          identity=json.loads(Path('.final_authority/FINAL_SOURCE_IDENTITY.json').read_text())
          checklist=json.loads(Path('.final_authority/FINAL_15_CHECKLIST_RESULT.json').read_text())
          expected={'PASS':15,'FAIL':0,'NOT_RUN':0,'SKIPPED':0}
          ok=(buildall.get('pass') is True and clean1.get('pass') is True and clean2.get('pass') is True and identity.get('pass') is True and checklist.get('counts')==expected and checklist.get('pass') is True)
          raise SystemExit(0 if ok else 1)
          PY
