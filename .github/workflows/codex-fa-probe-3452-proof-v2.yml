name: Codex FA probe 3452 proof v2
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-probe-3452-proof-v2.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile exact proof shape
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/Probe3452v2.lean <<'LEAN'
          import Mathlib
          open MeasureTheory
          noncomputable section
          attribute [local instance 10000] instMeasureSpaceUnitAddCircle
          abbrev TwoTorus := UnitAddTorus (Fin 2)
          noncomputable abbrev TwoTorusL2 :=
            Lp ℂ 2 (volume : Measure TwoTorus)
          noncomputable def twoTorusFourierBasis :
              HilbertBasis (Fin 2 → ℤ) ℂ TwoTorusL2 :=
            UnitAddTorus.mFourierBasis
          example (f : TwoTorusL2) (k : Fin 2 → ℤ) :
              ↑(twoTorusFourierBasis.repr f) k • twoTorusFourierBasis k =
                UnitAddTorus.mFourierCoeff f k •
                  UnitAddTorus.mFourierLp 2 k := by
            simp only [twoTorusFourierBasis]
            rw [UnitAddTorus.mFourierBasis_repr]
            simp only [UnitAddTorus.coe_mFourierBasis]
          end
          LEAN
          lake env lean /tmp/Probe3452v2.lean | tee /tmp/probe3452v2.log
      - name: Upload probe
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-3452-proof-v2-${{ github.sha }}
          path: /tmp/probe3452v2.log
          retention-days: 14
