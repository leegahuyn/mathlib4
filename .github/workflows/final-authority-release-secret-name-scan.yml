name: Scan configured release-token names without exposing values

on:
  pull_request:
    branches:
      - archive/formalization-final-2026-08-21
    paths:
      - .github/workflows/final-authority-release-secret-name-scan.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scan-names:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout publisher source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: List secret identifiers referenced by checked-in workflows only
        shell: bash
        run: |
          set -euo pipefail
          echo '=== REFERENCED SECRET IDENTIFIERS (NAMES ONLY; NO VALUES) ==='
          grep -RhoE 'secrets\.[A-Za-z_][A-Za-z0-9_]*' .github/workflows 2>/dev/null \
            | sed 's/^secrets\.//' \
            | sort -u \
            | tee /tmp/referenced-secret-names.txt
          echo '=== TOKEN-LIKE IDENTIFIERS ==='
          grep -Ei '(TOKEN|PAT|BOT|RELEASE|WORKFLOW)' /tmp/referenced-secret-names.txt || true
