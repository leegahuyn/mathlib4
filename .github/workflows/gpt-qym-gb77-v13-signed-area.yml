name: GPT QYM GB77 V13 signed-area repair

on:
  push:
    branches:
      - gpt/qym-gb78-authority-v12-20260820
    paths:
      - .github/workflows/gpt-qym-gb77-v13-signed-area.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb77-v13-signed-area
  cancel-in-progress: false

env:
  BRANCH: gpt/qym-gb78-authority-v12-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  BASE_ERRORS: '77'
  BASE_WARNINGS: '360'
  BASE_SHA256: b6f0126c27dfc08b5f81c306a7140f9531fcc3d6ca6b75dd8abbd71101d458fd
  BASE_BLOB: c6e8883353b350f22b7f48d955fc5cfa4e61f88f
  V12_RUN_ID: '32275054214'
  V12_SELECTOR_ARTIFACT: qym-gb78-v12-selector-32275054214

jobs:
  promote:
    name: Promote exact verified GB77 and register V13 run
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      frontier_commit: ${{ steps.promote.outputs.frontier_commit }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - name: Download exact V12 selector artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.V12_SELECTOR_ARTIFACT }}
          path: ${{ runner.temp }}/qym-gb77-v12-selector
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ env.V12_RUN_ID }}

      - name: Verify direct-Lean evidence and promote exact GB77 bytes
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          D="$RUNNER_TEMP/qym-gb77-v12-selector"
          SRC="$D/QYM_GB78_V12_SELECTED.lean"
          BEST="$D/QYM_GB78_V12_BEST_RESULT.json"
          SEL="$D/QYM_GB78_V12_SELECTION.json"
          test -s "$SRC"
          test -s "$BEST"
          test -s "$SEL"
          test "$(jq -r '.variant' "$BEST")" = structural_rw_only
          test "$(jq -r '.run_id' "$BEST")" = "$V12_RUN_ID"
          test "$(jq -r '.full_compile_executed' "$BEST")" = true
          test "$(jq -r '.strict_improvement' "$BEST")" = true
          test "$(jq -r '.semantic_pass' "$BEST")" = false
          test "$(jq -r '.error_headers' "$BEST")" = "$BASE_ERRORS"
          test "$(jq -r '.warning_headers' "$BEST")" = "$BASE_WARNINGS"
          test "$(jq -r '.panic_lines' "$BEST")" = '0'
          test "$(jq '[.forbidden[]] | add' "$BEST")" = '0'
          test "$(jq -r '.candidate_qym_sha256' "$BEST")" = "$BASE_SHA256"
          test "$(jq -r '.candidate_qym_blob' "$BEST")" = "$BASE_BLOB"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$SRC")" = "$BASE_BLOB"

          mkdir -p .github/qym-frontier
          cp "$SRC" "$QYM"
          cp "$SRC" .github/qym-frontier/QYM_GB77_BEST.lean
          cp "$BEST" .github/qym-frontier/QYM_GB77_V12_RESULT.json
          cp "$SEL" .github/qym-frontier/QYM_GB78_V12_SELECTION.json
          python3 - <<'PY'
          from pathlib import Path
          import json
          import os

          best = json.loads(Path(os.environ['RUNNER_TEMP'] + '/qym-gb77-v12-selector/QYM_GB78_V12_BEST_RESULT.json').read_text())
          active = {
              'schema': 'qym-active-frontier-v1',
              'global_best_error_headers': 77,
              'warning_headers': 360,
              'panic_lines': 0,
              'exit': 1,
              'source_sha256': os.environ['BASE_SHA256'],
              'source_git_blob': os.environ['BASE_BLOB'],
              'run_id': int(os.environ['V12_RUN_ID']),
              'variant': best['variant'],
              'first_error': best['first_error'],
              'full_qym_direct_lean_executed': True,
              'semantic_pass': False,
              'canonical_promoted': True,
          }
          Path('.github/qym-frontier/QYM_ACTIVE_FRONTIER.json').write_text(
              json.dumps(active, indent=2, sort_keys=True) + '\n'
          )
          run = {
              'schema': 'qym-gb77-v13-run-v1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'status': 'in_progress',
              'branch': os.environ['BRANCH'],
              'head_sha': os.environ['GITHUB_SHA'],
              'baseline_error_headers': 77,
              'baseline_sha256': os.environ['BASE_SHA256'],
              'baseline_git_blob': os.environ['BASE_BLOB'],
              'target': 'conj_mul_hyperbolicRightNormal_im',
          }
          Path('.github/qym-frontier/QYM_GB77_V13_RUN.json').write_text(
              json.dumps(run, indent=2, sort_keys=True) + '\n'
          )
          PY

          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$QYM" .github/qym-frontier
          git commit -m 'QYM V13: promote exact verified GB77 [skip ci]'
          git push origin "HEAD:$BRANCH"
          frontier_commit="$(git rev-parse HEAD)"
          echo "frontier_commit=$frontier_commit" >> "$GITHUB_OUTPUT"
          echo "frontier_commit=$frontier_commit" >> "$GITHUB_STEP_SUMMARY"

  candidate:
    name: V13-${{ matrix.variant }}
    needs: promote
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant:
          - rw_ofReal_pow
          - simpa_ofReal_pow
          - pow_two_mul_re
          - norm_num_pow_two
          - hpow_re
          - hstar_real_sq
          - hstar_real_sq_only
          - calc_normsq
          - calc_real_sq
          - rw_ring_nf_ofReal
          - rw_norm_num
          - change_after_simp
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ needs.promote.outputs.frontier_commit }}
          fetch-depth: 0

      - name: Gate exact verified GB77 source
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object "$QYM")" = "$BASE_BLOB"
          test "$(sha256sum .github/qym-frontier/QYM_GB77_BEST.lean | awk '{print $1}')" = "$BASE_SHA256"
          test "$(git hash-object .github/qym-frontier/QYM_GB77_BEST.lean)" = "$BASE_BLOB"
          test "$(jq -r '.global_best_error_headers' .github/qym-frontier/QYM_ACTIVE_FRONTIER.json)" = "$BASE_ERRORS"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qym-gb77-v13-${{ matrix.variant }}"
          mkdir -p "$OUT" "$OLEAN"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for attempt in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break
            sleep $((attempt * 5))
          done
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          for attempt in 1 2 3 4 5; do
            lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break
            sleep $((attempt * 5))
          done

      - name: Restore completed dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure dependency objects are complete
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                max_errors=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Generate exact-GB77 signed-area candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.authority.lean"
          python3 -B .github/qym_gb77_v13_signed_area_patch.py \
            '${{ matrix.variant }}' "$QYM" > "$OUT/PATCH_RESULT.json"
          test "$(jq -r '.input_sha256' "$OUT/PATCH_RESULT.json")" = "$BASE_SHA256"
          test "$(jq -r '.input_blob' "$OUT/PATCH_RESULT.json")" = "$BASE_BLOB"
          test "$(sha256sum "$QYM" | awk '{print $1}')" = \
            "$(jq -r '.candidate_sha256' "$OUT/PATCH_RESULT.json")"
          test "$(git hash-object "$QYM")" = \
            "$(jq -r '.candidate_blob' "$OUT/PATCH_RESULT.json")"
          test "$(jq '[.forbidden[]] | add' "$OUT/PATCH_RESULT.json")" = '0'
          cp "$QYM" "$OUT/QYM.lean"

      - name: Local direct-Lean first-error gate
        id: local
        shell: bash
        run: |
          set +e
          /usr/bin/time -v -o "$OUT/local.time" \
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$OUT/local.olean" -i "$OUT/local.ilean" "$QYM" \
              > "$OUT/local.log" 2>&1
          local_exit=$?
          set -e
          printf '%s\n' "$local_exit" > "$OUT/local.exit"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import re

          out = Path(os.environ['OUT'])
          patch = json.loads((out / 'PATCH_RESULT.json').read_text())
          text = (out / 'local.log').read_text(errors='replace')
          rx = re.compile(
              r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M
          )
          rows = []
          for m in rx.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [row for row in rows if row['severity'] == 'error']
          warnings = [row for row in rows if row['severity'] == 'warning']
          panic_lines = len(re.findall(
              r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text
          ))
          first = errors[0] if errors else None
          gate_pass = panic_lines == 0 and (
              first is None or int(first['line']) >= int(patch['gate_line'])
          )
          result = {
              'schema': 'qym-gb77-v13-local-gate-v1',
              'variant': patch['variant'],
              'exit': int((out / 'local.exit').read_text()),
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'panic_lines': panic_lines,
              'first_error': first,
              'gate_line': int(patch['gate_line']),
              'gate_pass': gate_pass,
              'log_sha256': hashlib.sha256((out / 'local.log').read_bytes()).hexdigest(),
          }
          (out / 'LOCAL_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          with Path(os.environ['GITHUB_OUTPUT']).open('a') as handle:
              handle.write(f"gate_pass={'true' if gate_pass else 'false'}\n")
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Authoritative full-QYM direct Lean
        id: full
        if: steps.local.outputs.gate_pass == 'true'
        shell: bash
        run: |
          set +e
          /usr/bin/time -v -o "$OUT/direct.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/QYM.olean" -i "$OUT/QYM.ilean" "$QYM" \
              > "$OUT/direct.log" 2>&1
          direct_exit=$?
          set -e
          printf '%s\n' "$direct_exit" > "$OUT/direct.exit"
          echo 'executed=true' >> "$GITHUB_OUTPUT"

      - name: Parse and preserve V13 evidence
        if: always()
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
          FRONTIER_COMMIT: ${{ needs.promote.outputs.frontier_commit }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import collections
          import hashlib
          import json
          import os
          import re

          out = Path(os.environ['OUT'])
          qym = Path(os.environ['QYM'])
          patch = json.loads((out / 'PATCH_RESULT.json').read_text())
          local = json.loads((out / 'LOCAL_RESULT.json').read_text())
          full_executed = (out / 'direct.log').is_file() and (out / 'direct.exit').is_file()
          text = (out / 'direct.log').read_text(errors='replace') if full_executed else ''
          rx = re.compile(
              r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): '
              r'(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M
          )
          rows = []
          for m in rx.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [row for row in rows if row['severity'] == 'error']
          warnings = [row for row in rows if row['severity'] == 'warning']
          panic_lines = len(re.findall(
              r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text
          )) if full_executed else 0
          exit_code = int((out / 'direct.exit').read_text()) if full_executed else None
          raw = qym.read_bytes()
          sha = hashlib.sha256(raw).hexdigest()
          blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          semantic_pass = bool(
              full_executed and exit_code == 0 and not errors and panic_lines == 0
              and (out / 'QYM.olean').is_file() and (out / 'QYM.ilean').is_file()
          )
          forbidden_clean = sum(int(v) for v in patch['forbidden'].values()) == 0
          strict_improvement = bool(
              full_executed and panic_lines == 0 and forbidden_clean
              and (semantic_pass or len(errors) < int(os.environ['BASE_ERRORS']))
          )
          result = {
              'schema': 'qym-gb77-v13-result-v1',
              'variant': os.environ['VARIANT'],
              'frontier_commit': os.environ['FRONTIER_COMMIT'],
              'baseline_error_headers': int(os.environ['BASE_ERRORS']),
              'baseline_warning_headers': int(os.environ['BASE_WARNINGS']),
              'baseline_qym_sha256': os.environ['BASE_SHA256'],
              'baseline_qym_blob': os.environ['BASE_BLOB'],
              'candidate_qym_sha256': sha,
              'candidate_qym_blob': blob,
              'patch_candidate_sha256': patch['candidate_sha256'],
              'patch_candidate_blob': patch['candidate_blob'],
              'forbidden': patch['forbidden'],
              'local_gate': local,
              'full_compile_executed': full_executed,
              'exit': exit_code,
              'error_headers': len(errors) if full_executed else None,
              'warning_headers': len(warnings) if full_executed else None,
              'panic_lines': panic_lines if full_executed else None,
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'error_codes': dict(sorted(collections.Counter(
                  str(row.get('code') or 'uncoded') for row in errors
              ).items())) if full_executed else {},
              'semantic_pass': semantic_pass,
              'strict_improvement': strict_improvement,
              'log_sha256': hashlib.sha256((out / 'direct.log').read_bytes()).hexdigest()
                  if full_executed else None,
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'head_sha': os.environ['GITHUB_SHA'],
          }
          if sha != patch['candidate_sha256'] or blob != patch['candidate_blob']:
              raise SystemExit('candidate digest mismatch after compile')
          (out / 'RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Upload immutable V13 candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb77-v13-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30

  select:
    name: Select and promote verified V13 strict improvement
    needs:
      - promote
      - candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.BRANCH }}
          fetch-depth: 0

      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qym-gb77-v13-*-${{ github.run_id }}
          path: ${{ runner.temp }}/qym-gb77-v13-results

      - name: Select only by actual full-QYM direct-Lean evidence
        id: choose
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import hashlib
          import json
          import os
          import shutil

          root = Path(os.environ['RUNNER_TEMP']) / 'qym-gb77-v13-results'
          rows = []
          for result_path in root.rglob('RESULT.json'):
              row = json.loads(result_path.read_text())
              row['_directory'] = str(result_path.parent)
              rows.append(row)
          viable = []
          for row in rows:
              forbidden = row.get('forbidden') or {}
              clean = sum(int(v) for v in forbidden.values()) == 0
              if (
                  row.get('full_compile_executed') is True
                  and row.get('strict_improvement') is True
                  and int(row.get('panic_lines') or 0) == 0
                  and clean
                  and (row.get('semantic_pass') is True or int(row.get('error_headers', 10**9)) < 77)
              ):
                  viable.append(row)
          viable.sort(key=lambda row: (
              int(row.get('error_headers', 10**9)),
              0 if row.get('semantic_pass') else 1,
              -int((row.get('first_error') or {}).get('line') or 10**9),
              str(row.get('variant')),
          ))
          selection = {
              'schema': 'qym-gb77-v13-selection-v1',
              'run_id': int(os.environ['GITHUB_RUN_ID']),
              'branch': os.environ['BRANCH'],
              'baseline': {
                  'error_headers': 77,
                  'warning_headers': 360,
                  'sha256': os.environ['BASE_SHA256'],
                  'git_blob': os.environ['BASE_BLOB'],
              },
              'candidate_count': len(rows),
              'full_compile_count': sum(1 for row in rows if row.get('full_compile_executed') is True),
              'local_gate_pass_count': sum(
                  1 for row in rows if (row.get('local_gate') or {}).get('gate_pass') is True
              ),
              'strict_improvement_found': bool(viable),
              'best': viable[0] if viable else None,
              'results': rows,
          }
          Path('/tmp/QYM_GB77_V13_SELECTION.json').write_text(
              json.dumps(selection, indent=2, sort_keys=True) + '\n'
          )
          output = Path(os.environ['GITHUB_OUTPUT'])
          if viable:
              best = viable[0]
              source = Path(best['_directory']) / 'QYM.lean'
              raw = source.read_bytes()
              actual_sha = hashlib.sha256(raw).hexdigest()
              actual_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              if actual_sha != best['candidate_qym_sha256'] or actual_blob != best['candidate_qym_blob']:
                  raise SystemExit('selected source digest mismatch')
              shutil.copy2(source, '/tmp/QYM_GB77_V13_SELECTED.lean')
              Path('/tmp/QYM_GB77_V13_BEST_RESULT.json').write_text(
                  json.dumps(best, indent=2, sort_keys=True) + '\n'
              )
              with output.open('a') as handle:
                  handle.write('has_winner=true\n')
                  handle.write(f"winner_errors={int(best['error_headers'])}\n")
                  handle.write(f"winner_variant={best['variant']}\n")
          else:
              with output.open('a') as handle:
                  handle.write('has_winner=false\n')
                  handle.write('winner_errors=77\n')
                  handle.write('winner_variant=none\n')
          print(json.dumps(selection, indent=2, sort_keys=True))
          PY

      - name: Persist selector evidence and promote exact winning bytes
        shell: bash
        env:
          HAS_WINNER: ${{ steps.choose.outputs.has_winner }}
          WINNER_ERRORS: ${{ steps.choose.outputs.winner_errors }}
          WINNER_VARIANT: ${{ steps.choose.outputs.winner_variant }}
        run: |
          set -euo pipefail
          mkdir -p .github/qym-frontier
          cp /tmp/QYM_GB77_V13_SELECTION.json .github/qym-frontier/QYM_GB77_V13_SELECTION.json
          if [[ "$HAS_WINNER" = true ]]; then
            cp /tmp/QYM_GB77_V13_SELECTED.lean "$QYM"
            cp /tmp/QYM_GB77_V13_SELECTED.lean ".github/qym-frontier/QYM_GB${WINNER_ERRORS}_BEST.lean"
            cp /tmp/QYM_GB77_V13_BEST_RESULT.json ".github/qym-frontier/QYM_GB${WINNER_ERRORS}_V13_RESULT.json"
            python3 - <<'PY'
            from pathlib import Path
            import json
            import os
            best = json.loads(Path('/tmp/QYM_GB77_V13_BEST_RESULT.json').read_text())
            active = {
                'schema': 'qym-active-frontier-v1',
                'global_best_error_headers': int(best['error_headers']),
                'warning_headers': int(best['warning_headers']),
                'panic_lines': int(best['panic_lines']),
                'exit': int(best['exit']),
                'source_sha256': best['candidate_qym_sha256'],
                'source_git_blob': best['candidate_qym_blob'],
                'run_id': int(best['run_id']),
                'variant': best['variant'],
                'first_error': best['first_error'],
                'full_qym_direct_lean_executed': True,
                'semantic_pass': bool(best['semantic_pass']),
                'canonical_promoted': True,
            }
            Path('.github/qym-frontier/QYM_ACTIVE_FRONTIER.json').write_text(
                json.dumps(active, indent=2, sort_keys=True) + '\n'
            )
            PY
            expected_sha="$(jq -r '.candidate_qym_sha256' /tmp/QYM_GB77_V13_BEST_RESULT.json)"
            expected_blob="$(jq -r '.candidate_qym_blob' /tmp/QYM_GB77_V13_BEST_RESULT.json)"
            test "$(sha256sum "$QYM" | awk '{print $1}')" = "$expected_sha"
            test "$(git hash-object "$QYM")" = "$expected_blob"
          fi
          python3 - <<'PY'
          from pathlib import Path
          import json
          p = Path('.github/qym-frontier/QYM_GB77_V13_RUN.json')
          run = json.loads(p.read_text())
          run['status'] = 'completed'
          run['strict_improvement_found'] = Path('/tmp/QYM_GB77_V13_BEST_RESULT.json').is_file()
          if run['strict_improvement_found']:
              best = json.loads(Path('/tmp/QYM_GB77_V13_BEST_RESULT.json').read_text())
              run['winner_error_headers'] = int(best['error_headers'])
              run['winner_variant'] = best['variant']
              run['winner_sha256'] = best['candidate_qym_sha256']
              run['winner_git_blob'] = best['candidate_qym_blob']
          p.write_text(json.dumps(run, indent=2, sort_keys=True) + '\n')
          PY

          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$QYM" .github/qym-frontier
          if [[ "$HAS_WINNER" = true ]]; then
            git commit -m "QYM V13: promote verified GB${WINNER_ERRORS} ${WINNER_VARIANT} [skip ci]"
          else
            git commit -m 'QYM V13: preserve no-improvement evidence [skip ci]'
          fi
          git push origin "HEAD:$BRANCH"

      - name: Upload V13 selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb77-v13-selector-${{ github.run_id }}
          path: |
            /tmp/QYM_GB77_V13_SELECTION.json
            /tmp/QYM_GB77_V13_BEST_RESULT.json
            /tmp/QYM_GB77_V13_SELECTED.lean
          if-no-files-found: warn
          retention-days: 30

      - name: Fail visibly only after preserving a no-winner selection
        if: steps.choose.outputs.has_winner != 'true'
        shell: bash
        run: exit 1
