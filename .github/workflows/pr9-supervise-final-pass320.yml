name: PR9 supervise final PASS 320 repair

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pr9-supervise-final-pass320.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  issues: write
  pull-requests: write

concurrency:
  group: pr9-supervise-final-pass320
  cancel-in-progress: true

jobs:
  supervise:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout PR9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 0
          persist-credentials: true

      - name: Follow final repair run and persist exact result
        shell: bash
        run: |
          set -euo pipefail
          branch='ci/fa319-isolated-20260807'
          target_name='PR9 final resilient PASS 320 repair'
          tmp='/tmp/pr9-final-supervisor'
          status_file='build-logs/pr9-final-supervisor-status.txt'
          mkdir -p "${tmp}" build-logs

          target_run=''
          for attempt in $(seq 1 60); do
            target_run="$(gh api "/repos/${GITHUB_REPOSITORY}/actions/runs?branch=${branch}&per_page=100" \
              --jq ".workflow_runs[] | select(.name == \"${target_name}\") | .id" \
              | head -1)"
            [[ -n "${target_run}" ]] && break
            sleep 5
          done
          test -n "${target_run}"

          for attempt in $(seq 1 720); do
            gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run}" \
              > "${tmp}/run.json"
            run_status="$(python3 -c "import json; print(json.load(open('${tmp}/run.json'))['status'])")"
            [[ "${run_status}" == 'completed' ]] && break
            sleep 10
          done

          conclusion="$(python3 -c "import json; print(json.load(open('${tmp}/run.json'))['conclusion'])")"
          head_sha="$(python3 -c "import json; print(json.load(open('${tmp}/run.json'))['head_sha'])")"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run}/jobs?per_page=100" \
            > "${tmp}/jobs.json"
          gh api "/repos/${GITHUB_REPOSITORY}/actions/runs/${target_run}/artifacts?per_page=100" \
            > "${tmp}/artifacts.json"

          python3 - "${tmp}/artifacts.json" > "${tmp}/artifacts.tsv" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          for a in p.get('artifacts',[]):
              if not a.get('expired'):
                  print(f"{a['id']}\t{a['name']}")
          PY
          while IFS=$'\t' read -r aid name; do
            [[ -n "${aid}" ]] || continue
            safe="$(printf '%s' "${name}" | tr -c 'A-Za-z0-9._-' '_')"
            mkdir -p "${tmp}/${aid}-${safe}"
            gh api "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${aid}/zip" \
              > "${tmp}/${aid}-${safe}.zip"
            unzip -q "${tmp}/${aid}-${safe}.zip" -d "${tmp}/${aid}-${safe}"
          done < "${tmp}/artifacts.tsv"

          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "target_run=${target_run}"
            echo "target_head_sha=${head_sha}"
            echo "target_conclusion=${conclusion}"
            echo "authority_run=31159696948"
            echo "authority_job=92827136991"
            echo
            echo '--- PR9 API state ---'
            gh api "/repos/${GITHUB_REPOSITORY}/pulls/9" \
              --jq '"state=\(.state) draft=\(.draft) merged=\(.merged) mergeable=\(.mergeable) mergeable_state=\(.mergeable_state) head=\(.head.sha) base=\(.base.sha)"'
            echo
            echo '--- jobs ---'
            python3 - "${tmp}/jobs.json" <<'PY'
          import json,sys
          p=json.load(open(sys.argv[1],encoding='utf-8'))
          for j in p.get('jobs',[]):
              print(f"job={j['id']} name={j['name']} status={j['status']} conclusion={j['conclusion']}")
              for s in j.get('steps',[]):
                  print(f"  step={s['number']} name={s['name']} conclusion={s['conclusion']}")
          PY
            echo
            echo '--- compile summaries ---'
            find "${tmp}" -type f -name compile-summary.csv -print -exec cat {} \; || true
            echo
            echo '--- source hashes ---'
            find "${tmp}" -type f -name repair-hashes.txt -print -exec cat {} \; || true
            echo
            echo '--- first compiler errors ---'
            find "${tmp}" -type f -name '*.errors.txt' -print0 | sort -z \
              | while IFS= read -r -d '' f; do
                  echo "===== ${f} ====="
                  sed -n '1,220p' "${f}"
                done
          } > "${tmp}/status.txt"

          git fetch --no-tags origin \
            "+refs/heads/${branch}:refs/remotes/origin/${branch}"
          git reset --hard "origin/${branch}"
          cp "${tmp}/status.txt" "${status_file}"
          if [[ "${conclusion}" == 'success' ]]; then
            touch build-logs/PR9_PASS320_FA_INTEGRATED_QYM_PASS
            rm -f build-logs/PR9_PASS320_FA_INTEGRATED_QYM_FAIL
          else
            touch build-logs/PR9_PASS320_FA_INTEGRATED_QYM_FAIL
            rm -f build-logs/PR9_PASS320_FA_INTEGRATED_QYM_PASS
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/pr9-final-supervisor-status.txt \
            build-logs/PR9_PASS320_FA_INTEGRATED_QYM_PASS \
            build-logs/PR9_PASS320_FA_INTEGRATED_QYM_FAIL 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ci: persist PR9 final PASS 320 ${conclusion}"
            git push origin "HEAD:${branch}"
          fi

          comment="${tmp}/comment.md"
          {
            echo '<!-- pr9-final-pass320-supervisor -->'
            echo '## PR #9 final PASS 320 supervisor'
            echo
            echo "- Authority: \`31159696948 / 92827136991\`"
            echo "- Final run: \`${target_run}\`"
            echo "- Conclusion: **${conclusion}**"
            echo "- Tested head: \`${head_sha}\`"
            echo
            summary="$(find "${tmp}" -type f -name compile-summary.csv -print -quit)"
            if [[ -n "${summary}" ]]; then
              echo '```csv'
              cat "${summary}"
              echo '```'
            fi
            if [[ "${conclusion}" != 'success' ]]; then
              error_file="$(find "${tmp}" -type f -name '*.errors.txt' -print | sort | head -1)"
              echo '### First remaining compiler errors'
              echo '```text'
              [[ -n "${error_file}" ]] && sed -n '1,100p' "${error_file}" || true
              echo '```'
            fi
          } > "${comment}"
          existing="$(gh api "/repos/${GITHUB_REPOSITORY}/issues/9/comments?per_page=100" \
            --jq '.[] | select(.body | contains("<!-- pr9-final-pass320-supervisor -->")) | .id' \
            | tail -1)"
          if [[ -n "${existing}" ]]; then
            gh api --method PATCH "/repos/${GITHUB_REPOSITORY}/issues/comments/${existing}" \
              -F body=@"${comment}" >/dev/null
          else
            gh api --method POST "/repos/${GITHUB_REPOSITORY}/issues/9/comments" \
              -F body=@"${comment}" >/dev/null
          fi

          [[ "${conclusion}" == 'success' ]]

      - name: Upload supervisor evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr9-final-supervisor-${{ github.run_id }}
          path: /tmp/pr9-final-supervisor
          if-no-files-found: warn
          retention-days: 30
