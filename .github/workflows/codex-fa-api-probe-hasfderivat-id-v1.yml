name: Codex FA API probe hasFDerivAt id v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-hasfderivat-id-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Prove scalar-pinned identity derivative with zero_sub normalization
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeHasFDerivId.lean <<'LEAN'
          import Mathlib
          example (w x : ℂ) : HasFDerivAt ((fun _y : ℂ ↦ w) - id)
              (-ContinuousLinearMap.id ℝ ℂ) x := by
            simpa only [zero_sub] using
              (hasFDerivAt_const (x := x) (c := w)).sub
                (hasFDerivAt_id (𝕜 := ℝ) x)
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeHasFDerivId.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-hasfderivat-id-v2-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
