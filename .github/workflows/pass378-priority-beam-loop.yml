name: PASS 378+ ordered FA Mock3 QYM beam loop

on:
  push:
    branches: [fix/fa378-priority-beam-loop-20260809]
    paths:
      - '.github/workflows/pass378-priority-beam-loop.yml'
      - 'scripts/priority_chain_v378.py'
      - 'scripts/run_lean_repair_v377_styled.py'
      - 'scripts/lean_repair_loop_v377.py'
  workflow_dispatch:
    inputs:
      cycle:
        description: Ordered repair cycle
        required: false
        default: '0'

permissions:
  contents: write
  actions: write
  models: read

concurrency:
  group: pass378-priority-beam-loop
  cancel-in-progress: false

env:
  BRANCH_NAME: fix/fa378-priority-beam-loop-20260809
  CYCLE: ${{ inputs.cycle || '0' }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      all_pass: ${{ steps.choose.outputs.all_pass }}
      selected_target: ${{ steps.choose.outputs.selected_target }}
    steps:
      - name: Checkout exact beam-loop head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1200
          persist-credentials: true

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Materialize the exact current FA source when the branch still has a stub
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          size=$(wc -c < "${fa}")
          echo "checked_in_fa_size=${size}"
          if [[ ${size} -gt 500000 ]]; then
            echo 'Using checked-in full FA source.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          start = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(start) != 1 or text.count(end) != 1:
              raise SystemExit('PASS341 direct-compile markers unavailable')
          text = text.replace(start, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(end, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          source_file='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${source_file}"
          cp "${source_file}" "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Select the first target that has not passed twice
        id: choose
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/priority_chain_v378.py --mode select
          rc=$?
          set -e
          test -s /tmp/pass378/selection.json
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          data=json.loads(Path('/tmp/pass378/selection.json').read_text())
          selected=data.get('selected_target') or ''
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"all_pass={'true' if data.get('all_pass') else 'false'}\n")
              out.write(f"selected_target={selected}\n")
          print(json.dumps(data,indent=2))
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Package the exact current priority sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/pass378-prepared
          tar -cf /tmp/pass378-prepared/sources.tar \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            $(find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' \
                ! -iname '*backup*' ! -iname '*candidate*' ! -iname '*probe*' ! -iname '*tmp*' | sort) \
            PrimalitySheafVerification/QYM.lean
          cp /tmp/pass378/selection.json /tmp/pass378-prepared/selection.json

      - name: Upload prepared priority source set
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass378-prepared-${{ github.run_id }}
          path: /tmp/pass378-prepared
          if-no-files-found: error
          retention-days: 30

      - name: Record actual all-target two-pass success immediately
        if: steps.choose.outputs.all_pass == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs
          cp /tmp/pass378/selection.json build-logs/FA_MOCK3_QYM_2X_PASS.json
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json
          p=Path('build-logs/FA_MOCK3_QYM_2X_PASS.json')
          data=json.loads(p.read_text())
          data['source_hashes']={}
          files=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
                 Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean')]
          files += sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean'))
          files += [Path('PrimalitySheafVerification/QYM.lean')]
          for f in files:
              if f.exists() and not any(x in f.name.lower() for x in ('backup','candidate','probe','tmp')):
                  data['source_hashes'][str(f)]=hashlib.sha256(f.read_bytes()).hexdigest()
          p.write_text(json.dumps(data,indent=2),encoding='utf-8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          while IFS= read -r f; do git add "${f}"; done < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' \
              ! -iname '*backup*' ! -iname '*candidate*' ! -iname '*probe*' ! -iname '*tmp*' | sort
          )
          if ! git diff --cached --quiet; then
            git commit -m 'fix: record FA Integrated Mock3 QYM two-pass PASS'
            git push origin HEAD:"${BRANCH_NAME}"
          fi

  repair:
    needs: prepare
    if: needs.prepare.outputs.all_pass != 'true' && needs.prepare.outputs.selected_target != ''
    strategy:
      fail-fast: false
      matrix:
        include:
          - slug: gpt5-typeclass
            model: openai/gpt-5
            style: >-
              Focus on the first elaboration/typeclass mismatch. Normalize competing inherited
              structures explicitly with letI, change, show, @-qualified declarations, and current
              mathlib APIs. Avoid broad simp and unrelated edits.
          - slug: gpt41-api
            model: openai/gpt-4.1
            style: >-
              Treat this as an API-migration proof repair. Inspect exact expected and actual types,
              expose coercions and dependent transports, and build one small private helper if it
              removes a real cascade.
          - slug: gpt4o-proof
            model: openai/gpt-4o
            style: >-
              Produce a conservative local proof rewrite for the first independent error cluster.
              Prefer calc, ext, change, simpa only, explicit namespaces, and typed intermediate facts.
          - slug: gpt5-architecture
            model: openai/gpt-5
            style: >-
              Previous repair paths may have patched symptoms. Identify the common definitional or
              instance root of the first several errors and repair that root without changing any
              public declaration header. Beam cycle ${{ inputs.cycle || '0' }}.
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      MODEL_CANDIDATES: ${{ matrix.model }},openai/gpt-4.1,openai/gpt-4o
      REPAIR_STYLE: ${{ matrix.style }}
      SELECTED_TARGET: ${{ needs.prepare.outputs.selected_target }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1200
          persist-credentials: false

      - name: Download exact prepared source set
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pass378-prepared-${{ github.run_id }}
          path: /tmp/pass378-prepared

      - name: Restore prepared sources
        shell: bash
        run: |
          set -euo pipefail
          tar -xf /tmp/pass378-prepared/sources.tar -C .

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Compile all ordered prerequisites once
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/priority_chain_v378.py --mode prepare --target "${SELECTED_TARGET}"

      - name: Generate and kernel-test a beam candidate
        id: agent
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/run_lean_repair_v377_styled.py \
            --target "${SELECTED_TARGET}" --iterations 4 --attempts-per-iteration 3
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Package candidate and model evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/pass378-beam/${{ matrix.slug }}"
          cp "${SELECTED_TARGET}" "/tmp/pass378-beam/${{ matrix.slug }}/candidate.lean"
          if [[ -d "/tmp/lean-repair-v377/$(basename "${SELECTED_TARGET}" .lean)" ]]; then
            cp -a "/tmp/lean-repair-v377/$(basename "${SELECTED_TARGET}" .lean)" \
              "/tmp/pass378-beam/${{ matrix.slug }}/agent-evidence"
          fi
          cat > "/tmp/pass378-beam/${{ matrix.slug }}/metadata.json" <<EOF
          {"slug":"${{ matrix.slug }}","model":"${{ matrix.model }}","cycle":"${CYCLE}","agent_exit":"${{ steps.agent.outputs.exit_code }}","target":"${SELECTED_TARGET}"}
          EOF

      - name: Upload beam candidate
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass378-beam-${{ matrix.slug }}-${{ github.run_id }}
          path: /tmp/pass378-beam
          if-no-files-found: error
          retention-days: 30

  select:
    needs: [prepare, repair]
    if: always() && needs.prepare.result == 'success' && needs.prepare.outputs.all_pass != 'true' && needs.prepare.outputs.selected_target != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      SELECTED_TARGET: ${{ needs.prepare.outputs.selected_target }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1200
          persist-credentials: true

      - name: Download prepared sources
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: pass378-prepared-${{ github.run_id }}
          path: /tmp/pass378-prepared

      - name: Download every beam candidate
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: pass378-beam-*-${{ github.run_id }}
          path: /tmp/pass378-beam-download
          merge-multiple: true

      - name: Restore prepared sources and install Lean
        shell: bash
        run: |
          set -euo pipefail
          tar -xf /tmp/pass378-prepared/sources.tar -C .
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get
          python3 scripts/priority_chain_v378.py --mode prepare --target "${SELECTED_TARGET}"

      - name: Recompile, audit, and rank all candidates
        id: rank
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 - <<'PY'
          import json, os, shutil, sys
          from pathlib import Path
          root=Path.cwd()
          sys.path.insert(0,str(root/'scripts'))
          import lean_repair_loop_v377 as guard
          import priority_chain_v378 as chain
          target=(root/os.environ['SELECTED_TARGET']).resolve()
          baseline=target.read_text(encoding='utf-8')
          baseline_headers=guard.declaration_headers(baseline)
          baseline_imports=guard.imports(baseline)
          if guard.forbidden_hits(baseline):
              raise SystemExit('baseline contains a forbidden executable token')
          baseline_result=chain.compile_one(target,'beam-baseline',max_errors=100)
          rows=[{'slug':'baseline','result':baseline_result,'accepted':True}]
          best_result=baseline_result
          best_source=baseline
          best_slug='baseline'

          def improved(new, old):
              if new['exit_code']==0 and new['artifacts_ok']:
                  return True
              if new['error_headers'] < old['error_headers']:
                  return True
              a,b=new.get('first_error_line'),old.get('first_error_line')
              return isinstance(a,int) and isinstance(b,int) and a>b

          candidates=sorted(Path('/tmp/pass378-beam-download').glob('**/candidate.lean'))
          if not candidates:
              raise SystemExit('no beam candidates were downloaded')
          for candidate in candidates:
              slug=candidate.parent.name
              source=candidate.read_text(encoding='utf-8')
              reason=''
              accepted=True
              if guard.declaration_headers(source)!=baseline_headers:
                  accepted=False; reason='public declaration header fingerprint changed'
              elif not baseline_imports.issubset(guard.imports(source)):
                  accepted=False; reason='existing import removed'
              elif guard.forbidden_hits(source):
                  accepted=False; reason=f'forbidden tokens: {guard.forbidden_hits(source)}'
              if accepted:
                  target.write_text(source,encoding='utf-8')
                  result=chain.compile_one(target,f'beam-{slug}',max_errors=100)
                  if improved(result,best_result):
                      best_result=result; best_source=source; best_slug=slug
              else:
                  result={'exit_code':999,'error_headers':10**9,'first_error_line':None,'artifacts_ok':False}
              rows.append({'slug':slug,'result':result,'accepted':accepted,'reason':reason})
              target.write_text(baseline,encoding='utf-8')
          objectively_improved=best_slug!='baseline' and improved(best_result,baseline_result)
          target.write_text(best_source if objectively_improved else baseline,encoding='utf-8')
          payload={
              'cycle':os.environ.get('CYCLE','0'),
              'target':os.environ['SELECTED_TARGET'],
              'baseline':baseline_result,
              'candidates':rows,
              'best_slug':best_slug,
              'best_result':best_result,
              'objectively_improved':objectively_improved,
          }
          Path('/tmp/pass378/beam-ranking.json').write_text(json.dumps(payload,indent=2),encoding='utf-8')
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"improved={'true' if objectively_improved else 'false'}\n")
              out.write(f"candidate_pass={'true' if best_result.get('exit_code')==0 and best_result.get('artifacts_ok') else 'false'}\n")
              out.write(f"best_slug={best_slug}\n")
          print(json.dumps(payload,indent=2))
          PY

      - name: Verify the selected source twice when it compiles once
        id: verify
        if: steps.rank.outputs.candidate_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/priority_chain_v378.py --mode verify \
            --target "${SELECTED_TARGET}" --runs 2
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Commit cycle evidence and any objectively improved source
        shell: bash
        run: |
          set -euo pipefail
          cycle="${CYCLE:-0}"
          mkdir -p build-logs
          cp /tmp/pass378/beam-ranking.json \
            "build-logs/PASS378_BEAM_CYCLE_${cycle}.json"
          if [[ -f /tmp/pass378/target-verification.json ]]; then
            cp /tmp/pass378/target-verification.json \
              "build-logs/PASS378_VERIFY_CYCLE_${cycle}.json"
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "build-logs/PASS378_BEAM_CYCLE_${cycle}.json"
          if [[ -f "build-logs/PASS378_VERIFY_CYCLE_${cycle}.json" ]]; then
            git add "build-logs/PASS378_VERIFY_CYCLE_${cycle}.json"
          fi
          if [[ '${{ steps.rank.outputs.improved }}' == 'true' ]]; then
            git add "${SELECTED_TARGET}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "fix: PASS 378+ beam cycle ${cycle} on $(basename "${SELECTED_TARGET}")"
            git push origin HEAD:"${BRANCH_NAME}"
          fi

      - name: Dispatch the next ordered cycle unless the safety cap is reached
        shell: bash
        run: |
          set -euo pipefail
          cycle="${CYCLE:-0}"
          next=$((cycle + 1))
          if [[ ${next} -gt 40 ]]; then
            echo "Beam safety cap reached at cycle ${cycle}."
            exit 1
          fi
          gh workflow run pass378-priority-beam-loop.yml \
            --repo "${GITHUB_REPOSITORY}" --ref "${BRANCH_NAME}" -f cycle="${next}"
          echo "dispatched_cycle=${next}"
