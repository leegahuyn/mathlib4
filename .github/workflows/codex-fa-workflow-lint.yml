name: Codex FA workflow lint

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-workflow-lint.yml
  workflow_dispatch:

permissions:
  contents: read
  statuses: write

env:
  TARGET_SHA: "781b5d929cb9ae55280872391cb5315bc47ebe91"
  TARGET_PATH: ".github/workflows/codex-fa-full-dynamic-v4.yml"

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - name: Fetch exact target workflow
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/codex-fa-workflow-lint
          gh api "repos/${GITHUB_REPOSITORY}/contents/${TARGET_PATH}?ref=${TARGET_SHA}" --jq .content \
            | tr -d '\n' | base64 -d > build-logs/codex-fa-workflow-lint/target.yml

      - name: Run actionlint
        shell: bash
        run: |
          set +e
          go install github.com/rhysd/actionlint/cmd/actionlint@latest \
            > build-logs/codex-fa-workflow-lint/install.log 2>&1
          install_exit=$?
          set -e
          printf '%s\n' "$install_exit" > build-logs/codex-fa-workflow-lint/install.exit
          if [[ "$install_exit" -eq 0 ]]; then
            set +e
            "$HOME/go/bin/actionlint" -oneline build-logs/codex-fa-workflow-lint/target.yml \
              > build-logs/codex-fa-workflow-lint/actionlint.txt 2>&1
            lint_exit=$?
            set -e
            printf '%s\n' "$lint_exit" > build-logs/codex-fa-workflow-lint/actionlint.exit
          fi

      - name: Upload lint evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-workflow-lint-${{ github.sha }}
          path: build-logs/codex-fa-workflow-lint
          if-no-files-found: error
          retention-days: 30

      - name: Publish lint locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='codex/fa-workflow-lint' \
            -f description="workflow lint run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
