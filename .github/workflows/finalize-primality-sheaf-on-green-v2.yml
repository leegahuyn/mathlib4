name: Finalize PrimalitySheaf PR on full green gate v2

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/primality_sheaf_ci.sh'
      - 'scripts/finalize_primality_sheaf_pr_v2.sh'
      - 'scripts/primality-sheaf-ci.final-v3.yml'
      - '.github/workflows/finalize-primality-sheaf-on-green-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write

concurrency:
  group: finalize-primality-sheaf-on-green-v2
  cancel-in-progress: true

jobs:
  validate-clean-finalize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      SOURCE_SHA: ${{ github.sha }}
      PR_NUMBER: '7'
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Clone exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run full validation, cleanup, official CI poll, and ready transition
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          sed \
            -e 's#scripts/primality-sheaf-ci.final-v2.yml#scripts/primality-sheaf-ci.final-v3.yml#g' \
            -e 's#origin/master\.\.\.HEAD#origin/master HEAD#g' \
            scripts/finalize_primality_sheaf_pr_v2.sh \
            > /tmp/finalize_primality_sheaf_pr_v3.sh
          bash /tmp/finalize_primality_sheaf_pr_v3.sh

      - name: Upload finalization evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: primality-sheaf-finalizer-v2-${{ env.SOURCE_SHA }}
          path: |
            /tmp/primality-finalizer-validation
            /tmp/primality-finalizer
          if-no-files-found: warn
          retention-days: 30
