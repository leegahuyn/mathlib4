name: GPT QYM GB88 C12-C13 repair matrix

on:
  push:
    branches: [gpt/qym-c01-c13-sequential-v2-20260819]
    paths:
      - .github/workflows/gpt-qym-gb88-c12-c13-matrix.yml
      - .github/qym-gb88-c12-c13-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-gb88-c12-c13-${{ github.ref }}
  cancel-in-progress: false

jobs:
  repair:
    name: ${{ matrix.cluster }} ${{ matrix.variant }} from GB88
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        include:
          - cluster: C12
            variant: unfold_natural_stage
            script: qym_c12_patch.py
            has_variant: 'false'
          - cluster: C13
            variant: ofReal_pow
            script: qym_c13_variants.py
            has_variant: 'true'
          - cluster: C13
            variant: change_rfl
            script: qym_c13_variants.py
            has_variant: 'true'
          - cluster: C13
            variant: norm_cast
            script: qym_c13_variants.py
            has_variant: 'true'
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-gb88-${{ matrix.cluster }}-${{ matrix.variant }}
      BASE: /tmp/qym-gb88-c12-c13-authority
      BASELINE_ARTIFACT: '9352528413'
      BASELINE_SOURCE_NAME: QYM.candidate-c1.lean
      BASELINE_SHA256: 830563b33d873354809594d9e9dce962c1253052f8e70bd4d1513226f7598217
      BASELINE_BLOB: e796aa6ae9f01965116902a9345ed69f81bcfc42
      BASELINE_ERRORS: '88'
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Recover immutable GB88 authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$BASE" "$OLEAN"
          test "$GITHUB_REF_NAME" = gpt/qym-c01-c13-sequential-v2-20260819
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f ".github/${{ matrix.script }}"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/artifacts/$BASELINE_ARTIFACT/zip" \
            > "$RUNNER_TEMP/qym-gb88-c12-c13.zip"
          unzip -q -o "$RUNNER_TEMP/qym-gb88-c12-c13.zip" -d "$BASE"
          src="$(find "$BASE" -type f -name "$BASELINE_SOURCE_NAME" -print -quit)"
          test -n "$src" && test -s "$src"
          test "$(sha256sum "$src" | awk '{print $1}')" = "$BASELINE_SHA256"
          python3 - "$src" "$BASELINE_BLOB" <<'PY'
          from pathlib import Path
          import hashlib, sys
          raw = Path(sys.argv[1]).read_bytes()
          got = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
          assert got == sys.argv[2], (got, sys.argv[2])
          PY
          cp "$src" "$OUT/QYM.global-best-88.lean"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for a in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break || sleep $((a*5))
          done
          for a in 1 2 3 4 5; do
            lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break || sleep $((a*5))
          done
          lean --version > "$OUT/lean-version.txt"
          lake --version > "$OUT/lake-version.txt"

      - name: Restore dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure dependency objects
        shell: bash
        run: |
          set -euo pipefail
          need=false
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            [[ -s "$OLEAN/$s.olean" && -s "$OLEAN/$s.ilean" ]] || need=true
          done
          if [[ "$need" == true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize exact candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.global-best-88.lean" "$QYM"
          script=".github/${{ matrix.script }}"
          if [[ "${{ matrix.has_variant }}" == true ]]; then
            python3 -B "$script" "${{ matrix.variant }}" "$QYM" | tee "$OUT/PATCH_RESULT.json"
          else
            python3 -B "$script" "$QYM" | tee "$OUT/PATCH_RESULT.json"
          fi
          cp "$QYM" "$OUT/QYM.candidate-${{ matrix.cluster }}-${{ matrix.variant }}.lean"
          test "$(jq -r '.input_sha256' "$OUT/PATCH_RESULT.json")" = "$BASELINE_SHA256"

      - name: Full direct Lean exact candidate
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.olean" -i "$RUNNER_TEMP/QYM.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.olean"
            test -s "$RUNNER_TEMP/QYM.ilean"
            cp "$RUNNER_TEMP/QYM.olean" "$OUT/QYM.olean"
            cp "$RUNNER_TEMP/QYM.ilean" "$OUT/QYM.ilean"
            sha256sum "$OUT/QYM.olean" "$OUT/QYM.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          cp "$OUT/QYM.canonical.lean" "$QYM"

      - name: Summarize actual direct Lean evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 - "$OUT" "${{ matrix.cluster }}" "${{ matrix.variant }}" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, os, re, sys
          out = Path(sys.argv[1])
          cluster = sys.argv[2]
          variant = sys.argv[3]
          raw = (out / 'QYM.log').read_bytes() if (out / 'QYM.log').exists() else b''
          text = raw.decode(errors='replace')
          pat = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M)
          rows = []
          for m in pat.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [r for r in rows if r['severity'] == 'error']
          warnings = [r for r in rows if r['severity'] == 'warning']
          panics = re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          patch = json.loads((out / 'PATCH_RESULT.json').read_text()) if (out / 'PATCH_RESULT.json').exists() else {}
          rc = int((out / 'QYM.exit').read_text()) if (out / 'QYM.exit').exists() else None
          result = {
              'schema': 'qym-gb88-c12-c13-v1',
              'cluster': cluster,
              'variant': variant,
              'github_sha': os.environ.get('GITHUB_SHA'),
              'run_id': os.environ.get('GITHUB_RUN_ID'),
              'baseline_qym_sha256': os.environ['BASELINE_SHA256'],
              'baseline_qym_blob': os.environ['BASELINE_BLOB'],
              'baseline_error_headers': int(os.environ['BASELINE_ERRORS']),
              'candidate_qym_sha256': patch.get('candidate_sha256'),
              'candidate_qym_blob': patch.get('candidate_blob'),
              'bytes': patch.get('bytes'),
              'lf': patch.get('lf'),
              'exit': rc,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in errors).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': rc == 0 and not errors and not panics,
              'strict_improvement': (rc == 0 and not errors and not panics) or (not panics and len(errors) < int(os.environ['BASELINE_ERRORS'])),
          }
          (out / 'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(r, sort_keys=True) + '\n' for r in rows))
          (out / 'QYM.error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r['code'] else ''}: {r['message']}\n" for r in errors))
          (out / 'QYM.panic-lines.txt').write_text(''.join(p + '\n' for p in panics))
          (out / 'RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb88-${{ matrix.cluster }}-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb88-${{ matrix.cluster }}-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
