name: GPT QYM fastlane ContDiff micro

on:
  push:
    branches:
      - gpt/qym-fastlane-probe35-20260818
    paths:
      - .github/workflows/gpt-qym-fastlane-micro.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro:
    name: ContDiff micro ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [canonical, clm, named]
    env:
      OUT: /tmp/qym-fastlane-micro-${{ matrix.variant }}
      TEST: QYM_FastlaneMicro_${{ matrix.variant }}.lean

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1

      - name: Materialize micro test
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TEST" "${{ matrix.variant }}" <<'PY'
          from pathlib import Path
          import sys
          path=Path(sys.argv[1]); variant=sys.argv[2]
          prelude='''import Mathlib.Analysis.Calculus.ContDiff.Operations
          import Mathlib.Analysis.Calculus.ContDiff.RCLike
          import Mathlib.Analysis.Complex.UpperHalfPlane.Manifold
          import Mathlib.Tactic

          noncomputable section
          open Function Set
          open scoped UpperHalfPlane

          __BODY__
          '''.replace('          ','')

          canonical='''example (a b c d Y : ℝ)
              (hden : ∀ x : ℝ,
                (c : ℂ) * ((x : ℂ) + (Y : ℂ) * Complex.I) + (d : ℂ) ≠ 0) :
              ContDiff ℝ ∞ (fun x : ℝ =>
                ((a : ℂ) * ((x : ℂ) + (Y : ℂ) * Complex.I) + (b : ℂ)) /
                  ((c : ℂ) * ((x : ℂ) + (Y : ℂ) * Complex.I) + (d : ℂ))) := by
            letI : NormedAddCommGroup ℂ := Complex.instNormedAddCommGroup
            letI : NormedSpace ℝ ℂ := instInnerProductSpaceRealComplex.toNormedSpace
            have hx : ContDiff ℝ ∞ (fun x : ℝ => (x : ℂ)) := by
              simpa using Complex.ofRealLI.contDiff
            have hhor : ContDiff ℝ ∞
                (fun x : ℝ => (x : ℂ) + (Y : ℂ) * Complex.I) :=
              hx.add contDiff_const
            have hnum : ContDiff ℝ ∞
                (fun x : ℝ =>
                  (a : ℂ) * ((x : ℂ) + (Y : ℂ) * Complex.I) + (b : ℂ)) :=
              (contDiff_const.mul hhor).add contDiff_const
            have hdenDiff : ContDiff ℝ ∞
                (fun x : ℝ =>
                  (c : ℂ) * ((x : ℂ) + (Y : ℂ) * Complex.I) + (d : ℂ)) :=
              (contDiff_const.mul hhor).add contDiff_const
            simpa only [div_eq_mul_inv] using hnum.mul (hdenDiff.inv hden)
          '''.replace('          ','')

          clm=canonical.replace(
            'simpa using Complex.ofRealLI.contDiff',
            'simpa using Complex.ofRealLI.toContinuousLinearMap.contDiff')

          named='''noncomputable def testUpperLift (u : ℍ → ℂ) : ℂ → ℂ :=
            u ∘ UpperHalfPlane.ofComplex

          @[simp] theorem testUpperLift_apply (u : ℍ → ℂ) (z : ℍ) :
              testUpperLift u (z : ℂ) = u z := by
            exact congrArg u (UpperHalfPlane.ofComplex_apply z)

          example (f : ℍ → ℂ) (curve : ℝ → ℍ)
              (hcurve : ContDiff ℝ ∞ (fun x : ℝ => (curve x : ℂ)))
              (hu : ContDiffOn ℝ ∞ (testUpperLift f)
                UpperHalfPlane.upperHalfPlaneSet) :
              ContDiff ℝ ∞ (fun x : ℝ => f (curve x)) := by
            have hcomp := hu.comp_contDiff hcurve (fun x => (curve x).2)
            simpa only [Function.comp_apply, testUpperLift_apply] using hcomp
          '''.replace('          ','')

          bodies={'canonical':canonical,'clm':clm,'named':named}
          path.write_text(prelude.replace('__BODY__',bodies[variant])+'\n',encoding='utf-8')
          PY
          cp "$TEST" "$OUT/$TEST"

      - name: Direct Lean compile micro test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/TEST.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/TEST.olean" -i "$OUT/TEST.ilean" \
              "$TEST" > "$OUT/TEST.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/TEST.exit"
          rm -f "$TEST"
          exit 0

      - name: Upload micro evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-fastlane-micro-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/qym-fastlane-micro-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless micro test passes
        if: always()
        shell: bash
        run: |
          test -f "$OUT/TEST.exit"
          test "$(cat "$OUT/TEST.exit")" = 0
          test -s "$OUT/TEST.olean"
          test -s "$OUT/TEST.ilean"
