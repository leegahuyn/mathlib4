name: Agent trigger atomic Advanced and FunctionalAnalysis materialization r2

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/agent-20260807-trigger-materialize-r2.yml'

permissions:
  actions: write
  contents: read

jobs:
  dispatch:
    runs-on: ubuntu-24.04
    steps:
      - name: Dispatch the action-free atomic verifier at current branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          curl --fail-with-body --silent --show-error \
            -X POST \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'X-GitHub-Api-Version: 2022-11-28' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/agent-20260807-materialize-advanced-fa.yml/dispatches" \
            -d '{"ref":"fix/primality-sheaf-clean-build"}'
          echo 'Atomic materialization workflow dispatched.'
