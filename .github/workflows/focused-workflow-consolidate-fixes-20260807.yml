name: Consolidate focused verification workflow fixes

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-workflow-consolidate-fixes-20260807.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: consolidate-focused-workflow-fixes
  cancel-in-progress: false

jobs:
  patch-latest-safely:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: fix/primality-sheaf-clean-build
    steps:
      - name: Clone branch and atomically apply all workflow-only fixes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" repo
          cd repo
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          for attempt in 1 2 3 4 5; do
            git fetch origin "${BRANCH}"
            git reset --hard "origin/${BRANCH}"
            python3 - <<'PY'
          from pathlib import Path
          files=[
            Path('.github/workflows/focused-m2a-v68-materialize-20260807.yml'),
            Path('.github/workflows/focused-m2a-direct-source-20260807.yml'),
            Path('.github/workflows/focused-functional-analysis-materialize-20260807.yml'),
            Path('.github/workflows/focused-functional-analysis-direct-20260807.yml'),
            Path('.github/workflows/focused-qym-direct-20260807.yml')]
          for p in files:
            if not p.exists(): raise SystemExit(f'missing workflow: {p}')
            s=p.read_text()
            s=s.replace('LOGDIR: focused-proof/', 'LOGDIR: /tmp/focused-proof/')
            s=s.replace("Path('focused-proof/Mock2_Advanced-direct/direct-pass.json')", "Path('/tmp/focused-proof/Mock2_Advanced-direct/direct-pass.json')")
            s=s.replace("Path('focused-proof/FunctionalAnalysis-direct/direct-pass.json')", "Path('/tmp/focused-proof/FunctionalAnalysis-direct/direct-pass.json')")
            s=s.replace("Path('focused-proof/QYM-direct/direct-pass.json')", "Path('/tmp/focused-proof/QYM-direct/direct-pass.json')")
            s=s.replace('git clone --no-hardlinks . "$dir" >/dev/null',
                        'git clone --no-hardlinks "${GITHUB_WORKSPACE}" "$dir" >/dev/null')
            if p.name == 'focused-m2a-v68-materialize-20260807.yml':
              old='cmp -s /tmp/m2a-repro-a/"${TARGET}" /tmp/m2a-repro-b/"${TARGET}"\n          cp /tmp/m2a-repro-a/"${TARGET}" "${TARGET}"'
              new='cmp -s /tmp/m2a-repro-a/"${TARGET}" /tmp/m2a-repro-b/"${TARGET}"\n          cd "${GITHUB_WORKSPACE}"\n          cp /tmp/m2a-repro-a/"${TARGET}" "${TARGET}"'
              if old in s: s=s.replace(old,new)
            if p.name == 'focused-functional-analysis-materialize-20260807.yml':
              old='cmp -s /tmp/fa-repro-a/"${FA}" /tmp/fa-repro-b/"${FA}"\n          cp /tmp/fa-repro-a/"${FA}" "${FA}"'
              new='cmp -s /tmp/fa-repro-a/"${FA}" /tmp/fa-repro-b/"${FA}"\n          cd "${GITHUB_WORKSPACE}"\n          cp /tmp/fa-repro-a/"${FA}" "${FA}"'
              if old in s: s=s.replace(old,new)
            p.write_text(s)
          PY
            git diff --check
            ! grep -R '^      LOGDIR: focused-proof/' .github/workflows/focused-*20260807.yml
            grep -F 'git clone --no-hardlinks "${GITHUB_WORKSPACE}" "$dir"' \
              .github/workflows/focused-m2a-v68-materialize-20260807.yml \
              .github/workflows/focused-functional-analysis-materialize-20260807.yml
            if git diff --quiet; then
              echo 'All focused workflow fixes are already present.'
              exit 0
            fi
            git add .github/workflows/focused-m2a-v68-materialize-20260807.yml \
              .github/workflows/focused-m2a-direct-source-20260807.yml \
              .github/workflows/focused-functional-analysis-materialize-20260807.yml \
              .github/workflows/focused-functional-analysis-direct-20260807.yml \
              .github/workflows/focused-qym-direct-20260807.yml
            git commit -m 'ci: consolidate focused workflow execution fixes'
            if git push origin "HEAD:${BRANCH}"; then
              exit 0
            fi
            git reset --hard HEAD~1
            sleep $((attempt * 3))
          done
          echo 'Could not apply focused workflow fixes without overwriting a concurrent head.' >&2
          exit 1
