name: Codex FA API probe corrected Lp translation sub v1

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-lp-correct-translation-sub-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Verify corrected translation difference
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeCorrectTranslationSub.lean <<'LEAN'
          import Mathlib
          open MeasureTheory Filter Topology
          open scoped ENNReal
          noncomputable abbrev A := MeasureTheory.Lp ℂ 2 (volume : Measure ℂ)
          example (f : A) :
              Filter.Tendsto (fun t : ℂ ↦ ‖(DomAddAct.mk t +ᵥ f) - f‖)
                (nhds 0) (nhds 0) := by
            letI : Fact ((2 : ℝ≥0∞) ≠ (⊤ : ℝ≥0∞)) := ⟨by norm_num⟩
            have h : Continuous (fun t : ℂ ↦ ‖(DomAddAct.mk t +ᵥ f) - f‖) := by
              fun_prop
            have h0 : ContinuousAt (fun t : ℂ ↦ ‖(DomAddAct.mk t +ᵥ f) - f‖) 0 := h.continuousAt
            change Filter.Tendsto (fun t : ℂ ↦ ‖(DomAddAct.mk t +ᵥ f) - f‖)
              (nhds 0) (nhds ‖(DomAddAct.mk (0 : ℂ) +ᵥ f) - f‖) at h0
            have hm0 : DomAddAct.mk (0 : ℂ) = 0 := rfl
            simpa [hm0] using h0
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeCorrectTranslationSub.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-lp-correct-translation-sub-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
