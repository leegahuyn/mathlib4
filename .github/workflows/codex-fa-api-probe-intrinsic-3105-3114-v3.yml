name: Codex FA API probe intrinsic 3105-3114 v3

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-intrinsic-3105-3114-v3.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact environment bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeIntrinsic3105V3.lean <<'LEAN'
          import Mathlib
          open Set Filter Topology UpperHalfPlane
          open scoped NNReal UpperHalfPlane
          local notation "nhds[" s "]" x => nhdsWithin x s

          example (x : ℝ) (s : Set ℝ) :
              (nhds[s] x : Filter ℝ) = nhdsWithin x s := by rfl

          example (z : ℍ) :
              Filter.Tendsto UpperHalfPlane.ofComplex
                (nhds[UpperHalfPlane.upperHalfPlaneSet] (z : ℂ)) (nhds z) := by
            have hzSource : (z : ℂ) ∈ UpperHalfPlane.ofComplex.source := by
              change (z : ℂ) ∈ UpperHalfPlane.upperHalfPlaneSet
              exact z.im_pos
            simpa only [UpperHalfPlane.ofComplex_apply_of_im_pos z.im_pos] using
              (UpperHalfPlane.ofComplex.continuousOn (x := (z : ℂ)) hzSource)

          example : ∃ K : ℝ≥0,
              LipschitzOnWith K Real.smoothTransition (Set.Icc (0 : ℝ) 1) := by
            exact Real.smoothTransition.contDiff.contDiffOn.exists_lipschitzOnWith
              (n := ∞) (by simp) (convex_Icc (0 : ℝ) 1) isCompact_Icc

          example {K : ℝ≥0}
              (hK : LipschitzOnWith K Real.smoothTransition (Set.Icc (0 : ℝ) 1))
              (x y : ℝ) (hx : x ∈ Set.Icc (0 : ℝ) 1) (hy : y ∈ Set.Icc (0 : ℝ) 1) :
              dist (Real.smoothTransition x) (Real.smoothTransition y) ≤
                (K : ℝ) * dist x y := by
            exact hK.dist_le_mul x hx y hy

          example (x y : ℝ) :
              dist (projIcc (0 : ℝ) 1 zero_le_one x)
                  (projIcc (0 : ℝ) 1 zero_le_one y) ≤
                (1 : ℝ) * dist x y := by
            simpa only [NNReal.coe_one] using
              (LipschitzWith.projIcc zero_le_one).dist_le_mul x y

          example (f : ℂ → ℝ) (z : ℂ) (s : Set ℂ)
              (hf : ContDiffWithinAt ℝ ∞ f s z) :
              ContDiffWithinAt ℝ ∞ (fun v => (f v : ℂ)) s z := by
            simpa only [Function.comp_apply, Complex.ofRealCLM_apply] using
              Complex.ofRealCLM.contDiff.contDiffAt.comp_contDiffWithinAt z hf

          example (z : ℍ) {w : ℂ} (hwpos : 0 < w.im) :
              dist ((UpperHalfPlane.ofComplex w : ℍ) : ℂ) (z : ℂ) /
                  Real.sqrt ((UpperHalfPlane.ofComplex w).im * z.im) =
                dist w (z : ℂ) / Real.sqrt (w.im * z.im) := by
            rw [UpperHalfPlane.ofComplex_apply_of_im_pos hwpos]
            change dist w (z : ℂ) / Real.sqrt (w.im * z.im) = _
            rfl

          example (y A : ℝ) (hy : 0 < y) : y * (A / y) = A := by
            field_simp [ne_of_gt hy]

          example : ‖Complex.I‖ = 1 := Complex.norm_I
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeIntrinsic3105V3.lean | tee /tmp/intrinsic-3105-v3.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-intrinsic-3105-3114-v3-${{ github.sha }}
          path: /tmp/intrinsic-3105-v3.log
          if-no-files-found: warn
          retention-days: 7
