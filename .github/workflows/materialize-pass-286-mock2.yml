name: Materialize verified Mock2 candidate

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/materialize-pass-286-mock2.yml'

permissions:
  contents: write

concurrency:
  group: materialize-verified-mock2
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/primality-sheaf-clean-build
          fetch-depth: 1

      - name: Apply verified cumulative Mock2 repairs
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/Mock2-materialize
          {
            python3 scripts/apply_mock2_passes_286_to_288_repairs.py
            python3 scripts/apply_three_hundred_second_pass_mock2_repairs.py
            python3 scripts/apply_three_hundred_third_pass_mock2_repairs.py
            python3 scripts/apply_three_hundred_fourth_pass_mock2_repairs.py
          } 2>&1 | tee build-logs/Mock2-materialize/repair-application.log
          cp PrimalitySheafVerification/Mock2.lean \
            build-logs/Mock2-materialize/repaired-source.lean

      - name: Set up Lean
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib cache
        run: lake exe cache get

      - name: Clean compile verified candidate
        shell: bash
        run: |
          set +e
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          logdir='build-logs/Mock2-materialize'
          mkdir -p "$outdir" "$logdir"
          rm -f \
            "$outdir/Mock2.olean" \
            "$outdir/Mock2.ilean" \
            "$outdir/Mock2.olean.private"
          lake env lean PrimalitySheafVerification/Mock2.lean \
            -o "$outdir/Mock2.olean" \
            -i "$outdir/Mock2.ilean" 2>&1 | tee "$logdir/Mock2.log"
          code=${PIPESTATUS[0]}
          echo "$code" > "$logdir/exit-code.txt"
          if [[ "$code" -ne 0 ]]; then
            exit "$code"
          fi
          test -s "$outdir/Mock2.olean"
          test -s "$outdir/Mock2.ilean"

      - name: Audit forbidden proof escapes and printed axioms
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          src_path = Path('PrimalitySheafVerification/Mock2.lean')
          log_path = Path('build-logs/Mock2-materialize/Mock2.log')
          audit_path = Path('build-logs/Mock2-materialize/trust-audit.txt')
          axiom_path = Path('build-logs/Mock2-materialize/axiom-audit.txt')

          source = src_path.read_text(encoding='utf-8')
          out = []
          i = 0
          depth = 0
          in_string = False
          escaped = False
          while i < len(source):
              if depth:
                  if source.startswith('/-', i):
                      depth += 1
                      out.extend('  ')
                      i += 2
                  elif source.startswith('-/', i):
                      depth -= 1
                      out.extend('  ')
                      i += 2
                  else:
                      out.append('\n' if source[i] == '\n' else ' ')
                      i += 1
                  continue
              if in_string:
                  ch = source[i]
                  out.append('\n' if ch == '\n' else ' ')
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  i += 1
                  continue
              if source.startswith('--', i):
                  while i < len(source) and source[i] != '\n':
                      out.append(' ')
                      i += 1
                  continue
              if source.startswith('/-', i):
                  depth = 1
                  out.extend('  ')
                  i += 2
                  continue
              if source[i] == '"':
                  in_string = True
                  out.append(' ')
                  i += 1
                  continue
              out.append(source[i])
              i += 1

          code = ''.join(out)
          checks = {
              'sorry': re.compile(r'\bsorry\b'),
              'admit': re.compile(r'\badmit\b'),
              'axiom': re.compile(r'^\s*axiom\b', re.M),
              'unsafe': re.compile(r'\bunsafe\b'),
              'native_decide': re.compile(r'\bnative_decide\b'),
          }
          findings = []
          for label, pattern in checks.items():
              for match in pattern.finditer(code):
                  line = code.count('\n', 0, match.start()) + 1
                  findings.append((label, line))
          audit_path.write_text(
              '\n'.join(f'{label}: line {line}' for label, line in findings)
              + ('\n' if findings else 'PASS: no forbidden code tokens\n'),
              encoding='utf-8',
          )
          if findings:
              raise SystemExit(f'forbidden code tokens: {findings}')

          log = log_path.read_text(encoding='utf-8', errors='replace')
          if 'sorryAx' in log:
              raise SystemExit('sorryAx found in Mock2 axiom output')
          allowed = {'propext', 'Classical.choice', 'Quot.sound'}
          used = set()
          for block in re.findall(r'depends on axioms:\s*\[([^\]]*)\]', log, flags=re.S):
              for item in block.replace('\n', ' ').split(','):
                  item = item.strip()
                  if item:
                      used.add(item)
          unexpected = sorted(used - allowed)
          axiom_path.write_text(
              f'allowed={sorted(allowed)}\nused={sorted(used)}\nunexpected={unexpected}\n',
              encoding='utf-8',
          )
          if unexpected:
              raise SystemExit(f'unexpected axioms: {unexpected}')
          PY

      - name: Record source and artifact hashes
        shell: bash
        run: |
          set -euo pipefail
          sha256sum \
            PrimalitySheafVerification/Mock2.lean \
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean \
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean \
            > build-logs/Mock2-materialize/hashes.sha256
          git diff --check
          changed=$(git diff --name-only)
          if [[ "$changed" != 'PrimalitySheafVerification/Mock2.lean' ]]; then
            echo "unexpected changed files:"
            printf '%s\n' "$changed"
            exit 1
          fi

      - name: Commit checked-in Mock2 source
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- PrimalitySheafVerification/Mock2.lean; then
            echo 'Expected a materialized Mock2 source diff, but none was produced.'
            exit 1
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add PrimalitySheafVerification/Mock2.lean
          git commit -m 'fix: make Mock2 compile directly from checked-in source'
          git push origin HEAD:fix/primality-sheaf-clean-build

      - name: Upload materialization proof
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-materialization-proof
          path: |
            build-logs/Mock2-materialize
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
          if-no-files-found: error
          retention-days: 30
