name: Mock2 Advanced pass316 verifier v2

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'scripts/apply_*_pass_repairs.py'
      - 'scripts/ci_mock2_advanced_pass316_v2.sh'
      - '.github/workflows/mock2-advanced-pass316-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mock2-advanced-pass316-v2-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-materialize-direct:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      SOURCE_SHA: ${{ github.sha }}
      SOURCE_BRANCH: ${{ github.ref_name }}
      PR_NUMBER: 7
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact triggering head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1

      - name: Install exact Lean and Mathlib cache
        uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true

      - name: Verify candidate or checked-in direct source
        shell: bash
        run: bash scripts/ci_mock2_advanced_pass316_v2.sh

      - name: Upload complete verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-advanced-pass316-v2-${{ github.sha }}
          path: /tmp/focused-advanced-pass316-v2
          if-no-files-found: warn
          retention-days: 30
