name: PASS 376 FA Mock3 QYM constrained autorepair

on:
  push:
    branches: [fix/fa376-autorepair-20260809]
    paths:
      - '.github/workflows/pass376-fa-mock3-qym-autorepair.yml'
      - 'scripts/pass376_autorepair_agent.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass376-fa-mock3-qym-autorepair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      PASS376_MAX_ITERATIONS: '36'
    steps:
      - name: Checkout exact PASS 376 agent head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 800
          persist-credentials: true

      - name: Install pinned Lean and mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"

      - name: Install GitHub Models CLI fallback
        shell: bash
        run: |
          set +e
          gh extension install github/gh-models
          gh models --help
          exit 0

      - name: Reconstruct exact PASS 375c source
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('scripts/diagnose_pass341_fa.sh')
          text = path.read_text(encoding='utf-8')
          open_marker = '''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          close_marker = '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(open_marker) != 1 or text.count(close_marker) != 1:
              raise SystemExit('could not locate the PASS 341 compile command exactly')
          text = text.replace(open_marker, '''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text = text.replace(close_marker, '''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text, encoding='utf-8')
          PY
          bash scripts/diagnose_pass358_fa.sh
          source_file='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${source_file}"
          cp "${source_file}" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            '8fd20f88c43060d392bab969c91a84b7c0bb08657af7728752a77c5f3c57c6c6'
          python3 scripts/apply_pass375c_candidate.py
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            'd2e1b383b9e60fd18607094ce104679cd604e8c90ffc0261d8a877e700b99b8e'

      - name: Run constrained autorepair and ordered two-pass gate
        id: agent
        shell: bash
        run: |
          set +e
          python3 scripts/pass376_autorepair_agent.py \
            > /tmp/pass376-agent-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass376-agent-console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Preserve best source and status on isolated branch
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          mkdir -p build-logs/pass376-autorepair
          cp /tmp/pass376-agent-console.log \
            build-logs/pass376-autorepair/console.log || true
          git add \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/pass376-autorepair-summary.json \
            build-logs/pass376-fa-mock3-qym-2x-pass.txt \
            build-logs/pass376-autorepair/console.log 2>/dev/null || true
          if ! git diff --cached --quiet; then
            if test -f build-logs/pass376-fa-mock3-qym-2x-pass.txt; then
              git commit -m 'fix: materialize verified FA Mock3 QYM two-pass source'
            else
              git commit -m 'wip: preserve PASS376 best FunctionalAnalysis frontier'
            fi
            git push origin HEAD:fix/fa376-autorepair-20260809
          fi

      - name: Upload PASS 376 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass376-fa-mock3-qym-${{ github.sha }}
          path: |
            /tmp/pass376-agent-console.log
            build-logs/pass376-autorepair
            build-logs/pass376-autorepair-summary.json
            build-logs/pass376-fa-mock3-qym-2x-pass.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce final ordered result
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          test -n "${AGENT_EXIT_CODE:-}"
          test "${AGENT_EXIT_CODE}" = '0'
          test -s build-logs/pass376-fa-mock3-qym-2x-pass.txt
