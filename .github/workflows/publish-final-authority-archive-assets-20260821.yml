name: Publish Formalization FINAL AUTHORITY Permanent Archive Assets 2026-08-21

on:
  push:
    branches:
      - ops/formalization-final-release-publisher-20260821
    paths:
      - ops/final_authority_release_builder.py
      - ops/final_authority_release_publisher.py
      - ops/final_authority_archive_branch_publisher.py
      - .github/workflows/publish-final-authority-archive-assets-20260821.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: formalization-final-archive-assets-2026-08-21
  cancel-in-progress: false

jobs:
  publish-permanent-orphan-archive:
    name: publish-permanent-orphan-evidence-branch
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout archive publisher infrastructure only
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
          sparse-checkout: |
            ops/final_authority_release_builder.py
            ops/final_authority_release_publisher.py
            ops/final_authority_archive_branch_publisher.py
          sparse-checkout-cone-mode: false

      - name: Build exact verification package and publish orphan branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile \
            ops/final_authority_release_builder.py \
            ops/final_authority_release_publisher.py \
            ops/final_authority_archive_branch_publisher.py
          python3 ops/final_authority_archive_branch_publisher.py

      - name: Upload archive package copy
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formalization-final-permanent-archive-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: package/FINAL_AUTHORITY_ARCHIVE_2026-08-21
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 90
          compression-level: 6

      - name: Enforce permanent archive publication
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          p = Path('package/FINAL_AUTHORITY_ARCHIVE_2026-08-21/ARCHIVE_PUBLISH_STATE.json')
          if not p.is_file():
              raise SystemExit('missing ARCHIVE_PUBLISH_STATE.json')
          data = json.loads(p.read_text())
          if data.get('pass') is not True:
              raise SystemExit(1)
          if data.get('authority_commit') != '61a48f07e42bc5bf1610a8df3e7cf5ec7e1461c3':
              raise SystemExit(1)
          if data.get('archive_branch') != 'archive-assets/formalization-final-2026-08-21':
              raise SystemExit(1)
          print(json.dumps(data, indent=2, sort_keys=True))
          PY
