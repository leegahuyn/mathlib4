name: PASS 415 independent strict FA tournament

on:
  push:
    branches:
      - fix/fa415-fast-strict-tournament-20260809
    paths:
      - '.github/workflows/pass415-fast-strict-tournament.yml'
      - 'build-logs/fa415-fast-strict/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass415-fast-strict-tournament
  cancel-in-progress: false

jobs:
  strict-tournament:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa415-fast-strict-tournament-20260809
      FA413_MAX_FRONTIERS: '8'
      FA413_MAX_CANDIDATES: '28'
    steps:
      - name: Checkout exact independent head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa415-fast-strict-tournament-20260809
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run same-height strict declaration tournament
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa413_strict_transplant_tournament_v4.py > /tmp/fa415.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa415.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Copy and validate evidence under independent path
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          src=build-logs/fa413-strict-transplant
          dst=build-logs/fa415-fast-strict
          mkdir -p "$dst"
          test -s "$src/CURRENT.json"
          test -s "$src/CURRENT.txt"
          cp "$src/CURRENT.json" "$dst/CURRENT.json"
          cp "$src/CURRENT.txt" "$dst/CURRENT.txt"
          cp /tmp/fa415.log "$dst/console.log"
          test ! -f "$src/ALL_REQUIRED_TARGETS_2X_PASS" || cp "$src/ALL_REQUIRED_TARGETS_2X_PASS" "$dst/ALL_REQUIRED_TARGETS_2X_PASS"
          find "$src" -maxdepth 1 -type f \
            \( -name 'frontier-*-PROMOTED.txt' -o -name 'frontier-*-context.txt' -o -name 'frontier-*-first-error.txt' \) \
            -exec cp {} "$dst/" \;
          python3 - <<'PY'
          from pathlib import Path
          import json
          s=json.loads(Path('build-logs/fa415-fast-strict/CURRENT.json').read_text())
          m=s['final_fa_metric']
          if not s['complete']:
              line=m.get('first_line')
              if not isinstance(line,int) or line < 31725:
                  raise SystemExit(f'regression below immutable champion: {line}')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit(f"forbidden token audit failed: {s['forbidden_token_audit']}")
          PY

      - name: Commit only strict checked-in champion and concise evidence
        if: always()
        shell: bash
        env:
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
        run: |
          set -euo pipefail
          d=build-logs/fa415-fast-strict
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
          if git diff --cached --quiet; then exit 0; fi
          if test -f "$d/ALL_REQUIRED_TARGETS_2X_PASS"; then
            msg='fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS [skip ci]'
          elif test "${SOURCE_CHANGED:-false}" = true; then
            msg='fix: promote independent strict FA champion [skip ci]'
          else
            msg='ci: record independent FA415 no-improvement evidence [skip ci]'
          fi
          git commit -m "$msg"
          git push origin HEAD:fix/fa415-fast-strict-tournament-20260809

      - name: Upload complete FA415 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass415-fast-strict-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa415-fast-strict
            build-logs/fa413-strict-transplant
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final gate
        if: always()
        env:
          EXIT_CODE: ${{ steps.tournament.outputs.exit_code }}
        shell: bash
        run: |
          test -n "${EXIT_CODE:-}"
          exit "$EXIT_CODE"
