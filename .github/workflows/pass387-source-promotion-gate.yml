name: PASS 387 source-change two-pass promotion gate

on:
  push:
    branches: [fix/fa387-self-chaining-repair-20260809]
    paths:
      - '.github/workflows/pass387-source-promotion-gate.yml'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: write
  issues: write

concurrency:
  group: pass387-source-promotion-gate
  cancel-in-progress: true

jobs:
  verify-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    steps:
      - name: Checkout exact source-change head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2400
          persist-credentials: true

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Verify the complete priority chain twice
        id: verify
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass378
          python3 scripts/priority_chain_v378.py --mode select \
            > /tmp/pass387-promotion-selection.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-promotion-selection.log
          test -s /tmp/pass378/selection.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/pass378/selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"all_pass={'true' if data.get('all_pass') else 'false'}\n")
              out.write(f"first_failing_target={data.get('selected_target') or ''}\n")
          print(json.dumps(data,indent=2))
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Independently reverify and promote to the latest PR9 head
        id: promote
        if: steps.verify.outputs.all_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/promote_current_priority_v387.py \
            > /tmp/pass387-source-promotion.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-source-promotion.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload source-change gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass387-source-promotion-${{ github.sha }}
          path: |
            /tmp/pass378
            /tmp/pass387-promotion-selection.log
            /tmp/pass387-source-promotion.log
            /tmp/pass383-marker-watcher
            build-logs/PASS387_PROMOTION.json
          if-no-files-found: warn
          retention-days: 90

      - name: Record source gate status without a false PASS
        if: always()
        shell: bash
        env:
          ALL_PASS: ${{ steps.verify.outputs.all_pass }}
          FAILING_TARGET: ${{ steps.verify.outputs.first_failing_target }}
          PROMOTION_EXIT: ${{ steps.promote.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          cat > build-logs/PASS387_SOURCE_GATE_STATUS.json <<EOF
          {
            "head_sha": "${GITHUB_SHA}",
            "workflow_run_id": "${GITHUB_RUN_ID}",
            "all_priority_targets_2x_pass": ${ALL_PASS:-false},
            "first_failing_target": "${FAILING_TARGET:-}",
            "promotion_exit": "${PROMOTION_EXIT:-}"
          }
          EOF
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/PASS387_SOURCE_GATE_STATUS.json
          if [[ -f build-logs/PASS387_PROMOTION.json ]]; then
            git add build-logs/PASS387_PROMOTION.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record PASS 387 source promotion gate status'
            git push origin HEAD:fix/fa387-self-chaining-repair-20260809
          fi

      - name: Do not mislabel a failing source as PASS
        if: always()
        shell: bash
        env:
          ALL_PASS: ${{ steps.verify.outputs.all_pass }}
          PROMOTION_EXIT: ${{ steps.promote.outputs.exit_code }}
        run: |
          if [[ "${ALL_PASS:-false}" == 'true' ]]; then
            test "${PROMOTION_EXIT:-1}" = '0'
            test -s build-logs/PASS387_PROMOTION.json
            grep -q '"pass": true' build-logs/PASS387_PROMOTION.json
          else
            echo 'Priority source chain is not yet a two-pass PASS; the repair chain remains authoritative.'
          fi
