name: Codex FA probe P9 spectral proof shapes v2
# trigger: p9-spectral-proof-shapes-2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile P9 exact proof-shape probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP9Proofs.lean <<'LEAN'
          import Mathlib

          open Set Function
          open scoped LinearPMap

          #check inner_self_im
          #check LinearPMap.map_zero
          #check LinearPMap.map_add
          #check LinearPMap.map_smul
          #check starRingEnd_apply

          variable {H : Type*} [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          def probePartialEigenspace (A : H →ₗ.[ℂ] H) (μ : ℂ) : Submodule ℂ H where
            carrier := {x | ∃ hx : x ∈ A.domain, A ⟨x, hx⟩ = μ • x}
            zero_mem' := by
              refine ⟨A.domain.zero_mem, ?_⟩
              change A (0 : A.domain) = 0
              exact LinearPMap.map_zero A
            add_mem' := by
              rintro x y ⟨hx, hAx⟩ ⟨hy, hAy⟩
              refine ⟨A.domain.add_mem hx hy, ?_⟩
              change A ((⟨x, hx⟩ : A.domain) + (⟨y, hy⟩ : A.domain)) = μ • x + μ • y
              rw [LinearPMap.map_add, hAx, hAy, smul_add]
            smul_mem' := by
              rintro c x ⟨hx, hAx⟩
              refine ⟨A.domain.smul_mem c hx, ?_⟩
              change A (c • (⟨x, hx⟩ : A.domain)) = (c * μ) • x
              rw [LinearPMap.map_smul, hAx, smul_smul, mul_comm]

          example {μ : ℂ} (h : star μ = μ) : μ.im = 0 := by
            have hReal := congrArg Complex.im h
            change ((starRingEnd ℂ) μ).im = μ.im at hReal
            rw [Complex.conj_im] at hReal
            linarith

          example (μ ν z : ℂ)
              (h : (starRingEnd ℂ) μ * z = ν * z) :
              (star μ - ν) * z = 0 := by
            rw [sub_mul]
            change (starRingEnd ℂ) μ * z - ν * z = 0
            exact sub_eq_zero.mpr h

          example (A : H →ₗ.[ℂ] H) {μ : ℂ} {x : H}
              (hx : x ∈ A.domain) (hAx : A ⟨x, hx⟩ = μ • x) :
              (x, μ • x) ∈ A.graph := by
            let xd : A.domain := ⟨x, hx⟩
            have hRaw := A.mem_graph xd
            change (x, A ⟨x, hx⟩) ∈ A.graph at hRaw
            rw [hAx] at hRaw
            exact hRaw

          example (μ : ℂ) (x : H) (m : ℝ) :
              μ.re * (inner ℂ x x).re + (inner ℂ x x).re * m - μ.im * (inner ℂ x x).im =
                μ.re * ‖x‖ ^ 2 + m * ‖x‖ ^ 2 := by
            have hRe : (inner ℂ x x).re = ‖x‖ ^ 2 := by
              symm
              exact norm_sq_eq_re_inner (𝕜 := ℂ) x
            have hIm : (inner ℂ x x).im = 0 := by
              exact inner_self_im (𝕜 := ℂ) x
            rw [hRe, hIm]
            ring
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeP9Proofs.lean 2>&1 | tee /tmp/probe-p9-proofs.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe-p9-proofs.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-p9-proofs-v2-${{ github.sha }}
          path: |
            /tmp/ProbeP9Proofs.lean
            /tmp/probe-p9-proofs.log
            /tmp/probe-p9-proofs.exit
          retention-days: 30
