name: Codex FA predecessor dependent binder transport probe v2
# trigger: pred-dependent-binder-transport-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile dependent binder transport shapes v2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePredBinder.lean <<'LEAN'
          import Mathlib

          variable (F : ℤ → Type*)
          variable (P : (k : ℤ) → F k → F k → Prop)

          example (n : ℤ)
              (hs : ∀ v u : F ((n - 1) + 1), P ((n - 1) + 1) v u) :
              ∀ v u : F n, P n v u := by
            have hidx : (n - 1) + 1 = n := sub_add_cancel n 1
            exact hidx ▸ hs

          example (n : ℤ) (v u : F n)
              (hs : ∀ v u : F ((n - 1) + 1), P ((n - 1) + 1) v u) :
              P n v u := by
            have hidx : (n - 1) + 1 = n := sub_add_cancel n 1
            have hs' : ∀ v u : F n, P n v u := hidx ▸ hs
            exact hs' v u

          variable (A : (k : ℤ) → F k → Nat)
          example (n : ℤ)
              (hs : ∀ v u : F ((n - 1) + 1),
                A ((n - 1) + 1) v = A ((n - 1) + 1) u) :
              ∀ v u : F n, A n v = A n u := by
            have hidx : (n - 1) + 1 = n := sub_add_cancel n 1
            exact hidx ▸ hs
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePredBinder.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-pred-dependent-binder-transport-v2-${{ github.sha }}
          path: |
            /tmp/ProbePredBinder.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
