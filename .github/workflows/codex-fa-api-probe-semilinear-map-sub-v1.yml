name: Codex FA local Submodule subtraction coercion probe
# trigger: local-submodule-sub-coercion-v1-fire
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile local subtraction coercion probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeLocalSub.lean <<'LEAN'
          import Mathlib

          noncomputable section

          variable {V : Type*} [AddCommGroup V] [Module ℂ V]
          variable (S : Submodule ℂ V)

          noncomputable local instance probeModule : Module ℂ S := by
            exact Submodule.module S

          noncomputable local instance probeAddCommGroup : AddCommGroup S := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u v : S) :
              ((Sub.sub u v : S) : V) = (u : V) - (v : V) := by
            rfl

          example (u v : S) :
              S.subtype (Sub.sub u v) = S.subtype u - S.subtype v := by
            exact LinearMap.map_sub S.subtype u v

          example (u v w : S) :
              S.subtype (Sub.sub (Sub.sub u v) w) =
                S.subtype u - S.subtype v - S.subtype w := by
            rw [LinearMap.map_sub, LinearMap.map_sub]

          variable (T : Submodule ℂ (ℂ → ℂ))

          noncomputable local instance probeFunModule : Module ℂ T := by
            exact Submodule.module T

          noncomputable local instance probeFunAddCommGroup : AddCommGroup T := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u v : T) (z : ℂ) :
              (((Sub.sub u v : T) : ℂ → ℂ) z) =
                (u : ℂ → ℂ) z - (v : ℂ → ℂ) z := by
            rfl
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeLocalSub.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-local-submodule-sub-coercion-${{ github.sha }}
          path: |
            /tmp/ProbeLocalSub.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
