name: Codex FA probe P9 and joint proof shapes v4
# trigger: p9-joint-proof-shapes-4
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile corrected proof-shape probes v4
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP9Proofs.lean <<'LEAN'
          import Mathlib

          open Set Function
          open scoped LinearPMap

          variable {H : Type*} [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          def probePartialEigenspace (A : H →ₗ.[ℂ] H) (μ : ℂ) : Submodule ℂ H where
            carrier := {x | ∃ hx : x ∈ A.domain, A ⟨x, hx⟩ = μ • x}
            zero_mem' := by
              refine ⟨A.domain.zero_mem, ?_⟩
              have hSub : (⟨(0 : H), A.domain.zero_mem⟩ : A.domain) = 0 := by
                apply Subtype.ext
                rfl
              rw [hSub]
              simpa only [smul_zero] using (LinearPMap.map_zero A)
            add_mem' := by
              rintro x y ⟨hx, hAx⟩ ⟨hy, hAy⟩
              refine ⟨A.domain.add_mem hx hy, ?_⟩
              have hSub :
                  (⟨x, hx⟩ : A.domain) + (⟨y, hy⟩ : A.domain) =
                    (⟨x + y, A.domain.add_mem hx hy⟩ : A.domain) := by
                apply Subtype.ext
                rfl
              have hMap := LinearPMap.map_add A (⟨x, hx⟩ : A.domain) (⟨y, hy⟩ : A.domain)
              rw [hSub] at hMap
              calc
                A ⟨x + y, A.domain.add_mem hx hy⟩ =
                    A ⟨x, hx⟩ + A ⟨y, hy⟩ := hMap
                _ = μ • x + μ • y := by rw [hAx, hAy]
                _ = μ • (x + y) := by rw [smul_add]
            smul_mem' := by
              rintro c x ⟨hx, hAx⟩
              refine ⟨A.domain.smul_mem c hx, ?_⟩
              have hSub :
                  c • (⟨x, hx⟩ : A.domain) =
                    (⟨c • x, A.domain.smul_mem c hx⟩ : A.domain) := by
                apply Subtype.ext
                rfl
              have hMap := LinearPMap.map_smul A c (⟨x, hx⟩ : A.domain)
              rw [hSub] at hMap
              calc
                A ⟨c • x, A.domain.smul_mem c hx⟩ = c • A ⟨x, hx⟩ := hMap
                _ = c • (μ • x) := by rw [hAx]
                _ = μ • (c • x) := by simp only [smul_smul, mul_comm]

          example {μ : ℂ} (h : star μ = μ) : μ.im = 0 := by
            have hReal := congrArg Complex.im h
            change ((starRingEnd ℂ) μ).im = μ.im at hReal
            rw [Complex.conj_im] at hReal
            linarith

          example (μ ν z : ℂ)
              (h : (starRingEnd ℂ) μ * z = ν * z) :
              (star μ - ν) * z = 0 := by
            rw [sub_mul]
            change (starRingEnd ℂ) μ * z - ν * z = 0
            exact sub_eq_zero.mpr h

          example (A : H →ₗ.[ℂ] H) {μ : ℂ} {x : H}
              (hx : x ∈ A.domain) (hAx : A ⟨x, hx⟩ = μ • x) :
              (x, μ • x) ∈ A.graph := by
            let xd : A.domain := ⟨x, hx⟩
            have hRaw := A.mem_graph xd
            change (x, A ⟨x, hx⟩) ∈ A.graph at hRaw
            rw [hAx] at hRaw
            exact hRaw

          example (μ : ℂ) (x : H) (m : ℝ) :
              μ.re * (inner ℂ x x).re + (inner ℂ x x).re * m - μ.im * (inner ℂ x x).im =
                μ.re * ‖x‖ ^ 2 + m * ‖x‖ ^ 2 := by
            have hRe : (inner ℂ x x).re = ‖x‖ ^ 2 := by
              symm
              exact norm_sq_eq_re_inner (𝕜 := ℂ) x
            have hIm : (inner ℂ x x).im = 0 := by
              exact inner_self_im (𝕜 := ℂ) x
            rw [hRe, hIm]
            ring

          example (U R L LR RL : H) (k : ℝ)
              (hPair : inner ℂ U LR + (k : ℂ) * inner ℂ U U = inner ℂ U RL)
              (hRaise : inner ℂ R R = - inner ℂ U LR)
              (hLower : inner ℂ RL U = - inner ℂ L L) :
              ‖R‖ ^ 2 - ‖L‖ ^ 2 = k * ‖U‖ ^ 2 := by
            have hPairRe := congrArg Complex.re hPair
            have hRaiseRe := congrArg Complex.re hRaise
            have hLowerRe := congrArg Complex.re hLower
            have hSymm : (inner ℂ U RL).re = (inner ℂ RL U).re :=
              inner_re_symm (𝕜 := ℂ) U RL
            have hNormU := norm_sq_eq_re_inner (𝕜 := ℂ) U
            have hNormR := norm_sq_eq_re_inner (𝕜 := ℂ) R
            have hNormL := norm_sq_eq_re_inner (𝕜 := ℂ) L
            change ‖U‖ ^ 2 = (inner ℂ U U).re at hNormU
            change ‖R‖ ^ 2 = (inner ℂ R R).re at hNormR
            change ‖L‖ ^ 2 = (inner ℂ L L).re at hNormL
            simp only [Complex.add_re, Complex.mul_re, Complex.ofReal_re,
              Complex.ofReal_im, zero_mul, sub_zero, Complex.neg_re] at hPairRe hRaiseRe hLowerRe
            rw [hSymm] at hPairRe
            rw [← hNormU] at hPairRe
            rw [← hNormR] at hRaiseRe
            rw [← hNormL] at hLowerRe
            linarith

          example {E : Type*} [NormedAddCommGroup E] [TopologicalSpace E]
              (f : E → E) (hf : DenseRange f) : Dense (Set.range f) := by
            simpa only [DenseRange] using hf

          example (S : Submodule ℂ (H × H)) {a b : H × H}
              (ha : a ∈ S) (hb : b ∈ S) : a - b ∈ S := by
            exact S.sub_mem ha hb
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeP9Proofs.lean 2>&1 | tee /tmp/probe-p9-proofs.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe-p9-proofs.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-p9-joint-proofs-v4-${{ github.sha }}
          path: |
            /tmp/ProbeP9Proofs.lean
            /tmp/probe-p9-proofs.log
            /tmp/probe-p9-proofs.exit
          retention-days: 30
