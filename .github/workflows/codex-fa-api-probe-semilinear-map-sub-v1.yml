name: Codex FA predecessor theorem-function transport v2
# trigger: predecessor-function-transport-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile predecessor theorem-function transport shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePredFunction.lean <<'LEAN'
          import Mathlib

          variable (F : ℤ → Type*)
          variable (P : (n : ℤ) → F n → Prop)
          variable (Q : (n : ℤ) → F n → F n → Prop)

          example (n : ℤ) (v : F n)
              (hSucc : ∀ k : ℤ, ∀ w : F (k + 1), P (k + 1) w) :
              P n v := by
            have hs := hSucc (n - 1)
            simp only [sub_add_cancel] at hs
            exact hs v

          example (n : ℤ) (v u : F n)
              (hSucc : ∀ k : ℤ, ∀ a b : F (k + 1), Q (k + 1) a b) :
              Q n v u := by
            have hs := hSucc (n - 1)
            simp only [sub_add_cancel] at hs
            exact hs v u

          example (n : ℤ) (v u : F n)
              (hSucc : ∀ k : ℤ, ∀ a b : F (k + 1), Q (k + 1) a b) :
              Q n v u := by
            simpa only [sub_add_cancel] using (hSucc (n - 1) : ∀ a b, Q (n - 1 + 1) a b) v u
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePredFunction.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-predecessor-function-transport-v2-${{ github.sha }}
          path: |
            /tmp/ProbePredFunction.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
