name: Codex FA probe P9 spectral LinearPMap APIs v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile P9 API signature probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP9Apis.lean <<'LEAN'
          import Mathlib

          open Set Function
          open scoped LinearPMap

          #check LinearPMap.map_zero
          #check LinearPMap.map_add
          #check LinearPMap.map_smul
          #check LinearPMap.mem_graph_iff
          #check Submodule.sub_mem
          #check Complex.conj_im
          #check starRingEnd
          #check starRingEnd_apply
          #check norm_sq_eq_re_inner

          variable {H : Type*} [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          example (μ : ℂ) : star μ = (starRingEnd ℂ) μ := by
            rfl

          example (x : H) : (inner ℂ x x).im = 0 := by
            exact inner_self_im x

          example (x : H) : (inner ℂ x x).re = ‖x‖ ^ 2 := by
            symm
            exact norm_sq_eq_re_inner (𝕜 := ℂ) x
          LEAN
          set +e
          lake env lean -DmaxErrors=50 -DwarningAsError=false /tmp/ProbeP9Apis.lean 2>&1 | tee /tmp/probe-p9-apis.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe-p9-apis.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-p9-apis-v1-${{ github.sha }}
          path: |
            /tmp/ProbeP9Apis.lean
            /tmp/probe-p9-apis.log
            /tmp/probe-p9-apis.exit
          retention-days: 30
