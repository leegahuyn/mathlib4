name: Codex FA P5 three-term square bounds algebra probe
# trigger: p5-three-term-square-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile square-bound algebra shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeP5Square.lean <<'LEAN'
          import Mathlib

          example (N R L d F : ℝ)
              (hN : 0 ≤ N) (hR : 0 ≤ R) (hL : 0 ≤ L)
              (hd : 0 ≤ d) (hF : 0 ≤ F)
              (hpoint : N ≤ (R + L + d * F) / 2) :
              N ^ 2 ≤ (3 / 4 : ℝ) * (R ^ 2 + L ^ 2 + d ^ 2 * F ^ 2) := by
            have hsum : (R + L + d * F) ^ 2 ≤
                3 * (R ^ 2 + L ^ 2 + (d * F) ^ 2) := by
              nlinarith [sq_nonneg (R - L), sq_nonneg (R - d * F),
                sq_nonneg (L - d * F)]
            have hS : 0 ≤ R + L + d * F := by
              nlinarith [mul_nonneg hd hF]
            have hsq : N ^ 2 ≤ ((R + L + d * F) / 2) ^ 2 := by
              nlinarith [sq_nonneg (N - (R + L + d * F) / 2)]
            nlinarith

          example (N R L F : ℝ)
              (hN : 0 ≤ N) (hR : 0 ≤ R) (hL : 0 ≤ L) (hF : 0 ≤ F)
              (hpoint : N ≤ (R + L) / 2 + F) :
              N ^ 2 ≤ (3 / 4 : ℝ) * (R ^ 2 + L ^ 2 + 4 * F ^ 2) := by
            have hsum : (R + L + 2 * F) ^ 2 ≤
                3 * (R ^ 2 + L ^ 2 + (2 * F) ^ 2) := by
              nlinarith [sq_nonneg (R - L), sq_nonneg (R - 2 * F),
                sq_nonneg (L - 2 * F)]
            have hS : 0 ≤ R + L + 2 * F := by nlinarith
            have hp : N ≤ (R + L + 2 * F) / 2 := by linarith
            have hsq : N ^ 2 ≤ ((R + L + 2 * F) / 2) ^ 2 := by
              nlinarith [sq_nonneg (N - (R + L + 2 * F) / 2)]
            nlinarith
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeP5Square.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-p5-three-term-square-${{ github.sha }}
          path: |
            /tmp/ProbeP5Square.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
