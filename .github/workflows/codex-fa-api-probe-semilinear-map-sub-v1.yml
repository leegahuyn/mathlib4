name: Codex FA predecessor index transport probe
# trigger: predecessor-index-transport-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile predecessor index transport shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePredIndex.lean <<'LEAN'
          import Mathlib

          variable (F : ℤ → Type*)
          variable (P : (n : ℤ) → F n → Prop)

          example (n : ℤ) (v : F n)
              (hSucc : ∀ k : ℤ, ∀ w : F (k + 1), P (k + 1) w) :
              P n v := by
            have v' : F ((n - 1) + 1) := by
              simpa only [sub_add_cancel] using v
            have h := hSucc (n - 1) v'
            simpa only [sub_add_cancel] using h

          variable (G : (n : ℤ) → F n → ℤ)

          example (n : ℤ) (v : F n)
              (hSucc : ∀ k : ℤ, ∀ w : F (k + 1), G (k + 1) w = G (k + 1) w) :
              G n v = G n v := by
            have v' : F ((n - 1) + 1) := by
              simpa only [sub_add_cancel] using v
            have h := hSucc (n - 1) v'
            simpa only [sub_add_cancel] using h
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePredIndex.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-predecessor-index-transport-${{ github.sha }}
          path: |
            /tmp/ProbePredIndex.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
