name: Codex FA ambient coercion and separation proof shapes
# trigger: ambient-sub-coercion-separation-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-semilinear-map-sub-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile proof-shape probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeAmbientSub.lean <<'LEAN'
          import Mathlib

          noncomputable section

          abbrev F := ℂ → ℂ
          def P1 : Submodule ℂ F := ⊤
          abbrev E := P1
          def P2 : Submodule ℂ E := ⊤
          abbrev Core := P2

          noncomputable local instance coreModule : Module ℂ Core := by
            change Module ℂ ↥P2
            exact Submodule.module P2
          noncomputable local instance coreAddCommGroup : AddCommGroup Core := by
            exact Module.addCommMonoidToAddCommGroup ℂ

          example (u a b : Core) :
              (((Sub.sub (Sub.sub u a) b : Core) : E) : F) =
                (((u : E) : F) - ((a : E) : F) - ((b : E) : F)) := by
            rfl

          example (u a b : Core) (z : ℂ) :
              ((((Sub.sub (Sub.sub u a) b : Core) : E) : F) z) =
                (((u : E) : F) z - ((a : E) : F) z - ((b : E) : F) z) := by
            rfl

          example (u a : Core) (t z : ℂ) :
              ((((Sub.sub u (t • a) : Core) : E) : F) z) =
                (((u : E) : F) z - t * ((a : E) : F) z) := by
            rfl

          variable {H : Type*} [NormedAddCommGroup H] [InnerProductSpace ℂ H]

          example (G Q : H)
              (hG : inner ℂ G G = inner ℂ G Q)
              (hQ : inner ℂ Q G = inner ℂ Q Q) :
              G = Q := by
            have hSelf : inner ℂ (G - Q) (G - Q) = 0 := by
              rw [inner_sub_left, inner_sub_right, inner_sub_right, hG, hQ]
              ring
            exact sub_eq_zero.mp ((inner_self_eq_zero (𝕜 := ℂ)).mp hSelf)
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeAmbientSub.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-ambient-sub-separation-${{ github.sha }}
          path: |
            /tmp/ProbeAmbientSub.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
