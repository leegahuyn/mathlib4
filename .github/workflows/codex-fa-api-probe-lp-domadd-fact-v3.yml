name: Codex FA API probe Lp DomAdd Fact v3
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-lp-domadd-fact-v3.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail; curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh; sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1; export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1; lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe explicit-basepoint L2 translation Tendsto
        shell: bash
        run: |
          set -euo pipefail; export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeLpDomAddFact3.lean <<'LEAN'
          import Mathlib
          open Topology Filter MeasureTheory
          open scoped ENNReal
          noncomputable abbrev AmbientPlaneL2Probe := MeasureTheory.Lp ℂ 2 (volume : Measure ℂ)

          example (f : AmbientPlaneL2Probe) :
              Tendsto (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) (nhds 0) (nhds f) := by
            letI : Fact ((2 : ℝ≥0∞) ≠ ∞) := ⟨by norm_num⟩
            have hm : Continuous (fun t : ℂ ↦ (DomAddAct.mk t, f)) :=
              DomAddAct.continuous_mk.prodMk continuous_const
            have h : Continuous (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) :=
              continuous_vadd.comp hm
            have h0 : ContinuousAt (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) 0 := h.continuousAt
            simpa using h0

          example (f : AmbientPlaneL2Probe) :
              Tendsto (fun t : ℂ ↦ ‖DomAddAct.mk t +ᵥ f - f‖) (nhds 0) (nhds 0) := by
            letI : Fact ((2 : ℝ≥0∞) ≠ ∞) := ⟨by norm_num⟩
            have hm : Continuous (fun t : ℂ ↦ (DomAddAct.mk t, f)) :=
              DomAddAct.continuous_mk.prodMk continuous_const
            have h : Continuous (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) :=
              continuous_vadd.comp hm
            have ht : Tendsto (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) (nhds 0) (nhds f) := by
              have h0 : ContinuousAt (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f) 0 := h.continuousAt
              simpa using h0
            have hs : Tendsto (fun t : ℂ ↦ DomAddAct.mk t +ᵥ f - f) (nhds 0) (nhds 0) := by
              simpa using ht.sub_const f
            exact tendsto_norm.comp hs
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeLpDomAddFact3.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with: {name: "codex-fa-api-probe-lp-domadd-fact-v3-${{ github.sha }}", path: /tmp/probe.log, retention-days: 7, if-no-files-found: warn}
