name: Final isolated PASS 339 FunctionalAnalysis Ubuntu

on:
  push:
    branches: [fix/fa339-final-isolated-20260808]
    paths:
      - '.github/workflows/final-isolated-pass339-fa-ubuntu.yml'
      - 'scripts/diagnose_pass339_fa.sh'
      - 'scripts/apply_three_hundred_thirty_ninth_pass_functional_analysis_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: final-isolated-fa-diagnostic-ubuntu
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact isolated head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 192
          persist-credentials: true

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass339-fa/logs
          lean --version | tee /tmp/diagnose-pass339-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass339-fa/lake-version.txt
          sha256sum --version | head -1 | tee /tmp/diagnose-pass339-fa/sha256sum-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass339-fa/logs/cache-get.log

      - name: Reconstruct and compile PASS 339 FA
        id: diagnostic
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass339_fa.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload Ubuntu PASS 339 diagnostic
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-isolated-pass339-fa-ubuntu-${{ github.sha }}
          path: /tmp/diagnose-pass339-fa
          if-no-files-found: error
          retention-days: 90

      - name: Publish concise Ubuntu result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          set -euo pipefail
          evidence='/tmp/diagnose-pass339-fa'
          mkdir -p build-logs
          report='build-logs/final-isolated-fa-ubuntu-latest.txt'
          {
            echo "run_id=${GITHUB_RUN_ID}"
            echo "run_attempt=${GITHUB_RUN_ATTEMPT}"
            echo "tested_sha=${GITHUB_SHA}"
            echo "diagnostic_exit_code=${DIAGNOSTIC_EXIT_CODE:-missing}"
            echo "utc=$(date -u +%FT%TZ)"
            echo
            echo '--- summary ---'
            if [[ -f "${evidence}/summary.txt" ]]; then cat "${evidence}/summary.txt"; else echo 'summary missing'; fi
            echo
            echo '--- repair hashes (tail) ---'
            if [[ -f "${evidence}/repair-source-sha256.csv" ]]; then tail -18 "${evidence}/repair-source-sha256.csv"; fi
            echo
            echo '--- failure summary ---'
            if [[ -f "${evidence}/logs/failure-summary.txt" ]]; then head -420 "${evidence}/logs/failure-summary.txt"; else echo 'failure summary missing'; fi
          } > "${report}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${report}"
          git diff --cached --quiet || git commit -m 'ci: record isolated FA Ubuntu diagnostic result'
          git push origin "HEAD:fix/fa339-final-isolated-20260808"

      - name: Enforce PASS 339 result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          test -n "${DIAGNOSTIC_EXIT_CODE:-}"
          exit "${DIAGNOSTIC_EXIT_CODE}"
