name: Codex QYM structural quotient bridge compile probe

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/codex-qym-structural-bridge-compile-probe.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: codex-qym-structural-bridge-compile-probe-${{ github.ref }}
  cancel-in-progress: false

jobs:
  qym-structural-bridge-compile-probe:
    name: exact Probe15 environment and structural bridge compile
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      EXPECTED_INSTALL_PARENT: a8493d7dc4c96952743223eb52eca57da4f6f482
      EXPECTED_WORKFLOW_PATH: .github/workflows/codex-qym-structural-bridge-compile-probe.yml
      PROBE15_HEAD: 1679e9e9f916e95d5a4fe10f9e59502471c84191
      EXPECTED_TOOLCHAIN_SHA256: 62c2d9c0fc1ec4c67e151c11eff41ca004ef38e179cf9476c230406e6defedef
      EXPECTED_TOOLCHAIN_BLOB: fd85b262bf1c734663aa8292b0101f672168788f
      EXPECTED_LAKE_MANIFEST_BLOB: 71d2d1d50d8f0ca3d99347e6f2f00c54038b0e25
      EXPECTED_LAKEFILE_BLOB: 2afc2a7a30308ade4ea00e21966faa37232dd4dc
      EXPECTED_PROJECT_CACHE_KEY: qym-probe4-deps-v1-Linux-ecb9f60364b1d72200c847f9ae46918f12c8b6d05363c23cca5d361c92ea45d4
      EXPECTED_M2_SHA256: 36a034721c389888b2c235d856753e5f2e38f9f6a258fddabbb70fe751ae3594
      EXPECTED_M2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_M2A_SHA256: cf44063abca1d5b47331a9001a3cff45a86b5e889865812fe4e7826c6af41526
      EXPECTED_M2A_BLOB: a60fa47ebcd8c1fb6037d705e81b54c80910657a
      EXPECTED_FA_SHA256: c680a35b9f12ea3223d8328ed0f5f0674b3439e650bb62cb900b54917f9653bd
      EXPECTED_FA_BLOB: 28f614d48e02a0f28d3f5a758e813350b3ea89cf
      EXPECTED_INTEGRATED_SHA256: a77f9e67980ec35b0d7b4d1624c10ec68051f575468d3b74859e6cf30e3e0439
      EXPECTED_INTEGRATED_BLOB: 464f5dd095876b20165d12690c8127ef9d909e6a
      EXPECTED_CORE_SHA256: 060f3b3d07020dee0a4793ac4fe53615d40f45b65bd87b60abea7354e9844453
      EXPECTED_CORE_BLOB: 2e8d0a1801950c3888805d0cf5d5f73ea14d3f80
      EXPECTED_CORE_BYTES: '5861'
      EXPECTED_CORE_LF: '161'
      CORE_ZLIB_B64: 
      EXPECTED_BRIDGE_SHA256: a44e9174664dac4940d9b19551d8b57dcd1dc8289712f69d961fd01c6d532a6c
      EXPECTED_BRIDGE_BLOB: 12aaf5a92fe5e2687c7315de8615e7103b170767
      EXPECTED_BRIDGE_BYTES: '6581'
      EXPECTED_BRIDGE_LF: '146'
      BRIDGE_ZLIB_B64: 
      ELAN_RELEASE: v4.2.3
      ELAN_ARCHIVE_SHA256: df0b2b3a439961ffcbb3985214365ffe40f49bc871df04dff268c7d8e21ca8b2
      ELAN_ARCHIVE_BYTES: '4984019'
      EXPECTED_LEAN_VERSION: Lean (version 4.33.0-rc1, x86_64-unknown-linux-gnu, commit 62eed1db4d67327ec8120be05f1a1b0847d74561, Release)
      M2_SOURCE: PrimalitySheafVerification/Mock2.lean
      M2A_SOURCE: PrimalitySheafVerification/Mock2_Advanced.lean
      FA_SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED_SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      PYTHONDONTWRITEBYTECODE: '1'

    steps:
      - name: Check out exact triggering commit
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2
          persist-credentials: false

      - name: Bind runner-temp paths
        id: paths
        shell: bash
        run: |
          set -euo pipefail
          test -n "${RUNNER_TEMP:-}" && test -n "${GITHUB_ENV:-}"
          case "$RUNNER_TEMP" in /*) ;; *) exit 91 ;; esac
          out="$RUNNER_TEMP/qym-structural-bridge-compile-probe"
          probe_repo="$RUNNER_TEMP/qym-structural-bridge-repo"
          probe_root="$RUNNER_TEMP/qym-structural-bridge-input"
          elan_home="$RUNNER_TEMP/qym-structural-bridge-elan"
          xdg_cache_home="$RUNNER_TEMP/qym-structural-bridge-xdg-cache"
          for target in "$out" "$probe_repo" "$probe_root" "$elan_home" "$xdg_cache_home"; do
            case "$target" in "$RUNNER_TEMP"/*) ;; *) exit 92 ;; esac
          done
          {
            printf 'OUT=%s\n' "$out"
            printf 'PROBE_REPO=%s\n' "$probe_repo"
            printf 'PROBE_ROOT=%s\n' "$probe_root"
            printf 'ELAN_HOME=%s\n' "$elan_home"
            printf 'XDG_CACHE_HOME=%s\n' "$xdg_cache_home"
          } >> "$GITHUB_ENV"

      - name: Gate sentinel, branch, current commit, parent, and add-only delta
        id: gate
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          if [[ ! "$EXPECTED_INSTALL_PARENT" =~ ^[0-9a-f]{40}$ ]]; then
            printf 'NON-INSTALLABLE: rebind terminal Probe16 SHA; found %s\n' \
              "$EXPECTED_INSTALL_PARENT" > "$OUT/PRECONDITION.txt"
            exit 78
          fi
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          read -r -a parents <<< "$(git rev-list --parents -n 1 HEAD)"
          test "${#parents[@]}" -eq 2
          test "${parents[1]}" = "$EXPECTED_INSTALL_PARENT"
          git diff-tree --no-commit-id --name-status -r HEAD^ HEAD | LC_ALL=C sort > "$OUT/delta.actual"
          printf 'M\t%s\n' "$EXPECTED_WORKFLOW_PATH" > "$OUT/delta.expected"
          cmp "$OUT/delta.expected" "$OUT/delta.actual"
          test "$(sha256sum lean-toolchain | awk '{print $1}')" = "$EXPECTED_TOOLCHAIN_SHA256"
          test "$(git hash-object --no-filters lean-toolchain)" = "$EXPECTED_TOOLCHAIN_BLOB"
          test "$(git hash-object --no-filters lake-manifest.json)" = "$EXPECTED_LAKE_MANIFEST_BLOB"
          test "$(git hash-object --no-filters lakefile.lean)" = "$EXPECTED_LAKEFILE_BLOB"
          for spec in \
            "$M2_SOURCE:$EXPECTED_M2_SHA256:$EXPECTED_M2_BLOB" \
            "$M2A_SOURCE:$EXPECTED_M2A_SHA256:$EXPECTED_M2A_BLOB" \
            "$FA_SOURCE:$EXPECTED_FA_SHA256:$EXPECTED_FA_BLOB" \
            "$INTEGRATED_SOURCE:$EXPECTED_INTEGRATED_SHA256:$EXPECTED_INTEGRATED_BLOB"; do
            IFS=: read -r path sha blob <<< "$spec"
            test "$(sha256sum "$path" | awk '{print $1}')" = "$sha"
            test "$(git hash-object --no-filters "$path")" = "$blob"
          done
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.before.txt"
          test ! -s "$OUT/git-status.before.txt"
          printf 'github_sha=%s\ninstall_parent=%s\nprobe15_environment_head=%s\n' \
            "$GITHUB_SHA" "$EXPECTED_INSTALL_PARENT" "$PROBE15_HEAD" > "$OUT/commit-gate.txt"

      - name: Look up exact Probe15 dependency cache without restoring it
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          lookup-only: true
          fail-on-cache-miss: true

      - name: Run exact temp-only bridge probe
        id: probe
        shell: bash
        env:
          CACHE_HIT: ${{ steps.project-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.project-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.project-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_PRIMARY_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          test "$CACHE_MATCHED_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          printf 'hit=%s\nprimary=%s\nmatched=%s\nlookup_only=true\n' \
            "$CACHE_HIT" "$CACHE_PRIMARY_KEY" "$CACHE_MATCHED_KEY" > "$OUT/cache-audit.txt"
          test ! -e "$PROBE_REPO" && test ! -e "$PROBE_ROOT"
          mkdir -p "$PROBE_REPO" "$PROBE_ROOT"
          git archive --format=tar HEAD | tar -xf - -C "$PROBE_REPO"
          python3 - "$PROBE_ROOT" "$OUT/INPUT_RESULT.json" <<'PY'
          import base64, hashlib, json, os, re, sys, zlib
          from pathlib import Path
          root = Path(sys.argv[1]); rows = []
          specs = (
              ('core', 'QYMStructuralBridgeCore.lean', 'CORE_ZLIB_B64', 'EXPECTED_CORE_SHA256',
               'EXPECTED_CORE_BLOB', 'EXPECTED_CORE_BYTES', 'EXPECTED_CORE_LF'),
              ('bridge', 'QYMStructuralBridge.lean', 'BRIDGE_ZLIB_B64', 'EXPECTED_BRIDGE_SHA256',
               'EXPECTED_BRIDGE_BLOB', 'EXPECTED_BRIDGE_BYTES', 'EXPECTED_BRIDGE_LF'))
          for label, name, payload, sha, blob, size, lf in specs:
              raw = zlib.decompress(base64.b64decode(os.environ[payload], validate=True))
              git_blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              text = raw.decode('utf-8')
              trust = {k: len(re.findall(p, text)) for k, p in {
                  'sorry': r'\bsorry\b', 'admit': r'\badmit\b',
                  'native_decide': r'\bnative_decide\b', 'axiom': r'(?m)^\s*axiom\s+',
                  'unsafe': r'(?m)^\s*unsafe\s+',
                  'maxHeartbeats_zero': r'set_option\s+maxHeartbeats\s+0\b'}.items()}
              assert hashlib.sha256(raw).hexdigest() == os.environ[sha]
              assert git_blob == os.environ[blob]
              assert len(raw) == int(os.environ[size]) and raw.count(b'\n') == int(os.environ[lf])
              assert b'\r' not in raw and raw.endswith(b'\n') and not any(trust.values())
              (root / name).write_bytes(raw)
              rows.append({'label': label, 'file': name, 'sha256': os.environ[sha],
                           'git_blob': git_blob, 'bytes': len(raw), 'lf': raw.count(b'\n'),
                           'trust': trust})
          Path(sys.argv[2]).write_text(json.dumps(
              {'schema': 'qym-structural-bridge-input-v1', 'files': rows},
              indent=2, sort_keys=True) + '\n', encoding='utf-8')
          PY
          sha256sum "$PROBE_ROOT/QYMStructuralBridgeCore.lean" \
            "$PROBE_ROOT/QYMStructuralBridge.lean" > "$OUT/bridge-inputs.sha256"
          archive="$RUNNER_TEMP/elan-${ELAN_RELEASE}-x86_64-unknown-linux-gnu.tar.gz"
          installer="$RUNNER_TEMP/elan-${ELAN_RELEASE}-installer"
          test ! -e "$archive" && test ! -e "$installer"
          curl --retry 5 --retry-all-errors --fail --silent --show-error --location \
            "https://github.com/leanprover/elan/releases/download/${ELAN_RELEASE}/elan-x86_64-unknown-linux-gnu.tar.gz" \
            -o "$archive"
          test "$(stat -c '%s' "$archive")" = "$ELAN_ARCHIVE_BYTES"
          test "$(sha256sum "$archive" | awk '{print $1}')" = "$ELAN_ARCHIVE_SHA256"
          mkdir -p "$installer" "$XDG_CACHE_HOME"
          tar -xzf "$archive" -C "$installer"
          test -x "$installer/elan-init"
          "$installer/elan-init" -y --default-toolchain none --no-modify-path > "$OUT/elan.log" 2>&1
          export PATH="$ELAN_HOME/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < "$PROBE_REPO/lean-toolchain")" > "$OUT/toolchain.log" 2>&1
          cd "$PROBE_REPO"
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          elan --version | tee "$OUT/elan-version.txt"
          grep -F 'elan 4.2.3' "$OUT/elan-version.txt"
          lean --version | tee "$OUT/lean-version.txt"
          test "$(cat "$OUT/lean-version.txt")" = "$EXPECTED_LEAN_VERSION"
          lake --version | tee "$OUT/lake-version.txt"
          OLEAN_ROOT="$PROBE_REPO/.lake/build/lib/lean/PrimalitySheafVerification"
          case "$OLEAN_ROOT" in "$RUNNER_TEMP"/*) ;; *) exit 90 ;; esac
          mkdir -p "$OLEAN_ROOT"
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            cap=1
            [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
            olean="$OLEAN_ROOT/$stem.olean"; ilean="$OLEAN_ROOT/$stem.ilean"
            rm -f -- "$olean" "$ilean"
            /usr/bin/time -v -o "$OUT/$stem.time" lake env lean "-DmaxErrors=$cap" \
              -DwarningAsError=false -o "$olean" -i "$ilean" \
              "PrimalitySheafVerification/$stem.lean" > "$OUT/$stem.log" 2>&1
            test -s "$olean" && test -s "$ilean"
          done
          sha256sum "$OLEAN_ROOT"/*.olean "$OLEAN_ROOT"/*.ilean > "$OUT/dependency-outputs.sha256"
          run_probe() {
            local label="$1" source="$2" olean="$PROBE_ROOT/$1.olean" ilean="$PROBE_ROOT/$1.ilean"
            printf '%q ' lake env lean "--root=$PROBE_ROOT" -DmaxErrors=30 \
              -DwarningAsError=false -o "$olean" -i "$ilean" "$source" > "$OUT/$label.command"
            printf '\n' >> "$OUT/$label.command"
            set +e
            /usr/bin/time -v -o "$OUT/$label.time" lake env lean "--root=$PROBE_ROOT" \
              -DmaxErrors=30 -DwarningAsError=false -o "$olean" -i "$ilean" "$source" \
              > "$OUT/$label.log" 2>&1
            local rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/$label.exit"
            if [[ "$rc" -eq 0 && -s "$olean" && -s "$ilean" ]]; then
              sha256sum "$olean" "$ilean" > "$OUT/$label.outputs.sha256"
            fi
            return 0
          }
          run_probe QYMStructuralBridgeCore "$PROBE_ROOT/QYMStructuralBridgeCore.lean"
          run_probe QYMStructuralBridge "$PROBE_ROOT/QYMStructuralBridge.lean"
          python3 - "$OUT" "$PROBE_ROOT" <<'PY'
          import hashlib, json, os, re, sys
          from pathlib import Path
          out, root = map(Path, sys.argv[1:]); probes = []
          for label in ('QYMStructuralBridgeCore', 'QYMStructuralBridge'):
              raw = (out / f'{label}.log').read_bytes()
              text = raw.decode('utf-8', errors='replace')
              errors = len(re.findall(r'(?m)^.*\.lean:\d+:\d+: error(?:\([^)]*\))?:', text))
              panics = re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
              rc = int((out / f'{label}.exit').read_text().strip()); outputs = {}
              for suffix in ('olean', 'ilean'):
                  path = root / f'{label}.{suffix}'
                  if path.is_file() and path.stat().st_size:
                      data = path.read_bytes(); outputs[suffix] = {
                          'bytes': len(data), 'sha256': hashlib.sha256(data).hexdigest()}
              (out / f'{label}.panic-lines.txt').write_text(
                  ''.join(x + '\n' for x in panics), encoding='utf-8')
              probes.append({'label': label, 'exit': rc, 'errors': errors,
                  'panic_lines': len(panics), 'log_sha256': hashlib.sha256(raw).hexdigest(),
                  'outputs': outputs, 'semantic_pass': rc == 0 and errors == 0 and not panics
                  and set(outputs) == {'olean', 'ilean'}})
          result = {'schema': 'qym-structural-bridge-compile-probe-v1',
              'github_sha': os.environ['GITHUB_SHA'],
              'install_parent_sha': os.environ['EXPECTED_INSTALL_PARENT'],
              'probe15_environment_head': os.environ['PROBE15_HEAD'],
              'toolchain_sha256': os.environ['EXPECTED_TOOLCHAIN_SHA256'],
              'project_cache_key': os.environ['EXPECTED_PROJECT_CACHE_KEY'],
              'probes': probes, 'semantic_pass': all(x['semantic_pass'] for x in probes)}
          (out / 'PROBE_RESULT.json').write_text(
              json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY

      - name: Verify canonical checkout stayed byte-clean
        id: pristine
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          git diff --exit-code -- . > "$OUT/git-diff.after.txt"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.after.txt"
          test ! -s "$OUT/git-diff.after.txt" && test ! -s "$OUT/git-status.after.txt"

      - name: Upload immutable bridge evidence
        id: upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-structural-bridge-compile-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qym-structural-bridge-compile-probe/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed on every gate and both Lean compiles
        if: always()
        shell: bash
        env:
          CHECKOUT_OUTCOME: ${{ steps.checkout.outcome }}
          PATHS_OUTCOME: ${{ steps.paths.outcome }}
          GATE_OUTCOME: ${{ steps.gate.outcome }}
          CACHE_OUTCOME: ${{ steps.project-cache.outcome }}
          PROBE_OUTCOME: ${{ steps.probe.outcome }}
          PRISTINE_OUTCOME: ${{ steps.pristine.outcome }}
          UPLOAD_OUTCOME: ${{ steps.upload.outcome }}
        run: |
          set -euo pipefail
          python3 - "$OUT/INPUT_RESULT.json" "$OUT/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          names = ('CHECKOUT_OUTCOME', 'PATHS_OUTCOME', 'GATE_OUTCOME',
                   'CACHE_OUTCOME', 'PROBE_OUTCOME', 'PRISTINE_OUTCOME',
                   'UPLOAD_OUTCOME')
          outcomes = {name: os.environ[name] for name in names}
          assert all(value == 'success' for value in outcomes.values()), outcomes
          inputs, result = (json.load(open(path, encoding='utf-8')) for path in sys.argv[1:])
          assert inputs['schema'] == 'qym-structural-bridge-input-v1'
          assert len(inputs['files']) == 2
          assert not any(any(row['trust'].values()) for row in inputs['files'])
          assert result['schema'] == 'qym-structural-bridge-compile-probe-v1'
          assert result['github_sha'] == os.environ['GITHUB_SHA']
          assert result['install_parent_sha'] == os.environ['EXPECTED_INSTALL_PARENT']
          assert result['project_cache_key'] == os.environ['EXPECTED_PROJECT_CACHE_KEY']
          assert [row['label'] for row in result['probes']] == [
              'QYMStructuralBridgeCore', 'QYMStructuralBridge']
          assert result['semantic_pass'] is True
          PY