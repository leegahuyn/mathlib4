name: PASS 383 watch verified FA Mock3 QYM marker and promote to PR9

on:
  push:
    branches: [fix/fa383-marker-watcher-20260809]
    paths:
      - '.github/workflows/pass383-marker-watcher.yml'
      - 'scripts/pass383_marker_watcher.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass383-marker-watcher
  cancel-in-progress: false

jobs:
  watch-and-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      WATCH_SECONDS: '19000'
      POLL_SECONDS: '60'
    steps:
      - name: Checkout watcher branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and shared cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Poll candidate branches and independently promote only a two-round PASS
        id: watcher
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass383_marker_watcher.py \
            > /tmp/pass383-marker-watcher-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass383-marker-watcher-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload watcher, revalidation, and promotion evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass383-marker-watcher-${{ github.sha }}
          path: |
            /tmp/pass383-marker-watcher
            /tmp/pass383-marker-watcher-driver.log
            build-logs/PASS383_PROMOTED_TO_PR9.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce independently verified PR9 promotion
        if: always()
        shell: bash
        env:
          WATCHER_EXIT: ${{ steps.watcher.outputs.exit_code }}
        run: |
          test "${WATCHER_EXIT:-1}" = '0'
          test -s build-logs/PASS383_PROMOTED_TO_PR9.json
