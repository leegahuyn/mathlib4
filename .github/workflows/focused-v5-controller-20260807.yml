name: Phased focused v5 controller

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-v5-controller-20260807.yml'
      - 'scripts/focused_v5_controller_20260807.py'
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: phased-focused-v5-controller
  cancel-in-progress: true

jobs:
  control:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Clone controller snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          python3 -m py_compile scripts/focused_v5_controller_20260807.py

      - name: Drive the strict phased verification chain
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 scripts/focused_v5_controller_20260807.py
