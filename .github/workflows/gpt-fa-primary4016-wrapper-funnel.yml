name: GPT FA primary4016 structural wrapper funnel

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-fa-primary4016-wrapper-funnel.yml
      - PrimalitySheafVerification/FA_Blocker_WrapperCandidates/**
      - scripts/fa_primary4016_statement_probe.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-fa-primary4016-wrapper-${{ github.ref }}
  cancel-in-progress: true

jobs:
  wrapper-funnel:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      OUT: build-logs/gpt-fa-primary4016-wrapper
      SOURCE: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      EXPECTED_BASE_SHA256: 1c3d12594a3e8b14f9cf7b7294da7c29221758c72d00a596215198f7623fad8c
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      ARTIFACT_DIR: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact takeover branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/fa-qym-clean-final-20260816
          fetch-depth: 1
          persist-credentials: false

      - name: Verify global-best source and generate exact prefix
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          mkdir -p "$OUT"
          test "$(sha256sum "$SOURCE" | awk '{print $1}')" = "$EXPECTED_BASE_SHA256"
          python3 scripts/fa_primary4016_statement_probe.py > "$OUT/PREFIX_GENERATION.json"
          python3 -m json.tool "$OUT/PREFIX_GENERATION.json" >/dev/null
          test -s PrimalitySheafVerification/FA_Blocker_Prefix.lean
          sha256sum "$SOURCE" PrimalitySheafVerification/FA_Blocker_Prefix.lean \
            | tee "$OUT/source-prefix.sha256"

      - name: Install exact pinned Lean and Mathlib cache
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = "leanprover/lean4:v4.33.0-rc1"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" \
            > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Direct-compile Mock2 and Mock2 Advanced
        run: |
          set -euo pipefail
          mkdir -p "$ARTIFACT_DIR"
          for module in Mock2 Mock2_Advanced; do
            src="PrimalitySheafVerification/${module}.lean"
            cmd="lake env lean -DmaxErrors=1 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${module}.command"
            set +e
            /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
              bash -lc "$cmd" > "$OUT/${module}.log" 2>&1
            rc=$?
            set -e
            printf '%s\n' "$rc" > "$OUT/${module}.exit"
            test "$rc" = 0
          done

      - name: Direct-compile exact blocker prefix
        run: |
          set -euo pipefail
          module=FA_Blocker_Prefix
          src="PrimalitySheafVerification/${module}.lean"
          cmd="lake env lean -DmaxErrors=100 -DwarningAsError=false -o ${ARTIFACT_DIR}/${module}.olean -i ${ARTIFACT_DIR}/${module}.ilean ${src}"
          printf '%s\n' "$cmd" > "$OUT/${module}.command"
          set +e
          /usr/bin/time -f 'elapsed_seconds=%e max_rss_kb=%M' -o "$OUT/${module}.time" \
            bash -lc "$cmd" > "$OUT/${module}.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/${module}.exit"
          grep -n ': error:' "$OUT/${module}.log" > "$OUT/${module}.error-headers.txt" || true
          test "$rc" = 0

      - name: Test structural wrapper candidates
        id: candidates
        run: |
          set -euo pipefail
          printf 'candidate_id,exit_code,error_headers,elapsed_seconds,source_sha256\n' \
            > "$OUT/candidate-summary.csv"
          selected=''
          for src in PrimalitySheafVerification/FA_Blocker_WrapperCandidates/Candidate*.lean; do
            base="$(basename "$src" .lean)"
            cid="${base#Candidate}"
            outdir="${ARTIFACT_DIR}/FA_Blocker_WrapperCandidates"
            mkdir -p "$outdir"
            cmd="lake env lean -DmaxErrors=50 -DwarningAsError=false -o ${outdir}/${base}.olean -i ${outdir}/${base}.ilean ${src}"
            printf '%s\n' "$cmd" > "$OUT/${base}.command"
            start="$(date +%s)"
            set +e
            timeout 420 bash -lc "$cmd" > "$OUT/${base}.log" 2>&1
            rc=$?
            set -e
            end="$(date +%s)"
            errors="$(grep -c ': error:' "$OUT/${base}.log" || true)"
            printf '%s\n' "$rc" > "$OUT/${base}.exit"
            grep -n ': error:' "$OUT/${base}.log" > "$OUT/${base}.error-headers.txt" || true
            printf '%s,%s,%s,%s,%s\n' "$cid" "$rc" "$errors" "$((end-start))" \
              "$(sha256sum "$src" | awk '{print $1}')" >> "$OUT/candidate-summary.csv"
            if [[ "$rc" == 0 && -z "$selected" ]]; then
              selected="$cid"
            fi
          done
          printf '%s\n' "$selected" | tee "$OUT/selected-local-candidate.txt"
          printf 'selected=%s\n' "$selected" >> "$GITHUB_OUTPUT"
          test -n "$selected"

      - name: Upload complete wrapper evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: gpt-fa-primary4016-wrapper-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: |
            build-logs/gpt-fa-primary4016-wrapper/**
            PrimalitySheafVerification/FA_Blocker_Prefix.lean
            PrimalitySheafVerification/FA_Blocker_WrapperCandidates/*.lean
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless a wrapper candidate directly passes
        if: always()
        run: |
          set -euo pipefail
          test "$(cat "$OUT/Mock2.exit")" = 0
          test "$(cat "$OUT/Mock2_Advanced.exit")" = 0
          test "$(cat "$OUT/FA_Blocker_Prefix.exit")" = 0
          test -s "$OUT/selected-local-candidate.txt"
