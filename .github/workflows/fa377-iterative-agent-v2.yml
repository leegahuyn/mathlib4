name: PASS 377 iterative FunctionalAnalysis agent v2

on:
  push:
    branches:
      - fix/fa377-agent-v2-20260809
    paths:
      - '.github/workflows/fa377-iterative-agent-v2.yml'
      - 'scripts/fa377_iterative_agent.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: fa377-iterative-agent-v2
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact v2 agent head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 950
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run guarded iterative repair in required order
        id: agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA_AGENT_MAX_ITERATIONS: '20'
          FA_AGENT_MAX_TOTAL_ITERATIONS: '240'
          FA_AGENT_MODELS: 'openai/gpt-5,openai/gpt-4.1,openai/gpt-4o'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa377_iterative_agent.py \
            > /tmp/fa377-agent-v2-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa377-agent-v2-console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Build concise persistent diagnosis
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          set -euo pipefail
          dir=build-logs/fa377-agent
          mkdir -p "${dir}"
          cp /tmp/fa377-agent-v2-console.log "${dir}/console.log"
          python3 - <<'PY'
          from pathlib import Path
          import json, re, hashlib
          d = Path('build-logs/fa377-agent')
          source = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          state = {}
          if (d / 'state.json').exists():
              state = json.loads((d / 'state.json').read_text(encoding='utf-8'))
          logs = sorted(d.glob('iteration-*.log'), key=lambda p: p.stat().st_mtime_ns)
          latest = logs[-1] if logs else (d / 'baseline.log')
          text = latest.read_text(encoding='utf-8', errors='replace') if latest.exists() else ''
          errors = re.findall(r'[^\n:]*Mock2_FunctionalAnalysis[^\n:]*\.lean:(\d+):(\d+):\s*error:', text)
          result_files = sorted(
              list(d.glob('iteration-*-result.txt')) + list(d.glob('iteration-*-exception.txt')),
              key=lambda p: p.stat().st_mtime_ns)
          summary = {
              'agent_exit_code': '${{ steps.agent.outputs.exit_code }}',
              'source_sha256': hashlib.sha256(source.read_bytes()).hexdigest(),
              'state': state,
              'latest_log': latest.name if latest.exists() else None,
              'error_headers': len(errors),
              'first_error_line': int(errors[0][0]) if errors else None,
              'latest_results': [
                  {'file': p.name, 'text': p.read_text(encoding='utf-8', errors='replace')[-4000:]}
                  for p in result_files[-6:]
              ],
              'all_required_targets_2x_pass': (d / 'ALL_REQUIRED_TARGETS_2X_PASS').exists(),
          }
          (d / 'persistent-summary.json').write_text(json.dumps(summary, indent=2), encoding='utf-8')
          lines = [
              f"agent_exit_code={summary['agent_exit_code']}",
              f"source_sha256={summary['source_sha256']}",
              f"error_headers={summary['error_headers']}",
              f"first_error_line={summary['first_error_line']}",
              f"all_required_targets_2x_pass={summary['all_required_targets_2x_pass']}",
              f"state={json.dumps(state, sort_keys=True)}",
          ]
          for item in summary['latest_results']:
              lines.extend([f"===== {item['file']} =====", item['text']])
          (d / 'persistent-summary.txt').write_text('\n'.join(lines) + '\n', encoding='utf-8')
          PY

      - name: Audit executable proof escapes
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          text = path.read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; escaped=False
          while i < len(text):
              if depth:
                  if text.startswith('/-', i): depth += 1; out.extend('  '); i += 2; continue
                  if text.startswith('-/', i): depth -= 1; out.extend('  '); i += 2; continue
                  out.append('\n' if text[i]=='\n' else ' '); i += 1; continue
              if string:
                  ch=text[i]; out.append('\n' if ch=='\n' else ' ')
                  if escaped: escaped=False
                  elif ch=='\\': escaped=True
                  elif ch=='"': string=False
                  i += 1; continue
              if text.startswith('/-', i): depth=1; out.extend('  '); i += 2; continue
              if text.startswith('--', i):
                  while i < len(text) and text[i] != '\n': out.append(' '); i += 1
                  continue
              if text[i]=='"': string=True; out.append(' '); i += 1; continue
              out.append(text[i]); i += 1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b', 'admit':r'\badmit\b',
              'axiom':r'(?m)^\s*(?:public\s+)?axiom\b',
              'unsafe':r'(?m)^\s*unsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          counts={k:len(re.findall(v,code)) for k,v in patterns.items()}
          Path('build-logs/fa377-agent/forbidden-token-audit.txt').write_text(
              '\n'.join(f'{k}={v}' for k,v in counts.items())+'\n', encoding='utf-8')
          if any(counts.values()): raise SystemExit(counts)
          PY

      - name: Persist improved source or concise stalled state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          source_changed=0
          git diff --quiet -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || source_changed=1
          complete=0
          test -f build-logs/fa377-agent/ALL_REQUIRED_TARGETS_2X_PASS && complete=1
          git add build-logs/fa377-agent/persistent-summary.json \
                  build-logs/fa377-agent/persistent-summary.txt \
                  build-logs/fa377-agent/forbidden-token-audit.txt
          for path in build-logs/fa377-agent/state.json \
                      build-logs/fa377-agent/materialized-pass376 \
                      build-logs/fa377-agent/best-metric.json \
                      build-logs/fa377-agent/ALL_REQUIRED_TARGETS_2X_PASS; do
            test -f "${path}" && git add "${path}"
          done
          if test "${source_changed}" -eq 1 || test "${complete}" -eq 1; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          fi
          git diff --cached --quiet && exit 0
          if test "${complete}" -eq 1; then
            message='fix: verify FA Integrated Mock3 and QYM twice'
          elif test "${source_changed}" -eq 1; then
            message='fix: advance PASS 377 FunctionalAnalysis frontier'
          else
            message='ci: record stalled PASS 377 agent diagnosis'
          fi
          git commit -m "${message}"
          git push origin HEAD:fix/fa377-agent-v2-20260809

      - name: Upload full evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa377-iterative-agent-v2-${{ github.sha }}
          path: |
            build-logs/fa377-agent
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual result
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          test -n "${AGENT_EXIT_CODE:-}"
          exit "${AGENT_EXIT_CODE}"
