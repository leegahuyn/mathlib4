name: Mock2 FunctionalAnalysis QYM pass315 final materialization

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2.lean'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'scripts/apply_two_hundred_eighty_ninth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninetieth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_first_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_second_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_third_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fourth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_fifth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_seventh_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_eighth_pass_repairs.py'
      - 'scripts/apply_two_hundred_ninety_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundredth_pass_repairs.py'
      - 'scripts/apply_three_hundred_ninth_pass_repairs.py'
      - 'scripts/apply_three_hundred_tenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_eleventh_pass_repairs.py'
      - 'scripts/apply_three_hundred_twelfth_pass_repairs.py'
      - 'scripts/apply_three_hundred_thirteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fourteenth_pass_repairs.py'
      - 'scripts/apply_three_hundred_fifteenth_pass_repairs.py'
      - '.github/workflows/mock2-fa-qym-pass315-final.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mock2-fa-qym-pass315-final-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: false

jobs:
  verify-materialize-direct:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      INTEGRATED: PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
      QYM: PrimalitySheafVerification/QYM.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: /tmp/mock2-fa-qym-pass315-final
      ADVANCED_BASELINE_COMMIT: 623dfac27a24c170330d6218005e67b06490b814
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_ADVANCED_FINAL_BLOB: a60fa47ebcd8c1fb6037d705e81b54c80910657a
      EXPECTED_ADVANCED_FINAL_SHA256: cf44063abca1d5b47331a9001a3cff45a86b5e889865812fe4e7826c6af41526
      EXPECTED_ADVANCED_BASELINE_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_FA_START_BLOB: 4eedc43d57f96b45897990bbeaada01ee0fd3b84
      EXPECTED_INTEGRATED_STUB_BLOB: 464f5dd095876b20165d12690c8127ef9d909e6a
      EXPECTED_PRE313_SHA256: 7048e0cd364ff150a79b4696b08db0c3a29aa29dc252d623650818f59f6162ca
      EXPECTED_FA_FINAL_SHA256: 36258b062cf8caef1f07cb28111cf0d6293897515b0cc49565f177eb2195de69

    steps:
      - name: Clone exact PR head and classify FunctionalAnalysis source
        id: source
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${HEAD_BRANCH}" = "${BRANCH}"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          mkdir -p "${LOGDIR}/logs" "${LOGDIR}/source" "${LOGDIR}/artifacts" "${OUTDIR}"

          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_FINAL_BLOB}"
          test "$(sha256sum "${ADVANCED}" | awk '{print $1}')" = "${EXPECTED_ADVANCED_FINAL_SHA256}"
          test "$(git hash-object "${INTEGRATED}")" = "${EXPECTED_INTEGRATED_STUB_BLOB}"

          fa_blob="$(git hash-object "${FA}")"
          fa_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          if [[ "${fa_blob}" = "${EXPECTED_FA_START_BLOB}" ]]; then
            source_state=baseline
          elif [[ "${fa_sha}" = "${EXPECTED_FA_FINAL_SHA256}" ]]; then
            source_state=materialized
          else
            echo "Unexpected FunctionalAnalysis source: blob=${fa_blob} sha256=${fa_sha}" >&2
            exit 1
          fi
          echo "source_state=${source_state}" >> "${GITHUB_OUTPUT}"
          echo "SOURCE_STATE=${source_state}" >> "${GITHUB_ENV}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "head_sha=${HEAD_SHA}" \
            "head_branch=${HEAD_BRANCH}" \
            "source_state=${source_state}" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_blob=$(git hash-object "${ADVANCED}")" \
            "advanced_sha256=$(sha256sum "${ADVANCED}" | awk '{print $1}')" \
            "fa_blob=${fa_blob}" \
            "fa_sha256=${fa_sha}" \
            "integrated_blob=$(git hash-object "${INTEGRATED}")" \
            "qym_blob=$(git hash-object "${QYM}")" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${LOGDIR}/snapshot.txt"

      - name: Reproduce pass315 FunctionalAnalysis candidate
        if: steps.source.outputs.source_state == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          cp "${ADVANCED}" /tmp/Mock2_Advanced.final.lean
          git fetch --depth=1 origin "${ADVANCED_BASELINE_COMMIT}"
          git show "${ADVANCED_BASELINE_COMMIT}:${ADVANCED}" > "${ADVANCED}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_BASELINE_BLOB}"

          pre313_scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
          )
          : > "${LOGDIR}/logs/pre313-repair-application.log"
          for script in "${pre313_scripts[@]}"; do
            echo "===== ${script} =====" | tee -a "${LOGDIR}/logs/pre313-repair-application.log"
            python3 "scripts/${script}" 2>&1 | tee -a "${LOGDIR}/logs/pre313-repair-application.log"
          done
          pre313_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          test "${pre313_sha}" = "${EXPECTED_PRE313_SHA256}"

          for script in \
            apply_three_hundred_thirteenth_pass_repairs.py \
            apply_three_hundred_fourteenth_pass_repairs.py \
            apply_three_hundred_fifteenth_pass_repairs.py; do
            echo "===== ${script} =====" | tee -a "${LOGDIR}/logs/pass313-315-application.log"
            python3 "scripts/${script}" 2>&1 | tee -a "${LOGDIR}/logs/pass313-315-application.log"
          done

          cp /tmp/Mock2_Advanced.final.lean "${ADVANCED}"
          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${FA}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)
          test "$(git diff --name-only)" = "${FA}"
          git diff --check
          candidate_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          test "${candidate_sha}" = "${EXPECTED_FA_FINAL_SHA256}"
          cp "${FA}" "${LOGDIR}/source/Mock2_FunctionalAnalysis.pass315.lean"
          printf '%s\n' \
            "pre313_sha256=${pre313_sha}" \
            "fa_candidate_sha256=${candidate_sha}" \
            "fa_candidate_blob=$(git hash-object "${FA}")" \
            "fa_candidate_lines=$(wc -l < "${FA}")" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Static forbidden-token audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          files = [
              Path("PrimalitySheafVerification/Mock2_Advanced.lean"),
              Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean"),
              Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean"),
              Path("PrimalitySheafVerification/QYM.lean"),
          ]

          def strip(src: str) -> str:
              out: list[str] = []
              i = 0
              depth = 0
              string = False
              escaped = False
              while i < len(src):
                  if depth:
                      if src.startswith("/-", i):
                          depth += 1; out.extend("  "); i += 2
                      elif src.startswith("-/", i):
                          depth -= 1; out.extend("  "); i += 2
                      else:
                          out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif string:
                      ch = src[i]
                      out.append("\n" if ch == "\n" else " ")
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == '"': string = False
                      i += 1
                  elif src.startswith("/-", i):
                      depth = 1; out.extend("  "); i += 2
                  elif src.startswith("--", i):
                      while i < len(src) and src[i] != "\n":
                          out.append(" "); i += 1
                  elif src[i] == '"':
                      string = True; out.append(" "); i += 1
                  else:
                      out.append(src[i]); i += 1
              if depth or string:
                  raise SystemExit("unterminated comment or string")
              return "".join(out)

          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_global_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
          }
          bad = False
          for path in files:
              code = strip(path.read_text(encoding="utf-8"))
              print(f"[{path}]")
              for name, pattern in checks.items():
                  count = len(list(re.finditer(pattern, code)))
                  print(f"{name}: {count}")
                  bad |= count != 0
          if bad:
              raise SystemExit("forbidden executable token or global axiom detected")
          PY

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${LOGDIR}/"
          lake exe cache get 2>&1 | tee "${LOGDIR}/logs/cache-get.log"

      - name: Compile Mock2 Advanced FunctionalAnalysis Integrated and QYM twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          mkdir -p "${OUTDIR}"
          echo 'module,pass,exit_code,error_count,warning_count' > "${LOGDIR}/compile-summary.csv"

          compile_module() {
            local module="$1" pass="$2" log code errors warnings
            log="${LOGDIR}/logs/${module}-pass${pass}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' \
              "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              >> "${LOGDIR}/compile-summary.csv"
            echo "${code}" > "${LOGDIR}/${module}-exit-pass${pass}.txt"
            if [[ "${code}" -ne 0 ]]; then
              {
                echo "module=${module}"
                echo "pass=${pass}"
                echo "exit_code=${code}"
                echo "error_count=${errors}"
                echo 'first_errors:'
                grep -n 'error:' "${log}" | head -20 || true
                echo 'last_error:'
                grep -n 'error:' "${log}" | tail -1 || true
                tail -240 "${log}" || true
              } | tee "${LOGDIR}/logs/${module}-failure-pass${pass}.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi \
              "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" \
              "${log}"; then
              echo "forbidden compiler diagnostic in ${log}" >&2
              return 1
            fi
          }

          compile_module Mock2 dependency
          compile_module Mock2_Advanced dependency
          for pass in 1 2; do
            compile_module Mock2_FunctionalAnalysis "${pass}"
            compile_module Mock2_FunctionalAnalysis_Integrated "${pass}"
            compile_module QYM "${pass}"
          done

          for module in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis \
            Mock2_FunctionalAnalysis_Integrated QYM; do
            cp "${OUTDIR}/${module}.olean" "${LOGDIR}/artifacts/${module}.olean"
            cp "${OUTDIR}/${module}.ilean" "${LOGDIR}/artifacts/${module}.ilean"
          done
          sha256sum "${MOCK2}" "${ADVANCED}" "${FA}" "${INTEGRATED}" "${QYM}" \
            "${OUTDIR}/Mock2.olean" "${OUTDIR}/Mock2_Advanced.olean" \
            "${OUTDIR}/Mock2_FunctionalAnalysis.olean" \
            "${OUTDIR}/Mock2_FunctionalAnalysis_Integrated.olean" \
            "${OUTDIR}/QYM.olean" \
            | tee "${LOGDIR}/provenance-sha256.txt"

      - name: Materialize verified FunctionalAnalysis source
        if: steps.source.outputs.source_state == 'baseline'
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger_head=${HEAD_SHA}"
          echo "remote_head=${remote_head}"
          test "${remote_head}" = "${HEAD_SHA}"
          test "$(git diff --name-only)" = "${FA}"
          test "$(sha256sum "${FA}" | awk '{print $1}')" = "${EXPECTED_FA_FINAL_SHA256}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${FA}"
          test "$(git diff --cached --name-only)" = "${FA}"
          git commit -m 'fix: materialize Mock2 FunctionalAnalysis pass 315'
          materialized_sha="$(git rev-parse HEAD)"
          git push origin "HEAD:${BRANCH}"
          printf '%s\n' \
            "materialized_commit=${materialized_sha}" \
            "utc_materialized=$(date -u +%FT%TZ)" \
            | tee -a "${LOGDIR}/snapshot.txt"

      - name: Upload three-module verification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-fa-qym-pass315-final-${{ env.HEAD_SHA }}
          path: /tmp/mock2-fa-qym-pass315-final
          if-no-files-found: warn
          retention-days: 30
