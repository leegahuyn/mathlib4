name: Spt1 native_decide replacement proof probe

on:
  push:
    branches:
      - gpt/final13-spt1-native-clean-candidate-20260820
    paths:
      - .github/workflows/spt1-native-decide-replacement-probe.yml
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version

      - name: Generate independent proof probes
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .spt1_probe
          cat > .spt1_probe/Decide.lean <<'LEAN'
          import Mathlib
          example : Fintype.card {x : ZMod 9 // (12 : ZMod 9) * x = 0} = 3 := by
            decide
          LEAN
          cat > .spt1_probe/NormNum.lean <<'LEAN'
          import Mathlib
          example : Fintype.card {x : ZMod 9 // (12 : ZMod 9) * x = 0} = 3 := by
            norm_num
          LEAN
          cat > .spt1_probe/KernelCard.lean <<'LEAN'
          import Mathlib
          example : Fintype.card {x : ZMod 9 // (12 : ZMod 9) * x = 0} = 3 := by
            change Nat.card (AddMonoidHom.mulLeft (12 : ZMod 9)).ker = 3
            rw [← AddSubgroup.index_ker, AddSubgroup.card_mul_index]
            norm_num [AddMonoidHom.mem_ker]
          LEAN

      - name: Compile all strategies without stopping at first failure
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          : > .spt1_probe/results.tsv
          for f in Decide NormNum KernelCard; do
            set +e
            timeout --signal=TERM --kill-after=10s 900s \
              lake env lean -DmaxErrors=100 -DwarningAsError=false ".spt1_probe/${f}.lean" \
              > ".spt1_probe/${f}.log" 2>&1
            rc=$?
            set -e
            errors=$(grep -Ec ':([0-9]+):([0-9]+): error' ".spt1_probe/${f}.log" || true)
            printf '%s\t%s\t%s\n' "$f" "$rc" "$errors" | tee -a .spt1_probe/results.tsv
            cat ".spt1_probe/${f}.log"
          done

      - name: Select verified replacement
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          rows = []
          for line in Path('.spt1_probe/results.tsv').read_text().splitlines():
              strategy, rc, errors = line.split('\t')
              rows.append({'strategy': strategy, 'exit': int(rc), 'errors': int(errors), 'pass': int(rc) == 0 and int(errors) == 0})
          priority = ['NormNum', 'Decide', 'KernelCard']
          selected = next((name for name in priority if any(r['strategy'] == name and r['pass'] for r in rows)), None)
          result = {'results': rows, 'selected': selected, 'pass': selected is not None}
          Path('.spt1_probe/RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          if selected is None:
              raise SystemExit(1)
          PY

      - name: Upload proof evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: spt1-native-decide-replacement-probe-${{ github.run_id }}
          path: .spt1_probe
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
