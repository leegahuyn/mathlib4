name: Primality Sheaf Verification

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
  pull_request:
    paths:
      - 'PrimalitySheafVerification/**'
      - 'scripts/apply_deterministic_repairs.py'
      - '.github/workflows/primality-sheaf-verification.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: primality-sheaf-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout repair branch
        uses: actions/checkout@v4
        with:
          ref: fix/primality-sheaf-clean-build
          fetch-depth: 1

      - name: Apply deterministic source repairs
        run: python3 scripts/apply_deterministic_repairs.py

      - name: Commit source repairs when needed
        id: repair-commit
        shell: bash
        run: |
          if git diff --quiet -- PrimalitySheafVerification/Spt1.lean PrimalitySheafVerification/QYM.lean; then
            echo 'changed=false' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Spt1.lean PrimalitySheafVerification/QYM.lean
          git commit -m 'fix: update Spt1 APIs and place QYM import first'
          git push origin HEAD:fix/primality-sheaf-clean-build
          echo 'changed=true' >> "$GITHUB_OUTPUT"

      - name: Set up Lean
        if: steps.repair-commit.outputs.changed != 'true'
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Restore Mathlib compiled cache
        if: steps.repair-commit.outputs.changed != 'true'
        run: lake exe cache get

      - name: Compile all 13 modules and collect logs
        if: steps.repair-commit.outputs.changed != 'true'
        id: module-build
        shell: bash
        run: |
          set +e
          mkdir -p build-logs
          artifact_dir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$artifact_dir"

          modules=(
            Spt1
            Spt2
            Spt3
            Spt4
            Spt5
            Spt6
            Spt7
            Mock1
            Mock1_Advanced
            Mock2
            Mock2_Advanced
            Mock2_FunctionalAnalysis
            QYM
          )

          printf 'module,exit_code,status\n' > build-logs/module-summary.csv
          overall=0

          for module in "${modules[@]}"; do
            echo "::group::Compiling ${module}"
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${artifact_dir}/${module}.olean" \
              -i "${artifact_dir}/${module}.ilean" 2>&1 \
              | tee "build-logs/${module}.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "build-logs/${module}.exit-code.txt"

            if [ "$code" -eq 0 ]; then
              status=PASS
            else
              status=FAIL
              overall=1
            fi

            printf '%s,%s,%s\n' "$module" "$code" "$status" \
              >> build-logs/module-summary.csv
            echo "::endgroup::"
          done

          if [ "$overall" -eq 0 ]; then
            echo '::group::Compiling BuildAll'
            lake env lean PrimalitySheafVerification/BuildAll.lean \
              -o "${artifact_dir}/BuildAll.olean" \
              -i "${artifact_dir}/BuildAll.ilean" 2>&1 \
              | tee build-logs/BuildAll.log
            aggregate_code=${PIPESTATUS[0]}
            echo '::endgroup::'
            if [ "$aggregate_code" -ne 0 ]; then
              overall=1
            fi
          else
            aggregate_code=1
            echo 'Skipped because at least one module failed.' \
              > build-logs/BuildAll.log
          fi

          echo "$aggregate_code" > build-logs/BuildAll.exit-code.txt

          find "$artifact_dir" \
            -maxdepth 1 -type f \
            \( -name '*.olean' -o -name '*.ilean' -o -name '*.olean.private' \) \
            -printf '%f,%s,%TY-%Tm-%TdT%TH:%TM:%TSZ\n' \
            2>/dev/null | sort > build-logs/artifact-report.csv || true

          grep -R -nE '\bsorry\b|\badmit\b|^[[:space:]]*axiom\b|\bunsafe\b' \
            PrimalitySheafVerification/*.lean \
            > build-logs/trust-audit.txt || true

          exit "$overall"

      - name: Upload build logs and artifacts report
        if: always() && steps.repair-commit.outputs.changed != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: primality-sheaf-build-logs
          path: |
            build-logs
            .lake/build/lib/lean/PrimalitySheafVerification
          if-no-files-found: error
          retention-days: 30
