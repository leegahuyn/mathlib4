name: Primality Sheaf Verification

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
  pull_request:
    paths:
      - 'PrimalitySheafVerification/**'
      - '.github/workflows/primality-sheaf-verification.yml'
  workflow_dispatch:

jobs:
  build-modules:
    runs-on: ubuntu-latest
    timeout-minutes: 360

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Lean and Mathlib cache
        uses: leanprover/lean-action@v1
        with:
          build: false
          test: false
          lint: false

      - name: Build all 13 modules and collect logs
        id: module-build
        shell: bash
        run: |
          set +e
          mkdir -p build-logs

          modules=(
            Spt1
            Spt2
            Spt3
            Spt4
            Spt5
            Spt6
            Spt7
            Mock1
            Mock1_Advanced
            Mock2
            Mock2_Advanced
            Mock2_FunctionalAnalysis
            QYM
          )

          printf 'module,exit_code,status\n' > build-logs/module-summary.csv
          overall=0

          for module in "${modules[@]}"; do
            echo "::group::Building ${module}"
            lake --no-ansi build "+PrimalitySheafVerification.${module}" 2>&1 \
              | tee "build-logs/${module}.log"
            code=${PIPESTATUS[0]}
            echo "$code" > "build-logs/${module}.exit-code.txt"

            if [ "$code" -eq 0 ]; then
              status=PASS
            else
              status=FAIL
              overall=1
            fi

            printf '%s,%s,%s\n' "$module" "$code" "$status" \
              >> build-logs/module-summary.csv
            echo "::endgroup::"
          done

          if [ "$overall" -eq 0 ]; then
            lake --no-ansi build +PrimalitySheafVerification.BuildAll 2>&1 \
              | tee build-logs/BuildAll.log
            aggregate_code=${PIPESTATUS[0]}
          else
            aggregate_code=1
            echo 'Skipped because at least one module failed.' \
              > build-logs/BuildAll.log
          fi

          echo "$aggregate_code" > build-logs/BuildAll.exit-code.txt

          find .lake/build/lib/lean/PrimalitySheafVerification \
            -maxdepth 1 -type f \
            \( -name '*.olean' -o -name '*.ilean' -o -name '*.olean.private' \) \
            -printf '%f,%s,%TY-%Tm-%TdT%TH:%TM:%TSZ\n' \
            2>/dev/null | sort > build-logs/artifact-report.csv || true

          grep -R -nE '\bsorry\b|\badmit\b|^[[:space:]]*axiom\b|\bunsafe\b' \
            PrimalitySheafVerification/*.lean \
            > build-logs/trust-audit.txt || true

          exit "$overall"

      - name: Upload build logs and artifacts report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: primality-sheaf-build-logs
          path: build-logs
          if-no-files-found: error
          retention-days: 30
