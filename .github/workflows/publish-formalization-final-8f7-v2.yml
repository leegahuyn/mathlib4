name: Publish Formalization FINAL AUTHORITY 8f7 v2
# Git Data API tag freeze, followed by permanent release publication.

"on":
  push:
    branches:
      - ops/formalization-final-release-8f7-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v2.yml
  pull_request:
    branches:
      - gpt/final-authority-pass-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v2.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  pull-requests: read

concurrency:
  group: publish-formalization-final-8f7-v2
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout exact immutable authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Checkout preservation publisher separately
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: ops/formalization-final-release-8f7-20260821
          path: _publisher
          fetch-depth: 1
          persist-credentials: false

      - name: Freeze exact authority with canonical annotated tag
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          TAG='formalization-final-2026-08-21'
          COMMIT='8f7e861f5f76c0aa5d347e0de865516a1ba23922'
          MESSAGE=$(cat <<'EOF'
          Formalization FINAL AUTHORITY
          Exact tested commit: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          Actual full-chain Lean run: 32443566530
          Independent QYM replay run: 32344604895
          Terminal authority run: 32455051059
          Final13 13/13; bridges 2/2; BuildAll PASS; clean×2 PASS;
          checklist 15/15; forbidden 0; panic 0; axiom/source identity PASS.
          Full actual-Lean evidence SHA256: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
          QYM replay evidence SHA256: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
          Terminal authority evidence SHA256: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee
          EOF
          )

          if REF_JSON=$(gh api "repos/leegahuyn/mathlib4/git/ref/tags/${TAG}" 2>/tmp/tag-read.err); then
            TAG_OBJECT=$(jq -r '.object.sha' <<<"${REF_JSON}")
            test "$(jq -r '.object.type' <<<"${REF_JSON}")" = 'tag'
            TAG_JSON=$(gh api "repos/leegahuyn/mathlib4/git/tags/${TAG_OBJECT}")
            test "$(jq -r '.tag' <<<"${TAG_JSON}")" = "${TAG}"
            test "$(jq -r '.object.type' <<<"${TAG_JSON}")" = 'commit'
            test "$(jq -r '.object.sha' <<<"${TAG_JSON}")" = "${COMMIT}"
          else
            TAG_JSON=$(jq -n \
              --arg tag "${TAG}" \
              --arg message "${MESSAGE}" \
              --arg object "${COMMIT}" \
              --arg date "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
              '{tag:$tag,message:$message,object:$object,type:"commit",tagger:{name:"leegahuyn",email:"102484661+leegahuyn@users.noreply.github.com",date:$date}}' \
              | gh api --method POST 'repos/leegahuyn/mathlib4/git/tags' --input -)
            TAG_OBJECT=$(jq -r '.sha' <<<"${TAG_JSON}")
            jq -n --arg ref "refs/tags/${TAG}" --arg sha "${TAG_OBJECT}" '{ref:$ref,sha:$sha}' \
              | gh api --method POST 'repos/leegahuyn/mathlib4/git/refs' --input - >/tmp/tag-ref-create.json
          fi

          git fetch --force origin "refs/tags/${TAG}:refs/tags/${TAG}"
          test "$(git cat-file -t "${TAG}")" = 'tag'
          test "$(git rev-list -n 1 "${TAG}")" = "${COMMIT}"
          test "$(git cat-file tag "${TAG}" | sed -n 's/^object //p')" = "${COMMIT}"

      - name: Recover, patch, and execute deterministic publisher
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          source = Path('_publisher/.github/workflows/publish-formalization-final-8f7.yml').read_text(encoding='utf-8')
          block = source.split("<<'B64'\n", 1)[1].split("\n          B64\n", 1)[0]
          Path('/tmp/publisher.b64').write_text('\n'.join(line[10:] if line.startswith('          ') else line for line in block.splitlines()) + '\n')
          PY
          base64 --decode /tmp/publisher.b64 | gzip --decompress > /tmp/publish_final_authority_8f7.sh
          sed -i 's/\.head_sha==$c/.workflow_run.head_sha==$c/' /tmp/publish_final_authority_8f7.sh
          grep -F '.workflow_run.head_sha==$c' /tmp/publish_final_authority_8f7.sh
          bash -n /tmp/publish_final_authority_8f7.sh
          bash -x /tmp/publish_final_authority_8f7.sh

      - name: Redundant Actions backup of permanent package
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: formalization-final-permanent-release-8f7e861f-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f
            publication/FINAL_PUBLICATION_STATUS.json
            publication/FINAL_PUBLICATION_REPORT.md
            publication/RELEASE_URL.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
