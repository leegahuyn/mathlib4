name: GPT QYM module alignment matrix from 93-error authority

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-module-alignment-matrix.yml
      - .github/qym_module_alignment_matrix.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-module-alignment-matrix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  matrix:
    name: ${{ matrix.variant }} full QYM direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      matrix:
        variant:
          - normed-only
          - codomain-module-aligned
          - domain-codomain-module-aligned
    env:
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      EXPECTED_CANONICAL_QYM_SHA256: 698c7625628ccc654ca7be713944930fdccf12dd78a26937d3f45c9b6982a9f0
      PROBE19_RUN: '32086793820'
      PROBE19_ARTIFACT: qym-probe19-366d44428aac1529e2f01a2110933fd77d624a4c-attempt1
      PROBE19_SHA256: 069c1476163e3b87670e8eae0960f7975691f83a2ac1440863387eb2036cced5
      PROBE19_BLOB: cb104f9129f53d4db10364611bcf95911fd3ab5c
      EXPECTED_PROJECT_CACHE_KEY: qym-probe4-deps-v1-Linux-ecb9f60364b1d72200c847f9ae46918f12c8b6d05363c23cca5d361c92ea45d4
      QYM_SOURCE: PrimalitySheafVerification/QYM.lean
      OLEAN_ROOT: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate branch canonical source and patch inputs
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qym-module-alignment-${{ matrix.variant }}"
          mkdir -p "$OUT"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_CANONICAL_QYM_SHA256"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f .github/qym_module_alignment_matrix.py
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.before.txt"
          test ! -s "$OUT/git-status.before.txt"

      - name: Download exact 93-error Probe19 authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PROBE19_ARTIFACT }}
          path: ${{ runner.temp }}/probe19-authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32086793820

      - name: Verify Probe19 direct authority bytes and metrics
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/probe19-authority"
          for f in QYM.candidate-probe19.lean QYM.exit QYM.error-headers.txt QYM.panic-lines.txt PROBE_RESULT.json; do
            test -f "$A/$f"
          done
          test "$(sha256sum "$A/QYM.candidate-probe19.lean" | awk '{print $1}')" = "$PROBE19_SHA256"
          test "$(git hash-object --no-filters "$A/QYM.candidate-probe19.lean")" = "$PROBE19_BLOB"
          test "$(cat "$A/QYM.exit")" = 1
          test "$(wc -l < "$A/QYM.error-headers.txt")" -eq 93
          test ! -s "$A/QYM.panic-lines.txt"
          python3 - "$A/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['candidate_qym_sha256'] == os.environ['PROBE19_SHA256']
          assert r['candidate_qym_blob'] == os.environ['PROBE19_BLOB']
          assert r['exit'] == 1 and r['error_headers'] == 93 and r['panic_lines'] == 0
          PY
          cp "$A/QYM.candidate-probe19.lean" "$OUT/QYM.probe19.authority.lean"
          cp "$A/PROBE_RESULT.json" "$OUT/PROBE19_RESULT.json"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure exact dependency objects
        shell: bash
        env:
          CACHE_HIT: ${{ steps.depcache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.depcache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.depcache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN_ROOT"
          test "$CACHE_PRIMARY_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          if [[ "$CACHE_HIT" == true ]]; then
            test "$CACHE_MATCHED_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
            echo hit > "$OUT/dependency-cache-status.txt"
          else
            test -z "$CACHE_HIT"
            test -z "$CACHE_MATCHED_KEY"
            echo miss-rebuilt > "$OUT/dependency-cache-status.txt"
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              if [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]]; then cap=2000; fi
              rm -f "$OLEAN_ROOT/$stem.olean" "$OLEAN_ROOT/$stem.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN_ROOT/$stem.olean" -i "$OLEAN_ROOT/$stem.ilean" \
                "PrimalitySheafVerification/$stem.lean" > "$OUT/$stem.log" 2>&1
            done
          fi
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN_ROOT/$stem.olean" && test -s "$OLEAN_ROOT/$stem.ilean"
          done

      - name: Materialize deterministic matrix candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM_SOURCE" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.probe19.authority.lean" "$QYM_SOURCE"
          python3 -B .github/qym_module_alignment_matrix.py \
            "${{ matrix.variant }}" "$QYM_SOURCE" | tee "$OUT/PATCH_RESULT.json"
          cp "$QYM_SOURCE" "$OUT/QYM.candidate-${{ matrix.variant }}.lean"
          python3 - "$OUT/PATCH_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CANDIDATE_SHA256=' + r['candidate_sha256'] + '\n')
              f.write('CANDIDATE_BLOB=' + r['candidate_blob'] + '\n')
          PY

      - name: Full direct Lean compile of matrix candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.matrix.olean" -i "$RUNNER_TEMP/QYM.matrix.ilean" "$QYM_SOURCE" \
            > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.matrix.olean" -i "$RUNNER_TEMP/QYM.matrix.ilean" \
              "$QYM_SOURCE" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.matrix.olean" && test -s "$RUNNER_TEMP/QYM.matrix.ilean"
            sha256sum "$RUNNER_TEMP/QYM.matrix.olean" "$RUNNER_TEMP/QYM.matrix.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical and summarize matrix result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -f "$OUT/QYM.canonical.lean" ]]; then cp "$OUT/QYM.canonical.lean" "$QYM_SOURCE"; fi
          python3 - "$OUT" "${{ matrix.variant }}" <<'PY'
          import collections, hashlib, json, os, re, sys
          from pathlib import Path
          root = Path(sys.argv[1]); variant = sys.argv[2]
          raw = (root/'QYM.log').read_bytes() if (root/'QYM.log').exists() else b''
          text = raw.decode('utf-8', errors='replace')
          pat = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M)
          rows=[]
          for m in pat.finditer(text):
              x=m.groupdict(); x['line']=int(x['line']); x['column']=int(x['column']); rows.append(x)
          errors=[x for x in rows if x['severity']=='error']; warnings=[x for x in rows if x['severity']=='warning']
          panics=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          (root/'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(x,sort_keys=True)+'\n' for x in rows), encoding='utf-8')
          (root/'QYM.error-headers.txt').write_text(''.join(f"{x['file']}:{x['line']}:{x['column']}: error{('('+x['code']+')') if x['code'] else ''}: {x['message']}\n" for x in errors), encoding='utf-8')
          (root/'QYM.panic-lines.txt').write_text(''.join(x+'\n' for x in panics), encoding='utf-8')
          rc=int((root/'QYM.exit').read_text().strip()) if (root/'QYM.exit').exists() else None
          blocker=[x for x in errors if 37140 <= x['line'] <= 37290]
          result={
            'schema':'qym-module-alignment-matrix-v1', 'variant':variant, 'github_sha':os.environ['GITHUB_SHA'],
            'baseline_qym_sha256':os.environ['PROBE19_SHA256'], 'candidate_qym_sha256':os.environ.get('CANDIDATE_SHA256'),
            'candidate_qym_blob':os.environ.get('CANDIDATE_BLOB'), 'exit':rc, 'error_headers':len(errors),
            'warning_headers':len(warnings), 'error_codes':dict(sorted(collections.Counter(x['code'] or 'uncoded' for x in errors).items())),
            'first_error':errors[0] if errors else None, 'last_error':errors[-1] if errors else None,
            'panic_lines':len(panics), 'blocker_region_errors':blocker,
            'first_blocker_pass':not blocker, 'semantic_pass':rc==0 and not errors and not panics,
            'log_sha256':hashlib.sha256(raw).hexdigest(),
          }
          (root/'MATRIX_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n', encoding='utf-8')
          print(json.dumps(result,indent=2,sort_keys=True))
          PY
          test "$(sha256sum "$QYM_SOURCE" | awk '{print $1}')" = "$EXPECTED_CANONICAL_QYM_SHA256"
          git status --porcelain=v1 --untracked-files=all > "$OUT/git-status.after.txt"
          test ! -s "$OUT/git-status.after.txt"

      - name: Upload immutable matrix evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-module-alignment-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ env.OUT }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless first blocker is eliminated
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT/MATRIX_RESULT.json" <<'PY'
          import json, sys
          r=json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['panic_lines'] == 0
          if not r['first_blocker_pass']:
              raise SystemExit(1)
          PY
