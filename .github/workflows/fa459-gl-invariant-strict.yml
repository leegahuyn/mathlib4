name: FA459 GL-invariant strict categorized direct matrix

on:
  push:
    branches: [fix/fa459-gl-invariant-strict-20260810]
    paths:
      - .github/workflows/fa459-gl-invariant-strict.yml
      - scripts/fa459_prepare_gl_invariant.py
      - scripts/fa459_gl_candidate_ci.sh
      - scripts/fa459_gl_select.py
      - scripts/fa459_gl_selector_ci.sh
      - scripts/fa459_prepare_true_first_cluster.py
      - scripts/fa458_record_direct_metric_strict.py
      - scripts/fa458_prepare_cumulative_early.py
      - build-logs/fa459-gl-invariant/REQUESTED*.txt
  pull_request:
    branches: [fix/fa459-gl-invariant-strict-20260810]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa459-gl-invariant-${{ github.run_id }}
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa459-gl-invariant-strict-20260810
  SOURCE_REF: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 260
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant:
          - baseline
          - macro_pair_only
          - macro_pair_smul
          - macro_pair_smul_cumulative
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '320'
    steps:
      - name: Checkout immutable GL-invariant source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate candidate, install pinned Lean/cache, execute direct Mock2/Advanced/FA
        shell: bash
        run: bash scripts/fa459_gl_candidate_ci.sh

      - name: Upload current-run candidate source and strict metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa459gl-candidate-${{ matrix.variant }}
          path: build-logs/fa453-compact-energy/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Reject skipped Lean, prerequisite regression, identity/trust failure
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa453-compact-energy/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json,sys
          try:
              m=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f'INFRA_FAILURE: missing/invalid metric: {exc}')
          ok=(
              m.get('classification') != 'INFRA_FAILURE'
              and m.get('diagnostic_parser') == 'strict_error_and_error_category_v1'
              and m.get('header_authority') == 'declaration proposition/type through := only'
              and m.get('all_required_lean_executed') is True
              and m.get('source_metadata_identity') is True
              and m.get('Mock2_exit') == 0
              and m.get('Mock2_errors_under_cap') == 0
              and m.get('Mock2_Advanced_exit') == 0
              and m.get('Mock2_Advanced_errors_under_cap') == 0
              and m.get('FA_executed') is True
              and m.get('forbidden_clean') is True
          )
          print(json.dumps(m,indent=2,ensure_ascii=False))
          if not ok:
              raise SystemExit('INFRA_FAILURE: actual direct Lean requirements not met')
          PY

  select-confirm-persist:
    name: independent baseline, strict selector, materialize, checked-in x2
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 500
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '420'
    steps:
      - name: Checkout immutable GL-invariant source commit with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 2500
          persist-credentials: true

      - name: Configure git identity before any commit/push
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git config user.name)" = 'github-actions[bot]'
          test "$(git config user.email)" = '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Independent strict baseline, selector, materialize, x2 and downstream gate
        id: selector
        shell: bash
        run: bash scripts/fa459_gl_selector_ci.sh

      - name: Upload complete GL-invariant evidence
        id: evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa459gl-complete-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa453-compact-energy
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce infra integrity separately from FA proof result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.selector.outcome }}" = success
          test -s build-logs/fa453-compact-energy/selector-baseline/METRIC.json
          test -s build-logs/fa453-compact-energy/selected/SELECTION.json
          test -s build-logs/fa453-compact-energy/selected/CANDIDATE_RESULTS.json
          test -s build-logs/fa453-compact-energy/selected-confirm/CONFIRMATION.json
          test -s build-logs/fa453-compact-energy/final/CHECKED_IN_IDENTITY.json
          test -s build-logs/fa453-compact-energy/final/FA_FINAL.json
          test -s build-logs/fa453-compact-energy/final/downstream/DOWNSTREAM.json
