name: Mock2 Advanced pass 316 ARM verify and materialize v3

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/mock2-advanced-pass316-arm-materialize-v3.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mock2-advanced-pass316-materialize-v3
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_CANDIDATE_BLOB: b71fddf282b107ce14924609c84a97fb240737eb
      EXPECTED_CANDIDATE_SHA256: e59496026992858e176443990940305db05300e211eb2b09962ec540808af2d4
      EVIDENCE: /tmp/mock2-advanced-pass316-candidate-v3

    steps:
      - name: Clone exact triggering HEAD
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          mkdir -p "${EVIDENCE}/source" "${EVIDENCE}/logs" "${EVIDENCE}/artifacts"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "trigger_sha=${GITHUB_SHA}" \
            "mock2_blob=$(git hash-object "${MOCK2}")" \
            "advanced_start_blob=$(git hash-object "${TARGET}")" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Apply deterministic v61 through v68 repair chain
        shell: bash
        run: |
          set -euo pipefail
          current_blob="$(git hash-object "${TARGET}")"
          current_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          if [[ "${current_sha}" = "${EXPECTED_CANDIDATE_SHA256}" ]]; then
            test "${current_blob}" = "${EXPECTED_CANDIDATE_BLOB}"
            echo 'candidate already checked in' | tee "${EVIDENCE}/logs/repair-application.log"
          else
            test "${current_blob}" = "${EXPECTED_START_BLOB}"
            scripts=(
              apply_two_hundred_eighty_ninth_pass_repairs.py
              apply_two_hundred_ninetieth_pass_repairs.py
              apply_two_hundred_ninety_first_pass_repairs.py
              apply_two_hundred_ninety_second_pass_repairs.py
              apply_two_hundred_ninety_third_pass_repairs.py
              apply_two_hundred_ninety_fourth_pass_repairs.py
              apply_two_hundred_ninety_fifth_pass_repairs.py
              apply_two_hundred_ninety_seventh_pass_repairs.py
              apply_two_hundred_ninety_eighth_pass_repairs.py
              apply_two_hundred_ninety_ninth_pass_repairs.py
              apply_three_hundredth_pass_repairs.py
              apply_three_hundred_ninth_pass_repairs.py
              apply_three_hundred_tenth_pass_repairs.py
              apply_three_hundred_eleventh_pass_repairs.py
              apply_three_hundred_twelfth_pass_repairs.py
              repair_mock2_advanced_v68.py
            )
            for script in "${scripts[@]}"; do
              echo "===== scripts/${script} ====="
              python3 "scripts/${script}"
            done 2>&1 | tee "${EVIDENCE}/logs/repair-application.log"
            while IFS= read -r changed; do
              if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
                git restore --source=HEAD --worktree -- "${changed}"
              fi
            done < <(git diff --name-only)
          fi
          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          actual_blob="$(git hash-object "${TARGET}")"
          test "${actual_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          test "${actual_blob}" = "${EXPECTED_CANDIDATE_BLOB}"
          changed="$(git diff --name-only)"
          if [[ -n "${changed}" ]]; then test "${changed}" = "${TARGET}"; fi
          git diff --check
          cp "${MOCK2}" "${TARGET}" "${EVIDENCE}/source/"
          printf '%s\n' \
            "candidate_blob=${actual_blob}" \
            "candidate_sha256=${actual_sha}" \
            "candidate_lines=$(wc -l < "${TARGET}")" \
            | tee -a "${EVIDENCE}/snapshot.txt"

      - name: Static forbidden-token and global-axiom gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${EVIDENCE}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          files = [Path("PrimalitySheafVerification/Mock2.lean"),
                   Path("PrimalitySheafVerification/Mock2_Advanced.lean")]

          def strip(src: str) -> str:
              out, i, depth, string, escaped = [], 0, 0, False, False
              while i < len(src):
                  if depth:
                      if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                      elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                      else: out.append("\n" if src[i] == "\n" else " "); i += 1
                  elif string:
                      ch = src[i]; out.append("\n" if ch == "\n" else " ")
                      if escaped: escaped = False
                      elif ch == "\\": escaped = True
                      elif ch == '"': string = False
                      i += 1
                  elif src.startswith("/-", i): depth = 1; out.extend("  "); i += 2
                  elif src.startswith("--", i):
                      while i < len(src) and src[i] != "\n": out.append(" "); i += 1
                  elif src[i] == '"': string = True; out.append(" "); i += 1
                  else: out.append(src[i]); i += 1
              if depth or string: raise SystemExit("unterminated comment or string")
              return "".join(out)

          checks = {
              "sorry": r"\bsorry\b", "admit": r"\badmit\b",
              "line_start_global_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b", "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b", "placeholder": r"\bplaceholder\b",
              "unfinished_TODO_FIXME": r"\b(?:TODO|FIXME)\b",
          }
          bad = False
          for path in files:
              code = strip(path.read_text(encoding="utf-8"))
              print(f"[{path}]")
              for name, pattern in checks.items():
                  matches = list(re.finditer(pattern, code))
                  print(f"{name}: {len(matches)}")
                  bad |= bool(matches)
          if bad: raise SystemExit("forbidden executable token or global axiom detected")
          PY

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Compile Mock2 regression and Advanced candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}"
          echo 'module,pass,exit_code,error_count,warning_count' > "${EVIDENCE}/compile-summary.csv"

          compile_module() {
            local module="$1" pass="$2" log="${EVIDENCE}/logs/${1}-pass${2}.log"
            rm -f "${outdir}/${module}.olean" "${outdir}/${module}.ilean" \
              "${outdir}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${outdir}/${module}.olean" -i "${outdir}/${module}.ilean" \
              >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s,%s\n' "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
              >> "${EVIDENCE}/compile-summary.csv"
            echo "${code}" > "${EVIDENCE}/${module}-exit-pass${pass}.txt"
            if [[ "${code}" -ne 0 ]]; then
              grep -n 'error:' "${log}" | head -10 || true
              grep -n 'error:' "${log}" | tail -1 || true
              echo "total_errors=${errors}"
              grep -in 'maximum number of errors' "${log}" || true
              tail -200 "${log}" || true
              exit "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${outdir}/${module}.olean"
            test -s "${outdir}/${module}.ilean"
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" "${log}"
          }

          for pass in 1 2; do
            compile_module Mock2 "${pass}"
            compile_module Mock2_Advanced "${pass}"
          done
          cp "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
            "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean" \
            "${EVIDENCE}/artifacts/"
          sha256sum "${MOCK2}" "${TARGET}" \
            "${outdir}/Mock2.olean" "${outdir}/Mock2.ilean" \
            "${outdir}/Mock2_Advanced.olean" "${outdir}/Mock2_Advanced.ilean" \
            | tee "${EVIDENCE}/provenance-sha256.txt"

      - name: Commit only the twice-verified candidate
        shell: bash
        run: |
          set -euo pipefail
          test "$(sha256sum "${TARGET}" | awk '{print $1}')" = "${EXPECTED_CANDIDATE_SHA256}"
          test "$(git hash-object "${TARGET}")" = "${EXPECTED_CANDIDATE_BLOB}"
          if git diff --quiet -- "${TARGET}"; then
            echo 'candidate already checked in' | tee "${EVIDENCE}/materialization.txt"
            exit 0
          fi
          test "$(git diff --name-only)" = "${TARGET}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          printf '%s\n' "trigger_head=${GITHUB_SHA}" "remote_head=${remote_head}" \
            | tee "${EVIDENCE}/materialization.txt"
          test "${remote_head}" = "${GITHUB_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m 'fix: materialize Mock2 Advanced pass 316 verified source'
          git push origin "HEAD:${BRANCH}"

      - name: Upload candidate evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mock2-advanced-pass316-candidate-v3-${{ github.sha }}
          path: /tmp/mock2-advanced-pass316-candidate-v3
          if-no-files-found: warn
          retention-days: 30
