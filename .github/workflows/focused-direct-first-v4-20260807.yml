name: Focused checked-in direct-first verifier v4

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-direct-first-v4-20260807.yml'
      - 'scripts/create_checked_in_focused_marker_20260807.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-checked-in-direct-first-v4
  cancel-in-progress: false

jobs:
  direct-first:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      FOCUSED_BRANCH: fix/primality-sheaf-clean-build
      FOCUSED_LOGDIR: /tmp/focused-proof/direct-first-v4
      FOCUSED_CANDIDATE_MARKER: /tmp/focused_candidate_direct_first_v4.json
      FOCUSED_REPORT_OUT: /tmp/focused_direct_pass_v4.json
      FOCUSED_BUNDLE_OUT: /tmp/focused-direct-first-v4-proof.tar.gz
      PERSISTENT_CANDIDATE: .ci/focused/focused_candidate_v4.json
      FINAL_MARKER: .ci/focused/focused_direct_pass_v4.json

    steps:
      - name: Clone exact current checked-in source snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1 | tee /tmp/direct-first-initial-status.txt
          test ! -s /tmp/direct-first-initial-status.txt

      - name: Normalize verification helpers without changing Lean sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_focused_v4_runtime_20260807.py
          python3 -m py_compile \
            scripts/focused_source_audit_20260807.py \
            scripts/generate_focused_axiom_audit_20260807.py \
            scripts/create_checked_in_focused_marker_20260807.py
          bash -n scripts/focused_direct_verify_20260807.sh
          bash -n scripts/focused_axiom_audit_dispatch_20260807.sh
          bash -n scripts/focused_environment_axiom_audit_20260807.sh
          git diff --check
          if ! git diff --quiet -- PrimalitySheafVerification; then
            echo 'Runtime normalization changed Lean sources.' >&2
            exit 1
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if ! git diff --quiet; then
            git add scripts/focused_materialize_pipeline_20260807.sh scripts/focused_direct_verify_20260807.sh
            git commit -m 'ci: normalize focused direct-first runtime'
          fi
          git status --porcelain=v1 | tee /tmp/direct-first-post-normalize-status.txt
          test ! -s /tmp/direct-first-post-normalize-status.txt

      - name: Generate immutable candidate provenance from checked-in sources
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/create_checked_in_focused_marker_20260807.py "${FOCUSED_CANDIDATE_MARKER}"
          python3 scripts/focused_source_audit_20260807.py audit \
            PrimalitySheafVerification/Mock2.lean \
            PrimalitySheafVerification/Mock2_Advanced.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/QYM.lean \
            > /tmp/direct-first-static-audit.json
          git diff --exit-code

      - name: Install exact Lean toolchain
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Compile current checked-in focused graph twice without repair
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          bash scripts/run_focused_direct_v3_20260807.sh

      - name: Upload mandatory direct-source proof artifact
        uses: actions/upload-artifact@v4
        with:
          name: focused-direct-first-v4-${{ github.sha }}
          path: /tmp/focused-direct-first-v4-proof.tar.gz
          if-no-files-found: error
          retention-days: 30

      - name: Publish checked-in candidate and final direct PASS markers
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .ci/focused
          cp "${FOCUSED_CANDIDATE_MARKER}" "${PERSISTENT_CANDIDATE}"
          cp /tmp/focused_direct_pass_v4.json "${FINAL_MARKER}"
          git diff --check
          python3 - <<'PY'
          import subprocess
          raw=subprocess.check_output(['git','status','--porcelain=v1'],text=True)
          allowed={'.ci/focused/focused_candidate_v4.json','.ci/focused/focused_direct_pass_v4.json'}
          seen={line[3:].split(' -> ')[-1] for line in raw.splitlines()}
          bad=seen-allowed
          if bad: raise SystemExit('unexpected post-verification changes: '+', '.join(sorted(bad)))
          PY
          git add "${PERSISTENT_CANDIDATE}" "${FINAL_MARKER}"
          git commit -m 'ci: record checked-in focused direct-source PASS v4'

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            git fetch origin "${BRANCH}"
            critical="$(git diff --name-only "${GITHUB_SHA}" "${remote_head}" | grep -E \
              '^(PrimalitySheafVerification/(Mock2|Mock2_Advanced|Mock2_FunctionalAnalysis|Mock2_FunctionalAnalysis_Integrated|QYM)\.lean|lean-toolchain|lakefile\.lean|lake-manifest\.json|scripts/(focused_direct_verify_20260807|focused_source_audit_20260807|focused_axiom_audit_dispatch_20260807|focused_environment_axiom_audit_20260807|generate_focused_axiom_audit_20260807|prepare_focused_v4_runtime_20260807|create_checked_in_focused_marker_20260807)\.(py|sh))$' \
              || true)"
            if [[ -n "${critical}" ]]; then
              printf '%s\n' "${critical}" >&2
              echo 'Checked-in sources or verification inputs changed; refusing stale PASS.' >&2
              exit 1
            fi
            git rebase "${remote_head}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Upload direct-first failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: focused-direct-first-v4-failure-${{ github.sha }}
          path: |
            /tmp/focused-proof/direct-first-v4
            /tmp/direct-first-static-audit.json
          if-no-files-found: warn
          retention-days: 30
