name: Codex FA API probe SL action

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-sl-action.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan-init.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe exact SL action bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeSLAction.lean <<'LEAN'
          import Mathlib.Analysis.Complex.UpperHalfPlane.MoebiusAction
          import Mathlib.Tactic
          open Matrix Matrix.SpecialLinearGroup UpperHalfPlane
          open scoped MatrixGroups UpperHalfPlane

          #check UpperHalfPlane.coe_specialLinearGroup_apply
          #check UpperHalfPlane.continuous_im
          #check continuous_const_smul

          example (g : SL(2, ℤ)) (x : ℍ) :
              g • x =
                (Matrix.SpecialLinearGroup.map (Int.castRingHom ℝ) g) • x := by
            apply UpperHalfPlane.ext
            rw [UpperHalfPlane.coe_specialLinearGroup_apply,
                UpperHalfPlane.coe_specialLinearGroup_apply]
            simp

          example (g : SL(2, ℝ)) : Continuous (fun x : ℍ => g • x) := by
            fun_prop
          LEAN
          set +e
          lake env lean -DwarningAsError=false /tmp/ProbeSLAction.lean >/tmp/sl-action.log 2>&1
          code=$?
          set -e
          cat /tmp/sl-action.log
          echo "$code" >/tmp/sl-action.exit
          exit "$code"
      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-sl-action-${{ github.sha }}
          path: |
            /tmp/sl-action.log
            /tmp/sl-action.exit
          if-no-files-found: warn
          retention-days: 30
