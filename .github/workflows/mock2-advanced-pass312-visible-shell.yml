name: Mock2 Advanced pass 312 visible shell materialization

on:
  pull_request:
    branches:
      - master
    paths:
      - '.github/workflows/mock2-advanced-pass312-visible-shell.yml'
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'scripts/apply_three_hundred_twelfth_pass_repairs.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: materialize-mock2-advanced-pass-312-shell-retry-2
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_CANDIDATE_SHA256: 5ed076b1eda61c1702243aa5a391e2db76265d1a28b55834527d15e2dd4f788b
      LOGDIR: build-logs/Mock2_Advanced-materialization

    steps:
      - name: Clone exact triggering commit without marketplace actions
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "${HEAD_BRANCH}" = "${BRANCH}"
          actual_blob="$(git hash-object "${TARGET}")"
          echo "trigger_sha=${HEAD_SHA}"
          echo "starting_blob=${actual_blob}"
          test "${actual_blob}" = "${EXPECTED_START_BLOB}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' \
            "trigger_sha=${HEAD_SHA}" \
            "starting_blob=${actual_blob}" \
            > "${LOGDIR}/snapshot.txt"

      - name: Apply pass 289 through pass 312 and isolate Advanced
        shell: bash
        run: |
          set -euo pipefail
          {
            python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
            python3 scripts/apply_three_hundredth_pass_repairs.py
            python3 scripts/apply_three_hundred_ninth_pass_repairs.py
            python3 scripts/apply_three_hundred_tenth_pass_repairs.py
            python3 scripts/apply_three_hundred_eleventh_pass_repairs.py
            python3 scripts/apply_three_hundred_twelfth_pass_repairs.py
          } 2>&1 | tee "${LOGDIR}/repair-application.log"

          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)

          test "$(git diff --name-only)" = "${TARGET}"
          git diff --check
          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          actual_lines="$(wc -l < "${TARGET}")"
          echo "candidate_sha256=${actual_sha}"
          echo "candidate_lines=${actual_lines}"
          test "${actual_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          printf '%s\n' \
            "candidate_sha256=${actual_sha}" \
            "candidate_lines=${actual_lines}" \
            >> "${LOGDIR}/snapshot.txt"

      - name: Static forbidden-token gate
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re

          src = Path("PrimalitySheafVerification/Mock2_Advanced.lean").read_text(encoding="utf-8")
          out = []
          i = 0
          block_depth = 0
          in_string = False
          escaped = False
          while i < len(src):
              if block_depth:
                  if src.startswith("/-", i):
                      block_depth += 1
                      out.extend("  ")
                      i += 2
                  elif src.startswith("-/", i):
                      block_depth -= 1
                      out.extend("  ")
                      i += 2
                  else:
                      out.append("\n" if src[i] == "\n" else " ")
                      i += 1
                  continue
              if in_string:
                  ch = src[i]
                  out.append("\n" if ch == "\n" else " ")
                  if escaped:
                      escaped = False
                  elif ch == "\\":
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  i += 1
                  continue
              if src.startswith("/-", i):
                  block_depth = 1
                  out.extend("  ")
                  i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n":
                      out.append(" ")
                      i += 1
              elif src[i] == '"':
                  in_string = True
                  out.append(" ")
                  i += 1
              else:
                  out.append(src[i])
                  i += 1

          code = "".join(out)
          checks = {
              "sorry": r"\bsorry\b",
              "admit": r"\badmit\b",
              "line_start_axiom": r"(?m)^\s*axiom\b",
              "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
          }
          bad = False
          for name, pattern in checks.items():
              count = len(list(re.finditer(pattern, code)))
              print(f"{name}: {count}")
              bad |= count != 0
          if block_depth or in_string:
              raise SystemExit("unterminated comment or string")
          if bad:
              raise SystemExit("forbidden executable token detected")
          PY

      - name: Install pinned Lean toolchain without marketplace actions
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/elan" --version
          "${HOME}/.elan/bin/lean" --version
          "${HOME}/.elan/bin/lake" --version

      - name: Restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          "${HOME}/.elan/bin/lake" exe cache get

      - name: Compile candidate twice from deleted project artifacts
        shell: bash
        run: |
          set -euo pipefail
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}" "${LOGDIR}"
          : > "${LOGDIR}/Mock2_Advanced.log"
          for pass in 1 2; do
            rm -f \
              "${outdir}/Mock2_Advanced.olean" \
              "${outdir}/Mock2_Advanced.ilean" \
              "${outdir}/Mock2_Advanced.olean.private"
            echo "===== candidate clean compile ${pass}/2 =====" \
              | tee -a "${LOGDIR}/Mock2_Advanced.log"
            set +e
            "${HOME}/.elan/bin/lake" env lean "${TARGET}" \
              -o "${outdir}/Mock2_Advanced.olean" \
              -i "${outdir}/Mock2_Advanced.ilean" 2>&1 \
              | tee "${LOGDIR}/Mock2_Advanced-pass${pass}.log" \
              | tee -a "${LOGDIR}/Mock2_Advanced.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "${code}" > "${LOGDIR}/exit-code-pass${pass}.txt"
            test "${code}" -eq 0
            test -s "${outdir}/Mock2_Advanced.olean"
            test -s "${outdir}/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
          done
          sha256sum \
            "${TARGET}" \
            "${outdir}/Mock2_Advanced.olean" \
            "${outdir}/Mock2_Advanced.ilean" \
            | tee "${LOGDIR}/sha256.txt"

      - name: Commit only the twice-verified Advanced source
        shell: bash
        run: |
          set -euo pipefail
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger_head=${HEAD_SHA}"
          echo "remote_head=${remote_head}"
          test "${remote_head}" = "${HEAD_SHA}"
          test "$(git diff --name-only)" = "${TARGET}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m 'fix: materialize Mock2 Advanced pass 312 candidate'
          git push origin "HEAD:${BRANCH}"
