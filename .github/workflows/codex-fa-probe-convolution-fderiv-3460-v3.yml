name: Codex FA probe convolution fderiv 3460 v3
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-probe-convolution-fderiv-3460-v3.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe typed convolution-left call
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ConvolutionFDeriv3460ProbeV3.lean <<'LEAN'
          import Mathlib.Analysis.Calculus.ContDiff.Convolution
          open Set Function Filter MeasureTheory
          open scoped Convolution
          variable {μ : Measure ℂ} [SFinite μ] [μ.IsAddLeftInvariant] [μ.IsNegInvariant]
          example (f : ℂ → ℝ) (g : ℂ → ℂ)
              (hcf : HasCompactSupport f)
              (hf : ContDiff ℝ 1 f)
              (hg : LocallyIntegrable g μ)
              (w : ℂ) : True := by
            have h := hcf.hasFDerivAt_convolution_left
              (ContinuousLinearMap.lsmul ℝ ℝ : ℝ →L[ℝ] ℂ →L[ℝ] ℂ)
              hf hg w
            trivial
          LEAN
          lake env lean /tmp/ConvolutionFDeriv3460ProbeV3.lean | tee /tmp/convolution-fderiv-3460-probe-v3.log
      - name: Upload probe log
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-probe-convolution-fderiv-3460-v3-${{ github.sha }}
          path: /tmp/convolution-fderiv-3460-probe-v3.log
          retention-days: 14
