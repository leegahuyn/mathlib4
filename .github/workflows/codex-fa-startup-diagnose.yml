name: Codex FA startup diagnostics

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-startup-diagnose.yml
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  statuses: write
  contents: read

env:
  TARGET_SHA: "781b5d929cb9ae55280872391cb5315bc47ebe91"
  TARGET_RUN_ID: "31509106497"

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    steps:
      - name: Inspect startup failure
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/codex-fa-startup-diagnose
          OUT=build-logs/codex-fa-startup-diagnose
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${TARGET_RUN_ID}" > "$OUT/run.json"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/${GITHUB_REPOSITORY}/commits/${TARGET_SHA}/check-runs?per_page=100" > "$OUT/check-runs.json"
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess
          out=Path('build-logs/codex-fa-startup-diagnose')
          checks=json.loads((out/'check-runs.json').read_text()).get('check_runs',[])
          target=str(os.environ['TARGET_RUN_ID'])
          selected=[]
          for c in checks:
              details=c.get('details_url') or ''
              if target in details or c.get('conclusion') == 'failure':
                  selected.append(c)
          summary=[]
          for c in selected:
              cid=c['id']
              p=out/f'annotations-{cid}.json'
              result=subprocess.run(
                  ['gh','api',f"repos/{os.environ['GITHUB_REPOSITORY']}/check-runs/{cid}/annotations?per_page=100"],
                  check=False, capture_output=True, text=True)
              p.write_text(result.stdout if result.stdout else '[]\n')
              try: annotations=json.loads(result.stdout or '[]')
              except Exception: annotations=[]
              summary.append({
                  'id':cid,
                  'name':c.get('name'),
                  'status':c.get('status'),
                  'conclusion':c.get('conclusion'),
                  'details_url':details,
                  'output':c.get('output'),
                  'annotations':annotations,
                  'annotations_api_exit':result.returncode,
                  'annotations_api_stderr':result.stderr,
              })
          (out/'SUMMARY.json').write_text(json.dumps(summary,indent=2,sort_keys=True)+'\n')
          PY

      - name: Upload startup diagnostics
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-startup-diagnose-${{ github.sha }}
          path: build-logs/codex-fa-startup-diagnose
          if-no-files-found: error
          retention-days: 30

      - name: Publish diagnostic-run locator
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${TARGET_SHA}" \
            -f state=failure \
            -f context='codex/fa-startup-diagnostic' \
            -f description="startup diagnostic run ${GITHUB_RUN_ID}" \
            -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"
