name: Archive FINAL AUTHORITY evidence assets v3

"on":
  push:
    branches:
      - ops/formalization-final-release-8f7-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v3.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-final-authority-assets-v3
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      REPO: leegahuyn/mathlib4
      COMMIT: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
      AUTHORITY_BRANCH: gpt/final-authority-pass-20260821
      SOURCE_ARCHIVE_BRANCH: archive/formalization-final-2026-08-21
      ASSET_BRANCH: archive/formalization-final-assets-2026-08-21
      OUT: FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f-PERMANENT
    steps:
      - name: Checkout exact immutable authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          fetch-depth: 0
          persist-credentials: true

      - name: Verify frozen authority pointers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git ls-remote origin "refs/heads/$AUTHORITY_BRANCH" | awk '{print $1}')" = "$COMMIT"
          test "$(git ls-remote origin "refs/heads/$SOURCE_ARCHIVE_BRANCH" | awk '{print $1}')" = "$COMMIT"
          test "$(cat lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum lake-manifest.json | awk '{print $1}')" = 672474eb93bc14c66cd1ff45203c451987fe525f7b5d13ecd83140be46434b26

      - name: Download original evidence and build archive directory
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "/tmp/$OUT" /tmp/terminal
          download() {
            curl -LfsS --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$1/zip" \
              -o "/tmp/$OUT/$2"
            echo "$3  /tmp/$OUT/$2" | sha256sum --check --strict
          }
          download 9435161106 final-authority-pr-gate-v8-32443566530-attempt1.zip 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
          download 9398192196 qym-gb0-independent-replay-32344604895-attempt1.zip ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
          download 9436985567 final-authority-terminal-v12-32455051059-attempt1.zip a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee
          unzip -q "/tmp/$OUT/final-authority-terminal-v12-32455051059-attempt1.zip" -d /tmp/terminal
          cp /tmp/terminal/{FINAL_13_ROOTS.txt,FINAL_13_BUILD_RESULTS.json,BUILDALL_RESULT.json,CLEAN_BUILD_1_RESULT.json,CLEAN_BUILD_2_RESULT.json,FINAL_15_CHECKLIST_RESULT.json,FINAL_SOURCE_IDENTITY.json,FORBIDDEN_AUDIT.json,AXIOM_AUDIT.json,QYM_CANONICAL_REPLAY_RESULT.json,MOCK3_CANONICAL_RESULT.json,FINAL_STATUS_CARD.md,FINAL_TRUE_PASS_REPORT.md,TERMINAL_EVIDENCE_INDEX.json,FINAL_EXIT} "/tmp/$OUT/"

          jq -e '.pass==true and .counts=={"PASS":13,"FAIL":0,"SKIPPED":0,"NOT_RUN":0} and .bridge_counts=={"PASS":2,"FAIL":0,"SKIPPED":0,"NOT_RUN":0}' "/tmp/$OUT/FINAL_13_BUILD_RESULTS.json" >/dev/null
          jq -e '.pass==true and .aggregate_result.exit==0 and .aggregate_result.error_headers==0 and .aggregate_result.panic_lines==0' "/tmp/$OUT/BUILDALL_RESULT.json" >/dev/null
          jq -e '.pass==true and .source_commit=="8f7e861f5f76c0aa5d347e0de865516a1ba23922"' "/tmp/$OUT/CLEAN_BUILD_1_RESULT.json" >/dev/null
          jq -e '.pass==true and .source_commit=="8f7e861f5f76c0aa5d347e0de865516a1ba23922"' "/tmp/$OUT/CLEAN_BUILD_2_RESULT.json" >/dev/null
          jq -e '.pass==true and .counts=={"PASS":15,"FAIL":0,"SKIPPED":0,"NOT_RUN":0}' "/tmp/$OUT/FINAL_15_CHECKLIST_RESULT.json" >/dev/null
          jq -e '.pass==true and .tested_source_commit=="8f7e861f5f76c0aa5d347e0de865516a1ba23922"' "/tmp/$OUT/FINAL_SOURCE_IDENTITY.json" >/dev/null
          jq -e '.pass==true and .forbidden_count==0' "/tmp/$OUT/FORBIDDEN_AUDIT.json" >/dev/null
          jq -e '.pass==true' "/tmp/$OUT/AXIOM_AUDIT.json" >/dev/null

          git archive --format=tar --prefix=formalization-final-source-8f7e861f/ "$COMMIT" \
            PrimalitySheafVerification lean-toolchain lake-manifest.json lakefile.lean scripts \
            | gzip -n -9 > "/tmp/$OUT/formalization-final-source-8f7e861f.tar.gz"
          test "$(gzip -dc "/tmp/$OUT/formalization-final-source-8f7e861f.tar.gz" | git get-tar-commit-id)" = "$COMMIT"

          cat > "/tmp/$OUT/TAG_RELEASE_PERMISSION_BLOCKER.json" <<'EOF'
          {
            "status": "TAG_WRITE_PERMISSION_FAILURE",
            "canonical_tag_requested": "formalization-final-2026-08-21",
            "canonical_tag_created": false,
            "release_created": false,
            "authority_invalidated": false,
            "reason": "GitHub rejected annotated-tag push and REST ref creation because the connected token lacks workflows permission; no PAT or deploy key was available.",
            "safety_decision": "No lightweight tag, wrong-target tag, force update, merge-commit authority, or branch-targeted Release was created."
          }
          EOF
          sed -i 's/^          //' "/tmp/$OUT/TAG_RELEASE_PERMISSION_BLOCKER.json"

          source_sha="$(sha256sum "/tmp/$OUT/formalization-final-source-8f7e861f.tar.gz" | awk '{print $1}')"
          cat > "/tmp/$OUT/FINAL_AUTHORITY_RECORD.json" <<EOF
          {
            "schema": "lean-formalization-final-authority-preservation-record/v3",
            "repository": "leegahuyn/mathlib4",
            "authority_commit": "$COMMIT",
            "authority_branch": "$AUTHORITY_BRANCH",
            "source_archive_branch": "$SOURCE_ARCHIVE_BRANCH",
            "permanent_asset_branch": "$ASSET_BRANCH",
            "canonical_annotated_tag": "formalization-final-2026-08-21",
            "canonical_tag_status": "TAG_WRITE_PERMISSION_FAILURE",
            "github_release_status": "NOT_CREATED_TAG_BLOCKED",
            "source_snapshot_sha256": "$source_sha",
            "full_artifact_sha256": "81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32",
            "qym_artifact_sha256": "ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830",
            "terminal_artifact_sha256": "a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee",
            "final13": "13/13 PASS",
            "bridges": "2/2 PASS",
            "buildall": "PASS",
            "clean_builds": "2/2 PASS",
            "checklist": "15/15 PASS",
            "forbidden": 0,
            "panic": 0,
            "axiom_audit": "PASS",
            "source_identity": "PASS",
            "mathematical_final_authority": "PASS",
            "future_source_changes_covered": false
          }
          EOF
          sed -i 's/^          //' "/tmp/$OUT/FINAL_AUTHORITY_RECORD.json"
          jq -e '.authority_commit=="8f7e861f5f76c0aa5d347e0de865516a1ba23922" and .mathematical_final_authority=="PASS"' "/tmp/$OUT/FINAL_AUTHORITY_RECORD.json" >/dev/null

          cat > "/tmp/$OUT/FREEZE_STATUS.json" <<EOF
          {
            "canonical_authority_commit": "$COMMIT",
            "authority_branch_unchanged": true,
            "source_archive_branch_exact": true,
            "permanent_asset_branch": "$ASSET_BRANCH",
            "canonical_annotated_tag": "BLOCKED_NOT_CREATED",
            "github_release": "BLOCKED_NOT_CREATED",
            "mathematical_source_modified": false,
            "force_push_used": false
          }
          EOF
          sed -i 's/^          //' "/tmp/$OUT/FREEZE_STATUS.json"

          cat > "/tmp/$OUT/FINAL_AUTHORITY_RECORD.md" <<EOF
          # Lean Formalization FINAL AUTHORITY permanent evidence archive

          Exact immutable authority: $COMMIT
          Authority branch: $AUTHORITY_BRANCH
          Exact source pointer: $SOURCE_ARCHIVE_BRANCH
          Permanent evidence branch: $ASSET_BRANCH

          Final13 13/13 PASS; bridges 2/2 PASS; BuildAll PASS; clean builds 2/2 PASS;
          checklist 15/15 PASS; forbidden 0; panic 0; axiom/source identity PASS.

          Original evidence SHA256:
          - Full actual Lean: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
          - Independent QYM: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
          - Terminal verifier: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee

          The canonical annotated tag and Release are blocked only by missing workflows write permission.
          Mathematical FINAL AUTHORITY remains PASS. No Lean source was changed.
          EOF
          sed -i 's/^          //' "/tmp/$OUT/FINAL_AUTHORITY_RECORD.md"

          cat > "/tmp/$OUT/VERIFY_FINAL_AUTHORITY.sh" <<'EOF'
          #!/usr/bin/env bash
          set -euo pipefail
          P="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          (cd "$P" && sha256sum --check --strict SHA256SUMS.txt)
          jq -e '.counts.PASS==13 and .bridge_counts.PASS==2' "$P/FINAL_13_BUILD_RESULTS.json" >/dev/null
          jq -e '.aggregate_result.exit==0 and .aggregate_result.error_headers==0' "$P/BUILDALL_RESULT.json" >/dev/null
          jq -e '.counts.PASS==15' "$P/FINAL_15_CHECKLIST_RESULT.json" >/dev/null
          jq -e '.tested_source_commit=="8f7e861f5f76c0aa5d347e0de865516a1ba23922"' "$P/FINAL_SOURCE_IDENTITY.json" >/dev/null
          test "$(gzip -dc "$P/formalization-final-source-8f7e861f.tar.gz" | git get-tar-commit-id)" = 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          echo VERIFY_FINAL_AUTHORITY=PASS
          EOF
          sed -i 's/^          //' "/tmp/$OUT/VERIFY_FINAL_AUTHORITY.sh"
          chmod +x "/tmp/$OUT/VERIFY_FINAL_AUTHORITY.sh"

          (cd "/tmp/$OUT" && find . -maxdepth 1 -type f ! -name SHA256SUMS.txt -printf '%f\n' | sort | while read -r f; do sha256sum "$f"; done > SHA256SUMS.txt)
          "/tmp/$OUT/VERIFY_FINAL_AUTHORITY.sh"
          (cd /tmp && zip -q -9 -r "$OUT.zip" "$OUT")
          echo "$(sha256sum "/tmp/$OUT.zip" | awk '{print $1}')  $OUT.zip" > "/tmp/$OUT/PACKAGE_ARCHIVE_SHA256.txt"

      - name: Push isolated permanent assets branch
        shell: bash
        run: |
          set -euo pipefail
          test -z "$(git ls-remote origin "refs/heads/$ASSET_BRANCH" | awk '{print $1}')"
          git config user.name Formalization-Archive
          git config user.email 102484661+leegahuyn@users.noreply.github.com
          git checkout --orphan "$ASSET_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "/tmp/$OUT" ./
          cp "/tmp/$OUT.zip" ./
          cat > README.md <<EOF
          # FINAL AUTHORITY permanent evidence branch

          Mathematical authority: $COMMIT
          This branch contains archival assets only and is not mathematical authority.
          See $OUT/FINAL_AUTHORITY_RECORD.md and $OUT/TAG_RELEASE_PERMISSION_BLOCKER.json.
          EOF
          sed -i 's/^          //' README.md
          git add README.md "$OUT" "$OUT.zip"
          git commit -m "archive: preserve exact 8f7e861f FINAL AUTHORITY evidence"
          archive_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$ASSET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$ASSET_BRANCH" | awk '{print $1}')" = "$archive_commit"
          echo "$archive_commit" > /tmp/ASSET_BRANCH_COMMIT.txt
          echo PERMANENT_GITHUB_ASSET_BRANCH=PASS

      - name: Preserve archive publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-permanent-assets-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            /tmp/FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f-PERMANENT
            /tmp/FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f-PERMANENT.zip
            /tmp/ASSET_BRANCH_COMMIT.txt
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
