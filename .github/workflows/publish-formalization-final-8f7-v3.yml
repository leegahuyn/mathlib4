name: Publish Formalization FINAL AUTHORITY 8f7 v3 credential probe

"on":
  push:
    branches:
      - ops/formalization-final-release-8f7-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v3.yml
  pull_request:
    branches:
      - gpt/final-authority-pass-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v3.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pull-requests: read

concurrency:
  group: publish-formalization-final-8f7-v3-probe
  cancel-in-progress: false

jobs:
  probe-credentials:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Report credential names with values hidden
        shell: bash
        env:
          PAT_PRESENT: ${{ secrets.PAT != '' }}
          GH_PAT_PRESENT: ${{ secrets.GH_PAT != '' }}
          GITHUB_PAT_PRESENT: ${{ secrets.GITHUB_PAT != '' }}
          REPO_PAT_PRESENT: ${{ secrets.REPO_PAT != '' }}
          WORKFLOW_PAT_PRESENT: ${{ secrets.WORKFLOW_PAT != '' }}
          ACTIONS_PAT_PRESENT: ${{ secrets.ACTIONS_PAT != '' }}
          PERSONAL_ACCESS_TOKEN_PRESENT: ${{ secrets.PERSONAL_ACCESS_TOKEN != '' }}
          RELEASE_TOKEN_PRESENT: ${{ secrets.RELEASE_TOKEN != '' }}
          RELEASE_PAT_PRESENT: ${{ secrets.RELEASE_PAT != '' }}
          TAG_TOKEN_PRESENT: ${{ secrets.TAG_TOKEN != '' }}
          ADMIN_PAT_PRESENT: ${{ secrets.ADMIN_PAT != '' }}
          MATHLIB_PAT_PRESENT: ${{ secrets.MATHLIB_PAT != '' }}
          CODEX_PAT_PRESENT: ${{ secrets.CODEX_PAT != '' }}
          CODEX_GITHUB_TOKEN_PRESENT: ${{ secrets.CODEX_GITHUB_TOKEN != '' }}
          CHATGPT_GITHUB_TOKEN_PRESENT: ${{ secrets.CHATGPT_GITHUB_TOKEN != '' }}
          OPENAI_GITHUB_TOKEN_PRESENT: ${{ secrets.OPENAI_GITHUB_TOKEN != '' }}
          BOT_TOKEN_PRESENT: ${{ secrets.BOT_TOKEN != '' }}
          SSH_PRIVATE_KEY_PRESENT: ${{ secrets.SSH_PRIVATE_KEY != '' }}
          DEPLOY_KEY_PRESENT: ${{ secrets.DEPLOY_KEY != '' }}
          GH_SSH_PRIVATE_KEY_PRESENT: ${{ secrets.GH_SSH_PRIVATE_KEY != '' }}
        run: |
          set -euo pipefail
          env | grep '_PRESENT=' | sort
