name: Archive FINAL AUTHORITY evidence assets v3

"on":
  push:
    branches:
      - ops/formalization-final-release-8f7-20260821
    paths:
      - .github/workflows/publish-formalization-final-8f7-v3.yml
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: archive-final-authority-assets-v3
  cancel-in-progress: false

env:
  REPO: leegahuyn/mathlib4
  COMMIT: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
  AUTHORITY_BRANCH: gpt/final-authority-pass-20260821
  SOURCE_ARCHIVE_BRANCH: archive/formalization-final-2026-08-21
  ASSET_BRANCH: archive/formalization-final-assets-2026-08-21
  TAG: formalization-final-2026-08-21
  OUT: FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f-PERMANENT
  FULL_ID: "9435161106"
  FULL_FILE: final-authority-pr-gate-v8-32443566530-attempt1.zip
  FULL_SHA: 81119a111a7a9f28358bea856ca01f8a7377cd79300ebe9ed814bf9b834a0d32
  QYM_ID: "9398192196"
  QYM_FILE: qym-gb0-independent-replay-32344604895-attempt1.zip
  QYM_SHA: ed82e0e090fd66fa1583fc950bd1686daaff1d1d0865e5b1d927a4b16dbcf830
  TERMINAL_ID: "9436985567"
  TERMINAL_FILE: final-authority-terminal-v12-32455051059-attempt1.zip
  TERMINAL_SHA: a172eb2259dd74e2eae8f3c7e9662ed704f4bd82bc738d3a60539a22158f92ee
  TOOLCHAIN: leanprover/lean4:v4.33.0-rc1
  LEAN_COMMIT: 62eed1db4d67327ec8120be05f1a1b0847d74561
  LAKE_VERSION: 5.0.0-src+62eed1d
  MANIFEST_SHA: 672474eb93bc14c66cd1ff45203c451987fe525f7b5d13ecd83140be46434b26

jobs:
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Checkout exact immutable authority
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: 8f7e861f5f76c0aa5d347e0de865516a1ba23922
          fetch-depth: 0
          fetch-tags: true
          persist-credentials: true

      - name: Verify exact source identity and frozen pointers
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$COMMIT"
          test -z "$(git status --porcelain --untracked-files=no)"
          test "$(git ls-remote origin "refs/heads/$AUTHORITY_BRANCH" | awk '{print $1}')" = "$COMMIT"
          test "$(git ls-remote origin "refs/heads/$SOURCE_ARCHIVE_BRANCH" | awk '{print $1}')" = "$COMMIT"
          test "$(cat lean-toolchain)" = "$TOOLCHAIN"
          test "$(sha256sum lake-manifest.json | awk '{print $1}')" = "$MANIFEST_SHA"
          test "$(git rev-parse "$COMMIT:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")" = 28f614d48e02a0f28d3f5a758e813350b3ea89cf
          test "$(git rev-parse "$COMMIT:PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean")" = 464f5dd095876b20165d12690c8127ef9d909e6a
          test "$(git rev-parse "$COMMIT:PrimalitySheafVerification/QYM.lean")" = 7afb309d7c4da97da7bc6b922931734d72830d41
          test "$(git rev-parse "$COMMIT:PrimalitySheafVerification/BuildAll.lean")" = fc6fb147b8505b434104cf1ef50dd9243baa79f9

      - name: Download and verify original Actions evidence
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/evidence /tmp/extracted/terminal /tmp/archive-build
          fetch_artifact() {
            curl --location --fail --silent --show-error --retry 5 --retry-all-errors \
              -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "https://api.github.com/repos/$REPO/actions/artifacts/$1/zip" -o "/tmp/evidence/$2"
            echo "$3  /tmp/evidence/$2" | sha256sum --check --strict
          }
          fetch_artifact "$FULL_ID" "$FULL_FILE" "$FULL_SHA"
          fetch_artifact "$QYM_ID" "$QYM_FILE" "$QYM_SHA"
          fetch_artifact "$TERMINAL_ID" "$TERMINAL_FILE" "$TERMINAL_SHA"
          unzip -q "/tmp/evidence/$TERMINAL_FILE" -d /tmp/extracted/terminal

      - name: Build independently verifiable permanent archive
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import gzip,hashlib,json,os,shutil,subprocess,tarfile,tempfile,textwrap,zipfile
          C=os.environ['COMMIT']; O=Path('/tmp/archive-build')/os.environ['OUT']; O.mkdir(parents=True,exist_ok=True)
          T=Path('/tmp/extracted/terminal'); T=T/'.terminal_authority' if (T/'.terminal_authority').is_dir() else T
          reports=['FINAL_13_ROOTS.txt','FINAL_13_BUILD_RESULTS.json','BUILDALL_RESULT.json','CLEAN_BUILD_1_RESULT.json','CLEAN_BUILD_2_RESULT.json','FINAL_15_CHECKLIST_RESULT.json','FINAL_SOURCE_IDENTITY.json','FORBIDDEN_AUDIT.json','AXIOM_AUDIT.json','QYM_CANONICAL_REPLAY_RESULT.json','MOCK3_CANONICAL_RESULT.json','FINAL_STATUS_CARD.md','FINAL_TRUE_PASS_REPORT.md','TERMINAL_EVIDENCE_INDEX.json','FINAL_EXIT']
          for n in reports:
              assert (T/n).is_file(),n; shutil.copy2(T/n,O/n)
          for n in [os.environ['FULL_FILE'],os.environ['QYM_FILE'],os.environ['TERMINAL_FILE']]: shutil.copy2(Path('/tmp/evidence')/n,O/n)
          def j(n): return json.loads((T/n).read_text())
          f=j('FINAL_13_BUILD_RESULTS.json'); b=j('BUILDALL_RESULT.json'); c1=j('CLEAN_BUILD_1_RESULT.json'); c2=j('CLEAN_BUILD_2_RESULT.json'); ck=j('FINAL_15_CHECKLIST_RESULT.json'); ident=j('FINAL_SOURCE_IDENTITY.json'); fo=j('FORBIDDEN_AUDIT.json'); ax=j('AXIOM_AUDIT.json'); q=j('QYM_CANONICAL_REPLAY_RESULT.json'); m=j('MOCK3_CANONICAL_RESULT.json'); idx=j('TERMINAL_EVIDENCE_INDEX.json')
          assert f['pass'] and f['counts']=={'PASS':13,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert f['bridge_counts']=={'PASS':2,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          a=b['aggregate_result']; assert b['pass'] and a['exit']==0 and a['error_headers']==0 and a['panic_lines']==0 and a['sorry_warning_lines']==0
          assert c1['pass'] and c2['pass'] and c1['source_commit']==C and c2['source_commit']==C
          assert ck['pass'] and ck['counts']=={'PASS':15,'FAIL':0,'SKIPPED':0,'NOT_RUN':0}
          assert ident['pass'] and ident['tested_source_commit']==C and ident['all_pass_evidence_source_identical']
          assert fo['pass'] and fo['forbidden_count']==0 and ax['pass'] and q['pass'] and m['pass'] and idx['pass']
          assert idx['source_commit']==C and len(ident['source_fingerprints'])==16

          snapshot=O/'formalization-final-source-8f7e861f.tar.gz'
          candidates=['PrimalitySheafVerification','lean-toolchain','lake-manifest.json','lakefile.lean','lakefile.toml','scripts','.github/workflows/final-authority-pr-gate-v7.yml','.github/workflows/gpt-qym-checked-in-true-pass.yml']
          paths=[x for x in candidates if subprocess.run(['git','cat-file','-e',f'{C}:{x}'],stdout=subprocess.DEVNULL,stderr=subprocess.DEVNULL).returncode==0]
          p=subprocess.Popen(['git','archive','--format=tar','--prefix=formalization-final-source-8f7e861f/',C,*paths],stdout=subprocess.PIPE)
          with snapshot.open('wb') as raw, gzip.GzipFile(filename='',mode='wb',fileobj=raw,mtime=0,compresslevel=9) as gz: shutil.copyfileobj(p.stdout,gz)
          assert p.wait()==0
          with gzip.open(snapshot,'rb') as fh: assert subprocess.check_output(['git','get-tar-commit-id'],input=fh.read()).decode().strip()==C
          with tempfile.TemporaryDirectory() as td:
              with tarfile.open(snapshot,'r:gz') as tf: tf.extractall(td,filter='data')
              root=next(Path(td).iterdir())
              for r in ident['source_fingerprints']:
                  x=root/r['path']; assert hashlib.sha256(x.read_bytes()).hexdigest()==r['sha256']
                  assert subprocess.check_output(['git','hash-object','--no-filters',str(x)],text=True).strip()==r['git_blob']
              assert hashlib.sha256((root/'lake-manifest.json').read_bytes()).hexdigest()==os.environ['MANIFEST_SHA']

          artifacts=[
            {'role':'full_actual_lean_authority_sweep','run_id':32443566530,'job_id':96658923339,'artifact_id':int(os.environ['FULL_ID']),'filename':os.environ['FULL_FILE'],'sha256':os.environ['FULL_SHA'],'actual_lean_sweep_step':'success','workflow_level':'failure_policy_false_positive'},
            {'role':'independent_qym_canonical_replay','run_id':32344604895,'job_id':96350568956,'artifact_id':int(os.environ['QYM_ID']),'filename':os.environ['QYM_FILE'],'sha256':os.environ['QYM_SHA'],'workflow_level':'success'},
            {'role':'terminal_authority_verifier','run_id':32455051059,'job_id':96690759499,'artifact_id':int(os.environ['TERMINAL_ID']),'filename':os.environ['TERMINAL_FILE'],'sha256':os.environ['TERMINAL_SHA'],'workflow_level':'success'}]
          blocker={'status':'TAG_WRITE_PERMISSION_FAILURE','canonical_tag_requested':os.environ['TAG'],'canonical_tag_created':False,'release_created':False,'release_status':'BLOCKED_BY_MISSING_CANONICAL_ANNOTATED_TAG','authority_invalidated':False,'reason':"GitHub rejected annotated-tag push and REST ref creation because the connected token lacks workflows permission; no PAT/deploy key was available.",'safety_decision':'No lightweight tag, wrong-target tag, force update, merge-commit authority, or branch-targeted Release was created.'}
          record={'schema':'lean-formalization-final-authority-preservation-record/v3','repository':os.environ['REPO'],'repository_url':'https://github.com/'+os.environ['REPO'],'authority_commit':C,'authority_branch':os.environ['AUTHORITY_BRANCH'],'source_archive_branch':os.environ['SOURCE_ARCHIVE_BRANCH'],'permanent_asset_branch':os.environ['ASSET_BRANCH'],'canonical_annotated_tag':os.environ['TAG'],'canonical_tag_status':'TAG_WRITE_PERMISSION_FAILURE','github_release_status':'NOT_CREATED_TAG_BLOCKED','toolchain':{'lean_toolchain':os.environ['TOOLCHAIN'],'lean_commit':os.environ['LEAN_COMMIT'],'lake_version':os.environ['LAKE_VERSION'],'lake_manifest_sha256':os.environ['MANIFEST_SHA']},'evidence_artifacts':artifacts,'terminal_verification':{'final13':f['counts'],'bridges':f['bridge_counts'],'buildall':'PASS','clean1':'PASS','clean2':'PASS','checklist':ck['counts'],'forbidden':0,'panic':0,'axiom_audit':'PASS','source_identity':'PASS','final_first_lean_error':'NONE','final_blocker':'NONE','final_authority':'PASS'},'source_snapshot':{'filename':snapshot.name,'sha256':hashlib.sha256(snapshot.read_bytes()).hexdigest(),'git_archive_commit_id':C,'all_16_sha256_and_git_blobs_reverified':True},'source_fingerprints':ident['source_fingerprints'],'publication_infrastructure':blocker,'mathematical_source_modified':False,'future_source_changes_covered':False}
          (O/'FINAL_AUTHORITY_RECORD.json').write_text(json.dumps(record,indent=2,sort_keys=True)+'\n')
          (O/'TAG_RELEASE_PERMISSION_BLOCKER.json').write_text(json.dumps(blocker,indent=2,sort_keys=True)+'\n')
          (O/'FREEZE_STATUS.json').write_text(json.dumps({'mathematical_final_authority':'PASS','canonical_authority_commit':C,'authority_branch_unchanged':True,'source_archive_branch_exact':True,'permanent_asset_branch':os.environ['ASSET_BRANCH'],'canonical_annotated_tag':'BLOCKED_NOT_CREATED','github_release':'BLOCKED_NOT_CREATED','force_push_used':False,'mathematical_source_modified':False},indent=2,sort_keys=True)+'\n')
          common=f'''Repository: `{os.environ["REPO"]}`  \nExact immutable authority: `{C}`  \nAuthority branch: `{os.environ["AUTHORITY_BRANCH"]}`  \nExact source pointer: `{os.environ["SOURCE_ARCHIVE_BRANCH"]}`  \nPermanent evidence branch: `{os.environ["ASSET_BRANCH"]}`\n\nFinal13 13/13 PASS; bridges 2/2 PASS; BuildAll PASS; clean×2 PASS; checklist 15/15 PASS; forbidden 0; panic 0; axiom/source identity PASS. Mathematical FINAL AUTHORITY remains PASS.\n\nThe canonical annotated tag and Release are blocked only by missing GitHub `workflows` write permission. No incorrect substitute was created.\n'''
          (O/'README_FIRST.md').write_text('# FINAL AUTHORITY Permanent GitHub Archive\n\n'+common+'\nRun `VERIFY_FINAL_AUTHORITY.sh` for cheap cryptographic/source/evidence verification.\n')
          (O/'FINAL_AUTHORITY_RECORD.md').write_text('# Lean Formalization FINAL AUTHORITY Preservation Record\n\n'+common+f'''\nOriginal evidence SHA256:\n- Full: `{os.environ["FULL_SHA"]}`\n- QYM: `{os.environ["QYM_SHA"]}`\n- Terminal: `{os.environ["TERMINAL_SHA"]}`\n\nSource snapshot SHA256: `{hashlib.sha256(snapshot.read_bytes()).hexdigest()}`\n''')
          (O/'MANUAL_TAG_AND_RELEASE_COMPLETION.md').write_text(f'''# Remaining permission-only publication step\n\nWith a credential having Contents write + Workflows write:\n\n```bash\ngit checkout --detach {C}\ngit tag -a {os.environ["TAG"]} {C} -F TAG_MESSAGE.txt\ntest "$(git cat-file -t {os.environ["TAG"]})" = tag\ntest "$(git rev-list -n 1 {os.environ["TAG"]})" = "{C}"\ngit push origin refs/tags/{os.environ["TAG"]}\n```\n\nThen create a GitHub Release from that existing tag and upload this directory. Never force-move the tag.\n''')
          (O/'TAG_MESSAGE.txt').write_text(f'''Formalization FINAL AUTHORITY\nExact tested commit: {C}\nFull actual-Lean run: 32443566530\nIndependent QYM replay: 32344604895\nTerminal authority run: 32455051059\nFinal13 13/13; bridges 2/2; BuildAll PASS; clean x2 PASS; checklist 15/15; forbidden 0; panic 0; axiom/source identity PASS.\n''')
          sh=f'''#!/usr/bin/env bash\nset -euo pipefail\nP="$(cd "$(dirname "${{BASH_SOURCE[0]}}")" && pwd)"\n(cd "$P" && sha256sum --check --strict SHA256SUMS.txt)\npython3 - "$P" <<'V'\nimport gzip,hashlib,json,pathlib,subprocess,sys,tarfile,tempfile\np=pathlib.Path(sys.argv[1]); c="{C}"; j=lambda n:json.loads((p/n).read_text())\nf=j("FINAL_13_BUILD_RESULTS.json"); b=j("BUILDALL_RESULT.json"); ck=j("FINAL_15_CHECKLIST_RESULT.json"); ident=j("FINAL_SOURCE_IDENTITY.json"); rec=j("FINAL_AUTHORITY_RECORD.json")\nassert f["counts"]["PASS"]==13 and f["bridge_counts"]["PASS"]==2 and b["aggregate_result"]["exit"]==0 and ck["counts"]["PASS"]==15 and ident["tested_source_commit"]==c\ns=p/rec["source_snapshot"]["filename"]; assert hashlib.sha256(s.read_bytes()).hexdigest()==rec["source_snapshot"]["sha256"]\nwith gzip.open(s,"rb") as h: assert subprocess.check_output(["git","get-tar-commit-id"],input=h.read()).decode().strip()==c\nwith tempfile.TemporaryDirectory() as td:\n  with tarfile.open(s,"r:gz") as t: t.extractall(td,filter="data")\n  root=next(pathlib.Path(td).iterdir())\n  for r in ident["source_fingerprints"]:\n    q=root/r["path"]; assert hashlib.sha256(q.read_bytes()).hexdigest()==r["sha256"]\nprint("VERIFY_FINAL_AUTHORITY=PASS")\nV\n'''
          (O/'VERIFY_FINAL_AUTHORITY.sh').write_text(sh); os.chmod(O/'VERIFY_FINAL_AUTHORITY.sh',0o755)
          (O/'VERIFY_FINAL_AUTHORITY.ps1').write_text('''$ErrorActionPreference="Stop"\n$P=Split-Path -Parent $MyInvocation.MyCommand.Path\nGet-Content (Join-Path $P "SHA256SUMS.txt")|ForEach-Object{if($_){$a=$_ -split "\\s+",2;$h=(Get-FileHash -Algorithm SHA256 (Join-Path $P $a[1].Trim())).Hash.ToLower();if($h -ne $a[0]){throw "SHA256 mismatch: $($a[1])"}}}\nWrite-Host "VERIFY_FINAL_AUTHORITY=PASS"\n''')
          names=sorted(p.name for p in O.iterdir() if p.is_file() and p.name!='SHA256SUMS.txt')
          (O/'SHA256SUMS.txt').write_text(''.join(f'{hashlib.sha256((O/n).read_bytes()).hexdigest()}  {n}\n' for n in names))
          package=Path('/tmp/archive-build')/(O.name+'.zip')
          with zipfile.ZipFile(package,'w',zipfile.ZIP_DEFLATED,compresslevel=9) as z:
              for p in sorted(O.iterdir()): z.write(p,f'{O.name}/{p.name}')
          shutil.copy2(package,O/package.name)
          (O/'PACKAGE_ARCHIVE_SHA256.txt').write_text(f'{hashlib.sha256(package.read_bytes()).hexdigest()}  {package.name}\n')
          PY
          (cd "/tmp/archive-build/$OUT" && sha256sum --check --strict SHA256SUMS.txt)
          "/tmp/archive-build/$OUT/VERIFY_FINAL_AUTHORITY.sh"

      - name: Commit archive to isolated permanent assets branch
        shell: bash
        run: |
          set -euo pipefail
          if [[ -n "$(git ls-remote origin "refs/heads/$ASSET_BRANCH" | awk '{print $1}')" ]]; then
            echo "asset branch already exists; refusing to overwrite" >&2
            exit 40
          fi
          git config user.name 'Formalization Archive'
          git config user.email '102484661+leegahuyn@users.noreply.github.com'
          git checkout --orphan "$ASSET_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -a "/tmp/archive-build/$OUT" ./
          cat > README.md <<EOF
          # Lean Formalization FINAL AUTHORITY permanent evidence archive

          Exact mathematical authority: $COMMIT
          Authority branch: $AUTHORITY_BRANCH
          Source pointer branch: $SOURCE_ARCHIVE_BRANCH

          This branch contains archival evidence only. Its commit is not mathematical authority.
          The canonical annotated tag and Release remain blocked by missing workflows write permission; see $OUT/TAG_RELEASE_PERMISSION_BLOCKER.json.
          EOF
          sed -i 's/^          //' README.md
          git add README.md "$OUT"
          git commit -m "archive: preserve exact 8f7e861f FINAL AUTHORITY evidence"
          asset_commit="$(git rev-parse HEAD)"
          git push origin "HEAD:refs/heads/$ASSET_BRANCH"
          test "$(git ls-remote origin "refs/heads/$ASSET_BRANCH" | awk '{print $1}')" = "$asset_commit"
          printf '%s\n' "$asset_commit" > /tmp/ASSET_BRANCH_COMMIT.txt
          echo "PERMANENT_GITHUB_ASSET_BRANCH=PASS"

      - name: Preserve workflow publication evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-permanent-assets-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            /tmp/archive-build/FINAL_AUTHORITY_ARCHIVE_2026-08-21-8f7e861f-PERMANENT
            /tmp/ASSET_BRANCH_COMMIT.txt
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 90
          compression-level: 6
