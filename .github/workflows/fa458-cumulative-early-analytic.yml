name: FA458 cumulative early-analytic strict direct Lean matrix

on:
  push:
    branches: [fix/fa458-cumulative-early-analytic-20260810]
    paths:
      - .github/workflows/fa458-cumulative-early-analytic.yml
      - scripts/fa458_candidate_ci.sh
      - scripts/fa458_prepare_cumulative_early.py
      - scripts/fa458_record_direct_metric_strict.py
      - scripts/fa458_selector_strict_ci.sh
      - scripts/fa453_select_compact_energy.py
      - scripts/fa453_selector_ci.sh
      - scripts/fa442_record_direct_metric.py
      - scripts/fa442_prepare_same_height_candidate.py
      - PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
  pull_request:
    branches: [fix/fa458-cumulative-early-analytic-20260810]
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa458-cumulative-early-${{ github.run_id }}
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa458-cumulative-early-analytic-20260810
  SOURCE_REF: ${{ github.event.pull_request.base.sha || github.sha }}

jobs:
  candidate:
    name: candidate (${{ matrix.variant }})
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    strategy:
      fail-fast: false
      max-parallel: 4
      matrix:
        variant: [baseline, direct_union, direct_union_explicit, direct_union_abs]
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '240'
    steps:
      - name: Checkout immutable FA458 source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 2500
          persist-credentials: false

      - name: Generate cumulative candidate, install pinned Lean/cache, and execute all direct Lean commands
        shell: bash
        run: bash scripts/fa458_candidate_ci.sh

      - name: Upload candidate source and complete strict direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa453-candidate-${{ matrix.variant }}
          path: build-logs/fa453-compact-energy/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual Lean execution, strict diagnostics, prerequisites, identity and trust
        if: always()
        shell: bash
        run: |
          python3 - "build-logs/fa453-compact-energy/candidates/${VARIANT}/METRIC.json" <<'PY'
          import json,sys
          try:
              m=json.load(open(sys.argv[1],encoding='utf-8'))
          except Exception as exc:
              raise SystemExit(f'INFRA_FAILURE: metric missing/invalid: {exc}')
          commands=m.get('exact_compile_commands',{})
          ok=(
              m.get('classification') != 'INFRA_FAILURE'
              and m.get('diagnostic_parser') == 'strict_error_and_error_category_v1'
              and m.get('all_required_lean_executed') is True
              and m.get('source_metadata_identity') is True
              and m.get('Mock2_executed') is True
              and m.get('Mock2_exit') == 0
              and m.get('Mock2_errors_under_cap') == 0
              and m.get('Mock2_Advanced_executed') is True
              and m.get('Mock2_Advanced_exit') == 0
              and m.get('Mock2_Advanced_errors_under_cap') == 0
              and m.get('FA_executed') is True
              and bool(commands.get('Mock2'))
              and bool(commands.get('Mock2_Advanced'))
              and bool(commands.get('Mock2_FunctionalAnalysis'))
              and m.get('forbidden_clean') is True
          )
          print(json.dumps(m,indent=2,ensure_ascii=False))
          if not ok:
              raise SystemExit('INFRA_FAILURE: strict direct Lean/prerequisite/identity/trust requirement not met')
          PY

  select-confirm-persist:
    name: independent strict baseline, selector, materialize, checked-in x2
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '360'
    steps:
      - name: Checkout immutable FA458 source commit with push credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_REF }}
          fetch-depth: 2500
          persist-credentials: true

      - name: Configure Git identity before any evidence or source commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          test "$(git config user.name)" = 'github-actions[bot]'
          test "$(git config user.email)" = '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run independent strict baseline, selector, materialization, checked-in verification and gated downstream
        id: selector
        shell: bash
        run: bash scripts/fa458_selector_strict_ci.sh

      - name: Upload complete strict direct Lean evidence
        id: evidence_upload
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa458-strict-complete-evidence-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa453-compact-energy
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Patch report with artifact ID and persist final evidence
        if: steps.selector.outcome == 'success'
        env:
          ARTIFACT_ID: ${{ steps.evidence_upload.outputs.artifact-id }}
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          base=Path('build-logs/fa453-compact-energy/final')
          aid=os.environ.get('ARTIFACT_ID','')
          final_path=base/'FINAL.json'
          report_path=base/'FA_MATRIX_PIPELINE_REPAIR_REPORT.txt'
          if final_path.exists():
              obj=json.loads(final_path.read_text(encoding='utf-8'))
              obj['artifact_id']=int(aid) if aid.isdigit() else aid
              final_path.write_text(json.dumps(obj,indent=2,ensure_ascii=False)+'\n',encoding='utf-8')
          if report_path.exists():
              text=report_path.read_text(encoding='utf-8')
              text=text.replace('Artifact ID: PENDING_UPLOAD',f"Artifact ID: {aid or 'UNAVAILABLE'}")
              report_path.write_text(text,encoding='utf-8')
          PY
          git add -f \
            build-logs/fa453-compact-energy/final/FINAL.json \
            build-logs/fa453-compact-energy/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt \
            2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m 'ci: attach FA458 strict direct evidence artifact identity [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Enforce infrastructure integrity separately from Lean proof status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "${{ steps.selector.outcome }}" = success
          test -s build-logs/fa453-compact-energy/selector-baseline/METRIC.json
          test -s build-logs/fa453-compact-energy/selected/SELECTION.json
          test -s build-logs/fa453-compact-energy/selected/CANDIDATE_RESULTS.json
          test -s build-logs/fa453-compact-energy/selected-confirm/CONFIRMATION.json
          test -s build-logs/fa453-compact-energy/final/CHECKED_IN_IDENTITY.json
          test -s build-logs/fa453-compact-energy/final/FA_FINAL.json
          test -s build-logs/fa453-compact-energy/final/downstream/DOWNSTREAM.json
          test -s build-logs/fa453-compact-energy/final/FINAL.json
          test -s build-logs/fa453-compact-energy/final/FA_MATRIX_PIPELINE_REPAIR_REPORT.txt
