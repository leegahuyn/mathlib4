name: Record FA320 unpinned QYM result

on:
  workflow_run:
    workflows: ['FA pass320 unpinned then Integrated and QYM']
    types: [completed]

permissions:
  actions: read
  contents: write

concurrency:
  group: record-fa320-unpinned-qym-${{ github.event.workflow_run.id }}
  cancel-in-progress: false

jobs:
  record:
    if: github.event.workflow_run.head_branch == 'ci/fa319-isolated-20260807'
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR 9 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ci/fa319-isolated-20260807
          fetch-depth: 1
          persist-credentials: true

      - name: Download focused artifact and write compact result
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_ID: ${{ github.event.workflow_run.id }}
          RUN_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
          RUN_HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fa320-result /tmp/fa320-artifact.zip /tmp/fa320-unpacked
          mkdir -p /tmp/fa320-result /tmp/fa320-unpacked build-logs
          printf '%s\n' \
            "run_id=${RUN_ID}" \
            "head_sha=${RUN_HEAD_SHA}" \
            "conclusion=${RUN_CONCLUSION}" \
            "recorded_utc=$(date -u +%FT%TZ)" \
            > /tmp/fa320-result/header.txt

          artifact_id="$(gh api \
            -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/runs/${RUN_ID}/artifacts" \
            --jq '.artifacts[] | select(.name | startswith("fa320-unpinned-qym-")) | .id' \
            | head -1)"
          if [[ -n "${artifact_id}" ]]; then
            gh api \
              -H 'Accept: application/vnd.github+json' \
              "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" \
              > /tmp/fa320-artifact.zip
            unzip -q /tmp/fa320-artifact.zip -d /tmp/fa320-unpacked
          fi

          result='build-logs/fa320-unpinned-latest.txt'
          cat /tmp/fa320-result/header.txt > "${result}"
          if [[ -f /tmp/fa320-unpacked/compile-summary.csv ]]; then
            echo '--- compile-summary.csv ---' >> "${result}"
            cat /tmp/fa320-unpacked/compile-summary.csv >> "${result}"
          fi
          if [[ -f /tmp/fa320-unpacked/pass320-selection.txt ]]; then
            echo '--- pass320-selection.txt ---' >> "${result}"
            cat /tmp/fa320-unpacked/pass320-selection.txt >> "${result}"
          fi
          if [[ -f /tmp/fa320-unpacked/status.txt ]]; then
            echo '--- status.txt ---' >> "${result}"
            cat /tmp/fa320-unpacked/status.txt >> "${result}"
          fi
          for summary in /tmp/fa320-unpacked/logs/*.summary.txt; do
            [[ -f "${summary}" ]] || continue
            echo "--- $(basename "${summary}") ---" >> "${result}"
            sed -n '1,260p' "${summary}" >> "${result}"
          done
          if [[ "${RUN_CONCLUSION}" = success ]]; then
            cp "${result}" build-logs/fa320-unpinned-success.txt
            rm -f build-logs/fa320-unpinned-failure.txt
          else
            cp "${result}" build-logs/fa320-unpinned-failure.txt
            rm -f build-logs/fa320-unpinned-success.txt
          fi

      - name: Commit compact result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa320-unpinned-latest.txt \
            build-logs/fa320-unpinned-success.txt \
            build-logs/fa320-unpinned-failure.txt 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'ci: record focused FunctionalAnalysis and QYM result'
          git pull --rebase origin ci/fa319-isolated-20260807
          git push origin HEAD:ci/fa319-isolated-20260807
