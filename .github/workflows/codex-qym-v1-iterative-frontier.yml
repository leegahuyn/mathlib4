name: Codex QYM v1 guarded iterative frontier repair
run-name: "Codex: continue QYM after FA direct-clean gate"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      - PrimalitySheafVerification/QYM.lean
      - scripts/fa_iterative_frontier_repair.py
      - scripts/lean_collect_exact_diagnostics.py
      - .github/workflows/codex-qym-v1-iterative-frontier.yml

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-qym-v1-iterative-${{ github.ref }}
  cancel-in-progress: false

jobs:
  baseline:
    name: FA gate and exact checked-in QYM baseline
    runs-on: ubuntu-latest
    timeout-minutes: 360
    outputs:
      eligible: ${{ steps.collect.outputs.eligible }}
      qym_exit: ${{ steps.collect.outputs.qym_exit }}
      base_sha256: ${{ steps.collect.outputs.base_sha256 }}
      first_index: ${{ steps.collect.outputs.first_index }}
      error_count: ${{ steps.collect.outputs.error_count }}
      unique_decls: ${{ steps.collect.outputs.unique_decls }}
      signatures: ${{ steps.collect.outputs.signatures }}
    env:
      QYM_BASE_OUT: build-logs/codex-qym-v1/baseline
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Lock exact checked-in QYM source identity
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QYM_BASE_OUT"
          test -f PrimalitySheafVerification/QYM.lean
          cp PrimalitySheafVerification/QYM.lean "$QYM_BASE_OUT/QYM-baseline.lean"
          sha256sum PrimalitySheafVerification/QYM.lean | tee "$QYM_BASE_OUT/QYM-baseline.sha256"
          wc -c -l PrimalitySheafVerification/QYM.lean | tee "$QYM_BASE_OUT/QYM-baseline.size.txt"
          git rev-parse HEAD | tee "$QYM_BASE_OUT/github-head-sha.txt"
          git status --porcelain=v1 | tee "$QYM_BASE_OUT/checkout-status-before.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$QYM_BASE_OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$QYM_BASE_OUT/toolchain.log" 2>&1
          lake exe cache get >"$QYM_BASE_OUT/cache.log" 2>&1
          lean --version | tee "$QYM_BASE_OUT/lean-version.txt"
          lake --version | tee "$QYM_BASE_OUT/lake-version.txt"
          sha256sum lean-toolchain lake-manifest.json lakefile.lean >"$QYM_BASE_OUT/environment.sha256"

      - name: Directly execute prerequisite chain and checked-in QYM
        id: direct
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out="$QYM_BASE_OUT"
          prereqs=(
            PrimalitySheafVerification/Mock2.lean
            PrimalitySheafVerification/Mock2_Advanced.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          )
          eligible=1
          : >"$out/prerequisite-direct.tsv"
          for file in "${prereqs[@]}"; do
            key="$(basename "$file" .lean)"
            set +e
            lake env lean -DmaxErrors=2000 "$file" >"$out/${key}.stdout.log" 2>"$out/${key}.stderr.log"
            code=$?
            set -e
            printf '%s\t%s\n' "$file" "$code" | tee -a "$out/prerequisite-direct.tsv"
            printf '%s\n' "$code" >"$out/${key}.exit"
            if [[ "$code" -ne 0 ]]; then eligible=0; fi
          done
          printf '%s\n' "$eligible" >"$out/QYM.eligible"
          if [[ "$eligible" -eq 1 ]]; then
            set +e
            lake env lean -DmaxErrors=2000 PrimalitySheafVerification/QYM.lean \
              >"$out/QYM.stdout.log" 2>"$out/QYM.stderr.log"
            qym_exit=$?
            set -e
          else
            qym_exit=125
            printf '%s\n' 'QYM was not executed because the exact FA prerequisite gate was not clean.' \
              >"$out/QYM.stderr.log"
            : >"$out/QYM.stdout.log"
          fi
          printf '%s\n' "$qym_exit" >"$out/QYM.exit"
          cat "$out/QYM.stdout.log" "$out/QYM.stderr.log" >"$out/QYM.combined.log"
          exit 0

      - name: Collect exact QYM diagnostics and baseline outputs
        id: collect
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          eligible_raw="$(tr -d '\r\n' < "$QYM_BASE_OUT/QYM.eligible")"
          qym_exit="$(tr -d '\r\n' < "$QYM_BASE_OUT/QYM.exit")"
          base_sha="$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          printf 'eligible=%s\n' "$([[ "$eligible_raw" == 1 ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          printf 'qym_exit=%s\n' "$qym_exit" >>"$GITHUB_OUTPUT"
          printf 'base_sha256=%s\n' "$base_sha" >>"$GITHUB_OUTPUT"

          if [[ "$eligible_raw" == 1 ]]; then
            python3 scripts/lean_collect_exact_diagnostics.py \
              --source PrimalitySheafVerification/QYM.lean \
              --log "$QYM_BASE_OUT/QYM.combined.log" \
              --exit-file "$QYM_BASE_OUT/QYM.exit" \
              --out "$QYM_BASE_OUT" \
              --label QYM-checked-in-baseline \
              --max-errors 2000 \
              | tee "$QYM_BASE_OUT/metric-console.log"
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['QYM_BASE_OUT'])
          path = out / 'METRIC.json'
          metric = json.loads(path.read_text())
          metric['schema'] = 'qym-v1-checked-in-baseline-metric-v1'
          metric['github_sha'] = os.environ['GITHUB_SHA']
          metric['github_run_id'] = os.environ['GITHUB_RUN_ID']
          path.write_text(json.dumps(metric, indent=2, sort_keys=True) + '\n')
          values = {
              'first_index': metric.get('first_error_declaration_index'),
              'error_count': metric.get('error_headers_captured'),
              'unique_decls': metric.get('unique_declarations_with_errors'),
              'signatures': metric.get('unique_normalized_message_signatures'),
          }
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key, value in values.items():
                  handle.write(f'{key}={"" if value is None else value}\n')
          PY
          else
            python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['QYM_BASE_OUT'])
          gate = {
              'schema': 'qym-v1-prerequisite-gate-v1',
              'github_sha': os.environ['GITHUB_SHA'],
              'eligible': False,
              'QYM_exit': 125,
              'status': 'BLOCKED_BY_FA',
          }
          (out / 'FINAL_GATE.json').write_text(json.dumps(gate, indent=2, sort_keys=True) + '\n')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as handle:
              for key in ('first_index', 'error_count', 'unique_decls', 'signatures'):
                  handle.write(f'{key}=\n')
          PY
          fi

      - name: Upload immutable baseline source and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-qym-v1-baseline-${{ github.sha }}
          path: build-logs/codex-qym-v1/baseline
          retention-days: 30

  candidate:
    name: direct-QYM-${{ matrix.rule }}
    needs: baseline
    if: needs.baseline.outputs.eligible == 'true' && needs.baseline.outputs.qym_exit != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        rule:
          - first_let
          - first_relax
          - first_enrich
          - first_ring
          - first_qualify
          - first_funext
          - first3_safe
          - first8_safe
    env:
      QYM_RULE: ${{ matrix.rule }}
      QYM_CANDIDATE_OUT: build-logs/codex-qym-v1/${{ matrix.rule }}
      QYM_BASE_SHA256: ${{ needs.baseline.outputs.base_sha256 }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Recover exact QYM baseline artifact and materialize candidate
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$QYM_CANDIDATE_OUT"
          root="/tmp/qym-v1-baseline-${GITHUB_RUN_ID}-${QYM_RULE}"
          mkdir -p "$root"
          artifact_id=""
          artifact_digest=""
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" >"$root/artifacts.json"
            read -r artifact_id artifact_digest < <(python3 - "$root/artifacts.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1]))
          expected = 'codex-qym-v1-baseline-' + os.environ['GITHUB_SHA']
          for artifact in data.get('artifacts', []):
              if artifact.get('name') == expected:
                  print(artifact['id'], artifact.get('digest', ''))
                  break
          PY
            )
            if [[ -n "$artifact_id" ]]; then break; fi
            sleep 3
          done
          test -n "$artifact_id"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"$root/base.zip"
          test "sha256:$(sha256sum "$root/base.zip" | awk '{print $1}')" = "$artifact_digest"
          unzip -q "$root/base.zip" -d "$root/extracted"
          base="$(find "$root/extracted" -type f -name 'QYM-baseline.lean' -print -quit)"
          diagnostics="$(find "$root/extracted" -type f -name 'DIAGNOSTICS.jsonl' -print -quit)"
          rawlog="$(find "$root/extracted" -type f -name 'QYM.combined.log' -print -quit)"
          test -n "$base"; test -n "$diagnostics"; test -n "$rawlog"
          test "$(sha256sum "$base" | awk '{print $1}')" = "$QYM_BASE_SHA256"
          cp "$base" "$QYM_CANDIDATE_OUT/BASELINE.lean"
          cp "$diagnostics" "$QYM_CANDIDATE_OUT/BASELINE_DIAGNOSTICS.jsonl"
          cp "$rawlog" "$QYM_CANDIDATE_OUT/BASELINE_QYM.log"
          python3 scripts/fa_iterative_frontier_repair.py \
            --base "$base" \
            --base-sha256 "$QYM_BASE_SHA256" \
            --diagnostics "$diagnostics" \
            --raw-log "$rawlog" \
            --rule "$QYM_RULE" \
            --out "$QYM_CANDIDATE_OUT/QYM-candidate.lean" \
            --audit "$QYM_CANDIDATE_OUT/PATCH_AUDIT.json" \
            | tee "$QYM_CANDIDATE_OUT/MATERIALIZATION.stdout.json"
          cp "$QYM_CANDIDATE_OUT/QYM-candidate.lean" PrimalitySheafVerification/QYM.lean
          candidate_sha="$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          printf 'QYM_CANDIDATE_SHA256=%s\n' "$candidate_sha" >>"$GITHUB_ENV"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >"$QYM_CANDIDATE_OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >"$QYM_CANDIDATE_OUT/toolchain.log" 2>&1
          lake exe cache get >"$QYM_CANDIDATE_OUT/cache.log" 2>&1
          lean --version | tee "$QYM_CANDIDATE_OUT/lean-version.txt"
          lake --version | tee "$QYM_CANDIDATE_OUT/lake-version.txt"

      - name: Directly execute prerequisite chain and candidate QYM
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          out="$QYM_CANDIDATE_OUT"
          prereqs=(
            PrimalitySheafVerification/Mock2.lean
            PrimalitySheafVerification/Mock2_Advanced.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          )
          eligible=1
          : >"$out/prerequisite-direct.tsv"
          for file in "${prereqs[@]}"; do
            key="$(basename "$file" .lean)"
            set +e
            lake env lean -DmaxErrors=2000 "$file" >"$out/${key}.stdout.log" 2>"$out/${key}.stderr.log"
            code=$?
            set -e
            printf '%s\t%s\n' "$file" "$code" | tee -a "$out/prerequisite-direct.tsv"
            printf '%s\n' "$code" >"$out/${key}.exit"
            if [[ "$code" -ne 0 ]]; then eligible=0; fi
          done
          if [[ "$eligible" -ne 1 ]]; then
            printf '%s\n' 125 >"$out/QYM.exit"
            printf '%s\n' 'Candidate QYM not executed because exact prerequisites regressed.' >"$out/QYM.combined.log"
            exit 0
          fi
          set +e
          lake env lean -DmaxErrors=2000 PrimalitySheafVerification/QYM.lean \
            >"$out/QYM.stdout.log" 2>"$out/QYM.stderr.log"
          code=$?
          set -e
          printf '%s\n' "$code" >"$out/QYM.exit"
          cat "$out/QYM.stdout.log" "$out/QYM.stderr.log" >"$out/QYM.combined.log"
          exit 0

      - name: Collect exact candidate QYM metric and gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/lean_collect_exact_diagnostics.py \
            --source PrimalitySheafVerification/QYM.lean \
            --log "$QYM_CANDIDATE_OUT/QYM.combined.log" \
            --exit-file "$QYM_CANDIDATE_OUT/QYM.exit" \
            --out "$QYM_CANDIDATE_OUT" \
            --label "QYM-${QYM_RULE}" \
            --max-errors 2000 \
            | tee "$QYM_CANDIDATE_OUT/metric-console.log"
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          out = Path(os.environ['QYM_CANDIDATE_OUT'])
          path = out / 'METRIC.json'
          metric = json.loads(path.read_text())
          metric['schema'] = 'qym-v1-iterative-candidate-metric-v1'
          metric['rule'] = os.environ['QYM_RULE']
          metric['baseline_sha256'] = os.environ['QYM_BASE_SHA256']
          metric['github_sha'] = os.environ['GITHUB_SHA']
          metric['github_run_id'] = os.environ['GITHUB_RUN_ID']
          path.write_text(json.dumps(metric, indent=2, sort_keys=True) + '\n')
          PY

      - name: Preserve actual QYM direct exit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          code="$(tr -d '\r\n' < "$QYM_CANDIDATE_OUT/QYM.exit")"
          case "$code" in ''|*[!0-9]*) exit 86;; esac
          exit "$code"

      - name: Upload exact QYM candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-qym-v1-${{ matrix.rule }}-${{ github.sha }}
          path: build-logs/codex-qym-v1/${{ matrix.rule }}
          retention-days: 30

  selector:
    name: Dynamic QYM selector and guarded iteration
    needs: [baseline, candidate]
    if: always() && needs.baseline.outputs.eligible == 'true' && needs.baseline.outputs.qym_exit != '0'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    outputs:
      status: ${{ steps.advance.outputs.status }}
      qym_clean: ${{ steps.advance.outputs.qym_clean }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 1

      - name: Download exact baseline and all eight candidate artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          root="/tmp/qym-v1-selector-${GITHUB_RUN_ID}"
          mkdir -p "$root/zips" "$root/extracted"
          for attempt in $(seq 1 30); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" >"$root/artifacts.json"
            count="$(python3 - "$root/artifacts.json" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1])); sha = os.environ['GITHUB_SHA']
          names = [a.get('name','') for a in data.get('artifacts',[])]
          selected = [n for n in names if n == f'codex-qym-v1-baseline-{sha}' or (n.startswith('codex-qym-v1-') and n.endswith('-'+sha))]
          print(len(selected))
          PY
            )"
            if [[ "$count" == 9 ]]; then break; fi
            sleep 4
          done
          test "$count" = 9
          python3 - "$root/artifacts.json" "$root/ids.tsv" <<'PY'
          import json, os, sys
          data = json.load(open(sys.argv[1])); sha = os.environ['GITHUB_SHA']; rows = []
          for artifact in data.get('artifacts', []):
              name = artifact.get('name', '')
              if name == f'codex-qym-v1-baseline-{sha}' or (name.startswith('codex-qym-v1-') and name.endswith('-'+sha)):
                  rows.append((artifact['id'], name, artifact.get('digest', '')))
          if len(rows) != 9:
              raise SystemExit(f'expected 9 QYM artifacts, found {len(rows)}')
          with open(sys.argv[2], 'w') as handle:
              for row in rows:
                  handle.write('\t'.join(map(str, row)) + '\n')
          PY
          while IFS=$'\t' read -r artifact_id artifact_name artifact_digest; do
            zip="$root/zips/${artifact_name}.zip"
            dst="$root/extracted/${artifact_name}"
            gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >"$zip"
            test "sha256:$(sha256sum "$zip" | awk '{print $1}')" = "$artifact_digest"
            mkdir -p "$dst"
            unzip -q "$zip" -d "$dst"
          done <"$root/ids.tsv"
          printf 'QYM_V1_SELECTOR_ROOT=%s\n' "$root" >>"$GITHUB_ENV"

      - name: Compare candidates against exact dynamic QYM baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os, shutil
          from pathlib import Path
          root = Path(os.environ['QYM_V1_SELECTOR_ROOT']); sha = os.environ['GITHUB_SHA']
          base_root = root / 'extracted' / f'codex-qym-v1-baseline-{sha}'
          base_metric_path = next(base_root.glob('**/METRIC.json'))
          base = json.loads(base_metric_path.read_text())
          def score(metric):
              passed = metric.get('lean_exit') == 0
              index = metric.get('first_error_declaration_index')
              errors = metric.get('error_headers_captured')
              declarations = metric.get('unique_declarations_with_errors')
              signatures = metric.get('unique_normalized_message_signatures')
              return (
                  1 if passed else 0,
                  10**9 if passed else int(index) if isinstance(index, int) else -1,
                  -int(errors) if isinstance(errors, int) else -10**9,
                  -int(declarations) if isinstance(declarations, int) else -10**9,
                  -int(signatures) if isinstance(signatures, int) else -10**9,
              )
          base_score = score(base)
          candidates = []
          for metric_path in root.glob('extracted/codex-qym-v1-*/**/METRIC.json'):
              if 'baseline' in str(metric_path):
                  continue
              metric = json.loads(metric_path.read_text())
              parent = metric_path.parent
              source = next(parent.glob('QYM-candidate.lean'), None)
              audit_path = parent / 'PATCH_AUDIT.json'
              gate_path = parent / 'FINAL_GATE.json'
              if source is None or not audit_path.exists() or not gate_path.exists():
                  continue
              audit = json.loads(audit_path.read_text())
              if metric.get('source_sha256') != audit.get('source_sha256'):
                  raise SystemExit(f'{metric_path}: metric/audit source mismatch')
              if metric.get('baseline_sha256') != base.get('source_sha256'):
                  raise SystemExit(f'{metric_path}: wrong QYM baseline')
              if metric.get('direct_lean_verified') is not True:
                  raise SystemExit(f'{metric_path}: no direct Lean evidence')
              if metric.get('source_executable_trust_six_zero') is not True:
                  raise SystemExit(f'{metric_path}: six-token trust gate failed')
              if metric.get('synthetic_declaration_uses_sorry_warning_count') != 0:
                  raise SystemExit(f'{metric_path}: synthetic sorry warning present')
              candidates.append({
                  'rule': metric.get('rule'),
                  'metric': metric,
                  'score': score(metric),
                  'source': source,
                  'audit': audit_path,
                  'gate': gate_path,
              })
          if len(candidates) != 8:
              raise SystemExit(f'expected 8 complete QYM candidates, found {len(candidates)}')
          candidates.sort(key=lambda row: (row['score'], row['rule']), reverse=True)
          best = candidates[0]
          advance = best['score'] > base_score
          passed = best['score'][0] == 1
          status = 'PASS' if passed else 'IMPROVED' if advance else 'NO_ADVANCE'
          out = root / 'selection'; out.mkdir(parents=True, exist_ok=True)
          shutil.copy2(best['source'], out / 'QYM-selected.lean')
          shutil.copy2(best['audit'], out / 'PATCH_AUDIT-selected.json')
          shutil.copy2(best['gate'], out / 'FINAL_GATE-selected.json')
          (out / 'METRIC-selected.json').write_text(json.dumps(best['metric'], indent=2, sort_keys=True) + '\n')
          selection = {
              'schema': 'qym-v1-dynamic-selector-v1',
              'github_run_id': os.environ['GITHUB_RUN_ID'],
              'github_sha': sha,
              'base_source_sha256': base.get('source_sha256'),
              'base_score': list(base_score),
              'status': status,
              'advance': advance,
              'selected_rule': best['rule'],
              'selected_score': list(best['score']),
              'selected_source_sha256': best['metric'].get('source_sha256'),
              'candidates': [
                  {
                      'rule': row['rule'],
                      'score': list(row['score']),
                      'source_sha256': row['metric'].get('source_sha256'),
                      'QYM_exit': row['metric'].get('lean_exit'),
                      'error_count': row['metric'].get('error_headers_captured'),
                      'first_error_declaration': row['metric'].get('first_error_declaration'),
                      'first_error_declaration_index': row['metric'].get('first_error_declaration_index'),
                      'unique_error_declarations': row['metric'].get('unique_declarations_with_errors'),
                      'unique_signatures': row['metric'].get('unique_normalized_message_signatures'),
                  }
                  for row in candidates
              ],
          }
          (out / 'SELECTION.json').write_text(json.dumps(selection, indent=2, sort_keys=True) + '\n')
          print(json.dumps(selection, indent=2, sort_keys=True))
          PY

      - name: Commit only strict trust-clean direct-QYM improvement
        id: advance
        shell: bash
        run: |
          set -euo pipefail
          selection="$QYM_V1_SELECTOR_ROOT/selection/SELECTION.json"
          status="$(python3 -c 'import json,sys; print(json.load(open(sys.argv[1]))["status"])' "$selection")"
          advance="$(python3 -c 'import json,sys; print(str(json.load(open(sys.argv[1]))["advance"]).lower())' "$selection")"
          printf 'status=%s\n' "$status" >>"$GITHUB_OUTPUT"
          printf 'qym_clean=%s\n' "$([[ "$status" == PASS ]] && echo true || echo false)" >>"$GITHUB_OUTPUT"
          mkdir -p "build-evidence/qym-v1/${GITHUB_RUN_ID}"
          cp "$QYM_V1_SELECTOR_ROOT/selection/"*.json "build-evidence/qym-v1/${GITHUB_RUN_ID}/"
          if [[ "$advance" == true ]]; then
            cp "$QYM_V1_SELECTOR_ROOT/selection/QYM-selected.lean" PrimalitySheafVerification/QYM.lean
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "build-evidence/qym-v1/${GITHUB_RUN_ID}"
          if [[ "$advance" == true ]]; then git add PrimalitySheafVerification/QYM.lean; fi
          git commit -m "Codex: QYM iterative frontier ${status} run ${GITHUB_RUN_ID}"
          git push origin HEAD:codex/fa-qym-cleanbuild-final-20260811-fast

      - name: Upload QYM selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-qym-v1-selector-${{ github.sha }}-${{ github.run_id }}
          path: ${{ env.QYM_V1_SELECTOR_ROOT }}/selection
          retention-days: 30
