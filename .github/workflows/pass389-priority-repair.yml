name: PASS 389 priority repair — FA then Mock3 then QYM

on:
  push:
    branches:
      - ci/fa319-isolated-20260807
    paths:
      - '.github/workflows/pass389-priority-repair.yml'
      - 'scripts/pass389_priority_repair_agent.py'
      - 'scripts/pass389_priority_repair_agent_v2.py'
      - 'build-logs/pass389-resume-baseline.txt'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  pull-requests: write
  models: read

concurrency:
  group: pass389-priority-repair
  cancel-in-progress: false

jobs:
  repair-in-required-order:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run PASS 389 repair and strict two-pass gate
        id: repair
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_MODELS_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PASS389_EVIDENCE: /tmp/pass389-priority
          PASS389_CHAIN_BRANCH: fix/fa390-pass389-autorepair-20260809
          PASS389_PR9_BRANCH: ci/fa319-isolated-20260807
          PASS389_MODELS: openai/gpt-5-mini,openai/gpt-4.1,deepseek/DeepSeek-V3-0324,xai/grok-3-mini
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass389_priority_repair_agent_v2.py \
            --fa-cycles 42 \
            --downstream-cycles 24 \
            2>&1 | tee /tmp/pass389-priority-driver.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          mkdir -p /tmp/pass389-priority
          cp /tmp/pass389-priority-driver.log /tmp/pass389-priority/driver.log
          if [[ -f build-logs/pass389-priority-state.json ]]; then
            cp build-logs/pass389-priority-state.json /tmp/pass389-priority/state.json
          fi
          if [[ -f build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json ]]; then
            cp build-logs/PR9_FA_INTEGRATED_MOCK3_QYM_FINAL_2X_PASS.json \
              /tmp/pass389-priority/final-marker.json
          fi
          exit 0

      - name: Upload PASS 389 repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass389-priority-repair-${{ github.sha }}
          path: /tmp/pass389-priority
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Write job summary
        if: always()
        shell: bash
        env:
          REPAIR_EXIT: ${{ steps.repair.outputs.exit_code }}
        run: |
          {
            echo '# PASS 389 priority repair'
            echo
            echo "- repair exit: \`${REPAIR_EXIT:-missing}\`"
            echo '- required order: FA 2× → Integrated/actual Mock3 2× → QYM 2×'
            echo '- no automatic merge'
            if [[ -f build-logs/pass389-priority-state.json ]]; then
              echo
              echo '```json'
              cat build-logs/pass389-priority-state.json
              echo '```'
            fi
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce result
        if: always()
        shell: bash
        env:
          REPAIR_EXIT: ${{ steps.repair.outputs.exit_code }}
        run: |
          test -n "${REPAIR_EXIT:-}"
          exit "${REPAIR_EXIT}"
