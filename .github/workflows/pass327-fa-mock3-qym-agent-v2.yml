name: PASS 327 FA Mock3 QYM repair agent v2

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - 'scripts/pass327_lean_repair_agent.py'
      - 'scripts/ci_pass327_agent_orchestrator_v2.sh'
      - 'scripts/ci_pass327_fa_qym_recovery.sh'
      - 'build-logs/pass327-agent-state.json'
      - '.github/workflows/pass327-fa-mock3-qym-agent-v2.yml'
  workflow_dispatch:

permissions:
  actions: read
  contents: write
  models: read

concurrency:
  group: pass327-fa-mock3-qym-agent-v2
  cancel-in-progress: false

jobs:
  repair-verify-checkpoint:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact PR9 repair head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 128
          persist-credentials: true

      - name: Validate repair scripts
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/ci_pass327_fa_qym_recovery.sh
          bash -n scripts/ci_pass327_agent_orchestrator_v2.sh
          python3 -m py_compile scripts/pass327_lean_repair_agent.py

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Recover PASS 327, repair FA, then verify Mock3 bridge and QYM
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_pass327_agent_orchestrator_v2.sh

      - name: Upload PASS 327 agent evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass327-fa-mock3-qym-agent-v2-${{ github.sha }}
          path: |
            /tmp/pass327-repair-agent
            /tmp/pass327-fa-qym-recovery
          if-no-files-found: warn
          retention-days: 30
