name: GPT QYM GB27 R1 first-error probe

on:
  push:
    branches:
      - gpt/qym-gb57-global-batch-round2-20260820
    paths:
      - .github/workflows/gpt-qym-gb27-r1-first-error.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-qym-gb27-r1-first-error
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb57-global-batch-round2-20260820
  BASE: .github/qym-frontier/GB8_PARSER_UNBLOCK/QYM_GB8_PARSER_UNBLOCK.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  OUT: /tmp/qym-gb27-r1-first

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate and build exact candidate
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT" && mkdir -p "$OUT" "$OLEAN"
          test "$(sha256sum "$BASE" | awk '{print $1}')" = 8abc23b49c1cabed88fac0a67c3958d4dec7411d9c078ff555e137a1c19560d7
          python3 -B .github/qym_patch_gb27_semantic_round1.py "$BASE" "$OUT/QYM.candidate.lean"
          test "$(sha256sum "$OUT/QYM.candidate.lean" | awk '{print $1}')" = 61b88982fa79f67da2c01aae2f01a24fab5347be17d3e85e45902d50ef83ae4f

      - name: Install Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1
          lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1

      - name: Restore verified QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v5-${{ runner.os }}-
            qym-deps-v4-${{ runner.os }}-

      - name: Run actual direct Lean to first error
        shell: bash
        run: |
          set -euo pipefail
          cp "$OUT/QYM.candidate.lean" PrimalitySheafVerification/QYM.lean
          set +e
          lake env lean -DmaxErrors=1 -DwarningAsError=false \
            PrimalitySheafVerification/QYM.lean > "$OUT/first.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/exit.txt"
          grep -m1 -E '^.*\.lean:[0-9]+:[0-9]+: error' "$OUT/first.log" > "$OUT/FIRST_ERROR.txt" || true

      - name: Persist first-error result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          dest=.github/qym-probes/GB27_R1_FIRST_ERROR
          rm -rf "$dest" && mkdir -p "$dest"
          cp "$OUT/exit.txt" "$dest/"
          cp "$OUT/FIRST_ERROR.txt" "$dest/" || true
          cp "$OUT/first.log" "$dest/"
          cat > "$dest/STATUS.json" <<JSON
          {"run_id":${GITHUB_RUN_ID},"trigger_sha":"${GITHUB_SHA}","exit":$(cat "$OUT/exit.txt")}
          JSON
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest"
          git commit -m "QYM GB27 R1: persist first-error probe ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt*5))
          done
          exit 1
