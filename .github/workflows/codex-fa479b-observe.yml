name: Codex FA479B UpperHalfPlane.ext direct Lean

on:
  push:
    branches:
      - fix/fa479-eventually-zero-upper-ext-20260811
    paths:
      - .github/workflows/codex-fa479b-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa479b-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: minimal_simpa
      FA476_R3_EVIDENCE_RUN_ID: "31407777360"
      FA476_R3_EVIDENCE_ARTIFACT_ID: "9070636218"
      FA476_R3_EVIDENCE_ARTIFACT_DIGEST: "sha256:343607e51bea29fd2878bf6ebfcc0c1c8b1daf9826733b0cd3729e63fbbea3ca"
      FA477_VARIANT: upper_ext_h_simp_only
      FA477_EVIDENCE_RUN_ID: "31409787172"
      FA477_EVIDENCE_JOB_ID: "93524786715"
      FA477_EVIDENCE_HEAD_SHA: faf902ceda7cce10ada4399326330effaa4d669b
      FA477_EVIDENCE_ARTIFACT_ID: "9071387258"
      FA477_EVIDENCE_ARTIFACT_NAME: codex-fa477-minimal_simpa-run31407777360-artifact9070636218-upper_ext_h_simp_only
      FA477_EVIDENCE_ARTIFACT_SIZE: "598253"
      FA477_EVIDENCE_ARTIFACT_DIGEST: "sha256:25928120f3113f98886a469b255eec59754bfd232b4df621f4efa4e1e9940b81"
      FA478_VARIANT: real_norm_eq_abs_only
      FA478_EVIDENCE_RUN_ID: "31416050563"
      FA478_EVIDENCE_JOB_ID: "93545285888"
      FA478_EVIDENCE_HEAD_SHA: 46241996e61a001d498ad3e126dc8b38867bff86
      FA478_EVIDENCE_SOURCE_SHA256: 53a703d3e138ae7a964b7221c52337082cb59820595cfce877a679f024fbcf82
      FA478_FIRST_ERROR_LINE: "35133"
      FA478_FIRST_ERROR_COL: "8"
      FA478_FRONTIER_DECLARATION: selectedLogHeightNaturalGauge_eventuallyEq_zero
      FA478_FRONTIER_INDEX: "2796"
      FA479_VARIANT: upper_ext_hlevel
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA479B start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA479B observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> FA476 -> FA477 -> FA478 -> FA479\`\n- same_stage: \`FA479 alternate candidate; not FA480\`\n- upstream_FA478_run: \`31416050563\`\n- patch: \`rw [hlevel] -> congrArg action; UpperHalfPlane.ext; simpa only [hlevel]\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA479B candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa479b_eventually_zero_upper_ext_candidate_ci.sh 2>&1 | tee /tmp/fa479b-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA479B evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa479b-comment.md
          from pathlib import Path
          import os

          out = Path("build-logs/codex-fa479b-eventually-zero-upper-ext/candidates/norms")
          metric = out / "METRIC.json"
          candidate = out / "CANDIDATE.json"
          log = Path("/tmp/fa479b-observe.log")
          source = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")

          parts = [
              "## FA479B observer — actual remote execution",
              "",
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID', '')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- script_exit: `{os.environ.get('SCRIPT_EXIT', '')}`",
              "- sequence: `FA475 -> FA476 -> FA477 -> FA478 -> FA479`",
              "- same_stage: `FA479 alternate candidate; not FA480`",
              "- variant: `upper_ext_hlevel`",
              "- workflow: `codex-fa479b-observe.yml`",
              "",
          ]
          if metric.exists():
              parts += ["### METRIC.json", "```json", metric.read_text(encoding="utf-8")[:28000], "```", ""]
          else:
              parts += ["### METRIC.json", "`MISSING`", ""]
          if candidate.exists():
              parts += ["### CANDIDATE.json", "```json", candidate.read_text(encoding="utf-8")[:14000], "```", ""]
          else:
              parts += ["### CANDIDATE.json", "`MISSING`", ""]
          if source.exists():
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              lo, hi = 35115, 35145
              snippet = "\n".join(f"{i}: {lines[i-1]}" for i in range(lo, min(hi, len(lines)) + 1))
              parts += ["### Exact FA479B candidate source around prior frontier", "```lean", snippet, "```", ""]
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              tail = "\n".join(lines[-100:])
              parts += ["### Tail of actual execution log", "```text", tail[-14000:], "```", ""]
          print("\n".join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa479b-comment.md)"

      - name: Preserve FA479B script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
