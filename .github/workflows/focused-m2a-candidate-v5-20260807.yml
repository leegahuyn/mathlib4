name: Focused phased Mock2 Advanced candidate v5

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/focused-m2a-candidate-v5-20260807.yml'
      - '.ci/focused/m2a_candidate_v5_retry.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-phased-m2a-candidate-v5
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 300
    env:
      BRANCH: fix/primality-sheaf-clean-build
      LOGDIR: /tmp/focused-proof/m2a-candidate-v5
      MARKER_OUT: /tmp/m2a_candidate_v5.json
      BUNDLE: /tmp/m2a-candidate-v5-proof.tar.gz
      PERSISTENT_MARKER: .ci/focused/m2a_candidate_v5.json

    steps:
      - name: Clone exact triggering snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          git status --porcelain=v1 | tee /tmp/m2a-v5-initial-status.txt
          test ! -s /tmp/m2a-v5-initial-status.txt
          python3 -m py_compile scripts/focused_source_audit_20260807.py
          bash -n scripts/focused_m2a_candidate_v5_20260807.sh

      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Verify Mock2 Advanced candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export FOCUSED_LOGDIR="${LOGDIR}"
          export FOCUSED_MARKER_OUT="${MARKER_OUT}"
          export FOCUSED_BUNDLE_OUT="${BUNDLE}"
          bash scripts/focused_m2a_candidate_v5_20260807.sh

      - name: Upload candidate proof bundle
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: focused-m2a-candidate-v5-${{ github.sha }}
          path: /tmp/m2a-candidate-v5-proof.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Materialize only the verified M2A source
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${PERSISTENT_MARKER}")"
          cp "${MARKER_OUT}" "${PERSISTENT_MARKER}"
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={'PrimalitySheafVerification/Mock2_Advanced.lean','.ci/focused/m2a_candidate_v5.json'}
          raw=subprocess.check_output(['git','status','--porcelain=v1'],text=True)
          seen={line[3:].split(' -> ')[-1] for line in raw.splitlines()}
          bad=seen-allowed
          if bad: raise SystemExit('unexpected M2A candidate changes: '+', '.join(sorted(bad)))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_Advanced.lean "${PERSISTENT_MARKER}"
          git commit -m 'fix: materialize phased Mock2 Advanced candidate v5'
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "$remote" != "${GITHUB_SHA}" ]]; then
            git fetch origin "${BRANCH}"
            critical="$(git diff --name-only "${GITHUB_SHA}" "$remote" | grep -E \
              '^(PrimalitySheafVerification/(Mock2|Mock2_Advanced)\.lean|lean-toolchain|lakefile\.lean|lake-manifest\.json|scripts/(repair_mock2_advanced_v6[1-8]|apply_.*_pass_repairs|focused_m2a_candidate_v5_20260807|focused_source_audit_20260807)\.(py|sh))$' || true)"
            [[ -z "$critical" ]] || { printf '%s\n' "$critical" >&2; exit 1; }
            git rebase "$remote"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Record M2A candidate failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          d=Path('/tmp/focused-proof/m2a-candidate-v5')
          def read(n):
            p=d/n; return p.read_text(errors='replace')[:20000] if p.exists() else None
          x={'status':'FAIL','phase':'M2A-candidate-v5','trigger_sha':os.environ.get('GITHUB_SHA'),
             'workflow_run':f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
             'snapshot':read('snapshot.txt'),'first_failure':read('first-failure.env'),
             'errors':{p.name:p.read_text(errors='replace')[:20000] for p in d.glob('*.first-ten-errors.txt')},
             'tails':{p.name:p.read_text(errors='replace')[-20000:] for p in d.glob('*.tail.txt')}}
          Path('/tmp/m2a_candidate_v5_failure.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
          rm -rf /tmp/m2a-v5-failure-repo
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/m2a-v5-failure-repo
          cd /tmp/m2a-v5-failure-repo
          p=.ci/focused/m2a_candidate_v5_failure.json; mkdir -p "$(dirname "$p")"
          cp /tmp/m2a_candidate_v5_failure.json "$p"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"; git diff --cached --quiet && exit 0
          git commit -m 'ci: record M2A candidate v5 failure'; git push origin "HEAD:${BRANCH}" || true

      - name: Queue bounded M2A candidate retry
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/m2a-v5-retry
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/m2a-v5-retry
          cd /tmp/m2a-v5-retry
          p=.ci/focused/m2a_candidate_v5_retry.txt; mkdir -p "$(dirname "$p")"
          n=0; [[ -f "$p" ]] && n="$(cat "$p")"; [[ "$n" =~ ^[0-9]+$ ]] || n=0
          [[ "$n" -ge 2 ]] && exit 0
          n=$((n+1)); echo "$n" > "$p"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"; git commit -m "ci: retry M2A candidate v5 (${n}/2)"; git push origin "HEAD:${BRANCH}" || true
