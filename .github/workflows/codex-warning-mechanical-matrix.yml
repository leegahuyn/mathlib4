name: Codex warning mechanical isolated matrix

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260810
    paths:
      - .github/workflows/codex-warning-mechanical-matrix.yml
      - .github/scripts/codex-warning-mechanical-matrix-runner.py
      - .github/scripts/codex-warning-mechanical-edit-manifest.json
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-warning-mechanical-${{ github.ref }}
  cancel-in-progress: false

jobs:
  direct-warning-diff:
    name: warning-diff (${{ matrix.module }})
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    continue-on-error: false
    strategy:
      fail-fast: false
      max-parallel: 3
      matrix:
        module:
          - Spt1
          - Spt2
          - Spt3
          - Spt4
          - Spt5
          - Spt6
          - Spt7
          - Mock1
          - Mock1_Advanced
    env:
      MODULE: ${{ matrix.module }}
      EVIDENCE_ROOT: /tmp/codex-warning-mechanical/${{ matrix.module }}

    steps:
      - name: Checkout exact triggering commit without credentials
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install repository-pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${EVIDENCE_ROOT}/setup"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          printf '%s\n' "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)" \
            2>&1 | tee "${EVIDENCE_ROOT}/setup/toolchain-install.log"
          lake env lean --version | tee "${EVIDENCE_ROOT}/setup/lean-version.txt"
          lake --version | tee "${EVIDENCE_ROOT}/setup/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE_ROOT}/setup/"
          lake exe cache get 2>&1 | tee "${EVIDENCE_ROOT}/setup/cache-get.log"

      - name: Materialize guarded candidate and directly compile baseline and candidate
        id: runner
        shell: bash
        run: |
          set -u
          mkdir -p "${EVIDENCE_ROOT}/provenance"
          sha256sum \
            .github/scripts/codex-warning-mechanical-matrix-runner.py \
            .github/scripts/codex-warning-mechanical-edit-manifest.json \
            > "${EVIDENCE_ROOT}/provenance/runner-manifest-sha256.txt"
          set +e
          python3 .github/scripts/codex-warning-mechanical-matrix-runner.py \
            --manifest .github/scripts/codex-warning-mechanical-edit-manifest.json \
            --module "${MODULE}" \
            --repo-root "${GITHUB_WORKSPACE}" \
            --out "${EVIDENCE_ROOT}"
          code=$?
          set -e
          printf '%s\n' "${code}" > "${EVIDENCE_ROOT}/runner.exit"
          # Preserve evidence even for the two known absolute-trust blockers.
          exit 0

      - name: Print strict warning-diff metric
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if test -f "${EVIDENCE_ROOT}/METRIC.json"; then
            python3 -m json.tool "${EVIDENCE_ROOT}/METRIC.json"
          else
            echo "METRIC.json missing"
          fi

      - name: Upload isolated baseline, candidate, and audit evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-warning-mechanical-${{ matrix.module }}-${{ github.sha }}
          path: /tmp/codex-warning-mechanical/${{ matrix.module }}
          if-no-files-found: error
          retention-days: 90

      - name: Require exact warning reduction, zero new warnings, and absolute trust clean
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${EVIDENCE_ROOT}/METRIC.json" <<'PY'
          import json
          import sys

          metric = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps({
              "module": metric.get("module"),
              "classification": metric.get("classification"),
              "gates": metric.get("gates"),
              "warning_diff": metric.get("warning_diff"),
              "forbidden_candidate_counts": metric.get("forbidden_candidate_counts"),
          }, ensure_ascii=False, indent=2))
          required = (
              metric.get("classification") == "WARNING_MECHANICAL_PASS"
              and metric.get("all_gates_pass") is True
              and metric.get("warning_zero_required") is False
              and metric.get("gates", {}).get("source_guard") is True
              and metric.get("gates", {}).get("candidate_guard") is True
              and metric.get("gates", {}).get("declaration_header_gate") is True
              and metric.get("gates", {}).get("candidate_whitespace_clean") is True
              and metric.get("gates", {}).get("baseline_direct_compile_clean") is True
              and metric.get("gates", {}).get("baseline_warning_inventory_exact") is True
              and metric.get("gates", {}).get("candidate_warning_inventory_exact") is True
              and metric.get("gates", {}).get("exact_expected_warning_multiset_reduction") is True
              and metric.get("gates", {}).get("new_warning_categories_zero") is True
              and metric.get("gates", {}).get("forbidden_absolute_zero") is True
              and metric.get("gates", {}).get("source_unchanged_after_compile") is True
              and metric.get("baseline_direct", {}).get("exit") == 0
              and metric.get("candidate_direct", {}).get("exit") == 0
              and metric.get("baseline_direct", {}).get("olean_bytes", 0) > 0
              and metric.get("baseline_direct", {}).get("ilean_bytes", 0) > 0
              and metric.get("candidate_direct", {}).get("olean_bytes", 0) > 0
              and metric.get("candidate_direct", {}).get("ilean_bytes", 0) > 0
          )
          if not required:
              raise SystemExit(
                  "warning candidate did not satisfy every strict gate; "
                  "TRUST_BLOCKED is expected for pre-existing native_decide hits"
              )
          PY
