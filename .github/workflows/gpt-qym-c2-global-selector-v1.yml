name: GPT QYM C2 strict global selector v1

on:
  push:
    branches: [gpt/qym-gb85-c2-explicit-20260819]
    paths:
      - .github/workflows/gpt-qym-c2-global-selector-v1.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-c2-global-selector-v1
  cancel-in-progress: false

jobs:
  select:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      BRANCH: gpt/qym-gb85-c2-explicit-20260819
      OUT: /tmp/qym-c2-global-selector
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true
      - name: Locate and await every C2 tournament
        shell: bash
        run: |
          set -euo pipefail;mkdir -p "$OUT"
          workflows=(gpt-qym-gb85-c2-matrix-v2.yml gpt-qym-gb85-c2-matrix-v3.yml gpt-qym-gb85-c2-discovered-v4.yml gpt-qym-gb85-c2-unfold-v5.yml)
          : > "$OUT/runs.tsv"
          for wf in "${workflows[@]}";do
            id=''
            for _ in $(seq 1 240);do payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/workflows/$wf/runs?branch=$BRANCH&event=push&per_page=20")";id="$(jq -r '[.workflow_runs[]]|sort_by(.created_at)|last|.id//empty' <<<"$payload")";[[ -n "$id" ]] && break;sleep 5;done
            test -n "$id";printf '%s\t%s\n' "$wf" "$id" >> "$OUT/runs.tsv"
          done
          : > "$OUT/completions.jsonl"
          while IFS=$'\t' read -r wf id;do
            status='';conclusion=''
            for _ in $(seq 1 3600);do payload="$(gh api -H 'Accept: application/vnd.github+json' "repos/$REPO/actions/runs/$id")";status="$(jq -r '.status' <<<"$payload")";conclusion="$(jq -r '.conclusion//""' <<<"$payload")";[[ "$status" = completed ]] && break;sleep 5;done
            test "$status" = completed;jq -n --arg workflow "$wf" --argjson run_id "$id" --arg status "$status" --arg conclusion "$conclusion" '{workflow:$workflow,run_id:$run_id,status:$status,conclusion:$conclusion}' >> "$OUT/completions.jsonl"
          done < "$OUT/runs.tsv"
      - name: Refresh branch and select only verified source/result pairs
        shell: bash
        run: |
          set -euo pipefail;git fetch origin "$BRANCH";git rebase "origin/$BRANCH";mkdir -p .github/qym-frontier
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import hashlib,json,shutil,sys
          out=Path(sys.argv[1]);root=Path('.github/qym-frontier');pairs=[(root/'QYM_GB85_C2_BEST.lean',root/'GB85_C2_RESULT.json','v2'),(root/'QYM_GB85_C2_V3_BEST.lean',root/'GB85_C2_V3_RESULT.json','v3'),(root/'QYM_GB85_C2_V4_BEST.lean',root/'GB85_C2_V4_RESULT.json','v4'),(root/'QYM_GB85_C2_V5_BEST.lean',root/'GB85_C2_V5_RESULT.json','v5')]
          completions=[json.loads(x) for x in (out/'completions.jsonl').read_text().splitlines() if x.strip()]
          def blob(raw):return hashlib.sha1(b'blob '+str(len(raw)).encode()+b'\0'+raw).hexdigest()
          valid=[];rejected=[]
          for src,rp,label in pairs:
              if not src.is_file() or not rp.is_file():rejected.append({'label':label,'reason':'missing-pair'});continue
              try:r=json.loads(rp.read_text())
              except Exception as exc:rejected.append({'label':label,'reason':f'bad-json:{exc}'});continue
              raw=src.read_bytes()
              if hashlib.sha256(raw).hexdigest()!=r.get('candidate_qym_sha256') or blob(raw)!=r.get('candidate_qym_blob'):rejected.append({'label':label,'reason':'identity'});continue
              if int(r.get('panic_lines',1))!=0 or int(r.get('error_headers',10**9))>=85 or any((r.get('forbidden') or {}).values()):rejected.append({'label':label,'reason':'not-strict'});continue
              valid.append((0 if r.get('semantic_pass') else 1,int(r['error_headers']),-int((r.get('first_error') or {}).get('line') or 0),label,src,rp,r))
          valid.sort();decision={'schema':'qym-c2-global-selection-v1','baseline':{'error_headers':85,'sha256':'f4c9b27a297be772cde7183526378ad42ae826053f69cf3ce521670da4f06210','blob':'bd28d0436230a8f0bcb01806dac01787542256b8'},'workflow_completions':completions,'promoted':bool(valid),'best':valid[0][6] if valid else None,'best_label':valid[0][3] if valid else None,'rejected':rejected}
          (root/'C2_GLOBAL_SELECTION.json').write_text(json.dumps(decision,indent=2,sort_keys=True)+'\n')
          md=['# QYM C2 global selection','',f"Promoted: **{decision['promoted']}**",'']
          if valid:md += [f"- Best family: `{valid[0][3]}`",f"- Error headers: **{valid[0][1]}**",f"- Candidate SHA256: `{valid[0][6]['candidate_qym_sha256']}`"]
          else:md += ['- No C2 candidate strictly improved the verified 85-error baseline.']
          md += ['','## Workflow completions','']+[f"- `{r['workflow']}` run `{r['run_id']}`: `{r['status']}/{r['conclusion']}`" for r in completions]
          (root/'C2_GLOBAL_SELECTION.md').write_text('\n'.join(md)+'\n')
          if valid:
              b=valid[0];shutil.copy2(b[4],root/'QYM_C2_GLOBAL_BEST.lean');shutil.copy2(b[5],root/'C2_GLOBAL_RESULT.json')
          print(json.dumps(decision,indent=2,sort_keys=True))
          PY
      - name: Commit global selection
        shell: bash
        run: |
          set -euo pipefail;git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com';git add .github/qym-frontier;if git diff --cached --quiet;then exit 0;fi;if [[ "$(jq -r '.promoted' .github/qym-frontier/C2_GLOBAL_SELECTION.json)" = true ]];then errors="$(jq -r '.best.error_headers' .github/qym-frontier/C2_GLOBAL_SELECTION.json)";git commit -m "QYM C2 global: freeze verified ${errors}-error frontier [skip ci]";else git commit -m 'QYM C2 global: preserve verified GB85 after non-improving tournaments [skip ci]';fi;git push origin "HEAD:$BRANCH"
      - name: Upload selector evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-c2-global-selector-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30
