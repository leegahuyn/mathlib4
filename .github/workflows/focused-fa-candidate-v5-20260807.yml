name: Focused phased FunctionalAnalysis candidate v5

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.ci/focused/m2a_direct_pass_v5.json'
      - '.ci/focused/fa_candidate_v5_retry.txt'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: focused-phased-fa-candidate-v5
  cancel-in-progress: false

jobs:
  candidate:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      LOGDIR: /tmp/focused-proof/fa-candidate-v5
      M2A_PASS: .ci/focused/m2a_direct_pass_v5.json
      MARKER_OUT: /tmp/fa_candidate_v5.json
      BUNDLE: /tmp/fa-candidate-v5-proof.tar.gz
      PERSISTENT_MARKER: .ci/focused/fa_candidate_v5.json

    steps:
      - name: Clone exact M2A-direct-PASS snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "${M2A_PASS}"
          git status --porcelain=v1 | tee /tmp/fa-v5-initial.txt
          test ! -s /tmp/fa-v5-initial.txt
          python3 -m py_compile scripts/focused_source_audit_20260807.py
          bash -n scripts/focused_fa_candidate_v5_20260807.sh

      - name: Install Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get

      - name: Verify substantive FunctionalAnalysis candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export FOCUSED_LOGDIR="${LOGDIR}"
          export FOCUSED_M2A_PASS_MARKER="${M2A_PASS}"
          export FOCUSED_MARKER_OUT="${MARKER_OUT}"
          export FOCUSED_BUNDLE_OUT="${BUNDLE}"
          bash scripts/focused_fa_candidate_v5_20260807.sh

      - name: Upload FA candidate proof
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: focused-fa-candidate-v5-${{ github.sha }}
          path: /tmp/fa-candidate-v5-proof.tar.gz
          if-no-files-found: warn
          retention-days: 30

      - name: Materialize only verified Integrated and compatibility sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "${PERSISTENT_MARKER}")"
          cp "${MARKER_OUT}" "${PERSISTENT_MARKER}"
          git diff --check
          python3 - <<'PY'
          import subprocess
          allowed={'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean','.ci/focused/fa_candidate_v5.json'}
          raw=subprocess.check_output(['git','status','--porcelain=v1'],text=True)
          seen={line[3:].split(' -> ')[-1] for line in raw.splitlines()}
          bad=seen-allowed
          if bad: raise SystemExit('unexpected FA candidate changes: '+', '.join(sorted(bad)))
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean "${PERSISTENT_MARKER}"
          git commit -m 'fix: materialize phased FunctionalAnalysis candidate v5'
          remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "$remote" != "${GITHUB_SHA}" ]]; then
            git fetch origin "${BRANCH}"
            critical="$(git diff --name-only "${GITHUB_SHA}" "$remote" | grep -E \
              '^(PrimalitySheafVerification/(Mock2|Mock2_Advanced|Mock2_FunctionalAnalysis|Mock2_FunctionalAnalysis_Integrated)\.lean|\.ci/focused/m2a_direct_pass_v5\.json|lean-toolchain|lakefile\.lean|lake-manifest\.json|scripts/(apply_.*_pass_repairs|focused_fa_candidate_v5_20260807|focused_source_audit_20260807)\.(py|sh))$' || true)"
            [[ -z "$critical" ]] || { printf '%s\n' "$critical" >&2; exit 1; }
            git rebase "$remote"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Record FA candidate failure
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          d=Path('/tmp/focused-proof/fa-candidate-v5')
          def read(n): p=d/n; return p.read_text(errors='replace')[:24000] if p.exists() else None
          x={'status':'FAIL','phase':'FA-candidate-v5','trigger_sha':os.environ.get('GITHUB_SHA'),
             'workflow_run':f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
             'snapshot':read('snapshot.txt'),'first_failure':read('first-failure.env'),
             'errors':{p.name:p.read_text(errors='replace')[:24000] for p in d.glob('*.first-ten-errors.txt')},
             'tails':{p.name:p.read_text(errors='replace')[-24000:] for p in d.glob('*.tail.txt')}}
          Path('/tmp/fa_candidate_v5_failure.json').write_text(json.dumps(x,indent=2)+'\n')
          PY
          rm -rf /tmp/fa-v5-failure
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fa-v5-failure
          cd /tmp/fa-v5-failure
          p=.ci/focused/fa_candidate_v5_failure.json; mkdir -p "$(dirname "$p")"; cp /tmp/fa_candidate_v5_failure.json "$p"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"; git diff --cached --quiet && exit 0
          git commit -m 'ci: record FA candidate v5 failure'; git push origin "HEAD:${BRANCH}" || true

      - name: Queue bounded FA candidate retry
        if: failure()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          rm -rf /tmp/fa-v5-retry
          git clone --branch "${BRANCH}" --single-branch \
            "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" /tmp/fa-v5-retry
          cd /tmp/fa-v5-retry
          p=.ci/focused/fa_candidate_v5_retry.txt; mkdir -p "$(dirname "$p")"
          n=0; [[ -f "$p" ]] && n="$(cat "$p")"; [[ "$n" =~ ^[0-9]+$ ]] || n=0
          [[ "$n" -ge 2 ]] && exit 0
          n=$((n+1)); echo "$n" > "$p"
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$p"; git commit -m "ci: retry FA candidate v5 (${n}/2)"; git push origin "HEAD:${BRANCH}" || true
