name: Codex FA API probe CLM sub nhds v1
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-clm-sub-nhds-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Compile explicit nested CLM subtraction bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ClmSubNhdsProbe.lean <<'LEAN'
          import Mathlib
          noncomputable section
          open Filter Topology
          variable {H : Type*} [NormedAddCommGroup H] [NormedSpace ℂ H]
          abbrev Anti (H : Type*) [NormedAddCommGroup H] [NormedSpace ℂ H] := H →L⋆[ℂ] ℂ

          example (Tn : ℕ → H →L[ℂ] Anti H) (T : H →L[ℂ] Anti H)
              (hzero : Tendsto (fun N => Tn N - T) atTop (nhds 0)) :
              Tendsto Tn atTop (nhds T) := by
            letI : IsTopologicalAddGroup (Anti H) :=
              ContinuousLinearMap.topologicalAddGroup
            letI : IsTopologicalAddGroup (H →L[ℂ] Anti H) :=
              ContinuousLinearMap.topologicalAddGroup
            exact (tendsto_sub_nhds_zero_iff).mp hzero
          LEAN
          lake env lean /tmp/ClmSubNhdsProbe.lean
