name: GPT QYM Probe40 full stabilizer integrated v2

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe40-full-stabilizer-v2.yml
      - .github/qym_probe40_full_stabilizer_patch.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-probe40-full-stabilizer-v2-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe40:
    name: exact 89-error authority to full stabilizer direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-probe40-full-stabilizer-v2
      AUTH_RUN: '32095253829'
      AUTH_ARTIFACT: qym-probe35-flat_named-da2958a421605d9b267afdce59990ec19c1be10f-attempt1
      AUTH_SHA: 00f2c8ba7fc0329b04ae67c5a67b5814f8118b14222a7831a0401c9d3d374e53
      AUTH_BLOB: ee2faeaf281215b0e9b304a96ccdce3e8cdc0ffb
      AUTH_ERRORS: '89'
      CANDIDATE_SHA: 214800658b1de6c5685947061e9483fb65a803db0e0f4145ea27cc15e4dd28b6
      CANDIDATE_BLOB: 66c35ed381b9db91ac804dc4507c7c5d6eb48c80

    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate pinned environment and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f .github/qym_probe40_full_stabilizer_patch.py
          test -f .github/qym_probe_summarize.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          sha256sum "$QYM" > "$OUT/canonical-before.sha256"
          git hash-object --no-filters "$QYM" > "$OUT/canonical-before.blob"

      - name: Download exact immutable 89-error authority
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.AUTH_ARTIFACT }}
          path: ${{ runner.temp }}/authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: 32095253829

      - name: Gate exact full-QYM authority bytes and direct result
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/authority"
          for f in \
            QYM.candidate-probe35-flat_named.lean \
            QYM.exit QYM.error-headers.txt QYM.panic-lines.txt \
            QYM.log PROBE_RESULT.json; do
            test -f "$A/$f"
          done
          test "$(sha256sum "$A/QYM.candidate-probe35-flat_named.lean" | awk '{print $1}')" = "$AUTH_SHA"
          test "$(git hash-object --no-filters "$A/QYM.candidate-probe35-flat_named.lean")" = "$AUTH_BLOB"
          test "$(cat "$A/QYM.exit")" = 1
          test "$(wc -l < "$A/QYM.error-headers.txt")" -eq "$AUTH_ERRORS"
          test ! -s "$A/QYM.panic-lines.txt"
          python3 - "$A/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['candidate_qym_sha256'] == os.environ['AUTH_SHA']
          assert r['candidate_qym_blob'] == os.environ['AUTH_BLOB']
          assert r['exit'] == 1
          assert r['error_headers'] == int(os.environ['AUTH_ERRORS'])
          assert r['panic_lines'] == 0
          PY
          cp "$A/QYM.candidate-probe35-flat_named.lean" "$OUT/QYM.authority.lean"
          cp "$A/PROBE_RESULT.json" "$OUT/AUTHORITY_RESULT.json"
          cp "$A/QYM.log" "$OUT/QYM.authority.log"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure dependency objects
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$stem" = Mock2_FunctionalAnalysis || "$stem" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$stem.olean" "$OLEAN/$stem.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$stem.olean" -i "$OLEAN/$stem.ilean" \
                "PrimalitySheafVerification/$stem.lean" > "$OUT/$stem.log" 2>&1
            done
          fi
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$stem.olean"
            test -s "$OLEAN/$stem.ilean"
          done

      - name: Materialize exact integrated full-stabilizer candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.authority.lean" "$QYM"
          python3 -B .github/qym_probe40_full_stabilizer_patch.py \
            "$QYM" "$OUT/PATCH_RESULT.json" | tee "$OUT/PATCH_RESULT.stdout.json"
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$CANDIDATE_SHA"
          test "$(git hash-object --no-filters "$QYM")" = "$CANDIDATE_BLOB"
          cp "$QYM" "$OUT/QYM.candidate-probe40-full-stabilizer-v2.lean"
          sha256sum "$QYM" > "$OUT/QYM.candidate.sha256"
          git hash-object --no-filters "$QYM" > "$OUT/QYM.candidate.blob"

      - name: Full direct Lean compile integrated candidate
        shell: bash
        run: |
          set -euo pipefail
          printf '%q ' lake env lean -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.probe40.olean" \
            -i "$RUNNER_TEMP/QYM.probe40.ilean" "$QYM" > "$OUT/QYM.command"
          printf '\n' >> "$OUT/QYM.command"
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe40.olean" \
              -i "$RUNNER_TEMP/QYM.probe40.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe40.olean"
            test -s "$RUNNER_TEMP/QYM.probe40.ilean"
            cp "$RUNNER_TEMP/QYM.probe40.olean" "$OUT/QYM.probe40.olean"
            cp "$RUNNER_TEMP/QYM.probe40.ilean" "$OUT/QYM.probe40.ilean"
            sha256sum "$OUT/QYM.probe40.olean" "$OUT/QYM.probe40.ilean" \
              > "$OUT/QYM.outputs.sha256"
          fi
          exit 0

      - name: Restore canonical and summarize exact direct result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 -B .github/qym_probe_summarize.py \
            "$OUT" "qym-probe40-full-stabilizer-v2" \
            "$CANDIDATE_SHA" "$CANDIDATE_BLOB" "$AUTH_SHA"
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          p = sys.argv[1]
          r = json.load(open(p, encoding='utf-8'))
          r['authority_run_id'] = int(os.environ['AUTH_RUN'])
          r['authority_artifact'] = os.environ['AUTH_ARTIFACT']
          r['baseline_error_headers'] = int(os.environ['AUTH_ERRORS'])
          patch = json.load(open(os.path.join(os.path.dirname(p), 'PATCH_RESULT.json'), encoding='utf-8'))
          r['bytes'] = patch['bytes']
          r['lf'] = patch['lf']
          with open(p, 'w', encoding='utf-8') as f:
            json.dump(r, f, indent=2, sort_keys=True)
            f.write('\n')
          print(json.dumps(r, indent=2, sort_keys=True))
          PY
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$(awk '{print $1}' "$OUT/canonical-before.sha256")"
          test "$(git hash-object --no-filters "$QYM")" = "$(cat "$OUT/canonical-before.blob")"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable full-QYM evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe40-full-stabilizer-v2-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-probe40-full-stabilizer-v2/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless strict GLOBAL_BEST improvement or TRUE PASS
        if: always()
        shell: bash
        run: |
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          assert r['candidate_qym_sha256'] == os.environ['CANDIDATE_SHA']
          assert r['candidate_qym_blob'] == os.environ['CANDIDATE_BLOB']
          assert r['panic_lines'] == 0
          if r['semantic_pass']:
            raise SystemExit(0)
          if r['error_headers'] >= int(os.environ['AUTH_ERRORS']):
            raise SystemExit(1)
          PY
