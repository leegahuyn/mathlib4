name: PASS 392 explicit donor region and ordered verification

on:
  push:
    branches: [fix/fa392-explicit-donor-region-20260809]
    paths:
      - '.github/workflows/pass392-fa-frontier.yml'
      - 'scripts/apply_three_hundred_ninety_second_pass_functional_analysis_repairs.py'
      - 'scripts/ci_pass392_verify.sh'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass392-fa-frontier
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout PASS 392 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          mkdir -p /tmp/pass392/{logs,source}

      - name: Download PASS 376 donor and apply PASS 392
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh api /repos/${GITHUB_REPOSITORY}/actions/artifacts/9024606745/zip \
            > /tmp/pass376-donor.zip
          unzip -q /tmp/pass376-donor.zip -d /tmp/pass376-donor
          donor="$(find /tmp/pass376-donor -type f \
            -name 'Mock2_FunctionalAnalysis-pass376.lean' -print -quit)"
          test -n "${donor}"
          PASS376_DONOR="${donor}" \
            python3 scripts/apply_three_hundred_ninety_second_pass_functional_analysis_repairs.py \
            | tee /tmp/pass392/logs/apply-pass392.log
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)" = \
            'ec0ed028d3d6d45e90e034be9d4686e39a9eb595e57beafd2c6a54fe4c61bcda'

      - name: Compile mandatory chain
        id: verify
        shell: bash
        run: |
          set +e
          PASS392_EVIDENCE=/tmp/pass392 bash scripts/ci_pass392_verify.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Materialize PASS 392 source and compact status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/pass392-aggregate
          cp /tmp/pass392/*.txt /tmp/pass392/*.csv /tmp/pass392/*.json \
            build-logs/pass392-aggregate/ 2>/dev/null || true
          python3 - <<'PY'
          import csv, hashlib, json
          from pathlib import Path
          source=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rows=[]
          p=Path('/tmp/pass392/compile-summary.csv')
          if p.exists(): rows=list(csv.DictReader(p.open()))
          status=Path('/tmp/pass392/final-status.txt').read_text().strip() if Path('/tmp/pass392/final-status.txt').exists() else 'missing'
          complete=bool(rows) and 'exit_code=0' in status and all(
              r['exit_code']=='0' and r['error_count']=='0' for r in rows)
          data={'complete':complete,'status':status,
                'source_sha256':hashlib.sha256(source.read_bytes()).hexdigest(),
                'compile_rows':rows}
          Path('build-logs/pass392-aggregate/AUTHORITATIVE_STATUS.json').write_text(
              json.dumps(data,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/pass392-aggregate
          if ! git diff --cached --quiet; then
            git commit -m 'fix(fa): materialize PASS392 explicit donor-region result'
            git push origin HEAD:fix/fa392-explicit-donor-region-20260809
          fi

      - name: Upload PASS 392 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass392-fa-frontier-${{ github.sha }}
          path: /tmp/pass392
          if-no-files-found: error
          retention-days: 90

      - name: Enforce result
        if: always()
        shell: bash
        env:
          FINAL_EXIT: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "${FINAL_EXIT}"
