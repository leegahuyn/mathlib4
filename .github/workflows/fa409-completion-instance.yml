name: PASS 409 completion-instance repair and ordered gate

on:
  push:
    branches: [fix/fa409-completion-instance-20260809]
    paths:
      - '.github/workflows/fa409-completion-instance.yml'
      - 'scripts/fa409_completion_instance_repair.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa409-completion-instance
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 110
    steps:
      - name: Checkout PASS 409 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa409-completion-instance-20260809
          fetch-depth: 1500
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Apply completion-instance repair
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa409_completion_instance_repair.py

      - name: Compile in required order
        id: verify
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa409-completion-instance
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          compile_one() {
            local stem=$1
            local run=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors=400 -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}-run${run}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${run}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          final=1
          compile_one Mock2 1; rc_m2=$?
          compile_one Mock2_Advanced 1; rc_m2a=$?
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1; rc_fa1=$?
          else
            rc_fa1=125
          fi
          rc_fa2=125
          rc_int1=125
          rc_int2=125
          rc_qym1=125
          rc_qym2=125
          if test "$rc_fa1" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 2; rc_fa2=$?
          fi
          if test "$rc_fa2" -eq 0 && test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            compile_one Mock2_FunctionalAnalysis_Integrated 1; rc_int1=$?
            if test "$rc_int1" -eq 0; then
              compile_one Mock2_FunctionalAnalysis_Integrated 2; rc_int2=$?
            fi
          fi
          rc_mock3=0
          if test "$rc_int2" -eq 0; then
            shopt -s nullglob
            for src in PrimalitySheafVerification/Mock3*.lean; do
              stem=$(basename "$src" .lean)
              compile_one "$stem" 1 || rc_mock3=1
              test "$rc_mock3" -eq 0 && compile_one "$stem" 2 || rc_mock3=1
            done
          else
            rc_mock3=125
          fi
          if test "$rc_int2" -eq 0 && test "$rc_mock3" -eq 0; then
            compile_one QYM 1; rc_qym1=$?
            if test "$rc_qym1" -eq 0; then
              compile_one QYM 2; rc_qym2=$?
            fi
          fi
          if test "$rc_fa1" -eq 0 && test "$rc_fa2" -eq 0 && \
             test "$rc_int1" -eq 0 && test "$rc_int2" -eq 0 && \
             test "$rc_mock3" -eq 0 && test "$rc_qym1" -eq 0 && test "$rc_qym2" -eq 0; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, re
          d=Path('build-logs/fa409-completion-instance')
          rows={}
          pat=re.compile(r'\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          for p in sorted(d.glob('*-run*.log')):
              text=p.read_text(encoding='utf-8',errors='replace')
              ms=list(pat.finditer(text))
              exit_path=p.with_suffix('.exit')
              rows[p.stem]={
                  'exit_code':int(exit_path.read_text()) if exit_path.exists() else 999,
                  'errors':len(ms),
                  'first_line':int(ms[0].group(1)) if ms else 0,
                  'first_col':int(ms[0].group(2)) if ms else 0,
              }
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          status={
              'complete':(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists(),
              'stage':'ordered FA Integrated Mock3 QYM gate',
              'fa_source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'runs':rows,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2),encoding='utf-8')
          print(json.dumps(status,indent=2))
          PY
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit repaired source and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            build-logs/fa409-completion-instance
          if ! git diff --cached --quiet; then
            if test -f build-logs/fa409-completion-instance/ALL_REQUIRED_TARGETS_2X_PASS; then
              msg='fix: obtain PASS 409 FA Integrated Mock3 QYM 2x PASS'
            else
              msg='fix: preserve PASS 409 completion-instance repair frontier'
            fi
            git commit -m "$msg [skip ci]"
            git push origin HEAD:fix/fa409-completion-instance-20260809
          fi

      - name: Upload PASS 409 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa409-completion-instance-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa409-completion-instance
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce ordered final result
        if: always()
        shell: bash
        env:
          FINAL_EXIT: ${{ steps.verify.outputs.final_exit }}
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
