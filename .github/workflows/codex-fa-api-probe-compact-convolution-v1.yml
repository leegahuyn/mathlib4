name: Codex FA 3669 Fubini measurable API probe
# trigger: fa3669-fubini-shapes-v1-fire
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile Fubini measurable shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/Probe3669.lean <<'LEAN'
          import Mathlib

          open MeasureTheory Function

          #check AEStronglyMeasurable.integral_prod_left'
          #check AEStronglyMeasurable.integral_prod_right'

          variable {E : Type*} [NormedAddCommGroup E] [NormedSpace ℝ E]
          variable (f : ℂ × ℂ → E)
          variable (hf : AEStronglyMeasurable f ((volume : Measure ℂ).prod (volume : Measure ℂ)))

          example : AEStronglyMeasurable
              (fun t : ℂ => ∫ x : ℂ, ‖f (x,t)‖ ∂(volume : Measure ℂ))
              (volume : Measure ℂ) := by
            simpa only [Function.uncurry_apply_pair] using hf.norm.integral_prod_left'

          variable (a b : ℂ × ℂ → ℂ)
          variable (ha : AEStronglyMeasurable a ((volume : Measure ℂ).prod (volume : Measure ℂ)))
          variable (hb : AEStronglyMeasurable b ((volume : Measure ℂ).prod (volume : Measure ℂ)))

          example : AEStronglyMeasurable
              (Function.uncurry fun x t : ℂ => a (x,t) * b (x,t))
              ((volume : Measure ℂ).prod (volume : Measure ℂ)) := by
            change AEStronglyMeasurable (fun p : ℂ × ℂ => a p * b p)
              ((volume : Measure ℂ).prod (volume : Measure ℂ))
            exact ha.mul hb

          example (K : ℂ → ℂ) (v u : ℂ → ℂ) (t : ℂ) :
              (Function.uncurry (fun x t : ℂ => v x * K t * u (x-t))) (0,t) =
                v 0 * K t * u (0-t) := by
            rfl
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/Probe3669.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-3669-fubini-shapes-${{ github.sha }}
          path: |
            /tmp/Probe3669.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
