name: Codex FA joint-graph subtraction and Tendsto normalization probe v2
# trigger: joint-graph-normalize-v2
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile joint-graph normalization shapes v2
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeJointGraph.lean <<'LEAN'
          import Mathlib

          open Filter Topology

          variable {E F : Type*}
          variable [AddCommGroup E] [Module ℂ E]
          variable [AddCommGroup F] [Module ℂ F]

          example (S : Submodule ℂ (E × F)) (a : E) (l l0 : F)
              (h1 : (a,l) ∈ S) (h2 : (a,l0) ∈ S) :
              (0, l - l0) ∈ S := by
            have hRaw : ((a,l) - (a,l0) : E × F) ∈ S := S.sub_mem h1 h2
            have hEq : ((a,l) - (a,l0) : E × F) = (0, l - l0) := by
              ext <;> simp
            rw [← hEq]
            exact hRaw

          variable {ι A B C : Type*}
          variable [TopologicalSpace A] [TopologicalSpace B] [TopologicalSpace C]
          variable {l : Filter ι} {fa : ι → A} {fb : ι → B} {fc : ι → C}
          variable {a : A} {b : B} {c : C}

          example (ha : Tendsto fa l (𝓝 a))
              (hb : Tendsto fb l (𝓝 b)) (hc : Tendsto fc l (𝓝 c)) :
              Tendsto (fun i => (fa i, (fb i, fc i))) l (𝓝 (a,(b,c))) := by
            exact ha.prodMk_nhds (hb.prodMk_nhds hc)

          example (ha : Tendsto fa l (𝓝 a))
              (hb : Tendsto fb l (𝓝 b)) (hc : Tendsto fc l (𝓝 c)) :
              Tendsto
                (fun i => WithLp.toLp 2 (fa i, WithLp.toLp 2 (fb i, fc i)))
                l
                (𝓝 (WithLp.toLp 2 (a, WithLp.toLp 2 (b,c)))) := by
            exact ha.prodMk_nhds (hb.prodMk_nhds hc)

          variable {X : Type*} [TopologicalSpace X]
          variable (M : X → A × (B × C)) (w : ι → X)
          example
              (hM : ∀ x, M x = ((M x).1, (((M x).2).1, ((M x).2).2)))
              (ha : Tendsto (fun i => (M (w i)).1) l (𝓝 a))
              (hb : Tendsto (fun i => ((M (w i)).2).1) l (𝓝 b))
              (hc : Tendsto (fun i => ((M (w i)).2).2) l (𝓝 c)) :
              Tendsto (fun i => M (w i)) l (𝓝 (a,(b,c))) := by
            have h := ha.prodMk_nhds (hb.prodMk_nhds hc)
            refine h.congr' ?_
            exact Filter.Eventually.of_forall fun i => (hM (w i)).symm
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeJointGraph.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-joint-graph-normalize-v2-${{ github.sha }}
          path: |
            /tmp/ProbeJointGraph.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
