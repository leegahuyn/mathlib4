name: Codex FA finite partition coercion API probe v4
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile partition coercion bridge variants
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeA.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff
          variable {ι : Type*} {s : Set ℂ}
          example (ρ : SmoothPartitionOfUnity ι 𝓘(ℝ, ℂ) ℂ s) (i : ι) :
              ContDiff ℝ ∞ (ρ i : ℂ → ℝ) := by
            have hp := (ρ i).property
            rw [contMDiff_iff_contDiff] at hp
            convert hp using 1
          LEAN
          cat >/tmp/ProbeB.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff
          variable {ι : Type*} {s : Set ℂ}
          example (ρ : SmoothPartitionOfUnity ι 𝓘(ℝ, ℂ) ℂ s) (i : ι) :
              ContDiff ℝ ∞ (ρ i : ℂ → ℝ) := by
            have hp := (ρ i).property
            rw [contMDiff_iff_contDiff] at hp
            have hfun : (↑(ρ i) : ℂ → ℝ) = (ρ i : ℂ → ℝ) := by
              funext x
              rfl
            rw [← hfun]
            exact hp
          LEAN
          cat >/tmp/ProbeC.lean <<'LEAN'
          import Mathlib
          open Set Function Topology
          open scoped Manifold ContDiff
          variable {ι : Type*} {s : Set ℂ}
          example (ρ : SmoothPartitionOfUnity ι 𝓘(ℝ, ℂ) ℂ s) (i : ι) :
              ContDiff ℝ ∞ (ρ i : ℂ → ℝ) := by
            have hp := (ρ i).property
            rw [contMDiff_iff_contDiff] at hp
            apply hp.congr
            intro x
            rfl
          LEAN
          : >/tmp/results.txt
          for x in A B C; do
            set +e
            lake env lean -DmaxErrors=40 -DwarningAsError=false "/tmp/Probe${x}.lean" >"/tmp/Probe${x}.log" 2>&1
            rc=$?
            set -e
            echo "$x=$rc" | tee -a /tmp/results.txt
          done
          cat /tmp/results.txt
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-partition-coercion-v4-${{ github.sha }}
          path: |
            /tmp/Probe*.lean
            /tmp/Probe*.log
            /tmp/results.txt
          retention-days: 30
