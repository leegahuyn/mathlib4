name: Codex FA Friedrichs real-complex convolution API probe
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile real-complex convolution API shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeFriedrichsConv.lean <<'LEAN'
          import Mathlib
          open MeasureTheory
          #check ContinuousLinearMap.lsmul
          #check HasCompactSupport.contDiff_convolution_left
          #check HasCompactSupport.convolution

          def realSmulComplex : ℝ →L[ℝ] (ℂ →L[ℝ] ℂ) :=
            ContinuousLinearMap.lsmul ℝ ℂ

          example (f : ℂ → ℝ) (g : ℂ → ℂ) : ℂ → ℂ :=
            f ⋆[realSmulComplex, volume] g

          example (f : ℂ → ℝ) (g : ℂ → ℂ)
              (hf : HasCompactSupport f) (hfd : ContDiff ℝ ∞ f) :
              ContDiff ℝ ∞ (f ⋆[realSmulComplex, volume] g) := by
            exact hf.contDiff_convolution_left realSmulComplex volume hfd

          example (f : ℂ → ℝ) (g : ℂ → ℂ)
              (hg : HasCompactSupport g) :
              HasCompactSupport (f ⋆[realSmulComplex, volume] g) := by
            exact hg.convolution realSmulComplex f
          LEAN
          set +e
          lake env lean -DmaxErrors=40 -DwarningAsError=false /tmp/ProbeFriedrichsConv.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-friedrichs-real-complex-conv-${{ github.sha }}
          path: |
            /tmp/ProbeFriedrichsConv.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
