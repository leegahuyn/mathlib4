name: Codex FA v38 parallel early-root probes
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-compact-convolution-v1.yml
      - scripts/fa_v38_earlyroots_probe.py
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        variant: [rw_hidx, simp_hidx, cast_convert, coord_eq_first, coord_eq_n]
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Materialize exact v37 and generate variants
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          ART=9172306868
          DIGEST=sha256:f8d9e30cc4c9a972f14bf9cf1d85b1a2c4c7cebb7b39fb0a039af3a6cf7bbc2e
          BASE=e17ff90193c6959b15f743ef930446b4cfd45bc6df4d762057c13b4b06602d05
          rm -rf /tmp/v37 /tmp/v38probe
          mkdir -p /tmp/v37 /tmp/v38probe
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${ART}/zip" >/tmp/v37.zip
          test "sha256:$(sha256sum /tmp/v37.zip | awk '{print $1}')" = "$DIGEST"
          unzip -q /tmp/v37.zip -d /tmp/v37
          SRC="$(find /tmp/v37 -path '*/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean' -type f -print -quit)"
          test -n "$SRC"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "$BASE"
          python3 scripts/fa_v38_earlyroots_probe.py "$SRC" /tmp/v38probe
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile selected cumulative prefix
        env:
          VARIANT: "${{ matrix.variant }}"
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake env lean -DmaxErrors=1000 -DwarningAsError=false "/tmp/v38probe/ProbeFA_${VARIANT}.lean" >"/tmp/v38probe/${VARIANT}.log" 2>&1
          rc=$?
          set -e
          echo "$rc" >"/tmp/v38probe/${VARIANT}.exit"
          echo "${VARIANT}=${rc}"
      - name: Upload selected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v38-earlyroot-${{ matrix.variant }}-${{ github.sha }}
          path: |
            /tmp/v38probe/${{ matrix.variant }}.log
            /tmp/v38probe/${{ matrix.variant }}.exit
            /tmp/v38probe/manifest.json
          retention-days: 30
