name: Codex FA v38 energy-transport early-root batch probe
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-api-probe-compact-convolution-v1.yml
      - scripts/fa_v38_earlyroots_probe.py
  workflow_dispatch:
permissions: {actions: read, contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Materialize exact v37 and generate energy-transport batch
        env:
          GH_TOKEN: "${{ github.token }}"
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/v37 /tmp/v38probe
          mkdir -p /tmp/v37 /tmp/v38probe
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9172306868/zip" >/tmp/v37.zip
          test "sha256:$(sha256sum /tmp/v37.zip | awk '{print $1}')" = "sha256:f8d9e30cc4c9a972f14bf9cf1d85b1a2c4c7cebb7b39fb0a039af3a6cf7bbc2e"
          unzip -q /tmp/v37.zip -d /tmp/v37
          SRC="$(find /tmp/v37 -path '*/PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean' -type f -print -quit)"
          test -n "$SRC"
          test "$(sha256sum "$SRC" | awk '{print $1}')" = "e17ff90193c6959b15f743ef930446b4cfd45bc6df4d762057c13b4b06602d05"
          python3 scripts/fa_v38_earlyroots_probe.py "$SRC" /tmp/v38probe
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile cumulative early-root prefix highcap
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          lake env lean -DmaxErrors=1000 -DwarningAsError=false /tmp/v38probe/ProbeFA_energy_transport.lean > /tmp/v38probe/energy_transport.log 2>&1
          rc=$?
          set -e
          echo "$rc" > /tmp/v38probe/energy_transport.exit
      - name: Build target declaration diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import json,re
          p=Path('/tmp/v38probe/ProbeFA_energy_transport.lean')
          s=p.read_text(errors='replace') if p.exists() else ''
          log=Path('/tmp/v38probe/energy_transport.log').read_text(errors='replace') if Path('/tmp/v38probe/energy_transport.log').exists() else ''
          dr=re.compile(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)')
          ds=list(dr.finditer(s)); starts=[s.count('\n',0,m.start())+1 for m in ds]
          er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$')
          di=[]
          for raw in log.splitlines():
            m=er.match(raw)
            if not m: continue
            ln=int(m.group(1)); idx=bisect_right(starts,ln)-1
            di.append({'line':ln,'column':int(m.group(2)),'declaration':ds[idx].group('name') if idx>=0 else None,'declaration_index':idx if idx>=0 else None,'message':m.group(3).strip()})
          targets=['energyForm_eq_inner_strongPrincipalCore','integrable_fullPlaneTest_mul_kernel_mul_translate','cauchySeq_lowerFromSuccCoordinate_of_base_raise_tendsto','literalStageCutoffReal_contDiff']
          r={'compile_exit':int(Path('/tmp/v38probe/energy_transport.exit').read_text()) if Path('/tmp/v38probe/energy_transport.exit').exists() else None,'total_error_headers':len(di),'target_counts':{t:sum(d['declaration']==t for d in di) for t in targets},'target_diagnostics':[d for d in di if d['declaration'] in targets]}
          Path('/tmp/v38probe/targets.json').write_text(json.dumps(r,indent=2,sort_keys=True)+'\n')
          print(json.dumps(r,indent=2,sort_keys=True))
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v38-energy-transport-${{ github.sha }}
          path: |
            /tmp/v38probe/energy_transport.log
            /tmp/v38probe/energy_transport.exit
            /tmp/v38probe/targets.json
            /tmp/v38probe/manifest.json
          retention-days: 30
