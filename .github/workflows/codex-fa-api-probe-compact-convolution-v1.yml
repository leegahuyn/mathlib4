name: Codex FA quotient orientation and density nonneg probe
# trigger: quotient-density-nonneg-v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile quotient and density shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeQuotDensity.lean <<'LEAN'
          import Mathlib

          #print Quotient.exact'

          example (c a b d : ℝ) (hc : 0 ≤ c) (ha : 0 ≤ a)
              (hb : 0 ≤ b) (hd : 0 ≤ d) :
              0 ≤ c * a + 3 * b + 3 * d := by
            exact add_nonneg
              (add_nonneg (mul_nonneg hc ha) (mul_nonneg (by norm_num) hb))
              (mul_nonneg (by norm_num) hd)

          example (r : ℝ) (hr : 0 < r) : ‖r‖ = r := by
            rw [Real.norm_eq_abs, abs_of_pos hr]
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeQuotDensity.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-quotient-density-nonneg-${{ github.sha }}
          path: |
            /tmp/ProbeQuotDensity.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
