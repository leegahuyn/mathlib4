name: Codex FA pinned Mathlib API drift probe v6
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Locate and compile drifted API names
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          {
            echo '=== finrank complex real ==='
            grep -R -n -E 'finrank.*real.*complex|finrank.*ℝ.*ℂ|finrank_real_complex|finrank_complex' Mathlib | head -80 || true
            echo '=== map_ofReal ==='
            grep -R -n -E 'map_ofReal|ofReal.*map|map.*ofReal' Mathlib | head -80 || true
            echo '=== L2 norm integral ==='
            grep -R -n -E 'norm_sq.*integral|integral.*norm_sq|norm.*toLp|Lp.*norm' Mathlib/MeasureTheory Mathlib/Analysis | head -120 || true
            echo '=== eigenspace ==='
            grep -R -n -E 'def eigenspace|theorem eigenspace|eigenspace ' Mathlib/LinearAlgebra Mathlib/Analysis | head -120 || true
          } | tee /tmp/api-grep.txt
          cat >/tmp/ProbeAPI.lean <<'LEAN'
          import Mathlib
          #check Complex.finrank_real_complex
          #check Module.finrank
          #check LinearMap.ker
          #check Module.End.eigenspace
          #check ContinuousLinearMap.map_smul
          #check RCLike.ofReal_re
          #check MeasureTheory.MemLp.toLp
          #check MeasureTheory.Lp.norm_def
          LEAN
          set +e
          lake env lean -DmaxErrors=80 -DwarningAsError=false /tmp/ProbeAPI.lean > /tmp/probe-api.log 2>&1
          rc=$?
          set -e
          echo "ProbeAPI=$rc" | tee /tmp/results.txt
          cat /tmp/probe-api.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-drift-v6-${{ github.sha }}
          path: |
            /tmp/ProbeAPI.lean
            /tmp/probe-api.log
            /tmp/api-grep.txt
            /tmp/results.txt
          retention-days: 30
