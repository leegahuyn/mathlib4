name: Codex FA WithLp Tendsto normalization probe v4
# trigger: withlp-tendsto-v4
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile WithLp Tendsto shapes v4
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeWithLp.lean <<'LEAN'
          import Mathlib

          open Filter Topology

          variable {ι A B C : Type*}
          variable [TopologicalSpace A] [TopologicalSpace B] [TopologicalSpace C]
          variable {l : Filter ι} {fa : ι → A} {fb : ι → B} {fc : ι → C}
          variable {a : A} {b : B} {c : C}

          example (ha : Tendsto fa l (𝓝 a))
              (hb : Tendsto fb l (𝓝 b)) (hc : Tendsto fc l (𝓝 c)) :
              Tendsto
                (fun i => WithLp.toLp 2 (fa i, WithLp.toLp 2 (fb i, fc i)))
                l
                (𝓝 (WithLp.toLp 2 (a, WithLp.toLp 2 (b,c)))) := by
            have hInnerRaw := hb.prodMk_nhds hc
            have hInnerMap : Continuous (fun p : B × C => WithLp.toLp 2 p) := by
              fun_prop
            have hInner := hInnerMap.continuousAt.tendsto.comp hInnerRaw
            have hOuterRaw := ha.prodMk_nhds hInner
            have hOuterMap : Continuous (fun p : A × WithLp 2 (B × C) => WithLp.toLp 2 p) := by
              fun_prop
            exact hOuterMap.continuousAt.tendsto.comp hOuterRaw
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbeWithLp.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-withlp-tendsto-v4-${{ github.sha }}
          path: |
            /tmp/ProbeWithLp.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
