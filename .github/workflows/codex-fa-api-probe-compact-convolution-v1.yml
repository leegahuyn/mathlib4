name: Codex FA 3690 pair subtraction normalization probe
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-compact-convolution-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Compile pair subtraction proof shapes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbePairSub.lean <<'LEAN'
          import Mathlib

          variable {A B : Type*} [AddCommGroup A] [AddCommGroup B]

          example (a : A) (b c : B) :
              (a,b) - (a,c) = ((0 : A), b - c) := by
            ext <;> simp

          variable {R : Type*} [Ring R]
          variable {M : Type*} [AddCommGroup M] [Module R M]
          variable (G : Submodule R (A × B))

          example (a : A) (b c : B)
              (hab : (a,b) ∈ G) (hac : (a,c) ∈ G) :
              ((0 : A), b - c) ∈ G := by
            have hRaw := G.sub_mem hab hac
            have hPairEq : (a,b) - (a,c) = ((0 : A), b - c) := by
              ext <;> simp
            rw [hPairEq] at hRaw
            exact hRaw
          LEAN
          set +e
          lake env lean -DmaxErrors=30 -DwarningAsError=false /tmp/ProbePairSub.lean 2>&1 | tee /tmp/probe.log
          x=${PIPESTATUS[0]}
          set -e
          echo "$x" >/tmp/probe.exit
          exit "$x"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-3690-pair-sub-${{ github.sha }}
          path: |
            /tmp/ProbePairSub.lean
            /tmp/probe.log
            /tmp/probe.exit
          retention-days: 30
