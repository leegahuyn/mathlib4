name: Codex FA API probe UpperHalfPlane real norm v1

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-upperhalfplane-realnorm-v1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe UHP and real norm identities
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeUHPRealNorm.lean <<'LEAN'
          import Mathlib
          open UpperHalfPlane

          #check UpperHalfPlane.ext
          #check UpperHalfPlane.coe_injective
          #check UpperHalfPlane.ofComplex_apply_of_im_pos
          #check Complex.norm_real

          example (z : ℍ) : UpperHalfPlane.ofComplex (z : ℂ) = z := by
            apply UpperHalfPlane.coe_injective
            simpa using UpperHalfPlane.ofComplex_apply_of_im_pos z.im_pos

          example (a b : ℝ) : ‖(a : ℂ) - (b : ℂ)‖ = |a - b| := by
            rw [← Complex.ofReal_sub, Complex.norm_real]

          example (f : ℍ → ℝ) (z : ℍ) {w : ℂ} (hw : 0 < w.im) :
              ‖(f (UpperHalfPlane.ofComplex w) : ℂ) -
                  (f (UpperHalfPlane.ofComplex (z : ℂ)) : ℂ)‖ =
                |f (UpperHalfPlane.ofComplex w) - f z| := by
            have hz : UpperHalfPlane.ofComplex (z : ℂ) = z := by
              apply UpperHalfPlane.coe_injective
              simpa using UpperHalfPlane.ofComplex_apply_of_im_pos z.im_pos
            rw [hz]
            rw [← Complex.ofReal_sub, Complex.norm_real]
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeUHPRealNorm.lean | tee /tmp/uhp-realnorm-v1.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-upperhalfplane-realnorm-v1-${{ github.sha }}
          path: /tmp/uhp-realnorm-v1.log
          retention-days: 7
