name: GPT QYM GB85 C03 edge derivatives

on:
  push:
    branches: [gpt/qym-gb85-c03-deriv-20260819]
    paths:
      - .github/workflows/gpt-qym-gb85-c03-deriv.yml
      - .github/qym_patch_gb85_c03_deriv.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-gb85-c03-deriv
  cancel-in-progress: false

jobs:
  verify:
    name: GB85 C03 ${{ matrix.variant }} direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        variant: [reducible_simp, reducible_convert]
    env:
      GH_TOKEN: ${{ github.token }}
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-gb85-c03-${{ matrix.variant }}
      BASE_DIR: /tmp/qym-gb85-authority
      BASE_ARTIFACT_ID: "9354072137"
      BASE_SOURCE_NAME: QYM.candidate-C04-mul_inv_using_bang.lean
      BASE_SHA256: f4c9b27a297be772cde7183526378ad42ae826053f69cf3ce521670da4f06210
      BASE_BLOB: bd28d0436230a8f0bcb01806dac01787542256b8
      BASE_ERRORS: "85"
      BASE_RUN_ID: "32218198562"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
          fetch-depth: 1

      - name: Recover exact verified GB85 authority
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$BASE_DIR" "$OLEAN"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$GITHUB_REPOSITORY/actions/artifacts/$BASE_ARTIFACT_ID/zip" > "$OUT/base.zip"
          unzip -q -o "$OUT/base.zip" -d "$BASE_DIR"
          source_file="$(find "$BASE_DIR" -type f -name "$BASE_SOURCE_NAME" -print -quit)"
          result_file="$(find "$BASE_DIR" -type f -name RESULT.json -print -quit)"
          test -n "$source_file" && test -s "$source_file"
          test -n "$result_file" && test -s "$result_file"
          test "$(sha256sum "$source_file" | awk '{print $1}')" = "$BASE_SHA256"
          python3 - "$source_file" "$BASE_BLOB" <<'PY'
          from pathlib import Path
          import hashlib, sys
          raw=Path(sys.argv[1]).read_bytes()
          assert hashlib.sha1(b"blob "+str(len(raw)).encode()+b"\0"+raw).hexdigest()==sys.argv[2]
          PY
          jq -e --arg sha "$BASE_SHA256" --arg blob "$BASE_BLOB" \
            --arg run "$BASE_RUN_ID" --argjson errors "$BASE_ERRORS" \
            '.candidate_qym_sha256==$sha and .candidate_qym_blob==$blob and
             (.run_id|tostring)==$run and .error_headers==$errors and
             .panic_lines==0 and .strict_improvement==true' "$result_file" >/dev/null
          cp "$source_file" "$QYM"
          cp "$source_file" "$OUT/QYM.GB85.lean"
          cp "$result_file" "$OUT/GB85_RESULT.json"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for attempt in 1 2 3 4 5; do elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break || sleep $((attempt*5)); done
          lean --version > "$OUT/lean-version.txt"; lake --version > "$OUT/lake-version.txt"
          for attempt in 1 2 3 4 5; do lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break || sleep $((attempt*5)); done

      - name: Restore dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure dependency objects
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              cap=1; if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then cap=2000; fi
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean" && test -s "$OLEAN/$source.ilean"
          done

      - name: Materialize exact C03 candidate
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/qym_patch_gb85_c03_deriv.py \
            "${{ matrix.variant }}" "$QYM" | tee "$OUT/PATCH_RESULT.json"
          cp "$QYM" "$OUT/QYM.candidate-${{ matrix.variant }}.lean"

      - name: Full authoritative QYM direct Lean
        shell: bash
        run: |
          set +e
          /usr/bin/time -v -o "$OUT/full.time" lake env lean \
            -DmaxErrors=10000 -DwarningAsError=false \
            -o "$RUNNER_TEMP/QYM.olean" -i "$RUNNER_TEMP/QYM.ilean" "$QYM" > "$OUT/full.log" 2>&1
          rc=$?; set -e; echo "$rc" > "$OUT/full.exit"
          if [[ "$rc" -eq 0 ]]; then cp "$RUNNER_TEMP/QYM.olean" "$OUT/QYM.olean"; cp "$RUNNER_TEMP/QYM.ilean" "$OUT/QYM.ilean"; fi

      - name: Parse full result and require strict improvement
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT" "$BASE_ERRORS" <<'PY'
          from pathlib import Path
          import collections,hashlib,json,os,re,sys
          out=Path(sys.argv[1]);base=int(sys.argv[2]);raw=(out/'full.log').read_bytes();text=raw.decode(errors='replace')
          p=re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$',re.M)
          rows=[]
          for m in p.finditer(text):
            r=m.groupdict();r['line']=int(r['line']);r['column']=int(r['column']);rows.append(r)
          errs=[r for r in rows if r['severity']=='error'];warn=[r for r in rows if r['severity']=='warning']
          panics=re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$',text)
          patch=json.loads((out/'PATCH_RESULT.json').read_text());rc=int((out/'full.exit').read_text().strip())
          semantic=rc==0 and not errs and not panics;strict=semantic or (not panics and len(errs)<base)
          result={'schema':'qym-gb85-c03-deriv-result-v1','run_id':int(os.environ['GITHUB_RUN_ID']),'trigger_sha':os.environ['GITHUB_SHA'],
            'variant':patch['variant'],'baseline_error_headers':base,'candidate_qym_sha256':patch['candidate_sha256'],'candidate_qym_blob':patch['candidate_blob'],
            'exit':rc,'error_headers':len(errs),'warning_headers':len(warn),'panic_lines':len(panics),
            'first_error':errs[0] if errs else None,'last_error':errs[-1] if errs else None,
            'error_codes':dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in errs).items())),
            'log_sha256':hashlib.sha256(raw).hexdigest(),'semantic_pass':semantic,'strict_improvement':strict}
          (out/'FULL_RESULT.json').write_text(json.dumps(result,indent=2,sort_keys=True)+'\n')
          (out/'diagnostics.jsonl').write_text(''.join(json.dumps(r,sort_keys=True)+'\n' for r in rows))
          (out/'error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r['code'] else ''}: {r['message']}\n" for r in errs))
          print(json.dumps(result,indent=2,sort_keys=True))
          if not strict: raise SystemExit('C03 candidate did not improve verified GB85')
          PY

      - name: Upload immutable evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb85-c03-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb85-c03-${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 30
