name: Final visible PASS 339 FunctionalAnalysis

on:
  pull_request:
    branches: [ci/fa-final-run-base-20260808]
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  actions: read

concurrency:
  group: final-visible-fa-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    steps:
      - name: Checkout exact candidate head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          repository: leegahuyn/mathlib4
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 192
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass339-fa/logs
          lean --version | tee /tmp/diagnose-pass339-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass339-fa/lake-version.txt
          sha256sum --version | head -1 | tee /tmp/diagnose-pass339-fa/sha256sum-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass339-fa/logs/cache-get.log

      - name: Reconstruct and compile PASS 339 FA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass339_fa.sh

      - name: Upload complete PASS 339 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-visible-pass339-fa-${{ github.event.pull_request.head.sha }}
          path: /tmp/diagnose-pass339-fa
          if-no-files-found: error
          retention-days: 90
