name: FA427 parallel direct-Lean frontier loop

on:
  push:
    branches:
      - fix/fa427-parallel-frontier-loop-20260810
    paths:
      - fa427-requests/REQUESTED.txt

permissions:
  actions: read
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      matrix: ${{ steps.prepare.outputs.matrix }}
      baseline_sha256: ${{ steps.prepare.outputs.baseline_sha256 }}
      baseline_first_error_line: ${{ steps.prepare.outputs.baseline_first_error_line }}
      baseline_first_error_col: ${{ steps.prepare.outputs.baseline_first_error_col }}
      baseline_declaration: ${{ steps.prepare.outputs.baseline_declaration }}
      baseline_pass: ${{ steps.prepare.outputs.baseline_pass }}
    env:
      EXPECTED_SHA_31725: 07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4
      EXPECTED_SHA_31726: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      PASS423_RUN_ID: '31317392557'
      PASS376_ARTIFACT_ID: '9024606745'
      SOURCE_PATH: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      ACTIVE_BRANCH: fix/fa427-parallel-frontier-loop-20260810
    steps:
      - name: Checkout FA427 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa427-parallel-frontier-loop-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Allow predecessor evidence commits to settle
        shell: bash
        run: sleep 240

      - name: Fetch candidate branches and resolve SHA fallback
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/fa425b_resolve_verified_champion.sh

      - name: Select best source-matched direct evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa426_resolve_best_verified.py \
            --refs /tmp/fa425-donor-refs.txt \
            --fallback /tmp/fa425-baseline.lean \
            --output /tmp/fa427-baseline.lean \
            --metadata /tmp/fa427-selection.json
          cp /tmp/fa427-baseline.lean "$SOURCE_PATH"
          test "$(python3 -c "print(len(open('$SOURCE_PATH',encoding='utf-8').read().splitlines()))")" = 60453

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa427-lean-version.txt
          lake --version | tee /tmp/fa427-lake-version.txt
          lake exe cache get | tee /tmp/fa427-cache-get.log

      - name: Directly verify baseline and prepare fixed-height candidates
        id: prepare
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa427_prepare.py
          cp /tmp/fa427-selection.json /tmp/fa427-prepared/SELECTION.json
          cp /tmp/fa425-resolution.txt /tmp/fa427-prepared/FALLBACK_RESOLUTION.txt
          cp /tmp/fa427-lean-version.txt /tmp/fa427-prepared/lean-version.txt
          cp /tmp/fa427-lake-version.txt /tmp/fa427-prepared/lake-version.txt
          cp /tmp/fa427-cache-get.log /tmp/fa427-prepared/cache-get.log

      - name: Upload prepared candidate bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa427-prepared-${{ github.run_id }}
          path: /tmp/fa427-prepared
          if-no-files-found: error
          retention-days: 7
          compression-level: 6

  screen:
    needs: prepare
    if: ${{ needs.prepare.result == 'success' }}
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        index: ${{ fromJSON(needs.prepare.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout exact FA427 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa427-parallel-frontier-loop-20260810
          fetch-depth: 1

      - name: Download prepared candidates and prerequisite oleans
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fa427-prepared-${{ github.run_id }}
          path: /tmp/fa427-prepared

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lake exe cache get >/tmp/fa427-screen-cache.log

      - name: Direct Lean screen candidate ${{ matrix.index }}
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa427_screen.py \
            --prepared /tmp/fa427-prepared \
            --index '${{ matrix.index }}' \
            --output '/tmp/fa427-screen-${{ matrix.index }}'
          cp /tmp/fa427-screen-cache.log '/tmp/fa427-screen-${{ matrix.index }}/cache-get.log'

      - name: Upload source-matched direct metric ${{ matrix.index }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa427-screen-${{ matrix.index }}
          path: /tmp/fa427-screen-${{ matrix.index }}
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

  aggregate:
    needs: [prepare, screen]
    if: ${{ always() && needs.prepare.result == 'success' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      ACTIVE_BRANCH: fix/fa427-parallel-frontier-loop-20260810
    steps:
      - name: Checkout exact FA427 branch for promotion
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa427-parallel-frontier-loop-20260810
          fetch-depth: 2000
          persist-credentials: true

      - name: Download prepared bundle
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: fa427-prepared-${{ github.run_id }}
          path: /tmp/fa427-prepared

      - name: Download every matrix result
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: fa427-screen-*
          path: /tmp/fa427-screens
          merge-multiple: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/fa427-aggregate-lean-version.txt
          lake --version | tee /tmp/fa427-aggregate-lake-version.txt
          lake exe cache get | tee /tmp/fa427-aggregate-cache-get.log

      - name: Select winner and directly reverify twice
        id: aggregate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa427_aggregate.py \
            --prepared /tmp/fa427-prepared \
            --screens /tmp/fa427-screens
          d=build-logs/fa427-parallel-frontier-loop
          cp /tmp/fa427-prepared/MANIFEST.json "$d/PREPARED_MANIFEST.json"
          cp /tmp/fa427-prepared/SELECTION.json "$d/BASELINE_SELECTION.json"
          cp /tmp/fa427-aggregate-lean-version.txt "$d/lean-version.txt"
          cp /tmp/fa427-aggregate-lake-version.txt "$d/lake-version.txt"
          cp /tmp/fa427-aggregate-cache-get.log "$d/cache-get.log"

      - name: Persist direct-verified source evidence and optionally trigger next round
        if: always()
        shell: bash
        env:
          SOURCE_SHOULD_COMMIT: ${{ steps.aggregate.outputs.source_should_commit }}
          STRICT_PROMOTION: ${{ steps.aggregate.outputs.strict_promotion }}
          FA_TRUE_PASS: ${{ steps.aggregate.outputs.fa_true_pass }}
          ALL_CHAIN_PASS: ${{ steps.aggregate.outputs.all_chain_pass }}
          CONTINUE_LOOP: ${{ steps.aggregate.outputs.continue_loop }}
          NEXT_ROUND: ${{ steps.aggregate.outputs.next_round }}
          SELECTED_SHA: ${{ steps.aggregate.outputs.selected_sha256 }}
          SELECTED_FIRST: ${{ steps.aggregate.outputs.selected_first_error_line }}
          SELECTED_COL: ${{ steps.aggregate.outputs.selected_first_error_col }}
          SELECTED_DECL: ${{ steps.aggregate.outputs.selected_declaration }}
        run: |
          set -euo pipefail
          d=build-logs/fa427-parallel-frontier-loop
          round=$(python3 -c "import json; print(json.load(open('$d/CURRENT.json'))['round'])")
          record="verified-records/fa427/round-${round}"
          mkdir -p "$record"
          cp "$d/CURRENT.json" "$record/CURRENT.json"
          cp "$d/CURRENT.txt" "$record/CURRENT.txt"
          cp "$d/SCREENING_SUMMARY.json" "$record/SCREENING_SUMMARY.json"
          cp "$d/SELECTION_REVERIFY.json" "$record/SELECTION_REVERIFY.json"
          cp "$d/SELECTED_FIRST_ERROR_CONTEXT.txt" "$record/SELECTED_FIRST_ERROR_CONTEXT.txt"
          cp "$d/BASELINE_SELECTION.json" "$record/BASELINE_SELECTION.json"
          cp "$d/PREPARED_MANIFEST.json" "$record/PREPARED_MANIFEST.json"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          if test "${SOURCE_SHOULD_COMMIT:-false}" = true; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$record"
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$record"
          fi

          if test "${CONTINUE_LOOP:-false}" = true; then
            cat > fa427-requests/REQUESTED.txt <<EOF
          round=${NEXT_ROUND}
          parent_round=${round}
          parent_source_sha256=${SELECTED_SHA}
          parent_first_error=${SELECTED_FIRST}:${SELECTED_COL}
          parent_declaration=${SELECTED_DECL}
          authority=direct Lean CLI
          fixed_line_count=60453
          EOF
            git add fa427-requests/REQUESTED.txt
            msg="ci: FA427 strict promotion round ${round} to ${SELECTED_FIRST}; launch round ${NEXT_ROUND}"
          elif test "${ALL_CHAIN_PASS:-false}" = true; then
            msg='fix: FA427 ordered FA Integrated Mock3 QYM x2 PASS [skip ci]'
          elif test "${FA_TRUE_PASS:-false}" = true; then
            msg='fix: FA427 FunctionalAnalysis TRUE PASS x2 audit clean [skip ci]'
          elif test "${STRICT_PROMOTION:-false}" = true; then
            msg="fix: FA427 strict frontier round ${round} to ${SELECTED_FIRST} [skip ci]"
          elif test "${SOURCE_SHOULD_COMMIT:-false}" = true; then
            msg='chore: materialize best direct-verified FA baseline [skip ci]'
          else
            msg='evidence: FA427 no strict promotion; retain verified champion [skip ci]'
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload aggregate direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa427-aggregate-${{ github.run_id }}-${{ github.sha }}
          path: build-logs/fa427-parallel-frontier-loop
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Classify aggregate result
        if: always()
        env:
          CONTROLLER_SUCCESS: ${{ steps.aggregate.outputs.controller_success }}
        shell: bash
        run: test "${CONTROLLER_SUCCESS:-false}" = true
