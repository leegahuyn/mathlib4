name: FA447b explicit GL invariant strict direct matrix

on:
  push:
    branches:
      - fix/fa447b-explicit-gl-invariant-20260810
    paths:
      - build-logs/fa447b-explicit-invariant/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa447b-explicit-gl-invariant-direct-matrix
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa447b-explicit-gl-invariant-20260810
  CHAMPION_SHA256: c12778aa72fa9541b064e466d59c854283766e73c02fda1a586cf7380e7f7626
  EXPECTED_LINES: '60453'

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 5
      matrix:
        variant:
          - champion
          - proof_explicit
          - proof_explicit_height
          - namespace_explicit
          - namespace_explicit_height
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '140'
      BASELINE_COMMIT: 40fc6f770c2011b2f50977d39d8d9eaf577ac983
    steps:
      - name: Checkout immutable FA447b trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: false

      - name: Verify exact checked-in 32592 champion
        shell: bash
        run: |
          set -euo pipefail
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum "$src" | awk '{print $1}')" = "$CHAMPION_SHA256"
          test "$(python3 - <<'PY'
          from pathlib import Path
          d=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()
          print(d.count(b'\n') + (0 if d.endswith(b'\n') else 1))
          PY
          )" = "$EXPECTED_LINES"

      - name: Install pinned Lean and Mathlib cache unconditionally
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          rm -rf "$d"; mkdir -p "$d"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Generate exact same-height explicit-invariant candidate
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          python3 scripts/fa447b_prepare_explicit_invariant_candidate.py \
            --variant "$VARIANT" --output-dir "$d" > "$d/prepare.log" 2>&1
          rc=$?; cat "$d/prepare.log"; printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then echo 'ok=true' >> "$GITHUB_OUTPUT"; else echo 'ok=false' >> "$GITHUB_OUTPUT"; touch "$d/PREPARE_FAILED"; fi
          exit 0

      - name: Execute actual direct Lean CLI for Mock2 Mock2 Advanced and FA
        if: always()
        env:
          PREPARE_OK: ${{ steps.prepare.outputs.ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1 src="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"; touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"; printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1; printf '%s' "$?" > "$d/${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/${stem}.ilean.size"
          }
          if test "${PREPARE_OK:-false}" = true; then
            compile_one Mock2; compile_one Mock2_Advanced; compile_one Mock2_FunctionalAnalysis
          else
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
              printf '125' > "$d/${stem}.exit"; printf 'preparation failed before direct Lean CLI\n' > "$d/${stem}.log"
              printf 'INFRA: not executed\n' > "$d/${stem}.command.txt"; printf '0' > "$d/${stem}.olean.size"; printf '0' > "$d/${stem}.ilean.size"
            done
          fi
          export PREPARE_OK="${PREPARE_OK:-false}"
          python3 scripts/fa443_record_direct_metric.py > "$d/metric-console.log" 2>&1
          cat "$d/metric-console.log"
          exit 0

      - name: Upload complete source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa447b-candidate-${{ matrix.variant }}
          path: build-logs/fa443-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      MAX_ERRORS: '180'
    steps:
      - name: Checkout immutable FA447b trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Configure Git identity
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download current-run artifacts and select strictly
        id: select
        shell: bash
        run: |
          set +e
          rm -rf /tmp/fa447b-collected build-logs/fa447b-explicit-invariant/selected
          mkdir -p /tmp/fa447b-collected build-logs/fa447b-explicit-invariant/selected
          variants=(champion proof_explicit proof_explicit_height namespace_explicit namespace_explicit_height)
          rc=0
          for v in "${variants[@]}"; do
            mkdir -p "/tmp/fa447b-collected/$v"
            gh run download "$GITHUB_RUN_ID" -n "fa447b-candidate-$v" -D "/tmp/fa447b-collected/$v" || rc=1
          done
          src=build-logs/fa447b-explicit-invariant/selected
          sel=125
          if test "$rc" -eq 0; then
            python3 scripts/fa447b_select_explicit_invariant.py --collected /tmp/fa447b-collected --output "$src" > "$src/selector-console.log" 2>&1
            sel=$?
          else
            printf 'artifact download failure\n' > "$src/selector-console.log"
          fi
          cat "$src/selector-console.log"; printf '%s' "$sel" > "$src/selector.exit"
          if test "$sel" -eq 0; then echo 'selector_ok=true' >> "$GITHUB_OUTPUT"; else echo 'selector_ok=false' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Install pinned Lean for independent confirmation
        if: steps.select.outputs.selector_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447b-explicit-invariant/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"; lake --version | tee "$d/lake-version.txt"; lake exe cache get | tee "$d/cache-get.log"

      - name: Independently direct-compile selected repository source
        id: confirm
        if: steps.select.outputs.selector_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa447b-explicit-invariant/selected; src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" "$src"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1 s="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean" i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$s")
            rm -f "$o" "$i"; touch "$d/confirm-${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/confirm-${stem}.command.txt"; printf '\n' >> "$d/confirm-${stem}.command.txt"
            "${cmd[@]}" > "$d/confirm-${stem}.log" 2>&1; printf '%s' "$?" > "$d/confirm-${stem}.exit"
          }
          compile_one Mock2; compile_one Mock2_Advanced; compile_one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          d=Path('build-logs/fa447b-explicit-invariant/selected'); src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          chosen=json.loads((d/'CHOSEN_METRIC.json').read_text()); text=src.read_text(errors='replace'); log=(d/'confirm-Mock2_FunctionalAnalysis.log').read_text(errors='replace')
          m=re.search(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+error(?:\([^)]*\))?:',log); pos=(int(m.group(1)),int(m.group(2))) if m else (0,0)
          dr=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s(:]+)'); name='<none>'; idx=-1
          if pos[0]:
              for no,line in enumerate(text.splitlines(),1):
                  dm=dr.match(line)
                  if dm: idx+=1; name=dm.group(1)
                  if no>=pos[0]: break
          rc=lambda s:int((d/f'confirm-{s}.exit').read_text())
          sr=(1,10**9,10**9,10**9) if int(chosen['FA_exit'])==0 else (0,int(chosen['FA_error_declaration_index']),int(chosen['FA_first_actual_error_line']),int(chosen['FA_first_actual_error_col']))
          cr=(1,10**9,10**9,10**9) if rc('Mock2_FunctionalAnalysis')==0 else (0,idx,pos[0],pos[1])
          actual=hashlib.sha256(src.read_bytes()).hexdigest(); ok=(actual==os.environ['SELECTED_SHA'] and rc('Mock2')==0 and rc('Mock2_Advanced')==0 and cr>=sr)
          r={'verified':ok,'selected_variant':os.environ['SELECTED_VARIANT'],'selected_sha256':os.environ['SELECTED_SHA'],'actual_sha256':actual,
             'Mock2_exit':rc('Mock2'),'Mock2_Advanced_exit':rc('Mock2_Advanced'),'FA_exit':rc('Mock2_FunctionalAnalysis'),
             'first_error_line':pos[0],'first_error_col':pos[1],'first_error_declaration':name,'first_error_declaration_index':idx,'selected_rank':sr,'confirmation_rank':cr}
          (d/'CONFIRMATION.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f: f.write(f"verified={str(ok).lower()}\nfirst_line={pos[0]}\nfirst_col={pos[1]}\ndeclaration={name}\n")
          PY
          exit 0

      - name: Materialize only independently verified strict source
        id: persist
        if: steps.select.outputs.strict == 'true' && steps.confirm.outputs.verified == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447b-explicit-invariant/selected; src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum "$src" | awk '{print $1}')" = "$SELECTED_SHA"
          git add "$src" "$d/SELECTION.json" "$d/CANDIDATE_RESULTS.json" "$d/CHOSEN_METRIC.json" "$d/CONFIRMATION.json" "$d/Mock2_FunctionalAnalysis-selected.lean"
          git commit -m "fix: promote FA447b ${SELECTED_VARIANT} first-${{ steps.confirm.outputs.first_line }}-${{ steps.confirm.outputs.first_col }}"
          git push origin "HEAD:${ACTIVE_BRANCH}"
          test "$(git show "HEAD:$src" | sha256sum | awk '{print $1}')" = "$SELECTED_SHA"
          echo 'materialized=true' >> "$GITHUB_OUTPUT"

      - name: Record no improvement without source mutation
        if: steps.select.outputs.selector_ok == 'true' && steps.select.outputs.strict != 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447b-explicit-invariant/selected
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add "$d/SELECTION.json" "$d/CANDIDATE_RESULTS.json" "$d/CHOSEN_METRIC.json"
          git commit -m 'evidence: FA447b no strict improvement over first-32592-5 [skip ci]'
          git push origin "HEAD:${ACTIVE_BRANCH}"

      - name: Verify selected worktree HEAD identity
        id: identity
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
        shell: bash
        run: |
          set +e
          d=build-logs/fa447b-explicit-invariant/final-gates; mkdir -p "$d"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          worktree=$(test -f "$src" && sha256sum "$src" | awk '{print $1}' || true); headsrc=$(git show "HEAD:$src" 2>/dev/null | sha256sum | awk '{print $1}')
          ok=false; test -n "${SELECTED_SHA:-}" && test "$SELECTED_SHA" = "$worktree" && test "$SELECTED_SHA" = "$headsrc" && ok=true
          export SELECTED="$SELECTED_SHA" WORKTREE="$worktree" HEADSRC="$headsrc" OK="$ok"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r={'selected_sha256':os.environ.get('SELECTED',''),'worktree_sha256':os.environ.get('WORKTREE',''),'head_source_sha256':os.environ.get('HEADSRC',''),'identity_ok':os.environ.get('OK')=='true'}
          Path('build-logs/fa447b-explicit-invariant/final-gates/CHECKED_IN_IDENTITY.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          PY
          echo "identity_ok=$ok" >> "$GITHUB_OUTPUT"; exit 0

      - name: Direct-compile checked-in FA twice and audit trust
        id: fa_gate
        if: steps.identity.outputs.identity_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"; d=build-logs/fa447b-explicit-invariant/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification; src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          for n in 1 2; do
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean; i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"; touch "$d/FA-run${n}.executed"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1; printf '%s' "$?" > "$d/FA-run${n}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/FA-run${n}.olean.size"; printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/FA-run${n}.ilean.size"
          done
          export SOURCE_SHA=$(sha256sum "$src" | awk '{print $1}')
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,json,os,sys
          d=Path('build-logs/fa447b-explicit-invariant/final-gates'); src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          spec=importlib.util.spec_from_file_location('audit',Path('scripts/fa442_prepare_same_height_candidate.py')); mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          audit=dict(mod.forbidden_counts(src.read_text())); runs=[]
          for n in (1,2): runs.append({'run':n,'exit':int((d/f'FA-run{n}.exit').read_text()),'olean_size':int((d/f'FA-run{n}.olean.size').read_text()),'ilean_size':int((d/f'FA-run{n}.ilean.size').read_text())})
          tp=(os.environ['SOURCE_SHA']==os.environ['SELECTED_SHA'] and all(r['exit']==0 and r['olean_size']>0 and r['ilean_size']>0 for r in runs) and all(v==0 for v in audit.values()))
          r={'classification':'TRUE_PASS' if tp else 'LEAN_FAILURE','FA_TRUE_PASS':tp,'source_sha256':os.environ['SOURCE_SHA'],'runs':runs,'forbidden_audit':audit}
          (d/'FA_FINAL.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as f:f.write(f"fa_true_pass={str(tp).lower()}\n")
          PY
          exit 0

      - name: Run ordered downstream only after FA TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"; d=build-logs/fa447b-explicit-invariant/final-gates; complete=true; integrated=NOT_RUN; bridges=NOT_RUN; qym=NOT_RUN
          compile_target(){ stem=$1; n=$2; s="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$s" > "$d/${stem}-run${n}.log" 2>&1; rc=$?; printf '%s' "$rc" > "$d/${stem}-run${n}.exit"; test "$rc" -eq 0 && test -s "$o" && test -s "$i"; }
          compile_target Mock2_FunctionalAnalysis_Integrated 1; a=$?; compile_target Mock2_FunctionalAnalysis_Integrated 2; b=$?; test "$a" -eq 0 && test "$b" -eq 0 && integrated=PASS_2X || { integrated=LEAN_FAILURE; complete=false; }
          if test "$complete" = true; then bridges=PASS_2X; shopt -s nullglob; for s in PrimalitySheafVerification/Mock3*.lean; do stem=$(basename "$s" .lean); compile_target "$stem" 1; a=$?; compile_target "$stem" 2; b=$?; test "$a" -eq 0 && test "$b" -eq 0 || { bridges="LEAN_FAILURE:${stem}"; complete=false; break; }; done; else bridges=BLOCKED_BY_INTEGRATED; fi
          if test "$complete" = true; then compile_target QYM 1; a=$?; compile_target QYM 2; b=$?; test "$a" -eq 0 && test "$b" -eq 0 && qym=PASS_2X || { qym=LEAN_FAILURE; complete=false; }; else qym=BLOCKED_BY_EARLIER_GATE; fi
          export COMPLETE="$complete" INTEGRATED="$integrated" BRIDGES="$bridges" QYM_STATUS="$qym"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r={'complete':os.environ['COMPLETE']=='true','Integrated':os.environ['INTEGRATED'],'Mock3_bridges':os.environ['BRIDGES'],'QYM':os.environ['QYM_STATUS']}
          Path('build-logs/fa447b-explicit-invariant/final-gates/DOWNSTREAM.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          exit 0

      - name: Record downstream blocked unless FA TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass != 'true'
        shell: bash
        run: |
          mkdir -p build-logs/fa447b-explicit-invariant/final-gates
          printf '{"complete":false,"Integrated":"BLOCKED_BY_FA_TRUE_PASS_GATE","Mock3_bridges":"BLOCKED_BY_FA_TRUE_PASS_GATE","QYM":"BLOCKED_BY_FA_TRUE_PASS_GATE"}\n' > build-logs/fa447b-explicit-invariant/final-gates/DOWNSTREAM.json

      - name: Commit compact final evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa447b-explicit-invariant/final-gates/CHECKED_IN_IDENTITY.json build-logs/fa447b-explicit-invariant/final-gates/FA_FINAL.json build-logs/fa447b-explicit-invariant/final-gates/DOWNSTREAM.json || true
          if ! git diff --cached --quiet; then git commit -m 'ci: record FA447b direct confirmation and ordered gate [skip ci]'; git push origin "HEAD:${ACTIVE_BRANCH}"; fi

      - name: Upload FA447b selection and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa447b-explicit-invariant-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa447b-explicit-invariant
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce pipeline integrity separately from Lean status
        if: always()
        env:
          SELECTOR_OK: ${{ steps.select.outputs.selector_ok }}
          STRICT: ${{ steps.select.outputs.strict }}
          CONFIRMED: ${{ steps.confirm.outputs.verified }}
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: |
          test "${SELECTOR_OK:-false}" = true
          if test "${STRICT:-false}" = true; then test "${CONFIRMED:-false}" = true; test "${IDENTITY_OK:-false}" = true; fi
