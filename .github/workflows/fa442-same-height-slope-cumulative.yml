name: FA442 same-height slope cumulative direct Lean matrix

on:
  push:
    branches:
      - fix/fa442-same-height-slope-cumulative-20260810
    paths:
      - scripts/fa442_prepare_same_height_candidate.py
      - scripts/fa442_record_direct_metric.py
      - scripts/fa442_select_strict_champion.py
      - .github/workflows/fa442-same-height-slope-cumulative.yml
      - build-logs/fa442-same-height/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa442-same-height-slope-cumulative
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 16
      matrix:
        variant:
          - baseline
          - slope_only
          - slope_structures
          - slope_change_convert
          - slope_paired_parenthesized
          - slope_paired_dot
          - slope_paired_parenthesized_ring
          - slope_paired_parenthesized_ring_height
          - slope_paired_parenthesized_ring_height_upper
          - slope_paired_parenthesized_ring_height_upper_tail
          - slope_paired_parenthesized_ring_height_upper_tail_zero
          - slope_paired_parenthesized_all_known
          - slope_paired_dot_all_known
          - slope_structures_paired_all_known
          - slope_change_convert_paired_all_known
          - slope_paired_parenthesized_deep_simp
    runs-on: ubuntu-24.04
    timeout-minutes: 190
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '50'
    steps:
      - name: Checkout exact FA442 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa442-same-height-slope-cumulative-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Prepare exact 60453-line candidate
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa442-same-height/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          python3 scripts/fa442_prepare_same_height_candidate.py \
            --variant "$VARIANT" --output-dir "$d" \
            > "$d/prepare.log" 2>&1
          rc=$?
          cat "$d/prepare.log"
          printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
          else
            echo "ok=false" >> "$GITHUB_OUTPUT"
            touch "$d/PREPARE_FAILED"
          fi
          exit 0

      - name: Install pinned Lean and Mathlib cache
        if: steps.prepare.outputs.ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa442-same-height/candidates/${VARIANT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Directly compile completed prerequisites and candidate FA
        if: steps.prepare.outputs.ok == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa442-same-height/candidates/${VARIANT}"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$o" && test -s "$i"; then
              return 0
            fi
            return 1
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis; fa=$?
          else
            printf 'FA blocked by completed prerequisite regression\n' \
              > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          export M2_EXIT="$m2" M2A_EXIT="$m2a" FA_EXIT="$fa"
          python3 scripts/fa442_record_direct_metric.py \
            > "$d/metric-console.log" 2>&1
          metric_rc=$?
          cat "$d/metric-console.log"
          printf '%s' "$metric_rc" > "$d/metric.exit"
          exit 0

      - name: Upload candidate source and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa442-candidate-${{ matrix.variant }}
          path: build-logs/fa442-same-height/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    env:
      ACTIVE_BRANCH: fix/fa442-same-height-slope-cumulative-20260810
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '100'
    steps:
      - name: Checkout exact FA442 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa442-same-height-slope-cumulative-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Select best same-height direct candidate
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/fa442_select_strict_champion.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa442-same-height/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Independently confirm selected source at repository path
        id: confirm
        env:
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          MATRIX_FIRST_LINE: ${{ steps.select.outputs.matrix_first_line }}
          MATRIX_FIRST_COL: ${{ steps.select.outputs.matrix_first_col }}
          MATRIX_DECLARATION: ${{ steps.select.outputs.matrix_declaration }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa442-same-height/selected
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          if test "$actual" != "$SELECTED_SHA"; then
            echo "selected source SHA mismatch" > "$d/confirmation-infra-failure.txt"
          fi
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/confirm-${stem}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/confirm-${stem}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis; fa=$?
          fi
          export M2="$m2" M2A="$m2a" FA="$fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re

          d=Path('build-logs/fa442-same-height/selected')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          data=src.read_bytes(); text=data.decode('utf-8')
          source_sha=hashlib.sha256(data).hexdigest()
          lines=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          log=(d/'confirm-Mock2_FunctionalAnalysis.log').read_text(errors='replace') if (d/'confirm-Mock2_FunctionalAnalysis.log').exists() else ''
          matches=list(re.finditer(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+error:',log))
          first=int(matches[0].group(1)) if matches else 0
          col=int(matches[0].group(2)) if matches else 0
          decl_re=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s(:]+)')
          declaration='<none>'; declaration_index=-1; current=-1
          for i,line in enumerate(text.splitlines()):
              m=decl_re.match(line)
              if m:
                  current+=1; declaration=m.group(1)
              if first and i+1>=first:
                  declaration_index=current; break
          m2=int(os.environ['M2']); m2a=int(os.environ['M2A']); fa=int(os.environ['FA'])
          matrix_line=int(os.environ.get('MATRIX_FIRST_LINE') or 0)
          mode=os.environ.get('SELECTION_MODE','')
          selected_sha=os.environ.get('SELECTED_SHA','')
          reproduced=(fa==0 or first>=matrix_line)
          strict=(fa==0 or first>31726)
          verified=(source_sha==selected_sha and lines==60453 and m2==0 and m2a==0 and reproduced and (mode!='strict_promotion' or strict))
          result={
              'classification':'VERIFIED' if verified else 'INFRA_FAILURE',
              'authority':'independent direct Lean CLI on repository source path',
              'selection_mode':mode,'variant':os.environ.get('SELECTED_VARIANT',''),
              'source_sha256':source_sha,'line_count':lines,
              'Mock2_exit':m2,'Mock2_Advanced_exit':m2a,'FA_exit':fa,
              'FA_first_actual_error_line':first,'FA_first_actual_error_col':col,
              'FA_first_error_declaration':declaration,
              'FA_error_declaration_index':declaration_index,
              'error_headers_captured':len(matches),'maxErrors_cap':100,
              'maxErrors_interpretation':'diagnostic cap only; not total errors or proof progress',
              'matrix_first_line':matrix_line,'matrix_first_col':int(os.environ.get('MATRIX_FIRST_COL') or 0),
              'matrix_declaration':os.environ.get('MATRIX_DECLARATION',''),
              'verified':verified,
          }
          (d/'CONFIRMATION.json').write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          (d/'CONFIRMATION.txt').write_text('\n'.join(f'{k}={v}' for k,v in result.items())+'\n',encoding='utf-8')
          (d/('VERIFIED' if verified else 'FAILED')).touch()
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"verified={str(verified).lower()}\n")
              handle.write(f"fa_exit={fa}\nfirst_line={first}\nfirst_col={col}\n")
              handle.write(f"declaration={declaration}\n")
          PY
          exit 0

      - name: Commit only independently verified strict champion
        id: persist
        if: always()
        env:
          VERIFIED: ${{ steps.confirm.outputs.verified }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          FA_EXIT: ${{ steps.confirm.outputs.fa_exit }}
          FIRST_LINE: ${{ steps.confirm.outputs.first_line }}
          DECLARATION: ${{ steps.confirm.outputs.declaration }}
          VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa442-same-height
          test "${VERIFIED:-false}" = true
          if test "$SELECTION_MODE" != strict_promotion; then
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d/selected"
            if ! git diff --cached --quiet; then
              git commit -m 'evidence: retain PASS423 after FA442 no strict same-height improvement [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
            echo "source_committed=false" >> "$GITHUB_OUTPUT"
            echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          selected_copy=$(sha256sum "$d/selected/Mock2_FunctionalAnalysis-selected.lean" | awk '{print $1}')
          test "$actual" = "$SELECTED_SHA"
          test "$selected_copy" = "$SELECTED_SHA"
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d/selected"
          if test "$FA_EXIT" = 0; then metric=pass; else metric="first-${FIRST_LINE}"; fi
          git commit -m "fix: promote FA442 ${metric} same-height ${VARIANT} ${SELECTED_SHA:0:12}"
          git push origin "HEAD:${ACTIVE_BRANCH}"
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$SELECTED_SHA"
          head=$(git rev-parse HEAD)
          echo "source_committed=true" >> "$GITHUB_OUTPUT"
          echo "source_commit=$head" >> "$GITHUB_OUTPUT"
          echo "selected_sha=$SELECTED_SHA" >> "$GITHUB_OUTPUT"
          immutable="champion/fa442-${metric}-${SELECTED_SHA:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa442-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" \
               --input /tmp/fa442-ref.json > "$d/selected/immutable-response.json" \
               2> "$d/selected/immutable-error.txt"; then
            printf '%s\n' "$immutable" > "$d/selected/IMMUTABLE_CHAMPION_BRANCH.txt"
          fi

      - name: Verify checked-in source identity
        id: identity
        if: always()
        env:
          SOURCE_COMMITTED: ${{ steps.persist.outputs.source_committed }}
          SELECTED_SHA: ${{ steps.persist.outputs.selected_sha }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa442-same-height/final-gates
          mkdir -p "$d"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test "${SOURCE_COMMITTED:-false}" = true && test -n "$SELECTED_SHA" && \
             test "$SELECTED_SHA" = "$checked" && test "$SELECTED_SHA" = "$worktree"; then
            identity=true
          fi
          printf 'selected_sha256=%s\nchecked_in_sha256=%s\nworktree_sha256=%s\nidentity_ok=%s\nsource_commit=%s\n' \
            "$SELECTED_SHA" "$checked" "$worktree" "$identity" "$(git rev-parse HEAD)" \
            > "$d/CHECKED_IN_IDENTITY.txt"
          echo "identity_ok=$identity" >> "$GITHUB_OUTPUT"

      - name: Checked-in FA direct compile twice and forbidden audit
        id: fa_gate
        if: always()
        env:
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa442-same-height/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "${IDENTITY_OK:-false}" = true; then
            compile_fa 1; r1=$?
            if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi
          fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,json,os,sys
          spec=importlib.util.spec_from_file_location('fa442audit','scripts/fa442_prepare_same_height_candidate.py')
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text(encoding='utf-8')
          audit=mod.forbidden_counts(text)
          r1=int(os.environ['R1']); r2=int(os.environ['R2']); clean=all(v==0 for v in audit.values())
          result={'checked_in_source':True,'FA_run1_exit':r1,'FA_run2_exit':r2,
                  'forbidden_audit':audit,'forbidden_clean':clean,
                  'FA_TRUE_PASS':r1==0 and r2==0 and clean,'maxErrors_cap':1}
          path=Path('build-logs/fa442-same-height/final-gates/FA_FINAL.json')
          path.write_text(json.dumps(result,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as handle:
              handle.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM direct two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa442-same-height/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then
            targets+=(Mock2_FunctionalAnalysis_Integrated)
          else
            complete=false; echo missing > "$d/Integrated-missing.txt"
          fi
          shopt -s nullglob
          for source in PrimalitySheafVerification/Mock3*.lean; do
            targets+=("$(basename "$source" .lean)")
          done
          if test -f PrimalitySheafVerification/QYM.lean; then
            targets+=(QYM)
          else
            complete=false; echo missing > "$d/QYM-missing.txt"
          fi
          compile_one() {
            stem=$1; n=$2
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}-run${n}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; a=$?; b=125
              if test "$a" -eq 0; then compile_one "$stem" 2; b=$?; fi
              if test "$a" -ne 0 || test "$b" -ne 0; then
                complete=false
                break
              fi
            done
          fi
          if test "$complete" = true; then
            final=0
            touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"
          fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa442-same-height/selected \
                  build-logs/fa442-same-height/final-gates
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA442 checked-in direct and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete selected evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa442-selected-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa442-same-height/selected
            build-logs/fa442-same-height/final-gates
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce complete ordered result
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
