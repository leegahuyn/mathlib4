name: FA446 measurable cumulative direct Lean matrix

on:
  push:
    branches:
      - fix/fa446-measurable-cumulative-20260810
    paths:
      - build-logs/fa446-matrix/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa446-measurable-cumulative
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa446-measurable-cumulative-20260810
  BASELINE_COMMIT: 71bda948950f8e1e20c51204cf24a5f9e82c01c0
  BASELINE_SHA256: 4647a9463e4264a7f0e08405b7ccd1ce9be87e7227fa2b91dc52024e2e198152
  EXPECTED_LINES: '60453'

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 9
      matrix:
        variant:
          - baseline
          - measurable_only
          - measurable_height
          - measurable_height_upper
          - measurable_height_upper_pointwise
          - measurable_height_upper_pointwise_memspace
          - measurable_height_upper_pointwise_memspace_lp
          - measurable_height_upper_pointwise_memspace_lp_tail
          - measurable_height_upper_pointwise_memspace_lp_tail_zero
    runs-on: ubuntu-24.04
    timeout-minutes: 220
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '80'
    steps:
      - name: Checkout immutable workflow trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: false

      - name: Restore exact checked-in 32590 champion
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          rm -rf "$d"; mkdir -p "$d"
          if ! git cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          fi
          git show "${BASELINE_COMMIT}:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" > /tmp/fa446-baseline.lean
          actual=$(sha256sum /tmp/fa446-baseline.lean | awk '{print $1}')
          lines=$(python3 - <<'PY'
          from pathlib import Path
          d=Path('/tmp/fa446-baseline.lean').read_bytes()
          print(d.count(b'\n') + (0 if d.endswith(b'\n') else 1))
          PY
          )
          test "$actual" = "$BASELINE_SHA256"
          test "$lines" = "$EXPECTED_LINES"
          cp /tmp/fa446-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          printf 'baseline_commit=%s\nbaseline_sha256=%s\nline_count=%s\ntrigger_sha=%s\n' \
            "$BASELINE_COMMIT" "$actual" "$lines" "$GITHUB_SHA" > "$d/BASELINE_IDENTITY.txt"

      - name: Install pinned Lean and Mathlib cache for every candidate
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Generate same-height candidate with immutable theorem header
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          python3 scripts/fa446_prepare_measurable_cumulative.py \
            --variant "$VARIANT" --output-dir "$d" > "$d/prepare.log" 2>&1
          rc=$?; cat "$d/prepare.log"; printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then echo 'ok=true' >> "$GITHUB_OUTPUT"; else echo 'ok=false' >> "$GITHUB_OUTPUT"; touch "$d/PREPARE_FAILED"; fi
          exit 0

      - name: Execute actual direct Lean CLI for Mock2 Mock2 Advanced and FA
        if: always()
        env:
          PREPARE_OK: ${{ steps.prepare.outputs.ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1 src="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"; touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"; printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1
            printf '%s' "$?" > "$d/${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/${stem}.ilean.size"
            return 0
          }
          if test "${PREPARE_OK:-false}" = true; then
            compile_one Mock2; compile_one Mock2_Advanced; compile_one Mock2_FunctionalAnalysis
          else
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
              printf 'not executed because preparation failed\n' > "$d/${stem}.log"
              printf '125' > "$d/${stem}.exit"; printf '0' > "$d/${stem}.olean.size"; printf '0' > "$d/${stem}.ilean.size"
              printf 'INFRA: preparation failed before direct Lean CLI\n' > "$d/${stem}.command.txt"
            done
          fi
          export PREPARE_OK="${PREPARE_OK:-false}"
          python3 scripts/fa443_record_direct_metric.py > "$d/metric-console.log" 2>&1
          rc=$?; cat "$d/metric-console.log"; printf '%s' "$rc" > "$d/metric.exit"
          exit 0

      - name: Upload complete candidate source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa446-candidate-${{ matrix.variant }}
          path: build-logs/fa443-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '120'
    steps:
      - name: Checkout immutable workflow trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Configure Git identity before any commit
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Require all current-run direct metrics and select strictly
        id: select
        shell: bash
        run: |
          set +e
          rm -rf build-logs/fa446-matrix/selected; mkdir -p build-logs/fa446-matrix/selected
          python3 scripts/fa446_select_direct_champion.py > build-logs/fa446-matrix/selected/selector-console.log 2>&1
          rc=$?; cat build-logs/fa446-matrix/selected/selector-console.log; printf '%s' "$rc" > build-logs/fa446-matrix/selected/selector.exit
          if test "$rc" -ne 0; then echo 'selector_ok=false' >> "$GITHUB_OUTPUT"; fi
          exit 0

      - name: Install pinned Lean for independent confirmation
        if: steps.select.outputs.selector_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa446-matrix/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"; lake --version | tee "$d/lake-version.txt"; lake exe cache get | tee "$d/cache-get.log"

      - name: Independently direct-compile selected source
        id: confirm
        if: steps.select.outputs.selector_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa446-matrix/selected
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1 src="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean" i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"; touch "$d/confirm-${stem}.executed"; printf '%q ' "${cmd[@]}" > "$d/confirm-${stem}.command.txt"; printf '\n' >> "$d/confirm-${stem}.command.txt"
            "${cmd[@]}" > "$d/confirm-${stem}.log" 2>&1; printf '%s' "$?" > "$d/confirm-${stem}.exit"; return 0
          }
          compile_one Mock2; compile_one Mock2_Advanced; compile_one Mock2_FunctionalAnalysis
          python3 scripts/fa446_confirm_selected.py > "$d/confirmation-console.log" 2>&1
          rc=$?; cat "$d/confirmation-console.log"; printf '%s' "$rc" > "$d/confirmation-script.exit"; exit 0

      - name: Materialize independently verified selected source
        id: persist
        if: steps.select.outputs.selector_ok == 'true' && steps.confirm.outputs.verified == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
          FIRST_LINE: ${{ steps.confirm.outputs.first_line }}
          FIRST_COL: ${{ steps.confirm.outputs.first_col }}
        shell: bash
        run: |
          set -euo pipefail
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean; d=build-logs/fa446-matrix/selected
          test "$(sha256sum "$src" | awk '{print $1}')" = "$SELECTED_SHA"
          git add "$src" "$d/SELECTION.json" "$d/CANDIDATE_RESULTS.json" "$d/CHOSEN_METRIC.json" "$d/CONFIRMATION.json" "$d/CONFIRMATION.txt" "$d/Mock2_FunctionalAnalysis-selected.lean"
          git commit -m "fix: materialize FA446 ${SELECTED_VARIANT} first-${FIRST_LINE}-${FIRST_COL} ${SELECTED_SHA:0:12}"
          git push origin "HEAD:${ACTIVE_BRANCH}"
          test "$(git show "HEAD:$src" | sha256sum | awk '{print $1}')" = "$SELECTED_SHA"
          echo 'source_committed=true' >> "$GITHUB_OUTPUT"

      - name: Verify selected worktree and HEAD identity
        id: identity
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          d=build-logs/fa446-matrix/final-gates; mkdir -p "$d"; src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          worktree=$(test -f "$src" && sha256sum "$src" | awk '{print $1}' || true); headsrc=$(git show "HEAD:$src" 2>/dev/null | sha256sum | awk '{print $1}')
          ok=false; if test -n "${SELECTED_SHA:-}" && test "$SELECTED_SHA" = "$worktree" && test "$SELECTED_SHA" = "$headsrc"; then ok=true; fi
          export S="$SELECTED_SHA" W="$worktree" H="$headsrc" O="$ok"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r={'selected_sha256':os.environ.get('S',''),'worktree_sha256':os.environ.get('W',''),'head_source_sha256':os.environ.get('H',''),'identity_ok':os.environ.get('O')=='true'}
          Path('build-logs/fa446-matrix/final-gates/CHECKED_IN_IDENTITY.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          PY
          echo "identity_ok=$ok" >> "$GITHUB_OUTPUT"; exit 0

      - name: Direct-compile checked-in FA twice and audit trust
        id: fa_gate
        if: steps.identity.outputs.identity_ok == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"; d=build-logs/fa446-matrix/final-gates; mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          for n in 1 2; do
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean; i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean; p="$d/FA-run${n}"
            cmd=(lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src"); rm -f "$o" "$i"; touch "${p}.executed"; printf '%q ' "${cmd[@]}" > "${p}.command.txt"; printf '\n' >> "${p}.command.txt"
            "${cmd[@]}" > "${p}.log" 2>&1; printf '%s' "$?" > "${p}.exit"; printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "${p}.olean.size"; printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "${p}.ilean.size"
          done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,re
          d=Path('build-logs/fa446-matrix/final-gates'); src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          def n(p,default=999):
            try:return int(Path(p).read_text())
            except:return default
          code=re.sub(r'/\-.*?\-/|--[^\n]*|"(?:\\.|[^"\\])*"','',src.read_text(),flags=re.S)
          audit={'sorry':len(re.findall(r'\bsorry\b',code)),'admit':len(re.findall(r'\badmit\b',code)),'global axiom':len(re.findall(r'^\s*axiom\b',code,re.M)),'unsafe':len(re.findall(r'\bunsafe\b',code)),'native_decide':len(re.findall(r'\bnative_decide\b',code)),'Lean.ofReduceBool':code.count('Lean.ofReduceBool')}
          runs=[]
          for i in (1,2): runs.append({'run':i,'exit':n(d/f'FA-run{i}.exit'),'olean_size':n(d/f'FA-run{i}.olean.size',0),'ilean_size':n(d/f'FA-run{i}.ilean.size',0)})
          passed=all(r['exit']==0 and r['olean_size']>0 and r['ilean_size']>0 for r in runs) and all(v==0 for v in audit.values())
          r={'classification':'TRUE_PASS' if passed else 'LEAN_FAILURE','source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),'runs':runs,'trust_audit':audit,'FA_TRUE_PASS':passed}
          (d/'FA_FINAL.json').write_text(json.dumps(r,indent=2)+'\n'); print(json.dumps(r,indent=2))
          with open('${GITHUB_OUTPUT}','a') as f:f.write(f'fa_true_pass={str(passed).lower()}\n')
          PY
          exit 0

      - name: Record downstream gate and compact evidence
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa446-matrix/final-gates; mkdir -p "$d"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          p=os.environ.get('FA_TRUE_PASS')=='true'; r={'Integrated':'PENDING' if p else 'BLOCKED_BY_FA','Mock3_bridges':'PENDING' if p else 'BLOCKED_BY_FA','QYM':'PENDING' if p else 'BLOCKED_BY_FA','FA_TRUE_PASS':p}
          Path('build-logs/fa446-matrix/final-gates/DOWNSTREAM.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          git config user.name 'github-actions[bot]'; git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa446-matrix/selected build-logs/fa446-matrix/final-gates
          if ! git diff --cached --quiet; then git commit -m 'ci: record FA446 measurable matrix evidence [skip ci]'; git push origin "HEAD:${ACTIVE_BRANCH}"; fi

      - name: Upload FA446 selected and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa446-selected-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa446-matrix/selected
            build-logs/fa446-matrix/final-gates
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce selector and identity infrastructure
        if: always()
        env:
          SELECTOR_OK: ${{ steps.select.outputs.selector_ok }}
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: test "${SELECTOR_OK:-false}" = true && test "${IDENTITY_OK:-false}" = true
