name: FA447 invariant and height strict direct matrix

on:
  push:
    branches:
      - fix/fa447-invariant-height-matrix-20260810
    paths:
      - build-logs/fa447-invariant-height/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa447-invariant-height-direct-matrix
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa447-invariant-height-matrix-20260810
  CHAMPION_COMMIT: 362d7cb67294953d24d8abc61c3adc4fca4255cd
  CHAMPION_SHA256: c12778aa72fa9541b064e466d59c854283766e73c02fda1a586cf7380e7f7626
  EXPECTED_LINES: '60453'

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 6
      matrix:
        variant:
          - champion
          - height_only
          - proof_invariant
          - proof_invariant_height
          - namespace_both
          - namespace_both_height
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: ${{ matrix.variant }}
      MAX_ERRORS: '120'
      BASELINE_COMMIT: 362d7cb67294953d24d8abc61c3adc4fca4255cd
    steps:
      - name: Checkout immutable FA447 trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: false

      - name: Verify exact checked-in 32592 champion source
        shell: bash
        run: |
          set -euo pipefail
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          actual=$(sha256sum "$src" | awk '{print $1}')
          test "$actual" = "$CHAMPION_SHA256"
          lines=$(python3 - <<'PY'
          from pathlib import Path
          data=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()
          print(data.count(b'\n') + (0 if data.endswith(b'\n') else 1))
          PY
          )
          test "$lines" = "$EXPECTED_LINES"

      - name: Install pinned Lean and Mathlib cache for every candidate
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Generate exact same-height invariant-height candidate
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          python3 scripts/fa447_prepare_invariant_height_candidate.py \
            --variant "$VARIANT" --output-dir "$d" > "$d/prepare.log" 2>&1
          rc=$?
          cat "$d/prepare.log"
          printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
            touch "$d/PREPARE_FAILED"
          fi
          exit 0

      - name: Execute actual direct Lean CLI for all required sources
        if: always()
        env:
          PREPARE_OK: ${{ steps.prepare.outputs.ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1
            local src="PrimalitySheafVerification/${stem}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"
            printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/${stem}.ilean.size"
            return 0
          }
          if test "${PREPARE_OK:-false}" = true; then
            compile_one Mock2
            compile_one Mock2_Advanced
            compile_one Mock2_FunctionalAnalysis
          else
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
              printf '125' > "$d/${stem}.exit"
              printf 'candidate preparation failed before direct Lean CLI\n' > "$d/${stem}.log"
              printf 'INFRA: not executed\n' > "$d/${stem}.command.txt"
              printf '0' > "$d/${stem}.olean.size"
              printf '0' > "$d/${stem}.ilean.size"
            done
          fi
          export PREPARE_OK="${PREPARE_OK:-false}"
          python3 scripts/fa443_record_direct_metric.py > "$d/metric-console.log" 2>&1
          cat "$d/metric-console.log"
          exit 0

      - name: Upload complete candidate source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa447-candidate-${{ matrix.variant }}
          path: build-logs/fa443-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

  select-confirm-persist:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 420
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      MAX_ERRORS: '160'
    steps:
      - name: Checkout immutable FA447 trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Configure Git identity before every possible commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download complete current-run candidate artifacts and select strictly
        id: select
        shell: bash
        run: |
          set +e
          rm -rf /tmp/fa447-collected build-logs/fa447-invariant-height/selected
          mkdir -p /tmp/fa447-collected build-logs/fa447-invariant-height/selected
          variants=(champion height_only proof_invariant proof_invariant_height namespace_both namespace_both_height)
          download_rc=0
          for variant in "${variants[@]}"; do
            mkdir -p "/tmp/fa447-collected/${variant}"
            gh run download "$GITHUB_RUN_ID" -n "fa447-candidate-${variant}" \
              -D "/tmp/fa447-collected/${variant}" || download_rc=1
          done
          selector_rc=125
          if test "$download_rc" -eq 0; then
            python3 scripts/fa447_select_invariant_height.py \
              --collected /tmp/fa447-collected \
              --output build-logs/fa447-invariant-height/selected \
              > build-logs/fa447-invariant-height/selected/selector-console.log 2>&1
            selector_rc=$?
          else
            printf 'artifact download failure\n' > build-logs/fa447-invariant-height/selected/selector-console.log
          fi
          cat build-logs/fa447-invariant-height/selected/selector-console.log
          printf '%s' "$selector_rc" > build-logs/fa447-invariant-height/selected/selector.exit
          if test "$selector_rc" -eq 0; then
            echo 'selector_ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'selector_ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Install pinned Lean for independent selected-source confirmation
        if: steps.select.outputs.selector_ok == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447-invariant-height/selected
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Independently direct-compile selected repository source
        id: confirm
        if: steps.select.outputs.selector_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
          SELECTED_FA_EXIT: ${{ steps.select.outputs.fa_exit }}
          SELECTED_FIRST_LINE: ${{ steps.select.outputs.first_line }}
          SELECTED_FIRST_COL: ${{ steps.select.outputs.first_col }}
          SELECTED_DECLARATION: ${{ steps.select.outputs.declaration }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa447-invariant-height/selected
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" "$src"
          test "$(sha256sum "$src" | awk '{print $1}')" = "$SELECTED_SHA" || true
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            local stem=$1 s="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$s")
            rm -f "$o" "$i"
            touch "$d/confirm-${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/confirm-${stem}.command.txt"
            printf '\n' >> "$d/confirm-${stem}.command.txt"
            "${cmd[@]}" > "$d/confirm-${stem}.log" 2>&1
            printf '%s' "$?" > "$d/confirm-${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/confirm-${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/confirm-${stem}.ilean.size"
          }
          compile_one Mock2
          compile_one Mock2_Advanced
          compile_one Mock2_FunctionalAnalysis
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          d=Path('build-logs/fa447-invariant-height/selected')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          chosen=json.loads((d/'CHOSEN_METRIC.json').read_text())
          text=src.read_text(errors='replace')
          log=(d/'confirm-Mock2_FunctionalAnalysis.log').read_text(errors='replace')
          m=re.search(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+error(?:\([^)]*\))?:',log)
          first=(int(m.group(1)),int(m.group(2))) if m else (0,0)
          decl_re=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s(:]+)')
          name='<none>'; idx=-1
          if first[0]>0:
              for line_no,line in enumerate(text.splitlines(),start=1):
                  dm=decl_re.match(line)
                  if dm: idx+=1; name=dm.group(1)
                  if line_no>=first[0]: break
          def rc(stem): return int((d/f'confirm-{stem}.exit').read_text())
          actual_sha=hashlib.sha256(src.read_bytes()).hexdigest()
          chosen_rank=(1,10**9,10**9,10**9) if int(chosen['FA_exit'])==0 else (0,int(chosen['FA_error_declaration_index']),int(chosen['FA_first_actual_error_line']),int(chosen['FA_first_actual_error_col']))
          confirm_rank=(1,10**9,10**9,10**9) if rc('Mock2_FunctionalAnalysis')==0 else (0,idx,first[0],first[1])
          verified=(actual_sha==os.environ['SELECTED_SHA'] and rc('Mock2')==0 and rc('Mock2_Advanced')==0 and confirm_rank>=chosen_rank)
          result={'verified':verified,'selected_variant':os.environ['SELECTED_VARIANT'],'selected_sha256':os.environ['SELECTED_SHA'],
                  'actual_sha256':actual_sha,'Mock2_exit':rc('Mock2'),'Mock2_Advanced_exit':rc('Mock2_Advanced'),
                  'FA_exit':rc('Mock2_FunctionalAnalysis'),'first_error_line':first[0],'first_error_col':first[1],
                  'first_error_declaration':name,'first_error_declaration_index':idx,
                  'chosen_rank':chosen_rank,'confirmation_rank':confirm_rank}
          (d/'CONFIRMATION.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"verified={str(verified).lower()}\n")
              out.write(f"first_line={first[0]}\n")
              out.write(f"first_col={first[1]}\n")
              out.write(f"declaration={name}\n")
          PY
          exit 0

      - name: Materialize independently verified strict selected source
        id: persist
        if: steps.select.outputs.strict == 'true' && steps.confirm.outputs.verified == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447-invariant-height/selected
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum "$src" | awk '{print $1}')" = "$SELECTED_SHA"
          git add "$src" "$d/SELECTION.json" "$d/CANDIDATE_RESULTS.json" \
            "$d/CHOSEN_METRIC.json" "$d/CONFIRMATION.json" \
            "$d/Mock2_FunctionalAnalysis-selected.lean"
          git commit -m "fix: promote FA447 ${SELECTED_VARIANT} first-${{ steps.confirm.outputs.first_line }}-${{ steps.confirm.outputs.first_col }}"
          git push origin "HEAD:${ACTIVE_BRANCH}"
          test "$(git show "HEAD:$src" | sha256sum | awk '{print $1}')" = "$SELECTED_SHA"
          echo 'materialized=true' >> "$GITHUB_OUTPUT"

      - name: Record no-improvement selection without source mutation
        if: steps.select.outputs.selector_ok == 'true' && steps.select.outputs.strict != 'true'
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa447-invariant-height/selected
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add "$d/SELECTION.json" "$d/CANDIDATE_RESULTS.json" "$d/CHOSEN_METRIC.json"
          git commit -m 'evidence: FA447 no strict improvement over first-32592-5 [skip ci]'
          git push origin "HEAD:${ACTIVE_BRANCH}"

      - name: Verify selected worktree and checked-in HEAD identity
        id: identity
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          MATERIALIZED: ${{ steps.persist.outputs.materialized }}
        shell: bash
        run: |
          set +e
          d=build-logs/fa447-invariant-height/final-gates
          mkdir -p "$d"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          worktree=$(test -f "$src" && sha256sum "$src" | awk '{print $1}' || true)
          headsrc=$(git show "HEAD:$src" 2>/dev/null | sha256sum | awk '{print $1}')
          identity=false
          if test -n "${SELECTED_SHA:-}" && test "$SELECTED_SHA" = "$worktree" && test "$SELECTED_SHA" = "$headsrc"; then identity=true; fi
          export SELECTED="$SELECTED_SHA" WORKTREE="$worktree" HEADSRC="$headsrc" IDENTITY="$identity"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,subprocess
          r={'selected_sha256':os.environ.get('SELECTED',''),'worktree_sha256':os.environ.get('WORKTREE',''),
             'head_source_sha256':os.environ.get('HEADSRC',''),'identity_ok':os.environ.get('IDENTITY')=='true',
             'head_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()}
          Path('build-logs/fa447-invariant-height/final-gates/CHECKED_IN_IDENTITY.json').write_text(json.dumps(r,indent=2)+'\n')
          print(json.dumps(r,indent=2))
          PY
          echo "identity_ok=$identity" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Direct-compile checked-in FA twice and audit trust
        id: fa_gate
        if: steps.identity.outputs.identity_ok == 'true'
        env:
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa447-invariant-height/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          for n in 1 2; do
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            touch "$d/FA-run${n}.executed"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            printf '%s' "$?" > "$d/FA-run${n}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/FA-run${n}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/FA-run${n}.ilean.size"
          done
          export SOURCE_SHA=$(sha256sum "$src" | awk '{print $1}')
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,json,os,sys
          d=Path('build-logs/fa447-invariant-height/final-gates')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          spec=importlib.util.spec_from_file_location('audit',Path('scripts/fa442_prepare_same_height_candidate.py'))
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          audit=dict(mod.forbidden_counts(src.read_text()))
          runs=[]
          for n in (1,2):
              runs.append({'run':n,'exit':int((d/f'FA-run{n}.exit').read_text()),
                           'olean_size':int((d/f'FA-run{n}.olean.size').read_text()),
                           'ilean_size':int((d/f'FA-run{n}.ilean.size').read_text())})
          true_pass=(os.environ['SOURCE_SHA']==os.environ['SELECTED_SHA'] and
                     all(r['exit']==0 and r['olean_size']>0 and r['ilean_size']>0 for r in runs) and
                     all(v==0 for v in audit.values()))
          result={'classification':'TRUE_PASS' if true_pass else 'LEAN_FAILURE','FA_TRUE_PASS':true_pass,
                  'source_sha256':os.environ['SOURCE_SHA'],'runs':runs,'forbidden_audit':audit}
          (d/'FA_FINAL.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f"fa_true_pass={str(true_pass).lower()}\n")
          PY
          exit 0

      - name: Run ordered downstream two-pass gate only after FA TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa447-invariant-height/final-gates
          complete=true; integrated=NOT_RUN; bridges=NOT_RUN; qym=NOT_RUN
          compile_target() {
            local stem=$1 n=$2 s="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$s" > "$d/${stem}-run${n}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          compile_target Mock2_FunctionalAnalysis_Integrated 1; a=$?
          compile_target Mock2_FunctionalAnalysis_Integrated 2; b=$?
          test "$a" -eq 0 && test "$b" -eq 0 && integrated=PASS_2X || { integrated=LEAN_FAILURE; complete=false; }
          if test "$complete" = true; then
            bridges=PASS_2X
            shopt -s nullglob
            for s in PrimalitySheafVerification/Mock3*.lean; do
              stem=$(basename "$s" .lean)
              compile_target "$stem" 1; a=$?
              compile_target "$stem" 2; b=$?
              test "$a" -eq 0 && test "$b" -eq 0 || { bridges="LEAN_FAILURE:${stem}"; complete=false; break; }
            done
          else
            bridges=BLOCKED_BY_INTEGRATED
          fi
          if test "$complete" = true; then
            compile_target QYM 1; a=$?
            compile_target QYM 2; b=$?
            test "$a" -eq 0 && test "$b" -eq 0 && qym=PASS_2X || { qym=LEAN_FAILURE; complete=false; }
          else
            qym=BLOCKED_BY_EARLIER_GATE
          fi
          export COMPLETE="$complete" INTEGRATED="$integrated" BRIDGES="$bridges" QYM_STATUS="$qym"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r={'complete':os.environ['COMPLETE']=='true','Integrated':os.environ['INTEGRATED'],
             'Mock3_bridges':os.environ['BRIDGES'],'QYM':os.environ['QYM_STATUS']}
          Path('build-logs/fa447-invariant-height/final-gates/DOWNSTREAM.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          exit 0

      - name: Record downstream blocked unless FA is TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass != 'true'
        shell: bash
        run: |
          mkdir -p build-logs/fa447-invariant-height/final-gates
          printf '{"complete":false,"Integrated":"BLOCKED_BY_FA_TRUE_PASS_GATE","Mock3_bridges":"BLOCKED_BY_FA_TRUE_PASS_GATE","QYM":"BLOCKED_BY_FA_TRUE_PASS_GATE"}\n' \
            > build-logs/fa447-invariant-height/final-gates/DOWNSTREAM.json

      - name: Build compact FA447 matrix report
        if: always()
        env:
          SELECTOR_OK: ${{ steps.select.outputs.selector_ok }}
          STRICT: ${{ steps.select.outputs.strict }}
          CLASSIFICATION: ${{ steps.select.outputs.classification }}
          SELECTED_VARIANT: ${{ steps.select.outputs.variant }}
          SELECTED_SHA: ${{ steps.select.outputs.source_sha256 }}
          CONFIRMED: ${{ steps.confirm.outputs.verified }}
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          d=Path('build-logs/fa447-invariant-height')
          report={'title':'FA447 INVARIANT-HEIGHT DIRECT MATRIX REPORT','workflow_run_id':os.environ.get('GITHUB_RUN_ID',''),
                  'workflow_run_url':f"https://github.com/{os.environ.get('GITHUB_REPOSITORY','')}/actions/runs/{os.environ.get('GITHUB_RUN_ID','')}",
                  'selector_ok':os.environ.get('SELECTOR_OK')=='true','strict_promotion':os.environ.get('STRICT')=='true',
                  'classification':os.environ.get('CLASSIFICATION',''),'selected_variant':os.environ.get('SELECTED_VARIANT',''),
                  'selected_sha256':os.environ.get('SELECTED_SHA',''),'independent_confirmation':os.environ.get('CONFIRMED')=='true',
                  'identity_ok':os.environ.get('IDENTITY_OK')=='true','FA_TRUE_PASS':os.environ.get('FA_TRUE_PASS')=='true'}
          for name,path in [('selection',d/'selected/SELECTION.json'),('identity',d/'final-gates/CHECKED_IN_IDENTITY.json'),
                            ('fa_final',d/'final-gates/FA_FINAL.json'),('downstream',d/'final-gates/DOWNSTREAM.json')]:
              if path.exists(): report[name]=json.loads(path.read_text())
          (d/'PIPELINE_REPORT.json').write_text(json.dumps(report,indent=2)+'\n')
          print(json.dumps(report,indent=2))
          PY

      - name: Commit compact final evidence with configured identity
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa447-invariant-height/PIPELINE_REPORT.json \
            build-logs/fa447-invariant-height/final-gates/CHECKED_IN_IDENTITY.json \
            build-logs/fa447-invariant-height/final-gates/FA_FINAL.json \
            build-logs/fa447-invariant-height/final-gates/DOWNSTREAM.json || true
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA447 invariant-height direct matrix evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload FA447 selection and gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa447-invariant-height-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa447-invariant-height
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce pipeline integrity separately from Lean proof status
        if: always()
        env:
          SELECTOR_OK: ${{ steps.select.outputs.selector_ok }}
          STRICT: ${{ steps.select.outputs.strict }}
          CONFIRMED: ${{ steps.confirm.outputs.verified }}
          IDENTITY_OK: ${{ steps.identity.outputs.identity_ok }}
        shell: bash
        run: |
          test "${SELECTOR_OK:-false}" = true
          if test "${STRICT:-false}" = true; then
            test "${CONFIRMED:-false}" = true
            test "${IDENTITY_OK:-false}" = true
          fi
