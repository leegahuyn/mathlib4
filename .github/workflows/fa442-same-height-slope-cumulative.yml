name: FA446 proof-local measurable const-smul strict continuation

on:
  push:
    branches:
      - fix/fa446-measurable-const-smul-after-fa445-20260810
    paths:
      - build-logs/fa446-measurable-smul/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa446-measurable-const-smul
  cancel-in-progress: false

env:
  ACTIVE_BRANCH: fix/fa446-measurable-const-smul-after-fa445-20260810
  BASELINE_COMMIT: b7c8159cc3de07dbe455b9d3979e043e18e20886
  BASELINE_SHA256: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
  PARENT_SHA256: 4647a9463e4264a7f0e08405b7ccd1ce9be87e7227fa2b91dc52024e2e198152
  CANDIDATE_SHA256: c12778aa72fa9541b064e466d59c854283766e73c02fda1a586cf7380e7f7626
  EXPECTED_LINES: '60453'
  VARIANT: measurable_const_smul_local
  MAX_ERRORS: '120'

jobs:
  verify-promote:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout immutable FA446 trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Configure Git identity before every commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Restore exact authoritative 31726 baseline source
        shell: bash
        run: |
          set -euo pipefail
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if ! git cat-file -e "${BASELINE_COMMIT}^{commit}" 2>/dev/null; then
            git fetch --no-tags --depth=1 origin "$BASELINE_COMMIT"
          fi
          git show "${BASELINE_COMMIT}:$src" > /tmp/fa446-baseline.lean
          test "$(sha256sum /tmp/fa446-baseline.lean | awk '{print $1}')" = "$BASELINE_SHA256"
          lines=$(python3 - <<'PY'
          from pathlib import Path
          d=Path('/tmp/fa446-baseline.lean').read_bytes()
          print(d.count(b'\n') + (0 if d.endswith(b'\n') else 1))
          PY
          )
          test "$lines" = "$EXPECTED_LINES"
          cp /tmp/fa446-baseline.lean "$src"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa446-measurable-smul
          mkdir -p "$d"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Reproduce selected FA445 source then apply one same-height repair
        id: prepare
        shell: bash
        run: |
          set +e
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          python3 scripts/fa443_prepare_same_height_candidate.py \
            --variant slope_paired_parenthesized_ring --output-dir "$d" \
            > "$d/parent-prepare.log" 2>&1
          rc=$?
          if test "$rc" -eq 0; then
            test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$PARENT_SHA256"
            python3 scripts/fa446_measurable_const_smul.py --output-dir "$d" \
              > "$d/fa446-repair.log" 2>&1
            rc=$?
          fi
          cat "$d/parent-prepare.log"
          test -f "$d/fa446-repair.log" && cat "$d/fa446-repair.log" || true
          printf '%s' "$rc" > "$d/prepare.exit"
          if test "$rc" -eq 0; then
            test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA256"
            echo 'ok=true' >> "$GITHUB_OUTPUT"
          else
            echo 'ok=false' >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Execute direct Lean CLI for Mock2 Mock2 Advanced and FA446
        id: metric
        if: always()
        env:
          PREPARE_OK: ${{ steps.prepare.outputs.ok }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          cp build-logs/fa446-measurable-smul/lean-version.txt "$d/lean-version.txt"
          cp build-logs/fa446-measurable-smul/lake-version.txt "$d/lake-version.txt"
          cp build-logs/fa446-measurable-smul/cache-get.log "$d/cache-get.log"
          compile_one() {
            local stem=$1 src="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$src")
            rm -f "$o" "$i"
            touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"; printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1
            printf '%s' "$?" > "$d/${stem}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/${stem}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/${stem}.ilean.size"
            return 0
          }
          if test "${PREPARE_OK:-false}" = true; then
            compile_one Mock2
            compile_one Mock2_Advanced
            compile_one Mock2_FunctionalAnalysis
          else
            for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis; do
              printf '125' > "$d/${stem}.exit"
              printf 'preparation failed before direct Lean CLI\n' > "$d/${stem}.log"
              printf 'INFRA: not executed\n' > "$d/${stem}.command.txt"
            done
          fi
          export PREPARE_OK="${PREPARE_OK:-false}"
          python3 scripts/fa443_record_direct_metric.py > "$d/metric-console.log" 2>&1
          cat "$d/metric-console.log"
          exit 0

      - name: Classify against the direct-verified 32590 parent
        id: classify
        shell: bash
        run: |
          set +e
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          d=Path('build-logs/fa443-matrix/candidates/measurable_const_smul_local')
          metric=json.loads((d/'METRIC.json').read_text())
          parent={'sha256':os.environ['PARENT_SHA256'],'declaration_index':2671,'line':32590,'column':5,
                  'declaration':'selectedHalfOpenTile_ae_eq_openTile'}
          common=(metric.get('classification')=='VERIFIED' and
                  metric.get('all_required_lean_commands_executed') is True and
                  metric.get('source_sha256')==os.environ['CANDIDATE_SHA256'] and
                  metric.get('line_count')==60453 and metric.get('same_height') is True and
                  metric.get('theorem_header_unchanged') is True and
                  metric.get('Mock2_exit')==0 and metric.get('Mock2_errors_under_cap')==0 and
                  metric.get('Mock2_Advanced_exit')==0 and metric.get('Mock2_Advanced_errors_under_cap')==0 and
                  metric.get('forbidden_clean') is True)
          cidx=int(metric.get('FA_error_declaration_index',-1))
          cpos=(int(metric.get('FA_first_actual_error_line',0)),int(metric.get('FA_first_actual_error_col',0)))
          strict=common and (metric.get('FA_exit')==0 or cidx>2671 or (cidx==2671 and cpos>(32590,5)))
          if not common: classification='INFRA_FAILURE'
          elif metric.get('FA_exit')==0: classification='FA_PASS_CANDIDATE'
          elif strict and cidx>2671: classification='DECLARATION_BREAKTHROUGH'
          elif strict: classification='SMALL_SAME_DECLARATION_ADVANCE'
          else: classification='NO_IMPROVEMENT'
          result={'classification':classification,'strict_promotion':strict,'parent':parent,'candidate':metric,
                  'authority':'actual direct Lean CLI on same-height checked repository source path'}
          (d/'STATUS.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out:
              out.write(f"strict={str(strict).lower()}\n")
              out.write(f"classification={classification}\n")
              out.write(f"fa_exit={metric.get('FA_exit')}\n")
              out.write(f"first_line={metric.get('FA_first_actual_error_line')}\n")
              out.write(f"first_col={metric.get('FA_first_actual_error_col')}\n")
              out.write(f"declaration={metric.get('FA_first_error_declaration')}\n")
          PY
          exit 0

      - name: Persist source only after strict direct-Lean improvement
        id: persist
        if: steps.classify.outputs.strict == 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum "$src" | awk '{print $1}')" = "$CANDIDATE_SHA256"
          git add "$src" "$d/CANDIDATE.json" "$d/FA446_REPAIR.json" "$d/METRIC.json" "$d/STATUS.json"
          git commit -m "fix: promote FA446 measurable const-smul first-${{ steps.classify.outputs.first_line }}-${{ steps.classify.outputs.first_col }}"
          git push origin "HEAD:${ACTIVE_BRANCH}"
          test "$(git show "HEAD:$src" | sha256sum | awk '{print $1}')" = "$CANDIDATE_SHA256"
          echo 'materialized=true' >> "$GITHUB_OUTPUT"

      - name: Retain parent source when there is no direct improvement
        if: steps.classify.outputs.strict != 'true'
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa443-matrix/candidates/${VARIANT}"
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add "$d/CANDIDATE.json" "$d/FA446_REPAIR.json" "$d/METRIC.json" "$d/STATUS.json"
          git commit -m 'evidence: FA446 no strict improvement over first-32590-5 [skip ci]'
          git push origin "HEAD:${ACTIVE_BRANCH}"

      - name: Independently confirm materialized source and identity
        id: confirm
        if: steps.persist.outputs.materialized == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa446-measurable-smul/confirmation
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          worktree=$(sha256sum "$src" | awk '{print $1}')
          headsrc=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          identity=false
          test "$worktree" = "$CANDIDATE_SHA256" && test "$headsrc" = "$CANDIDATE_SHA256" && identity=true
          compile_one() {
            local stem=$1 s="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            local cmd=(lake env lean -DmaxErrors="$MAX_ERRORS" -DwarningAsError=false -o "$o" -i "$i" "$s")
            rm -f "$o" "$i"; touch "$d/${stem}.executed"
            printf '%q ' "${cmd[@]}" > "$d/${stem}.command.txt"; printf '\n' >> "$d/${stem}.command.txt"
            "${cmd[@]}" > "$d/${stem}.log" 2>&1; printf '%s' "$?" > "$d/${stem}.exit"
          }
          compile_one Mock2
          compile_one Mock2_Advanced
          compile_one Mock2_FunctionalAnalysis
          export IDENTITY="$identity" WORKTREE="$worktree" HEADSRC="$headsrc"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          d=Path('build-logs/fa446-measurable-smul/confirmation')
          metric=json.loads(Path('build-logs/fa443-matrix/candidates/measurable_const_smul_local/METRIC.json').read_text())
          def rc(stem): return int((d/f'{stem}.exit').read_text())
          log=(d/'Mock2_FunctionalAnalysis.log').read_text(errors='replace')
          m=re.search(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+error(?:\([^)]*\))?:',log)
          pos=(int(m.group(1)),int(m.group(2))) if m else (0,0)
          verified=(os.environ['IDENTITY']=='true' and rc('Mock2')==0 and rc('Mock2_Advanced')==0 and
                    (rc('Mock2_FunctionalAnalysis')==0 or pos>=(metric['FA_first_actual_error_line'],metric['FA_first_actual_error_col'])))
          result={'verified':verified,'identity_ok':os.environ['IDENTITY']=='true','selected_sha256':os.environ['CANDIDATE_SHA256'],
                  'worktree_sha256':os.environ['WORKTREE'],'head_source_sha256':os.environ['HEADSRC'],
                  'Mock2_exit':rc('Mock2'),'Mock2_Advanced_exit':rc('Mock2_Advanced'),
                  'FA_exit':rc('Mock2_FunctionalAnalysis'),'first_error_line':pos[0],'first_error_col':pos[1]}
          (d/'CONFIRMATION.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f"verified={str(verified).lower()}\n")
          PY
          exit 0

      - name: Direct-compile checked-in FA twice and audit TRUE PASS gate
        id: fa_gate
        if: steps.confirm.outputs.verified == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa446-measurable-smul/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          for n in 1 2; do
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"; touch "$d/FA-run${n}.executed"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            printf '%s' "$?" > "$d/FA-run${n}.exit"
            printf '%s' "$(test -s "$o" && stat -c%s "$o" || echo 0)" > "$d/FA-run${n}.olean.size"
            printf '%s' "$(test -s "$i" && stat -c%s "$i" || echo 0)" > "$d/FA-run${n}.ilean.size"
          done
          export SOURCE_SHA=$(sha256sum "$src" | awk '{print $1}')
          python3 - <<'PY'
          from pathlib import Path
          import importlib.util,json,os,sys
          d=Path('build-logs/fa446-measurable-smul/final-gates')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          spec=importlib.util.spec_from_file_location('audit',Path('scripts/fa442_prepare_same_height_candidate.py'))
          mod=importlib.util.module_from_spec(spec); sys.modules[spec.name]=mod; spec.loader.exec_module(mod)
          audit=dict(mod.forbidden_counts(src.read_text()))
          runs=[]
          for n in (1,2):
              runs.append({'run':n,'exit':int((d/f'FA-run{n}.exit').read_text()),
                           'olean_size':int((d/f'FA-run{n}.olean.size').read_text()),
                           'ilean_size':int((d/f'FA-run{n}.ilean.size').read_text())})
          true_pass=(os.environ['SOURCE_SHA']==os.environ['CANDIDATE_SHA256'] and all(r['exit']==0 and r['olean_size']>0 and r['ilean_size']>0 for r in runs) and all(v==0 for v in audit.values()))
          result={'classification':'TRUE_PASS' if true_pass else 'LEAN_FAILURE','FA_TRUE_PASS':true_pass,
                  'source_sha256':os.environ['SOURCE_SHA'],'runs':runs,'forbidden_audit':audit}
          (d/'FA_FINAL.json').write_text(json.dumps(result,indent=2)+'\n'); print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as out: out.write(f"fa_true_pass={str(true_pass).lower()}\n")
          PY
          exit 0

      - name: Run ordered downstream two-pass gate only after FA TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass == 'true'
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa446-measurable-smul/final-gates
          complete=true; integrated=NOT_RUN; bridges=NOT_RUN; qym=NOT_RUN
          compile_target() {
            local stem=$1 n=$2 s="PrimalitySheafVerification/${1}.lean"
            local o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$s" > "$d/${stem}-run${n}.log" 2>&1
            local rc=$?; printf '%s' "$rc" > "$d/${stem}-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          stem=Mock2_FunctionalAnalysis_Integrated
          compile_target "$stem" 1; a=$?; compile_target "$stem" 2; b=$?
          test "$a" -eq 0 && test "$b" -eq 0 && integrated=PASS_2X || { integrated=LEAN_FAILURE; complete=false; }
          if test "$complete" = true; then
            bridges=PASS_2X; shopt -s nullglob
            for s in PrimalitySheafVerification/Mock3*.lean; do
              stem=$(basename "$s" .lean); compile_target "$stem" 1; a=$?; compile_target "$stem" 2; b=$?
              test "$a" -eq 0 && test "$b" -eq 0 || { bridges="LEAN_FAILURE:${stem}"; complete=false; break; }
            done
          else bridges=BLOCKED_BY_INTEGRATED; fi
          if test "$complete" = true; then
            compile_target QYM 1; a=$?; compile_target QYM 2; b=$?
            test "$a" -eq 0 && test "$b" -eq 0 && qym=PASS_2X || { qym=LEAN_FAILURE; complete=false; }
          else qym=BLOCKED_BY_EARLIER_GATE; fi
          export COMPLETE="$complete" INTEGRATED="$integrated" BRIDGES="$bridges" QYM_STATUS="$qym"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          r={'complete':os.environ['COMPLETE']=='true','Integrated':os.environ['INTEGRATED'],
             'Mock3_bridges':os.environ['BRIDGES'],'QYM':os.environ['QYM_STATUS']}
          Path('build-logs/fa446-measurable-smul/final-gates/DOWNSTREAM.json').write_text(json.dumps(r,indent=2)+'\n')
          PY
          exit 0

      - name: Record downstream blocked when FA is not TRUE PASS
        if: steps.fa_gate.outputs.fa_true_pass != 'true'
        shell: bash
        run: |
          mkdir -p build-logs/fa446-measurable-smul/final-gates
          printf '{"complete":false,"Integrated":"BLOCKED_BY_FA_TRUE_PASS_GATE","Mock3_bridges":"BLOCKED_BY_FA_TRUE_PASS_GATE","QYM":"BLOCKED_BY_FA_TRUE_PASS_GATE"}\n' \
            > build-logs/fa446-measurable-smul/final-gates/DOWNSTREAM.json

      - name: Commit compact final confirmation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add build-logs/fa446-measurable-smul/confirmation \
            build-logs/fa446-measurable-smul/final-gates || true
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA446 direct confirmation and ordered gate [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload FA446 source and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa446-measurable-const-smul-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa443-matrix/candidates/measurable_const_smul_local
            build-logs/fa446-measurable-smul
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce strict direct improvement without conflating FA PASS
        if: always()
        env:
          STRICT: ${{ steps.classify.outputs.strict }}
        shell: bash
        run: test "${STRICT:-false}" = true
