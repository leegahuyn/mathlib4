name: PASS 387 self-chaining FA Integrated Mock3 QYM repair

on:
  push:
    branches: [fix/fa387-self-chaining-repair-20260809]
    paths:
      - '.github/workflows/pass387-self-chaining-repair.yml'
      - 'scripts/run_declaration_repair_v387.py'
      - 'scripts/promote_current_priority_v387.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
      - 'build-logs/PASS387_TRIGGER.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write
  issues: write

concurrency:
  group: pass387-self-chaining-repair
  cancel-in-progress: false

jobs:
  repair-chain:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      CHAIN_BRANCH: fix/fa387-self-chaining-repair-20260809
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact chain head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 2400
          persist-credentials: true

      - name: Stop immediately after a previously recorded final success
        id: already_done
        shell: bash
        run: |
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]] && \
             [[ -s build-logs/PASS387_PROMOTION.json ]] && \
             grep -q '"pass": true' build-logs/PASS387_PROMOTION.json; then
            echo 'done=true' >> "${GITHUB_OUTPUT}"
            echo 'The priority chain and PR9 promotion were already independently verified.'
          else
            echo 'done=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Install pinned Lean, cache, and official Models CLI
        if: steps.already_done.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/pass387-lean-version.txt
          lake --version | tee /tmp/pass387-lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/pass387-cache.log
          gh extension install github/gh-models --force || true
          gh models --help > /tmp/pass387-gh-models-help.txt 2>&1 || true

      - name: Materialize exact PASS 376 when FA is still a reconstruction stub
        if: steps.already_done.outputs.done != 'true'
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          size=$(wc -c < "${fa}")
          echo "checked_in_fa_size=${size}"
          if [[ ${size} -gt 500000 ]]; then
            echo 'Using the checked-in full FunctionalAnalysis source.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/diagnose_pass341_fa.sh')
          text=path.read_text(encoding='utf-8')
          begin='''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end='''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(begin)!=1 or text.count(end)!=1:
              raise SystemExit('PASS341 direct-compile markers unavailable')
          text=text.replace(begin,'''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text=text.replace(end,'''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text,encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          candidate='/tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean'
          test -s "${candidate}"
          cp "${candidate}" "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Determine persistent cycle number
        if: steps.already_done.outputs.done != 'true'
        id: cycle
        shell: bash
        run: |
          set -euo pipefail
          cycle=$(python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('build-logs/PASS387_CHAIN_STATE.json')
          if not p.exists():
              print(1)
          else:
              try:
                  print(int(json.loads(p.read_text()).get('cycle',0))+1)
              except Exception:
                  print(1)
          PY
          )
          echo "cycle=${cycle}" >> "${GITHUB_OUTPUT}"
          echo "cycle=${cycle}"

      - name: Recompile current repair branches and adopt only a genuinely better source
        if: steps.already_done.outputs.done != 'true'
        shell: bash
        env:
          SUPERVISOR_BRANCH: fix/fa387-self-chaining-repair-20260809
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/pass385_race_supervisor.py \
            > /tmp/pass387-race-supervisor.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-race-supervisor.log
          echo "race_supervisor_exit=${rc}"
          exit 0

      - name: Select the first target that has not passed twice
        if: steps.already_done.outputs.done != 'true'
        id: select_before
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass378
          python3 scripts/priority_chain_v378.py --mode select \
            > /tmp/pass387-selection-before.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-selection-before.log
          test -s /tmp/pass378/selection.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/pass378/selection.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"all_pass={'true' if data.get('all_pass') else 'false'}\n")
              out.write(f"target={data.get('selected_target') or ''}\n")
          print(json.dumps(data,indent=2))
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Compile all checked-in prerequisites for the active target
        if: steps.already_done.outputs.done != 'true' && steps.select_before.outputs.all_pass != 'true' && steps.select_before.outputs.target != ''
        shell: bash
        env:
          ACTIVE_TARGET: ${{ steps.select_before.outputs.target }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/priority_chain_v378.py --mode prepare --target "${ACTIVE_TARGET}"

      - name: Run cycle-aware declaration-level repair on the active target
        if: steps.already_done.outputs.done != 'true' && steps.select_before.outputs.all_pass != 'true' && steps.select_before.outputs.target != ''
        id: declaration
        shell: bash
        env:
          ACTIVE_TARGET: ${{ steps.select_before.outputs.target }}
          CHAIN_CYCLE: ${{ steps.cycle.outputs.cycle }}
          MODEL_CANDIDATES: openai/gpt-5,openai/gpt-4.1,openai/gpt-4o
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass384-declaration-agent
          python3 scripts/run_declaration_repair_v387.py \
            --target "${ACTIVE_TARGET}" --iterations 18 --deadline-seconds 13800 \
            > /tmp/pass387-declaration-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-declaration-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Run conservative full-source fallback when declaration repair made no progress
        if: steps.already_done.outputs.done != 'true' && steps.select_before.outputs.all_pass != 'true' && steps.select_before.outputs.target != '' && steps.declaration.outputs.exit_code == '3'
        id: fallback
        shell: bash
        env:
          ACTIVE_TARGET: ${{ steps.select_before.outputs.target }}
          MODEL_CANDIDATES: openai/gpt-5,openai/gpt-4.1,openai/gpt-4o
          REPAIR_STYLE: >-
            This is persistent self-chain cycle ${{ steps.cycle.outputs.cycle }}. The declaration-level
            replacement agent found no objective progress. Repair only the first independent error cluster,
            but consider adding a small private proved helper or normalizing a shared instance/API root.
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/lean-repair-v377
          python3 scripts/run_lean_repair_v380_styled.py \
            --target "${ACTIVE_TARGET}" --iterations 5 --attempts-per-iteration 3 \
            > /tmp/pass387-full-source-fallback.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-full-source-fallback.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Select the first target again after this repair cycle
        if: steps.already_done.outputs.done != 'true'
        id: select_after
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/pass378
          python3 scripts/priority_chain_v378.py --mode select \
            > /tmp/pass387-selection-after.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-selection-after.log
          test -s /tmp/pass378/selection.json
          cp /tmp/pass378/selection.json /tmp/pass387-selection-after.json
          python3 - <<'PY'
          import json,os
          from pathlib import Path
          data=json.loads(Path('/tmp/pass387-selection-after.json').read_text())
          with open(os.environ['GITHUB_OUTPUT'],'a',encoding='utf-8') as out:
              out.write(f"all_pass={'true' if data.get('all_pass') else 'false'}\n")
              out.write(f"target={data.get('selected_target') or ''}\n")
          print(json.dumps(data,indent=2))
          PY
          echo "selection_exit=${rc}"
          exit 0

      - name: Independently promote the complete two-round chain to PR9
        if: steps.already_done.outputs.done != 'true' && steps.select_after.outputs.all_pass == 'true'
        id: promote
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/promote_current_priority_v387.py \
            > /tmp/pass387-promotion-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass387-promotion-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Write authoritative cycle state and final marker only from compiler evidence
        if: steps.already_done.outputs.done != 'true' && always()
        shell: bash
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
          BEFORE_TARGET: ${{ steps.select_before.outputs.target }}
          AFTER_TARGET: ${{ steps.select_after.outputs.target }}
          ALL_PASS: ${{ steps.select_after.outputs.all_pass }}
          DECLARATION_EXIT: ${{ steps.declaration.outputs.exit_code }}
          FALLBACK_EXIT: ${{ steps.fallback.outputs.exit_code }}
          PROMOTION_EXIT: ${{ steps.promote.outputs.exit_code }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          files=[
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),
          ]
          files += sorted(
              p for p in Path('PrimalitySheafVerification').glob('Mock3*.lean')
              if not any(x in p.name.lower() for x in ('backup','candidate','probe','tmp'))
          )
          files += [Path('PrimalitySheafVerification/QYM.lean')]
          selection={}
          p=Path('/tmp/pass387-selection-after.json')
          if p.exists(): selection=json.loads(p.read_text())
          promotion={}
          pp=Path('build-logs/PASS387_PROMOTION.json')
          if pp.exists():
              try: promotion=json.loads(pp.read_text())
              except Exception: promotion={'parse_error':True}
          payload={
              'cycle':int(os.environ.get('CYCLE') or 0),
              'workflow_run_id':os.environ.get('GITHUB_RUN_ID'),
              'workflow_head':os.environ.get('GITHUB_SHA'),
              'before_target':os.environ.get('BEFORE_TARGET',''),
              'after_target':os.environ.get('AFTER_TARGET',''),
              'selection':selection,
              'declaration_exit':os.environ.get('DECLARATION_EXIT',''),
              'fallback_exit':os.environ.get('FALLBACK_EXIT',''),
              'promotion_exit':os.environ.get('PROMOTION_EXIT',''),
              'promotion':promotion,
              'source_hashes':{
                  str(f):hashlib.sha256(f.read_bytes()).hexdigest()
                  for f in files if f.exists()
              },
          }
          payload['all_required_2x_pass']=(
              os.environ.get('ALL_PASS')=='true'
              and os.environ.get('PROMOTION_EXIT')=='0'
              and promotion.get('pass') is True
          )
          state=Path('build-logs/PASS387_CHAIN_STATE.json')
          state.write_text(json.dumps(payload,indent=2),encoding='utf-8')
          if payload['all_required_2x_pass']:
              final=dict(payload)
              final['status']='SUCCESS_ALL_REQUIRED_TARGETS_2X_PASS'
              Path('build-logs/FA_MOCK3_QYM_2X_PASS.json').write_text(
                  json.dumps(final,indent=2),encoding='utf-8'
              )
          print(json.dumps(payload,indent=2))
          PY

      - name: Upload complete chain-cycle evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass387-self-chain-${{ github.sha }}-cycle-${{ steps.cycle.outputs.cycle }}
          path: |
            /tmp/pass387-*.log
            /tmp/pass387-*.json
            /tmp/pass384-declaration-agent
            /tmp/lean-repair-v377
            /tmp/pass378
            /tmp/pass385-race-supervisor
            build-logs/PASS387_*.json
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Commit accepted sources, state, and the next push trigger
        if: steps.already_done.outputs.done != 'true' && always()
        shell: bash
        env:
          CYCLE: ${{ steps.cycle.outputs.cycle }}
        run: |
          set -euo pipefail
          mkdir -p build-logs
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]]; then
            rm -f build-logs/PASS387_TRIGGER.txt
          else
            printf 'cycle=%s\nprevious_run=%s\nnext_reason=continue_strict_priority_chain\n' \
              "${CYCLE}" "${GITHUB_RUN_ID}" > build-logs/PASS387_TRIGGER.txt
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean \
            PrimalitySheafVerification/QYM.lean \
            build-logs/PASS387_CHAIN_STATE.json
          while IFS= read -r file; do git add "${file}"; done < <(
            find PrimalitySheafVerification -maxdepth 1 -type f -name 'Mock3*.lean' \
              ! -iname '*backup*' ! -iname '*candidate*' ! -iname '*probe*' ! -iname '*tmp*' | sort
          )
          [[ -f build-logs/PASS387_PROMOTION.json ]] && git add build-logs/PASS387_PROMOTION.json
          [[ -f build-logs/FA_MOCK3_QYM_2X_PASS.json ]] && git add build-logs/FA_MOCK3_QYM_2X_PASS.json
          [[ -f build-logs/PASS387_TRIGGER.txt ]] && git add build-logs/PASS387_TRIGGER.txt
          if git ls-files --error-unmatch build-logs/PASS387_TRIGGER.txt >/dev/null 2>&1 && \
             [[ ! -f build-logs/PASS387_TRIGGER.txt ]]; then
            git rm build-logs/PASS387_TRIGGER.txt
          fi
          if git diff --cached --quiet; then
            echo 'No source, state, or trigger change.'
            exit 0
          fi
          if [[ -s build-logs/FA_MOCK3_QYM_2X_PASS.json ]]; then
            message='fix: record self-chained FA Integrated Mock3 QYM final PASS'
          else
            message="fix: continue PASS 387 priority chain cycle ${CYCLE}"
          fi
          git commit -m "${message}"
          git push origin HEAD:"${CHAIN_BRANCH}"

      - name: Enforce final success only when the marker exists
        if: steps.already_done.outputs.done != 'true' && always()
        shell: bash
        run: |
          test -s build-logs/FA_MOCK3_QYM_2X_PASS.json
          test -s build-logs/PASS387_PROMOTION.json
          grep -q '"pass": true' build-logs/PASS387_PROMOTION.json
