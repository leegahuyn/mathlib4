name: Mock2 Advanced sequential pass repair and materialize

on:
  pull_request:
    branches: [master]
    paths:
      - 'PrimalitySheafVerification/Mock2_Advanced.lean'
      - 'scripts/apply_*_pass_mock2_advanced_repairs.py'
      - '.github/workflows/mock2-advanced-pass316-pr-materialize-v4.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: mock2-advanced-sequential-pass-repair
  cancel-in-progress: true

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/mock2-advanced-sequential-pass

    steps:
      - name: Clone exact PR head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${HEAD_BRANCH}" = "${BRANCH}"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/source" "${EVIDENCE}/artifacts" "${OUTDIR}"
          cp "${TARGET}" "${EVIDENCE}/source/Mock2_Advanced-before.lean"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "head_sha=${HEAD_SHA}" \
            "advanced_start_sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Install exact Lean toolchain and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Compile direct source, then apply numbered passes when needed
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo 'stage,exit_code,error_count,warning_count,first_error,last_error' > "${EVIDENCE}/compile-summary.csv"

          compile_one() {
            local path="$1" stage="$2" module log code errors warnings first last
            module="$(basename "${path}" .lean)"
            log="${EVIDENCE}/logs/${stage}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "${path}" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            first="$(grep 'error:' "${log}" | head -1 | tr ',' ';' || true)"
            last="$(grep 'error:' "${log}" | tail -1 | tr ',' ';' || true)"
            printf '%s,%s,%s,%s,%s,%s\n' "${stage}" "${code}" "${errors}" "${warnings}" "${first}" "${last}" \
              >> "${EVIDENCE}/compile-summary.csv"
            echo "${code}" > "${EVIDENCE}/${stage}.exit-code.txt"
            if [[ "${code}" -eq 0 ]]; then
              test "${errors}" -eq 0
              test -s "${OUTDIR}/${module}.olean"
              test -s "${OUTDIR}/${module}.ilean"
              ! grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"
              return 0
            fi
            {
              echo "stage=${stage}"
              echo "exit_code=${code}"
              echo "error_count=${errors}"
              echo "maximum_errors=$(grep -Eci 'maximum number of errors' "${log}" || true)"
              echo 'first_ten_errors:'
              grep -n 'error:' "${log}" | head -10 || true
              echo 'last_error:'
              grep -n 'error:' "${log}" | tail -1 || true
            } | tee "${EVIDENCE}/logs/${stage}.summary.txt"
            return "${code}"
          }

          audit_source() {
            python3 - "$1" <<'PY'
          from pathlib import Path
          import re, sys
          path = Path(sys.argv[1])
          src = path.read_text(encoding='utf-8')
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-', i): depth += 1; out += [' ',' ']; i += 2
                  elif src.startswith('-/', i): depth -= 1; out += [' ',' ']; i += 2
                  else: out.append('\n' if src[i] == '\n' else ' '); i += 1
              elif string:
                  c=src[i]; out.append('\n' if c == '\n' else ' ')
                  if esc: esc=False
                  elif c == '\\': esc=True
                  elif c == '"': string=False
                  i += 1
              elif src.startswith('/-', i): depth=1; out += [' ',' ']; i += 2
              elif src.startswith('--', i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i += 1
              elif src[i] == '"': string=True; out.append(' '); i += 1
              else: out.append(src[i]); i += 1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*axiom\b',
              'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for name, pat in patterns.items():
              count=len(re.findall(pat,code)); print(f'{name}={count}'); bad |= count != 0
          if bad: raise SystemExit(1)
          PY
          }

          audit_source "${MOCK2}" | tee "${EVIDENCE}/Mock2-trust-audit.txt"
          compile_one "${MOCK2}" Mock2-regression

          if compile_one "${TARGET}" Advanced-direct-pass1 && compile_one "${TARGET}" Advanced-direct-pass2; then
            audit_source "${TARGET}" | tee "${EVIDENCE}/Mock2_Advanced-trust-audit.txt"
            echo 'materialize=false' >> "${GITHUB_OUTPUT}"
            echo 'checked-in Mock2_Advanced already passes directly' | tee "${EVIDENCE}/status.txt"
            exit 0
          fi

          git restore --source=HEAD --worktree -- "${TARGET}"
          scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
            apply_three_hundred_thirteenth_pass_mock2_advanced_repairs.py
            apply_three_hundred_fourteenth_pass_mock2_advanced_repairs.py
          )
          : > "${EVIDENCE}/logs/pass-application.log"
          for script in "${scripts[@]}"; do
            echo "===== ${script} =====" | tee -a "${EVIDENCE}/logs/pass-application.log"
            python3 "scripts/${script}" 2>&1 | tee -a "${EVIDENCE}/logs/pass-application.log"
          done

          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)
          test "$(git diff --name-only)" = "${TARGET}"
          git diff --check
          audit_source "${TARGET}" | tee "${EVIDENCE}/Mock2_Advanced-candidate-trust-audit.txt"
          cp "${TARGET}" "${EVIDENCE}/source/Mock2_Advanced-after-pass314.lean"

          compile_one "${MOCK2}" Mock2-regression-after-pass314
          compile_one "${TARGET}" Advanced-pass314-pass1
          compile_one "${TARGET}" Advanced-pass314-pass2

          sha256sum "${TARGET}" "${OUTDIR}/Mock2_Advanced.olean" "${OUTDIR}/Mock2_Advanced.ilean" \
            | tee "${EVIDENCE}/provenance-sha256.txt"
          cp "${OUTDIR}/Mock2_Advanced.olean" "${OUTDIR}/Mock2_Advanced.ilean" "${EVIDENCE}/artifacts/"
          echo 'materialize=true' >> "${GITHUB_OUTPUT}"
          echo 'pass314 candidate compiled twice and is ready for materialization' | tee "${EVIDENCE}/status.txt"

      - name: Materialize the twice-verified numbered-pass source
        if: steps.repair.outputs.materialize == 'true' && github.event_name == 'pull_request'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(git diff --name-only)" = "${TARGET}"
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          printf '%s\n' "trigger_head=${HEAD_SHA}" "remote_head=${remote_head}" | tee "${EVIDENCE}/materialization.txt"
          test "${remote_head}" = "${HEAD_SHA}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m 'fix: materialize Mock2 Advanced pass 314 verified source'
          git push origin "HEAD:${BRANCH}"

      - name: Upload numbered-pass evidence
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: mock2-advanced-sequential-pass-${{ env.HEAD_SHA }}
          path: /tmp/mock2-advanced-sequential-pass
          if-no-files-found: warn
          retention-days: 30
