name: Codex FA frontier 3029-3047 v4

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-3029-3047-v4.yml
      - scripts/fa_dynamic_cluster_3029_3047_v3.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-frontier-3029-3047-v4
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31524606686"
  BASE_HEAD_SHA: "003217a78494901ae4724167c1f0826a4c1138b1"
  BASE_WORKFLOW: ".github/workflows/codex-fa-frontier-2982-star-mul-v2.yml"
  BASE_FIRST_INDEX: "3029"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Await and attest exact idx3029 frontier
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v4; mkdir -p "$OUT" /tmp/fa3029v4
          for _ in $(seq 1 180); do
            gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/run.json"
            status="$(python3 - <<'PY'
          import json
          print(json.load(open('build-logs/codex-fa-frontier-3029-3047-v4/run.json')).get('status',''))
          PY
          )"
            [[ "$status" == completed ]] && break
            sleep 10
          done
          python3 - <<'PY'
          import json,os
          run=json.load(open('build-logs/codex-fa-frontier-3029-3047-v4/run.json'))
          if not (run.get('status')=='completed' and run.get('conclusion')=='failure' and run.get('head_sha')==os.environ['BASE_HEAD_SHA'] and run.get('path')==os.environ['BASE_WORKFLOW']): raise SystemExit('base run gate failed')
          PY
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/jobs?per_page=100" > "$OUT/jobs.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}/artifacts?per_page=100" > "$OUT/artifacts.json"
          python3 - <<'PY' > /tmp/fa3029v4.env
          import json
          out='build-logs/codex-fa-frontier-3029-3047-v4'; jobs=json.load(open(out+'/jobs.json')).get('jobs',[]); js=[j for j in jobs if j.get('name')=='frontier']
          if len(js)!=1: raise SystemExit('frontier job count drift')
          j=js[0]; steps={s.get('name'):s for s in j.get('steps',[])}
          if steps.get('Probe exact star algebra',{}).get('conclusion')!='success': raise SystemExit('star algebra probe did not pass')
          if steps.get('Direct full-source diagnostic compile',{}).get('conclusion')!='success': raise SystemExit('base direct compile did not execute')
          arts=json.load(open(out+'/artifacts.json')).get('artifacts',[]); xs=[a for a in arts if a.get('name','').startswith('codex-fa-frontier-2982-star-mul-v2-') and not a.get('expired')]
          if len(xs)!=1: raise SystemExit('base artifact count drift')
          a=xs[0]; print('AID='+str(a['id'])); print('ADIG='+a['digest'])
          PY
          source /tmp/fa3029v4.env
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${AID}/zip" > /tmp/base.zip
          test "sha256:$(sha256sum /tmp/base.zip | awk '{print $1}')" = "$ADIG"
          unzip -q /tmp/base.zip -d /tmp/fa3029v4
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          ms=list(Path('/tmp/fa3029v4').rglob('METRIC.json')); m=json.loads(ms[0].read_text())
          checks=[str(m.get('run_id'))==os.environ['BASE_RUN_ID'],m.get('head_sha')==os.environ['BASE_HEAD_SHA'],m.get('Mock2_exit')==0,m.get('Mock2_Advanced_exit')==0,m.get('FA_exit')==1,m.get('all_required_lean_executed') is True,str(m.get('FA_error_declaration_index'))==os.environ['BASE_FIRST_INDEX'],m.get('source_identity_locked_after_materialization') is True,m.get('public_declaration_headers_preserved') is True,m.get('declaration_sequence_preserved') is True]
          if not all(checks): raise SystemExit('base metric gate failed')
          sha=m['source_sha256']; size=m['source_bytes']; lines=m['source_lines']; hits=[]
          for p in Path('/tmp/fa3029v4').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==sha and len(b)==size and len(b.decode().splitlines())==lines and b'\r' not in b: hits.append(p)
          if not hits: raise SystemExit('exact base source missing')
          p=min(hits,key=lambda q:(len(q.parts),q.as_posix())); Path('build-logs/codex-fa-frontier-3029-3047-v4/BASE_SOURCE.txt').write_text(str(p.resolve())+'\n')
          PY
      - name: Apply strict graph and closure cluster
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v4
          python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$(cat "$OUT/BASE_SOURCE.txt")" --library scripts/fa_dynamic_cluster_3029_3047_v3.json --no-environment --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean --audit-out "$OUT/PREP.json"
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          a=json.loads(Path('build-logs/codex-fa-frontier-3029-3047-v4/PREP.json').read_text())
          if not (a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed']): raise SystemExit('semantic audit failed')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write(f"CANDIDATE_SHA={a['candidate_source_sha256']}\nCANDIDATE_BYTES={a['candidate_bytes']}\n")
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-3029-3047-v4
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1; lake exe cache get > "$OUT/cache.log" 2>&1; lean --version > "$OUT/lean-version.txt"; lake --version > "$OUT/lake-version.txt"
      - name: Direct full-source diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-3029-3047-v4; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          one(){ s=$1;c=$2;o=.lake/build/lib/lean/PrimalitySheafVerification/$s.olean;i=.lake/build/lib/lean/PrimalitySheafVerification/$s.ilean;rm -f "$o" "$i";:>"$OUT/$s.executed";set +e;lake env lean "-DmaxErrors=$c" -DwarningAsError=false -o "$o" -i "$i" "PrimalitySheafVerification/$s.lean" >"$OUT/$s.log" 2>&1;x=$?;set -e;echo $x>"$OUT/$s.exit";}
          one Mock2 3; one Mock2_Advanced 3; test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean|awk '{print $1}')" = "$CANDIDATE_SHA"; one Mock2_FunctionalAnalysis 128
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-3029-3047-v4');p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean');s=p.read_text();ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s));starts=[s.count('\n',0,m.start())+1 for m in ds];er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$');es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1));j=bisect_right(starts,ln)-1;es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')};first=es[0] if es else {};b=p.read_bytes();prep=json.loads((out/'PREP.json').read_text());m={'schema':'fa-frontier-3029-3047-v4','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ex),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'public_declaration_headers_preserved':prep['public_declaration_headers_preserved'],'declaration_sequence_preserved':prep['declaration_sequence_preserved']};(out/'METRIC.json').write_text(json.dumps(m,indent=2,sort_keys=True)+'\n');(out/'ERROR_HEADERS.json').write_text(json.dumps(es,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-3029-3047-v4-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-3029-3047-v4
          if-no-files-found: warn
          retention-days: 30
      - name: Preserve FA exit
        if: always()
        env: {FA_EXIT: "${{ steps.direct.outputs.fa_exit }}"}
        shell: bash
        run: test -n "${FA_EXIT:-}" || exit 86; exit "$FA_EXIT"
