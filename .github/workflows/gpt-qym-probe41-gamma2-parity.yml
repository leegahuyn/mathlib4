name: GPT QYM Probe41 Gamma(2) parity repair matrix

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe41-gamma2-parity.yml
      - .github/qym_probe41_gamma2.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-probe41-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe41:
    name: Probe41 ${{ matrix.variant }} full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant:
          - entry_norm_num
          - entry_subst
          - membership_norm_num
          - simp_all
    env:
      GH_TOKEN: ${{ github.token }}
      BRANCH: gpt/fa-qym-clean-final-20260816
      REPO: leegahuyn/mathlib4
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-probe41-${{ matrix.variant }}
      FALLBACK_ARTIFACT: '9309908159'

    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate checkout and pinned environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$RUNNER_TEMP/probe41-baselines"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f .github/qym_probe41_gamma2.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Recover newest Probe40 evidence plus verified 89-error fallback
        shell: bash
        run: |
          set -euo pipefail
          B="$RUNNER_TEMP/probe41-baselines"

          # Discover every completed Probe40 run at the current branch. Failure to find one is
          # harmless because the immutable Probe35 flat_infer artifact is always downloaded.
          gh api --method GET "repos/$REPO/actions/runs" \
            -f branch="$BRANCH" -F per_page=100 \
            --jq '[.workflow_runs[] | select(.status == "completed" and (.name | contains("Probe40")))] | sort_by(.created_at) | reverse | .[0:5] | .[].id' \
            > "$OUT/probe40-run-ids.txt" || true

          while read -r rid; do
            [[ -n "$rid" ]] || continue
            mkdir -p "$B/run-$rid"
            gh api --method GET "repos/$REPO/actions/runs/$rid/artifacts" -F per_page=100 \
              --jq '.artifacts[] | select(.expired == false) | [.id, .name] | @tsv' \
              > "$B/run-$rid/artifacts.tsv" || true
            while IFS=$'\t' read -r aid aname; do
              [[ -n "$aid" ]] || continue
              mkdir -p "$B/run-$rid/artifact-$aid"
              if gh api -H 'Accept: application/vnd.github+json' \
                  "repos/$REPO/actions/artifacts/$aid/zip" > "$B/run-$rid/artifact-$aid.zip"; then
                unzip -q -o "$B/run-$rid/artifact-$aid.zip" -d "$B/run-$rid/artifact-$aid" || true
              fi
            done < "$B/run-$rid/artifacts.tsv"
          done < "$OUT/probe40-run-ids.txt"

          mkdir -p "$B/fallback-35"
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/artifacts/$FALLBACK_ARTIFACT/zip" \
            > "$B/fallback-35.zip"
          unzip -q -o "$B/fallback-35.zip" -d "$B/fallback-35"

      - name: Select the strict direct-Lean baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/probe41-baselines" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, subprocess, sys

          root, out = Path(sys.argv[1]), Path(sys.argv[2])
          choices = []
          for rp in root.rglob('PROBE_RESULT.json'):
              try:
                  r = json.loads(rp.read_text(encoding='utf-8'))
              except Exception:
                  continue
              if r.get('panic_lines') not in (0, None):
                  continue
              errors = r.get('error_headers')
              if not isinstance(errors, int):
                  continue
              parent = rp.parent
              candidates = list(parent.glob('QYM.candidate*.lean'))
              if not candidates:
                  continue
              expected = r.get('candidate_qym_sha256') or r.get('candidate_sha256')
              for candidate in candidates:
                  raw = candidate.read_bytes()
                  sha = hashlib.sha256(raw).hexdigest()
                  if expected and sha != expected:
                      continue
                  blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
                  first = r.get('first_error') or {}
                  line = first.get('line') if isinstance(first, dict) else 0
                  choices.append({
                      'result': r,
                      'result_path': str(rp),
                      'candidate': str(candidate),
                      'sha256': sha,
                      'blob': blob,
                      'errors': errors,
                      'warnings': r.get('warning_headers', 10**9),
                      'first_line': line or 0,
                      'semantic_pass': bool(r.get('semantic_pass')),
                  })

          if not choices:
              raise SystemExit('no usable direct Lean baseline artifact')
          choices.sort(key=lambda x: (
              0 if x['semantic_pass'] else 1,
              x['errors'],
              -x['first_line'],
              x['warnings'],
          ))
          best = choices[0]
          if not best['semantic_pass'] and best['errors'] > 89:
              raise SystemExit(f"best recovered baseline regressed to {best['errors']} errors")

          shutil.copy2(best['candidate'], out / 'QYM.baseline.lean')
          (out / 'BASELINE_SELECTION.json').write_text(
              json.dumps({'best': best, 'all': choices}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"BASE_SHA={best['sha256']}\n")
              f.write(f"BASE_BLOB={best['blob']}\n")
              f.write(f"BASE_ERRORS={best['errors']}\n")
              f.write(f"BASE_WARNINGS={best['warnings']}\n")
          print(json.dumps(best, indent=2, sort_keys=True))
          PY
          test -s "$OUT/QYM.baseline.lean"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure dependency objects
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize deterministic Probe41 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.baseline.lean" "$QYM"
          python3 -B .github/qym_probe41_gamma2.py "${{ matrix.variant }}" "$QYM" \
            | tee "$OUT/PATCH_RESULT.json"
          python3 - "$OUT/PATCH_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CAND_SHA=' + r['candidate_sha256'] + '\n')
              f.write('CAND_BLOB=' + r['candidate_blob'] + '\n')
          PY
          cp "$QYM" "$OUT/QYM.candidate-probe41-${{ matrix.variant }}.lean"

      - name: Full direct Lean compile exact Probe41
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe41.olean" -i "$RUNNER_TEMP/QYM.probe41.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe41.olean" && test -s "$RUNNER_TEMP/QYM.probe41.ilean"
            cp "$RUNNER_TEMP/QYM.probe41.olean" "$OUT/QYM.probe41.olean"
            cp "$RUNNER_TEMP/QYM.probe41.ilean" "$OUT/QYM.probe41.ilean"
            sha256sum "$OUT/QYM.probe41.olean" "$OUT/QYM.probe41.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          cp "$OUT/QYM.canonical.lean" "$QYM"
          exit 0

      - name: Summarize exact diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, os, re, sys

          out = Path(sys.argv[1])
          raw = (out / 'QYM.log').read_bytes() if (out / 'QYM.log').exists() else b''
          text = raw.decode(errors='replace')
          pat = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M)
          rows = []
          for m in pat.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [r for r in rows if r['severity'] == 'error']
          warnings = [r for r in rows if r['severity'] == 'warning']
          panics = re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          rc = int((out / 'QYM.exit').read_text().strip()) if (out / 'QYM.exit').exists() else None
          result = {
              'schema': 'qym-probe41-gamma2-v1',
              'github_sha': os.environ.get('GITHUB_SHA'),
              'variant': '${{ matrix.variant }}',
              'baseline_qym_sha256': os.environ.get('BASE_SHA'),
              'baseline_error_headers': int(os.environ.get('BASE_ERRORS', '999999')),
              'candidate_qym_sha256': os.environ.get('CAND_SHA'),
              'candidate_qym_blob': os.environ.get('CAND_BLOB'),
              'exit': rc,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in errors).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': rc == 0 and not errors and not panics,
          }
          (out / 'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(r, sort_keys=True) + '\n' for r in rows), encoding='utf-8')
          (out / 'QYM.error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r['code'] else ''}: {r['message']}\n" for r in errors), encoding='utf-8')
          (out / 'QYM.panic-lines.txt').write_text(''.join(p + '\n' for p in panics), encoding='utf-8')
          (out / 'PROBE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$(sha256sum "$OUT/QYM.canonical.lean" | awk '{print $1}')"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable Probe41 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe41-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-probe41-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless direct Lean TRUE PASS
        if: always()
        shell: bash
        run: |
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          if not r['semantic_pass']:
              raise SystemExit(r['exit'] or 1)
          PY
