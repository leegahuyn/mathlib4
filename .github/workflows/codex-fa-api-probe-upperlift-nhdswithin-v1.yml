name: Codex FA API probe upperlift nhdsWithin

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-upperlift-nhdswithin-v1.yml]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Probe nhdsWithin upper-half-plane bridge
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeUpperLiftNhdsWithin.lean <<'LEAN'
          import Mathlib
          open Set Function Topology Filter
          open scoped UpperHalfPlane

          example (z : ℍ) : Filter.Tendsto UpperHalfPlane.ofComplex
              (nhdsWithin (z : ℂ) UpperHalfPlane.upperHalfPlaneSet) (nhds z) := by
            simpa only [UpperHalfPlane.ofComplex_apply_of_im_pos z.im_pos] using
              (UpperHalfPlane.ofComplex.continuousOn
                (x := (z : ℂ)) z.im_pos)

          example (z : ℍ) :
              (fun w : ℂ => w) =ᶠ[nhdsWithin (z : ℂ) UpperHalfPlane.upperHalfPlaneSet]
                (fun w : ℂ => w) := by
            exact Filter.Eventually.of_forall fun _ => rfl
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeUpperLiftNhdsWithin.lean | tee /tmp/upperlift-nhdswithin.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-upperlift-nhdswithin-${{ github.sha }}
          path: /tmp/upperlift-nhdswithin.log
          if-no-files-found: warn
          retention-days: 7
