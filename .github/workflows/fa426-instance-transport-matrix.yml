name: FA426 parallel direct-CLI instance-transport matrix

on:
  push:
    branches:
      - candidate/fa426-instance-transport-matrix-20260810
    paths:
      - '.github/workflows/fa426-instance-transport-matrix.yml'
      - 'scripts/fa426_apply_instance_variant.py'
      - 'build-logs/fa426-instance-matrix/REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa426-instance-transport-matrix
  cancel-in-progress: false

jobs:
  direct-screen:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        variant:
          - reducible_simpa
          - reducible_convert
          - group_eq_reducible
          - group_eq_symm_reducible
          - unfold_instances
          - canonical_only_reducible_simpa

    steps:
      - name: Checkout immutable 31726 baseline plus matrix controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: candidate/fa426-instance-transport-matrix-20260810
          fetch-depth: 0
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee /tmp/lean-version.txt
          lake --version | tee /tmp/lake-version.txt
          lake exe cache get | tee /tmp/cache-get.log

      - name: Apply one proof-body-only candidate
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          python3 scripts/fa426_apply_instance_variant.py "$VARIANT" | tee /tmp/apply.log

      - name: Directly compile prerequisites and FA candidate
        id: compile
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa426-instance-matrix/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          cp /tmp/lean-version.txt "$d/lean-version.txt"
          cp /tmp/lake-version.txt "$d/lake-version.txt"
          cp /tmp/cache-get.log "$d/cache-get.log"
          cp /tmp/apply.log "$d/apply.log"
          cp PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d/candidate.lean"

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then
              return 0
            fi
            return 1
          }

          compile_one Mock2 20; rc_m2=$?
          compile_one Mock2_Advanced 20; rc_m2a=$?
          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 20; rc_fa=$?
          else
            printf 'blocked by prerequisite regression\n' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa" VARIANT

          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re, subprocess, sys
          sys.path.insert(0, str(Path('scripts').resolve()))
          import fa422_canonical_decl_tournament as engine

          variant=os.environ['VARIANT']
          d=Path('build-logs/fa426-instance-matrix')/variant
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          candidate=src.read_text(encoding='utf-8')
          baseline=subprocess.check_output(
              ['git','show','HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'],
              text=True,
          )
          baseline_sha=hashlib.sha256(baseline.encode()).hexdigest()
          candidate_sha=hashlib.sha256(candidate.encode()).hexdigest()
          pat=re.compile(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          log=(d/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace')
          matches=list(pat.finditer(log))
          first=int(matches[0].group(1)) if matches else None
          col=int(matches[0].group(2)) if matches else None
          rc_m2=int(os.environ['RC_M2']); rc_m2a=int(os.environ['RC_M2A']); rc_fa=int(os.environ['RC_FA'])
          candidate_index=engine.decl_index_at(candidate, first)
          baseline_index=2658
          prereq_ok=rc_m2==0 and rc_m2a==0
          passed=rc_fa==0
          strictly_better=passed or (
              isinstance(first,int) and first>31726 and isinstance(candidate_index,int) and
              (candidate_index>baseline_index or (
                  candidate_index==baseline_index and
                  len(candidate.splitlines())==len(baseline.splitlines())
              ))
          )
          statement_unchanged=engine.manifest(candidate)==engine.manifest(baseline)
          imports_unchanged=engine.core.imports(candidate)==engine.core.imports(baseline)
          forbidden=engine.core.forbidden_hits(candidate)
          authorized=(
              baseline_sha=='71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0'
              and prereq_ok and strictly_better and statement_unchanged and imports_unchanged
              and not any(forbidden.values())
          )
          status={
              'classification':'VERIFIED' if authorized else 'CANDIDATE_REJECTED',
              'variant':variant,
              'baseline_sha256':baseline_sha,
              'candidate_sha256':candidate_sha,
              'baseline_line_count':len(baseline.splitlines()),
              'candidate_line_count':len(candidate.splitlines()),
              'Mock2_exit':rc_m2,
              'Mock2_Advanced_exit':rc_m2a,
              'FA_exit':rc_fa,
              'FA_error_headers_captured':len(matches),
              'FA_first_actual_error_line':first,
              'FA_first_actual_error_col':col,
              'FA_error_declaration_index':candidate_index,
              'baseline_declaration_index':baseline_index,
              'maxErrors_cap':20,
              'strictly_better':strictly_better,
              'authorized_for_materialization':authorized,
              'statement_manifest_unchanged':statement_unchanged,
              'imports_unchanged':imports_unchanged,
              'forbidden_token_audit':forbidden,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          (d/'CURRENT.txt').write_text('\n'.join(f'{k}={v}' for k,v in status.items())+'\n',encoding='utf-8')
          (d/('AUTHORIZED' if authorized else 'REJECTED')).touch()
          print(json.dumps(status,indent=2))
          with Path(os.environ['GITHUB_OUTPUT']).open('a',encoding='utf-8') as out:
              out.write(f"authorized={'true' if authorized else 'false'}\n")
              out.write(f"first_error={first}\n")
              out.write(f"candidate_sha={candidate_sha}\n")
          PY
          exit 0

      - name: Upload candidate source and complete direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa426-${{ matrix.variant }}-${{ github.run_id }}
          path: build-logs/fa426-instance-matrix/${{ matrix.variant }}
          if-no-files-found: error
          retention-days: 90

      - name: Enforce strict improvement for this matrix entry
        if: always()
        env:
          AUTHORIZED: ${{ steps.compile.outputs.authorized }}
        shell: bash
        run: |
          test "${AUTHORIZED:-false}" = true
