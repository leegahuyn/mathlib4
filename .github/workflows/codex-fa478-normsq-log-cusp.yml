name: Codex FA478 close declaration 2794 only

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260810
    paths:
      - .github/workflows/codex-fa478-normsq-log-cusp.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa478-normsq-log-cusp
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        repair_variant:
          - real_norm_eq_abs_only
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: minimal_simpa
      FA476_R3_EVIDENCE_RUN_ID: "31407777360"
      FA476_R3_EVIDENCE_ARTIFACT_ID: "9070636218"
      FA476_R3_EVIDENCE_ARTIFACT_DIGEST: "sha256:343607e51bea29fd2878bf6ebfcc0c1c8b1daf9826733b0cd3729e63fbbea3ca"
      FA477_VARIANT: upper_ext_h_simp_only
      FA477_EVIDENCE_RUN_ID: "31409787172"
      FA477_EVIDENCE_JOB_ID: "93524786715"
      FA477_EVIDENCE_HEAD_SHA: "faf902ceda7cce10ada4399326330effaa4d669b"
      FA477_EVIDENCE_ARTIFACT_ID: "9071387258"
      FA477_EVIDENCE_ARTIFACT_NAME: codex-fa477-minimal_simpa-run31407777360-artifact9070636218-upper_ext_h_simp_only
      FA477_EVIDENCE_ARTIFACT_SIZE: "598253"
      FA477_EVIDENCE_ARTIFACT_DIGEST: "sha256:25928120f3113f98886a469b255eec59754bfd232b4df621f4efa4e1e9940b81"
      FA478_VARIANT: ${{ matrix.repair_variant }}
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Require exact completed FA477 declaration-2793 evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ "$FA477_EVIDENCE_RUN_ID" != "31409787172" ]]; then
            echo "FA478 requires exact FA477 run 31409787172" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_JOB_ID" != "93524786715" ]]; then
            echo "FA478 requires exact FA477 job 93524786715" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_HEAD_SHA" != "faf902ceda7cce10ada4399326330effaa4d669b" ]]; then
            echo "FA478 requires the exact FA477 head SHA" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_ARTIFACT_ID" != "9071387258" ]]; then
            echo "FA478 requires exact FA477 artifact 9071387258" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_ARTIFACT_NAME" != "codex-fa477-minimal_simpa-run31407777360-artifact9070636218-upper_ext_h_simp_only" ]]; then
            echo "FA478 requires the exact FA477 artifact name" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_ARTIFACT_SIZE" != "598253" ]]; then
            echo "FA478 requires exact FA477 artifact size 598253" >&2
            exit 2
          fi
          if [[ "$FA477_EVIDENCE_ARTIFACT_DIGEST" != "sha256:25928120f3113f98886a469b255eec59754bfd232b4df621f4efa4e1e9940b81" ]]; then
            echo "FA478 requires the exact FA477 artifact digest" >&2
            exit 2
          fi
          RUN_ATTESTATION="${RUNNER_TEMP}/fa477-run-${FA477_EVIDENCE_RUN_ID}.json"
          JOB_ATTESTATION="${RUNNER_TEMP}/fa477-job-${FA477_EVIDENCE_JOB_ID}.json"
          ARTIFACT_ATTESTATION="${RUNNER_TEMP}/fa477-artifact-${FA477_EVIDENCE_ARTIFACT_ID}.json"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/runs/${FA477_EVIDENCE_RUN_ID}" \
            > "$RUN_ATTESTATION"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/jobs/${FA477_EVIDENCE_JOB_ID}" \
            > "$JOB_ATTESTATION"
          gh api \
            "repos/${GITHUB_REPOSITORY}/actions/artifacts/${FA477_EVIDENCE_ARTIFACT_ID}" \
            > "$ARTIFACT_ATTESTATION"
          python3 - \
            "$RUN_ATTESTATION" \
            "$JOB_ATTESTATION" \
            "$ARTIFACT_ATTESTATION" \
            "$FA477_EVIDENCE_RUN_ID" \
            "$FA477_EVIDENCE_JOB_ID" \
            "$FA477_EVIDENCE_HEAD_SHA" \
            "$FA477_EVIDENCE_ARTIFACT_ID" \
            "$FA477_EVIDENCE_ARTIFACT_NAME" \
            "$FA477_EVIDENCE_ARTIFACT_SIZE" \
            "$FA477_EVIDENCE_ARTIFACT_DIGEST" \
            "$GITHUB_REPOSITORY" <<'PY'
          import json
          import sys

          run_path, job_path, artifact_path = sys.argv[1:4]
          expected_run_text, expected_job_text, expected_head = sys.argv[4:7]
          expected_artifact_text, expected_artifact_name = sys.argv[7:9]
          expected_size_text, expected_digest, expected_repository = sys.argv[9:12]
          with open(run_path, encoding="utf-8") as stream:
              run = json.load(stream)
          with open(job_path, encoding="utf-8") as stream:
              job = json.load(stream)
          with open(artifact_path, encoding="utf-8") as stream:
              artifact = json.load(stream)

          expected_run = int(expected_run_text)
          expected_job = int(expected_job_text)
          expected_artifact = int(expected_artifact_text)
          expected_size = int(expected_size_text)
          expected_path = ".github/workflows/codex-fa477-log-cusp.yml"
          actual_path = run.get("path")
          path_exact = (
              actual_path == expected_path
              or (
                  isinstance(actual_path, str)
                  and actual_path.startswith(expected_path + "@")
              )
          )
          run_checks = {
              "run_id_exact": run.get("id") == expected_run,
              "completed": run.get("status") == "completed",
              "successful": run.get("conclusion") == "success",
              "workflow_name_exact": run.get("name")
                  == "Codex FA477 close declaration 2793 only",
              "workflow_path_exact": path_exact,
              "head_branch_exact": run.get("head_branch")
                  == "codex/fa-qym-cleanbuild-final-20260810",
              "head_sha_exact": run.get("head_sha") == expected_head,
              "repository_exact": run.get("repository", {}).get("full_name")
                  == expected_repository,
          }
          job_checks = {
              "job_id_exact": job.get("id") == expected_job,
              "job_run_id_exact": job.get("run_id") == expected_run,
              "job_head_sha_exact": job.get("head_sha") == expected_head,
              "job_completed": job.get("status") == "completed",
              "job_successful": job.get("conclusion") == "success",
          }
          artifact_run = artifact.get("workflow_run", {})
          artifact_checks = {
              "artifact_id_exact": artifact.get("id") == expected_artifact,
              "artifact_name_exact": artifact.get("name")
                  == expected_artifact_name,
              "artifact_size_exact": artifact.get("size_in_bytes")
                  == expected_size,
              "artifact_digest_exact": artifact.get("digest")
                  == expected_digest,
              "artifact_not_expired": artifact.get("expired") is False,
              "artifact_run_id_exact": artifact_run.get("id") == expected_run,
              "artifact_head_branch_exact": artifact_run.get("head_branch")
                  == "codex/fa-qym-cleanbuild-final-20260810",
              "artifact_head_sha_exact": artifact_run.get("head_sha")
                  == expected_head,
              "artifact_head_sha_matches_run": artifact_run.get("head_sha")
                  == run.get("head_sha"),
          }
          accepted = (
              all(run_checks.values())
              and all(job_checks.values())
              and all(artifact_checks.values())
          )
          print(json.dumps({
              "required_prior_run": expected_run,
              "required_job": expected_job,
              "required_head_sha": expected_head,
              "required_artifact": expected_artifact,
              "required_artifact_name": expected_artifact_name,
              "required_artifact_size": expected_size,
              "required_artifact_digest": expected_digest,
              "run_checks": run_checks,
              "job_checks": job_checks,
              "artifact_checks": artifact_checks,
              "idx2793_closure_accepted": accepted,
          }, indent=2, ensure_ascii=False))
          if not accepted:
              raise SystemExit(
                  "FA478 requires run 31409787172 and its exact artifact to "
                  "prove the FA477 declaration-2793 frontier gate"
              )
          PY
      - name: Generate declaration-2794-only candidate and directly compile
        run: bash scripts/fa478_normsq_log_cusp_candidate_ci.sh
      - name: Print strict frontier evidence
        if: always()
        run: |
          OUT="build-logs/codex-fa478-normsq-log-cusp/candidates/norms"
          if test -f "$OUT/Mock2_FunctionalAnalysis.log"; then
            grep -nE '^PrimalitySheafVerification/Mock2_FunctionalAnalysis\.lean:[0-9]+:[0-9]+: error' "$OUT/Mock2_FunctionalAnalysis.log" || true
          fi
          if test -f "$OUT/METRIC.json"; then
            python3 -m json.tool "$OUT/METRIC.json"
          fi
      - name: Upload exact candidate, direct evidence, and upstream attestation
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa478-run${{ env.FA477_EVIDENCE_RUN_ID }}-artifact${{ env.FA477_EVIDENCE_ARTIFACT_ID }}-${{ matrix.repair_variant }}
          path: |
            build-logs/codex-fa478-normsq-log-cusp/candidates/norms
            ${{ runner.temp }}/fa477-run-31409787172.json
            ${{ runner.temp }}/fa477-job-93524786715.json
            ${{ runner.temp }}/fa477-artifact-${{ env.FA477_EVIDENCE_ARTIFACT_ID }}.json
          if-no-files-found: error
          retention-days: 90
      - name: Require exact declaration-2794 frontier advancement evidence
        if: always()
        run: |
          python3 - \
            "build-logs/codex-fa478-normsq-log-cusp/candidates/norms/METRIC.json" \
            "build-logs/codex-fa478-normsq-log-cusp/candidates/norms/CANDIDATE.json" \
            "${FA478_VARIANT}" \
            "${RUNNER_TEMP}/fa477-run-${FA477_EVIDENCE_RUN_ID}.json" \
            "${RUNNER_TEMP}/fa477-job-${FA477_EVIDENCE_JOB_ID}.json" \
            "${RUNNER_TEMP}/fa477-artifact-${FA477_EVIDENCE_ARTIFACT_ID}.json" \
            "${FA477_EVIDENCE_RUN_ID}" \
            "${FA477_EVIDENCE_JOB_ID}" \
            "${FA477_EVIDENCE_HEAD_SHA}" \
            "${FA477_EVIDENCE_ARTIFACT_ID}" \
            "${FA477_EVIDENCE_ARTIFACT_NAME}" \
            "${FA477_EVIDENCE_ARTIFACT_SIZE}" \
            "${FA477_EVIDENCE_ARTIFACT_DIGEST}" \
            "${GITHUB_REPOSITORY}" <<'PY'
          import hashlib
          import json
          import sys

          metric_path, candidate_path, variant = sys.argv[1:4]
          run_path, job_path, artifact_path = sys.argv[4:7]
          expected_run_text, expected_job_text, expected_head = sys.argv[7:10]
          expected_artifact_text, expected_artifact_name = sys.argv[10:12]
          expected_size_text, expected_digest, expected_repository = sys.argv[12:15]
          with open(metric_path, encoding="utf-8") as stream:
              metric = json.load(stream)
          with open(candidate_path, encoding="utf-8") as stream:
              candidate = json.load(stream)
          with open(run_path, encoding="utf-8") as stream:
              upstream = json.load(stream)
          with open(job_path, encoding="utf-8") as stream:
              upstream_job = json.load(stream)
          with open(artifact_path, encoding="utf-8") as stream:
              upstream_artifact = json.load(stream)
          print(json.dumps(metric, indent=2, ensure_ascii=False))
          print(json.dumps(candidate, indent=2, ensure_ascii=False))

          expected_run = int(expected_run_text)
          expected_job = int(expected_job_text)
          expected_artifact = int(expected_artifact_text)
          expected_size = int(expected_size_text)
          expected_r3 = (
              "5d96377b3b4895f7f48a847105ae1f077677c794df6bc6b9fa1cd81a1f6e3ad0"
          )
          expected_fa477 = (
              "1436e87661def2f8a70bd5c864bbe1a037474ba7df9e6d6222294c507394bcab"
          )
          expected_candidate = (
              "53a703d3e138ae7a964b7221c52337082cb59820595cfce877a679f024fbcf82"
          )
          expected_decl_sequence = (
              "a9f15910d7e589feb18eac7d42370c5bfa07233a188d32554f5711a8e3446a5b"
          )
          expected_lexical_sequence = (
              "c997317cd459891eea590671da4aa9941e5c083cbd5dffe91ee96601b12cc4f2"
          )
          expected_workflow_path = ".github/workflows/codex-fa477-log-cusp.yml"
          upstream_path = upstream.get("path")
          upstream_checks = {
              "run_id_exact": upstream.get("id") == expected_run,
              "completed": upstream.get("status") == "completed",
              "successful": upstream.get("conclusion") == "success",
              "workflow_name_exact": upstream.get("name")
                  == "Codex FA477 close declaration 2793 only",
              "workflow_path_exact": (
                  upstream_path == expected_workflow_path
                  or (
                      isinstance(upstream_path, str)
                      and upstream_path.startswith(expected_workflow_path + "@")
                  )
              ),
              "head_branch_exact": upstream.get("head_branch")
                  == "codex/fa-qym-cleanbuild-final-20260810",
              "head_sha_exact": upstream.get("head_sha") == expected_head,
              "repository_exact": upstream.get("repository", {}).get("full_name")
                  == expected_repository,
          }
          upstream_job_checks = {
              "job_id_exact": upstream_job.get("id") == expected_job,
              "job_run_id_exact": upstream_job.get("run_id") == expected_run,
              "job_head_sha_exact": upstream_job.get("head_sha")
                  == expected_head,
              "job_completed": upstream_job.get("status") == "completed",
              "job_successful": upstream_job.get("conclusion") == "success",
          }
          artifact_run = upstream_artifact.get("workflow_run", {})
          upstream_artifact_checks = {
              "artifact_id_exact": upstream_artifact.get("id")
                  == expected_artifact,
              "artifact_name_exact": upstream_artifact.get("name")
                  == expected_artifact_name,
              "artifact_size_exact": upstream_artifact.get("size_in_bytes")
                  == expected_size,
              "artifact_digest_exact": upstream_artifact.get("digest")
                  == expected_digest,
              "artifact_not_expired": upstream_artifact.get("expired") is False,
              "artifact_run_id_exact": artifact_run.get("id") == expected_run,
              "artifact_head_branch_exact": artifact_run.get("head_branch")
                  == "codex/fa-qym-cleanbuild-final-20260810",
              "artifact_head_sha_exact": artifact_run.get("head_sha")
                  == expected_head,
              "artifact_head_sha_matches_run": artifact_run.get("head_sha")
                  == upstream.get("head_sha"),
          }
          upstream_ok = (
              all(upstream_checks.values())
              and all(upstream_job_checks.values())
              and all(upstream_artifact_checks.values())
          )

          forbidden = metric.get("candidate_forbidden_counts", {})
          expected_forbidden = {
              "sorry": 0,
              "admit": 0,
              "new_global_axiom": 0,
              "unsafe": 0,
              "native_decide": 0,
              "Lean.ofReduceBool": 0,
          }
          expected_commands = {
              "Mock2": (
                  "lake env lean -DmaxErrors=3 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean "
                  "PrimalitySheafVerification/Mock2.lean"
              ),
              "Mock2_Advanced": (
                  "lake env lean -DmaxErrors=3 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean "
                  "PrimalitySheafVerification/Mock2_Advanced.lean"
              ),
              "Mock2_FunctionalAnalysis": (
                  "lake env lean -DmaxErrors=32 -DwarningAsError=false "
                  "-o .lake/build/lib/lean/PrimalitySheafVerification/"
                  "Mock2_FunctionalAnalysis.olean "
                  "-i .lake/build/lib/lean/PrimalitySheafVerification/"
                  "Mock2_FunctionalAnalysis.ilean "
                  "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean"
              ),
          }
          identity_exact = (
              candidate.get("candidate_sha256") == expected_candidate
              and candidate.get("candidate_sha256") == metric.get("source_sha256")
              and candidate.get("candidate_sha256")
                  == metric.get("candidate_metadata_sha256")
              and candidate.get("declaration_sequence_sha256")
                  == expected_decl_sequence
              and candidate.get("declaration_sequence_sha256")
                  == metric.get("declaration_sequence_sha256")
              and candidate.get("declaration_count") == 4397
              and candidate.get("declaration_count")
                  == metric.get("declaration_count")
              and candidate.get("target_header_sha256")
                  == metric.get("target_header_sha256")
              and candidate.get("line_count") == 60535
              and metric.get("line_count") == 60535
              and metric.get("required_line_count") == 60535
          )
          manifest_exact = (
              metric.get("lake_manifest_sha256")
                  == "672474eb93bc14c66cd1ff45203c451987fe525f7b5d13ecd83140be46434b26"
              and metric.get("lean_toolchain") == "leanprover/lean4:v4.33.0-rc1"
              and metric.get("source_path")
                  == "PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean"
              and metric.get("authority") == "direct Lean CLI on repository source path"
              and metric.get("header_authority")
                  == "declaration proposition/type through := only"
              and metric.get("exact_compile_commands") == expected_commands
          )

          repairs = candidate.get("repairs", [])
          r3_repairs = [
              row for row in repairs
              if row.get("declaration")
                  == "norm_deriv_selectedLogHeightNaturalGauge_le_graph"
              and row.get("declaration_index") == 2792
              and row.get("matrix_variant") == "minimal_simpa"
          ]
          r3_audit = len(r3_repairs) == 1 and (
              r3_repairs[0].get("fa476_r2_variant") == "explicit_exp_nonneg"
              and r3_repairs[0].get("candidate_source_sha256") == expected_r3
              and r3_repairs[0].get("replacement_count") == 1
              and r3_repairs[0].get("target_header_preserved") is True
              and r3_repairs[0].get("source_prefix_preserved") is True
              and r3_repairs[0].get("source_suffix_preserved") is True
              and r3_repairs[0].get("declaration_sequence_preserved") is True
              and r3_repairs[0].get("later_repair_count") == 0
          )

          fa477_repairs = [
              row for row in repairs
              if row.get("declaration")
                  == "selectedCosetUnitaryPullback_log_cuspLevel"
              and row.get("declaration_index") == 2793
              and row.get("matrix_variant") == "upper_ext_h_simp_only"
          ]
          fa477_audit = len(fa477_repairs) == 1 and (
              fa477_repairs[0].get("fa476_r3_variant") == "minimal_simpa"
              and fa477_repairs[0].get("required_upstream_evidence_run_id")
                  == 31407777360
              and fa477_repairs[0].get("required_upstream_evidence_artifact_id")
                  == 9070636218
              and fa477_repairs[0].get(
                  "required_upstream_evidence_artifact_digest"
              ) == (
                  "sha256:343607e51bea29fd2878bf6ebfcc0c1c8b1daf9826733b0cd3729e63fbbea3ca"
