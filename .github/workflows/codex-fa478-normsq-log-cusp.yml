              and target_repairs[0].get("candidate_source_bytes") == 2697540
              and target_repairs[0].get("required_line_count") == 60535
              and target_repairs[0].get("replacement_count") == 1
              and target_repairs[0].get("replacement_audit")
                  == expected_replacement_audit
              and target_repairs[0].get("target_header_sha256")
