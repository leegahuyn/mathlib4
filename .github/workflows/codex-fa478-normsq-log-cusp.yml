              and fa477_repairs[0].get("fa476_r3_intermediate_source_sha256")
                  == expected_r3
              and fa477_repairs[0].get("candidate_source_sha256")
                  == expected_fa477
              and fa477_repairs[0].get("replacement_count") == 2
              and fa477_repairs[0].get("target_header_preserved") is True
              and fa477_repairs[0].get("source_prefix_preserved") is True
              and fa477_repairs[0].get("source_suffix_preserved") is True
              and fa477_repairs[0].get("declaration_sequence_preserved") is True
