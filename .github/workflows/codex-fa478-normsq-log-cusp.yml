              and target_repairs[0].get("required_upstream_evidence_job_id")
                  == expected_job
              and target_repairs[0].get("required_upstream_evidence_head_sha")
                  == expected_head
              and target_repairs[0].get("required_upstream_evidence_artifact_id")
                  == expected_artifact
              and target_repairs[0].get(
                  "required_upstream_evidence_artifact_name"
              ) == expected_artifact_name
              and target_repairs[0].get(
                  "required_upstream_evidence_artifact_size"
              ) == expected_size
              and target_repairs[0].get(
                  "required_upstream_evidence_artifact_digest"
              ) == expected_digest
              and target_repairs[0].get("upstream_idx2793_closure_must_precede")
