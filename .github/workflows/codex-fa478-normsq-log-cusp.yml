          ]
          fa477_matrix_audit = len(fa477_matrix) == 1 and (
              fa477_matrix[0].get("strategy") == "upper_ext_h_simp_only"
              and fa477_matrix[0].get("target_declaration_index") == 2793
              and fa477_matrix[0].get("later_repair_count") == 0
          )

          target_repairs = [
              row for row in repairs
              if row.get("declaration")
                  == "normSq_selectedLogHeightNaturalGauge_at_log_cuspLevel"
              and row.get("declaration_index") == 2794
          ]
          old_fragment = (
              "  rw [norm_mul, Complex.norm_real,\n"
              "    abs_of_pos (Real.exp_pos _), mul_pow, hExp]"
          )
          new_fragment = (
              "  rw [norm_mul, Complex.norm_real, Real.norm_eq_abs,\n"
              "    abs_of_pos (Real.exp_pos _), mul_pow, hExp]"
          )
          expected_replacement_audit = [{
              "old_count_before": 1,
              "old_global_count_before": 1,
              "new_count_before": 0,
              "new_global_count_before": 0,
              "old_sha256": hashlib.sha256(old_fragment.encode()).hexdigest(),
              "new_sha256": hashlib.sha256(new_fragment.encode()).hexdigest(),
              "old_bytes": len(old_fragment.encode()),
              "new_bytes": len(new_fragment.encode()),
          }]
          target_audit = len(target_repairs) == 1 and (
              target_repairs[0].get("matrix_variant") == variant
              and target_repairs[0].get("fa477_variant")
