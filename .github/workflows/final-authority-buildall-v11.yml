name: Final Authority BuildAll Object Layout V11

"on":
  pull_request:
    branches:
      - gpt/final-authority-gb0-canonical-20260820
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: final-authority-buildall-v11-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  reproduce-repair-rebuild-clean-twice:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.head_ref == 'gpt/final-authority-batch-v7-20260820' &&
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact repair-branch source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record and enforce protected mathematical identities
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .final_authority_v11
          {
            echo "HEAD=$(git rev-parse HEAD)"
            echo "BRANCH=${{ github.head_ref }}"
            echo "FA_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)"
            echo "INTEGRATED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)"
            echo "QYM_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)"
            echo "QYM_SHA256=$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          } | tee .final_authority_v11/INITIAL_SOURCE_IDENTITY.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = \
            "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = \
            "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = \
            "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = \
            "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"

      - name: Validate hardened controller before installing Lean
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile scripts/final_authority_gate_v11.py
          git diff --check

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .final_authority_v11/LEAN_VERSION.txt
          lake --version | tee .final_authority_v11/LAKE_VERSION.txt

      - name: Remove all inherited project compiler objects
        shell: bash
        run: |
          set -euo pipefail
          find PrimalitySheafVerification -type f \
            \( -name '*.olean' -o -name '*.ilean' \) -delete
          rm -rf .lake/build/lib/lean/PrimalitySheafVerification
          rm -rf .lake/build/ir/PrimalitySheafVerification
          rm -rf .final_authority
          mkdir -p .final_authority

      - name: Initial complete authority build with old object layout
        id: initial
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-batch-v7-20260820
          FINAL_AUTHORITY_OBJECT_LAYOUT: "0"
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          python3 scripts/final_authority_gate_v11.py \
            2>&1 | tee .final_authority_v11/INITIAL_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v11/INITIAL_AUTHORITY_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"
          rm -rf .final_authority_v11/initial_evidence
          cp -a .final_authority .final_authority_v11/initial_evidence

      - name: Verify initial full surface before applying one batch repair
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          root = Path('.final_authority_v11/initial_evidence')
          final13_path = root / 'FINAL_13_BUILD_RESULTS.json'
          buildall_path = root / 'BUILDALL_RESULT.json'
          if not final13_path.exists() or not buildall_path.exists():
              raise SystemExit('initial authority evidence is incomplete')
          final13 = json.loads(final13_path.read_text())
          buildall = json.loads(buildall_path.read_text())
          expected13 = {'PASS': 13, 'FAIL': 0, 'SKIPPED': 0, 'NOT_RUN': 0}
          if final13.get('counts') != expected13 or final13.get('pass') is not True:
              raise SystemExit(f'initial Final13 is not 13/13: {final13.get("counts")}')

          if buildall.get('pass') is True:
              Path('.final_authority_v11/INITIAL_ALREADY_FINAL.txt').write_text('true\n')
              result = {
                  'final13': expected13,
                  'buildall': 'PASS before repair',
                  'repair_required': False,
                  'pass': True,
              }
          else:
              rows = buildall.get('results', [])
              errors = sum(int(row.get('error_headers', 0)) for row in rows)
              surface_parts = [json.dumps(buildall, ensure_ascii=False)]
              for path in root.rglob('*'):
                  if path.is_file() and path.suffix.lower() in {'.json', '.log', '.txt'}:
                      try:
                          surface_parts.append(path.read_text(errors='replace'))
                      except OSError:
                          pass
              surface = '\n'.join(surface_parts)
              Path('.final_authority_v11/INITIAL_BUILDALL_SURFACE.txt').write_text(surface)
              folded = surface.lower()
              if errors != 1:
                  raise SystemExit(f'expected exactly one BuildAll error, found {errors}')
              if 'unknown module prefix' not in folded:
                  raise SystemExit('sole BuildAll error is not an unknown-module-prefix error')
              if 'primalitysheafverification' not in folded:
                  raise SystemExit('unknown module prefix is not PrimalitySheafVerification')
              result = {
                  'final13': expected13,
                  'buildall_errors': errors,
                  'classification': 'project object output is outside lake env Lean import path',
                  'repair_required': True,
                  'pass': True,
              }
          Path('.final_authority_v11/INITIAL_BLOCKER_CLASSIFICATION.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          PY

      - name: Delete every project object before repaired full rebuild
        if: steps.initial.outputs.exit_code != '0'
        shell: bash
        run: |
          set -euo pipefail
          find PrimalitySheafVerification -type f \
            \( -name '*.olean' -o -name '*.ilean' \) -delete
          rm -rf .lake/build/lib/lean/PrimalitySheafVerification
          rm -rf .lake/build/ir/PrimalitySheafVerification
          rm -rf .final_authority
          mkdir -p .final_authority

      - name: Full authority rebuild with lake-layout project objects
        id: final
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-batch-v7-20260820
          FINAL_AUTHORITY_OBJECT_LAYOUT: "1"
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          if [ "${{ steps.initial.outputs.exit_code }}" = "0" ]; then
            cp -a .final_authority_v11/initial_evidence/. .final_authority/
            echo "0" | tee .final_authority_v11/FINAL_AUTHORITY_EXIT.txt
            echo "exit_code=0" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          set +e
          python3 scripts/final_authority_gate_v11.py \
            2>&1 | tee .final_authority_v11/FINAL_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v11/FINAL_AUTHORITY_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Enforce every remaining final gate
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path

          evidence = Path('.final_authority')
          exit_path = Path('.final_authority_v11/FINAL_AUTHORITY_EXIT.txt')
          if not exit_path.exists() or exit_path.read_text().strip() != '0':
              raise SystemExit('final authority controller did not exit 0')

          names = [
              'FINAL_13_BUILD_RESULTS.json',
              'BUILDALL_RESULT.json',
              'CLEAN_BUILD_1_RESULT.json',
              'CLEAN_BUILD_2_RESULT.json',
              'FORBIDDEN_AUDIT.json',
              'FINAL_SOURCE_IDENTITY.json',
              'FINAL_15_CHECKLIST_RESULT.json',
          ]
          data = {}
          for name in names:
              path = evidence / name
              if not path.exists():
                  raise SystemExit(f'missing final evidence: {name}')
              data[name] = json.loads(path.read_text())

          expected13 = {'PASS': 13, 'FAIL': 0, 'SKIPPED': 0, 'NOT_RUN': 0}
          if data['FINAL_13_BUILD_RESULTS.json'].get('counts') != expected13:
              raise SystemExit('Final13 is not 13/13')
          if data['FINAL_13_BUILD_RESULTS.json'].get('pass') is not True:
              raise SystemExit('Final13 pass flag is false')
          for name in [
              'BUILDALL_RESULT.json',
              'CLEAN_BUILD_1_RESULT.json',
              'CLEAN_BUILD_2_RESULT.json',
              'FINAL_SOURCE_IDENTITY.json',
          ]:
              if data[name].get('pass') is not True:
                  raise SystemExit(f'{name} is not PASS')

          forbidden = data['FORBIDDEN_AUDIT.json']
          if forbidden.get('pass') is not True or forbidden.get('forbidden_count') != 0:
              raise SystemExit(
                  f'forbidden audit failed: count={forbidden.get("forbidden_count")}'
              )
          expected15 = {'PASS': 15, 'FAIL': 0, 'NOT_RUN': 0, 'SKIPPED': 0}
          checklist = data['FINAL_15_CHECKLIST_RESULT.json']
          if checklist.get('pass') is not True or checklist.get('counts') != expected15:
              raise SystemExit(f'checklist is not 15/15: {checklist.get("counts")}')

          protected = data['FINAL_SOURCE_IDENTITY.json'].get('protected', {})
          if protected.get('pass') is not True:
              raise SystemExit('protected source identities changed')

          result = {
              'Final13': expected13,
              'BuildAll_errors': 0,
              'BuildAll': 'PASS',
              'clean_1': 'PASS',
              'clean_2': 'PASS',
              'forbidden': 0,
              'source_identity': 'PASS',
              'checklist': expected15,
              'FINAL_AUTHORITY': 'TRUE PASS',
          }
          Path('.final_authority_v11/FINAL_ENFORCEMENT.json').write_text(
              json.dumps(result, indent=2) + '\n'
          )
          PY

      - name: Surface exact initial and final state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== INITIAL BLOCKER CLASSIFICATION ==="
          cat .final_authority_v11/INITIAL_BLOCKER_CLASSIFICATION.json 2>/dev/null || true
          echo "=== FINAL ENFORCEMENT ==="
          cat .final_authority_v11/FINAL_ENFORCEMENT.json 2>/dev/null || true
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          for file in \
            FINAL_13_BUILD_RESULTS.json \
            BUILDALL_RESULT.json \
            CLEAN_BUILD_1_RESULT.json \
            CLEAN_BUILD_2_RESULT.json \
            FORBIDDEN_AUDIT.json \
            FINAL_SOURCE_IDENTITY.json \
            FINAL_15_CHECKLIST_RESULT.json
          do
            echo "=== $file ==="
            cat ".final_authority/$file" 2>/dev/null || true
          done

      - name: Upload initial and final actual-Lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-buildall-v11-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            .final_authority_v11
          include-hidden-files: true
          if-no-files-found: error
          retention-days: 30
          compression-level: 6

      - name: Enforce FINAL AUTHORITY after evidence upload
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f .final_authority_v11/FINAL_ENFORCEMENT.json
          grep -q '"FINAL_AUTHORITY": "TRUE PASS"' \
            .final_authority_v11/FINAL_ENFORCEMENT.json
