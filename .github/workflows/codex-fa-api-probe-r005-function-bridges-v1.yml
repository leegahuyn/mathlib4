name: Codex FA API probe R005 function bridges v1
on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths: [.github/workflows/codex-fa-api-probe-r005-function-bridges-v1.yml]
  workflow_dispatch:
permissions: {contents: read}
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with: {ref: "${{ github.sha }}", fetch-depth: 1, persist-credentials: false}
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Prove function representation bridges
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/ProbeR005Bridges.lean <<'LEAN'
          import Mathlib
          example (f g : ℂ → ℂ) : (fun s : ℂ => f s * g s) = f * g := by rfl
          example (w : ℂ) : (fun y : ℂ => w - y) = (fun _ : ℂ => w) - id := by
            funext y
            rfl
          example (f : ℂ → ℝ) : (fun x : ℂ => (f x : ℂ)) = Complex.ofRealCLM ∘ f := by
            funext x
            rfl
          example (f g : ℂ → ℂ) (t xi : ℂ) :
              (fderiv ℝ (fun s : ℂ => f s * g s) t) xi =
                (fderiv ℝ (f * g) t) xi := by
            congr 2
          LEAN
          lake env lean -DwarningAsError=false /tmp/ProbeR005Bridges.lean | tee /tmp/probe.log
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-api-probe-r005-function-bridges-v1-${{ github.sha }}
          path: /tmp/probe.log
          retention-days: 7
