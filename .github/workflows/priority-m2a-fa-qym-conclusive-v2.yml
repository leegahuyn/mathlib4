name: Conclusive Mock2 Advanced FunctionalAnalysis QYM repair v2

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/priority-m2a-fa-qym-conclusive-v2.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: conclusive-m2a-fa-qym-v2
  cancel-in-progress: false

jobs:
  repair-and-fresh-direct:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      GITHUB_TOKEN: ${{ github.token }}
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      LOGDIR: /tmp/conclusive-m2a-fa-qym-v2
      RESULT: build-logs/conclusive-m2a-fa-qym-v2-result.txt
      RESULT_COPY: /tmp/conclusive-m2a-fa-qym-v2-result.txt

    steps:
      - name: Clone latest branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git checkout -B "${BRANCH}" FETCH_HEAD
          mkdir -p "${OUTDIR}" "${LOGDIR}/repair" "${LOGDIR}/direct"
          printf '%s\n' \
            "initial_head=$(git rev-parse HEAD)" \
            "utc_started=$(date -u +%FT%TZ)" \
            > "${LOGDIR}/snapshot.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          "${HOME}/.elan/bin/lean" --version | tee "${LOGDIR}/lean-version.txt"
          "${HOME}/.elan/bin/lake" --version | tee "${LOGDIR}/lake-version.txt"
          "${HOME}/.elan/bin/lake" exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Run atomic source repair and candidate verification
        id: repair
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/priority_m2a_fa_qym_atomic.sh \
            >"${LOGDIR}/repair/stdout.log" 2>"${LOGDIR}/repair/stderr.log"
          code=$?
          set -e
          echo "code=${code}" >> "${GITHUB_OUTPUT}"
          echo "repair_exit=${code}" >> "${LOGDIR}/snapshot.txt"
          if [[ "${code}" -ne 0 ]]; then
            tail -400 "${LOGDIR}/repair/stdout.log" || true
            tail -400 "${LOGDIR}/repair/stderr.log" || true
          fi

      - name: Fetch the materialized source head afresh
        if: steps.repair.outputs.code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          git clean -fd
          git diff --exit-code
          printf '%s\n' \
            "verified_source_head=$(git rev-parse HEAD)" \
            "utc_fresh_checkout=$(date -u +%FT%TZ)" \
            >> "${LOGDIR}/snapshot.txt"
          rm -rf "${OUTDIR}"
          mkdir -p "${OUTDIR}" "${LOGDIR}/direct"

      - name: Compile checked-in sources twice without runtime repair
        id: direct
        if: steps.repair.outputs.code == '0'
        shell: bash
        run: |
          set -uo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          modules=(Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated QYM)
          summary="${LOGDIR}/direct/summary.csv"
          echo 'module,pass,exit_code,error_count,warning_count' > "${summary}"
          overall=0
          failed_module=''
          failed_pass=''
          for pass in 1 2; do
            for module in "${modules[@]}"; do
              log="${LOGDIR}/direct/${module}-pass${pass}.log"
              rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
                "${OUTDIR}/${module}.olean.private"
              lake env lean "PrimalitySheafVerification/${module}.lean" \
                -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
                >"${log}" 2>&1
              code=$?
              errors="$(grep -c 'error:' "${log}" || true)"
              warnings="$(grep -c 'warning:' "${log}" || true)"
              printf '%s,%s,%s,%s,%s\n' \
                "${module}" "${pass}" "${code}" "${errors}" "${warnings}" \
                | tee -a "${summary}"
              bad_log=0
              grep -Eqi \
                "maximum number of errors|missing object file|declaration uses 'sorry'|sorryAx|PANIC|segmentation fault|stack overflow" \
                "${log}" && bad_log=1
              if [[ "${code}" -ne 0 || "${errors}" -ne 0 || "${bad_log}" -ne 0 || \
                    ! -s "${OUTDIR}/${module}.olean" || ! -s "${OUTDIR}/${module}.ilean" ]]; then
                overall=1
                failed_module="${module}"
                failed_pass="${pass}"
                {
                  echo "FAILED: ${module} pass ${pass}"
                  echo "exit_code=${code}"
                  echo "error_count=${errors}"
                  grep -n 'error:' "${log}" | head -60 || true
                  grep -n 'error:' "${log}" | tail -1 || true
                  tail -400 "${log}" || true
                } > "${LOGDIR}/direct/failure.txt"
                cat "${LOGDIR}/direct/failure.txt"
                break 2
              fi
              echo "PASS: ${module} pass ${pass}"
            done
          done
          echo "overall=${overall}" >> "${GITHUB_OUTPUT}"
          echo "failed_module=${failed_module}" >> "${GITHUB_OUTPUT}"
          echo "failed_pass=${failed_pass}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Preserve the complete result outside the worktree
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          repair_code='${{ steps.repair.outputs.code }}'
          direct_code='${{ steps.direct.outputs.overall }}'
          failed_module='${{ steps.direct.outputs.failed_module }}'
          failed_pass='${{ steps.direct.outputs.failed_pass }}'
          [[ -n "${repair_code}" ]] || repair_code='not-run'
          [[ -n "${direct_code}" ]] || direct_code='not-run'
          verified_head="$(grep '^verified_source_head=' "${LOGDIR}/snapshot.txt" | tail -1 | cut -d= -f2- || true)"
          {
            echo "utc=$(date -u +%FT%TZ)"
            echo "verified_source_head=${verified_head}"
            echo "repair_exit=${repair_code}"
            echo "runtime_repair_during_final_direct=0"
            echo "direct_overall=${direct_code}"
            echo "failed_module=${failed_module}"
            echo "failed_pass=${failed_pass}"
            if [[ -f "${LOGDIR}/direct/summary.csv" ]]; then
              cat "${LOGDIR}/direct/summary.csv"
            fi
            if [[ -f "${LOGDIR}/direct/failure.txt" ]]; then
              echo '--- first direct failure ---'
              cat "${LOGDIR}/direct/failure.txt"
            elif [[ "${repair_code}" != '0' ]]; then
              echo '--- atomic repair failure stdout tail ---'
              tail -350 "${LOGDIR}/repair/stdout.log" || true
              echo '--- atomic repair failure stderr tail ---'
              tail -350 "${LOGDIR}/repair/stderr.log" || true
            else
              echo 'Mock2_Advanced=PASS'
              echo 'Mock2_FunctionalAnalysis=PASS'
              echo 'Mock2_FunctionalAnalysis_Integrated=PASS'
              echo 'QYM=PASS'
            fi
          } > "${RESULT_COPY}"
          cat "${RESULT_COPY}"

      - name: Commit complete conclusive result
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git fetch --depth=50 origin "refs/heads/${BRANCH}"
          git reset --hard FETCH_HEAD
          mkdir -p "$(dirname "${RESULT}")"
          cp "${RESULT_COPY}" "${RESULT}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${RESULT}"
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record complete conclusive Advanced FA QYM result'
            for attempt in 1 2 3; do
              remote="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
              parent="$(git rev-parse HEAD^)"
              if [[ "${remote}" = "${parent}" ]]; then
                git push origin "HEAD:${BRANCH}"
                break
              fi
              git fetch --depth=50 origin "refs/heads/${BRANCH}"
              git rebase FETCH_HEAD
              if [[ "${attempt}" -eq 3 ]]; then
                git push origin "HEAD:${BRANCH}"
              fi
            done
          fi

      - name: Enforce successful repair and fresh direct verification
        shell: bash
        run: |
          set -euo pipefail
          test '${{ steps.repair.outputs.code }}' = '0'
          test '${{ steps.direct.outputs.overall }}' = '0'
