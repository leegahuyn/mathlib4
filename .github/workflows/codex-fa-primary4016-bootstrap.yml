# Materialize only reviewed, hash-locked exploration infrastructure.
name: Codex FA primary4016 materialize reproducer

on:
  push:
    branches:
      - codex/fa-primary4016-reproducer-20260816
    paths:
      - .github/workflows/codex-fa-primary4016-bootstrap.yml
      - scripts/payloads/fa_primary4016_reproducer.py.gz.b64
      - scripts/payloads/codex-fa-primary4016-reproducer.yml.gz.b64
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: codex-fa-primary4016-bootstrap
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out exact exploration branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-primary4016-reproducer-20260816
          fetch-depth: 1
          persist-credentials: true

      - name: Materialize reviewed reproducer and direct funnel
        run: |
          set -euo pipefail
          base64 -d scripts/payloads/fa_primary4016_reproducer.py.gz.b64 | gzip -dc > scripts/fa_primary4016_reproducer.py
          base64 -d scripts/payloads/codex-fa-primary4016-reproducer.yml.gz.b64 | gzip -dc > .github/workflows/codex-fa-primary4016-reproducer.yml
          chmod +x scripts/fa_primary4016_reproducer.py
          python3 -m py_compile scripts/fa_primary4016_reproducer.py
          test "$(sha256sum scripts/fa_primary4016_reproducer.py | awk '{print $1}')" = "60b25dbf25a28b814249b1ff6ccc5ae1365441908c31810f37e93cffc675fc0b"
          test "$(sha256sum .github/workflows/codex-fa-primary4016-reproducer.yml | awk '{print $1}')" = "0ec49484d94dfe6e1a7677616a7ae9074a392584e8750fbecd0773695e619fb1"

      - name: Commit materialized exploration infrastructure
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add scripts/fa_primary4016_reproducer.py .github/workflows/codex-fa-primary4016-reproducer.yml
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Codex: materialize primary4016 reproducer and direct funnel'
          git push origin HEAD:codex/fa-primary4016-reproducer-20260816
