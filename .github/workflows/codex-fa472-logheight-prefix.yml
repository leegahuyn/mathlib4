name: Codex FA472 direct log-height prefix

on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260810
    paths:
      - .github/workflows/codex-fa472-logheight-prefix.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: codex-fa472-logheight-prefix
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      matrix:
        variant: [prefix11, prefix14, continuous14]
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      PREFIX_VARIANT: ${{ matrix.variant }}
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "160"
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Generate prefix candidate and directly compile
        run: bash scripts/fa472_candidate_ci.sh
      - name: Print captured Lean error headers
        if: always()
        run: |
          OUT="build-logs/codex-fa472-logheight-prefix/candidates/norms"
          if test -f "$OUT/Mock2_FunctionalAnalysis.log"; then
            grep -nE '^PrimalitySheafVerification/Mock2_FunctionalAnalysis\.lean:[0-9]+:[0-9]+: error' "$OUT/Mock2_FunctionalAnalysis.log" || true
          fi
      - name: Upload exact candidate and direct evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa472-${{ matrix.variant }}
          path: build-logs/codex-fa472-logheight-prefix/candidates/norms
          if-no-files-found: error
          retention-days: 90
      - name: Require an actual direct full-source Lean pass
        if: always()
        run: |
          python3 - "build-logs/codex-fa472-logheight-prefix/candidates/norms/METRIC.json" <<'PY'
          import json
          import sys
          metric = json.load(open(sys.argv[1], encoding="utf-8"))
          print(json.dumps(metric, indent=2, ensure_ascii=False))
          ok = (
              metric.get("classification") != "INFRA_FAILURE"
              and metric.get("all_required_lean_executed") is True
              and metric.get("source_metadata_identity") is True
              and metric.get("Mock2_exit") == 0
              and metric.get("Mock2_Advanced_exit") == 0
              and metric.get("FA_executed") is True
              and metric.get("FA_exit") == 0
              and metric.get("FA_error_headers_captured") == 0
              and metric.get("forbidden_clean") is True
          )
          if not ok:
              raise SystemExit("FA472 candidate is not a direct full-source Lean PASS")
          PY
