name: PASS 348 FunctionalAnalysis frontier Ubuntu

on:
  push:
    branches: [probe/fa348-frontier-20260808]
    paths:
      - '.github/workflows/pass348-frontier-ubuntu.yml'
      - 'scripts/diagnose_pass348_frontier.sh'
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: fa348-frontier-ubuntu
  cancel-in-progress: true

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - name: Checkout exact frontier head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 400
          persist-credentials: false

      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p /tmp/diagnose-pass348-fa/logs
          lean --version | tee /tmp/diagnose-pass348-fa/lean-version.txt
          lake --version | tee /tmp/diagnose-pass348-fa/lake-version.txt
          lake exe cache get 2>&1 | tee /tmp/diagnose-pass348-fa/logs/cache-get.log

      - name: Compile first PASS 348 frontier
        id: diagnostic
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass348_frontier.sh
          rc=$?
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 348 frontier
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass348-fa-frontier-${{ github.sha }}
          path: /tmp/diagnose-pass348-fa
          if-no-files-found: error
          retention-days: 90

      - name: Publish frontier summary
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          set -euo pipefail
          evidence='/tmp/diagnose-pass348-fa'
          {
            echo '## PASS 348 frontier'
            echo
            echo "- tested SHA: ${GITHUB_SHA}"
            echo "- exit code: ${DIAGNOSTIC_EXIT_CODE:-missing}"
            echo
            echo '```text'
            test -f "${evidence}/summary.txt" && cat "${evidence}/summary.txt" || true
            test -f "${evidence}/logs/failure-summary.txt" && head -260 "${evidence}/logs/failure-summary.txt" || true
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Enforce frontier result
        if: always()
        shell: bash
        env:
          DIAGNOSTIC_EXIT_CODE: ${{ steps.diagnostic.outputs.exit_code }}
        run: |
          test -n "${DIAGNOSTIC_EXIT_CODE:-}"
          exit "${DIAGNOSTIC_EXIT_CODE}"
