name: GPT QYM GB2 direct true-pass v1

on:
  push:
    branches:
      - gpt/qym-gb5-semantic-round4-matrix-20260820
    paths:
      - .github/qym-r4-matrix-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb2-direct-true-pass-v1
  cancel-in-progress: false

env:
  BRANCH: gpt/qym-gb5-semantic-round4-matrix-20260820
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
  OUT: /tmp/qym-gb2-direct

jobs:
  direct-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact verified authority
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OLEAN"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(git hash-object PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = 28f614d48e02a0f28d3f5a758e813350b3ea89cf
          test "$(git hash-object PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = 464f5dd095876b20165d12690c8127ef9d909e6a
          test "$(git hash-object "$QYM")" = ac1b09ba35a642a9d2edfe1037c1a677dc524eeb
          test "$(sha256sum "$QYM" | awk '{print $1}')" = c798cc256e41e19073cc57aef0723e213ef234e353dde65daf47790a91efcd7f
          python3 -m py_compile .github/qym_gb2_true_pass_patch.py
          git rev-parse HEAD | tee "$OUT/trigger-commit.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          ok=0
          for attempt in 1 2 3 4 5; do
            if lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1

      - name: Restore exact dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v5-${{ runner.os }}-
            qym-deps-v4-${{ runner.os }}-
            qym-deps-v3-${{ runner.os }}-

      - name: Ensure exact dependency chain is available
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              [[ "$source" = Mock2_FunctionalAnalysis* ]] && max_errors=2000
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Apply exact two-blocker patch
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/qym_gb2_true_pass_patch.py | tee "$OUT/candidate-sha256.txt"
          git hash-object "$QYM" | tee "$OUT/candidate-blob.txt"
          wc -l "$QYM" | tee "$OUT/candidate-lines.txt"
          cp "$QYM" "$OUT/QYM.candidate.lean"

      - name: Actual full-QYM direct Lean
        id: compile
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          rm -f "$OLEAN/QYM.olean" "$OLEAN/QYM.ilean"
          start="$(date +%s)"
          set +e
          lake env lean -DmaxErrors=2000 -DwarningAsError=false \
            -o "$OLEAN/QYM.olean" -i "$OLEAN/QYM.ilean" "$QYM" \
            > "$OUT/full.log" 2>&1
          lean_exit=$?
          set -e
          elapsed=$(( $(date +%s) - start ))
          errors="$(grep -Ec '^PrimalitySheafVerification/QYM\.lean:[0-9]+:[0-9]+: error:' "$OUT/full.log" || true)"
          warnings="$(grep -Ec '^PrimalitySheafVerification/QYM\.lean:[0-9]+:[0-9]+: warning:' "$OUT/full.log" || true)"
          panic="$(grep -Eic '(^|[^[:alpha:]])panic([^[:alpha:]]|$)' "$OUT/full.log" || true)"
          printf '%s\n' "$lean_exit" > "$OUT/exit.txt"
          printf '%s\n' "$errors" > "$OUT/error-headers.txt"
          printf '%s\n' "$warnings" > "$OUT/warning-headers.txt"
          printf '%s\n' "$panic" > "$OUT/panic-lines.txt"
          printf '%s\n' "$elapsed" > "$OUT/elapsed-seconds.txt"
          pass=false
          if [[ "$lean_exit" = 0 && "$errors" = 0 && "$panic" = 0 && -s "$OLEAN/QYM.olean" && -s "$OLEAN/QYM.ilean" ]]; then
            pass=true
          fi
          echo "exit=$lean_exit" >> "$GITHUB_OUTPUT"
          echo "errors=$errors" >> "$GITHUB_OUTPUT"
          echo "warnings=$warnings" >> "$GITHUB_OUTPUT"
          echo "panic=$panic" >> "$GITHUB_OUTPUT"
          echo "pass=$pass" >> "$GITHUB_OUTPUT"
          echo "exit=$lean_exit errors=$errors warnings=$warnings panic=$panic elapsed=$elapsed pass=$pass"
          exit 0

      - name: Audit forbidden escapes and write immutable result
        if: always()
        shell: bash
        env:
          LEAN_EXIT: ${{ steps.compile.outputs.exit }}
          ERRORS: ${{ steps.compile.outputs.errors }}
          WARNINGS: ${{ steps.compile.outputs.warnings }}
          PANIC: ${{ steps.compile.outputs.panic }}
          PASS: ${{ steps.compile.outputs.pass }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import hashlib, json, os, re, subprocess
          from pathlib import Path

          qym = Path('PrimalitySheafVerification/QYM.lean')
          out = Path('/tmp/qym-gb2-direct')
          text = qym.read_text(encoding='utf-8')
          cleaned = []
          i = 0
          depth = 0
          in_line = False
          in_string = False
          escape = False
          while i < len(text):
              c = text[i]
              n = text[i + 1] if i + 1 < len(text) else ''
              if in_line:
                  if c == '\n': in_line = False; cleaned.append('\n')
                  else: cleaned.append(' ')
                  i += 1; continue
              if depth:
                  if c == '/' and n == '-': depth += 1; cleaned.extend('  '); i += 2; continue
                  if c == '-' and n == '/': depth -= 1; cleaned.extend('  '); i += 2; continue
                  cleaned.append('\n' if c == '\n' else ' '); i += 1; continue
              if in_string:
                  cleaned.append('\n' if c == '\n' else ' ')
                  if escape: escape = False
                  elif c == '\\': escape = True
                  elif c == '"': in_string = False
                  i += 1; continue
              if c == '-' and n == '-': in_line = True; cleaned.extend('  '); i += 2; continue
              if c == '/' and n == '-': depth = 1; cleaned.extend('  '); i += 2; continue
              if c == '"': in_string = True; cleaned.append(' '); i += 1; continue
              cleaned.append(c); i += 1
          code = ''.join(cleaned)
          names = ['sorry', 'admit', 'axiom', 'unsafe', 'native_decide', 'Lean.ofReduceBool']
          counts = {name: len(re.findall(r'(?<![A-Za-z0-9_.])' + re.escape(name) + r'(?![A-Za-z0-9_])', code)) for name in names}
          counts['maxHeartbeats_zero'] = len(re.findall(r'set_option\s+maxHeartbeats\s+0\b', code))
          forbidden = sum(counts.values())
          (out / 'FORBIDDEN_AUDIT.json').write_text(json.dumps({'forbidden_zero': forbidden == 0, 'forbidden_count': forbidden, 'counts': counts, 'comment_depth': depth}, indent=2) + '\n')

          log_path = out / 'full.log'
          log = log_path.read_text(errors='replace') if log_path.exists() else ''
          m = re.search(r'^PrimalitySheafVerification/QYM\.lean:(\d+):(\d+): error: ([^\n]*)', log, re.M)
          result = {
              'schema': 'qym-gb2-direct-true-pass-v1',
              'authority': 'actual full-QYM direct Lean',
              'trigger_commit': subprocess.check_output(['git', 'rev-parse', 'HEAD'], text=True).strip(),
              'source_path': str(qym),
              'source_sha256': hashlib.sha256(qym.read_bytes()).hexdigest(),
              'source_blob': subprocess.check_output(['git', 'hash-object', str(qym)], text=True).strip(),
              'line_count': sum(1 for _ in qym.open(encoding='utf-8')),
              'lean_version': (out / 'lean-version.txt').read_text().strip() if (out / 'lean-version.txt').exists() else None,
              'lake_version': (out / 'lake-version.txt').read_text().strip() if (out / 'lake-version.txt').exists() else None,
              'command': 'lake env lean -DmaxErrors=2000 -DwarningAsError=false -o <QYM.olean> -i <QYM.ilean> PrimalitySheafVerification/QYM.lean',
              'exit': int(os.environ.get('LEAN_EXIT') or -1),
              'error_headers': int(os.environ.get('ERRORS') or -1),
              'warning_headers': int(os.environ.get('WARNINGS') or -1),
              'panic_lines': int(os.environ.get('PANIC') or -1),
              'forbidden': forbidden,
              'first_error': None if not m else {'line': int(m.group(1)), 'column': int(m.group(2)), 'message': m.group(3)},
              'pass': os.environ.get('PASS') == 'true' and forbidden == 0,
          }
          (out / 'RESULT.json').write_text(json.dumps(result, indent=2) + '\n')
          print(json.dumps(result, indent=2))
          PY

      - name: Upload actual-Lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb2-direct-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

      - name: Promote exact TRUE-PASS bytes
        if: ${{ steps.compile.outputs.pass == 'true' }}
        shell: bash
        run: |
          set -euo pipefail
          forbidden="$(python3 -c 'import json; print(json.load(open("'"$OUT"'/FORBIDDEN_AUDIT.json"))["forbidden_count"])')"
          test "$forbidden" = 0
          mkdir -p .github/qym-frontier/GB0_TRUE_PASS
          cp "$OUT/RESULT.json" .github/qym-frontier/GB0_TRUE_PASS/RESULT.json
          cp "$OUT/FORBIDDEN_AUDIT.json" .github/qym-frontier/GB0_TRUE_PASS/FORBIDDEN_AUDIT.json
          cp "$OUT/full.log" .github/qym-frontier/GB0_TRUE_PASS/full.log
          cp "$QYM" .github/qym-frontier/GB0_TRUE_PASS/QYM_TRUE_PASS.lean
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" .github/qym-frontier/GB0_TRUE_PASS
          git commit -m "QYM: actual direct-Lean TRUE PASS ${GITHUB_RUN_ID} [skip ci]"
          git push origin "HEAD:$BRANCH"

      - name: Enforce TRUE-PASS gate
        if: ${{ steps.compile.outputs.pass != 'true' }}
        shell: bash
        run: |
          echo "QYM remains nonzero: exit=${{ steps.compile.outputs.exit }} errors=${{ steps.compile.outputs.errors }} panic=${{ steps.compile.outputs.panic }}"
          exit 1
