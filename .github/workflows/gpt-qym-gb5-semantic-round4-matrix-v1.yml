name: GPT QYM GB5 semantic round 4 targeted matrix v1

on:
  push:
    branches:
      - gpt/qym-gb5-semantic-round4-matrix-20260820
    paths:
      - .github/qym-r4-matrix-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb5-semantic-round4-matrix-v1
  cancel-in-progress: true

env:
  BRANCH: gpt/qym-gb5-semantic-round4-matrix-20260820
  BASE: .github/qym-frontier/GB10_SEMANTIC_R2_V2/QYM_GB10_SEMANTIC_R2_V2.lean
  GENERATOR: .github/qym_r4_matrix_generate.py
  RUNNER: .github/qym_r4_matrix_runner.py
  SELECTOR: .github/qym_r4_matrix_select.py
  QYM: PrimalitySheafVerification/QYM.lean
  OLEAN: .lake/build/lib/lean/PrimalitySheafVerification

jobs:
  candidates:
    name: candidate-${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    strategy:
      fail-fast: false
      max-parallel: 8
      matrix:
        variant:
          - direct-manual
          - direct-cast
          - simpa-manual
          - simpa-simp
          - tolp-manual
          - tolp-cast
          - convert-manual
          - convert-change
    env:
      VARIANT: ${{ matrix.variant }}
      OUT: /tmp/qym-r4-${{ matrix.variant }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Gate exact authority and scripts
        shell: bash
        run: |
          set -euo pipefail
          rm -rf "$OUT"
          mkdir -p "$OUT" "$OLEAN"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test "$(sha256sum "$BASE" | awk '{print $1}')" = 231efe9a0b8f9d05aae5e65ff3904b3636182ef6f1c93c11eac0c05313730998
          test "$(git hash-object "$QYM")" = 8d01818c98a3f40f3665cb9fdad252ff514be7c4
          python3 -m py_compile "$GENERATOR" "$RUNNER" "$SELECTOR"
          git rev-parse HEAD | tee "$OUT/trigger-sha.txt"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          ok=0
          for attempt in 1 2 3 4 5; do
            if elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          ok=0
          for attempt in 1 2 3 4 5; do
            if lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1; then ok=1; break; fi
            sleep $((attempt * 5))
          done
          test "$ok" = 1

      - name: Restore verified QYM dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v5-${{ runner.os }}-
            qym-deps-v4-${{ runner.os }}-
            qym-deps-v3-${{ runner.os }}-

      - name: Ensure exact dependency chain by actual Lean
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              [[ "$source" = Mock2_FunctionalAnalysis* ]] && max_errors=2000
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Generate and direct-compile targeted candidate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          python3 -B "$RUNNER" "$VARIANT" "$GENERATOR" "$BASE" "$QYM" "$OUT" "$OLEAN"
          test -s "$OUT/RESULT.json"
          test -s "$OUT/QYM.candidate.lean"

      - name: Upload immutable candidate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-r4-${{ matrix.variant }}-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: error
          retention-days: 30

  select:
    name: select-and-persist-global-best
    needs: candidates
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      DOWNLOAD: /tmp/qym-r4-download
      SELECTED: /tmp/qym-r4-selected
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Download all eight candidate artifacts
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qym-r4-*-${{ github.run_id }}
          path: ${{ env.DOWNLOAD }}
          merge-multiple: false

      - name: Select actual direct-Lean global best
        shell: bash
        run: |
          set -euo pipefail
          python3 -m py_compile "$SELECTOR"
          python3 -B "$SELECTOR" "$DOWNLOAD" "$SELECTED"
          test -s "$SELECTED/SELECTOR_RESULT.json"
          test -s "$SELECTED/QYM.best.lean"

      - name: Upload selector evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-r4-selector-${{ github.run_id }}
          path: ${{ env.SELECTED }}
          if-no-files-found: error
          retention-days: 30

      - name: Persist matrix evidence and promote only strict improvement
        shell: bash
        run: |
          set -euo pipefail
          dest=.github/qym-frontier/R4_MATRIX_LATEST
          rm -rf "$dest"
          mkdir -p "$dest"
          cp -a "$SELECTED/." "$dest/"
          promote="$(python3 -c 'import json; print(str(json.load(open("'"$SELECTED"'/SELECTOR_RESULT.json"))["promote"]).lower())')"
          if [[ "$promote" = true ]]; then
            cp "$SELECTED/QYM.best.lean" "$QYM"
            mkdir -p .github/qym-frontier/GLOBAL_BEST_R4
            cp "$SELECTED/QYM.best.lean" .github/qym-frontier/GLOBAL_BEST_R4/QYM_GLOBAL_BEST_R4.lean
            cp "$SELECTED/SELECTOR_RESULT.json" .github/qym-frontier/GLOBAL_BEST_R4/RESULT.json
            cp "$SELECTED/best.full.log" .github/qym-frontier/GLOBAL_BEST_R4/full.log
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$dest" "$QYM"
          if [[ -d .github/qym-frontier/GLOBAL_BEST_R4 ]]; then
            git add .github/qym-frontier/GLOBAL_BEST_R4
          fi
          git commit -m "QYM R4 targeted matrix result ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin "$BRANCH"
            if git rebase "origin/$BRANCH" && git push origin "HEAD:$BRANCH"; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
