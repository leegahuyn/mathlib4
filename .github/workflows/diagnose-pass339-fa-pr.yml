name: Diagnose PASS 339 FunctionalAnalysis on PR

# Historical PASS 339 evidence; manual reruns only.
on:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: diagnose-pass339-fa-pr
  cancel-in-progress: true

jobs:
  diagnose-pass339:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      EVIDENCE: /tmp/diagnose-pass339-fa
    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 220
          persist-credentials: false

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p "${EVIDENCE}/logs"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Reconstruct and compile PASS 339 FA
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass339_fa.sh

      - name: Upload PASS 339 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: diagnose-pass339-fa-pr-${{ github.sha }}
          path: /tmp/diagnose-pass339-fa
          if-no-files-found: error
          retention-days: 90
