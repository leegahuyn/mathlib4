name: FA427 actualEdge same-height parallel direct Lean matrix

on:
  push:
    branches:
      - fix/fa427-actualedge-parallel-matrix-20260810
    paths:
      - scripts/fa427_prepare_actualedge_candidate.py
      - .github/workflows/fa427-actualedge-parallel-matrix.yml
      - build-logs/fa427-actualedge-matrix/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: fa427-actualedge-parallel-matrix
  cancel-in-progress: false

jobs:
  candidate:
    strategy:
      fail-fast: false
      max-parallel: 12
      matrix:
        variant:
          - baseline
          - body-remove
          - body-normed
          - body-complex
          - pre-normed-body-remove
          - pre-normed-body-normed
          - pre-normed-body-alias
          - pre-complex-body-remove
          - pre-normed-remove-exact
          - pre-normed-remove-simpa
          - pre-normed-remove-convert
          - no-pre-remove-simpa
    runs-on: ubuntu-24.04
    timeout-minutes: 160
    env:
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      VARIANT: ${{ matrix.variant }}
    steps:
      - name: Checkout exact FA427 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa427-actualedge-parallel-matrix-20260810
          fetch-depth: 1800
          persist-credentials: false

      - name: Recover PASS423 source and create same-height candidate
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa427-actualedge-matrix/candidates/${VARIANT}"
          rm -rf "$d"
          mkdir -p "$d"
          python3 scripts/fa427_prepare_actualedge_candidate.py \
            --variant "$VARIANT" --output-dir "$d" \
            | tee "$d/prepare.log"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          d="build-logs/fa427-actualedge-matrix/candidates/${VARIANT}"
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "$d/lean-version.txt"
          lake --version | tee "$d/lake-version.txt"
          lake exe cache get | tee "$d/cache-get.log"

      - name: Directly compile Mock2 Mock2 Advanced and candidate FA
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d="build-logs/fa427-actualedge-matrix/candidates/${VARIANT}"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false \
              -o "$o" -i "$i" "$src" > "$d/${stem}.log" 2>&1
            rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$o" && test -s "$i"; then return 0; fi
            return 1
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis; fa=$?
          else
            printf 'FA blocked by prerequisite regression\n' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          export M2="$m2" M2A="$m2a" FA="$fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re

          variant=os.environ['VARIANT']
          d=Path(f'build-logs/fa427-actualedge-matrix/candidates/{variant}')
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          data=src.read_bytes(); text=data.decode('utf-8')
          sha=hashlib.sha256(data).hexdigest()
          line_count=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          fa_log=(d/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace')
          pat=re.compile(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:')
          matches=list(pat.finditer(fa_log))
          first=int(matches[0].group(1)) if matches else 0
          col=int(matches[0].group(2)) if matches else 0
          decl='<none>'
          if first:
              lines=text.splitlines()
              decl_re=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s(:]+)')
              for i in range(min(first-1,len(lines)-1),-1,-1):
                  m=decl_re.match(lines[i])
                  if m: decl=m.group(1); break
          candidate=json.loads((d/'CANDIDATE.json').read_text())
          m2=int(os.environ['M2']); m2a=int(os.environ['M2A']); fa=int(os.environ['FA'])
          metric={
              'classification':'VERIFIED',
              'authority':'direct Lean CLI',
              'variant':variant,
              'source_sha256':sha,
              'candidate_metadata_sha256':candidate['candidate_sha256'],
              'source_metadata_identity':sha==candidate['candidate_sha256'],
              'line_count':line_count,
              'target_header_sha256':candidate['target_header_sha256'],
              'Mock2_exit':m2,
              'Mock2_errors':len(re.findall(r'Mock2\.lean:\d+:\d+:\s+(?:error(?:\([^)]*\))?:',(d/'Mock2.log').read_text(errors='replace'))),
              'Mock2_Advanced_exit':m2a,
              'Mock2_Advanced_errors':len(re.findall(r'Mock2_Advanced\.lean:\d+:\d+:\s+(?:error(?:\([^)]*\))?:',(d/'Mock2_Advanced.log').read_text(errors='replace'))),
              'FA_exit':fa,
              'FA_error_headers_under_cap':len(matches),
              'FA_first_error_line':first,
              'FA_first_error_col':col,
              'FA_first_error_declaration':decl,
              'maxErrors_cap':1,
              'maxErrors_interpretation':'cap only; not total error count or progress',
          }
          (d/'METRIC.json').write_text(json.dumps(metric,indent=2)+'\n',encoding='utf-8')
          (d/'METRIC.txt').write_text('\n'.join(f'{k}={v}' for k,v in metric.items())+'\n',encoding='utf-8')
          print(json.dumps(metric,indent=2))
          PY
          exit 0

      - name: Upload complete candidate source and direct metric
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa427-candidate-${{ matrix.variant }}
          path: build-logs/fa427-actualedge-matrix/candidates/${{ matrix.variant }}
          if-no-files-found: warn
          retention-days: 90

  select-persist-and-gate:
    needs: candidate
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 280
    env:
      ACTIVE_BRANCH: fix/fa427-actualedge-parallel-matrix-20260810
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      BASELINE_SHA: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      BASELINE_FRONTIER: '31726'
    steps:
      - name: Checkout exact FA427 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa427-actualedge-parallel-matrix-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Download every current-run candidate artifact
        shell: bash
        run: |
          set -euo pipefail
          root=build-logs/fa427-actualedge-matrix/collected
          rm -rf "$root"
          mkdir -p "$root"
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts?per_page=100" \
            > /tmp/fa427-artifacts.json
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, zipfile
          raw=Path('/tmp/fa427-artifacts.json').read_text(); pages=[]
          try: pages=[json.loads(raw)]
          except json.JSONDecodeError:
              dec=json.JSONDecoder(); i=0
              while i<len(raw):
                  while i<len(raw) and raw[i].isspace(): i+=1
                  if i>=len(raw): break
                  obj,i=dec.raw_decode(raw,i); pages.append(obj)
          arts=[]
          for page in pages:
              if isinstance(page,dict): arts+=page.get('artifacts',[])
              elif isinstance(page,list): arts+=page
          repo=os.environ['GITHUB_REPOSITORY']; root=Path('build-logs/fa427-actualedge-matrix/collected')
          selected=[]
          for a in arts:
              name=str(a.get('name',''))
              if not name.startswith('fa427-candidate-') or a.get('expired'): continue
              aid=int(a['id']); variant=name.removeprefix('fa427-candidate-')
              z=Path('/tmp')/f'fa427-{aid}.zip'; d=root/variant; d.mkdir(parents=True,exist_ok=True)
              with z.open('wb') as h:
                  p=subprocess.run(['gh','api',f'/repos/{repo}/actions/artifacts/{aid}/zip'],stdout=h)
              if p.returncode: continue
              with zipfile.ZipFile(z) as ar: ar.extractall(d)
              selected.append({'artifact_id':aid,'name':name,'variant':variant})
          (root/'ARTIFACTS.json').write_text(json.dumps(selected,indent=2)+'\n')
          if len(selected)<12:
              raise SystemExit(f'expected 12 candidate artifacts, collected {len(selected)}')
          PY

      - name: Select strict line-improving candidate or exact baseline materialization
        id: select
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          root=Path('build-logs/fa427-actualedge-matrix/collected')
          rows=[]
          for p in root.glob('*/METRIC.json'):
              try: metric=json.loads(p.read_text())
              except Exception: continue
              source_path=p.parent/'Mock2_FunctionalAnalysis-candidate.lean'
              if not source_path.exists(): continue
              data=source_path.read_bytes(); actual=hashlib.sha256(data).hexdigest()
              metric['_metric_path']=str(p); metric['_source_path']=str(source_path); metric['_actual_sha']=actual
              rows.append(metric)
          baseline=[r for r in rows if r.get('variant')=='baseline']
          if len(baseline)!=1: raise SystemExit(f'expected one baseline metric, found {len(baseline)}')
          b=baseline[0]
          b_ok=(b.get('source_sha256')==os.environ['BASELINE_SHA']==b.get('_actual_sha')
                and b.get('line_count')==60453 and b.get('Mock2_exit')==0 and b.get('Mock2_errors')==0
                and b.get('Mock2_Advanced_exit')==0 and b.get('Mock2_Advanced_errors')==0
                and (b.get('FA_exit')==0 or b.get('FA_first_error_line',0)>=int(os.environ['BASELINE_FRONTIER'])))
          if not b_ok: raise SystemExit('PASS423 baseline did not reproduce authoritatively')
          header=b['target_header_sha256']
          eligible=[]
          for r in rows:
              valid=(r.get('source_metadata_identity') is True and r.get('_actual_sha')==r.get('source_sha256')
                     and r.get('line_count')==60453 and r.get('target_header_sha256')==header
                     and r.get('Mock2_exit')==0 and r.get('Mock2_errors')==0
                     and r.get('Mock2_Advanced_exit')==0 and r.get('Mock2_Advanced_errors')==0)
              strict=(r.get('FA_exit')==0 or r.get('FA_first_error_line',0)>int(os.environ['BASELINE_FRONTIER']))
              if valid and strict and r.get('source_sha256')!=os.environ['BASELINE_SHA']:
                  eligible.append(r)
          if eligible:
              eligible.sort(key=lambda r:(r.get('FA_exit')==0,r.get('FA_first_error_line',0),r.get('FA_first_error_col',0)),reverse=True)
              chosen=eligible[0]; mode='strict_promotion'
          else:
              chosen=b; mode='materialize_verified_baseline'
          src=Path(chosen['_source_path']); selected=Path('build-logs/fa427-actualedge-matrix/selected')
          selected.mkdir(parents=True,exist_ok=True)
          (selected/'Mock2_FunctionalAnalysis-selected.lean').write_bytes(src.read_bytes())
          result={'classification':'CANDIDATE','selection_mode':mode,'baseline':b,'chosen':chosen,
                  'eligible_strict_candidates':len(eligible),'all_metrics':rows,
                  'promotion_rule':'FA exit 0, otherwise first actual error line strictly greater than 31726; same 60453 lines and theorem header'}
          (selected/'SELECTION.json').write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"selection_mode={mode}\n")
              h.write(f"selected_sha={chosen['source_sha256']}\n")
              h.write(f"matrix_fa_exit={chosen['FA_exit']}\n")
              h.write(f"matrix_first_line={chosen['FA_first_error_line']}\n")
              h.write(f"matrix_first_col={chosen['FA_first_error_col']}\n")
              h.write(f"variant={chosen['variant']}\n")
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee build-logs/fa427-actualedge-matrix/selected/lean-version.txt
          lake --version | tee build-logs/fa427-actualedge-matrix/selected/lake-version.txt
          lake exe cache get | tee build-logs/fa427-actualedge-matrix/selected/cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Authoritatively recompile selected source and completed prerequisites
        id: confirm
        shell: bash
        env:
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa427-actualedge-matrix/selected
          cp "$d/Mock2_FunctionalAnalysis-selected.lean" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$SELECTED_SHA" || exit 9
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" \
              > "$d/confirm-${stem}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/confirm-${stem}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then compile_one Mock2_FunctionalAnalysis; fa=$?; fi
          export M2="$m2" M2A="$m2a" FA="$fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          d=Path('build-logs/fa427-actualedge-matrix/selected')
          data=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_bytes()
          sha=hashlib.sha256(data).hexdigest(); lines=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          log=(d/'confirm-Mock2_FunctionalAnalysis.log').read_text(errors='replace') if (d/'confirm-Mock2_FunctionalAnalysis.log').exists() else ''
          ms=list(re.finditer(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:',log))
          first=int(ms[0].group(1)) if ms else 0; col=int(ms[0].group(2)) if ms else 0
          m2=int(os.environ['M2']); m2a=int(os.environ['M2A']); fa=int(os.environ['FA'])
          mode=os.environ['SELECTION_MODE']; required=31726 if mode=='materialize_verified_baseline' else 31727
          verified=(sha==os.environ['SELECTED_SHA'] and lines==60453 and m2==0 and m2a==0 and (fa==0 or first>=required))
          result={'classification':'VERIFIED' if verified else 'INFRA_FAILURE','authority':'direct Lean CLI',
                  'selection_mode':mode,'source_sha256':sha,'line_count':lines,
                  'Mock2_exit':m2,'Mock2_Advanced_exit':m2a,'FA_exit':fa,
                  'FA_first_error_line':first,'FA_first_error_col':col,
                  'error_headers_under_cap':len(ms),'maxErrors_cap':1,'verified':verified}
          (d/'CONFIRMATION.json').write_text(json.dumps(result,indent=2)+'\n')
          (d/('VERIFIED' if verified else 'FAILED')).touch()
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"verified={str(verified).lower()}\nfa_exit={fa}\nfirst_line={first}\nfirst_col={col}\n")
          PY
          exit 0

      - name: Commit checked-in direct-verified source before pass gates
        id: persist
        if: always()
        env:
          VERIFIED: ${{ steps.confirm.outputs.verified }}
          SELECTION_MODE: ${{ steps.select.outputs.selection_mode }}
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
          FA_EXIT: ${{ steps.confirm.outputs.fa_exit }}
          FIRST_LINE: ${{ steps.confirm.outputs.first_line }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa427-actualedge-matrix
          test "${VERIFIED:-false}" = true
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          test "$actual" = "$SELECTED_SHA"
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d/selected"
          if test "$SELECTION_MODE" = strict_promotion; then
            if test "$FA_EXIT" = 0; then metric=pass; else metric="first-${FIRST_LINE}"; fi
            msg="fix: promote FA427 ${metric} direct-verified source ${SELECTED_SHA:0:12}"
          else
            msg="fix: materialize FA423 first-${FIRST_LINE} direct-verified source ${SELECTED_SHA:0:12}"
          fi
          if ! git diff --cached --quiet; then
            git commit -m "$msg"
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi
          checked=$(git show "HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" | sha256sum | awk '{print $1}')
          test "$checked" = "$SELECTED_SHA"
          head=$(git rev-parse HEAD)
          if test "$FA_EXIT" = 0; then metric=pass; else metric="first-${FIRST_LINE}"; fi
          immutable="champion/fa427-${metric}-${SELECTED_SHA:0:12}-${GITHUB_RUN_ID}"
          python3 - <<PY > /tmp/fa427-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
          if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" --input /tmp/fa427-ref.json \
               > "$d/selected/immutable-response.json" 2> "$d/selected/immutable-error.txt"; then
            printf '%s\n' "$immutable" > "$d/selected/IMMUTABLE_CHAMPION_BRANCH.txt"
          fi
          echo "source_commit=$head" >> "$GITHUB_OUTPUT"

      - name: Compile identical checked-in FA source twice and audit forbidden escapes
        id: fa_gate
        if: always()
        env:
          SELECTED_SHA: ${{ steps.select.outputs.selected_sha }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa427-actualedge-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          src=PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          checked=$(git show "HEAD:$src" | sha256sum | awk '{print $1}')
          worktree=$(sha256sum "$src" | awk '{print $1}')
          identity=false
          if test -n "$SELECTED_SHA" && test "$SELECTED_SHA" = "$checked" && test "$SELECTED_SHA" = "$worktree"; then identity=true; fi
          printf 'selected=%s\nchecked=%s\nworktree=%s\nidentity=%s\n' "$SELECTED_SHA" "$checked" "$worktree" "$identity" > "$d/source-identity.txt"
          compile_fa() {
            n=$1
            o=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            i=.lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/FA-run${n}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/FA-run${n}.exit"
            test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          r1=125; r2=125
          if test "$identity" = true; then
            compile_fa 1; r1=$?
            if test "$r1" -eq 0; then compile_fa 2; r2=$?; fi
          fi
          export R1="$r1" R2="$r2"
          python3 - <<'PY'
          from pathlib import Path
          import json,os,re
          text=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean').read_text()
          out=[]; i=0; line=False; string=False; escaped=False; depth=0
          while i<len(text):
              c=text[i]; n=text[i+1] if i+1<len(text) else ''
              if line:
                  if c=='\n': line=False; out.append('\n')
                  else: out.append(' ')
                  i+=1; continue
              if depth:
                  if c=='/' and n=='-': depth+=1; out+=[' ',' ']; i+=2; continue
                  if c=='-' and n=='/': depth-=1; out+=[' ',' ']; i+=2; continue
                  out.append('\n' if c=='\n' else ' '); i+=1; continue
              if string:
                  out.append('\n' if c=='\n' else ' ')
                  if escaped: escaped=False
                  elif c=='\\': escaped=True
                  elif c=='"': string=False
                  i+=1; continue
              if c=='-' and n=='-': line=True; out+=[' ',' ']; i+=2; continue
              if c=='/' and n=='-': depth=1; out+=[' ',' ']; i+=2; continue
              if c=='"': string=True; out.append(' '); i+=1; continue
              out.append(c); i+=1
          code=''.join(out)
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','new_global_axiom':r'(?m)^\s*(?:protected\s+|private\s+)?axiom\b',
                'unsafe':r'\bunsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          audit={k:len(re.findall(v,code)) for k,v in pats.items()}
          r1=int(os.environ['R1']); r2=int(os.environ['R2']); clean=all(v==0 for v in audit.values())
          result={'FA_run1_exit':r1,'FA_run2_exit':r2,'forbidden_audit':audit,'forbidden_clean':clean,
                  'FA_TRUE_PASS':r1==0 and r2==0 and clean,'maxErrors_cap':1}
          p=Path('build-logs/fa427-actualedge-matrix/final-gates/FA_FINAL.json'); p.write_text(json.dumps(result,indent=2)+'\n')
          print(json.dumps(result,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h: h.write(f"fa_true_pass={str(result['FA_TRUE_PASS']).lower()}\n")
          PY
          exit 0

      - name: Ordered Integrated Mock3 bridge QYM two-pass gate
        id: downstream
        if: always()
        env:
          FA_TRUE_PASS: ${{ steps.fa_gate.outputs.fa_true_pass }}
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa427-actualedge-matrix/final-gates
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          complete=true; final=1; targets=()
          if test "${FA_TRUE_PASS:-false}" != true; then complete=false; fi
          if test -f PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean; then targets+=(Mock2_FunctionalAnalysis_Integrated); else complete=false; echo missing > "$d/Integrated-missing.txt"; fi
          shopt -s nullglob
          for f in PrimalitySheafVerification/Mock3*.lean; do targets+=("$(basename "$f" .lean)"); done
          if test -f PrimalitySheafVerification/QYM.lean; then targets+=(QYM); else complete=false; echo missing > "$d/QYM-missing.txt"; fi
          compile_one() {
            stem=$1; n=$2; src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" > "$d/${stem}-run${n}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/${stem}-run${n}.exit"; test "$rc" -eq 0 && test -s "$o" && test -s "$i"
          }
          if test "$complete" = true; then
            for stem in "${targets[@]}"; do
              compile_one "$stem" 1; a=$?; b=125
              if test "$a" -eq 0; then compile_one "$stem" 2; b=$?; fi
              if test "$a" -ne 0 || test "$b" -ne 0; then complete=false; break; fi
            done
          fi
          if test "$complete" = true; then final=0; touch "$d/ALL_REQUIRED_TARGETS_2X_PASS"; fi
          echo "final_exit=$final" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Commit final evidence and upload artifact
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add build-logs/fa427-actualedge-matrix/selected build-logs/fa427-actualedge-matrix/final-gates
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA427 checked-in direct and ordered gate evidence [skip ci]'
            git push origin "HEAD:${ACTIVE_BRANCH}"
          fi

      - name: Upload complete FA427 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa427-selected-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa427-actualedge-matrix/selected
            build-logs/fa427-actualedge-matrix/final-gates
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce full ordered completion
        if: always()
        env:
          FINAL_EXIT: ${{ steps.downstream.outputs.final_exit }}
        shell: bash
        run: |
          test -n "${FINAL_EXIT:-}"
          exit "$FINAL_EXIT"
