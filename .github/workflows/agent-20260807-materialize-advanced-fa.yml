name: Agent atomic materialization — Mock2 Advanced and FunctionalAnalysis

on:
  push:
    branches:
      - fix/primality-sheaf-clean-build
    paths:
      - '.github/workflows/agent-20260807-materialize-advanced-fa.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: agent-atomic-materialize-advanced-fa
  cancel-in-progress: false

jobs:
  verify-and-materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    env:
      BRANCH: fix/primality-sheaf-clean-build
      REPAIR_BASE: 2d302e76b0793f6d3c70f530b503064800f38bf3
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      ADVANCED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      FA_START_BLOB: 4eedc43d57f96b45897990bbeaada01ee0fd3b84
      ADVANCED_CANDIDATE_SHA256: 5ed076b1eda61c1702243aa5a391e2db76265d1a28b55834527d15e2dd4f788b
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Fetch exact triggering commit and repair base without checkout action
        shell: bash
        run: |
          set -euo pipefail
          mkdir repo
          cd repo
          git init
          git remote add origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git fetch --depth=1 origin "${REPAIR_BASE}"
          git checkout --detach "${GITHUB_SHA}"
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"

      - name: Reconstruct the exact Advanced pass 312 candidate
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/advanced-repair-base "${REPAIR_BASE}"
          cp scripts/apply_three_hundred_twelfth_pass_repairs.py \
            /tmp/advanced-repair-base/scripts/apply_three_hundred_twelfth_pass_repairs.py
          cd /tmp/advanced-repair-base
          {
            python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
            python3 scripts/apply_three_hundredth_pass_repairs.py
            python3 scripts/apply_three_hundred_ninth_pass_repairs.py
            python3 scripts/apply_three_hundred_tenth_pass_repairs.py
            python3 scripts/apply_three_hundred_eleventh_pass_repairs.py
            python3 scripts/apply_three_hundred_twelfth_pass_repairs.py
          } 2>&1 | tee /tmp/advanced-repair-application.log
          actual="$(sha256sum "${ADVANCED}" | awk '{print $1}')"
          echo "Advanced candidate sha256=${actual}"
          test "${actual}" = "${ADVANCED_CANDIDATE_SHA256}"
          cp "${ADVANCED}" /tmp/Mock2_Advanced.pass312.lean

      - name: Reconstruct the FunctionalAnalysis pass 313 candidate
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          git worktree add --detach /tmp/fa-repair-base "${REPAIR_BASE}"
          cp scripts/apply_three_hundred_thirteenth_pass_repairs.py \
            /tmp/fa-repair-base/scripts/apply_three_hundred_thirteenth_pass_repairs.py
          cd /tmp/fa-repair-base
          {
            python3 scripts/apply_two_hundred_eighty_ninth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninetieth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_first_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_second_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_third_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fourth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_fifth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_seventh_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_eighth_pass_repairs.py
            python3 scripts/apply_two_hundred_ninety_ninth_pass_repairs.py
            python3 scripts/apply_three_hundredth_pass_repairs.py
            python3 scripts/apply_three_hundred_ninth_pass_repairs.py
            python3 scripts/apply_three_hundred_tenth_pass_repairs.py
            python3 scripts/apply_three_hundred_eleventh_pass_repairs.py
            python3 scripts/apply_three_hundred_thirteenth_pass_repairs.py
          } 2>&1 | tee /tmp/fa-repair-application.log
          fa_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          fa_lines="$(wc -l < "${FA}")"
          echo "FunctionalAnalysis candidate sha256=${fa_sha}"
          echo "FunctionalAnalysis candidate lines=${fa_lines}"
          cp "${FA}" /tmp/Mock2_FunctionalAnalysis.pass313.lean

      - name: Install reconstructed candidates into the exact triggering tree
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          advanced_current_sha="$(sha256sum "${ADVANCED}" | awk '{print $1}')"
          advanced_current_blob="$(git hash-object "${ADVANCED}")"
          if [[ "${advanced_current_sha}" != "${ADVANCED_CANDIDATE_SHA256}" ]]; then
            test "${advanced_current_blob}" = "${ADVANCED_START_BLOB}"
            cp /tmp/Mock2_Advanced.pass312.lean "${ADVANCED}"
          fi

          fa_candidate_sha="$(sha256sum /tmp/Mock2_FunctionalAnalysis.pass313.lean | awk '{print $1}')"
          fa_current_sha="$(sha256sum "${FA}" | awk '{print $1}')"
          fa_current_blob="$(git hash-object "${FA}")"
          if [[ "${fa_current_sha}" != "${fa_candidate_sha}" ]]; then
            test "${fa_current_blob}" = "${FA_START_BLOB}"
            cp /tmp/Mock2_FunctionalAnalysis.pass313.lean "${FA}"
          fi

          test "$(sha256sum "${ADVANCED}" | awk '{print $1}')" = "${ADVANCED_CANDIDATE_SHA256}"
          test "$(sha256sum "${FA}" | awk '{print $1}')" = "${fa_candidate_sha}"
          changed="$(git diff --name-only HEAD)"
          printf 'isolated source changes:\n%s\n' "${changed}"
          if [[ -n "${changed}" ]]; then
            while IFS= read -r path; do
              case "$path" in
                "${ADVANCED}"|"${FA}") ;;
                *) echo "unexpected changed path: $path"; exit 1 ;;
              esac
            done <<< "$changed"
          fi
          git diff --check

      - name: Static trust gate on Mock2, Advanced and FunctionalAnalysis
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re

          paths = [
              Path('PrimalitySheafVerification/Mock2.lean'),
              Path('PrimalitySheafVerification/Mock2_Advanced.lean'),
              Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),
          ]
          checks = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'line_start_axiom': r'(?m)^\s*axiom\b',
              'unsafe': r'\bunsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
              'by_contra!': r'\bby_contra!\b',
              'placeholder': r'\bplaceholder\b',
          }
          def executable(src: str) -> str:
              out=[]; i=0; depth=0; in_string=False; escaped=False
              while i < len(src):
                  if depth:
                      if src.startswith('/-',i): depth+=1; out.extend('  '); i+=2
                      elif src.startswith('-/',i): depth-=1; out.extend('  '); i+=2
                      else: out.append('\n' if src[i]=='\n' else ' '); i+=1
                      continue
                  if in_string:
                      ch=src[i]; out.append('\n' if ch=='\n' else ' ')
                      if escaped: escaped=False
                      elif ch=='\\': escaped=True
                      elif ch=='"': in_string=False
                      i+=1; continue
                  if src.startswith('/-',i): depth=1; out.extend('  '); i+=2
                  elif src.startswith('--',i):
                      while i<len(src) and src[i]!='\n': out.append(' '); i+=1
                  elif src[i]=='"': in_string=True; out.append(' '); i+=1
                  else: out.append(src[i]); i+=1
              if depth or in_string: raise RuntimeError('unterminated comment/string')
              return ''.join(out)
          bad=False
          for path in paths:
              code=executable(path.read_text(encoding='utf-8'))
              print(f'===== {path} =====')
              for name,pat in checks.items():
                  count=len(re.findall(pat,code)); print(f'{name}: {count}'); bad |= count != 0
          if bad: raise SystemExit('forbidden executable token detected')
          PY

      - name: Install exact Lean toolchain without setup action
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          curl --proto '=https' --tlsv1.2 -sSf \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          "$HOME/.elan/bin/elan" toolchain install "$(cat lean-toolchain)"
          "$HOME/.elan/bin/lean" --version

      - name: Restore Mathlib cache
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          lake exe cache get

      - name: Compile Mock2 regression and both candidates twice
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "$outdir"

          compile_once() {
            local module="$1"
            local pass="$2"
            rm -f "$outdir/${module}.olean" "$outdir/${module}.ilean" "$outdir/${module}.olean.private"
            echo "===== ${module} clean compile ${pass} ====="
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "$outdir/${module}.olean" -i "$outdir/${module}.ilean" 2>&1 \
              | tee "/tmp/${module}-${pass}.log"
            local code=${PIPESTATUS[0]}
            set -e
            echo "${module} ${pass} exit_code=${code}"
            test "$code" -eq 0
            test -s "$outdir/${module}.olean"
            test -s "$outdir/${module}.ilean"
            test "$(grep -c 'error:' "/tmp/${module}-${pass}.log" || true)" -eq 0
            ! grep -Eqi "maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|declaration uses 'sorry'|sorryAx" \
              "/tmp/${module}-${pass}.log"
          }

          compile_once Mock2 regression
          compile_once Mock2_Advanced pass1
          compile_once Mock2_Advanced pass2
          compile_once Mock2_FunctionalAnalysis pass1
          compile_once Mock2_FunctionalAnalysis pass2
          sha256sum \
            "${ADVANCED}" "${FA}" \
            "$outdir/Mock2_Advanced.olean" "$outdir/Mock2_Advanced.ilean" \
            "$outdir/Mock2_FunctionalAnalysis.olean" "$outdir/Mock2_FunctionalAnalysis.ilean"

      - name: Atomically commit only verified source files
        shell: bash
        working-directory: repo
        run: |
          set -euo pipefail
          changed="$(git diff --name-only HEAD)"
          if [[ -z "${changed}" ]]; then
            echo 'PASS: both checked-in sources already equal the verified candidates.'
            exit 0
          fi
          while IFS= read -r path; do
            case "$path" in
              "${ADVANCED}"|"${FA}") ;;
              *) echo "unexpected changed path before commit: $path"; exit 1 ;;
            esac
          done <<< "$changed"

          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          echo "trigger head=${GITHUB_SHA}"
          echo "remote head=${remote_head}"
          test "${remote_head}" = "${GITHUB_SHA}"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${ADVANCED}" "${FA}"
          staged="$(git diff --cached --name-only)"
          while IFS= read -r path; do
            case "$path" in
              "${ADVANCED}"|"${FA}") ;;
              *) echo "unexpected staged path: $path"; exit 1 ;;
            esac
          done <<< "$staged"
          git commit -m 'fix: materialize verified Mock2 Advanced and FunctionalAnalysis sources'
          git push origin "HEAD:${BRANCH}"
