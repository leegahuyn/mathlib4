name: GPT QYM dependency object cache v4

on:
  push:
    branches: [gpt/qym-gb57-global-batch-round2-20260820]
    paths:
      - .github/workflows/gpt-qym-dependency-cache-v4.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: gpt-qym-dependency-cache-v4
  cancel-in-progress: false

jobs:
  cache:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/qym-dependency-cache .lake/build/lib/lean/PrimalitySheafVerification
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/qym-dependency-cache/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          elan toolchain install "$tc" >/tmp/qym-dependency-cache/toolchain.log 2>&1
          lake exe cache get >/tmp/qym-dependency-cache/mathlib-cache.log 2>&1
      - name: Restore or prepare exact dependency cache
        id: deps
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v4-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
      - name: Compile exact prerequisites by Lean
        shell: bash
        run: |
          set -euo pipefail
          OLEAN=.lake/build/lib/lean/PrimalitySheafVerification
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              max_errors=1
              [[ "$source" = Mock2_FunctionalAnalysis* ]] && max_errors=2000
              lake env lean "-DmaxErrors=$max_errors" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" >"/tmp/qym-dependency-cache/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done
          sha256sum PrimalitySheafVerification/Mock2*.lean > /tmp/qym-dependency-cache/source-sha256.txt
          stat -c '%n %s' "$OLEAN"/Mock2*.olean "$OLEAN"/Mock2*.ilean > /tmp/qym-dependency-cache/object-sizes.txt
      - name: Publish cache readiness marker
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .github/qym-frontier/DEPENDENCY_CACHE_V4
          printf '{"run_id":%s,"trigger_sha":"%s","cache_hit":"%s","status":"READY"}\n' \
            "$GITHUB_RUN_ID" "$GITHUB_SHA" "${{ steps.deps.outputs.cache-hit }}" \
            > .github/qym-frontier/DEPENDENCY_CACHE_V4/STATUS.json
          cp /tmp/qym-dependency-cache/object-sizes.txt .github/qym-frontier/DEPENDENCY_CACHE_V4/
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .github/qym-frontier/DEPENDENCY_CACHE_V4
          git commit -m "QYM: dependency object cache ready ${GITHUB_RUN_ID} [skip ci]"
          for attempt in 1 2 3 4 5; do
            git fetch origin gpt/qym-gb57-global-batch-round2-20260820
            if git rebase origin/gpt/qym-gb57-global-batch-round2-20260820 && \
              git push origin HEAD:gpt/qym-gb57-global-batch-round2-20260820; then exit 0; fi
            git rebase --abort || true
            sleep $((attempt * 5))
          done
          exit 1
