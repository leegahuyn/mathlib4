name: Codex FA after3460 unfold paren realshift mass diagnostic v2
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3460-unfold-paren-realshift-mass-diagnostic-v2.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build cumulative diagnostic runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3460_unfold_realshift_mass_v1.sh').read_text()
          src = src.replace('codex-fa-after3460-unfold-realshift-mass-v1', 'codex-fa-after3460-unfold-paren-realshift-mass-diagnostic-v2')
          src = src.replace("'fa-after3460-unfold-realshift-mass-v1'", "'fa-after3460-unfold-paren-realshift-mass-diagnostic-v2'")
          marker = 'python3 scripts/codex_fa_apply_realshift_3485.py "$OUT"'
          assert src.count(marker) == 1
          src = src.replace(marker, 'python3 scripts/codex_fa_apply_friedrichs_continuous_3460.py "$OUT"\n' + marker, 1)
          assert src.count('one Mock2_FunctionalAnalysis 1') == 1
          src = src.replace('one Mock2_FunctionalAnalysis 1', 'one Mock2_FunctionalAnalysis 20', 1)
          Path('/tmp/codex_fa_after3460_unfold_paren_realshift_mass_diagnostic_v2.sh').write_text(src)
          PY
      - name: Attest cumulative patch and direct compile diagnostic full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3460_unfold_paren_realshift_mass_diagnostic_v2.sh
      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3460-unfold-paren-realshift-mass-diagnostic-v2-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3460-unfold-paren-realshift-mass-diagnostic-v2
          retention-days: 30
