name: FA420 authoritative hash-selected PASS376 direct reverify

on:
  push:
    branches:
      - ops/fa420-hash-selected-authoritative-reverify-20260809
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ACTIVE_BRANCH: 'ops/fa420-hash-selected-authoritative-reverify-20260809'
  ARTIFACT_ID: '9024606745'
  EXPECTED_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  PASS376_HEAD: '71227bd1ba88c99f9a535df044fd37041bcf2304'
  FIXED_VERIFIED_BRANCH: 'fix/fa420-authoritative-pass376-20260809'

jobs:
  direct-reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Checkout FA420 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fa420-hash-selected-authoritative-reverify-20260809
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Select exact artifact source by SHA rather than filename
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fa420-artifact /tmp/fa420.zip
          mkdir -p /tmp/fa420-artifact
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/fa420.zip
          unzip -q /tmp/fa420.zip -d /tmp/fa420-artifact
          matches=()
          while IFS= read -r -d '' file; do
            actual=$(sha256sum "$file" | awk '{print $1}')
            if test "$actual" = "$EXPECTED_SHA256"; then matches+=("$file"); fi
          done < <(find /tmp/fa420-artifact -type f -print0)
          test "${#matches[@]}" -eq 1
          cp "${matches[0]}" /tmp/fa420-champion.lean
          test "$(sha256sum /tmp/fa420-champion.lean | awk '{print $1}')" = "$EXPECTED_SHA256"
          cp /tmp/fa420-champion.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

      - name: Directly compile Mock2, Mock2 Advanced, and untouched FA
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa420-authoritative-reverify
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then return 0; fi
            return "$rc"
          }

          compile_one Mock2 500; rc_m2=$?
          compile_one Mock2_Advanced 500; rc_m2a=$?
          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1800; rc_fa=$?
          else
            printf 'prerequisite failure\n' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi

          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          d=Path('build-logs/fa420-authoritative-reverify')
          log=(d/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace')
          pat=re.compile(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          matches=list(pat.finditer(log))
          first=int(matches[0].group(1)) if matches else 0
          col=int(matches[0].group(2)) if matches else 0
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rc_m2=int(os.environ['RC_M2']); rc_m2a=int(os.environ['RC_M2A']); rc_fa=int(os.environ['RC_FA'])
          sha=hashlib.sha256(src.read_bytes()).hexdigest()
          verified=(
              sha=='07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
              and rc_m2==0 and rc_m2a==0 and (rc_fa==0 or first>=31725)
          )
          status={
              'verified':verified,
              'source_sha256':sha,
              'Mock2_exit':rc_m2,
              'Mock2_Advanced_exit':rc_m2a,
              'FA_exit':rc_fa,
              'FA_first_error_line':first,
              'FA_first_error_col':col,
              'FA_captured_errors':len(matches),
              'minimum_required_frontier':31725,
              'repairs_applied':0,
              'authority':'direct Lean compile metric',
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          (d/'CURRENT.txt').write_text('\n'.join(f'{k}={v}' for k,v in status.items())+'\n',encoding='utf-8')
          (d/('VERIFIED' if verified else 'FAILED')).touch()
          Path('/tmp/fa420-verified').write_text('0' if verified else '1')
          Path('/tmp/fa420-first').write_text(str(first))
          Path('/tmp/fa420-col').write_text(str(col))
          Path('/tmp/fa420-fa-exit').write_text(str(rc_fa))
          print(json.dumps(status,indent=2))
          PY
          echo "verified=$(cat /tmp/fa420-verified)" >> "$GITHUB_OUTPUT"
          echo "first_error=$(cat /tmp/fa420-first)" >> "$GITHUB_OUTPUT"
          echo "first_col=$(cat /tmp/fa420-col)" >> "$GITHUB_OUTPUT"
          echo "fa_exit=$(cat /tmp/fa420-fa-exit)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze direct evidence and source
        if: steps.compile.outputs.verified == '0'
        shell: bash
        run: |
          set -euo pipefail
          cp /tmp/fa420-champion.lean /tmp/fa420-authoritative-source.lean
          cp -a build-logs/fa420-authoritative-reverify /tmp/fa420-authoritative-evidence

      - name: Preserve evidence on controller without source mutation
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || true
          git add build-logs/fa420-authoritative-reverify
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record FA420 authoritative direct metric [skip ci]'
            git push origin "HEAD:refs/heads/${ACTIVE_BRANCH}"
          fi

      - name: Check in metric-named immutable champion and fixed verified branch
        if: steps.compile.outputs.verified == '0'
        shell: bash
        run: |
          set -euo pipefail
          first="${{ steps.compile.outputs.first_error }}"
          fa_exit="${{ steps.compile.outputs.fa_exit }}"
          if test "$fa_exit" = '0'; then label=pass; else label="first-${first}"; fi
          metric_branch="champion/fa420-${label}-07f6efd3309c-20260809"

          if git ls-remote --exit-code --heads origin "$metric_branch" >/dev/null 2>&1; then
            git fetch origin "$metric_branch"
            git show "FETCH_HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" > /tmp/fa420-existing-metric.lean
            test "$(sha256sum /tmp/fa420-existing-metric.lean | awk '{print $1}')" = "$EXPECTED_SHA256"
          else
            git switch --detach "$PASS376_HEAD"
            git switch -c "$metric_branch"
            cp /tmp/fa420-authoritative-source.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            mkdir -p champion-records/fa420
            cp /tmp/fa420-authoritative-evidence/CURRENT.json \
              "champion-records/fa420/${label}-07f6efd3309c.json"
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean champion-records/fa420
            git commit -m "chore: check in FA420 ${label} champion [skip ci]"
            git push origin "HEAD:refs/heads/${metric_branch}"
          fi

          if git ls-remote --exit-code --heads origin "$FIXED_VERIFIED_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$FIXED_VERIFIED_BRANCH"
            git switch -C "$FIXED_VERIFIED_BRANCH" "origin/$FIXED_VERIFIED_BRANCH"
            test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$EXPECTED_SHA256"
          else
            git switch --detach "origin/$metric_branch"
            git switch -c "$FIXED_VERIFIED_BRANCH"
          fi
          rm -rf build-logs/fa420-authoritative-reverify
          cp -a /tmp/fa420-authoritative-evidence build-logs/fa420-authoritative-reverify
          git add build-logs/fa420-authoritative-reverify
          if ! git diff --cached --quiet; then
            git commit -m 'ci: initialize fixed authoritative FA420 frontier [skip ci]'
            git push origin "HEAD:refs/heads/${FIXED_VERIFIED_BRANCH}"
          elif ! git ls-remote --exit-code --heads origin "$FIXED_VERIFIED_BRANCH" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${FIXED_VERIFIED_BRANCH}"
          fi

      - name: Upload FA420 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa420-authoritative-reverify-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa420-authoritative-reverify
            /tmp/fa420-champion.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce direct authoritative metric
        if: always()
        env:
          VERIFIED: ${{ steps.compile.outputs.verified }}
        shell: bash
        run: |
          test "${VERIFIED:-1}" = '0'
