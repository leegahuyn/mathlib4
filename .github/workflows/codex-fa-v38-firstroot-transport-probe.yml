name: Codex FA v38 first-root transport probe
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-v38-firstroot-transport-probe.yml
  workflow_dispatch: {}
permissions:
  actions: read
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Materialize exact v37 candidate and patch first root
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/v37
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/9172306868/zip" >/tmp/v37.zip
          test "sha256:$(sha256sum /tmp/v37.zip | awk '{print $1}')" = "sha256:f8d9e30cc4c9a972f14bf9cf1d85b1a2c4c7cebb7b39fb0a039af3a6cf7bbc2e"
          unzip -q /tmp/v37.zip -d /tmp/v37
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, shutil
          want='e17ff90193c6959b15f743ef930446b4cfd45bc6df4d762057c13b4b06602d05'
          hits=[p for p in Path('/tmp/v37').rglob('Mock2_FunctionalAnalysis.lean') if hashlib.sha256(p.read_bytes()).hexdigest()==want]
          assert len(hits)==1,hits
          dst=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          shutil.copy2(hits[0],dst)
          s=dst.read_text()
          old='''  have hs :=
    successorEnergyForm_eq_inner_strongPrincipalCore (n - 1)
  simpa only [successorGraphCoordinates, transportSuccessorCoordinates,
    successorIndexEq, sub_add_cancel] using hs
'''
          new='''  have hs :=
    successorEnergyForm_eq_inner_strongPrincipalCore (n - 1)
  have htransport :
      ∀ (m : ℤ) (h : m = m) (Q : successorCoordinateType m m),
        transportSuccessorCoordinates m m h Q = Q := by
    intro m h Q
    cases h
    rfl
  simpa only [successorGraphCoordinates, successorIndexEq, sub_add_cancel,
    htransport] using hs
'''
          assert s.count(old)==1
          dst.write_text(s.replace(old,new))
          print(hashlib.sha256(dst.read_bytes()).hexdigest())
          PY
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
      - name: Direct full-source first-root probe
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          rm -f .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
          set +e
          lake env lean -DmaxErrors=3 -DwarningAsError=false -o .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean -i .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean > /tmp/probe.log 2>&1
          rc=$?
          set -e
          echo "$rc" >/tmp/probe.exit
          grep -n "error:" /tmp/probe.log | head -10 || true
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v38-firstroot-${{ github.sha }}
          path: |
            /tmp/probe.log
            /tmp/probe.exit
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          retention-days: 30
