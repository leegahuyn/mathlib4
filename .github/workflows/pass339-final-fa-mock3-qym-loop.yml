name: PASS 339 final FA Mock3 QYM loop

on:
  push:
    branches: [ci/fa319-isolated-20260807]
    paths:
      - '.github/workflows/pass339-final-fa-mock3-qym-loop.yml'
      - 'scripts/ci_pass339_final_fa_mock3_qym_loop.sh'
      - 'scripts/diagnose_pass339_fa.sh'
      - 'scripts/apply_*_pass*_repairs.py'
      - 'scripts/pass327_lean_repair_agent*.py'
      - 'scripts/ci_pass327_agent_orchestrator_v2.sh'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  pull_request:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/pass339-final-fa-mock3-qym-loop.yml'
      - 'scripts/ci_pass339_final_fa_mock3_qym_loop.sh'
      - 'scripts/diagnose_pass339_fa.sh'
      - 'scripts/apply_*_pass*_repairs.py'
      - 'scripts/pass327_lean_repair_agent*.py'
      - 'scripts/ci_pass327_agent_orchestrator_v2.sh'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass339-final-fa-mock3-qym-${{ github.event.pull_request.head.sha || github.sha }}
  cancel-in-progress: true

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 720
    env:
      SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      TARGET_BRANCH: ci/fa319-isolated-20260807
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}
      EVIDENCE: /tmp/pass339-final-fa-mock3-qym

    steps:
      - name: Checkout exact PR9 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_SHA }}
          fetch-depth: 256
          persist-credentials: true

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          mkdir -p "${EVIDENCE}/logs"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Repair from PASS 339 and require FA Integrated Mock3 QYM two-pass gate
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/ci_pass339_final_fa_mock3_qym_loop.sh

      - name: Upload complete PASS 339 final-gate evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass339-final-fa-mock3-qym-${{ env.SOURCE_SHA }}
          path: /tmp/pass339-final-fa-mock3-qym
          if-no-files-found: warn
          retention-days: 90
