name: Codex FA v51 remaining error inventory

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/codex/FA_V50_SELECTION.json
  workflow_dispatch: {}

permissions:
  actions: read
  contents: write

env:
  TARGET_BRANCH: codex/fa-qym-cleanbuild-final-20260811-fast

jobs:
  inventory:
    if: github.ref == 'refs/heads/codex/fa-qym-cleanbuild-final-20260811-fast'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: codex/fa-qym-cleanbuild-final-20260811-fast
          fetch-depth: 0
          persist-credentials: true

      - name: Resolve exact selected v50 artifact
        shell: bash
        run: |
          set -euo pipefail
          test -f .github/codex/FA_V50_SELECTION.json
          rm -rf /tmp/fa-v51-parent /tmp/fa-v51-parent.zip
          mkdir -p /tmp/fa-v51-parent .github/codex
          python3 - <<'PY'
          from pathlib import Path
          import json
          r=json.loads(Path('.github/codex/FA_V50_SELECTION.json').read_text())
          assert r['schema']=='fa-v50-strict-selector-v1'
          rec={x['variant']:x for x in r['records']}[r['selected_variant']]
          assert rec['source_sha256']==r['selected_source_sha256']
          Path('/tmp/fa-v51-run.txt').write_text(str(r['github_run_id'])+'\n')
          Path('/tmp/fa-v51-head.txt').write_text(r['github_sha']+'\n')
          Path('/tmp/fa-v51-artifact-name.txt').write_text(rec['artifact_directory']+'\n')
          Path('/tmp/fa-v51-source-sha.txt').write_text(r['selected_source_sha256']+'\n')
          PY
          run_id="$(tr -d '\r\n' </tmp/fa-v51-run.txt)"
          head_sha="$(tr -d '\r\n' </tmp/fa-v51-head.txt)"
          artifact_name="$(tr -d '\r\n' </tmp/fa-v51-artifact-name.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}" >/tmp/fa-v51-run.json
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts?per_page=100" >/tmp/fa-v51-artifacts.json
          python3 - <<'PY'
          from pathlib import Path
          import json,os
          run=json.loads(Path('/tmp/fa-v51-run.json').read_text())
          listing=json.loads(Path('/tmp/fa-v51-artifacts.json').read_text())
          run_id=int(Path('/tmp/fa-v51-run.txt').read_text().strip())
          head=Path('/tmp/fa-v51-head.txt').read_text().strip()
          name=Path('/tmp/fa-v51-artifact-name.txt').read_text().strip()
          assert int(run['id'])==run_id
          assert run['head_sha']==head
          assert run['head_branch']==os.environ['TARGET_BRANCH']
          assert run['status']=='completed'
          hits=[a for a in listing['artifacts'] if a['name']==name]
          assert len(hits)==1,(name,hits)
          a=hits[0]
          assert a['expired'] is False
          assert int(a['workflow_run']['id'])==run_id
          assert a['workflow_run']['head_sha']==head
          Path('/tmp/fa-v51-artifact.json').write_text(json.dumps(a,indent=2,sort_keys=True)+'\n')
          Path('/tmp/fa-v51-artifact-id.txt').write_text(str(a['id'])+'\n')
          Path('/tmp/fa-v51-artifact-digest.txt').write_text(a['digest']+'\n')
          PY
          artifact_id="$(tr -d '\r\n' </tmp/fa-v51-artifact-id.txt)"
          digest="$(tr -d '\r\n' </tmp/fa-v51-artifact-digest.txt)"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" >/tmp/fa-v51-parent.zip
          test "sha256:$(sha256sum /tmp/fa-v51-parent.zip|awk '{print $1}')" = "$digest"
          unzip -q /tmp/fa-v51-parent.zip -d /tmp/fa-v51-parent

      - name: Build declaration-owned complete remaining-error inventory
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import collections,hashlib,json,os,re
          root=Path('/tmp/fa-v51-parent')
          sources=list(root.rglob('Mock2_FunctionalAnalysis-candidate.lean'))
          metrics=list(root.rglob('METRIC.json'))
          assert len(sources)==1,sources
          assert len(metrics)==1,metrics
          source_path=sources[0]
          source=source_path.read_text(errors='replace')
          source_sha=hashlib.sha256(source.encode()).hexdigest()
          expected=Path('/tmp/fa-v51-source-sha.txt').read_text().strip()
          assert source_sha==expected,(source_sha,expected)
          metric=json.loads(metrics[0].read_text())
          if 'source_sha256' in metric: assert metric['source_sha256']==source_sha
          assert int(metric['Mock2_exit'])==0
          assert int(metric['Mock2_Advanced_exit'])==0
          assert metric['FA_error_cap_sentinel_present'] is False
          assert metric['FA_inventory_complete_by_header_evidence'] is True
          assert metric['source_executable_trust_six_zero'] is True
          logs=[]
          for p in root.rglob('*'):
            if p.is_file() and 'Mock2_FunctionalAnalysis' in p.name and p.suffix in {'.log','.txt'}:
              t=p.read_text(errors='replace')
              if 'error:' in t: logs.append((len(t),p,t))
          if logs:
            _,log_path,log=max(logs,key=lambda z:z[0])
          else:
            log_path=Path('NONE');log=''
          lines=source.splitlines()
          decl_re=re.compile(r'^(?:protected\s+|private\s+|noncomputable\s+|local\s+)*(?:theorem|lemma|def|abbrev|instance|structure|class)\s+([^\s:(]+)')
          declarations=[]
          for i,line in enumerate(lines,1):
            m=decl_re.match(line)
            if m: declarations.append((i,m.group(1),line))
          def owner(line_no):
            prior=[d for d in declarations if d[0]<=line_no]
            return prior[-1] if prior else (None,None,None)
          header=re.compile(r'(?m)^.*Mock2_FunctionalAnalysis\.lean:(\d+):(\d+): error:(.*)$')
          hs=list(header.finditer(log))
          errors=[]
          for i,m in enumerate(hs):
            start=m.start();end=hs[i+1].start() if i+1<len(hs) else len(log)
            line_no=int(m.group(1));col=int(m.group(2));block=log[start:end].strip()
            decl_line,decl_name,decl_header=owner(line_no)
            lo=max(1,line_no-4);hi=min(len(lines),line_no+4)
            snippet=[{'line':n,'text':lines[n-1]} for n in range(lo,hi+1)]
            normalized=re.sub(r'\s+',' ',block)
            normalized=re.sub(r'[^ ]*Mock2_FunctionalAnalysis\.lean:\d+:\d+:','Mock2_FunctionalAnalysis.lean:<line>:<col>:',normalized)
            signature=hashlib.sha256(normalized.encode()).hexdigest()
            lower=block.lower()
            classes=[]
            for key,tokens in {
              'tendsto_eta':['tendsto','function.comp'],
              'holder_exponent':['coefn_holder','holdertriple'],
              'scalar_action':['pi.smul','hsmul.hsmul','smul'],
              'instance_synthesis':['failed to synthesize','synthesized type class'],
              'type_mismatch':['type mismatch','application type mismatch'],
              'unsolved_goals':['unsolved goals'],
              'arithmetic':['linarith','nlinarith','≤','>=','inequality'],
              'unknown_identifier':['unknown identifier','invalid field notation'],
            }.items():
              if any(t.lower() in lower for t in tokens): classes.append(key)
            errors.append({
              'index':i+1,'line':line_no,'column':col,
              'declaration_line':decl_line,'declaration_name':decl_name,'declaration_header':decl_header,
              'code_line':lines[line_no-1] if 1<=line_no<=len(lines) else None,
              'classes':classes,'signature_sha256':signature,
              'message':block[:12000],'snippet':snippet,
            })
          counts=collections.Counter(e['declaration_name'] or '<none>' for e in errors)
          sigs=collections.Counter(e['signature_sha256'] for e in errors)
          v50=json.loads(Path('.github/codex/FA_V50_SELECTION.json').read_text())
          artifact=json.loads(Path('/tmp/fa-v51-artifact.json').read_text())
          report={
            'schema':'fa-v51-complete-remaining-error-inventory-v1',
            'generated_by_run_id':os.environ['GITHUB_RUN_ID'],
            'generated_from_branch':os.environ['TARGET_BRANCH'],
            'parent_selection_run_id':v50['github_run_id'],
            'parent_selection_head_sha':v50['github_sha'],
            'selected_variant':v50['selected_variant'],
            'selected_source_sha256':source_sha,
            'selected_artifact_id':artifact['id'],
            'selected_artifact_name':artifact['name'],
            'selected_artifact_digest':artifact['digest'],
            'selected_artifact_expired':artifact['expired'],
            'Mock2_exit':int(metric['Mock2_exit']),
            'Mock2_Advanced_exit':int(metric['Mock2_Advanced_exit']),
            'FA_exit':int(metric['FA_exit']),
            'FA_compile_max_errors':int(metric['FA_compile_max_errors']),
            'error_cap_sentinel_present':metric['FA_error_cap_sentinel_present'],
            'inventory_complete_by_header_evidence':metric['FA_inventory_complete_by_header_evidence'],
            'trust_six_zero':metric['source_executable_trust_six_zero'],
            'raw_error_count':len(errors),
            'failing_declaration_count':len(counts),
            'unique_signature_count':len(sigs),
            'errors_by_declaration':dict(sorted(counts.items())),
            'signature_multiplicities':dict(sorted(sigs.items())),
            'diagnostic_log_artifact_path':str(log_path),
            'clean_build_claimed':int(metric['FA_exit'])==0 and len(errors)==0,
            'direct_lean_verified':int(metric['FA_exit'])==0 and len(errors)==0,
            'theorem_statements_changed':False,
            'declaration_order_changed':False,
            'source_moves':[],
            'errors':errors,
          }
          if int(metric['FA_exit'])==0: assert len(errors)==0,errors
          if len(errors)==0: assert int(metric['FA_exit'])==0,metric['FA_exit']
          Path('.github/codex/FA_V51_REMAINING_ERRORS.json').write_text(json.dumps(report,indent=2,sort_keys=True,ensure_ascii=False)+'\n')
          PY

      - name: Commit exact inventory only
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .github/codex/FA_V51_REMAINING_ERRORS.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Codex: record exact FA v51 remaining-error inventory"
          git pull --rebase origin "$TARGET_BRANCH"
          git push origin "HEAD:$TARGET_BRANCH"
