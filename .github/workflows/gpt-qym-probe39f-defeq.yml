name: GPT QYM Probe39f TinvS definitional multiplication micro-matrix

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe39f-defeq.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  micro:
    name: TinvS-defeq ${{ matrix.variant }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        variant: [change-two-terms, change-sum, unfold-mul]
    env:
      OUT: /tmp/qym-probe39f-${{ matrix.variant }}
      TEST: QYM_Probe39f_${{ matrix.variant }}.lean

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1

      - name: Materialize exact definitional test
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$TEST" "${{ matrix.variant }}" <<'PY'
          from pathlib import Path
          import sys
          path = Path(sys.argv[1]); variant = sys.argv[2]
          prelude = '''import Mathlib.Analysis.Complex.UpperHalfPlane.Manifold
          import Mathlib.NumberTheory.Modular
          import Mathlib.NumberTheory.ModularForms.CongruenceSubgroups
          import Mathlib.LinearAlgebra.Matrix.Notation
          import Mathlib.Tactic

          open Matrix Function Set Topology
          open scoped MatrixGroups UpperHalfPlane

          example :
              (ModularGroup.T⁻¹ * ModularGroup.S : SL(2, ℤ)) 0 1 = (-1 : ℤ) := by
            have hInv00 :
                (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 0 = (1 : ℤ) := by
              have h := congrArg (fun g : SL(2, ℤ) => g 0 0)
                (inv_mul_cancel ModularGroup.T)
              norm_num [Matrix.SpecialLinearGroup.coe_mul,
                ModularGroup.T, Matrix.mul_fin_two] at h
              exact h
          __BODY__
          '''.replace("          ", "")
          bodies = {
            "change-two-terms": '''  change
              (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 0 * ModularGroup.S 0 1 +
                (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 1 * ModularGroup.S 1 1 = -1
            norm_num [ModularGroup.S, hInv00]'''.replace("          ", ""),
            "change-sum": '''  change
              (∑ k : Fin 2,
                (ModularGroup.T⁻¹ : SL(2, ℤ)) 0 k * ModularGroup.S k 1) = -1
            rw [show (Finset.univ : Finset (Fin 2)) = {0, 1} by decide]
            norm_num [ModularGroup.S, hInv00]'''.replace("          ", ""),
            "unfold-mul": '''  change
              ((fun i j => ∑ k : Fin 2,
                (ModularGroup.T⁻¹ : SL(2, ℤ)) i k * ModularGroup.S k j)
                0 1) = -1
            norm_num [ModularGroup.S, hInv00]'''.replace("          ", ""),
          }
          path.write_text(prelude.replace("__BODY__", bodies[variant]) + "\n",
                          encoding="utf-8")
          PY
          cp "$TEST" "$OUT/$TEST"

      - name: Direct Lean compile definitional test
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/TEST.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$OUT/TEST.olean" -i "$OUT/TEST.ilean" \
              "$TEST" > "$OUT/TEST.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/TEST.exit"
          rm -f "$TEST"
          exit 0

      - name: Upload definitional evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe39f-${{ matrix.variant }}-${{ github.sha }}
          path: /tmp/qym-probe39f-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless definitional test passes
        if: always()
        shell: bash
        run: |
          test -f "$OUT/TEST.exit"
          test "$(cat "$OUT/TEST.exit")" = 0
          test -s "$OUT/TEST.olean"
          test -s "$OUT/TEST.ilean"
