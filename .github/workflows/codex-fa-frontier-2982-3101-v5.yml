name: Codex FA frontier 2982-3101 v5

on:
  push:
    branches: [codex/fa-qym-cleanbuild-final-20260811-fast]
    paths:
      - .github/workflows/codex-fa-frontier-2982-3101-v5.yml
      - scripts/fa_dynamic_idx2982_remove_no_progress_simp_v1.json
      - scripts/fa_dynamic_cluster_3029_3047_v3.json
      - scripts/fa_dynamic_cluster_3068_3074_v1.json
      - scripts/fa_dynamic_cluster_3088_3089_v1.json
      - scripts/fa_dynamic_cluster_3095_v1.json
      - scripts/fa_dynamic_cluster_3097_3098_v1.json
      - scripts/fa_dynamic_cluster_3100_3101_v1.json
      - scripts/fa_dynamic_apply_staged_library_strict.py
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  statuses: write

concurrency:
  group: codex-fa-frontier-2982-3101-v5
  cancel-in-progress: true

env:
  BASE_RUN_ID: "31522445844"
  BASE_JOB_ID: "93882553099"
  BASE_HEAD_SHA: "80751d936d788fd24702400226dca9df33b2ef88"
  BASE_ARTIFACT_ID: "9113926482"
  BASE_ARTIFACT_NAME: "codex-fa-frontier-2982-star-v2-80751d936d788fd24702400226dca9df33b2ef88"
  BASE_ARTIFACT_SIZE: "1084880"
  BASE_ARTIFACT_DIGEST: "sha256:4a63ef2392e7ab93f185a4a4daf8594ddd79286f5ca2cc4419a94af788d3a92b"
  BASE_SOURCE_SHA256: "38d9442500f5d8d364be32c5eeae9ca00d77e1fa86ca352b36a609300b5ac19d"
  BASE_SOURCE_BYTES: "2707186"
  BASE_SOURCE_LINES: "60691"

jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Attest exact direct-tested post-star source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-2982-3101-v5
          mkdir -p "$OUT" /tmp/fa-2982-3101-v5-base
          gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BASE_RUN_ID}" > "$OUT/base-run.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/jobs/${BASE_JOB_ID}" > "$OUT/base-job.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}" > "$OUT/base-artifact.json"
          gh api "repos/${GITHUB_REPOSITORY}/actions/artifacts/${BASE_ARTIFACT_ID}/zip" > /tmp/fa-2982-3101-v5-base.zip
          test "sha256:$(sha256sum /tmp/fa-2982-3101-v5-base.zip | awk '{print $1}')" = "$BASE_ARTIFACT_DIGEST"
          unzip -q /tmp/fa-2982-3101-v5-base.zip -d /tmp/fa-2982-3101-v5-base
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-2982-3101-v5')
          run=json.loads((out/'base-run.json').read_text()); job=json.loads((out/'base-job.json').read_text()); art=json.loads((out/'base-artifact.json').read_text())
          checks={
            'run': run.get('id')==int(os.environ['BASE_RUN_ID']) and run.get('head_sha')==os.environ['BASE_HEAD_SHA'] and run.get('status')=='completed' and run.get('conclusion')=='failure',
            'job': job.get('id')==int(os.environ['BASE_JOB_ID']) and job.get('run_id')==int(os.environ['BASE_RUN_ID']) and job.get('status')=='completed' and job.get('conclusion')=='failure',
            'artifact': art.get('id')==int(os.environ['BASE_ARTIFACT_ID']) and art.get('name')==os.environ['BASE_ARTIFACT_NAME'] and art.get('size_in_bytes')==int(os.environ['BASE_ARTIFACT_SIZE']) and art.get('digest')==os.environ['BASE_ARTIFACT_DIGEST'] and art.get('expired') is False,
          }
          if not all(checks.values()): raise SystemExit('base metadata attestation failed: '+repr([k for k,v in checks.items() if not v]))
          ms=list(Path('/tmp/fa-2982-3101-v5-base').rglob('METRIC.json')); m=json.loads(ms[0].read_text())
          if not (m.get('Mock2_exit')==0 and m.get('Mock2_Advanced_exit')==0 and m.get('FA_exit')==1 and m.get('all_required_lean_executed') is True and m.get('FA_error_declaration_index')==2982 and m.get('source_sha256')==os.environ['BASE_SOURCE_SHA256'] and m.get('source_identity_locked_after_materialization') is True and m.get('public_declaration_headers_preserved') is True and m.get('declaration_sequence_preserved') is True): raise SystemExit('base direct metric gate failed')
          valid=[]
          for p in Path('/tmp/fa-2982-3101-v5-base').rglob('Mock2_FunctionalAnalysis.lean'):
            if 'PrimalitySheafVerification' not in p.as_posix(): continue
            b=p.read_bytes()
            if hashlib.sha256(b).hexdigest()==os.environ['BASE_SOURCE_SHA256'] and len(b)==int(os.environ['BASE_SOURCE_BYTES']) and len(b.decode('utf-8').splitlines())==int(os.environ['BASE_SOURCE_LINES']) and b'\r' not in b: valid.append(p)
          if not valid: raise SystemExit('exact direct-tested post-star source missing')
          p=min(valid,key=lambda x:(len(x.parts),x.as_posix())); (out/'BASE_SOURCE.txt').write_text(str(p.resolve())+'\n'); (out/'BASE_METRIC.json').write_text(json.dumps(m,ensure_ascii=False,indent=2,sort_keys=True)+'\n')
          PY

      - name: Apply strict root batches through idx3101
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-2982-3101-v5
          base="$(cat "$OUT/BASE_SOURCE.txt")"
          apply_one() {
            tag="$1"; lib="$2"; next="/tmp/fa-v5-${tag}.lean"
            python3 scripts/fa_dynamic_apply_staged_library_strict.py --base-source "$base" --library "$lib" --no-environment --target "$next" --audit-out "$OUT/PREPARATION_${tag}.json"
            base="$next"
          }
          apply_one I2982 scripts/fa_dynamic_idx2982_remove_no_progress_simp_v1.json
          apply_one R3047 scripts/fa_dynamic_cluster_3029_3047_v3.json
          apply_one R3074 scripts/fa_dynamic_cluster_3068_3074_v1.json
          apply_one R3089 scripts/fa_dynamic_cluster_3088_3089_v1.json
          apply_one R3095 scripts/fa_dynamic_cluster_3095_v1.json
          apply_one R3098 scripts/fa_dynamic_cluster_3097_3098_v1.json
          apply_one R3101 scripts/fa_dynamic_cluster_3100_3101_v1.json
          cp "$base" PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          cp "$base" "$OUT/Mock2_FunctionalAnalysis-candidate.lean"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os
          out=Path('build-logs/codex-fa-frontier-2982-3101-v5'); tags=('I2982','R3047','R3074','R3089','R3095','R3098','R3101'); audits=[json.loads((out/f'PREPARATION_{t}.json').read_text()) for t in tags]
          for a in audits:
            if not (a['public_declaration_headers_preserved'] and a['declaration_sequence_preserved'] and a['strict_staged_header_hash_check']['passed']): raise SystemExit('strict semantic audit failed')
          p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); b=p.read_bytes(); s=b.decode('utf-8'); ident={'sha256':hashlib.sha256(b).hexdigest(),'bytes':len(b),'lines':len(s.splitlines()),'repair_indices':[x['declaration_index'] for a in audits for x in a['proof_replacements_applied']]}; (out/'CANDIDATE_IDENTITY.json').write_text(json.dumps(ident,indent=2,sort_keys=True)+'\n')
          with Path(os.environ['GITHUB_ENV']).open('a') as f: f.write('CANDIDATE_SHA='+ident['sha256']+'\nCANDIDATE_BYTES='+str(ident['bytes'])+'\nCANDIDATE_LINES='+str(ident['lines'])+'\n')
          PY

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          OUT=build-logs/codex-fa-frontier-2982-3101-v5
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none > "$OUT/elan-init.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"; elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain-install.log" 2>&1; lean --version | tee "$OUT/lean-version.txt"; lake --version | tee "$OUT/lake-version.txt"; lake exe cache get > "$OUT/cache-get.log" 2>&1

      - name: Direct full-source cumulative diagnostic compile
        id: direct
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"; OUT=build-logs/codex-fa-frontier-2982-3101-v5; mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() { stem="$1"; cap="$2"; src="PrimalitySheafVerification/${stem}.lean"; o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"; i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"; rm -f "$o" "$i"; : > "$OUT/${stem}.executed"; printf 'lake env lean -DmaxErrors=%s -DwarningAsError=false -o %q -i %q %q\n' "$cap" "$o" "$i" "$src" > "$OUT/${stem}.command"; set +e; lake env lean "-DmaxErrors=${cap}" -DwarningAsError=false -o "$o" -i "$i" "$src" > "$OUT/${stem}.log" 2>&1; c=$?; set -e; echo "$c" > "$OUT/${stem}.exit"; }
          compile_one Mock2 3; compile_one Mock2_Advanced 3
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"; test "$(wc -c < PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" -eq "$CANDIDATE_BYTES"
          compile_one Mock2_FunctionalAnalysis 512
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$CANDIDATE_SHA"
          python3 - <<'PY'
          from pathlib import Path
          from bisect import bisect_right
          import hashlib,json,os,re
          out=Path('build-logs/codex-fa-frontier-2982-3101-v5'); p=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'); s=p.read_text(); ds=list(re.finditer(r'(?m)^(?:protected\s+|private\s+|noncomputable\s+)?(?:theorem|lemma|def|abbrev|instance|structure|class)\s+(?P<name>[^\s(:]+)',s)); starts=[s.count('\n',0,m.start())+1 for m in ds]; er=re.compile(r'^.+?\.lean:(\d+):(\d+): error(?:\([^)]+\))?:(.*)$'); es=[]
          for raw in (out/'Mock2_FunctionalAnalysis.log').read_text(errors='replace').splitlines():
            m=er.match(raw)
            if m: ln=int(m.group(1)); j=bisect_right(starts,ln)-1; es.append({'line':ln,'col':int(m.group(2)),'message':m.group(3).strip(),'declaration':ds[j].group('name') if j>=0 else None,'declaration_index':j if j>=0 else None,'declaration_start_line':starts[j] if j>=0 else None})
          ex={x:int((out/f'{x}.exit').read_text()) for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')}; first=es[0] if es else {}; b=p.read_bytes(); ident=json.loads((out/'CANDIDATE_IDENTITY.json').read_text()); metric={'schema':'fa-frontier-2982-3101-v5','run_id':os.environ['GITHUB_RUN_ID'],'head_sha':os.environ['GITHUB_SHA'],'source_sha256':hashlib.sha256(b).hexdigest(),'source_bytes':len(b),'source_lines':len(s.splitlines()),'source_identity_locked_after_materialization':hashlib.sha256(b).hexdigest()==os.environ['CANDIDATE_SHA'],'Mock2_executed':(out/'Mock2.executed').exists(),'Mock2_exit':ex['Mock2'],'Mock2_Advanced_executed':(out/'Mock2_Advanced.executed').exists(),'Mock2_Advanced_exit':ex['Mock2_Advanced'],'FA_executed':(out/'Mock2_FunctionalAnalysis.executed').exists(),'FA_exit':ex['Mock2_FunctionalAnalysis'],'all_required_lean_executed':all((out/f'{x}.executed').exists() for x in ('Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis')),'FA_error_headers_captured':len(es),'FA_first_actual_error_line':first.get('line'),'FA_first_actual_error_col':first.get('col'),'FA_first_error_declaration':first.get('declaration'),'FA_error_declaration_index':first.get('declaration_index'),'FA_first_error_message':first.get('message'),'repair_declaration_indices':ident['repair_indices'],'public_declaration_headers_preserved':True,'declaration_sequence_preserved':True,'maxErrors_cap':512}; (out/'METRIC.json').write_text(json.dumps(metric,ensure_ascii=False,indent=2,sort_keys=True)+'\n'); (out/'ERROR_HEADERS.json').write_text(json.dumps(es,ensure_ascii=False,indent=2)+'\n')
          PY
          echo "fa_exit=$(cat "$OUT/Mock2_FunctionalAnalysis.exit")" >> "$GITHUB_OUTPUT"; exit 0

      - name: Upload exact candidate and evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-frontier-2982-3101-v5-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-frontier-2982-3101-v5
          if-no-files-found: warn
          retention-days: 30

      - name: Publish locator
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          state=failure; [[ "${FA_EXIT:-}" == 0 ]] && state=success
          gh api --method POST "repos/${GITHUB_REPOSITORY}/statuses/${GITHUB_SHA}" -f state="$state" -f context='codex/fa-frontier-2982-3101-v5' -f description="run=${GITHUB_RUN_ID} FA=${FA_EXIT:-infra}" -f target_url="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}"

      - name: Preserve FA exit
        if: always()
        env:
          FA_EXIT: ${{ steps.direct.outputs.fa_exit }}
        shell: bash
        run: |
          test -n "${FA_EXIT:-}" || exit 86
          exit "$FA_EXIT"
