name: Finalize focused direct-source PASS v4

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.ci/focused/focused_direct_pass_v4.json'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: finalize-focused-direct-source-v4
  cancel-in-progress: false

jobs:
  finalize:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      BRANCH: fix/primality-sheaf-clean-build
      MARKER: .ci/focused/focused_direct_pass_v4.json
      REPORT: .ci/focused/focused_final_report_v4.md

    steps:
      - name: Clone exact PASS-marker snapshot
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${GITHUB_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          test -f "${MARKER}"

      - name: Validate final marker and PR safety state
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - "${MARKER}" <<'PY'
          import json, sys
          x=json.load(open(sys.argv[1]))
          assert x['overall_focused_status']=='PASS'
          assert x['runtime_source_repair'] is False
          assert x['source_mutation_during_verification'] is False
          assert x['clean_pass_1']==0 and x['clean_pass_2']==0
          assert x['error_count']==0
          assert x['missing_project_object_files']==0
          assert x['forbidden_tokens']==0
          assert x['sorry']==0 and x['admit']==0 and x['sorryAx']==0
          assert x['unsafe']==0 and x['native_decide']==0 and x['Lean.ofReduceBool']==0
          assert x['nonstandard_axioms']==[]
          assert x['theorem_statements_changed'] is False
          assert x['assumptions_changed'] is False
          assert x['mock2_regression']=='PASS'
          for module in ['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis_Integrated','Mock2_FunctionalAnalysis','QYM']:
              assert module in x['sources'] and module in x['artifacts']
              assert len(x['sources'][module]['sha256'])==64
              assert len(x['artifacts'][module]['olean_sha256'])==64
              assert len(x['artifacts'][module]['ilean_sha256'])==64
          PY
          curl -fsSL \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/7" \
            -o /tmp/pr7.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pr7.json'))
          assert p['state']=='open'
          assert p['draft'] is True
          assert p['merged_at'] is None
          assert p['head']['ref']=='fix/primality-sheaf-clean-build'
          assert p['base']['ref']=='master'
          PY

      - name: Generate persistent focused completion report
        shell: bash
        run: |
          set -euo pipefail
          python3 - "${MARKER}" "${REPORT}" <<'PY'
          from pathlib import Path
          import json, sys
          x=json.load(open(sys.argv[1]))
          lines=[
            '# Focused Mock2 Advanced / FunctionalAnalysis / QYM direct-source PASS v4',
            '',
            f"- Final verified source commit: `{x['verified_commit']}`",
            f"- Base master SHA: `{x['base_master_sha']}`",
            f"- Workflow run: {x.get('workflow_run')}",
            '- PR #7 safety state at finalization: open, draft, unmerged, base `master`',
            '- Runtime source repair in final CI: **no**',
            '- Clean compile pass 1: `0`',
            '- Clean compile pass 2: `0`',
            '- Lean error count: `0`',
            '- Missing project object files: `0`',
            '- Forbidden proof escapes: `0`',
            '- `sorryAx`: `0`',
            f"- Observed axioms: `{', '.join(x['observed_axioms'])}`",
            '- Nonstandard/user axioms: `0`',
            '- Theorem conclusions changed: no',
            '- Assumptions added: no',
            '- Mock2 regression: PASS',
            '',
            '## Source and object hashes',
            '',
            '| Module | Source SHA-256 | `.olean` SHA-256 | `.ilean` SHA-256 | Warnings across two passes |',
            '|---|---|---|---|---:|',
          ]
          order=['Mock2','Mock2_Advanced','Mock2_FunctionalAnalysis_Integrated','Mock2_FunctionalAnalysis','QYM']
          for module in order:
            s=x['sources'][module]; a=x['artifacts'][module]
            lines.append(
              f"| `{module}` | `{s['sha256']}` | `{a['olean_sha256']}` | `{a['ilean_sha256']}` | {s['warnings_across_two_passes']} |"
            )
          lines += [
            '',
            '## Boundary integrity',
            '',
            f"- FunctionalAnalysis Integrated boundary: {x['integrated_boundary']}",
            f"- QYM conditional certificate boundary: {x['qym_conditional_certificate_boundary']}",
            '- The historical `Mock2_FunctionalAnalysis` import path remains a compatibility entry to the substantive Integrated source.',
            '',
            'This report covers only the focused three-root objective. The 13-root clean sequence, `BuildAll`, second clean sequence, and the 15 final audits remain a later phase.',
          ]
          Path(sys.argv[2]).write_text('\n'.join(lines)+'\n')
          PY
          git diff --check

      - name: Commit report without changing PR draft state
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${REPORT}"
          git commit -m 'docs: record focused direct-source PASS v4'
          remote_head="$(git ls-remote origin "refs/heads/${BRANCH}" | awk '{print $1}')"
          if [[ "${remote_head}" != "${GITHUB_SHA}" ]]; then
            git fetch origin "${BRANCH}"
            git rebase "${remote_head}"
          fi
          git push origin "HEAD:${BRANCH}"

      - name: Append focused milestone to PR body
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          pr=json.load(open('/tmp/pr7.json'))
          marker='## Focused M2A / FunctionalAnalysis / QYM direct-source PASS v4'
          section='''## Focused M2A / FunctionalAnalysis / QYM direct-source PASS v4

The PR remains draft and unmerged. The 13-module/BuildAll/final-audit phase has not been started by this focused finalizer.
'''
          body=pr.get('body') or ''
          if marker in body:
              body=body.split(marker,1)[0].rstrip()+'\n\n'+section
          else:
              body=body.rstrip()+'\n\n'+section
          open('/tmp/pr-update.json','w').write(json.dumps({'body':body}))
          PY
          curl -fsSL -X PATCH \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H 'Accept: application/vnd.github+json' \
            -H 'Content-Type: application/json' \
            --data-binary @/tmp/pr-update.json \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/pulls/7" \
            -o /tmp/pr7-updated.json
          python3 - <<'PY'
          import json
          p=json.load(open('/tmp/pr7-updated.json'))
          assert p['state']=='open' and p['draft'] is True and p['merged_at'] is None
          PY
