name: FunctionalAnalysis pass316 x86 diagnostic

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - 'scripts/apply_three_hundred_sixteenth_pass_functional_analysis_repairs.py'
      - '.github/workflows/fa-pass316-x86-diagnostic.yml'
  pull_request:
    branches: [master]
    paths:
      - 'scripts/apply_three_hundred_sixteenth_pass_functional_analysis_repairs.py'
      - '.github/workflows/fa-pass316-x86-diagnostic.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: fa-pass316-x86-diagnostic
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
      HEAD_BRANCH: ${{ github.event.pull_request.head.ref || github.ref_name }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      ADVANCED: PrimalitySheafVerification/Mock2_Advanced.lean
      FA: PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/fa-pass316-x86-diagnostic
      ADVANCED_BASELINE_COMMIT: 623dfac27a24c170330d6218005e67b06490b814
      EXPECTED_MOCK2_BLOB: 94f8894b5f866701955a105044b8958a8deb7734
      EXPECTED_ADVANCED_BLOB: a60fa47ebcd8c1fb6037d705e81b54c80910657a
      EXPECTED_ADVANCED_BASELINE_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_FA_BASELINE_BLOB: 4eedc43d57f96b45897990bbeaada01ee0fd3b84
      EXPECTED_PRE313_SHA256: 7048e0cd364ff150a79b4696b08db0c3a29aa29dc252d623650818f59f6162ca
      EXPECTED_FA_PASS316_SHA256: 9b552874009b704b4ae0b920d9dba26d6e1b1283ca3745649a89d19a9319dc27

    steps:
      - name: Clone exact branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "${HEAD_BRANCH}" = "${BRANCH}"
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${HEAD_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${HEAD_SHA}"
          test "$(git hash-object "${MOCK2}")" = "${EXPECTED_MOCK2_BLOB}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_BLOB}"
          test "$(git hash-object "${FA}")" = "${EXPECTED_FA_BASELINE_BLOB}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/source" "${OUTDIR}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "head_sha=${HEAD_SHA}" \
            "head_branch=${HEAD_BRANCH}" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Reproduce pass316 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "${ADVANCED}" /tmp/Mock2_Advanced.final.lean
          git fetch --depth=1 origin "${ADVANCED_BASELINE_COMMIT}"
          git show "${ADVANCED_BASELINE_COMMIT}:${ADVANCED}" > "${ADVANCED}"
          test "$(git hash-object "${ADVANCED}")" = "${EXPECTED_ADVANCED_BASELINE_BLOB}"

          pre313_scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
          )
          for script in "${pre313_scripts[@]}"; do
            echo "===== ${script} ====="
            python3 "scripts/${script}"
          done 2>&1 | tee "${EVIDENCE}/logs/pre313-application.log"
          test "$(sha256sum "${FA}" | awk '{print $1}')" = "${EXPECTED_PRE313_SHA256}"

          for script in \
            apply_three_hundred_thirteenth_pass_repairs.py \
            apply_three_hundred_fourteenth_pass_repairs.py \
            apply_three_hundred_fifteenth_pass_repairs.py \
            apply_three_hundred_sixteenth_pass_functional_analysis_repairs.py; do
            echo "===== ${script} ====="
            python3 "scripts/${script}"
          done 2>&1 | tee "${EVIDENCE}/logs/pass313-316-application.log"

          cp /tmp/Mock2_Advanced.final.lean "${ADVANCED}"
          while IFS= read -r changed; do
            if [[ -n "${changed}" && "${changed}" != "${FA}" ]]; then
              git restore --source=HEAD --worktree -- "${changed}"
            fi
          done < <(git diff --name-only)
          test "$(git diff --name-only)" = "${FA}"
          git diff --check
          test "$(sha256sum "${FA}" | awk '{print $1}')" = "${EXPECTED_FA_PASS316_SHA256}"
          cp "${FA}" "${EVIDENCE}/source/Mock2_FunctionalAnalysis.pass316.lean"
          sha256sum "${FA}" | tee -a "${EVIDENCE}/snapshot.txt"

      - name: Static trust audit
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${EVIDENCE}/trust-audit.txt"
          from pathlib import Path
          import re
          src = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean").read_text(encoding="utf-8")
          out=[]; i=0; depth=0; string=False; esc=False
          while i < len(src):
              if depth:
                  if src.startswith('/-', i): depth += 1; out += [' ',' ']; i += 2
                  elif src.startswith('-/', i): depth -= 1; out += [' ',' ']; i += 2
                  else: out.append('\n' if src[i] == '\n' else ' '); i += 1
              elif string:
                  c=src[i]; out.append('\n' if c == '\n' else ' ')
                  if esc: esc=False
                  elif c == '\\': esc=True
                  elif c == '"': string=False
                  i += 1
              elif src.startswith('/-', i): depth=1; out += [' ',' ']; i += 2
              elif src.startswith('--', i):
                  while i < len(src) and src[i] != '\n': out.append(' '); i += 1
              elif src[i] == '"': string=True; out.append(' '); i += 1
              else: out.append(src[i]); i += 1
          code=''.join(out)
          patterns={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for name, pattern in patterns.items():
              count=len(re.findall(pattern, code)); print(f'{name}={count}'); bad |= count != 0
          if depth or string or bad: raise SystemExit(1)
          PY

      - name: Install exact Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Compile dependencies and expose full FA frontier
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          compile_one() {
            local module="$1" log="${EVIDENCE}/logs/${1}.log" code errors
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean -DmaxErrors=500 "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" -i "${OUTDIR}/${module}.ilean" \
              >"${log}" 2>&1
            code=$?
            set -e
            errors="$(grep -c 'error:' "${log}" || true)"
            printf '%s,%s,%s\n' "${module}" "${code}" "${errors}" \
              | tee -a "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              grep -n 'error:' "${log}" | head -60 | tee "${EVIDENCE}/logs/${module}-first-errors.txt" || true
              grep -n 'error:' "${log}" | tail -20 | tee "${EVIDENCE}/logs/${module}-last-errors.txt" || true
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
          }
          : > "${EVIDENCE}/compile-summary.csv"
          compile_one Mock2
          compile_one Mock2_Advanced
          compile_one Mock2_FunctionalAnalysis

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa-pass316-x86-diagnostic-${{ env.HEAD_SHA }}
          path: /tmp/fa-pass316-x86-diagnostic
          if-no-files-found: warn
          retention-days: 30
