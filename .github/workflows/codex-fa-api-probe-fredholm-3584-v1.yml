name: Codex FA API probe Fredholm 3584 v1
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-api-probe-fredholm-3584-v1.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Install pinned Lean and cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/dev/null
          export PATH="$HOME/.elan/bin:$PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/dev/null
          lake exe cache get >/dev/null
      - name: Print and compile Fredholm API probes
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          cat >/tmp/Fredholm3584Probe.lean <<'LEAN'
          import Mathlib
          #check ContinuousLinearMap.isUniformEmbedding_of_bound
          #check totallyBounded_image_iff
          #check FiniteDimensional.of_totallyBounded_nhds_zero
          #check Metric.closedBall_mem_nhds
          #check IsCompactOperator.isCompact_closure_image_closedBall
          noncomputable section
          variable {X Y : Type*}
          variable [NormedAddCommGroup X] [NormedSpace ℂ X]
          variable [NormedAddCommGroup Y] [NormedSpace ℂ Y]

          example (R : Y →L[ℂ] X) (hRbound : ∀ u, ‖u‖ ≤ (1 : ℝ) * ‖R u‖) :
              IsUniformEmbedding R := by
            exact R.isUniformEmbedding_of_bound hRbound
          LEAN
          lake env lean /tmp/Fredholm3584Probe.lean
