name: Codex FA after3387 adjoint graph v5
on:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-after3387-adjoint-graph-v5.yml
  workflow_dispatch:
permissions:
  actions: read
  contents: read
jobs:
  frontier:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact trigger commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Build current-source projection-normalized runner
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          src = Path('scripts/codex_fa_after3387_adjoint_graph_v4.sh').read_text()
          src = src.replace('codex-fa-after3387-adjoint-graph-v4', 'codex-fa-after3387-adjoint-graph-v5')
          old_script = '''old="""    intro x
              rw [← hy', ← hz']
              exact ((LinearPMap.adjoint_isFormalAdjoint hDense).symm x y').symm"""
          new="""    intro x
              change ((y' : F) = y) at hy'
              change (((T.adjoint hDense : F → E) y') = z) at hz'
              rw [← hy', ← hz']
              exact ((LinearPMap.adjoint_isFormalAdjoint hDense).symm x y').symm"""'''
          new_script = '''old="""    rw [← hy', ← hz']
              exact ((LinearPMap.adjoint_isFormalAdjoint hDense).symm x y').symm"""
          new="""    change ((y' : F) = y) at hy'
              change (T† y' = z) at hz'
              rw [← hy', ← hz']
              exact ((LinearPMap.adjoint_isFormalAdjoint hDense).symm x y').symm"""'''
          assert src.count(old_script) == 1, src.count(old_script)
          src = src.replace(old_script, new_script, 1)
          Path('/tmp/codex_fa_after3387_adjoint_graph_v5.sh').write_text(src)
          PY
      - name: Attest, patch, and direct-compile exact full source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: bash /tmp/codex_fa_after3387_adjoint_graph_v5.sh
      - name: Upload exact evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-after3387-adjoint-graph-v5-${{ github.sha }}
          path: |
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            build-logs/codex-fa-after3387-adjoint-graph-v5
          retention-days: 30
      - name: Preserve FA direct exit
        if: always()
        shell: bash
        run: |
          test -f build-logs/codex-fa-after3387-adjoint-graph-v5/Mock2_FunctionalAnalysis.exit || exit 86
          exit "$(cat build-logs/codex-fa-after3387-adjoint-graph-v5/Mock2_FunctionalAnalysis.exit)"
