name: QYM GB2 master-registered direct Lean v1

on:
  push:
    branches:
      - master
    paths:
      - .github/qym-gb2-master-trigger.txt
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: qym-gb2-master-registered-direct-v1
  cancel-in-progress: false

env:
  SOURCE_BRANCH: gpt/qym-gb5-semantic-round4-matrix-20260820
  OUT: /tmp/qym-gb2-master-route

jobs:
  direct-qym:
    name: exact GB2 two-blocker patch and full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Check out authoritative QYM branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ env.SOURCE_BRANCH }}
          fetch-depth: 0

      - name: Restore exact dependency objects when available
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v5-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-deps-v5-${{ runner.os }}-
            qym-deps-v4-${{ runner.os }}-
            qym-deps-v3-${{ runner.os }}-
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Run actual full-QYM direct Lean verifier
        shell: bash
        run: bash .github/run_qym_gb2_direct.sh

      - name: Upload immutable compiler evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb2-master-route-${{ github.run_id }}
          path: ${{ env.OUT }}
          if-no-files-found: warn
          retention-days: 30
