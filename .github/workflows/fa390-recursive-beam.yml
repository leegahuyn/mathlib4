name: PASS 390 recursive beam and extended downstream repair

on:
  push:
    branches:
      - fix/fa390-recursive-beam-20260809
    paths:
      - '.github/workflows/fa390-recursive-beam.yml'
      - 'scripts/fa389_declaration_beam_solver.py'
      - 'scripts/fa390_select_and_verify.py'
      - 'scripts/fa383_select_and_verify.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

jobs:
  recursive-beam-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout latest PASS 390 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa390-recursive-beam-20260809
          fetch-depth: 3000
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Continue declaration beam search
        id: beam
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA389_MODELS: 'openai/gpt-5,openai/o3,openai/o4-mini,openai/gpt-5-mini,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,xai/grok-3-mini,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411,qwen/Qwen3-235B-A22B,microsoft/MAI-DS-R1'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf /tmp/fa390-beam
          mkdir -p /tmp/fa390-beam
          python3 scripts/fa389_declaration_beam_solver.py \
            --output-dir /tmp/fa390-beam \
            --max-frontiers 10 \
            --beam-size 16 \
            --query-workers 8 \
            --compile-workers 2 \
            > /tmp/fa390-beam/console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa390-beam/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Select best source and run extended required-order repair
        id: verify
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA390_DOWNSTREAM_FRONTIERS: '24'
          FA383_VERIFY_MODELS: 'openai/gpt-5,openai/o3,openai/o4-mini,openai/gpt-5-mini,openai/gpt-4.1,openai/gpt-4o,xai/grok-3,xai/grok-3-mini,deepseek/DeepSeek-V3-0324,mistral-ai/Mistral-Large-2411,qwen/Qwen3-235B-A22B,microsoft/MAI-DS-R1'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa390-aggregate
          mkdir -p build-logs/fa390-aggregate
          python3 scripts/fa390_select_and_verify.py \
            --candidates-root /tmp/fa390-beam \
            --evidence-dir build-logs/fa390-aggregate \
            > build-logs/fa390-aggregate/console.log 2>&1
          rc=$?
          set -e
          cat build-logs/fa390-aggregate/console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Generate authoritative PASS 390 status
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa390-aggregate
          for f in best-metric.json state.json history.json;do test -f "/tmp/fa390-beam/${f}"&&cp "/tmp/fa390-beam/${f}" "${d}/beam-${f}";done
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json
          d=Path('build-logs/fa390-aggregate');p=d/'FINAL_STATUS.json'
          s=json.loads(p.read_text()) if p.exists() else {'complete':False,'stage':'missing-final-status'}
          marker=(d/'ALL_REQUIRED_TARGETS_2X_PASS').exists();s['beam_exit_code']='${{ steps.beam.outputs.exit_code }}';s['verify_exit_code']='${{ steps.verify.outputs.exit_code }}';s['marker_exists']=marker;s['authoritative_complete']=bool(s.get('complete') and marker and s['verify_exit_code']=='0')
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          s['sources']={str(x):hashlib.sha256(x.read_bytes()).hexdigest() for x in targets if x.exists()}
          (d/'AUTHORITATIVE_STATUS.json').write_text(json.dumps(s,indent=2))
          lines=[f"authoritative_complete={str(s['authoritative_complete']).lower()}",f"beam_exit_code={s['beam_exit_code']}",f"verify_exit_code={s['verify_exit_code']}",f"stage={s.get('stage')}",f"marker_exists={str(marker).lower()}"]
          if s.get('metric') is not None:lines.append(f"metric={json.dumps(s['metric'],sort_keys=True)}")
          for m in s.get('modules',[]):lines.append(f"{m.get('module')}={m.get('status')} sha256={m.get('source_sha256')}")
          (d/'AUTHORITATIVE_STATUS.txt').write_text('\n'.join(lines)+'\n')
          PY
          cat "${d}/AUTHORITATIVE_STATUS.txt"

      - name: Audit all required sources
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import json,re
          targets=[Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'),Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'),*sorted(Path('PrimalitySheafVerification').glob('Mock3*.lean')),Path('PrimalitySheafVerification/QYM.lean')]
          pats={'sorry':r'\bsorry\b','admit':r'\badmit\b','global_axiom':r'(?m)^\s*(?:public\s+)?axiom\b','unsafe':r'(?m)^\s*unsafe\b','native_decide':r'\bnative_decide\b','Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          def strip(t):
            o=[];i=0;d=0;s=False;e=False
            while i<len(t):
              if d:
                if t.startswith('/-',i):d+=1;o.extend('  ');i+=2;continue
                if t.startswith('-/',i):d-=1;o.extend('  ');i+=2;continue
                o.append('\n' if t[i]=='\n' else ' ');i+=1;continue
              if s:
                c=t[i];o.append('\n' if c=='\n' else ' ')
                if e:e=False
                elif c=='\\':e=True
                elif c=='"':s=False
                i+=1;continue
              if t.startswith('/-',i):d=1;o.extend('  ');i+=2;continue
              if t.startswith('--',i):
                while i<len(t) and t[i]!='\n':o.append(' ');i+=1
                continue
              if t[i]=='"':s=True;o.append(' ');i+=1;continue
              o.append(t[i]);i+=1
            return ''.join(o)
          report={}
          for p in targets:
            if p.exists():
              c=strip(p.read_text());report[str(p)]={k:len(re.findall(v,c)) for k,v in pats.items()}
          Path('build-logs/fa390-aggregate/FORBIDDEN_TOKEN_AUDIT.json').write_text(json.dumps(report,indent=2));bad={p:c for p,c in report.items() if any(c.values())}
          if bad:raise SystemExit(bad)
          PY

      - name: Commit isolated PASS 390 state
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]';git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean;do test -e "${p}"&&git add "${p}";done
          git add build-logs/fa390-aggregate/AUTHORITATIVE_STATUS.json build-logs/fa390-aggregate/AUTHORITATIVE_STATUS.txt build-logs/fa390-aggregate/FORBIDDEN_TOKEN_AUDIT.json
          for p in build-logs/fa390-aggregate/ALL_REQUIRED_TARGETS_2X_PASS build-logs/fa390-aggregate/FINAL_STATUS.json build-logs/fa390-aggregate/fa-selection.json build-logs/fa390-aggregate/beam-best-metric.json build-logs/fa390-aggregate/beam-state.json;do test -f "${p}"&&git add "${p}";done
          git diff --cached --quiet&&exit 0
          if test -f build-logs/fa390-aggregate/ALL_REQUIRED_TARGETS_2X_PASS;then msg='fix: obtain recursive-beam FA Integrated Mock3 QYM 2x PASS';else msg='fix: preserve best PASS 390 recursive frontier';fi
          git commit -m "${msg}";git push origin HEAD:fix/fa390-recursive-beam-20260809

      - name: Upload PASS 390 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa390-recursive-beam-${{ github.sha }}
          path: |
            /tmp/fa390-beam
            build-logs/fa390-aggregate
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce final PASS 390 result
        if: always()
        shell: bash
        env:
          VERIFY_EXIT_CODE: ${{ steps.verify.outputs.exit_code }}
        run: |
          test -n "${VERIFY_EXIT_CODE:-}"
          test -f build-logs/fa390-aggregate/ALL_REQUIRED_TARGETS_2X_PASS
          exit "${VERIFY_EXIT_CODE}"
