name: FA419 hash-selected PASS376 proof transplant and final gate

on:
  push:
    branches:
      - ops/fa419-hash-selected-proof-transplant-20260809
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ACTIVE_BRANCH: 'ops/fa419-hash-selected-proof-transplant-20260809'
  ARTIFACT_ID: '9024606745'
  EXPECTED_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  PASS376_HEAD: '71227bd1ba88c99f9a535df044fd37041bcf2304'
  BASE_CHAMPION_BRANCH: 'champion/fa-pass376-31725-07f6efd-20260809'

jobs:
  transplant-and-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout FA419 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/fa419-hash-selected-proof-transplant-20260809
          fetch-depth: 2200
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Select the unique artifact file by exact SHA256
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/fa419-artifact /tmp/fa419.zip
          mkdir -p /tmp/fa419-artifact
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/fa419.zip
          unzip -q /tmp/fa419.zip -d /tmp/fa419-artifact

          matches=()
          while IFS= read -r -d '' file; do
            actual=$(sha256sum "$file" | awk '{print $1}')
            if test "$actual" = "$EXPECTED_SHA256"; then
              matches+=("$file")
            fi
          done < <(find /tmp/fa419-artifact -type f -print0)

          if test "${#matches[@]}" -ne 1; then
            printf 'expected one SHA-matched source; found %s\n' "${#matches[@]}" >&2
            exit 70
          fi
          cp "${matches[0]}" /tmp/fa419-baseline.lean
          test "$(sha256sum /tmp/fa419-baseline.lean | awk '{print $1}')" = "$EXPECTED_SHA256"
          test "$(wc -l < /tmp/fa419-baseline.lean)" -ge 31725
          cp /tmp/fa419-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean

      - name: Ensure immutable checked-in baseline champion exists
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$BASE_CHAMPION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$BASE_CHAMPION_BRANCH"
            git show "FETCH_HEAD:PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean" > /tmp/fa419-existing.lean
            test "$(sha256sum /tmp/fa419-existing.lean | awk '{print $1}')" = "$EXPECTED_SHA256"
          else
            git switch --detach "$PASS376_HEAD"
            git switch -c "$BASE_CHAMPION_BRANCH"
            cp /tmp/fa419-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            mkdir -p champion-records/fa-pass376-31725
            cat > champion-records/fa-pass376-31725/FA419-BASELINE.json <<'EOF'
          {
            "source_sha256": "07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4",
            "origin_run_id": 31267332510,
            "origin_artifact_id": 9024606745,
            "claimed_frontier": 31725,
            "authority": "direct Lean compile metric"
          }
          EOF
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              champion-records/fa-pass376-31725/FA419-BASELINE.json
            git commit -m 'chore: check in hash-selected PASS376 champion [skip ci]'
            git push origin "HEAD:refs/heads/${BASE_CHAMPION_BRANCH}"
          fi
          git switch -f "$ACTIVE_BRANCH"
          cp /tmp/fa419-baseline.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$EXPECTED_SHA256"

      - name: Run same-signature line-stable proof transplant tournament
        id: transplant
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa418_local_proof_transplant.py
          rc=$?
          export TRANSPLANT_RC="$rc"
          if test -f build-logs/fa418-local-proof-transplant/RESULT.json; then
            python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          from pathlib import Path
          r=json.loads(Path('build-logs/fa418-local-proof-transplant/RESULT.json').read_text())
          m=r.get('final_metric', {})
          print('strictly_improved=' + ('1' if r.get('strictly_improved') else '0'))
          print('final_passed=' + ('1' if r.get('final_passed') else '0'))
          print('final_sha256=' + str(r.get('final_sha256','')))
          print('final_first_error=' + str(m.get('first_error_line',0)))
          print('transplant_rc=' + os.environ['TRANSPLANT_RC'])
          PY
          else
            echo 'strictly_improved=0' >> "$GITHUB_OUTPUT"
            echo 'final_passed=0' >> "$GITHUB_OUTPUT"
            echo 'final_sha256=' >> "$GITHUB_OUTPUT"
            echo 'final_first_error=0' >> "$GITHUB_OUTPUT"
            echo "transplant_rc=$rc" >> "$GITHUB_OUTPUT"
          fi
          exit 0

      - name: Run fresh ordered final gate only when transplanted FA reaches exit 0
        id: gate
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          if test "${{ steps.transplant.outputs.final_passed }}" = '1'; then
            bash scripts/fa419_ordered_gate.sh \
              build-logs/fa418-local-proof-transplant/PROMOTED_SOURCE.lean \
              build-logs/fa419-ordered-final-gate
            rc=$?
          else
            mkdir -p build-logs/fa419-ordered-final-gate
            printf 'FA did not reach exit 0; final gate not entered\n' \
              > build-logs/fa419-ordered-final-gate/NOT_ENTERED.txt
            rc=125
          fi
          echo "final_exit=$rc" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Freeze candidate and evidence payload
        if: steps.transplant.outputs.strictly_improved == '1'
        shell: bash
        run: |
          set -euo pipefail
          cp build-logs/fa418-local-proof-transplant/PROMOTED_SOURCE.lean /tmp/fa419-promoted.lean
          cp build-logs/fa418-local-proof-transplant/RESULT.json /tmp/fa419-result.json
          if test -f build-logs/fa419-ordered-final-gate/CURRENT.json; then
            cp build-logs/fa419-ordered-final-gate/CURRENT.json /tmp/fa419-gate.json
          fi
          if test -f build-logs/fa419-ordered-final-gate/ALL_REQUIRED_TARGETS_2X_PASS; then
            touch /tmp/fa419-all-2x-pass
          fi

      - name: Preserve evidence and restore controller source
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean || true
          git add build-logs/fa418-local-proof-transplant \
            build-logs/fa419-ordered-final-gate
          if ! git diff --cached --quiet; then
            git commit -m 'ci: preserve FA419 hash-selected transplant evidence [skip ci]'
            git push origin "HEAD:refs/heads/${ACTIVE_BRANCH}"
          fi

      - name: Check in immutable source only after strict improvement
        if: steps.transplant.outputs.strictly_improved == '1'
        id: promote
        shell: bash
        run: |
          set -euo pipefail
          actual=$(sha256sum /tmp/fa419-promoted.lean | awk '{print $1}')
          test "$actual" = "${{ steps.transplant.outputs.final_sha256 }}"
          short=${actual:0:12}
          if test -f /tmp/fa419-all-2x-pass; then label=final-2x; else label="frontier-${{ steps.transplant.outputs.final_first_error }}"; fi
          champion="champion/fa419-${label}-${short}-20260809"
          if git ls-remote --exit-code --heads origin "$champion" >/dev/null 2>&1; then
            echo "refusing to overwrite immutable branch $champion" >&2
            exit 71
          fi
          git fetch origin "$BASE_CHAMPION_BRANCH"
          git switch --detach "origin/$BASE_CHAMPION_BRANCH"
          git switch -c "$champion"
          cp /tmp/fa419-promoted.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          mkdir -p champion-records/fa-promotions
          cp /tmp/fa419-result.json "champion-records/fa-promotions/fa419-${label}-${short}.json"
          if test -f /tmp/fa419-gate.json; then
            cp /tmp/fa419-gate.json "champion-records/fa-promotions/fa419-${label}-${short}-gate.json"
          fi
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean champion-records/fa-promotions
          git commit -m "chore: check in FA419 ${label} champion [skip ci]"
          git push origin "HEAD:refs/heads/${champion}"
          echo "champion_branch=$champion" >> "$GITHUB_OUTPUT"

      - name: Upload FA419 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa419-hash-selected-transplant-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa418-local-proof-transplant
            build-logs/fa419-ordered-final-gate
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce authoritative outcomes
        if: always()
        env:
          TRANSPLANT_RC: ${{ steps.transplant.outputs.transplant_rc }}
          FINAL_PASSED: ${{ steps.transplant.outputs.final_passed }}
          GATE_EXIT: ${{ steps.gate.outputs.final_exit }}
        shell: bash
        run: |
          set -euo pipefail
          test "${TRANSPLANT_RC:-1}" = '0'
          if test "${FINAL_PASSED:-0}" = '1'; then test "${GATE_EXIT:-1}" = '0'; fi
