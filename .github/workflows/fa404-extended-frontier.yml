name: PASS 404 extended frontier FA Mock3 QYM solver

on:
  push:
    branches: [fix/fa404-extended-frontier-20260809]
    paths:
      - '.github/workflows/fa404-extended-frontier.yml'
      - 'scripts/fa404_extended_frontier.py'
      - 'scripts/fa401_extended_frontier.py'
      - 'scripts/fa394_tournament_solver.py'
      - 'scripts/fa392_iterative_solver.py'
      - 'scripts/promote_priority_verified_to_pr9.sh'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean'
      - 'PrimalitySheafVerification/Mock3*.lean'
      - 'PrimalitySheafVerification/QYM.lean'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read
  pull-requests: write

concurrency:
  group: fa404-extended-frontier
  cancel-in-progress: false

jobs:
  solve-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    steps:
      - name: Checkout exact PASS 404 branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa404-extended-frontier-20260809
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean, ripgrep, GitHub CLI, and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -y
          sudo apt-get install -y ripgrep gh
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run extended frontier until ordered gate or current limit
        id: solver
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          rm -rf build-logs/fa404-extended-frontier
          mkdir -p build-logs/fa404-extended-frontier
          python3 scripts/fa404_extended_frontier.py \
            --rounds 40 \
            --candidates 8 \
            2>&1 | tee build-logs/fa404-extended-frontier.console.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          echo "solver_exit_code=${rc}" > build-logs/fa404-extended-frontier.exit.txt

      - name: Commit accepted source progress
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
          git add PrimalitySheafVerification/QYM.lean
          for p in PrimalitySheafVerification/Mock3*.lean; do test -e "$p" && git add "$p"; done
          test -d build-logs/fa404-extended-frontier && git add build-logs/fa404-extended-frontier || true
          if ! git diff --cached --quiet; then
            if test -f build-logs/fa404-extended-frontier/ALL_REQUIRED_TARGETS_2X_PASS; then
              msg='fix: obtain PASS 404 FA Integrated Mock3 QYM 2x PASS'
            else
              msg='fix: preserve accepted PASS 404 frontier progress'
            fi
            git commit -m "$msg"
            git push origin HEAD:fix/fa404-extended-frontier-20260809
          fi

      - name: Promote only independently verified success to PR9
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f build-logs/fa404-extended-frontier/ALL_REQUIRED_TARGETS_2X_PASS || exit 0
          bash scripts/promote_priority_verified_to_pr9.sh \
            build-logs/fa404-extended-frontier/FINAL_STATUS.json \
            build-logs/fa404-extended-frontier/ALL_REQUIRED_TARGETS_2X_PASS

      - name: Upload complete PASS 404 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa404-extended-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa404-extended-frontier
            build-logs/fa404-extended-frontier.console.log
            build-logs/fa404-extended-frontier.exit.txt
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean
            PrimalitySheafVerification/Mock3*.lean
            PrimalitySheafVerification/QYM.lean
          if-no-files-found: error
          retention-days: 90
          compression-level: 6

      - name: Enforce ordered final result
        if: always()
        shell: bash
        env:
          SOLVER_EXIT_CODE: ${{ steps.solver.outputs.exit_code }}
        run: |
          test -n "${SOLVER_EXIT_CODE:-}"
          exit "${SOLVER_EXIT_CODE}"
