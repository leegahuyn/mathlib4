name: Final Authority v5 — Commit Source Fixes then End-to-End

on:
  push:
    branches:
      - gpt/final-authority-mass-repair-v5-20260820
  workflow_dispatch:

concurrency:
  group: final-authority-v5-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  actual-lean-end-to-end:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact connector-authenticated repair tree
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Establish authority branch and verify protected identities
        shell: bash
        run: |
          set -euo pipefail
          git switch -C gpt/final-authority-mass-repair-v5-20260820
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock1_Advanced.lean)" = "3b6596bbc0790c7d6e427c44e2b0b18b8af3efa6"
          sha256sum PrimalitySheafVerification/QYM.lean | tee FINAL_V5_QYM_SHA256.txt
          sha256sum PrimalitySheafVerification/Mock1_Advanced.lean | tee FINAL_V5_M1A_SHA256.txt

      - name: Apply Mock3 and Spt1 source blockers as one deterministic batch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          spt1 = Path('PrimalitySheafVerification/Spt1.lean')
          text = spt1.read_text(encoding='utf-8')
          old = "example : Fintype.card {x : ZMod 9 // (12 : ZMod 9) * x = 0} = 3 := by native_decide"
          new = """example : Fintype.card {x : ZMod 9 // (12 : ZMod 9) * x = 0} = 3 := by
            rw [← Nat.card_eq_fintype_card]
            change Nat.card (AddMonoidHom.mulLeft (12 : ZMod 9)).ker = 3
            simpa using (card_ker_mulLeft 9 12)"""
          if text.count(old) == 1:
              text = text.replace(old, new, 1)
              spt1.write_text(text, encoding='utf-8')
          elif text.count(new) != 1:
              raise SystemExit('Spt1 exact native_decide target changed, missing, or duplicated')

          mock3 = Path('PrimalitySheafVerification/Mock3.lean')
          mock3.write_text("""import PrimalitySheafVerification.QYM

          /-!
          # Canonical Mock3 bridge

          The project's third Mock development is the frozen `QYM` module. This checked-in
          bridge gives that development a canonical `Mock3` module path without copying,
          replacing, or altering any QYM declaration.

          It is intentionally a transparent integration boundary: all mathematical content
          remains in the source-identical golden `PrimalitySheafVerification.QYM` module.
          -/
          """, encoding='utf-8')
          PY
          git diff --check
          test "$(grep -m1 -v '^[[:space:]]*$' PrimalitySheafVerification/Mock3.lean)" = "import PrimalitySheafVerification.QYM"
          ! grep -nE '\b(sorry|admit|native_decide)\b|set_option[[:space:]]+maxHeartbeats[[:space:]]+0' PrimalitySheafVerification/{Mock1_Advanced,Mock3}.lean
          ! grep -nE '^[[:space:]]*[^/-].*\bnative_decide\b|:= by[[:space:]]+native_decide\b' PrimalitySheafVerification/Spt1.lean

      - name: Commit and push exact cumulative source batch before compilation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "final-authority-bot"
          git config user.email "final-authority-bot@users.noreply.github.com"
          git add -- PrimalitySheafVerification/Spt1.lean PrimalitySheafVerification/Mock3.lean
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m "Final authority: fix Mock3 import and remove Spt1 native_decide"
            git push origin HEAD:refs/heads/gpt/final-authority-mass-repair-v5-20260820
          fi
          test -z "$(git status --short)"
          git rev-parse HEAD | tee FINAL_V5_SOURCE_COMMIT.txt

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee FINAL_V5_LEAN_VERSION.txt
          lake --version | tee FINAL_V5_LAKE_VERSION.txt

      - name: Reverify actual full-file M1A TRUE PASS
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          timeout --signal=TERM --kill-after=60s 10800s lake env lean -DmaxErrors=2000 -DwarningAsError=false PrimalitySheafVerification/Mock1_Advanced.lean 2>&1 | tee FINAL_V5_M1A.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > FINAL_V5_M1A_EXIT.txt
          test "$rc" = 0
          ! grep -Eq ':[0-9]+:[0-9]+: error(?:\([^)]*\))?:' FINAL_V5_M1A.log
          ! grep -Eqi 'internal error|uncaught exception|panic!' FINAL_V5_M1A.log

      - name: Run full mass compile and downstream authority chain
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-mass-repair-v5-20260820
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          python3 scripts/final_authority_gate_v5.py 2>&1 | tee FINAL_AUTHORITY_V5.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" > FINAL_AUTHORITY_V5_EXIT.txt

      - name: Surface complete frontier and every failure cluster
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          echo "=== FINAL STATUS CARD ==="
          cat .final_authority/FINAL_STATUS_CARD.md 2>/dev/null || true
          for f in PREFLIGHT.json MOCK3_CANONICAL_RESULT.json FINAL13_DIAGNOSTIC_SWEEP.json FINAL_13_BUILD_RESULTS.json BUILDALL_RESULT.json CLEAN_BUILD_1_RESULT.json CLEAN_BUILD_2_RESULT.json FINAL_15_CHECKLIST_RESULT.json FINAL_SOURCE_IDENTITY.json FORBIDDEN_AUDIT.json; do
            echo "=== $f ==="
            cat ".final_authority/$f" 2>/dev/null || true
          done
          echo "=== M1A EXIT ==="
          cat FINAL_V5_M1A_EXIT.txt 2>/dev/null || true
          echo "=== AUTHORITY EXIT ==="
          cat FINAL_AUTHORITY_V5_EXIT.txt 2>/dev/null || true

      - name: Upload all actual-Lean evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-v5-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .final_authority
            FINAL_V5_SOURCE_COMMIT.txt
            FINAL_V5_QYM_SHA256.txt
            FINAL_V5_M1A_SHA256.txt
            FINAL_V5_LEAN_VERSION.txt
            FINAL_V5_LAKE_VERSION.txt
            FINAL_V5_M1A.log
            FINAL_V5_M1A_EXIT.txt
            FINAL_AUTHORITY_V5.log
            FINAL_AUTHORITY_V5_EXIT.txt
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Enforce complete final authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat FINAL_V5_M1A_EXIT.txt)" = 0
          test "$(cat FINAL_AUTHORITY_V5_EXIT.txt)" = 0
