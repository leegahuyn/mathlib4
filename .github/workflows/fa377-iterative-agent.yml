name: PASS 377 iterative FunctionalAnalysis agent

on:
  push:
    branches:
      - fix/fa377-agent-20260809
    paths:
      - '.github/workflows/fa377-iterative-agent.yml'
      - 'scripts/fa377_iterative_agent.py'
      - 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
      - 'build-logs/fa377-agent/state.json'
      - 'build-logs/fa377-agent/materialized-pass376'
      - 'build-logs/fa377-agent/ALL_REQUIRED_TARGETS_2X_PASS'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: fa377-iterative-agent
  cancel-in-progress: false

jobs:
  repair-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact agent head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 900
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get

      - name: Run guarded iterative FA repair and ordered verification
        id: agent
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FA_AGENT_MAX_ITERATIONS: '16'
          FA_AGENT_MAX_TOTAL_ITERATIONS: '160'
          FA_AGENT_MODELS: 'openai/gpt-5,openai/gpt-4.1,openai/gpt-4o'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/fa377_iterative_agent.py \
            > /tmp/fa377-agent-console.log 2>&1
          rc=$?
          set -e
          cat /tmp/fa377-agent-console.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Audit additions and summarize result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p build-logs/fa377-agent
          {
            echo "head_sha=${GITHUB_SHA}"
            echo "agent_exit_code=${{ steps.agent.outputs.exit_code }}"
            echo "source_sha256=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)"
            test -f build-logs/fa377-agent/state.json && cat build-logs/fa377-agent/state.json || true
          } | tee build-logs/fa377-agent/run-summary.txt
          cp /tmp/fa377-agent-console.log build-logs/fa377-agent/console.log
          python3 - <<'PY'
          from pathlib import Path
          import re
          path = Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          text = path.read_text(encoding='utf-8')
          # Remove comments and strings before auditing executable tokens.
          out = []
          i = 0
          depth = 0
          in_string = False
          escaped = False
          while i < len(text):
              if depth:
                  if text.startswith('/-', i):
                      depth += 1; i += 2; continue
                  if text.startswith('-/', i):
                      depth -= 1; i += 2; continue
                  out.append('\n' if text[i] == '\n' else ' '); i += 1; continue
              if in_string:
                  ch = text[i]
                  out.append('\n' if ch == '\n' else ' ')
                  if escaped:
                      escaped = False
                  elif ch == '\\':
                      escaped = True
                  elif ch == '"':
                      in_string = False
                  i += 1; continue
              if text.startswith('/-', i):
                  depth = 1; out.extend('  '); i += 2; continue
              if text.startswith('--', i):
                  while i < len(text) and text[i] != '\n':
                      out.append(' '); i += 1
                  continue
              if text[i] == '"':
                  in_string = True; out.append(' '); i += 1; continue
              out.append(text[i]); i += 1
          code = ''.join(out)
          patterns = {
              'sorry': r'\bsorry\b',
              'admit': r'\badmit\b',
              'global_axiom': r'(?m)^\s*(?:public\s+)?axiom\b',
              'unsafe': r'(?m)^\s*unsafe\b',
              'native_decide': r'\bnative_decide\b',
              'Lean.ofReduceBool': r'\bLean\.ofReduceBool\b',
          }
          failures = {name: len(re.findall(pattern, code)) for name, pattern in patterns.items()}
          Path('build-logs/fa377-agent/forbidden-token-audit.txt').write_text(
              '\n'.join(f'{name}={count}' for name, count in failures.items()) + '\n',
              encoding='utf-8')
          if any(failures.values()):
              raise SystemExit(f'forbidden executable tokens: {failures}')
          PY

      - name: Commit only an improved or fully verified source
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          complete=0
          test -f build-logs/fa377-agent/ALL_REQUIRED_TARGETS_2X_PASS && complete=1
          if git diff --quiet -- PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean && \
             test "${complete}" -eq 0; then
            echo 'No improved source and no final PASS marker; nothing will be pushed.'
            exit 0
          fi
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          for path in \
            build-logs/fa377-agent/state.json \
            build-logs/fa377-agent/materialized-pass376 \
            build-logs/fa377-agent/best-metric.json \
            build-logs/fa377-agent/ALL_REQUIRED_TARGETS_2X_PASS; do
            test -f "${path}" && git add "${path}"
          done
          if git diff --cached --quiet; then
            exit 0
          fi
          if test "${complete}" -eq 1; then
            message='fix: verify FA Integrated Mock3 and QYM twice'
          else
            message='fix: advance FunctionalAnalysis guarded frontier'
          fi
          git commit -m "${message}"
          git push origin HEAD:fix/fa377-agent-20260809

      - name: Upload complete repair evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa377-iterative-agent-${{ github.sha }}
          path: |
            build-logs/fa377-agent
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final result
        if: always()
        shell: bash
        env:
          AGENT_EXIT_CODE: ${{ steps.agent.outputs.exit_code }}
        run: |
          test -n "${AGENT_EXIT_CODE:-}"
          exit "${AGENT_EXIT_CODE}"
