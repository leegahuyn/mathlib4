name: Mock2 Advanced pass323 measured-universe recovery

on:
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/mock2-advanced-pass323-measured-universe.yml'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: mock2-advanced-pass322-latest-head
  cancel-in-progress: true

jobs:
  measured-universe-recovery:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      BRANCH: fix/primality-sheaf-clean-build
      TRIGGER_SHA: ${{ github.sha }}
      MOCK2: PrimalitySheafVerification/Mock2.lean
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      OUTDIR: .lake/build/lib/lean/PrimalitySheafVerification
      EVIDENCE: /tmp/mock2-advanced-pass323

    steps:
      - name: Clone latest branch head
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
          git checkout --detach "refs/remotes/origin/${BRANCH}"
          base_sha="$(git rev-parse HEAD)"
          echo "BASE_SHA=${base_sha}" >> "${GITHUB_ENV}"
          mkdir -p "${EVIDENCE}/logs" "${EVIDENCE}/source" "${EVIDENCE}/artifacts" "${OUTDIR}"
          cp "${TARGET}" "${EVIDENCE}/source/Mock2_Advanced-before.lean"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "branch=${BRANCH}" \
            "trigger_sha=${TRIGGER_SHA}" \
            "base_sha=${base_sha}" \
            "start_blob=$(git hash-object "${TARGET}")" \
            "start_sha256=$(sha256sum "${TARGET}" | awk '{print $1}')" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${EVIDENCE}/snapshot.txt"

      - name: Install pinned Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${EVIDENCE}/lean-version.txt"
          lake --version | tee "${EVIDENCE}/lake-version.txt"
          cp lean-toolchain lake-manifest.json "${EVIDENCE}/"
          lake exe cache get 2>&1 | tee "${EVIDENCE}/logs/cache-get.log"

      - name: Direct probe or measured-universe pass323 repair
        id: repair
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          echo 'stage,exit_code,error_count,warning_count' > "${EVIDENCE}/compile-summary.csv"

          compile_one() {
            local module="$1" stage="$2"
            local log="${EVIDENCE}/logs/${stage}.log"
            rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
              "${OUTDIR}/${module}.olean.private"
            set +e
            lake env lean "PrimalitySheafVerification/${module}.lean" \
              -o "${OUTDIR}/${module}.olean" \
              -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
            local code=$?
            set -e
            local errors warnings
            errors="$(grep -c 'error:' "${log}" || true)"
            warnings="$(grep -c 'warning:' "${log}" || true)"
            printf '%s,%s,%s,%s\n' \
              "${stage}" "${code}" "${errors}" "${warnings}" \
              >> "${EVIDENCE}/compile-summary.csv"
            if [[ "${code}" -ne 0 ]]; then
              {
                echo "stage=${stage}"
                echo "exit_code=${code}"
                echo "error_count=${errors}"
                grep -n 'error:' "${log}" | head -40 || true
                grep -n 'error:' "${log}" | tail -1 || true
                tail -360 "${log}" || true
              } > "${EVIDENCE}/logs/${stage}-failure-summary.txt"
              return "${code}"
            fi
            test "${errors}" -eq 0
            test -s "${OUTDIR}/${module}.olean"
            test -s "${OUTDIR}/${module}.ilean"
            if grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"; then
              return 1
            fi
          }

          compile_one Mock2 Mock2-regression
          if compile_one Mock2_Advanced Advanced-direct1; then
            compile_one Mock2_Advanced Advanced-direct2
            mode=direct
          else
            git restore --source=HEAD --worktree -- "${TARGET}"
            scripts=(
              apply_two_hundred_eighty_ninth_pass_repairs.py
              apply_two_hundred_ninetieth_pass_repairs.py
              apply_two_hundred_ninety_first_pass_repairs.py
              apply_two_hundred_ninety_second_pass_repairs.py
              apply_two_hundred_ninety_third_pass_repairs.py
              apply_two_hundred_ninety_fourth_pass_repairs.py
              apply_two_hundred_ninety_fifth_pass_repairs.py
              apply_two_hundred_ninety_seventh_pass_repairs.py
              apply_two_hundred_ninety_eighth_pass_repairs.py
              apply_two_hundred_ninety_ninth_pass_repairs.py
              apply_three_hundredth_pass_repairs.py
              apply_three_hundred_ninth_pass_repairs.py
              apply_three_hundred_tenth_pass_repairs.py
              apply_three_hundred_eleventh_pass_repairs.py
              apply_three_hundred_twelfth_pass_repairs.py
              apply_three_hundred_twenty_third_pass_mock2_advanced_repairs.py
            )
            : > "${EVIDENCE}/logs/repair-application.log"
            for script in "${scripts[@]}"; do
              echo "===== ${script} =====" | tee -a "${EVIDENCE}/logs/repair-application.log"
              python3 "scripts/${script}" 2>&1 | tee -a "${EVIDENCE}/logs/repair-application.log"
            done
            while IFS= read -r changed; do
              if [[ -n "${changed}" && "${changed}" != "${TARGET}" ]]; then
                git restore --source=HEAD --worktree -- "${changed}"
              fi
            done < <(git diff --name-only)
            test "$(git diff --name-only)" = "${TARGET}"
            git diff --check
            compile_one Mock2 Mock2-after-repair
            compile_one Mock2_Advanced Advanced-repaired1
            compile_one Mock2_Advanced Advanced-repaired2
            mode=repaired
          fi

          python3 - "${TARGET}" <<'PY' | tee "${EVIDENCE}/trust-audit.txt"
          from pathlib import Path
          import re
          import sys

          src = Path(sys.argv[1]).read_text(encoding="utf-8")
          out=[]; i=0; depth=0; string=False; escaped=False
          while i < len(src):
              if depth:
                  if src.startswith("/-", i): depth += 1; out.extend("  "); i += 2
                  elif src.startswith("-/", i): depth -= 1; out.extend("  "); i += 2
                  else: out.append("\n" if src[i] == "\n" else " "); i += 1
              elif string:
                  ch=src[i]; out.append("\n" if ch == "\n" else " ")
                  if escaped: escaped=False
                  elif ch == "\\": escaped=True
                  elif ch == '"': string=False
                  i += 1
              elif src.startswith("/-", i): depth=1; out.extend("  "); i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n": out.append(" "); i += 1
              elif src[i] == '"': string=True; out.append(" "); i += 1
              else: out.append(src[i]); i += 1
          if depth or string: raise SystemExit("unterminated comment or string")
          code=''.join(out)
          checks={
              'sorry':r'\bsorry\b','admit':r'\badmit\b',
              'global_axiom':r'(?m)^\s*axiom\b','unsafe':r'\bunsafe\b',
              'native_decide':r'\bnative_decide\b',
              'Lean.ofReduceBool':r'\bLean\.ofReduceBool\b'}
          bad=False
          for name, pattern in checks.items():
              count=len(re.findall(pattern,code)); print(f'{name}={count}'); bad |= count != 0
          if bad: raise SystemExit("forbidden executable token detected")
          PY

          cp "${TARGET}" "${EVIDENCE}/source/Mock2_Advanced-final.lean"
          cp "${OUTDIR}/Mock2_Advanced.olean" "${OUTDIR}/Mock2_Advanced.ilean" \
            "${EVIDENCE}/artifacts/"
          sha256sum "${TARGET}" "${OUTDIR}/Mock2_Advanced.olean" \
            "${OUTDIR}/Mock2_Advanced.ilean" \
            | tee "${EVIDENCE}/provenance-sha256.txt"
          echo "mode=${mode}" | tee -a "${EVIDENCE}/snapshot.txt"
          if [[ -n "$(git diff --name-only)" ]]; then
            test "$(git diff --name-only)" = "${TARGET}"
            echo 'materialize=true' >> "${GITHUB_OUTPUT}"
          else
            echo 'materialize=false' >> "${GITHUB_OUTPUT}"
          fi

      - name: Commit repaired source locally and recompile
        if: steps.repair.outputs.materialize == 'true'
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${TARGET}"
          test "$(git diff --cached --name-only)" = "${TARGET}"
          git commit -m 'fix: materialize Mock2 Advanced pass323 measured universes'
          git diff --exit-code
          for pass in 1 2; do
            for module in Mock2 Mock2_Advanced; do
              log="${EVIDENCE}/logs/${module}-committed-pass${pass}.log"
              rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
                "${OUTDIR}/${module}.olean.private"
              lake env lean "PrimalitySheafVerification/${module}.lean" \
                -o "${OUTDIR}/${module}.olean" \
                -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
              test "$(grep -c 'error:' "${log}" || true)" -eq 0
              test -s "${OUTDIR}/${module}.olean"
              test -s "${OUTDIR}/${module}.ilean"
              if grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"; then
                exit 1
              fi
            done
          done

      - name: Rebase over concurrent branch movement and hand off
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          if [[ "${{ steps.repair.outputs.materialize }}" = true ]]; then
            git fetch origin "refs/heads/${BRANCH}:refs/remotes/origin/${BRANCH}"
            remote_sha="$(git rev-parse "refs/remotes/origin/${BRANCH}")"
            if [[ "${remote_sha}" != "${BASE_SHA}" ]]; then
              git rebase "${remote_sha}"
            fi
            git diff --exit-code
            for pass in 1 2; do
              for module in Mock2 Mock2_Advanced; do
                log="${EVIDENCE}/logs/${module}-rebased-pass${pass}.log"
                rm -f "${OUTDIR}/${module}.olean" "${OUTDIR}/${module}.ilean" \
                  "${OUTDIR}/${module}.olean.private"
                lake env lean "PrimalitySheafVerification/${module}.lean" \
                  -o "${OUTDIR}/${module}.olean" \
                  -i "${OUTDIR}/${module}.ilean" >"${log}" 2>&1
                test "$(grep -c 'error:' "${log}" || true)" -eq 0
                test -s "${OUTDIR}/${module}.olean"
                test -s "${OUTDIR}/${module}.ilean"
                if grep -Eqi "maximum number of errors|missing object file|sorryAx|declaration uses 'sorry'|PANIC|segmentation fault|stack overflow" "${log}"; then
                  exit 1
                fi
              done
            done
            git push origin "HEAD:${BRANCH}"
            printf '%s\n' \
              "base_sha=${BASE_SHA}" \
              "remote_before_push=${remote_sha}" \
              "pushed_commit=$(git rev-parse HEAD)" \
              "handoff=advanced-source-push" \
              | tee "${EVIDENCE}/handoff.txt"
          else
            curl --fail --silent --show-error \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer ${GH_TOKEN}" \
              -H "X-GitHub-Api-Version: 2022-11-28" \
              "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/mock2-functional-analysis-pass318-materialize.yml/dispatches" \
              -d "{\"ref\":\"${BRANCH}\"}"
            printf '%s\n' \
              "base_sha=${BASE_SHA}" \
              "handoff=functional-analysis-dispatch" \
              | tee "${EVIDENCE}/handoff.txt"
          fi

      - name: Upload pass323 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mock2-advanced-pass323-${{ env.BASE_SHA }}
          path: /tmp/mock2-advanced-pass323
          if-no-files-found: warn
          retention-days: 30
