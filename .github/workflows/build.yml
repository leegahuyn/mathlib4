name: continuous integration

on:
  push:
    branches-ignore:
      # ignore tmp branches used by bors
      - 'staging.tmp*'
      - 'trying.tmp*'
      - 'staging*.tmp'
      # ignore staging and trying branches used by bors, these are handled by bors.yml
      - 'staging'
      - 'trying'
      # ignore branches meant for experiments
      - 'ci-dev/**'

concurrency:
  # label each workflow run; only the latest with each label will run
  # workflows on master get more expressive labels
  group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id) || '' }}
  # cancel any running workflow with the same label
  cancel-in-progress: true

# Limit permissions for GITHUB_TOKEN for the entire workflow
permissions:
  contents: write
  id-token: write
  actions: read
  pull-requests: write

jobs:
  build:
    name: ci (upstream)
    if: ${{ github.repository == 'leanprover-community/mathlib4' || github.repository == 'leanprover-community/mathlib4-nightly-testing' }}
    uses: ./.github/workflows/build_template.yml
    with:
      concurrency_group: ${{ github.workflow }}-${{ github.ref }}-${{ (github.event_name == 'push' && github.ref == 'refs/heads/master' && github.run_id) || '' }}
      pr_branch_ref: ${{ github.sha }}
      cache_application_id: >-
        ${{
             (github.repository == 'leanprover-community/mathlib4'
               && github.ref_name == 'master')
               && vars.CACHE_MASTER_WRITER_AZURE_APP_ID
          || (github.repository == 'leanprover-community/mathlib4-nightly-testing'
               && (github.ref_name == 'nightly-testing'
                   || github.ref_name == 'nightly-testing-green'
                   || startsWith(github.ref_name, 'bump/')))
               && vars.CACHE_NIGHTLY_TESTING_WRITER_AZURE_APP_ID
          || (github.repository == 'leanprover-community/mathlib4-nightly-testing')
               && vars.CACHE_PR_TOOLCHAIN_TESTS_WRITER_AZURE_APP_ID
          || vars.CACHE_NON_MASTER_WRITER_AZURE_APP_ID
        }}
      cache_environment: >-
        ${{
             (github.repository == 'leanprover-community/mathlib4'
               && github.ref_name == 'master')
               && 'cache-upload-master'
          || (github.repository == 'leanprover-community/mathlib4')
               && 'cache-upload-forks'
          || ''
        }}
      publish_cache: ${{ github.repository == 'leanprover-community/mathlib4' && github.event_name == 'push' && github.ref == 'refs/heads/master' }}
      runs_on: pr
    secrets: inherit

  standalone-buildall:
    name: ci
    if: ${{ github.repository == 'leegahuyn/mathlib4' && github.ref == 'refs/heads/standalone-repo-prep-2026-08-24' }}
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 360
    env:
      LOGDIR: /tmp/standalone-buildall-ci
      EVIDENCE_JSON: build-evidence/standalone-ci-current.json

    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Record provenance
        id: provenance
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "${LOGDIR}" build-evidence
          test "$(git rev-parse HEAD)" = "${GITHUB_SHA}"
          printf '%s\n' \
            "repository=${GITHUB_REPOSITORY}" \
            "ref=${GITHUB_REF}" \
            "sha=${GITHUB_SHA}" \
            "run_id=${GITHUB_RUN_ID}" \
            "run_attempt=${GITHUB_RUN_ATTEMPT}" \
            "runner_arch=${RUNNER_ARCH}" \
            "runner_os=${RUNNER_OS}" \
            "utc_started=$(date -u +%FT%TZ)" \
            | tee "${LOGDIR}/provenance.txt"

      - name: Persist live in-progress marker
        id: live_marker
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          data = {
              "state": "in_progress",
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF"),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0")),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "0")),
              "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "started_at_utc": datetime.now(timezone.utc).isoformat(),
          }
          with open(os.environ["EVIDENCE_JSON"], "w", encoding="utf-8") as f:
              json.dump(data, f, indent=2, sort_keys=True)
              f.write("\n")
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${EVIDENCE_JSON}"
          git commit -m 'Record standalone CI start [skip ci]'
          git push origin HEAD:standalone-repo-prep-2026-08-24

      - name: Install pinned Lean toolchain
        id: setup
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          cp lean-toolchain "${LOGDIR}/lean-toolchain.txt"
          cp lake-manifest.json "${LOGDIR}/lake-manifest.json"

      - name: Restore Mathlib cache
        id: cache
        shell: bash
        run: |
          set -euo pipefail
          lake exe cache get 2>&1 | tee "${LOGDIR}/cache-get.log"

      - name: Run clean aggregate BuildAll gate
        id: buildall
        shell: bash
        run: |
          set -uo pipefail
          set +e
          lake env lean BuildAll.lean 2>&1 | tee "${LOGDIR}/buildall.log"
          code=${PIPESTATUS[0]}
          set -e
          printf '%s\n' "${code}" | tee "${LOGDIR}/buildall.exit-code.txt"
          exit "${code}"

      - name: Upload standalone CI evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: standalone-buildall-ci-${{ github.run_id }}-${{ github.run_attempt }}
          path: /tmp/standalone-buildall-ci
          if-no-files-found: warn
          retention-days: 14

      - name: Persist final inspectable CI result on branch
        if: ${{ always() }}
        shell: bash
        env:
          PROVENANCE_OUTCOME: ${{ steps.provenance.outcome }}
          LIVE_MARKER_OUTCOME: ${{ steps.live_marker.outcome }}
          SETUP_OUTCOME: ${{ steps.setup.outcome }}
          CACHE_OUTCOME: ${{ steps.cache.outcome }}
          BUILDALL_OUTCOME: ${{ steps.buildall.outcome }}
        run: |
          set -euo pipefail
          mkdir -p build-evidence
          python3 - <<'PY'
          import json, os
          from datetime import datetime, timezone
          steps = {
              "provenance": os.environ.get("PROVENANCE_OUTCOME"),
              "live_marker": os.environ.get("LIVE_MARKER_OUTCOME"),
              "setup": os.environ.get("SETUP_OUTCOME"),
              "cache": os.environ.get("CACHE_OUTCOME"),
              "buildall": os.environ.get("BUILDALL_OUTCOME"),
          }
          required = [steps["provenance"], steps["setup"], steps["cache"], steps["buildall"]]
          state = "success" if all(x == "success" for x in required) else "failure"
          data = {
              "state": state,
              "repository": os.environ.get("GITHUB_REPOSITORY"),
              "ref": os.environ.get("GITHUB_REF"),
              "source_sha": os.environ.get("GITHUB_SHA"),
              "run_id": int(os.environ.get("GITHUB_RUN_ID", "0")),
              "run_attempt": int(os.environ.get("GITHUB_RUN_ATTEMPT", "0")),
              "run_url": f"https://github.com/{os.environ.get('GITHUB_REPOSITORY')}/actions/runs/{os.environ.get('GITHUB_RUN_ID')}",
              "recorded_at_utc": datetime.now(timezone.utc).isoformat(),
              "steps": steps,
          }
          for path in [os.environ["EVIDENCE_JSON"], "build-evidence/standalone-ci-latest.json"]:
              with open(path, "w", encoding="utf-8") as f:
                  json.dump(data, f, indent=2, sort_keys=True)
                  f.write("\n")
          PY
          {
            echo '=== provenance ==='
            cat "${LOGDIR}/provenance.txt" 2>/dev/null || true
            echo
            echo '=== cache tail ==='
            tail -n 80 "${LOGDIR}/cache-get.log" 2>/dev/null || true
            echo
            echo '=== BuildAll tail ==='
            tail -n 240 "${LOGDIR}/buildall.log" 2>/dev/null || true
            echo
            echo '=== BuildAll exit ==='
            cat "${LOGDIR}/buildall.exit-code.txt" 2>/dev/null || true
          } > build-evidence/standalone-ci-latest.tail.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${EVIDENCE_JSON}" build-evidence/standalone-ci-latest.json build-evidence/standalone-ci-latest.tail.log
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m 'Record standalone BuildAll CI result [skip ci]'
          git push origin HEAD:standalone-repo-prep-2026-08-24
