name: Final Authority BuildAll Repair V10 Current

"on":
  push:
    branches:
      - gpt/final-authority-batch-v7-20260820
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: final-authority-buildall-repair-v10-${{ github.ref }}
  cancel-in-progress: true

jobs:
  latest-head-repair-and-authority:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message || '', '[v10-current]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - name: Checkout exact latest branch head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Establish successor branch and protected identities
        shell: bash
        run: |
          set -euo pipefail
          git switch -C gpt/final-authority-batch-v7-20260820
          mkdir -p .final_authority_v10_current
          {
            echo "INPUT_SHA=${{ github.sha }}"
            echo "HEAD=$(git rev-parse HEAD)"
            echo "FA_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)"
            echo "INTEGRATED_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)"
            echo "QYM_BLOB=$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)"
            echo "QYM_SHA256=$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')"
          } | tee .final_authority_v10_current/INPUT_IDENTITY.txt
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          python3 -m py_compile scripts/buildall_auto_repair_v10.py
          python3 -m py_compile scripts/final_authority_gate_v10.py

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version | tee .final_authority_v10_current/LEAN_VERSION.txt
          lake --version | tee .final_authority_v10_current/LAKE_VERSION.txt

      - name: Repair the sole BuildAll error from latest HEAD
        id: repair
        shell: bash
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          set +e
          python3 scripts/buildall_auto_repair_v10.py \
            2>&1 | tee .final_authority_v10_current/BUILDALL_REPAIR.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v10_current/BUILDALL_REPAIR_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Commit exact BuildAll-passing source candidate
        id: commit
        if: steps.repair.outputs.exit_code == '0'
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean)" = "28f614d48e02a0f28d3f5a758e813350b3ea89cf"
          test "$(git hash-object --no-filters PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean)" = "464f5dd095876b20165d12690c8127ef9d909e6a"
          test "$(git hash-object --no-filters PrimalitySheafVerification/QYM.lean)" = "7afb309d7c4da97da7bc6b922931734d72830d41"
          test "$(sha256sum PrimalitySheafVerification/QYM.lean | awk '{print $1}')" = "ab7c394f68b812046bcfae109b274a2d4fa42479bf8e76461c73a9c190fb3204"
          git config user.name final-authority-bot
          git config user.email final-authority-bot@users.noreply.github.com
          git add -- \
            PrimalitySheafVerification/Spt1.lean \
            PrimalitySheafVerification/Spt3.lean \
            PrimalitySheafVerification/Mock1_Advanced.lean \
            PrimalitySheafVerification/Mock3.lean \
            PrimalitySheafVerification/BuildAll.lean
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            git commit -m "[final-authority-v10-promotion] Fix sole BuildAll aggregate error"
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
          git rev-parse HEAD | tee .final_authority_v10_current/CANDIDATE_COMMIT.txt
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Run BuildAll clean clean and checklist on same candidate
        id: authority
        if: steps.repair.outputs.exit_code == '0'
        shell: bash
        env:
          FINAL_AUTHORITY_BRANCH: gpt/final-authority-batch-v7-20260820
        run: |
          set -uo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          export GITHUB_REF_NAME="gpt/final-authority-batch-v7-20260820"
          export GITHUB_SHA="$(git rev-parse HEAD)"
          set +e
          python3 scripts/final_authority_gate_v10.py \
            2>&1 | tee .final_authority_v10_current/FINAL_AUTHORITY.log
          rc=${PIPESTATUS[0]}
          set -e
          echo "$rc" | tee .final_authority_v10_current/FINAL_AUTHORITY_EXIT.txt
          echo "exit_code=$rc" >> "$GITHUB_OUTPUT"

      - name: Create exact status and issue report
        if: always()
        shell: bash
        env:
          RUN_URL: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
          INPUT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          def load(path):
              p=Path(path)
              if not p.exists(): return None
              try: return json.loads(p.read_text())
              except Exception as e: return {'parse_error':str(e)}
          candidate=Path('.final_authority_v10_current/CANDIDATE_COMMIT.txt').read_text().strip() if Path('.final_authority_v10_current/CANDIDATE_COMMIT.txt').exists() else None
          repair_exit=Path('.final_authority_v10_current/BUILDALL_REPAIR_EXIT.txt').read_text().strip() if Path('.final_authority_v10_current/BUILDALL_REPAIR_EXIT.txt').exists() else None
          authority_exit=Path('.final_authority_v10_current/FINAL_AUTHORITY_EXIT.txt').read_text().strip() if Path('.final_authority_v10_current/FINAL_AUTHORITY_EXIT.txt').exists() else None
          result={
            'run_url':os.environ['RUN_URL'],'input_sha':os.environ['INPUT_SHA'],
            'candidate':candidate,'repair_exit':repair_exit,'authority_exit':authority_exit,
            'repair':load('.buildall_v10/REPAIR_RESULT.json'),
            'final13':load('.final_authority/FINAL_13_BUILD_RESULTS.json'),
            'buildall':load('.final_authority/BUILDALL_RESULT.json'),
            'forbidden':load('.final_authority/FORBIDDEN_AUDIT.json'),
            'clean1':load('.final_authority/CLEAN_BUILD_1_RESULT.json'),
            'clean2':load('.final_authority/CLEAN_BUILD_2_RESULT.json'),
            'identity':load('.final_authority/FINAL_SOURCE_IDENTITY.json'),
            'checklist':load('.final_authority/FINAL_15_CHECKLIST_RESULT.json'),
            'status_card':Path('.final_authority/FINAL_STATUS_CARD.md').read_text(encoding='utf-8',errors='replace') if Path('.final_authority/FINAL_STATUS_CARD.md').exists() else None,
          }
          Path('.final_authority_v10_current/RESULT.json').write_text(json.dumps(result,indent=2,ensure_ascii=False)+'\n')
          counts=result['checklist'].get('counts') if isinstance(result['checklist'],dict) else None
          body=['## Final Authority V10 current-head result','',f"- run: {result['run_url']}",f"- input: `{result['input_sha']}`",f"- candidate: `{candidate}`",f"- repair exit: `{repair_exit}`",f"- authority exit: `{authority_exit}`",f"- checklist: `{counts}`",'', '### Repair','```json',json.dumps(result['repair'],indent=2,ensure_ascii=False)[:12000],'```','',result['status_card'] or '(status card missing)']
          Path('.final_authority_v10_current/ISSUE_COMMENT.md').write_text('\n'.join(body)+'\n')
          print(json.dumps({'candidate':candidate,'repair_exit':repair_exit,'authority_exit':authority_exit,'checklist':counts},indent=2,ensure_ascii=False))
          PY

      - name: Publish exact current-head evidence
        if: always()
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          gh issue comment 59 --repo "${{ github.repository }}" \
            --body-file .final_authority_v10_current/ISSUE_COMMENT.md

      - name: Upload complete current-head evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: final-authority-v10-current-${{ github.run_id }}-attempt${{ github.run_attempt }}
          path: |
            .buildall_v10
            .final_authority
            .final_authority_v10_current
          include-hidden-files: true
          if-no-files-found: warn
          retention-days: 30
          compression-level: 6

      - name: Promote verified candidate to active PR branch
        if: steps.repair.outputs.exit_code == '0' && steps.commit.outputs.changed == 'true'
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gpt/final-authority-batch-v7-20260820
          test "$(git merge-base --is-ancestor origin/gpt/final-authority-batch-v7-20260820 HEAD; echo $?)" = "0"
          git push origin HEAD:refs/heads/gpt/final-authority-batch-v7-20260820
          git rev-parse HEAD | tee .final_authority_v10_current/PROMOTED_COMMIT.txt

      - name: Enforce final authority
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test "$(cat .final_authority_v10_current/BUILDALL_REPAIR_EXIT.txt)" = "0"
          test "$(cat .final_authority_v10_current/FINAL_AUTHORITY_EXIT.txt)" = "0"
          python3 - <<'PY'
          import json
          from pathlib import Path
          names=['BUILDALL_RESULT.json','CLEAN_BUILD_1_RESULT.json','CLEAN_BUILD_2_RESULT.json','FINAL_SOURCE_IDENTITY.json','FINAL_15_CHECKLIST_RESULT.json']
          data={n:json.loads((Path('.final_authority')/n).read_text()) for n in names}
          expected={'PASS':15,'FAIL':0,'NOT_RUN':0,'SKIPPED':0}
          ok=(data['BUILDALL_RESULT.json'].get('pass') is True and data['CLEAN_BUILD_1_RESULT.json'].get('pass') is True and data['CLEAN_BUILD_2_RESULT.json'].get('pass') is True and data['FINAL_SOURCE_IDENTITY.json'].get('pass') is True and data['FINAL_15_CHECKLIST_RESULT.json'].get('pass') is True and data['FINAL_15_CHECKLIST_RESULT.json'].get('counts')==expected)
          raise SystemExit(0 if ok else 1)
          PY
