name: Codex FA492 fast first-error diagnostic

on:
  push:
    branches:
      - fix/fa492-endpoint-explicit-continuity-20260811
    paths:
      - .github/workflows/codex-fa492-fast-first-error.yml
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: codex-fa492-fast-first-error
  cancel-in-progress: true

jobs:
  diagnose:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false
      - name: Allow maxErrors 1 in ephemeral candidate wrappers
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          old='if [[ "$MAX_ERRORS" != "32" ]]; then'
          new='if [[ "$MAX_ERRORS" != "1" && "$MAX_ERRORS" != "32" ]]; then'
          changed=0
          for p in Path('scripts').glob('fa*.sh'):
              t=p.read_text(encoding='utf-8')
              if old in t:
                  t=t.replace(old,new)
                  p.write_text(t,encoding='utf-8')
                  changed+=1
          print('patched_wrapper_count=',changed)
          PY
      - name: Run direct Lean with diagnostic cap 1
        id: run
        shell: bash
        run: |
          set +e
          export MAX_ERRORS=1
          bash scripts/fa492_endpoint_explicit_continuity_candidate_ci.sh 2>&1 | tee /tmp/fa492-fast.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Report diagnostic result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/report.md
          from pathlib import Path
          import json, os, re
          out=Path('build-logs/codex-fa492-endpoint-explicit-continuity/candidates/norms')
          metric=out/'METRIC.json'; log=out/'Mock2_FunctionalAnalysis.log'; all_log=Path('/tmp/fa492-fast.log')
          xs=['## FA492 fast first-error diagnostic (non-authoritative cap=1)','',f"- run_id: `{os.environ.get('GITHUB_RUN_ID','')}`",f"- head_sha: `{os.environ.get('GITHUB_SHA','')}`",f"- script_exit: `{os.environ.get('SCRIPT_EXIT','')}`",'- authority: `diagnostic only; winner still requires cap=32 direct Lean`']
          if metric.exists():
              try:
                  m=json.loads(metric.read_text())
                  for k in ['classification','source_sha256','line_count','Mock2_exit','Mock2_Advanced_exit','FA_exit','FA_first_actual_error_line','FA_first_actual_error_col','FA_first_error_declaration','FA_error_declaration_index','infra_reasons']:
                      xs.append(f'- {k}: `{m.get(k)}`')
                  xs += ['','### metric first error','```text',str(m.get('FA_first_error_message',''))[:6000],'```']
              except Exception as e: xs.append(f'- metric parse: `{e}`')
          if log.exists():
              txt=log.read_text(encoding='utf-8',errors='replace')
              xs += ['','### FA log tail','```text','\n'.join(txt.splitlines()[-100:])[-12000:],'```']
          elif all_log.exists():
              xs += ['','### runner tail','```text','\n'.join(all_log.read_text(encoding='utf-8',errors='replace').splitlines()[-100:])[-12000:],'```']
          print('\n'.join(xs)[:30000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/report.md)"
