name: GPT QYM Probe42 adaptive producer matrix

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe42-adaptive.yml
      - .github/qym_probe42_adaptive.py
      - .github/qym_select_frontier.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-probe42-${{ github.ref }}
  cancel-in-progress: false

jobs:
  probe42:
    name: Probe42 ${{ matrix.variant }} full direct Lean
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    strategy:
      fail-fast: false
      matrix:
        variant:
          - baseline
          - gamma_decide
          - gamma_entry_norm
          - groupoid_explicit
          - combined_decide_groupoid
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      BRANCH: gpt/fa-qym-clean-final-20260816
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-probe42-${{ matrix.variant }}
      FALLBACK_ARTIFACT: '9309908159'

    steps:
      - name: Checkout exact trigger
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate checkout and pinned environment
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$OUT" "$RUNNER_TEMP/probe42-baselines/fallback"
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -f .github/qym_probe42_adaptive.py
          test -f .github/qym_select_frontier.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Recover immutable 89-error fallback
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/artifacts/$FALLBACK_ARTIFACT/zip" \
            > "$RUNNER_TEMP/probe42-baselines/fallback.zip"
          unzip -q -o "$RUNNER_TEMP/probe42-baselines/fallback.zip" \
            -d "$RUNNER_TEMP/probe42-baselines/fallback"

      - name: Select strict direct-Lean baseline
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$RUNNER_TEMP/probe42-baselines/fallback" "$OUT" <<'PY'
          from pathlib import Path
          import hashlib, json, os, shutil, sys

          fallback, out = Path(sys.argv[1]), Path(sys.argv[2])
          choices = []

          def add(source, meta, label):
              if not source.exists() or not isinstance(meta, dict):
                  return
              errors = meta.get('error_headers')
              if not isinstance(errors, int) or meta.get('panic_lines') != 0:
                  return
              raw = source.read_bytes()
              sha = hashlib.sha256(raw).hexdigest()
              blob = hashlib.sha1(b'blob ' + str(len(raw)).encode() + b'\0' + raw).hexdigest()
              expected_sha = meta.get('candidate_qym_sha256') or meta.get('candidate_sha256')
              expected_blob = meta.get('candidate_qym_blob') or meta.get('candidate_blob')
              if expected_sha and sha != expected_sha:
                  return
              if expected_blob and blob != expected_blob:
                  return
              first = meta.get('first_error') or {}
              choices.append({
                  'label': label,
                  'source': str(source),
                  'sha256': sha,
                  'blob': blob,
                  'exit': meta.get('exit'),
                  'errors': errors,
                  'warnings': meta.get('warning_headers', 10**9),
                  'panic': meta.get('panic_lines'),
                  'first_line': first.get('line') or 0,
                  'semantic_pass': bool(meta.get('semantic_pass')),
              })

          frontier = Path('.github/qym-frontier')
          current = frontier / 'CURRENT_GLOBAL_BEST.json'
          if current.exists():
              try:
                  add(frontier / 'QYM_GLOBAL_BEST.lean', json.loads(current.read_text(encoding='utf-8')), 'persisted-global-best')
              except Exception:
                  pass
          p41 = frontier / 'PROBE41_SELECTION.json'
          if p41.exists():
              try:
                  add(frontier / 'QYM_PROBE41_BEST.lean', json.loads(p41.read_text(encoding='utf-8'))['best'], 'probe41-best')
              except Exception:
                  pass

          for rp in fallback.rglob('PROBE_RESULT.json'):
              try:
                  result = json.loads(rp.read_text(encoding='utf-8'))
              except Exception:
                  continue
              candidates = list(rp.parent.glob('QYM.candidate-probe35-*.lean'))
              if len(candidates) == 1:
                  add(candidates[0], result, 'probe35-flat-infer-fallback')

          if not choices:
              raise SystemExit('no hash-valid direct Lean baseline')
          choices.sort(key=lambda x: (
              0 if x['semantic_pass'] else 1,
              x['errors'],
              -x['first_line'],
              x['warnings'],
          ))
          best = choices[0]
          if not best['semantic_pass'] and best['errors'] > 89:
              raise SystemExit(f"baseline regression: {best['errors']} errors")
          shutil.copy2(best['source'], out / 'QYM.baseline.lean')
          (out / 'BASELINE_SELECTION.json').write_text(
              json.dumps({'best': best, 'all': choices}, indent=2, sort_keys=True) + '\n',
              encoding='utf-8')
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write(f"BASE_SHA={best['sha256']}\n")
              f.write(f"BASE_BLOB={best['blob']}\n")
              f.write(f"BASE_ERRORS={best['errors']}\n")
              f.write(f"BASE_WARNINGS={best['warnings']}\n")
          print(json.dumps(best, indent=2, sort_keys=True))
          PY
          test -s "$OUT/QYM.baseline.lean"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" > "$OUT/toolchain.log" 2>&1
          lake exe cache get > "$OUT/mathlib-cache.log" 2>&1
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"

      - name: Restore verified dependency objects
        id: depcache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Ensure dependency objects
        shell: bash
        env:
          HIT: ${{ steps.depcache.outputs.cache-hit }}
        run: |
          set -euo pipefail
          mkdir -p "$OLEAN"
          if [[ "$HIT" != true ]]; then
            for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
              cap=1
              [[ "$s" = Mock2_FunctionalAnalysis || "$s" = Mock2_FunctionalAnalysis_Integrated ]] && cap=2000
              rm -f "$OLEAN/$s.olean" "$OLEAN/$s.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$s.olean" -i "$OLEAN/$s.ilean" \
                "PrimalitySheafVerification/$s.lean" > "$OUT/$s.log" 2>&1
            done
          fi
          for s in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN/$s.olean" && test -s "$OLEAN/$s.ilean"
          done

      - name: Materialize deterministic Probe42 candidate
        shell: bash
        run: |
          set -euo pipefail
          cp "$QYM" "$OUT/QYM.canonical.lean"
          cp "$OUT/QYM.baseline.lean" "$QYM"
          python3 -B .github/qym_probe42_adaptive.py "${{ matrix.variant }}" "$QYM" \
            | tee "$OUT/PATCH_RESULT.json"
          python3 - "$OUT/PATCH_RESULT.json" <<'PY'
          import json, os, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          with open(os.environ['GITHUB_ENV'], 'a', encoding='utf-8') as f:
              f.write('CAND_SHA=' + r['candidate_sha256'] + '\n')
              f.write('CAND_BLOB=' + r['candidate_blob'] + '\n')
          PY
          cp "$QYM" "$OUT/QYM.candidate-probe42-${{ matrix.variant }}.lean"

      - name: Full direct Lean compile exact Probe42
        shell: bash
        run: |
          set -euo pipefail
          set +e
          /usr/bin/time -v -o "$OUT/QYM.time" \
            lake env lean -DmaxErrors=10000 -DwarningAsError=false \
              -o "$RUNNER_TEMP/QYM.probe42.olean" -i "$RUNNER_TEMP/QYM.probe42.ilean" \
              "$QYM" > "$OUT/QYM.log" 2>&1
          rc=$?
          set -e
          echo "$rc" > "$OUT/QYM.exit"
          if [[ "$rc" -eq 0 ]]; then
            test -s "$RUNNER_TEMP/QYM.probe42.olean" && test -s "$RUNNER_TEMP/QYM.probe42.ilean"
            cp "$RUNNER_TEMP/QYM.probe42.olean" "$OUT/QYM.probe42.olean"
            cp "$RUNNER_TEMP/QYM.probe42.ilean" "$OUT/QYM.probe42.ilean"
            sha256sum "$OUT/QYM.probe42.olean" "$OUT/QYM.probe42.ilean" > "$OUT/QYM.outputs.sha256"
          fi
          cp "$OUT/QYM.canonical.lean" "$QYM"
          exit 0

      - name: Summarize exact diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          [[ -f "$OUT/QYM.canonical.lean" ]] && cp "$OUT/QYM.canonical.lean" "$QYM" || true
          python3 - "$OUT" <<'PY'
          from pathlib import Path
          import collections, hashlib, json, os, re, sys

          out = Path(sys.argv[1])
          raw = (out / 'QYM.log').read_bytes() if (out / 'QYM.log').exists() else b''
          text = raw.decode(errors='replace')
          pat = re.compile(r'^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): (?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*(?P<message>.*)$', re.M)
          rows = []
          for m in pat.finditer(text):
              row = m.groupdict()
              row['line'] = int(row['line'])
              row['column'] = int(row['column'])
              rows.append(row)
          errors = [r for r in rows if r['severity'] == 'error']
          warnings = [r for r in rows if r['severity'] == 'warning']
          panics = re.findall(r'(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$', text)
          rc = int((out / 'QYM.exit').read_text().strip()) if (out / 'QYM.exit').exists() else None
          result = {
              'schema': 'qym-probe42-adaptive-v1',
              'github_sha': os.environ.get('GITHUB_SHA'),
              'variant': '${{ matrix.variant }}',
              'baseline_qym_sha256': os.environ.get('BASE_SHA'),
              'baseline_error_headers': int(os.environ.get('BASE_ERRORS', '999999')),
              'candidate_qym_sha256': os.environ.get('CAND_SHA'),
              'candidate_qym_blob': os.environ.get('CAND_BLOB'),
              'exit': rc,
              'error_headers': len(errors),
              'warning_headers': len(warnings),
              'error_codes': dict(sorted(collections.Counter(r['code'] or 'uncoded' for r in errors).items())),
              'first_error': errors[0] if errors else None,
              'last_error': errors[-1] if errors else None,
              'panic_lines': len(panics),
              'log_sha256': hashlib.sha256(raw).hexdigest(),
              'semantic_pass': rc == 0 and not errors and not panics,
          }
          (out / 'QYM.diagnostics.jsonl').write_text(''.join(json.dumps(r, sort_keys=True) + '\n' for r in rows), encoding='utf-8')
          (out / 'QYM.error-headers.txt').write_text(''.join(f"{r['file']}:{r['line']}:{r['column']}: error{('('+r['code']+')') if r['code'] else ''}: {r['message']}\n" for r in errors), encoding='utf-8')
          (out / 'QYM.panic-lines.txt').write_text(''.join(p + '\n' for p in panics), encoding='utf-8')
          (out / 'PROBE_RESULT.json').write_text(json.dumps(result, indent=2, sort_keys=True) + '\n', encoding='utf-8')
          print(json.dumps(result, indent=2, sort_keys=True))
          PY
          test "$(sha256sum "$QYM" | awk '{print $1}')" = "$(sha256sum "$OUT/QYM.canonical.lean" | awk '{print $1}')"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Upload immutable Probe42 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe42-${{ matrix.variant }}-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-probe42-${{ matrix.variant }}/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed unless direct Lean TRUE PASS
        if: always()
        shell: bash
        run: |
          python3 - "$OUT/PROBE_RESULT.json" <<'PY'
          import json, sys
          r = json.load(open(sys.argv[1], encoding='utf-8'))
          if not r['semantic_pass']:
              raise SystemExit(r['exit'] or 1)
          PY

  select:
    name: Persist exact Probe42 direct frontier
    needs:
      - probe42
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      BRANCH: gpt/fa-qym-clean-final-20260816
      FRONTIER: .github/qym-frontier
      QYM: PrimalitySheafVerification/QYM.lean

    steps:
      - name: Checkout current branch
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: gpt/fa-qym-clean-final-20260816
          persist-credentials: true
          fetch-depth: 0

      - name: Download all Probe42 artifacts from this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: qym-probe42-*
          path: /tmp/probe42-artifacts
          merge-multiple: false

      - name: Select, audit, and persist exact direct frontier
        shell: bash
        run: |
          set -euo pipefail
          python3 -B .github/qym_select_frontier.py \
            /tmp/probe42-artifacts "$FRONTIER" "$QYM" \
            Probe42 "$GITHUB_RUN_ID" 'QYM.candidate-probe42-*.lean'

      - name: Commit authorized frontier update
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add "$FRONTIER"
          if [[ -f "$FRONTIER/QYM_PASS_PENDING_CLEAN_RECHECK" ]]; then
            git add "$QYM"
          fi
          if git diff --cached --quiet; then
            exit 0
          fi
          MSG=$(cat "$FRONTIER/FRONTIER_COMMIT_MESSAGE.txt")
          git commit -m "$MSG"
          for attempt in 1 2 3; do
            if git push origin "HEAD:$BRANCH"; then
              exit 0
            fi
            git fetch origin "$BRANCH"
            git rebase "origin/$BRANCH"
          done
          exit 1
