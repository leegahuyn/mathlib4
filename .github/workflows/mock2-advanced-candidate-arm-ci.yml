name: Mock2 Advanced pass 312 ARM candidate clean CI

on:
  pull_request:
    branches: [master]
    paths:
      - '.github/workflows/mock2-advanced-candidate-arm-ci.yml'
  push:
    branches: [fix/primality-sheaf-clean-build]
    paths:
      - '.github/workflows/mock2-advanced-candidate-arm-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mock2-advanced-pass312-arm-${{ github.sha }}
  cancel-in-progress: false

jobs:
  verify-candidate-arm:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 180
    env:
      TARGET: PrimalitySheafVerification/Mock2_Advanced.lean
      EXPECTED_START_BLOB: 54bbfa432f1b8a6554d25104a0c29d4f41999984
      EXPECTED_CANDIDATE_SHA256: 5ed076b1eda61c1702243aa5a391e2db76265d1a28b55834527d15e2dd4f788b
      LOGDIR: build-logs/Mock2_Advanced-pass312-arm

    steps:
      - name: Clone exact triggering commit
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          git init .
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git fetch --depth=1 origin "${SOURCE_SHA}"
          git checkout --detach FETCH_HEAD
          test "$(git rev-parse HEAD)" = "${SOURCE_SHA}"
          test "$(git hash-object "${TARGET}")" = "${EXPECTED_START_BLOB}"
          mkdir -p "${LOGDIR}"
          printf '%s\n' "source_sha=${SOURCE_SHA}" \
            "starting_blob=${EXPECTED_START_BLOB}" > "${LOGDIR}/snapshot.txt"

      - name: Reproduce pass 312 candidate exactly
        shell: bash
        run: |
          set -euo pipefail
          scripts=(
            apply_two_hundred_eighty_ninth_pass_repairs.py
            apply_two_hundred_ninetieth_pass_repairs.py
            apply_two_hundred_ninety_first_pass_repairs.py
            apply_two_hundred_ninety_second_pass_repairs.py
            apply_two_hundred_ninety_third_pass_repairs.py
            apply_two_hundred_ninety_fourth_pass_repairs.py
            apply_two_hundred_ninety_fifth_pass_repairs.py
            apply_two_hundred_ninety_seventh_pass_repairs.py
            apply_two_hundred_ninety_eighth_pass_repairs.py
            apply_two_hundred_ninety_ninth_pass_repairs.py
            apply_three_hundredth_pass_repairs.py
            apply_three_hundred_ninth_pass_repairs.py
            apply_three_hundred_tenth_pass_repairs.py
            apply_three_hundred_eleventh_pass_repairs.py
            apply_three_hundred_twelfth_pass_repairs.py
          )
          for script in "${scripts[@]}"; do
            python3 "scripts/${script}"
          done 2>&1 | tee "${LOGDIR}/repair-application.log"

          while IFS= read -r changed; do
            [[ -z "${changed}" || "${changed}" = "${TARGET}" ]] || \
              git restore --source=HEAD --worktree -- "${changed}"
          done < <(git diff --name-only)
          test "$(git diff --name-only)" = "${TARGET}"
          git diff --check
          actual_sha="$(sha256sum "${TARGET}" | awk '{print $1}')"
          test "${actual_sha}" = "${EXPECTED_CANDIDATE_SHA256}"
          printf '%s\n' "candidate_sha256=${actual_sha}" \
            "candidate_lines=$(wc -l < "${TARGET}")" >> "${LOGDIR}/snapshot.txt"

      - name: Audit forbidden executable tokens
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY' | tee "${LOGDIR}/forbidden-token-audit.txt"
          from pathlib import Path
          import re
          src = Path("PrimalitySheafVerification/Mock2_Advanced.lean").read_text()
          out, i, depth, string, esc = [], 0, 0, False, False
          while i < len(src):
              if depth:
                  if src.startswith("/-", i): depth += 1; out += "  "; i += 2
                  elif src.startswith("-/", i): depth -= 1; out += "  "; i += 2
                  else: out.append("\n" if src[i] == "\n" else " "); i += 1
              elif string:
                  ch = src[i]; out.append("\n" if ch == "\n" else " ")
                  if esc: esc = False
                  elif ch == "\\": esc = True
                  elif ch == '"': string = False
                  i += 1
              elif src.startswith("/-", i): depth = 1; out += "  "; i += 2
              elif src.startswith("--", i):
                  while i < len(src) and src[i] != "\n": out.append(" "); i += 1
              elif src[i] == '"': string = True; out.append(" "); i += 1
              else: out.append(src[i]); i += 1
          code = "".join(out)
          pats = {
              "sorry": r"\bsorry\b", "admit": r"\badmit\b",
              "axiom": r"(?m)^\s*axiom\b", "unsafe": r"\bunsafe\b",
              "native_decide": r"\bnative_decide\b",
              "Lean.ofReduceBool": r"\bLean\.ofReduceBool\b",
              "by_contra!": r"\bby_contra!\b",
          }
          counts = {k: len(re.findall(v, code)) for k, v in pats.items()}
          for k, v in counts.items(): print(f"{k}: {v}")
          if depth or string or any(counts.values()): raise SystemExit(1)
          PY

      - name: Install Lean and restore Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          echo "${HOME}/.elan/bin" >> "${GITHUB_PATH}"
          export PATH="${HOME}/.elan/bin:${PATH}"
          lean --version | tee "${LOGDIR}/lean-version.txt"
          lake --version | tee "${LOGDIR}/lake-version.txt"
          lake exe cache get

      - name: Clean-compile candidate twice
        shell: bash
        run: |
          set -euo pipefail
          export PATH="${HOME}/.elan/bin:${PATH}"
          outdir='.lake/build/lib/lean/PrimalitySheafVerification'
          mkdir -p "${outdir}"
          for pass in 1 2; do
            rm -f "${outdir}/Mock2_Advanced.olean" \
              "${outdir}/Mock2_Advanced.ilean" \
              "${outdir}/Mock2_Advanced.olean.private"
            set +e
            lake env lean "${TARGET}" \
              -o "${outdir}/Mock2_Advanced.olean" \
              -i "${outdir}/Mock2_Advanced.ilean" 2>&1 \
              | tee "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
            code=${PIPESTATUS[0]}
            set -e
            echo "${code}" > "${LOGDIR}/exit-code-pass${pass}.txt"
            test "${code}" -eq 0
            test -s "${outdir}/Mock2_Advanced.olean"
            test -s "${outdir}/Mock2_Advanced.ilean"
            test "$(grep -c 'error:' "${LOGDIR}/Mock2_Advanced-pass${pass}.log" || true)" -eq 0
            ! grep -Eqi 'maximum number of errors|PANIC|segmentation fault|stack overflow|missing object file|sorryAx' \
              "${LOGDIR}/Mock2_Advanced-pass${pass}.log"
          done
          sha256sum "${TARGET}" "${outdir}/Mock2_Advanced.olean" \
            "${outdir}/Mock2_Advanced.ilean" | tee "${LOGDIR}/sha256.txt"
          {
            echo '## Mock2 Advanced pass 312 ARM candidate'
            echo '- candidate SHA-256 matched'
            echo '- forbidden executable tokens: 0'
            echo '- clean compile pass 1: exit 0'
            echo '- clean compile pass 2: exit 0'
            echo '- `.olean` and `.ilean`: generated'
          } >> "${GITHUB_STEP_SUMMARY}"
