name: PASS 384 declaration-level FA and ordered blocking loop

on:
  push:
    branches: [fix/fa384-declaration-loop-20260809]
    paths:
      - '.github/workflows/pass384-declaration-blocking-loop.yml'
      - 'scripts/declaration_repair_agent_v384.py'
  workflow_dispatch:

permissions:
  contents: write
  actions: read
  models: read

concurrency:
  group: pass384-declaration-blocking-loop
  cancel-in-progress: false

jobs:
  declaration-and-blocking:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa384-declaration-loop-20260809
      AUTO_PUSH_BRANCH: fix/fa384-declaration-loop-20260809
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout exact PASS 384 head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean, cache, and official Models CLI
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          gh extension install github/gh-models --force || true
          gh models --help || true

      - name: Materialize exact PASS 376 when FA is still a stub
        shell: bash
        run: |
          set -euo pipefail
          fa='PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean'
          if [[ $(wc -c < "${fa}") -gt 500000 ]]; then
            echo 'Using checked-in full FunctionalAnalysis source.'
            exit 0
          fi
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/diagnose_pass341_fa.sh')
          text=path.read_text(encoding='utf-8')
          begin='''set +e
          lake env lean -DmaxErrors=2000 "${FA}" \\
          '''
          end='''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          code=$?
          '''
          if text.count(begin)!=1 or text.count(end)!=1:
              raise SystemExit('PASS341 direct-compile markers unavailable')
          text=text.replace(begin,'''set +e
          if false; then
          lake env lean -DmaxErrors=2000 "${FA}" \\
          ''')
          text=text.replace(end,'''  > "${EVIDENCE}/logs/Mock2_FunctionalAnalysis-pass341.log" 2>&1
          fi
          code=0
          ''')
          path.write_text(text,encoding='utf-8')
          PY
          export PATH="${HOME}/.elan/bin:${PATH}"
          bash scripts/diagnose_pass358_fa.sh
          cp /tmp/diagnose-pass358-fa/source/Mock2_FunctionalAnalysis-pass358.lean "${fa}"
          python3 scripts/apply_pass375c_candidate.py
          python3 scripts/apply_three_hundred_seventy_sixth_pass_functional_analysis_repairs.py
          test "$(sha256sum "${fa}" | cut -d' ' -f1)" = \
            '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'

      - name: Run declaration-level FA repair
        id: declaration
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/declaration_repair_agent_v384.py \
            --target PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            --iterations 20 --deadline-seconds 15000 \
            > /tmp/pass384-declaration-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass384-declaration-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Activate CLI fallback for the remaining ordered loop
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path=Path('scripts/blocking_priority_loop_v379.py')
          text=path.read_text(encoding='utf-8')
          old="str(ROOT / 'scripts' / 'run_lean_repair_v377_styled.py')"
          new="str(ROOT / 'scripts' / 'run_lean_repair_v380_styled.py')"
          if old in text:
              text=text.replace(old,new)
          elif new not in text:
              raise SystemExit('repair wrapper path unavailable')
          path.write_text(text,encoding='utf-8')
          PY

      - name: Continue FA, Integrated, Mock3, and QYM in strict order
        id: blocking
        shell: bash
        env:
          BLOCKING_MAX_SECONDS: '4500'
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          python3 scripts/blocking_priority_loop_v379.py \
            > /tmp/pass384-blocking-driver.log 2>&1
          rc=$?
          set -e
          cat /tmp/pass384-blocking-driver.log
          echo "exit_code=${rc}" >> "${GITHUB_OUTPUT}"
          exit 0

      - name: Upload PASS 384 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass384-declaration-loop-${{ github.sha }}
          path: |
            /tmp/pass384-declaration-agent
            /tmp/pass384-declaration-driver.log
            /tmp/pass384-blocking-driver.log
            /tmp/pass379-blocking
            /tmp/pass378
            /tmp/lean-repair-v377
            build-logs/PASS384_*.json
            build-logs/PASS379_*.json
            build-logs/FA_MOCK3_QYM_2X_PASS.json
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce actual final two-round result
        if: always()
        shell: bash
        env:
          BLOCKING_EXIT: ${{ steps.blocking.outputs.exit_code }}
        run: |
          test "${BLOCKING_EXIT:-1}" = '0'
          test -s build-logs/FA_MOCK3_QYM_2X_PASS.json
