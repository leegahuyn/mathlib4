name: GPT QYM Probe18 instance diagnostic

on:
  push:
    branches:
      - gpt/fa-qym-clean-final-20260816
    paths:
      - .github/workflows/gpt-qym-probe18-instance-diagnostic.yml
  workflow_dispatch:

permissions:
  actions: read
  contents: read

concurrency:
  group: gpt-qym-probe18-instance-diagnostic-${{ github.ref }}
  cancel-in-progress: false

jobs:
  diagnose-first-qym-blocker:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    env:
      EXPECTED_BRANCH: gpt/fa-qym-clean-final-20260816
      PROBE17_RUN: '32002705164'
      PROBE17_ARTIFACT: qym-repair-probe17-integrated-befb4ddaf7be84949c35bb66792f8c74c8e58699-attempt1
      EXPECTED_CANDIDATE_SHA256: 971d9fd6c1cba701f6404b6303668b61d3de9f4b5d71281ab7b88f1530009bf7
      EXPECTED_CANDIDATE_BLOB: 061345d55ea0ce66c01911454df3c6f2c509fa91
      EXPECTED_PROJECT_CACHE_KEY: qym-probe4-deps-v1-Linux-ecb9f60364b1d72200c847f9ae46918f12c8b6d05363c23cca5d361c92ea45d4
      OLEAN_ROOT: .lake/build/lib/lean/PrimalitySheafVerification

    steps:
      - name: Check out exact triggering commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Gate branch and clean checkout
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$EXPECTED_BRANCH"
          test "$(git rev-parse HEAD)" = "$GITHUB_SHA"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Download exact Probe17 authority artifact
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: ${{ env.PROBE17_ARTIFACT }}
          path: ${{ runner.temp }}/probe17-authority
          github-token: ${{ github.token }}
          repository: leegahuyn/mathlib4
          run-id: ${{ env.PROBE17_RUN }}

      - name: Verify Probe17 candidate bytes
        shell: bash
        run: |
          set -euo pipefail
          A="$RUNNER_TEMP/probe17-authority"
          C="$A/QYM.candidate-probe17.lean"
          test -f "$C"
          test "$(sha256sum "$C" | awk '{print $1}')" = "$EXPECTED_CANDIDATE_SHA256"
          test "$(git hash-object --no-filters "$C")" = "$EXPECTED_CANDIDATE_BLOB"
          test "$(cat "$A/QYM.exit")" = 1
          test "$(wc -l < "$A/QYM.error-headers.txt")" = 95
          test ! -s "$A/QYM.panic-lines.txt"

      - name: Install exact pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none
          export PATH="$HOME/.elan/bin:$PATH"
          printf '%s\n' "$HOME/.elan/bin" >> "$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)"
          lake exe cache get
          lean --version
          lake --version

      - name: Restore exact dependency outputs
        id: project-cache
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-probe4-deps-v1-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json', 'lakefile.lean', 'PrimalitySheafVerification/Mock2.lean', 'PrimalitySheafVerification/Mock2_Advanced.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean', 'PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}

      - name: Require exact dependency cache hit
        shell: bash
        env:
          CACHE_HIT: ${{ steps.project-cache.outputs.cache-hit }}
          CACHE_PRIMARY_KEY: ${{ steps.project-cache.outputs.cache-primary-key }}
          CACHE_MATCHED_KEY: ${{ steps.project-cache.outputs.cache-matched-key }}
        run: |
          set -euo pipefail
          test "$CACHE_HIT" = true
          test "$CACHE_PRIMARY_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          test "$CACHE_MATCHED_KEY" = "$EXPECTED_PROJECT_CACHE_KEY"
          for stem in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            test -s "$OLEAN_ROOT/$stem.olean"
            test -s "$OLEAN_ROOT/$stem.ilean"
          done

      - name: Build diagnostic prefix at the exact first blocker
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qym-probe18-instance-diagnostic"
          mkdir -p "$OUT"
          SRC="$RUNNER_TEMP/probe17-authority/QYM.candidate-probe17.lean"
          DST="$OUT/QYM.InstanceDiagnostic.lean"
          python3 - "$SRC" "$DST" <<'PY'
          from pathlib import Path
          import sys
          src = Path(sys.argv[1]).read_text(encoding='utf-8')
          anchor = '''set_option maxHeartbeats 2000000 in
          set_option synthInstance.maxHeartbeats 2000000 in
          /-- Operator norm of the intrinsic trace-class projection is at most one. -/
          theorem actualFixedPhaseCanonicalTraceClassProjection_opNorm_le'''
          assert src.count(anchor) == 1
          prefix = src.split(anchor, 1)[0]
          diagnostic = r'''
          /- GPT Probe18: isolate all instances required by the first operator-norm statement. -/
          section GPTProbe18InstanceDiagnostic
          variable (n : ℤ) (Y : ℝ)

          #synth NormedAddCommGroup (ActualFixedPhaseCuspTraceCompletion n Y)
          #synth NormedSpace ℂ (ActualFixedPhaseCuspTraceCompletion n Y)
          #synth CompleteSpace (ActualFixedPhaseCuspTraceCompletion n Y)
          #synth InnerProductSpace ℂ (ActualFixedPhaseCuspTraceCompletion n Y)

          #synth NormedAddCommGroup (ActualFixedPhaseCanonicalTraceClass n Y)
          #synth NormedSpace ℂ (ActualFixedPhaseCanonicalTraceClass n Y)
          #synth CompleteSpace (ActualFixedPhaseCanonicalTraceClass n Y)
          #synth InnerProductSpace ℂ (ActualFixedPhaseCanonicalTraceClass n Y)

          #synth Norm
            (ActualFixedPhaseCuspTraceCompletion n Y →L[ℂ]
              ActualFixedPhaseCanonicalTraceClass n Y)

          #check ContinuousLinearMap.hasOpNorm
          #check ContinuousLinearMap.opNorm_le_bound
          #check Submodule.orthogonalProjection_norm_le
          #check (ActualFixedPhaseCanonicalTraceClass n Y).orthogonalProjection_norm_le
          #check actualFixedPhaseCanonicalTraceClassProjection n Y

          end GPTProbe18InstanceDiagnostic
          end QYM.FullCertification.P2ClassicalTraceBoundaryExtension
          '''
          Path(sys.argv[2]).write_text(prefix + diagnostic, encoding='utf-8')
          PY
          sha256sum "$DST" > "$OUT/source.sha256"
          wc -l -c "$DST" > "$OUT/source.shape.txt"

      - name: Compile diagnostic prefix and retain all elaboration output
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qym-probe18-instance-diagnostic"
          set +e
          lake env lean -DmaxErrors=100 -DwarningAsError=false \
            "$OUT/QYM.InstanceDiagnostic.lean" > "$OUT/diagnostic.log" 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" > "$OUT/diagnostic.exit"
          grep -nE 'error:|warning:|synth|Norm |NormedSpace|InnerProductSpace|CompleteSpace|orthogonalProjection_norm_le|opNorm' \
            "$OUT/diagnostic.log" > "$OUT/diagnostic.filtered.txt" || true
          cat "$OUT/diagnostic.filtered.txt"
          exit 0

      - name: Upload diagnostic evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-probe18-instance-diagnostic-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: ${{ runner.temp }}/qym-probe18-instance-diagnostic/**
          if-no-files-found: error
          retention-days: 30

      - name: Fail closed after diagnostic collection
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/qym-probe18-instance-diagnostic"
          test -f "$OUT/diagnostic.log"
          exit 1
