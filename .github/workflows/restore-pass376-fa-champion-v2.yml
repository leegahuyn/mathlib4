name: Restore PASS376 FA champion v2 idempotently

on:
  push:
    branches:
      - ops/restore-pass376-fa-champion-v2-20260809
  workflow_dispatch:

permissions:
  actions: read
  contents: write

env:
  ARTIFACT_ID: '9024606745'
  EXPECTED_SHA256: '07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
  PASS376_HEAD: '71227bd1ba88c99f9a535df044fd37041bcf2304'
  CHAMPION_BRANCH: 'champion/fa-pass376-31725-07f6efd-20260809'
  VERIFIED_BRANCH: 'fix/fa416-from-reverified-pass376-31725-20260809'
  REQUIRED_FIRST_ERROR: '31725'

jobs:
  restore-and-reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout v2 controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ops/restore-pass376-fa-champion-v2-20260809
          fetch-depth: 1600
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Download artifact and verify exact source
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/pass376-v2 /tmp/pass376-v2.zip
          mkdir -p /tmp/pass376-v2
          gh api -H 'Accept: application/vnd.github+json' \
            "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${ARTIFACT_ID}/zip" \
            > /tmp/pass376-v2.zip
          unzip -q /tmp/pass376-v2.zip -d /tmp/pass376-v2
          mapfile -d '' files < <(find /tmp/pass376-v2 -type f -name 'Mock2_FunctionalAnalysis.lean' -print0)
          test "${#files[@]}" -eq 1
          cp "${files[0]}" /tmp/fa376-champion.lean
          actual=$(sha256sum /tmp/fa376-champion.lean | awk '{print $1}')
          test "$actual" = "$EXPECTED_SHA256"
          test "$(wc -l < /tmp/fa376-champion.lean)" -ge "$REQUIRED_FIRST_ERROR"

      - name: Reuse or create immutable checked-in champion
        id: champion
        shell: bash
        run: |
          set -euo pipefail
          if git ls-remote --exit-code --heads origin "$CHAMPION_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$CHAMPION_BRANCH"
            git switch --detach "origin/$CHAMPION_BRANCH"
            actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
            test "$actual" = "$EXPECTED_SHA256"
          else
            git switch --detach "$PASS376_HEAD"
            git switch -c "$CHAMPION_BRANCH"
            cp /tmp/fa376-champion.lean PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            mkdir -p champion-records/fa-pass376-31725
            cat > champion-records/fa-pass376-31725/CHAMPION-v2.json <<'EOF'
          {
            "status": "immutable_checked_in_champion",
            "source_sha256": "07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4",
            "origin_run_id": 31267332510,
            "origin_artifact_id": 9024606745,
            "origin_head_sha": "71227bd1ba88c99f9a535df044fd37041bcf2304",
            "authoritative_frontier": 31725,
            "authority": "direct Lean compile metric"
          }
          EOF
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
              champion-records/fa-pass376-31725/CHAMPION-v2.json
            git commit -m 'chore: check in PASS376 FA champion v2 [skip ci]'
            git push origin "HEAD:refs/heads/${CHAMPION_BRANCH}"
          fi
          echo "champion_sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - name: Directly recompile prerequisites and champion FA
        id: compile
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa416-pass376-reverification
          rm -rf "$d"
          mkdir -p "$d" .lake/build/lib/lean/PrimalitySheafVerification
          actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
          if test "$actual" != "$EXPECTED_SHA256"; then
            echo 'verified=1' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          compile_one() {
            local stem=$1
            local max_errors=$2
            local src="PrimalitySheafVerification/${stem}.lean"
            local olean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            local ilean=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$olean" "$ilean"
            lake env lean -DmaxErrors="$max_errors" -DwarningAsError=false \
              -o "$olean" -i "$ilean" "$src" > "$d/${stem}.log" 2>&1
            local rc=$?
            printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$olean" && test -s "$ilean"; then return 0; fi
            return "$rc"
          }

          compile_one Mock2 500; rc_m2=$?
          compile_one Mock2_Advanced 500; rc_m2a=$?
          rc_fa=125
          if test "$rc_m2" -eq 0 && test "$rc_m2a" -eq 0; then
            compile_one Mock2_FunctionalAnalysis 1400; rc_fa=$?
          else
            printf 'prerequisite failure\n' > "$d/Mock2_FunctionalAnalysis.log"
            printf '%s' "$rc_fa" > "$d/Mock2_FunctionalAnalysis.exit"
          fi
          export RC_M2="$rc_m2" RC_M2A="$rc_m2a" RC_FA="$rc_fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib, json, os, re
          d=Path('build-logs/fa416-pass376-reverification')
          log=(d/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace')
          pat=re.compile(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          ms=list(pat.finditer(log))
          first=int(ms[0].group(1)) if ms else 0
          col=int(ms[0].group(2)) if ms else 0
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          rc_m2=int(os.environ['RC_M2']); rc_m2a=int(os.environ['RC_M2A']); rc_fa=int(os.environ['RC_FA'])
          verified=(
              hashlib.sha256(src.read_bytes()).hexdigest()=='07f6efd3309c3cc23b86adf5811918b752b72c33a3f7a76213ce9beb10796da4'
              and rc_m2==0 and rc_m2a==0 and (rc_fa==0 or first>=31725)
          )
          status={
              'verified':verified,
              'source_sha256':hashlib.sha256(src.read_bytes()).hexdigest(),
              'Mock2_exit':rc_m2,
              'Mock2_Advanced_exit':rc_m2a,
              'FA_exit':rc_fa,
              'FA_first_error_line':first,
              'FA_first_error_col':col,
              'FA_captured_errors':len(ms),
              'required_frontier':31725,
              'repairs_before_reverification':0,
          }
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n',encoding='utf-8')
          (d/'CURRENT.txt').write_text('\n'.join(f'{k}={v}' for k,v in status.items())+'\n',encoding='utf-8')
          (d/('REVERIFIED_31725_OR_BETTER' if verified else 'REVERIFICATION_FAILED')).touch()
          Path('/tmp/fa416-verified').write_text('0' if verified else '1')
          print(json.dumps(status,indent=2))
          PY
          echo "verified=$(cat /tmp/fa416-verified)" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create or refresh isolated verified branch without changing source
        if: steps.compile.outputs.verified == '0'
        shell: bash
        run: |
          set -euo pipefail
          cp -a build-logs/fa416-pass376-reverification /tmp/fa416-evidence
          if git ls-remote --exit-code --heads origin "$VERIFIED_BRANCH" >/dev/null 2>&1; then
            git fetch origin "$VERIFIED_BRANCH"
            git switch -C "$VERIFIED_BRANCH" "origin/$VERIFIED_BRANCH"
            actual=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')
            test "$actual" = "$EXPECTED_SHA256"
          else
            git switch -c "$VERIFIED_BRANCH"
          fi
          rm -rf build-logs/fa416-pass376-reverification
          cp -a /tmp/fa416-evidence build-logs/fa416-pass376-reverification
          git add build-logs/fa416-pass376-reverification
          if ! git diff --cached --quiet; then
            git commit -m 'ci: record idempotent PASS376 champion reverification [skip ci]'
            git push origin "HEAD:refs/heads/${VERIFIED_BRANCH}"
          elif ! git ls-remote --exit-code --heads origin "$VERIFIED_BRANCH" >/dev/null 2>&1; then
            git push origin "HEAD:refs/heads/${VERIFIED_BRANCH}"
          fi

      - name: Upload v2 reverification evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa416-pass376-reverification-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa416-pass376-reverification
            /tmp/fa376-champion.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce exact restored frontier
        if: always()
        env:
          VERIFIED: ${{ steps.compile.outputs.verified }}
        shell: bash
        run: |
          test "${VERIFIED:-1}" = '0'
