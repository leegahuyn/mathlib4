name: FA423 exact SHA 31726 champion materialization

on:
  push:
    branches:
      - fix/fa423-materialize-31726-20260810
    paths:
      - .github/workflows/fa423-materialize-31726.yml
      - build-logs/fa423-materialize/REQUESTED*.txt
  workflow_dispatch:

permissions:
  contents: write
  actions: read

jobs:
  materialize-and-reverify:
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      ACTIVE_BRANCH: fix/fa423-materialize-31726-20260810
      PASS423_RUN: '31317392557'
      EXPECTED_SHA: 71dc36f16ebea92d537aa40a5d420443e4bcb93ccb76fea31efb40a6cb5c3aa0
      GH_TOKEN: ${{ github.token }}
      GITHUB_TOKEN: ${{ github.token }}

    steps:
      - name: Checkout exact controller
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: fix/fa423-materialize-31726-20260810
          fetch-depth: 1800
          persist-credentials: true

      - name: Recover exact source bytes from PASS423 artifacts
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa423-materialize
          rm -rf "$d" /tmp/fa423-materialize
          mkdir -p "$d" /tmp/fa423-materialize
          gh api --paginate "/repos/${GITHUB_REPOSITORY}/actions/runs/${PASS423_RUN}/artifacts?per_page=100" \
            > /tmp/fa423-materialize/artifacts.json
          python3 - <<'PY'
          from pathlib import Path
          import json, os, subprocess, zipfile, hashlib

          repo=os.environ['GITHUB_REPOSITORY']
          run_id=os.environ['PASS423_RUN']
          expected=os.environ['EXPECTED_SHA']
          root=Path('/tmp/fa423-materialize')
          raw=root.joinpath('artifacts.json').read_text()
          try:
              parsed=json.loads(raw)
              pages=[parsed]
          except json.JSONDecodeError:
              dec=json.JSONDecoder(); pages=[]; i=0
              while i < len(raw):
                  while i < len(raw) and raw[i].isspace(): i += 1
                  if i >= len(raw): break
                  obj,i=dec.raw_decode(raw,i); pages.append(obj)
          artifacts=[]
          for page in pages:
              if isinstance(page,dict): artifacts += page.get('artifacts',[])
              elif isinstance(page,list): artifacts += page
          hits=[]; checks=[]
          for artifact in artifacts:
              if artifact.get('expired'): continue
              aid=int(artifact['id']); name=artifact.get('name','')
              z=root/f'{aid}.zip'; u=root/f'{aid}'
              u.mkdir(exist_ok=True)
              with z.open('wb') as fh:
                  p=subprocess.run(['gh','api',f'/repos/{repo}/actions/artifacts/{aid}/zip'],stdout=fh)
              row={'artifact_id':aid,'name':name,'download_exit':p.returncode}
              checks.append(row)
              if p.returncode: continue
              try:
                  with zipfile.ZipFile(z) as ar: ar.extractall(u)
              except zipfile.BadZipFile:
                  row['bad_zip']=True; continue
              local=[]
              for f in u.rglob('*'):
                  if not f.is_file(): continue
                  data=f.read_bytes()
                  if hashlib.sha256(data).hexdigest()==expected:
                      local.append(f); hits.append((f,data,aid,name))
              row['exact_hits']=len(local)
          if not hits:
              raise SystemExit('no artifact member with exact PASS423 SHA')
          # Every hit has the same SHA and therefore identical bytes. Prefer a Lean source path.
          hits.sort(key=lambda x:(not x[0].name.endswith('.lean'), 'source' not in str(x[0]).lower(), len(str(x[0]))))
          f,data,aid,name=hits[0]
          lines=data.count(b'\n')+(0 if data.endswith(b'\n') else 1)
          if lines != 60453: raise SystemExit(f'exact SHA source has unexpected line count {lines}')
          target=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          target.write_bytes(data)
          evidence=Path('build-logs/fa423-materialize')
          evidence.mkdir(parents=True,exist_ok=True)
          (evidence/'RECOVERY.json').write_text(json.dumps({
              'run_id':int(run_id),'expected_sha256':expected,'all_exact_hits':len(hits),
              'selected_artifact_id':aid,'selected_artifact_name':name,
              'selected_member':str(f.relative_to(root/str(aid))),
              'line_count':lines,'artifact_checks':checks,
          },indent=2)+'\n')
          print(json.dumps({'exact_hits':len(hits),'selected':str(f),'sha256':expected,'line_count':lines},indent=2))
          PY
          test "$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | awk '{print $1}')" = "$EXPECTED_SHA"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version | tee build-logs/fa423-materialize/lean-version.txt
          lake --version | tee build-logs/fa423-materialize/lake-version.txt
          lake exe cache get | tee build-logs/fa423-materialize/cache-get.log
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Directly compile completed prerequisites and exact FA source
        id: verify
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          d=build-logs/fa423-materialize
          mkdir -p .lake/build/lib/lean/PrimalitySheafVerification
          compile_one() {
            stem=$1
            src="PrimalitySheafVerification/${stem}.lean"
            o=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.olean"
            i=".lake/build/lib/lean/PrimalitySheafVerification/${stem}.ilean"
            rm -f "$o" "$i"
            lake env lean -DmaxErrors=1 -DwarningAsError=false -o "$o" -i "$i" "$src" \
              > "$d/${stem}.log" 2>&1
            rc=$?; printf '%s' "$rc" > "$d/${stem}.exit"
            if test "$rc" -eq 0 && test -s "$o" && test -s "$i"; then return 0; fi
            return 1
          }
          compile_one Mock2; m2=$?
          compile_one Mock2_Advanced; m2a=$?
          fa=125
          if test "$m2" -eq 0 && test "$m2a" -eq 0; then compile_one Mock2_FunctionalAnalysis; fa=$?; fi
          export M2="$m2" M2A="$m2a" FA="$fa"
          python3 - <<'PY'
          from pathlib import Path
          import hashlib,json,os,re
          d=Path('build-logs/fa423-materialize')
          text=(d/'Mock2_FunctionalAnalysis.log').read_text(encoding='utf-8',errors='replace') if (d/'Mock2_FunctionalAnalysis.log').exists() else ''
          pat=re.compile(r'Mock2_FunctionalAnalysis\.lean:(\d+):(\d+):\s+(?:error(?:\([^)]*\))?:|error:)')
          ms=list(pat.finditer(text)); first=int(ms[0].group(1)) if ms else 0; col=int(ms[0].group(2)) if ms else 0
          src=Path('PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean')
          sha=hashlib.sha256(src.read_bytes()).hexdigest(); lines=src.read_bytes().count(b'\n')+(0 if src.read_bytes().endswith(b'\n') else 1)
          m2=int(os.environ['M2']); m2a=int(os.environ['M2A']); fa=int(os.environ['FA'])
          verified=(sha==os.environ['EXPECTED_SHA'] and lines==60453 and m2==0 and m2a==0 and (fa==0 or first>=31726))
          status={'classification':'VERIFIED' if verified else 'INFRA_FAILURE','authority':'direct Lean CLI',
                  'source_sha256':sha,'line_count':lines,'Mock2_exit':m2,'Mock2_Advanced_exit':m2a,
                  'FA_exit':fa,'FA_first_error_line':first,'FA_first_error_col':col,
                  'error_headers_under_cap':len(ms),'maxErrors_cap':1,
                  'maxErrors_interpretation':'cap only; not total errors or progress','verified':verified}
          (d/'CURRENT.json').write_text(json.dumps(status,indent=2)+'\n')
          (d/'CURRENT.txt').write_text('\n'.join(f'{k}={v}' for k,v in status.items())+'\n')
          (d/('VERIFIED' if verified else 'FAILED')).touch()
          print(json.dumps(status,indent=2))
          with open(os.environ['GITHUB_OUTPUT'],'a') as h:
              h.write(f"verified={str(verified).lower()}\n")
              h.write(f"fa_exit={fa}\nfirst_line={first}\nfirst_col={col}\n")
          PY
          exit 0

      - name: Commit exact verified source and immutable reference
        if: always()
        env:
          VERIFIED: ${{ steps.verify.outputs.verified }}
          FA_EXIT: ${{ steps.verify.outputs.fa_exit }}
          FIRST_LINE: ${{ steps.verify.outputs.first_line }}
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa423-materialize
          if test "${VERIFIED:-false}" = true; then
            git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean "$d"
            git commit -m "fix: materialize FA423 direct-verified first-${FIRST_LINE} source 71dc36f16ebe"
            git push origin "HEAD:${ACTIVE_BRANCH}"
            head=$(git rev-parse HEAD)
            immutable="champion/fa423-first-${FIRST_LINE}-71dc36f16ebe-${GITHUB_RUN_ID}"
            python3 - <<PY > /tmp/fa423-ref.json
          import json
          print(json.dumps({'ref':'refs/heads/${immutable}','sha':'${head}'}))
          PY
            if gh api -X POST "/repos/${GITHUB_REPOSITORY}/git/refs" --input /tmp/fa423-ref.json \
                 > "$d/immutable-response.json" 2> "$d/immutable-error.txt"; then
              printf '%s\n' "$immutable" > "$d/IMMUTABLE_CHAMPION_BRANCH.txt"
            fi
          else
            git restore PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
            git add "$d"
            if ! git diff --cached --quiet; then
              git commit -m 'evidence: preserve FA423 materialization failure [skip ci]'
              git push origin "HEAD:${ACTIVE_BRANCH}"
            fi
          fi

      - name: Upload materialization evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: fa423-materialize-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa423-materialize
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: warn
          retention-days: 90

      - name: Enforce verified frontier materialization
        if: always()
        env:
          VERIFIED: ${{ steps.verify.outputs.verified }}
        shell: bash
        run: test "${VERIFIED:-false}" = true
