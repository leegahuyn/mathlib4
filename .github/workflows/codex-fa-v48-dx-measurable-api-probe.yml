name: Codex FA v48 dx measurable API probe
run-name: "Codex: probe pinned dx/fderiv measurable-space bridges"

on:
  workflow_dispatch:
  push:
    branches:
      - codex/fa-qym-cleanbuild-final-20260811-fast
    paths:
      - .github/workflows/codex-fa-v48-dx-measurable-api-probe.yml

permissions:
  contents: read

jobs:
  probe:
    name: probe-${{ matrix.variant }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        variant:
          - current_simpa
          - direct_change
          - integrable_congr
          - function_rw
          - local_complex_measurable
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl -fsSL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none >/tmp/elan.log 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >>"$GITHUB_PATH"
          elan toolchain install "$(tr -d '\r\n' < lean-toolchain)" >/tmp/toolchain.log 2>&1
          lake exe cache get >/tmp/cache.log 2>&1
          lean --version

      - name: Compile exact bridge probe
        shell: bash
        env:
          VARIANT: ${{ matrix.variant }}
        run: |
          set -euo pipefail
          export PATH="$HOME/.elan/bin:$PATH"
          mkdir -p build-logs/fa-v48-dx-probe/${VARIANT}
          body=''
          case "$VARIANT" in
            current_simpa)
              body=$(cat <<'EOF'
  simpa only [HalfWeightCompactCoordinateGreen.dx_apply] using
    ((hg.mul (HalfWeightCompactCoordinateGreen.dx v).continuous).integrable_of_hasCompactSupport
      (HalfWeightCompactCoordinateGreen.dx v).hasCompactSupport.mul_left)
EOF
              )
              ;;
            direct_change)
              body=$(cat <<'EOF'
  change Integrable
    (fun w : ℂ ↦ g w * HalfWeightCompactCoordinateGreen.dx v w)
    (volume : Measure ℂ)
  exact (hg.mul (HalfWeightCompactCoordinateGreen.dx v).continuous).integrable_of_hasCompactSupport
    (HalfWeightCompactCoordinateGreen.dx v).hasCompactSupport.mul_left
EOF
              )
              ;;
            integrable_congr)
              body=$(cat <<'EOF'
  have h : Integrable
      (fun w : ℂ ↦ g w * HalfWeightCompactCoordinateGreen.dx v w)
      (volume : Measure ℂ) :=
    (hg.mul (HalfWeightCompactCoordinateGreen.dx v).continuous).integrable_of_hasCompactSupport
      (HalfWeightCompactCoordinateGreen.dx v).hasCompactSupport.mul_left
  refine h.congr ?_
  filter_upwards with w
  rw [HalfWeightCompactCoordinateGreen.dx_apply]
EOF
              )
              ;;
            function_rw)
              body=$(cat <<'EOF'
  have hdx : (HalfWeightCompactCoordinateGreen.dx v : ℂ → ℂ) =
      fun w : ℂ ↦ (fderiv ℝ (v : ℂ → ℂ) w) 1 := by
    funext w
    exact HalfWeightCompactCoordinateGreen.dx_apply v w
  rw [← hdx]
  exact (hg.mul (HalfWeightCompactCoordinateGreen.dx v).continuous).integrable_of_hasCompactSupport
    (HalfWeightCompactCoordinateGreen.dx v).hasCompactSupport.mul_left
EOF
              )
              ;;
            local_complex_measurable)
              body=$(cat <<'EOF'
  letI : MeasurableSpace ℂ := Complex.measurableSpace
  have hdx : (HalfWeightCompactCoordinateGreen.dx v : ℂ → ℂ) =
      fun w : ℂ ↦ (fderiv ℝ (v : ℂ → ℂ) w) 1 := by
    funext w
    exact HalfWeightCompactCoordinateGreen.dx_apply v w
  rw [← hdx]
  exact (hg.mul (HalfWeightCompactCoordinateGreen.dx v).continuous).integrable_of_hasCompactSupport
    (HalfWeightCompactCoordinateGreen.dx v).hasCompactSupport.mul_left
EOF
              )
              ;;
            *) exit 97 ;;
          esac

          cat > /tmp/ProbeDxBridge.lean <<EOF
          import PrimalitySheafVerification.Mock2_Advanced

          open Set Function Topology Filter MeasureTheory Metric
          open Mock2FA.PaperCorrections.AutomorphicSobolev
          open Mock2FA.PaperCorrections.AutomorphicSobolev.FixedPhaseClosedOperators
          open Mock2FA.PaperCorrections.AutomorphicSobolev.FixedPhaseClosedOperators.PhysicalLocalL2

          noncomputable section

          example (g : ℂ → ℂ) (hg : Continuous g)
              (v : Mock2FA.PaperCorrections.AutomorphicSobolev.FixedPhaseClosedOperators.PhysicalLocalL2.AmbientTestCore) :
              Integrable
                (fun w : ℂ ↦ g w * (fderiv ℝ (v : ℂ → ℂ) w) 1)
                (volume : Measure ℂ) := by
          ${body}
          EOF
          sed -i 's/^          //' /tmp/ProbeDxBridge.lean
          set +e
          lake env lean -DwarningAsError=false /tmp/ProbeDxBridge.lean \
            >build-logs/fa-v48-dx-probe/${VARIANT}/probe.log 2>&1
          rc=$?
          set -e
          printf '%s\n' "$rc" >build-logs/fa-v48-dx-probe/${VARIANT}/exit.txt
          cp /tmp/ProbeDxBridge.lean build-logs/fa-v48-dx-probe/${VARIANT}/ProbeDxBridge.lean
          cat build-logs/fa-v48-dx-probe/${VARIANT}/probe.log
          exit "$rc"

      - name: Upload probe evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: codex-fa-v48-dx-probe-${{ matrix.variant }}-${{ github.sha }}
          path: build-logs/fa-v48-dx-probe/${{ matrix.variant }}
          retention-days: 14
