name: PASS 413 v3 strict transplant from 31725 champion

on:
  push:
    branches:
      - fix/fa413-strict-transplant-from-31725-20260809
    paths:
      - '.github/workflows/pass413-strict-transplant-from-31725-v3.yml'
      - 'scripts/fa413_strict_transplant_tournament_v3.py'
      - 'build-logs/fa413-strict-transplant/V3_REQUESTED.txt'
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: pass413-strict-transplant-from-31725
  cancel-in-progress: false

jobs:
  strict-tournament-v3:
    runs-on: ubuntu-24.04
    timeout-minutes: 355
    env:
      BRANCH_NAME: fix/fa413-strict-transplant-from-31725-20260809
      FA413_MAX_FRONTIERS: '8'
      FA413_MAX_CANDIDATES: '28'
    steps:
      - name: Checkout exact strict-tournament head
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1800
          persist-credentials: true

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 5 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan-init.sh
          sh /tmp/elan-init.sh -y --default-toolchain none
          export PATH="${HOME}/.elan/bin:${PATH}"
          elan toolchain install "$(cat lean-toolchain)"
          lean --version
          lake --version
          lake exe cache get
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Run corrected strict first-error tournament
        id: tournament
        shell: bash
        run: |
          set +e
          export PATH="${HOME}/.elan/bin:${PATH}"
          before=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          python3 scripts/fa413_strict_transplant_tournament_v3.py \
            > /tmp/fa413-v3-console.log 2>&1
          rc=$?
          after=$(sha256sum PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean | cut -d' ' -f1)
          set -e
          cat /tmp/fa413-v3-console.log
          echo "exit_code=${rc}" >> "$GITHUB_OUTPUT"
          echo "before_sha=${before}" >> "$GITHUB_OUTPUT"
          echo "after_sha=${after}" >> "$GITHUB_OUTPUT"
          test "$before" = "$after" && changed=false || changed=true
          echo "source_changed=${changed}" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Validate strict evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          d=build-logs/fa413-strict-transplant
          test -s "$d/CURRENT.json"
          test -s "$d/CURRENT.txt"
          cp /tmp/fa413-v3-console.log "$d/console-v3.log"
          python3 - <<'PY'
          from pathlib import Path
          import json
          p=Path('build-logs/fa413-strict-transplant/CURRENT.json')
          s=json.loads(p.read_text(encoding='utf-8'))
          m=s['final_fa_metric']
          if not s['complete']:
              line=m.get('first_line')
              if not isinstance(line,int) or line < 31725:
                  raise SystemExit(f'regression below immutable champion: {line}')
          if any(s['forbidden_token_audit'].values()):
              raise SystemExit(f"forbidden token audit failed: {s['forbidden_token_audit']}")
          PY

      - name: Commit checked-in strict champion and concise evidence
        if: always()
        shell: bash
        env:
          SOURCE_CHANGED: ${{ steps.tournament.outputs.source_changed }}
        run: |
          set -euo pipefail
          d=build-logs/fa413-strict-transplant
          git add PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean \
            "$d/CURRENT.json" "$d/CURRENT.txt"
          find "$d" -maxdepth 1 -type f \
            \( -name 'frontier-*-PROMOTED.txt' -o -name 'frontier-*-context.txt' \
               -o -name 'frontier-*-first-error.txt' -o -name 'ALL_REQUIRED_TARGETS_2X_PASS' \) \
            -print0 | xargs -0 -r git add
          if git diff --cached --quiet; then
            exit 0
          fi
          if test -f "$d/ALL_REQUIRED_TARGETS_2X_PASS"; then
            msg='fix: obtain authoritative FA Integrated Mock3 QYM 2x PASS [skip ci]'
          elif test "${SOURCE_CHANGED:-false}" = true; then
            msg='fix: check in strict FA frontier promoted beyond PASS376 [skip ci]'
          else
            msg='ci: record strict FA413 v3 no-improvement evidence [skip ci]'
          fi
          git commit -m "$msg"
          git push origin HEAD:"${BRANCH_NAME}"

      - name: Upload complete corrected diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pass413-v3-strict-transplant-${{ github.run_id }}-${{ github.sha }}
          path: |
            build-logs/fa413-strict-transplant
            PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean
          if-no-files-found: error
          retention-days: 90

      - name: Enforce actual final two-pass result
        if: always()
        env:
          TOURNAMENT_EXIT: ${{ steps.tournament.outputs.exit_code }}
        shell: bash
        run: |
          test -n "${TOURNAMENT_EXIT:-}"
          exit "$TOURNAMENT_EXIT"
