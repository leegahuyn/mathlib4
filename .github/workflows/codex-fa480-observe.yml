name: Codex FA480 Pi.zero_apply strict direct Lean
# FA480 retry 2: target-scoped global-count guard fixed after run 31419378100.

on:
  push:
    branches:
      - fix/fa480-eventually-zero-pi-zero-20260811
    paths:
      - .github/workflows/codex-fa480-observe.yml
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  issues: write

concurrency:
  group: codex-fa480-observe
  cancel-in-progress: true

jobs:
  observe:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      VARIANT: norms
      FA473_WINNER: const_add_simp
      FA474_WINNER: explicit_through2791
      FA475_WINNER: clean_semicolon
      FA476_R2_VARIANT: explicit_exp_nonneg
      FA476_R3_VARIANT: minimal_simpa
      FA476_R3_EVIDENCE_RUN_ID: "31407777360"
      FA476_R3_EVIDENCE_ARTIFACT_ID: "9070636218"
      FA476_R3_EVIDENCE_ARTIFACT_DIGEST: "sha256:343607e51bea29fd2878bf6ebfcc0c1c8b1daf9826733b0cd3729e63fbbea3ca"
      FA477_VARIANT: upper_ext_h_simp_only
      FA477_EVIDENCE_RUN_ID: "31409787172"
      FA477_EVIDENCE_JOB_ID: "93524786715"
      FA477_EVIDENCE_HEAD_SHA: faf902ceda7cce10ada4399326330effaa4d669b
      FA477_EVIDENCE_ARTIFACT_ID: "9071387258"
      FA477_EVIDENCE_ARTIFACT_NAME: codex-fa477-minimal_simpa-run31407777360-artifact9070636218-upper_ext_h_simp_only
      FA477_EVIDENCE_ARTIFACT_SIZE: "598253"
      FA477_EVIDENCE_ARTIFACT_DIGEST: "sha256:25928120f3113f98886a469b255eec59754bfd232b4df621f4efa4e1e9940b81"
      FA478_VARIANT: real_norm_eq_abs_only
      FA478_EVIDENCE_RUN_ID: "31416050563"
      FA478_EVIDENCE_JOB_ID: "93545285888"
      FA478_EVIDENCE_HEAD_SHA: 46241996e61a001d498ad3e126dc8b38867bff86
      FA478_EVIDENCE_SOURCE_SHA256: 53a703d3e138ae7a964b7221c52337082cb59820595cfce877a679f024fbcf82
      FA478_FIRST_ERROR_LINE: "35133"
      FA478_FIRST_ERROR_COL: "8"
      FA478_FRONTIER_DECLARATION: selectedLogHeightNaturalGauge_eventuallyEq_zero
      FA478_FRONTIER_INDEX: "2796"
      FA479_VARIANT: simp_only_hlevel
      FA479_EVIDENCE_RUN_ID: "31418190945"
      FA479_EVIDENCE_JOB_ID: "93552181972"
      FA479_EVIDENCE_HEAD_SHA: 23432f72b76df7a708322ad12afa4ac807fce722
      FA479_EVIDENCE_SOURCE_SHA256: 9e88d79d650d9a9a2f334aceb14f0ef14890f62785f045e03ffb073fd007eb3a
      FA479_FIRST_ERROR_LINE: "35118"
      FA479_FIRST_ERROR_COL: "64"
      FA479_FRONTIER_DECLARATION: selectedLogHeightNaturalGauge_eventuallyEq_zero
      FA479_FRONTIER_INDEX: "2796"
      FA480_VARIANT: pi_zero_apply
      HORIZONTAL_STYLE: calc_four
      MAX_ERRORS: "32"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Publish FA480 start identity
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          body="## FA480 observer started\n\n- run_id: \`${GITHUB_RUN_ID}\`\n- head_sha: \`${GITHUB_SHA}\`\n- sequence: \`FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480\`\n- upstream_FA479_run: \`31418190945\`\n- upstream_FA479_source: \`9e88d79d650d9a9a2f334aceb14f0ef14890f62785f045e03ffb073fd007eb3a\`\n- upstream_FA479_goal: \`0 = 0 r\`\n- patch: \`final simp only + Pi.zero_apply\`\n- infra_retry: \`target declaration old count 1; observed global count exactly 2\`"
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$body"

      - name: Run exact FA480 candidate/direct Lean loop and retain exit
        id: run
        shell: bash
        run: |
          set +e
          bash scripts/fa480_eventually_zero_pi_zero_candidate_ci.sh 2>&1 | tee /tmp/fa480-observe.log
          code=${PIPESTATUS[0]}
          set -e
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Report exact FA480 evidence to issue 14
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          python3 - <<'PY' > /tmp/fa480-comment.md
          from pathlib import Path
          import os

          out = Path("build-logs/codex-fa480-eventually-zero-pi-zero/candidates/norms")
          metric = out / "METRIC.json"
          candidate = out / "CANDIDATE.json"
          log = Path("/tmp/fa480-observe.log")
          source = Path("PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean")

          parts = [
              "## FA480 observer — actual remote execution",
              "",
              f"- run_id: `{os.environ.get('GITHUB_RUN_ID', '')}`",
              f"- head_sha: `{os.environ.get('GITHUB_SHA', '')}`",
              f"- script_exit: `{os.environ.get('SCRIPT_EXIT', '')}`",
              "- sequence: `FA475 -> FA476 -> FA477 -> FA478 -> FA479 -> FA480`",
              "- variant: `pi_zero_apply`",
              "- workflow: `codex-fa480-observe.yml`",
              "",
          ]
          if metric.exists():
              parts += ["### METRIC.json", "```json", metric.read_text(encoding="utf-8")[:30000], "```", ""]
          else:
              parts += ["### METRIC.json", "`MISSING`", ""]
          if candidate.exists():
              parts += ["### CANDIDATE.json", "```json", candidate.read_text(encoding="utf-8")[:15000], "```", ""]
          else:
              parts += ["### CANDIDATE.json", "`MISSING`", ""]
          if source.exists():
              lines = source.read_text(encoding="utf-8", errors="replace").splitlines()
              lo, hi = 35115, 35148
              snippet = "\n".join(f"{i}: {lines[i-1]}" for i in range(lo, min(hi, len(lines)) + 1))
              parts += ["### Exact FA480 candidate source around prior frontier", "```lean", snippet, "```", ""]
          if log.exists():
              lines = log.read_text(encoding="utf-8", errors="replace").splitlines()
              tail = "\n".join(lines[-110:])
              parts += ["### Tail of actual execution log", "```text", tail[-15000:], "```", ""]
          print("\n".join(parts)[:62000])
          PY
          gh api "repos/${GITHUB_REPOSITORY}/issues/14/comments" -f body="$(cat /tmp/fa480-comment.md)"

      - name: Preserve FA480 script result as workflow conclusion
        if: always()
        env:
          SCRIPT_EXIT: ${{ steps.run.outputs.exit_code }}
        shell: bash
        run: |
          test -n "$SCRIPT_EXIT"
          exit "$SCRIPT_EXIT"
