name: GPT QYM GB85 C2 corrected mul-inverse v6

on:
  push:
    branches:
      - gpt/qym-gb85-c2-v6-mulinv-20260819
    paths:
      - .github/workflows/gpt-qym-gb85-c2-mulinv-v6.yml
      - .github/qym_patch_gb85_c2_mulinv_v6.py
  workflow_dispatch:

permissions:
  actions: read
  contents: write

concurrency:
  group: gpt-qym-gb85-c2-mulinv-v6
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    env:
      GH_TOKEN: ${{ github.token }}
      REPO: leegahuyn/mathlib4
      BRANCH: gpt/qym-gb85-c2-v6-mulinv-20260819
      QYM: PrimalitySheafVerification/QYM.lean
      OLEAN: .lake/build/lib/lean/PrimalitySheafVerification
      OUT: /tmp/qym-gb85-c2-mulinv-v6
      BASE: /tmp/qym-gb85-c2-mulinv-v6-base
      ARTIFACT_ID: "9354072137"
      BASE_SHA256: f4c9b27a297be772cde7183526378ad42ae826053f69cf3ce521670da4f06210
      BASE_BLOB: bd28d0436230a8f0bcb01806dac01787542256b8
      BASE_ERRORS: "85"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: true

      - name: Gate exact branch and pinned environment
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF_NAME" = "$BRANCH"
          test "$(tr -d '\r\n' < lean-toolchain)" = leanprover/lean4:v4.33.0-rc1
          test -s .github/qym_patch_gb85_c2_mulinv_v6.py
          test -z "$(git status --porcelain=v1 --untracked-files=all)"
          mkdir -p "$OUT" "$BASE" "$OLEAN"

      - name: Recover immutable verified 85-error source
        shell: bash
        run: |
          set -euo pipefail
          gh api -H 'Accept: application/vnd.github+json' \
            "repos/$REPO/actions/artifacts/$ARTIFACT_ID/zip" \
            > "$OUT/gb85.zip"
          unzip -q -o "$OUT/gb85.zip" -d "$BASE"
          python3 - "$BASE" "$OUT/QYM.GB85.lean" "$BASE_SHA256" "$BASE_BLOB" "$BASE_ERRORS" <<'PY'
          from pathlib import Path
          import hashlib, json, shutil, sys

          root = Path(sys.argv[1])
          output = Path(sys.argv[2])
          expected_sha = sys.argv[3]
          expected_blob = sys.argv[4]
          expected_errors = int(sys.argv[5])

          def blob(raw: bytes) -> str:
              return hashlib.sha1(
                  b"blob " + str(len(raw)).encode() + b"\0" + raw
              ).hexdigest()

          sources = []
          for path in root.rglob("*.lean"):
              raw = path.read_bytes()
              if hashlib.sha256(raw).hexdigest() == expected_sha and blob(raw) == expected_blob:
                  sources.append(path)
          if len(sources) != 1:
              raise SystemExit(f"exact GB85 source count={len(sources)}")

          results = []
          for path in root.rglob("RESULT.json"):
              try:
                  value = json.loads(path.read_text())
              except Exception:
                  continue
              if (
                  value.get("candidate_qym_sha256") == expected_sha
                  and value.get("candidate_qym_blob") == expected_blob
                  and int(value.get("error_headers", -1)) == expected_errors
                  and int(value.get("panic_lines", -1)) == 0
                  and value.get("full_compile_executed", True)
              ):
                  results.append((path, value))
          if len(results) != 1:
              raise SystemExit(f"verified GB85 RESULT count={len(results)}")

          shutil.copy2(sources[0], output)
          (output.parent / "GB85_RESULT.json").write_text(
              json.dumps(results[0][1], indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps({
              "source": str(sources[0]),
              "sha256": expected_sha,
              "blob": expected_blob,
              "errors": expected_errors,
              "result": str(results[0][0]),
          }, indent=2, sort_keys=True))
          PY
          test "$(sha256sum "$OUT/QYM.GB85.lean" | awk '{print $1}')" = "$BASE_SHA256"

      - name: Install pinned Lean and Mathlib cache
        shell: bash
        run: |
          set -euo pipefail
          curl --retry 8 --retry-all-errors --fail --silent --show-error \
            https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh \
            -o /tmp/elan.sh
          sh /tmp/elan.sh -y --default-toolchain none > "$OUT/elan.log" 2>&1
          export PATH="$HOME/.elan/bin:$PATH"
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
          tc="$(tr -d '\r\n' < lean-toolchain)"
          for attempt in 1 2 3 4 5; do
            elan toolchain install "$tc" >> "$OUT/toolchain.log" 2>&1 && break
            sleep $((attempt * 5))
          done
          lean --version | tee "$OUT/lean-version.txt"
          lake --version | tee "$OUT/lake-version.txt"
          for attempt in 1 2 3 4 5; do
            lake exe cache get >> "$OUT/mathlib-cache.log" 2>&1 && break
            sleep $((attempt * 5))
          done

      - name: Restore dependency objects
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        with:
          path: |
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_Advanced.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis.ilean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.olean
            .lake/build/lib/lean/PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.ilean
          key: qym-deps-v3-${{ runner.os }}-${{ hashFiles('lean-toolchain','lake-manifest.json','lakefile.lean','PrimalitySheafVerification/Mock2.lean','PrimalitySheafVerification/Mock2_Advanced.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis.lean','PrimalitySheafVerification/Mock2_FunctionalAnalysis_Integrated.lean') }}
          restore-keys: |
            qym-probe4-deps-v1-${{ runner.os }}-

      - name: Ensure completed dependency objects
        shell: bash
        run: |
          set -euo pipefail
          for source in Mock2 Mock2_Advanced Mock2_FunctionalAnalysis Mock2_FunctionalAnalysis_Integrated; do
            if [[ ! -s "$OLEAN/$source.olean" || ! -s "$OLEAN/$source.ilean" ]]; then
              cap=1
              if [[ "$source" = Mock2_FunctionalAnalysis || "$source" = Mock2_FunctionalAnalysis_Integrated ]]; then
                cap=2000
              fi
              rm -f "$OLEAN/$source.olean" "$OLEAN/$source.ilean"
              lake env lean "-DmaxErrors=$cap" -DwarningAsError=false \
                -o "$OLEAN/$source.olean" \
                -i "$OLEAN/$source.ilean" \
                "PrimalitySheafVerification/$source.lean" \
                > "$OUT/$source.log" 2>&1
            fi
            test -s "$OLEAN/$source.olean"
            test -s "$OLEAN/$source.ilean"
          done

      - name: Run corrected C2 local and full direct Lean tournament
        shell: bash
        run: |
          set -euo pipefail
          variants=(
            ofreal_apply_mulinv_simpa
            ofreal_apply_mulinv_rw
            ofreal_apply_mulinv_change
          )
          cp "$QYM" "$OUT/QYM.checked-in.lean"

          for variant in "${variants[@]}"; do
            dir="$OUT/$variant"
            mkdir -p "$dir"
            cp "$OUT/QYM.GB85.lean" "$QYM"
            python3 -B .github/qym_patch_gb85_c2_mulinv_v6.py \
              "$variant" "$QYM" | tee "$dir/PATCH_RESULT.json"
            cp "$QYM" "$dir/QYM.candidate.lean"
            test "$(jq -r '.input_sha256' "$dir/PATCH_RESULT.json")" = "$BASE_SHA256"
            test "$(jq -r '.input_blob' "$dir/PATCH_RESULT.json")" = "$BASE_BLOB"
            test "$(jq '[.forbidden[]] | add' "$dir/PATCH_RESULT.json")" -eq 0

            set +e
            /usr/bin/time -v -o "$dir/local.time" \
              lake env lean -DmaxErrors=1 -DwarningAsError=false \
                -o "$RUNNER_TEMP/$variant.local.olean" \
                -i "$RUNNER_TEMP/$variant.local.ilean" \
                "$QYM" > "$dir/local.log" 2>&1
            local_rc=$?
            set -e
            echo "$local_rc" > "$dir/local.exit"

            python3 - "$dir" <<'PY'
            from pathlib import Path
            import json, re, sys

            directory = Path(sys.argv[1])
            text = (directory / "local.log").read_text(errors="replace")
            patch = json.loads((directory / "PATCH_RESULT.json").read_text())
            match = re.search(
                r"^.*?\.lean:(\d+):(\d+): error(?:\([^)]*\))?:\s*(.*)$",
                text,
                re.M,
            )
            first = None if match is None else {
                "line": int(match.group(1)),
                "column": int(match.group(2)),
                "message": match.group(3),
            }
            panics = re.findall(
                r"(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$",
                text,
            )
            gate = int(patch["gate_line"])
            fixed = not panics and (first is None or first["line"] >= gate)
            result = {
                "variant": patch["variant"],
                "exit": int((directory / "local.exit").read_text().strip()),
                "gate_line": gate,
                "first_error": first,
                "panic_lines": len(panics),
                "c2_fixed": fixed,
            }
            (directory / "LOCAL_RESULT.json").write_text(
                json.dumps(result, indent=2, sort_keys=True) + "\n"
            )
            print(json.dumps(result, indent=2, sort_keys=True))
            PY

            if [[ "$(jq -r '.c2_fixed' "$dir/LOCAL_RESULT.json")" = true ]]; then
              set +e
              /usr/bin/time -v -o "$dir/full.time" \
                lake env lean -DmaxErrors=10000 -DwarningAsError=false \
                  -o "$RUNNER_TEMP/$variant.QYM.olean" \
                  -i "$RUNNER_TEMP/$variant.QYM.ilean" \
                  "$QYM" > "$dir/full.log" 2>&1
              full_rc=$?
              set -e
              echo "$full_rc" > "$dir/full.exit"
              if [[ "$full_rc" -eq 0 ]]; then
                test -s "$RUNNER_TEMP/$variant.QYM.olean"
                test -s "$RUNNER_TEMP/$variant.QYM.ilean"
                cp "$RUNNER_TEMP/$variant.QYM.olean" "$dir/QYM.olean"
                cp "$RUNNER_TEMP/$variant.QYM.ilean" "$dir/QYM.ilean"
              fi
            fi

            python3 - "$dir" "$BASE_ERRORS" <<'PY'
            from pathlib import Path
            import collections, hashlib, json, os, re, sys

            directory = Path(sys.argv[1])
            baseline_errors = int(sys.argv[2])
            patch = json.loads((directory / "PATCH_RESULT.json").read_text())
            executed = (
                (directory / "full.log").is_file()
                and (directory / "full.exit").is_file()
                and (directory / "full.log").stat().st_size > 0
            )
            raw = (directory / "full.log").read_bytes() if executed else b""
            text = raw.decode(errors="replace")
            pattern = re.compile(
                r"^(?P<file>.*?\.lean):(?P<line>\d+):(?P<column>\d+): "
                r"(?P<severity>error|warning)(?:\((?P<code>[^)]*)\))?:\s*"
                r"(?P<message>.*)$",
                re.M,
            )
            rows = []
            for match in pattern.finditer(text):
                row = match.groupdict()
                row["line"] = int(row["line"])
                row["column"] = int(row["column"])
                rows.append(row)
            errors = [row for row in rows if row["severity"] == "error"]
            warnings = [row for row in rows if row["severity"] == "warning"]
            panics = re.findall(
                r"(?im)^.*(?:internal error|uncaught exception|panic(?:!|:|\s)).*$",
                text,
            )
            rc = int((directory / "full.exit").read_text()) if executed else None
            semantic_pass = executed and rc == 0 and not errors and not panics
            strict = executed and (
                semantic_pass or (not panics and len(errors) < baseline_errors)
            )
            result = {
                "schema": "qym-gb85-c2-mulinv-v6-result",
                "run_id": int(os.environ["GITHUB_RUN_ID"]),
                "trigger_sha": os.environ["GITHUB_SHA"],
                "variant": patch["variant"],
                "baseline_qym_sha256": os.environ["BASE_SHA256"],
                "baseline_qym_blob": os.environ["BASE_BLOB"],
                "baseline_error_headers": baseline_errors,
                "candidate_qym_sha256": patch["candidate_sha256"],
                "candidate_qym_blob": patch["candidate_blob"],
                "forbidden": patch["forbidden"],
                "full_compile_executed": executed,
                "exit": rc,
                "error_headers": len(errors) if executed else None,
                "warning_headers": len(warnings) if executed else None,
                "panic_lines": len(panics) if executed else None,
                "first_error": errors[0] if errors else None,
                "last_error": errors[-1] if errors else None,
                "error_codes": dict(sorted(collections.Counter(
                    row["code"] or "uncoded" for row in errors
                ).items())) if executed else {},
                "log_sha256": hashlib.sha256(raw).hexdigest() if executed else None,
                "semantic_pass": semantic_pass,
                "strict_improvement": strict,
            }
            (directory / "RESULT.json").write_text(
                json.dumps(result, indent=2, sort_keys=True) + "\n"
            )
            (directory / "diagnostics.jsonl").write_text(
                "".join(json.dumps(row, sort_keys=True) + "\n" for row in rows)
            )
            (directory / "error-headers.txt").write_text(
                "".join(
                    f"{row['file']}:{row['line']}:{row['column']}: error"
                    f"{('(' + row['code'] + ')') if row['code'] else ''}: "
                    f"{row['message']}\n"
                    for row in errors
                )
            )
            print(json.dumps(result, indent=2, sort_keys=True))
            PY
          done

          cp "$OUT/QYM.checked-in.lean" "$QYM"
          test -z "$(git status --porcelain=v1 --untracked-files=all)"

      - name: Select strict best and persist evidence
        shell: bash
        run: |
          set -euo pipefail
          python3 - "$OUT" "$BASE_ERRORS" <<'PY'
          from pathlib import Path
          import json, shutil, sys

          out = Path(sys.argv[1])
          baseline_errors = int(sys.argv[2])
          rows = []
          for result_path in out.glob("*/RESULT.json"):
              result = json.loads(result_path.read_text())
              source = result_path.parent / "QYM.candidate.lean"
              local_path = result_path.parent / "LOCAL_RESULT.json"
              if not source.is_file() or not local_path.is_file():
                  continue
              result["local"] = json.loads(local_path.read_text())
              result["source"] = str(source)
              rows.append(result)

          def rank(row):
              first = row.get("first_error") or {}
              return (
                  0 if row.get("semantic_pass") else 1,
                  int(row.get("error_headers") if row.get("error_headers") is not None else 10**9),
                  int(row.get("panic_lines") if row.get("panic_lines") is not None else 10**9),
                  -int(first.get("line") or 0),
                  row.get("variant") or "",
              )

          rows.sort(key=rank)
          valid = [row for row in rows if row.get("strict_improvement")]
          best = valid[0] if valid else None
          selection = {
              "schema": "qym-gb85-c2-mulinv-v6-selection",
              "baseline_error_headers": baseline_errors,
              "best": best,
              "all": rows,
              "promoted": best is not None,
          }
          (out / "SELECTION.json").write_text(
              json.dumps(selection, indent=2, sort_keys=True) + "\n"
          )
          print(json.dumps(selection, indent=2, sort_keys=True))
          if best is None:
              raise SystemExit("no corrected C2 candidate strictly improved GB85")

          source = Path(best["source"])
          shutil.copy2(source, out / "QYM.C2.V6.BEST.lean")
          (out / "C2_V6_RESULT.json").write_text(
              json.dumps(best, indent=2, sort_keys=True) + "\n"
          )
          PY

      - name: Promote verified strict C2 frontier to branch
        shell: bash
        run: |
          set -euo pipefail
          test -s "$OUT/QYM.C2.V6.BEST.lean"
          test -s "$OUT/C2_V6_RESULT.json"
          candidate_sha="$(jq -r '.candidate_qym_sha256' "$OUT/C2_V6_RESULT.json")"
          test "$(sha256sum "$OUT/QYM.C2.V6.BEST.lean" | awk '{print $1}')" = "$candidate_sha"
          test "$(jq -r '.strict_improvement' "$OUT/C2_V6_RESULT.json")" = true
          test "$(jq -r '.panic_lines' "$OUT/C2_V6_RESULT.json")" -eq 0
          errors="$(jq -r '.error_headers' "$OUT/C2_V6_RESULT.json")"
          test "$errors" -lt "$BASE_ERRORS"

          git fetch origin "$BRANCH"
          test "$(git rev-parse "origin/$BRANCH")" = "$GITHUB_SHA"
          git checkout -B "$BRANCH" "$GITHUB_SHA"
          mkdir -p .github/qym-frontier
          cp "$OUT/QYM.C2.V6.BEST.lean" .github/qym-frontier/QYM_C2_V6_BEST.lean
          cp "$OUT/C2_V6_RESULT.json" .github/qym-frontier/C2_V6_RESULT.json
          cp "$OUT/SELECTION.json" .github/qym-frontier/C2_V6_SELECTION.json
          cp "$OUT/QYM.C2.V6.BEST.lean" "$QYM"

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "$QYM" .github/qym-frontier/QYM_C2_V6_BEST.lean \
            .github/qym-frontier/C2_V6_RESULT.json \
            .github/qym-frontier/C2_V6_SELECTION.json
          git commit -m "QYM C2 v6: promote verified ${errors}-error frontier"
          git push origin "HEAD:$BRANCH"

      - name: Upload immutable v6 evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: qym-gb85-c2-mulinv-v6-${{ github.sha }}-attempt${{ github.run_attempt }}
          path: /tmp/qym-gb85-c2-mulinv-v6
          if-no-files-found: error
          retention-days: 30
